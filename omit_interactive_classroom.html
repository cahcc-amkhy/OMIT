<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMIT 互動課堂 - 免登入即時課堂互動平台</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            touch-action: manipulation;
        }
        .canvas-container {
            touch-action: none;
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Custom Toast Notification
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (
                <div class={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-xl shadow-lg flex items-center space-x-2 text-sm font-medium animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        function OMITApp() {
            // Role & Session State
            const [role, setRole] = useState('LANDING'); // 'LANDING', 'TEACHER', 'STUDENT'
            const [roomCode, setRoomCode] = useState('');
            const [studentName, setStudentName] = useState('');
            const [toast, setToast] = useState(null);

            // Shared Question & Room State
            const [activeQuestion, setActiveQuestion] = useState(null);
            const [studentsList, setStudentsList] = useState([]);
            const [responses, setResponses] = useState({}); // { studentId: { answer, timestamp, duration, name } }
            
            // BroadcastChannel instance for real-time inter-tab sync
            const bcRef = useRef(null);
            const myStudentId = useRef('std_' + Math.random().toString(36).substring(2, 9));

            // Helper to show toasts
            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            // Parse URL parameters for direct room joining via QR Code
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const roomParam = params.get('room');
                if (roomParam) {
                    setRoomCode(roomParam.toUpperCase());
                }
            }, []);

            // Setup BroadcastChannel when room code changes
            useEffect(() => {
                if (!roomCode) return;

                const channelName = `omit_room_${roomCode.toUpperCase()}`;
                const bc = new BroadcastChannel(channelName);
                bcRef.current = bc;

                bc.onmessage = (event) => {
                    const { type, data } = event.data;
                    
                    if (type === 'SYNC_STATE_REQUEST' && role === 'TEACHER') {
                        // Teacher replies current state to newly joined student
                        bc.postMessage({
                            type: 'SYNC_STATE_RESPONSE',
                            data: { activeQuestion, responses }
                        });
                    } else if (type === 'SYNC_STATE_RESPONSE' && role === 'STUDENT') {
                        if (data.activeQuestion) {
                            setActiveQuestion(data.activeQuestion);
                        }
                    } else if (type === 'NEW_QUESTION') {
                        setActiveQuestion(data);
                        // Reset student's draft response view if necessary
                    } else if (type === 'CLEAR_QUESTION') {
                        setActiveQuestion(null);
                    } else if (type === 'STUDENT_SUBMIT') {
                        if (role === 'TEACHER') {
                            setResponses(prev => ({
                                ...prev,
                                [data.studentId]: data
                            }));
                        }
                    } else if (type === 'STUDENT_JOIN') {
                        if (role === 'TEACHER') {
                            setStudentsList(prev => {
                                if (!prev.some(s => s.id === data.studentId)) {
                                    return [...prev, data];
                                }
                                return prev;
                            });
                        }
                    }
                };

                // Request initial sync if student
                if (role === 'STUDENT') {
                    bc.postMessage({ type: 'STUDENT_JOIN', data: { studentId: myStudentId.current, name: studentName } });
                    bc.postMessage({ type: 'SYNC_STATE_REQUEST' });
                }

                return () => {
                    bc.close();
                };
            }, [roomCode, role, activeQuestion, responses, studentName]);

            // Create Room (Teacher)
            const handleCreateRoom = () => {
                const generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
                setRoomCode(generatedCode);
                setRole('TEACHER');
                showToast(`已建立互動課堂 房號：${generatedCode}`, 'success');
            };

            // Join Room (Student)
            const handleJoinRoom = (e) => {
                e?.preventDefault();
                if (!roomCode.trim()) {
                    showToast('請輸入6位數字房號', 'error');
                    return;
                }
                if (!studentName.trim()) {
                    showToast('請輸入您的姓名或暱稱', 'error');
                    return;
                }
                setRole('STUDENT');
                showToast(`已進入房號 ${roomCode} 的課堂`, 'success');
            };

            // Render Role Views
            if (role === 'LANDING') {
                return (
                    <div class="min-h-screen bg-gradient-to-br from-indigo-900 via-indigo-800 to-purple-900 flex items-center justify-center p-4">
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                        
                        <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 space-y-8 relative overflow-hidden">
                            <div class="text-center space-y-2">
                                <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl mb-2 font-black text-2xl shadow-inner">
                                    OMIT
                                </div>
                                <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">OMIT 互動課堂</h1>
                                <p class="text-slate-500 text-sm">免登入！隨查隨答、高效即時的反饋互動平台</p>
                            </div>

                            <div class="space-y-6">
                                {/* Student Join Section */}
                                <form onSubmit={handleJoinRoom} class="bg-indigo-50/70 p-5 rounded-2xl border border-indigo-100 space-y-4">
                                    <h2 class="text-xs font-bold text-indigo-600 uppercase tracking-wider">我是學生 (加入課堂)</h2>
                                    <div>
                                        <input 
                                            type="text" 
                                            placeholder="請輸入房號 (例如 123456)" 
                                            value={roomCode} 
                                            onChange={(e) => setRoomCode(e.target.value)}
                                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-mono text-center tracking-widest text-lg font-bold"
                                            maxLength={6}
                                        />
                                    </div>
                                    <div>
                                        <input 
                                            type="text" 
                                            placeholder="請輸入你的姓名 / 暱稱" 
                                            value={studentName} 
                                            onChange={(e) => setStudentName(e.target.value)}
                                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-medium"
                                        />
                                    </div>
                                    <button 
                                        type="submit" 
                                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-200 active:scale-98"
                                    >
                                        進入課堂 🚀
                                    </button>
                                </form>

                                <div class="relative flex py-1 items-center">
                                    <div class="flex-grow border-t border-slate-200"></div>
                                    <span class="flex-shrink mx-4 text-slate-400 text-xs font-medium">或</span>
                                    <div class="flex-grow border-t border-slate-200"></div>
                                </div>

                                {/* Teacher Create Section */}
                                <div class="text-center">
                                    <button 
                                        onClick={handleCreateRoom}
                                        class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl transition shadow-md flex items-center justify-center space-x-2 active:scale-98"
                                    >
                                        <span>👨‍🏫 開啟新課堂 (教師控制台)</span>
                                    </button>
                                    <p class="text-xs text-slate-400 mt-2">不需註冊或登入，建立即可發放房號與 QR Code</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (role === 'TEACHER') {
                return (
                    <TeacherDashboard 
                        roomCode={roomCode} 
                        activeQuestion={activeQuestion} 
                        setActiveQuestion={setActiveQuestion}
                        responses={responses}
                        setResponses={setResponses}
                        studentsList={studentsList}
                        setStudentsList={setStudentsList}
                        bcRef={bcRef}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            if (role === 'STUDENT') {
                return (
                    <StudentInterface 
                        roomCode={roomCode}
                        studentName={studentName}
                        studentId={myStudentId.current}
                        activeQuestion={activeQuestion}
                        bcRef={bcRef}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            return null;
        }

        function TeacherDashboard({ roomCode, activeQuestion, setActiveQuestion, responses, setResponses, studentsList, setStudentsList, bcRef, showToast, onExit }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE'); // 'CHOICE', 'TF', 'SHORT', 'DRAW'
            const [questionText, setQuestionText] = useState('');
            const [lockAfterSubmit, setLockAfterSubmit] = useState(false);
            const [showQRModal, setShowQRModal] = useState(false);
            const [choiceCount, setChoiceCount] = useState(4); // 4 or 5 choices

            // QR Code API URL
            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

            // Publish Question
            const handlePublishQuestion = () => {
                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: questionText.trim() || getDefaultQuestionPrompt(selectedMode),
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : []
                };

                setActiveQuestion(newQ);
                setResponses({}); // Reset answers for new question

                // Broadcast
                if (bcRef.current) {
                    bcRef.current.postMessage({
                        type: 'NEW_QUESTION',
                        data: newQ
                    });
                }

                showToast('已發佈題目給所有學生！', 'success');
            };

            // Clear / End Question
            const handleClearQuestion = () => {
                setActiveQuestion(null);
                if (bcRef.current) {
                    bcRef.current.postMessage({ type: 'CLEAR_QUESTION' });
                }
                showToast('已結束當前題目', 'info');
            };

            // Simulate student responses for testing/demo
            const handleSimulateResponses = () => {
                if (!activeQuestion) return;
                
                const dummyNames = ['陳小明', '張華', '李美麗', '王大同', '趙強', '林心怡', '黃子軒', '周雅婷'];
                const newResponses = { ...responses };

                dummyNames.forEach((name, idx) => {
                    const studentId = `sim_std_${idx}`;
                    const duration = (Math.random() * 8 + 1.5).toFixed(1); // 1.5s - 9.5s
                    let answer = '';

                    if (activeQuestion.mode === 'CHOICE') {
                        const opts = activeQuestion.choiceOptions;
                        answer = opts[Math.floor(Math.random() * opts.length)];
                    } else if (activeQuestion.mode === 'TF') {
                        answer = Math.random() > 0.5 ? 'O' : 'X';
                    } else if (activeQuestion.mode === 'SHORT') {
                        const sampleTexts = [
                            '我覺得光合作用需要陽光與二氧化碳',
                            '利用心智圖把概念分類最清楚',
                            '公式是 a² + b² = c²',
                            '這是一道非常有意思的題目！',
                            '需要再多加練習'
                        ];
                        answer = sampleTexts[Math.floor(Math.random() * sampleTexts.length)];
                    } else if (activeQuestion.mode === 'DRAW') {
                        // Dummy Canvas Drawing placeholder SVG
                        answer = 'SIMULATED_CANVAS_DRAWING';
                    }

                    newResponses[studentId] = {
                        studentId,
                        studentName: name,
                        answer,
                        timestamp: Date.now(),
                        duration: parseFloat(duration)
                    };
                });

                setResponses(newResponses);
                showToast('已生成 8 位模擬學生的回答數據', 'info');
            };

            // Calculate Speed Rankings
            const sortedResponses = useMemo(() => {
                return Object.values(responses).sort((a, b) => a.duration - b.duration);
            }, [responses]);

            function getDefaultQuestionPrompt(mode) {
                switch(mode) {
                    case 'CHOICE': return '請選擇正確答案：';
                    case 'TF': return '請判斷以下敘述是否正確 (⭕ / ❌)：';
                    case 'SHORT': return '請寫下你的想法或答案：';
                    case 'DRAW': return '請在畫布上繪製答案或繪圖表達：';
                    default: return '請回答題目：';
                }
            }

            return (
                <div class="min-h-screen bg-slate-100 pb-12">
                    {/* Top Navigation */}
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center font-black text-lg shadow-sm">
                                    OMIT
                                </div>
                                <div>
                                    <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                                        OMIT 互動課堂 <span class="text-xs px-2 py-0.5 bg-indigo-100 text-indigo-700 rounded-full font-medium">教師主控台</span>
                                    </h1>
                                    <p class="text-xs text-slate-500">房號：<span class="font-mono font-bold text-indigo-600 text-sm tracking-wider">{roomCode}</span></p>
                                </div>
                            </div>

                            <div class="flex items-center space-x-3">
                                {/* QR Code Button */}
                                <button 
                                    onClick={() => setShowQRModal(true)}
                                    class="px-3.5 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1.5 transition"
                                >
                                    <span>📱 課堂 QR Code</span>
                                </button>

                                {/* Exit Class Button */}
                                <button 
                                    onClick={onExit}
                                    class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs sm:text-sm font-medium transition"
                                >
                                    離開課堂
                                </button>
                            </div>
                        </div>
                    </header>

                    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
                        {/* Left Control Panel: Question Setup */}
                        <div class="lg:col-span-5 space-y-6">
                            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-5">
                                <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                                    <span>⚡ 發佈隨堂互動題目</span>
                                </h2>

                                {/* Mode Selectors */}
                                <div class="grid grid-cols-2 gap-2.5">
                                    {[
                                        { id: 'CHOICE', label: '選擇題', icon: '🔘', desc: 'A/B/C/D 複數選項' },
                                        { id: 'TF', label: '是非題', icon: '⭕', desc: 'O / X 快速快問' },
                                        { id: 'SHORT', label: '短答題', icon: '✍️', desc: '文字看法與討論' },
                                        { id: 'DRAW', label: '白板題', icon: '🎨', desc: '幾何畫圖/心智圖' },
                                    ].map(item => (
                                        <button
                                            key={item.id}
                                            onClick={() => setSelectedMode(item.id)}
                                            class={`p-3 rounded-xl border text-left transition flex flex-col justify-between ${
                                                selectedMode === item.id 
                                                    ? 'border-indigo-600 bg-indigo-50/60 ring-2 ring-indigo-500/20' 
                                                    : 'border-slate-200 hover:border-slate-300 bg-white'
                                            }`}
                                        >
                                            <div class="flex items-center space-x-2 mb-1">
                                                <span class="text-lg">{item.icon}</span>
                                                <span class="font-bold text-sm text-slate-800">{item.label}</span>
                                            </div>
                                            <span class="text-xs text-slate-500">{item.desc}</span>
                                        </button>
                                    ))}
                                </div>

                                {/* Mode Extra Options */}
                                {selectedMode === 'CHOICE' && (
                                    <div class="flex items-center justify-between text-xs font-medium text-slate-600 bg-slate-50 p-3 rounded-xl">
                                        <span>選項個數：</span>
                                        <div class="flex space-x-2">
                                            <button 
                                                onClick={() => setChoiceCount(4)}
                                                class={`px-3 py-1 rounded-lg ${choiceCount === 4 ? 'bg-indigo-600 text-white font-bold' : 'bg-white border text-slate-700'}`}
                                            >
                                                4個 (A-D)
                                            </button>
                                            <button 
                                                onClick={() => setChoiceCount(5)}
                                                class={`px-3 py-1 rounded-lg ${choiceCount === 5 ? 'bg-indigo-600 text-white font-bold' : 'bg-white border text-slate-700'}`}
                                            >
                                                5個 (A-E)
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {/* Question Title / Prompt Input */}
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1">題目說明 / 提示內容 (可留空)</label>
                                    <textarea 
                                        rows={2}
                                        placeholder="例如：請算出這題三角形的角度，或直接出題..."
                                        value={questionText}
                                        onChange={(e) => setQuestionText(e.target.value)}
                                        class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                    />
                                </div>

                                {/* Advanced Setting 1: Lock Modification */}
                                <div class="bg-amber-50/80 border border-amber-200 p-3.5 rounded-xl flex items-center justify-between">
                                    <div class="space-y-0.5">
                                        <div class="text-xs font-bold text-amber-900">🔒 限制提交後不能修改</div>
                                        <div class="text-[11px] text-amber-700">勾選後，學生一經提交即鎖定答案</div>
                                    </div>
                                    <input 
                                        type="checkbox" 
                                        checked={lockAfterSubmit}
                                        onChange={(e) => setLockAfterSubmit(e.target.checked)}
                                        class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer"
                                    />
                                </div>

                                {/* Publish / Clear Buttons */}
                                <div class="space-y-2 pt-2">
                                    {!activeQuestion ? (
                                        <button 
                                            onClick={handlePublishQuestion}
                                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-indigo-200 flex items-center justify-center space-x-2"
                                        >
                                            <span>🚀 立即發佈題目</span>
                                        </button>
                                    ) : (
                                        <div class="flex space-x-2">
                                            <button 
                                                onClick={handlePublishQuestion}
                                                class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition text-sm"
                                            >
                                                🔄 重新發佈題目
                                            </button>
                                            <button 
                                                onClick={handleClearQuestion}
                                                class="px-4 bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 rounded-xl transition text-sm"
                                            >
                                                ⏹️ 結束測驗
                                            </button>
                                        </div>
                                    )}

                                    {/* Demo Test Helper */}
                                    {activeQuestion && (
                                        <button 
                                            onClick={handleSimulateResponses}
                                            class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 rounded-xl text-xs transition border border-slate-200"
                                        >
                                            🤖 模擬全班班級學生自動作答 (Demo 測試)
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Right Display Area: Real-time Statistics & Leaderboard */}
                        <div class="lg:col-span-7 space-y-6">
                            {!activeQuestion ? (
                                <div class="bg-white rounded-2xl p-12 border border-slate-200 text-center space-y-4 shadow-sm">
                                    <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-2xl flex items-center justify-center mx-auto text-2xl">
                                        📢
                                    </div>
                                    <div class="space-y-1">
                                        <h3 class="text-lg font-bold text-slate-800">尚未發佈任何課堂題目</h3>
                                        <p class="text-xs text-slate-500 max-w-sm mx-auto">
                                            請在左側選擇「選擇題」、「短答題」、「是非題」或「白板題」模式並點擊發佈，全班畫面將同步進行互動。
                                        </p>
                                    </div>
                                </div>
                            ) : (
                                <div class="space-y-6">
                                    {/* Real-time Statistics Card */}
                                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-5">
                                        <div class="flex items-center justify-between border-b pb-4 border-slate-100">
                                            <div>
                                                <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">
                                                    {activeQuestion.mode === 'CHOICE' ? '選擇題' : activeQuestion.mode === 'TF' ? '是非題' : activeQuestion.mode === 'SHORT' ? '短答題' : '白板繪圖'}
                                                </span>
                                                <h3 class="text-lg font-bold text-slate-800 mt-2">{activeQuestion.text}</h3>
                                            </div>
                                            <div class="text-right">
                                                <div class="text-2xl font-black text-indigo-600">{Object.keys(responses).length}</div>
                                                <div class="text-xs text-slate-400">已提交人數</div>
                                            </div>
                                        </div>

                                        {/* Visualization by Mode */}
                                        {activeQuestion.mode === 'CHOICE' && (
                                            <ChoiceStatistics activeQuestion={activeQuestion} responses={responses} />
                                        )}

                                        {activeQuestion.mode === 'TF' && (
                                            <TFStatistics responses={responses} />
                                        )}

                                        {activeQuestion.mode === 'SHORT' && (
                                            <ShortAnswerGrid responses={responses} />
                                        )}

                                        {activeQuestion.mode === 'DRAW' && (
                                            <WhiteboardGallery responses={responses} />
                                        )}
                                    </div>

                                    {/* Speed & Submission Leaderboard */}
                                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                                        <div class="flex items-center justify-between">
                                            <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                                                <span>⚡ 學生提交速度排行榜與紀錄</span>
                                            </h3>
                                            <span class="text-xs text-slate-400">系統自動紀錄答題耗時 (秒)</span>
                                        </div>

                                        {sortedResponses.length === 0 ? (
                                            <div class="text-center py-6 text-xs text-slate-400">等待學生提交答案中...</div>
                                        ) : (
                                            <div class="overflow-x-auto">
                                                <table class="w-full text-left text-xs">
                                                    <thead>
                                                        <tr class="bg-slate-50 text-slate-500 border-b border-slate-100">
                                                            <th class="p-2.5 rounded-l-lg">排名</th>
                                                            <th class="p-2.5">學生姓名</th>
                                                            <th class="p-2.5">回答內容</th>
                                                            <th class="p-2.5 rounded-r-lg text-right">作答耗時</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody class="divide-y divide-slate-100">
                                                        {sortedResponses.map((item, idx) => (
                                                            <tr key={item.studentId} class="hover:bg-slate-50/80 transition">
                                                                <td class="p-2.5 font-bold">
                                                                    {idx === 0 ? <span class="text-amber-500 font-extrabold">🥇 1</span> :
                                                                     idx === 1 ? <span class="text-slate-400 font-extrabold">🥈 2</span> :
                                                                     idx === 2 ? <span class="text-amber-700 font-extrabold">🥉 3</span> :
                                                                     <span class="text-slate-600">{idx + 1}</span>}
                                                                </td>
                                                                <td class="p-2.5 font-medium text-slate-800">{item.studentName}</td>
                                                                <td class="p-2.5 font-mono text-indigo-700 max-w-xs truncate">
                                                                    {activeQuestion.mode === 'DRAW' ? '🎨 已發送繪圖' : item.answer}
                                                                </td>
                                                                <td class="p-2.5 text-right font-mono font-bold text-slate-600">
                                                                    ⏱️ {item.duration}s
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* QR Code Modal for Mobile Scan */}
                    {showQRModal && (
                        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl animate-scale-up">
                                <h3 class="text-lg font-bold text-slate-800">掃瞄 QR Code 加入課堂</h3>
                                <p class="text-xs text-slate-500">學生可以拿起智慧型手機或平板，相機掃碼即可自動帶入房號。</p>
                                
                                <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 inline-block">
                                    <img src={qrImageUrl} alt="Classroom QR Code" class="w-48 h-48 mx-auto rounded-lg shadow-sm" />
                                </div>

                                <div class="bg-indigo-50 p-3 rounded-xl text-xs font-mono font-bold text-indigo-700">
                                    房號：{roomCode}
                                </div>

                                <button 
                                    onClick={() => setShowQRModal(false)}
                                    class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl text-xs transition"
                                >
                                    關閉視窗
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Choice Statistics Render Chart
        function ChoiceStatistics({ activeQuestion, responses }) {
            const options = activeQuestion.choiceOptions || ['A', 'B', 'C', 'D'];
            const total = Object.keys(responses).length;

            const counts = options.reduce((acc, opt) => {
                acc[opt] = Object.values(responses).filter(r => r.answer === opt).length;
                return acc;
            }, {});

            return (
                <div class="space-y-3 py-2">
                    {options.map(opt => {
                        const count = counts[opt] || 0;
                        const pct = total > 0 ? Math.round((count / total) * 100) : 0;
                        return (
                            <div key={opt} class="space-y-1">
                                <div class="flex justify-between text-xs font-bold text-slate-700">
                                    <span>選項 {opt}</span>
                                    <span>{count} 人 ({pct}%)</span>
                                </div>
                                <div class="w-full h-8 bg-slate-100 rounded-xl overflow-hidden p-1 flex items-center">
                                    <div 
                                        class="h-full bg-indigo-600 rounded-lg transition-all duration-500 flex items-center justify-end px-2 text-[10px] text-white font-bold"
                                        style={{ width: `${Math.max(pct, 0)}%` }}
                                    >
                                        {pct > 5 && `${pct}%`}
                                    </div>
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        }

        // True / False Statistics Render Chart
        function TFStatistics({ responses }) {
            const total = Object.keys(responses).length;
            const oCount = Object.values(responses).filter(r => r.answer === 'O').length;
            const xCount = Object.values(responses).filter(r => r.answer === 'X').length;

            const oPct = total > 0 ? Math.round((oCount / total) * 100) : 0;
            const xPct = total > 0 ? Math.round((xCount / total) * 100) : 0;

            return (
                <div class="grid grid-cols-2 gap-4 py-4">
                    <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-5 text-center space-y-2">
                        <div class="text-3xl">⭕</div>
                        <div class="text-xs font-bold text-emerald-800 uppercase">正確 / 是 (O)</div>
                        <div class="text-2xl font-black text-emerald-600">{oCount} 人</div>
                        <div class="text-xs font-medium text-emerald-700">{oPct}%</div>
                    </div>

                    <div class="bg-rose-50 border border-rose-200 rounded-2xl p-5 text-center space-y-2">
                        <div class="text-3xl">❌</div>
                        <div class="text-xs font-bold text-rose-800 uppercase">錯誤 / 否 (X)</div>
                        <div class="text-2xl font-black text-rose-600">{xCount} 人</div>
                        <div class="text-xs font-medium text-rose-700">{xPct}%</div>
                    </div>
                </div>
            );
        }

        // Short Answer Grid Display
        function ShortAnswerGrid({ responses }) {
            const list = Object.values(responses);

            if (list.length === 0) {
                return <div class="text-center py-8 text-xs text-slate-400">尚未收到學生發送的文字回應</div>;
            }

            return (
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-80 overflow-y-auto p-1">
                    {list.map(r => (
                        <div key={r.studentId} class="p-3.5 bg-slate-50 border border-slate-200 rounded-xl space-y-1.5">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-xs text-indigo-700">{r.studentName}</span>
                                <span class="text-[10px] text-slate-400">⏱️ {r.duration}s</span>
                            </div>
                            <p class="text-xs text-slate-800 font-medium whitespace-pre-wrap">{r.answer}</p>
                        </div>
                    ))}
                </div>
            );
        }

        // Whiteboard Gallery Display
        function WhiteboardGallery({ responses }) {
            const [selectedImage, setSelectedImage] = useState(null);
            const list = Object.values(responses);

            if (list.length === 0) {
                return <div class="text-center py-8 text-xs text-slate-400">等待學生繪圖提交中...</div>;
            }

            return (
                <div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 max-h-96 overflow-y-auto p-1">
                        {list.map(r => (
                            <div 
                                key={r.studentId} 
                                onClick={() => setSelectedImage(r)}
                                class="bg-white border border-slate-200 rounded-xl p-2 cursor-pointer hover:shadow-md transition space-y-2"
                            >
                                <div class="aspect-video bg-slate-100 rounded-lg overflow-hidden flex items-center justify-center border border-slate-100">
                                    {r.answer === 'SIMULATED_CANVAS_DRAWING' ? (
                                        <div class="text-xs text-slate-400 font-medium">🎨 模擬畫布圖片</div>
                                    ) : (
                                        <img src={r.answer} alt="Student drawing" class="w-full h-full object-contain bg-white" />
                                    )}
                                </div>
                                <div class="flex justify-between items-center px-1">
                                    <span class="text-xs font-bold text-slate-700 truncate">{r.studentName}</span>
                                    <span class="text-[10px] text-slate-400 font-mono">⏱️ {r.duration}s</span>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Image Full Modal */}
                    {selectedImage && (
                        <div class="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
                            <div class="bg-white rounded-2xl p-5 max-w-lg w-full space-y-4 shadow-2xl">
                                <div class="flex justify-between items-center border-b pb-2">
                                    <h4 class="font-bold text-sm text-slate-800">{selectedImage.studentName} 的繪圖答案</h4>
                                    <button onClick={() => setSelectedImage(null)} class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                                </div>
                                <div class="bg-white p-2 rounded-xl border border-slate-200 flex items-center justify-center min-h-[240px]">
                                    {selectedImage.answer === 'SIMULATED_CANVAS_DRAWING' ? (
                                        <div class="text-sm text-slate-400">🎨 模擬繪圖測試數據</div>
                                    ) : (
                                        <img src={selectedImage.answer} alt="Zoomed student drawing" class="max-h-80 object-contain" />
                                    )}
                                </div>
                                <button 
                                    onClick={() => setSelectedImage(null)}
                                    class="w-full py-2 bg-slate-800 text-white text-xs font-bold rounded-xl"
                                >
                                    關閉
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StudentInterface({ roomCode, studentName, studentId, activeQuestion, bcRef, showToast, onExit }) {
            const [myAnswer, setMyAnswer] = useState(null);
            const [submitted, setSubmitted] = useState(false);
            const [submitDuration, setSubmitDuration] = useState(null);
            const [shortAnswerText, setShortAnswerText] = useState('');

            // Canvas drawing refs and tools
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [penColor, setPenColor] = useState('#1e293b'); // default dark slate
            const [lineWidth, setLineWidth] = useState(3);

            // Question timer
            useEffect(() => {
                // Reset student submit state whenever a NEW question is published
                setSubmitted(false);
                setMyAnswer(null);
                setSubmitDuration(null);
                setShortAnswerText('');
            }, [activeQuestion?.id]);

            // Handle Answer Submission
            const handleSubmit = (answerValue) => {
                if (!activeQuestion) return;

                if (submitted && activeQuestion.lockAfterSubmit) {
                    showToast('老師已設定：本次回答提交後不可修改！', 'error');
                    return;
                }

                const elapsedSeconds = ((Date.now() - activeQuestion.startTime) / 1000).toFixed(1);
                
                const submitData = {
                    studentId,
                    studentName,
                    answer: answerValue,
                    timestamp: Date.now(),
                    duration: parseFloat(elapsedSeconds)
                };

                // Broadcast response to teacher
                if (bcRef.current) {
                    bcRef.current.postMessage({
                        type: 'STUDENT_SUBMIT',
                        data: submitData
                    });
                }

                setMyAnswer(answerValue);
                setSubmitted(true);
                setSubmitDuration(elapsedSeconds);
                showToast('已成功傳送答案給老師！', 'success');
            };

            // Canvas Drawing Handlers
            const startDrawing = (e) => {
                if (submitted && activeQuestion?.lockAfterSubmit) return;
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                ctx.beginPath();
                ctx.moveTo(clientX - rect.left, clientY - rect.top);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                ctx.strokeStyle = penColor;
                ctx.lineWidth = lineWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineTo(clientX - rect.left, clientY - rect.top);
                ctx.stroke();
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            const handleDrawingSubmit = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const dataUrl = canvas.toDataURL('image/png');
                handleSubmit(dataUrl);
            };

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col">
                    {/* Header */}
                    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-30">
                        <div class="max-w-md mx-auto flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <span class="font-black text-lg bg-white/20 px-2 py-0.5 rounded-lg text-sm">OMIT</span>
                                <span class="text-xs font-bold opacity-90">房號：{roomCode}</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full font-medium">👤 {studentName}</span>
                                <button onClick={onExit} class="text-xs text-indigo-200 hover:text-white underline ml-2">離開</button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col justify-center">
                        {!activeQuestion ? (
                            /* Waiting Screen */
                            <div class="bg-white rounded-3xl p-8 text-center space-y-5 shadow-sm border border-slate-200 my-auto">
                                <div class="relative w-20 h-20 mx-auto flex items-center justify-center">
                                    <div class="absolute inset-0 bg-indigo-100 rounded-full animate-ping opacity-75"></div>
                                    <div class="relative w-16 h-16 bg-indigo-600 text-white rounded-full flex items-center justify-center text-2xl shadow-lg">
                                        ⏳
                                    </div>
                                </div>
                                <div class="space-y-1">
                                    <h2 class="text-lg font-bold text-slate-800">等待老師發佈互動題目...</h2>
                                    <p class="text-xs text-slate-500">請保持螢幕開啟，題目發佈時將自動呈現於畫面上。</p>
                                </div>
                            </div>
                        ) : (
                            /* Active Question Screen */
                            <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-200 space-y-6">
                                <div class="space-y-2 border-b pb-4 border-slate-100">
                                    <div class="flex justify-between items-center">
                                        <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">
                                            {activeQuestion.mode === 'CHOICE' ? '選擇題' : activeQuestion.mode === 'TF' ? '是非題' : activeQuestion.mode === 'SHORT' ? '短答題' : '白板繪圖'}
                                        </span>
                                        {activeQuestion.lockAfterSubmit && (
                                            <span class="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold">
                                                🔒 鎖定模式 (提交後不可修改)
                                            </span>
                                        )}
                                    </div>
                                    <h2 class="text-base font-bold text-slate-800">{activeQuestion.text}</h2>
                                </div>

                                {/* Answer Input Widgets according to Mode */}

                                {/* CHOICE MODE */}
                                {activeQuestion.mode === 'CHOICE' && (
                                    <div class="grid grid-cols-2 gap-3">
                                        {(activeQuestion.choiceOptions || ['A', 'B', 'C', 'D']).map(opt => (
                                            <button
                                                key={opt}
                                                onClick={() => handleSubmit(opt)}
                                                disabled={submitted && activeQuestion.lockAfterSubmit}
                                                class={`py-6 rounded-2xl font-black text-2xl transition shadow-sm flex items-center justify-center space-x-2 ${
                                                    myAnswer === opt 
                                                        ? 'bg-indigo-600 text-white ring-4 ring-indigo-200 scale-102' 
                                                        : 'bg-slate-50 hover:bg-slate-100 text-slate-800 border border-slate-200 active:scale-95'
                                                } ${submitted && activeQuestion.lockAfterSubmit ? 'opacity-80 cursor-not-allowed' : ''}`}
                                            >
                                                <span>{opt}</span>
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {/* TRUE / FALSE MODE */}
                                {activeQuestion.mode === 'TF' && (
                                    <div class="grid grid-cols-2 gap-4">
                                        <button
                                            onClick={() => handleSubmit('O')}
                                            disabled={submitted && activeQuestion.lockAfterSubmit}
                                            class={`py-8 rounded-2xl font-black text-3xl transition border shadow-sm flex flex-col items-center justify-center space-y-1 ${
                                                myAnswer === 'O'
                                                    ? 'bg-emerald-600 text-white border-emerald-600 ring-4 ring-emerald-100'
                                                    : 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100 active:scale-95'
                                            }`}
                                        >
                                            <span>⭕</span>
                                            <span class="text-xs font-bold uppercase">正確 (O)</span>
                                        </button>

                                        <button
                                            onClick={() => handleSubmit('X')}
                                            disabled={submitted && activeQuestion.lockAfterSubmit}
                                            class={`py-8 rounded-2xl font-black text-3xl transition border shadow-sm flex flex-col items-center justify-center space-y-1 ${
                                                myAnswer === 'X'
                                                    ? 'bg-rose-600 text-white border-rose-600 ring-4 ring-rose-100'
                                                    : 'bg-rose-50 text-rose-700 border-rose-200 hover:bg-rose-100 active:scale-95'
                                            }`}
                                        >
                                            <span>❌</span>
                                            <span class="text-xs font-bold uppercase">錯誤 (X)</span>
                                        </button>
                                    </div>
                                )}

                                {/* SHORT ANSWER MODE */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-4">
                                        <textarea
                                            rows={4}
                                            placeholder="請輸入你的答案或看法..."
                                            value={shortAnswerText}
                                            onChange={(e) => setShortAnswerText(e.target.value)}
                                            disabled={submitted && activeQuestion.lockAfterSubmit}
                                            class="w-full p-3.5 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                                        />
                                        <button
                                            onClick={() => handleSubmit(shortAnswerText.trim())}
                                            disabled={!shortAnswerText.trim() || (submitted && activeQuestion.lockAfterSubmit)}
                                            class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-bold py-3.5 rounded-xl transition shadow-md"
                                        >
                                            {submitted ? '更新答案 🚀' : '傳送答案 🚀'}
                                        </button>
                                    </div>
                                )}

                                {/* WHITEBOARD DRAWING MODE */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <div class="space-y-3">
                                        {/* Canvas Toolbar */}
                                        <div class="flex items-center justify-between bg-slate-50 p-2 rounded-xl border border-slate-200">
                                            <div class="flex space-x-1.5">
                                                {['#1e293b', '#dc2626', '#2563eb', '#16a34a', '#eab308'].map(color => (
                                                    <button
                                                        key={color}
                                                        onClick={() => setPenColor(color)}
                                                        class={`w-7 h-7 rounded-full border-2 transition ${
                                                            penColor === color ? 'scale-110 border-slate-800 ring-2 ring-indigo-400' : 'border-white'
                                                        }`}
                                                        style={{ backgroundColor: color }}
                                                    />
                                                ))}
                                            </div>

                                            <button
                                                onClick={clearCanvas}
                                                class="px-2.5 py-1 bg-white hover:bg-slate-100 border border-slate-200 rounded-lg text-xs font-bold text-slate-600"
                                            >
                                                🗑️ 清空
                                            </button>
                                        </div>

                                        {/* Canvas Container */}
                                        <div class="canvas-container bg-white border-2 border-slate-300 rounded-2xl overflow-hidden shadow-inner">
                                            <canvas
                                                ref={canvasRef}
                                                width={340}
                                                height={240}
                                                onMouseDown={startDrawing}
                                                onMouseMove={draw}
                                                onMouseUp={stopDrawing}
                                                onMouseLeave={stopDrawing}
                                                onTouchStart={startDrawing}
                                                onTouchMove={draw}
                                                onTouchEnd={stopDrawing}
                                                class="w-full h-auto bg-white cursor-crosshair touch-none"
                                            />
                                        </div>

                                        <button
                                            onClick={handleDrawingSubmit}
                                            disabled={submitted && activeQuestion.lockAfterSubmit}
                                            class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-bold py-3.5 rounded-xl transition shadow-md"
                                        >
                                            {submitted ? '重新傳送畫布 🚀' : '傳送畫布答案 🚀'}
                                        </button>
                                    </div>
                                )}

                                {/* Submitted Badge Banner */}
                                {submitted && (
                                    <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-center space-y-1">
                                        <div class="text-emerald-700 font-bold text-sm flex items-center justify-center gap-1.5">
                                            <span>✅ 已成功提交答案</span>
                                        </div>
                                        <div class="text-xs text-emerald-600 font-mono">
                                            耗時：⏱️ {submitDuration} 秒
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<OMITApp />);
    </script>
</body>
</html>
