        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
            const [myAnswer, setMyAnswer] = useState('');
            const [submitted, setSubmitted] = useState(false);
            const [audioBlob, setAudioBlob] = useState(null);
            const [audioUrl, setAudioUrl] = useState(null);
            const [isRecording, setIsRecording] = useState(false);
            const mediaRecorderRef = useRef(null);

            // Challenge answers state: { 1: 'A', 2: 'C', ... }
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [challengeTimerLeft, setChallengeTimerLeft] = useState(null);

            // Group Competition student answer choice index
            const [groupSelectedOpt, setGroupSelectedOpt] = useState(null);

            // Sync answer status if already submitted
            useEffect(() => {
                if (activeQuestion && responses) {
                    const myResKey = `${studentId}_${activeQuestion.id}`;
                    if (responses[myResKey]) {
                        setSubmitted(true);
                    } else {
                        setSubmitted(false);
                        setMyAnswer('');
                        setChallengeAnswers({});
                        setAudioUrl(null);
                    }
                }
            }, [activeQuestion, responses, studentId]);

            // Challenge countdown timer for student
            useEffect(() => {
                if (activeQuestion?.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer) {
                    setChallengeTimerLeft(activeQuestion.challenge.timeLimit || 120);
                }
            }, [activeQuestion]);

            useEffect(() => {
                let interval = null;
                if (challengeTimerLeft !== null && challengeTimerLeft > 0 && !submitted) {
                    interval = setInterval(() => {
                        setChallengeTimerLeft(t => {
                            if (t <= 1) {
                                handleSubmitAnswer(); // Auto submit on 00:00
                                return 0;
                            }
                            return t - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [challengeTimerLeft, submitted]);

            // Submit Answer Handler
            const handleSubmitAnswer = async () => {
                if (!activeQuestion) return;

                const appId = "omit-8c173";
                const db = window.fbDb;
                const myResKey = `${studentId}_${activeQuestion.id}`;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', myResKey);

                const nowStr = new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                let finalAns = myAnswer;
                if (activeQuestion.mode === 'AUDIO' && audioUrl) {
                    finalAns = audioUrl; // base64 / blob URL string
                }

                const payload = {
                    studentId: studentId,
                    questionId: activeQuestion.id,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    mode: activeQuestion.mode,
                    answer: finalAns,
                    challengeAnswers: activeQuestion.mode === 'CHALLENGE' ? challengeAnswers : null,
                    submitTime: nowStr,
                    timestamp: Date.now()
                };

                await window.fbUtils.setDoc(resDocRef, payload);
                setSubmitted(true);
                showToast("已成功提交答案！", "success");
            };

            // Audio Recording Handlers
            const startAudioRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const recorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = recorder;
                    const chunks = [];

                    recorder.ondataavailable = (e) => chunks.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            setAudioUrl(reader.result);
                        };
                        reader.readAsDataURL(blob);
                    };

                    recorder.start();
                    setIsRecording(true);
                } catch (e) {
                    showToast("無法存取麥克風！", "error");
                }
            };

            const stopAudioRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            // Student Group Role Split View Math
            const studentGroupInfo = useMemo(() => {
                if (activeQuestion?.mode === 'GROUP' && activeQuestion.groups) {
                    for (let g of activeQuestion.groups) {
                        const memberIdx = g.members.findIndex(m => m.seatNumber.toString() === seatNumber.toString());
                        if (memberIdx !== -1) {
                            return {
                                group: g,
                                memberIndex: memberIdx,
                                totalMembers: g.members.length
                            };
                        }
                    }
                }
                return null;
            }, [activeQuestion, seatNumber]);

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col justify-between p-4 max-w-2xl mx-auto space-y-4">
                    {/* Header Bar */}
                    <header class="bg-indigo-900 text-white p-4 rounded-3xl shadow-lg flex items-center justify-between">
                        <div>
                            <span class="text-xs bg-indigo-600 px-3 py-1 rounded-full font-bold">學生頁面</span>
                            <h2 class="text-base font-black mt-1">{seatNumber} 號 {studentName}</h2>
                        </div>
                        <button onClick={onExit} class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-xl font-bold">
                            退出
                        </button>
                    </header>

                    {/* Teacher Live Demo Whiteboard Broadcast Overlay */}
                    {activeQuestion?.teacherWhiteboardBroadcast && (
                        <div class="bg-amber-50 border-2 border-amber-400 p-4 rounded-3xl shadow-xl space-y-2">
                            <span class="text-xs font-black text-amber-800 block">📡 老師正在直播示範白板：</span>
                            <img src={activeQuestion.teacherWhiteboardBroadcast} class="w-full h-auto rounded-2xl border bg-white" />
                        </div>
                    )}

                    {/* Peer Submission Broadcast Overlay */}
                    {activeQuestion?.broadcastedSubmission && (
                        <div class="bg-indigo-50 border-2 border-indigo-400 p-4 rounded-3xl shadow-xl space-y-2">
                            <span class="text-xs font-black text-indigo-800 block">
                                📡 老師正廣播 {activeQuestion.broadcastedSubmission.seatNumber} 號學生的作品作互評：
                            </span>
                            {activeQuestion.broadcastedSubmission.mode === 'DRAW' && (
                                <img src={activeQuestion.broadcastedSubmission.answer} class="w-full h-auto rounded-2xl border bg-white" />
                            )}
                            {activeQuestion.broadcastedSubmission.mode === 'SHORT' && (
                                <p class="p-4 bg-white rounded-2xl text-base font-bold text-slate-800">{activeQuestion.broadcastedSubmission.answer}</p>
                            )}
                        </div>
                    )}

                    {/* MAIN ACTIVE QUESTION CONTAINER */}
                    {!activeQuestion ? (
                        <div class="bg-white p-8 rounded-3xl text-center space-y-3 shadow-md border my-auto">
                            <div class="text-4xl">⏳</div>
                            <h3 class="text-lg font-black text-slate-800">安靜等候老師指示...</h3>
                            <p class="text-xs text-slate-400">當老師發佈新題目或活動時，畫面會即時更新</p>
                        </div>
                    ) : (
                        <div class="bg-white rounded-3xl p-6 shadow-xl border border-slate-200 space-y-6 flex-grow flex flex-col justify-between">
                            <div class="space-y-3">
                                <div class="flex items-center justify-between border-b pb-3">
                                    <span class="px-3 py-1 bg-indigo-100 text-indigo-800 rounded-xl text-xs font-black">
                                        【{getModeLabel(activeQuestion.mode)}】
                                    </span>

                                    {activeQuestion.mode === 'CHALLENGE' && challengeTimerLeft !== null && (
                                        <span class="text-sm font-mono font-black text-red-600 bg-red-50 px-3 py-1 rounded-xl">
                                            ⏱️ 限時倒數: {Math.floor(challengeTimerLeft/60)}:{(challengeTimerLeft%60).toString().padStart(2,'0')}
                                        </span>
                                    )}
                                </div>

                                <h3 class="text-lg font-black text-slate-800">{activeQuestion.text}</h3>

                                {/* SUBMISSION FEEDBACK PRAISE NOTICE */}
                                {submitted ? (
                                    <div class="p-6 bg-emerald-50 rounded-3xl border border-emerald-200 text-center space-y-3 my-auto animate-fade-in">
                                        <div class="text-4xl">🎉</div>
                                        <h4 class="text-lg font-black text-emerald-800">已提交答案! 讚賞你的努力!</h4>
                                        <p class="text-xs text-emerald-600 font-bold">安靜等候老師指示...</p>

                                        {/* Challenge mode review after teacher releases scores */}
                                        {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge?.scoresReleased && (
                                            <div class="mt-4 p-4 bg-white rounded-2xl border text-left space-y-3">
                                                <h5 class="font-black text-indigo-700 text-sm">🏆 挑戰題詳細成績與答案解析：</h5>
                                                {activeQuestion.challenge.questions.map((q, idx) => {
                                                    const myAns = challengeAnswers[q.num];
                                                    const isCorrect = myAns === q.answer;

                                                    return (
                                                        <div key={idx} class={`p-3 rounded-xl border text-xs space-y-1 ${isCorrect ? 'bg-emerald-50 border-emerald-300' : 'bg-red-50 border-red-300'}`}>
                                                            <p class="font-bold">{q.num}. {q.text}</p>
                                                            <p class={isCorrect ? 'text-emerald-700 font-bold' : 'text-red-600 font-bold'}>
                                                                你的選擇：{myAns || '未作答'} ({isCorrect ? '正確 ✓' : '錯誤 ✕'})
                                                            </p>
                                                            {!isCorrect && (
                                                                <p class="text-emerald-700 font-bold">正確選項：{q.answer}</p>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    /* ACTIVE INPUT FORMS */
                                    <div class="space-y-4 pt-2">
                                        {/* CHOICE & TF */}
                                        {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                            <div class="space-y-2">
                                                {activeQuestion.choiceOptions.map(opt => (
                                                    <button
                                                        key={opt}
                                                        onClick={() => setMyAnswer(opt)}
                                                        class={`w-full py-4 px-5 rounded-2xl text-left font-black text-base border-2 transition ${myAnswer === opt ? 'bg-indigo-600 text-white border-indigo-700 shadow-lg scale-102' : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'}`}
                                                    >
                                                        {opt}
                                                    </button>
                                                ))}
                                                <button
                                                    onClick={handleSubmitAnswer}
                                                    disabled={!myAnswer}
                                                    class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-black text-base rounded-2xl shadow-lg transition mt-4"
                                                >
                                                    確認提交答案 🚀
                                                </button>
                                            </div>
                                        )}

                                        {/* SHORT ANSWER */}
                                        {activeQuestion.mode === 'SHORT' && (
                                            <div class="space-y-3">
                                                <textarea
                                                    rows={4}
                                                    value={myAnswer}
                                                    onChange={(e) => setMyAnswer(e.target.value)}
                                                    placeholder="請輸入您的回答..."
                                                    class="w-full p-4 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 font-medium text-sm"
                                                />
                                                <button
                                                    onClick={handleSubmitAnswer}
                                                    disabled={!myAnswer.trim()}
                                                    class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-black text-base rounded-2xl shadow-lg transition"
                                                >
                                                    確認提交答案 🚀
                                                </button>
                                            </div>
                                        )}

                                        {/* WHITEBOARD DRAW */}
                                        {activeQuestion.mode === 'DRAW' && (
                                            <div class="space-y-3">
                                                <WhiteboardCanvas 
                                                    initialBg={activeQuestion.whiteboardBg}
                                                    onSave={(data) => setMyAnswer(data)} 
                                                />
                                                <button
                                                    onClick={handleSubmitAnswer}
                                                    disabled={!myAnswer}
                                                    class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-black text-base rounded-2xl shadow-lg transition"
                                                >
                                                    確認提交白板作品 🚀
                                                </button>
                                            </div>
                                        )}

                                        {/* BUZZER */}
                                        {activeQuestion.mode === 'BUZZER' && (
                                            <div class="text-center space-y-4 py-8">
                                                <button
                                                    onClick={() => {
                                                        playSound('buzzer');
                                                        handleSubmitAnswer();
                                                    }}
                                                    class="w-48 h-48 rounded-full bg-red-600 hover:bg-red-500 text-white font-black text-3xl shadow-2xl border-8 border-red-300 active:scale-95 transition mx-auto flex items-center justify-center animate-pulse"
                                                >
                                                    ⚡ 搶答！
                                                </button>
                                            </div>
                                        )}

                                        {/* AUDIO RECORDING */}
                                        {activeQuestion.mode === 'AUDIO' && (
                                            <div class="space-y-4 text-center py-4">
                                                {!audioUrl ? (
                                                    <button
                                                        onClick={isRecording ? stopAudioRecording : startAudioRecording}
                                                        class={`w-36 h-36 rounded-full font-black text-xl text-white shadow-xl transition mx-auto flex items-center justify-center ${isRecording ? 'bg-red-600 animate-pulse' : 'bg-indigo-600 hover:bg-indigo-500'}`}
                                                    >
                                                        {isRecording ? '⏹️ 停止錄音' : '🎙️ 開始錄音'}
                                                    </button>
                                                ) : (
                                                    <div class="space-y-3 bg-slate-50 p-4 rounded-2xl border">
                                                        <span class="text-xs font-bold text-slate-500 block">試聽錄音：</span>
                                                        <audio controls src={audioUrl} class="w-full" />
                                                        <div class="flex space-x-2">
                                                            <button
                                                                onClick={() => setAudioUrl(null)}
                                                                class="flex-1 py-2.5 bg-red-100 text-red-700 font-bold text-xs rounded-xl"
                                                            >
                                                                🗑️ 刪除重錄
                                                            </button>
                                                            <button
                                                                onClick={handleSubmitAnswer}
                                                                class="flex-1 py-2.5 bg-emerald-600 text-white font-bold text-xs rounded-xl shadow"
                                                            >
                                                                ✅ 確認提交錄音
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {/* CHALLENGE EXAM */}
                                        {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                            <div class="space-y-6">
                                                {activeQuestion.challenge.questions.map((q, qIdx) => (
                                                    <div key={qIdx} class="p-4 bg-slate-50 rounded-2xl border space-y-2">
                                                        <h4 class="font-black text-sm text-slate-800">{q.num}. {q.text}</h4>
                                                        <div class="grid grid-cols-2 gap-2">
                                                            {q.options.map((opt) => (
                                                                <button
                                                                    key={opt.letter}
                                                                    onClick={() => setChallengeAnswers(prev => ({ ...prev, [q.num]: opt.letter }))}
                                                                    class={`p-3 rounded-xl border text-left text-xs font-bold transition ${challengeAnswers[q.num] === opt.letter ? 'bg-indigo-600 text-white border-indigo-700' : 'bg-white border-slate-200'}`}
                                                                >
                                                                    {opt.letter}. {opt.text}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}

                                                <button
                                                    onClick={handleSubmitAnswer}
                                                    class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-base rounded-2xl shadow-lg transition"
                                                >
                                                    確認提交整份評估 🚀
                                                </button>
                                            </div>
                                        )}

                                        {/* GROUP COMPETITION STAGE */}
                                        {activeQuestion.mode === 'GROUP' && studentGroupInfo && (
                                            <div class="space-y-4">
                                                {/* Group banner */}
                                                <div class={`p-4 rounded-2xl border text-center font-black ${studentGroupInfo.group.badgeBg}`}>
                                                    <span class="text-2xl">{studentGroupInfo.group.emoji}</span>
                                                    <h4 class="text-lg">{studentGroupInfo.group.name}</h4>
                                                    <p class="text-xs font-bold mt-1">盡快與你的組員會合! 比賽即將開始!</p>
                                                </div>

                                                {activeQuestion.stage === 'RACE' && (
                                                    <div class="p-4 bg-indigo-50 rounded-2xl border border-indigo-200 text-center space-y-3">
                                                        <span class="text-xs font-bold text-indigo-700 block">請與組員互相溝通合作答題！</span>
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {/* PUSHED LINK */}
                                        {activeQuestion.mode === 'LINK' && (
                                            <div class="space-y-4 text-center">
                                                {activeQuestion.youtubeEmbed ? (
                                                    <iframe 
                                                        src={activeQuestion.youtubeEmbed} 
                                                        class="w-full aspect-video rounded-2xl shadow-md border" 
                                                        allow="autoplay; encrypted-media" 
                                                        allowFullScreen 
                                                    />
                                                ) : (
                                                    <a 
                                                        href={activeQuestion.pushedUrl} 
                                                        target="_blank" 
                                                        rel="noopener noreferrer"
                                                        class="inline-block px-6 py-3.5 bg-indigo-600 text-white font-bold rounded-2xl shadow-lg hover:bg-indigo-700"
                                                    >
                                                        開啟連結網站 ↗
                                                    </a>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
