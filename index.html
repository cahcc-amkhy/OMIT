    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Mode label definitions
        function getModeLabel(mode) {
            switch(mode) {
                case 'CHOICE': return '選擇題';
                case 'TF': return '是非題';
                case 'SHORT': return '短答題';
                case 'DRAW': return '白板題';
                case 'BUZZER': return '搶答題';
                case 'AUDIO': return '錄音題';
                case 'CHALLENGE': return '挑戰題';
                case 'COOP': return '合作題';
                case 'LINK': return '派送連結';
                default: return '題目';
            }
        }

        function getDefaultQuestionPrompt(mode) {
            switch(mode) {
                case 'CHOICE': return '請選擇正確答案：';
                case 'TF': return '請判斷下列描述是否正確：';
                case 'SHORT': return '請輸入您的回答：';
                case 'DRAW': return '請在白板上作答或繪圖：';
                case 'BUZZER': return '請準備點擊搶答按鈕！';
                case 'AUDIO': return '請錄製不多於10秒的語音回答：';
                case 'CHALLENGE': return '請在限時內完成以下挑戰題評估：';
                case 'COOP': return '小組合作挑戰進行中，請與組員溝通完成答題！';
                case 'LINK': return '請點擊或觀看下方派送內容：';
                default: return '請回答問題：';
            }
        }

        // Web Audio API Synth Generator
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                    });
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.error("Audio synth error:", e);
            }
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-rose-600' : type === 'success' ? 'bg-emerald-600' : 'bg-indigo-600';

            return (
                <div class={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-2 text-sm font-bold animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        // Create Word (.docx) binary Blob using JSZip
        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) throw new Error("JSZip library is not loaded.");
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>${paragraphsXml}</w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        // Word / Text parsing for Challenge & Coop questions
        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];
            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) {
                        questions.push(currentQ);
                    }
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }

                    currentQ.options.push({ letter, text: optText });
                    if (isCorrect) currentQ.answer = letter;
                }
            });

            if (currentQ && currentQ.options.length > 0) {
                questions.push(currentQ);
            }

            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1,
                            text: "以下哪一項不是地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "機械資源" }
                            ],
                            answer: "D"
                        },
                        {
                            num: 2,
                            text: "芝士的原料屬於哪一項地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "礦產資源" }
                            ],
                            answer: "C"
                        }
                    ]
                };
            }

            return { title, totalScore, questions };
        };

        function WhiteboardCanvas({ initialBg, onConfirm, disabled, initialImage }) {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [tool, setTool] = useState('pen'); // 'pen' | 'eraser'
            const [lineWidth, setLineWidth] = useState(4); // 2px - 18px
            const [bgImage, setBgImage] = useState(initialBg || null);
            const lastPos = useRef({ x: 0, y: 0 });

            const redrawBg = (ctx) => {
                if (bgImage) {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, 1280, 720);
                    };
                    img.src = bgImage;
                }
            };

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 1280, 720);

                if (initialImage) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0, 1280, 720);
                    img.src = initialImage;
                } else if (bgImage) {
                    redrawBg(ctx);
                }
            }, [bgImage]);

            const getCanvasCoords = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = 1280 / rect.width;
                const scaleY = 720 / rect.height;

                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                if (disabled) return;
                e.preventDefault();
                setIsDrawing(true);
                const pos = getCanvasCoords(e);
                lastPos.current = pos;
            };

            const draw = (e) => {
                if (!isDrawing || disabled) return;
                e.preventDefault();
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const pos = getCanvasCoords(e);

                ctx.beginPath();
                ctx.moveTo(lastPos.current.x, lastPos.current.y);
                ctx.lineTo(pos.x, pos.y);

                if (tool === 'eraser') {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.lineWidth = lineWidth * 3;
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = '#1e1b4b';
                    ctx.lineWidth = lineWidth;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                }

                ctx.stroke();
                lastPos.current = pos;
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const handleClear = () => {
                if (disabled) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 1280, 720);
                if (bgImage) redrawBg(ctx);
            };

            const handleBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setBgImage(evt.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleConfirm = () => {
                const canvas = canvasRef.current;
                const dataUrl = canvas.toDataURL('image/png');
                if (onConfirm) onConfirm(dataUrl);
            };

            return (
                <div class="space-y-3 bg-slate-900/5 p-4 rounded-3xl border border-slate-200">
                    <div class="flex flex-wrap items-center justify-between gap-3 bg-white p-3 rounded-2xl shadow-sm border">
                        <div class="flex items-center space-x-2">
                            <button 
                                type="button"
                                onClick={() => setTool('pen')}
                                disabled={disabled}
                                class={`px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1 transition ${tool === 'pen' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                            >
                                ✏️ 畫筆
                            </button>
                            <button 
                                type="button"
                                onClick={() => setTool('eraser')}
                                disabled={disabled}
                                class={`px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1 transition ${tool === 'eraser' ? 'bg-amber-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                            >
                                🧽 擦膠
                            </button>
                            <button 
                                type="button"
                                onClick={handleClear}
                                disabled={disabled}
                                class="px-3 py-1.5 rounded-xl font-bold text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 transition"
                            >
                                🗑️ 一鍵清空
                            </button>
                        </div>

                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold text-slate-500">筆觸粗幼:</span>
                            <input 
                                type="range" 
                                min="2" 
                                max="18" 
                                value={lineWidth} 
                                onChange={(e) => setLineWidth(parseInt(e.target.value))}
                                disabled={disabled}
                                class="w-24 accent-indigo-600 cursor-pointer"
                            />
                            <span class="text-xs font-mono font-bold text-indigo-600 w-6">{lineWidth}px</span>
                        </div>

                        <div class="flex items-center space-x-2">
                            <label class="px-3 py-1.5 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-700 font-bold text-xs border border-purple-200 cursor-pointer transition flex items-center gap-1">
                                🖼️ 上載圖片背景
                                <input type="file" accept="image/*" onChange={handleBgUpload} disabled={disabled} class="hidden" />
                            </label>
                        </div>
                    </div>

                    <div class="canvas-container relative w-full aspect-16-9 bg-white rounded-2xl overflow-hidden border-2 border-slate-300 shadow-inner">
                        <canvas 
                            ref={canvasRef}
                            width={1280}
                            height={720}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            class="w-full h-full object-contain cursor-crosshair"
                        />
                    </div>

                    {!disabled && onConfirm && (
                        <button 
                            type="button"
                            onClick={handleConfirm}
                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3.5 rounded-2xl shadow-lg transition active:scale-98 text-base flex items-center justify-center space-x-2"
                        >
                            <span>✅ 確認提交白板作品</span>
                        </button>
                    )}
                </div>
            );
        }

        function TeacherDemoWhiteboardModal({ onClose, onBroadcast, isBroadcasting }) {
            const canvasRef = useRef(null);
            const [tool, setTool] = useState('pen');
            const [lineWidth, setLineWidth] = useState(4);
            const [isDrawing, setIsDrawing] = useState(false);
            const lastPos = useRef({ x: 0, y: 0 });

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 1280, 720);
            }, []);

            const getCanvasCoords = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = 1280 / rect.width;
                const scaleY = 720 / rect.height;
                let clientX = e.clientX;
                let clientY = e.clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }
                return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                setIsDrawing(true);
                lastPos.current = getCanvasCoords(e);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const pos = getCanvasCoords(e);

                ctx.beginPath();
                ctx.moveTo(lastPos.current.x, lastPos.current.y);
                ctx.lineTo(pos.x, pos.y);

                if (tool === 'eraser') {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.lineWidth = lineWidth * 3;
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = '#0f172a';
                    ctx.lineWidth = lineWidth;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                }

                ctx.stroke();
                lastPos.current = pos;
            };

            const handleClear = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 1280, 720);
            };

            const handleToggleBroadcast = () => {
                const canvas = canvasRef.current;
                const dataUrl = canvas.toDataURL('image/png');
                onBroadcast(isBroadcasting ? null : dataUrl);
            };

            return (
                <div class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-50 flex flex-col justify-between p-4 md:p-6">
                    <div class="flex items-center justify-between text-white border-b border-slate-700 pb-3">
                        <div class="flex items-center space-x-3">
                            <span class="text-2xl">🎨</span>
                            <h2 class="text-xl font-black">教師即時示範白板</h2>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button 
                                onClick={() => setTool('pen')} 
                                class={`px-3 py-1.5 rounded-xl font-bold text-xs ${tool === 'pen' ? 'bg-indigo-600' : 'bg-slate-700'}`}
                            >
                                ✏️ 畫筆
                            </button>
                            <button 
                                onClick={() => setTool('eraser')} 
                                class={`px-3 py-1.5 rounded-xl font-bold text-xs ${tool === 'eraser' ? 'bg-amber-600' : 'bg-slate-700'}`}
                            >
                                🧽 擦膠
                            </button>
                            <button onClick={handleClear} class="px-3 py-1.5 rounded-xl bg-rose-600 font-bold text-xs">

            useEffect(() => {

            const handleTeacherAccessRequest = () => {

                        </div>

                        {showPasswordModal && (

        function TeacherDashboard({ 
            roomCode, activeQuestion, setActiveQuestion, responses, setResponses, 
            studentsList, historyQuestions, setHistoryQuestions, coopState, setCoopState, 
            teacherWhiteboardBroadcast, setTeacherWhiteboardBroadcast, showToast, onExit 
        }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE');
            const [questionText, setQuestionText] = useState('');
            const [choiceCount, setChoiceCount] = useState(4);
            const [lockAfterSubmit, setLockAfterSubmit] = useState(true);
            const [whiteboardBg, setWhiteboardBg] = useState(null);
            const [pushedUrl, setPushedUrl] = useState('');

            // Modals & Panels
            const [showQRModal, setShowQRModal] = useState(false);
            const [showStudentListModal, setShowStudentListModal] = useState(false);
            const [showInspectModal, setShowInspectModal] = useState(null); // Used for image/short answer modal
            const [showTeacherWhiteboardModal, setShowTeacherWhiteboardModal] = useState(false);
            const [barChoiceFilter, setBarChoiceFilter] = useState(null);

            // Random Student Selector
            const [showRandomModal, setShowRandomModal] = useState(false);
            const [rangeStart, setRangeStart] = useState(1);
            const [rangeEnd, setRangeEnd] = useState(36);
            const [drawnNumbers, setDrawnNumbers] = useState([]);
            const [currentDrawn, setCurrentDrawn] = useState(null);
            const [isSpinning, setIsSpinning] = useState(false);

            // Enhanced Timer State
            const [showTimerModal, setShowTimerModal] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerActive, setTimerActive] = useState(false);

            // Challenge Question Setup
            const [challengeData, setChallengeData] = useState(null);
            const [challengeEnableTimer, setChallengeEnableTimer] = useState(true);
            const [challengeTimeLimit, setChallengeTimeLimit] = useState(120);
            const [challengeReleaseInstant, setChallengeReleaseInstant] = useState(true);

            // Cooperative Mode Setup ("合作題")
            const [coopData, setCoopData] = useState(null);

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

            // Filter active question responses
            const currentQuestionResponses = useMemo(() => {
                if (!activeQuestion) return {};
                const filtered = {};
                Object.values(responses).forEach(r => {
                    if (r.questionId === activeQuestion.id) filtered[r.studentId] = r;
                });
                return filtered;
            }, [responses, activeQuestion]);

            // Short answers list sorted chronologically
            const shortAnswerSubmissions = useMemo(() => {
                return Object.values(currentQuestionResponses)
                    .filter(r => r.answer && typeof r.answer === 'string')
                    .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            }, [currentQuestionResponses]);

            // Timer Interval Logic
            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(s => {
                            if (s <= 1) {
                                setTimerActive(false);
                                playSound('alarm');
                                return 0;
                            }
                            return s - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            const updateRoomDoc = async (payload) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { ...payload, updatedAt: Date.now() }, { merge: true });
            };

            const handleExitRoom = async () => {
                if (window.confirm("確定退出課室？將會同步清空此課室所有暫存紀錄！")) {
                    try {
                        const appId = "omit-8c173";
                        const db = window.fbDb;
                        
                        const responsesColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');
                        const resSnaps = await window.fbUtils.getDocs(responsesColRef);
                        resSnaps.forEach(async (d) => await window.fbUtils.deleteDoc(d.ref));

                        const studentsColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                        const stuSnaps = await window.fbUtils.getDocs(studentsColRef);
                        stuSnaps.forEach(async (d) => await window.fbUtils.deleteDoc(d.ref));

                        const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                        await window.fbUtils.deleteDoc(roomDocRef);

                        showToast("課室暫存資料已完全清空！", "info");
                    } catch (e) {
                        console.error("Cleanup error:", e);
                    }
                    onExit();
                }
            };

            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                let challengeContent = null;

                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請先上載並解析 Word 評估範本檔案！", "error");
                        return;
                    }
                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);

                updateRoomDoc({ activeQuestion: newQ, history: updatedHistory, coopState: null });
                showToast(`已成功發佈【${getModeLabel(selectedMode)}】給所有學生！`, 'success');
            };

            // Broadcast Short Answer or Whiteboard Submission
            const handleBroadcastSubmission = async (studentRes) => {
                const isCurrentlyBroadcasted = activeQuestion?.broadcastedSubmission?.studentId === studentRes?.studentId;
                const newBroadcastData = isCurrentlyBroadcasted ? null : studentRes;

                const updatedQ = {
                    ...activeQuestion,
                    broadcastedSubmission: newBroadcastData
                };
                await updateRoomDoc({ activeQuestion: updatedQ });
                
                if (newBroadcastData) {
                    showToast(`已一鍵廣播 ${studentRes.name} 的答案至全班螢幕進行互評！`, "success");
                } else {
                    showToast("已成功取消全班廣播！", "info");
                }
            };

            return (
                <div class="min-h-screen pb-12">
                    {/* Header */}
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 py-3">

                            <div class="flex items-center space-x-3">
                                <div class="bg-indigo-600 text-white font-black px-3 py-1.5 rounded-xl text-lg shadow-sm">OMIT</div>
                                <div>
                                    <h1 class="font-extrabold text-slate-800 text-base flex items-center gap-2">
                                        宣道會陳元喜小學OMIT互動課堂
                                        <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-0.5 rounded-full font-mono font-bold">
                                            房號：{roomCode}
                                        </span>
                                    </h1>
                                </div>
                            </div>

                            <div class="flex flex-wrap items-center gap-2">
                                <button 
                                    onClick={() => setShowQRModal(true)}
                                    class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-2 rounded-xl border border-indigo-200 text-xs md:text-sm flex items-center space-x-1.5 transition"
                                >
                                    <span>📱 QR Code</span>
                                </button>

                                <button 
                                    onClick={() => setShowStudentListModal(true)}
                                    class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold px-3 py-2 rounded-xl border border-emerald-200 text-xs md:text-sm flex items-center space-x-1.5 transition"
                                >
                                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                                    <span>在線學生：{studentsList.length} 人</span>
                                </button>

                                <button 
                                    onClick={() => setShowTeacherWhiteboardModal(true)}
                                    class={`px-3 py-2 rounded-xl border text-xs md:text-sm font-bold flex items-center space-x-1 transition ${
                                        teacherWhiteboardBroadcast 
                                        ? 'bg-purple-600 text-white border-purple-700 animate-pulse' 
                                        : 'bg-purple-50 hover:bg-purple-100 text-purple-800 border-purple-200'
                                    }`}
                                >
                                    <span>🎨 示範白板</span>
                                </button>

                                <button 
                                    onClick={handleExitRoom}
                                    class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2 rounded-xl border border-rose-200 text-xs md:text-sm transition"
                                >
                                    🚪 退出課室
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

                        {/* Mode Selectors */}
                        <div class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-9 gap-2.5">
                            {[
                                { id: 'CHOICE', label: '選擇題', icon: '🔘' },
                                { id: 'TF', label: '是非題', icon: '⭕' },
                                { id: 'SHORT', label: '短答題', icon: '✍️' },
                                { id: 'DRAW', label: '白板題', icon: '🎨' },
                                { id: 'BUZZER', label: '搶答題', icon: '🚨' },
                                { id: 'AUDIO', label: '錄音題', icon: '🎤' },
                                { id: 'CHALLENGE', label: '挑戰題', icon: '🏆' },
                                { id: 'COOP', label: '合作題', icon: '🤝' },
                                { id: 'LINK', label: '派送連結', icon: '🔗' }
                            ].map((mode) => (
                                <button 
                                    key={mode.id}
                                    onClick={() => setSelectedMode(mode.id)}
                                    class={`p-3 rounded-2xl font-bold border-2 transition-all text-center flex flex-col items-center justify-center space-y-1 shadow-sm active:scale-95 ${
                                        selectedMode === mode.id 
                                        ? 'bg-slate-900 text-white border-slate-900 ring-4 ring-slate-200' 
                                        : 'bg-white text-slate-700 border-slate-200 hover:border-slate-300 hover:bg-slate-50'
                                    }`}
                                >
                                    <span class="text-xl">{mode.icon}</span>
                                    <span class="text-xs font-black">{mode.label}</span>
                                </button>
                            ))}
                        </div>

                        {/* Question Publishing Control Box */}
                        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                            <div class="flex flex-wrap items-center justify-between border-b pb-3 gap-2">
                                <h2 class="font-extrabold text-slate-800 text-lg flex items-center gap-2">
                                    <span>模式設定：{getModeLabel(selectedMode)}</span>
                                </h2>
                            </div>

                            {selectedMode !== 'LINK' && selectedMode !== 'BUZZER' && selectedMode !== 'CHALLENGE' && selectedMode !== 'COOP' && (
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 mb-1">題目內容 / 指引：</label>
                                    <input 
                                        type="text" 
                                        placeholder={`預設提示：「${getDefaultQuestionPrompt(selectedMode)}」`} 
                                        value={questionText}
                                        onChange={(e) => setQuestionText(e.target.value)}
                                        class="w-full px-4 py-3 rounded-xl border border-slate-200 font-medium text-slate-800 focus:ring-2 focus:ring-indigo-500"
                                    />
                                </div>
                            )}

                            <div class="flex space-x-3 pt-2">
                                <button 
                                    onClick={handlePublishQuestion}
                                    class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-lg text-base transition active:scale-98"
                                >
                                    🚀 發佈【{getModeLabel(selectedMode)}】給全班
                                </button>
                                {activeQuestion && (
                                    <button 
                                        onClick={() => updateRoomDoc({ activeQuestion: null })}
                                        class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-6 py-4 rounded-2xl transition"
                                    >
                                        收回題目
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Active Question Responses Display & Leaderboard ("答題龍虎榜") */}
                        {activeQuestion && (
                            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-6">
                                <div class="flex items-center justify-between border-b pb-4">
                                    <div>
                                        <span class="text-xs font-extrabold text-indigo-600 uppercase tracking-widest">當前進行中 [{getModeLabel(activeQuestion.mode)}]</span>
                                        <h3 class="text-xl font-black text-slate-800">{activeQuestion.text}</h3>
                                    </div>
                                    <div class="text-right flex items-center space-x-4">
                                        <div>
                                            <span class="text-xs text-slate-400 block font-bold">已回應人數</span>
                                            <span class="text-2xl font-black text-indigo-600">
                                                {Object.keys(currentQuestionResponses).length} / {studentsList.length}
                                            </span>
                                        </div>
                                    </div>
                                </div>

                                {/* Short Answer Leaderboard ("短答題 答題龍虎榜") */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-4">
                                        <div class="flex items-center justify-between">
                                            <h4 class="font-bold text-slate-800 text-base flex items-center gap-2">
                                                <span>🏆 短答題 答題龍虎榜</span>
                                                <span class="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full font-bold">按提交時間順序排列</span>
                                            </h4>
                                            {activeQuestion.broadcastedSubmission && (
                                                <button 
                                                    onClick={() => handleBroadcastSubmission(null)}
                                                    class="bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs px-3.5 py-2 rounded-xl transition shadow animate-pulse flex items-center space-x-1"
                                                >
                                                    <span>📡 正在廣播中 (點擊一鍵取消廣播)</span>
                                                </button>
                                            )}
                                        </div>

                                        {shortAnswerSubmissions.length === 0 ? (
                                            <div class="text-center py-12 bg-slate-50 rounded-2xl border border-dashed text-slate-400 font-bold">
                                                ⏳ 等待學生提交短答題作品...
                                            </div>
                                        ) : (
                                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                                {shortAnswerSubmissions.map((res, idx) => {
                                                    const isBroadcasted = activeQuestion?.broadcastedSubmission?.studentId === res.studentId;

                                                    return (
                                                        <div 
                                                            key={res.studentId}
                                                            class={`p-4 rounded-2xl border-2 transition shadow-sm space-y-3 relative flex flex-col justify-between ${
                                                                isBroadcasted 
                                                                ? 'bg-amber-50 border-amber-500 ring-4 ring-amber-200' 
                                                                : 'bg-white border-slate-200 hover:border-indigo-400'
                                                            }`}
                                                        >
                                                            <div class="space-y-2">
                                                                <div class="flex items-center justify-between">
                                                                    <div class="flex items-center space-x-2">
                                                                        <span class={`w-6 h-6 rounded-full flex items-center justify-center font-black text-xs ${
                                                                            idx === 0 ? 'bg-amber-400 text-amber-950' : idx === 1 ? 'bg-slate-300 text-slate-800' : idx === 2 ? 'bg-amber-700 text-white' : 'bg-slate-100 text-slate-600'
                                                                        }`}>
                                                                            {idx + 1}
                                                                        </span>
                                                                        <span class="font-extrabold text-slate-800 text-sm">{res.seatNumber}號 {res.name}</span>
                                                                    </div>
                                                                    <span class="text-xs font-mono font-bold text-slate-400">{res.duration ? `${res.duration}秒` : ''}</span>
                                                                </div>

                                                                <div 
                                                                    onClick={() => setShowInspectModal(res)}
                                                                    class="p-3 bg-slate-50 rounded-xl border border-slate-200 text-slate-800 font-medium text-sm min-h-[60px] line-clamp-3 cursor-pointer hover:bg-indigo-50/50 transition"
                                                                >
                                                                    {res.answer}
                                                                </div>
                                                            </div>

                                                            <div class="flex items-center justify-between gap-2 pt-2 border-t border-slate-100">
                                                                <button 
                                                                    onClick={() => setShowInspectModal(res)}
                                                                    class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition"
                                                                >
                                                                    🔍 放大瀏覽
                                                                </button>

                                                                <button 
                                                                    onClick={() => handleBroadcastSubmission(res)}
                                                                    class={`px-3 py-1.5 font-bold text-xs rounded-xl shadow transition ${
                                                                        isBroadcasted 
                                                                        ? 'bg-amber-600 hover:bg-amber-700 text-white animate-pulse' 
                                                                        : 'bg-indigo-600 hover:bg-indigo-700 text-white'
                                                                    }`}
                                                                >
                                                                    {isBroadcasted ? '📡 取消廣播' : '📢 廣播互評'}
                                                                </button>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Enlarged Inspection Modal for Short Answer / Whiteboard with Next / Prev / Broadcast Buttons */}
                    {showInspectModal && (
                        <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-2xl w-full space-y-6 shadow-2xl relative">
                                <div class="flex items-center justify-between border-b pb-3">
                                    <div>
                                        <span class="text-xs font-black text-indigo-600 uppercase">學生作品詳細瀏覽與互評</span>
                                        <h3 class="text-lg font-black text-slate-800">
                                            {showInspectModal.seatNumber}號 {showInspectModal.name} 的作答
                                        </h3>
                                    </div>
                                    <button 
                                        onClick={() => setShowInspectModal(null)}
                                        class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold flex items-center justify-center hover:bg-slate-200"
                                    >
                                        ✕
                                    </button>
                                </div>

                                <div class="space-y-4">
                                    {typeof showInspectModal.answer === 'string' && showInspectModal.answer.startsWith('data:image') ? (
                                        <div class="aspect-16-9 bg-slate-100 rounded-2xl overflow-hidden border">
                                            <img src={showInspectModal.answer} class="w-full h-full object-contain" alt="白板作品" />
                                        </div>
                                    ) : (
                                        <div class="p-6 bg-indigo-50/60 rounded-2xl border-2 border-indigo-200 text-slate-800 font-bold text-lg md:text-xl leading-relaxed whitespace-pre-wrap min-h-[140px] flex items-center justify-center text-center">
                                            「 {showInspectModal.answer} 」
                                        </div>
                                    )}

                                    <div class="text-xs text-slate-400 font-bold text-right">
                                        答題用時：{showInspectModal.duration || 0} 秒
                                    </div>
                                </div>

                                {/* Modal Controls: Navigation & One-Click Broadcast */}
                                <div class="flex flex-wrap items-center justify-between gap-3 border-t pt-4">
                                    {/* Prev / Next Navigation buttons */}
                                    {activeQuestion?.mode === 'SHORT' && (
                                        <div class="flex items-center space-x-2">
                                            {(() => {
                                                const currentIdx = shortAnswerSubmissions.findIndex(s => s.studentId === showInspectModal.studentId);
                                                const hasPrev = currentIdx > 0;
                                                const hasNext = currentIdx >= 0 && currentIdx < shortAnswerSubmissions.length - 1;

                                                return (
                                                    <>
                                                        <button 
                                                            disabled={!hasPrev}
                                                            onClick={() => hasPrev && setShowInspectModal(shortAnswerSubmissions[currentIdx - 1])}
                                                            class={`px-4 py-2 rounded-xl font-bold text-xs transition ${
                                                                hasPrev ? 'bg-slate-800 text-white hover:bg-slate-700' : 'bg-slate-100 text-slate-300 cursor-not-allowed'
                                                            }`}
                                                        >
                                                            ⬅️ 上一位
                                                        </button>
                                                        <span class="text-xs font-mono font-bold text-slate-500">
                                                            {currentIdx + 1} / {shortAnswerSubmissions.length}
                                                        </span>
                                                        <button 
                                                            disabled={!hasNext}
                                                            onClick={() => hasNext && setShowInspectModal(shortAnswerSubmissions[currentIdx + 1])}
                                                            class={`px-4 py-2 rounded-xl font-bold text-xs transition ${
                                                                hasNext ? 'bg-slate-800 text-white hover:bg-slate-700' : 'bg-slate-100 text-slate-300 cursor-not-allowed'
                                                            }`}
                                                        >
                                                            下一位 ➡️
                                                        </button>
                                                    </>
                                                );
                                            })()}
                                        </div>
                                    )}

                                    <div class="flex items-center space-x-2 ml-auto">
                                        {(() => {
                                            const isBroadcasted = activeQuestion?.broadcastedSubmission?.studentId === showInspectModal.studentId;

                                            return (
                                                <button 
                                                    onClick={() => handleBroadcastSubmission(showInspectModal)}
                                                    class={`px-5 py-2.5 rounded-xl font-black text-xs transition shadow-md ${
                                                        isBroadcasted 
                                                        ? 'bg-amber-600 hover:bg-amber-700 text-white animate-pulse' 
                                                        : 'bg-indigo-600 hover:bg-indigo-700 text-white'
                                                    }`}
                                                >
                                                    {isBroadcasted ? '📡 取消廣播' : '📢 廣播至全班螢幕互評'}
                                                </button>
                                            );
                                        })()}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Teacher Demonstration Whiteboard Modal */}
                    {showTeacherWhiteboardModal && (
                        <TeacherDemoWhiteboardModal 
                            onClose={() => setShowTeacherWhiteboardModal(false)}
                            onBroadcast={handleBroadcastTeacherWhiteboard}
                            isBroadcasting={!!teacherWhiteboardBroadcast}
                        />
                    )}
                </div>
            );
        }

        function StudentInterface({ 
            roomCode, studentName, seatNumber, studentId, activeQuestion, responses, 
            coopState, teacherWhiteboardBroadcast, showToast, onExit 
        }) {
            const [textAnswer, setTextAnswer] = useState('');
            const [selectedChoice, setSelectedChoice] = useState('');
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [startTime, setStartTime] = useState(Date.now());

            useEffect(() => {
                if (activeQuestion) {
                    setStartTime(Date.now());
                    setIsSubmitted(false);
                    setTextAnswer('');
                    setSelectedChoice('');
                }
            }, [activeQuestion?.id]);

            const handleSubmitAnswer = async (answerVal) => {
                if (!activeQuestion) return;

                const durationSec = Math.max(1, Math.round((Date.now() - startTime) / 1000));
                const resObj = {
                    studentId,
                    seatNumber,
                    name: studentName,
                    questionId: activeQuestion.id,
                    answer: answerVal,
                    duration: durationSec,
                    timestamp: Date.now()
                };

                const appId = "omit-8c173";
                const db = window.fbDb;
                const docId = `${activeQuestion.id}_${studentId}`;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', docId);

                await window.fbUtils.setDoc(resDocRef, resObj);
                setIsSubmitted(true);
                playSound('win');
                showToast("已成功提交答案！", "success");
            };

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col justify-between p-4 md:p-6">
                    {/* Header Bar */}
                    <header class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <span class="px-3 py-1 bg-indigo-600 text-white font-black rounded-xl text-sm">
                                {seatNumber}號
                            </span>
                            <span class="font-extrabold text-slate-800 text-base">{studentName}</span>
                        </div>
                        <button onClick={onExit} class="text-xs font-bold text-slate-400 hover:text-slate-600">
                            🚪 離開課堂
                        </button>
                    </header>

                    {/* Teacher Demonstration Whiteboard Overlay */}
                    {teacherWhiteboardBroadcast && (
                        <div class="my-4 bg-purple-900 text-white p-4 rounded-3xl shadow-2xl space-y-3 animate-fade-in border-4 border-purple-400">
                            <div class="flex items-center justify-between border-b border-purple-700 pb-2">
                                <span class="font-black text-sm flex items-center gap-2">
                                    <span>🎨 教師即時示範白板廣播中</span>
                                </span>
                            </div>
                            <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden">
                                <img src={teacherWhiteboardBroadcast} class="w-full h-full object-contain" alt="教師示範白板" />
                            </div>
                        </div>
                    )}

                    {/* Peer Review Broadcast Overlay ("全班互評 廣播") */}
                    {activeQuestion?.broadcastedSubmission && (
                        <div class="my-4 bg-amber-50 border-4 border-amber-400 p-6 rounded-3xl shadow-2xl space-y-4 animate-bounce">
                            <div class="flex items-center justify-between border-b border-amber-200 pb-2">
                                <span class="font-black text-amber-900 text-base flex items-center gap-2">
                                    <span>📢 老師正廣播學生作品進行【全班互評】</span>
                                </span>
                                <span class="bg-amber-200 text-amber-900 font-bold text-xs px-3 py-1 rounded-full">
                                    {activeQuestion.broadcastedSubmission.seatNumber}號 {activeQuestion.broadcastedSubmission.name}
                                </span>
                            </div>

                            <div class="bg-white p-6 rounded-2xl border border-amber-200 text-center">
                                {typeof activeQuestion.broadcastedSubmission.answer === 'string' && activeQuestion.broadcastedSubmission.answer.startsWith('data:image') ? (
                                    <div class="aspect-16-9 bg-slate-50 rounded-xl overflow-hidden">
                                        <img src={activeQuestion.broadcastedSubmission.answer} class="w-full h-full object-contain" alt="互評作品" />
                                    </div>
                                ) : (
                                    <p class="text-xl md:text-2xl font-black text-slate-800 leading-relaxed">
                                        「 {activeQuestion.broadcastedSubmission.answer} 」
                                    </p>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Active Question Workspace */}
                    <main class="my-auto py-6">
                        {!activeQuestion ? (
                            <div class="text-center py-16 bg-white rounded-3xl border border-slate-200 shadow-sm space-y-3">
                                <div class="text-5xl animate-pulse">⏳</div>
                                <h2 class="text-xl font-black text-slate-700">課堂準備中，請等待老師發佈題目</h2>
                            </div>
                        ) : (
                            <div class="bg-white rounded-3xl p-6 shadow-xl border-2 border-indigo-100 space-y-6">
                                <div class="space-y-1">
                                    <span class="text-xs font-black text-indigo-600 uppercase">【{getModeLabel(activeQuestion.mode)}】</span>
                                    <h2 class="text-2xl font-black text-slate-800">{activeQuestion.text}</h2>
                                </div>

                                {/* Short Answer Input Area */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-4">
                                        <textarea 
                                            rows={4}
                                            value={textAnswer}
                                            onChange={(e) => setTextAnswer(e.target.value)}
                                            placeholder="請在此輸入您的回答..."
                                            disabled={isSubmitted && activeQuestion.lockAfterSubmit}
                                            class="w-full p-4 rounded-2xl border-2 border-slate-200 font-medium text-lg focus:outline-none focus:border-indigo-500"
                                        />

                                        <button 
                                            onClick={() => handleSubmitAnswer(textAnswer.trim())}
                                            disabled={!textAnswer.trim()}
                                            class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-black py-4 rounded-2xl shadow-lg transition active:scale-98 text-lg"
                                        >
                                            {isSubmitted ? '✅ 已提交 (可重新覆寫答案)' : '🚀 確認提交回答'}
                                        </button>
                                    </div>
                                )}

                                {/* Whiteboard Canvas Component for DRAW mode */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <WhiteboardCanvas 
                                        initialBg={activeQuestion.whiteboardBg}
                                        onConfirm={(imgData) => handleSubmitAnswer(imgData)}
                                        disabled={isSubmitted && activeQuestion.lockAfterSubmit}
                                    />
                                )}
                            </div>
                        )}
                    </main>

                    {/* Footer Branding */}
                    <footer class="text-center text-xs text-slate-400 font-bold py-2">
                        宣道會陳元喜小學 OMIT互動課堂
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
