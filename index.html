                                    <span class="text-6xl font-black text-amber-600 font-mono">
                                        {currentDrawn !== null ? `${currentDrawn} 號` : 'READY'}
                                    </span>
                                </div>

                                <div class="flex space-x-3">
                                    <button 
                                        onClick={handleSpinRandom}
                                        disabled={isSpinning}
                                        class="flex-1 py-3.5 bg-amber-500 text-white font-black rounded-xl text-lg shadow-md"
                                    >
                                        開始抽籤 🎰
                                    </button>
                                    <button 
                                        onClick={() => { setDrawnNumbers([]); setCurrentDrawn(null); showToast("已重置抽籤名單！", "info"); }}
                                        class="px-4 py-3 bg-slate-200 text-slate-700 font-bold rounded-xl text-sm"
                                    >
                                        重置
                                    </button>
                                </div>

                                <button onClick={() => setShowRandomModal(false)} class="w-full py-2 text-slate-400 font-bold text-sm">關閉</button>
                            </div>
                        </div>
                    )}

                    {/* Revision Item 10: Enhanced Timer Tool Modal */}
                    {showTimerModal && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class={`bg-white rounded-3xl p-6 transition-all duration-300 ${timerZoomed ? 'max-w-4xl w-full p-12' : 'max-w-lg w-full'} space-y-5 shadow-2xl`}>
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="text-xl font-black text-slate-800">⏱️ 計時器工具</h3>
                                    <div class="flex space-x-2">
                                        <button onClick={() => setTimerZoomed(!timerZoomed)} class="text-xs bg-slate-100 font-bold px-3 py-1 rounded-lg">
                                            {timerZoomed ? '🔍 縮小' : '🔍 放大顯示'}
                                        </button>
                                        <button onClick={() => setShowTimerModal(false)} class="text-slate-400 text-2xl font-bold">✕</button>
                                    </div>
                                </div>

                                <div class="text-center bg-slate-900 text-white p-8 rounded-3xl shadow-inner space-y-2">
                                    <div class={`font-mono font-black ${timerZoomed ? 'text-8xl' : 'text-6xl'} tracking-widest text-amber-400`}>
                                        {Math.floor(timerSeconds / 60).toString().padStart(2, '0')}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                    </div>
                                </div>

                                <div class="space-y-3">
                                    <div class="text-xs font-bold text-slate-500">快捷倒數設定：</div>
                                    <div class="grid grid-cols-6 gap-2">
                                        {[30, 60, 120, 180, 240, 300].map(s => (
                                            <button 
                                                key={s}
                                                onClick={() => { setTimerSeconds(s); setTimerActive(false); }}
                                                class="py-2 bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 rounded-xl font-bold text-xs"
                                            >
                                                {s >= 60 ? `${s/60}分` : `${s}秒`}
                                            </button>
                                        ))}
                                    </div>

                                    <div class="flex items-center space-x-2 pt-2">
                                        <span class="text-xs font-bold text-slate-700">手動輸入 (00:00)：</span>
                                        <input 
                                            type="number" 
                                            value={manualMinInput} 
                                            onChange={(e) => setManualMinInput(e.target.value)}
                                            class="w-12 px-2 py-1 border rounded text-center font-mono font-bold text-xs"
                                            placeholder="分"
                                        />
                                        <span>:</span>
                                        <input 
                                            type="number" 
                                            value={manualSecInput} 
                                            onChange={(e) => setManualSecInput(e.target.value)}
                                            class="w-12 px-2 py-1 border rounded text-center font-mono font-bold text-xs"
                                            placeholder="秒"
                                        />
                                        <button 
                                            onClick={() => {
                                                const m = parseInt(manualMinInput) || 0;
                                                const s = parseInt(manualSecInput) || 0;
                                                setTimerSeconds(m * 60 + s);
                                                setTimerActive(false);
                                            }}
                                            class="px-3 py-1 bg-slate-800 text-white rounded-lg text-xs font-bold"
                                        >
                                            設定
                                        </button>
                                    </div>
                                </div>

                                <div class="flex space-x-3 pt-3">
                                    <button 
                                        onClick={() => setTimerActive(!timerActive)}
                                        class={`flex-1 py-3.5 rounded-2xl font-black text-white text-base shadow-md transition ${timerActive ? 'bg-amber-600' : 'bg-emerald-600 hover:bg-emerald-700'}`}
                                    >
                                        {timerActive ? '⏸️ 暫停計時' : '▶️ 開始倒數'}
                                    </button>
                                    <button 
                                        onClick={() => { setTimerSeconds(0); setTimerActive(false); }}
                                        class="px-5 py-3.5 bg-slate-200 text-slate-700 font-bold rounded-2xl text-sm"
                                    >
                                        重置
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Student Interface Component
        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
            const [myAnswer, setMyAnswer] = useState('');
            const [audioBlob, setAudioBlob] = useState(null);
            const [audioUrl, setAudioUrl] = useState(null);
            const [isRecording, setIsRecording] = useState(false);
            const [recordingTime, setRecordingTime] = useState(0);
            const [hasSubmitted, setHasSubmitted] = useState(false);
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [teamAnswers, setTeamAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(null);

            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);
            const startTimeRef = useRef(null);

            const myResponseKey = activeQuestion ? `${activeQuestion.id}_${studentId}` : null;
            const existingResponse = myResponseKey ? responses[myResponseKey] : null;

            useEffect(() => {
                setMyAnswer('');
                setAudioBlob(null);
                setAudioUrl(null);
                setHasSubmitted(false);
                setChallengeAnswers({});
                setTeamAnswers({});
                startTimeRef.current = Date.now();
            }, [activeQuestion?.id]);

            useEffect(() => {
                if (existingResponse) {
                    setHasSubmitted(true);
                    if (existingResponse.answer) setMyAnswer(existingResponse.answer);
                }
            }, [existingResponse]);

            // Revision Item 13 & 15: Challenge auto-submit timer on student side
            useEffect(() => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE' || !activeQuestion.challenge?.enableTimer) {
                    setTimeLeft(null);
                    return;
                }

                const timeLimit = activeQuestion.challenge.timeLimit || 120;
                const elapsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                const remaining = Math.max(0, timeLimit - elapsed);
                setTimeLeft(remaining);

                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            handleAutoSubmitChallenge();
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);

                return () => clearInterval(timer);
            }, [activeQuestion]);

            const submitResponse = async (ansVal, scoreDetails = null) => {
                if (!activeQuestion) return;

                const duration = ((Date.now() - startTimeRef.current) / 1000).toFixed(1);
                const appId = "omit-8c173";
                const db = window.fbDb;
                
                const responseObj = {
                    id: `${activeQuestion.id}_${studentId}`,
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: ansVal,
                    duration: duration,
                    scoreDetails: scoreDetails,
                    submittedAt: Date.now()
                };

                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', responseObj.id);
                await window.fbUtils.setDoc(resDocRef, responseObj);

                setHasSubmitted(true);
                showToast("已成功提交答案！", "success");
            };

            const handleAutoSubmitChallenge = () => {
                if (hasSubmitted) return;
                let totalScore = 0;
                const questions = activeQuestion.challenge.questions;

                questions.forEach((q) => {
                    if (challengeAnswers[q.num] === q.answer) {
                        totalScore += Math.round(activeQuestion.challenge.totalScore / questions.length);
                    }
                });

                const percentage = Math.round((totalScore / activeQuestion.challenge.totalScore) * 100);
                submitResponse(challengeAnswers, { totalScore, percentage });
            };

            // Revision Item 5: Audio Recording Logic
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const url = URL.createObjectURL(blob);
                        setAudioBlob(blob);
                        setAudioUrl(url);
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                    setRecordingTime(0);

                    const timer = setInterval(() => {
                        setRecordingTime(prev => {
                            if (prev >= 9) {
                                stopRecording();
                                clearInterval(timer);
                                return 10;
                            }
                            return prev + 1;
                        });
                    }, 1000);

                } catch (err) {
                    showToast("無法存取麥克風，請檢查權限！", "error");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                    mediaRecorderRef.current.stream.getTracks().forEach(track => track.stop());
                }
            };

            const handleConfirmAudioSubmit = () => {
                if (!audioBlob) return;
                const reader = new FileReader();
                reader.onloadend = () => {
                    submitResponse(reader.result);
                };
                reader.readAsDataURL(audioBlob);
            };

            // Revision Item 22: Team Challenge Answer Logic
            const handleTeamAnswerSelect = async (selectedOpt, qObj) => {
                if (hasSubmitted) return;
                const isCorrect = (selectedOpt === qObj.answer);
                
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                const currentGrp = activeQuestion.groups.find(g => g.members.some(m => m.id === studentId));
                if (!currentGrp) return;

                let updatedProgress = isCorrect ? currentGrp.progress + 1 : 0; // Reset to 0 if wrong
                let winnerGroup = null;

                if (updatedProgress >= activeQuestion.teamData.questions.length) {
                    winnerGroup = currentGrp;
                }

                const updatedGroups = activeQuestion.groups.map(g => {
                    if (g.id === currentGrp.id) return { ...g, progress: updatedProgress };
                    return g;
                });

                await window.fbUtils.setDoc(roomDocRef, { 
                    activeQuestion: { 
                        ...activeQuestion, 
                        groups: updatedGroups,
                        winnerGroup: winnerGroup || activeQuestion.winnerGroup
                    } 
                }, { merge: true });

                if (!isCorrect) {
                    showToast("答錯了！該組著色條回到起點，請重新開始！", "error");
                } else {
                    showToast("答對了！向右著色前進一段！", "success");
                }
            };

            // My assigned group for Team mode
            const myGroup = useMemo(() => {
                if (!activeQuestion || activeQuestion.mode !== 'TEAM' || !activeQuestion.groups) return null;
                return activeQuestion.groups.find(g => g.members.some(m => m.id === studentId));
            }, [activeQuestion, studentId]);

            // Member index inside group for dividing question parts
            const myMemberIndex = useMemo(() => {
                if (!myGroup) return 0;
                return myGroup.members.findIndex(m => m.id === studentId);
            }, [myGroup, studentId]);

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col">
                    <header class="bg-indigo-600 text-white px-4 py-3 shadow-md flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <span class="font-black text-xl">OMIT</span>
                            <span class="text-xs bg-indigo-500 px-2.5 py-1 rounded-full font-mono">房號：{roomCode}</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-xs font-bold bg-white/20 px-3 py-1 rounded-full">
                                {seatNumber}號 - {studentName || '學生'}
                            </span>
                            <button onClick={onExit} class="text-xs bg-indigo-700 hover:bg-indigo-800 px-3 py-1 rounded-lg">退出</button>
                        </div>
                    </header>

                    <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col justify-center space-y-4">
                        {/* Revision Item 2: Broadcasted submission overlay */}
                        {activeQuestion?.broadcastedSubmission && (
                            <div class="bg-purple-900 text-white p-5 rounded-3xl shadow-2xl space-y-3 border-4 border-purple-400 animate-fade-in">
                                <div class="flex justify-between items-center border-b border-purple-700 pb-2">
                                    <span class="font-black text-amber-300 text-sm">📢 老師廣播作品 (全班互評)</span>
                                    <span class="text-xs font-bold">{activeQuestion.broadcastedSubmission.name} ({activeQuestion.broadcastedSubmission.seatNumber}號)</span>
                                </div>
                                <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden">
                                    <img src={activeQuestion.broadcastedSubmission.answer} class="w-full h-full object-contain" alt="廣播作品" />
                                </div>
                            </div>
                        )}

                        {!activeQuestion ? (
                            <div class="bg-white rounded-3xl p-8 text-center space-y-4 shadow-sm border border-slate-200">
                                <div class="text-5xl animate-bounce">⏳</div>
                                <h2 class="text-xl font-black text-slate-800">安靜等候老師指示...</h2>
                                <p class="text-slate-400 text-xs">當老師派送題目時，畫面會即時呈現</p>
                            </div>
                        ) : (
                            <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-200 space-y-5">
                                <div class="border-b pb-3 flex justify-between items-center">
                                    <span class="bg-indigo-100 text-indigo-700 text-xs px-3 py-1 rounded-full font-black">
                                        {getModeLabel(activeQuestion.mode)}
                                    </span>
                                    {timeLeft !== null && (
                                        <span class="bg-rose-100 text-rose-700 text-xs font-mono font-bold px-3 py-1 rounded-full">
                                            倒數：{Math.floor(timeLeft / 60)}:{(timeLeft % 60).toString().padStart(2, '0')}
                                        </span>
                                    )}
                                </div>

                                <h3 class="text-lg font-black text-slate-800">{activeQuestion.text}</h3>

                                {/* Revision Item 4: YouTube Link Embed */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div class="space-y-4">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div class="aspect-16-9 w-full rounded-2xl overflow-hidden border">
                                                <iframe src={activeQuestion.youtubeEmbed} class="w-full h-full" allow="autoplay" allowFullScreen></iframe>
                                            </div>
                                        ) : null}
                                        <a 
                                            href={activeQuestion.pushedUrl} 
                                            target="_blank" 
                                            rel="noopener noreferrer"
                                            class="block w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white text-center font-bold rounded-2xl shadow transition"
                                        >
                                            開啟連結網站 ↗
                                        </a>
                                    </div>
                                )}

                                {/* Revision Item 18: Buzzer Mode */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="text-center py-6">
                                        <button 
                                            onClick={() => submitResponse('搶答成功！')}
                                            disabled={hasSubmitted}
                                            class={`w-40 h-40 rounded-full font-black text-2xl shadow-2xl transition active:scale-90 ${
                                                hasSubmitted 
                                                ? 'bg-slate-300 text-slate-500 cursor-not-allowed' 
                                                : 'bg-rose-500 hover:bg-rose-600 text-white animate-pulse'
                                            }`}
                                        >
                                            {hasSubmitted ? '已搶答' : '🚨 搶答！'}
                                        </button>
                                    </div>
                                )}

                                {/* Revision Item 3 & 7: Choice & TF Mode */}
                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div class="space-y-4">
                                        <div class="grid grid-cols-2 gap-3">
                                            {activeQuestion.choiceOptions.map((opt) => (
                                                <button 
                                                    key={opt}
                                                    onClick={() => setMyAnswer(opt)}
                                                    disabled={hasSubmitted && activeQuestion.lockAfterSubmit}
                                                    class={`p-4 rounded-2xl font-black text-lg border-2 transition ${
                                                        myAnswer === opt 
                                                        ? 'bg-indigo-600 text-white border-indigo-600' 
                                                        : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                                                    }`}
                                                >
                                                    {opt}
                                                </button>
                                            ))}
                                        </div>

                                        <button 
                                            onClick={() => submitResponse(myAnswer)}
                                            disabled={!myAnswer || (hasSubmitted && activeQuestion.lockAfterSubmit)}
                                            class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-black rounded-2xl text-base shadow transition"
                                        >
                                            確認提交答案 ✅
                                        </button>
                                    </div>
                                )}

                                {/* Revision Item 3: Short Answer Mode */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-4">
                                        <textarea 
                                            rows={3} 
                                            value={myAnswer}
                                            onChange={(e) => setMyAnswer(e.target.value)}
                                            disabled={hasSubmitted && activeQuestion.lockAfterSubmit}
                                            placeholder="請輸入您的回答..."
                                            class="w-full p-4 border rounded-2xl focus:ring-2 focus:ring-indigo-500 font-medium"
                                        />
                                        <button 
                                            onClick={() => submitResponse(myAnswer)}
                                            disabled={!myAnswer.trim() || (hasSubmitted && activeQuestion.lockAfterSubmit)}
                                            class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-black rounded-2xl text-base shadow transition"
                                        >
                                            確認提交短答 ✅
                                        </button>
                                    </div>
                                )}

                                {/* Revision Item 1: Whiteboard Canvas with 1280x720 precision */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <WhiteboardCanvas 
                                        bgImage={activeQuestion.whiteboardBg}
                                        onConfirmSubmit={(wbData) => submitResponse(wbData)}
                                    />
                                )}

                                {/* Revision Item 5: Audio Recording Flow */}
                                {activeQuestion.mode === 'AUDIO' && (
                                    <div class="space-y-4 text-center">
                                        {!audioUrl ? (
                                            <div class="space-y-3">
                                                <button 
                                                    onClick={isRecording ? stopRecording : startRecording}
                                                    class={`w-28 h-28 rounded-full font-bold text-white shadow-xl transition ${isRecording ? 'bg-red-600 animate-pulse' : 'bg-cyan-600 hover:bg-cyan-700'}`}
                                                >
                                                    {isRecording ? `⏹️ 停止 (${recordingTime}s)` : '🎤 開始錄音'}
                                                </button>
                                                <p class="text-xs text-slate-400">最多可錄製 10 秒語音</p>
                                            </div>
                                        ) : (
                                            <div class="space-y-4 bg-cyan-50 p-4 rounded-2xl border border-cyan-200">
                                                <div class="text-xs font-bold text-cyan-900">試聽錄音檔：</div>
                                                <audio src={audioUrl} controls class="w-full" />
                                                <div class="flex space-x-2">
                                                    <button 
                                                        onClick={() => { setAudioBlob(null); setAudioUrl(null); }}
                                                        class="flex-1 py-3 bg-red-100 text-red-700 font-bold rounded-xl text-sm"
                                                    >
                                                        🗑️ 刪除重錄
                                                    </button>
                                                    <button 
                                                        onClick={handleConfirmAudioSubmit}
                                                        class="flex-1 py-3 bg-emerald-600 text-white font-bold rounded-xl text-sm shadow"
                                                    >
                                                        ✅ 確認提交錄音
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Revision Item 19: Challenge Question Student Display & Auto-grading Review */}
                                {activeQuestion.mode === 'CHALLENGE' && (
                                    <div class="space-y-5">
                                        {!hasSubmitted ? (
                                            <div class="space-y-4 max-h-96 overflow-y-auto pr-1">
                                                {activeQuestion.challenge.questions.map((q) => (
                                                    <div key={q.num} class="p-4 bg-slate-50 rounded-2xl border space-y-2 text-sm">
                                                        <div class="font-bold text-slate-800">{q.num}. {q.text}</div>
                                                        <div class="grid grid-cols-2 gap-2">
                                                            {q.options.map((opt) => (
                                                                <button 
                                                                    key={opt.letter}
                                                                    onClick={() => setChallengeAnswers(prev => ({ ...prev, [q.num]: opt.letter }))}
                                                                    class={`p-2.5 rounded-xl border font-bold text-xs text-left transition ${
                                                                        challengeAnswers[q.num] === opt.letter 
                                                                        ? 'bg-amber-600 text-white border-amber-600' 
                                                                        : 'bg-white text-slate-700 border-slate-200'
                                                                    }`}
                                                                >
                                                                    {opt.letter}. {opt.text}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}
                                                <button 
                                                    onClick={handleAutoSubmitChallenge}
                                                    class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-2xl text-base shadow"
                                                >
                                                    ✅ 確認提交整份考卷
                                                </button>
                                            </div>
                                        ) : (
                                            <div class="space-y-4">
                                                {activeQuestion.challenge.scoresReleased || activeQuestion.challenge.releaseInstant ? (
                                                    <div class="space-y-3">
                                                        <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl text-center">
                                                            <div class="text-xs font-bold text-emerald-800">挑戰題得分概況：</div>
                                                            <div class="text-3xl font-black text-emerald-600">
                                                                {existingResponse?.scoreDetails?.totalScore || 0} / {activeQuestion.challenge.totalScore} 分
                                                            </div>
                                                        </div>

                                                        <div class="space-y-3 max-h-80 overflow-y-auto">
                                                            {activeQuestion.challenge.questions.map((q) => {
                                                                const myAns = challengeAnswers[q.num] || existingResponse?.answer?.[q.num];
                                                                const isCorrect = (myAns === q.answer);

                                                                return (
                                                                    <div key={q.num} class={`p-3.5 rounded-2xl border text-xs space-y-1.5 ${isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-red-50 border-red-200'}`}>
                                                                        <div class="font-bold">{q.num}. {q.text}</div>
                                                                        <div class="space-y-1">
                                                                            {q.options.map(opt => {
                                                                                let optClass = 'text-slate-600';
                                                                                if (opt.letter === q.answer) optClass = 'text-emerald-700 font-black bg-emerald-100 px-2 py-0.5 rounded';
                                                                                if (opt.letter === myAns && !isCorrect) optClass = 'text-red-700 font-black bg-red-100 px-2 py-0.5 rounded';

                                                                                return (
                                                                                    <div key={opt.letter} class={optClass}>
                                                                                        {opt.letter}. {opt.text} {opt.letter === q.answer ? '(正確答案)' : ''} {opt.letter === myAns && !isCorrect ? '(您的選擇 - 錯誤)' : ''}
                                                                                    </div>
                                                                                );
                                                                            })}
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div class="p-6 text-center bg-amber-50 rounded-2xl border border-amber-200 text-amber-900 font-bold">
                                                        已成功交卷！分數將於所有同學完成後由老師一併發放...
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Revision Item 22.3.4: Team Challenge Student Screen */}
                                {activeQuestion.mode === 'TEAM' && (
                                    <div class="space-y-4">
                                        {activeQuestion.stage === 'GROUPING' && (
                                            <div class="text-center p-6 bg-purple-50 rounded-2xl border border-purple-200 space-y-3">
                                                <div class="text-4xl">{myGroup?.preset?.emoji || '🤝'}</div>
                                                <h3 class="text-xl font-black text-purple-900">
                                                    您被分配在：{myGroup?.preset?.name || '分組中...'}
                                                </h3>
                                                <p class="text-xs font-bold text-slate-500">
                                                    盡快與你的組員會合!比賽即將開始!
                                                </p>
                                            </div>
                                        )}

                                        {activeQuestion.stage === 'RACE' && (
                                            <div class="space-y-4">
                                                {activeQuestion.winnerGroup ? (
                                                    <div class="text-center p-6 bg-amber-50 rounded-2xl border-2 border-amber-400 space-y-2 animate-bounce">
                                                        <div class="text-5xl">🏆</div>
                                                        <h3 class="text-2xl font-black text-amber-900">
                                                            勝出組別：{activeQuestion.winnerGroup.preset.name}！
                                                        </h3>
                                                        <div class="text-xs font-bold text-slate-600">
                                                            組員：{activeQuestion.winnerGroup.members.map(m => `${m.seatNumber}號 ${m.name}`).join(', ')}
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div class="space-y-3">
                                                        <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100 flex justify-between items-center text-xs font-bold text-indigo-900">
                                                            <span>組別：{myGroup?.preset?.emoji} {myGroup?.preset?.name}</span>
                                                            <span>當前進度：第 {(myGroup?.progress || 0) + 1} 題</span>
                                                        </div>

                                                        {/* Divide question content based on member index */}
                                                        {activeQuestion.teamData?.questions?.[myGroup?.progress || 0] && (() => {
                                                            const currentQ = activeQuestion.teamData.questions[myGroup?.progress || 0];
                                                            
                                                            return (
                                                                <div class="bg-slate-50 p-4 rounded-2xl border space-y-3">
                                                                    {myMemberIndex === 0 && (
                                                                        <div class="bg-white p-3 rounded-xl border font-bold text-slate-800 text-sm">
                                                                            題目：{currentQ.text}
                                                                        </div>
                                                                    )}

                                                                    <div class="grid grid-cols-2 gap-2">
                                                                        {currentQ.options.map((opt, idx) => {
                                                                            if (myMemberIndex === 1 && idx >= 2) return null; // Member 2 sees A, B
                                                                            if (myMemberIndex === 2 && idx < 2) return null;  // Member 3 sees C, D

                                                                            return (
                                                                                <button 
                                                                                    key={opt.letter}
                                                                                    onClick={() => handleTeamAnswerSelect(opt.letter, currentQ)}
                                                                                    class="p-3 bg-white hover:bg-indigo-50 border rounded-xl font-bold text-xs text-left shadow-sm"
                                                                                >
                                                                                    {opt.letter}. {opt.text}
                                                                                </button>
                                                                            );
                                                                        })}
                                                                    </div>
                                                                    <p class="text-xs text-slate-400 text-center">（三位組員需要互相溝通合作才能選出正確答案！）</p>
                                                                </div>
                                                            );
                                                        })()}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Revision Item 6: Uniform submission feedback banner */}
                                {hasSubmitted && (
                                    <div class="bg-emerald-50 border-2 border-emerald-300 p-4 rounded-2xl text-center space-y-1 animate-pulse">
                                        <div class="font-black text-emerald-800 text-base">
                                            🎉 已提交答案! 讚賞你的努力! 安靜等候老師指示...
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
