                                        </div>
                                    ) : (
                                        <div class="text-slate-400 text-sm font-bold">點擊下方按鈕開始抽籤</div>
                                    )}
                                </div>

                                <div class="flex space-x-2">
                                    <button 
                                        onClick={handleSpinRandom}
                                        disabled={isSpinning}
                                        class="flex-1 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-xl shadow-md transition disabled:opacity-50"
                                    >
                                        {isSpinning ? '抽籤中...' : '🎲 抽出一位學號'}
                                    </button>
                                    <button 
                                        onClick={() => { setDrawnNumbers([]); setCurrentDrawn(null); }}
                                        class="px-4 py-3.5 bg-slate-200 text-slate-700 font-bold rounded-xl text-xs"
                                    >
                                        重置
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Student Interface Component
        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
            const [myAnswer, setMyAnswer] = useState('');
            const [submitted, setSubmitted] = useState(false);
            const [submitTime, setSubmitTime] = useState(null);

            // Audio recorder states
            const [isRecording, setIsRecording] = useState(false);
            const [recordedAudioUrl, setRecordedAudioUrl] = useState(null);
            const [recordingTime, setRecordingTime] = useState(0);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);
            const timerRef = useRef(null);

            // Challenge answers map: { qIndex: chosenOption }
            const [challengeAnswers, setChallengeAnswers] = useState({});

            // Collaborative Team question answer stage
            const [teamAnswers, setTeamAnswers] = useState({});

            const resKey = activeQuestion ? `${activeQuestion.id}_${studentId}` : null;
            const existingRes = resKey ? responses[resKey] : null;

            useEffect(() => {
                if (existingRes) {
                    setSubmitted(true);
                    setMyAnswer(existingRes.answer);
                } else {
                    setSubmitted(false);
                    setMyAnswer('');
                    setRecordedAudioUrl(null);
                    setChallengeAnswers({});
                }
            }, [activeQuestion?.id, existingRes]);

            const submitResponseToFirestore = async (answerVal, extraDetails = null) => {
                if (!activeQuestion) return;
                const appId = "omit-8c173";
                const db = window.fbDb;

                const durationSec = ((Date.now() - activeQuestion.startTime) / 1000).toFixed(1);

                const responseObj = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName,
                    answer: answerVal,
                    duration: durationSec,
                    submittedAt: Date.now(),
                    ...extraDetails
                };

                const docRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', `${activeQuestion.id}_${studentId}`);
                await window.fbUtils.setDoc(docRef, responseObj);

                setSubmitted(true);
                playSound('win');
            };

            // Audio Recording API logic
            const startAudioRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            setRecordedAudioUrl(reader.result);
                        };
                        reader.readAsDataURL(blob);
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                    setRecordingTime(0);

                    timerRef.current = setInterval(() => {
                        setRecordingTime(t => {
                            if (t >= 9) {
                                stopAudioRecording();
                                return 10;
                            }
                            return t + 1;
                        });
                    }, 1000);
                } catch (e) {
                    showToast("無法存取麥克風，請檢查權限設定", "error");
                }
            };

            const stopAudioRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                    clearInterval(timerRef.current);
                }
            };

            const handleChallengeSubmit = () => {
                if (!activeQuestion?.challenge) return;
                const questions = activeQuestion.challenge.questions;
                let correctCount = 0;

                questions.forEach((q, idx) => {
                    if (challengeAnswers[idx] === q.answer) correctCount++;
                });

                const totalScore = activeQuestion.challenge.totalScore;
                const earnedScore = Math.round((correctCount / questions.length) * totalScore);
                const pct = Math.round((correctCount / questions.length) * 100);

                submitResponseToFirestore('CHALLENGE_SUBMITTED', {
                    scoreDetails: {
                        earnedScore: earnedScore,
                        totalScore: totalScore,
                        correctCount: correctCount,
                        totalQuestions: questions.length,
                        percentage: pct,
                        studentChoices: challengeAnswers
                    }
                });
            };

            const myGroup = useMemo(() => {
                if (activeQuestion?.mode !== 'TEAM' || !activeQuestion.groups) return null;
                return activeQuestion.groups.find(g => g.members.some(m => m.id === studentId));
            }, [activeQuestion, studentId]);

            const myGroupMemberIndex = useMemo(() => {
                if (!myGroup) return 0;
                return myGroup.members.findIndex(m => m.id === studentId);
            }, [myGroup, studentId]);

            return (
                <div class="min-h-screen bg-slate-100 pb-12 flex flex-col">
                    {/* Header */}
                    <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <span class="font-black text-xl">OMIT</span>
                            <span class="text-xs bg-white/20 px-2 py-1 rounded-full font-bold">學號 {seatNumber} ({studentName})</span>
                        </div>
                        <button onClick={onExit} class="text-xs bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-xl font-bold">
                            退出
                        </button>
                    </header>

                    {/* Teacher Broadcast Demo Whiteboard Overlay */}
                    {activeQuestion?.teacherDemoBroadcast && (
                        <div class="p-4 bg-fuchsia-900 text-white space-y-2 animate-fade-in">
                            <div class="flex items-center justify-between">
                                <span class="font-black text-sm flex items-center gap-1.5">
                                    <span>📡 教師正在廣播示範白板：</span>
                                </span>
                            </div>
                            <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden border-2 border-fuchsia-400">
                                <img src={activeQuestion.teacherDemoBroadcast} class="w-full h-full object-contain" alt="示範白板" />
                            </div>
                        </div>
                    )}

                    {/* Peer Assessment Broadcast Submissions Overlay */}
                    {activeQuestion?.broadcastedSubmission && (
                        <div class="p-4 bg-purple-900 text-white space-y-2 animate-fade-in">
                            <div class="flex items-center justify-between">
                                <span class="font-black text-sm flex items-center gap-1.5">
                                    <span>📢 全班同學作品展示 (同學互評)：</span>
                                    <span>{activeQuestion.broadcastedSubmission.seatNumber}號 {activeQuestion.broadcastedSubmission.name}</span>
                                </span>
                            </div>
                            {activeQuestion.broadcastedSubmission.answer.startsWith('data:image') ? (
                                <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden border-2 border-purple-400">
                                    <img src={activeQuestion.broadcastedSubmission.answer} class="w-full h-full object-contain" alt="廣播作品" />
                                </div>
                            ) : (
                                <div class="p-4 bg-white text-slate-800 rounded-2xl font-bold text-lg">
                                    {activeQuestion.broadcastedSubmission.answer}
                                </div>
                            )}
                        </div>
                    )}

                    <main class="flex-1 max-w-2xl w-full mx-auto p-4 md:p-6 space-y-6">

                        {/* Unified Submission Feedback Message */}
                        {submitted && activeQuestion?.mode !== 'TEAM' && (
                            <div class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white p-6 rounded-3xl shadow-xl text-center space-y-2 animate-bounce">
                                <div class="text-4xl">🎉</div>
                                <h3 class="text-xl font-black">已提交答案! 讚賞你的努力!</h3>
                                <p class="text-xs text-emerald-100 font-bold">安靜等候老師指示...</p>
                            </div>
                        )}

                        {!activeQuestion ? (
                            <div class="bg-white rounded-3xl p-12 text-center space-y-4 shadow-sm border border-slate-200 my-auto">
                                <div class="text-6xl animate-pulse">⏳</div>
                                <h2 class="text-xl font-black text-slate-800">未有發佈題目</h2>
                                <p class="text-slate-400 text-sm font-medium">請保持畫面開啟，耐心等待老師發佈內容...</p>
                            </div>
                        ) : (
                            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-6">
                                <div class="border-b pb-3 flex justify-between items-center">
                                    <span class="bg-indigo-100 text-indigo-700 text-xs font-black px-3 py-1 rounded-full">
                                        {getModeLabel(activeQuestion.mode)}
                                    </span>
                                </div>

                                <h2 class="text-xl font-black text-slate-800 leading-relaxed">
                                    {activeQuestion.text}
                                </h2>

                                {/* CHOICE or TF */}
                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div class="space-y-4">
                                        <div class="grid grid-cols-1 gap-3">
                                            {activeQuestion.choiceOptions.map((opt) => (
                                                <button 
                                                    key={opt}
                                                    disabled={submitted && activeQuestion.lockAfterSubmit}
                                                    onClick={() => setMyAnswer(opt)}
                                                    class={`p-4 rounded-2xl font-black text-lg border-2 transition text-left flex items-center justify-between ${
                                                        myAnswer === opt 
                                                        ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' 
                                                        : 'bg-slate-50 text-slate-700 border-slate-200 hover:border-slate-300'
                                                    }`}
                                                >
                                                    <span>{opt}</span>
                                                    {myAnswer === opt && <span>✓</span>}
                                                </button>
                                            ))}
                                        </div>

                                        {(!submitted || !activeQuestion.lockAfterSubmit) && (
                                            <button 
                                                onClick={() => submitResponseToFirestore(myAnswer)}
                                                disabled={!myAnswer}
                                                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-emerald-200 text-base transition disabled:opacity-50 active:scale-98"
                                            >
                                                確認提交
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* SHORT ANSWER */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-4">
                                        <textarea 
                                            rows={4}
                                            disabled={submitted && activeQuestion.lockAfterSubmit}
                                            placeholder="請在此輸入您的回答..."
                                            value={myAnswer}
                                            onChange={(e) => setMyAnswer(e.target.value)}
                                            class="w-full p-4 rounded-2xl border-2 border-slate-200 focus:outline-none focus:border-indigo-500 font-medium text-slate-800"
                                        />

                                        {(!submitted || !activeQuestion.lockAfterSubmit) && (
                                            <button 
                                                onClick={() => submitResponseToFirestore(myAnswer)}
                                                disabled={!myAnswer.trim()}
                                                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-emerald-200 text-base transition disabled:opacity-50 active:scale-98"
                                            >
                                                確認提交
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* WHITEBOARD DRAW */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <WhiteboardCanvas 
                                        readOnly={submitted && activeQuestion.lockAfterSubmit}
                                        bgImage={activeQuestion.whiteboardBg}
                                        onConfirmSubmit={(dataUrl) => submitResponseToFirestore(dataUrl)}
                                        lockSubmit={activeQuestion.lockAfterSubmit}
                                    />
                                )}

                                {/* BUZZER */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="text-center py-6 space-y-4">
                                        <button 
                                            disabled={submitted}
                                            onClick={() => submitResponseToFirestore('BUZZER_PRESSED')}
                                            class={`w-48 h-48 rounded-full border-8 font-black text-3xl shadow-2xl transition-all transform active:scale-90 ${
                                                submitted 
                                                ? 'bg-slate-300 border-slate-400 text-slate-500 cursor-not-allowed' 
                                                : 'bg-rose-500 hover:bg-rose-600 border-rose-300 text-white animate-pulse'
                                            }`}
                                        >
                                            {submitted ? '已搶答' : '🚨 搶答！'}
                                        </button>
                                    </div>
                                )}

                                {/* AUDIO RECORDING */}
                                {activeQuestion.mode === 'AUDIO' && (
                                    <div class="space-y-5 text-center">
                                        {!recordedAudioUrl ? (
                                            <div class="space-y-4">
                                                <button 
                                                    onClick={isRecording ? stopAudioRecording : startAudioRecording}
                                                    class={`w-32 h-32 rounded-full border-4 font-black text-base shadow-xl mx-auto flex flex-col items-center justify-center transition active:scale-95 ${
                                                        isRecording 
                                                        ? 'bg-rose-600 border-rose-300 text-white animate-pulse' 
                                                        : 'bg-indigo-600 border-indigo-200 text-white hover:bg-indigo-700'
                                                    }`}
                                                >
                                                    <span class="text-3xl">{isRecording ? '⏹️' : '🎤'}</span>
                                                    <span>{isRecording ? `錄音中 (${recordingTime}s)` : '開始錄音'}</span>
                                                </button>
                                                <p class="text-xs text-slate-400 font-bold">上限為 10 秒</p>
                                            </div>
                                        ) : (
                                            <div class="space-y-4 bg-slate-50 p-4 rounded-2xl border">
                                                <div class="text-xs font-bold text-slate-500">錄音試聽播放器：</div>
                                                <audio src={recordedAudioUrl} controls class="w-full" />
                                                
                                                {(!submitted || !activeQuestion.lockAfterSubmit) && (
                                                    <div class="flex space-x-2">
                                                        <button 
                                                            onClick={() => setRecordedAudioUrl(null)}
                                                            class="flex-1 py-3 bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold rounded-xl text-sm"
                                                        >
                                                            🗑️ 刪除重錄
                                                        </button>
                                                        <button 
                                                            onClick={() => submitResponseToFirestore(recordedAudioUrl)}
                                                            class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl text-sm shadow"
                                                        >
                                                            ✅ 確認提交錄音
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* CHALLENGE MODE STUDENT VIEW */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                    <div class="space-y-6">
                                        <div class="space-y-4">
                                            {activeQuestion.challenge.questions.map((q, idx) => {
                                                const studentChoice = challengeAnswers[idx];

                                                return (
                                                    <div key={idx} class="bg-slate-50 p-4 rounded-2xl border space-y-3">
                                                        <div class="font-bold text-slate-800 text-sm">
                                                            {q.num || idx + 1}. {q.text}
                                                        </div>

                                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                            {q.options.map((opt) => {
                                                                const isChosen = studentChoice === opt.letter;
                                                                const isCorrectOpt = q.answer === opt.letter;

                                                                let btnStyle = "bg-white text-slate-700 border-slate-200";

                                                                if (submitted && activeQuestion.challenge.scoresReleased) {
                                                                    if (isCorrectOpt) {
                                                                        btnStyle = "bg-emerald-500 text-white border-emerald-600 font-bold";
                                                                    } else if (isChosen && !isCorrectOpt) {
                                                                        btnStyle = "bg-red-500 text-white border-red-600 font-bold";
                                                                    }
                                                                } else if (isChosen) {
                                                                    btnStyle = "bg-indigo-600 text-white border-indigo-600 font-bold";
                                                                }

                                                                return (
                                                                    <button 
                                                                        key={opt.letter}
                                                                        disabled={submitted}
                                                                        onClick={() => setChallengeAnswers(prev => ({ ...prev, [idx]: opt.letter }))}
                                                                        class={`p-3 rounded-xl border-2 text-xs text-left transition flex items-center justify-between ${btnStyle}`}
                                                                    >
                                                                        <span>{opt.letter}. {opt.text}</span>
                                                                        {submitted && activeQuestion.challenge.scoresReleased && (
                                                                            <span class="text-xs font-mono font-bold">
                                                                                {isCorrectOpt ? ' (正確答案)' : isChosen ? ' (你的選擇)' : ''}
                                                                            </span>
                                                                        )}
                                                                    </button>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        {!submitted && (
                                            <button 
                                                onClick={handleChallengeSubmit}
                                                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-emerald-200 text-base transition active:scale-98"
                                            >
                                                ✅ 完成並提交整份挑戰題
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* COLLABORATIVE TEAM COMPETITION STUDENT VIEW ("合作題") */}
                                {activeQuestion.mode === 'TEAM' && (
                                    <div class="space-y-4">
                                        {myGroup ? (
                                            <div class="space-y-4">
                                                <div class={`p-4 rounded-2xl border-2 ${myGroup.color} ${myGroup.border} shadow-md text-center space-y-1`}>
                                                    <div class="text-2xl">{myGroup.emoji}</div>
                                                    <div class="font-black text-xl">{myGroup.name}</div>
                                                    <p class="text-xs font-bold opacity-90">
                                                        提示：盡快與你的組員會合！比賽即將開始！
                                                    </p>
                                                </div>

                                                {activeQuestion.stage === 'RACE' && (
                                                    <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100 text-center space-y-3">
                                                        <div class="text-xs font-bold text-indigo-700">
                                                            🤝 團隊分工合作模式：
                                                        </div>
                                                        <p class="text-sm font-bold text-slate-800">
                                                            每一位組員的螢幕顯示不同題目/選項資訊，請與同組組員密切溝通合作！
                                                        </p>
                                                    </div>
                                                )}
                                            </div>
                                        ) : (
                                            <div class="text-center py-6 text-slate-400 font-bold">
                                                正在分配小組中...
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* PUSHED LINK / YOUTUBE EMBED */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div class="space-y-4 text-center">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div class="aspect-16-9 w-full rounded-2xl overflow-hidden border shadow-lg">
                                                <iframe 
                                                    src={activeQuestion.youtubeEmbed} 
                                                    class="w-full h-full"
                                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                                    allowFullScreen
                                                />
                                            </div>
                                        ) : null}

                                        {activeQuestion.pushedUrl && (
                                            <a 
                                                href={activeQuestion.pushedUrl} 
                                                target="_blank" 
                                                rel="noopener noreferrer"
                                                class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-black px-6 py-3.5 rounded-2xl shadow-lg transition"
                                            >
                                                開啟連結網站 ↗
                                            </a>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
