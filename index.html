        // --- Student Interface Component ---
        function StudentInterface({ 
            roomCode, studentName, seatNumber, studentId, 
            activeQuestion, responses, coopState, teacherWhiteboardBroadcast, showToast, onExit 
        }) {
            const [shortAnswerText, setShortAnswerText] = useState('');
            const [selectedChoice, setSelectedChoice] = useState('');
            const [audioBlob, setAudioBlob] = useState(null);
            const [audioUrl, setAudioUrl] = useState(null);
            const [isRecording, setIsRecording] = useState(false);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            // Challenge answers state
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [challengeTimeRemaining, setChallengeTimeRemaining] = useState(null);

            // Response key calculation
            const responseKey = activeQuestion ? `${activeQuestion.id}_${studentId}` : null;
            const myResponse = responseKey ? responses[responseKey] : null;

            // Timer for Challenge question
            useEffect(() => {
                if (activeQuestion?.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer && !myResponse) {
                    const limit = activeQuestion.challenge.timeLimit || 120;
                    const elapsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                    const remain = Math.max(0, limit - elapsed);
                    setChallengeTimeRemaining(remain);

                    const timer = setInterval(() => {
                        setChallengeTimeRemaining(r => {
                            if (r <= 1) {
                                clearInterval(timer);
                                handleSubmitChallengeAnswers(true);
                                return 0;
                            }
                            return r - 1;
                        });
                    }, 1000);

                    return () => clearInterval(timer);
                }
            }, [activeQuestion, myResponse]);

            // Submit generic response
            const handleSubmitAnswer = async (ansVal) => {
                if (!activeQuestion) return;
                const duration = ((Date.now() - activeQuestion.startTime) / 1000).toFixed(1);

                const payload = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: ansVal,
                    duration: duration,
                    submittedAt: Date.now()
                };

                const appId = "omit-8c173";
                const db = window.fbDb;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', responseKey);
                await window.fbUtils.setDoc(resDocRef, payload);

                showToast("已成功提交答案！讚賞你的努力！", "success");
            };

            // Challenge submission handler
            const handleSubmitChallengeAnswers = async (isAutoSubmit = false) => {
                if (!activeQuestion || !activeQuestion.challenge || myResponse) return;

                const questions = activeQuestion.challenge.questions;
                let correctCount = 0;
                const perQuestionDetails = {};

                questions.forEach((q, idx) => {
                    const myAns = challengeAnswers[idx] || '';
                    const isCorrect = myAns === q.answer;
                    if (isCorrect) correctCount++;
                    perQuestionDetails[idx] = { myAns, correctAns: q.answer, isCorrect };
                });

                const totalScore = Math.round((correctCount / questions.length) * activeQuestion.challenge.totalScore);
                const percentage = Math.round((correctCount / questions.length) * 100);
                const duration = ((Date.now() - activeQuestion.startTime) / 1000).toFixed(1);

                const payload = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: `已作答 (${correctCount}/${questions.length} 題)`,
                    duration: duration,
                    submittedAt: Date.now(),
                    scoreDetails: {
                        totalScore: totalScore,
                        percentage: percentage,
                        correctCount: correctCount,
                        totalQuestions: questions.length,
                        perQuestion: perQuestionDetails
                    }
                };

                const appId = "omit-8c173";
                const db = window.fbDb;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', responseKey);
                await window.fbUtils.setDoc(resDocRef, payload);

                showToast(isAutoSubmit ? "時間到！已為您自動收卷提交挑戰題！" : "已成功提交挑戰題！", "success");
            };

            // Audio recording triggers
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => audioChunksRef.current.push(e.data);
                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const url = URL.createObjectURL(blob);
                        setAudioBlob(blob);
                        setAudioUrl(url);
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                } catch (err) {
                    showToast("無法存取麥克風設備", "error");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const handleAudioConfirmSubmit = () => {
                if (!audioBlob) return;
                const reader = new FileReader();
                reader.onloadend = () => {
                    handleSubmitAnswer(reader.result);
                };
                reader.readAsDataURL(audioBlob);
            };

            // Cooperative Mode Student Grouping & Question Logic
            const myCoopGroup = useMemo(() => {
                if (!coopState || !coopState.groups) return null;
                return coopState.groups.find(g => g.members.some(m => m.id === studentId || m.seatNumber === seatNumber));
            }, [coopState, studentId, seatNumber]);

            const handleCoopSubmitAnswer = async (selectedLetter) => {
                if (!coopState || !myCoopGroup || coopState.phase !== 'MATCH') return;

                const currentQ = coopState.questions[myCoopGroup.currentQIndex];
                if (!currentQ) return;

                const isCorrect = selectedLetter === currentQ.answer;
                const updatedGroups = coopState.groups.map(g => {
                    if (g.id === myCoopGroup.id) {
                        if (isCorrect) {
                            const nextIdx = g.currentQIndex + 1;
                            const finished = nextIdx >= coopState.questions.length;
                            return { ...g, currentQIndex: nextIdx, isFinished: finished };
                        } else {
                            // WRONG answer resets to Q1 (0)!
                            return { ...g, currentQIndex: 0 };
                        }
                    }
                    return g;
                });

                const winner = updatedGroups.find(g => g.isFinished);
                const updatedCoopState = {
                    ...coopState,
                    groups: updatedGroups,
                    winnerGroup: winner || coopState.winnerGroup
                };

                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { coopState: updatedCoopState }, { merge: true });

                if (isCorrect) {
                    showToast("恭喜答對！繼續下一題！🎉", "success");
                } else {
                    showToast("答錯了！需要歸零倒扣重頭開始！繼續努力！💪", "error");
                }
            };

            return (
                <div class="min-h-screen bg-slate-100 pb-12">
                    {/* Student Top Header */}
                    <header class="bg-indigo-900 text-white p-4 shadow-md sticky top-0 z-30">
                        <div class="max-w-3xl mx-auto flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <span class="bg-indigo-600 px-2.5 py-1 rounded-lg text-xs font-black">學生端</span>
                                <h1 class="font-black text-base truncate">
                                    {seatNumber}號 {studentName || '學生'}
                                </h1>
                            </div>
                            <div class="flex items-center space-x-3">
                                <span class="bg-white/10 px-3 py-1 rounded-full text-xs font-mono">房號: {roomCode}</span>
                                <button onClick={onExit} class="text-xs bg-rose-600 hover:bg-rose-700 px-3 py-1 rounded-lg font-bold">退出</button>
                            </div>
                        </div>
                    </header>

                    {/* Peer Review / Student Submission Broadcast Overlay */}
                    {activeQuestion?.broadcastedSubmission && (
                        <div class="bg-amber-400 text-amber-950 p-4 shadow-xl border-b-4 border-amber-600 animate-pulse">
                            <div class="max-w-3xl mx-auto space-y-2 text-center">
                                <span class="text-xs font-black uppercase tracking-wider bg-amber-950 text-white px-3 py-1 rounded-full">📢 全班作品廣播互評</span>
                                <h3 class="font-extrabold text-lg">
                                    正在展示 {activeQuestion.broadcastedSubmission.seatNumber}號 {activeQuestion.broadcastedSubmission.name} 的作品：
                                </h3>
                                <div class="bg-white p-4 rounded-2xl border-2 border-amber-500 shadow-inner max-w-2xl mx-auto">
                                    {typeof activeQuestion.broadcastedSubmission.answer === 'string' && activeQuestion.broadcastedSubmission.answer.startsWith('data:image') ? (
                                        <img src={activeQuestion.broadcastedSubmission.answer} alt="Broadcasted Work" class="w-full max-h-80 object-contain rounded-xl" />
                                    ) : (
                                        <p class="text-2xl font-black text-slate-800 py-4 whitespace-pre-wrap">
                                            "{activeQuestion.broadcastedSubmission.answer}"
                                        </p>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Teacher Demonstration Whiteboard Broadcast Overlay */}
                    {teacherWhiteboardBroadcast && (
                        <div class="bg-purple-900 text-white p-4 shadow-xl border-b-4 border-purple-500">
                            <div class="max-w-3xl mx-auto space-y-2 text-center">
                                <span class="text-xs font-black uppercase tracking-wider bg-purple-500 text-white px-3 py-1 rounded-full">🎨 教師即時示範白板</span>
                                <div class="bg-white p-2 rounded-2xl border-2 border-purple-400 shadow-2xl">
                                    <img src={teacherWhiteboardBroadcast} alt="Teacher Whiteboard" class="w-full max-h-96 object-contain rounded-xl" />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Main Student Interaction View */}
                    <main class="max-w-3xl mx-auto p-4 md:p-6 space-y-6">

                        {/* Cooperative Mode Student View ("合作題") */}
                        {coopState && (
                            <div class="bg-white rounded-3xl p-6 shadow-xl border-2 border-emerald-200 space-y-6">
                                <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-200 text-center space-y-2">
                                    <span class="text-xs font-bold text-emerald-700 bg-emerald-200 px-3 py-1 rounded-full uppercase">🤝 合作題小組競賽</span>
                                    {myCoopGroup ? (
                                        <div>
                                            <h2 class="text-2xl font-black text-emerald-950">
                                                你被分配在：<span class={`px-3 py-1 rounded-xl text-white ${myCoopGroup.color}`}>{myCoopGroup.emoji} {myCoopGroup.name}</span>
                                            </h2>
                                            <p class="text-xs font-bold text-emerald-800 mt-2 animate-bounce">
                                                盡快與你的組員會合！比賽進行中！
                                            </p>
                                        </div>
                                    ) : (
                                        <p class="text-sm font-bold text-slate-600">正在分組中，請稍候...</p>
                                    )}
                                </div>

                                {coopState.phase === 'MATCH' && myCoopGroup && !coopState.winnerGroup && (
                                    <div class="space-y-6">
                                        {/* Display Question / Options distributed among team members */}
                                        {(() => {
                                            const currentQ = coopState.questions[myCoopGroup.currentQIndex];
                                            if (!currentQ) return <div class="text-center font-bold text-slate-500">已完成所有題目！</div>;

                                            const members = myCoopGroup.members;
                                            const myIndexInGroup = members.findIndex(m => m.id === studentId || m.seatNumber === seatNumber);
                                            const roleType = myIndexInGroup % 3; // 0: Sees Question, 1: Sees A & B, 2: Sees C & D

                                            return (
                                                <div class="space-y-5">
                                                    <div class="flex items-center justify-between text-xs font-bold text-slate-500 border-b pb-2">
                                                        <span>第 {currentQ.num} / {coopState.questions.length} 題</span>
                                                        <span>組員人數: {members.length} 人</span>
                                                    </div>

                                                    {/* Screen Content based on role */}
                                                    {roleType === 0 ? (
                                                        <div class="bg-indigo-50 p-6 rounded-2xl border-2 border-indigo-200 text-center space-y-3">
                                                            <span class="bg-indigo-600 text-white text-xs px-3 py-1 rounded-full font-bold">你的專屬任務：朗讀問題</span>
                                                            <p class="text-xl font-black text-indigo-950 leading-relaxed">
                                                                "{currentQ.text}"
                                                            </p>
                                                            <p class="text-xs text-indigo-700 font-bold">請讀出題目給組員聽，由負責選項的組員點擊作答！</p>
                                                        </div>
                                                    ) : roleType === 1 ? (
                                                        <div class="space-y-3">
                                                            <div class="text-center bg-amber-50 p-3 rounded-xl border text-xs font-bold text-amber-900">
                                                                你的專屬任務：答案選項 A & B
                                                            </div>
                                                            <div class="grid grid-cols-1 gap-3">
                                                                {currentQ.options.slice(0, 2).map((opt) => (
                                                                    <button 
                                                                        key={opt.letter}
                                                                        onClick={() => handleCoopSubmitAnswer(opt.letter)}
                                                                        class="p-4 rounded-2xl bg-white hover:bg-slate-50 border-2 border-indigo-200 font-black text-lg text-slate-800 text-left shadow-sm transition active:scale-98"
                                                                    >
                                                                        {opt.letter}. {opt.text}
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div class="space-y-3">
                                                            <div class="text-center bg-purple-50 p-3 rounded-xl border text-xs font-bold text-purple-900">
                                                                你的專屬任務：答案選項 C & D
                                                            </div>
                                                            <div class="grid grid-cols-1 gap-3">
                                                                {currentQ.options.slice(2, 4).map((opt) => (
                                                                    <button 
                                                                        key={opt.letter}
                                                                        onClick={() => handleCoopSubmitAnswer(opt.letter)}
                                                                        class="p-4 rounded-2xl bg-white hover:bg-slate-50 border-2 border-indigo-200 font-black text-lg text-slate-800 text-left shadow-sm transition active:scale-98"
                                                                    >
                                                                        {opt.letter}. {opt.text}
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })()}
                                    </div>
                                )}

                                {coopState.winnerGroup && (
                                    <div class="bg-amber-100 border-4 border-amber-400 p-6 rounded-3xl text-center space-y-4 shadow-xl">
                                        <div class="text-5xl">🏆</div>
                                        <h3 class="text-3xl font-black text-amber-900">
                                            【{coopState.winnerGroup.emoji} {coopState.winnerGroup.name}】成功奪得第一名勝出！
                                        </h3>
                                        <p class="text-sm font-bold text-amber-800">
                                            成員：{coopState.winnerGroup.members.map(m => `${m.seatNumber}號 ${m.name}`).join('、')}
                                        </p>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Standard Question Answering Card */}
                        {!coopState && activeQuestion && (
                            <div class="bg-white rounded-3xl p-6 shadow-xl border border-slate-200 space-y-6">
                                <div class="flex items-center justify-between border-b pb-3">
                                    <span class="bg-indigo-600 text-white font-black text-xs px-3 py-1 rounded-full">
                                        {getModeLabel(activeQuestion.mode)}
                                    </span>

                                    {activeQuestion.mode === 'CHALLENGE' && challengeTimeRemaining !== null && (
                                        <span class="font-mono font-bold text-sm bg-rose-50 text-rose-600 px-3 py-1 rounded-xl border border-rose-200 animate-pulse">
                                            ⏱️ 倒數限時: {Math.floor(challengeTimeRemaining / 60)}:{(challengeTimeRemaining % 60).toString().padStart(2, '0')}
                                        </span>
                                    )}
                                </div>

                                <h2 class="text-xl font-black text-slate-800 leading-snug">
                                    {activeQuestion.text}
                                </h2>

                                {/* Unified submit state message banner */}
                                {myResponse && (
                                    <div class="bg-emerald-50 border-2 border-emerald-300 p-5 rounded-2xl text-center space-y-2 animate-fade-in">
                                        <div class="text-3xl">🎉</div>
                                        <h3 class="text-lg font-black text-emerald-900">
                                            已提交答案! 讚賞你的努力! 安靜等候老師指示...
                                        </h3>
                                        <p class="text-xs font-bold text-emerald-700">提交用時：{myResponse.duration} 秒</p>
                                    </div>
                                )}

                                {/* Question Mode 1: CHOICE & TF */}
                                {['CHOICE', 'TF'].includes(activeQuestion.mode) && (!myResponse || !activeQuestion.lockAfterSubmit) && (
                                    <div class="space-y-4">
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            {activeQuestion.choiceOptions.map((opt) => (
                                                <button 
                                                    key={opt}
                                                    onClick={() => setSelectedChoice(opt)}
                                                    class={`p-4 rounded-2xl font-black text-lg border-2 transition active:scale-98 text-left ${selectedChoice === opt ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg' : 'bg-slate-50 text-slate-800 border-slate-200'}`}
                                                >
                                                    {opt}
                                                </button>
                                            ))}
                                        </div>

                                        <button 
                                            onClick={() => handleSubmitAnswer(selectedChoice)}
                                            disabled={!selectedChoice}
                                            class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-black py-4 rounded-2xl shadow-lg transition text-base"
                                        >
                                            ✅ 確認提交答案
                                        </button>
                                    </div>
                                )}

                                {/* Question Mode 2: SHORT ANSWER */}
                                {activeQuestion.mode === 'SHORT' && (!myResponse || !activeQuestion.lockAfterSubmit) && (
                                    <div class="space-y-4">
                                        <textarea 
                                            rows={3}
                                            value={shortAnswerText}
                                            onChange={(e) => setShortAnswerText(e.target.value)}
                                            placeholder="請在此輸入您的詳細回答..."
                                            class="w-full p-4 border-2 border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 font-medium text-base"
                                        />
                                        <button 
                                            onClick={() => handleSubmitAnswer(shortAnswerText.trim())}
                                            disabled={!shortAnswerText.trim()}
                                            class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-black py-4 rounded-2xl shadow-lg transition text-base"
                                        >
                                            ✅ 確認提交短答
                                        </button>
                                    </div>
                                )}

                                {/* Question Mode 3: WHITEBOARD CANVAS */}
                                {activeQuestion.mode === 'DRAW' && (!myResponse || !activeQuestion.lockAfterSubmit) && (
                                    <WhiteboardCanvas 
                                        initialBg={activeQuestion.whiteboardBg}
                                        onConfirm={(imgData) => handleSubmitAnswer(imgData)}
                                    />
                                )}

                                {/* Question Mode 4: BUZZER */}
                                {activeQuestion.mode === 'BUZZER' && (!myResponse || !activeQuestion.lockAfterSubmit) && (
                                    <div class="text-center py-6">
                                        <button 
                                            onClick={() => {
                                                playSound('buzzer');
                                                handleSubmitAnswer('搶答！');
                                            }}
                                            class="w-48 h-48 rounded-full bg-rose-600 hover:bg-rose-700 text-white font-black text-3xl shadow-2xl transition active:scale-90 border-8 border-rose-300 animate-pulse mx-auto flex items-center justify-center"
                                        >
                                            🚨 搶答！
                                        </button>
                                    </div>
                                )}

                                {/* Question Mode 5: AUDIO RECORDING */}
                                {activeQuestion.mode === 'AUDIO' && (!myResponse || !activeQuestion.lockAfterSubmit) && (
                                    <div class="space-y-4 text-center">
                                        {!audioUrl ? (
                                            <button 
                                                onClick={isRecording ? stopRecording : startRecording}
                                                class={`px-8 py-4 rounded-2xl font-black text-lg text-white shadow-xl transition ${isRecording ? 'bg-rose-600 animate-pulse' : 'bg-indigo-600 hover:bg-indigo-700'}`}
                                            >
                                                {isRecording ? '⏹️ 停止錄音' : '🎤 開始錄音 (最多10秒)'}
                                            </button>
                                        ) : (
                                            <div class="bg-slate-50 p-4 rounded-2xl border space-y-4">
                                                <audio src={audioUrl} controls class="w-full" />
                                                <div class="flex space-x-3">
                                                    <button 
                                                        onClick={() => { setAudioBlob(null); setAudioUrl(null); }}
                                                        class="w-1/2 py-3 rounded-xl bg-rose-50 text-rose-600 font-bold border border-rose-200"
                                                    >
                                                        🗑️ 刪除重錄
                                                    </button>
                                                    <button 
                                                        onClick={handleAudioConfirmSubmit}
                                                        class="w-1/2 py-3 rounded-xl bg-emerald-600 text-white font-black shadow-md"
                                                    >
                                                        ✅ 確認提交錄音
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Question Mode 6: PUSHED LINK / YOUTUBE */}
                                {activeQuestion.mode === 'LINK' && activeQuestion.pushedUrl && (
                                    <div class="space-y-4">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div class="w-full aspect-16-9 rounded-2xl overflow-hidden shadow-xl border">
                                                <iframe 
                                                    src={activeQuestion.youtubeEmbed} 
                                                    class="w-full h-full" 
                                                    allow="autoplay; encrypted-media" 
                                                    allowFullScreen 
                                                />
                                            </div>
                                        ) : null}

                                        <a 
                                            href={activeQuestion.pushedUrl} 
                                            target="_blank" 
                                            rel="noreferrer"
                                            class="w-full bg-amber-500 hover:bg-amber-600 text-white font-black py-4 rounded-2xl shadow-lg transition flex items-center justify-center space-x-2 text-base"
                                        >
                                            <span>開啟連結網站 ↗</span>
                                        </a>
                                    </div>
                                )}

                                {/* Question Mode 7: CHALLENGE ASSESSMENT */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                    <div class="space-y-6">
                                        {!myResponse ? (
                                            <div class="space-y-5">
                                                {activeQuestion.challenge.questions.map((q, qIdx) => (
                                                    <div key={qIdx} class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-3">
                                                        <div class="font-black text-slate-800 text-base">
                                                            第 {q.num || qIdx + 1} 題: {q.text}
                                                        </div>
                                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                            {q.options.map((opt) => (
                                                                <button 
                                                                    key={opt.letter}
                                                                    type="button"
                                                                    onClick={() => setChallengeAnswers({ ...challengeAnswers, [qIdx]: opt.letter })}
                                                                    class={`p-3 rounded-xl font-bold text-sm border text-left transition ${challengeAnswers[qIdx] === opt.letter ? 'bg-indigo-600 text-white border-indigo-600 shadow' : 'bg-white text-slate-700'}`}
                                                                >
                                                                    {opt.letter}. {opt.text}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}

                                                <button 
                                                    type="button"
                                                    onClick={() => handleSubmitChallengeAnswers(false)}
                                                    class="w-full bg-amber-600 hover:bg-amber-700 text-white font-black py-4 rounded-2xl shadow-xl transition text-lg"
                                                >
                                                    ✅ 確認提交整份挑戰題試卷
                                                </button>
                                            </div>
                                        ) : (
                                            /* Review Results after Score Release */
                                            <div class="space-y-4">
                                                {activeQuestion.challenge.scoresReleased ? (
                                                    <div class="space-y-4">
                                                        <div class="bg-amber-50 border-2 border-amber-300 p-4 rounded-2xl text-center">
                                                            <div class="text-xs font-bold text-amber-800">你的評估總得分：</div>
                                                            <div class="text-4xl font-black text-amber-900 font-mono my-1">
                                                                {myResponse.scoreDetails?.totalScore} / {activeQuestion.challenge.totalScore} 分
                                                            </div>
                                                            <div class="text-xs font-bold text-amber-700">正確率: {myResponse.scoreDetails?.percentage}%</div>
                                                        </div>

                                                        {/* Detailed breakdown per question */}
                                                        <div class="space-y-3">
                                                            {activeQuestion.challenge.questions.map((q, qIdx) => {
                                                                const detail = myResponse.scoreDetails?.perQuestion?.[qIdx];

                                                                return (
                                                                    <div key={qIdx} class="p-4 bg-white rounded-2xl border-2 space-y-2">
                                                                        <div class="font-bold text-sm text-slate-800">
                                                                            第 {q.num || qIdx + 1} 題: {q.text}
                                                                        </div>
                                                                        <div class="grid grid-cols-2 gap-2 text-xs font-bold">
                                                                            {q.options.map((opt) => {
                                                                                const isUserChosen = detail?.myAns === opt.letter;
                                                                                const isCorrectOpt = q.answer === opt.letter;
                                                                                let btnStyle = "bg-slate-50 text-slate-600 border-slate-200";

                                                                                if (isCorrectOpt) btnStyle = "bg-emerald-100 text-emerald-900 border-emerald-400 ring-2 ring-emerald-300";
                                                                                else if (isUserChosen && !isCorrectOpt) btnStyle = "bg-rose-100 text-rose-900 border-rose-400";

                                                                                return (
                                                                                    <div key={opt.letter} class={`p-2.5 rounded-xl border ${btnStyle}`}>
                                                                                        {opt.letter}. {opt.text}
                                                                                        {isCorrectOpt && <span class="ml-1 text-emerald-700">(正確答案)</span>}
                                                                                        {isUserChosen && !isCorrectOpt && <span class="ml-1 text-rose-700">(你的選擇)</span>}
                                                                                    </div>
                                                                                );
                                                                            })}
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div class="bg-amber-50 p-4 rounded-2xl border border-amber-200 text-center font-bold text-amber-900 text-sm">
                                                        ⏳ 成績處理中，請耐心等候教師統一發放成績與答案解析...
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {!coopState && !activeQuestion && (
                            <div class="bg-white rounded-3xl p-12 text-center shadow-lg border border-slate-200 space-y-4">
                                <div class="text-6xl animate-bounce">⏳</div>
                                <h2 class="text-2xl font-black text-slate-800">已進入課室，等候老師發佈題目...</h2>
                                <p class="text-slate-400 text-xs">請保持網頁開啟，題目發佈時將會自動出現在螢幕上</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        // Render React Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
