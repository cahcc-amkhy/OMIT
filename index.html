<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMIT 互動課堂 - 免登入即時課堂互動平台</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            touch-action: manipulation;
        }
        .canvas-container {
            touch-action: none;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .buzzer-btn {
            animation: pulse-ring 2s infinite;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAcphRXxqs_MTeWwffVVOFsnb8Liro5Lto",
            authDomain: "omit-8c173.firebaseapp.com",
            projectId: "omit-8c173",
            storageBucket: "omit-8c173.firebasestorage.app",
            messagingSenderId: "1078509757779",
            appId: "1:1078509757779:web:64fe9465920eca4f38ada6"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Helper: Extract YouTube Embed URL
        function getYouTubeEmbedUrl(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        }

        // Custom Toast Notification Component
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3200);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (
                <div class={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-xl shadow-xl flex items-center space-x-2 text-sm font-medium transition-all animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        function OMITApp() {
            const [role, setRole] = useState('LANDING'); // 'LANDING', 'TEACHER', 'STUDENT'
            const [roomCode, setRoomCode] = useState('');
            const [seatNumber, setSeatNumber] = useState(''); // 1 to 36
            const [studentName, setStudentName] = useState('');
            const [toast, setToast] = useState(null);
            const [user, setUser] = useState(null);

            // Room Shared State
            const [activeQuestion, setActiveQuestion] = useState(null);
            const [studentsList, setStudentsList] = useState([]);
            const [responses, setResponses] = useState({}); // { studentId: { seatNumber, name, answer, timestamp, duration } }
            const [questionHistory, setQuestionHistory] = useState([]); // Array of question snapshots for Export Report
            const [broadcastedResponse, setBroadcastedResponse] = useState(null); // Peer Review broadcast

            const myStudentId = useRef('std_' + Math.random().toString(36).substring(2, 9));

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            // Sign in anonymously on mount
            useEffect(() => {
                auth.signInAnonymously().then((res) => {
                    setUser(res.user);
                }).catch(err => console.error("Firebase Auth Error:", err));
            }, []);

            // Handle QR Code URL Param
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const roomParam = params.get('room');
                if (roomParam) {
                    setRoomCode(roomParam.toUpperCase());
                }
            }, []);

            // Firebase Firestore Firestore Listener
            useEffect(() => {
                if (!roomCode || !user) return;

                // Path Rule: /artifacts/{appId}/public/data/omit_rooms/{roomCode}
                const roomRef = db.collection('artifacts').doc('omit_app').collection('public').doc('data').collection('omit_rooms').doc(roomCode.toUpperCase());

                const unsubscribe = roomRef.onSnapshot((docSnap) => {
                    if (docSnap.exists) {
                        const data = docSnap.data();
                        setActiveQuestion(data.activeQuestion || null);
                        setStudentsList(data.studentsList || []);
                        setResponses(data.responses || {});
                        setBroadcastedResponse(data.broadcastedResponse || null);
                        if (data.questionHistory) {
                            setQuestionHistory(data.questionHistory);
                        }
                    }
                }, (error) => {
                    console.error("Firestore error:", error);
                });

                return () => unsubscribe();
            }, [roomCode, user]);

            // Save state helper to Firestore
            const updateFirestoreRoom = async (updates) => {
                if (!roomCode || !user) return;
                try {
                    const roomRef = db.collection('artifacts').doc('omit_app').collection('public').doc('data').collection('omit_rooms').doc(roomCode.toUpperCase());
                    await roomRef.set(updates, { merge: true });
                } catch (e) {
                    console.error("Error updating Firestore:", e);
                }
            };

            // Teacher Create Room
            const handleCreateRoom = async () => {
                const generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
                setRoomCode(generatedCode);
                setRole('TEACHER');

                if (user) {
                    await updateFirestoreRoom({
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        activeQuestion: null,
                        studentsList: [],
                        responses: {},
                        questionHistory: [],
                        broadcastedResponse: null
                    });
                }
                showToast(`已建立互動課堂 房號：${generatedCode}`, 'success');
            };

            // Student Join Room
            const handleJoinRoom = async (e) => {
                e?.preventDefault();
                if (!roomCode.trim()) {
                    showToast('請輸入6位數字房號', 'error');
                    return;
                }
                if (!seatNumber) {
                    showToast('請點選您的學號 (1-36)', 'error');
                    return;
                }

                setRole('STUDENT');
                const displayName = studentName.trim() ? studentName.trim() : `學號 ${seatNumber}`;

                const studentData = {
                    id: myStudentId.current,
                    seatNumber: parseInt(seatNumber, 10),
                    name: displayName,
                    joinedAt: new Date().toLocaleTimeString('zh-HK', { hour12: false })
                };

                // Add student to Firestore
                if (user) {
                    const roomRef = db.collection('artifacts').doc('omit_app').collection('public').doc('data').collection('omit_rooms').doc(roomCode.toUpperCase());
                    const docSnap = await roomRef.get();
                    if (docSnap.exists) {
                        const currentStudents = docSnap.data().studentsList || [];
                        const updatedStudents = [...currentStudents.filter(s => s.id !== studentData.id), studentData];
                        await roomRef.set({ studentsList: updatedStudents }, { merge: true });
                    }
                }

                showToast(`已進入房號 ${roomCode} 的課堂`, 'success');
            };

            if (role === 'LANDING') {
                return (
                    <div class="min-h-screen bg-gradient-to-br from-indigo-900 via-indigo-800 to-purple-900 flex items-center justify-center p-4">
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                        
                        <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 space-y-8 relative overflow-hidden">
                            <div class="text-center space-y-2">
                                <div class="inline-flex items-center justify-center w-20 h-20 bg-indigo-100 text-indigo-600 rounded-2xl mb-1 font-black text-3xl shadow-inner">
                                    OMIT
                                </div>
                                <h1 class="text-3xl font-black text-slate-800 tracking-tight">OMIT 互動課堂</h1>
                                <p class="text-slate-500 text-sm">免登入！即時互動、白板解題、搶答與學習分析</p>
                            </div>

                            <div class="space-y-6">
                                {/* Student Login Form */}
                                <form onSubmit={handleJoinRoom} class="bg-indigo-50/80 p-5 rounded-2xl border border-indigo-100 space-y-4">
                                    <div class="flex items-center justify-between">
                                        <h2 class="text-xs font-bold text-indigo-600 uppercase tracking-wider">我是學生 (加入課堂)</h2>
                                        <span class="text-xs text-indigo-400 font-medium">*必須選擇學號</span>
                                    </div>
                                    
                                    <div>
                                        <label class="block text-xs font-bold text-slate-600 mb-1">1. 請輸入課堂房號</label>
                                        <input 
                                            type="text" 
                                            placeholder="請輸入6位房號" 
                                            value={roomCode} 
                                            onChange={(e) => setRoomCode(e.target.value)}
                                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-mono text-center tracking-widest text-lg font-bold"
                                            maxLength={6}
                                        />
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold text-slate-600 mb-1">2. 請選擇學號 (必選 1-36)</label>
                                        <select 
                                            value={seatNumber}
                                            onChange={(e) => setSeatNumber(e.target.value)}
                                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-bold text-slate-700 text-base"
                                        >
                                            <option value="">-- 請選擇學號 (1 - 36) --</option>
                                            {Array.from({ length: 36 }, (_, i) => i + 1).map(num => (
                                                <option key={num} value={num}>{num} 號學生</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold text-slate-600 mb-1">3. 學生姓名 (可留空)</label>
                                        <input 
                                            type="text" 
                                            placeholder="輸入姓名或暱稱 (可留空)" 
                                            value={studentName} 
                                            onChange={(e) => setStudentName(e.target.value)}
                                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-medium text-slate-700"
                                        />
                                    </div>

                                    <button 
                                        type="submit" 
                                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-200 active:scale-98 text-base flex items-center justify-center space-x-2"
                                    >
                                        <span>進入課堂 🚀</span>
                                    </button>
                                </form>

                                <div class="relative flex py-1 items-center">
                                    <div class="flex-grow border-t border-slate-200"></div>
                                    <span class="flex-shrink mx-4 text-slate-400 text-xs font-medium">或</span>
                                    <div class="flex-grow border-t border-slate-200"></div>
                                </div>

                                {/* Teacher Login Section */}
                                <div class="text-center">
                                    <button 
                                        onClick={handleCreateRoom}
                                        class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl transition shadow-md flex items-center justify-center space-x-2 active:scale-98 text-base"
                                    >
                                        <span>👨‍🏫 開啟新課堂 (教師控制台)</span>
                                    </button>
                                    <p class="text-xs text-slate-400 mt-2">無須註冊，隨開即用並提供試算表學習報告</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (role === 'TEACHER') {
                return (
                    <TeacherDashboard 
                        roomCode={roomCode} 
                        activeQuestion={activeQuestion} 
                        setActiveQuestion={setActiveQuestion}
                        responses={responses}
                        setResponses={setResponses}
                        studentsList={studentsList}
                        broadcastedResponse={broadcastedResponse}
                        questionHistory={questionHistory}
                        updateFirestoreRoom={updateFirestoreRoom}
                        showToast={showToast}
                        onExit={async () => {
                            // Wipe temp Firestore files when exiting room
                            try {
                                if (user && roomCode) {
                                    const roomRef = db.collection('artifacts').doc('omit_app').collection('public').doc('data').collection('omit_rooms').doc(roomCode.toUpperCase());
                                    await roomRef.delete();
                                }
                            } catch (e) {
                                console.error("Cleanup error:", e);
                            }
                            setRole('LANDING');
                            showToast('已清空課室暫存資料並退出', 'info');
                        }}
                    />
                );
            }

            if (role === 'STUDENT') {
                return (
                    <StudentInterface 
                        roomCode={roomCode}
                        seatNumber={seatNumber}
                        studentName={studentName}
                        studentId={myStudentId.current}
                        activeQuestion={activeQuestion}
                        responses={responses}
                        broadcastedResponse={broadcastedResponse}
                        updateFirestoreRoom={updateFirestoreRoom}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            return null;
        }

        function TeacherDashboard({ 
            roomCode, 
            activeQuestion, 
            setActiveQuestion, 
            responses, 
            setResponses, 
            studentsList, 
            broadcastedResponse, 
            questionHistory,
            updateFirestoreRoom, 
            showToast, 
            onExit 
        }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE'); // 'CHOICE', 'TF', 'SHORT', 'DRAW', 'BUZZER', 'LINK'
            const [questionText, setQuestionText] = useState('');
            const [allowStudentEdit, setAllowStudentEdit] = useState(true);
            const [bgImage, setBgImage] = useState(null);
            const [linkUrl, setLinkUrl] = useState('');
            const [choiceCount, setChoiceCount] = useState(4); // 4 or 5 options

            // Modals & Tools
            const [showStudentListModal, setShowStudentListModal] = useState(false);
            const [showLeaderboardModal, setShowLeaderboardModal] = useState(false);
            const [showRandomPickerModal, setShowRandomPickerModal] = useState(false);
            const [showQRModal, setShowQRModal] = useState(false);
            const [selectedStudentFilter, setSelectedStudentFilter] = useState(null); // Option filter for choice bar chart
            const [zoomResponse, setZoomResponse] = useState(null); // Zoom student response modal

            // Random Picker State
            const [rangeStart, setRangeStart] = useState(1);
            const [rangeEnd, setRangeEnd] = useState(36);
            const [noRepeatPicker, setNoRepeatPicker] = useState(true);
            const [drawnNumbers, setDrawnNumbers] = useState([]);
            const [pickedResult, setPickedResult] = useState(null);
            const [isPicking, setIsPicking] = useState(false);

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${encodeURIComponent(joinUrl)}`;

            // Publish Question
            const handlePublishQuestion = async () => {
                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: questionText.trim() || getDefaultPrompt(selectedMode),
                    startTime: Date.now(),
                    allowStudentEdit: allowStudentEdit,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : [],
                    bgImage: selectedMode === 'DRAW' ? bgImage : null,
                    linkUrl: selectedMode === 'LINK' ? linkUrl.trim() : null
                };

                const newHistoryItem = {
                    question: newQ,
                    timestamp: new Date().toLocaleTimeString('zh-HK'),
                    responsesSnapshot: {}
                };

                const updatedHistory = [...questionHistory, newHistoryItem];

                await updateFirestoreRoom({
                    activeQuestion: newQ,
                    responses: {},
                    broadcastedResponse: null,
                    questionHistory: updatedHistory
                });

                showToast(`已發佈「${getModeName(selectedMode)}」！`, 'success');
            };

            // Clear Active Question
            const handleClearQuestion = async () => {
                await updateFirestoreRoom({
                    activeQuestion: null,
                    broadcastedResponse: null
                });
                showToast('已結束當前題目', 'info');
            };

            // Broadcast response to all students (Peer Review)
            const handleBroadcastResponse = async (resp) => {
                await updateFirestoreRoom({
                    broadcastedResponse: resp
                });
                showToast(`已廣播 ${resp.seatNumber} 號學生的作品給全班觀看！`, 'success');
            };

            // Clear Peer Review Broadcast
            const handleClearBroadcast = async () => {
                await updateFirestoreRoom({ broadcastedResponse: null });
                showToast('已停止廣播學生作品', 'info');
            };

            // Image Upload Handler for Whiteboard Background
            const handleBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 1.5 * 1024 * 1024) {
                        showToast('圖片大小建議在 1.5MB 以內', 'error');
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = (uploadEvent) => {
                        setBgImage(uploadEvent.target.result);
                        showToast('背景圖片上傳成功！', 'success');
                    };
                    reader.readAsDataURL(file);
                }
            };

            // Random Student Selector Logic
            const handlePickRandomStudent = () => {
                const available = [];
                for (let i = rangeStart; i <= rangeEnd; i++) {
                    if (!noRepeatPicker || !drawnNumbers.includes(i)) {
                        available.push(i);
                    }
                }

                if (available.length === 0) {
                    showToast('所選範圍內的學生已全部抽過一次！', 'error');
                    return;
                }

                setIsPicking(true);
                let counter = 0;
                const interval = setInterval(() => {
                    const temp = available[Math.floor(Math.random() * available.length)];
                    setPickedResult({ seatNumber: temp });
                    counter++;
                    if (counter > 15) {
                        clearInterval(interval);
                        const finalPicked = available[Math.floor(Math.random() * available.length)];
                        setPickedResult({ seatNumber: finalPicked });
                        if (noRepeatPicker) {
                            setDrawnNumbers(prev => [...prev, finalPicked]);
                        }
                        setIsPicking(false);
                    }
                }, 100);
            };

            // Export CSV Learning Report
            const handleExportReport = () => {
                if (questionHistory.length === 0) {
                    showToast('暫無答題紀錄可供匯出', 'error');
                    return;
                }

                let csvContent = "\uFEFF"; // UTF-8 BOM for Excel Chinese display
                // Header
                let headers = ["學號 (Seat #)", "學生姓名 (Name)"];
                questionHistory.forEach((item, idx) => {
                    headers.push(`第${idx + 1}題 [${getModeName(item.question.mode)}] - ${item.question.text.substring(0, 15)}`);
                });
                csvContent += headers.map(h => `"${h}"`).join(",") + "\n";

                // Map student responses by seat 1 to 36
                for (let seat = 1; seat <= 36; seat++) {
                    const studentObj = studentsList.find(s => s.seatNumber === seat);
                    const name = studentObj ? studentObj.name : "未加入";
                    let row = [`${seat}號`, `"${name}"`];

                    questionHistory.forEach((qItem) => {
                        // Find student response in current responses state or snapshot
                        const respList = Object.values(responses);
                        const resp = respList.find(r => r.seatNumber === seat);
                        if (resp) {
                            let textAns = resp.answer;
                            if (qItem.question.mode === 'DRAW') textAns = '[白板繪圖作品]';
                            row.push(`"${textAns} (${resp.duration || '0'}秒)"`);
                        } else {
                            row.push('"未作答"');
                        }
                    });
                    csvContent += row.join(",") + "\n";
                }

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `OMIT_學習報告_課堂${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('已匯出 Excel 試算表學習報告！', 'success');
            };

            // Response statistics calculations
            const responseArray = useMemo(() => Object.values(responses), [responses]);
            const choiceCounts = useMemo(() => {
                if (!activeQuestion || activeQuestion.mode !== 'CHOICE') return {};
                const counts = {};
                activeQuestion.choiceOptions.forEach(opt => counts[opt] = 0);
                responseArray.forEach(r => {
                    if (counts[r.answer] !== undefined) counts[r.answer]++;
                });
                return counts;
            }, [activeQuestion, responseArray]);

            // Sorted responses for Leaderboard
            const leaderboardList = useMemo(() => {
                return [...responseArray].sort((a, b) => parseFloat(a.duration || 999) - parseFloat(b.duration || 999));
            }, [responseArray]);

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col">
                    {/* Header Bar */}
                    <header class="bg-slate-900 text-white px-6 py-4 shadow-lg flex flex-wrap items-center justify-between gap-4 sticky top-0 z-30">
                        <div class="flex items-center space-x-4">
                            <div class="bg-indigo-600 px-3 py-1 rounded-xl font-black text-xl tracking-wider">OMIT</div>
                            <div>
                                <div class="flex items-center space-x-2">
                                    <span class="text-xs text-slate-400">課堂房號:</span>
                                    <span class="font-mono text-xl font-black text-amber-400 tracking-widest">{roomCode}</span>
                                    <button 
                                        onClick={() => setShowQRModal(true)} 
                                        class="text-xs bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded-lg border border-slate-700 text-slate-200 transition"
                                    >
                                        📱 QR Code
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Middle: Feature 1 - Real-time Joined Student Count Tag */}
                        <div class="flex items-center space-x-3">
                            <button 
                                onClick={() => setShowStudentListModal(true)}
                                class="bg-indigo-600/90 hover:bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center space-x-2 shadow transition active:scale-95 border border-indigo-400"
                            >
                                <span>👥 已加入學生:</span>
                                <span class="bg-white text-indigo-900 px-2 py-0.5 rounded-full font-black">{studentsList.length} 人</span>
                            </button>

                            <button 
                                onClick={() => setShowRandomPickerModal(true)}
                                class="bg-amber-500 hover:bg-amber-600 text-white px-3.5 py-2 rounded-xl text-sm font-bold flex items-center space-x-1 shadow transition active:scale-95"
                            >
                                <span>🎲 抽選學生</span>
                            </button>

                            <button 
                                onClick={handleExportReport}

                                <div class="py-4">
                                    {activeQuestion?.mode === 'DRAW' ? (
                                        <div class="bg-slate-100 p-2 rounded-2xl">
                                            <img src={zoomResponse.answer} class="w-full h-auto max-h-96 object-contain rounded-xl bg-white shadow" />
                                        </div>
                                    ) : (
                                        <div class="p-6 bg-slate-50 rounded-2xl border text-xl font-black text-slate-800 text-center">
                                            {zoomResponse.answer}
                                        </div>
                                    )}
                                </div>

                                <div class="flex justify-end space-x-3">
                                    <button 
                                        onClick={() => {
                                            handleBroadcastResponse(zoomResponse);
                                            setZoomResponse(null);
                                        }}
                                        class="bg-indigo-600 text-white font-bold px-5 py-2.5 rounded-xl text-sm shadow hover:bg-indigo-700 transition"
                                    >
                                        📢 廣播此答案給全班 (學生互評)
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* QR Code Modal */}
                    {showQRModal && (
                        <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4 text-center">
                                <h3 class="text-lg font-black text-slate-800">課堂 QR Code</h3>
                                <div class="bg-slate-50 p-4 rounded-2xl inline-block border">
                                    <img src={qrImageUrl} class="w-56 h-56 mx-auto rounded-lg shadow-sm" />
                                </div>
                                <p class="text-xs font-mono font-bold text-slate-500 break-all">{joinUrl}</p>
                                <button 
                                    onClick={() => setShowQRModal(false)}
                                    class="w-full bg-slate-800 text-white font-bold py-2.5 rounded-xl text-sm"
                                >
                                    關閉
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StudentInterface({ 
            roomCode, 
            seatNumber, 
            studentName, 
            studentId, 
            activeQuestion, 
            responses, 
            broadcastedResponse, 
            updateFirestoreRoom, 
            showToast, 
            onExit 
        }) {
            const [myAnswer, setMyAnswer] = useState('');
            const [submitted, setSubmitted] = useState(false);
            const [submitDuration, setSubmitDuration] = useState(null);

            // Canvas Ref for Whiteboard Mode
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [strokeColor, setStrokeColor] = useState('#000000');
            const [lineWidth, setLineWidth] = useState(4);

            const displayName = studentName.trim() ? studentName : `學號 ${seatNumber}`;

            // Reset local draft state when active question changes
            useEffect(() => {
                if (activeQuestion) {
                    // Check if student already submitted in Firestore responses
                    const existing = responses[studentId];
                    if (existing) {
                        setMyAnswer(existing.answer);
                        setSubmitted(true);
                        setSubmitDuration(existing.duration);
                    } else {
                        setMyAnswer('');
                        setSubmitted(false);
                        setSubmitDuration(null);
                    }
                }
            }, [activeQuestion?.id]);

            // Whiteboard canvas setup & image load
            useEffect(() => {
                if (activeQuestion?.mode === 'DRAW' && canvasRef.current) {
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    if (activeQuestion.bgImage) {
                        const img = new Image();
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        };
                        img.src = activeQuestion.bgImage;
                    } else {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                }
            }, [activeQuestion?.id, activeQuestion?.bgImage]);

            // Drawing Handlers
            const startDrawing = (e) => {
                if (submitted && !activeQuestion.allowStudentEdit) return;
                setIsDrawing(true);
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                ctx.beginPath();
                ctx.moveTo(clientX - rect.left, clientY - rect.top);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = lineWidth;
                ctx.lineTo(clientX - rect.left, clientY - rect.top);
                ctx.stroke();
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const clearCanvas = () => {
                if (canvasRef.current) {
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');
                    if (activeQuestion?.bgImage) {
                        const img = new Image();
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        };
                        img.src = activeQuestion.bgImage;
                    } else {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                }
            };

            // Submit Student Answer
            const handleSubmitAnswer = async (ans) => {
                const finalAnswer = ans || myAnswer;
                if (!finalAnswer) {
                    showToast('請先完成作答', 'error');
                    return;
                }

                const durationSec = activeQuestion ? ((Date.now() - activeQuestion.startTime) / 1000).toFixed(1) : "0";

                const responseData = {
                    studentId: studentId,
                    seatNumber: parseInt(seatNumber, 10),
                    name: displayName,
                    answer: finalAnswer,
                    duration: durationSec,
                    timestamp: Date.now()
                };

                // Merge into Firestore
                await updateFirestoreRoom({
                    [`responses.${studentId}`]: responseData
                });

                setSubmitted(true);
                setSubmitDuration(durationSec);
                showToast('答案已成功提交！', 'success');
            };

            // Whiteboard Submit
            const handleCanvasSubmit = () => {
                if (canvasRef.current) {
                    const dataUrl = canvasRef.current.toDataURL('image/png');
                    handleSubmitAnswer(dataUrl);
                }
            };

            const ytEmbedUrl = activeQuestion?.mode === 'LINK' ? getYouTubeEmbedUrl(activeQuestion.linkUrl) : null;

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col">
                    {/* Header */}
                    <header class="bg-indigo-900 text-white px-6 py-4 shadow-md flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <span class="w-9 h-9 rounded-full bg-amber-400 text-indigo-950 font-black flex items-center justify-center text-sm shadow">
                                {seatNumber}
                            </span>
                            <div>
                                <h2 class="font-bold text-sm text-slate-100">{displayName}</h2>
                                <span class="text-xs text-indigo-300">課堂房號: {roomCode}</span>
                            </div>
                        </div>
                        <button onClick={onExit} class="text-xs bg-indigo-800 hover:bg-indigo-700 px-3 py-1.5 rounded-xl border border-indigo-700">
                            離開課堂
                        </button>
                    </header>

                    {/* Main Content */}
                    <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col space-y-4">
                        
                        {/* Feature 3: Peer Review Broadcast Modal Overlay */}
                        {broadcastedResponse && (
                            <div class="bg-gradient-to-r from-amber-500 to-amber-600 text-white rounded-3xl p-5 shadow-xl space-y-3 animate-fade-in border-2 border-amber-300">
                                <div class="flex items-center space-x-2">
                                    <span class="text-2xl">📢</span>
                                    <div>
                                        <h3 class="font-extrabold text-base">學生作品互評觀摩中</h3>
                                        <span class="text-xs opacity-90">這是 {broadcastedResponse.seatNumber} 號 {broadcastedResponse.name} 的解題答案：</span>
                                    </div>
                                </div>

                                <div class="bg-white text-slate-800 p-4 rounded-2xl shadow-inner text-center">
                                    {broadcastedResponse.answer.startsWith('data:image') ? (
                                        <img src={broadcastedResponse.answer} class="w-full h-auto max-h-72 object-contain mx-auto rounded-lg" />
                                    ) : (
                                        <p class="text-xl font-black">{broadcastedResponse.answer}</p>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeQuestion ? (
                            <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-200/80 space-y-6 flex-1 flex flex-col justify-between">
                                <div>
                                    <span class="bg-indigo-100 text-indigo-700 font-extrabold text-xs px-3 py-1 rounded-full">
                                        {getModeName(activeQuestion.mode)}
                                    </span>
                                    <h3 class="text-xl font-black text-slate-800 mt-2">{activeQuestion.text}</h3>
                                </div>

                                {/* Answers Input Modes */}

                                {/* Choice Mode */}
                                {activeQuestion.mode === 'CHOICE' && (
                                    <div class="grid grid-cols-1 gap-3 py-4">
                                        {activeQuestion.choiceOptions.map(opt => (
                                            <button
                                                key={opt}
                                                disabled={submitted && !activeQuestion.allowStudentEdit}
                                                onClick={() => {
                                                    setMyAnswer(opt);
                                                    handleSubmitAnswer(opt);
                                                }}
                                                class={`p-4 rounded-2xl border-2 font-black text-lg transition-all flex items-center justify-between active:scale-98 ${
                                                    myAnswer === opt 
                                                    ? 'border-indigo-600 bg-indigo-600 text-white shadow-lg scale-101' 
                                                    : 'border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100'
                                                }`}
                                            >
                                                <span>選項 {opt}</span>
                                                {myAnswer === opt && <span>✓</span>}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {/* True / False Mode */}
                                {activeQuestion.mode === 'TF' && (
                                    <div class="grid grid-cols-2 gap-4 py-4">
                                        {[
                                            { val: 'O', label: '正確 ⭕', color: 'bg-emerald-500' },
                                            { val: 'X', label: '錯誤 ❌', color: 'bg-rose-500' }
                                        ].map(item => (
                                            <button
                                                key={item.val}
                                                disabled={submitted && !activeQuestion.allowStudentEdit}
                                                onClick={() => {
                                                    setMyAnswer(item.val);
                                                    handleSubmitAnswer(item.val);
                                                }}
                                                class={`p-8 rounded-3xl text-white font-black text-2xl shadow-lg transition active:scale-95 flex flex-col items-center justify-center space-y-2 ${
                                                    myAnswer === item.val ? `${item.color} ring-4 ring-offset-2 ring-indigo-400` : `${item.color}/80 hover:${item.color}`
                                                }`}
                                            >
                                                <span>{item.label}</span>
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {/* Short Answer Mode */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-4 py-4">
                                        <textarea
                                            rows={4}
                                            placeholder="請在這裡輸入你的回答..."
                                            value={myAnswer}
                                            disabled={submitted && !activeQuestion.allowStudentEdit}
                                            onChange={(e) => setMyAnswer(e.target.value)}
                                            class="w-full p-4 rounded-2xl border-2 border-slate-200 focus:outline-none focus:border-indigo-500 font-medium text-base"
                                        ></textarea>
                                        <button
                                            disabled={submitted && !activeQuestion.allowStudentEdit}
                                            onClick={() => handleSubmitAnswer()}
                                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl transition shadow-md text-base"
                                        >
                                            提交答案
                                        </button>
                                    </div>
                                )}

                                {/* Feature 2: Whiteboard / Drawing Mode Canvas */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <div class="space-y-4 py-2">
                                        {/* Canvas Toolbar */}
                                        <div class="flex items-center justify-between bg-slate-100 p-2 rounded-xl">
                                            <div class="flex items-center space-x-2">
                                                {['#000000', '#ef4444', '#3b82f6', '#10b981', '#f59e0b'].map(c => (
                                                    <button
                                                        key={c}
                                                        onClick={() => setStrokeColor(c)}
                                                        style={{ backgroundColor: c }}
                                                        class={`w-7 h-7 rounded-full transition ${strokeColor === c ? 'ring-2 ring-offset-2 ring-indigo-500 scale-110' : ''}`}
                                                    />
                                                ))}
                                            </div>
                                            <div class="flex items-center space-x-2">
                                                <button onClick={clearCanvas} class="text-xs bg-white text-slate-700 font-bold px-3 py-1.5 rounded-lg border shadow-sm">
                                                    重畫
                                                </button>
                                            </div>
                                        </div>

                                        <div class="canvas-container bg-white border-2 border-slate-300 rounded-2xl overflow-hidden shadow-inner flex justify-center">
                                            <canvas
                                                ref={canvasRef}
                                                width={480}
                                                height={320}
                                                onMouseDown={startDrawing}
                                                onMouseMove={draw}
                                                onMouseUp={stopDrawing}
                                                onTouchStart={startDrawing}
                                                onTouchMove={draw}
                                                onTouchEnd={stopDrawing}
                                                class="w-full h-auto max-w-full cursor-crosshair bg-white"
                                            ></canvas>
                                        </div>

                                        <button
                                            disabled={submitted && !activeQuestion.allowStudentEdit}
                                            onClick={handleCanvasSubmit}
                                            class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3.5 rounded-2xl transition shadow-md text-base"
                                        >
                                            🎨 提交白板繪圖
                                        </button>
                                    </div>
                                )}

                                {/* Feature 9: Speed Buzzer Mode */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="py-8 text-center space-y-6">
                                        <button
                                            disabled={submitted}
                                            onClick={() => handleSubmitAnswer('搶答！')}
                                            class={`w-48 h-48 rounded-full font-black text-2xl text-white shadow-2xl transition-all transform active:scale-90 mx-auto flex flex-col items-center justify-center border-4 border-white ${
                                                submitted ? 'bg-slate-400 cursor-not-allowed' : 'bg-rose-500 hover:bg-rose-600 buzzer-btn'
                                            }`}
                                        >
                                            <span class="text-4xl mb-1">⚡</span>
                                            <span>{submitted ? '已成功搶答！' : '按我搶答！'}</span>
                                        </button>
                                        <p class="text-xs text-slate-400 font-medium">考驗反應速度！搶先按下的大按鈕會名列前茅。</p>
                                    </div>
                                )}

                                {/* Feature 10: Link & YouTube Embedded Video View */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div class="py-4 space-y-4 text-center">
                                        {ytEmbedUrl ? (
                                            <div class="aspect-video w-full rounded-2xl overflow-hidden shadow-lg border">
                                                <iframe 
                                                    src={ytEmbedUrl} 
                                                    title="YouTube video player" 
                                                    class="w-full h-full"
                                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                                    allowFullScreen
                                                ></iframe>
                                            </div>
                                        ) : (
                                            <div class="bg-cyan-50 p-6 rounded-2xl border border-cyan-200 space-y-3">
                                                <span class="text-4xl block">🌐</span>
                                                <h4 class="font-bold text-slate-800">老師向全班派送了網頁連結：</h4>
                                                <a 
                                                    href={activeQuestion.linkUrl} 
                                                    target="_blank" 
                                                    rel="noopener noreferrer"
                                                    class="inline-block bg-cyan-600 text-white font-bold px-6 py-3 rounded-xl shadow hover:bg-cyan-700 transition"
                                                >
                                                    點擊開啟連結 🔗
                                                </a>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Submission Status Bar */}
                                {submitted && (
                                    <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl flex items-center justify-between text-emerald-800 text-sm font-bold">
                                        <span>✓ 已提交答案 {submitDuration && `(用時 ${submitDuration}秒)`}</span>
                                        {!activeQuestion.allowStudentEdit && <span class="text-xs text-slate-400 font-normal">老師已鎖定無法修改</span>}
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div class="bg-white rounded-3xl p-12 text-center shadow-md border border-slate-200/80 space-y-4 my-auto">
                                <div class="w-16 h-16 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center mx-auto text-3xl animate-pulse">
                                    ⏳
                                </div>
                                <h3 class="text-xl font-extrabold text-slate-700">等待老師發佈題目...</h3>
                                <p class="text-slate-400 text-sm">請保持畫面開啟，題目發佈時將即時更新。</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        // Helper label getters
        function getModeName(mode) {
            switch (mode) {
                case 'CHOICE': return '選擇題';
                case 'TF': return '是非題';
                case 'SHORT': return '短答題';
                case 'DRAW': return '白板題';
                case 'BUZZER': return '搶答題';
                case 'LINK': return '派送連結';
                default: return '互動題';
            }
        }

        function getDefaultPrompt(mode) {
            switch (mode) {
                case 'CHOICE': return '請選擇正確的答案：';
                case 'TF': return '請判斷以下敘述是否正確：';
                case 'SHORT': return '請簡要回答以下問題：';
                case 'DRAW': return '請在白板上進行解題或繪圖標註：';
                case 'BUZZER': return '準備好了嗎？搶答開始！';
                case 'LINK': return '請觀看以下發放的教材連結：';
                default: return '請回答問題：';
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
