        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    if (window.confetti) {
                        window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    }
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                    });
                } else if (type === 'wrong') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.setValueAtTime(150, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        const Toast = ({ message, type, onClose }) => {

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) throw new Error("JSZip is not loaded.");
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>${paragraphsXml}</w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];
            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) questions.push(currentQ);
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }

                    currentQ.options.push({ letter, text: optText });
                    if (isCorrect) currentQ.answer = letter;
                }
            });

            if (currentQ && currentQ.options.length > 0) questions.push(currentQ);

            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1,
                            text: "以下哪一項不是地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "機械資源" }
                            ],
                            answer: "D"
                        },
                        {
                            num: 2,
                            text: "芝士的原料屬於哪一項地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "礦產資源" }
                            ],
                            answer: "C"
                        }
                    ]
                };
            }

            return { title, totalScore, questions };
        };

        // Precision Whiteboard Canvas Component (Requirement 1 & 21)
        const PrecisionWhiteboard = ({ initialBg, onSave, isTeacher, onBroadcast, onClose }) => {
            const canvasRef = useRef(null);
            const [penColor, setPenColor] = useState('#4f46e5');
            const [penWidth, setPenWidth] = useState(4);
            const [isEraser, setIsEraser] = useState(false);
            const [isDrawing, setIsDrawing] = useState(false);
            const [bgImage, setBgImage] = useState(initialBg || null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 1280, 720);

                if (bgImage) {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, 1280, 720);
                    };
                    img.src = bgImage;
                }
            }, [bgImage]);

            const getCanvasCoords = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                const scaleX = 1280 / rect.width;
                const scaleY = 720 / rect.height;

                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                setIsDrawing(true);
                const { x, y } = getCanvasCoords(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const { x, y } = getCanvasCoords(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.strokeStyle = isEraser ? '#ffffff' : penColor;
                ctx.lineWidth = isEraser ? penWidth * 4 : penWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineTo(x, y);
                ctx.stroke();
            };

            const stopDrawing = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                setIsDrawing(false);
            };

            const handleClear = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 1280, 720);
                if (bgImage) {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = () => ctx.drawImage(img, 0, 0, 1280, 720);
                    img.src = bgImage;
                }
            };

            const handleBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => setBgImage(evt.target.result);
                    reader.readAsDataURL(file);
                }
            };

            const handleConfirmSubmit = () => {
                const canvas = canvasRef.current;
                const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                onSave(dataUrl);
            };

            return (
                <div class="flex flex-col h-full bg-slate-900 rounded-3xl overflow-hidden p-4 space-y-3">
                    <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-800 p-3 rounded-2xl">
                        <div class="flex items-center space-x-2">
                            {['#4f46e5', '#ef4444', '#10b981', '#f59e0b', '#000000'].map(c => (
                                <button 
                                    key={c}
                                    onClick={() => { setPenColor(c); setIsEraser(false); }}
                                    class={`w-8 h-8 rounded-full border-2 transition ${penColor === c && !isEraser ? 'scale-110 border-white ring-2 ring-indigo-400' : 'border-transparent'}`}
                                    style={{ backgroundColor: c }}
                                />
                            ))}
                        </div>

                        <div class="flex items-center space-x-3 bg-slate-700/80 px-3 py-1.5 rounded-xl text-white text-xs font-bold">
                            <span>筆觸:</span>
                            <input 
                                type="range" min="2" max="18" value={penWidth} 
                                onChange={(e) => setPenWidth(parseInt(e.target.value))}
                                class="w-20 accent-indigo-400"
                            />
                            <span>{penWidth}px</span>
                        </div>

                        <div class="flex items-center space-x-2">
                            <button 
                                onClick={() => setIsEraser(!isEraser)}
                                class={`px-3 py-1.5 rounded-xl font-bold text-xs transition ${isEraser ? 'bg-amber-500 text-white' : 'bg-slate-700 text-slate-200'}`}
                            >
                                🧽 擦膠 {isEraser ? '開' : '關'}
                            </button>
                            <button 
                                onClick={handleClear}
                                class="px-3 py-1.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold text-xs"
                            >
                                🗑️ 清空
                            </button>
                            {!isTeacher && (
                                <label class="px-3 py-1.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs cursor-pointer">
                                    🖼️ 背景圖片
                                    <input type="file" accept="image/*" onChange={handleBgUpload} class="hidden" />
                                </label>
                            )}
                        </div>
                    </div>

                    <div class="flex-1 canvas-container bg-black rounded-2xl flex items-center justify-center relative overflow-hidden border-2 border-slate-700">
                        <canvas 
                            ref={canvasRef}
                            width={1280}
                            height={720}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            class="w-full h-full object-contain bg-white cursor-crosshair touch-none"
                        />
                    </div>

                    <div class="flex justify-between items-center pt-2">
                        {isTeacher && onClose && (
                            <button 
                                onClick={onClose}
                                class="px-5 py-2.5 rounded-xl bg-slate-700 text-slate-200 font-bold text-sm hover:bg-slate-600"
                            >
                                關閉白板
                            </button>
                        )}
                        <div class="flex space-x-3 ml-auto">
                            {isTeacher && onBroadcast && (
                                <button 
                                    onClick={() => {
                                        const canvas = canvasRef.current;
                                        onBroadcast(canvas.toDataURL('image/jpeg', 0.85));
                                    }}
                                    class="px-6 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-extrabold text-sm shadow-lg"
                                >
                                    📢 廣播分享至全班
                                </button>
                            )}
                            <button 
                                onClick={handleConfirmSubmit}
                                class="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm shadow-lg flex items-center gap-1.5"
                            >
                                <span>✅ 確認提交畫布作答</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        function OMITApp() {
            const [role, setRole] = useState('LANDING');
            const [roomCode, setRoomCode] = useState('');
            const [seatNumber, setSeatNumber] = useState('1');
            const [studentName, setStudentName] = useState('');
            const [teacherPassword, setTeacherPassword] = useState('');
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [toast, setToast] = useState(null);

            const [activeQuestion, setActiveQuestion] = useState(null);
            const [studentsList, setStudentsList] = useState([]);
            const [responses, setResponses] = useState({});
            const [historyQuestions, setHistoryQuestions] = useState([]);
            const [isAuthReady, setIsAuthReady] = useState(false);

            const myStudentId = useRef('std_' + Math.random().toString(36).substring(2, 9));

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (window.fbUtils && window.fbAuth) {
                            await window.fbUtils.signInAnonymously(window.fbAuth);

        function TeacherDashboard({ roomCode, activeQuestion, setActiveQuestion, responses, setResponses, studentsList, historyQuestions, setHistoryQuestions, showToast, onExit }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE');
            const [questionText, setQuestionText] = useState('');

            const [lockAfterSubmit, setLockAfterSubmit] = useState(true);
            const [whiteboardBg, setWhiteboardBg] = useState(null);

            // Modals & Tools

            const [barChoiceFilter, setBarChoiceFilter] = useState(null);
            const [showTeacherWhiteboard, setShowTeacherWhiteboard] = useState(false);

            // Random Selector State (Requirement 9)
            const [showRandomModal, setShowRandomModal] = useState(false);
            const [rangeStart, setRangeStart] = useState(1);
            const [rangeEnd, setRangeEnd] = useState(36);
            const [drawnNumbers, setDrawnNumbers] = useState([]);
            const [currentDrawn, setCurrentDrawn] = useState(null);
            const [isSpinning, setIsSpinning] = useState(false);

            // Timer Modal State (Requirement 10)
            const [showTimerModal, setShowTimerModal] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerActive, setTimerActive] = useState(false);
            const [timerZoomed, setTimerZoomed] = useState(false);
            const [customTimerMinutes, setCustomTimerMinutes] = useState('01');
            const [customTimerSecs, setCustomTimerSecs] = useState('00');

            // Challenge Question Setup States (Requirement 12, 13, 14, 16, 20)
            const [challengeData, setChallengeData] = useState(null);
            const [challengeEnableTimer, setChallengeEnableTimer] = useState(true);
            const [challengeTimeLimit, setChallengeTimeLimit] = useState(120);
            const [challengeReleaseInstant, setChallengeReleaseInstant] = useState(true);
            const [showChallengeScoresOnLeaderboard, setShowChallengeScoresOnLeaderboard] = useState(true);

            // Cooperation Question Setup States (Requirement 22)
            const [coopStage, setCoopStage] = useState('PREPARE'); // 'PREPARE', 'GROUP', 'RACE'
            const [coopData, setCoopData] = useState(null);
            const [coopGroups, setCoopGroups] = useState([]);

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

            const currentQuestionResponses = useMemo(() => {
                if (!activeQuestion) return {};
                const filtered = {};
                Object.values(responses).forEach(r => {

                    }
                });
                return filtered;
            }, [responses, activeQuestion]);

            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(s => {
                            if (s <= 1) {
                                setTimerActive(false);
                                playSound('alarm');
                                return 0;
                            }
                            return s - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            const publishQuestionToFirestore = async (qObj, newHistoryList) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatePayload = {
                    activeQuestion: qObj,
                    updatedAt: Date.now()
                };

                await window.fbUtils.setDoc(roomDocRef, updatePayload, { merge: true });
            };

            const handleExitRoom = async () => {
                if (window.confirm("確定退出課室？將會同步清空此課室於 Firebase 的所有暫存紀錄！")) {
                    try {
                        const appId = "omit-8c173";

                        const responsesColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');
                        const resSnaps = await window.fbUtils.getDocs(responsesColRef);
                        resSnaps.forEach(async (d) => await window.fbUtils.deleteDoc(d.ref));

                        const studentsColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                        const stuSnaps = await window.fbUtils.getDocs(studentsColRef);
                        stuSnaps.forEach(async (d) => await window.fbUtils.deleteDoc(d.ref));

                        const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                        await window.fbUtils.deleteDoc(roomDocRef);

                        showToast("課室暫存資料已完全清空！", "info");
                    } catch (e) {
                        console.error("Cleanup error:", e);
                    }
                    onExit();

            };

            // Requirement 12 & 22.1: Download assessment docx template
            const handleDownloadChallengeTemplate = async () => {
                const sampleLines = [
                    "標題：地球生病了",
                    "總分: 100分",
                    "1.以下哪一項不是地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源",
                    "D. 機械資源*",
                    "",
                    "2.芝士的原料屬於哪一項地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源*",
                    "D. 礦產資源",
                    "",
                    "3.人們不當使用水資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應*",
                    "",
                    "4.人們不當使用煤和石油資源會造成甚麼後果?",
                    "A. 引發極端天氣*",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應",
                    "",
                    "5.人們不當使用土地資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災*",
                    "C. 產生大量二氧化碳",
                    "D. 影響食水供應"
                ];

                try {
                    const blob = await createWordDocxBlob(sampleLines);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = '下載評估範本Word檔.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast("已成功下載評估範本Word檔 (.docx)！", "success");
                } catch (err) {
                    console.error("Docx generation error:", err);
                    showToast("無法生成 Word 範本檔", "error");
                }
            };

            const handleWordFileUpload = (e, isCoop = false) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const arrayBuffer = evt.target.result;
                            const result = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                            parsedData = parseWordChallengeText(result.value);
                        } else {
                            parsedData = parseWordChallengeText(evt.target.result);
                        }

                        if (isCoop) {
                            setCoopData(parsedData);
                        } else {
                            setChallengeData(parsedData);
                        }
                        showToast(`已成功由 AI 解析 Word 範本！共 ${parsedData.questions.length} 題`, 'success');
                    } catch (err) {
                        console.error("Word file parse error:", err);
                        showToast("文件解析失敗，請確認格式！", "error");
                    }
                };

                if (file.name.endsWith('.docx')) {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file, "UTF-8");
                }
            };

            // Requirement 22.2: Assign groups for Coop Mode
            const handleCoopGrouping = () => {
                if (!coopData || !coopData.questions || coopData.questions.length === 0) {
                    showToast("請先上戴評估 Word 檔並完成題目編輯！", "error");
                    return;
                }

                if (studentsList.length === 0) {
                    showToast("目前尚無學生加入，無法進行分組！", "error");
                    return;
                }

                // Randomly shuffle students & animals
                const shuffledStudents = [...studentsList].sort(() => Math.random() - 0.5);
                const shuffledAnimals = [...ANIMAL_TEAMS].sort(() => Math.random() - 0.5);

                const teamCount = Math.min(Math.max(2, Math.ceil(studentsList.length / 3)), 6);
                const groups = [];

                for (let i = 0; i < teamCount; i++) {
                    groups.push({
                        ...shuffledAnimals[i % shuffledAnimals.length],
                        id: `team_${i}`,
                        members: [],
                        scoreProgress: 0
                    });
                }

                shuffledStudents.forEach((stu, idx) => {
                    groups[idx % teamCount].members.push(stu);
                });

                setCoopGroups(groups);
                setCoopStage('GROUP');
                showToast("已成功將學生隨機平均分組！", "success");

            // Publish Coop Race Stage
            const handleStartCoopRace = () => {

                        title: coopData.title,
                        questions: coopData.questions,
                        groups: coopGroups,
                        winner: null
                    }

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);
                publishQuestionToFirestore(newQ, updatedHistory);
                setCoopStage('RACE');
                showToast("合作題比賽正式開始！🚀", "success");

            // Teacher Whiteboard Broadcast (Requirement 21)
            const handleBroadcastTeacherWhiteboard = async (dataUrl) => {
                const appId = "omit-8c173";
                const db = window.fbDb;

            };

            // Publish Standard Question
            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                
                let challengeContent = null;
                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請先上載並解析 Word 評估範本檔案！", "error");

                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant

                const newQ = {

                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,

                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],

                };

                const updatedHistory = [...historyQuestions, newQ];

                publishQuestionToFirestore(newQ, updatedHistory);

            const handleClearQuestion = async () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: null }, { merge: true });
                showToast('已結束當前題目', 'info');

            // Requirement 20: Export CSV
            const handleExportCSVReport = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生紀錄可供匯出！", "error");
                    return;
                }

                let csvContent = "\uFEFF";
                csvContent += "學號,學生姓名,加入時間";

                historyQuestions.forEach((q, idx) => {
                    const cleanText = (q.text || getModeLabel(q.mode)).replace(/"/g, '""');
                    if (q.mode === 'CHALLENGE' && q.challenge) {
                        csvContent += `,第${idx + 1}題[挑戰題:${q.challenge.title}得分],第${idx + 1}題[挑戰題正確率]`;
                    } else {
                        csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]: "${cleanText}"`;
                    }
                });
                csvContent += "\n";

                const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

                sortedStudents.forEach((stu) => {
                    const cleanName = (stu.name || '').replace(/"/g, '""');
                    csvContent += `"${stu.seatNumber}號","${cleanName}","${stu.joinTime || ''}"`;
                    
                    historyQuestions.forEach((q) => {
                        const resKey = `${q.id}_${stu.id}`;
                        const res = responses[resKey];
                        
                        if (res && res.answer !== undefined && res.answer !== null) {
                            if (q.mode === 'CHALLENGE' && res.scoreDetails) {
                                csvContent += `,"${res.scoreDetails.totalScore} / ${q.challenge.totalScore}分","${res.scoreDetails.percentage}% (用時:${res.duration || 0}s)"`;
                            } else {
                                let ansVal = res.answer;
                                if (typeof ansVal === 'string' && ansVal.startsWith('data:image')) ansVal = '[圖像白板答案]';
                                else if (typeof ansVal === 'string' && ansVal.startsWith('data:audio')) ansVal = '[語音錄音檔案]';
                                const cleanAns = String(ansVal).replace(/"/g, '""');
                                csvContent += `,"${cleanAns} (用時:${res.duration || 0}s)"`;
                            }
                        } else {
                            csvContent += q.mode === 'CHALLENGE' ? `,"未作答","0%"` : `,"未作答"`;
                        }
                    });
                    csvContent += "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `📥 匯出本次挑戰題成績試算表_房號${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("已成功匯出成績試算表 (.csv)！", "success");
            };

            const leaderboard = useMemo(() => {
                return Object.values(currentQuestionResponses)
                    .filter(r => r.duration !== undefined)
                    .sort((a, b) => {
                        if (activeQuestion?.mode === 'CHALLENGE') {
                            const scoreA = a.scoreDetails?.totalScore || 0;
                            const scoreB = b.scoreDetails?.totalScore || 0;
                            if (scoreB !== scoreA) return scoreB - scoreA;
                        }
                        return parseFloat(a.duration) - parseFloat(b.duration);
                    });
            }, [currentQuestionResponses, activeQuestion]);

            // Requirement 18: Buzzer Mode - Lock and display ONLY the 1st student who pressed button
            const buzzerWinner = useMemo(() => {
                if (activeQuestion?.mode !== 'BUZZER') return null;
                const sorted = Object.values(currentQuestionResponses).sort((a, b) => parseFloat(a.duration) - parseFloat(b.duration));
                return sorted.length > 0 ? sorted[0] : null;
            }, [currentQuestionResponses, activeQuestion]);

            const challengeScoresAreReleased = useMemo(() => {

                return !!(activeQuestion.challenge?.releaseInstant || activeQuestion.challenge?.scoresReleased);

                                </div>

                                </button>
                            </div>
                        </div>
                    </header>

                    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

                        {/* Mode Selectors */}
                        <div class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-9 gap-2.5">
                            {[

                                { id: 'DRAW', label: '白板題', icon: '🎨' },
                                { id: 'BUZZER', label: '搶答題', icon: '🚨' },

                                { id: 'CHALLENGE', label: '挑戰題', icon: '🏆' },

                                            <button

                                        </div>

                                </div>
                            )}

                            {/* Challenge Setup (Requirement 12, 13, 14) */}

                                                                onClick={() => setChallengeTimeLimit(s)}
                                                                class={`px-2 py-1 text-xs rounded-lg font-bold border transition ${challengeTimeLimit === s ? 'bg-amber-600 text-white border-amber-600' : 'bg-slate-50 text-slate-700'}`}

                                                            <span class="font-mono font-bold">:</span>

        // Student Interface Component
        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
            const [myAnswer, setMyAnswer] = useState('');
            const [submitted, setSubmitted] = useState(false);
            const [duration, setDuration] = useState(0);

            // Audio Recording States (Requirement 5)
            const [isRecording, setIsRecording] = useState(false);
            const [audioBlob, setAudioBlob] = useState(null);
            const [audioUrl, setAudioUrl] = useState(null);
            const [mediaRecorder, setMediaRecorder] = useState(null);

            // Challenge Mode States (Requirement 15 & 19)
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [challengeTimer, setChallengeTimer] = useState(null);

            const myResponseKey = activeQuestion ? `${activeQuestion.id}_${studentId}` : null;
            const myPrevResponse = myResponseKey ? responses[myResponseKey] : null;

            useEffect(() => {
                let interval = null;
                if (activeQuestion && !submitted) {
                    interval = setInterval(() => setDuration(d => d + 1), 1000);
                }
                return () => clearInterval(interval);
            }, [activeQuestion, submitted]);

            useEffect(() => {
                if (myPrevResponse) {
                    setSubmitted(true);
                    setMyAnswer(myPrevResponse.answer);
                    if (myPrevResponse.challengeAnswers) setChallengeAnswers(myPrevResponse.challengeAnswers);
                } else {
                    setSubmitted(false);
                    setMyAnswer('');
                    setAudioBlob(null);
                    setAudioUrl(null);
                    setChallengeAnswers({});
                }
            }, [activeQuestion?.id, myPrevResponse]);

            // Requirement 13 & 15: Challenge Timer Auto-submit at 00:00
            useEffect(() => {
                if (activeQuestion?.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer && !submitted) {
                    const limit = activeQuestion.challenge.timeLimit || 120;
                    const elapsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                    const remain = Math.max(0, limit - elapsed);
                    setChallengeTimer(remain);

                    const timerInterval = setInterval(() => {
                        setChallengeTimer(rem => {
                            if (rem <= 1) {
                                clearInterval(timerInterval);
                                submitChallengeAnswers(true);
                                return 0;
                            }
                            return rem - 1;
                        });
                    }, 1000);

                    return () => clearInterval(timerInterval);
                }
            }, [activeQuestion?.id, submitted]);

            const submitAnswer = async (ansVal) => {
                if (!activeQuestion) return;

                const appId = "omit-8c173";
                const db = window.fbDb;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', myResponseKey);

                const responseData = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    name: studentName || `學號 ${seatNumber}`,
                    seatNumber: seatNumber,
                    answer: ansVal,
                    duration: duration,
                    submittedAt: Date.now()
                };

                await window.fbUtils.setDoc(resDocRef, responseData);
                setSubmitted(true);
                showToast("已提交答案! 讚賞你的努力!", "success");
            };

            const submitChallengeAnswers = async (autoSubmitted = false) => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;

                let correctCount = 0;
                const totalQs = activeQuestion.challenge.questions.length;

                activeQuestion.challenge.questions.forEach(q => {
                    if (challengeAnswers[q.num] === q.answer) correctCount++;
                });

                const totalScore = Math.round((correctCount / totalQs) * (activeQuestion.challenge.totalScore || 100));
                const pct = Math.round((correctCount / totalQs) * 100);

                const appId = "omit-8c173";
                const db = window.fbDb;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', myResponseKey);

                const responseData = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    name: studentName || `學號 ${seatNumber}`,
                    seatNumber: seatNumber,
                    answer: `挑戰題完成 (${totalScore}分)`,
                    challengeAnswers: challengeAnswers,
                    scoreDetails: {
                        totalScore,
                        percentage: pct,
                        correctCount,
                        totalQs
                    },
                    duration: duration,
                    submittedAt: Date.now()
                };

                await window.fbUtils.setDoc(resDocRef, responseData);
                setSubmitted(true);
                if (autoSubmitted) playSound('alarm');
                showToast("已提交答案! 讚賞你的努力! 安靜等候老師指示...", "success");
            };

            // Audio Recorder (Requirement 5)
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const recorder = new MediaRecorder(stream);
                    const chunks = [];

                    recorder.ondataavailable = (e) => chunks.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'audio/webm' });
                        const url = URL.createObjectURL(blob);
                        setAudioBlob(blob);
                        setAudioUrl(url);

                        const reader = new FileReader();
                        reader.onloadend = () => setMyAnswer(reader.result);
                        reader.readAsDataURL(blob);
                    };

                    recorder.start();
                    setMediaRecorder(recorder);
                    setIsRecording(true);

                    setTimeout(() => {
                        if (recorder.state === 'recording') {
                            recorder.stop();
                            setIsRecording(false);
                        }
                    }, 10000);
                } catch (e) {
                    showToast("無法存取麥克風！", "error");
                }
            };

            const stopRecording = () => {
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                    setIsRecording(false);
                }
            };

            // Requirement 22.3.3: Coop Race Stage Student View Logic
            const myCoopTeam = useMemo(() => {
                if (activeQuestion?.mode !== 'COOP' || !activeQuestion.coop?.groups) return null;
                return activeQuestion.coop.groups.find(g => g.members.some(m => m.id === studentId));
            }, [activeQuestion, studentId]);

            const coopMemberIndex = useMemo(() => {
                if (!myCoopTeam) return 0;
                return myCoopTeam.members.findIndex(m => m.id === studentId);
            }, [myCoopTeam, studentId]);

            const currentCoopQ = useMemo(() => {
                if (activeQuestion?.mode !== 'COOP' || !activeQuestion.coop?.questions) return null;
                const idx = myCoopTeam ? myCoopTeam.scoreProgress : 0;
                return activeQuestion.coop.questions[idx] || null;
            }, [activeQuestion, myCoopTeam]);

            const handleCoopOptionClick = async (selectedLetter) => {
                if (!currentCoopQ || !myCoopTeam) return;

                const isCorrect = selectedLetter === currentCoopQ.answer;
                const totalQs = activeQuestion.coop.questions.length;

                const updatedGroups = activeQuestion.coop.groups.map(g => {
                    if (g.id === myCoopTeam.id) {
                        const newProg = isCorrect ? g.scoreProgress + 1 : 0; // Penalty reset to 0
                        return { ...g, scoreProgress: newProg };
                    }
                    return g;
                });

                let winner = activeQuestion.coop.winner;
                const updatedTeam = updatedGroups.find(g => g.id === myCoopTeam.id);
                if (updatedTeam && updatedTeam.scoreProgress >= totalQs) {
                    winner = updatedTeam;
                }

                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                const updatedQ = {
                    ...activeQuestion,
                    coop: {
                        ...activeQuestion.coop,
                        groups: updatedGroups,
                        winner: winner
                    }
                };

                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });

                if (!isCorrect) {
                    playSound('wrong');
                    showToast("答錯了！組別進度倒扣回到起點，請重試！", "error");
                } else {
                    playSound('win');
                    showToast("答對了！向右著色推進一段！", "success");
                }
            };

            const challengeScoresAreReleased = useMemo(() => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return true;
                return !!(activeQuestion.challenge?.releaseInstant || activeQuestion.challenge?.scoresReleased);
            }, [activeQuestion]);

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col">
                    <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
                        <div>
                            <span class="text-xs text-indigo-400 font-black block">宣道會陳元喜小學 OMIT互動課堂</span>
                            <h1 class="text-lg font-black">{seatNumber} 號 - {studentName || '學生端'}</h1>
                        </div>
                        <button onClick={onExit} class="px-3 py-1.5 bg-slate-800 text-slate-300 font-bold text-xs rounded-xl border border-slate-700">
                            🚪 離開
                        </button>
                    </header>

                    <main class="flex-1 p-4 md:p-6 max-w-2xl mx-auto w-full flex flex-col justify-center space-y-4">

                        {/* Broadcast Teacher/Peer Work Overlay */}
                        {activeQuestion?.broadcastedSubmission && (
                            <div class="bg-purple-900 text-white p-5 rounded-3xl shadow-2xl space-y-3 animate-fade-in border-4 border-purple-400">
                                <div class="flex justify-between items-center">
                                    <span class="bg-purple-500 text-white text-xs font-black px-3 py-1 rounded-full uppercase">
                                        📢 螢幕廣播進行中
                                    </span>
                                    <span class="text-xs font-bold text-purple-200">
                                        {activeQuestion.broadcastedSubmission.name} 的作品
                                    </span>
                                </div>
                                <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden border">
                                    <img src={activeQuestion.broadcastedSubmission.answer} class="w-full h-full object-contain" alt="廣播" />
                                </div>
                            </div>
                        )}

                        {!activeQuestion ? (
                            <div class="bg-white rounded-3xl p-8 text-center space-y-4 shadow-sm border border-slate-200">
                                <div class="text-5xl animate-bounce">⏳</div>
                                <h2 class="text-xl font-black text-slate-800">安靜等候老師指示...</h2>
                                <p class="text-xs text-slate-400">當老師發佈題目時，畫面將會自動切換</p>
                            </div>
                        ) : (
                            <div class="bg-white rounded-3xl p-6 shadow-xl border border-slate-200 space-y-5">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <span class="text-xs font-black text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">
                                        【{getModeLabel(activeQuestion.mode)}】
                                    </span>
                                    {challengeTimer !== null && (
                                        <span class="text-xs font-mono font-black text-amber-600 bg-amber-50 px-3 py-1 rounded-full border border-amber-200">
                                            ⏱️ 賸餘: {Math.floor(challengeTimer / 60)}:{(challengeTimer % 60).toString().padStart(2, '0')}
                                        </span>
                                    )}
                                </div>

                                {/* Requirement 4: Link Pushing auto YouTube embed */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div class="space-y-4 text-center">
                                        <h3 class="text-lg font-black text-slate-800">{activeQuestion.text}</h3>
                                        {activeQuestion.youtubeEmbed ? (
                                            <div class="aspect-16-9 rounded-2xl overflow-hidden border-2 shadow-lg">
                                                <iframe src={activeQuestion.youtubeEmbed} class="w-full h-full" allowFullScreen></iframe>
                                            </div>
                                        ) : null}
                                        <a 
                                            href={activeQuestion.pushedUrl} target="_blank" rel="noreferrer"
                                            class="inline-block w-full py-4 bg-indigo-600 text-white font-black text-lg rounded-2xl shadow-lg shadow-indigo-200 hover:bg-indigo-700"
                                        >
                                            開啟連結網站 ↗
                                        </a>
                                    </div>
                                )}

                                {/* Requirement 22.3 font end for Coop Mode */}
                                {activeQuestion.mode === 'COOP' && activeQuestion.coop && (
                                    <div class="space-y-5 text-center">
                                        {myCoopTeam ? (
                                            <div class={`p-4 rounded-2xl border-2 ${myCoopTeam.border} bg-slate-50 space-y-3`}>
                                                <span class={`text-xs font-black text-white px-3 py-1 rounded-full ${myCoopTeam.color}`}>
                                                    你是【{myCoopTeam.name}】的組員
                                                </span>

                                                {currentCoopQ ? (
                                                    <div class="space-y-4 pt-2">
                                                        {coopMemberIndex === 0 ? (
                                                            <div class="bg-white p-5 rounded-2xl border shadow-sm space-y-2">
                                                                <span class="text-xs text-indigo-600 font-extrabold">你的任務：題目讀取員</span>
                                                                <h3 class="text-xl font-black text-slate-800">第 {currentCoopQ.num} 題：{currentCoopQ.text}</h3>
                                                                <p class="text-xs text-slate-400">請大聲讀出題目，讓組員點選答案！</p>
                                                            </div>
                                                        ) : (
                                                            <div class="space-y-3">
                                                                <span class="text-xs text-emerald-600 font-extrabold">你的任務：選擇答案作答員</span>
                                                                <div class="grid grid-cols-2 gap-3">
                                                                    {currentCoopQ.options.map((opt) => (
                                                                        <button 
                                                                            key={opt.letter}
                                                                            onClick={() => handleCoopOptionClick(opt.letter)}
                                                                            class="p-4 rounded-2xl border-2 border-indigo-200 hover:border-indigo-600 bg-white hover:bg-indigo-50 font-black text-lg text-indigo-900 shadow transition active:scale-95"
                                                                        >
                                                                            {opt.letter}. {opt.text}
                                                                        </button>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                ) : (
                                                    <div class="text-emerald-600 font-black text-lg py-4">🎉 全部題目已順利完成！</div>
                                                )}
                                            </div>
                                        ) : (
                                            <div class="text-slate-400 font-bold">盡快與你的組員會合!比賽即將開始!</div>
                                        )}
                                    </div>
                                )}

                                {/* Choice / TF Mode with independent submit button (Requirement 3) */}
                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div class="space-y-4">
                                        <h3 class="text-lg font-black text-slate-800">{activeQuestion.text}</h3>
                                        <div class="grid grid-cols-2 gap-3">
                                            {activeQuestion.choiceOptions.map((opt) => (
                                                <button 
                                                    key={opt}
                                                    disabled={submitted}
                                                    onClick={() => setMyAnswer(opt)}
                                                    class={`p-4 rounded-2xl font-black text-lg border-2 transition ${
                                                        myAnswer === opt 
                                                        ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg' 
                                                        : 'bg-slate-50 text-slate-800 border-slate-200 hover:bg-slate-100'
                                                    }`}
                                                >
                                                    {opt}
                                                </button>
                                            ))}
                                        </div>
                                        {!submitted && myAnswer && (
                                            <button 
                                                onClick={() => submitAnswer(myAnswer)}
                                                class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-lg rounded-2xl shadow-lg transition"
                                            >
                                                確認提交 🚀
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Short Answer Mode (Requirement 3) */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-4">
                                        <h3 class="text-lg font-black text-slate-800">{activeQuestion.text}</h3>
                                        <textarea 
                                            rows={3} disabled={submitted} value={myAnswer}
                                            onChange={(e) => setMyAnswer(e.target.value)}
                                            placeholder="請輸入您的回答..."
                                            class="w-full p-4 border-2 border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 font-medium text-base"
                                        />
                                        {!submitted && (
                                            <button 
                                                onClick={() => submitAnswer(myAnswer)}
                                                class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-lg rounded-2xl shadow-lg transition"
                                            >
                                                確認提交 🚀
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Whiteboard Canvas Mode (Requirement 1, 3, 21) */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <div class="space-y-3">
                                        <h3 class="text-base font-black text-slate-800">{activeQuestion.text}</h3>
                                        <div class="h-96">
                                            <PrecisionWhiteboard 
                                                initialBg={activeQuestion.whiteboardBg}
                                                onSave={(dataUrl) => submitAnswer(dataUrl)}
                                            />
                                        </div>
                                    </div>
                                )}

                                {/* Audio Mode (Requirement 5) */}
                                {activeQuestion.mode === 'AUDIO' && (
                                    <div class="space-y-5 text-center">
                                        <h3 class="text-lg font-black text-slate-800">{activeQuestion.text}</h3>

                                        {!audioUrl ? (
                                            <button 
                                                onClick={isRecording ? stopRecording : startRecording}
                                                class={`w-28 h-28 rounded-full font-black text-3xl shadow-xl transition transform active:scale-95 mx-auto flex items-center justify-center ${
                                                    isRecording ? 'bg-red-500 text-white animate-ping' : 'bg-indigo-600 text-white'
                                                }`}
                                            >
                                                {isRecording ? '⏹' : '🎤'}
                                            </button>
                                        ) : (
                                            <div class="space-y-4 bg-cyan-50 p-4 rounded-2xl border border-cyan-200">
                                                <audio src={audioUrl} controls class="w-full" />
                                                {!submitted && (
                                                    <div class="flex space-x-2">
                                                        <button 
                                                            onClick={() => { setAudioUrl(null); setAudioBlob(null); setMyAnswer(''); }}
                                                            class="w-1/2 py-3 bg-red-100 text-red-700 font-bold rounded-xl text-sm"
                                                        >
                                                            🗑️ 刪除重錄
                                                        </button>
                                                        <button 
                                                            onClick={() => submitAnswer(myAnswer)}
                                                            class="w-1/2 py-3 bg-emerald-600 text-white font-black rounded-xl text-sm shadow"
                                                        >
                                                            ✅ 確認提交錄音
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Buzzer Mode */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="text-center space-y-4">
                                        <h3 class="text-lg font-black text-slate-800">{activeQuestion.text}</h3>
                                        <button 
                                            disabled={submitted}
                                            onClick={() => { submitAnswer('已按鈕搶答！'); playSound('buzzer'); }}
                                            class={`w-40 h-40 rounded-full font-black text-2xl shadow-2xl transition transform active:scale-90 mx-auto flex items-center justify-center border-4 ${
                                                submitted ? 'bg-slate-300 text-slate-500 border-slate-400' : 'bg-rose-500 text-white border-rose-300 hover:bg-rose-600'
                                            }`}
                                        >
                                            {submitted ? '已按制' : '🚨 搶答！'}
                                        </button>
                                    </div>
                                )}

                                {/* Requirement 15 & 19: Challenge Question Upgrade */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                    <div class="space-y-6">
                                        <div class="border-b pb-3">
                                            <h3 class="text-xl font-black text-amber-900">{activeQuestion.challenge.title}</h3>
                                            <p class="text-xs text-slate-400">總分：{activeQuestion.challenge.totalScore}分</p>
                                        </div>

                                        <div class="space-y-5 max-h-96 overflow-y-auto pr-1">
                                            {activeQuestion.challenge.questions.map((q) => {
                                                const myChoice = challengeAnswers[q.num];

                                                return (
                                                    <div key={q.num} class="bg-slate-50 p-4 rounded-2xl border space-y-3">
                                                        <div class="font-black text-slate-800 text-sm">{q.num}. {q.text}</div>
                                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                            {q.options.map((opt) => {
                                                                const isSelected = myChoice === opt.letter;
                                                                let btnStyle = "bg-white border-slate-200 text-slate-700";

                                                                if (submitted && challengeScoresAreReleased) {
                                                                    if (opt.letter === q.answer) {
                                                                        btnStyle = "bg-emerald-500 text-white border-emerald-600 font-bold";
                                                                    } else if (isSelected && opt.letter !== q.answer) {
                                                                        btnStyle = "bg-red-500 text-white border-red-600 font-bold";
                                                                    }
                                                                } else if (isSelected) {
                                                                    btnStyle = "bg-amber-500 text-white border-amber-600 font-bold";
                                                                }

                                                                return (
                                                                    <button 
                                                                        key={opt.letter}
                                                                        disabled={submitted}
                                                                        onClick={() => setChallengeAnswers(prev => ({ ...prev, [q.num]: opt.letter }))}
                                                                        class={`p-3 rounded-xl border text-left text-xs transition ${btnStyle}`}
                                                                    >
                                                                        {opt.letter}. {opt.text}
                                                                    </button>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        {!submitted && (
                                            <button 
                                                onClick={() => submitChallengeAnswers(false)}
                                                class="w-full py-4 bg-amber-600 hover:bg-amber-700 text-white font-black text-lg rounded-2xl shadow-lg transition"
                                            >
                                                確認提交整份考卷 🚀
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Requirement 6: Unified Submission Feedback Message */}
                                {submitted && activeQuestion.mode !== 'COOP' && (
                                    <div class="bg-emerald-50 border-2 border-emerald-200 p-4 rounded-2xl text-center space-y-1 animate-fade-in">
                                        <div class="text-2xl">🎉</div>
                                        <div class="font-black text-emerald-800 text-base">
                                            已提交答案! 讚賞你的努力! 安靜等候老師指示...
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
