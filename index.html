        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        const extractYouTubeEmbed = (url) => {

            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=0` : null;
        };

        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) throw new Error("JSZip library is not loaded.");
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>${paragraphsXml}</w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];
            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) questions.push(currentQ);
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }
                    currentQ.options.push({ letter, text: optText });
                    if (isCorrect) currentQ.answer = letter;
                }
            });

            if (currentQ && currentQ.options.length > 0) questions.push(currentQ);

            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1,
                            text: "以下哪一項不是地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "機械資源" }
                            ],
                            answer: "D"
                        }
                    ]
                };
            }

            return { title, totalScore, questions };
        };

                const filtered = {};
                Object.values(responses).forEach(r => {
                    if (r.questionId === activeQuestion.id) {
                        filtered[r.studentId] = r;
                    }
                });
                return filtered;
            }, [responses, activeQuestion]);

            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(s => {
                            if (s <= 1) {
                                setTimerActive(false);
                                playSound('alarm');
                                return 0;
                            }
                            return s - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            const publishQuestionToFirestore = async (qObj, newHistoryList) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatePayload = {
                    activeQuestion: qObj,
                    updatedAt: Date.now()
                };
                if (newHistoryList) updatePayload.history = newHistoryList;

                await window.fbUtils.setDoc(roomDocRef, updatePayload, { merge: true });
            };

            const handleConfirmExitRoom = async () => {
                try {
                    const appId = "omit-8c173";
                    const db = window.fbDb;
                    
                    const responsesColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');
                    const resSnaps = await window.fbUtils.getDocs(responsesColRef);
                    resSnaps.forEach(async (d) => await window.fbUtils.deleteDoc(d.ref));

                    const studentsColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                    const stuSnaps = await window.fbUtils.getDocs(studentsColRef);
                    stuSnaps.forEach(async (d) => await window.fbUtils.deleteDoc(d.ref));

                    const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                    await window.fbUtils.deleteDoc(roomDocRef);

                    showToast("課室暫存資料已完全清空！", "info");
                } catch (e) {
                    console.error("Cleanup error:", e);
                }
                setShowExitConfirmModal(false);
                onExit();
            };

            const handleDownloadChallengeTemplate = async () => {
                const sampleLines = [
                    "標題：地球生病了",
                    "總分: 100分",
                    "1.以下哪一項不是地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源",
                    "D. 機械資源*",
                    "",
                    "2.芝士的原料屬於哪一項地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源*",
                    "D. 礦產資源"
                ];

                try {
                    const blob = await createWordDocxBlob(sampleLines);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = '挑戰題評估範本_地球生病了.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast("已下載 Word 評估範本檔 (.docx)！", "success");
                } catch (err) {
                    console.error("Docx generation error:", err);
                    showToast("無法生成 Word 範本檔，請重新整理試試。", "error");
                }
            };

            const handleWordFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setDocxFileName(file.name);
                const reader = new FileReader();

                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const arrayBuffer = evt.target.result;
                            const result = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                            parsedData = parseWordChallengeText(result.value);
                        } else {
                            const text = evt.target.result;
                            parsedData = parseWordChallengeText(text);
                        }

                        setChallengeData(parsedData);
                        showToast(`已成功解析範本檔案！共 ${parsedData.questions.length} 題`, 'success');
                    } catch (err) {
                        console.error("Word file parse error:", err);
                        showToast("文件解析失敗，請確認格式！", "error");
                    }
                };

                if (file.name.endsWith('.docx')) {
                    reader.readAsBuffer ? reader.readAsBuffer(file) : reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file, "UTF-8");
                }
            };

            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                
                let challengeContent = null;
                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請先上載並解析 Word 評估範本檔案！", "error");
                        return;
                    }
                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);

                publishQuestionToFirestore(newQ, updatedHistory);
                showToast(`已成功發佈【${getModeLabel(selectedMode)}】給所有學生！`, 'success');
            };

            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已成功向所有學生一併發放挑戰題成績！", "success");
            };

            const handleDownloadAllAudio = async () => {
                const audioSubmissions = Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:audio'));
                
                if (audioSubmissions.length === 0) {
                    showToast("目前尚無學生提交錄音！", "error");
                    return;
                }

                try {
                    const zip = new JSZip();
                    const folder = zip.folder(`課堂錄音_房號${roomCode}`);

                    audioSubmissions.forEach((res) => {
                        const base64Data = res.answer.split(',')[1];
                        const fileName = `${res.seatNumber.toString().padStart(2, '0')}_${res.name || '學生'}.webm`;
                        folder.file(fileName, base64Data, { base64: true });
                    });

                    const content = await zip.generateAsync({ type: "blob" });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(content);
                    link.download = `OMIT_學生錄音_房號${roomCode}.zip`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    showToast(`已打包並下載 ${audioSubmissions.length} 位學生的語音檔案！`, "success");
                } catch (err) {
                    console.error("ZIP creation error:", err);
                    showToast("打包錄音檔案失敗！", "error");
                }
            };

            const handleClearQuestion = async () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: null }, { merge: true });
                showToast('已結束當前題目', 'info');
            };

            const toggleLockMode = async () => {
                const newLock = !lockAfterSubmit;
                setLockAfterSubmit(newLock);
                if (activeQuestion) {
                    const updatedQ = { ...activeQuestion, lockAfterSubmit: newLock };
                    publishQuestionToFirestore(updatedQ);
                    showToast(newLock ? "已鎖定答案（禁止修改）" : "已開放學生修改答案", "info");
                }
            };

            const handleBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setWhiteboardBg(evt.target.result);
                        showToast("已成功載入 16:9 白板背景圖片！", "success");
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleBroadcastSubmission = async (studentRes) => {
                if (!studentRes) return;
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatedQ = { 
                    ...activeQuestion, 
                    broadcastedSubmission: studentRes 
                };
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                showToast(`已成功廣播 ${studentRes.name} 的作品至全班學生螢幕！`, "success");
            };

            const handleExportCSVReport = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生紀錄可供匯出！", "error");
                    return;
                }

                let csvContent = "\uFEFF";
                csvContent += "學號,學生姓名,加入時間";

                historyQuestions.forEach((q, idx) => {
                    const cleanText = (q.text || getModeLabel(q.mode)).replace(/"/g, '""');
                    if (q.mode === 'CHALLENGE' && q.challenge) {
                        csvContent += `,第${idx + 1}題[挑戰題:${q.challenge.title}得分],第${idx + 1}題[挑戰題正確率]`;
                    } else {
                        csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]: "${cleanText}"`;
                    }
                });
                csvContent += "\n";

                const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

                sortedStudents.forEach((stu) => {
                    const cleanName = (stu.name || '').replace(/"/g, '""');
                    csvContent += `"${stu.seatNumber}號","${cleanName}","${stu.joinTime || ''}"`;
                    
                    historyQuestions.forEach((q) => {
                        const resKey = `${q.id}_${stu.id}`;
                        const res = responses[resKey];
                        
                        if (res && res.answer !== undefined && res.answer !== null) {
                            if (q.mode === 'CHALLENGE' && res.scoreDetails) {
                                csvContent += `,"${res.scoreDetails.totalScore} / ${q.challenge.totalScore}分","${res.scoreDetails.percentage}% (用時:${res.duration || 0}s)"`;
                            } else {
                                let ansVal = res.answer;
                                if (typeof ansVal === 'string' && ansVal.startsWith('data:image')) ansVal = '[圖像白板答案]';
                                else if (typeof ansVal === 'string' && ansVal.startsWith('data:audio')) ansVal = '[語音錄音檔案]';
                                const cleanAns = String(ansVal).replace(/"/g, '""');
                                csvContent += `,"${cleanAns} (用時:${res.duration || 0}s)"`;
                            }
                        } else {
                            csvContent += q.mode === 'CHALLENGE' ? `,"未作答","0%"` : `,"未作答"`;
                        }
                    });
                    csvContent += "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `OMIT_課堂學習與挑戰題報告_房號${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("完整學習報告與挑戰題成績已匯出試算表！", "success");
            };

            const leaderboard = useMemo(() => {
                return Object.values(currentQuestionResponses)
                    .filter(r => r.duration !== undefined)
                    .sort((a, b) => {
                        if (activeQuestion?.mode === 'CHALLENGE') {
                            const scoreA = a.scoreDetails?.totalScore || 0;
                            const scoreB = b.scoreDetails?.totalScore || 0;
                            if (scoreB !== scoreA) return scoreB - scoreA;
                        }
                        return parseFloat(a.duration) - parseFloat(b.duration);
                    });
            }, [currentQuestionResponses, activeQuestion]);

            const whiteboardSubmissions = useMemo(() => {
                return Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:image'));
            }, [currentQuestionResponses]);

            const currentInspectIndex = useMemo(() => {
                if (!inspectStudentId) return -1;
                return whiteboardSubmissions.findIndex(r => r.studentId === inspectStudentId);
            }, [inspectStudentId, whiteboardSubmissions]);

            const currentInspectRes = useMemo(() => {
                if (currentInspectIndex >= 0 && whiteboardSubmissions[currentInspectIndex]) {
                    return whiteboardSubmissions[currentInspectIndex];
                }
                return null;
            }, [currentInspectIndex, whiteboardSubmissions]);

            const handlePrevInspect = () => {
                if (whiteboardSubmissions.length === 0) return;
                const prevIdx = (currentInspectIndex - 1 + whiteboardSubmissions.length) % whiteboardSubmissions.length;
                setInspectStudentId(whiteboardSubmissions[prevIdx].studentId);
            };

            const handleNextInspect = () => {
                if (whiteboardSubmissions.length === 0) return;
                const nextIdx = (currentInspectIndex + 1) % whiteboardSubmissions.length;
                setInspectStudentId(whiteboardSubmissions[nextIdx].studentId);
            };

            const challengeScoresAreReleased = useMemo(() => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return true;
                return !!(activeQuestion.challenge?.releaseInstant || activeQuestion.challenge?.scoresReleased);
            }, [activeQuestion]);

            return (
                <div class="min-h-screen pb-12">
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 py-3">
                        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                            <div class="flex items-center space-x-3">
                                <span class="bg-slate-900 text-white font-black px-3 py-1.5 rounded-xl text-lg">OMIT</span>
                                <div>
                                    <h1 class="font-bold text-slate-800 text-base flex items-center gap-2">
                                        宣道會陳元喜小學OMIT互動課堂
                                        <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-0.5 rounded-full font-mono font-bold">
                                            房號：{roomCode}
                                        </span>
                                    </h1>
                                </div>
                            </div>

                            <div class="flex flex-wrap items-center gap-2">
                                <button 
                                    onClick={() => setShowQRModal(true)}
                                    class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-2 rounded-xl border border-indigo-200 text-sm flex items-center space-x-1.5 transition"
                                >
                                    <span>📱 QR Code</span>
                                </button>

                                <button 
                                    onClick={() => setShowStudentListModal(true)}
                                    class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold px-3 py-2 rounded-xl border border-emerald-200 text-sm flex items-center space-x-1.5 transition"
                                >
                                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                                    <span>已加入：{studentsList.length} 人</span>
                                </button>

                                <button 
                                    onClick={() => setShowTimerModal(true)}
                                    class={`px-3 py-2 rounded-xl border text-sm font-bold flex items-center space-x-1.5 transition ${
                                        timerActive 
                                        ? 'bg-amber-500 text-white border-amber-600 animate-pulse' 
                                        : 'bg-amber-50 hover:bg-amber-100 text-amber-800 border-amber-200'
                                    }`}
                                >
                                    <span>⏱️ 計時器</span>
                                    {timerSeconds > 0 && (
                                        <span class="bg-white/20 font-mono text-xs px-1.5 py-0.5 rounded">
                                            {Math.floor(timerSeconds / 60)}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                        </span>
                                    )}
                                </button>

                                <button 
                                    onClick={handleExportCSVReport}
                                    class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold px-3 py-2 rounded-xl border border-blue-200 text-sm transition"
                                >
                                    📊 匯出報告
                                </button>

                                <button 
                                    onClick={() => setShowExitConfirmModal(true)}
                                    class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2 rounded-xl border border-rose-200 text-sm transition"
                                >
                                    🚪 退出課室
                                </button>
                            </div>
                        </div>
                    </header>

                    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
                        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3">
                            {[
                                { id: 'CHOICE', label: '選擇題', icon: '🔘' },
                                { id: 'TF', label: '是非題', icon: '⭕' },
                                { id: 'SHORT', label: '短答題', icon: '✍️' },
                                { id: 'DRAW', label: '白板題', icon: '🎨' },
                                { id: 'BUZZER', label: '搶答題', icon: '🚨' },
                                { id: 'AUDIO', label: '錄音題', icon: '🎤' },
                                { id: 'CHALLENGE', label: '挑戰題', icon: '🏆' },
                                { id: 'LINK', label: '派送連結', icon: '🔗' }
                            ].map((mode) => (
                                <button 
                                    key={mode.id}
                                    onClick={() => setSelectedMode(mode.id)}
                                    class={`p-3.5 rounded-2xl font-bold border-2 transition-all text-center flex flex-col items-center justify-center space-y-1 shadow-sm active:scale-95 ${
                                        selectedMode === mode.id 
                                        ? 'bg-slate-900 text-white border-slate-900 ring-4 ring-slate-200' 
                                        : 'bg-white text-slate-700 border-slate-200 hover:border-slate-300 hover:bg-slate-50'
                                    }`}
                                >
                                    <span class="text-2xl">{mode.icon}</span>
                                    <span class="text-xs md:text-sm font-extrabold">{mode.label}</span>
                                </button>
                            ))}
                        </div>

                        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                            <div class="flex flex-wrap items-center justify-between border-b pb-3 gap-2">
                                <h2 class="font-extrabold text-slate-800 text-lg flex items-center gap-2">
                                    <span>模式設定：{getModeLabel(selectedMode)}</span>
                                </h2>

                                {selectedMode !== 'CHALLENGE' && (
                                    <div class="flex items-center space-x-2 bg-slate-100 p-1.5 rounded-xl">
                                        <span class="text-xs font-bold text-slate-600 pl-2">提交後允許修改：</span>
                                        <button 
                                            onClick={toggleLockMode}
                                            class={`px-3 py-1 rounded-lg text-xs font-bold transition ${!lockAfterSubmit ? 'bg-emerald-500 text-white' : 'bg-slate-300 text-slate-600'}`}
                                        >
                                            {!lockAfterSubmit ? '已開放修改' : '已鎖定 (預設)'}
                                        </button>
                                    </div>
                                )}
                            </div>

                            {selectedMode === 'CHOICE' && (
                                <div class="flex items-center space-x-4">
                                    <label class="text-sm font-bold text-slate-700">選項數量：</label>
                                    {[4, 5].map((cnt) => (
                                        <button 
                                            key={cnt} 
                                            onClick={() => setChoiceCount(cnt)}
                                            class={`px-3 py-1.5 rounded-xl font-bold text-sm border ${choiceCount === cnt ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-700'}`}
                                        >
                                            {cnt} 個選項 ({cnt === 4 ? 'A-D' : 'A-E'})
                                        </button>
                                    ))}
                                </div>
                            )}

                            {selectedMode === 'AUDIO' && (
                                <div class="bg-cyan-50 border border-cyan-200 p-4 rounded-2xl text-cyan-900 space-y-2">
                                    <div class="font-bold text-sm flex items-center gap-2">
                                        <span>🎤 錄音題模式說明：</span>
                                    </div>
                                    <p class="text-xs text-cyan-800">
                                        學生可在手機或平板錄製最多 <strong class="text-red-600">10 秒</strong> 語音。錄音後可即時點擊播放試聽，並提供「刪除重錄」按鈕，確認滿意後再提交。
                                    </p>
                                </div>
                            )}

                            {selectedMode === 'CHALLENGE' && (
                                <div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 p-5 rounded-2xl space-y-5 text-slate-800">
                                    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-amber-200 pb-3">
                                        <h3 class="font-black text-amber-900 text-base flex items-center gap-2">
                                            <span>🏆 Word 文件挑戰題評估設定</span>
                                        </h3>
                                        <div class="flex items-center space-x-2">
                                            <button 
                                                type="button"
                                                onClick={handleDownloadChallengeTemplate}
                                                class="bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow transition flex items-center gap-1.5"
                                            >
                                                <span>📄 下載評估 Word範本檔</span>
                                            </button>
                                            <span class="text-xs bg-amber-200 text-amber-800 px-2.5 py-1 rounded-lg font-bold">自動批改</span>
                                        </div>
                                    </div>

                                    <div class="bg-white p-4 rounded-xl border border-amber-200 space-y-3">
                                        <label class="block text-xs font-bold text-slate-700">
                                            1. 上載修改後的 Word 文件 (.docx) 或文字檔 (.txt)：
                                        </label>
                                        <input 
                                            type="file" 
                                            accept=".docx,.txt"
                                            onChange={handleWordFileUpload}
                                            class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-600 file:text-white hover:file:bg-amber-700 cursor-pointer"
                                        />
                                    </div>
                                </div>
                            )}

                            {selectedMode === 'DRAW' && (
                                <div class="space-y-2 bg-purple-50 p-4 rounded-2xl border border-purple-100">
                                    <label class="block text-sm font-bold text-purple-900">
                                        上傳預設白板背景圖片 (建議 16:9 比例)：
                                    </label>
                                    <input 
                                        type="file" 
                                        accept="image/*" 
                                        onChange={handleBgUpload}
                                        class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-purple-600 file:text-white hover:file:bg-purple-700"
                                    />

        function WhiteboardCanvas({ onSave, bgImage, disabled }) {
            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const [penColor, setPenColor] = useState('#2563eb');
            const [penSize, setPenSize] = useState(4);
            const [isEraser, setIsEraser] = useState(false);
            const [isDrawing, setIsDrawing] = useState(false);
            const [hasContent, setHasContent] = useState(false);

            // Handle precise Canvas coordinate calculation considering resolution scale
            const getPreciseCoords = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                let clientX = 0, clientY = 0;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else if (e.changedTouches && e.changedTouches.length > 0) {
                    clientX = e.changedTouches[0].clientX;
                    clientY = e.changedTouches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                // Scale factor between physical pixels in canvas and displayed bounding rect width/height
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const initCanvas = useCallback(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                // Clear and render background
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (bgImage) {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    };
                    img.src = bgImage;
                }
            }, [bgImage]);

            useEffect(() => {
                initCanvas();
            }, [initCanvas]);

            const startDrawing = (e) => {
                if (disabled) return;
                e.preventDefault();
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const { x, y } = getPreciseCoords(e);

                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = isEraser ? '#ffffff' : penColor;
                ctx.lineWidth = isEraser ? penSize * 5 : penSize;

                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing || disabled) return;
                e.preventDefault();
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const { x, y } = getPreciseCoords(e);

                ctx.lineTo(x, y);
                ctx.stroke();
                setHasContent(true);
            };

            const stopDrawing = (e) => {
                if (!isDrawing) return;
                if (e) e.preventDefault();
                setIsDrawing(false);
                saveCanvas();
            };

            const saveCanvas = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const dataUrl = canvas.toDataURL('image/png');
                onSave(dataUrl);
            };

            const clearCanvas = () => {
                if (disabled) return;
                initCanvas();
                setHasContent(false);
                saveCanvas();
            };

            return (
                <div class="space-y-3">
                    {/* Controls Bar */}
                    <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-100 p-2.5 rounded-2xl border border-slate-200">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold text-slate-500">筆劃顏色:</span>
                            {['#2563eb', '#dc2626', '#16a34a', '#d97706', '#000000'].map((col) => (
                                <button 
                                    key={col}
                                    type="button"
                                    onClick={() => { setPenColor(col); setIsEraser(false); }}
                                    class={`w-7 h-7 rounded-full border-2 transition ${!isEraser && penColor === col ? 'scale-110 border-slate-900 ring-2 ring-indigo-400' : 'border-white'}`}
                                    style={{ backgroundColor: col }}
                                />
                            ))}
                        </div>

                        <div class="flex items-center space-x-2">
                            <button 
                                type="button"
                                onClick={() => setIsEraser(!isEraser)}
                                class={`px-3 py-1.5 rounded-xl text-xs font-bold transition border ${isEraser ? 'bg-amber-500 text-white border-amber-600' : 'bg-white text-slate-700 border-slate-300'}`}
                            >
                                🧹 {isEraser ? '擦膠中' : '橡皮擦'}
                            </button>
                            <button 
                                type="button"
                                onClick={clearCanvas}
                                class="px-3 py-1.5 rounded-xl text-xs font-bold bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100 transition"
                            >
                                🗑️ 清空白板
                            </button>
                        </div>
                    </div>

                    {/* Canvas Container */}
                    <div ref={containerRef} class="canvas-container w-full aspect-16-9 bg-white rounded-2xl border-2 border-slate-300 shadow-inner overflow-hidden relative">
                        <canvas 
                            ref={canvasRef}
                            width={1280}
                            height={720}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            class="w-full h-full cursor-crosshair block"
                        />
                    </div>
                </div>
            );
        }

        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
            const [selectedAnswer, setSelectedAnswer] = useState('');
            const [textAnswer, setTextAnswer] = useState('');
            const [whiteboardData, setWhiteboardData] = useState('');
            
            // Audio Recording States
            const [isRecording, setIsRecording] = useState(false);
            const [audioBlobUrl, setAudioBlobUrl] = useState(null);
            const [audioBase64, setAudioBase64] = useState(null);
            const [recordingTimer, setRecordingTimer] = useState(0);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            // Challenge States
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [challengeSubmitted, setChallengeSubmitted] = useState(false);
            const [challengeTimeLeft, setChallengeTimeLeft] = useState(null);

            const myResponseKey = activeQuestion ? `${activeQuestion.id}_${studentId}` : null;
            const myResponse = myResponseKey ? responses[myResponseKey] : null;

            useEffect(() => {
                if (activeQuestion) {
                    setSelectedAnswer('');
                    setTextAnswer('');
                    setWhiteboardData('');
                    setChallengeAnswers({});
                    setChallengeSubmitted(false);
                    setAudioBlobUrl(null);
                    setAudioBase64(null);

                    if (activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer) {
                        setChallengeTimeLeft(activeQuestion.challenge.timeLimit || 120);
                    } else {
                        setChallengeTimeLeft(null);
                    }
                }
            }, [activeQuestion?.id]);

            // Audio timer limit 10s
            useEffect(() => {
                let interval = null;
                if (isRecording) {
                    interval = setInterval(() => {
                        setRecordingTimer(t => {
                            if (t >= 10) {
                                stopAudioRecording();
                                return 10;
                            }
                            return t + 1;
                        });
                    }, 1000);
                } else {
                    setRecordingTimer(0);
                }
                return () => clearInterval(interval);
            }, [isRecording]);

            const submitStudentAnswer = async (ansValue, scoreDetails = null) => {
                if (!activeQuestion) return;

                const durationSec = Math.max(1, Math.round((Date.now() - activeQuestion.startTime) / 1000));
                
                const responseObj = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: ansValue,
                    duration: durationSec,
                    submittedAt: Date.now(),
                    scoreDetails: scoreDetails
                };

                const appId = "omit-8c173";
                const db = window.fbDb;
                const docKey = `${activeQuestion.id}_${studentId}`;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', docKey);
                
                await window.fbUtils.setDoc(resDocRef, responseObj);
                playSound('win');
                showToast("已成功提交答案！", "success");
            };

            // Audio Recording Controls
            const startAudioRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const blobUrl = URL.createObjectURL(blob);
                        setAudioBlobUrl(blobUrl);

                        const reader = new FileReader();
                        reader.onloadend = () => {
                            setAudioBase64(reader.result);
                        };
                        reader.readAsDataURL(blob);

                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                } catch (err) {
                    console.error("Mic access error:", err);
                    showToast("無法存取麥克風，請確認權限！", "error");
                }
            };

            const stopAudioRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const handleDeleteAudioRecording = () => {
                setAudioBlobUrl(null);
                setAudioBase64(null);
                setRecordingTimer(0);
            };

            const handleSubmitAudio = () => {
                if (!audioBase64) {
                    showToast("請先錄製語音回答！", "error");
                    return;
                }
                submitStudentAnswer(audioBase64);
            };

            const handleBuzzerPress = () => {
                playSound('buzzer');
                submitStudentAnswer('搶答！');
            };

            const handleSubmitChallenge = (autoTimeUp = false) => {
                if (!activeQuestion?.challenge) return;
                const questions = activeQuestion.challenge.questions;
                let correctCount = 0;

                questions.forEach((q, idx) => {
                    if (challengeAnswers[idx] === q.answer) {
                        correctCount++;
                    }
                });

                const totalQ = questions.length || 1;
                const scorePerQ = (activeQuestion.challenge.totalScore || 100) / totalQ;
                const totalScore = Math.round(correctCount * scorePerQ);
                const percentage = Math.round((correctCount / totalQ) * 100);

                const scoreDetails = {
                    correctCount,
                    totalCount: totalQ,
                    totalScore,
                    percentage
                };

                setChallengeSubmitted(true);
                submitStudentAnswer(JSON.stringify(challengeAnswers), scoreDetails);

                if (autoTimeUp) {
                    showToast("時間到！已自動提交挑戰題成績。", "info");
                }
            };

            return (
                <div class="min-h-screen bg-slate-100 pb-12">
                    {/* Student Top Bar */}
                    <header class="bg-indigo-600 text-white shadow-md px-4 py-3 sticky top-0 z-30">
                        <div class="max-w-3xl mx-auto flex justify-between items-center">
                            <div class="flex items-center space-x-2">
                                <span class="bg-white/20 font-black px-2.5 py-1 rounded-lg text-sm">OMIT</span>
                                <span class="font-bold text-sm">房號：{roomCode}</span>
                            </div>
                            <div class="flex items-center space-x-3 text-xs md:text-sm">
                                <span class="bg-indigo-700 px-3 py-1 rounded-full font-bold">
                                    {seatNumber}號 {studentName}
                                </span>
                                <button onClick={onExit} class="text-indigo-200 hover:text-white font-bold">退出</button>
                            </div>
                        </div>
                    </header>

                    <main class="max-w-3xl mx-auto p-4 space-y-5">
                        {/* Broadcast Submission View */}
                        {activeQuestion?.broadcastedSubmission && (
                            <div class="bg-purple-900 text-white rounded-3xl p-5 shadow-xl space-y-3 border-2 border-purple-400 animate-pulse">
                                <div class="flex justify-between items-center border-b border-purple-700 pb-2">
                                    <span class="bg-purple-500 text-white text-xs px-2.5 py-0.5 rounded-full font-bold">
                                        📢 老師廣播作品 (全班觀賞)
                                    </span>
                                    <span class="font-bold text-sm">
                                        {activeQuestion.broadcastedSubmission.seatNumber}號 - {activeQuestion.broadcastedSubmission.name}
                                    </span>
                                </div>
                                <div class="aspect-16-9 bg-black/40 rounded-2xl overflow-hidden border border-purple-500">
                                    <img src={activeQuestion.broadcastedSubmission.answer} class="w-full h-full object-contain" alt="廣播作品" />
                                </div>
                            </div>
                        )}

                        {/* Question Container */}
                        {activeQuestion ? (
                            <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-200 space-y-6">
                                <div class="border-b pb-3 flex justify-between items-start">
                                    <div>
                                        <span class="bg-indigo-100 text-indigo-700 text-xs px-3 py-1 rounded-full font-bold">
                                            {getModeLabel(activeQuestion.mode)}
                                        </span>
                                        <h2 class="text-xl font-black text-slate-800 mt-2">{activeQuestion.text}</h2>
                                    </div>

                                    {activeQuestion.mode === 'CHALLENGE' && challengeTimeLeft !== null && (
                                        <div class="bg-amber-100 border border-amber-300 text-amber-900 px-3 py-1.5 rounded-xl font-mono font-bold text-sm">
                                            ⏱️ 限時: {Math.floor(challengeTimeLeft / 60)}:{(challengeTimeLeft % 60).toString().padStart(2, '0')}
                                        </div>
                                    )}
                                </div>

                                {/* Choice / TF Mode */}
                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        {activeQuestion.choiceOptions.map((opt) => (
                                            <button 
                                                key={opt}
                                                onClick={() => {
                                                    setSelectedAnswer(opt);
                                                    submitStudentAnswer(opt);
                                                }}
                                                disabled={myResponse && activeQuestion.lockAfterSubmit}
                                                class={`p-5 rounded-2xl font-black text-lg text-left border-2 transition shadow-sm active:scale-98 ${
                                                    myResponse?.answer === opt || selectedAnswer === opt
                                                    ? 'bg-indigo-600 text-white border-indigo-600 ring-4 ring-indigo-200'
                                                    : 'bg-slate-50 text-slate-800 border-slate-200 hover:border-indigo-300'
                                                }`}
                                            >
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {/* Short Answer Mode */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-3">
                                        <textarea 
                                            value={textAnswer}
                                            onChange={(e) => setTextAnswer(e.target.value)}
                                            placeholder="請在此輸入您的回答..."
                                            rows={4}
                                            disabled={myResponse && activeQuestion.lockAfterSubmit}
                                            class="w-full p-4 rounded-2xl border-2 border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
                                        />
                                        <button 
                                            onClick={() => submitStudentAnswer(textAnswer)}
                                            disabled={!textAnswer.trim() || (myResponse && activeQuestion.lockAfterSubmit)}
                                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl transition shadow-md disabled:opacity-50"
                                        >
                                            提交短答 🚀
                                        </button>
                                    </div>
                                )}

                                {/* Whiteboard Draw Mode */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <div class="space-y-4">
                                        <WhiteboardCanvas 
                                            bgImage={activeQuestion.whiteboardBg}
                                            disabled={myResponse && activeQuestion.lockAfterSubmit}
                                            onSave={(dataUrl) => {
                                                setWhiteboardData(dataUrl);
                                                submitStudentAnswer(dataUrl);
                                            }}
                                        />
                                    </div>
                                )}

                                {/* Buzzer Mode */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="text-center py-10 space-y-6">
                                        <button 
                                            onClick={handleBuzzerPress}
                                            disabled={!!myResponse}
                                            class="w-48 h-48 rounded-full bg-gradient-to-tr from-rose-600 to-red-500 text-white font-black text-3xl shadow-2xl border-8 border-rose-200 active:scale-90 transition transform hover:scale-105 disabled:opacity-50"
                                        >
                                            {myResponse ? '已搶答！' : '🚨 搶答！'}
                                        </button>
                                    </div>
                                )}

                                {/* Audio Mode */}
                                {activeQuestion.mode === 'AUDIO' && (
                                    <div class="bg-cyan-50/70 border border-cyan-200 p-6 rounded-3xl text-center space-y-5">
                                        <h3 class="font-extrabold text-cyan-900 text-lg">🎤 錄音回答 (最多 10 秒)</h3>
                                        
                                        {!audioBlobUrl && !isRecording && (
                                            <button 
                                                onClick={startAudioRecording}
                                                disabled={myResponse && activeQuestion.lockAfterSubmit}
                                                class="bg-cyan-600 hover:bg-cyan-700 text-white font-black px-8 py-4 rounded-2xl text-lg shadow-lg transition active:scale-95 disabled:opacity-50"
                                            >
                                                🎙️ 開始錄音
                                            </button>
                                        )}

                                        {isRecording && (
                                            <div class="space-y-3">
                                                <div class="text-2xl font-mono font-black text-rose-600 animate-pulse">
                                                    錄音中... {recordingTimer}s / 10s
                                                </div>
                                                <button 
                                                    onClick={stopAudioRecording}
                                                    class="bg-rose-600 hover:bg-rose-700 text-white font-bold px-6 py-3 rounded-xl shadow transition"
                                                >
                                                    ⏹️ 停止錄音
                                                </button>
                                            </div>
                                        )}

                                        {audioBlobUrl && (
                                            <div class="space-y-4 max-w-md mx-auto bg-white p-4 rounded-2xl border border-cyan-200 shadow-sm">
                                                <div class="text-xs font-bold text-slate-500">試聽您的錄音內容：</div>
                                                <audio src={audioBlobUrl} controls class="w-full h-10 rounded-lg" />
                                                
                                                <div class="flex space-x-2 pt-2">
                                                    <button 
                                                        onClick={handleDeleteAudioRecording}
                                                        disabled={myResponse && activeQuestion.lockAfterSubmit}
                                                        class="w-1/2 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold py-2.5 rounded-xl border border-rose-200 text-sm transition"
                                                    >
                                                        🗑️ 刪除重錄
                                                    </button>
                                                    <button 
                                                        onClick={handleSubmitAudio}
                                                        disabled={myResponse && activeQuestion.lockAfterSubmit}
                                                        class="w-1/2 bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2.5 rounded-xl text-sm shadow transition"
                                                    >
                                                        確認提交錄音 🚀
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Link Mode Upgrade with YouTube Player & Independent Button */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div class="space-y-5 text-center">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div class="space-y-3">
                                                <div class="aspect-16-9 bg-black rounded-2xl overflow-hidden shadow-lg border border-slate-300">
                                                    <iframe 
                                                        src={activeQuestion.youtubeEmbed} 
                                                        title="YouTube Video Player"
                                                        class="w-full h-full"
                                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                                        allowFullScreen
                                                    ></iframe>
                                                </div>
                                            </div>
                                        ) : null}

                                        {activeQuestion.pushedUrl && (
                                            <div>
                                                <a 
                                                    href={activeQuestion.pushedUrl} 
                                                    target="_blank" 
                                                    rel="noopener noreferrer"
                                                    class="inline-flex items-center space-x-2 bg-amber-500 hover:bg-amber-600 text-white font-black px-8 py-4 rounded-2xl text-lg shadow-lg transition active:scale-95"
                                                >
                                                    <span>開啟連結網站 ↗</span>
                                                </a>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Challenge Mode Question List */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                    <div class="space-y-6">
                                        {activeQuestion.challenge.questions.map((q, qIdx) => (
                                            <div key={qIdx} class="bg-amber-50/60 p-4 rounded-2xl border border-amber-200 space-y-3">
                                                <div class="font-bold text-slate-800 text-base">
                                                    {q.num || qIdx + 1}. {q.text}
                                                </div>
                                                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                    {q.options.map((opt) => (
                                                        <button 
                                                            key={opt.letter}
                                                            type="button"
                                                            disabled={challengeSubmitted}
                                                            onClick={() => setChallengeAnswers(prev => ({ ...prev, [qIdx]: opt.letter }))}
                                                            class={`p-3 rounded-xl text-left font-bold text-sm border transition ${
                                                                challengeAnswers[qIdx] === opt.letter 
                                                                ? 'bg-amber-600 text-white border-amber-600 shadow' 
                                                                : 'bg-white text-slate-700 border-slate-200 hover:bg-amber-100/50'
                                                            }`}
                                                        >
                                                            {opt.letter}. {opt.text}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}

                                        {!challengeSubmitted && (
                                            <button 
                                                onClick={() => handleSubmitChallenge(false)}
                                                class="w-full bg-amber-600 hover:bg-amber-700 text-white font-black py-4 rounded-2xl shadow-lg text-lg transition active:scale-98"
                                            >
                                                確認提交所有挑戰題 🚀
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* UNIFIED SUBMISSION FEEDBACK MESSAGE */}
                                {myResponse && (
                                    <div class="bg-emerald-50 border-2 border-emerald-400 p-5 rounded-2xl text-center space-y-2 shadow-sm animate-fade-in">
                                        <div class="text-3xl">🎉</div>
                                        <h3 class="font-black text-emerald-800 text-lg md:text-xl">
                                            已提交答案! 讚賞你的努力! 安靜等候老師指示...
                                        </h3>
                                        <p class="text-xs text-emerald-600 font-bold">
                                            提交用時：{myResponse.duration} 秒
                                        </p>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div class="bg-white rounded-3xl p-12 text-center shadow-md border border-slate-200 space-y-3">
                                <div class="text-5xl animate-bounce">☕</div>
                                <h2 class="text-2xl font-black text-slate-800">課堂準備中</h2>
                                <p class="text-slate-500 font-medium">請靜候老師發佈互動題目或派送連結...</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
