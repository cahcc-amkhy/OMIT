    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Helper label switcher
        function getModeLabel(mode) {

                case 'LINK': return '請點擊或觀看下方派送內容：';
                default: return '請回答問題：';
            }
        }

        // Web Audio Sound Effects
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                    });
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-rose-600' : type === 'success' ? 'bg-emerald-600' : 'bg-indigo-600';

            return (
                <div class={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-2 text-sm font-bold animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        // Word .docx Blob Generator
        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) throw new Error("JSZip library is not loaded.");
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>
    ${paragraphsXml}
  </w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        // Parse Word Challenge Text
        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];
            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) questions.push(currentQ);
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }

                    currentQ.options.push({ letter: letter, text: optText });
                    if (isCorrect) currentQ.answer = letter;
                }
            });

            if (currentQ && currentQ.options.length > 0) questions.push(currentQ);

            if (questions.length === 0) {
                return {
                    title: "地球生病了",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1, text: "以下哪一項不是地球的天然資源?",
                            options: [{ letter: "A", text: "水資源" }, { letter: "B", text: "植物資源" }, { letter: "C", text: "動物資源" }, { letter: "D", text: "機械資源" }],
                            answer: "D"
                        },
                        {
                            num: 2, text: "芝士的原料屬於哪一項地球的天然資源?",
                            options: [{ letter: "A", text: "水資源" }, { letter: "B", text: "植物資源" }, { letter: "C", text: "動物資源" }, { letter: "D", text: "礦產資源" }],
                            answer: "C"
                        },
                        {
                            num: 3, text: "人們不當使用水資源會造成甚麼後果?",
                            options: [{ letter: "A", text: "引發極端天氣" }, { letter: "B", text: "引發水災" }, { letter: "C", text: "水土流失" }, { letter: "D", text: "影響食水供應" }],
                            answer: "D"
                        },
                        {
                            num: 4, text: "人們不當使用煤和石油資源會造成甚麼後果?",
                            options: [{ letter: "A", text: "引發極端天氣" }, { letter: "B", text: "引發水災" }, { letter: "C", text: "水土流失" }, { letter: "D", text: "影響食水供應" }],
                            answer: "A"
                        },
                        {
                            num: 5, text: "人們不當使用土地資源會造成甚麼後果?",
                            options: [{ letter: "A", text: "引發極端天氣" }, { letter: "B", text: "引發水災" }, { letter: "C", text: "產生大量二氧化碳" }, { letter: "D", text: "影響食水供應" }],
                            answer: "B"
                        }
                    ]
                };
            }

            return { title, totalScore, questions };
        };

        // Requirement 1, 21: High Accuracy Whiteboard Component (1280x720 canvas resolution mapping)
        const WhiteboardCanvas = ({ initialBg, onSave, isReadOnly = false, readOnlySrc = null, onSubmitConfirm = null, showConfirmBtn = true }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [penColor, setPenColor] = useState('#2563eb');
            const [penSize, setPenSize] = useState(6);
            const [isEraser, setIsEraser] = useState(false);
            const [bgImage, setBgImage] = useState(initialBg || null);

            // Sync canvas resolution 1280x720
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                canvas.width = 1280;
                canvas.height = 720;
                const ctx = canvas.getContext('2d');
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                if (bgImage) {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, 1280, 720);
                    };
                    img.src = bgImage;
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, 1280, 720);
                }
            }, [bgImage]);

            // Coordinate mapping formula using scaleX / scaleY to prevent touch offsets on iPad/tablets
            const getCanvasCoords = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                if (isReadOnly) return;
                e.preventDefault();
                setIsDrawing(true);
                const { x, y } = getCanvasCoords(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            const draw = (e) => {
                if (!isDrawing || isReadOnly) return;
                e.preventDefault();
                const { x, y } = getCanvasCoords(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.strokeStyle = isEraser ? '#ffffff' : penColor;
                ctx.lineWidth = isEraser ? penSize * 3 : penSize;
                ctx.lineTo(x, y);
                ctx.stroke();
            };

            const stopDrawing = (e) => {
                if (!isDrawing || isReadOnly) return;
                setIsDrawing(false);
                if (onSave) {
                    onSave(canvasRef.current.toDataURL('image/png'));
                }
            };

            const handleClear = () => {
                if (isReadOnly) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                if (bgImage) {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, 1280, 720);
                        if (onSave) onSave(canvas.toDataURL('image/png'));
                    };
                    img.src = bgImage;
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, 1280, 720);
                    if (onSave) onSave(canvas.toDataURL('image/png'));
                }
            };

            const handleCustomBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setBgImage(evt.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            if (isReadOnly && readOnlySrc) {
                return (
                    <div class="w-full aspect-16-9 bg-white rounded-2xl overflow-hidden border shadow-inner">
                        <img src={readOnlySrc} class="w-full h-full object-contain" alt="白板作品" />
                    </div>
                );
            }

            return (
                <div class="space-y-3 w-full">
                    {!isReadOnly && (
                        <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-100 p-2.5 rounded-2xl border border-slate-200 text-xs md:text-sm">
                            <div class="flex items-center space-x-2">
                                <div class="flex items-center space-x-1">
                                    {['#2563eb', '#dc2626', '#16a34a', '#000000', '#9333ea'].map((col) => (
                                        <button
                                            key={col}
                                            onClick={() => { setPenColor(col); setIsEraser(false); }}
                                            class={`w-6 h-6 rounded-full border-2 transition ${!isEraser && penColor === col ? 'ring-2 ring-indigo-500 scale-110' : ''}`}
                                            style={{ backgroundColor: col }}
                                        />
                                    ))}
                                </div>

                                <div class="h-4 w-px bg-slate-300"></div>

                                {/* Pen size 2px-18px */}
                                <div class="flex items-center space-x-1 font-bold text-slate-600">
                                    <span>粗細:</span>
                                    {[2, 6, 12, 18].map((sz) => (
                                        <button
                                            key={sz}
                                            onClick={() => setPenSize(sz)}
                                            class={`px-2 py-0.5 rounded-md font-mono ${penSize === sz ? 'bg-indigo-600 text-white font-bold' : 'bg-white text-slate-700'}`}
                                        >
                                            {sz}px
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div class="flex items-center space-x-2">
                                <button
                                    onClick={() => setIsEraser(!isEraser)}
                                    class={`px-3 py-1.5 rounded-xl font-bold transition flex items-center gap-1 ${isEraser ? 'bg-amber-500 text-white shadow' : 'bg-white text-slate-700 border'}`}
                                >
                                    🧽 {isEraser ? '擦膠中' : '擦膠'}
                                </button>
                                <button
                                    onClick={handleClear}
                                    class="px-3 py-1.5 rounded-xl bg-white hover:bg-rose-50 text-rose-600 font-bold border border-rose-200 transition"
                                >
                                    🗑️ 一鍵清空
                                </button>
                                <label class="px-3 py-1.5 rounded-xl bg-white hover:bg-purple-50 text-purple-700 font-bold border border-purple-200 transition cursor-pointer flex items-center gap-1">
                                    🖼️ 上載圖片背景
                                    <input type="file" accept="image/*" onChange={handleCustomBgUpload} class="hidden" />
                                </label>
                            </div>
                        </div>
                    )}

                    <div class="relative w-full aspect-16-9 bg-white rounded-2xl overflow-hidden border-2 border-slate-300 shadow-md canvas-container">
                        <canvas
                            ref={canvasRef}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            class="w-full h-full cursor-crosshair touch-none"
                        />
                    </div>

                    {!isReadOnly && showConfirmBtn && onSubmitConfirm && (
                        <button
                            onClick={() => onSubmitConfirm(canvasRef.current.toDataURL('image/png'))}
                            class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-base rounded-2xl shadow-lg shadow-emerald-200 transition active:scale-98"
                        >
                            ✅ 確認提交白板答案
                        </button>
                    )}
                </div>
            );
        };

        function OMITApp() {
            const [role, setRole] = useState('LANDING'); // 'LANDING', 'TEACHER', 'STUDENT'
            const [roomCode, setRoomCode] = useState('');
            const [seatNumber, setSeatNumber] = useState('1');
            const [studentName, setStudentName] = useState('');
            const [teacherPassword, setTeacherPassword] = useState('');
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [toast, setToast] = useState(null);

            const [activeQuestion, setActiveQuestion] = useState(null);
            const [studentsList, setStudentsList] = useState([]);
            const [responses, setResponses] = useState({});
            const [historyQuestions, setHistoryQuestions] = useState([]);
            const [isAuthReady, setIsAuthReady] = useState(false);

            const myStudentId = useRef('std_' + Math.random().toString(36).substring(2, 9));

            const showToast = (message, type = 'info') => setToast({ message, type });

            // Initialize Anonymous Auth
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (window.fbUtils && window.fbAuth) {
                            await window.fbUtils.signInAnonymously(window.fbAuth);
                            setIsAuthReady(true);
                        }
                    } catch (err) {
                        console.error("Firebase auth failed:", err);
                    }
                };
                initAuth();
            }, []);

            // Check URL query for Room Code
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const roomParam = params.get('room');
                if (roomParam) setRoomCode(roomParam.toUpperCase());
            }, []);

            // Firebase Firestore Sync for Room Data
            useEffect(() => {
                if (!roomCode || !isAuthReady) return;

                const appId = "omit-8c173";
                const db = window.fbDb;
                const { doc, onSnapshot, collection } = window.fbUtils;

                const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                const studentsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                const responsesColRef = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');

            const handleTeacherAccessRequest = () => {

                        {showPasswordModal && (

                                            autoFocus

            if (role === 'TEACHER') {

                    <TeacherDashboard 
                        roomCode={roomCode}

                        setActiveQuestion={setActiveQuestion}
                        responses={responses}
                        setResponses={setResponses}
                        studentsList={studentsList}
                        historyQuestions={historyQuestions}
                        setHistoryQuestions={setHistoryQuestions}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );

            if (role === 'STUDENT') {
                return (
                    <StudentInterface 
                        roomCode={roomCode}
                        studentName={studentName}
                        seatNumber={seatNumber}
                        studentId={myStudentId.current}
                        activeQuestion={activeQuestion}
                        responses={responses}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}

        }

        function TeacherDashboard({ roomCode, activeQuestion, setActiveQuestion, responses, setResponses, studentsList, historyQuestions, setHistoryQuestions, showToast, onExit }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE'); 
            const [questionText, setQuestionText] = useState('');
            const [choiceCount, setChoiceCount] = useState(4);
            const [lockAfterSubmit, setLockAfterSubmit] = useState(true);
            const [whiteboardBg, setWhiteboardBg] = useState(null);
            const [pushedUrl, setPushedUrl] = useState('');

            // Modals & Tools
            const [showQRModal, setShowQRModal] = useState(false);
            const [showStudentListModal, setShowStudentListModal] = useState(false);
            const [showInspectModal, setShowInspectModal] = useState(null);
            const [barChoiceFilter, setBarChoiceFilter] = useState(null);

            // Requirement 21: Fullscreen Demo Whiteboard
            const [showTeacherDemoBoard, setShowTeacherDemoBoard] = useState(false);
            const [isBroadcastingTeacherBoard, setIsBroadcastingTeacherBoard] = useState(false);
            const [teacherBoardData, setTeacherBoardData] = useState(null);

            // Requirement 9: Random Selector Upgrade (Custom Range 1-25, 1-36, non-repeating draw sound)
            const [showRandomModal, setShowRandomModal] = useState(false);
            const [rangeStart, setRangeStart] = useState(1);
            const [rangeEnd, setRangeEnd] = useState(36);
            const [drawnNumbers, setDrawnNumbers] = useState([]);
            const [currentDrawn, setCurrentDrawn] = useState(null);
            const [isSpinning, setIsSpinning] = useState(false);

            // Requirement 10: Timer Tool Enhancement (Quick timers 30s-5m, manual 00:00, zoom & alarm)
            const [showTimerModal, setShowTimerModal] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerActive, setTimerActive] = useState(false);
            const [timerZoomed, setTimerZoomed] = useState(false);
            const [timerMinInput, setTimerMinInput] = useState(1);
            const [timerSecInput, setTimerSecInput] = useState(0);

            // Requirement 12, 13, 14: Challenge Setup States
            const [challengeData, setChallengeData] = useState(null);
            const [challengeEnableTimer, setChallengeEnableTimer] = useState(true);
            const [challengeTimeLimit, setChallengeTimeLimit] = useState(120); 
            const [challengeReleaseInstant, setChallengeReleaseInstant] = useState(true);
            const [showChallengeScoresOnLeaderboard, setShowChallengeScoresOnLeaderboard] = useState(true);

            // Requirement 22, 23, 24, 25: Group Collaboration Contest (合作題) States
            const [groupStage, setGroupStage] = useState('PREPARE'); // 'PREPARE', 'GROUPING', 'RACE'
            const [groupTeams, setGroupTeams] = useState([]);
            const [groupMuted, setGroupMuted] = useState(false);
            const audioRef = useRef(null);

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

            // Filter responses for current active question
            const currentQuestionResponses = useMemo(() => {
                if (!activeQuestion) return {};
                const filtered = {};
                Object.values(responses).forEach(r => {
                    if (r.questionId === activeQuestion.id) {
                        filtered[r.studentId] = r;
                    }
                });
                return filtered;
            }, [responses, activeQuestion]);

            // Timer Interval Logic
            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(s => {
                            if (s <= 1) {
                                setTimerActive(false);
                                playSound('alarm');
                                return 0;
                            }
                            return s - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            // Sync Question & Room Config to Firestore
            const publishQuestionToFirestore = async (qObj, newHistoryList) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatePayload = {
                    activeQuestion: qObj,
                    updatedAt: Date.now()
                };
                if (newHistoryList) updatePayload.history = newHistoryList;

                await window.fbUtils.setDoc(roomDocRef, updatePayload, { merge: true });
            };

            // Requirement 34: One-click "收回題目" (Recall question & return students to idle)
            const handleRecallQuestion = async () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { 
                    activeQuestion: null,
                    broadcastedSubmission: null,
                    teacherBoardBroadcast: null,
                    isTeacherBroadcasting: false
                }, { merge: true });
                showToast("已成功收回題目！所有學生返回待機狀態。", "info");
            };

            // Requirement 12: Download Challenge / Group Word Template
            const handleDownloadWordTemplate = async () => {
                const sampleLines = [
                    "標題：宣道會陳元喜小學 - 互動評估範本",
                    "總分: 100分",
                    "1.以下哪一項不是地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源",
                    "D. 機械資源*",
                    "",
                    "2.芝士的原料屬於哪一項地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源*",
                    "D. 礦產資源",
                    "",
                    "3.人們不當使用水資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應*",
                    "",
                    "4.人們不當使用煤和石油資源會造成甚麼後果?",
                    "A. 引發極端天氣*",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應",
                    "",
                    "5.人們不當使用土地資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災*",
                    "C. 產生大量二氧化碳",
                    "D. 影響食水供應"
                ];

                try {
                    const blob = await createWordDocxBlob(sampleLines);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = '下載評估範本Word檔.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast("已成功下載評估範本Word檔！", "success");
                } catch (err) {
                    console.error("Docx generation error:", err);
                    showToast("無法生成 Word 範本檔，請重新整理試試。", "error");
                }
            };

            // Parse Word File Upload
            const handleWordFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const arrayBuffer = evt.target.result;
                            const result = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                            parsedData = parseWordChallengeText(result.value);
                        } else {
                            parsedData = parseWordChallengeText(evt.target.result);
                        }
                        setChallengeData(parsedData);
                        showToast(`AI 已成功生成評估內容！共 ${parsedData.questions.length} 題`, 'success');
                    } catch (err) {
                        console.error("Word file parse error:", err);
                        showToast("文件解析失敗，請確認格式！", "error");
                    }
                };

                if (file.name.endsWith('.docx')) reader.readAsArrayBuffer(file);
                else reader.readAsText(file, "UTF-8");
            };

            // Question Editing Handlers
            const handleUpdateChallengeTitle = (t) => setChallengeData(p => p ? { ...p, title: t } : null);
            const handleUpdateChallengeScore = (s) => setChallengeData(p => p ? { ...p, totalScore: parseInt(s) || 100 } : null);
            
            const handleUpdateQuestionText = (qIdx, text) => {
                setChallengeData(p => {
                    if (!p) return null;
                    const newQs = [...p.questions];
                    newQs[qIdx] = { ...newQs[qIdx], text };
                    return { ...p, questions: newQs };
                });
            };

            const handleUpdateOptionText = (qIdx, optIdx, text) => {
                setChallengeData(p => {
                    if (!p) return null;
                    const newQs = [...p.questions];
                    const newOpts = [...newQs[qIdx].options];
                    newOpts[optIdx] = { ...newOpts[optIdx], text };
                    newQs[qIdx] = { ...newQs[qIdx], options: newOpts };
                    return { ...p, questions: newQs };
                });
            };

            const handleUpdateCorrectAnswer = (qIdx, ans) => {
                setChallengeData(p => {
                    if (!p) return null;
                    const newQs = [...p.questions];
                    newQs[qIdx] = { ...newQs[qIdx], answer: ans };
                    return { ...p, questions: newQs };
                });
            };

            const handleDeleteQuestion = (qIdx) => {
                setChallengeData(p => {
                    if (!p) return null;
                    const newQs = p.questions.filter((_, idx) => idx !== qIdx).map((q, idx) => ({ ...q, num: idx + 1 }));
                    return { ...p, questions: newQs };
                });
                showToast("已刪除該題！", "info");
            };

            // Requirement 22, 23: Group Auto Random Allocation
            const generateRandomGroups = () => {
                if (studentsList.length < 3) {
                    showToast("目前在線學生不足 3 人，最少需 3 人一組！", "error");
                }

                const animals = [
                    { name: '老虎組', emoji: '🐯', color: 'bg-orange-500 border-orange-600 text-orange-900' },
                    { name: '大象組', emoji: '🐘', color: 'bg-blue-500 border-blue-600 text-blue-900' },
                    { name: '企鵝組', emoji: '🐧', color: 'bg-slate-700 border-slate-800 text-slate-100' },
                    { name: '藍鯨組', emoji: '🐳', color: 'bg-cyan-500 border-cyan-600 text-cyan-900' },
                    { name: '白兔組', emoji: '🐰', color: 'bg-rose-400 border-rose-500 text-rose-950' },
                    { name: '熊貓組', emoji: '🐼', color: 'bg-emerald-600 border-emerald-700 text-emerald-950' },
                    { name: '獅子組', emoji: '🦁', color: 'bg-amber-500 border-amber-600 text-amber-950' },
                    { name: '白羊組', emoji: '🐑', color: 'bg-indigo-400 border-indigo-500 text-indigo-950' },
                    { name: '水牛組', emoji: '🐃', color: 'bg-amber-800 border-amber-900 text-amber-100' },
                    { name: '斑馬組', emoji: '🦓', color: 'bg-purple-600 border-purple-700 text-purple-100' }
                ];

                const shuffledAnimals = [...animals].sort(() => Math.random() - 0.5);
                const shuffledStudents = [...studentsList].sort(() => Math.random() - 0.5);

                const groupCount = Math.max(1, Math.floor(shuffledStudents.length / 3));
                const teams = [];

                for (let i = 0; i < groupCount; i++) {
                    const animal = shuffledAnimals[i % shuffledAnimals.length];
                    teams.push({
                        id: 'team_' + i,
                        name: animal.name,
                        emoji: animal.emoji,
                        colorClass: animal.color,
                        members: [],
                        progress: 0,
                        currentQIndex: 0
                    });
                }

                shuffledStudents.forEach((stu, idx) => {
                    const teamIdx = idx % groupCount;
                    teams[teamIdx].members.push(stu);
                });

                setGroupTeams(teams);
                return teams;
            };

            const handleStartGroupingPhase = () => {
                if (!challengeData || challengeData.questions.length === 0) {
                    showToast("請先下載並上載評估 Word 範本檔！", "error");
                    return;
                }
                const teams = generateRandomGroups();
                setGroupStage('GROUPING');

                // Publish grouping info to student pages
                const newQ = {
                    id: 'q_group_' + Date.now(),
                    mode: 'GROUP',
                    stage: 'GROUPING',
                    teams: teams,
                    challenge: challengeData,
                    startTime: Date.now()
                };
                publishQuestionToFirestore(newQ);
                showToast("已向全班學生發送分組資訊！", "success");
            };

            const handleStartGroupRace = () => {
                setGroupStage('RACE');
                const updatedQ = {
                    ...activeQuestion,
                    stage: 'RACE',
                    startTime: Date.now()
                };
                publishQuestionToFirestore(updatedQ);
                showToast("🏁 比賽正式開始！同組學生互相合作中...", "success");
            };

            // Publish Standard Question
            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                
                let challengeContent = null;
                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請先上載並解析 Word 評估範本檔案！", "error");
                        return;
                    }
                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);

                publishQuestionToFirestore(newQ, updatedHistory);
                showToast(`已成功發佈【${getModeLabel(selectedMode)}】給所有學生！`, 'success');
            };

            // Release Challenge Scores Batch
            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已成功向全班一併發放挑戰題成績！", "success");
            };

            // Download All Audio as ZIP
            const handleDownloadAllAudio = async () => {
                const audioSubmissions = Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:audio'));
                if (audioSubmissions.length === 0) {
                    showToast("目前尚無學生提交錄音！", "error");
                    return;
                }

                try {
                    const zip = new JSZip();
                    const folder = zip.folder(`課堂錄音_房號${roomCode}`);

                    audioSubmissions.forEach((res) => {
                        const base64Data = res.answer.split(',')[1];
                        const fileName = `${res.seatNumber.toString().padStart(2, '0')}_${res.name || '學生'}.webm`;
                        folder.file(fileName, base64Data, { base64: true });
                    });

                    const content = await zip.generateAsync({ type: "blob" });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(content);
                    link.download = `OMIT_學生錄音_房號${roomCode}.zip`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    showToast(`已打包並下載 ${audioSubmissions.length} 位學生的語音檔案！`, "success");
                } catch (err) {
                    console.error("ZIP creation error:", err);
                    showToast("打包錄音檔案失敗！", "error");
                }
            };

            // Toggle Broadcast Student Work
            const handleBroadcastSubmission = async (studentRes) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatedQ = { 
                    ...activeQuestion, 
                    broadcastedSubmission: studentRes 
                };
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                showToast(`已廣播 ${studentRes.name} 的作品至全班學生螢幕！`, "success");
            };

            const handleCancelBroadcast = async () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatedQ = { 
                    ...activeQuestion, 
                    broadcastedSubmission: null 
                };
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                showToast("已取消作品全班廣播", "info");
            };

            // Requirement 32: Teacher Demo Board Broadcast Toggle
            const handleToggleTeacherBoardBroadcast = async () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                const nextState = !isBroadcastingTeacherBoard;
                setIsBroadcastingTeacherBoard(nextState);

                await window.fbUtils.setDoc(roomDocRef, {
                    teacherBoardBroadcast: teacherBoardData,
                    isTeacherBroadcasting: nextState
                }, { merge: true });

                showToast(nextState ? "已著色廣播：教師示範白板即時顯示在每位學生螢幕上！" : "已收回廣播：學生螢幕恢復原狀", "info");
            };

            // Requirement 9: Random Spin Logic
            const handleSpinRandom = () => {
                if (isSpinning) return;
                const start = parseInt(rangeStart) || 1;
                const end = parseInt(rangeEnd) || 36;
                const available = [];
                for (let i = start; i <= end; i++) {
                    if (!drawnNumbers.includes(i)) available.push(i);
                }

                if (available.length === 0) {
                    showToast("該範圍學號已全部抽過！請點擊重置。", "error");
                    return;
                }

                setIsSpinning(true);
                let counter = 0;
                const maxIntervals = 20;

                const timer = setInterval(() => {
                    const temp = available[Math.floor(Math.random() * available.length)];
                    setCurrentDrawn(temp);
                    playSound('spin');
                    counter++;

                    if (counter >= maxIntervals) {
                        clearInterval(timer);
                        const finalPicked = available[Math.floor(Math.random() * available.length)];
                        setCurrentDrawn(finalPicked);
                        setDrawnNumbers(prev => [...prev, finalPicked]);
                        setIsSpinning(false);
                        playSound('win');
                    }
                }, 100);
            };

            // Requirement 20, 30: CSV Export for Challenge Mode & Classroom
            const handleExportCSVReport = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生紀錄可供匯出！", "error");
                    return;
                }

                let csvContent = "\uFEFF";
                csvContent += "學號,學生姓名,加入時間";

                historyQuestions.forEach((q, idx) => {
                    if (q.mode === 'CHALLENGE' && q.challenge) {
                        csvContent += `,第${idx + 1}題[挑戰題:${q.challenge.title}得分],第${idx + 1}題[正確率],第${idx + 1}題[用時]`;
                    } else {
                        const cleanText = (q.text || getModeLabel(q.mode)).replace(/"/g, '""');
                        csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]: "${cleanText}"`;
                    }
                });
                csvContent += "\n";

                const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

                sortedStudents.forEach((stu) => {
                    const cleanName = (stu.name || '').replace(/"/g, '""');
                    csvContent += `"${stu.seatNumber}號","${cleanName}","${stu.joinTime || ''}"`;
                    
                    historyQuestions.forEach((q) => {
                        const resKey = `${q.id}_${stu.id}`;
                        const res = responses[resKey];
                        
                        if (res && res.answer !== undefined && res.answer !== null) {
                            if (q.mode === 'CHALLENGE' && res.scoreDetails) {
                                csvContent += `,"${res.scoreDetails.totalScore} / ${q.challenge.totalScore}分","${res.scoreDetails.percentage}%","${res.duration || 0}秒"`;
                            } else {
                                let ansVal = res.answer;
                                if (typeof ansVal === 'string' && ansVal.startsWith('data:image')) ansVal = '[圖像白板答案]';
                                else if (typeof ansVal === 'string' && ansVal.startsWith('data:audio')) ansVal = '[語音錄音檔案]';
                                const cleanAns = String(ansVal).replace(/"/g, '""');
                                csvContent += `,"${cleanAns} (用時:${res.duration || 0}s)"`;
                            }
                        } else {
                            if (q.mode === 'CHALLENGE') csvContent += `,"未作答","0%","0s"`;
                            else csvContent += `,"未作答"`;
                        }
                    });
                    csvContent += "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `📥 匯出本次挑戰題成績試算表 (${roomCode}).csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("已成功下載包含全班學號、姓名、總分、正確率與用時的 CSV 試算表！", "success");
            };

            // Requirement 7, 31: Leaderboard sorting & Gold/Silver/Bronze Badges
            const leaderboard = useMemo(() => {
                return Object.values(currentQuestionResponses)
                    .filter(r => r.duration !== undefined)
                    .sort((a, b) => {
                        if (activeQuestion?.mode === 'CHALLENGE') {
                            const scoreA = a.scoreDetails?.totalScore || 0;
                            const scoreB = b.scoreDetails?.totalScore || 0;
                            if (scoreB !== scoreA) return scoreB - scoreA;
                        }
                        return parseFloat(a.duration) - parseFloat(b.duration);
                    });
            }, [currentQuestionResponses, activeQuestion]);

            const whiteboardSubmissions = useMemo(() => {
                return Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:image'));
            }, [currentQuestionResponses]);

            const challengeScoresAreReleased = useMemo(() => {

                                        宣道會陳元喜小學 OMIT互動課堂

                                    <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-0.5 rounded-full font-mono font-bold">
                                        房號：{roomCode}

                                </div>
                            </div>

                            <div class="flex flex-wrap items-center gap-2">
                                {/* Requirement 11: Real-time Online Student Tag */}
                                <button

                                    class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-2 rounded-xl border border-indigo-200 text-xs md:text-sm flex items-center space-x-1.5 transition"
                                >
                                    <span>📱 QR Code</span>
                                    <span class="bg-indigo-600 text-white font-bold px-2 py-0.5 rounded-full text-xs">
                                        {studentsList.length}人在線
                                    </span>
                                </button>

                                {/* Requirement 21: Fullscreen Demo Board */}
                                <button 
                                    onClick={() => setShowTeacherDemoBoard(true)}
                                    class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-3 py-2 rounded-xl shadow text-xs md:text-sm transition flex items-center space-x-1"
                                >
                                    <span>🎨 示範白板</span>
                                </button>

                                {/* Requirement 9: Random Selector Button */}
                                <button

                                    class="bg-purple-50 hover:bg-purple-100 text-purple-700 font-bold px-3 py-2 rounded-xl border border-purple-200 text-xs md:text-sm transition"
                                >
                                    🎲 抽選學生
                                </button>

                                {/* Requirement 10: Timer Button */}
                                <button 
                                    onClick={() => setShowTimerModal(true)}
                                    class={`px-3 py-2 rounded-xl border text-xs md:text-sm font-bold flex items-center space-x-1.5 transition ${
                                        timerActive 
                                        ? 'bg-amber-500 text-white border-amber-600 animate-pulse' 
                                        : 'bg-amber-50 hover:bg-amber-100 text-amber-800 border-amber-200'
                                    }`}

                                    <span>⏱️ 計時器</span>
                                    {timerSeconds > 0 && (

                                            {Math.floor(timerSeconds / 60)}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                        </span>

                                </button>

                                {/* Requirement 20, 30: CSV Export */}
                                <button

                                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-2 rounded-xl shadow text-xs md:text-sm transition flex items-center space-x-1"

                                    📥 匯出成績 CSV
                                </button>

                                <button 
                                    onClick={onExit}

                                >
                                    🚪 離開課室
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Container */}
                    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

                        {/* Mode Selectors */}
                        <div class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-9 gap-2 md:gap-3">
                            {[
                                { id: 'CHOICE', label: '選擇題', icon: '🔘' },
                                { id: 'TF', label: '是非題', icon: '⭕' },
                                { id: 'SHORT', label: '短答題', icon: '✍️' },
                                { id: 'DRAW', label: '白板題', icon: '🎨' },
                                { id: 'BUZZER', label: '搶答題', icon: '🚨' },
                                { id: 'AUDIO', label: '錄音題', icon: '🎤' },
                                { id: 'CHALLENGE', label: '挑戰題', icon: '🏆' },
                                { id: 'GROUP', label: '合作題', icon: '🤝' },
                                { id: 'LINK', label: '派送連結', icon: '🔗' }
                            ].map((mode) => (
                                <button 
                                    key={mode.id}
                                    onClick={() => setSelectedMode(mode.id)}
                                    class={`p-3 rounded-2xl font-bold border-2 transition-all text-center flex flex-col items-center justify-center space-y-1 shadow-sm active:scale-95 ${
                                        selectedMode === mode.id 
                                        ? 'bg-slate-900 text-white border-slate-900 ring-4 ring-slate-200' 
                                        : 'bg-white text-slate-700 border-slate-200 hover:border-slate-300 hover:bg-slate-50'
                                    }`}
                                >
                                    <span class="text-xl md:text-2xl">{mode.icon}</span>
                                    <span class="text-xs font-extrabold">{mode.label}</span>

                        {/* Question Creation Panel */}
                        <div class="bg-white rounded-3xl p-5 md:p-6 shadow-sm border border-slate-200 space-y-4">

                                {selectedMode !== 'CHALLENGE' && selectedMode !== 'GROUP' && (

                                        />

                                                        <input

                                                            onChange={(e) => handleUpdateChallengeScore(e.target.value)}
                                                            class="w-full px-3 py-2 rounded-lg border focus:ring-2 focus:ring-amber-500 font-bold text-slate-800 text-sm bg-white"
                                                        />

                                                <div class="space-y-3 max-h-80 overflow-y-auto pr-1">

                                                                    <input

                                                                        value={q.text}
                                                                        onChange={(e) => handleUpdateQuestionText(qIdx, e.target.value)}
                                                                        class="w-full px-2 py-1.5 border rounded font-medium text-slate-800 focus:ring-1 focus:ring-amber-500"

                                                                <button

                                                                    🗑️ 刪除

                                                                <button 
                                                                    key={s}

                                                                    onClick={() => setChallengeTimeLimit(s)}
                                                                    class={`px-2.5 py-1 text-xs rounded-lg font-bold border transition ${challengeTimeLimit === s ? 'bg-amber-600 text-white border-amber-600' : 'bg-slate-50 text-slate-700 hover:bg-slate-100'}`}

                                                        </div>

                                                                <input

                                                                <span class="font-mono font-bold text-amber-900 text-xs">:</span>
                                                                <input
