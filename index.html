        // Web Audio API Sound Generator
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                    });
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        const Toast = ({ message, type, onClose }) => {

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        // Create Word (.docx) binary Blob
        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) {
                throw new Error("JSZip library is not loaded.");
            }
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => {
                return `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`;
            }).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>
    ${paragraphsXml}
  </w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        // Parse Word doc or text file
        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];

            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) {
                        questions.push(currentQ);
                    }
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }

                    currentQ.options.push({
                        letter: letter,
                        text: optText
                    });

                    if (isCorrect) {
                        currentQ.answer = letter;
                    }
                }
            });

            if (currentQ && currentQ.options.length > 0) {
                questions.push(currentQ);
            }

            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1,
                            text: "以下哪一項不是地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "機械資源" }
                            ],
                            answer: "D"
                        },
                        {
                            num: 2,
                            text: "芝士的原料屬於哪一項地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "礦產資源" }
                            ],
                            answer: "C"
                        }
                    ]
                };
            }

            return {
                title,
                totalScore,
                questions
            };
        };

        // Item 1 & 20: High-accuracy 1280x720 Whiteboard Canvas with ratio mapping for iPad/tablets
        function WhiteboardCanvas({ initialBg, onSubmit, isTeacherMode = false }) {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [color, setColor] = useState('#000000');
            const [lineWidth, setLineWidth] = useState(4); // 2px-18px
            const [isEraser, setIsEraser] = useState(false);
            const [canvasBgImage, setCanvasBgImage] = useState(initialBg || null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                // Set 1280x720 standard canvas resolution
                canvas.width = 1280;
                canvas.height = 720;

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 1280, 720);

                if (canvasBgImage) {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, 1280, 720);
                    };
                    img.src = canvasBgImage;
                }
            }, [canvasBgImage]);

            const getCanvasPos = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                const scaleX = 1280 / rect.width;
                const scaleY = 720 / rect.height;

                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                setIsDrawing(true);
                const pos = getCanvasPos(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const pos = getCanvasPos(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.strokeStyle = isEraser ? '#ffffff' : color;
                ctx.lineWidth = lineWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            const stopDrawing = (e) => {
                if (!isDrawing) return;
                e?.preventDefault();
                setIsDrawing(false);
            };

            const handleClear = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 1280, 720);

                if (canvasBgImage) {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, 1280, 720);
                    };
                    img.src = canvasBgImage;
                }
            };

            const handleUploadBg = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setCanvasBgImage(evt.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleExport = () => {
                const canvas = canvasRef.current;
                const dataUrl = canvas.toDataURL('image/png');
                if (onSubmit) onSubmit(dataUrl);
            };

            return (
                <div class="space-y-4 max-w-4xl mx-auto">
                    {/* Controls Toolbar */}
                    <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-800 text-white p-3 rounded-2xl shadow-md">
                        <div class="flex flex-wrap items-center gap-3">
                            <div class="flex items-center space-x-1">
                                <span class="text-xs font-bold text-slate-300">顏色:</span>
                                {['#000000', '#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'].map(c => (
                                    <button 
                                        key={c}
                                        type="button"
                                        onClick={() => { setColor(c); setIsEraser(false); }}
                                        class={`w-7 h-7 rounded-full border-2 transition ${color === c && !isEraser ? 'scale-110 border-white ring-2 ring-indigo-400' : 'border-transparent'}`}
                                        style={{ backgroundColor: c }}
                                    />
                                ))}
                            </div>

                            <div class="flex items-center space-x-2 border-l border-slate-600 pl-3">
                                <span class="text-xs font-bold text-slate-300">粗幼: {lineWidth}px</span>
                                <input 
                                    type="range" 
                                    min="2" 
                                    max="18" 
                                    value={lineWidth} 
                                    onChange={(e) => setLineWidth(parseInt(e.target.value))}
                                    class="w-24 accent-indigo-400 cursor-pointer"
                                />
                            </div>

                            <button 
                                type="button"
                                onClick={() => setIsEraser(!isEraser)}
                                class={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 ${isEraser ? 'bg-amber-500 text-white' : 'bg-slate-700 text-slate-200 hover:bg-slate-600'}`}
                            >
                                <span>🧽 擦膠</span>
                            </button>

                            <button 
                                type="button"
                                onClick={handleClear}
                                class="px-3 py-1.5 rounded-xl text-xs font-bold bg-rose-600 text-white hover:bg-rose-700 transition"
                            >
                                🗑️ 一鍵清空
                            </button>
                        </div>

                        {!isTeacherMode && (
                            <div class="flex items-center space-x-2">
                                <label class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold cursor-pointer transition">
                                    🖼️ 上載背景圖
                                    <input type="file" accept="image/*" onChange={handleUploadBg} class="hidden" />
                                </label>
                            </div>
                        )}
                    </div>

                    {/* Canvas Display */}
                    <div class="canvas-container relative bg-white border-4 border-slate-300 rounded-2xl shadow-inner overflow-hidden aspect-16-9">
                        <canvas 
                            ref={canvasRef}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            class="w-full h-full cursor-crosshair block"
                        />
                    </div>

                    {!isTeacherMode && (
                        <button 
                            type="button"
                            onClick={handleExport}
                            class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-lg rounded-2xl shadow-lg shadow-emerald-200 transition active:scale-98"
                        >
                            ✅ 確認提交白板作品
                        </button>
                    )}
                </div>
            );
        }

        // Main App
        function OMITApp() {
            const [role, setRole] = useState('LANDING'); // 'LANDING', 'TEACHER', 'STUDENT'
            const [roomCode, setRoomCode] = useState('');
            const [seatNumber, setSeatNumber] = useState('1');
            const [studentName, setStudentName] = useState('');
            const [teacherPassword, setTeacherPassword] = useState('');
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [toast, setToast] = useState(null);

            const [activeQuestion, setActiveQuestion] = useState(null);
            const [studentsList, setStudentsList] = useState([]);
            const [responses, setResponses] = useState({});
            const [historyQuestions, setHistoryQuestions] = useState([]);
            const [isAuthReady, setIsAuthReady] = useState(false);

            const myStudentId = useRef('std_' + Math.random().toString(36).substring(2, 9));

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (window.fbUtils && window.fbAuth) {
                            await window.fbUtils.signInAnonymously(window.fbAuth);
                            setIsAuthReady(true);
                        }
                    } catch (err) {
                        console.error("Firebase auth failed:", err);
                    }
                };
                initAuth();
            }, []);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const roomParam = params.get('room');
                if (roomParam) {
                    setRoomCode(roomParam.toUpperCase());
                }
            }, []);

            useEffect(() => {
                if (!roomCode || !isAuthReady) return;

                const appId = "omit-8c173";
                const db = window.fbDb;
                const { doc, onSnapshot, collection } = window.fbUtils;

                const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                const studentsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                const responsesColRef = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');

            const handleTeacherAccessRequest = () => {

                        {showPasswordModal && (

                                            autoFocus

                                        <div class="flex space-x-2">

            if (role === 'TEACHER') {
                return (
                    <TeacherDashboard 
                        roomCode={roomCode}

                        setActiveQuestion={setActiveQuestion}

                        setResponses={setResponses}
                        studentsList={studentsList}
                        historyQuestions={historyQuestions}
                        setHistoryQuestions={setHistoryQuestions}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />

            if (role === 'STUDENT') {
                return (
                    <StudentInterface 
                        roomCode={roomCode}
                        studentName={studentName}
                        seatNumber={seatNumber}
                        studentId={myStudentId.current}
                        activeQuestion={activeQuestion}
                        responses={responses}
                        studentsList={studentsList}
                        showToast={showToast}

        // Teacher Dashboard Component
        function TeacherDashboard({ roomCode, activeQuestion, setActiveQuestion, responses, setResponses, studentsList, historyQuestions, setHistoryQuestions, showToast, onExit }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE');
            const [questionText, setQuestionText] = useState('');
            const [choiceCount, setChoiceCount] = useState(4);
            const [lockAfterSubmit, setLockAfterSubmit] = useState(true);
            const [whiteboardBg, setWhiteboardBg] = useState(null);
            const [pushedUrl, setPushedUrl] = useState('');

            // Modals & Tools
            const [showQRModal, setShowQRModal] = useState(false);
            const [showStudentListModal, setShowStudentListModal] = useState(false);
            const [showInspectModal, setShowInspectModal] = useState(null);
            const [barChoiceFilter, setBarChoiceFilter] = useState(null);
            const [showTeacherWhiteboard, setShowTeacherWhiteboard] = useState(false); // Item 20

            // Item 7: Random Selector State with custom range
            const [showRandomModal, setShowRandomModal] = useState(false);
            const [rangeStart, setRangeStart] = useState(1);
            const [rangeEnd, setRangeEnd] = useState(36);
            const [drawnNumbers, setDrawnNumbers] = useState([]);
            const [currentDrawn, setCurrentDrawn] = useState(null);
            const [isSpinning, setIsSpinning] = useState(false);

            // Item 8: Timer Modal State with MM:SS manual input
            const [showTimerModal, setShowTimerModal] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerActive, setTimerActive] = useState(false);
            const [timerMinutesInput, setTimerMinutesInput] = useState('00');
            const [timerSecondsInput, setTimerSecondsInput] = useState('00');

            // Item 10 & 11: Challenge Setup States
            const [challengeData, setChallengeData] = useState(null);
            const [challengeEnableTimer, setChallengeEnableTimer] = useState(true);
            const [challengeTimeLimit, setChallengeTimeLimit] = useState(120); // 120s default
            const [challengeReleaseInstant, setChallengeReleaseInstant] = useState(true);
            const [showChallengeScoresOnLeaderboard, setShowChallengeScoresOnLeaderboard] = useState(true);

            // Item 21: Group Mode (Quizlet Live) States
            const [enableGroupMode, setEnableGroupMode] = useState(false);
            const [groupsData, setGroupsData] = useState([]); // Array of group objects
            const [groupGameStatus, setGroupGameStatus] = useState('PREP'); // 'PREP', 'RACING', 'ENDED'

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

            // Filter current responses for active question
            const currentQuestionResponses = useMemo(() => {
                if (!activeQuestion) return {};
                const filtered = {};
                Object.values(responses).forEach(r => {
                    if (r.questionId === activeQuestion.id) {
                        filtered[r.studentId] = r;
                    }
                });
                return filtered;
            }, [responses, activeQuestion]);

            // Timer Interval Logic
            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(s => {
                            if (s <= 1) {
                                setTimerActive(false);
                                playSound('alarm');
                                return 0;
                            }
                            return s - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            // Sync Question & Room to Firestore
            const publishQuestionToFirestore = async (qObj, newHistoryList) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatePayload = {
                    activeQuestion: qObj,
                    updatedAt: Date.now()
                };
                if (newHistoryList) {
                    updatePayload.history = newHistoryList;
                }

                await window.fbUtils.setDoc(roomDocRef, updatePayload, { merge: true });
            };

            const handleExitRoom = async () => {
                if (window.confirm("確定退出課室？將會同步清空此課室於 Firebase 的所有暫存紀錄！")) {
                    try {
                        const appId = "omit-8c173";
                        const db = window.fbDb;
                        
                        const responsesColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');
                        const resSnaps = await window.fbUtils.getDocs(responsesColRef);
                        resSnaps.forEach(async (d) => {
                            await window.fbUtils.deleteDoc(d.ref);
                        });

                        const studentsColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                        const stuSnaps = await window.fbUtils.getDocs(studentsColRef);
                        stuSnaps.forEach(async (d) => {
                            await window.fbUtils.deleteDoc(d.ref);
                        });

                        const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                        await window.fbUtils.deleteDoc(roomDocRef);

                        showToast("課室暫存資料已完全清空！", "info");
                    } catch (e) {
                        console.error("Cleanup error:", e);
                    }
                    onExit();
                }
            };

            // Item 10: Download Assessment Template (.docx)
            const handleDownloadChallengeTemplate = async () => {
                const sampleLines = [
                    "標題：地球生病了",
                    "總分: 100分",
                    "1.以下哪一項不是地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源",
                    "D. 機械資源*",
                    "",
                    "2.芝士的原料屬於哪一項地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源*",
                    "D. 礦產資源",
                    "",
                    "3.人們不當使用水資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應*",
                    "",
                    "4.人們不當使用煤和石油資源會造成甚麼後果?",
                    "A. 引發極端天氣*",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應",
                    "",
                    "5.人們不當使用土地資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災*",
                    "C. 產生大量二氧化碳",
                    "D. 影響食水供應"
                ];

                try {
                    const blob = await createWordDocxBlob(sampleLines);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = '下載評估範本Word檔.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast("已成功下載「下載評估範本Word檔.docx」！", "success");
                } catch (err) {
                    console.error("Docx generation error:", err);
                    showToast("無法生成 Word 範本檔，請重新整理試試。", "error");
                }
            };

            const handleWordFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const arrayBuffer = evt.target.result;
                            const result = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                            parsedData = parseWordChallengeText(result.value);
                        } else {
                            const text = evt.target.result;
                            parsedData = parseWordChallengeText(text);
                        }

                        setChallengeData(parsedData);
                        showToast(`已成功解析範本檔案！共 ${parsedData.questions.length} 題`, 'success');
                    } catch (err) {
                        console.error("Word file parse error:", err);
                        showToast("文件解析失敗，請確認格式！", "error");
                    }
                };

                if (file.name.endsWith('.docx')) {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file, "UTF-8");
                }
            };

            // Challenge Question Modifier Helpers
            const handleUpdateChallengeTitle = (newTitle) => setChallengeData(p => p ? { ...p, title: newTitle } : null);
            const handleUpdateChallengeScore = (newScore) => setChallengeData(p => p ? { ...p, totalScore: parseInt(newScore) || 100 } : null);
            const handleUpdateQuestionText = (qIdx, text) => {
                setChallengeData(p => {
                    if (!p) return null;
                    const qs = [...p.questions];
                    qs[qIdx] = { ...qs[qIdx], text };
                    return { ...p, questions: qs };
                });
            };
            const handleUpdateOptionText = (qIdx, optIdx, text) => {
                setChallengeData(p => {
                    if (!p) return null;
                    const qs = [...p.questions];
                    const opts = [...qs[qIdx].options];
                    opts[optIdx] = { ...opts[optIdx], text };
                    qs[qIdx] = { ...qs[qIdx], options: opts };
                    return { ...p, questions: qs };
                });
            };
            const handleUpdateCorrectAnswer = (qIdx, ans) => {
                setChallengeData(p => {
                    if (!p) return null;
                    const qs = [...p.questions];
                    qs[qIdx] = { ...qs[qIdx], answer: ans };
                    return { ...p, questions: qs };
                });
            };
            const handleDeleteQuestion = (qIdx) => {
                setChallengeData(p => {
                    if (!p) return null;
                    const qs = p.questions.filter((_, idx) => idx !== qIdx).map((q, idx) => ({ ...q, num: idx + 1 }));
                    return { ...p, questions: qs };
                });
                showToast("已成功刪除該題目！", "info");
            };

            // Item 21: Auto Divide Group Function
            const handleGenerateGroups = () => {
                if (studentsList.length < 2) {
                    showToast("目前在線學生不足 2 人，無法進行分組！", "error");
                    return;
                }

                const shuffled = [...studentsList].sort(() => Math.random() - 0.5);
                const groupCount = Math.max(1, Math.ceil(shuffled.length / 3.5)); // 3-4 per group
                
                const newGroups = [];
                for (let i = 0; i < groupCount; i++) {
                    const preset = GROUP_PRESETS[i % GROUP_PRESETS.length];
                    newGroups.push({
                        id: 'grp_' + i,
                        name: preset.name,
                        color: preset.color,
                        bgClass: preset.bgClass,
                        textClass: preset.textClass,
                        borderClass: preset.borderClass,
                        members: [],
                        score: 0,
                        currentQIndex: 0
                    });
                }

                shuffled.forEach((stu, idx) => {
                    const targetGrp = newGroups[idx % groupCount];
                    targetGrp.members.push(stu);
                });

                setGroupsData(newGroups);
                setGroupGameStatus('PREP');
                showToast("已成功隨機分配全班學生至各動物組別！", "success");
            };

            // Start Group Game
            const handleStartGroupGame = async () => {
                if (!activeQuestion || !activeQuestion.groupMode) return;
                setGroupGameStatus('RACING');
                
                const updatedQ = {
                    ...activeQuestion,
                    groupGameStatus: 'RACING'
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("🏁 挑戰題分組比賽正式開始！", "success");
            };

            // Publish Active Question
            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                
                let challengeContent = null;
                let groupModeObj = null;

                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請上載並解析 Word 評估範本檔案！", "error");
                        return;
                    }

                    if (enableGroupMode) {
                        if (groupsData.length === 0) {
                            handleGenerateGroups();
                        }
                        groupModeObj = {
                            groups: groupsData,
                            status: 'PREP'
                        };
                    }

                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent,
                    groupMode: enableGroupMode ? groupModeObj : null
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);

                publishQuestionToFirestore(newQ, updatedHistory);
                showToast(`已發佈【${getModeLabel(selectedMode)}】給所有學生！`, 'success');
            };

            // Item 12: Release Challenge Scores
            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已一併發放全班挑戰題成績！", "success");
            };

            // Item 15 & 19: CSV Export for Challenge Results & Answers
            const handleExportCSVReport = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生紀錄可供匯出！", "error");
                    return;
                }

                let csvContent = "\uFEFF"; // UTF-8 BOM
                csvContent += "學號,學生姓名,加入時間";

                historyQuestions.forEach((q, idx) => {
                    const cleanText = (q.text || getModeLabel(q.mode)).replace(/"/g, '""');
                    if (q.mode === 'CHALLENGE' && q.challenge) {
                        csvContent += `,第${idx + 1}題[挑戰題:${q.challenge.title}總分],第${idx + 1}題[正確率],第${idx + 1}題[用時(秒)]`;
                        q.challenge.questions.forEach((subQ, subIdx) => {
                            csvContent += `,第${idx + 1}-${subIdx + 1}小題細項`;
                        });
                    } else {
                        csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]: "${cleanText}"`;
                    }
                });
                csvContent += "\n";

                const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

                sortedStudents.forEach((stu) => {
                    const cleanName = (stu.name || '').replace(/"/g, '""');
                    csvContent += `"${stu.seatNumber}號","${cleanName}","${stu.joinTime || ''}"`;
                    
                    historyQuestions.forEach((q) => {
                        const resKey = `${q.id}_${stu.id}`;
                        const res = responses[resKey];
                        
                        if (res && res.answer !== undefined && res.answer !== null) {
                            if (q.mode === 'CHALLENGE' && res.scoreDetails) {
                                csvContent += `,"${res.scoreDetails.totalScore} / ${q.challenge.totalScore}","${res.scoreDetails.percentage}%","${res.duration || 0}"`;
                                q.challenge.questions.forEach((_, qSubIdx) => {
                                    const studentSubAns = res.studentAnswers ? res.studentAnswers[qSubIdx] || '未答' : '未答';
                                    csvContent += `,"${studentSubAns}"`;
                                });
                            } else {
                                let ansVal = res.answer;
                                if (typeof ansVal === 'string' && ansVal.startsWith('data:image')) ansVal = '[白板圖形]';
                                if (typeof ansVal === 'string' && ansVal.startsWith('data:audio')) ansVal = '[語音錄音]';
                                csvContent += `,"${String(ansVal).replace(/"/g, '""')} (用時:${res.duration || 0}s)"`;
                            }
                        } else {
                            if (q.mode === 'CHALLENGE' && q.challenge) {
                                csvContent += `,"未作答","0%","0"`;
                                q.challenge.questions.forEach(() => csvContent += `,"未答"`);
                            } else {
                                csvContent += `,"未作答"`;
                            }
                        }
                    });
                    csvContent += "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `📥_挑戰題與學習成績試算表_房號${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("已成功下載 CSV 成績試算表！", "success");
            };

            const handleClearQuestion = async () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: null }, { merge: true });
                showToast('已結束當前題目', 'info');
            };

            const toggleLockMode = async () => {
                const newLock = !lockAfterSubmit;
                setLockAfterSubmit(newLock);
                if (activeQuestion) {
                    const updatedQ = { ...activeQuestion, lockAfterSubmit: newLock };
                    publishQuestionToFirestore(updatedQ);
                    showToast(newLock ? "已鎖定答案（禁止修改）" : "已開放學生修改答案", "info");
                }
            };

            // Item 2: Broadcast Whiteboard Work
            const handleBroadcastSubmission = async (studentRes) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatedQ = { 
                    ...activeQuestion, 
                    broadcastedSubmission: studentRes 
                };
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                showToast(`已一鍵廣播 ${studentRes.name} 的白板作品至全班學生螢幕！`, "success");
            };

            // Item 7: Non-repeating Spin Random Student Logic
            const handleSpinRandom = () => {
                if (isSpinning) return;
                
                const start = parseInt(rangeStart) || 1;
                const end = parseInt(rangeEnd) || 36;
                const available = [];
                for (let i = start; i <= end; i++) {
                    if (!drawnNumbers.includes(i)) available.push(i);
                }

                if (available.length === 0) {
                    showToast("此範圍內所有學號皆已被抽出！請點擊重置。", "error");
                    return;
                }

                setIsSpinning(true);
                let counter = 0;
                const maxIntervals = 20;

                const timer = setInterval(() => {
                    const temp = available[Math.floor(Math.random() * available.length)];
                    setCurrentDrawn(temp);
                    playSound('spin');
                    counter++;

                    if (counter >= maxIntervals) {
                        clearInterval(timer);
                        const finalPicked = available[Math.floor(Math.random() * available.length)];
                        setCurrentDrawn(finalPicked);
                        setDrawnNumbers(prev => [...prev, finalPicked]);
                        setIsSpinning(false);
                        playSound('win');
                    }
                }, 100);
            };

            // Item 14 & 16: Leaderboard sorting & medal logic
            const leaderboard = useMemo(() => {
                return Object.values(currentQuestionResponses)
                    .filter(r => r.duration !== undefined)
                    .sort((a, b) => {
                        if (activeQuestion?.mode === 'CHALLENGE') {
                            const scoreA = a.scoreDetails?.totalScore || 0;
                            const scoreB = b.scoreDetails?.totalScore || 0;
                            if (scoreB !== scoreA) return scoreB - scoreA;
                        }
                        return parseFloat(a.duration) - parseFloat(b.duration);
                    });
            }, [currentQuestionResponses, activeQuestion]);

            // Item 17: Buzzer - Lock ONLY 1st student who clicked
            const buzzerWinner = useMemo(() => {
                if (activeQuestion?.mode !== 'BUZZER') return null;
                const list = Object.values(currentQuestionResponses)
                    .sort((a, b) => parseFloat(a.duration || 999) - parseFloat(b.duration || 999));
                return list.length > 0 ? list[0] : null;
            }, [currentQuestionResponses, activeQuestion]);

            const whiteboardSubmissions = useMemo(() => {
                return Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:image'));
            }, [currentQuestionResponses]);

            const challengeScoresAreReleased = useMemo(() => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return true;
                return !!(activeQuestion.challenge?.releaseInstant || activeQuestion.challenge?.scoresReleased);
            }, [activeQuestion]);

            return (
                <div class="min-h-screen pb-12">
                    {/* Item 7 Header: Renamed Title */}
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 py-3">
                        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                            <div class="flex items-center space-x-3">
                                <span class="bg-indigo-600 text-white font-black px-3 py-1.5 rounded-xl text-lg shadow-sm">OMIT</span>
                                <div>
                                    <h1 class="font-extrabold text-slate-800 text-base md:text-lg tracking-tight">
                                        宣道會陳元喜小學OMIT互動課堂
                                    </h1>
                                </div>
                            </div>

                            <div class="flex flex-wrap items-center gap-2">
                                {/* Item 9: QR Code with live online student count badge */}
                                <button 
                                    onClick={() => setShowQRModal(true)}
                                    class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-2 rounded-xl border border-indigo-200 text-sm flex items-center space-x-2 transition"
                                >
                                    <span>📱 QR Code</span>
                                    <span class="bg-indigo-600 text-white text-xs px-2 py-0.5 rounded-full font-mono">
                                        在線: {studentsList.length}人
                                    </span>
                                </button>

                                {/* Item 7: Upgraded Random Selector */}
                                <button 
                                    onClick={() => setShowRandomModal(true)}
                                    class="bg-purple-50 hover:bg-purple-100 text-purple-700 font-bold px-3 py-2 rounded-xl border border-purple-200 text-sm transition"
                                >
                                    🎲 抽選學生
                                </button>

                                {/* Item 20: Teacher Fullscreen Whiteboard Button */}
                                <button 
                                    onClick={() => setShowTeacherWhiteboard(true)}
                                    class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-3 py-2 rounded-xl text-sm shadow transition"
                                >
                                    🎨 白板示範
                                </button>

                                {/* Item 8: Upgraded Timer */}
                                <button 
                                    onClick={() => setShowTimerModal(true)}
                                    class={`px-3 py-2 rounded-xl border text-sm font-bold flex items-center space-x-1.5 transition ${
                                        timerActive 
                                        ? 'bg-amber-500 text-white border-amber-600 animate-pulse' 
                                        : 'bg-amber-50 hover:bg-amber-100 text-amber-800 border-amber-200'
                                    }`}
                                >
                                    <span>⏱️ 計時器</span>
                                    {timerSeconds > 0 && (
                                        <span class="bg-white/20 font-mono text-xs px-1.5 py-0.5 rounded">
                                            {Math.floor(timerSeconds / 60).toString().padStart(2, '0')}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                        </span>
                                    )}
                                </button>

                                {/* Item 19: Export CSV */}
                                <button 
                                    onClick={handleExportCSVReport}
                                    class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold px-3 py-2 rounded-xl border border-emerald-200 text-sm transition"
                                >
                                    📥 匯出本次挑戰題成績試算表 (.csv)
                                </button>

                                <button 
                                    onClick={handleExitRoom}
                                    class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2 rounded-xl border border-rose-200 text-sm transition"
                                >
                                    🚪 退出課室
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

                        {/* Question Modes Grid */}
                        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3">
                            {[

                                { id: 'TF', label: '是非題', icon: '⭕' },
                                { id: 'SHORT', label: '短答題', icon: '✍️' },
                                { id: 'DRAW', label: '白板題', icon: '🎨' },
                                { id: 'BUZZER', label: '搶答題', icon: '🚨' },
                                { id: 'AUDIO', label: '錄音題', icon: '🎤' },
                                { id: 'CHALLENGE', label: '挑戰題', icon: '🏆' },
                                { id: 'LINK', label: '派送連結', icon: '🔗' }

                                <button 
                                    key={mode.id}

                                    class={`p-3.5 rounded-2xl font-bold border-2 transition-all text-center flex flex-col items-center justify-center space-y-1 shadow-sm active:scale-95 ${

                                    <span class="text-xs md:text-sm font-extrabold">{mode.label}</span>

                                            {!lockAfterSubmit ? '已開放修改' : '已鎖定 (預設)'}
                                        </button>
                                    </div>
                                )}
                            </div>

                            {selectedMode === 'CHOICE' && (
                                <div class="flex items-center space-x-4">
                                    <label class="text-sm font-bold text-slate-700">選項數量：</label>
                                    {[4, 5].map((cnt) => (
                                        <button 
                                            key={cnt} 
                                            onClick={() => setChoiceCount(cnt)}
                                            class={`px-3 py-1.5 rounded-xl font-bold text-sm border ${choiceCount === cnt ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-700'}`}
                                        >
                                            {cnt} 個選項 ({cnt === 4 ? 'A-D' : 'A-E'})
                                        </button>
                                    ))}
                                </div>
                            )}

                            {/* Item 10, 11, 12, 21: Challenge Mode Comprehensive Setup */}
                            {selectedMode === 'CHALLENGE' && (
                                <div class="bg-gradient-to-r from-amber-50 via-orange-50 to-yellow-50 border border-amber-200 p-5 rounded-2xl space-y-5 text-slate-800">
                                    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-amber-200 pb-3">
                                        <h3 class="font-black text-amber-900 text-base flex items-center gap-2">
                                            <span>🏆 挑戰題與分組比賽設定</span>
                                        </h3>
                                        <div class="flex items-center space-x-2">
                                            {/* Item 10: Renamed Button */}
                                            <button 
                                                type="button"
                                                onClick={handleDownloadChallengeTemplate}
                                                class="bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow transition flex items-center gap-1.5"
                                            >
                                                <span>📄 下載評估範本Word檔</span>
                                            </button>
                                        </div>
                                    </div>

                                    {/* Item 10: Docx Parsing & Editor */}
                                    <div class="bg-white p-4 rounded-xl border border-amber-200 space-y-3">
                                        <label class="block text-xs font-bold text-slate-700">
                                            1. 上載挑戰題 Word 文件 (.docx) 或文字檔 (.txt)：
                                        </label>
                                        <input 
                                            type="file" 
                                            accept=".docx,.txt"
                                            onChange={handleWordFileUpload}
                                            class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-600 file:text-white hover:file:bg-amber-700 cursor-pointer"
                                        />

                                        {challengeData && (
                                            <div class="bg-amber-50/90 p-4 rounded-xl border-2 border-amber-300 space-y-4">

                                                    <span class="font-black text-amber-900 text-sm">✏️ 教師編輯/確認評估內容：</span>
                                                    <span class="text-xs text-amber-700 font-bold">可直接修改內容、正確答案或刪除題目</span>

                                                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">

                                                        <input

                                                            onChange={(e) => handleUpdateChallengeTitle(e.target.value)}
                                                            class="w-full px-3 py-2 rounded-lg border focus:ring-2 focus:ring-amber-500 font-bold text-slate-800 text-sm bg-white"
                                                        />

                                                    <div>
                                                        <label class="block text-xs font-bold text-slate-600 mb-1">總分 (分)：</label>
                                                        <input 
                                                            type="number" 
                                                            value={challengeData.totalScore}
                                                            onChange={(e) => handleUpdateChallengeScore(e.target.value)}
                                                            class="w-full px-3 py-2 rounded-lg border focus:ring-2 focus:ring-amber-500 font-bold text-slate-800 text-sm bg-white"
                                                        />
                                                    </div>
                                                </div>

                                                <div class="space-y-3 max-h-80 overflow-y-auto pr-1">
                                                    {challengeData.questions.map((q, qIdx) => (
                                                        <div key={qIdx} class="bg-white p-3.5 rounded-xl border border-amber-200 space-y-2.5 text-xs shadow-sm">
                                                            <div class="flex items-center justify-between gap-2">
                                                                <div class="flex items-center gap-2 flex-1">
                                                                    <span class="font-black text-amber-900 whitespace-nowrap">第 {q.num || qIdx + 1} 題:</span>
                                                                    <input 
                                                                        type="text"
                                                                        value={q.text}
                                                                        onChange={(e) => handleUpdateQuestionText(qIdx, e.target.value)}
                                                                        class="w-full px-2 py-1.5 border rounded font-medium text-slate-800 focus:ring-1 focus:ring-amber-500"
                                                                    />
                                                                </div>
                                                                <button 
                                                                    type="button"
                                                                    onClick={() => handleDeleteQuestion(qIdx)}
                                                                    class="px-2.5 py-1 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-lg text-xs whitespace-nowrap border border-red-200 transition"

                                                                    🗑️ 刪除
                                                                </button>
                                                            </div>

                                                            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 pl-4">
                                                                {q.options.map((opt, optIdx) => (
                                                                    <div key={optIdx} class="flex items-center space-x-1.5">

                                                                        <input 
                                                                            type="text"
                                                                            value={opt.text}
                                                                            onChange={(e) => handleUpdateOptionText(qIdx, optIdx, e.target.value)}
                                                                            class="flex-1 px-2 py-1 border rounded text-slate-700"

                                                            <div class="flex items-center space-x-2 pt-1 border-t border-slate-100 pl-4">

                                                                        <input 
                                                                            type="radio" 
                                                                            name={`ans_q_${qIdx}`} 
                                                                            checked={q.answer === letter}

                                                                            class="accent-emerald-600"

                                                                        <span class={q.answer === letter ? 'text-emerald-700 font-black' : 'text-slate-500'}>{letter}</span>
                                                                    </label>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Item 11: Timer Input with MM:SS manual input */}
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-white p-4 rounded-xl border border-amber-200">
                                        <div class="space-y-2">
                                            <div class="flex items-center justify-between">
                                                <label class="text-xs font-bold text-slate-700">2. 開啟挑戰題限時模式：</label>
                                                <input 
                                                    type="checkbox" 
                                                    checked={challengeEnableTimer}
                                                    onChange={(e) => setChallengeEnableTimer(e.target.checked)}
                                                    class="w-4 h-4 accent-amber-600 rounded cursor-pointer"
                                                />
                                            </div>
                                            {challengeEnableTimer && (
                                                <div class="space-y-2 pt-1">
                                                    <div class="flex flex-wrap items-center gap-1.5">

                                                        {[60, 120, 180, 240, 300].map(s => (
                                                            <button 
                                                                key={s} 
                                                                type="button"
                                                                onClick={() => setChallengeTimeLimit(s)}
                                                                class={`px-2.5 py-1 text-xs rounded-lg font-bold border transition ${challengeTimeLimit === s ? 'bg-amber-600 text-white border-amber-600' : 'bg-slate-50 text-slate-700'}`}
                                                            >
                                                                {s / 60}分鐘
                                                            </button>
                                                        ))}
                                                    </div>
                                                    
                                                    {/* Manual 00:00 input */}
                                                    <div class="flex items-center space-x-2 pt-1">
                                                        <span class="text-xs font-bold text-amber-900">手動「00:00」時間設定：</span>
                                                        <div class="flex items-center border rounded-lg px-2 py-1 bg-white font-mono font-bold text-xs">
                                                            <input 
                                                                type="number"
                                                                min="0"
                                                                max="99"
                                                                value={String(Math.floor(challengeTimeLimit / 60)).padStart(2, '0')}
                                                                onChange={(e) => {
                                                                    const mins = Math.max(0, parseInt(e.target.value) || 0);
                                                                    const secs = challengeTimeLimit % 60;
                                                                    setChallengeTimeLimit(mins * 60 + secs);
                                                                }}
                                                                class="w-8 text-center outline-none"

                                                            <span>:</span>
                                                            <input 
                                                                type="number"
                                                                min="0"
                                                                max="59"
                                                                value={String(challengeTimeLimit % 60).padStart(2, '0')}

                                                                    const mins = Math.floor(challengeTimeLimit / 60);
                                                                    const secs = Math.min(59, Math.max(0, parseInt(e.target.value) || 0));
