        // Web Audio Synthesizer sound effects
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    if (window.confetti) window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                    });
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        // Item 12: Generating 5-question Word .docx document template
        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) throw new Error("JSZip not loaded");
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>
    ${paragraphsXml}
  </w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];
            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) questions.push(currentQ);
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }
                    currentQ.options.push({ letter, text: optText });
                    if (isCorrect) currentQ.answer = letter;
                }
            });

            if (currentQ && currentQ.options.length > 0) questions.push(currentQ);

            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        { num: 1, text: "以下哪一項不是地球的天然資源?", options: [{ letter: "A", text: "水資源" }, { letter: "B", text: "植物資源" }, { letter: "C", text: "動物資源" }, { letter: "D", text: "機械資源" }], answer: "D" },
                        { num: 2, text: "芝士的原料屬於哪一項地球的天然資源?", options: [{ letter: "A", text: "水資源" }, { letter: "B", text: "植物資源" }, { letter: "C", text: "動物資源" }, { letter: "D", text: "礦產資源" }], answer: "C" },
                        { num: 3, text: "人們不當使用水資源會造成甚麼後果?", options: [{ letter: "A", text: "引發極端天氣" }, { letter: "B", text: "引發水災" }, { letter: "C", text: "水土流失" }, { letter: "D", text: "影響食水供應" }], answer: "D" },
                        { num: 4, text: "人們不當使用煤和石油資源會造成甚麼後果?", options: [{ letter: "A", text: "引發極端天氣" }, { letter: "B", text: "引發水災" }, { letter: "C", text: "水土流失" }, { letter: "D", text: "影響食水供應" }], answer: "A" },
                        { num: 5, text: "人們不當使用土地資源會造成甚麼後果?", options: [{ letter: "A", text: "引發極端天氣" }, { letter: "B", text: "引發水災" }, { letter: "C", text: "產生大量二氧化碳" }, { letter: "D", text: "影響食水供應" }], answer: "B" }
                    ]
                };
            }
            return { title, totalScore, questions };
        };

        const WhiteboardCanvas = ({ initialBg, onSave, disabled, strokeWidth = 4, setStrokeWidth, strokeColor = '#2563eb', setStrokeColor, isEraser, setIsEraser, onClear, onBgUpload }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [bgImageObj, setBgImageObj] = useState(null);

            useEffect(() => {
                if (initialBg) {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = () => {
                        setBgImageObj(img);
                        redrawCanvas(img);
                    };
                    img.src = initialBg;
                } else {
                    setBgImageObj(null);
                    redrawCanvas(null);
                }
            }, [initialBg]);

            const redrawCanvas = (bgImg) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                if (bgImg) {
                    ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            };

            // Precision touch formula (scaleX / scaleY)
            const getCanvasPos = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                if (disabled) return;
                e.preventDefault();
                setIsDrawing(true);
                const pos = getCanvasPos(e);
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            };

            const draw = (e) => {
                if (!isDrawing || disabled) return;
                e.preventDefault();
                const pos = getCanvasPos(e);
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');

                ctx.lineWidth = strokeWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (isEraser) {
                    ctx.globalCompositeOperation = 'destination-out';
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = strokeColor;
                }

                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            const stopDrawing = () => {
                if (!isDrawing) return;
                setIsDrawing(false);
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.globalCompositeOperation = 'source-over';
                if (onSave) {
                    onSave(canvas.toDataURL('image/png'));
                }
            };

            const handleLocalClear = () => {
                redrawCanvas(bgImageObj);
                if (onClear) onClear();
                if (onSave) {
                    const canvas = canvasRef.current;
                    onSave(canvas.toDataURL('image/png'));
                }
            };

            const handleLocalBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const bgData = evt.target.result;
                        if (onBgUpload) onBgUpload(bgData);
                        const img = new Image();
                        img.onload = () => {
                            setBgImageObj(img);
                            redrawCanvas(img);
                            if (onSave) onSave(canvasRef.current.toDataURL('image/png'));
                        };
                        img.src = bgData;
                    };
                    reader.readAsDataURL(file);
                }
            };

            return (
                <div class="space-y-3">
                    <div class="canvas-container relative w-full aspect-16-9 bg-white rounded-2xl overflow-hidden border-2 border-indigo-200 shadow-inner">
                        <canvas
                            ref={canvasRef}
                            width={1280}
                            height={720}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            class="w-full h-full cursor-crosshair touch-none"
                        />
                    </div>

                    {!disabled && (
                        <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-100 p-3 rounded-xl border border-slate-200">
                            {/* Color options */}
                            <div class="flex items-center space-x-1.5 overflow-x-auto">
                                {CANVAS_COLORS.map(c => (
                                    <button
                                        key={c.value}
                                        type="button"
                                        onClick={() => { setStrokeColor(c.value); setIsEraser(false); }}
                                        class={`w-7 h-7 rounded-full border-2 transition ${strokeColor === c.value && !isEraser ? 'ring-2 ring-indigo-500 scale-110' : 'opacity-80 hover:opacity-100'}`}
                                        style={{ backgroundColor: c.value }}
                                        title={c.name}
                                    />
                                ))}
                            </div>

                            {/* Stroke thickness slider */}
                            <div class="flex items-center space-x-2">
                                <span class="text-xs font-bold text-slate-600">筆觸 ({strokeWidth}px):</span>
                                <input 
                                    type="range" 
                                    min="2" 
                                    max="18" 
                                    value={strokeWidth} 
                                    onChange={(e) => setStrokeWidth(parseInt(e.target.value))}
                                    class="w-20 accent-indigo-600 cursor-pointer"
                                />
                            </div>

                            {/* Action buttons */}
                            <div class="flex items-center space-x-2">
                                <button
                                    type="button"
                                    onClick={() => setIsEraser(!isEraser)}
                                    class={`px-2.5 py-1.5 text-xs font-bold rounded-lg border transition ${isEraser ? 'bg-amber-500 text-white border-amber-600' : 'bg-white text-slate-700 border-slate-300'}`}
                                >
                                    🧽 擦膠 {isEraser ? '(開)' : ''}
                                </button>
                                <button
                                    type="button"
                                    onClick={handleLocalClear}
                                    class="px-2.5 py-1.5 text-xs font-bold bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg border border-rose-200 transition"
                                >
                                    🗑️ 一鍵清空
                                </button>
                                <label class="px-2.5 py-1.5 text-xs font-bold bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg border border-indigo-200 cursor-pointer transition">
                                    🖼️ 上載背景
                                    <input type="file" accept="image/*" onChange={handleLocalBgUpload} class="hidden" />
                                </label>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AudioRecorder = ({ onSaveAudio, disabled }) => {
            const [isRecording, setIsRecording] = useState(false);
            const [audioBlob, setAudioBlob] = useState(null);
            const [audioUrl, setAudioUrl] = useState(null);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            const startRecording = async () => {
                audioChunksRef.current = [];
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mediaRecorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = mediaRecorder;

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) audioChunksRef.current.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const url = URL.createObjectURL(blob);
                        setAudioBlob(blob);
                        setAudioUrl(url);

                        const reader = new FileReader();
                        reader.onloadend = () => {
                            if (onSaveAudio) onSaveAudio(reader.result);
                        };
                        reader.readAsDataURL(blob);
                    };

                    mediaRecorder.start();
                    setIsRecording(true);
                } catch (err) {
                    console.error("Microphone access error:", err);
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const handleDeleteRecording = () => {
                setAudioBlob(null);
                setAudioUrl(null);
                if (onSaveAudio) onSaveAudio(null);
            };

            return (
                <div class="bg-indigo-50/80 p-4 rounded-2xl border border-indigo-100 space-y-3">
                    {!audioUrl ? (
                        <div class="text-center py-4">
                            {!isRecording ? (

                                >
                                    <span>🎙️ 開始錄音</span>
                                </button>
                            ) : (
                                <button
                                    type="button"
                                    onClick={stopRecording}
                                    class="bg-slate-800 hover:bg-slate-900 text-white font-black px-6 py-3.5 rounded-2xl shadow-md transition flex items-center justify-center space-x-2 mx-auto animate-pulse"
                                >
                                    <span>⏹️ 停止錄音中...</span>
                                </button>
                            )}
                        </div>
                    ) : (
                        <div class="space-y-3">
                            <div class="flex items-center justify-center">
                                <audio src={audioUrl} controls class="w-full max-w-md rounded-lg" />
                            </div>

                </div>
            );
        };

            const handleRegroupTeams = () => {

                setTeamsList(generated);
                const teamQ = {
                    ...activeQuestion,
                    teamStage: 'GROUP',
                    teamsList: generated,
                    winningTeam: null
                };
                publishQuestionToFirestore(teamQ);
                showToast("已重新隨機分配組別！", "info");
            };

            const handleStartTeamCompetition = () => {
                setTeamStage('COMPETITION');
                const teamQ = {
                    ...activeQuestion,
                    teamStage: 'COMPETITION',
                    winningTeam: null
                };
                publishQuestionToFirestore(teamQ);
                showToast("合作比賽正式開始！🔥", "success");
            };

            // Item 21 & 32: Demo Whiteboard Broadcast Handler
            const toggleDemoBroadcast = async () => {
                const nextBroadcast = !isDemoBroadcasting;
                setIsDemoBroadcasting(nextBroadcast);

                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                const updatedQ = {
                    ...(activeQuestion || { id: 'q_demo_' + Date.now(), mode: 'DRAW', text: '教師白板示範' }),
                    teacherDemoBroadcast: nextBroadcast ? demoCanvasData : null
                };

                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                showToast(nextBroadcast ? "已廣播教師示範白板至全班螢幕！" : "已收回廣播！", nextBroadcast ? "success" : "info");
            };

            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                let challengeContent = null;

                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請先上載並解析 Word 評估範本檔案！", "error");
                        return;
                    }
                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);

                publishQuestionToFirestore(newQ, updatedHistory);
                showToast(`已成功發佈【${getModeLabel(selectedMode)}】給所有學生！`, 'success');
            };

            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已成功向所有學生一併發放挑戰題成績！", "success");
            };

            // Item 34: 收回題目功能
            const handleClearQuestion = async () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: null }, { merge: true });
                setIsDemoBroadcasting(false);
                showToast('已收回題目，所有學生已返回待機狀態！', 'info');
            };

            // Item 20 & 30: CSV Export
            const handleExportCSVReport = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生紀錄可供匯出！", "error");
                    return;
                }

                let csvContent = "\uFEFF學號,學生姓名,加入時間";

                historyQuestions.forEach((q, idx) => {
                    const cleanText = (q.text || getModeLabel(q.mode)).replace(/"/g, '""');
                    if (q.mode === 'CHALLENGE' && q.challenge) {
                        csvContent += `,第${idx + 1}題[挑戰題:${q.challenge.title}得分],第${idx + 1}題[挑戰題正確率]`;
                    } else {
                        csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]: "${cleanText}"`;
                    }
                });
                csvContent += "\n";

                const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

                sortedStudents.forEach((stu) => {
                    const cleanName = (stu.name || '').replace(/"/g, '""');
                    csvContent += `"${stu.seatNumber}號","${cleanName}","${stu.joinTime || ''}"`;
                    
                    historyQuestions.forEach((q) => {
                        const resKey = `${q.id}_${stu.id}`;
                        const res = responses[resKey];
                        
                        if (res && res.answer !== undefined && res.answer !== null) {
                            if (q.mode === 'CHALLENGE' && res.scoreDetails) {
                                csvContent += `,"${res.scoreDetails.totalScore} / ${q.challenge.totalScore}分","${res.scoreDetails.percentage}% (用時:${res.duration || 0}s)"`;
                            } else {
                                let ansVal = res.answer;
                                if (typeof ansVal === 'string' && ansVal.startsWith('data:image')) ansVal = '[圖像白板答案]';
                                else if (typeof ansVal === 'string' && ansVal.startsWith('data:audio')) ansVal = '[語音錄音檔案]';
                                const cleanAns = String(ansVal).replace(/"/g, '""');
                                csvContent += `,"${cleanAns} (用時:${res.duration || 0}s)"`;
                            }
                        } else {
                            csvContent += q.mode === 'CHALLENGE' ? `,"未作答","0%"` : `,"未作答"`;
                        }
                    });
                    csvContent += "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `OMIT_本次挑戰題與學習成績試算表_房號${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("已成功下載包含全班成績及細項答案的 CSV 試算表！", "success");
            };

            // Leaderboard sort (Item 7, 18, 31)
            const leaderboard = useMemo(() => {
                const resList = Object.values(currentQuestionResponses).filter(r => r.duration !== undefined);
                
                if (activeQuestion?.mode === 'BUZZER') {
                    // Item 18: Buzzer mode ONLY locks first fastest answer
                    return resList.sort((a, b) => parseFloat(a.duration) - parseFloat(b.duration)).slice(0, 1);
                }

                return resList.sort((a, b) => {
                    if (activeQuestion?.mode === 'CHALLENGE') {
                        const scoreA = a.scoreDetails?.totalScore || 0;
                        const scoreB = b.scoreDetails?.totalScore || 0;
                        if (scoreB !== scoreA) return scoreB - scoreA;
                    }
                    return parseFloat(a.duration) - parseFloat(b.duration);
                });
            }, [currentQuestionResponses, activeQuestion]);

            return (
                <div class="min-h-screen pb-12 bg-slate-100">
                    {/* Item 9: Top Title update */}
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 py-3">
                        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                            <div class="flex items-center space-x-3">
                                <span class="bg-indigo-600 text-white font-black px-3 py-1.5 rounded-xl text-lg shadow-sm">OMIT</span>
                                <div>

                                        宣道會陳元喜小學OMIT互動課堂
                                        <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1 rounded-full font-mono font-bold">
                                            房號：{roomCode}
                                        </span>
                                    </h1>
                                </div>
                            </div>

                            <div class="flex flex-wrap items-center gap-2">
                                {/* Item 11: Real-time Online Count Badge on QR button */}
                                <button 
                                    onClick={() => setShowQRModal(true)}
                                    class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-2 rounded-xl border border-indigo-200 text-xs md:text-sm flex items-center space-x-1.5 transition"
                                >
                                    <span>📱 QR Code</span>
                                    <span class="bg-indigo-600 text-white text-xs px-1.5 py-0.5 rounded-full font-bold">
                                        {studentsList.length}人在線
                                    </span>
                                </button>

                                {/* Item 21: 教師示範白板按鈕 (放置於「抽選學生」旁) */}
                                <button 
                                    onClick={() => setShowDemoWhiteboardModal(true)}
                                    class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-3 py-2 rounded-xl text-xs md:text-sm shadow-md flex items-center space-x-1 transition active:scale-95"
                                >
                                    <span>🎨 示範白板</span>
                                </button>

                                {/* Item 9: Random selector button */}
                                <button 
                                    onClick={() => setShowRandomModal(true)}
                                    class="bg-purple-50 hover:bg-purple-100 text-purple-700 font-bold px-3 py-2 rounded-xl border border-purple-200 text-xs md:text-sm transition"
                                >
                                    🎲 抽選學生
                                </button>

                                {/* Item 10: Timer button */}
                                <button 
                                    onClick={() => setShowTimerModal(true)}
                                    class={`px-3 py-2 rounded-xl border text-xs md:text-sm font-bold flex items-center space-x-1.5 transition ${
                                        timerActive 
                                        ? 'bg-amber-500 text-white border-amber-600 animate-pulse' 
                                        : 'bg-amber-50 hover:bg-amber-100 text-amber-800 border-amber-200'
                                    }`}

                                    <span>⏱️ 計時器</span>
                                    {timerSeconds > 0 && (
                                        <span class="bg-white/20 font-mono text-xs px-1.5 py-0.5 rounded">
                                            {Math.floor(timerSeconds / 60)}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                        </span>
                                    )}
                                </button>

                                {/* Item 20 & 30: CSV Report Download Button */}
                                <button

                                    class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold px-3 py-2 rounded-xl border border-blue-200 text-xs md:text-sm transition"
                                >
                                    📥 匯出本次挑戰題成績試算表 (.csv)
                                </button>

                                <button 
                                    onClick={handleExitRoom}
                                    class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2 rounded-xl border border-rose-200 text-xs md:text-sm transition"
                                >
                                    🚪 退出課室
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Dashboard Container */}
                    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

                        {/* Mode Selection Grid */}
                        <div class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-9 gap-2.5">
                            {[
                                { id: 'CHOICE', label: '選擇題', icon: '🔘' },
                                { id: 'TF', label: '是非題', icon: '⭕' },
                                { id: 'SHORT', label: '短答題', icon: '✍️' },
                                { id: 'DRAW', label: '白板題', icon: '🎨' },
                                { id: 'BUZZER', label: '搶答題', icon: '🚨' },
                                { id: 'AUDIO', label: '錄音題', icon: '🎤' },
                                { id: 'CHALLENGE', label: '挑戰題', icon: '🏆' },
                                { id: 'TEAM', label: '合作題', icon: '🤝' },
                                { id: 'LINK', label: '派送連結', icon: '🔗' }
                            ].map((mode) => (
                                <button 
                                    key={mode.id}
                                    onClick={() => setSelectedMode(mode.id)}
                                    class={`p-3 rounded-2xl font-bold border-2 transition-all text-center flex flex-col items-center justify-center space-y-1 shadow-sm active:scale-95 ${
                                        selectedMode === mode.id 
                                        ? 'bg-slate-900 text-white border-slate-900 ring-4 ring-slate-200' 
                                        : 'bg-white text-slate-700 border-slate-200 hover:border-slate-300 hover:bg-slate-50'

                                >
                                    <span class="text-xl md:text-2xl">{mode.icon}</span>
                                    <span class="text-xs font-black">{mode.label}</span>
                                </button>
                            ))}
                        </div>

                        {/* Mode Setup Panel */}
                        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                            <div class="flex flex-wrap items-center justify-between border-b pb-3 gap-2">
                                <h2 class="font-black text-slate-800 text-lg flex items-center gap-2">
                                    <span>課堂模組設定：{getModeLabel(selectedMode)}</span>
                                </h2>

                                {selectedMode !== 'CHALLENGE' && selectedMode !== 'TEAM' && (
                                    <div class="flex items-center space-x-2 bg-slate-100 p-1.5 rounded-xl">

                            {selectedMode === 'CHOICE' && (

                                        <button

                                            onClick={() => setChoiceCount(cnt)}
                                            class={`px-3 py-1.5 rounded-xl font-bold text-xs border ${choiceCount === cnt ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-700'}`}
                                        >
                                            {cnt} 個選項 ({cnt === 4 ? 'A-D' : 'A-E'})
                                        </button>

                                </div>

                            {/* Item 22: Collaborative Team Setup Workflow */}
                            {selectedMode === 'TEAM' && (
                                <div class="bg-gradient-to-r from-emerald-50 to-teal-50 border border-emerald-200 p-5 rounded-2xl space-y-4">
                                    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-emerald-200 pb-3">
                                        <h3 class="font-black text-emerald-900 text-base">🤝 合作題分組比賽設定 (預備 ➔ 分組 ➔ 比賽)</h3>
                                        <button 
                                            type="button"
                                            onClick={handleDownloadChallengeTemplate}
                                            class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow transition"
                                        >
                                            📄 下載評估範本Word檔
                                        </button>
                                    </div>

                                    <div class="bg-white p-4 rounded-xl border border-emerald-200 space-y-3">
                                        <label class="block text-xs font-bold text-slate-700">1. 上載 Word 評估範本檔 (.docx) 生成合作題：</label>
                                        <input 
                                            type="file" 
                                            accept=".docx,.txt"
                                            onChange={(e) => handleWordFileUpload(e, 'TEAM')}
                                            class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 cursor-pointer"
                                        />

                                                    <span>已解析合作題：{teamData.title} ({teamData.questions.length} 題)</span>
                                                    <button 
                                                        onClick={handleStartTeamGrouping}
                                                        class="bg-emerald-600 hover:bg-emerald-700 text-white font-black px-4 py-2 rounded-xl text-xs shadow"
                                                    >
                                                        進入「分組」階段 ➡️
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* Item 12 & 13: Challenge Question Panel */}
                            {selectedMode === 'CHALLENGE' && (
                                <div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 p-5 rounded-2xl space-y-5 text-slate-800">
                                    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-amber-200 pb-3">
                                        <h3 class="font-black text-amber-900 text-base">🏆 挑戰題 Word 評估設定</h3>
                                        <button 
                                            type="button"
                                            onClick={handleDownloadChallengeTemplate}
                                            class="bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow transition"
                                        >
                                            📄 下載評估範本Word檔
                                        </button>
                                    </div>

                                    <div class="bg-white p-4 rounded-xl border border-amber-200 space-y-3">
                                        <label class="block text-xs font-bold text-slate-700">
                                            上載 Word 評估範本檔 (.docx) 或文字檔 (.txt)：
                                        </label>
                                        <input 
                                            type="file" 
                                            accept=".docx,.txt"
                                            onChange={(e) => handleWordFileUpload(e, 'CHALLENGE')}
                                            class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-600 file:text-white hover:file:bg-amber-700 cursor-pointer"
                                        />

                                        {challengeData && (
                                            <div class="bg-amber-50/90 p-4 rounded-xl border-2 border-amber-300 space-y-4">
                                                <div class="flex justify-between items-center border-b border-amber-200 pb-2">
                                                    <span class="font-black text-amber-900 text-sm">✏️ 教師編輯/確認評估內容：</span>
                                                    <span class="text-xs text-amber-700 font-bold">可直接修改題目內容、選項、正確答案或刪除題目</span>
                                                </div>

                                                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                                                    <div class="md:col-span-2">
                                                        <label class="block text-xs font-bold text-slate-600 mb-1">評估標題：</label>
                                                        <input 
                                                            type="text" 
                                                            value={challengeData.title}
                                                            onChange={(e) => setChallengeData({ ...challengeData, title: e.target.value })}
                                                            class="w-full px-3 py-2 rounded-lg border font-bold text-slate-800 text-sm bg-white"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label class="block text-xs font-bold text-slate-600 mb-1">總分 (分)：</label>
                                                        <input 
                                                            type="number" 
                                                            value={challengeData.totalScore}
                                                            onChange={(e) => setChallengeData({ ...challengeData, totalScore: parseInt(e.target.value) || 100 })}
                                                            class="w-full px-3 py-2 rounded-lg border font-bold text-slate-800 text-sm bg-white"
                                                        />
                                                    </div>
                                                </div>

                                                <div class="space-y-3 max-h-80 overflow-y-auto pr-1">
                                                    {challengeData.questions.map((q, qIdx) => (

                                                                <button

                                                                    onClick={() => {
                                                                        const newQs = challengeData.questions.filter((_, idx) => idx !== qIdx).map((item, idx) => ({ ...item, num: idx + 1 }));
                                                                        setChallengeData({ ...challengeData, questions: newQs });

                                                                    class="px-2.5 py-1 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-lg text-xs"

                                                                        <input

                                                                            value={opt.text}
                                                                            onChange={(e) => {

                                                                        <span class={q.answer === letter ? 'text-emerald-700 font-black' : 'text-slate-500'}>{letter}</span>

                                                            </div>

                                            </div>

                                    {/* Item 13: Challenge Timer (Fast buttons + 00:00 Manual input) */}

                                <div class="flex flex-wrap items-center justify-between border-t pt-4 gap-2">

                                        <button

                    {/* Item 10: Timer Modal */}

                                <div class="grid grid-cols-3 gap-2">
                                    {[30, 60, 120, 180, 240, 300].map(s => (

                                            class="py-2.5 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 font-bold text-xs"

                                        <span class="font-bold font-mono">:</span>

                                        <button 
                                            onClick={() => {
