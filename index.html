                                <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl mb-2 font-black text-2xl shadow-inner">
                                    OMIT
                                </div>
                                <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800 tracking-tight leading-tight">
                                    <div class="text-lg text-indigo-600 mb-1">宣道會陳元喜小學</div>
                                    OMIT互動課堂
                                </h1>
                                <p class="text-slate-500 text-sm">免登入！隨查隨答、高效即時的反饋互動平台</p>
                            </div>

                            <div class="space-y-6">
                                {/* Student Join Form */}
                                <form onSubmit={handleJoinRoom} class="bg-indigo-50/70 p-5 rounded-2xl border border-indigo-100 space-y-4">
                                    <h2 class="text-xs font-bold text-indigo-600 uppercase tracking-wider">我是學生 (加入課堂)</h2>
                                    <div>
                                        <label class="text-xs text-slate-500 font-medium mb-1 block">1. 課堂房號</label>
                                        <input 
                                            type="text" 
                                            placeholder="請輸入房號 (例如 123456)" 
                                            value={roomCode} 
                                            onChange={(e) => setRoomCode(e.target.value)}
                                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-mono text-center tracking-widest text-lg font-bold"
                                            maxLength={6}
                                        />
                                    </div>

                                    {/* Seat dropdown 1-36 + Optional Name */}
                                    <div class="grid grid-cols-3 gap-2">
                                        <div class="col-span-1">
                                            <label class="text-xs text-slate-500 font-medium mb-1 block">2. 學號 *</label>
                                            <select 
                                                value={seatNumber}
                                                onChange={(e) => setSeatNumber(e.target.value)}
                                                class="w-full px-3 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-bold text-center"
                                            >
                                                {Array.from({ length: 36 }, (_, i) => i + 1).map((num) => (
                                                    <option key={num} value={num}>{num} 號</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div class="col-span-2">
                                            <label class="text-xs text-slate-500 font-medium mb-1 block">3. 姓名 (可留空)</label>
                                            <input 
                                                type="text" 
                                                placeholder="輸入姓名 / 暱稱" 
                                                value={studentName} 
                                                onChange={(e) => setStudentName(e.target.value)}
                                                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-medium"
                                            />
                                        </div>
                                    </div>

                                    <button 
                                        type="submit" 
                                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-200 active:scale-98"
                                    >
                                        進入課堂 🚀
                                    </button>
                                </form>

                                <div class="relative flex py-1 items-center">
                                    <div class="flex-grow border-t border-slate-200"></div>
                                    <span class="flex-shrink mx-4 text-slate-400 text-xs font-medium">或</span>
                                    <div class="flex-grow border-t border-slate-200"></div>
                                </div>

                                {/* Teacher Password Access */}
                                <div class="text-center">
                                    <button 
                                        onClick={handleTeacherAccessRequest}
                                        class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl transition shadow-md flex items-center justify-center space-x-2 active:scale-98"
                                    >
                                        <span>👨‍🏫 開啟新課堂</span>
                                    </button>
                                    <p class="text-xs text-slate-400 mt-2">建立後即可獲取房號與專屬 QR Code</p>
                                </div>
                            </div>
                        </div>

                        {showPasswordModal && (
                            <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                                <div class="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
                                    <h3 class="text-lg font-bold text-slate-800 text-center">請輸入教師密碼</h3>
                                    <form onSubmit={verifyTeacherPassword} class="space-y-4">
                                        <input 
                                            type="password" 
                                            value={teacherPassword}
                                            onChange={(e) => setTeacherPassword(e.target.value)}
                                            class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 text-center font-mono text-xl tracking-widest"
                                            autoFocus
                                        />
                                        <div class="flex space-x-2">
                                            <button 
                                                type="button" 
                                                onClick={() => setShowPasswordModal(false)}
                                                class="w-1/2 py-2.5 rounded-xl bg-slate-100 font-medium text-slate-600 hover:bg-slate-200"
                                            >
                                                取消
                                            </button>
                                            <button 
                                                type="submit" 
                                                class="w-1/2 py-2.5 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-700 shadow-md"
                                            >
                                                確認進入
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            if (role === 'TEACHER') {
                return (
                    <TeacherDashboard 
                        roomCode={roomCode} 
                        activeQuestion={activeQuestion} 
                        setActiveQuestion={setActiveQuestion}
                        responses={responses}
                        setResponses={setResponses}
                        studentsList={studentsList}
                        historyQuestions={historyQuestions}
                        setHistoryQuestions={setHistoryQuestions}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            if (role === 'STUDENT') {
                return (
                    <StudentInterface 
                        roomCode={roomCode}
                        studentName={studentName}
                        seatNumber={seatNumber}
                        studentId={myStudentId.current}
                        activeQuestion={activeQuestion}
                        responses={responses}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            return null;
        }

        function TeacherDashboard({ roomCode, activeQuestion, setActiveQuestion, responses, setResponses, studentsList, historyQuestions, setHistoryQuestions, showToast, onExit }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE'); // 'CHOICE', 'TF', 'SHORT', 'DRAW', 'BUZZER', 'AUDIO', 'CHALLENGE', 'LINK', 'COOP'
            const [questionText, setQuestionText] = useState('');
            const [choiceCount, setChoiceCount] = useState(4);
            const [lockAfterSubmit, setLockAfterSubmit] = useState(true);
            const [whiteboardBg, setWhiteboardBg] = useState(null);
            const [pushedUrl, setPushedUrl] = useState('');

            // Modals & Tools
            const [showQRModal, setShowQRModal] = useState(false);
            const [showStudentListModal, setShowStudentListModal] = useState(false);
            const [showInspectModal, setShowInspectModal] = useState(null);
            const [barChoiceFilter, setBarChoiceFilter] = useState(null);

            // Random Selector State
            const [showRandomModal, setShowRandomModal] = useState(false);
            const [rangeStart, setRangeStart] = useState(1);
            const [rangeEnd, setRangeEnd] = useState(36);
            const [drawnNumbers, setDrawnNumbers] = useState([]);
            const [currentDrawn, setCurrentDrawn] = useState(null);
            const [isSpinning, setIsSpinning] = useState(false);

            // Timer Modal State
            const [showTimerModal, setShowTimerModal] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerActive, setTimerActive] = useState(false);
            const [timerZoomed, setTimerZoomed] = useState(false);
            const [customTimerMins, setCustomTimerMins] = useState(0);
            const [customTimerSecs, setCustomTimerSecs] = useState(0);

            // Challenge Question Setup States
            const [challengeData, setChallengeData] = useState(null);
            const [challengeEnableTimer, setChallengeEnableTimer] = useState(true);
            const [challengeTimeLimit, setChallengeTimeLimit] = useState(120); // 120s default (2 mins)
            const [challengeReleaseInstant, setChallengeReleaseInstant] = useState(true);
            const [showChallengeScoresOnLeaderboard, setShowChallengeScoresOnLeaderboard] = useState(true);
            const [docxFileName, setDocxFileName] = useState('');
            
            // Coop Question Setup States
            const [coopData, setCoopData] = useState(null);
            const [coopStage, setCoopStage] = useState('PREP'); // PREP, GROUP, PLAY, END
            const [coopGroups, setCoopGroups] = useState([]);
            const [isCoopMusicPlaying, setIsCoopMusicPlaying] = useState(false);
            const audioRef = useRef(null);

            // Teacher Demo Whiteboard
            const [showDemoWhiteboard, setShowDemoWhiteboard] = useState(false);
            const [isBroadcastingDemo, setIsBroadcastingDemo] = useState(false);
            const demoCanvasRef = useRef(null);

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

            // Filter current responses for active question
            const currentQuestionResponses = useMemo(() => {
                if (!activeQuestion) return {};
                const filtered = {};
                Object.values(responses).forEach(r => {
                    if (r.questionId === activeQuestion.id) {
                        filtered[r.studentId] = r;
                    }
                });
                return filtered;
            }, [responses, activeQuestion]);

            // Timer Interval Logic
            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(s => {
                            if (s <= 1) {
                                setTimerActive(false);
                                playSound('alarm');
                                return 0;
                            }
                            return s - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);
            
            // Coop Music Logic
            useEffect(() => {
                if (activeQuestion?.mode === 'COOP' && (activeQuestion.coopStage === 'GROUP' || activeQuestion.coopStage === 'PLAY')) {
                    if (isCoopMusicPlaying && audioRef.current) {
                        audioRef.current.play().catch(e => console.error("Audio play failed:", e));
                    } else if (!isCoopMusicPlaying && audioRef.current) {
                        audioRef.current.pause();
                    }
                } else if (audioRef.current) {
                    audioRef.current.pause();
                }
            }, [activeQuestion, isCoopMusicPlaying]);

            // Sync Question & History to Firestore
            const publishQuestionToFirestore = async (qObj, newHistoryList) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatePayload = {
                    activeQuestion: qObj,
                    updatedAt: Date.now()
                };
                if (newHistoryList) {
                    updatePayload.history = newHistoryList;
                }

                await window.fbUtils.setDoc(roomDocRef, updatePayload, { merge: true });
            };

            // Exit Room Cleanup
            const handleExitRoom = async () => {
                if (window.confirm("確定退出課室？將會同步清空此課室於 Firebase 的所有暫存紀錄！")) {
                    try {
                        const appId = "omit-8c173";
                        const db = window.fbDb;
                        
                        const responsesColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');
                        const resSnaps = await window.fbUtils.getDocs(responsesColRef);
                        resSnaps.forEach(async (d) => {
                            await window.fbUtils.deleteDoc(d.ref);
                        });

                        const studentsColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                        const stuSnaps = await window.fbUtils.getDocs(studentsColRef);
                        stuSnaps.forEach(async (d) => {
                            await window.fbUtils.deleteDoc(d.ref);
                        });

                        const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                        await window.fbUtils.deleteDoc(roomDocRef);

                        showToast("課室暫存資料已完全清空！", "info");
                    } catch (e) {
                        console.error("Cleanup error:", e);
                    }
                    onExit();
                }
            };

            // Download Template File (.docx)
            const handleDownloadTemplate = async () => {
                const sampleLines = [
                    "標題：地球生病了",
                    "總分: 100分",
                    "1.以下哪一項不是地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源",
                    "D. 機械資源*",
                    "",
                    "2.芝士的原料屬於哪一項不地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源*",
                    "D. 礦產資源",
                    "",
                    "3.人們不當使用水資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應*",
                    "",
                    "4.人們不當使用煤和石油資源會造成甚麼後果?",
                    "A. 引發極端天氣*",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應",
                    "",
                    "5.人們不當使用土地資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災*",
                    "C. 產生大量二氧化碳",
                    "D. 影響食水供應"
                ];

                try {
                    const blob = await createWordDocxBlob(sampleLines);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `${selectedMode === 'COOP' ? '合作題' : '挑戰題'}評估範本_地球生病了.docx`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast("已下載 Word 評估範本檔 (.docx)！", "success");
                } catch (err) {
                    console.error("Docx generation error:", err);
                    showToast("無法生成 Word 範本檔，請重新整理試試。", "error");
                }
            };

            // Word / Text document upload parser handler
            const handleWordFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setDocxFileName(file.name);
                const reader = new FileReader();

                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const arrayBuffer = evt.target.result;
                            const result = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                            parsedData = parseWordChallengeText(result.value);
                        } else {
                            const text = evt.target.result;
                            parsedData = parseWordChallengeText(text);
                        }
                        
                        if (selectedMode === 'COOP') {
                            setCoopData(parsedData);
                        } else {
                            setChallengeData(parsedData);
                        }
                        
                        showToast(`已成功解析範本檔案！共 ${parsedData.questions.length} 題`, 'success');
                    } catch (err) {
                        console.error("Word file parse error:", err);
                        showToast("文件解析失敗，請確認格式！", "error");
                    }
                };

                if (file.name.endsWith('.docx')) {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file, "UTF-8");
                }
            };
            
            // Handlers for modifying questions
            const handleUpdateTitle = (newTitle, isCoop = false) => {
                if (isCoop) {
                    setCoopData(prev => prev ? { ...prev, title: newTitle } : null);
                } else {
                    setChallengeData(prev => prev ? { ...prev, title: newTitle } : null);
                }
            };

            const handleUpdateScore = (newScore, isCoop = false) => {
                if (isCoop) {
                    setCoopData(prev => prev ? { ...prev, totalScore: parseInt(newScore) || 100 } : null);
                } else {
                    setChallengeData(prev => prev ? { ...prev, totalScore: parseInt(newScore) || 100 } : null);
                }
            };

            const handleUpdateQuestionText = (qIndex, text, isCoop = false) => {
                const updater = prev => {
                    if (!prev) return null;
                    const newQs = [...prev.questions];
                    newQs[qIndex] = { ...newQs[qIndex], text };
                    return { ...prev, questions: newQs };
                };
                isCoop ? setCoopData(updater) : setChallengeData(updater);
            };

            const handleUpdateOptionText = (qIndex, optIndex, text, isCoop = false) => {
                const updater = prev => {
                    if (!prev) return null;
                    const newQs = [...prev.questions];
                    const newOpts = [...newQs[qIndex].options];
                    newOpts[optIndex] = { ...newOpts[optIndex], text };
                    newQs[qIndex] = { ...newQs[qIndex], options: newOpts };
                    return { ...prev, questions: newQs };
                };
                isCoop ? setCoopData(updater) : setChallengeData(updater);
            };

            const handleUpdateCorrectAnswer = (qIndex, answerLetter, isCoop = false) => {
                const updater = prev => {
                    if (!prev) return null;
                    const newQs = [...prev.questions];
                    newQs[qIndex] = { ...newQs[qIndex], answer: answerLetter };
                    return { ...prev, questions: newQs };
                };
                isCoop ? setCoopData(updater) : setChallengeData(updater);
            };

            const handleDeleteQuestion = (qIndex, isCoop = false) => {
                const updater = prev => {
                    if (!prev) return null;
                    const newQs = prev.questions.filter((_, idx) => idx !== qIndex).map((q, idx) => ({
                        ...q,
                        num: idx + 1
                    }));
                    return { ...prev, questions: newQs };
                };
                isCoop ? setCoopData(updater) : setChallengeData(updater);
                showToast("已成功刪除該題目！", "info");
            };

            // Publish Active Question
            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                
                let challengeContent = null;
                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請先上載並解析 Word 評估範本檔案！", "error");
                        return;
                    }
                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }
                
                let coopContent = null;
                if (selectedMode === 'COOP') {
                    if (!coopData || !coopData.questions || coopData.questions.length === 0) {
                        showToast("請先上載並解析 Word 評估範本檔案！", "error");
                        return;
                    }
                    coopContent = {
                        title: coopData.title,
                        totalScore: coopData.totalScore,
                        questions: coopData.questions
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : 
                          selectedMode === 'COOP' ? `🤝 合作題：${coopData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent,
                    coop: coopContent,
                    coopStage: selectedMode === 'COOP' ? 'PREP' : null
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);

                publishQuestionToFirestore(newQ, updatedHistory);
                showToast(`已成功發佈【${getModeLabel(selectedMode)}】給所有學生！`, 'success');
            };
            
            // Coop Stage Transitions
            const handleCoopGoToGroup = () => {
                if (studentsList.length < 3) {
                    showToast("至少需要3名學生才能進行分組！", "error");
                    return;
                }
                const groups = generateCoopGroups(studentsList);
                setCoopGroups(groups);
                setIsCoopMusicPlaying(true);
                
                const updatedQ = {
                    ...activeQuestion,
                    coopStage: 'GROUP',
                    coopGroups: groups
                };
                publishQuestionToFirestore(updatedQ);
                setCoopStage('GROUP');
                showToast("已成功分組並向學生發送通知！", "success");
            };
            
            const handleCoopRegroup = () => {
                const groups = generateCoopGroups(studentsList);
                setCoopGroups(groups);
                
                const updatedQ = {
                    ...activeQuestion,
                    coopStage: 'GROUP',
                    coopGroups: groups
                };
                publishQuestionToFirestore(updatedQ);
                showToast("已重新分組！", "success");
            };
            
            const handleCoopStartPlay = () => {
                const updatedGroups = coopGroups.map(g => ({...g, progress: 0}));
                setCoopGroups(updatedGroups);
                
                const updatedQ = {
                    ...activeQuestion,
                    coopStage: 'PLAY',
                    coopGroups: updatedGroups,
                    coopWinner: null
                };
                publishQuestionToFirestore(updatedQ);
                setCoopStage('PLAY');
                showToast("比賽正式開始！", "success");
            };
            
            const handleCoopEnd = () => {
                setIsCoopMusicPlaying(false);
                const updatedQ = {
                    ...activeQuestion,
                    coopStage: 'PREP'
                };
                publishQuestionToFirestore(updatedQ);
                setCoopStage('PREP');
            };
            
            const handleCoopPlayAgain = () => {
                handleCoopStartPlay();
            };
            
            // Sync Coop progress from responses
            useEffect(() => {
                if (activeQuestion?.mode === 'COOP' && activeQuestion.coopStage === 'PLAY') {
                    // Find if any group won
                    let winner = null;
                    const totalQs = activeQuestion.coop.questions.length;
                    
                    const updatedGroups = [...coopGroups];
                    let needsUpdate = false;
                    
                    Object.values(currentQuestionResponses).forEach(res => {
                        if (res.type === 'COOP_PROGRESS') {
                            const groupIndex = updatedGroups.findIndex(g => g.id === res.groupId);
                            if (groupIndex !== -1 && updatedGroups[groupIndex].progress !== res.progress) {
                                updatedGroups[groupIndex].progress = res.progress;
                                needsUpdate = true;
                                if (res.progress >= totalQs) {
                                    winner = updatedGroups[groupIndex];
                                }
                            }
                        }
                    });
                    
                    if (winner && !activeQuestion.coopWinner) {
                        playSound('win');
                        const updatedQ = {
                            ...activeQuestion,
                            coopWinner: winner,
                            coopGroups: updatedGroups
                        };
                        publishQuestionToFirestore(updatedQ);
                    } else if (needsUpdate && !activeQuestion.coopWinner) {
                        setCoopGroups(updatedGroups);
                        // Optional: update firestore less frequently or only on win
                        const updatedQ = {
                            ...activeQuestion,
                            coopGroups: updatedGroups
                        };
                        publishQuestionToFirestore(updatedQ);
                    }
                }
            }, [currentQuestionResponses, activeQuestion]);

            // Teacher manual release of scores for Challenge mode
            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已成功向所有學生一併發放挑戰題成績！", "success");
            };

            // One-click download all student audio recordings as a ZIP file
            const handleDownloadAllAudio = async () => {
                const audioSubmissions = Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:audio'));
                
                if (audioSubmissions.length === 0) {
                    showToast("目前尚無學生提交錄音！", "error");
                    return;
                }

                try {
                    const zip = new JSZip();
                    const folder = zip.folder(`課堂錄音_房號${roomCode}`);

                    audioSubmissions.forEach((res) => {
                        const base64Data = res.answer.split(',')[1];
                        const fileName = `${res.seatNumber.toString().padStart(2, '0')}_${res.name || '學生'}.webm`;
                        folder.file(fileName, base64Data, { base64: true });
                    });

                    const content = await zip.generateAsync({ type: "blob" });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(content);
                    link.download = `OMIT_學生錄音_房號${roomCode}.zip`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    showToast(`已打包並下載 ${audioSubmissions.length} 位學生的語音檔案！`, "success");
                } catch (err) {
                    console.error("ZIP creation error:", err);
                    showToast("打包錄音檔案失敗！", "error");
                }
            };

            // Clear Active Question
            const handleClearQuestion = async () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: null }, { merge: true });
                setIsCoopMusicPlaying(false);
                showToast('已結束當前題目', 'info');
            };

            // Toggle Lock Response
            const toggleLockMode = async () => {
                const newLock = !lockAfterSubmit;
                setLockAfterSubmit(newLock);
                if (activeQuestion) {
                    const updatedQ = { ...activeQuestion, lockAfterSubmit: newLock };
                    publishQuestionToFirestore(updatedQ);
                    showToast(newLock ? "已鎖定答案（禁止修改）" : "已開放學生修改答案", "info");
                }
            };

            // Whiteboard Background Upload
            const handleBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setWhiteboardBg(evt.target.result);
                        showToast("已成功載入 16:9 白板背景圖片！", "success");
                    };
                    reader.readAsDataURL(file);
                }
            };

            // Broadcast Whiteboard Work to All Students
            const handleBroadcastSubmission = async (studentRes) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const isAlreadyBroadcasting = activeQuestion.broadcastedSubmission?.studentId === studentRes.studentId;
                
                const updatedQ = { 
                    ...activeQuestion, 
                    broadcastedSubmission: isAlreadyBroadcasting ? null : studentRes 
                };
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                if (isAlreadyBroadcasting) {
                    showToast("已取消廣播", "info");
                } else {
                    showToast(`已成功廣播 ${studentRes.name} 的作品至全班學生螢幕！`, "success");
                }
            };
            
            // Broadcast Teacher Demo Whiteboard
            const handleBroadcastDemo = async () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                if (isBroadcastingDemo) {
                    const updatedQ = { ...activeQuestion, demoWhiteboard: null };
                    await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                    setIsBroadcastingDemo(false);
                    showToast("已停止廣播示範白板", "info");
                } else {
                    if (demoCanvasRef.current) {
                        const dataUrl = demoCanvasRef.current.toDataURL();
                        const updatedQ = { ...activeQuestion, demoWhiteboard: dataUrl };
                        await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                        setIsBroadcastingDemo(true);
                        showToast("正廣播示範白板至全班學生螢幕", "success");
                    }
                }
            };
            
            // Update broadcasted demo if actively drawing
            const updateDemoBroadcast = async (dataUrl) => {
                if (isBroadcastingDemo && activeQuestion) {
                    const appId = "omit-8c173";
                    const db = window.fbDb;
                    const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                    const updatedQ = { ...activeQuestion, demoWhiteboard: dataUrl };
                    await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                }
            };

            // Random Student Selector Logic
            const handleSpinRandom = () => {
                if (isSpinning) return;
                
                const start = parseInt(rangeStart) || 1;
                const end = parseInt(rangeEnd) || 36;
                const available = [];
                for (let i = start; i <= end; i++) {
                    if (!drawnNumbers.includes(i)) available.push(i);
                }

                if (available.length === 0) {
                    showToast("此範圍內所有學號皆已被抽出！請點擊重置。", "error");
                    return;
                }

                setIsSpinning(true);
                let counter = 0;
                const maxIntervals = 20;

                const timer = setInterval(() => {
                    const temp = available[Math.floor(Math.random() * available.length)];
                    setCurrentDrawn(temp);
                    playSound('spin');
                    counter++;

                    if (counter >= maxIntervals) {
                        clearInterval(timer);
                        const finalPicked = available[Math.floor(Math.random() * available.length)];
                        setCurrentDrawn(finalPicked);
                        setDrawnNumbers(prev => [...prev, finalPicked]);
                        setIsSpinning(false);
                        playSound('win');
                    }
                }, 100);
            };

            // CSV Export
            const handleExportCSVReport = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生紀錄可供匯出！", "error");
                    return;
                }

                let csvContent = "\uFEFF"; // UTF-8 BOM
                csvContent += "學號,學生姓名,加入時間";

                historyQuestions.forEach((q, idx) => {
                    const cleanText = (q.text || getModeLabel(q.mode)).replace(/"/g, '""');
                    if (q.mode === 'CHALLENGE' && q.challenge) {
                        csvContent += `,第${idx + 1}題[挑戰題:${q.challenge.title}得分],第${idx + 1}題[挑戰題正確率],第${idx + 1}題[作答用時]`;
                    } else if (q.mode === 'COOP' && q.coop) {
                        csvContent += `,第${idx + 1}題[合作題:${q.coop.title}]`;
                    } else {
                        csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]: "${cleanText}"`;
                    }
                });
                csvContent += "\n";

                const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

                sortedStudents.forEach((stu) => {
                    const cleanName = (stu.name || '').replace(/"/g, '""');
                    csvContent += `"${stu.seatNumber}號","${cleanName}","${stu.joinTime || ''}"`;
                    
                    historyQuestions.forEach((q) => {
                        const resKey = `${q.id}_${stu.id}`;
                        const res = responses[resKey];
                        
                        if (res && res.answer !== undefined && res.answer !== null) {
                            if (q.mode === 'CHALLENGE' && res.scoreDetails) {
                                csvContent += `,"${res.scoreDetails.totalScore} / ${q.challenge.totalScore}分","${res.scoreDetails.percentage}%","${res.duration || 0}s"`;
                            } else if (q.mode === 'COOP') {
                                csvContent += `,"已參與"`;
                            } else {
                                let ansVal = res.answer;
                                if (typeof ansVal === 'string' && ansVal.startsWith('data:image')) {
                                    ansVal = '[圖像白板答案]';
                                } else if (typeof ansVal === 'string' && ansVal.startsWith('data:audio')) {
                                    ansVal = '[語音錄音檔案]';
                                }
                                const cleanAns = String(ansVal).replace(/"/g, '""');
                                csvContent += `,"${cleanAns} (用時:${res.duration || 0}s)"`;
                            }
                        } else {
                            if (q.mode === 'CHALLENGE') {
                                csvContent += `,"未作答","0%","-"`;
                            } else {
                                csvContent += `,"未作答"`;
                            }
                        }
                    });
                    csvContent += "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `OMIT_課堂學習成績報告_房號${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("完整學習報告與成績已匯出試算表！", "success");
            };

            // Leaderboard calculation
            const leaderboard = useMemo(() => {
                return Object.values(currentQuestionResponses)
                    .filter(r => r.duration !== undefined && r.type !== 'COOP_PROGRESS')
                    .sort((a, b) => {
                        if (activeQuestion?.mode === 'CHALLENGE') {
                            const scoreA = a.scoreDetails?.totalScore || 0;
                            const scoreB = b.scoreDetails?.totalScore || 0;
                            if (scoreB !== scoreA) return scoreB - scoreA;
                        }
                        return parseFloat(a.duration) - parseFloat(b.duration);
                    });
            }, [currentQuestionResponses, activeQuestion]);

            // Helper boolean to check if scores are released for Challenge mode
            const challengeScoresAreReleased = useMemo(() => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return true;
                return !!(activeQuestion.challenge?.releaseInstant || activeQuestion.challenge?.scoresReleased);
            }, [activeQuestion]);
            
            return (
                <div class="min-h-screen pb-12 relative">
                    {/* Audio element for Coop Mode background music */}
                    <audio 
                        ref={audioRef} 
                        src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" 
                        loop
                        crossOrigin="anonymous"
                    ></audio>
                
                    {/* Header Controls */}
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 py-3">
                        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                            <div class="flex items-center space-x-3">
                                <span class="bg-slate-900 text-white font-black px-3 py-1.5 rounded-xl text-lg">OMIT</span>
                                <div>
                                    <h1 class="font-bold text-slate-800 text-base flex items-center gap-2">
                                        宣道會陳元喜小學OMIT互動課堂
                                        <span class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded-full font-mono font-bold">
                                            房號：{roomCode}
                                        </span>
                                    </h1>
                                </div>
                            </div>

                            <div class="flex flex-wrap items-center gap-2">
                                <button 
                                    onClick={() => setShowQRModal(true)}
                                    class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-2 rounded-xl border border-indigo-200 text-sm flex items-center space-x-1.5 transition"
                                >
                                    <span>📱 QR Code</span>
                                </button>

                                <button 
                                    onClick={() => setShowStudentListModal(true)}
                                    class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold px-3 py-2 rounded-xl border border-emerald-200 text-sm flex items-center space-x-1.5 transition relative overflow-hidden"
                                >
                                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping absolute left-3 top-3"></span>
                                    <span class="pl-4">已加入：{studentsList.length} 人</span>
                                </button>

                                <button 
                                    onClick={() => setShowRandomModal(true)}
                                    class="bg-purple-50 hover:bg-purple-100 text-purple-700 font-bold px-3 py-2 rounded-xl border border-purple-200 text-sm transition"
                                >
                                    🎲 抽選學生
                                </button>
                                
                                <button 
                                    onClick={() => setShowDemoWhiteboard(true)}
                                    class="bg-fuchsia-50 hover:bg-fuchsia-100 text-fuchsia-700 font-bold px-3 py-2 rounded-xl border border-fuchsia-200 text-sm transition"
                                >
                                    🖌️ 白板
                                </button>

                                <button 
                                    onClick={() => setShowTimerModal(true)}
                                    class={`px-3 py-2 rounded-xl border text-sm font-bold flex items-center space-x-1.5 transition ${
                                        timerActive 
                                        ? 'bg-amber-500 text-white border-amber-600 animate-pulse' 
                                        : 'bg-amber-50 hover:bg-amber-100 text-amber-800 border-amber-200'
                                    }`}
                                >
                                    <span>⏱️ 計時器</span>
                                    {timerSeconds > 0 && (
                                        <span class="bg-white/20 font-mono text-xs px-1.5 py-0.5 rounded">
                                            {Math.floor(timerSeconds / 60)}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                        </span>
                                    )}
                                </button>

                                <button 
                                    onClick={handleExportCSVReport}
                                    class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold px-3 py-2 rounded-xl border border-blue-200 text-sm transition"
                                >
                                    📊 匯出報告
                                </button>

                                <button 
                                    onClick={handleExitRoom}
                                    class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2 rounded-xl border border-rose-200 text-sm transition"
                                >
                                    🚪 退出課室
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Container */}
                    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

                        {/* Mode Selectors */}
                        <div class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-9 gap-3">
                            {[
                                { id: 'CHOICE', label: '選擇題', icon: '🔘' },
                                { id: 'TF', label: '是非題', icon: '⭕' },
                                { id: 'SHORT', label: '短答題', icon: '✍️' },
                                { id: 'DRAW', label: '白板題', icon: '🎨' },
                                { id: 'BUZZER', label: '搶答題', icon: '🚨' },
                                { id: 'AUDIO', label: '錄音題', icon: '🎤' },
                                { id: 'CHALLENGE', label: '挑戰題', icon: '🏆' },
                                { id: 'COOP', label: '合作題', icon: '🤝' },
                                { id: 'LINK', label: '派送連結', icon: '🔗' }
                            ].map((mode) => (
                                <button 
                                    key={mode.id}
                                    onClick={() => setSelectedMode(mode.id)}
                                    class={`p-2.5 md:p-3 rounded-2xl font-bold border-2 transition-all text-center flex flex-col items-center justify-center space-y-1 shadow-sm active:scale-95 ${
                                        selectedMode === mode.id 
                                        ? 'bg-slate-900 text-white border-slate-900 ring-4 ring-slate-200' 
                                        : 'bg-white text-slate-700 border-slate-200 hover:border-slate-300 hover:bg-slate-50'
                                    }`}
                                >
                                    <span class="text-xl md:text-2xl">{mode.icon}</span>
                                    <span class="text-[10px] md:text-xs font-extrabold whitespace-nowrap">{mode.label}</span>
                                </button>
                            ))}
                        </div>

                        {}
                        {/* Question Creation Panel */}
                        {(!activeQuestion || (activeQuestion && activeQuestion.mode !== selectedMode)) && (
                            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                                <div class="flex flex-wrap items-center justify-between border-b pb-3 gap-2">
                                    <h2 class="font-extrabold text-slate-800 text-lg flex items-center gap-2">
                                        <span>模式設定：{getModeLabel(selectedMode)}</span>
                                    </h2>

                                    {selectedMode !== 'CHALLENGE' && selectedMode !== 'COOP' && (
                                        <div class="flex items-center space-x-2 bg-slate-100 p-1.5 rounded-xl">
                                            <span class="text-xs font-bold text-slate-600 pl-2">提交後允許修改：</span>
                                            <button 
                                                onClick={toggleLockMode}
                                                class={`px-3 py-1 rounded-lg text-xs font-bold transition ${!lockAfterSubmit ? 'bg-emerald-500 text-white' : 'bg-slate-300 text-slate-600'}`}
                                            >
                                                {!lockAfterSubmit ? '已開放修改' : '已鎖定 (預設)'}
                                            </button>
                                        </div>
                                    )}
                                </div>

                                {selectedMode === 'CHOICE' && (
                                    <div class="flex items-center space-x-4">
                                        <label class="text-sm font-bold text-slate-700">選項數量：</label>
                                        {[4, 5].map((cnt) => (
                                            <button 
                                                key={cnt} 
                                                onClick={() => setChoiceCount(cnt)}
                                                class={`px-3 py-1.5 rounded-xl font-bold text-sm border ${choiceCount === cnt ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-700'}`}
                                            >
                                                {cnt} 個選項 ({cnt === 4 ? 'A-D' : 'A-E'})
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {selectedMode === 'AUDIO' && (
                                    <div class="bg-cyan-50 border border-cyan-200 p-4 rounded-2xl text-cyan-900 space-y-2">
                                        <div class="font-bold text-sm flex items-center gap-2">
                                            <span>🎤 錄音題模式說明：</span>
                                        </div>
                                        <p class="text-xs text-cyan-800">
                                            學生可在手機或電腦直接錄製不多於 <strong class="text-red-600">10 秒</strong> 的語音回答。提交後教師可線上監聽播放，並可點擊「一鍵下載所有學生錄音」導出打包的 ZIP 壓縮檔。
                                        </p>
                                    </div>
                                )}
                                
                                {/* COOP Question Setup */}
                                {selectedMode === 'COOP' && (
                                    <div class="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200 p-5 rounded-2xl space-y-5 text-slate-800">
                                        <div class="flex flex-wrap items-center justify-between gap-2 border-b border-blue-200 pb-3">
                                            <h3 class="font-black text-blue-900 text-base flex items-center gap-2">
                                                <span>🤝 合作題(預備階段)</span>
                                            </h3>
                                            <button 
                                                type="button"
                                                onClick={handleDownloadTemplate}
                                                class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow transition flex items-center gap-1.5"
                                            >
                                                <span>📄 下載評估範本Word檔</span>
                                            </button>
                                        </div>

                                        <div class="bg-white p-4 rounded-xl border border-blue-200 space-y-3">
                                            <label class="block text-xs font-bold text-slate-700">
                                                上載修改後的 Word 文件 (.docx) 或文字檔 (.txt)：
                                            </label>
                                            <input 
                                                type="file" 
                                                accept=".docx,.txt"
                                                onChange={handleWordFileUpload}
                                                class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer"
                                            />
                                            
                                            {coopData && (
                                                <div class="bg-blue-50/90 p-4 rounded-xl border-2 border-blue-300 space-y-4 mt-4">
                                                    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-blue-200 pb-2">
                                                        <span class="font-black text-blue-900 text-sm">✏️ 教師編輯/確認評估內容：</span>
                                                        <span class="text-xs text-blue-700 font-bold">可直接修訂文字、調整正確答案或刪除題目</span>
                                                    </div>

                                                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                                                        <div class="md:col-span-2">
                                                            <label class="block text-xs font-bold text-slate-600 mb-1">評估標題：</label>
                                                            <input 
                                                                type="text" 
                                                                value={coopData.title}
                                                                onChange={(e) => handleUpdateTitle(e.target.value, true)}
                                                                class="w-full px-3 py-2 rounded-lg border focus:ring-2 focus:ring-blue-500 font-bold text-slate-800 text-sm bg-white"
                                                            />
                                                        </div>
                                                    </div>

                                                    <div class="space-y-3 max-h-80 overflow-y-auto pr-1">
                                                        {coopData.questions.map((q, qIdx) => (
                                                            <div key={qIdx} class="bg-white p-3.5 rounded-xl border border-blue-200 space-y-2.5 text-xs shadow-sm">
                                                                <div class="flex items-center justify-between gap-2">
                                                                    <div class="flex items-center gap-2 flex-1">
                                                                        <span class="font-black text-blue-900 whitespace-nowrap">第 {q.num || qIdx + 1} 題:</span>
                                                                        <input 
                                                                            type="text"
                                                                            value={q.text}
                                                                            onChange={(e) => handleUpdateQuestionText(qIdx, e.target.value, true)}
                                                                            class="w-full px-2 py-1.5 border rounded font-medium text-slate-800 focus:ring-1 focus:ring-blue-500"
                                                                        />
                                                                    </div>
                                                                    <button 
                                                                        type="button"
                                                                        onClick={() => handleDeleteQuestion(qIdx, true)}
                                                                        class="px-2.5 py-1 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-lg text-xs whitespace-nowrap flex items-center gap-1 border border-red-200 transition active:scale-95"
                                                                    >
                                                                        <span>🗑️ 刪除</span>
                                                                    </button>
                                                                </div>

                                                                <div class="grid grid-cols-1 md:grid-cols-2 gap-2 pl-4">
                                                                    {q.options.map((opt, optIdx) => (
                                                                        <div key={optIdx} class="flex items-center space-x-1.5">
                                                                            <span class="font-bold text-slate-600 w-4">{opt.letter}.</span>
                                                                            <input 
                                                                                type="text"
                                                                                value={opt.text}
                                                                                onChange={(e) => handleUpdateOptionText(qIdx, optIdx, e.target.value, true)}
                                                                                class="flex-1 px-2 py-1 border rounded text-slate-700 focus:ring-1 focus:ring-blue-500"
                                                                            />
                                                                        </div>
                                                                    ))}
                                                                </div>

                                                                <div class="flex items-center space-x-2 pt-1 border-t border-slate-100 pl-4">
                                                                    <span class="font-bold text-emerald-700">設定正確答案：</span>
                                                                    {['A', 'B', 'C', 'D'].map((letter) => (
                                                                        <label key={letter} class="flex items-center space-x-1 cursor-pointer font-bold">
                                                                            <input 
                                                                                type="radio" 
                                                                                name={`ans_coop_${qIdx}`} 
                                                                                checked={q.answer === letter}
                                                                                onChange={() => handleUpdateCorrectAnswer(qIdx, letter, true)}
                                                                                class="accent-emerald-600"
                                                                            />
                                                                            <span class={q.answer === letter ? 'text-emerald-700 font-black' : 'text-slate-500'}>{letter}</span>
                                                                        </label>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {/* Challenge Question Setup */}
                                {selectedMode === 'CHALLENGE' && (
                                    <div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 p-5 rounded-2xl space-y-5 text-slate-800">
                                        <div class="flex flex-wrap items-center justify-between gap-2 border-b border-amber-200 pb-3">
                                            <h3 class="font-black text-amber-900 text-base flex items-center gap-2">
                                                <span>🏆 Word 文件挑戰題評估設定</span>
                                            </h3>
                                            <div class="flex items-center space-x-2">
                                                <button 
                                                    type="button"
                                                    onClick={handleDownloadTemplate}
                                                    class="bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow transition flex items-center gap-1.5"
                                                >
                                                    <span>📄 下載評估範本Word檔</span>
                                                </button>
                                                <span class="text-xs bg-amber-200 text-amber-800 px-2.5 py-1 rounded-lg font-bold">自動批改</span>

                                                    setTimerSeconds(customTimerMins * 60 + customTimerSecs);
