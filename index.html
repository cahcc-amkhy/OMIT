                                    <button onClick={() => setShowTimerModal(false)} class="text-slate-400 text-2xl font-bold">✕</button>
                                </div>

                                <div class="text-center bg-slate-900 text-white p-6 rounded-2xl shadow-inner space-y-2">
                                    <div class="text-xs uppercase tracking-widest text-slate-400 font-bold">倒數時間</div>
                                    <div class={`font-mono font-black text-6xl tracking-widest ${timerSeconds <= 10 && timerSeconds > 0 ? 'text-red-400 animate-pulse' : 'text-amber-400'}`}>
                                        {Math.floor(timerSeconds / 60).toString().padStart(2, '0')}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                    </div>
                                </div>

                                {/* Presets: 30s, 1m, 2m, 3m, 4m, 5m */}
                                <div class="grid grid-cols-3 gap-2">
                                    {[
                                        ['30秒', 30], ['1分鐘', 60], ['2分鐘', 120],
                                        ['3分鐘', 180], ['4分鐘', 240], ['5分鐘', 300]
                                    ].map(([lbl, sec]) => (
                                        <button 
                                            key={lbl} 
                                            onClick={() => { setTimerSeconds(sec); setTimerActive(true); }}
                                            class="py-2.5 rounded-xl bg-slate-100 hover:bg-amber-100 hover:text-amber-900 font-extrabold text-sm text-slate-700 border transition"
                                        >
                                            {lbl}
                                        </button>
                                    ))}
                                </div>

                                {/* Manual 00:00 (Min:Sec) input */}
                                <div class="flex items-center space-x-2 pt-1">
                                    <span class="text-xs font-bold text-slate-500">手動時間 (00:00)：</span>
                                    <input 
                                        type="number" 
                                        min="0"
                                        max="99"
                                        value={customTimerMins}
                                        onChange={(e) => setCustomTimerMins(parseInt(e.target.value) || 0)}
                                        class="w-14 px-2 py-1.5 text-center border rounded-xl font-mono font-bold text-sm"
                                        placeholder="分"
                                    />
                                    <span class="font-bold font-mono">:</span>
                                    <input 
                                        type="number" 
                                        min="0"
                                        max="59"
                                        value={customTimerSecs}
                                        onChange={(e) => setCustomTimerSecs(Math.min(59, parseInt(e.target.value) || 0))}
                                        class="w-14 px-2 py-1.5 text-center border rounded-xl font-mono font-bold text-sm"
                                        placeholder="秒"
                                    />
                                    <button 
                                        onClick={() => { setTimerSeconds(customTimerMins * 60 + customTimerSecs); setTimerActive(true); }}
                                        class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold"
                                    >
                                        設定並開始
                                    </button>
                                </div>

                                <div class="flex space-x-2 pt-2">
                                    <button 
                                        onClick={() => setTimerActive(!timerActive)}
                                        class={`flex-1 py-3 rounded-xl font-bold text-sm text-white shadow transition ${timerActive ? 'bg-amber-500 hover:bg-amber-600' : 'bg-emerald-600 hover:bg-emerald-700'}`}
                                    >
                                        {timerActive ? '暫停計時' : '繼續計時'}
                                    </button>
                                    <button 
                                        onClick={() => { setTimerActive(false); setTimerSeconds(0); }}
                                        class="px-4 py-3 rounded-xl bg-slate-200 text-slate-700 font-bold text-sm hover:bg-slate-300"
                                    >
                                        歸零
                                    </button>
                                    <button 
                                        onClick={() => setTimerZoomed(true)}
                                        class="px-4 py-3 rounded-xl bg-indigo-50 text-indigo-700 border border-indigo-200 font-bold text-sm hover:bg-indigo-100"
                                    >
                                        🔍 全螢幕
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {timerZoomed && (
                        <div class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-8 text-white space-y-8">
                            <div class="text-2xl font-bold uppercase tracking-widest text-slate-400">計時器倒數</div>
                            <div class="font-mono font-black text-9xl tracking-widest text-amber-400">
                                {Math.floor(timerSeconds / 60).toString().padStart(2, '0')}:{(timerSeconds % 60).toString().padStart(2, '0')}
                            </div>
                            <button 
                                onClick={() => setTimerZoomed(false)}
                                class="px-8 py-3 bg-white text-slate-900 font-black rounded-2xl text-lg shadow-xl"
                            >
                                關閉全螢幕
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
            const [selectedAnswer, setSelectedAnswer] = useState('');
            const [shortAnswerInput, setShortAnswerInput] = useState('');
            const [submitted, setSubmitted] = useState(false);
            const [submittedMessage, setSubmittedMessage] = useState(false);

            // Audio Recording State
            const [isRecording, setIsRecording] = useState(false);
            const [recordingTime, setRecordingTime] = useState(0);
            const [audioBlobUrl, setAudioBlobUrl] = useState(null);
            const [audioBase64, setAudioBase64] = useState(null);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);
            const recordingTimerRef = useRef(null);

            // Challenge Question Answers
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [challengeTimerRemaining, setChallengeTimerRemaining] = useState(null);

            const myResponseKey = `${activeQuestion?.id}_${studentId}`;
            const existingRes = responses[myResponseKey];

            // Answer startTime
            const questionStartTimeRef = useRef(Date.now());

            useEffect(() => {
                questionStartTimeRef.current = Date.now();
                setSubmitted(false);
                setSubmittedMessage(false);
                setSelectedAnswer('');
                setShortAnswerInput('');
                setAudioBlobUrl(null);
                setAudioBase64(null);
                setChallengeAnswers({});

                if (existingRes) {
                    setSubmitted(true);
                    if (existingRes.challengeAnswers) setChallengeAnswers(existingRes.challengeAnswers);
                }

                // Challenge mode timer init
                if (activeQuestion?.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer && activeQuestion.challenge?.timeLimit) {
                    setChallengeTimerRemaining(activeQuestion.challenge.timeLimit);
                }
            }, [activeQuestion?.id]);

            // Challenge auto countdown timer
            useEffect(() => {
                let interval = null;
                if (activeQuestion?.mode === 'CHALLENGE' && challengeTimerRemaining !== null && !submitted) {
                    if (challengeTimerRemaining <= 0) {
                        handleChallengeAutoSubmit();
                    } else {
                        interval = setInterval(() => {
                            setChallengeTimerRemaining(t => t - 1);
                        }, 1000);
                    }
                }
                return () => clearInterval(interval);
            }, [challengeTimerRemaining, activeQuestion, submitted]);

            // Audio Recording controls
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const url = URL.createObjectURL(blob);
                        setAudioBlobUrl(url);

                        const reader = new FileReader();
                        reader.onloadend = () => setAudioBase64(reader.result);
                        reader.readAsDataURL(blob);

                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                    setRecordingTime(0);

                    recordingTimerRef.current = setInterval(() => {
                        setRecordingTime(t => {
                            if (t >= 9) {
                                stopRecording();
                                return 10;
                            }
                            return t + 1;
                        });
                    }, 1000);
                } catch (err) {
                    console.error("Microphone access denied:", err);
                    showToast("無法存取麥克風，請確認權限設定！", "error");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                    clearInterval(recordingTimerRef.current);
                }
            };

            // Revision Item 4: Delete recording
            const handleAudioDeleteReRecord = () => {
                setAudioBlobUrl(null);
                setAudioBase64(null);
                setRecordingTime(0);
                showToast("已刪除錄音，可點擊重新錄製", "info");
            };

            const submitResponse = async (ansValue, challengeScoreDetails = null) => {
                if (!activeQuestion) return;

                const durationSecs = ((Date.now() - questionStartTimeRef.current) / 1000).toFixed(1);

                const resPayload = {
                    studentId: studentId,
                    questionId: activeQuestion.id,
                    seatNumber: seatNumber,
                    name: studentName.trim() || `學號 ${seatNumber}`,
                    answer: ansValue,
                    duration: durationSecs,
                    timestamp: Date.now()
                };

                if (challengeScoreDetails) {
                    resPayload.scoreDetails = challengeScoreDetails;
                    resPayload.challengeAnswers = challengeAnswers;
                }

                const appId = "omit-8c173";
                const db = window.fbDb;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', myResponseKey);
                
                await window.fbUtils.setDoc(resDocRef, resPayload);
                setSubmitted(true);
                setSubmittedMessage(true); // Revision Item 5: Show unified encouraging message
                showToast("提交成功！", "success");
            };

            // Revision Item 13, 18: Challenge Auto Submit on Time Expiry
            const handleChallengeAutoSubmit = () => {
                if (submitted || !activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;

                const qList = activeQuestion.challenge.questions;
                let correctCount = 0;

                qList.forEach(q => {
                    if (challengeAnswers[q.num] === q.answer) {
                        correctCount++;
                    }
                });

                const totalQ = qList.length;
                const pct = Math.round((correctCount / totalQ) * 100);
                const earnedScore = Math.round((correctCount / totalQ) * activeQuestion.challenge.totalScore);

                const scoreDetails = {
                    totalScore: earnedScore,
                    percentage: pct,
                    correctCount,
                    totalQuestions: totalQ
                };

                submitResponse('CHALLENGE_SUBMITTED', scoreDetails);
            };

            const handleChallengeManualSubmit = (e) => {
                e?.preventDefault();
                handleChallengeAutoSubmit();
            };

            return (
                <div class="min-h-screen bg-slate-100 pb-12">
                    {/* Header */}
                    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-30">
                        <div class="max-w-3xl mx-auto flex items-center justify-between">
                            <div>
                                <h1 class="font-extrabold text-lg">宣道會陳元喜小學 OMIT互動課堂</h1>
                                <p class="text-xs text-indigo-200">房號：{roomCode} | 學號：{seatNumber}號 ({studentName || '未設姓名'})</p>
                            </div>
                            <button onClick={onExit} class="text-xs bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-lg font-bold">
                                離開課堂
                            </button>
                        </div>
                    </header>

                    <main class="max-w-3xl mx-auto p-4 space-y-6 mt-4">

                        {/* Broadcast Work Modal from Teacher (Item 2) */}
                        {activeQuestion?.broadcastedSubmission && (
                            <div class="bg-purple-900 text-white rounded-3xl p-5 shadow-2xl border-4 border-purple-400 space-y-3 animate-pulse">
                                <div class="flex justify-between items-center border-b border-purple-700 pb-2">
                                    <span class="font-black text-sm text-purple-200">📢 教師全班廣播互評作品</span>
                                    <span class="text-xs font-bold bg-purple-700 px-2.5 py-1 rounded-full">
                                        作者：{activeQuestion.broadcastedSubmission.name} ({activeQuestion.broadcastedSubmission.seatNumber}號)
                                    </span>
                                </div>
                                <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden">
                                    <img src={activeQuestion.broadcastedSubmission.answer} class="w-full h-full object-contain" alt="廣播作品" />
                                </div>
                            </div>
                        )}

                        {/* Active Question Box */}
                        {activeQuestion ? (
                            <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-200 space-y-6">
                                <div class="border-b pb-4 flex justify-between items-start gap-3">
                                    <div>
                                        <span class="bg-indigo-100 text-indigo-700 text-xs font-extrabold px-3 py-1 rounded-full">
                                            {getModeLabel(activeQuestion.mode)}
                                        </span>
                                        <h2 class="text-xl font-black text-slate-800 mt-2">{activeQuestion.text}</h2>
                                    </div>

                                    {/* Revision Item 11: Challenge Mode Timer Display */}
                                    {activeQuestion.mode === 'CHALLENGE' && challengeTimerRemaining !== null && (
                                        <div class="bg-amber-100 border border-amber-300 px-3.5 py-1.5 rounded-xl text-center">
                                            <div class="text-[10px] font-bold text-amber-800 uppercase">剩餘時間</div>
                                            <div class="font-mono font-black text-lg text-amber-900">
                                                {Math.floor(challengeTimerRemaining / 60).toString().padStart(2, '0')}:{(challengeTimerRemaining % 60).toString().padStart(2, '0')}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Revision Item 5: Unified submission confirmation message */}
                                {submittedMessage && (
                                    <div class="bg-emerald-50 border-2 border-emerald-400 p-5 rounded-2xl text-center space-y-1 animate-fade-in shadow-sm">
                                        <div class="text-2xl">🎉</div>
                                        <div class="font-black text-emerald-800 text-base">
                                            已提交答案! 讚賞你的努力! 安靜等候老師指示...
                                        </div>
                                    </div>
                                )}

                                {/* Revision Item 3: YouTube / Link Delivery */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div class="space-y-4">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div class="aspect-16-9 w-full rounded-2xl overflow-hidden border shadow-inner">
                                                <iframe 
                                                    src={activeQuestion.youtubeEmbed} 
                                                    class="w-full h-full" 
                                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                                    allowFullScreen
                                                ></iframe>
                                            </div>
                                        ) : null}

                                        {activeQuestion.pushedUrl && (
                                            <a 
                                                href={activeQuestion.pushedUrl} 
                                                target="_blank" 
                                                rel="noopener noreferrer" 
                                                class="block w-full text-center bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-indigo-200 text-lg transition active:scale-98"
                                            >
                                                開啟連結網站 ↗
                                            </a>
                                        )}
                                    </div>
                                )}

                                {/* Choice / TF Mode */}
                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        {activeQuestion.choiceOptions.map((opt) => (
                                            <button 
                                                key={opt}
                                                disabled={submitted && activeQuestion.lockAfterSubmit}
                                                onClick={() => {
                                                    setSelectedAnswer(opt);
                                                    submitResponse(opt);
                                                }}
                                                class={`p-5 rounded-2xl font-black text-lg border-2 transition text-left flex items-center justify-between ${
                                                    selectedAnswer === opt || existingRes?.answer === opt 
                                                    ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg shadow-indigo-200 scale-102' 
                                                    : 'bg-slate-50 text-slate-800 border-slate-200 hover:border-indigo-300'
                                                }`}
                                            >
                                                <span>{opt}</span>
                                                {(selectedAnswer === opt || existingRes?.answer === opt) && <span>✓</span>}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {/* Short Answer */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-3">
                                        <textarea 
                                            rows={3} 
                                            placeholder="請輸入您的回答..."
                                            value={shortAnswerInput}
                                            onChange={(e) => setShortAnswerInput(e.target.value)}
                                            disabled={submitted && activeQuestion.lockAfterSubmit}
                                            class="w-full p-4 rounded-2xl border-2 border-slate-200 focus:outline-none focus:border-indigo-500 font-medium text-slate-800 text-base"
                                        />
                                        <button 
                                            onClick={() => submitResponse(shortAnswerInput)}
                                            disabled={!shortAnswerInput.trim() || (submitted && activeQuestion.lockAfterSubmit)}
                                            class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-bold py-3.5 rounded-xl shadow-md transition"
                                        >
                                            確認提交回答
                                        </button>
                                    </div>
                                )}

                                {/* Revision Item 1: Whiteboard Canvas Drawing */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <div class="space-y-4">
                                        <WhiteboardCanvas 
                                            bgImage={activeQuestion.whiteboardBg} 
                                            readonly={submitted && activeQuestion.lockAfterSubmit}
                                            onSave={(canvasData) => {
                                                setSelectedAnswer(canvasData);
                                            }}
                                        />
                                        <button 
                                            onClick={() => submitResponse(selectedAnswer)}
                                            disabled={!selectedAnswer || (submitted && activeQuestion.lockAfterSubmit)}
                                            class="w-full bg-purple-600 hover:bg-purple-700 disabled:bg-slate-300 text-white font-black py-4 rounded-2xl shadow-lg shadow-purple-200 text-base transition"
                                        >
                                            提交白板答案
                                        </button>
                                    </div>
                                )}

                                {/* Revision Item 17: Buzzer Mode Locking ONLY 1st student */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="text-center py-6 space-y-4">
                                        <button 
                                            disabled={submitted}
                                            onClick={() => {
                                                playSound('buzzer');
                                                submitResponse('PRESSED');
                                            }}
                                            class={`w-48 h-48 rounded-full border-8 font-black text-3xl shadow-2xl transition transform active:scale-90 ${
                                                submitted 
                                                ? 'bg-slate-300 text-slate-500 border-slate-400' 
                                                : 'bg-rose-500 hover:bg-rose-600 text-white border-rose-300 ring-8 ring-rose-200 animate-pulse'
                                            }`}
                                        >
                                            {submitted ? '已點擊！' : '搶答！'}
                                        </button>
                                    </div>
                                )}

                                {/* Revision Item 4: Audio Question Flow with Audio Player & Separate Confirm / Re-record Buttons */}
                                {activeQuestion.mode === 'AUDIO' && (
                                    <div class="space-y-5 text-center py-2">
                                        {!audioBlobUrl ? (
                                            <div class="space-y-3">
                                                <button 
                                                    onClick={isRecording ? stopRecording : startRecording}
                                                    disabled={submitted && activeQuestion.lockAfterSubmit}
                                                    class={`w-28 h-28 rounded-full border-4 font-black text-sm shadow-lg transition flex flex-col items-center justify-center mx-auto ${
                                                        isRecording 
                                                        ? 'bg-red-500 text-white border-red-300 animate-ping' 
                                                        : 'bg-cyan-600 text-white border-cyan-200'
                                                    }`}
                                                >
                                                    <span class="text-2xl mb-1">{isRecording ? '⏹️' : '🎤'}</span>
                                                    <span>{isRecording ? `${recordingTime}s 停止` : '開始錄音'}</span>
                                                </button>
                                                <p class="text-xs text-slate-400">最長錄音限制：10秒</p>
                                            </div>
                                        ) : (
                                            <div class="bg-cyan-50 border border-cyan-200 p-5 rounded-2xl space-y-4 max-w-md mx-auto">
                                                <div class="text-xs font-bold text-cyan-900">試聽您的錄音：</div>
                                                <audio src={audioBlobUrl} controls class="w-full h-10 rounded-lg" />
                                                
                                                <div class="flex space-x-3 pt-2">
                                                    <button 
                                                        onClick={handleAudioDeleteReRecord}
                                                        disabled={submitted && activeQuestion.lockAfterSubmit}
                                                        class="flex-1 py-3 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-bold rounded-xl text-sm transition"
                                                    >
                                                        🗑️ 刪除重錄
                                                    </button>
                                                    <button 
                                                        onClick={() => submitResponse(audioBase64)}
                                                        disabled={submitted && activeQuestion.lockAfterSubmit}
                                                        class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow transition"
                                                    >
                                                        ✅ 確認提交錄音
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Revision Item 13 & 18: Challenge Mode Student Interface with Detailed Answers Unlocked */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                    <form onSubmit={handleChallengeManualSubmit} class="space-y-6">
                                        <div class="space-y-6">
                                            {activeQuestion.challenge.questions.map((q) => {
                                                const studentChosen = challengeAnswers[q.num];
                                                const isTeacherReleased = activeQuestion.challenge.scoresReleased || activeQuestion.challenge.releaseInstant;

                                                return (
                                                    <div key={q.num} class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                                                        <div class="font-bold text-slate-800 text-base">
                                                            {q.num}. {q.text}
                                                        </div>

                                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                            {q.options.map((opt) => {
                                                                let btnStyle = "bg-white border-slate-200 text-slate-700";

                                                                if (!submitted) {
                                                                    if (studentChosen === opt.letter) {
                                                                        btnStyle = "bg-amber-500 text-white border-amber-500 font-bold";
                                                                    }
                                                                } else {
                                                                    // Revision Item 18: Unlocked Answer Details display after release
                                                                    if (isTeacherReleased) {
                                                                        if (opt.letter === q.answer) {
                                                                            btnStyle = "bg-emerald-600 text-white border-emerald-600 font-bold ring-2 ring-emerald-300"; // Correct Option GREEN
                                                                        } else if (studentChosen === opt.letter && studentChosen !== q.answer) {
                                                                            btnStyle = "bg-rose-600 text-white border-rose-600 font-bold"; // Student Wrong Option RED
                                                                        }
                                                                    } else {
                                                                        if (studentChosen === opt.letter) {
                                                                            btnStyle = "bg-slate-700 text-white border-slate-700 font-bold";
                                                                        }
                                                                    }
                                                                }

                                                                return (
                                                                    <button 
                                                                        key={opt.letter}
                                                                        type="button"
                                                                        disabled={submitted}
                                                                        onClick={() => setChallengeAnswers(prev => ({ ...prev, [q.num]: opt.letter }))}
                                                                        class={`p-3 rounded-xl border text-left font-medium text-sm transition flex items-center space-x-2 ${btnStyle}`}
                                                                    >
                                                                        <span class="font-bold w-5">{opt.letter}.</span>
                                                                        <span>{opt.text}</span>
                                                                    </button>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        {!submitted ? (
                                            <button 
                                                type="submit"
                                                class="w-full bg-amber-500 hover:bg-amber-600 text-white font-black py-4 rounded-2xl shadow-lg shadow-amber-200 text-lg transition"
                                            >
                                                確認提交挑戰題評估 🏆
                                            </button>
                                        ) : (
                                            <div class="bg-amber-50 border border-amber-200 p-4 rounded-2xl text-center space-y-2">
                                                <div class="font-bold text-amber-900 text-sm">已完成提交，評估已被系統鎖定！</div>
                                                {existingRes?.scoreDetails && (activeQuestion.challenge.scoresReleased || activeQuestion.challenge.releaseInstant) ? (
                                                    <div class="text-emerald-700 font-black text-xl">
                                                        得分：{existingRes.scoreDetails.totalScore} / {activeQuestion.challenge.totalScore} 分 (正確率: {existingRes.scoreDetails.percentage}%)
                                                    </div>
                                                ) : (
                                                    <div class="text-xs text-amber-700 italic">
                                                        待所有學生完成提交後，由教師按鍵一併發放成績...
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </form>
                                )}

                            </div>
                        ) : (
                            <div class="bg-white rounded-3xl p-12 text-center space-y-4 shadow-sm border">
                                <div class="text-6xl animate-bounce">☕</div>
                                <h2 class="text-xl font-bold text-slate-800">目前尚無進行中的題目</h2>
                                <p class="text-slate-400 text-sm">請耐心等候老師發佈互動問題...</p>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
