            }, [responses, studentId]);

            useEffect(() => {
                if (mySubmission) {
                    setIsSubmitted(true);
                } else {
                    setIsSubmitted(false);
                }
            }, [mySubmission, activeQuestion?.id]);

            // Challenge auto countdown timer for student (Requirement 13)
            useEffect(() => {
                if (activeQuestion?.mode === 'CHALLENGE' && activeQuestion.enableTimer && !isSubmitted) {
                    const elapsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                    const remaining = Math.max(0, activeQuestion.timeLimitSeconds - elapsed);
                    setChallengeRemainingSeconds(remaining);

                    const interval = setInterval(() => {
                        setChallengeRemainingSeconds((prev) => {
                            if (prev <= 1) {
                                clearInterval(interval);
                                // Auto submit challenge on 00:00 timeout
                                handleConfirmSubmitChallenge(true);
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);

                    return () => clearInterval(interval);
                }
            }, [activeQuestion, isSubmitted]);

            // Universal Firestore Submit Helper
            const submitResponseToFirestore = (resData) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', studentId);

                const payload = {
                    studentId,
                    seatNumber,
                    studentName: studentName || `${seatNumber}號`,
                    submitTime: new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                    submitTimestamp: Date.now(),
                    ...resData
                };

                window.fbUtils.setDoc(resDocRef, payload);
                setIsSubmitted(true);
                showToast('已提交答案! 讚賞你的努力!', 'success');
            };

            // Requirement 3: Dedicated Confirm Submit Button Actions
            const handleConfirmSubmitChoice = () => {
                if (!selectedChoice) {
                    showToast('請先選擇一個選項', 'error');
                    return;
                }
                submitResponseToFirestore({ answer: selectedChoice });
            };

            const handleConfirmSubmitShort = () => {
                if (!shortAnswerText.trim()) {
                    showToast('請輸入您的回答', 'error');
                    return;
                }
                submitResponseToFirestore({ answer: shortAnswerText.trim() });
            };

            const handleConfirmSubmitWhiteboard = (dataUrl) => {
                submitResponseToFirestore({ whiteboardImage: dataUrl });
            };

            const handleBuzzerClick = () => {
                audioSys.playSound('buzzer');
                submitResponseToFirestore({ answer: '搶答標記' });
            };

            // Requirement 5: Audio Recording Flow
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) {
                            audioChunksRef.current.push(e.data);
                        }
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            setAudioBlobUrl(reader.result);
                        };
                        reader.readAsDataURL(audioBlob);
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                } catch (err) {
                    console.error("Audio access error:", err);
                    showToast('無法開啟麥克風，請確認瀏覽器權限', 'error');
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const handleDeleteReRecord = () => {
                setAudioBlobUrl(null);
                audioChunksRef.current = [];
            };

            const handleConfirmSubmitAudio = () => {
                if (!audioBlobUrl) {
                    showToast('請先完成錄音', 'error');
                    return;
                }
                submitResponseToFirestore({ audioUrl: audioBlobUrl });
            };

            // Requirement 15 & 19: Challenge Submit & Auto-Grading
            const handleConfirmSubmitChallenge = (isAutoTimeout = false) => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;

                let score = 0;
                let correctCount = 0;
                const totalQ = activeQuestion.questions.length;
                const scorePerQ = Math.round(activeQuestion.totalScore / totalQ);

                activeQuestion.questions.forEach((q, idx) => {
                    const myAns = challengeStudentAnswers[idx + 1];
                    if (myAns === q.answer) {
                        score += scorePerQ;
                        correctCount++;
                    }
                });

                const accuracy = `${Math.round((correctCount / totalQ) * 100)}%`;
                const timeTakenSeconds = Math.floor((Date.now() - activeQuestion.startTime) / 1000);

                submitResponseToFirestore({
                    score,
                    accuracy,
                    correctCount,
                    totalQ,
                    answers: challengeStudentAnswers,
                    timeTakenSeconds,
                    isAutoTimeout
                });
            };

            // Find my assigned group in Cooperative Mode
            const myCoopGroup = useMemo(() => {
                if (!activeQuestion || activeQuestion.mode !== 'GROUP_COOP' || !activeQuestion.groups) return null;
                return activeQuestion.groups.find(g => g.members.some(m => m.id === studentId || m.seatNumber === seatNumber));
            }, [activeQuestion, studentId, seatNumber]);

            // Cooperative Mode Student Question Split (Requirement 22.3.4)
            const myCoopRole = useMemo(() => {
                if (!myCoopGroup) return 0;
                const idx = myCoopGroup.members.findIndex(m => m.id === studentId || m.seatNumber === seatNumber);
                return idx >= 0 ? idx % 3 : 0; // 0: Question text, 1: Options A/B, 2: Options C/D
            }, [myCoopGroup, studentId, seatNumber]);

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col font-sans">
                    {/* Header */}
                    <header className="bg-slate-900 text-white px-6 py-4 flex items-center justify-between shadow-lg">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center font-black text-white text-lg">
                                {seatNumber}
                            </div>
                            <div>
                                <h1 className="font-bold text-sm">{studentName || `${seatNumber}號學生`}</h1>
                                <span className="text-[10px] text-indigo-400 font-mono">房號: {roomCode}</span>
                            </div>
                        </div>
                        <button onClick={onExit} className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold">
                            退出
                        </button>
                    </header>

                    {/* Main Student Workspace */}
                    <main className="flex-1 max-w-3xl w-full mx-auto p-4 md:p-6 flex flex-col justify-center">
                        
                        {!activeQuestion ? (
                            <div className="bg-white rounded-3xl p-8 text-center space-y-4 shadow-sm border border-slate-200">
                                <div className="w-20 h-20 mx-auto bg-indigo-50 text-indigo-600 rounded-3xl flex items-center justify-center text-4xl animate-bounce">
                                    ⏳
                                </div>
                                <h2 className="text-xl font-black text-slate-800">等候老師指示...</h2>
                                <p className="text-xs text-slate-400">請保持螢幕開啟，題目即將發送至您的設備</p>
                            </div>
                        ) : (
                            <div className="bg-white rounded-3xl p-6 md:p-8 shadow-md border border-slate-200 space-y-6">
                                
                                {/* Question Title Bar */}
                                <div className="flex items-center justify-between border-b pb-3">
                                    <span className="bg-indigo-100 text-indigo-700 font-black text-xs px-3 py-1 rounded-full">
                                        {getModeLabel(activeQuestion.mode)}
                                    </span>

                                    {/* Challenge Timer Badge */}
                                    {activeQuestion.mode === 'CHALLENGE' && activeQuestion.enableTimer && (
                                        <span className="font-mono font-black text-xs bg-rose-100 text-rose-700 px-3 py-1 rounded-full">
                                            ⏱️ 限時倒數: {Math.floor(challengeRemainingSeconds / 60)}:{( '0' + challengeRemainingSeconds % 60).slice(-2)}
                                        </span>
                                    )}
                                </div>

                                <p className="text-base font-bold text-slate-800 leading-relaxed">
                                    {activeQuestion.prompt}
                                </p>

                                {/* Requirement 6: Unified Submission Feedback Overlay */}
                                {isSubmitted && activeQuestion.mode !== 'CHALLENGE' && (
                                    <div className="bg-emerald-50 border-2 border-emerald-300 p-6 rounded-3xl text-center space-y-3 animate-pulse">
                                        <div className="text-4xl">🎉</div>
                                        <h3 className="font-black text-emerald-800 text-lg">
                                            已提交答案! 讚賞你的努力!
                                        </h3>
                                        <p className="text-xs text-emerald-600 font-bold">安靜等候老師指示...</p>
                                    </div>
                                )}

                                {/* CHOICE / TF Student Answer View */}
                                {['CHOICE', 'TF'].includes(activeQuestion.mode) && !isSubmitted && (
                                    <div className="space-y-4">
                                        <div className="grid grid-cols-2 gap-3">
                                            {Array.from({ length: activeQuestion.choiceCount || 2 }).map((_, idx) => {
                                                const letter = activeQuestion.mode === 'TF' ? (idx === 0 ? 'T' : 'F') : String.fromCharCode(65 + idx);
                                                const label = activeQuestion.mode === 'TF' ? (idx === 0 ? '⭕ 正確' : '❌ 錯誤') : `選項 ${letter}`;

                                                return (
                                                    <button 
                                                        key={idx}
                                                        onClick={() => setSelectedChoice(letter)}
                                                        className={`p-5 rounded-2xl font-black text-base transition border-2 ${selectedChoice === letter ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg scale-102' : 'bg-slate-50 border-slate-200 hover:bg-slate-100 text-slate-800'}`}
                                                    >
                                                        {label}
                                                    </button>
                                                );
                                            })}
                                        </div>

                                        {/* Requirement 3: Confirm Submit Button */}
                                        <button 
                                            onClick={handleConfirmSubmitChoice}
                                            className="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-2xl text-base shadow-lg transition active:scale-98"
                                        >
                                            ✅ 確認提交答案
                                        </button>
                                    </div>
                                )}

                                {/* SHORT Student Answer View */}
                                {activeQuestion.mode === 'SHORT' && !isSubmitted && (
                                    <div className="space-y-4">
                                        <textarea 
                                            rows={3}
                                            value={shortAnswerText}
                                            onChange={(e) => setShortAnswerText(e.target.value)}
                                            placeholder="請在此輸入您的作答內容..."
                                            className="w-full p-4 rounded-2xl border-2 border-slate-200 font-medium text-sm focus:ring-2 focus:ring-indigo-500"
                                        />
                                        <button 
                                            onClick={handleConfirmSubmitShort}
                                            className="w-full py-4 bg-emerald-600 text-white font-black rounded-2xl text-base shadow-lg transition"
                                        >
                                            ✅ 確認提交短答
                                        </button>
                                    </div>
                                )}

                                {/* DRAW Student Answer View (Requirement 1) */}
                                {activeQuestion.mode === 'DRAW' && !isSubmitted && (
                                    <WhiteboardCanvas 
                                        bgImage={activeQuestion.bgImage || activeQuestion.broadcastData}
                                        onConfirmSubmit={handleConfirmSubmitWhiteboard}
                                    />
                                )}

                                {/* Requirement 18: BUZZER Student Answer View */}
                                {activeQuestion.mode === 'BUZZER' && !isSubmitted && (
                                    <button 
                                        onClick={handleBuzzerClick}
                                        className="w-full py-16 bg-gradient-to-r from-amber-500 to-rose-500 text-white font-black text-3xl rounded-3xl shadow-2xl transition active:scale-95 border-4 border-amber-300 animate-pulse"
                                    >
                                        ⚡ 搶答！按此！
                                    </button>
                                )}

                                {/* Requirement 5: AUDIO Recording Student Answer View */}
                                {activeQuestion.mode === 'AUDIO' && !isSubmitted && (
                                    <div className="space-y-5 text-center bg-slate-50 p-6 rounded-3xl border">
                                        {!audioBlobUrl ? (
                                            <div className="space-y-4">
                                                {isRecording ? (
                                                    <button 
                                                        onClick={stopRecording}
                                                        className="w-full py-4 bg-rose-600 text-white font-black rounded-2xl text-lg shadow-lg animate-pulse"
                                                    >
                                                        ⏹️ 停止錄音
                                                    </button>
                                                ) : (
                                                    <button 
                                                        onClick={startRecording}
                                                        className="w-full py-4 bg-indigo-600 text-white font-black rounded-2xl text-lg shadow-lg"
                                                    >
                                                        🎙️ 開始錄音
                                                    </button>
                                                )}
                                            </div>
                                        ) : (
                                            <div className="space-y-4">
                                                <audio controls src={audioBlobUrl} className="w-full" />
                                                <div className="flex space-x-2">
                                                    <button 
                                                        onClick={handleDeleteReRecord}
                                                        className="w-1/2 py-3 bg-slate-200 text-slate-700 font-bold rounded-xl text-xs"
                                                    >
                                                        🗑️ 刪除重錄
                                                    </button>
                                                    <button 
                                                        onClick={handleConfirmSubmitAudio}
                                                        className="w-1/2 py-3 bg-emerald-600 text-white font-black rounded-xl text-xs shadow-md"
                                                    >
                                                        ✅ 確認提交錄音
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Requirement 4: LINK Pushed Content View */}
                                {activeQuestion.mode === 'LINK' && activeQuestion.pushedUrl && (
                                    <div className="space-y-4 text-center">
                                        {extractYouTubeEmbed(activeQuestion.pushedUrl) ? (
                                            <div className="aspect-16-9 w-full rounded-2xl overflow-hidden shadow-inner border border-slate-200">
                                                <iframe 
                                                    src={extractYouTubeEmbed(activeQuestion.pushedUrl)}
                                                    className="w-full h-full"
                                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                                    allowFullScreen
                                                />
                                            </div>
                                        ) : (
                                            <div className="p-6 bg-slate-50 rounded-2xl border text-xs font-mono break-all text-slate-600">
                                                {activeQuestion.pushedUrl}
                                            </div>
                                        )}

                                        <a 
                                            href={activeQuestion.pushedUrl}
                                            target="_blank"
                                            rel="noreferrer"
                                            className="inline-block px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm rounded-2xl shadow-md transition"
                                        >
                                            開啟連結網站 ↗
                                        </a>
                                    </div>
                                )}

                                {/* Requirement 15 & 19: CHALLENGE Mode Student Assessment */}
                                {activeQuestion.mode === 'CHALLENGE' && (
                                    <div className="space-y-6">
                                        {!isSubmitted ? (
                                            <div className="space-y-6">
                                                {activeQuestion.questions.map((q, qIdx) => (
                                                    <div key={qIdx} className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                                                        <h4 className="font-bold text-sm text-slate-800">
                                                            {qIdx + 1}. {q.text}
                                                        </h4>
                                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                            {q.options.map(opt => (
                                                                <button 
                                                                    key={opt.letter}
                                                                    onClick={() => setChallengeStudentAnswers({ ...challengeStudentAnswers, [qIdx + 1]: opt.letter })}
                                                                    className={`p-3 rounded-xl font-bold text-xs text-left transition border ${challengeStudentAnswers[qIdx + 1] === opt.letter ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-700 border-slate-200'}`}
                                                                >
                                                                    {opt.letter}. {opt.text}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}

                                                <button 
                                                    onClick={() => handleConfirmSubmitChallenge(false)}
                                                    className="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-2xl text-base shadow-lg transition"
                                                >
                                                    ✅ 確認提交整份評估
                                                </button>
                                            </div>
                                        ) : (
                                            /* Requirement 19: Unlocked Full Review after Score Release */
                                            <div className="space-y-5">
                                                <div className="bg-emerald-50 p-5 rounded-2xl border border-emerald-200 text-center space-y-1">
                                                    <h3 className="font-black text-emerald-900 text-lg">考卷已成功提交！</h3>
                                                    {activeQuestion.scoresReleased ? (
                                                        <div className="text-2xl font-black text-emerald-600">
                                                            得分: {mySubmission?.score}分 ({mySubmission?.accuracy})
                                                        </div>
                                                    ) : (
                                                        <p className="text-xs text-slate-500 font-bold">待老師點選發放後顯示分數與解析...</p>
                                                    )}
                                                </div>

                                                {/* Detailed Review Breakdown */}
                                                {activeQuestion.scoresReleased && (
                                                    <div className="space-y-4">
                                                        <h4 className="font-black text-xs text-slate-600 uppercase tracking-wider">答題解析明細:</h4>
                                                        {activeQuestion.questions.map((q, qIdx) => {
                                                            const studentChoice = mySubmission?.answers?.[qIdx + 1];
                                                            const isCorrect = studentChoice === q.answer;

                                                            return (
                                                                <div key={qIdx} className="bg-slate-50 p-4 rounded-2xl border space-y-2 text-xs font-bold">
                                                                    <div className="flex justify-between items-center">
                                                                        <span>{qIdx + 1}. {q.text}</span>
                                                                        <span className={isCorrect ? 'text-emerald-600' : 'text-rose-600'}>
                                                                            {isCorrect ? '✅ 答對' : '❌ 答錯'}
                                                                        </span>
                                                                    </div>
                                                                    <div className="grid grid-cols-2 gap-1.5 pt-1">
                                                                        {q.options.map(opt => {
                                                                            let optBg = 'bg-white text-slate-600 border-slate-200';
                                                                            if (opt.letter === q.answer) {
                                                                                optBg = 'bg-emerald-100 text-emerald-900 border-emerald-400 font-black';
                                                                            } else if (opt.letter === studentChoice && !isCorrect) {
                                                                                optBg = 'bg-rose-100 text-rose-900 border-rose-400 font-black';
                                                                            }

                                                                            return (
                                                                                <div key={opt.letter} className={`p-2 rounded-xl border ${optBg}`}>
                                                                                    {opt.letter}. {opt.text}
                                                                                </div>
                                                                            );
                                                                        })}
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Requirement 22.3.4: Cooperative Quiz Student Group Split View */}
                                {activeQuestion.mode === 'GROUP_COOP' && (
                                    <div className="space-y-5">
                                        {myCoopGroup ? (
                                            <div className={`${myCoopGroup.bgLight} ${myCoopGroup.border} border-2 p-5 rounded-3xl text-center space-y-3`}>
                                                <div className="text-4xl">{myCoopGroup.emoji}</div>
                                                <h3 className={`font-black text-xl ${myCoopGroup.text}`}>{myCoopGroup.name}</h3>
                                                <p className="text-xs text-slate-600 font-bold">
                                                    盡快與你的組員會合! 互相合作完成題目！
                                                </p>
                                                
                                                {/* Assigned split view */}
                                                {activeQuestion.coopStage === 'RACE' && (
                                                    <div className="bg-white p-4 rounded-2xl border text-left space-y-2">
                                                        <span className="text-xs font-bold text-indigo-600 block">您的合作分工任務:</span>
                                                        {myCoopRole === 0 && (
                                                            <div className="p-3 bg-indigo-50 rounded-xl font-black text-slate-800 text-sm">
                                                                📖 您負責讀出題目內文給組員！
                                                            </div>
                                                        )}
                                                        {myCoopRole === 1 && (
                                                            <div className="p-3 bg-emerald-50 rounded-xl font-black text-emerald-800 text-sm">
                                                                選項 A 及 選項 B 顯示在您的螢幕上！
                                                            </div>
                                                        )}
                                                        {myCoopRole === 2 && (
                                                            <div className="p-3 bg-amber-50 rounded-xl font-black text-amber-800 text-sm">
                                                                選項 C 及 選項 D 顯示在您的螢幕上！
                                                            </div>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        ) : (
                                            <div className="text-center text-xs font-bold text-slate-400 py-6">
                                                正在分配合作組別中...
                                            </div>
                                        )}
                                    </div>
                                )}

                            </div>
                        )}
                    </main>
                </div>
            );
        }

        // Render main React App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
