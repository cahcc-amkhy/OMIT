        // Web Audio API Sound Generator
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    if (window.confetti) {
                        window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                    }
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                    });
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.error("Audio play error:", e);
            }
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) throw new Error("JSZip not loaded");
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>${paragraphsXml}</w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];
            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) questions.push(currentQ);
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }

                    currentQ.options.push({ letter, text: optText });
                    if (isCorrect) currentQ.answer = letter;
                }
            });

            if (currentQ && currentQ.options.length > 0) questions.push(currentQ);

            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1,
                            text: "以下哪一項不是地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "機械資源" }
                            ],
                            answer: "D"
                        },
                        {
                            num: 2,
                            text: "芝士的原料屬於哪一項地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "礦產資源" }
                            ],
                            answer: "C"
                        }
                    ]
                };
            }

            return { title, totalScore, questions };
        };

        const WhiteboardCanvas = ({ initialData, onSave, isReadOnly = false, bgImage = null, heightClass = "h-[450px]" }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [tool, setTool] = useState('pen'); // 'pen' | 'eraser'
            const [lineWidth, setLineWidth] = useState(6); // 2px to 18px
            const [bgImgObj, setBgImgObj] = useState(null);

            // Load Background Image
            useEffect(() => {
                if (bgImage) {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = () => {
                        setBgImgObj(img);
                    };
                    img.src = bgImage;
                } else {
                    setBgImgObj(null);
                }
            }, [bgImage]);

            // Draw Initial Data / Background
            const redraw = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, 1280, 720);

                if (bgImgObj) {
                    ctx.drawImage(bgImgObj, 0, 0, 1280, 720);
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, 1280, 720);
                }

                if (initialData) {
                    const savedImg = new Image();
                    savedImg.onload = () => {
                        ctx.drawImage(savedImg, 0, 0, 1280, 720);
                    };
                    savedImg.src = initialData;
                }
            };

            useEffect(() => {
                redraw();
            }, [bgImgObj]);

            // Ratio mapping formula (scaleX / scaleY) for 1280x720 internal resolution
            const getCanvasCoords = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = 1280 / rect.width;
                const scaleY = 720 / rect.height;

                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                if (isReadOnly) return;
                e.preventDefault();
                setIsDrawing(true);
                const coords = getCanvasCoords(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(coords.x, coords.y);
            };

            const draw = (e) => {
                if (!isDrawing || isReadOnly) return;
                e.preventDefault();
                const coords = getCanvasCoords(e);
                const ctx = canvasRef.current.getContext('2d');
                
                ctx.lineWidth = lineWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (tool === 'eraser') {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = lineWidth * 3;
                } else {
                    ctx.strokeStyle = '#1e293b';
                }

                ctx.lineTo(coords.x, coords.y);
                ctx.stroke();
            };

            const stopDrawing = (e) => {
                if (!isDrawing) return;
                setIsDrawing(false);
                if (onSave) {
                    onSave(canvasRef.current.toDataURL('image/png'));
                }
            };

            const handleClear = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, 1280, 720);
                if (bgImgObj) {
                    ctx.drawImage(bgImgObj, 0, 0, 1280, 720);
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, 1280, 720);
                }
                if (onSave) onSave(canvas.toDataURL('image/png'));
            };

            const handleBgUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const img = new Image();
                    img.onload = () => {
                        setBgImgObj(img);
                    };
                    img.src = evt.target.result;
                };
                reader.readAsDataURL(file);
            };

            return (
                <div class="flex flex-col items-center w-full space-y-3">
                    {!isReadOnly && (
                        <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-800 text-white p-2.5 rounded-2xl w-full shadow-md text-sm">
                            <div class="flex items-center space-x-2">
                                <button
                                    type="button"
                                    onClick={() => setTool('pen')}
                                    class={`px-3 py-1.5 rounded-xl font-bold flex items-center space-x-1 ${tool === 'pen' ? 'bg-indigo-600 text-white shadow' : 'bg-slate-700 text-slate-300'}`}
                                >
                                    <span>✏️ 畫筆</span>
                                </button>
                                <button
                                    type="button"
                                    onClick={() => setTool('eraser')}
                                    class={`px-3 py-1.5 rounded-xl font-bold flex items-center space-x-1 ${tool === 'eraser' ? 'bg-indigo-600 text-white shadow' : 'bg-slate-700 text-slate-300'}`}
                                >
                                    <span>🧽 擦膠</span>
                                </button>
                                <button
                                    type="button"
                                    onClick={handleClear}
                                    class="px-3 py-1.5 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold flex items-center space-x-1"
                                >
                                    <span>🗑️ 清空</span>
                                </button>
                            </div>

                            <div class="flex items-center space-x-3">
                                <span class="text-xs text-slate-300">粗幼 ({lineWidth}px):</span>
                                <input
                                    type="range"
                                    min="2"
                                    max="18"
                                    value={lineWidth}
                                    onChange={(e) => setLineWidth(parseInt(e.target.value))}
                                    class="w-24 accent-indigo-400"
                                />

                                <label class="cursor-pointer bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center space-x-1">
                                    <span>🖼️ 背景圖片</span>
                                    <input type="file" accept="image/*" onChange={handleBgUpload} class="hidden" />
                                </label>
                            </div>
                        </div>
                    )}

                    <div class={`relative w-full ${heightClass} bg-white rounded-2xl overflow-hidden border-2 border-slate-300 shadow-inner canvas-container`}>
                        <canvas
                            ref={canvasRef}
                            width={1280}
                            height={720}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            class="w-full h-full object-contain cursor-crosshair touch-none"
                        />
                    </div>
                </div>
            );
        };

        function OMITApp() {
            const [role, setRole] = useState('LANDING'); // 'LANDING', 'TEACHER', 'STUDENT'
            const [roomCode, setRoomCode] = useState('');
            const [seatNumber, setSeatNumber] = useState('1');
            const [studentName, setStudentName] = useState('');
            const [teacherPassword, setTeacherPassword] = useState('');
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [toast, setToast] = useState(null);

            const [activeQuestion, setActiveQuestion] = useState(null);
            const [studentsList, setStudentsList] = useState([]);
            const [responses, setResponses] = useState({});
            const [historyQuestions, setHistoryQuestions] = useState([]);
            const [teacherWhiteboardData, setTeacherWhiteboardData] = useState(null);
            const [coopState, setCoopState] = useState(null);
            const [isAuthReady, setIsAuthReady] = useState(false);

            const myStudentId = useRef('std_' + Math.random().toString(36).substring(2, 9));

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            // Initialize Anonymous Auth
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (window.fbUtils && window.fbAuth) {
                            await window.fbUtils.signInAnonymously(window.fbAuth);
                            setIsAuthReady(true);
                        }
                    } catch (err) {
                        console.error("Firebase auth failed:", err);
                    }
                };
                initAuth();
            }, []);

            // Check URL query for Room Code
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const roomParam = params.get('room');
                if (roomParam) {
                    setRoomCode(roomParam.toUpperCase());
                }
            }, []);

            // Firebase Firestore Sync for Room Data
            useEffect(() => {
                if (!roomCode || !isAuthReady) return;

                const appId = "omit-8c173";
                const db = window.fbDb;
                const { doc, onSnapshot, collection } = window.fbUtils;

                const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                const studentsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                const responsesColRef = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');

                const unsubRoom = onSnapshot(roomDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setActiveQuestion(data.activeQuestion || null);
                        if (data.history) setHistoryQuestions(data.history);
                        if (data.teacherWhiteboard !== undefined) setTeacherWhiteboardData(data.teacherWhiteboard);
                        if (data.coopState) setCoopState(data.coopState);
                    }
                }, (err) => console.error("Room sub error:", err));

            // Handle Teacher Access

                        {showPasswordModal && (

                                    <h3 class="text-lg font-bold text-slate-800 text-center">請輸入教師密碼</h3>
                                    <form onSubmit={verifyTeacherPassword} class="space-y-4">
                                        <input 
                                            type="password"

                                            autoFocus

            if (role === 'TEACHER') {
                return (
                    <TeacherDashboard 
                        roomCode={roomCode} 
                        activeQuestion={activeQuestion} 
                        setActiveQuestion={setActiveQuestion}

                        setResponses={setResponses}
                        studentsList={studentsList}
                        historyQuestions={historyQuestions}
                        setHistoryQuestions={setHistoryQuestions}
                        teacherWhiteboardData={teacherWhiteboardData}
                        coopState={coopState}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            if (role === 'STUDENT') {
                return (
                    <StudentInterface 
                        roomCode={roomCode}
                        studentName={studentName}
                        seatNumber={seatNumber}
                        studentId={myStudentId.current}
                        activeQuestion={activeQuestion}
                        responses={responses}
                        teacherWhiteboardData={teacherWhiteboardData}
                        coopState={coopState}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}

            return null;
        }

        function TeacherDashboard({ roomCode, activeQuestion, setActiveQuestion, responses, setResponses, studentsList, historyQuestions, setHistoryQuestions, teacherWhiteboardData, coopState, showToast, onExit }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE');
            const [questionText, setQuestionText] = useState('');
            const [choiceCount, setChoiceCount] = useState(4);
            const [whiteboardBg, setWhiteboardBg] = useState(null);
            const [pushedUrl, setPushedUrl] = useState('');

            // Modals & Tools
            const [showQRModal, setShowQRModal] = useState(false);
            const [showStudentListModal, setShowStudentListModal] = useState(false);
            const [showInspectModal, setShowInspectModal] = useState(null);
            const [inspectStudentIndex, setInspectStudentIndex] = useState(0);
            const [broadcastedStudentWork, setBroadcastedStudentWork] = useState(null);
            const [barChoiceFilter, setBarChoiceFilter] = useState(null);

            // Teacher Demo Whiteboard State
            const [showDemoWhiteboard, setShowDemoWhiteboard] = useState(false);
            const [isBroadcastingDemoBoard, setIsBroadcastingDemoBoard] = useState(false);
            const [demoWhiteboardCanvasData, setDemoWhiteboardCanvasData] = useState(null);

            // Random Selector State
            const [showRandomModal, setShowRandomModal] = useState(false);
            const [rangeStart, setRangeStart] = useState(1);
            const [rangeEnd, setRangeEnd] = useState(36);
            const [drawnNumbers, setDrawnNumbers] = useState([]);
            const [currentDrawn, setCurrentDrawn] = useState(null);
            const [isSpinning, setIsSpinning] = useState(false);

            // Timer Modal State
            const [showTimerModal, setShowTimerModal] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerActive, setTimerActive] = useState(false);
            const [timerZoomed, setTimerZoomed] = useState(false);
            const [customTimerMin, setCustomTimerMin] = useState('01');
            const [customTimerSec, setCustomTimerSec] = useState('00');

            // Challenge Question Setup States
            const [challengeData, setChallengeData] = useState(null);
            const [challengeEnableTimer, setChallengeEnableTimer] = useState(true);
            const [challengeTimeLimit, setChallengeTimeLimit] = useState(120);
            const [challengeTimerMin, setChallengeTimerMin] = useState('02');
            const [challengeTimerSec, setChallengeTimerSec] = useState('00');
            const [challengeReleaseInstant, setChallengeReleaseInstant] = useState(false);
            const [showChallengeScoresOnLeaderboard, setShowChallengeScoresOnLeaderboard] = useState(true);
            const [docxFileName, setDocxFileName] = useState('');

            // Cooperative Questions States
            const [coopData, setCoopData] = useState(null);
            const [coopStage, setCoopStage] = useState('PREP'); // 'PREP', 'GROUP', 'RACE'
            const [coopGroups, setCoopGroups] = useState([]);
            const [coopMuted, setCoopMuted] = useState(false);

            const coopAudioRef = useRef(null);

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

            // Filter current responses for active question
            const currentQuestionResponsesList = useMemo(() => {
                if (!activeQuestion) return [];
                const list = [];
                Object.values(responses).forEach(r => {
                    if (r.questionId === activeQuestion.id) {
                        list.push(r);
                    }
                });
                // Sort by submission timestamp ascending
                return list.sort((a, b) => (a.submitTimestamp || 0) - (b.submitTimestamp || 0));
            }, [responses, activeQuestion]);

            // Timer Interval Logic
            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(s => {
                            if (s <= 1) {
                                setTimerActive(false);
                                playSound('alarm');
                                return 0;
                            }
                            return s - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            // Sync Question & Room State to Firestore
            const publishRoomData = async (payload) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { ...payload, updatedAt: Date.now() }, { merge: true });
            };

            // Retract Question ("收回題目")
            const handleRetractQuestion = async () => {
                await publishRoomData({ activeQuestion: null });
                showToast("已收回題目，全班恢復待機狀態", "info");
            };

            // Exit Room Cleanup
            const handleExitRoom = async () => {
                if (window.confirm("確定退出課室？將會同步清空此課室於 Firebase 的所有暫存紀錄！")) {
                    try {
                        const appId = "omit-8c173";
                        const db = window.fbDb;
                        
                        const responsesColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');
                        const resSnaps = await window.fbUtils.getDocs(responsesColRef);
                        resSnaps.forEach(async (d) => {
                            await window.fbUtils.deleteDoc(d.ref);
                        });

                        const studentsColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                        const stuSnaps = await window.fbUtils.getDocs(studentsColRef);
                        stuSnaps.forEach(async (d) => {
                            await window.fbUtils.deleteDoc(d.ref);
                        });

                        const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                        await window.fbUtils.deleteDoc(roomDocRef);

                        showToast("課室暫存資料已完全清空！", "info");
                    } catch (e) {
                        console.error("Cleanup error:", e);
                    }
                    onExit();
                }
            };

            const handleToggleBroadcastDemoBoard = async (broadcastState) => {
                setIsBroadcastingDemoBoard(broadcastState);
                if (broadcastState) {
                    await publishRoomData({ teacherWhiteboard: demoWhiteboardCanvasData });
                    showToast("已向全班廣播教師白板示範！", "success");
                } else {
                    await publishRoomData({ teacherWhiteboard: null });
                    showToast("已收回教師白板廣播", "info");
                }
            };

            const handleStudentWorkBroadcast = async (work) => {
                setBroadcastedStudentWork(work);
                await publishRoomData({
                    activeQuestion: {
                        ...activeQuestion,
                        broadcastedWork: work
                    }
                });
                showToast(`已向全班廣播 ${work.seatNumber}號 (${work.name}) 的作品！`, "success");
            };

            const handleCancelStudentWorkBroadcast = async () => {
                setBroadcastedStudentWork(null);
                await publishRoomData({
                    activeQuestion: {
                        ...activeQuestion,
                        broadcastedWork: null
                    }
                });
                showToast("已取消作品廣播", "info");
            };

            const handleDownloadChallengeTemplate = async () => {
                const sampleLines = [
                    "標題：地球生病了",
                    "總分: 100分",
                    "1.以下哪一項不是地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源",
                    "D. 機械資源*",
                    "",
                    "2.芝士的原料屬於哪一項地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源*",
                    "D. 礦產資源",
                    "",
                    "3.人們不當使用水資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應*",
                    "",
                    "4.人們不當使用煤和石油資源會造成甚麼後果?",
                    "A. 引發極端天氣*",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應",
                    "",
                    "5.人們不當使用土地資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災*",
                    "C. 產生大量二氧化碳",
                    "D. 影響食水供應"
                ];

                try {
                    const blob = await createWordDocxBlob(sampleLines);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = '下載評估範本Word檔.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast("已成功下載評估範本Word檔 (.docx)！", "success");
                } catch (err) {
                    console.error("Docx generation error:", err);
                    showToast("無法生成 Word 範本檔，請重試", "error");
                }
            };

            const handleWordFileUpload = (e, isCoop = false) => {
                const file = e.target.files[0];
                if (!file) return;

                setDocxFileName(file.name);
                const reader = new FileReader();

                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const arrayBuffer = evt.target.result;
                            const result = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                            parsedData = parseWordChallengeText(result.value);
                        } else {
                            const text = evt.target.result;
                            parsedData = parseWordChallengeText(text);
                        }

                        if (isCoop) {
                            setCoopData(parsedData);
                        } else {
                            setChallengeData(parsedData);
                        }
                        showToast(`已成功解析範本！共 ${parsedData.questions.length} 題`, 'success');
                    } catch (err) {
                        console.error("Word file parse error:", err);
                        showToast("文件解析失敗，請確認格式！", "error");
                    }
                };

                if (file.name.endsWith('.docx')) {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file, "UTF-8");
                }
            };

            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                
                let challengeContent = null;
                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請先上載並解析 Word 評估範本檔案！", "error");
                        return;
                    }
                    const computedSecs = (parseInt(challengeTimerMin) || 0) * 60 + (parseInt(challengeTimerSec) || 0);
                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? (computedSecs > 0 ? computedSecs : 120) : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                    startTime: Date.now(),
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);

                publishRoomData({ activeQuestion: newQ, history: updatedHistory, coopState: null });
                showToast(`已成功發佈【${getModeLabel(selectedMode)}】給所有學生！`, 'success');
            };

            // Teacher release challenge scores
            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await publishRoomData({ activeQuestion: updatedQ });
                showToast("已成功向全班一併發放挑戰題成績！", "success");
            };

            const handleCoopGroupStudents = async () => {
                if (!coopData || !coopData.questions || coopData.questions.length === 0) {
                    showToast("請先上載並編輯合作題評估內容！", "error");
                    return;
                }

                const students = [...studentsList];
                if (students.length < 3) {
                    showToast("全班目前人數少於 3 人，最少需要 3 人才能分組！", "error");
                    return;
                }

                // Shuffle students
                const shuffled = [...students].sort(() => Math.random() - 0.5);
                const numStudents = shuffled.length;

                // Group into 3-4 per group
                let numGroups = Math.floor(numStudents / 3);
                if (numGroups > ANIMAL_TEAMS.length) numGroups = ANIMAL_TEAMS.length;

                // Randomly select team styles
                const selectedTeamStyles = [...ANIMAL_TEAMS].sort(() => Math.random() - 0.5).slice(0, numGroups);

                const groups = selectedTeamStyles.map(style => ({
                    id: 'group_' + Math.random().toString(36).substring(2, 7),
                    name: style.name,
                    emoji: style.emoji,
                    color: style.color,
                    members: [],
                    currentQuestionIndex: 0,
                    finished: false
                }));

                // Distribute students evenly
                shuffled.forEach((student, idx) => {
                    const targetGroup = groups[idx % numGroups];
                    targetGroup.members.push(student);
                });

                setCoopGroups(groups);
                setCoopStage('GROUP');

                const newCoopState = {
                    stage: 'GROUP',
                    title: coopData.title,
                    questions: coopData.questions,
                    groups: groups,
                    winnerGroup: null
                };

                await publishRoomData({
                    activeQuestion: {
                        id: 'coop_' + Date.now(),
                        mode: 'COOP',
                        text: `🤝 合作題：${coopData.title}`
                    },
                    coopState: newCoopState
                });

                showToast("已將學生隨機平均分組並派發分組資訊！", "success");
            };

            const handleStartCoopRace = async () => {
                setCoopStage('RACE');
                const updatedCoopState = {
                    ...coopState,
                    stage: 'RACE'
                };
                await publishRoomData({ coopState: updatedCoopState });
                playSound('spin');
                showToast("合作題比賽正式開始！組員需互相合作作答！", "success");
            };

            const handleExportChallengeCSV = () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE' || !activeQuestion.challenge) {
                    showToast("當前無發佈的挑戰題資料可供匯出！", "error");
                    return;
                }

                const questions = activeQuestion.challenge.questions || [];
                const headers = ["學號", "姓名", "總分", "正確率", "作答用時(秒)"];
                questions.forEach((q, idx) => {
                    headers.push(`第${idx+1}題答案`);
                });

                const csvRows = [headers.join(",")];

                studentsList.forEach(student => {
                    const res = responses[student.id] || {};
                    const answers = res.answers || {};
                    let correctCount = 0;

                    questions.forEach(q => {
                        if (answers[q.num] === q.answer) correctCount++;
                    });

                    const totalQs = questions.length;
                    const accuracy = totalQs > 0 ? ((correctCount / totalQs) * 100).toFixed(1) + "%" : "0%";
                    const score = res.score !== undefined ? res.score : 0;
                    const timeUsed = res.submitTimestamp && activeQuestion.startTime ? Math.round((res.submitTimestamp - activeQuestion.startTime) / 1000) : "未提交";

                    const row = [
                        `"${student.seatNumber}"`,
                        `"${student.name}"`,
                        `"${score}"`,
                        `"${accuracy}"`,
                        `"${timeUsed}"`
                    ];

                    questions.forEach(q => {
                        row.push(`"${answers[q.num] || '未作答'}"`);
                    });

                    csvRows.push(row.join(","));
                });

                const csvContent = "\uFEFF" + csvRows.join("\n");
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `挑戰題成績表_${activeQuestion.challenge.title || '評估'}_${new Date().toLocaleDateString('zh-HK')}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("已成功匯出挑戰題 CSV 成績試算表！", "success");
            };

            const handleDrawRandomStudent = () => {
                if (isSpinning) return;
                
                const min = Math.min(rangeStart, rangeEnd);
                const max = Math.max(rangeStart, rangeEnd);
                
                const available = [];
                for (let i = min; i <= max; i++) {
                    if (!drawnNumbers.includes(i)) available.push(i);
                }

                if (available.length === 0) {
                    showToast("此範圍內的所有學號均已抽取完畢！已為您自動重置抽籤盤", "info");
                    setDrawnNumbers([]);
                    return;
                }

                setIsSpinning(true);
                let counter = 0;
                const spinInterval = setInterval(() => {
                    const temp = available[Math.floor(Math.random() * available.length)];
                    setCurrentDrawn(temp);
                    playSound('spin');
                    counter++;
                    if (counter > 20) {
                        clearInterval(spinInterval);
                        const finalPicked = available[Math.floor(Math.random() * available.length)];
                        setCurrentDrawn(finalPicked);
                        setDrawnNumbers(prev => [...prev, finalPicked]);
                        setIsSpinning(false);
                        playSound('win');
                    }
                }, 80);
            };
