    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const ANIMAL_TEAMS = [
            { name: "老虎組", emoji: "🐯", color: "bg-amber-500 text-white border-amber-600", hex: "#f59e0b" },
            { name: "大象組", emoji: "🐘", color: "bg-sky-500 text-white border-sky-600", hex: "#0284c7" },
            { name: "企鵝組", emoji: "🐧", color: "bg-slate-700 text-white border-slate-800", hex: "#334155" },
            { name: "藍鯨組", emoji: "🐋", color: "bg-blue-600 text-white border-blue-700", hex: "#2563eb" },
            { name: "白兔組", emoji: "🐰", color: "bg-pink-500 text-white border-pink-600", hex: "#ec4899" },
            { name: "熊貓組", emoji: "🐼", color: "bg-emerald-600 text-white border-emerald-700", hex: "#059669" },
            { name: "獅子組", emoji: "🦁", color: "bg-orange-500 text-white border-orange-600", hex: "#f97316" },
            { name: "白羊組", emoji: "🐑", color: "bg-indigo-500 text-white border-indigo-600", hex: "#6366f1" },
            { name: "水牛組", emoji: "🐃", color: "bg-teal-600 text-white border-teal-700", hex: "#0d9488" },
            { name: "斑馬組", emoji: "🦓", color: "bg-purple-600 text-white border-purple-700", hex: "#9333ea" }
        ];

        function getModeLabel(mode) {
            switch(mode) {
                case 'CHOICE': return '選擇題';
                case 'TF': return '是非題';
                case 'SHORT': return '短答題';
                case 'DRAW': return '白板題';
                case 'BUZZER': return '搶答題';
                case 'AUDIO': return '錄音題';
                case 'CHALLENGE': return '挑戰題';
                case 'LINK': return '派送連結';
                case 'COLLAB': return '合作題';
                default: return '題目';
            }
        }

        function getDefaultQuestionPrompt(mode) {
            switch(mode) {
                case 'CHOICE': return '請選擇正確答案：';
                case 'TF': return '請判斷下列描述是否正確：';
                case 'SHORT': return '請輸入您的回答：';
                case 'DRAW': return '請在白板上作答或繪圖：';
                case 'BUZZER': return '請準備點擊搶答按鈕！';
                case 'AUDIO': return '請錄製語音回答：';
                case 'CHALLENGE': return '請在限時內完成以下挑戰題評估：';
                case 'LINK': return '請點擊或觀看下方派送內容：';
                case 'COLLAB': return '合作題競賽：請團隊合作解答！';
                default: return '請回答問題：';
            }
        }

        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.35);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.35);
                    });
                    if (window.confetti) {
                        window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    }
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (
                <div class={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-2 text-sm font-bold animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) throw new Error("JSZip library is not loaded.");
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>${paragraphsXml}</w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];
            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) {
                        questions.push(currentQ);
                    }
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    let isCorrect = false;

                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }

                    currentQ.options.push({ letter: letter, text: optText });
                    if (isCorrect) currentQ.answer = letter;
                }
            });

            if (currentQ && currentQ.options.length > 0) questions.push(currentQ);

            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        { num: 1, text: "以下哪一項不是地球的天然資源?", options: [{ letter: "A", text: "水資源" }, { letter: "B", text: "植物資源" }, { letter: "C", text: "動物資源" }, { letter: "D", text: "機械資源" }], answer: "D" },
                        { num: 2, text: "芝士的原料屬於哪一項地球的天然資源?", options: [{ letter: "A", text: "水資源" }, { letter: "B", text: "植物資源" }, { letter: "C", text: "動物資源" }, { letter: "D", text: "礦產資源" }], answer: "C" },
                        { num: 3, text: "人們不當使用水資源會造成甚麼後果?", options: [{ letter: "A", text: "引發極端天氣" }, { letter: "B", text: "引發水災" }, { letter: "C", text: "水土流失" }, { letter: "D", text: "影響食水供應" }], answer: "D" },
                        { num: 4, text: "人們不當使用煤和石油資源會造成甚麼後果?", options: [{ letter: "A", text: "引發極端天氣" }, { letter: "B", text: "引發水災" }, { letter: "C", text: "水土流失" }, { letter: "D", text: "影響食水供應" }], answer: "A" },
                        { num: 5, text: "人們不當使用土地資源會造成甚麼後果?", options: [{ letter: "A", text: "引發極端天氣" }, { letter: "B", text: "引發水災" }, { letter: "C", text: "產生大量二氧化碳" }, { letter: "D", text: "影響食水供應" }], answer: "B" }
                    ]
                };
            }

            return { title, totalScore, questions };
        };

        const WhiteboardCanvas = ({ initialImage, onSave, onConfirmSubmit, isReadOnly = false, allowUploadBg = true }) => {
            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const [penColor, setPenColor] = useState('#2563eb');
            const [strokeWidth, setStrokeWidth] = useState(4); // 2px-18px
            const [isEraser, setIsEraser] = useState(false);
            const [isDrawing, setIsDrawing] = useState(false);
            const [bgImageSrc, setBgImageSrc] = useState(initialImage || null);
            const bgImgObj = useRef(null);

            // 1280x720 Standard Resolution
            const CANVAS_WIDTH = 1280;
            const CANVAS_HEIGHT = 720;

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                canvas.width = CANVAS_WIDTH;
                canvas.height = CANVAS_HEIGHT;
                redrawCanvas();
            }, []);

            useEffect(() => {
                if (bgImageSrc) {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => {
                        bgImgObj.current = img;
                        redrawCanvas();
                    };
                    img.src = bgImageSrc;
                } else {
                    bgImgObj.current = null;
                    redrawCanvas();
                }
            }, [bgImageSrc]);

            const redrawCanvas = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                // Keep existing drawing content if redrawing background
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = CANVAS_WIDTH;
                tempCanvas.height = CANVAS_HEIGHT;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(canvas, 0, 0);

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                if (bgImgObj.current) {
                    ctx.drawImage(bgImgObj.current, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                }

                ctx.drawImage(tempCanvas, 0, 0);
            };

            const getCanvasCoords = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                const scaleX = CANVAS_WIDTH / rect.width;
                const scaleY = CANVAS_HEIGHT / rect.height;

                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                if (isReadOnly) return;
                e.preventDefault();
                const coords = getCanvasCoords(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(coords.x, coords.y);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing || isReadOnly) return;
                e.preventDefault();
                const coords = getCanvasCoords(e);
                const ctx = canvasRef.current.getContext('2d');

                ctx.lineTo(coords.x, coords.y);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (isEraser) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = strokeWidth * 4;
                } else {
                    ctx.strokeStyle = penColor;
                    ctx.lineWidth = strokeWidth;
                }
                ctx.stroke();
            };

            const stopDrawing = () => {
                if (isDrawing) {
                    setIsDrawing(false);
                    if (onSave) {
                        const dataUrl = canvasRef.current.toDataURL('image/png');
                        onSave(dataUrl);
                    }
                }
            };

            const handleClear = () => {
                if (isReadOnly) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                if (bgImgObj.current) {
                    ctx.drawImage(bgImgObj.current, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                }
                if (onSave) onSave(canvas.toDataURL('image/png'));
            };

            const handleBgUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    setBgImageSrc(evt.target.result);
                };
                reader.readAsDataURL(file);
            };

            return (
                <div class="flex flex-col items-center w-full space-y-3" ref={containerRef}>
                    {!isReadOnly && (
                        <div class="flex flex-wrap items-center justify-between w-full bg-slate-800 text-white p-3 rounded-2xl gap-2 shadow-md">
                            <div class="flex items-center space-x-2">
                                <span class="text-xs text-slate-300 font-bold hidden sm:inline">筆觸顏色:</span>
                                {['#2563eb', '#dc2626', '#16a34a', '#d97706', '#000000'].map(c => (
                                    <button 
                                        key={c}
                                        onClick={() => { setPenColor(c); setIsEraser(false); }}
                                        style={{ backgroundColor: c }}
                                        class={`w-7 h-7 rounded-full border-2 transition ${!isEraser && penColor === c ? 'border-white scale-110 shadow-lg' : 'border-transparent opacity-80'}`}
                                    />
                                ))}
                            </div>

                            <div class="flex items-center space-x-2">
                                <span class="text-xs text-slate-300 font-bold">粗幼 ({strokeWidth}px):</span>
                                <input 
                                    type="range" 
                                    min="2" 
                                    max="18" 
                                    value={strokeWidth} 
                                    onChange={(e) => setStrokeWidth(parseInt(e.target.value))}
                                    class="w-24 accent-indigo-400 cursor-pointer"
                                />
                            </div>

                            <div class="flex items-center space-x-2">
                                <button 
                                    onClick={() => setIsEraser(!isEraser)}
                                    class={`px-3 py-1.5 rounded-xl font-bold text-xs transition flex items-center space-x-1 ${isEraser ? 'bg-amber-500 text-white shadow' : 'bg-slate-700 hover:bg-slate-600'}`}
                                >
                                    <span>🧽 擦膠</span>
                                </button>
                                <button 
                                    onClick={handleClear}
                                    class="px-3 py-1.5 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-xs transition flex items-center space-x-1"
                                >
                                    <span>🗑️ 清空</span>
                                </button>
                                {allowUploadBg && (
                                    <label class="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs transition cursor-pointer flex items-center space-x-1">
                                        <span>🖼️ 上載背景圖片</span>
                                        <input type="file" accept="image/*" onChange={handleBgUpload} class="hidden" />
                                    </label>
                                )}
                            </div>
                        </div>
                    )}

                    <div class="relative w-full aspect-16-9 bg-white rounded-2xl shadow-inner border-2 border-slate-300 overflow-hidden canvas-container">
                        <canvas 
                            ref={canvasRef}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            class="w-full h-full object-contain cursor-crosshair touch-none"
                        />
                    </div>

                    {!isReadOnly && onConfirmSubmit && (
                        <button 
                            onClick={() => {
                                const dataUrl = canvasRef.current.toDataURL('image/png');
                                onConfirmSubmit(dataUrl);
                            }}

                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請先上載並解析評估範本Word檔！", "error");
                        return;
                    }
                    const totalSecs = (parseInt(challengeTimeMin) || 0) * 60 + (parseInt(challengeTimeSec) || 0);
                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? totalSecs : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);
                publishQuestionToFirestore(newQ, updatedHistory);
                showToast(`已發佈【${getModeLabel(selectedMode)}】！`, 'success');
            };

            // Release Challenge Scores
            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已成功一併發放全班挑戰題成績！", "success");
            };

            // Random Picker Logic
            const handleRandomDraw = () => {
                if (isSpinning) return;
                const start = parseInt(rangeStart) || 1;
                const end = parseInt(rangeEnd) || 36;
                const available = [];
                for (let i = start; i <= end; i++) {
                    if (!drawnHistory.includes(i)) available.push(i);
                }

                if (available.length === 0) {
                    showToast("所有學號已抽完，將重置抽籤紀錄！", "info");
                    setDrawnHistory([]);
                    return;
                }

                setIsSpinning(true);
                let counter = 0;
                const interval = setInterval(() => {
                    const rand = available[Math.floor(Math.random() * available.length)];
                    setCurrentDrawn(rand);
                    playSound('spin');
                    counter++;
                    if (counter > 15) {
                        clearInterval(interval);
                        const finalWinner = available[Math.floor(Math.random() * available.length)];
                        setCurrentDrawn(finalWinner);
                        setDrawnHistory(prev => [...prev, finalWinner]);
                        setIsSpinning(false);
                        playSound('win');
                    }
                }, 100);
            };

            // Collab Mode Handlers
            const handleStartCollabGrouping = () => {
                if (!collabData || !collabData.questions) {
                    showToast("請上載並解析評估範本Word檔！", "error");
                    return;
                }
                if (studentsList.length < 3) {
                    showToast("在線學生人數不足（最少需要3人）！", "error");
                }

                performRandomGrouping();
            };

            const performRandomGrouping = () => {
                const shuffledStudents = [...studentsList].sort(() => Math.random() - 0.5);
                const shuffledAnimals = [...ANIMAL_TEAMS].sort(() => Math.random() - 0.5);

                const groupCount = Math.max(1, Math.floor(shuffledStudents.length / 3));
                const groups = [];

                for (let i = 0; i < groupCount; i++) {
                    groups.push({
                        ...shuffledAnimals[i % shuffledAnimals.length],
                        members: []
                    });
                }

                shuffledStudents.forEach((std, idx) => {
                    groups[idx % groupCount].members.push(std);
                });

                setCollabGroups(groups);
                setCollabStage('GROUPING');

                const initialProg = {};
                groups.forEach((g, idx) => { initialProg[idx] = 0; });
                setCollabProgress(initialProg);

                const stateObj = {
                    stage: 'GROUPING',
                    data: collabData,
                    groups: groups,
                    progress: initialProg,
                    winnerGroup: null
                };
                publishCollabStateToFirestore(stateObj);
                showToast("已分組並向全班發送組別資訊！", "success");
            };

            const handleStartCollabRace = () => {
                setCollabStage('RACE');
                const stateObj = {
                    stage: 'RACE',
                    data: collabData,
                    groups: collabGroups,
                    progress: collabProgress,
                    winnerGroup: null
                };
                publishCollabStateToFirestore(stateObj);
                playSound('win');
                showToast("比賽開始！團隊合作搶答！", "success");
            };

            // Export Challenge CSV
            const handleExportChallengeCSV = () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const challenge = activeQuestion.challenge;
                const resList = Object.values(currentQuestionResponses);

                let csvContent = "\uFEFF學號,姓名,總分,正確率,作答用時(秒)";
                challenge.questions.forEach(q => {
                    csvContent += `,第${q.num}題答案`;
                });
                csvContent += "\n";

                resList.forEach(r => {
                    const totalQ = challenge.questions.length;
                    const correctCount = r.score ? Math.round((r.score / challenge.totalScore) * totalQ) : 0;
                    const acc = totalQ > 0 ? ((correctCount / totalQ) * 100).toFixed(1) + '%' : '0%';
                    const timeUsed = r.timeUsed || 0;

                    csvContent += `"${r.seatNumber}","${r.name}",${r.score || 0},"${acc}",${timeUsed}`;
                    challenge.questions.forEach(q => {
                        const stdAns = (r.answersMap && r.answersMap[q.num]) || '未作答';
                        csvContent += `,"${stdAns}"`;
                    });
                    csvContent += "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `挑戰題成績_${challenge.title}_房號${roomCode}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("已成功匯出成績 CSV 試算表！", "success");
            };

            return (

                            </div>
                            <div>

                                    宣道會陳元喜小學OMIT互動課堂

                            </div>
                        </div>

                            >

                                </span>
                            </button>

                                class={`px-3 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-1 ${isDemoBroadcasting ? 'bg-amber-500 text-white animate-pulse' : 'bg-indigo-600 hover:bg-indigo-700 text-white'}`}

                                <span>🎯 抽選學生</span>
                            </button>

                                                            <div class="font-black text-sm flex items-center space-x-1">
                                                                <span>{g.emoji}</span>
                                                                <span>{g.name}</span>
                                                            </div>
                                                            <div class="text-xs font-medium text-slate-100/90 flex flex-wrap gap-1">
                                                                {g.members.map(m => `${m.seatNumber}號 ${m.name}`).join('、 ')}
