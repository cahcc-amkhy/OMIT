        // Mode Labels
        function getModeLabel(mode) {

        }

        // Default Question Prompts
        function getDefaultQuestionPrompt(mode) {
            switch(mode) {
                case 'CHOICE': return '請選擇正確答案：';
                case 'TF': return '請判斷下列描述是否正確：';
                case 'SHORT': return '請輸入您的回答：';
                case 'DRAW': return '請在白板上作答或繪圖：';
                case 'BUZZER': return '請準備點擊搶答按鈕！';
                case 'AUDIO': return '請錄製不多於10秒的語音回答：';
                case 'CHALLENGE': return '請在限時內完成以下挑戰題評估：';
                case 'GROUP': return '請與同組組員合作回答每道問題：';
                case 'LINK': return '請點擊或觀看下方派送內容：';
                default: return '請回答問題：';
            }
        }

        // Web Audio API Sound Generator
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                    });
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        // Toast Component
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (
                <div class={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-xl shadow-lg flex items-center space-x-2 text-sm font-medium animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        // YouTube Embed helper
        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        // Word (.docx) binary Blob generator using JSZip
        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) throw new Error("JSZip library not loaded.");
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>${paragraphsXml}</w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        // Parse Word / text challenge template
        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];
            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) {
                        questions.push(currentQ);
                    }
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    let isCorrect = false;

                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }

                    currentQ.options.push({ letter, text: optText });
                    if (isCorrect) currentQ.answer = letter;
                }
            });

            if (currentQ && currentQ.options.length > 0) {
                questions.push(currentQ);
            }

            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1,
                            text: "以下哪一項不是地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "機械資源" }
                            ],
                            answer: "D"
                        },
                        {
                            num: 2,
                            text: "芝士的原料屬於哪一項地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "礦產資源" }
                            ],
                            answer: "C"
                        }
                    ]
                };
            }

            return { title, totalScore, questions };
        };

        // Whiteboard Canvas Component with precise 1280x720 coordinate mapping & tools
        const WhiteboardCanvas = ({ initialBg = null, onSave, isReadOnly = false, externalDrawings = null, liveBroadcastHandler = null }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [penSize, setPenSize] = useState(4);
            const [isEraser, setIsEraser] = useState(false);
            const [penColor, setPenColor] = useState('#1e293b');
            const [bgImage, setBgImage] = useState(initialBg);
            const lastPos = useRef({ x: 0, y: 0 });

            // Initialize canvas to 1280x720 internal resolution
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                canvas.width = 1280;
                canvas.height = 720;

                const ctx = canvas.getContext('2d');
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                // Fill background
                redrawCanvas();
            }, []);

            useEffect(() => {
                if (initialBg !== bgImage) {
                    setBgImage(initialBg);
                }
            }, [initialBg]);

            useEffect(() => {
                redrawCanvas();
            }, [bgImage]);

            // If external drawings update (for teacher broadcast live view)
            useEffect(() => {
                if (externalDrawings && isReadOnly) {
                    const canvas = canvasRef.current;
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');
                    const img = new Image();
                    img.onload = () => {
                        ctx.clearRect(0, 0, 1280, 720);
                        ctx.drawImage(img, 0, 0, 1280, 720);
                    };
                    img.src = externalDrawings;
                }
            }, [externalDrawings, isReadOnly]);

            const redrawCanvas = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                if (bgImage) {
                    const img = new Image();
                    img.onload = () => {
                        ctx.clearRect(0, 0, 1280, 720);
                        ctx.drawImage(img, 0, 0, 1280, 720);
                    };
                    img.src = bgImage;
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, 1280, 720);
                }
            };

            // Scale mapping for touchscreen accuracy
            const getCanvasCoords = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                const scaleX = 1280 / rect.width;
                const scaleY = 720 / rect.height;

                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                if (isReadOnly) return;
                e.preventDefault();
                setIsDrawing(true);
                const coords = getCanvasCoords(e);
                lastPos.current = coords;
            };

            const draw = (e) => {
                if (!isDrawing || isReadOnly) return;
                e.preventDefault();
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const coords = getCanvasCoords(e);

                ctx.beginPath();
                ctx.moveTo(lastPos.current.x, lastPos.current.y);
                ctx.lineTo(coords.x, coords.y);

                if (isEraser) {
                    ctx.strokeStyle = bgImage ? '#ffffff' : '#ffffff';
                    ctx.lineWidth = penSize * 4;
                } else {
                    ctx.strokeStyle = penColor;
                    ctx.lineWidth = penSize;
                }

                ctx.stroke();
                lastPos.current = coords;

                if (liveBroadcastHandler) {
                    liveBroadcastHandler(canvas.toDataURL('image/png'));
                }
            };

            const stopDrawing = () => {
                if (!isDrawing || isReadOnly) return;
                setIsDrawing(false);
                if (onSave) {
                    onSave(canvasRef.current.toDataURL('image/png'));
                }
            };

            const handleClear = () => {
                if (isReadOnly) return;
                redrawCanvas();
                if (onSave) {
                    onSave(canvasRef.current.toDataURL('image/png'));
                }
            };

            const handleBgUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    setBgImage(evt.target.result);
                };
                reader.readAsDataURL(file);
            };

            return (
                <div class="flex flex-col items-center w-full space-y-3">
                    {!isReadOnly && (
                        <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-800 text-white p-3 rounded-2xl w-full text-xs md:text-sm shadow-md">
                            {/* Brush size */}
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-slate-300">筆觸:</span>
                                {[2, 4, 8, 12, 18].map((size) => (
                                    <button
                                        key={size}
                                        type="button"
                                        onClick={() => { setPenSize(size); setIsEraser(false); }}
                                        class={`w-8 h-8 rounded-full flex items-center justify-center font-bold transition ${penSize === size && !isEraser ? 'bg-indigo-500 text-white ring-2 ring-white' : 'bg-slate-700 hover:bg-slate-600'}`}
                                    >
                                        {size}
                                    </button>
                                ))}
                            </div>

                            {/* Color Picker */}
                            <div class="flex items-center space-x-1.5">
                                {['#1e293b', '#dc2626', '#2563eb', '#16a34a', '#d97706', '#9333ea'].map((c) => (
                                    <button
                                        key={c}
                                        type="button"
                                        onClick={() => { setPenColor(c); setIsEraser(false); }}
                                        style={{ backgroundColor: c }}
                                        class={`w-7 h-7 rounded-full border-2 ${penColor === c && !isEraser ? 'border-white scale-110 shadow' : 'border-transparent'}`}
                                    />
                                ))}
                            </div>

                            {/* Eraser & Clear & Upload */}
                            <div class="flex items-center space-x-2">
                                <button
                                    type="button"
                                    onClick={() => setIsEraser(!isEraser)}
                                    class={`px-3 py-1.5 rounded-xl font-bold flex items-center space-x-1 ${isEraser ? 'bg-amber-500 text-white' : 'bg-slate-700 hover:bg-slate-600'}`}
                                >
                                    <span>🧽 擦膠</span>
                                </button>

                                <button
                                    type="button"
                                    onClick={handleClear}
                                    class="px-3 py-1.5 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold flex items-center space-x-1 shadow"
                                >
                                    <span>🗑️ 清空</span>
                                </button>

                                <label class="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold cursor-pointer flex items-center space-x-1 shadow">
                                    <span>🖼️ 上載背景</span>
                                    <input type="file" accept="image/*" onChange={handleBgUpload} class="hidden" />
                                </label>
                            </div>
                        </div>
                    )}

                    {/* Canvas Wrapper */}
                    <div class="w-full aspect-16-9 max-w-4xl bg-white rounded-2xl shadow-inner overflow-hidden border-2 border-slate-300 relative canvas-container">
                        <canvas
                            ref={canvasRef}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            class="w-full h-full block cursor-crosshair"
                        />
                    </div>
                </div>
            );
        };

        function OMITApp() {
            const [role, setRole] = useState('LANDING'); // 'LANDING', 'TEACHER', 'STUDENT'
            const [roomCode, setRoomCode] = useState('');
            const [seatNumber, setSeatNumber] = useState('1');
            const [studentName, setStudentName] = useState('');
            const [teacherPassword, setTeacherPassword] = useState('');
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [toast, setToast] = useState(null);

            const [activeQuestion, setActiveQuestion] = useState(null);
            const [studentsList, setStudentsList] = useState([]);
            const [responses, setResponses] = useState({});
            const [historyQuestions, setHistoryQuestions] = useState([]);
            const [isAuthReady, setIsAuthReady] = useState(false);

            const myStudentId = useRef('std_' + Math.random().toString(36).substring(2, 9));

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            // Anonymous auth initialization
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (window.fbUtils && window.fbAuth) {
                            await window.fbUtils.signInAnonymously(window.fbAuth);
                            setIsAuthReady(true);
                        }
                    } catch (err) {
                        console.error("Firebase auth failed:", err);
                    }
                };
                initAuth();
            }, []);

            // Check URL parameters for room code
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const roomParam = params.get('room');
                if (roomParam) {
                    setRoomCode(roomParam.toUpperCase());
                }
            }, []);

            // Firestore sync for room state
            useEffect(() => {
                if (!roomCode || !isAuthReady) return;

                const appId = "omit-8c173";
                const db = window.fbDb;
                const { doc, onSnapshot, collection } = window.fbUtils;

                const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                const studentsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                const responsesColRef = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');

                const unsubRoom = onSnapshot(roomDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setActiveQuestion(data.activeQuestion || null);
                        if (data.history) setHistoryQuestions(data.history);
                    }
                }, (err) => console.error("Room sub error:", err));

                const unsubStudents = onSnapshot(studentsColRef, (snapshot) => {
                    const list = [];
                    snapshot.forEach((d) => list.push(d.data()));
                    setStudentsList(list);
                }, (err) => console.error("Students sub error:", err));

                const unsubResponses = onSnapshot(responsesColRef, (snapshot) => {
                    const resMap = {};
                    snapshot.forEach((d) => {
                        resMap[d.id] = d.data();
                    });
                    setResponses(resMap);
                }, (err) => console.error("Responses sub error:", err));

                return () => {
                    unsubRoom();
                    unsubStudents();
                    unsubResponses();
                };
            }, [roomCode, isAuthReady]);

            const handleTeacherAccessRequest = () => {
                setShowPasswordModal(true);
                setTeacherPassword('');
            };

            const verifyTeacherPassword = (e) => {
                e?.preventDefault();
                if (teacherPassword === '8030') {
                    const generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
                    setRoomCode(generatedCode);
                    setRole('TEACHER');
                    setShowPasswordModal(false);
                    showToast(`密碼正確！已建立課堂 房號：${generatedCode}`, 'success');
                } else {
                    showToast('密碼錯誤，請重新輸入！', 'error');
                }
            };

            const handleJoinRoom = (e) => {
                e?.preventDefault();
                if (!roomCode.trim()) {
                    showToast('請輸入6位數字房號', 'error');
                    return;
                }

                const studentObj = {
                    id: myStudentId.current,
                    seatNumber: seatNumber,
                    name: studentName.trim() || `學號 ${seatNumber}`,
                    joinTime: new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                };

                const appId = "omit-8c173";
                const db = window.fbDb;
                const studentDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students', myStudentId.current);
                window.fbUtils.setDoc(studentDocRef, studentObj);

                setRole('STUDENT');
                showToast(`已進入房號 ${roomCode} 的課堂`, 'success');
            };

            if (role === 'LANDING') {
                return (
                    <div class="min-h-screen bg-gradient-to-br from-indigo-900 via-indigo-800 to-purple-900 flex items-center justify-center p-4">
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                        
                        <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 space-y-8 relative overflow-hidden">
                            <div class="text-center space-y-3">
                                <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl mb-1 font-black text-2xl shadow-inner">
                                    OMIT
                                </div>
                                <h1 class="text-2xl md:text-3xl font-black text-slate-800 tracking-tight leading-snug">
                                    宣道會陳元喜小學<br />
                                    <span class="text-indigo-600">OMIT互動課堂</span>
                                </h1>
                                <p class="text-slate-500 text-xs md:text-sm font-medium">免登入！隨查隨答、高效即時的反饋互動平台</p>
                            </div>

                            <div class="space-y-6">
                                <form onSubmit={handleJoinRoom} class="bg-indigo-50/70 p-5 rounded-2xl border border-indigo-100 space-y-4">
                                    <h2 class="text-xs font-bold text-indigo-600 uppercase tracking-wider">我是學生 (加入課堂)</h2>
                                    <div>
                                        <label class="text-xs text-slate-500 font-medium mb-1 block">1. 課堂房號</label>
                                        <input 
                                            type="text" 
                                            placeholder="請輸入房號 (例如 123456)" 
                                            value={roomCode} 
                                            onChange={(e) => setRoomCode(e.target.value)}
                                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-mono text-center tracking-widest text-lg font-bold"
                                            maxLength={6}
                                        />
                                    </div>

                                    <div class="grid grid-cols-3 gap-2">
                                        <div class="col-span-1">
                                            <label class="text-xs text-slate-500 font-medium mb-1 block">2. 學號 *</label>
                                            <select 
                                                value={seatNumber}
                                                onChange={(e) => setSeatNumber(e.target.value)}
                                                class="w-full px-3 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-bold text-center"
                                            >
                                                {Array.from({ length: 36 }, (_, i) => i + 1).map((num) => (
                                                    <option key={num} value={num}>{num} 號</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div class="col-span-2">
                                            <label class="text-xs text-slate-500 font-medium mb-1 block">3. 姓名 (可留空)</label>
                                            <input 
                                                type="text" 
                                                placeholder="輸入姓名 / 暱稱" 
                                                value={studentName} 
                                                onChange={(e) => setStudentName(e.target.value)}
                                                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-medium"
                                            />
                                        </div>
                                    </div>

                                    <button 
                                        type="submit" 
                                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-200 active:scale-98"
                                    >
                                        進入課堂 🚀
                                    </button>
                                </form>

                                <div class="relative flex py-1 items-center">
                                    <div class="flex-grow border-t border-slate-200"></div>
                                    <span class="flex-shrink mx-4 text-slate-400 text-xs font-medium">或</span>
                                    <div class="flex-grow border-t border-slate-200"></div>
                                </div>

                                <div class="text-center">
                                    <button 
                                        onClick={handleTeacherAccessRequest}
                                        class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl transition shadow-md flex items-center justify-center space-x-2 active:scale-98"
                                    >
                                        <span>👨‍🏫 開啟新課堂 (教師版)</span>
                                    </button>
                                    <p class="text-xs text-slate-400 mt-2">建立後即可獲取房號與專屬 QR Code</p>
                                </div>
                            </div>
                        </div>

                        {showPasswordModal && (
                            <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                <div class="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
                                    <h3 class="text-lg font-bold text-slate-800 text-center">請輸入教師密碼</h3>
                                    <form onSubmit={verifyTeacherPassword} class="space-y-4">
                                        <input 
                                            type="password" 
                                            value={teacherPassword}
                                            onChange={(e) => setTeacherPassword(e.target.value)}
                                            class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 text-center font-mono text-xl tracking-widest"
                                            autoFocus
                                        />
                                        <div class="flex space-x-2">
                                            <button 
                                                type="button" 
                                                onClick={() => setShowPasswordModal(false)}
                                                class="w-1/2 py-2.5 rounded-xl bg-slate-100 font-medium text-slate-600 hover:bg-slate-200"
                                            >
                                                取消
                                            </button>
                                            <button 
                                                type="submit" 
                                                class="w-1/2 py-2.5 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-700 shadow-md"
                                            >
                                                確認進入
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            if (role === 'TEACHER') {
                return (
                    <TeacherDashboard 
                        roomCode={roomCode} 
                        activeQuestion={activeQuestion} 
                        setActiveQuestion={setActiveQuestion}
                        responses={responses}
                        setResponses={setResponses}
                        studentsList={studentsList}
                        historyQuestions={historyQuestions}
                        setHistoryQuestions={setHistoryQuestions}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            if (role === 'STUDENT') {
                return (
                    <StudentInterface 
                        roomCode={roomCode}
                        studentName={studentName}
                        seatNumber={seatNumber}
                        studentId={myStudentId.current}
                        activeQuestion={activeQuestion}
                        responses={responses}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            return null;
        }

        function TeacherDashboard({ roomCode, activeQuestion, setActiveQuestion, responses, setResponses, studentsList, historyQuestions, setHistoryQuestions, showToast, onExit }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE'); // CHOICE, TF, SHORT, DRAW, BUZZER, AUDIO, CHALLENGE, GROUP, LINK
            const [questionText, setQuestionText] = useState('');
            const [choiceCount, setChoiceCount] = useState(4);
            const [lockAfterSubmit, setLockAfterSubmit] = useState(true);
            const [whiteboardBg, setWhiteboardBg] = useState(null);
            const [pushedUrl, setPushedUrl] = useState('');

            // Modals & Tools
            const [showQRModal, setShowQRModal] = useState(false);
            const [showInspectModal, setShowInspectModal] = useState(null);
            const [barChoiceFilter, setBarChoiceFilter] = useState(null);

            // Teacher Demo Whiteboard
            const [showTeacherWhiteboard, setShowTeacherWhiteboard] = useState(false);
            const [teacherWhiteboardData, setTeacherWhiteboardData] = useState(null);
            const [isBroadcastingTeacherWhiteboard, setIsBroadcastingTeacherWhiteboard] = useState(false);

            // Random Selector State
            const [showRandomModal, setShowRandomModal] = useState(false);
            const [rangeStart, setRangeStart] = useState(1);
            const [rangeEnd, setRangeEnd] = useState(36);
            const [drawnNumbers, setDrawnNumbers] = useState([]);
            const [currentDrawn, setCurrentDrawn] = useState(null);
            const [isSpinning, setIsSpinning] = useState(false);

            // Timer Modal State
            const [showTimerModal, setShowTimerModal] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerActive, setTimerActive] = useState(false);
            const [timerZoomed, setTimerZoomed] = useState(false);
            const [customTimerMinutes, setCustomTimerMinutes] = useState('01');
            const [customTimerSecs, setCustomTimerSecs] = useState('00');

            // Challenge Question Setup States
            const [challengeData, setChallengeData] = useState(null);
            const [challengeEnableTimer, setChallengeEnableTimer] = useState(true);
            const [challengeTimeLimit, setChallengeTimeLimit] = useState(120); // 120s default
            const [challengeReleaseInstant, setChallengeReleaseInstant] = useState(true);
            const [showChallengeScoresOnLeaderboard, setShowChallengeScoresOnLeaderboard] = useState(true);
            const [docxFileName, setDocxFileName] = useState('');

            // Group Competition (合作題) States: 'PREPARE' | 'GROUPING' | 'RACE'
            const [groupStage, setGroupStage] = useState('PREPARE');
            const [groupData, setGroupData] = useState(null);
            const [assignedGroups, setAssignedGroups] = useState([]);
            const [isRaceMuted, setIsRaceMuted] = useState(false);

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

            // Filter current responses for active question
            const currentQuestionResponses = useMemo(() => {
                if (!activeQuestion) return {};
                const filtered = {};
                Object.values(responses).forEach(r => {
                    if (r.questionId === activeQuestion.id) {
                        filtered[r.studentId] = r;
                    }
                });
                return filtered;
            }, [responses, activeQuestion]);

            // Timer Interval Logic
            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(s => {
                            if (s <= 1) {
                                setTimerActive(false);
                                playSound('alarm');
                                return 0;
                            }
                            return s - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            // Sync Question & History to Firestore
            const publishQuestionToFirestore = async (qObj, newHistoryList) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatePayload = {
                    activeQuestion: qObj,
                    updatedAt: Date.now()
                };
                if (newHistoryList) {
                    updatePayload.history = newHistoryList;
                }

                await window.fbUtils.setDoc(roomDocRef, updatePayload, { merge: true });
            };

            const handleExitRoom = async () => {
                if (window.confirm("確定退出課室？將會同步清空此課室於 Firebase 的所有暫存紀錄！")) {
                    try {
                        const appId = "omit-8c173";
                        const db = window.fbDb;
                        
                        const responsesColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');
                        const resSnaps = await window.fbUtils.getDocs(responsesColRef);
                        resSnaps.forEach(async (d) => {
                            await window.fbUtils.deleteDoc(d.ref);
                        });

                        const studentsColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                        const stuSnaps = await window.fbUtils.getDocs(studentsColRef);
                        stuSnaps.forEach(async (d) => {
                            await window.fbUtils.deleteDoc(d.ref);
                        });

                        const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                        await window.fbUtils.deleteDoc(roomDocRef);

                        showToast("課室暫存資料已完全清空！", "info");
                    } catch (e) {
                        console.error("Cleanup error:", e);
                    }
                    onExit();
                }
            };

            // Word Template Download (.docx)
            const handleDownloadChallengeTemplate = async () => {
                const sampleLines = [
                    "標題：地球生病了",
                    "總分: 100分",
                    "1.以下哪一項不是地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源",
                    "D. 機械資源*",
                    "",
                    "2.芝士的原料屬於哪一項地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源*",
                    "D. 礦產資源",
                    "",
                    "3.人們不當使用水資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應*",
                    "",
                    "4.人們不當使用煤和石油資源會造成甚麼後果?",
                    "A. 引發極端天氣*",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應",
                    "",
                    "5.人們不當使用土地資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災*",
                    "C. 產生大量二氧化碳",
                    "D. 影響食水供應"
                ];

                try {
                    const blob = await createWordDocxBlob(sampleLines);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = '下載評估範本Word檔.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast("已下載 Word 評估範本檔 (.docx)！", "success");
                } catch (err) {
                    console.error("Docx generation error:", err);
                    showToast("無法生成 Word 範本檔，請重試。", "error");
                }
            };

            const handleWordFileUpload = (e, targetType = 'CHALLENGE') => {
                const file = e.target.files[0];
                if (!file) return;

                setDocxFileName(file.name);
                const reader = new FileReader();

                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const arrayBuffer = evt.target.result;
                            const result = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                            parsedData = parseWordChallengeText(result.value);
                        } else {
                            const text = evt.target.result;
                            parsedData = parseWordChallengeText(text);
                        }

                        if (targetType === 'GROUP') {
                            setGroupData(parsedData);
                        } else {
                            setChallengeData(parsedData);
                        }
                        showToast(`已成功解析範本檔案！共 ${parsedData.questions.length} 題`, 'success');
                    } catch (err) {
                        console.error("Word file parse error:", err);
                        showToast("文件解析失敗，請確認格式！", "error");
                    }
                };

                if (file.name.endsWith('.docx')) {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file, "UTF-8");
                }
            };

            // Modifying challenge questions in teacher UI
            const handleUpdateChallengeTitle = (newTitle) => {
                setChallengeData(prev => prev ? { ...prev, title: newTitle } : null);
            };

            const handleUpdateChallengeScore = (newScore) => {
                setChallengeData(prev => prev ? { ...prev, totalScore: parseInt(newScore) || 100 } : null);
            };

            const handleUpdateQuestionText = (qIndex, text) => {
                setChallengeData(prev => {
                    if (!prev) return null;
                    const newQs = [...prev.questions];
                    newQs[qIndex] = { ...newQs[qIndex], text };
                    return { ...prev, questions: newQs };
                });
            };

            const handleUpdateOptionText = (qIndex, optIndex, text) => {
                setChallengeData(prev => {
                    if (!prev) return null;
                    const newQs = [...prev.questions];
                    const newOpts = [...newQs[qIndex].options];
                    newOpts[optIndex] = { ...newOpts[optIndex], text };
                    newQs[qIndex] = { ...newQs[qIndex], options: newOpts };
                    return { ...prev, questions: newQs };
                });
            };

            const handleUpdateCorrectAnswer = (qIndex, answerLetter) => {
                setChallengeData(prev => {
                    if (!prev) return null;
                    const newQs = [...prev.questions];
                    newQs[qIndex] = { ...newQs[qIndex], answer: answerLetter };
                    return { ...prev, questions: newQs };
                });
            };

            const handleDeleteQuestion = (qIndex) => {
                setChallengeData(prev => {
                    if (!prev) return null;
                    const newQs = prev.questions.filter((_, idx) => idx !== qIndex).map((q, idx) => ({
                        ...q,
                        num: idx + 1
                    }));
                    return { ...prev, questions: newQs };
                });
                showToast("已刪除該題目！", "info");
            };

            // Publish Active Question
            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                
                let challengeContent = null;
                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請先上載並解析 Word 評估範本檔案！", "error");
                        return;
                    }
                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);

                publishQuestionToFirestore(newQ, updatedHistory);
                showToast(`已成功發佈【${getModeLabel(selectedMode)}】給所有學生！`, 'success');
            };

            // Release Scores for Challenge
            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已成功向所有學生一併發放挑戰題成績！", "success");
            };

            // Random Student Picker
            const handleDrawStudent = () => {
                if (isSpinning) return;
                setIsSpinning(true);
                setCurrentDrawn(null);

                let available = [];
                for (let i = rangeStart; i <= rangeEnd; i++) {
                    if (!drawnNumbers.includes(i)) {
                        available.push(i);
                    }
                }

                if (available.length === 0) {
                    setDrawnNumbers([]);
                    for (let i = rangeStart; i <= rangeEnd; i++) available.push(i);
                }

                let spins = 0;
                const maxSpins = 20;
                const interval = setInterval(() => {
                    const randomVal = available[Math.floor(Math.random() * available.length)];
                    setCurrentDrawn(randomVal);
                    playSound('spin');
                    spins++;

                    if (spins >= maxSpins) {
                        clearInterval(interval);
                        setIsSpinning(false);
                        setDrawnNumbers(prev => [...prev, randomVal]);
                        playSound('win');
                    }
                }, 100);
            };

            // Broadcast / Peer review toggle for student submission
            const handleToggleBroadcastSubmission = async (res) => {
                const currentBroadcast = activeQuestion?.broadcastedSubmission;
                const isCurrentlyBroadcasted = currentBroadcast && currentBroadcast.studentId === res.studentId;

                const updatedQ = {
                    ...activeQuestion,
                    broadcastedSubmission: isCurrentlyBroadcasted ? null : {
                        studentId: res.studentId,
                        studentName: res.name || `學號 ${res.seatNumber}`,
                        seatNumber: res.seatNumber,
                        mode: res.mode,
                        answer: res.answer
                    }
                };

                await publishQuestionToFirestore(updatedQ);
                if (isCurrentlyBroadcasted) {
                    showToast("已取消廣播分享此答案！", "info");
                } else {
                    showToast(`已廣播 ${res.seatNumber} 號學生的答案至全班螢幕！`, "success");
                }
            };

            // CSV Export for Challenge Mode
            const handleExportChallengeCSV = () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE' || !activeQuestion.challenge) return;

                const questions = activeQuestion.challenge.questions || [];
                let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
                
                // Headers
                let headers = ["學號", "姓名", "總得分", "正確率(%)", "作答用時(秒)"];
                questions.forEach((q, idx) => {
                    headers.push(`第${idx+1}題答案`, `第${idx+1}題結果`);
                });
                csvContent += headers.join(",") + "\n";

                // Rows
                Object.values(currentQuestionResponses).forEach((res) => {
                    let totalScore = 0;
                    let correctCount = 0;
                    let itemizedDetails = [];

                    if (res.challengeAnswers) {
                        questions.forEach((q) => {
                            const studentAns = res.challengeAnswers[q.num] || '-';
                            const isCorrect = studentAns === q.answer;
                            if (isCorrect) {
                                correctCount++;
                                totalScore += Math.round((activeQuestion.challenge.totalScore || 100) / questions.length);
                            }
                            itemizedDetails.push(`"${studentAns}"`, isCorrect ? "正確" : "錯誤");
                        });
                    }

                    const accuracy = Math.round((correctCount / questions.length) * 100) || 0;
                    const timeUsed = res.timeUsedSecs || '-';

                    let row = [`"${res.seatNumber}"`, `"${res.name || '學生'}"`, totalScore, `${accuracy}%`, timeUsed, ...itemizedDetails];
                    csvContent += row.join(",") + "\n";
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `挑戰題成績表_房號${roomCode}_${Date.now()}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("已成功匯出成績試算表 (.csv)！", "success");
            };

            // Group Competition Logic Handlers
            const handleGenerateGroups = () => {
                if (studentsList.length < 3) {
                    showToast("在線學生人數不足 (最少需 3 人)！", "error");
                    return;
                }

                // Randomize students
                const shuffledStudents = [...studentsList].sort(() => Math.random() - 0.5);
                const groupCount = Math.max(2, Math.floor(shuffledStudents.length / 3));
                const shuffledPresets = [...GROUP_ANIMAL_PRESETS].sort(() => Math.random() - 0.5);

                const groups = [];
                for (let i = 0; i < groupCount; i++) {
                    const preset = shuffledPresets[i % shuffledPresets.length];
                    groups.push({
                        id: 'grp_' + i,
                        name: preset.name,
                        emoji: preset.emoji,
                        color: preset.color,
                        badgeBg: preset.badgeBg,
                        members: [],
                        scoreProgress: 0
                    });
                }

                shuffledStudents.forEach((std, idx) => {
                    const gIndex = idx % groupCount;
                    groups[gIndex].members.push(std);
                });

                setAssignedGroups(groups);
                setGroupStage('GROUPING');

                // Publish group state to Firestore
                const groupQuestionObj = {
                    id: 'q_group_' + Date.now(),
                    mode: 'GROUP',
                    text: groupData ? groupData.title : '團體合作比拼賽',
                    stage: 'GROUPING',
                    groups: groups,
                    questions: groupData ? groupData.questions : []
                };

                publishQuestionToFirestore(groupQuestionObj);
                playSound('spin');
                showToast("已成功進行隨機分組！", "success");
            };

            const handleStartGroupRace = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'GROUP') return;
                const updatedQ = {
                    ...activeQuestion,
                    stage: 'RACE',
                    winnerGroup: null
                };
                setGroupStage('RACE');
                await publishQuestionToFirestore(updatedQ);
                playSound('win');
                showToast("比賽開始！組員請互相合作！", "success");
            };

            // Toggle Teacher Demo Whiteboard Broadcast
            const handleToggleBroadcastTeacherWhiteboard = async (isBroadcasting) => {
                setIsBroadcastingTeacherWhiteboard(isBroadcasting);
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                await window.fbUtils.setDoc(roomDocRef, {
                    teacherWhiteboardBroadcast: isBroadcasting ? teacherWhiteboardData : null
                }, { merge: true });

                if (isBroadcasting) {
                    showToast("已將示範白板廣播至全班螢幕！", "success");
                } else {
                    showToast("已收回示範白板廣播！", "info");
                }
            };

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col pb-12">
                    {/* Header Bar */}
                    <header class="bg-indigo-900 text-white shadow-xl sticky top-0 z-30">
                        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
                            <div class="flex items-center space-x-3">
                                <span class="bg-indigo-600 px-3 py-1 rounded-xl text-xs font-black tracking-wider uppercase">教師主控台</span>
                                <h1 class="text-base md:text-xl font-black tracking-tight">宣道會陳元喜小學OMIT互動課堂</h1>
                            </div>

                            {/* Center Quick Tools: Demo Whiteboard, Picker, Timer, QR */}
                            <div class="flex items-center space-x-2">
                                <button 
                                    onClick={() => setShowTeacherWhiteboard(true)}
                                    class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-1 shadow transition active:scale-95"
                                >
                                    <span>🎨 示範白板</span>
                                </button>

                                <button 
                                    onClick={() => setShowRandomModal(true)}
                                    class="bg-purple-600 hover:bg-purple-500 text-white px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-1 shadow transition active:scale-95"
                                >
                                    <span>🎲 抽選學生</span>
                                </button>

                                <button 
                                    onClick={() => setShowTimerModal(true)}
                                    class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-1 shadow transition active:scale-95"
                                >
                                    <span>⏱️ 計時器 {timerSeconds > 0 && `(${Math.floor(timerSeconds/60)}:${(timerSeconds%60).toString().padStart(2,'0')})`}</span>
                                </button>

                                <button 
                                    onClick={() => setShowQRModal(true)}
                                    class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-2 shadow transition active:scale-95"
                                >
                                    <span>📱 房號: <span class="font-mono text-amber-300 font-bold">{roomCode}</span></span>
                                    <span class="bg-emerald-800 text-emerald-100 px-2 py-0.5 rounded-full text-xs font-mono">{studentsList.length}人在線</span>
                                </button>

                                <button 
                                    onClick={handleExitRoom}
                                    class="bg-red-600/80 hover:bg-red-600 text-white px-3 py-2 rounded-xl text-xs font-bold transition"
                                >
                                    退出
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Layout Container */}
                    <main class="max-w-7xl mx-auto w-full px-4 pt-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-grow">

                                        { id: 'TF', label: '是非題' },
                                        { id: 'SHORT', label: '短答題' },
                                        { id: 'DRAW', label: '白板題' },
                                        { id: 'BUZZER', label: '搶答題' },
                                        { id: 'AUDIO', label: '錄音題' },
                                        { id: 'CHALLENGE', label: '挑戰題' },
                                        { id: 'GROUP', label: '合作題' },

                                            {tab.label}

                                            placeholder="https://..." 
                                            value={pushedUrl}
                                            onChange={(e) => setPushedUrl(e.target.value)}
                                            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-sm"
                                        />
                                    </div>
                                )}

                                {/* Challenge Setup Panel */}
                                {selectedMode === 'CHALLENGE' && (

                                            <button

                                            </button>
                                        </div>

                                        <div>
                                            <label class="text-xs font-bold text-amber-900 block mb-1">上載 Word 評估檔案 (.docx / .txt)：</label>
                                            <input 
                                                type="file" 
                                                accept=".docx,.txt"
                                                onChange={(e) => handleWordFileUpload(e, 'CHALLENGE')}
                                                class="w-full text-xs text-slate-600 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-600 file:text-white"

                                        </div>

                                        {/* Timed options */}
                                        <div class="space-y-2 pt-2 border-t border-amber-200">
                                            <div class="flex items-center justify-between">

                                                <input 
                                                    type="checkbox" 
                                                    checked={challengeEnableTimer} 
                                                    onChange={(e) => setChallengeEnableTimer(e.target.checked)}
                                                    class="w-4 h-4 rounded text-indigo-600"
                                                />
                                            </div>

                                            {challengeEnableTimer && (
                                                <div class="space-y-2">
                                                    <div class="flex space-x-1.5">
                                                        {[60, 120, 180, 240, 300].map(s => (
                                                            <button
                                                                key={s}
                                                                type="button"
                                                                onClick={() => setChallengeTimeLimit(s)}
                                                                class={`flex-1 py-1 rounded-lg text-xs font-bold border ${challengeTimeLimit === s ? 'bg-amber-600 text-white border-amber-700' : 'bg-white border-slate-200'}`}
                                                            >
                                                                {s/60}分
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        {/* Score release strategy */}
                                        <div class="space-y-2 pt-2 border-t border-amber-200">
                                            <span class="text-xs font-bold text-slate-700 block">成績發放控制：</span>
                                            <label class="flex items-center space-x-2 text-xs">
                                                <input 
                                                    type="radio" 
                                                    name="releaseMode" 
                                                    checked={challengeReleaseInstant} 
                                                    onChange={() => setChallengeReleaseInstant(true)}
                                                />
                                                <span>學生提交後即時顯示成績分值</span>
                                            </label>
                                            <label class="flex items-center space-x-2 text-xs">
                                                <input 
                                                    type="radio" 
                                                    name="releaseMode" 
                                                    checked={!challengeReleaseInstant} 
                                                    onChange={() => setChallengeReleaseInstant(false)}
                                                />
                                                <span>待所有學生完成提交後，由教師按鍵一併發放</span>
                                            </label>
                                        </div>

                                        {/* Assessment Question Editor */}
                                        {challengeData && (
                                            <div class="mt-4 p-3 bg-white rounded-xl border border-amber-300 space-y-3 max-h-60 overflow-y-auto">
                                                <h4 class="text-xs font-black text-amber-800 border-b pb-1">教師編輯/確認評估內容：</h4>
                                                <div>
                                                    <label class="text-xs text-slate-500 font-bold">評估標題：</label>
                                                    <input 
                                                        type="text" 
                                                        value={challengeData.title} 
                                                        onChange={(e) => handleUpdateChallengeTitle(e.target.value)}
                                                        class="w-full px-2 py-1 border rounded text-xs font-bold"
                                                    />
                                                </div>

                                                {challengeData.questions.map((q, qIdx) => (
                                                    <div key={qIdx} class="p-2 bg-slate-50 rounded-lg border text-xs space-y-2">
                                                        <div class="flex items-center justify-between">
                                                            <span class="font-bold text-indigo-600">第 {qIdx+1} 題</span>
                                                            <button 
                                                                type="button" 
                                                                onClick={() => handleDeleteQuestion(qIdx)}
                                                                class="text-red-600 font-bold hover:underline text-xs"
                                                            >
                                                                🗑️ 刪除此題
                                                            </button>
                                                        </div>
                                                        <input 
                                                            type="text" 
                                                            value={q.text} 
                                                            onChange={(e) => handleUpdateQuestionText(qIdx, e.target.value)}
                                                            class="w-full px-2 py-1 border rounded font-medium"
                                                        />
                                                        <div class="grid grid-cols-2 gap-1">

                                            </button>
                                        </div>

                                        <div>
                                            <label class="text-xs font-bold text-purple-900 block mb-1">上載 Word 評估檔案 (.docx)：</label>
                                            <input 
                                                type="file" 
                                                accept=".docx,.txt"
                                                onChange={(e) => handleWordFileUpload(e, 'GROUP')}
                                                class="w-full text-xs text-slate-600 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-purple-600 file:text-white"

                                        <button

                                {selectedMode !== 'CHALLENGE' && selectedMode !== 'GROUP' && (

                        {/* Right Display Panel: Live Submissions & Leaderboard (7 Cols) */}
                        <div class="lg:col-span-7 space-y-6">

                                            <button
