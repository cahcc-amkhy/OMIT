        // Web Audio Synthesizer
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                    });
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        // Synthesizer background music generator
        class SimpleSynthesizedMusic {
            constructor() {
                this.ctx = null;
                this.interval = null;
                this.isPlaying = false;
            }
            start() {
                if (this.isPlaying) return;
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                this.isPlaying = true;
                const notes = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23, 392.00, 293.66];
                let idx = 0;
                this.interval = setInterval(() => {
                    if (!this.isPlaying) return;
                    try {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(notes[idx % notes.length], this.ctx.currentTime);
                        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start();
                        osc.stop(this.ctx.currentTime + 0.25);
                        idx++;
                    } catch (e) {}
                }, 300);
            }
            stop() {
                this.isPlaying = false;
                if (this.interval) clearInterval(this.interval);
                if (this.ctx) this.ctx.close();
            }
        }

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

                    <span>{message}</span>
                </div>
            );
        };

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) throw new Error("JSZip library is not loaded.");
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>${paragraphsXml}</w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];
            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) questions.push(currentQ);
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }

                    currentQ.options.push({ letter, text: optText });
                    if (isCorrect) currentQ.answer = letter;
                }
            });

            if (currentQ && currentQ.options.length > 0) questions.push(currentQ);

            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1, text: "以下哪一項不是地球的天然資源?",
                            options: [{ letter: "A", text: "水資源" }, { letter: "B", text: "植物資源" }, { letter: "C", text: "動物資源" }, { letter: "D", text: "機械資源" }],
                            answer: "D"
                        },
                        {
                            num: 2, text: "芝士的原料屬於哪一項地球的天然資源?",
                            options: [{ letter: "A", text: "水資源" }, { letter: "B", text: "植物資源" }, { letter: "C", text: "動物資源" }, { letter: "D", text: "礦產資源" }],
                            answer: "C"
                        },
                        {
                            num: 3, text: "人們不當使用水資源會造成甚麼後果?",
                            options: [{ letter: "A", text: "引發極端天氣" }, { letter: "B", text: "引發水災" }, { letter: "C", text: "水土流失" }, { letter: "D", text: "影響食水供應" }],
                            answer: "D"
                        },
                        {
                            num: 4, text: "人們不當使用煤和石油資源會造成甚麼後果?",
                            options: [{ letter: "A", text: "引發極端天氣" }, { letter: "B", text: "引發水災" }, { letter: "C", text: "水土流失" }, { letter: "D", text: "影響食水供應" }],
                            answer: "A"
                        },
                        {
                            num: 5, text: "人們不當使用土地資源會造成甚麼後果?",
                            options: [{ letter: "A", text: "引發極端天氣" }, { letter: "B", text: "引發水災" }, { letter: "C", text: "產生大量二氧化碳" }, { letter: "D", text: "影響食水供應" }],
                            answer: "B"
                        }
                    ]
                };
            }

            return { title, totalScore, questions };
        };

        // Item 1: High-precision 1280x720 Whiteboard Canvas with scale mapping
        const WhiteboardCanvas = ({ bgImage, onSubmit, isReadOnly = false, initialData = null, isDemo = false }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [penColor, setPenColor] = useState('#2563eb');
            const [lineWidth, setLineWidth] = useState(4); // 2px-18px
            const [isEraser, setIsEraser] = useState(false);
            const [bgImgObj, setBgImgObj] = useState(null);

            // Load background image
            useEffect(() => {
                if (bgImage) {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = () => {
                        setBgImgObj(img);
                        redrawCanvas(img);
                    };
                    img.src = bgImage;
                } else {
                    setBgImgObj(null);
                    redrawCanvas(null);
                }
            }, [bgImage]);

            useEffect(() => {
                if (initialData && canvasRef.current) {
                    const img = new Image();
                    img.onload = () => {
                        const ctx = canvasRef.current.getContext('2d');
                        ctx.drawImage(img, 0, 0, 1280, 720);
                    };
                    img.src = initialData;
                }
            }, [initialData]);

            const redrawCanvas = (backgroundImg) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 1280, 720);

                if (backgroundImg) {
                    ctx.drawImage(backgroundImg, 0, 0, 1280, 720);
                }
            };

            const getCanvasCoords = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = 1280 / rect.width;
                const scaleY = 720 / rect.height;

                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                if (isReadOnly) return;
                e.preventDefault();
                setIsDrawing(true);
                const coords = getCanvasCoords(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(coords.x, coords.y);
            };

            const draw = (e) => {
                if (!isDrawing || isReadOnly) return;
                e.preventDefault();
                const coords = getCanvasCoords(e);
                const ctx = canvasRef.current.getContext('2d');

                ctx.lineWidth = lineWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (isEraser) {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.arc(coords.x, coords.y, lineWidth * 1.5, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = penColor;
                    ctx.lineTo(coords.x, coords.y);
                    ctx.stroke();
                }
            };

            const stopDrawing = () => {
                if (isReadOnly) return;
                setIsDrawing(false);
                if (isDemo && onSubmit) {
                    const dataUrl = canvasRef.current.toDataURL('image/png');
                    onSubmit(dataUrl);
                }
            };

            const handleClear = () => {
                redrawCanvas(bgImgObj);
                if (isDemo && onSubmit) {
                    const dataUrl = canvasRef.current.toDataURL('image/png');
                    onSubmit(dataUrl);
                }
            };

            const handleCustomBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const img = new Image();
                        img.onload = () => {
                            setBgImgObj(img);
                            redrawCanvas(img);
                        };
                        img.src = evt.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleSubmitCanvas = () => {
                if (onSubmit) {
                    const dataUrl = canvasRef.current.toDataURL('image/png');
                    onSubmit(dataUrl);
                }
            };

            return (
                <div class="space-y-3 w-full">
                    {!isReadOnly && (
                        <div class="bg-slate-100 p-2.5 rounded-2xl flex flex-wrap items-center justify-between gap-2 border">
                            <div class="flex items-center space-x-2 flex-wrap gap-1">
                                <span class="text-xs font-bold text-slate-600">顏色：</span>
                                {['#2563eb', '#dc2626', '#16a34a', '#d97706', '#000000', '#9333ea'].map((col) => (
                                    <button 
                                        key={col}
                                        onClick={() => { setPenColor(col); setIsEraser(false); }}
                                        class={`w-7 h-7 rounded-full border-2 transition ${!isEraser && penColor === col ? 'scale-110 ring-2 ring-indigo-500' : ''}`}
                                        style={{ backgroundColor: col }}
                                    />
                                ))}

                                <div class="h-5 w-px bg-slate-300 mx-1"></div>

                                <button 
                                    onClick={() => setIsEraser(!isEraser)}
                                    class={`px-3 py-1.5 rounded-xl font-bold text-xs flex items-center space-x-1 border transition ${isEraser ? 'bg-amber-500 text-white border-amber-600' : 'bg-white text-slate-700'}`}
                                >
                                    <span>🧽 擦膠</span>
                                </button>

                                <div class="h-5 w-px bg-slate-300 mx-1"></div>

                                <span class="text-xs font-bold text-slate-600">粗幼:</span>
                                <input 
                                    type="range" 
                                    min="2" 
                                    max="18" 
                                    value={lineWidth} 
                                    onChange={(e) => setLineWidth(parseInt(e.target.value))}
                                    class="w-20 accent-indigo-600"
                                />
                                <span class="text-xs font-mono font-bold text-indigo-600 w-6">{lineWidth}px</span>
                            </div>

                            <div class="flex items-center space-x-2">
                                <label class="bg-white hover:bg-slate-50 text-slate-700 border font-bold text-xs px-3 py-1.5 rounded-xl cursor-pointer flex items-center gap-1 shadow-sm">
                                    <span>🖼️ 上載背景圖片</span>
                                    <input type="file" accept="image/*" onChange={handleCustomBgUpload} class="hidden" />
                                </label>

                                <button 
                                    onClick={handleClear}
                                    class="bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold text-xs px-3 py-1.5 rounded-xl transition border border-rose-200"
                                >
                                    🗑️ 一鍵清空

            const [coopStage, setCoopStage] = useState('PREP'); // 'PREP', 'GROUP', 'RACE'

            const currentQuestionResponses = useMemo(() => {

            // Timer Interval Logic
            useEffect(() => {

            // Sync Question & Room to Firestore
            const publishQuestionToFirestore = async (qObj, newHistoryList) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

            // Exit Room Cleanup
            const handleExitRoom = async () => {
                if (window.confirm("確定退出課室？將會同步清空此課室於 Firebase 的所有暫存紀錄！")) {
                    try {
                        const appId = "omit-8c173";

                        const studentsColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');

                        stuSnaps.forEach(async (d) => await window.fbUtils.deleteDoc(d.ref));

                    }

            // Download Challenge / Coop Word Template File (.docx)
            const handleDownloadChallengeTemplate = async () => {
                const sampleLines = [
                    "標題：地球生病了",
                    "總分: 100分",
                    "1.以下哪一項不是地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源",
                    "D. 機械資源*",
                    "",
                    "2.芝士的原料屬於哪一項地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源*",
                    "D. 礦產資源",
                    "",
                    "3.人們不當使用水資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應*",
                    "",
                    "4.人們不當使用煤和石油資源會造成甚麼後果?",
                    "A. 引發極端天氣*",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應",
                    "",
                    "5.人們不當使用土地資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災*",
                    "C. 產生大量二氧化碳",
                    "D. 影響食水供應"
                ];

                try {
                    const blob = await createWordDocxBlob(sampleLines);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = '下載評估範本Word檔.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast("已下載 Word 評估範本檔 (.docx)！", "success");
                } catch (err) {
                    console.error("Docx generation error:", err);
                    showToast("無法生成 Word 範本檔", "error");
                }
            };

            const handleWordFileUpload = (e, isCoop = false) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const arrayBuffer = evt.target.result;
                            const result = await window.mammoth.extractRawText({ arrayBuffer });
                            parsedData = parseWordChallengeText(result.value);
                        } else {
                            parsedData = parseWordChallengeText(evt.target.result);
                        }

                        if (isCoop) {
                            setCoopData(parsedData);
                        } else {
                            setChallengeData(parsedData);
                        }
                        showToast(`已成功上載解析 Word 評估檔！共 ${parsedData.questions.length} 題`, 'success');
                    } catch (err) {
                        console.error("Word file parse error:", err);
                        showToast("文件解析失敗，請確認格式！", "error");
                    }
                };

                if (file.name.endsWith('.docx')) {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file, "UTF-8");
                }
            };

            // Question Publishing
            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                
                let challengeContent = null;
                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請上載評估範本Word檔！", "error");
                        return;
                    }
                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: selectedMode === 'DRAW' ? true : lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);
                publishQuestionToFirestore(newQ, updatedHistory);
                showToast(`已成功發佈【${getModeLabel(selectedMode)}】給全班學生！`, 'success');
            };

            // Release Challenge Scores
            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已一併發放全班挑戰題成績！", "success");
            };

            // Item 22: Cooperation Quiz ("合作題") Logic
            const handleRandomGroupAssignment = () => {
                if (studentsList.length < 3) {
                    showToast("課堂學生少於 3 人，無法進行合作題分組！", "error");
                    return;
                }

                const shuffledStudents = [...studentsList].sort(() => 0.5 - Math.random());
                const numStudents = shuffledStudents.length;
                let numGroups = Math.floor(numStudents / 3);
                if (numGroups > ANIMAL_PRESETS.length) numGroups = ANIMAL_PRESETS.length;

                const shuffledPresets = [...ANIMAL_PRESETS].sort(() => 0.5 - Math.random());
                const groups = [];

                for (let i = 0; i < numGroups; i++) {
                    groups.push({
                        id: 'grp_' + i,
                        ...shuffledPresets[i],
                        members: []
                    });
                }

                shuffledStudents.forEach((student, idx) => {
                    const groupIdx = idx % numGroups;
                    groups[groupIdx].members.push(student);
                });

                setCoopGroups(groups);
                const initialScores = {};
                groups.forEach(g => initialScores[g.id] = 0);
                setCoopScores(initialScores);
                setCoopStage('GROUP');
                prepMusicRef.current?.start();

                // Publish group assignment status to students
                const coopQ = {
                    id: 'q_coop_' + Date.now(),
                    mode: 'COOP',
                    text: '🤝 合作題分組競爭',
                    startTime: Date.now(),
                    coopStage: 'GROUP',
                    coopGroups: groups,
                    coopData: coopData,
                    coopScores: initialScores
                };
                publishQuestionToFirestore(coopQ);
                showToast("已成功完成隨機 3-4 人分組，已發送組別資訊至學生螢幕！", "success");
            };

            const handleStartCoopRace = () => {
                if (!coopData || !coopGroups.length) return;
                setCoopStage('RACE');
                prepMusicRef.current?.stop();
                raceMusicRef.current?.start();
                setIsRaceMusicPlaying(true);

                const updatedQ = {
                    ...activeQuestion,
                    coopStage: 'RACE',
                    coopWinner: null
                };
                publishQuestionToFirestore(updatedQ);
                showToast("🏁 合作題比賽正式開始！快與組員合力作答！", "success");
            };

            const toggleRaceMusic = () => {
                if (isRaceMusicPlaying) {
                    raceMusicRef.current?.stop();
                    setIsRaceMusicPlaying(false);
                } else {
                    raceMusicRef.current?.start();
                    setIsRaceMusicPlaying(true);
                }
            };

            const handleEndCoopRace = async () => {
                raceMusicRef.current?.stop();
                prepMusicRef.current?.stop();
                setIsRaceMusicPlaying(false);
                setCoopStage('PREP');
                setCoopWinner(null);
                await publishQuestionToFirestore(null);
                showToast("已結束合作題比賽，學生已回到等候指示頁面", "info");
            };

            // Item 21: Demonstration Whiteboard Broadcast Toggle
            const toggleDemoBoardBroadcast = async () => {
                const nextState = !isDemoBoardBroadcasting;
                setIsDemoBoardBroadcasting(nextState);

                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                if (nextState) {
                    await window.fbUtils.setDoc(roomDocRef, { teacherDemoBoard: teacherDemoBoard || 'empty' }, { merge: true });
                    showToast("已將教師白板作品即時廣播至每一位學生螢幕！", "success");
                } else {
                    await window.fbUtils.setDoc(roomDocRef, { teacherDemoBoard: null }, { merge: true });
                    showToast("已收回教師白板廣播", "info");
                }
            };

            const handleDemoBoardChange = async (dataUrl) => {
                if (isDemoBoardBroadcasting) {
                    const appId = "omit-8c173";
                    const db = window.fbDb;
                    const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                    await window.fbUtils.setDoc(roomDocRef, { teacherDemoBoard: dataUrl }, { merge: true });
                }
            };

            // Download student recordings batch
            const handleDownloadAllAudio = async () => {
                const audioSubmissions = Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:audio'));
                if (audioSubmissions.length === 0) {
                    showToast("目前尚無學生提交錄音！", "error");
                    return;
                }

                try {
                    const zip = new JSZip();
                    const folder = zip.folder(`課堂錄音_房號${roomCode}`);

                    audioSubmissions.forEach((res) => {
                        const base64Data = res.answer.split(',')[1];
                        const fileName = `${res.seatNumber.toString().padStart(2, '0')}_${res.name || '學生'}.webm`;
                        folder.file(fileName, base64Data, { base64: true });
                    });

                    const content = await zip.generateAsync({ type: "blob" });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(content);
                    link.download = `OMIT_全班學生錄音_房號${roomCode}.zip`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    showToast(`已打包並下載 ${audioSubmissions.length} 位學生的語音檔案！`, "success");
                } catch (err) {
                    console.error("ZIP creation error:", err);
                    showToast("打包錄音檔案失敗！", "error");
                }
            };

            const handleClearQuestion = async () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: null }, { merge: true });
                showToast('已結束當前題目', 'info');
            };

            const toggleLockMode = async () => {
                const newLock = !lockAfterSubmit;
                setLockAfterSubmit(newLock);
                if (activeQuestion) {
                    const updatedQ = { ...activeQuestion, lockAfterSubmit: newLock };
                    publishQuestionToFirestore(updatedQ);
                    showToast(newLock ? "已鎖定答案（禁止修改）" : "已開放學生修改答案", "info");
                }
            };

            const handleBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setWhiteboardBg(evt.target.result);
                        showToast("已成功載入白板背景圖片！", "success");
                    };
                    reader.readAsDataURL(file);
                }
            };

            // Broadcast individual student submission to class
            const handleBroadcastSubmission = async (studentRes) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatedQ = { ...activeQuestion, broadcastedSubmission: studentRes };
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                showToast(`已成功廣播 ${studentRes.name} 的作品至全班進行互評！`, "success");
            };

            const handleCancelBroadcast = async () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatedQ = { ...activeQuestion, broadcastedSubmission: null };
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                showToast("已取消作品廣播", "info");
            };

            // Item 9: Spin wheel random selector
            const handleSpinRandom = () => {
                if (isSpinning) return;
                const start = parseInt(rangeStart) || 1;
                const end = parseInt(rangeEnd) || 36;
                const available = [];
                for (let i = start; i <= end; i++) {
                    if (!drawnNumbers.includes(i)) available.push(i);
                }

                if (available.length === 0) {
                    showToast("此範圍內所有學號皆已被抽出！請點擊重置。", "error");
                    return;
                }

                setIsSpinning(true);
                let counter = 0;
                const maxIntervals = 20;

                const timer = setInterval(() => {
                    const temp = available[Math.floor(Math.random() * available.length)];
                    setCurrentDrawn(temp);
                    playSound('spin');
                    counter++;

                    if (counter >= maxIntervals) {
                        clearInterval(timer);
                        const finalPicked = available[Math.floor(Math.random() * available.length)];
                        setCurrentDrawn(finalPicked);
                        setDrawnNumbers(prev => [...prev, finalPicked]);
                        setIsSpinning(false);
                        playSound('win');
                    }
                }, 100);
            };

            // Items 17 & 20: CSV Export for challenge and all quiz activities
            const handleExportCSVReport = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生紀錄可供匯出！", "error");
                    return;
                }

                let csvContent = "\uFEFF";
                csvContent += "學號,學生姓名,加入時間";

                historyQuestions.forEach((q, idx) => {
                    const cleanText = (q.text || getModeLabel(q.mode)).replace(/"/g, '""');
                    if (q.mode === 'CHALLENGE' && q.challenge) {
                        csvContent += `,第${idx + 1}題[挑戰題:${q.challenge.title}得分],第${idx + 1}題[正確率],第${idx + 1}題[用時(秒)]`;
                    } else {
                        csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]: "${cleanText}"`;
                    }
                });
                csvContent += "\n";

                const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

                sortedStudents.forEach((stu) => {
                    const cleanName = (stu.name || '').replace(/"/g, '""');
                    csvContent += `"${stu.seatNumber}號","${cleanName}","${stu.joinTime || ''}"`;
                    
                    historyQuestions.forEach((q) => {
                        const resKey = `${q.id}_${stu.id}`;
                        const res = responses[resKey];
                        
                        if (res && res.answer !== undefined && res.answer !== null) {
                            if (q.mode === 'CHALLENGE' && res.scoreDetails) {
                                csvContent += `,"${res.scoreDetails.totalScore} / ${q.challenge.totalScore}分","${res.scoreDetails.percentage}%","${res.duration || 0}秒"`;
                            } else {
                                let ansVal = res.answer;
                                if (typeof ansVal === 'string' && ansVal.startsWith('data:image')) ansVal = '[圖像白板答案]';
                                if (typeof ansVal === 'string' && ansVal.startsWith('data:audio')) ansVal = '[語音錄音檔案]';
                                const cleanAns = String(ansVal).replace(/"/g, '""');
                                csvContent += `,"${cleanAns} (用時:${res.duration || 0}s)"`;
                            }
                        } else {
                            if (q.mode === 'CHALLENGE') {
                                csvContent += `,"未作答","0%","0秒"`;
                            } else {
                                csvContent += `,"未作答"`;
                            }
                        }
                    });
                    csvContent += "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `OMIT_挑戰題與互動學習成績表_房號${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("📥 已成功匯出 CSV 成績試算表！", "success");
            };

            // Leaderboard sort
            const leaderboard = useMemo(() => {
                return Object.values(currentQuestionResponses)
                    .filter(r => r.duration !== undefined)
                    .sort((a, b) => {
                        if (activeQuestion?.mode === 'CHALLENGE') {
                            const scoreA = a.scoreDetails?.totalScore || 0;
                            const scoreB = b.scoreDetails?.totalScore || 0;
                            if (scoreB !== scoreA) return scoreB - scoreA;
                        }
                        return parseFloat(a.duration) - parseFloat(b.duration);
                    });
            }, [currentQuestionResponses, activeQuestion]);

            const whiteboardSubmissions = useMemo(() => {
                return Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:image'));
            }, [currentQuestionResponses]);

            const shortAnswerSubmissions = useMemo(() => {
                return Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && !r.answer.startsWith('data:'));
            }, [currentQuestionResponses]);

            const challengeScoresAreReleased = useMemo(() => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return true;
                return !!(activeQuestion.challenge?.releaseInstant || activeQuestion.challenge?.scoresReleased);
            }, [activeQuestion]);

            return (
                <div class="min-h-screen pb-12">
                    {/* Item 9: Top Title Renamed */}
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 py-3">
                        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                            <div class="flex items-center space-x-3">
                                <span class="bg-slate-900 text-white font-black px-3 py-1.5 rounded-xl text-lg">OMIT</span>
                                <div>
                                    <h1 class="font-bold text-slate-800 text-base md:text-lg flex items-center gap-2">
                                        宣道會陳元喜小學OMIT互動課堂
                                        <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1 rounded-full font-mono font-bold">
                                            房號：{roomCode}
                                        </span>
                                    </h1>
                                </div>
                            </div>

                            <div class="flex flex-wrap items-center gap-2">
                                {/* Item 11: Realtime Online Students Counter Label */}
                                <button 
                                    onClick={() => setShowQRModal(true)}
                                    class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-2 rounded-xl border border-indigo-200 text-xs md:text-sm flex items-center space-x-1.5 transition"
                                >
                                    <span>📱 QR Code</span>
                                    <span class="bg-indigo-200 text-indigo-800 px-1.5 py-0.5 rounded-md font-bold text-xs">
                                        在線: {studentsList.length}人
                                    </span>
                                </button>

                                <button 
                                    onClick={() => setShowStudentListModal(true)}
                                    class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold px-3 py-2 rounded-xl border border-emerald-200 text-xs md:text-sm flex items-center space-x-1.5 transition"
                                >
                                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                                    <span>學生監控：{studentsList.length} 人</span>
                                </button>

                                {/* Item 9: Random Student Selector Button */}
                                <button 
                                    onClick={() => setShowRandomModal(true)}
                                    class="bg-purple-50 hover:bg-purple-100 text-purple-700 font-bold px-3 py-2 rounded-xl border border-purple-200 text-xs md:text-sm transition"
                                >
                                    🎲 抽選學生
                                </button>

                                {/* Item 21: Teacher Whiteboard Button placed right next to Random Selector */}
                                <button 
                                    onClick={() => setShowDemoBoardModal(true)}
                                    class={`px-3 py-2 rounded-xl border text-xs md:text-sm font-bold flex items-center space-x-1.5 transition ${
                                        isDemoBoardBroadcasting 
                                        ? 'bg-purple-600 text-white border-purple-700 shadow-md animate-pulse' 
                                        : 'bg-purple-100 hover:bg-purple-200 text-purple-900 border-purple-300'
                                    }`}
                                >
                                    <span>🎨 示範白板</span>
                                    {isDemoBoardBroadcasting && <span class="bg-red-500 text-white text-[10px] px-1 rounded font-black">廣播中</span>}
                                </button>

                                {/* Item 10: Enhanced Timer Tool */}
                                <button 
                                    onClick={() => setShowTimerModal(true)}
                                    class={`px-3 py-2 rounded-xl border text-xs md:text-sm font-bold flex items-center space-x-1.5 transition ${
                                        timerActive 
                                        ? 'bg-amber-500 text-white border-amber-600 animate-pulse' 
                                        : 'bg-amber-50 hover:bg-amber-100 text-amber-800 border-amber-200'
                                    }`}
                                >
                                    <span>⏱️ 計時器</span>
                                    {timerSeconds > 0 && (
                                        <span class="bg-white/20 font-mono text-xs px-1.5 py-0.5 rounded">
                                            {Math.floor(timerSeconds / 60)}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                        </span>
                                    )}
                                </button>

                                {/* Item 20: CSV Export Button */}
                                <button 
                                    onClick={handleExportCSVReport}
                                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-2 rounded-xl shadow-sm text-xs md:text-sm transition flex items-center gap-1"
                                >
                                    <span>📥 匯出試算表 (.csv)</span>
                                </button>

                                <button 
                                    onClick={handleExitRoom}
                                    class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2 rounded-xl border border-rose-200 text-xs md:text-sm transition"
                                >
                                    🚪 退出課室
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Container */}
                    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

                        {/* Question Mode Grid */}
                        <div class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-9 gap-2.5">
                            {[
                                { id: 'CHOICE', label: '選擇題', icon: '🔘' },
                                { id: 'TF', label: '是非題', icon: '⭕' },
                                { id: 'SHORT', label: '短答題', icon: '✍️' },
                                { id: 'DRAW', label: '白板題', icon: '🎨' },
                                { id: 'BUZZER', label: '搶答題', icon: '🚨' },
                                { id: 'AUDIO', label: '錄音題', icon: '🎤' },
                                { id: 'CHALLENGE', label: '挑戰題', icon: '🏆' },
                                { id: 'COOP', label: '合作題', icon: '🤝' },
                                { id: 'LINK', label: '派送連結', icon: '🔗' }
                            ].map((mode) => (
                                <button 
                                    key={mode.id}
                                    onClick={() => setSelectedMode(mode.id)}
                                    class={`p-3 rounded-2xl font-extrabold border-2 transition-all text-center flex flex-col items-center justify-center space-y-1 shadow-sm active:scale-95 ${
                                        selectedMode === mode.id 
                                        ? 'bg-slate-900 text-white border-slate-900 ring-4 ring-slate-200' 
                                        : 'bg-white text-slate-700 border-slate-200 hover:border-slate-300 hover:bg-slate-50'
                                    }`}
                                >
                                    <span class="text-xl">{mode.icon}</span>
                                    <span class="text-xs font-black">{mode.label}</span>
                                </button>
                            ))}
                        </div>

                        {/* Mode Configuration & Question Setup */}
                        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                            <div class="flex flex-wrap items-center justify-between border-b pb-3 gap-2">
                                <h2 class="font-black text-slate-800 text-lg flex items-center gap-2">
                                    <span>模式設定：{getModeLabel(selectedMode)}</span>
                                </h2>

                                {selectedMode !== 'CHALLENGE' && selectedMode !== 'COOP' && selectedMode !== 'DRAW' && (
                                    <div class="flex items-center space-x-2 bg-slate-100 p-1.5 rounded-xl">
                                        <span class="text-xs font-bold text-slate-600 pl-2">提交後允許修改：</span>
                                        <button 
                                            onClick={toggleLockMode}
                                            class={`px-3 py-1 rounded-lg text-xs font-bold transition ${!lockAfterSubmit ? 'bg-emerald-500 text-white' : 'bg-slate-300 text-slate-600'}`}
                                        >
                                            {!lockAfterSubmit ? '已開放修改' : '已鎖定 (預設)'}
                                        </button>
                                    </div>
                                )}
                            </div>

                            {selectedMode === 'CHOICE' && (
                                <div class="flex items-center space-x-4">
                                    <label class="text-sm font-bold text-slate-700">選項數量：</label>
                                    {[4, 5].map((cnt) => (
                                        <button 
                                            key={cnt} 
                                            onClick={() => setChoiceCount(cnt)}
                                            class={`px-3 py-1.5 rounded-xl font-bold text-sm border ${choiceCount === cnt ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-700'}`}
                                        >
                                            {cnt} 個選項 ({cnt === 4 ? 'A-D' : 'A-E'})
                                        </button>
                                    ))}
                                </div>
                            )}

                            {/* Item 22: Cooperation Quiz ("合作題") Config Panel */}
                            {selectedMode === 'COOP' && (
                                <div class="bg-gradient-to-r from-teal-50 to-emerald-50 border-2 border-teal-200 p-5 rounded-2xl space-y-4">
                                    <div class="flex items-center justify-between border-b border-teal-200 pb-2">
                                        <h3 class="font-black text-teal-900 text-base">🤝 合作題 (分組競賽模式)</h3>
                                        <button 
                                            type="button"
                                            onClick={handleDownloadChallengeTemplate}
                                            class="bg-teal-700 hover:bg-teal-800 text-white font-bold text-xs px-3.5 py-1.5 rounded-xl transition shadow"
                                        >
                                            📄 下載評估範本Word檔
                                        </button>
                                    </div>

                                    <div class="space-y-3 bg-white p-4 rounded-xl border border-teal-200">
                                        <label class="block text-xs font-bold text-slate-700">1. 上載合作題評估 Word檔 (.docx)：</label>
                                        <input 
                                            type="file" 
                                            accept=".docx,.txt"
                                            onChange={(e) => handleWordFileUpload(e, true)}
                                            class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-teal-600 file:text-white cursor-pointer"
                                        />

                                        {coopData && (
                                            <div class="bg-teal-50/80 p-3 rounded-xl border border-teal-300 space-y-2 text-xs">
                                                <div class="font-bold text-teal-900">✏️ 教師編輯/確認評估內容 ({coopData.title} - 共{coopData.questions.length}題)：</div>
                                                {coopData.questions.map((q, idx) => (
                                                    <div key={idx} class="bg-white p-2 rounded border flex items-center justify-between">
                                                        <span>{q.num}. {q.text} (正確答案: {q.answer})</span>
                                                        <button 
                                                            type="button" 
                                                            onClick={() => setCoopData(prev => ({ ...prev, questions: prev.questions.filter((_, i) => i !== idx) }))}
                                                            class="text-red-500 hover:text-red-700 font-bold"
                                                        >
                                                            🗑️ 刪除
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    {/* Stages Control */}
                                    <div class="flex items-center space-x-3 pt-2">
                                        <button 
                                            onClick={handleRandomGroupAssignment}
                                            class="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold px-5 py-3 rounded-xl shadow-md transition"
                                        >
                                            🎲 1. 進行 3-4 人隨機分組並發送給學生
                                        </button>

                                        {coopStage === 'GROUP' && (
                                            <button 
                                                onClick={handleStartCoopRace}
                                                class="bg-amber-500 hover:bg-amber-600 text-white font-extrabold px-6 py-3 rounded-xl shadow-lg transition animate-pulse"
                                            >
                                                🚀 2. 開始比賽 (播放 Race Music)
                                            </button>
                                        )}

                                        {coopStage === 'RACE' && (
                                            <button 
                                                onClick={toggleRaceMusic}
                                                class="bg-slate-800 hover:bg-slate-900 text-white font-bold px-4 py-3 rounded-xl transition"
                                            >
                                                {isRaceMusicPlaying ? '⏸️ 暫停背景音樂' : '▶️ 播放背景音樂'}
                                            </button>
                                        )}
                                    </div>

                                    {/* Display group allocation list in GROUP stage */}
                                    {coopGroups.length > 0 && (
                                        <div class="space-y-3 pt-3 border-t border-teal-200">
                                            <div class="flex justify-between items-center">
                                                <h4 class="font-extrabold text-teal-900 text-sm">各分組名單：</h4>
                                                <button 
                                                    onClick={handleRandomGroupAssignment}

        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, teacherDemoBoard, showToast, onExit }) {
            const [textAnswer, setTextAnswer] = useState('');
            const [selectedOption, setSelectedOption] = useState('');
            const [hasSubmitted, setHasSubmitted] = useState(false);
            const [submitDuration, setSubmitDuration] = useState(0);

            // Audio recording states
            const [isRecording, setIsRecording] = useState(false);
            const [audioBlobUrl, setAudioBlobUrl] = useState(null);
            const [audioBase64, setAudioBase64] = useState(null);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            // Challenge Mode Student Answers & Score calculation
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [challengeScoreResult, setChallengeScoreResult] = useState(null);
            const [challengeTimeLeft, setChallengeTimeLeft] = useState(null);

            const myResponseKey = activeQuestion ? `${activeQuestion.id}_${studentId}` : '';
            const existingResponse = responses[myResponseKey];

            // Reset student inputs on new question
            useEffect(() => {
                setTextAnswer('');
                setSelectedOption('');
                setHasSubmitted(false);
                setAudioBlobUrl(null);
                setAudioBase64(null);
                setChallengeAnswers({});
                setChallengeScoreResult(null);

                if (existingResponse) {
                    setHasSubmitted(true);
                    if (existingResponse.scoreDetails) setChallengeScoreResult(existingResponse.scoreDetails);
                }
            }, [activeQuestion?.id]);

            // Challenge timer countdown logic on student side
            useEffect(() => {
                if (activeQuestion?.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer && !hasSubmitted) {
                    const elapsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                    const remaining = Math.max(0, activeQuestion.challenge.timeLimit - elapsed);
                    setChallengeTimeLeft(remaining);

                    const timer = setInterval(() => {
                        setChallengeTimeLeft((prev) => {
                            if (prev <= 1) {
                                clearInterval(timer);
                                autoSubmitChallenge();
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);

                    return () => clearInterval(timer);
                }
            }, [activeQuestion?.id, hasSubmitted]);

            // Audio recording handlers
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const url = URL.createObjectURL(audioBlob);
                        setAudioBlobUrl(url);

                        const reader = new FileReader();
                        reader.onloadend = () => {
                            setAudioBase64(reader.result);
                        };
                        reader.readAsDataURL(audioBlob);
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);

                    // Auto-stop recording after 10 seconds
                    setTimeout(() => {
                        if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
                            stopRecording();
                        }
                    }, 10000);
                } catch (e) {
                    console.error("Mic error:", e);
                    showToast("無法取得麥克風存取權限！", "error");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const handleClearAudio = () => {
                setAudioBlobUrl(null);
                setAudioBase64(null);
            };

            // Generic answer submission handler
            const submitAnswer = async (answerVal, scoreDetailsObj = null) => {
                if (!activeQuestion) return;

                const durationSec = ((Date.now() - activeQuestion.startTime) / 1000).toFixed(1);
                setSubmitDuration(durationSec);

                const responseData = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: answerVal,
                    duration: durationSec,
                    timestamp: Date.now(),
                    scoreDetails: scoreDetailsObj
                };

                const appId = "omit-8c173";
                const db = window.fbDb;
                const docRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', myResponseKey);

                await window.fbUtils.setDoc(docRef, responseData);
                setHasSubmitted(true);
            };

            // Automatic Challenge Auto-Submit when time reaches 00:00
            const autoSubmitChallenge = () => {
                if (hasSubmitted || !activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;

                const qList = activeQuestion.challenge.questions;
                let correctCount = 0;

                qList.forEach((q, idx) => {
                    const studentAns = challengeAnswers[idx];
                    if (studentAns === q.answer) correctCount++;
                });

                const scorePerQ = activeQuestion.challenge.totalScore / qList.length;
                const totalScore = Math.round(correctCount * scorePerQ);
                const percentage = Math.round((correctCount / qList.length) * 100);

                const scoreObj = {
                    totalScore,
                    correctCount,
                    totalQuestions: qList.length,
                    percentage,
                    answers: challengeAnswers
                };

                setChallengeScoreResult(scoreObj);
                submitAnswer(challengeAnswers, scoreObj);
                showToast("⏰ 限時時間到！已為您自動提交挑戰題答卷！", "info");
            };

            const handleManualSubmitChallenge = () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;

                const qList = activeQuestion.challenge.questions;
                let correctCount = 0;

                qList.forEach((q, idx) => {
                    const studentAns = challengeAnswers[idx];
                    if (studentAns === q.answer) correctCount++;
                });

                const scorePerQ = activeQuestion.challenge.totalScore / qList.length;
                const totalScore = Math.round(correctCount * scorePerQ);
                const percentage = Math.round((correctCount / qList.length) * 100);

                const scoreObj = {
                    totalScore,
                    correctCount,
                    totalQuestions: qList.length,
                    percentage,
                    answers: challengeAnswers
                };

                setChallengeScoreResult(scoreObj);
                submitAnswer(challengeAnswers, scoreObj);
            };

            // Cooperation Quiz ("合作題") Student Option Click Handler
            const handleCoopOptionClick = async (optionLetter) => {
                if (!activeQuestion || activeQuestion.mode !== 'COOP' || activeQuestion.coopStage !== 'RACE') return;

                const myGroup = activeQuestion.coopGroups.find(g => g.members.some(m => m.id === studentId));
                if (!myGroup) return;

                const currentScore = activeQuestion.coopScores[myGroup.id] || 0;
                const currentQuestionObj = activeQuestion.coopData.questions[currentScore];

                if (!currentQuestionObj) return;

                const isCorrect = optionLetter === currentQuestionObj.answer;
                let newScore = currentScore;

                if (isCorrect) {
                    newScore = currentScore + 1;
                    playSound('win');
                } else {
                    newScore = 0; // Penalty reset to start
                    playSound('buzzer');
                    showToast("❌ 答錯了！該組進度倒扣回到起點，請重頭作答！", "error");
                }

                const updatedScores = { ...activeQuestion.coopScores, [myGroup.id]: newScore };
                let winnerGroup = null;

                if (newScore >= activeQuestion.coopData.questions.length) {
                    winnerGroup = myGroup;
                    playSound('win');
                }

                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                const updatedQ = {
                    ...activeQuestion,
                    coopScores: updatedScores,
                    coopWinner: winnerGroup
                };

                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
            };

            // Check student's assigned role in Cooperation Quiz
            const myCoopGroup = useMemo(() => {
                if (!activeQuestion || activeQuestion.mode !== 'COOP' || !activeQuestion.coopGroups) return null;
                return activeQuestion.coopGroups.find(g => g.members.some(m => m.id === studentId));
            }, [activeQuestion, studentId]);

            const myCoopMemberIndex = useMemo(() => {
                if (!myCoopGroup) return -1;
                return myCoopGroup.members.findIndex(m => m.id === studentId);
            }, [myCoopGroup, studentId]);

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col justify-between p-4 md:p-6">
                    {/* Header */}
                    <header class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex justify-between items-center max-w-3xl mx-auto w-full">
                        <div class="flex items-center space-x-2">
                            <span class="bg-indigo-600 text-white font-black text-xs px-2.5 py-1 rounded-lg">OMIT 學生端</span>
                            <span class="font-extrabold text-slate-800 text-sm">
                                {seatNumber}號 - {studentName || '學生'}
                            </span>
                        </div>
                        <button onClick={onExit} class="text-xs font-bold text-slate-400 hover:text-slate-600">
                            退出
                        </button>
                    </header>

                    {/* Main Interactive Screen */}
                    <main class="max-w-3xl mx-auto w-full flex-1 my-4 flex flex-col justify-center">

                        {/* Item 21 & 32: Display Teacher Live Demonstration Whiteboard if broadcasted */}
                        {teacherDemoBoard && (
                            <div class="bg-purple-900 text-white rounded-3xl p-5 shadow-2xl space-y-3 mb-4 animate-fade-in border-4 border-purple-400">
                                <div class="flex justify-between items-center border-b border-purple-700 pb-2">
                                    <span class="font-black text-sm flex items-center gap-2">
                                        <span class="w-3 h-3 rounded-full bg-rose-500 animate-ping"></span>
                                        <span>📢 教師即時示範白板廣播中</span>
                                    </span>
                                </div>
                                <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden border">
                                    <img src={teacherDemoBoard} class="w-full h-full object-contain" alt="教師示範白板" />
                                </div>
                            </div>
                        )}

                        {/* Item 2: Broadcasted Student Submission for Peer Review */}
                        {activeQuestion?.broadcastedSubmission && (
                            <div class="bg-purple-50 rounded-3xl p-5 shadow-lg border-2 border-purple-300 space-y-3 mb-4">
                                <div class="flex justify-between items-center border-b border-purple-200 pb-2">
                                    <span class="font-black text-purple-900 text-sm">📢 全班作品廣播 (學生互評)</span>
                                    <span class="text-xs font-bold bg-purple-200 text-purple-800 px-2.5 py-1 rounded-lg">
                                        作者：{activeQuestion.broadcastedSubmission.seatNumber}號 {activeQuestion.broadcastedSubmission.name}
                                    </span>
                                </div>
                                {typeof activeQuestion.broadcastedSubmission.answer === 'string' && activeQuestion.broadcastedSubmission.answer.startsWith('data:image') ? (
                                    <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden border">
                                        <img src={activeQuestion.broadcastedSubmission.answer} class="w-full h-full object-contain" alt="廣播作品" />
                                    </div>
                                ) : (
                                    <div class="p-4 bg-white rounded-2xl font-bold text-lg text-slate-800 text-center border">
                                        {activeQuestion.broadcastedSubmission.answer}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Active Question Display */}
                        {activeQuestion ? (
                            <div class="bg-white rounded-3xl p-6 shadow-xl border border-slate-200 space-y-6">

                                {/* Question Title Bar */}
                                <div class="border-b pb-4 flex justify-between items-start gap-2">
                                    <div>
                                        <span class="text-xs font-black text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-lg uppercase tracking-wider">
                                            {getModeLabel(activeQuestion.mode)}
                                        </span>
                                        <h2 class="text-xl font-black text-slate-800 mt-2">
                                            {activeQuestion.text}
                                        </h2>
                                    </div>

                                    {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer && (
                                        <div class="bg-amber-100 text-amber-900 px-3 py-1.5 rounded-xl font-mono font-black text-sm border border-amber-300">
                                            ⏱️ 限時: {Math.floor(challengeTimeLeft / 60)}:{(challengeTimeLeft % 60).toString().padStart(2, '0')}
                                        </div>
                                    )}
                                </div>

                                {/* Item 22: Cooperation Quiz Student UI */}

                                                <div class={`p-4 rounded-2xl border ${myCoopGroup.bg} text-center space-y-1`}>

                                                    <div class="font-black text-lg">你屬於：{myCoopGroup.name}</div>
                                                    <div class="text-xs font-bold text-slate-600">
                                                        提示：盡快與你的組員會合! 比賽即將開始!

                                                </div>

                                                {/* Winner Announcement if available */}

                                                            恭喜勝出組別：{activeQuestion.coopWinner.emoji} {activeQuestion.coopWinner.name}！
                                                        </h3>
                                                        <div class="text-sm font-bold text-amber-900">
                                                            組員：{activeQuestion.coopWinner.members.map(m => `${m.seatNumber}號 ${m.name}`).join('、')}

                                                    </div>

                                                        {/* Split question details across group members */}
                                                        {(() => {
                                                            const currentScore = activeQuestion.coopScores[myCoopGroup.id] || 0;
                                                            const qObj = activeQuestion.coopData.questions[currentScore];
                                                            if (!qObj) return <div class="font-bold text-emerald-600 text-center">🎉 已完成所有合作題！</div>;
