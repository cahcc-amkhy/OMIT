        // --- Student Interface Component ---
        function StudentInterface({ 
            roomCode, studentName, seatNumber, studentId, activeQuestion, responses, 
            coopState, teacherWhiteboardBroadcast, showToast, onExit 
        }) {
            const [selectedAnswer, setSelectedAnswer] = useState('');
            const [shortAnswerText, setShortAnswerText] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submittedSuccess, setSubmittedSuccess] = useState(false);

            // Audio recorder states
            const [isRecording, setIsRecording] = useState(false);
            const [audioBlobUrl, setAudioBlobUrl] = useState(null);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            // Challenge answers map: { [qIdx]: 'A' }
            const [challengeAnswers, setChallengeAnswers] = useState({});

            const currentResponseKey = activeQuestion ? `${activeQuestion.id}_${studentId}` : null;
            const myResponse = currentResponseKey ? responses[currentResponseKey] : null;

            useEffect(() => {
                if (myResponse) {
                    setSubmittedSuccess(true);
                } else {
                    setSubmittedSuccess(false);
                    setSelectedAnswer('');
                    setShortAnswerText('');
                    setAudioBlobUrl(null);
                    setChallengeAnswers({});
                }
            }, [activeQuestion?.id, myResponse]);

            // Submit handler
            const handleSubmitAnswer = async (ansValue) => {
                if (!activeQuestion) return;
                setIsSubmitting(true);

                const durationSec = Math.max(1, Math.round((Date.now() - activeQuestion.startTime) / 1000));
                
                let scoreDetails = null;
                if (activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge) {
                    let totalScoreEarned = 0;
                    const qs = activeQuestion.challenge.questions;
                    qs.forEach((q, idx) => {
                        if (ansValue[idx] === q.answer) {
                            totalScoreEarned += Math.round(activeQuestion.challenge.totalScore / qs.length);
                        }
                    });
                    scoreDetails = {
                        totalScore: totalScoreEarned,
                        percentage: Math.round((totalScoreEarned / activeQuestion.challenge.totalScore) * 100)
                    };
                }

                const resObj = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: ansValue,
                    duration: durationSec,
                    timestamp: Date.now(),
                    scoreDetails: scoreDetails
                };

                const appId = "omit-8c173";
                const db = window.fbDb;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', `${activeQuestion.id}_${studentId}`);
                await window.fbUtils.setDoc(resDocRef, resObj);

                setIsSubmitting(false);
                setSubmittedSuccess(true);
                showToast("已成功提交答案！讚賞你的努力！", "success");
            };

            // Audio recording triggers
            const startAudioRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            setAudioBlobUrl(reader.result);
                        };
                        reader.readAsDataURL(blob);
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                } catch (e) {
                    console.error("Mic access error:", e);
                    showToast("無法存取麥克風，請檢查權限！", "error");
                }
            };

            const stopAudioRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            // Cooperative Student Logic
            const myCoopGroup = useMemo(() => {
                if (!coopState || !coopState.groups) return null;
                return coopState.groups.find(g => g.members.some(m => m.id === studentId));
            }, [coopState, studentId]);

            const currentCoopQuestion = useMemo(() => {
                if (!coopState || !myCoopGroup || !coopState.questions) return null;
                return coopState.questions[myCoopGroup.currentQIndex];
            }, [coopState, myCoopGroup]);

            const coopMemberRoleIndex = useMemo(() => {
                if (!myCoopGroup) return 0;
                return myCoopGroup.members.findIndex(m => m.id === studentId);
            }, [myCoopGroup, studentId]);

            const handleCoopAnswerSubmit = async (letter) => {
                if (!coopState || !myCoopGroup || !currentCoopQuestion) return;

                const isCorrect = letter === currentCoopQuestion.answer;
                const totalQs = coopState.questions.length;
                
                let nextIdx = myCoopGroup.currentQIndex;
                let isWinner = false;

                if (isCorrect) {
                    nextIdx += 1;
                    if (nextIdx >= totalQs) isWinner = true;
                } else {
                    nextIdx = 0; // Return to start if incorrect
                    showToast("答錯了！需要重新由第一題開始，加油！", "error");
                }

                const updatedGroups = coopState.groups.map(g => {
                    if (g.id === myCoopGroup.id) {
                        return {
                            ...g,
                            currentQIndex: nextIdx,
                            isFinished: isWinner
                        };
                    }
                    return g;
                });

                const newCoopState = {
                    ...coopState,
                    groups: updatedGroups,
                    winnerGroup: isWinner ? myCoopGroup : coopState.winnerGroup
                };

                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { coopState: newCoopState }, { merge: true });

                if (isCorrect) showToast("回答正確！團隊推進下一題！", "success");
            };

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col justify-between p-4 md:p-6">
                    {/* Header */}
                    <header class="bg-white p-4 rounded-3xl shadow-sm border border-slate-200 flex items-center justify-between mb-4">
                        <div class="flex items-center space-x-3">
                            <span class="bg-indigo-600 text-white font-black px-3 py-1.5 rounded-xl text-sm">OMIT 學生端</span>
                            <span class="font-bold text-slate-800 text-base">{seatNumber} 號 - {studentName || '同學'}</span>
                        </div>
                        <button onClick={onExit} class="text-xs font-bold text-rose-600 hover:text-rose-800">
                            🚪 離開課堂
                        </button>
                    </header>

                    {/* Teacher Demo Whiteboard Broadcast overlay on Student Screen */}
                    {teacherWhiteboardBroadcast && (
                        <div class="mb-4 bg-purple-900 text-white p-4 rounded-3xl shadow-2xl border-4 border-purple-400 animate-pulse-subtle">
                            <div class="text-xs font-black text-purple-200 uppercase tracking-widest mb-2 flex items-center gap-2">
                                <span>📢 老師即時示範白板：</span>
                            </div>
                            <div class="w-full aspect-16-9 bg-white rounded-2xl overflow-hidden shadow-inner">
                                <img src={teacherWhiteboardBroadcast} alt="老師示範" class="w-full h-full object-contain" />
                            </div>
                        </div>
                    )}

                    {/* Peer Review Submission Broadcast overlay on Student Screen */}
                    {activeQuestion?.broadcastedSubmission && (
                        <div class="mb-4 bg-indigo-900 text-white p-5 rounded-3xl shadow-2xl border-4 border-indigo-400 animate-pulse-subtle space-y-3">
                            <div class="text-xs font-black text-indigo-200 uppercase tracking-widest flex items-center gap-2">
                                <span>📢 老師正在廣播同學的作品進行互評：</span>
                                <span class="bg-indigo-700 text-white px-2.5 py-0.5 rounded-full font-bold">
                                    {activeQuestion.broadcastedSubmission.seatNumber}號 {activeQuestion.broadcastedSubmission.name}
                                </span>
                            </div>

                            <div class="w-full bg-white rounded-2xl overflow-hidden p-4 shadow-inner text-slate-900">
                                {activeQuestion.broadcastedSubmission.answer && typeof activeQuestion.broadcastedSubmission.answer === 'string' && activeQuestion.broadcastedSubmission.answer.startsWith('data:image') ? (
                                    <div class="w-full aspect-16-9 bg-white flex items-center justify-center">
                                        <img src={activeQuestion.broadcastedSubmission.answer} alt="廣播作品" class="w-full h-full object-contain" />
                                    </div>
                                ) : (
                                    <div class="p-6 bg-indigo-50/90 rounded-2xl border border-indigo-200 text-indigo-950 font-black text-2xl leading-relaxed text-center">
                                        “{activeQuestion.broadcastedSubmission.answer}”
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Cooperative Question Display */}
                    {coopState && (
                        <div class="flex-1 bg-white rounded-3xl p-6 shadow-sm border border-emerald-200 space-y-6 flex flex-col justify-between">
                            <div class="flex items-center justify-between border-b pb-3">
                                <h3 class="font-black text-emerald-900 text-lg">🤝 小組合作題：{coopState.title}</h3>
                                {myCoopGroup && (
                                    <span class={`px-3 py-1 text-white font-black text-xs rounded-xl ${myCoopGroup.color}`}>
                                        {myCoopGroup.emoji} {myCoopGroup.name}
                                    </span>
                                )}
                            </div>

                            {coopState.phase === 'GROUPING' && (
                                <div class="text-center py-12 space-y-4">
                                    <div class="text-6xl animate-bounce">{myCoopGroup?.emoji || '🤝'}</div>
                                    <h4 class="text-2xl font-black text-slate-800">你已被分配到【{myCoopGroup?.name}】！</h4>
                                    <p class="text-emerald-700 font-bold text-sm">盡快與你的組員會合！比賽即將開始！</p>
                                </div>
                            )}

                            {coopState.phase === 'MATCH' && currentCoopQuestion && (
                                <div class="space-y-6">
                                    <div class="text-xs font-bold text-slate-400">當前進度：第 {myCoopGroup.currentQIndex + 1} / {coopState.questions.length} 題</div>
                                    
                                    {/* Question content is split across group members */}
                                    {coopMemberRoleIndex % 2 === 0 ? (
                                        <div class="bg-emerald-50 p-6 rounded-2xl border-2 border-emerald-200 text-center space-y-2">
                                            <span class="text-xs font-black text-emerald-600 uppercase">你是題目掌控者：</span>
                                            <div class="text-xl font-black text-slate-800">{currentCoopQuestion.text}</div>
                                            <p class="text-xs text-slate-500 font-bold">請大聲讀出題目給組員，並與組員討論選擇答案！</p>
                                        </div>
                                    ) : (
                                        <div class="bg-indigo-50 p-6 rounded-2xl border-2 border-indigo-200 text-center space-y-2">
                                            <span class="text-xs font-black text-indigo-600 uppercase">你是作答按制者：</span>
                                            <p class="text-xs text-indigo-700 font-bold">請聆聽組員讀出題目並共同決定答案：</p>
                                        </div>
                                    )}

                                    {/* Answer buttons */}
                                    <div class="grid grid-cols-2 gap-3">
                                        {currentCoopQuestion.options.map((opt) => (
                                            <button 
                                                key={opt.letter}
                                                onClick={() => handleCoopAnswerSubmit(opt.letter)}
                                                class="p-4 bg-slate-900 hover:bg-slate-800 text-white font-black rounded-2xl shadow-lg transition text-lg active:scale-95"
                                            >
                                                {opt.letter}. {opt.text}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Standard Active Question Display */}
                    {!coopState && activeQuestion && (
                        <div class="flex-1 bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-6 flex flex-col justify-between">
                            <div class="space-y-4">
                                <div class="flex items-center justify-between border-b pb-3">
                                    <span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-xs font-extrabold">
                                        {getModeLabel(activeQuestion.mode)}
                                    </span>
                                    {submittedSuccess && (
                                        <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200">
                                            ✅ 已成功提交
                                        </span>
                                    )}
                                </div>

                                <h2 class="text-xl font-black text-slate-800 leading-snug">{activeQuestion.text}</h2>

                                {/* CHOICE or TF */}
                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
                                        {activeQuestion.choiceOptions.map((opt) => (
                                            <button 
                                                key={opt}
                                                disabled={submittedSuccess && activeQuestion.lockAfterSubmit}
                                                onClick={() => setSelectedAnswer(opt)}
                                                class={`p-4 rounded-2xl font-black text-lg border-2 transition text-left flex items-center justify-between ${
                                                    selectedAnswer === opt 
                                                    ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' 
                                                    : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                                                }`}
                                            >
                                                <span>{opt}</span>
                                                {selectedAnswer === opt && <span>✓</span>}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {/* SHORT Answer */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-3 pt-2">
                                        <textarea 
                                            rows={4}
                                            disabled={submittedSuccess && activeQuestion.lockAfterSubmit}
                                            placeholder="請在此輸入您的回答..."
                                            value={shortAnswerText}
                                            onChange={(e) => setShortAnswerText(e.target.value)}
                                            class="w-full p-4 rounded-2xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 font-medium text-base"
                                        />
                                    </div>
                                )}

                                {/* DRAW Whiteboard */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <div class="pt-2">
                                        <WhiteboardCanvas 
                                            initialBg={activeQuestion.whiteboardBg}
                                            disabled={submittedSuccess && activeQuestion.lockAfterSubmit}
                                            onConfirm={(imgData) => handleSubmitAnswer(imgData)}
                                        />
                                    </div>
                                )}

                                {/* BUZZER */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="py-10 text-center">
                                        <button 
                                            disabled={submittedSuccess}
                                            onClick={() => handleSubmitAnswer('搶答成功！')}
                                            class="w-48 h-48 rounded-full bg-rose-600 hover:bg-rose-700 disabled:bg-slate-300 text-white font-black text-3xl shadow-2xl transition transform active:scale-90 border-8 border-rose-300 animate-pulse mx-auto"
                                        >
                                            {submittedSuccess ? '已搶答' : '🚨 搶答！'}
                                        </button>
                                    </div>
                                )}

                                {/* AUDIO Question */}
                                {activeQuestion.mode === 'AUDIO' && (
                                    <div class="space-y-4 pt-2 text-center">
                                        {!audioBlobUrl ? (
                                            <button 
                                                onClick={isRecording ? stopAudioRecording : startAudioRecording}
                                                class={`px-8 py-4 rounded-2xl font-black text-lg transition shadow-lg ${isRecording ? 'bg-rose-600 text-white animate-pulse' : 'bg-purple-600 hover:bg-purple-700 text-white'}`}
                                            >
                                                {isRecording ? '⏹️ 結束錄音' : '🎤 開始錄音 (最多10秒)'}
                                            </button>
                                        ) : (
                                            <div class="bg-purple-50 p-4 rounded-2xl border border-purple-200 space-y-3">
                                                <audio controls src={audioBlobUrl} class="w-full" />
                                                <div class="flex justify-center space-x-2">
                                                    <button onClick={() => setAudioBlobUrl(null)} class="px-4 py-2 bg-rose-50 text-rose-600 font-bold text-xs rounded-xl border border-rose-200">
                                                        🗑️ 刪除重錄
                                                    </button>
                                                    <button onClick={() => handleSubmitAnswer(audioBlobUrl)} class="px-6 py-2 bg-purple-600 text-white font-bold text-xs rounded-xl shadow">
                                                        ✅ 確認提交錄音
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* CHALLENGE Question */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                    <div class="space-y-5 pt-2">
                                        <div class="font-bold text-slate-700 text-sm">請完成以下 {activeQuestion.challenge.questions.length} 題評估：</div>
                                        {activeQuestion.challenge.questions.map((q, idx) => (
                                            <div key={idx} class="bg-slate-50 p-4 rounded-2xl border space-y-2 text-sm">
                                                <div class="font-bold text-slate-800">第 {q.num || idx + 1} 題: {q.text}</div>
                                                <div class="grid grid-cols-2 gap-2">
                                                    {q.options.map(opt => (
                                                        <button 
                                                            key={opt.letter}
                                                            disabled={submittedSuccess}
                                                            onClick={() => setChallengeAnswers({ ...challengeAnswers, [idx]: opt.letter })}
                                                            class={`p-2.5 rounded-xl font-bold border text-left text-xs transition ${
                                                                challengeAnswers[idx] === opt.letter ? 'bg-amber-600 text-white border-amber-600' : 'bg-white'
                                                            }`}
                                                        >
                                                            {opt.letter}. {opt.text}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {/* LINK Question */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div class="space-y-4 text-center py-4">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div class="w-full aspect-16-9 bg-black rounded-2xl overflow-hidden shadow-lg">
                                                <iframe src={activeQuestion.youtubeEmbed} class="w-full h-full" allow="autoplay; encrypted-media" allowFullScreen></iframe>
                                            </div>
                                        ) : (
                                            <a 
                                                href={activeQuestion.pushedUrl} target="_blank" rel="noreferrer"
                                                class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-black px-6 py-3.5 rounded-2xl shadow-lg transition"
                                            >
                                                開啟連結網站 ↗
                                            </a>
                                        )}
                                    </div>
                                )}
                            </div>

                            {/* Standard Unified Submit Button */}
                            {activeQuestion.mode !== 'DRAW' && activeQuestion.mode !== 'AUDIO' && activeQuestion.mode !== 'BUZZER' && activeQuestion.mode !== 'LINK' && (
                                <div class="pt-4 border-t">
                                    <button 
                                        disabled={submittedSuccess && activeQuestion.lockAfterSubmit}
                                        onClick={() => {
                                            if (activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') handleSubmitAnswer(selectedAnswer);
                                            else if (activeQuestion.mode === 'SHORT') handleSubmitAnswer(shortAnswerText);
                                            else if (activeQuestion.mode === 'CHALLENGE') handleSubmitAnswer(challengeAnswers);
                                        }}
                                        class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-black py-4 rounded-2xl shadow-xl transition active:scale-98 text-lg"
                                    >
                                        ✅ 確認提交答案
                                    </button>
                                </div>
                            )}

                            {/* Unified Feedback Message */}
                            {submittedSuccess && (
                                <div class="bg-emerald-100 border-2 border-emerald-400 p-4 rounded-2xl text-center space-y-1 animate-fade-in mt-4">
                                    <div class="text-emerald-900 font-black text-base">
                                        已提交答案! 讚賞你的努力! 安靜等候老師指示...
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {!coopState && !activeQuestion && (
                        <div class="flex-1 flex flex-col items-center justify-center text-center p-8 bg-white rounded-3xl border border-slate-200 space-y-3">
                            <div class="text-5xl animate-bounce">⏳</div>
                            <h3 class="text-xl font-black text-slate-800">等候老師發佈題目...</h3>
                            <p class="text-xs text-slate-400 font-medium">請保持螢幕開啟，題目發佈後將即時顯示。</p>
                        </div>
                    )}
                </div>
            );
        }

        // Render Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
