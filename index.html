<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Helper label switcher
        function getModeLabel(mode) {
            switch(mode) {
                case 'CHOICE': return '選擇題';
                case 'TF': return '是非題';
                case 'SHORT': return '短答題';
                case 'DRAW': return '白板題';
                case 'BUZZER': return '搶答題';
                case 'AUDIO': return '錄音題';
                case 'CHALLENGE': return '挑戰題';
                case 'COOP': return '合作題';
                case 'LINK': return '派送連結';
                default: return '題目';
            }
        }

        // Helper default prompts for empty question text
        function getDefaultQuestionPrompt(mode) {
            switch(mode) {
                case 'CHOICE': return '請選擇正確答案：';
                case 'TF': return '請判斷下列描述是否正確：';
                case 'SHORT': return '請輸入您的回答：';
                case 'DRAW': return '請在白板上作答或繪圖：';
                case 'BUZZER': return '請準備點擊搶答按鈕！';
                case 'AUDIO': return '請錄製不多於10秒的語音回答：';
                case 'CHALLENGE': return '請在限時內完成以下挑戰題評估：';
                case 'COOP': return '準備進入合作比賽！';
                case 'LINK': return '請點擊或觀看下方派送內容：';
                default: return '請回答問題：';
            }
        }

        // Web Audio API Sound Generator
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                    });
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (
                <div class={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-xl shadow-lg flex items-center space-x-2 text-sm font-medium animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        // Helper to generate a valid Word (.docx) binary Blob using JSZip
        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) {
                throw new Error("JSZip library is not loaded.");
            }
            const zip = new JSZip();

            // [Content_Types].xml
            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            // _rels/.rels
            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            // word/_rels/document.xml.rels
            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            // Escape XML special characters
            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            // Build word/document.xml content
            const paragraphsXml = textLines.map(line => {
                return `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`;
            }).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>
    ${paragraphsXml}
  </w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        // Parse Word doc or text file according to Word template standard
        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];

            let currentQ = null;

            lines.forEach((line) => {
                // Parse Title
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                // Parse Total Score
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                // Question match e.g., "1.以下哪一項不是地球的天然資源?"
                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) {
                        questions.push(currentQ);
                    }
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A' // Default answer, updated below if found
                    };
                    return;
                }

                // Option match e.g., "A. 水資源" or "D. 機械資源*"
                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }

                    currentQ.options.push({
                        letter: letter,
                        text: optText
                    });

                    if (isCorrect) {
                        currentQ.answer = letter;
                    }
                }
            });

            if (currentQ && currentQ.options.length > 0) {
                questions.push(currentQ);
            }

            // Fallback default sample if empty or failed parsing
            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1,
                            text: "以下哪一項不是地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "機械資源" }
                            ],
                            answer: "D"
                        },
                        {
                            num: 2,
                            text: "芝士的原料屬於哪一項不地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "礦產資源" }
                            ],
                            answer: "C"
                        }
                    ]
                };
            }

            return {
                title,
                totalScore,
                questions
            };
        };

        function OMITApp() {
            const [role, setRole] = useState('LANDING'); // 'LANDING', 'TEACHER', 'STUDENT'
            const [roomCode, setRoomCode] = useState('');
            const [seatNumber, setSeatNumber] = useState('1');
            const [studentName, setStudentName] = useState('');
            const [teacherPassword, setTeacherPassword] = useState('');
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [toast, setToast] = useState(null);

            const [activeQuestion, setActiveQuestion] = useState(null);
            const [studentsList, setStudentsList] = useState([]);
            const [responses, setResponses] = useState({});
            const [historyQuestions, setHistoryQuestions] = useState([]);
            const [isAuthReady, setIsAuthReady] = useState(false);

            const myStudentId = useRef('std_' + Math.random().toString(36).substring(2, 9));

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            // Initialize Anonymous Auth
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (window.fbUtils && window.fbAuth) {
                            await window.fbUtils.signInAnonymously(window.fbAuth);
                            setIsAuthReady(true);
                        }
                    } catch (err) {
                        console.error("Firebase auth failed:", err);
                    }
                };
                initAuth();
            }, []);

            // Check URL query for Room Code
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const roomParam = params.get('room');
                if (roomParam) {
                    setRoomCode(roomParam.toUpperCase());
                }
            }, []);

            // Firebase Firestore Sync for Room Data
            useEffect(() => {
                if (!roomCode || !isAuthReady) return;

                const appId = "omit-8c173";
                const db = window.fbDb;
                const { doc, onSnapshot, collection } = window.fbUtils;

                const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                const studentsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                const responsesColRef = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');

                const unsubRoom = onSnapshot(roomDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setActiveQuestion(data.activeQuestion || null);
                        if (data.history) setHistoryQuestions(data.history);
                    }
                }, (err) => console.error("Room sub error:", err));

                const unsubStudents = onSnapshot(studentsColRef, (snapshot) => {
                    const list = [];
                    snapshot.forEach((d) => list.push(d.data()));
                    setStudentsList(list);
                }, (err) => console.error("Students sub error:", err));

                const unsubResponses = onSnapshot(responsesColRef, (snapshot) => {
                    const resMap = {};
                    snapshot.forEach((d) => {
                        resMap[d.id] = d.data();
                    });
                    setResponses(resMap);
                }, (err) => console.error("Responses sub error:", err));

                return () => {
                    unsubRoom();
                    unsubStudents();
                    unsubResponses();
                };
            }, [roomCode, isAuthReady]);

            // Handle Teacher Access
            const handleTeacherAccessRequest = () => {
                setShowPasswordModal(true);
                setTeacherPassword('');
            };

            const verifyTeacherPassword = (e) => {
                e?.preventDefault();
                if (teacherPassword === '8030') {
                    const generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
                    setRoomCode(generatedCode);
                    setRole('TEACHER');
                    setShowPasswordModal(false);
                    showToast(`密碼正確！已建立課堂 房號：${generatedCode}`, 'success');
                } else {
                    showToast('密碼錯誤，請重新輸入！', 'error');
                }
            };

            // Student Join
            const handleJoinRoom = (e) => {
                e?.preventDefault();
                if (!roomCode.trim()) {
                    showToast('請輸入6位數字房號', 'error');
                    return;
                }

                const studentObj = {
                    id: myStudentId.current,
                    seatNumber: seatNumber,
                    name: studentName.trim() || `學號 ${seatNumber}`,
                    joinTime: new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                };

                // Register student to Firestore
                const appId = "omit-8c173";
                const db = window.fbDb;
                const studentDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students', myStudentId.current);
                window.fbUtils.setDoc(studentDocRef, studentObj);

                setRole('STUDENT');
                showToast(`已進入房號 ${roomCode} 的課堂`, 'success');
            };

            if (role === 'LANDING') {
                return (
                    <div class="min-h-screen bg-gradient-to-br from-indigo-900 via-indigo-800 to-purple-900 flex items-center justify-center p-4">
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                        
                        <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 space-y-8 relative overflow-hidden">
                            <div class="text-center space-y-2">
                                <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800 tracking-tight">宣道會陳元喜小學</h1>
                                <h2 class="text-xl md:text-2xl font-bold text-indigo-600">OMIT互動課堂</h2>
                                <p class="text-slate-500 text-sm">免登入！隨查隨答、高效即時的反饋互動平台</p>
                            </div>

                            <div class="space-y-6">
                                {/* Student Join Form */}
                                <form onSubmit={handleJoinRoom} class="bg-indigo-50/70 p-5 rounded-2xl border border-indigo-100 space-y-4">
                                    <h2 class="text-xs font-bold text-indigo-600 uppercase tracking-wider">我是學生 (加入課堂)</h2>
                                    <div>
                                        <label class="text-xs text-slate-500 font-medium mb-1 block">1. 課堂房號</label>
                                        <input 
                                            type="text" 
                                            placeholder="請輸入房號 (例如 123456)" 
                                            value={roomCode} 
                                            onChange={(e) => setRoomCode(e.target.value)}
                                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-mono text-center tracking-widest text-lg font-bold"
                                            maxLength={6}
                                        />
                                    </div>

                                    {/* Seat dropdown 1-36 + Optional Name */}
                                    <div class="grid grid-cols-3 gap-2">
                                        <div class="col-span-1">
                                            <label class="text-xs text-slate-500 font-medium mb-1 block">2. 學號 *</label>
                                            <select 
                                                value={seatNumber}
                                                onChange={(e) => setSeatNumber(e.target.value)}
                                                class="w-full px-3 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-bold text-center"
                                            >
                                                {Array.from({ length: 36 }, (_, i) => i + 1).map((num) => (
                                                    <option key={num} value={num}>{num} 號</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div class="col-span-2">
                                            <label class="text-xs text-slate-500 font-medium mb-1 block">3. 姓名 (可留空)</label>
                                            <input 
                                                type="text" 
                                                placeholder="輸入姓名 / 暱稱" 
                                                value={studentName} 
                                                onChange={(e) => setStudentName(e.target.value)}
                                                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-medium"
                                            />
                                        </div>
                                    </div>

                                    <button 
                                        type="submit" 
                                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-200 active:scale-98"
                                    >
                                        進入課堂 🚀
                                    </button>
                                </form>

                                <div class="relative flex py-1 items-center">
                                    <div class="flex-grow border-t border-slate-200"></div>
                                    <span class="flex-shrink mx-4 text-slate-400 text-xs font-medium">或</span>
                                    <div class="flex-grow border-t border-slate-200"></div>
                                </div>

                                {/* Teacher Password Access */}
                                <div class="text-center">
                                    <button 
                                        onClick={handleTeacherAccessRequest}
                                        class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl transition shadow-md flex items-center justify-center space-x-2 active:scale-98"
                                    >
                                        <span>👨‍🏫 開啟新課堂</span>
                                    </button>
                                    <p class="text-xs text-slate-400 mt-2">建立後即可獲取房號與專屬 QR Code</p>
                                </div>
                            </div>
                        </div>

                        {showPasswordModal && (
                            <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                                <div class="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
                                    <h3 class="text-lg font-bold text-slate-800 text-center">請輸入教師密碼</h3>
                                    <form onSubmit={verifyTeacherPassword} class="space-y-4">
                                        <input 
                                            type="password" 
                                            value={teacherPassword}
                                            onChange={(e) => setTeacherPassword(e.target.value)}
                                            class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 text-center font-mono text-xl tracking-widest"
                                            autoFocus
                                        />
                                        <div class="flex space-x-2">
                                            <button 
                                                type="button" 
                                                onClick={() => setShowPasswordModal(false)}
                                                class="w-1/2 py-2.5 rounded-xl bg-slate-100 font-medium text-slate-600 hover:bg-slate-200"
                                            >
                                                取消
                                            </button>
                                            <button 
                                                type="submit" 
                                                class="w-1/2 py-2.5 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-700 shadow-md"
                                            >
                                                確認進入
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            if (role === 'TEACHER') {
                return (
                    <TeacherDashboard 
                        roomCode={roomCode} 
                        activeQuestion={activeQuestion} 
                        setActiveQuestion={setActiveQuestion}
                        responses={responses}
                        setResponses={setResponses}
                        studentsList={studentsList}
                        historyQuestions={historyQuestions}
                        setHistoryQuestions={setHistoryQuestions}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            if (role === 'STUDENT') {
                return (
                    <StudentInterface 
                        roomCode={roomCode}
                        studentName={studentName}
                        seatNumber={seatNumber}
                        studentId={myStudentId.current}
                        activeQuestion={activeQuestion}
                        responses={responses}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            return null;
        }

        function TeacherDashboard({ roomCode, activeQuestion, setActiveQuestion, responses, setResponses, studentsList, historyQuestions, setHistoryQuestions, showToast, onExit }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE'); // 'CHOICE', 'TF', 'SHORT', 'DRAW', 'BUZZER', 'AUDIO', 'CHALLENGE', 'COOP', 'LINK'
            const [questionText, setQuestionText] = useState('');
            const [choiceCount, setChoiceCount] = useState(4);
            const [lockAfterSubmit, setLockAfterSubmit] = useState(true);
            const [whiteboardBg, setWhiteboardBg] = useState(null);
            const [pushedUrl, setPushedUrl] = useState('');

            // Modals & Tools
            const [showQRModal, setShowQRModal] = useState(false);
            const [showStudentListModal, setShowStudentListModal] = useState(false);
            const [showInspectModal, setShowInspectModal] = useState(null);
            const [barChoiceFilter, setBarChoiceFilter] = useState(null);

            // Random Selector State
            const [showRandomModal, setShowRandomModal] = useState(false);
            const [rangeStart, setRangeStart] = useState(1);
            const [rangeEnd, setRangeEnd] = useState(36);
            const [drawnNumbers, setDrawnNumbers] = useState([]);
            const [currentDrawn, setCurrentDrawn] = useState(null);
            const [isSpinning, setIsSpinning] = useState(false);

            // Timer Modal State
            const [showTimerModal, setShowTimerModal] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerActive, setTimerActive] = useState(false);
            const [timerZoomed, setTimerZoomed] = useState(false);
            const [customTimerInput, setCustomTimerInput] = useState('00:00');

            // Challenge Question Setup States
            const [challengeData, setChallengeData] = useState(null);
            const [challengeEnableTimer, setChallengeEnableTimer] = useState(true);
            const [challengeTimeLimit, setChallengeTimeLimit] = useState(120); // 120s default (2 mins)
            const [challengeReleaseInstant, setChallengeReleaseInstant] = useState(true);
            const [showChallengeScoresOnLeaderboard, setShowChallengeScoresOnLeaderboard] = useState(true);
            const [docxFileName, setDocxFileName] = useState('');

            // Co-op Question Setup States
            const [coopData, setCoopData] = useState(null);
            const [coopStage, setCoopStage] = useState('PREPARE'); // 'PREPARE', 'GROUP', 'COMPETE'
            const [coopGroups, setCoopGroups] = useState([]);
            const [coopDocxFileName, setCoopDocxFileName] = useState('');

            // Teacher Whiteboard State
            const [showTeacherWhiteboard, setShowTeacherWhiteboard] = useState(false);
            const [isWhiteboardBroadcasting, setIsWhiteboardBroadcasting] = useState(false);
            const teacherWhiteboardRef = useRef(null);
            const [teacherWhiteboardData, setTeacherWhiteboardData] = useState(null);

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

            // Filter current responses for active question
            const currentQuestionResponses = useMemo(() => {
                if (!activeQuestion) return {};
                const filtered = {};
                Object.values(responses).forEach(r => {
                    if (r.questionId === activeQuestion.id) {
                        filtered[r.studentId] = r;
                    }
                });
                return filtered;
            }, [responses, activeQuestion]);

            // Timer Interval Logic
            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(s => {
                            if (s <= 1) {
                                setTimerActive(false);
                                playSound('alarm');
                                return 0;
                            }
                            return s - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            // Parse Custom Timer Input (MM:SS)
            const handleCustomTimerInput = () => {
                const parts = customTimerInput.split(':');
                if (parts.length === 2) {
                    const m = parseInt(parts[0], 10);
                    const s = parseInt(parts[1], 10);
                    if (!isNaN(m) && !isNaN(s)) {
                        setTimerSeconds(m * 60 + s);
                    }
                }
            };

            // Sync Question & History to Firestore
            const publishQuestionToFirestore = async (qObj, newHistoryList) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatePayload = {
                    activeQuestion: qObj,
                    updatedAt: Date.now()
                };
                if (newHistoryList) {
                    updatePayload.history = newHistoryList;
                }

                await window.fbUtils.setDoc(roomDocRef, updatePayload, { merge: true });
            };

            // Exit Room Cleanup
            const handleExitRoom = async () => {
                if (window.confirm("確定退出課室？將會同步清空此課室於 Firebase 的所有暫存紀錄！")) {
                    try {
                        const appId = "omit-8c173";
                        const db = window.fbDb;
                        
                        const responsesColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');
                        const resSnaps = await window.fbUtils.getDocs(responsesColRef);
                        resSnaps.forEach(async (d) => {
                            await window.fbUtils.deleteDoc(d.ref);
                        });

                        const studentsColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                        const stuSnaps = await window.fbUtils.getDocs(studentsColRef);
                        stuSnaps.forEach(async (d) => {
                            await window.fbUtils.deleteDoc(d.ref);
                        });

                        const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                        await window.fbUtils.deleteDoc(roomDocRef);

                        showToast("課室暫存資料已完全清空！", "info");
                    } catch (e) {
                        console.error("Cleanup error:", e);
                    }
                    onExit();
                }
            };

            // Download Challenge/Coop Word Template File (.docx)
            const handleDownloadWordTemplate = async (type) => {
                const sampleLines = [
                    "標題：地球生病了",
                    "總分: 100分",
                    "1.以下哪一項不是地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源",
                    "D. 機械資源*",
                    "",
                    "2.芝士的原料屬於哪一項不地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源*",
                    "D. 礦產資源",
                    "",
                    "3.人們不當使用水資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應*",
                    "",
                    "4.人們不當使用煤和石油資源會造成甚麼後果?",
                    "A. 引發極端天氣*",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應",
                    "",
                    "5.人們不當使用土地資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災*",
                    "C. 產生大量二氧化碳",
                    "D. 影響食水供應"
                ];

                try {
                    const blob = await createWordDocxBlob(sampleLines);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = type === 'CHALLENGE' ? '挑戰題評估範本Word檔.docx' : '合作題評估範本Word檔.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast(`已下載 Word 評估範本檔 (.docx)！`, "success");
                } catch (err) {
                    console.error("Docx generation error:", err);
                    showToast("無法生成 Word 範本檔，請重新整理試試。", "error");
                }
            };

            // Word / Text document upload parser handler using mammoth.js
            const handleWordFileUpload = (e, type) => {
                const file = e.target.files[0];
                if (!file) return;

                if (type === 'CHALLENGE') setDocxFileName(file.name);
                else setCoopDocxFileName(file.name);
                
                const reader = new FileReader();

                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const arrayBuffer = evt.target.result;
                            const result = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                            parsedData = parseWordChallengeText(result.value);
                        } else {
                            const text = evt.target.result;
                            parsedData = parseWordChallengeText(text);
                        }

                        if (type === 'CHALLENGE') {
                            setChallengeData(parsedData);
                        } else {
                            setCoopData(parsedData);
                        }
                        showToast(`已成功解析範本檔案！共 ${parsedData.questions.length} 題`, 'success');
                    } catch (err) {
                        console.error("Word file parse error:", err);
                        showToast("文件解析失敗，請確認格式！", "error");
                    }
                };

                if (file.name.endsWith('.docx')) {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file, "UTF-8");
                }
            };

            // Handlers for modifying challenge/coop questions in teacher UI before publishing
            const handleUpdateAssessmentTitle = (newTitle, type) => {
                if (type === 'CHALLENGE') setChallengeData(prev => prev ? { ...prev, title: newTitle } : null);
                else setCoopData(prev => prev ? { ...prev, title: newTitle } : null);
            };

            const handleUpdateAssessmentScore = (newScore, type) => {
                if (type === 'CHALLENGE') setChallengeData(prev => prev ? { ...prev, totalScore: parseInt(newScore) || 100 } : null);
                else setCoopData(prev => prev ? { ...prev, totalScore: parseInt(newScore) || 100 } : null);
            };

            const handleUpdateQuestionText = (qIndex, text, type) => {
                const setter = type === 'CHALLENGE' ? setChallengeData : setCoopData;
                setter(prev => {
                    if (!prev) return null;
                    const newQs = [...prev.questions];
                    newQs[qIndex] = { ...newQs[qIndex], text };
                    return { ...prev, questions: newQs };
                });
            };

            const handleUpdateOptionText = (qIndex, optIndex, text, type) => {
                const setter = type === 'CHALLENGE' ? setChallengeData : setCoopData;
                setter(prev => {
                    if (!prev) return null;
                    const newQs = [...prev.questions];
                    const newOpts = [...newQs[qIndex].options];
                    newOpts[optIndex] = { ...newOpts[optIndex], text };
                    newQs[qIndex] = { ...newQs[qIndex], options: newOpts };
                    return { ...prev, questions: newQs };
                });
            };

            const handleUpdateCorrectAnswer = (qIndex, answerLetter, type) => {
                const setter = type === 'CHALLENGE' ? setChallengeData : setCoopData;
                setter(prev => {
                    if (!prev) return null;
                    const newQs = [...prev.questions];
                    newQs[qIndex] = { ...newQs[qIndex], answer: answerLetter };
                    return { ...prev, questions: newQs };
                });
            };

            // Delete Question Handler
            const handleDeleteQuestion = (qIndex, type) => {
                const setter = type === 'CHALLENGE' ? setChallengeData : setCoopData;
                setter(prev => {
                    if (!prev) return null;
                    const newQs = prev.questions.filter((_, idx) => idx !== qIndex).map((q, idx) => ({
                        ...q,
                        num: idx + 1
                    }));
                    return { ...prev, questions: newQs };
                });
                showToast("已成功刪除該題目！", "info");
            };

            // Publish Active Question
            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                
                let challengeContent = null;
                let coopContent = null;
                let coopStageState = null;
                
                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請先上載並解析 Word 評估範本檔案！", "error");
                        return;
                    }
                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                } else if (selectedMode === 'COOP') {
                    if (!coopData || !coopData.questions || coopData.questions.length === 0) {
                        showToast("請先上載並解析 Word 評估範本檔案！", "error");
                        return;
                    }
                    coopContent = {
                        title: coopData.title,
                        totalScore: coopData.totalScore,
                        questions: coopData.questions,
                    };
                    
                    // Assign Groups
                    const shuffledStudents = [...studentsList].sort(() => 0.5 - Math.random());
                    const groupNames = [
                        { name: '老虎組', emoji: '🐯', color: 'bg-orange-100 text-orange-800 border-orange-300' },
                        { name: '大象組', emoji: '🐘', color: 'bg-gray-100 text-gray-800 border-gray-300' },
                        { name: '企鵝組', emoji: '🐧', color: 'bg-blue-100 text-blue-800 border-blue-300' },
                        { name: '藍鯨組', emoji: '🐳', color: 'bg-cyan-100 text-cyan-800 border-cyan-300' },
                        { name: '白兔組', emoji: '🐰', color: 'bg-pink-100 text-pink-800 border-pink-300' },
                        { name: '熊貓組', emoji: '🐼', color: 'bg-stone-100 text-stone-800 border-stone-300' },
                        { name: '獅子組', emoji: '🦁', color: 'bg-yellow-100 text-yellow-800 border-yellow-300' },
                        { name: '白羊組', emoji: '🐑', color: 'bg-slate-100 text-slate-800 border-slate-300' },
                        { name: '水牛組', emoji: '🐃', color: 'bg-zinc-100 text-zinc-800 border-zinc-300' },
                        { name: '斑馬組', emoji: '🦓', color: 'bg-neutral-100 text-neutral-800 border-neutral-300' }
                    ].sort(() => 0.5 - Math.random());
                    
                    const minGroupSize = 3;
                    const maxGroupSize = 4;
                    let numGroups = Math.floor(shuffledStudents.length / minGroupSize);
                    if (numGroups === 0 && shuffledStudents.length > 0) numGroups = 1;
                    
                    const newGroups = Array.from({length: numGroups}, (_, i) => ({
                        id: `group_${i}`,
                        name: groupNames[i % groupNames.length].name,
                        emoji: groupNames[i % groupNames.length].emoji,
                        color: groupNames[i % groupNames.length].color,
                        members: [],
                        progress: 0,
                        isWinner: false
                    }));
                    
                    shuffledStudents.forEach((student, index) => {
                        newGroups[index % numGroups].members.push(student);
                    });
                    
                    setCoopGroups(newGroups);
                    setCoopStage('GROUP');
                    coopStageState = 'GROUP';
                    coopContent.groups = newGroups;
                    coopContent.stage = 'GROUP';
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : selectedMode === 'COOP' ? `🤝 合作題：${coopData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent,
                    coop: coopContent
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);

                publishQuestionToFirestore(newQ, updatedHistory);
                if (selectedMode !== 'COOP') {
                    showToast(`已成功發佈【${getModeLabel(selectedMode)}】給所有學生！`, 'success');
                } else {
                    showToast(`已成功分配組別！`, 'success');
                }
            };
            
            const handleUpdateCoopStage = async (newStage) => {
                if (!activeQuestion || activeQuestion.mode !== 'COOP') return;
                setCoopStage(newStage);
                
                let updatedGroups = coopGroups;
                
                if (newStage === 'GROUP') {
                    // Re-shuffle groups
                    const shuffledStudents = [...studentsList].sort(() => 0.5 - Math.random());
                    const groupNames = [
                        { name: '老虎組', emoji: '🐯', color: 'bg-orange-100 text-orange-800 border-orange-300' },
                        { name: '大象組', emoji: '🐘', color: 'bg-gray-100 text-gray-800 border-gray-300' },
                        { name: '企鵝組', emoji: '🐧', color: 'bg-blue-100 text-blue-800 border-blue-300' },
                        { name: '藍鯨組', emoji: '🐳', color: 'bg-cyan-100 text-cyan-800 border-cyan-300' },
                        { name: '白兔組', emoji: '🐰', color: 'bg-pink-100 text-pink-800 border-pink-300' },
                        { name: '熊貓組', emoji: '🐼', color: 'bg-stone-100 text-stone-800 border-stone-300' },
                        { name: '獅子組', emoji: '🦁', color: 'bg-yellow-100 text-yellow-800 border-yellow-300' },
                        { name: '白羊組', emoji: '🐑', color: 'bg-slate-100 text-slate-800 border-slate-300' },
                        { name: '水牛組', emoji: '🐃', color: 'bg-zinc-100 text-zinc-800 border-zinc-300' },
                        { name: '斑馬組', emoji: '🦓', color: 'bg-neutral-100 text-neutral-800 border-neutral-300' }
                    ].sort(() => 0.5 - Math.random());
                    
                    const minGroupSize = 3;
                    let numGroups = Math.floor(shuffledStudents.length / minGroupSize);
                    if (numGroups === 0 && shuffledStudents.length > 0) numGroups = 1;
                    
                    updatedGroups = Array.from({length: numGroups}, (_, i) => ({
                        id: `group_${i}`,
                        name: groupNames[i % groupNames.length].name,
                        emoji: groupNames[i % groupNames.length].emoji,
                        color: groupNames[i % groupNames.length].color,
                        members: [],
                        progress: 0,
                        isWinner: false
                    }));
                    
                    shuffledStudents.forEach((student, index) => {
                        updatedGroups[index % numGroups].members.push(student);
                    });
                    
                    setCoopGroups(updatedGroups);
                } else if (newStage === 'COMPETE') {
                    // Reset progress for competition
                    updatedGroups = coopGroups.map(g => ({...g, progress: 0, isWinner: false}));
                    setCoopGroups(updatedGroups);
                }
                
                const updatedQ = {
                    ...activeQuestion,
                    coop: {
                        ...activeQuestion.coop,
                        stage: newStage,
                        groups: updatedGroups
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                if (newStage === 'COMPETE') {
                    playSound('buzzer'); // start sound
                }
            };
            
            // Teacher coop answers evaluation
            useEffect(() => {
                if (activeQuestion?.mode === 'COOP' && activeQuestion.coop?.stage === 'COMPETE') {
                    // Check answers and update group progress
                    const groups = activeQuestion.coop.groups;
                    let hasWinner = false;
                    let updatedGroups = [...groups];
                    let needsUpdate = false;
                    
                    updatedGroups.forEach((group, gIndex) => {
                        if (group.isWinner) {
                            hasWinner = true;
                            return;
                        }
                        const currentQIndex = group.progress;
                        if (currentQIndex >= activeQuestion.coop.questions.length) {
                             if(!group.isWinner){
                                 updatedGroups[gIndex].isWinner = true;
                                 needsUpdate = true;
                                 hasWinner = true;
                                 playSound('win');
                             }
                             return;
                        }
                        
                        const currentQ = activeQuestion.coop.questions[currentQIndex];
                        // Check if any member of the group answered the current question
                        let groupAnsweredCorrectly = false;
                        let groupAnsweredIncorrectly = false;
                        
                        group.members.forEach(member => {
                             const response = Object.values(responses).find(r => r.studentId === member.id && r.questionId === activeQuestion.id && r.coopQIndex === currentQIndex);
                             if (response) {
                                 if (response.answer === currentQ.answer) {
                                     groupAnsweredCorrectly = true;
                                 } else {
                                     groupAnsweredIncorrectly = true;
                                 }
                             }
                        });
                        
                        if (groupAnsweredCorrectly) {
                            updatedGroups[gIndex].progress += 1;
                            needsUpdate = true;
                        } else if (groupAnsweredIncorrectly) {
                            updatedGroups[gIndex].progress = 0; // Reset to start
                            needsUpdate = true;
                            // Need to delete all previous coop responses for this group so they can start over
                            group.members.forEach(member => {
                                Object.values(responses).forEach(async (r) => {
                                    if(r.studentId === member.id && r.questionId === activeQuestion.id) {
                                        try {
                                             const appId = "omit-8c173";
                                             const db = window.fbDb;
                                             const docRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', r.id);
                                             await window.fbUtils.deleteDoc(docRef);
                                        } catch(e) {}
                                    }
                                });
                            });
                        }
                    });
                    
                    if (needsUpdate) {
                         const updatedQ = {
                            ...activeQuestion,
                            coop: {
                                ...activeQuestion.coop,
                                groups: updatedGroups
                            }
                        };
                        publishQuestionToFirestore(updatedQ);
                    }
                }
            }, [responses, activeQuestion]);

            // Clear Active Question
            const handleClearQuestion = async () => {
                await publishQuestionToFirestore(null, historyQuestions);
                setActiveQuestion(null);
                setBarChoiceFilter(null);
            };

            // Teacher manual release of scores for Challenge mode
            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已成功向所有學生一併發放挑戰題成績！", "success");
            };

            // One-click download all student audio recordings as a ZIP file
            const handleDownloadAllAudio = async () => {
                const audioSubmissions = Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:audio'));
                
                if (audioSubmissions.length === 0) {
                    showToast("目前尚無學生提交錄音！", "error");
                    return;
                }

                try {
                    const zip = new JSZip();
                    const folder = zip.folder(`課堂錄音_房號${roomCode}`);

                    audioSubmissions.forEach((res) => {
                        const base64Data = res.answer.split(',')[1];
                        const studentName = res.studentName.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_');
                        folder.file(`${studentName}_${res.studentSeat}.webm`, base64Data, {base64: true});
                    });

                    const content = await zip.generateAsync({type: "blob"});
                    const url = URL.createObjectURL(content);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `OMIT_課堂錄音_房號${roomCode}.zip`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    showToast(`成功打包下載 ${audioSubmissions.length} 份錄音檔！`, "success");

                    showToast("打包下載失敗，請稍後重試。", "error");

            // Export Challenge Scores to CSV
            const handleExportChallengeCSV = () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                
                const questions = activeQuestion.challenge.questions;
                let csvContent = "學號,姓名,總分,正確率,作答用時,";
                
                // Add question headers
                questions.forEach(q => {
                    csvContent += `Q${q.num},`;
                });
                csvContent += "\n";

                // Add student rows
                const sortedResponses = Object.values(currentQuestionResponses)
                    .sort((a, b) => parseInt(a.studentSeat) - parseInt(b.studentSeat));

                sortedResponses.forEach(res => {
                    let totalScore = 0;
                    let correctCount = 0;
                    const answers = res.answers || {};
                    const pointsPerQ = activeQuestion.challenge.totalScore / questions.length;
                    
                    let rowStr = `${res.studentSeat},${res.studentName},`;
                    
                    let qDetails = "";
                    questions.forEach(q => {
                        const sAns = answers[q.num];
                        if (sAns === q.answer) {
                            correctCount++;
                            totalScore += pointsPerQ;
                            qDetails += `${sAns} (正確),`;
                        } else {
                            qDetails += `${sAns || '未答'} (錯誤),`;
                        }
                    });
                    
                    const timeUsed = res.submitTime ? ((res.submitTime - activeQuestion.startTime) / 1000).toFixed(1) + 's' : 'N/A';
                    const accuracy = Math.round((correctCount / questions.length) * 100) + '%';
                    
                    rowStr += `${Math.round(totalScore)},${accuracy},${timeUsed},${qDetails}\n`;
                    csvContent += rowStr;
                });
                
                const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' }); // \uFEFF for Excel UTF-8 BOM
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `OMIT_挑戰題成績_房號${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                showToast("已成功匯出成績試算表 (.csv)", "success");
            };

            // Random Selector spin logic
            const spinRandom = () => {
                const possible = [];
                for (let i = rangeStart; i <= rangeEnd; i++) {
                    if (!drawnNumbers.includes(i)) possible.push(i);
                }
                
                if (possible.length === 0) {
                    showToast('所有號碼已抽完！', 'error');
                    return;
                }

                setIsSpinning(true);
                let counter = 0;
                let lastNum = null;
                const spinInterval = setInterval(() => {
                    const r = possible[Math.floor(Math.random() * possible.length)];
                    setCurrentDrawn(r);
                    lastNum = r;
                    playSound('spin');
                    counter++;
                    if (counter > 15) {
                        clearInterval(spinInterval);
                        setIsSpinning(false);
                        setDrawnNumbers([...drawnNumbers, lastNum]);
                        playSound('buzzer'); // Winning sound

        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
            const [localAnswer, setLocalAnswer] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [hasSubmitted, setHasSubmitted] = useState(false);
            
            // Challenge State
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [timeRemaining, setTimeRemaining] = useState(null);
            
            // Audio recording state
            const [isRecording, setIsRecording] = useState(false);
            const [audioBlobUrl, setAudioBlobUrl] = useState(null);
            const [timeLeft, setTimeLeft] = useState(10);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);
            const timerRef = useRef(null);

            const myResponse = useMemo(() => {
                if (!activeQuestion) return null;
                return responses[studentId] || null;
            }, [responses, activeQuestion, studentId]);

            useEffect(() => {
                if (myResponse) {
                    setHasSubmitted(true);
                    if (activeQuestion?.mode === 'CHALLENGE') {
                        setChallengeAnswers(myResponse.answers || {});
                    } else if (activeQuestion?.mode !== 'AUDIO' && activeQuestion?.mode !== 'DRAW') {
                        setLocalAnswer(myResponse.answer || '');
                    }
                } else {
                    setHasSubmitted(false);
                    setLocalAnswer('');
                    setChallengeAnswers({});
                    setAudioBlobUrl(null);
                }
            }, [myResponse, activeQuestion]);

            // Challenge Timer Logic
            useEffect(() => {
                if (activeQuestion?.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer && !hasSubmitted) {
                    const checkTimer = setInterval(() => {
                        const elapsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                        const limit = activeQuestion.challenge.timeLimit;
                        const remaining = Math.max(0, limit - elapsed);
                        setTimeRemaining(remaining);
                        
                        if (remaining === 0 && !hasSubmitted) {
                            clearInterval(checkTimer);
                            handleChallengeSubmit(); // Auto submit
                            showToast("時間到！系統已自動收卷", "info");
                        }
                    }, 1000);
                    return () => clearInterval(checkTimer);
                }
            }, [activeQuestion, hasSubmitted, challengeAnswers]);

            // Clean up audio recording on unmount or question change
            useEffect(() => {
                return () => {
                    if (mediaRecorderRef.current && isRecording) {
                        mediaRecorderRef.current.stop();
                    }
                    if (timerRef.current) clearInterval(timerRef.current);
                };

            // Generic Submit Handler for single-answer modes
            const handleSubmit = async (e, forceAnswer = null) => {
                e?.preventDefault();
                const finalAnswer = forceAnswer !== null ? forceAnswer : localAnswer;
                
                if (!finalAnswer && activeQuestion.mode !== 'DRAW' && activeQuestion.mode !== 'AUDIO') {

                setIsSubmitting(true);
                try {
                    const appId = "omit-8c173";
                    const db = window.fbDb;
                    
                    const resId = `res_${activeQuestion.id}_${studentId}`;
                    const docRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', resId);
                    
                    await window.fbUtils.setDoc(docRef, {
                        id: resId,
                        questionId: activeQuestion.id,
                        studentId: studentId,
                        studentSeat: seatNumber,
                        studentName: studentName || `學號 ${seatNumber}`,
                        answer: finalAnswer,
                        submitTime: Date.now(),
                        audioDuration: activeQuestion.mode === 'AUDIO' ? (10 - timeLeft) : null

                    showToast('已提交答案! 讚賞你的努力! 安靜等候老師指示...', 'success');

                    console.error("Submit error:", error);
                    showToast('提交失敗，請重試', 'error');
                } finally {
                    setIsSubmitting(false);
                }
            };
            
            // Coop Submit Handler
            const handleCoopSubmit = async (qIndex, answer) => {
                if(isSubmitting) return;
                setIsSubmitting(true);
                try {
                    const appId = "omit-8c173";
                    const db = window.fbDb;
                    
                    const resId = `res_${activeQuestion.id}_${studentId}_${qIndex}`; // Unique per question index in coop
                    const docRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', resId);

                        id: resId,
                        questionId: activeQuestion.id,
                        coopQIndex: qIndex,

            // Challenge Mode Submit Handler
            const handleChallengeSubmit = async () => {
                setIsSubmitting(true);
                try {

                    const resId = `res_${activeQuestion.id}_${studentId}`;

                    showToast('提交失敗，請重試', 'error');
                } finally {
                    setIsSubmitting(false);

            };

            const handleChallengeOptionChange = (qNum, optLetter) => {
                setChallengeAnswers(prev => ({
                    ...prev,

            };

            // Audio Recording Handlers
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (event) => {
                        if (event.data.size > 0) {
                            audioChunksRef.current.push(event.data);
                        }
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            setAudioBlobUrl(reader.result); // Base64 for rendering and submitting
                        };
                        
                        // Stop all tracks to release mic
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                    setTimeLeft(10); // Reset timer to 10s

                    timerRef.current = setInterval(() => {
                        setTimeLeft((prevTime) => {
                            if (prevTime <= 1) {
                                stopRecording();
                                return 0;
                            }
                            return prevTime - 1;
                        });
                    }, 1000);
                } catch (err) {
                    console.error("Error accessing mic:", err);
                    showToast("無法存取麥克風，請確認權限設定", "error");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                    if (timerRef.current) {
                        clearInterval(timerRef.current);
                    }
                }
            };
            
            const retryRecording = () => {
                setAudioBlobUrl(null);
                setTimeLeft(10);
            };

            const submitAudio = () => {
