                                                if (file) {
                                                    const r = new FileReader();
                                                    r.onload = (evt) => setWhiteboardBg(evt.target.result);
                                                    r.readAsDataURL(file);
                                                }
                                            }}
                                            class="text-xs text-slate-500"
                                        />
                                        {whiteboardBg && (
                                            <div class="flex items-center justify-between text-xs text-emerald-600">
                                                <span>已載入圖片背景</span>
                                                <button onClick={() => setWhiteboardBg(null)} class="text-red-500 font-bold">清除背景</button>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {selectedMode === 'CHALLENGE' && (
                                    <div class="bg-amber-50 p-4 rounded-2xl border border-amber-200 space-y-3">
                                        <div class="flex items-center justify-between">
                                            <h3 class="text-xs font-black text-amber-800">🏆 挑戰題評估檔發佈</h3>
                                            <button
                                                type="button"
                                                onClick={handleDownloadChallengeTemplate}
                                                class="px-2.5 py-1 bg-amber-600 hover:bg-amber-700 text-white text-[11px] font-bold rounded-xl shadow transition"
                                            >
                                                📥 下載評估範本Word檔
                                            </button>
                                        </div>

                                        <div class="border-2 border-dashed border-amber-300 rounded-2xl p-3 text-center bg-white">
                                            <input
                                                type="file"
                                                accept=".docx,.txt"
                                                onChange={(e) => handleWordFileUpload(e, false)}
                                                class="hidden"
                                                id="word-challenge-upload"
                                            />
                                            <label htmlFor="word-challenge-upload" class="cursor-pointer space-y-1 block">
                                                <div class="text-xl">📄</div>
                                                <div class="text-xs font-bold text-amber-700">點擊上載評估範本 Word檔 (.docx)</div>
                                                {docxFileName && <div class="text-[10px] font-mono text-slate-500">{docxFileName}</div>}
                                            </label>
                                        </div>

                                        {/* Challenge Timer & Score Release Controls */}
                                        <div class="space-y-2 text-xs pt-1">
                                            <div class="flex items-center justify-between">
                                                <span class="font-bold text-slate-700">開啟限時模式：</span>
                                                <input
                                                    type="checkbox"
                                                    checked={challengeEnableTimer}
                                                    onChange={(e) => setChallengeEnableTimer(e.target.checked)}
                                                    class="w-4 h-4 text-indigo-600 rounded"
                                                />
                                            </div>

                                            {challengeEnableTimer && (
                                                <div class="space-y-2 bg-white p-2.5 rounded-xl border border-amber-200">
                                                    <div class="flex items-center justify-between">
                                                        <span class="text-[11px] font-bold text-slate-600">快速時間切換：</span>
                                                        <div class="flex space-x-1">
                                                            {[60, 120, 180, 240, 300].map(s => (
                                                                <button
                                                                    key={s}
                                                                    type="button"
                                                                    onClick={() => setChallengeTimeLimit(s)}
                                                                    class={`px-2 py-0.5 rounded text-[10px] font-bold ${challengeTimeLimit === s ? 'bg-amber-600 text-white' : 'bg-slate-100 text-slate-600'}`}
                                                                >
                                                                    {s / 60}分鐘
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                            <div class="flex items-center justify-between pt-1">
                                                <span class="font-bold text-slate-700">成績發放模式：</span>
                                                <select
                                                    value={challengeReleaseInstant ? 'INSTANT' : 'DEFERRED'}
                                                    onChange={(e) => setChallengeReleaseInstant(e.target.value === 'INSTANT')}
                                                    class="px-2 py-1 bg-white border rounded-xl text-[11px] font-bold"
                                                >
                                                    <option value="DEFERRED">待所有學生完成提交後，一併發放</option>
                                                    <option value="INSTANT">提交後即時發放</option>
                                                </select>
                                            </div>
                                        </div>

                                        {/* Editor Preview for Challenge Data */}
                                        {challengeData && (
                                            <div class="bg-white p-3 rounded-2xl border border-amber-300 space-y-2 max-h-48 overflow-y-auto">
                                                <div class="font-bold text-xs text-amber-800 border-b pb-1">
                                                    教師編輯/確認評估內容 ({challengeData.questions.length}題)
                                                </div>
                                                {challengeData.questions.map((q, idx) => (
                                                    <div key={idx} class="p-2 bg-slate-50 rounded-xl text-xs space-y-1 relative group">
                                                        <div class="flex items-center justify-between font-bold text-slate-800">
                                                            <span>第 {q.num} 題: {q.text}</span>
                                                            <button
                                                                type="button"
                                                                onClick={() => {
                                                                    setChallengeData(prev => ({
                                                                        ...prev,
                                                                        questions: prev.questions.filter((_, i) => i !== idx)
                                                                    }));
                                                                }}
                                                                class="text-red-500 text-[10px] font-bold hover:underline"
                                                            >
                                                                刪除
                                                            </button>
                                                        </div>
                                                        <div class="text-[11px] text-emerald-600 font-bold">正確答案: 選項 {q.answer}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {selectedMode === 'COOP' && (
                                    <div class="bg-purple-50 p-4 rounded-2xl border border-purple-200 space-y-3">
                                        <div class="flex items-center justify-between">
                                            <h3 class="text-xs font-black text-purple-900">🤝 合作題 (分組團隊賽)</h3>
                                            <button
                                                type="button"
                                                onClick={handleDownloadChallengeTemplate}
                                                class="px-2.5 py-1 bg-purple-600 hover:bg-purple-700 text-white text-[11px] font-bold rounded-xl shadow transition"
                                            >
                                                📥 下載評估範本Word檔
                                            </button>
                                        </div>

                                        <div class="border-2 border-dashed border-purple-300 rounded-2xl p-3 text-center bg-white">
                                            <input
                                                type="file"
                                                accept=".docx,.txt"
                                                onChange={(e) => handleWordFileUpload(e, true)}
                                                class="hidden"
                                                id="word-coop-upload"
                                            />
                                            <label htmlFor="word-coop-upload" class="cursor-pointer space-y-1 block">
                                                <div class="text-xl">📄</div>
                                                <div class="text-xs font-bold text-purple-700">上載合作題評估 Word檔 (.docx)</div>
                                            </label>
                                        </div>

                                        {coopData && (
                                            <div class="space-y-2">
                                                <div class="text-xs font-bold text-purple-900">已載入題目: {coopData.title} ({coopData.questions.length}題)</div>
                                                <div class="flex space-x-2">
                                                    <button
                                                        type="button"
                                                        onClick={handleSetupCoopGrouping}
                                                        class="w-full bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold py-2.5 rounded-xl shadow transition"
                                                    >
                                                        1. 自動隨機分組 (3-4人一組) 🎲
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Question Prompt Text Input */}
                                {selectedMode !== 'CHALLENGE' && selectedMode !== 'COOP' && (
                                    <div>
                                        <label class="text-xs font-bold text-slate-600 mb-1 block">題目描述 / 指示：</label>
                                        <textarea
                                            rows={3}
                                            placeholder={getDefaultQuestionPrompt(selectedMode)}
                                            value={questionText}
                                            onChange={(e) => setQuestionText(e.target.value)}
                                            class="w-full p-3 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-xs font-medium"
                                        />
                                    </div>
                                )}

                                {/* Publish Button */}
                                {selectedMode !== 'COOP' && (
                                    <button
                                        type="button"
                                        onClick={handlePublishQuestion}
                                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3.5 rounded-2xl shadow-lg shadow-indigo-200 transition active:scale-98 flex items-center justify-center space-x-2 text-sm"
                                    >
                                        <span>🚀 即時發佈【{getModeLabel(selectedMode)}】給全班</span>
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Right Column: Live Room Monitor & Leaderboard */}
                        <div class="lg:col-span-7 space-y-5">
                            {/* Cooperative Race Monitor view if COOP active */}
                            {coopGroupState && coopGroupState.stage === 'GROUP' && (
                                <div class="bg-white rounded-3xl p-5 shadow-sm border border-purple-200 space-y-4">
                                    <div class="flex items-center justify-between">
                                        <h2 class="text-base font-black text-purple-900 flex items-center space-x-2">
                                            <span>🎲 合作題 - 分組狀態</span>
                                            <span class="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full font-bold">預備中</span>
                                        </h2>
                                        <div class="flex space-x-2">
                                            <button
                                                onClick={handleSetupCoopGrouping}
                                                class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold rounded-xl"
                                            >
                                                🔄 重新分配組別
                                            </button>
                                            <button
                                                onClick={handleStartCoopRace}
                                                class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black rounded-xl shadow"
                                            >
                                                🏁 開始比賽
                                            </button>
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-2 gap-3">
                                        {Object.values(coopGroupState.groups).map(g => (
                                            <div key={g.id} class={`p-3 rounded-2xl border-2 ${g.color}`}>
                                                <div class="font-black text-sm flex items-center justify-between">
                                                    <span>{g.emoji} {g.name}</span>
                                                    <span class="text-xs font-normal opacity-90">{g.members.length} 位組員</span>
                                                </div>
                                                <div class="mt-2 text-xs space-y-0.5 opacity-95">
                                                    {g.members.map(m => (
                                                        <div key={m.studentId}>• {m.seatNumber}號 {m.name}</div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {coopGroupState && coopGroupState.stage === 'RACE' && (
                                <div class="bg-white rounded-3xl p-5 shadow-sm border border-purple-200 space-y-4">
                                    <div class="flex items-center justify-between">
                                        <h2 class="text-base font-black text-purple-900 flex items-center space-x-2">
                                            <span>🏎️ 合作題 - 即時比賽龍虎榜</span>
                                        </h2>
                                        <button
                                            onClick={handleEndCoopRace}
                                            class="px-3 py-1 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-xl"
                                        >
                                            結束比賽
                                        </button>
                                    </div>

                                    {/* Progress Bars for Groups */}
                                    <div class="space-y-4">
                                        {Object.values(coopGroupState.groups).map(g => {
                                            const totalQs = coopGroupState.questions.length;
                                            const progressPct = Math.round((g.currentQIndex / totalQs) * 100);

                                            return (
                                                <div key={g.id} class="space-y-1">
                                                    <div class="flex items-center justify-between text-xs font-bold">
                                                        <span>{g.emoji} {g.name} ({g.members.map(m => `${m.seatNumber}號`).join(', ')})</span>
                                                        <span>第 {g.currentQIndex + 1} / {totalQs} 題</span>
                                                    </div>
                                                    <div class="w-full bg-slate-100 h-6 rounded-2xl overflow-hidden border border-slate-200 relative">
                                                        <div
                                                            class={`h-full transition-all duration-500 ${g.color} ${progressPct > 0 ? 'animate-marquee' : ''}`}
                                                            style={{ width: `${progressPct}%` }}
                                                        />
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

        function StudentInterface({ 
            roomCode, studentName, seatNumber, studentId, activeQuestion, responses, 
            studentsList, broadcastWhiteboard, broadcastShortAnswer, coopGroupState, showToast, onExit 
        }) {
            const [myAnswer, setMyAnswer] = useState('');
            const [submitted, setSubmitted] = useState(false);
            const [shortAnswerText, setShortAnswerText] = useState('');

            // Audio recorder state
            const [recording, setRecording] = useState(false);
            const [audioBlobUrl, setAudioBlobUrl] = useState(null);
            const [mediaRecorder, setMediaRecorder] = useState(null);

            // Challenge answers map
            const [challengeAnswers, setChallengeAnswers] = useState({});

            const myResponse = responses[studentId];

            useEffect(() => {
                if (myResponse && myResponse.questionId === activeQuestion?.id) {
                    setSubmitted(true);
                } else {
                    setSubmitted(false);
                    setMyAnswer('');
                    setShortAnswerText('');
                    setAudioBlobUrl(null);
                    setChallengeAnswers({});
                }
            }, [activeQuestion, myResponse]);

            // Audio recorder start/stop handlers
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const recorder = new MediaRecorder(stream);
                    const chunks = [];

                    recorder.ondataavailable = (e) => chunks.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'audio/webm' });
                        const url = URL.createObjectURL(blob);
                        setAudioBlobUrl(url);

                        const reader = new FileReader();
                        reader.onloadend = () => setMyAnswer(reader.result);
                        reader.readAsDataURL(blob);
                    };

                    recorder.start();
                    setMediaRecorder(recorder);
                    setRecording(true);
                } catch (err) {
                    console.error("Audio record error:", err);
                    showToast("無法存取麥克風權限！", "error");
                }
            };

            const stopRecording = () => {
                if (mediaRecorder && recording) {
                    mediaRecorder.stop();
                    setRecording(false);
                }
            };

            const handleConfirmSubmit = (finalAnswer, challengeMap = null) => {
                if (!activeQuestion) return;

                const appId = "omit-8c173";
                const db = window.fbDb;
                const responseDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', studentId);

                const responseObj = {
                    studentId,
                    seatNumber: parseInt(seatNumber) || 1,
                    name: studentName || `學號 ${seatNumber}`,
                    questionId: activeQuestion.id,
                    answer: finalAnswer || myAnswer,
                    answersMap: challengeMap || challengeAnswers,
                    submitted: true,
                    timeUsed: Math.floor((Date.now() - activeQuestion.startTime) / 1000),
                    submitTimeStr: new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                };

                window.fbUtils.setDoc(responseDocRef, responseObj);
                setSubmitted(true);
                showToast("已成功提交答案！讚賞你的努力！", "success");
            };

            const handleBuzzerClick = () => {
                playSound('buzzer');
                handleConfirmSubmit('BuzzerPressed');
            };

            // Cooperative student member info
            const myCoopGroup = useMemo(() => {
                if (!coopGroupState || !coopGroupState.groups) return null;
                for (const g of Object.values(coopGroupState.groups)) {
                    const m = g.members.find(mem => mem.studentId === studentId);
                    if (m) return { group: g, member: m };
                }
                return null;
            }, [coopGroupState, studentId]);

            const handleCoopSubmitAnswer = (chosenOpt) => {
                if (!coopGroupState || !myCoopGroup) return;

                const currentGroup = myCoopGroup.group;
                const currentQ = coopGroupState.questions[currentGroup.currentQIndex];

                const isCorrect = chosenOpt === currentQ.answer;
                let nextIndex = currentGroup.currentQIndex;
                let isFinished = false;

                if (isCorrect) {
                    nextIndex += 1;
                    if (nextIndex >= coopGroupState.questions.length) {
                        isFinished = true;
                    }
                    showToast("答對了！團隊向前推推進一步 🚀", "success");
                } else {
                    nextIndex = 0; // Wrong answer resets back to Start
                    showToast("答錯了！倒扣回到起點重新開始！", "error");
                }

                const updatedGroups = {
                    ...coopGroupState.groups,
                    [currentGroup.id]: {
                        ...currentGroup,
                        currentQIndex: nextIndex,
                        isFinished: isFinished
                    }
                };

                const updatedState = {
                    ...coopGroupState,
                    groups: updatedGroups,
                    winnerGroup: isFinished ? currentGroup : coopGroupState.winnerGroup
                };

                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                window.fbUtils.setDoc(roomDocRef, { coopGroupState: updatedState }, { merge: true });

                if (isFinished) playSound('win');
            };

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col">
                    {/* Header */}
                    <header class="bg-indigo-900 text-white p-4 flex items-center justify-between shadow">
                        <div class="flex items-center space-x-2">
                            <span class="bg-indigo-600 text-xs px-2.5 py-1 rounded-xl font-bold">{seatNumber}號 {studentName}</span>
                            <h1 class="text-sm font-bold">宣道會陳元喜小學 OMIT互動課堂</h1>
                        </div>
                        <button onClick={onExit} class="text-xs bg-red-600 px-3 py-1 rounded-xl font-bold">退出</button>
                    </header>

                    {/* Teacher Live Broadcast Overlay (Req 21, 32) */}
                    {broadcastWhiteboard && (
                        <div class="p-4 bg-indigo-900 text-white space-y-2 border-b-4 border-amber-400">
                            <div class="text-xs font-black text-amber-300 flex items-center justify-between">
                                <span>📢 教師廣播螢幕</span>
                                <span class="animate-pulse">🔴 Live 實時分享中</span>
                            </div>
                            <div class="bg-white p-2 rounded-2xl flex items-center justify-center">
                                <img src={broadcastWhiteboard} alt="Broadcast" class="max-h-64 rounded-xl" />
                            </div>
                        </div>
                    )}

                    {/* Main Interaction Screen */}
                    <div class="max-w-xl mx-auto w-full p-4 flex-grow flex flex-col justify-center space-y-4">
                        {/* Cooperative Group Mode Screen */}
                        {coopGroupState && myCoopGroup && (
                            <div class="bg-white rounded-3xl p-6 shadow-xl border-2 space-y-4 text-center">
                                <div class={`p-3 rounded-2xl ${myCoopGroup.group.color} font-black text-lg`}>
                                    {myCoopGroup.group.emoji} 所屬組別：{myCoopGroup.group.name}
                                </div>

                                {coopGroupState.stage === 'GROUP' && (
                                    <div class="space-y-3 py-6">
                                        <p class="text-base font-black text-purple-900">盡快與你的組員會合!比賽即將開始!</p>
                                        <p class="text-xs text-slate-500">組員：{myCoopGroup.group.members.map(m => `${m.seatNumber}號`).join('、')}</p>
                                    </div>
                                )}

                                {coopGroupState.stage === 'RACE' && (
                                    <div class="space-y-4 text-left">
                                        <div class="text-xs font-bold text-slate-400 border-b pb-1">
                                            第 {myCoopGroup.group.currentQIndex + 1} / {coopGroupState.questions.length} 題 (團隊合作中)
                                        </div>

                                        {/* Split View depending on member role */}
                                        {myCoopGroup.member.roleIndex === 0 && (
                                            <div class="p-4 bg-purple-50 rounded-2xl border border-purple-200">
                                                <div class="text-xs font-bold text-purple-800">你負責【閱讀題目】：</div>
                                                <div class="text-lg font-black text-slate-800 mt-1">
                                                    {coopGroupState.questions[myCoopGroup.group.currentQIndex]?.text}
                                                </div>
                                            </div>
                                        )}

                                        {myCoopGroup.member.roleIndex === 1 && (
                                            <div class="space-y-2">
                                                <div class="text-xs font-bold text-slate-500">你負責【選項 A & B】：</div>
                                                {coopGroupState.questions[myCoopGroup.group.currentQIndex]?.options.slice(0, 2).map(opt => (
                                                    <button
                                                        key={opt.letter}
                                                        onClick={() => handleCoopSubmitAnswer(opt.letter)}
                                                        class="w-full p-4 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 text-indigo-900 font-bold rounded-2xl text-left"
                                                    >
                                                        {opt.letter}. {opt.text}
                                                    </button>
                                                ))}
                                            </div>
                                        )}

                                        {myCoopGroup.member.roleIndex >= 2 && (
                                            <div class="space-y-2">
                                                <div class="text-xs font-bold text-slate-500">你負責【選項 C & D】：</div>
                                                {coopGroupState.questions[myCoopGroup.group.currentQIndex]?.options.slice(2, 4).map(opt => (
                                                    <button
                                                        key={opt.letter}
                                                        onClick={() => handleCoopSubmitAnswer(opt.letter)}
                                                        class="w-full p-4 bg-purple-50 hover:bg-purple-100 border border-purple-200 text-purple-900 font-bold rounded-2xl text-left"
                                                    >
                                                        {opt.letter}. {opt.text}
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Standard Question Submission UI */}
                        {!coopGroupState && activeQuestion && (
                            <div class="bg-white rounded-3xl p-6 shadow-xl border border-slate-200 space-y-5">
                                <div class="flex items-center justify-between">
                                    <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full">
                                        {getModeLabel(activeQuestion.mode)}
                                    </span>
                                </div>

                                <h2 class="text-xl font-black text-slate-800">{activeQuestion.text}</h2>

                                {submitted ? (
                                    /* Req 6: Unified submission feedback praise prompt */
                                    <div class="p-6 bg-emerald-50 rounded-2xl border-2 border-emerald-300 text-center space-y-2">
                                        <div class="text-3xl">🎉</div>
                                        <p class="text-lg font-black text-emerald-800">已提交答案! 讚賞你的努力!</p>
                                        <p class="text-xs text-emerald-600 font-bold">安靜等候老師指示...</p>
                                    </div>
                                ) : (
                                    /* Question Specific Input Types */
                                    <div class="space-y-4">
                                        {/* CHOICE & TF */}
                                        {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                            <div class="space-y-3">
                                                <div class="grid grid-cols-2 gap-3">
                                                    {activeQuestion.choiceOptions.map(opt => (
                                                        <button
                                                            key={opt}
                                                            onClick={() => setMyAnswer(opt)}
                                                            class={`p-4 rounded-2xl font-black text-lg border-2 transition ${myAnswer === opt ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-slate-50 border-slate-200 text-slate-700'}`}
                                                        >
                                                            {opt}
                                                        </button>
                                                    ))}
                                                </div>
                                                <button
                                                    onClick={() => handleConfirmSubmit(myAnswer)}
                                                    disabled={!myAnswer}
                                                    class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-black py-3.5 rounded-2xl shadow-lg transition text-base"
                                                >
                                                    ✅ 確認提交
                                                </button>
                                            </div>
                                        )}

                                        {/* SHORT ANSWER */}
                                        {activeQuestion.mode === 'SHORT' && (
                                            <div class="space-y-3">
                                                <textarea
                                                    rows={4}
                                                    placeholder="請在此輸入您的回答..."
                                                    value={shortAnswerText}
                                                    onChange={(e) => setShortAnswerText(e.target.value)}
                                                    class="w-full p-4 rounded-2xl border border-slate-300 text-sm font-medium"
                                                />
                                                <button
                                                    onClick={() => handleConfirmSubmit(shortAnswerText)}
                                                    disabled={!shortAnswerText.trim()}
                                                    class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-black py-3.5 rounded-2xl shadow-lg transition text-base"
                                                >
                                                    ✅ 確認提交答案
                                                </button>
                                            </div>
                                        )}

                                        {/* DRAW WHITEBOARD */}
                                        {activeQuestion.mode === 'DRAW' && (
                                            <WhiteboardCanvas
                                                initialBg={activeQuestion.whiteboardBg}
                                                onSave={(dataUrl) => handleConfirmSubmit(dataUrl)}
                                            />
                                        )}

                                        {/* AUDIO QUESTION */}
                                        {activeQuestion.mode === 'AUDIO' && (
                                            <div class="space-y-4 text-center">
                                                {!recording && !audioBlobUrl && (
                                                    <button
                                                        onClick={startRecording}
                                                        class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-4 rounded-2xl shadow-lg transition text-base"
                                                    >
                                                        🎙️ 開始錄音 (10秒內)
                                                    </button>
                                                )}

                                                {recording && (
                                                    <button
                                                        onClick={stopRecording}
                                                        class="w-full bg-slate-800 text-white font-black py-4 rounded-2xl shadow-lg animate-pulse text-base"
                                                    >
                                                        ⏹️ 停止錄音
                                                    </button>
                                                )}

                                                {audioBlobUrl && (
                                                    <div class="space-y-3">
                                                        <audio src={audioBlobUrl} controls class="w-full" />
                                                        <div class="flex space-x-2">
                                                            <button
                                                                onClick={() => { setAudioBlobUrl(null); setMyAnswer(''); }}
                                                                class="w-1/2 bg-slate-200 text-slate-700 font-bold py-3 rounded-2xl"
                                                            >
                                                                🗑️ 刪除重錄
                                                            </button>
                                                            <button
                                                                onClick={() => handleConfirmSubmit(myAnswer)}
                                                                class="w-1/2 bg-emerald-600 text-white font-black py-3 rounded-2xl shadow-lg"
                                                            >
                                                                ✅ 確認提交錄音
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {/* BUZZER QUESTION */}
                                        {activeQuestion.mode === 'BUZZER' && (
                                            <button
                                                onClick={handleBuzzerClick}
                                                class="w-full py-16 bg-gradient-to-r from-red-500 to-amber-500 hover:from-red-600 hover:to-amber-600 text-white font-black text-3xl rounded-3xl shadow-2xl active:scale-95 transition flex flex-col items-center justify-center space-y-2"
                                            >
                                                <span>⚡ 搶答！</span>
                                                <span class="text-xs opacity-90 font-normal">最快按制將會獲勝</span>
                                            </button>
                                        )}

                                        {/* LINK PUSH */}
                                        {activeQuestion.mode === 'LINK' && (
                                            <div class="space-y-4">
                                                {activeQuestion.youtubeEmbed ? (
                                                    <div class="aspect-16-9 w-full rounded-2xl overflow-hidden border">
                                                        <iframe
                                                            src={activeQuestion.youtubeEmbed}
                                                            class="w-full h-full"
                                                            allow="autoplay; encrypted-media"
                                                            allowFullScreen
                                                        />
                                                    </div>
                                                ) : null}

                                                <a
                                                    href={activeQuestion.pushedUrl}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl shadow-lg block text-center"
                                                >
                                                    開啟連結網站 ↗
                                                </a>
                                            </div>
                                        )}

                                        {/* CHALLENGE PAPER */}
                                        {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                            <div class="space-y-4 text-left">
                                                {activeQuestion.challenge.questions.map(q => (
                                                    <div key={q.num} class="p-3 bg-slate-50 rounded-2xl space-y-2 border">
                                                        <div class="font-bold text-sm text-slate-800">{q.num}. {q.text}</div>
                                                        <div class="grid grid-cols-2 gap-2">
                                                            {q.options.map(opt => (
                                                                <button
                                                                    key={opt.letter}
                                                                    onClick={() => setChallengeAnswers(prev => ({ ...prev, [q.num]: opt.letter }))}
                                                                    class={`p-2 rounded-xl text-xs font-bold text-left border ${challengeAnswers[q.num] === opt.letter ? 'bg-indigo-600 text-white' : 'bg-white text-slate-700'}`}
                                                                >
                                                                    {opt.letter}. {opt.text}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}

                                                <button
                                                    onClick={() => handleConfirmSubmit(null, challengeAnswers)}
                                                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3.5 rounded-2xl shadow-lg"
                                                >
                                                    ✅ 確認提交評估卷
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
