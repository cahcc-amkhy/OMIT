                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl">
                                <div class="flex justify-between items-center border-b pb-2">
                                    <h3 class="text-lg font-black text-slate-800">⏱️ 課堂計時器</h3>
                                    <button onClick={() => setShowTimerModal(false)} class="text-slate-400 font-bold text-xl">✕</button>
                                </div>

                                <div class="grid grid-cols-3 gap-1.5 text-xs font-bold">
                                    {[
                                        { label: '30 秒', s: 30 },
                                        { label: '1 分鐘', s: 60 },
                                        { label: '2 分鐘', s: 120 },
                                        { label: '3 分鐘', s: 180 },
                                        { label: '4 分鐘', s: 240 },
                                        { label: '5 分鐘', s: 300 }
                                    ].map((t) => (
                                        <button 
                                            key={t.s} 
                                            onClick={() => { setTimerSeconds(t.s); setTimerActive(false); }}
                                            class="p-2 bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 rounded-xl"
                                        >
                                            {t.label}
                                        </button>
                                    ))}
                                </div>

                                <div class="flex items-center justify-center space-x-1 border rounded-xl p-2 bg-slate-50">
                                    <span class="text-xs font-bold text-slate-500">手動輸入 (00:00):</span>
                                    <input 
                                        type="number" 
                                        value={timerMinInput} 
                                        onChange={(e) => setTimerMinInput(e.target.value)} 
                                        class="w-10 text-center font-mono font-bold border rounded"
                                        placeholder="0"
                                    />
                                    <span>分</span>
                                    <input 
                                        type="number" 
                                        value={timerSecInput} 
                                        onChange={(e) => setTimerSecInput(e.target.value)} 
                                        class="w-10 text-center font-mono font-bold border rounded"
                                        placeholder="0"
                                    />
                                    <span>秒</span>
                                    <button 
                                        onClick={() => {
                                            const total = (parseInt(timerMinInput) || 0) * 60 + (parseInt(timerSecInput) || 0);
                                            setTimerSeconds(total);
                                            setTimerActive(false);
                                        }}
                                        class="px-2 py-1 bg-amber-600 text-white font-bold text-xs rounded"
                                    >
                                        設定
                                    </button>
                                </div>

                                <div class={`p-6 rounded-2xl bg-amber-500 text-white font-mono font-black tracking-widest my-2 transition-all ${timerZoomed ? 'text-6xl' : 'text-4xl'}`}>
                                    {Math.floor(timerSeconds / 60)}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                </div>

                                <div class="flex space-x-2">
                                    <button 
                                        onClick={() => setTimerActive(!timerActive)}
                                        class={`flex-1 py-3 rounded-xl font-black text-sm shadow text-white ${timerActive ? 'bg-rose-600' : 'bg-emerald-600'}`}
                                    >
                                        {timerActive ? '⏸️ 暫停' : '▶️ 開始倒數'}
                                    </button>
                                    <button 
                                        onClick={() => setTimerZoomed(!timerZoomed)}
                                        class="px-4 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-xs rounded-xl"
                                    >
                                        🔍 放大顯示
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Inspection Modal for Whiteboard */}
                    {showInspectModal && (
                        <div class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-3xl w-full space-y-4 shadow-2xl">
                                <div class="flex justify-between items-center">
                                    <h3 class="text-lg font-black text-slate-800">
                                        白板作品預覽：{showInspectModal.name} ({showInspectModal.seatNumber}號)
                                    </h3>
                                    <button onClick={() => setShowInspectModal(null)} class="text-slate-400 text-2xl font-bold">✕</button>
                                </div>

                                <div class="aspect-16-9 bg-slate-100 rounded-2xl overflow-hidden border-2 flex items-center justify-center">
                                    <img src={showInspectModal.answer} class="max-h-full object-contain" alt="大圖" />
                                </div>

                                <div class="flex justify-between items-center pt-2">
                                    <div class="flex space-x-2">
                                        <button 
                                            onClick={() => {
                                                const idx = whiteboardSubmissions.findIndex(s => s.studentId === showInspectModal.studentId);
                                                if (idx > 0) setShowInspectModal(whiteboardSubmissions[idx - 1]);
                                            }}
                                            class="px-4 py-2 rounded-xl bg-slate-100 font-bold text-sm text-slate-700 hover:bg-slate-200"
                                        >
                                            ⬅️ 上一位學生
                                        </button>
                                        <button 
                                            onClick={() => {
                                                const idx = whiteboardSubmissions.findIndex(s => s.studentId === showInspectModal.studentId);
                                                if (idx < whiteboardSubmissions.length - 1) setShowInspectModal(whiteboardSubmissions[idx + 1]);
                                            }}
                                            class="px-4 py-2 rounded-xl bg-slate-100 font-bold text-sm text-slate-700 hover:bg-slate-200"
                                        >
                                            下一位學生 ➡️
                                        </button>
                                    </div>

                                    <button 
                                        onClick={() => handleBroadcastSubmission(showInspectModal)}
                                        class="px-5 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-black text-sm shadow-md"
                                    >
                                        📢 傳送至全班畫面進行互評
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Bar Chart Click Inspection Popover */}
                    {barChoiceFilter && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="text-lg font-black text-slate-800">選擇【{barChoiceFilter}】的學生名單</h3>
                                    <button onClick={() => setBarChoiceFilter(null)} class="text-slate-400 text-xl font-bold">✕</button>
                                </div>
                                <div class="max-h-60 overflow-y-auto divide-y">
                                    {Object.values(currentQuestionResponses).filter(r => r.answer === barChoiceFilter).map((res) => (
                                        <div key={res.studentId} class="py-2.5 flex justify-between items-center text-sm font-bold text-slate-800">
                                            <span>{res.seatNumber}號 - {res.name}</span>
                                            <span class="text-xs font-mono text-slate-400">用時: {res.duration}s</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Student Interface Component
        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
            const [myAnswer, setMyAnswer] = useState('');
            const [submitted, setSubmitted] = useState(false);
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [audioBlob, setAudioBlob] = useState(null);
            const [audioUrl, setAudioUrl] = useState(null);
            const [isRecording, setIsRecording] = useState(false);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            // Requirement 13, 19: Challenge Timer Auto Submit State
            const [challengeTimeLeft, setChallengeTimeLeft] = useState(null);

            // Fetch my response
            const myResponseKey = activeQuestion ? `${activeQuestion.id}_${studentId}` : '';
            const myPrevResponse = responses[myResponseKey];

            // Reset student state when active question changes
            useEffect(() => {
                if (myPrevResponse) {
                    setSubmitted(true);
                    if (myPrevResponse.answer) setMyAnswer(myPrevResponse.answer);
                } else {
                    setSubmitted(false);
                    setMyAnswer('');
                    setChallengeAnswers({});
                    setAudioBlob(null);
                    setAudioUrl(null);
                }
            }, [activeQuestion?.id, myPrevResponse]);

            // Requirement 13, 19: Challenge Timer logic
            useEffect(() => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE' || !activeQuestion.challenge?.enableTimer) return;
                
                const timeLimit = activeQuestion.challenge.timeLimit || 120;
                const elapsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                const remaining = Math.max(0, timeLimit - elapsed);
                setChallengeTimeLeft(remaining);

                const interval = setInterval(() => {
                    setChallengeTimeLeft(prev => {
                        if (prev <= 1) {
                            clearInterval(interval);
                            // Auto submit at 00:00
                            if (!submitted) {
                                handleAutoSubmitChallenge();
                            }
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);

                return () => clearInterval(interval);
            }, [activeQuestion, submitted]);

            // Audio recording functions
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => audioChunksRef.current.push(e.data);
                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        setAudioBlob(blob);
                        setAudioUrl(URL.createObjectURL(blob));
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);

                    // Auto stop at 10 seconds
                    setTimeout(() => {
                        if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
                            stopRecording();
                        }
                    }, 10000);
                } catch (e) {
                    showToast("無法存取麥克風權限", "error");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const submitAudioAnswer = () => {
                if (!audioBlob) return;
                const reader = new FileReader();
                reader.onloadend = () => {
                    handleSubmitAnswer(reader.result);
                };
                reader.readAsDataURL(audioBlob);
            };

            const handleSubmitAnswer = async (ansVal) => {
                if (submitted && activeQuestion?.lockAfterSubmit) {
                    showToast("老師已鎖定題目，無法再修改答案！", "error");
                    return;
                }

                const appId = "omit-8c173";
                const db = window.fbDb;
                const duration = ((Date.now() - activeQuestion.startTime) / 1000).toFixed(1);

                const resObj = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: ansVal,
                    duration: duration,
                    timestamp: new Date().toLocaleTimeString('zh-HK')
                };

                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', myResponseKey);
                await window.fbUtils.setDoc(resDocRef, resObj);
                setSubmitted(true);
            };

            const handleAutoSubmitChallenge = () => {
                submitChallenge();
            };

            // Challenge submission & auto-grading
            const submitChallenge = async () => {
                if (!activeQuestion || !activeQuestion.challenge) return;
                
                const qs = activeQuestion.challenge.questions;
                let correctCount = 0;

                qs.forEach((q) => {
                    if (challengeAnswers[q.num] === q.answer) {
                        correctCount++;
                    }
                });

                const totalQs = qs.length || 1;
                const percentage = Math.round((correctCount / totalQs) * 100);
                const score = Math.round((percentage / 100) * activeQuestion.challenge.totalScore);

                const appId = "omit-8c173";
                const db = window.fbDb;
                const duration = ((Date.now() - activeQuestion.startTime) / 1000).toFixed(1);

                const resObj = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: challengeAnswers,
                    scoreDetails: {
                        correctCount,
                        totalQs,
                        percentage,
                        totalScore: score
                    },
                    duration: duration,
                    timestamp: new Date().toLocaleTimeString('zh-HK')
                };

                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', myResponseKey);
                await window.fbUtils.setDoc(resDocRef, resObj);
                setSubmitted(true);
                showToast("挑戰題已成功提交！", "success");
            };

            // Check if teacher is broadcasting a submission or teacher demo board
            const broadcasted = activeQuestion?.broadcastedSubmission;

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col">
                    {/* Header */}
                    <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <span class="font-black text-xl">OMIT</span>
                            <span class="text-xs bg-indigo-500 px-2.5 py-1 rounded-full font-bold">
                                {seatNumber}號 - {studentName || '學生'}
                            </span>
                        </div>
                        <div class="text-xs font-mono font-bold">房號：{roomCode}</div>
                    </header>

                    <main class="flex-1 max-w-xl w-full mx-auto p-4 space-y-4">

                        {/* Broadcast Peer Review Modal Overlay */}
                        {broadcasted && (
                            <div class="bg-purple-900 text-white rounded-3xl p-5 shadow-2xl border-2 border-purple-400 animate-pulse space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="font-extrabold text-sm flex items-center gap-1">
                                        📢 老師正在廣播互評：
                                    </span>
                                    <span class="text-xs bg-purple-700 px-2 py-0.5 rounded font-bold">
                                        {broadcasted.seatNumber}號 {broadcasted.name}
                                    </span>
                                </div>
                                <div class="bg-white text-slate-800 rounded-2xl p-3 shadow-inner">
                                    {typeof broadcasted.answer === 'string' && broadcasted.answer.startsWith('data:image') ? (
                                        <img src={broadcasted.answer} class="w-full rounded-xl object-contain aspect-16-9" alt="廣播作品" />
                                    ) : (
                                        <div class="text-lg font-bold p-2 text-center">{broadcasted.answer}</div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Idle state if no active question */}
                        {!activeQuestion && (
                            <div class="bg-white rounded-3xl p-8 text-center space-y-4 border border-slate-200 shadow-sm mt-12">
                                <div class="text-6xl animate-bounce">⏳</div>
                                <h2 class="text-xl font-black text-slate-800">安靜等候老師指示...</h2>
                                <p class="text-slate-400 text-xs font-medium">題目公佈後，螢幕將會即時自動更新。</p>
                            </div>
                        )}

                        {activeQuestion && (
                            <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-md space-y-5">
                                <div class="border-b pb-3 flex justify-between items-start">
                                    <div>
                                        <span class="text-xs font-black text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">
                                            {getModeLabel(activeQuestion.mode)}
                                        </span>
                                        <h3 class="text-lg font-bold text-slate-800 mt-2">{activeQuestion.text}</h3>
                                    </div>

                                    {/* Challenge timer banner */}
                                    {activeQuestion.mode === 'CHALLENGE' && challengeTimeLeft !== null && (
                                        <div class="bg-amber-100 text-amber-900 border border-amber-300 px-3 py-1.5 rounded-xl font-mono font-bold text-sm">
                                            ⏱️ {Math.floor(challengeTimeLeft / 60)}:{(challengeTimeLeft % 60).toString().padStart(2, '0')}
                                        </div>
                                    )}
                                </div>

                                {/* Choice / TF Mode */}
                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div class="space-y-4">
                                        <div class="grid grid-cols-1 gap-2.5">
                                            {activeQuestion.choiceOptions.map((opt) => (
                                                <button
                                                    key={opt}
                                                    disabled={submitted && activeQuestion.lockAfterSubmit}
                                                    onClick={() => setMyAnswer(opt)}
                                                    class={`p-4 rounded-2xl text-left font-bold text-base border-2 transition ${
                                                        myAnswer === opt 
                                                        ? 'bg-indigo-600 text-white border-indigo-600 ring-2 ring-indigo-300' 
                                                        : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                                                    }`}
                                                >
                                                    {opt}
                                                </button>
                                            ))}
                                        </div>

                                        {/* Requirement 3: Independent Confirm Submit Button */}
                                        {!submitted && (
                                            <button 
                                                disabled={!myAnswer}
                                                onClick={() => handleSubmitAnswer(myAnswer)}
                                                class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-base rounded-2xl shadow-lg transition disabled:opacity-50"
                                            >
                                                ✅ 確認提交答案
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Requirement 3: Short Answer Mode */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-4">
                                        <textarea
                                            disabled={submitted && activeQuestion.lockAfterSubmit}
                                            value={myAnswer}
                                            onChange={(e) => setMyAnswer(e.target.value)}
                                            placeholder="請在此輸入您的回答..."
                                            class="w-full p-4 rounded-2xl border-2 border-slate-200 focus:ring-2 focus:ring-indigo-500 font-medium text-slate-800 h-32"
                                        />
                                        {!submitted && (
                                            <button 
                                                disabled={!myAnswer.trim()}
                                                onClick={() => handleSubmitAnswer(myAnswer)}
                                                class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-base rounded-2xl shadow-lg transition disabled:opacity-50"
                                            >
                                                ✅ 確認提交短答
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Requirement 1, 3, 27: Whiteboard Mode */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <WhiteboardCanvas 
                                        initialBg={activeQuestion.whiteboardBg}
                                        isReadOnly={submitted && activeQuestion.lockAfterSubmit}
                                        readOnlySrc={submitted ? myAnswer : null}
                                        onSubmitConfirm={(data) => {
                                            setMyAnswer(data);
                                            handleSubmitAnswer(data);
                                        }}
                                        showConfirmBtn={!submitted}
                                    />
                                )}

                                {/* Requirement 5: Audio Recording Mode */}
                                {activeQuestion.mode === 'AUDIO' && (
                                    <div class="space-y-4 text-center">
                                        {!audioUrl ? (
                                            <div class="py-6 space-y-3">
                                                <button 
                                                    onClick={isRecording ? stopRecording : startRecording}
                                                    class={`w-24 h-24 rounded-full font-black text-white text-xl shadow-xl transition transform active:scale-90 flex items-center justify-center mx-auto ${
                                                        isRecording ? 'bg-rose-600 animate-pulse' : 'bg-cyan-600 hover:bg-cyan-700'
                                                    }`}
                                                >
                                                    {isRecording ? '⏹️ 停止' : '🎤 錄音'}
                                                </button>
                                                <p class="text-xs text-slate-400 font-bold">點擊開始錄音 (最多10秒)</p>
                                            </div>
                                        ) : (
                                            <div class="bg-cyan-50 p-4 rounded-2xl border border-cyan-200 space-y-3">
                                                <audio src={audioUrl} controls class="w-full h-10 rounded-lg" />
                                                {!submitted && (
                                                    <div class="flex space-x-2">
                                                        <button 
                                                            onClick={() => { setAudioBlob(null); setAudioUrl(null); }}
                                                            class="w-1/2 py-2.5 bg-rose-100 text-rose-700 font-bold text-xs rounded-xl"
                                                        >
                                                            🗑️ 刪除重錄
                                                        </button>
                                                        <button 
                                                            onClick={submitAudioAnswer}
                                                            class="w-1/2 py-2.5 bg-emerald-600 text-white font-black text-xs rounded-xl shadow"
                                                        >
                                                            ✅ 確認提交錄音
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Requirement 18: Buzzer Mode */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="py-8 text-center">
                                        <button 
                                            disabled={submitted}
                                            onClick={() => handleSubmitAnswer('⚡ 搶答按鈕已按下')}
                                            class="w-40 h-40 rounded-full bg-rose-600 hover:bg-rose-700 active:scale-90 text-white font-black text-2xl shadow-2xl transition border-4 border-rose-300 mx-auto flex items-center justify-center"
                                        >
                                            🚨 搶答！
                                        </button>
                                    </div>
                                )}

                                {/* Requirement 4: Link / YouTube Mode */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div class="space-y-4 text-center">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div class="aspect-16-9 bg-black rounded-2xl overflow-hidden border">
                                                <iframe src={activeQuestion.youtubeEmbed} class="w-full h-full" allowFullScreen></iframe>
                                            </div>
                                        ) : (
                                            <div class="p-6 bg-amber-50 rounded-2xl border border-amber-200 font-bold text-slate-700">
                                                教師發送了外部網站連結：
                                            </div>
                                        )}

                                        <a 
                                            href={activeQuestion.pushedUrl} 
                                            target="_blank" 
                                            rel="noopener noreferrer"
                                            class="inline-flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold px-6 py-3.5 rounded-2xl shadow-lg text-base transition"
                                        >
                                            <span>開啟連結網站 ↗</span>
                                        </a>
                                    </div>
                                )}

                                {/* Requirement 15, 19, 28: Challenge Mode Student Interface */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                    <div class="space-y-6">
                                        <div class="bg-amber-50 border border-amber-200 p-4 rounded-2xl flex justify-between items-center">
                                            <span class="font-extrabold text-amber-900 text-sm">{activeQuestion.challenge.title}</span>
                                            <span class="text-xs bg-amber-200 text-amber-800 font-bold px-2.5 py-1 rounded-lg">
                                                總分：{activeQuestion.challenge.totalScore} 分
                                            </span>
                                        </div>

                                        {!submitted ? (
                                            <div class="space-y-5">
                                                {activeQuestion.challenge.questions.map((q) => (
                                                    <div key={q.num} class="bg-slate-50 p-4 rounded-2xl border space-y-2.5 text-xs">
                                                        <div class="font-black text-slate-800 text-sm">
                                                            {q.num}. {q.text}
                                                        </div>
                                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                            {q.options.map((opt) => (
                                                                <button 
                                                                    key={opt.letter}
                                                                    type="button"
                                                                    onClick={() => setChallengeAnswers(p => ({ ...p, [q.num]: opt.letter }))}
                                                                    class={`p-3 rounded-xl border font-bold text-left transition ${
                                                                        challengeAnswers[q.num] === opt.letter
                                                                        ? 'bg-amber-600 text-white border-amber-600'
                                                                        : 'bg-white text-slate-700 hover:bg-slate-100'
                                                                    }`}
                                                                >
                                                                    {opt.letter}. {opt.text}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}

                                                <button 
                                                    onClick={submitChallenge}
                                                    class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-base rounded-2xl shadow-lg transition active:scale-98"
                                                >
                                                    ✅ 確認提交整份挑戰題
                                                </button>
                                            </div>
                                        ) : (
                                            /* Locked details with green/red answer breakdown */
                                            <div class="space-y-4">
                                                {myPrevResponse?.scoreDetails && activeQuestion.challenge.scoresReleased ? (
                                                    <div class="bg-emerald-50 border-2 border-emerald-300 p-5 rounded-2xl text-center space-y-2">
                                                        <div class="text-xs font-extrabold text-emerald-800">挑戰題成績已發佈</div>
                                                        <div class="text-4xl font-black text-emerald-600 font-mono">
                                                            {myPrevResponse.scoreDetails.totalScore} / {activeQuestion.challenge.totalScore} 分
                                                        </div>
                                                        <div class="text-xs text-emerald-700 font-bold">
                                                            正確率：{myPrevResponse.scoreDetails.percentage}%
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div class="bg-amber-50 p-4 rounded-2xl text-center font-bold text-amber-900 text-xs">
                                                        已成功收卷提交！待教師發佈成績後可查看詳情。
                                                    </div>
                                                )}

                                                {activeQuestion.challenge.scoresReleased && (
                                                    <div class="space-y-3 pt-2">
                                                        <h4 class="font-extrabold text-slate-800 text-xs">考卷細項比對：</h4>
                                                        {activeQuestion.challenge.questions.map((q) => {
                                                            const studentChoice = myPrevResponse?.answer ? myPrevResponse.answer[q.num] : null;
                                                            const isCorrect = studentChoice === q.answer;

                                                            return (
                                                                <div key={q.num} class="bg-white p-3.5 rounded-xl border space-y-2 text-xs">
                                                                    <div class="font-bold text-slate-800 flex justify-between">
                                                                        <span>{q.num}. {q.text}</span>
                                                                        <span class={`font-black ${isCorrect ? 'text-emerald-600' : 'text-rose-600'}`}>
                                                                            {isCorrect ? '✓ 答對' : '✗ 答錯'}
                                                                        </span>
                                                                    </div>
                                                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-1.5">
                                                                        {q.options.map((opt) => {
                                                                            let optStyle = "bg-slate-50 border-slate-200 text-slate-600";
                                                                            if (opt.letter === q.answer) {
                                                                                optStyle = "bg-emerald-100 border-emerald-400 text-emerald-900 font-black";
                                                                            } else if (opt.letter === studentChoice && !isCorrect) {
                                                                                optStyle = "bg-rose-100 border-rose-400 text-rose-900 font-bold";
                                                                            }

                                                                            return (
                                                                                <div key={opt.letter} class={`p-2 rounded-lg border text-xs ${optStyle}`}>
                                                                                    {opt.letter}. {opt.text}
                                                                                    {opt.letter === q.answer && <span class="ml-1 text-emerald-700 font-bold">(正確答案)</span>}
                                                                                    {opt.letter === studentChoice && opt.letter !== q.answer && <span class="ml-1 text-rose-700 font-bold">(您的選擇)</span>}
                                                                                </div>
                                                                            );
                                                                        })}
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Requirement 6: Unified Praise Feedback Message */}
                                {submitted && activeQuestion.mode !== 'CHALLENGE' && (
                                    <div class="bg-emerald-50 border-2 border-emerald-300 p-5 rounded-2xl text-center space-y-2 animate-fade-in">
                                        <div class="text-3xl">🎉</div>
                                        <div class="text-base font-black text-emerald-800">
                                            已提交答案! 讚賞你的努力! 安靜等候老師指示...
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
