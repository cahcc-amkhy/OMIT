                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="text-lg font-black text-slate-800">🎲 抽選學生 (自訂學號範圍)</h3>
                                    <button onClick={() => setShowRandomModal(false)} class="text-slate-400 text-xl font-bold">✕</button>
                                </div>

                                <div class="flex items-center justify-center space-x-2 text-xs font-bold text-slate-600">
                                    <span>學號範圍：</span>
                                    <input 
                                        type="number" 
                                        value={rangeStart} 
                                        onChange={(e) => setRangeStart(e.target.value)}
                                        class="w-12 px-2 py-1 border rounded text-center font-bold"
                                    />
                                    <span>至</span>
                                    <input 
                                        type="number" 
                                        value={rangeEnd} 
                                        onChange={(e) => setRangeEnd(e.target.value)}
                                        class="w-12 px-2 py-1 border rounded text-center font-bold"
                                    />
                                </div>

                                <div class="h-32 bg-indigo-50 border-2 border-indigo-200 rounded-3xl flex items-center justify-center">
                                    <span class="text-6xl font-black text-indigo-600 font-mono">
                                        {currentDrawn !== null ? `${currentDrawn}號` : '?'}
                                    </span>
                                </div>

                                <div class="flex space-x-2">
                                    <button 
                                        onClick={() => {
                                            const available = [];
                                            for (let i = parseInt(rangeStart); i <= parseInt(rangeEnd); i++) {
                                                if (!drawnNumbers.includes(i)) available.push(i);
                                            }
                                            if (available.length === 0) {
                                                showToast("範圍內所有學號皆已被抽出！已自動重置。", "info");
                                                setDrawnNumbers([]);
                                                return;
                                            }
                                            setIsSpinning(true);
                                            let count = 0;
                                            const interval = setInterval(() => {
                                                setCurrentDrawn(available[Math.floor(Math.random() * available.length)]);
                                                playSound('spin');
                                                count++;
                                                if (count >= 15) {
                                                    clearInterval(interval);
                                                    const finalPick = available[Math.floor(Math.random() * available.length)];
                                                    setCurrentDrawn(finalPick);
                                                    setDrawnNumbers(prev => [...prev, finalPick]);
                                                    setIsSpinning(false);
                                                    playSound('win');
                                                }
                                            }, 100);
                                        }}
                                        disabled={isSpinning}
                                        class="flex-1 py-3 bg-purple-600 hover:bg-purple-700 text-white font-black rounded-xl shadow-md"
                                    >
                                        {isSpinning ? '滾動中...' : '開始抽籤 🎲'}
                                    </button>
                                    <button 
                                        onClick={() => { setDrawnNumbers([]); setCurrentDrawn(null); }}
                                        class="px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs"
                                    >
                                        重置
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Item 10: Timer Modal */}
                    {showTimerModal && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-sm w-full space-y-5 shadow-2xl text-center">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="text-lg font-black text-slate-800">⏱️ 倒數計時器</h3>
                                    <button onClick={() => setShowTimerModal(false)} class="text-slate-400 text-xl font-bold">✕</button>
                                </div>

                                <div class="text-5xl font-black font-mono text-amber-600 bg-amber-50 py-6 rounded-3xl border border-amber-200">
                                    {Math.floor(timerSeconds / 60).toString().padStart(2, '0')}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                </div>

                                <div class="flex flex-wrap gap-2 justify-center">
                                    {[30, 60, 120, 180, 240, 300].map(s => (
                                        <button 
                                            key={s} 
                                            onClick={() => { setTimerSeconds(s); setTimerActive(true); }}
                                            class="px-3 py-1.5 bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold rounded-xl text-xs"
                                        >
                                            {s < 60 ? `${s}秒` : `${s/60}分鐘`}
                                        </button>
                                    ))}
                                </div>

                                {/* Custom "00:00" format input */}
                                <div class="flex items-center justify-center space-x-2 pt-2 border-t">
                                    <span class="text-xs font-bold text-slate-600">手動輸入 00:00 :</span>
                                    <input 
                                        type="number" 
                                        value={customMinInput} 
                                        onChange={(e) => setCustomMinInput(e.target.value)}
                                        class="w-10 text-center font-mono font-bold border rounded px-1 py-1 text-xs"
                                        placeholder="分"
                                    />
                                    <span class="font-bold">:</span>
                                    <input 
                                        type="number" 
                                        value={customSecInput} 
                                        onChange={(e) => setCustomSecInput(e.target.value)}
                                        class="w-10 text-center font-mono font-bold border rounded px-1 py-1 text-xs"
                                        placeholder="秒"
                                    />
                                    <button 
                                        onClick={handleApplyCustomTimer}
                                        class="px-3 py-1 bg-amber-600 text-white font-bold rounded-lg text-xs"
                                    >
                                        開始
                                    </button>
                                </div>

                                <div class="flex space-x-2">
                                    <button 
                                        onClick={() => setTimerActive(!timerActive)}
                                        class="flex-1 py-2.5 bg-slate-800 text-white font-bold rounded-xl text-xs"
                                    >
                                        {timerActive ? '暫停' : '繼續'}
                                    </button>
                                    <button 
                                        onClick={() => { setTimerSeconds(0); setTimerActive(false); }}
                                        class="px-4 py-2.5 bg-slate-100 text-slate-700 font-bold rounded-xl text-xs"
                                    >
                                        清空
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Whiteboard Inspect Modal */}
                    {showInspectModal && (
                        <div class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-3xl w-full space-y-4 shadow-2xl">
                                <div class="flex justify-between items-center">
                                    <h3 class="text-lg font-black text-slate-800">
                                        作品預覽：{showInspectModal.name} ({showInspectModal.seatNumber}號)
                                    </h3>
                                    <button onClick={() => setShowInspectModal(null)} class="text-slate-400 text-2xl font-bold">✕</button>
                                </div>

                                <div class="aspect-16-9 bg-slate-100 rounded-2xl overflow-hidden border-2 flex items-center justify-center">
                                    {showInspectModal.answer?.startsWith('data:image') ? (
                                        <img src={showInspectModal.answer} class="max-h-full object-contain" alt="大圖" />
                                    ) : (
                                        <div class="p-8 text-2xl font-bold text-slate-800">{showInspectModal.answer}</div>
                                    )}
                                </div>

                                <div class="flex justify-between items-center pt-2">
                                    <button 
                                        onClick={() => {
                                            const updatedQ = { ...activeQuestion, broadcastedSubmission: showInspectModal };
                                            publishQuestionToFirestore(updatedQ);
                                            showToast(`已成功廣播 ${showInspectModal.name} 的作品至全班！`, "success");
                                        }}
                                        class="px-5 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-black text-sm shadow-md"
                                    >
                                        📢 廣播此作品至全班學生螢幕 (互評)
                                    </button>
                                    <button 
                                        onClick={() => {
                                            const updatedQ = { ...activeQuestion, broadcastedSubmission: null };
                                            publishQuestionToFirestore(updatedQ);
                                            showToast("已取消作品廣播", "info");
                                        }}
                                        class="px-4 py-2.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-xs"
                                    >
                                        取消廣播
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Bar Chart Choice Filter Popover */}
                    {barChoiceFilter && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="text-lg font-black text-slate-800">選擇【{barChoiceFilter}】的學生名單</h3>
                                    <button onClick={() => setBarChoiceFilter(null)} class="text-slate-400 text-xl font-bold">✕</button>
                                </div>
                                <div class="max-h-60 overflow-y-auto divide-y">
                                    {Object.values(currentQuestionResponses).filter(r => r.answer === barChoiceFilter).map((res) => (
                                        <div key={res.studentId} class="py-2.5 flex justify-between items-center text-sm font-bold text-slate-800">
                                            <span>{res.seatNumber}號 - {res.name}</span>
                                            <span class="font-mono text-xs text-slate-400">用時: {res.duration}s</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
            const [studentAnswer, setStudentAnswer] = useState('');
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [drawStrokeWidth, setDrawStrokeWidth] = useState(4);
            const [drawIsEraser, setDrawIsEraser] = useState(false);
            const [studentCanvasData, setStudentCanvasData] = useState(null);

            // Item 5: Recording State
            const [isRecording, setIsRecording] = useState(false);
            const [recordingTime, setRecordingTime] = useState(0);
            const [audioBlobUrl, setAudioBlobUrl] = useState(null);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            // Item 15 & 19: Challenge Mode State
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [challengeTimeLeft, setChallengeTimeLeft] = useState(null);

            const startTimeRef = useRef(Date.now());

            const myResKey = activeQuestion ? `${activeQuestion.id}_${studentId}` : null;
            const existingRes = myResKey ? responses[myResKey] : null;

            useEffect(() => {
                if (existingRes) {
                    setIsSubmitted(true);
                    if (existingRes.answer) setStudentAnswer(existingRes.answer);
                } else {
                    setIsSubmitted(false);
                    setStudentAnswer('');
                    setAudioBlobUrl(null);
                    setChallengeAnswers({});
                    startTimeRef.current = Date.now();
                }
            }, [activeQuestion?.id, existingRes]);

            // Item 13 & 15: Challenge Timer Countdown & Auto Submit
            useEffect(() => {
                if (activeQuestion?.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer && !isSubmitted) {
                    const limit = activeQuestion.challenge.timeLimit || 120;
                    setChallengeTimeLeft(limit);

                    const timer = setInterval(() => {
                        setChallengeTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timer);
                                handleSubmitChallenge(true); // Auto submit on timer end
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);

                    return () => clearInterval(timer);
                }
            }, [activeQuestion?.id, isSubmitted]);

            const submitResponseToFirestore = async (ansVal, extraObj = {}) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const duration = Math.max(1, Math.round((Date.now() - startTimeRef.current) / 1000));

                const resPayload = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: ansVal,
                    duration: duration,
                    submittedAt: Date.now(),
                    ...extraObj
                };

                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', `${activeQuestion.id}_${studentId}`);
                await window.fbUtils.setDoc(resDocRef, resPayload);

                setIsSubmitted(true);
                playSound('win');
            };

            // Item 5: Recording Start/Stop handlers
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const url = URL.createObjectURL(audioBlob);
                        setAudioBlobUrl(url);

                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => setStudentAnswer(reader.result);
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                    setRecordingTime(0);

                    const timer = setInterval(() => {
                        setRecordingTime(t => {
                            if (t >= 9) {
                                clearInterval(timer);
                                stopRecording();
                                return 10;
                            }
                            return t + 1;
                        });
                    }, 1000);
                } catch (e) {
                    showToast("無法存取麥克風，請檢查存取權限！", "error");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const handleSubmitChallenge = (auto = false) => {
                if (!activeQuestion || !activeQuestion.challenge) return;

                const questions = activeQuestion.challenge.questions || [];
                let correctCount = 0;

                questions.forEach((q, idx) => {
                    if (challengeAnswers[idx] === q.answer) correctCount++;
                });

                const totalQ = questions.length || 1;
                const scorePerQ = (activeQuestion.challenge.totalScore || 100) / totalQ;
                const totalScore = Math.round(correctCount * scorePerQ);
                const percentage = Math.round((correctCount / totalQ) * 100);

                const scoreDetails = {
                    totalScore,
                    percentage,
                    correctCount,
                    totalQ,
                    answersMap: challengeAnswers
                };

                submitResponseToFirestore('CHALLENGE_SUBMITTED', { scoreDetails });
                if (auto) showToast("限時結束！系統已為您自動提交挑戰題！", "info");
            };

            // Item 22.3.4: Team Answer Handler
            const handleTeamAnswerSubmit = async (chosenOption) => {
                if (!activeQuestion || activeQuestion.mode !== 'TEAM' || !activeQuestion.teamsList) return;

                const appId = "omit-8c173";
                const db = window.fbDb;

                const myTeamIndex = activeQuestion.teamsList.findIndex(t => t.members.some(m => m.id === studentId));
                if (myTeamIndex === -1) return;

                const myTeam = activeQuestion.teamsList[myTeamIndex];
                const currentQIdx = myTeam.currentQIdx || 0;
                const questions = activeQuestion.teamData?.questions || [];
                const currentQ = questions[currentQIdx];

                const updatedTeams = [...activeQuestion.teamsList];

                if (chosenOption === currentQ.answer) {
                    // Correct answer -> Step forward
                    const nextQIdx = currentQIdx + 1;
                    updatedTeams[myTeamIndex].progress = nextQIdx;
                    updatedTeams[myTeamIndex].currentQIdx = nextQIdx;

                    let winningTeam = null;
                    if (nextQIdx >= questions.length) {
                        winningTeam = updatedTeams[myTeamIndex];
                    }

                    const updatedQ = {
                        ...activeQuestion,
                        teamsList: updatedTeams,
                        winningTeam: winningTeam || activeQuestion.winningTeam
                    };

                    const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                    await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });

                    playSound('win');
                    showToast("答對了！向右著色前進一格！🎉", "success");
                } else {
                    // Wrong answer -> Penalty to zero!
                    updatedTeams[myTeamIndex].progress = 0;
                    updatedTeams[myTeamIndex].currentQIdx = 0;

                    const updatedQ = { ...activeQuestion, teamsList: updatedTeams };
                    const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                    await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });

                    playSound('buzzer');
                    showToast("答錯了！遭倒扣回到起點重新開始！", "error");
                }
            };

            return (
                <div class="min-h-screen bg-slate-100 pb-12">
                    {/* Header */}
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 py-3 shadow-sm">
                        <div class="max-w-md mx-auto flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <span class="bg-indigo-600 text-white font-black px-2.5 py-1 rounded-xl text-sm">OMIT</span>
                                <span class="font-extrabold text-slate-800 text-sm">
                                    {seatNumber}號 {studentName}
                                </span>
                            </div>
                            <button onClick={onExit} class="text-xs font-bold text-slate-500 hover:text-rose-600">
                                退出
                            </button>
                        </div>
                    </header>

                    <main class="max-w-md mx-auto p-4 space-y-4">

                        {/* Item 21 & 32: Broadcast Teacher Demo Canvas overlay on student screen */}
                        {activeQuestion?.teacherDemoBroadcast && (
                            <div class="bg-purple-900 text-white p-4 rounded-3xl space-y-3 shadow-2xl animate-fade-in border-4 border-purple-400">
                                <div class="flex justify-between items-center border-b border-purple-700 pb-2">
                                    <span class="font-black text-sm flex items-center gap-1.5">
                                        <span>📡 教師正在廣播白板示範</span>
                                    </span>
                                </div>
                                <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden">
                                    <img src={activeQuestion.teacherDemoBroadcast} class="w-full h-full object-contain" alt="教師示範" />
                                </div>
                            </div>
                        )}

                        {/* Item 2: Teacher Peer Review Broadcasted Submission */}
                        {activeQuestion?.broadcastedSubmission && (
                            <div class="bg-indigo-900 text-white p-4 rounded-3xl space-y-3 shadow-2xl animate-fade-in">
                                <div class="flex justify-between items-center border-b border-indigo-700 pb-2">
                                    <span class="font-black text-sm">📢 全班互評作品：{activeQuestion.broadcastedSubmission.name}</span>
                                </div>
                                <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden">
                                    <img src={activeQuestion.broadcastedSubmission.answer} class="w-full h-full object-contain" alt="廣播作品" />
                                </div>
                            </div>
                        )}

                        {/* Item 22.2.3 & 22.3.4: Team Competition Student View */}
                        {activeQuestion && activeQuestion.mode === 'TEAM' && (
                            <div class="bg-white rounded-3xl p-6 shadow-sm border-2 border-emerald-300 space-y-5">
                                {activeQuestion.teamStage === 'GROUP' && (
                                    <div class="text-center space-y-4 py-4">
                                        <div class="text-4xl animate-bounce">🤝</div>
                                        <h3 class="text-xl font-black text-emerald-900">
                                            您的所屬分組：
                                            {activeQuestion.teamsList?.find(t => t.members.some(m => m.id === studentId))?.emoji} 
                                            {activeQuestion.teamsList?.find(t => t.members.some(m => m.id === studentId))?.name}
                                        </h3>
                                        <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl font-black text-emerald-800 text-base">
                                            盡快與你的組員會合！比賽即將開始！🚀
                                        </div>
                                    </div>
                                )}

                                {activeQuestion.teamStage === 'COMPETITION' && (
                                    <div class="space-y-4">
                                        {activeQuestion.winningTeam ? (
                                            /* Item 22.3.5 & 24: Team Competition Winner Display & Answer Details */
                                            <div class="space-y-4">
                                                <div class="bg-amber-100 border-4 border-amber-400 p-6 rounded-3xl text-center space-y-3 animate-bounce">
                                                    <div class="text-5xl">🏆</div>
                                                    <h3 class="text-2xl font-black text-amber-900">
                                                        勝出組別：{activeQuestion.winningTeam.emoji} {activeQuestion.winningTeam.name}
                                                    </h3>
                                                    <div class="flex flex-wrap justify-center gap-1.5">
                                                        {activeQuestion.winningTeam.members.map(m => (
                                                            <span key={m.id} class="px-2.5 py-1 bg-white rounded-lg font-bold text-xs border">
                                                                {m.seatNumber}號 {m.name}
                                                            </span>
                                                        ))}
                                                    </div>
                                                </div>

                                                {/* Detailed Quiz Answer Breakdown */}
                                                <div class="space-y-3 pt-2">
                                                    <h4 class="font-black text-slate-800 text-sm">整份合作題考卷詳情：</h4>
                                                    {activeQuestion.teamData?.questions?.map((q, idx) => (
                                                        <div key={idx} class="bg-slate-50 p-3 rounded-2xl border text-xs space-y-1.5">
                                                            <div class="font-bold text-slate-800">第 {q.num || idx + 1} 題: {q.text}</div>
                                                            <div class="grid grid-cols-2 gap-1.5">
                                                                {q.options?.map(opt => (
                                                                    <div 
                                                                        key={opt.letter} 
                                                                        class={`p-2 rounded-xl font-bold border ${opt.letter === q.answer ? 'bg-emerald-100 text-emerald-900 border-emerald-400' : 'bg-white text-slate-600'}`}
                                                                    >
                                                                        {opt.letter}. {opt.text} {opt.letter === q.answer ? '(正確答案)' : ''}
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ) : (
                                            /* Item 22.3.4: Collaborative Split View for Options & Question */
                                            (() => {
                                                const myTeam = activeQuestion.teamsList?.find(t => t.members.some(m => m.id === studentId));
                                                const myMemberIndex = myTeam ? myTeam.members.findIndex(m => m.id === studentId) : 0;
                                                const currentQIdx = myTeam ? (myTeam.currentQIdx || 0) : 0;
                                                const currentQ = activeQuestion.teamData?.questions[currentQIdx];

                                                if (!currentQ) return <div class="text-center font-bold text-emerald-700">準備作答中...</div>;

                                                return (
                                                    <div class="space-y-4">
                                                        <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-2xl flex justify-between items-center text-xs font-bold text-emerald-900">
                                                            <span>組別：{myTeam.emoji} {myTeam.name}</span>
                                                            <span>第 {currentQIdx + 1} / {activeQuestion.teamData?.questions?.length} 題</span>
                                                        </div>

                                                        {/* Split role logic */}
                                                        {myMemberIndex === 0 ? (
                                                            <div class="bg-slate-900 text-white p-5 rounded-3xl space-y-2 shadow-lg">
                                                                <span class="text-xs bg-emerald-500 text-white px-2 py-0.5 rounded font-bold">您負責讀題：</span>
                                                                <h4 class="text-lg font-black">{currentQ.text}</h4>
                                                                <p class="text-xs text-slate-300">請將題目念給組員聽，與組員討論正確答案！</p>
                                                            </div>
                                                        ) : (
                                                            <div class="space-y-3">
                                                                <div class="text-xs font-bold text-slate-500">請與組員討論並點擊選擇答案：</div>
                                                                <div class="grid grid-cols-1 gap-2">
                                                                    {currentQ.options?.map((opt) => (
                                                                        <button 
                                                                            key={opt.letter}
                                                                            onClick={() => handleTeamAnswerSubmit(opt.letter)}
                                                                            class="p-4 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-2xl text-base shadow-md active:scale-95 transition text-left"
                                                                        >
                                                                            {opt.letter}. {opt.text}
                                                                        </button>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })()
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Standard Question Types */}
                        {activeQuestion && activeQuestion.mode !== 'TEAM' && (
                            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-6">
                                <div class="space-y-1">
                                    <span class="text-xs font-extrabold text-indigo-600 uppercase tracking-widest">
                                        【{getModeLabel(activeQuestion.mode)}】
                                    </span>
                                    <h3 class="text-lg font-black text-slate-800">{activeQuestion.text}</h3>
                                </div>

                                {/* Choice / TF Mode with Item 3: Confirmation Button */}
                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div class="space-y-4">
                                        <div class="grid grid-cols-1 gap-2.5">
                                            {activeQuestion.choiceOptions.map((opt) => (
                                                <button 
                                                    key={opt}
                                                    disabled={isSubmitted}
                                                    onClick={() => setStudentAnswer(opt)}
                                                    class={`p-4 rounded-2xl font-black text-base transition border-2 text-left flex items-center justify-between ${
                                                        studentAnswer === opt 
                                                        ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' 
                                                        : 'bg-slate-50 text-slate-800 border-slate-200 hover:bg-slate-100'
                                                    }`}
                                                >
                                                    <span>{opt}</span>
                                                    {studentAnswer === opt && <span>✓</span>}
                                                </button>
                                            ))}
                                        </div>

                                        {!isSubmitted && (
                                            <button 
                                                disabled={!studentAnswer}
                                                onClick={() => submitResponseToFirestore(studentAnswer)}
                                                class="w-full py-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-black shadow-lg text-base transition active:scale-98"
                                            >
                                                確認提交 🚀
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Short Answer Mode */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-4">
                                        <textarea 
                                            disabled={isSubmitted}
                                            placeholder="請在此輸入您的回答..." 
                                            value={studentAnswer}
                                            onChange={(e) => setStudentAnswer(e.target.value)}
                                            rows={4}
                                            class="w-full p-4 rounded-2xl border-2 border-slate-200 focus:outline-none focus:border-indigo-500 font-medium text-slate-800"
                                        />
                                        {!isSubmitted && (
                                            <button 
                                                disabled={!studentAnswer.trim()}
                                                onClick={() => submitResponseToFirestore(studentAnswer.trim())}
                                                class="w-full py-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-black shadow-lg text-base transition active:scale-98"
                                            >
                                                確認提交 🚀
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Item 1 & 27: Whiteboard Canvas with locked submit */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <div class="space-y-4">
                                        <WhiteboardCanvas 
                                            initialBg={activeQuestion.whiteboardBg}
                                            disabled={isSubmitted}
                                            strokeWidth={drawStrokeWidth}
                                            setStrokeWidth={setDrawStrokeWidth}
                                            isEraser={drawIsEraser}
                                            setIsEraser={setDrawIsEraser}
                                            onSave={(dataUrl) => setStudentCanvasData(dataUrl)}
                                        />

                                        {!isSubmitted && (
                                            <button 
                                                onClick={() => submitResponseToFirestore(studentCanvasData || '')}
                                                class="w-full py-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-black shadow-lg text-base transition active:scale-98"
                                            >
                                                確認提交白板 🚀
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Item 18: Buzzer Mode */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="text-center py-6 space-y-4">
                                        <button 
                                            disabled={isSubmitted}
                                            onClick={() => submitResponseToFirestore('BUZZED')}
                                            class={`w-48 h-48 rounded-full font-black text-3xl shadow-2xl transition active:scale-90 border-8 ${
                                                isSubmitted 
                                                ? 'bg-slate-300 text-slate-500 border-slate-400 cursor-not-allowed' 
                                                : 'bg-rose-600 hover:bg-rose-700 text-white border-rose-300 animate-pulse'
                                            }`}
                                        >
                                            {isSubmitted ? '已搶答' : '🚨 搶答！'}
                                        </button>
                                    </div>
                                )}

                                {/* Item 5: Audio Mode with preview, re-record, and confirm submit */}
                                {activeQuestion.mode === 'AUDIO' && (
                                    <div class="space-y-4 text-center">
                                        {!isSubmitted && (
                                            <div class="space-y-4">
                                                {!audioBlobUrl ? (
                                                    <button 
                                                        onClick={isRecording ? stopRecording : startRecording}
                                                        class={`w-full py-5 rounded-2xl font-black text-lg transition shadow-lg ${
                                                            isRecording 
                                                            ? 'bg-rose-600 text-white animate-pulse' 
                                                            : 'bg-cyan-600 hover:bg-cyan-700 text-white'
                                                        }`}
                                                    >
                                                        {isRecording ? `🛑 停止錄音 (${recordingTime}s / 10s)` : '🎤 開始錄音 (最多10秒)'}
                                                    </button>
                                                ) : (
                                                    <div class="space-y-4 bg-cyan-50 p-4 rounded-2xl border border-cyan-200">
                                                        <div class="text-xs font-bold text-cyan-900">試聽您的錄音：</div>
                                                        <audio src={audioBlobUrl} controls class="w-full h-10 rounded-lg" />
                                                        <div class="flex space-x-2">
                                                            <button 
                                                                onClick={() => { setAudioBlobUrl(null); setStudentAnswer(''); }}
                                                                class="w-1/2 py-3 bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold rounded-xl text-sm"
                                                            >
                                                                🗑️ 刪除重錄
                                                            </button>
                                                            <button 
                                                                onClick={() => submitResponseToFirestore(studentAnswer)}
                                                                class="w-1/2 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl text-sm shadow-md"
                                                            >
                                                                ✅ 確認提交錄音
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Item 15, 19, 28: Challenge Mode Student View */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                    <div class="space-y-6">
                                        {activeQuestion.challenge.enableTimer && challengeTimeLeft !== null && (
                                            <div class="bg-amber-100 border border-amber-300 p-3 rounded-2xl flex justify-between items-center font-bold text-amber-900 text-sm">
                                                <span>⏱️ 剩餘時間：</span>
                                                <span class="font-mono text-lg font-black">
                                                    {Math.floor(challengeTimeLeft / 60)}:{(challengeTimeLeft % 60).toString().padStart(2, '0')}
                                                </span>
                                            </div>
                                        )}

                                        {/* Questions List */}
                                        <div class="space-y-6">
                                            {activeQuestion.challenge.questions.map((q, qIdx) => {
                                                const scoresReleased = activeQuestion.challenge.releaseInstant || activeQuestion.challenge.scoresReleased;
                                                const mySelected = challengeAnswers[qIdx];
                                                const isCorrect = mySelected === q.answer;

                                                return (
                                                    <div key={qIdx} class="bg-slate-50 p-4 rounded-2xl border space-y-3">
                                                        <div class="font-black text-slate-800 text-sm">
                                                            第 {q.num || qIdx + 1} 題: {q.text}
                                                        </div>

                                                        <div class="grid grid-cols-1 gap-2">
                                                            {q.options.map((opt) => {
                                                                let btnStyle = 'bg-white text-slate-700 border-slate-200';

                                                                if (!isSubmitted) {
                                                                    if (mySelected === opt.letter) btnStyle = 'bg-amber-500 text-white border-amber-600 shadow-sm';
                                                                } else if (scoresReleased) {
                                                                    /* Item 19: Detailed green/red highlight for review */
                                                                    if (opt.letter === q.answer) {
                                                                        btnStyle = 'bg-emerald-500 text-white border-emerald-600 font-black';
                                                                    } else if (mySelected === opt.letter && !isCorrect) {
                                                                        btnStyle = 'bg-rose-500 text-white border-rose-600 font-black';
                                                                    }
                                                                }

                                                                return (
                                                                    <button 
                                                                        key={opt.letter}
                                                                        disabled={isSubmitted}
                                                                        onClick={() => setChallengeAnswers({ ...challengeAnswers, [qIdx]: opt.letter })}
                                                                        class={`p-3 rounded-xl text-left font-bold text-xs border transition ${btnStyle}`}
                                                                    >
                                                                        <span>{opt.letter}. {opt.text}</span>
                                                                        {scoresReleased && isSubmitted && opt.letter === q.answer && (
                                                                            <span class="float-right font-black"> (正確答案)</span>
                                                                        )}
                                                                        {scoresReleased && isSubmitted && mySelected === opt.letter && !isCorrect && (
                                                                            <span class="float-right font-black"> (您的選擇 - 答錯)</span>
                                                                        )}
                                                                    </button>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        {!isSubmitted && (
                                            <button 
                                                onClick={() => handleSubmitChallenge(false)}
                                                class="w-full py-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-black shadow-lg text-base transition active:scale-98"
                                            >
                                                確認提交全份挑戰題 🚀
                                            </button>
                                        )}

                                        {/* Item 28: Total Score display after score release */}
                                        {isSubmitted && existingRes?.scoreDetails && (activeQuestion.challenge.releaseInstant || activeQuestion.challenge.scoresReleased) && (
                                            <div class="bg-emerald-50 border-2 border-emerald-400 p-4 rounded-2xl text-center space-y-1">
                                                <span class="text-xs font-bold text-emerald-800">您的最終成績：</span>
                                                <div class="text-3xl font-black text-emerald-600">
                                                    {existingRes.scoreDetails.totalScore} / {activeQuestion.challenge.totalScore} 分
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Item 4: YouTube & Pushed Link Viewer */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div class="space-y-4">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div class="aspect-16-9 w-full rounded-2xl overflow-hidden shadow-lg border">
                                                <iframe 
                                                    src={activeQuestion.youtubeEmbed} 
                                                    class="w-full h-full" 
                                                    allow="autoplay; encrypted-media" 
                                                    allowFullScreen
                                                ></iframe>
                                            </div>
                                        ) : null}

                                        {activeQuestion.pushedUrl && (
                                            <a 
                                                href={activeQuestion.pushedUrl} 
                                                target="_blank" 
                                                rel="noreferrer"
                                                class="block w-full text-center py-4 rounded-2xl bg-amber-500 hover:bg-amber-600 text-white font-black shadow-md text-base transition"
                                            >
                                                開啟連結網站 ↗
                                            </a>
                                        )}
                                    </div>
                                )}

                                {/* Item 6: Feedback Alert Message */}
                                {isSubmitted && (
                                    <div class="bg-emerald-500 text-white p-4 rounded-2xl text-center font-black text-sm shadow-md animate-fade-in space-y-1">
                                        <div>已提交答案! 讚賞你的努力!</div>
                                        <div class="text-xs opacity-90">安靜等候老師指示...</div>
                                    </div>
                                )}
                            </div>
                        )}

                        {!activeQuestion && (
                            <div class="text-center py-12 bg-white rounded-3xl p-6 border text-slate-400 space-y-3 shadow-sm">
                                <div class="text-4xl">⏳</div>
                                <div class="font-bold text-base text-slate-700">安靜等候老師發佈題目...</div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
