                                    className="w-full h-full max-w-5xl max-h-full aspect-16-9 bg-white shadow-lg border"
                                />
                            </div>
                            
                            <div class="p-3 bg-slate-800 flex justify-center">
                                <button 
                                    onClick={handleBroadcastDemo}
                                    class={`px-6 py-3 rounded-xl font-bold text-white shadow-lg flex items-center gap-2 transition ${isBroadcastingDemo ? 'bg-red-500 hover:bg-red-600' : 'bg-indigo-600 hover:bg-indigo-700'}`}
                                >
                                    {isBroadcastingDemo ? '🔴 停止廣播分享' : '📡 廣播分享至全班'}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Inspect Submission Modal (Whiteboard, Short Answer, Challenge Detail) */}
                    {showInspectModal && (
                        <div class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4">
                            <div class="w-full max-w-5xl flex justify-between items-center mb-4 text-white">
                                <div class="font-black text-xl flex flex-col sm:flex-row sm:items-center gap-2">
                                    <span>{showInspectModal.name} ({showInspectModal.seatNumber}號) 的作答</span>
                                    {showInspectModal.type !== 'CHALLENGE_SUBMISSION' && (
                                        <span class="text-sm font-mono text-slate-300 bg-slate-800 px-2 py-1 rounded-lg">用時: {showInspectModal.duration}s</span>
                                    )}
                                </div>
                                <button onClick={() => setShowInspectModal(null)} class="text-white hover:text-slate-300 text-3xl font-bold">&times;</button>
                            </div>

                            <div class="w-full max-w-5xl bg-white rounded-2xl overflow-hidden shadow-2xl flex-1 max-h-[75vh] flex flex-col relative">
                                {showInspectModal.type === 'CHALLENGE_SUBMISSION' ? (
                                    <div class="p-6 overflow-y-auto w-full space-y-6">
                                        <div class="flex justify-between items-center bg-amber-50 p-4 rounded-xl border border-amber-200">
                                            <div>
                                                <h3 class="font-black text-amber-900 text-lg">{activeQuestion.challenge.title}</h3>
                                                <p class="text-sm text-amber-700 font-bold">總分: {activeQuestion.challenge.totalScore} | 學生得分: {showInspectModal.scoreDetails.totalScore}</p>
                                            </div>
                                            <div class="text-2xl font-black text-emerald-600 bg-emerald-50 px-4 py-2 rounded-xl border border-emerald-200">
                                                {showInspectModal.scoreDetails.percentage}%
                                            </div>
                                        </div>
                                        
                                        <div class="space-y-4">
                                            {activeQuestion.challenge.questions.map((q, qIdx) => {
                                                const stuAns = showInspectModal.answers[qIdx];
                                                const isCorrect = stuAns === q.answer;
                                                return (
                                                    <div key={qIdx} class={`p-4 rounded-xl border-2 ${isCorrect ? 'border-emerald-300 bg-emerald-50/30' : 'border-red-300 bg-red-50/30'}`}>
                                                        <p class="font-bold text-slate-800 mb-3">{q.num}. {q.text}</p>
                                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                            {q.options.map(opt => {
                                                                let bg = "bg-white border-slate-200 text-slate-600";
                                                                if (opt.letter === q.answer) bg = "bg-emerald-100 border-emerald-400 text-emerald-800 font-bold ring-2 ring-emerald-400";
                                                                else if (opt.letter === stuAns && !isCorrect) bg = "bg-red-100 border-red-400 text-red-800 font-bold line-through decoration-red-500 decoration-2";
                                                                
                                                                return (
                                                                    <div key={opt.letter} class={`px-3 py-2 rounded-lg border ${bg} flex items-center space-x-2 text-sm`}>
                                                                        <span class="w-6 font-black">{opt.letter}.</span>
                                                                        <span>{opt.text}</span>
                                                                        {opt.letter === q.answer && <span class="ml-auto text-emerald-600">✅ 正確答案</span>}
                                                                        {opt.letter === stuAns && !isCorrect && <span class="ml-auto text-red-600">❌ 學生選擇</span>}
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ) : activeQuestion.mode === 'DRAW' ? (
                                    <div class="w-full h-full flex items-center justify-center bg-slate-100 p-4 relative">
                                        <div class="relative w-full max-w-4xl aspect-16-9 bg-white shadow-lg border rounded-xl overflow-hidden">
                                            {showInspectModal.whiteboardBg && (
                                                <img src={showInspectModal.whiteboardBg} class="absolute inset-0 w-full h-full object-contain opacity-50" />
                                            )}
                                            <img src={showInspectModal.answer} class="relative z-10 w-full h-full object-contain" />
                                        </div>
                                    </div>
                                ) : (
                                    <div class="p-8 flex items-center justify-center h-full overflow-y-auto">
                                        <p class="text-2xl font-bold text-slate-800 break-words w-full text-center">{showInspectModal.answer}</p>
                                    </div>
                                )}
                            </div>

                            <div class="w-full max-w-5xl mt-4 flex justify-between items-center gap-4">
                                <div class="flex gap-2">
                                    <button 
                                        onClick={() => {
                                            const sorted = leaderboard;
                                            const currentIndex = sorted.findIndex(r => r.studentId === showInspectModal.studentId);
                                            if (currentIndex > 0) setShowInspectModal(sorted[currentIndex - 1]);
                                        }}
                                        class="bg-slate-700 hover:bg-slate-600 text-white px-5 py-3 rounded-xl font-bold transition flex items-center gap-2"
                                        disabled={leaderboard.findIndex(r => r.studentId === showInspectModal.studentId) <= 0}
                                    >
                                        <span>⬅️ 上一位</span>
                                    </button>
                                    <button 
                                        onClick={() => {
                                            const sorted = leaderboard;
                                            const currentIndex = sorted.findIndex(r => r.studentId === showInspectModal.studentId);
                                            if (currentIndex < sorted.length - 1) setShowInspectModal(sorted[currentIndex + 1]);
                                        }}
                                        class="bg-slate-700 hover:bg-slate-600 text-white px-5 py-3 rounded-xl font-bold transition flex items-center gap-2"
                                        disabled={leaderboard.findIndex(r => r.studentId === showInspectModal.studentId) >= leaderboard.length - 1}
                                    >
                                        <span>下一位 ➡️</span>
                                    </button>
                                </div>

                                {activeQuestion.mode !== 'CHALLENGE' && (
                                    <button 
                                        onClick={() => handleBroadcastSubmission(showInspectModal)}
                                        class={`px-6 py-3 rounded-xl font-black shadow-lg transition active:scale-95 flex items-center gap-2 ${
                                            activeQuestion.broadcastedSubmission?.studentId === showInspectModal.studentId 
                                            ? 'bg-red-500 text-white hover:bg-red-600' 
                                            : 'bg-indigo-500 text-white hover:bg-indigo-600'
                                        }`}
                                    >
                                        {activeQuestion.broadcastedSubmission?.studentId === showInspectModal.studentId ? '🔴 停止廣播' : '📡 廣播至全班螢幕 (互評)'}
                                    </button>
                                )}
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
            const [localAnswer, setLocalAnswer] = useState('');
            const [hasSubmitted, setHasSubmitted] = useState(false);
            const [isRecording, setIsRecording] = useState(false);
            const [recordedAudio, setRecordedAudio] = useState(null);
            const [localChallengeAnswers, setLocalChallengeAnswers] = useState({});
            const [showChallengeDetail, setShowChallengeDetail] = useState(false);
            const [coopGroup, setCoopGroup] = useState(null);
            const [coopCurrentQIndex, setCoopCurrentQIndex] = useState(0);

            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);
            const recordingTimerRef = useRef(null);
            
            const prevQuestionId = useRef(activeQuestion?.id);

            // Handle New Question & Reset State
            useEffect(() => {
                if (activeQuestion) {
                    if (prevQuestionId.current !== activeQuestion.id) {
                        setHasSubmitted(false);
                        setLocalAnswer('');
                        setRecordedAudio(null);
                        setLocalChallengeAnswers({});
                        setShowChallengeDetail(false);
                        setCoopCurrentQIndex(0);
                        prevQuestionId.current = activeQuestion.id;
                    }
                    
                    const myRes = responses[`${activeQuestion.id}_${studentId}`];
                    if (myRes) {
                        setHasSubmitted(true);
                        if (activeQuestion.mode === 'CHALLENGE') {
                            setLocalChallengeAnswers(myRes.answers || {});
                        } else if (activeQuestion.mode !== 'COOP') {
                            setLocalAnswer(myRes.answer);
                        }
                    } else if (activeQuestion.lockAfterSubmit === false) {
                         setHasSubmitted(false); // If teacher unlocks, allow re-submit
                    }
                    
                    // Coop Mode Group mapping
                    if (activeQuestion.mode === 'COOP' && activeQuestion.coopGroups) {
                        const myGroup = activeQuestion.coopGroups.find(g => g.members.some(m => m.id === studentId));
                        setCoopGroup(myGroup);
                    }
                }
            }, [activeQuestion, responses, studentId]);

            // Submit Answer Function
            const submitAnswer = async (answerVal, overrideMode = null) => {
                if (!activeQuestion || (hasSubmitted && activeQuestion.lockAfterSubmit && overrideMode !== 'CHALLENGE')) return;

                const mode = overrideMode || activeQuestion.mode;
                const duration = Math.round((Date.now() - activeQuestion.startTime) / 1000);

                const responseObj = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    name: studentName || `學號 ${seatNumber}`,
                    seatNumber: seatNumber,
                    duration: duration,
                    timestamp: Date.now()
                };

                if (mode === 'CHALLENGE') {
                    responseObj.answers = answerVal;
                    // Auto Calculate Score locally for immediate saving
                    let score = 0;
                    activeQuestion.challenge.questions.forEach((q, idx) => {
                        if (answerVal[idx] === q.answer) {
                            score += (activeQuestion.challenge.totalScore / activeQuestion.challenge.questions.length);
                        }
                    });
                    const pct = Math.round((score / activeQuestion.challenge.totalScore) * 100);
                    responseObj.scoreDetails = {
                        totalScore: Math.round(score),
                        percentage: pct
                    };
                    responseObj.type = 'CHALLENGE_SUBMISSION';
                } else if (mode === 'COOP_PROGRESS') {
                     responseObj.type = 'COOP_PROGRESS';
                     responseObj.progress = answerVal.progress;
                     responseObj.groupId = answerVal.groupId;
                     // Don't show success toast for background progress update
                } else {
                    responseObj.answer = answerVal;
                }

                try {
                    const appId = "omit-8c173";
                    const db = window.fbDb;
                    const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', `${activeQuestion.id}_${studentId}`);
                    await window.fbUtils.setDoc(resDocRef, responseObj);
                    
                    if (mode !== 'COOP_PROGRESS') {
                        setHasSubmitted(true);
                        showToast('已提交答案! 讚賞你的努力! 安靜等候老師指示...', 'success');
                    }
                } catch (err) {
                    console.error("Submit error:", err);
                    showToast('提交失敗，請重試', 'error');
                }
            };
            
            // Audio Recording Logic
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mr = new MediaRecorder(stream);
                    mediaRecorderRef.current = mr;
                    audioChunksRef.current = [];

                    mr.ondataavailable = e => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mr.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(blob);
                        reader.onloadend = () => {
                            setRecordedAudio(reader.result);
                        };
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mr.start();
                    setIsRecording(true);

                    recordingTimerRef.current = setTimeout(() => {
                        stopRecording();
                    }, 10000); // 10s max
                } catch (e) {
                    console.error("Microphone access error:", e);
                    showToast("無法存取麥克風，請檢查權限設定！", "error");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && mediaRecorderRef.current.state === "recording") {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                    clearTimeout(recordingTimerRef.current);
                }
            };
            
            const submitAudio = () => {
                if (recordedAudio) {
                    submitAnswer(recordedAudio);
                }
            };

            // Challenge Mode Logic
            const handleChallengeOptionSelect = (qIndex, optionLetter) => {
                if (hasSubmitted && activeQuestion.lockAfterSubmit) return;
                setLocalChallengeAnswers(prev => ({
                    ...prev,
                    [qIndex]: optionLetter
                }));
            };

            const submitChallenge = () => {
                if (Object.keys(localChallengeAnswers).length < activeQuestion.challenge.questions.length) {
                    if(!window.confirm("尚有未作答的題目，確定要提早交卷嗎？")) return;
                }
                submitAnswer(localChallengeAnswers, 'CHALLENGE');
            };

            // Challenge Timer Auto-submit Effect
            useEffect(() => {
                if (activeQuestion?.mode === 'CHALLENGE' && activeQuestion.challenge.enableTimer && !hasSubmitted) {
                    const elapsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                    const remaining = activeQuestion.challenge.timeLimit - elapsed;
                    
                    if (remaining <= 0) {
                        submitChallenge(); // Auto submit
                        showToast("限時已到！系統已自動收卷。", "info");
                    } else {
                        const timerId = setTimeout(() => {
                            if(!hasSubmitted) {
                                submitChallenge();
                                showToast("限時已到！系統已自動收卷。", "info");
                            }
                        }, remaining * 1000);
                        return () => clearTimeout(timerId);
                    }
                }
            }, [activeQuestion, hasSubmitted]);
            
            // Coop Mode Logic
            const handleCoopAnswer = (qIndex, optionLetter) => {
                if (!activeQuestion || !coopGroup) return;
                
                const q = activeQuestion.coop.questions[qIndex];
                const isCorrect = optionLetter === q.answer;
                
                if (isCorrect) {
                    playSound('win');
                    // Update group progress to Firestore
                    const newProgress = coopGroup.progress + 1;
                    submitAnswer({ progress: newProgress, groupId: coopGroup.id }, 'COOP_PROGRESS');
                    showToast("答對了！繼續下一題！", "success");
                } else {
                    playSound('alarm');
                    // Reset progress to 0
                    submitAnswer({ progress: 0, groupId: coopGroup.id }, 'COOP_PROGRESS');
                    showToast("答錯了！退回起點重新開始！", "error");
                }
            };

            // Get My Member Index for Coop distribution
            const myCoopIndex = useMemo(() => {
                if (!coopGroup) return -1;
                return coopGroup.members.findIndex(m => m.id === studentId);
            }, [coopGroup, studentId]);

            // Waiting State / No Active Question
            if (!activeQuestion) {
                return (
                    <div class="min-h-screen bg-slate-100 p-4 md:p-6 flex flex-col items-center justify-center space-y-6">
                        <div class="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full text-center space-y-4">
                            <div class="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center mx-auto animate-pulse">
                                <span class="text-3xl">☕</span>
                            </div>
                            <h2 class="text-xl font-black text-slate-800">請稍候</h2>
                            <p class="text-slate-500 font-bold">等待老師發佈下一條問題...</p>
                            
                            <div class="mt-6 pt-6 border-t border-slate-100 flex justify-between items-center text-sm font-bold text-slate-400">
                                <span>{studentName} ({seatNumber}號)</span>
                                <span>房號: {roomCode}</span>
                            </div>
                        </div>
                        <button onClick={onExit} class="text-slate-400 hover:text-slate-600 font-bold text-sm underline underline-offset-4">退出課室</button>
                    </div>
                );
            }

            // Broadcast Mode Overlay (Student sees teacher's / other student's screen)
            if (activeQuestion.demoWhiteboard) {
                return (
                    <div class="min-h-screen bg-slate-900 p-2 md:p-4 flex flex-col relative z-50">
                        <div class="bg-indigo-600 text-white text-center py-2 px-4 rounded-xl font-bold mb-4 flex justify-between items-center shadow-md">
                            <span class="animate-pulse">🔴 教師示範廣播中</span>
                        </div>
                        <div class="flex-1 bg-white rounded-2xl p-2 flex items-center justify-center shadow-2xl overflow-hidden relative">
                            <img src={activeQuestion.demoWhiteboard} class="w-full h-full object-contain" />
                        </div>
                    </div>
                );
            }

            if (activeQuestion.broadcastedSubmission) {
                const bSub = activeQuestion.broadcastedSubmission;
                return (
                    <div class="min-h-screen bg-slate-900 p-2 md:p-4 flex flex-col relative z-50">
                        <div class="bg-indigo-600 text-white text-center py-2 px-4 rounded-xl font-bold mb-4 flex justify-between items-center shadow-md">
                            <span class="animate-pulse">🔴 廣播互評中</span>
                            <span class="bg-indigo-800 px-3 py-1 rounded-lg text-sm">{bSub.name} ({bSub.seatNumber}號) 的作品</span>
                        </div>
                        
                        <div class="flex-1 bg-white rounded-2xl p-2 flex items-center justify-center shadow-2xl overflow-hidden relative">
                            {bSub.answer && bSub.answer.startsWith('data:image') ? (
                                <div class="relative w-full h-full aspect-16-9 max-w-5xl mx-auto flex items-center justify-center">
                                     {bSub.whiteboardBg && (
                                        <img src={bSub.whiteboardBg} class="absolute inset-0 w-full h-full object-contain opacity-50" />
                                    )}
                                    <img src={bSub.answer} class="relative z-10 w-full h-full object-contain" />
                                </div>
                            ) : (
                                <div class="p-8 text-center">
                                    <p class="text-3xl font-bold text-slate-800 break-words">{bSub.answer}</p>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col relative">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    
                    {/* Header */}
                    <header class="bg-white border-b p-4 shadow-sm sticky top-0 z-30 flex justify-between items-center">
                        <div class="font-black text-slate-800 flex items-center gap-2">
                            <span class="bg-slate-800 text-white px-2 py-1 rounded-md text-sm">OMIT</span>
                            <span class="text-sm md:text-base truncate">{activeQuestion.mode === 'CHALLENGE' ? activeQuestion.challenge.title : (activeQuestion.mode === 'COOP' ? activeQuestion.coop.title : activeQuestion.text)}</span>
                        </div>
                        <div class="flex items-center gap-3">
                             {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge.enableTimer && !hasSubmitted && (
                                <div class="bg-red-50 text-red-600 px-3 py-1 rounded-lg font-mono font-bold text-sm border border-red-200 shadow-inner flex items-center gap-1.5 animate-pulse">
                                    <span>⏳</span>
                                    <CountdownTimer startTime={activeQuestion.startTime} limit={activeQuestion.challenge.timeLimit} />
                                </div>
                            )}
                            <div class="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1 rounded-full truncate max-w-[120px] md:max-w-none">
                                {studentName} ({seatNumber}號)
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main class={`flex-1 overflow-y-auto p-4 md:p-6 ${hasSubmitted && activeQuestion.lockAfterSubmit && activeQuestion.mode !== 'CHALLENGE' ? 'opacity-70 pointer-events-none' : ''}`}>
                        
                        {/* COOP STAGES Rendering */}
                        {activeQuestion.mode === 'COOP' && (
                            <div class="max-w-3xl mx-auto w-full">
                                {activeQuestion.coopStage === 'PREP' && (
                                    <div class="bg-white p-8 rounded-3xl shadow-md text-center space-y-4">
                                        <div class="text-5xl mb-4">🤝</div>
                                        <h2 class="text-2xl font-black text-slate-800">準備合作挑戰</h2>
                                        <p class="text-slate-500 font-bold">老師正在分配組別，請稍候...</p>
                                    </div>
                                )}
                                
                                {activeQuestion.coopStage === 'GROUP' && coopGroup && (
                                    <div class="bg-white p-8 rounded-3xl shadow-xl text-center space-y-6 animate-fade-in border-4 border-blue-400">
                                        <h2 class="text-2xl font-black text-slate-800">你的組別是</h2>
                                        <div class={`inline-block px-8 py-4 rounded-2xl ${coopGroup.color} ${coopGroup.textColor} text-3xl font-black shadow-inner`}>
                                            <span class="mr-3 text-4xl">{coopGroup.emoji}</span>
                                            {coopGroup.name}
                                        </div>
                                        
                                        <div class="space-y-3">
                                            <p class="font-bold text-slate-600">你的組員有：</p>
                                            <div class="flex flex-wrap justify-center gap-2">
                                                {coopGroup.members.map(m => (
                                                    <span key={m.id} class={`px-4 py-2 rounded-xl font-bold ${m.id === studentId ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-100 text-slate-700 border'}`}>
                                                        {m.seatNumber}號 {m.name} {m.id === studentId ? '(你)' : ''}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                        
                                        <div class="bg-yellow-50 text-yellow-800 p-4 rounded-xl font-black text-lg mt-6 animate-pulse border border-yellow-200">
                                            盡快與你的組員會合！比賽即將開始！
                                        </div>
                                    </div>
                                )}
                                
                                {activeQuestion.coopStage === 'PLAY' && coopGroup && !activeQuestion.coopWinner && (
                                    <div class="bg-white p-4 md:p-8 rounded-3xl shadow-xl border-t-8 border-indigo-500">
                                        <div class="flex justify-between items-center mb-6 pb-4 border-b">
                                            <div class={`px-4 py-1.5 rounded-xl ${coopGroup.color} ${coopGroup.textColor} font-black text-sm flex items-center gap-2`}>
                                                <span>{coopGroup.emoji}</span> {coopGroup.name}
                                            </div>
                                            <div class="font-bold text-slate-600 text-sm">
                                                進度：<span class="text-indigo-600 font-black text-lg">{coopGroup.progress}</span> / {activeQuestion.coop.questions.length}
                                            </div>
                                        </div>
                                        
                                        {(() => {
                                            const currentQIndex = coopGroup.progress;
                                            if (currentQIndex >= activeQuestion.coop.questions.length) return null;
                                            
                                            const q = activeQuestion.coop.questions[currentQIndex];
                                            const memberCount = coopGroup.members.length;
                                            
                                            // Determine what this student sees based on their index
                                            // Distribute: 1 sees question, others see options
                                            let myRole = ''; // 'QUESTION' or 'OPTIONS'
                                            let myOptions = [];
                                            
                                            if (myCoopIndex === 0) {
                                                myRole = 'QUESTION';
                                            } else {
                                                myRole = 'OPTIONS';
                                                // Divide options among remaining members
                                                const totalOptions = q.options.length;
                                                const optionsPerMember = Math.ceil(totalOptions / (memberCount - 1));
                                                const startIdx = (myCoopIndex - 1) * optionsPerMember;
                                                myOptions = q.options.slice(startIdx, startIdx + optionsPerMember);
                                            }
                                            
                                            return (
                                                <div class="space-y-8 py-4">
                                                    {myRole === 'QUESTION' ? (
                                                        <div class="text-center space-y-6">
                                                            <div class="bg-slate-50 p-6 rounded-2xl border text-xl font-black text-slate-800 shadow-sm">
                                                                <span class="text-indigo-600 mr-2">Q{q.num}.</span>
                                                                {q.text}
                                                            </div>
                                                            <div class="text-sm font-bold text-slate-500 animate-pulse bg-indigo-50 py-3 rounded-xl">
                                                                請把題目讀給組員聽，並請他們選擇正確答案！
                                                            </div>
                                                        </div>
                                                    ) : (

        // Helper Countdown Component for Challenge Timer in Header
        function CountdownTimer({ startTime, limit }) {
            const [timeLeft, setTimeLeft] = useState(limit);

            useEffect(() => {
                const timer = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - startTime) / 1000);
                    const remaining = limit - elapsed;
                    setTimeLeft(remaining > 0 ? remaining : 0);
                }, 1000);
                return () => clearInterval(timer);
            }, [startTime, limit]);

            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            return <span>{String(m).padStart(2, '0')}:{String(s).padStart(2, '0')}</span>;
        }

        // Optimized Whiteboard Component
        const WhiteboardCanvas = React.forwardRef(({ isReadOnly, onChange, backgroundUrl, className }, ref) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [ctx, setCtx] = useState(null);
            
            // Tool states
            const [color, setColor] = useState('#1e293b');
            const [lineWidth, setLineWidth] = useState(4);
            const [isEraser, setIsEraser] = useState(false);

            // Canvas Base Resolution Setup
            // Fixes iPad/Tablet precision issue by setting high-res internal canvas and scaling via CSS
            const CANVAS_WIDTH = 1280;
            const CANVAS_HEIGHT = 720;

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;

                // Set internal resolution
                canvas.width = CANVAS_WIDTH;
                canvas.height = CANVAS_HEIGHT;

                const context = canvas.getContext('2d');
                context.lineCap = 'round';
                context.lineJoin = 'round';
                setCtx(context);
                
                // Clear canvas init
                context.fillStyle = 'transparent';
                context.fillRect(0, 0, canvas.width, canvas.height);
            }, []);
            
            // Allow parent to access canvas methods via ref
            React.useImperativeHandle(ref, () => ({
                toDataURL: () => {
                    if (canvasRef.current) {
                        return canvasRef.current.toDataURL('image/png');
                    }
                    return null;
                }
            }));

            // Get precise pointer coordinates handling CSS scaling
            const getCoordinates = (e) => {
                if (!canvasRef.current) return { x: 0, y: 0 };
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                
                let clientX, clientY;
                
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                    // Prevent scrolling while drawing on touch devices
                    if(e.cancelable) e.preventDefault();
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                // Calculate ratio between internal resolution and CSS displayed size
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                if (isReadOnly || !ctx) return;
                setIsDrawing(true);
                const { x, y } = getCoordinates(e.nativeEvent || e);
                
                ctx.beginPath();
                ctx.moveTo(x, y);
                
                // Set current styles
                ctx.strokeStyle = isEraser ? '#ffffff' : color;
                ctx.lineWidth = lineWidth;
                
                // Enable erasing logic if needed (though drawing white over transparent might not erase bg if bg is separate img element)
                // Since background is an <img> behind the canvas, drawing white "erases" visual marks.
                if (isEraser) {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.lineWidth = lineWidth * 2; // Make eraser bigger
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                }
            };

            const draw = (e) => {
                if (!isDrawing || isReadOnly || !ctx) return;
                
                if(e.cancelable) e.preventDefault(); // Prevent scrolling on touch
                
                const { x, y } = getCoordinates(e.nativeEvent || e);
                ctx.lineTo(x, y);
                ctx.stroke();
            };

            const stopDrawing = () => {
                if (isReadOnly || !ctx) return;
                setIsDrawing(false);
                ctx.closePath();
                
                if (onChange && canvasRef.current) {
                    onChange(canvasRef.current.toDataURL('image/png'));
                }
            };

            const handleClear = () => {
                if (!ctx || !canvasRef.current || isReadOnly) return;
                ctx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);
                if (onChange) onChange(canvasRef.current.toDataURL('image/png'));
            };
            
            // Add non-passive event listeners for touch devices manually to prevent scrolling
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas || isReadOnly) return;
                
                const preventScroll = (e) => {
                    if (isDrawing) {
                        e.preventDefault();
                    }
                };
                
                canvas.addEventListener('touchmove', preventScroll, { passive: false });
                return () => canvas.removeEventListener('touchmove', preventScroll);
            }, [isDrawing, isReadOnly]);

            return (
                <div class={`flex flex-col space-y-3 ${className || ''}`}>
                    {!isReadOnly && (
                        <div class="flex flex-wrap items-center justify-between gap-3 bg-white p-2 rounded-xl shadow-sm border border-slate-200">
                            <div class="flex items-center gap-2">
                                <div class="flex space-x-1 border-r pr-2">
                                    {['#1e293b', '#ef4444', '#3b82f6', '#10b981', '#f59e0b'].map(c => (
                                        <button 
                                            key={c}
                                            onClick={() => { setColor(c); setIsEraser(false); }}
                                            class={`w-8 h-8 rounded-full transition-transform active:scale-90 ${color === c && !isEraser ? 'ring-2 ring-offset-2 ring-slate-400 scale-110' : ''}`}
                                            style={{ backgroundColor: c }}
                                            title="選擇顏色"
                                        />
                                    ))}
                                </div>
                                <div class="flex items-center space-x-2 pl-1">
                                    <span class="text-xs font-bold text-slate-500 hidden sm:inline">粗幼:</span>
                                    <input 
                                        type="range" 
                                        min="2" max="18" 
                                        value={lineWidth} 
                                        onChange={(e) => setLineWidth(parseInt(e.target.value))}
                                        class="w-24 accent-slate-700"
                                    />
                                </div>
                            </div>
                            <div class="flex space-x-2">
                                <button 
                                    onClick={() => setIsEraser(!isEraser)}
                                    class={`px-3 py-1.5 rounded-lg font-bold text-sm transition flex items-center gap-1 ${isEraser ? 'bg-slate-700 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                >
                                    🧽 擦膠
                                </button>
                                <button 
                                    onClick={handleClear}
                                    class="px-3 py-1.5 rounded-lg font-bold text-sm bg-red-50 text-red-600 hover:bg-red-100 transition flex items-center gap-1 border border-red-100"
                                >
                                    🗑️ 清空
                                </button>
                            </div>
                        </div>
                    )}
                    
                    <div class="relative w-full aspect-16-9 bg-white rounded-xl overflow-hidden border-2 border-slate-300 shadow-inner group">
                        {backgroundUrl && (
                            <img src={backgroundUrl} class="absolute inset-0 w-full h-full object-contain pointer-events-none opacity-50" />
                        )}
                        <canvas
                            ref={canvasRef}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            onTouchCancel={stopDrawing}
                            class={`absolute inset-0 w-full h-full cursor-crosshair z-10 touch-none ${isEraser ? 'cursor-cell' : ''}`}
                        />
                    </div>
                </div>
            );
        });

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
