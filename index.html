<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Provided Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAcphRXxqs_MTeWwffVVOFsnb8Liro5Lto",
            authDomain: "omit-8c173.firebaseapp.com",
            projectId: "omit-8c173",
            storageBucket: "omit-8c173.firebasestorage.app",
            messagingSenderId: "1078509757779",
            appId: "1:1078509757779:web:64fe9465920eca4f38ada6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        const authPromise = signInAnonymously(auth).then(userCred => {
            currentUser = userCred.user;
            return currentUser;
        }).catch(err => {
            console.error("Firebase auth error:", err);
        });

        // Global Firebase Helper Object attached to window for React components
        window.FirebaseService = {
            auth,
            db,
            getAuthUser: async () => currentUser || await authPromise,
            getRoomRef: (roomCode) => {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'omit-8c173';
                return doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
            },
            setDoc,
            getDoc,
            updateDoc,
            deleteDoc,
            onSnapshot
        };

        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Sound generator utility using Web Audio API
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'buzz') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.5, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch(e) { console.log("Audio play suppressed"); }
        };

        // Extract YouTube Embed URL helper
        const getYouTubeEmbedUrl = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        // Custom Toast Notification
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3200);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (
                <div class={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-xl shadow-xl flex items-center space-x-2 text-sm font-semibold animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        function OMITApp() {
            const [role, setRole] = useState('LANDING'); // 'LANDING', 'TEACHER', 'STUDENT'
            const [roomCode, setRoomCode] = useState('');
            const [studentName, setStudentName] = useState('');
            const [toast, setToast] = useState(null);

            // Firebase Room State
            const [roomData, setRoomData] = useState({
                activeQuestion: null,
                students: {},
                responses: {},
                peerReview: null
            });

            const [fbReady, setFbReady] = useState(!!window.FirebaseService);
            const studentIdRef = useRef('std_' + Math.random().toString(36).substring(2, 9));

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            useEffect(() => {
                const handleFbReady = () => setFbReady(true);
                window.addEventListener('firebase-ready', handleFbReady);
                return () => window.removeEventListener('firebase-ready', handleFbReady);
            }, []);

            // Check URL parameters for direct room joining
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const roomParam = params.get('room');
                if (roomParam) {
                    setRoomCode(roomParam.toUpperCase());
                }
            }, []);

            // Firebase Real-time Listener for Room Data
            useEffect(() => {
                if (!roomCode || !window.FirebaseService) return;

                let unsubscribe = () => {};
                const setupListener = async () => {
                    await window.FirebaseService.getAuthUser();
                    const roomRef = window.FirebaseService.getRoomRef(roomCode);

                    unsubscribe = window.FirebaseService.onSnapshot(roomRef, (snapshot) => {
                        if (snapshot.exists()) {
                            setRoomData(snapshot.data());
                        } else {
                            setRoomData({ activeQuestion: null, students: {}, responses: {}, peerReview: null });
                        }
                    }, (err) => {
                        console.error("Firestore sync error:", err);
                    });
                };

                setupListener();
                return () => unsubscribe();
            }, [roomCode, fbReady]);

            // Create Room (Teacher)
            const handleCreateRoom = async () => {
                if (!window.FirebaseService) {
                    showToast('正在連接資料庫，請稍後...', 'error');
                    return;
                }
                await window.FirebaseService.getAuthUser();
                const generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
                const roomRef = window.FirebaseService.getRoomRef(generatedCode);

                const initialRoomState = {
                    roomCode: generatedCode,
                    createdAt: Date.now(),
                    activeQuestion: null,
                    students: {},
                    responses: {},
                    peerReview: null
                };

                await window.FirebaseService.setDoc(roomRef, initialRoomState);
                setRoomCode(generatedCode);
                setRole('TEACHER');
                showToast(`已建立互動課堂 房號：${generatedCode}`, 'success');
            };

            // Join Room (Student)
            const handleJoinRoom = async (e) => {
                e?.preventDefault();
                if (!roomCode.trim()) {
                    showToast('請輸入6位數字房號', 'error');
                    return;
                }
                if (!studentName.trim()) {
                    showToast('請輸入您的姓名或學號', 'error');
                    return;
                }
                if (!window.FirebaseService) {
                    showToast('正在連接資料庫，請稍後...', 'error');
                    return;
                }

                await window.FirebaseService.getAuthUser();
                const roomRef = window.FirebaseService.getRoomRef(roomCode);
                const snap = await window.FirebaseService.getDoc(roomRef);

                if (!snap.exists()) {
                    showToast('找不到此課堂房號，請確認後重試！', 'error');
                    return;
                }

                const studentData = {
                    id: studentIdRef.current,
                    name: studentName.trim(),
                    joinTime: new Date().toLocaleTimeString('zh-HK')
                };

                // Register student in room
                await window.FirebaseService.updateDoc(roomRef, {
                    [`students.${studentIdRef.current}`]: studentData
                });

                setRole('STUDENT');
                showToast(`已成功進入房號 ${roomCode} 課堂！`, 'success');
            };

            if (role === 'LANDING') {
                return (
                    <div class="min-h-screen bg-gradient-to-br from-indigo-900 via-indigo-800 to-slate-900 flex items-center justify-center p-4">
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                        
                        <div class="max-w-md w-full bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-8 space-y-8 relative overflow-hidden border border-white/20">
                            <div class="text-center space-y-2">
                                <div class="inline-flex items-center justify-center w-20 h-20 bg-indigo-600 text-white rounded-3xl mb-2 font-black text-3xl shadow-xl shadow-indigo-300 transform -rotate-3">
                                    OMIT
                                </div>
                                <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">OMIT 互動課堂</h1>
                                <p class="text-slate-500 text-sm font-medium">免登入！即時互動、白板、搶答與同儕互評平台</p>
                            </div>

                            <div class="space-y-6">
                                <form onSubmit={handleJoinRoom} class="bg-indigo-50/80 p-5 rounded-2xl border border-indigo-100 space-y-4">
                                    <h2 class="text-xs font-bold text-indigo-700 uppercase tracking-wider">我是學生 (加入課堂)</h2>
                                    <div>
                                        <input 
                                            type="text" 
                                            placeholder="請輸入房號 (例: 123456)" 
                                            value={roomCode} 
                                            onChange={(e) => setRoomCode(e.target.value)}
                                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-mono text-center tracking-widest text-lg font-bold"
                                            maxLength={6}
                                        />
                                    </div>
                                    <div>
                                        <input 
                                            type="text" 
                                            placeholder="請輸入你的姓名 / 學號" 
                                            value={studentName} 
                                            onChange={(e) => setStudentName(e.target.value)}
                                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-medium"
                                        />
                                    </div>
                                    <button 
                                        type="submit" 
                                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-200 active:scale-95 flex items-center justify-center space-x-2"
                                    >
                                        <span>進入課堂 🚀</span>
                                    </button>
                                </form>

                                <div class="relative flex py-1 items-center">
                                    <div class="flex-grow border-t border-slate-200"></div>
                                    <span class="flex-shrink mx-4 text-slate-400 text-xs font-medium">或</span>
                                    <div class="flex-grow border-t border-slate-200"></div>
                                </div>

                                <div class="text-center">
                                    <button 
                                        onClick={handleCreateRoom}
                                        class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl transition shadow-md flex items-center justify-center space-x-2 active:scale-95"
                                    >
                                        <span>👨‍🏫 開啟新課堂 (教師控制台)</span>
                                    </button>
                                    <p class="text-xs text-slate-400 mt-2">免註冊，一鍵開課並可生成專屬 QR Code</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (role === 'TEACHER') {
                return (
                    <TeacherDashboard 
                        roomCode={roomCode} 
                        roomData={roomData}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            if (role === 'STUDENT') {
                return (
                    <StudentInterface 
                        roomCode={roomCode}
                        studentName={studentName}
                        studentId={studentIdRef.current}
                        roomData={roomData}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            return null;
        }

        function TeacherDashboard({ roomCode, roomData, showToast, onExit }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE'); // 'CHOICE', 'TF', 'SHORT', 'DRAW', 'BUZZ', 'LINK'
            const [questionText, setQuestionText] = useState('');
            const [allowRevision, setAllowRevision] = useState(true); // Feature #4
            const [choiceCount, setChoiceCount] = useState(4);
            const [whiteboardBg, setWhiteboardBg] = useState(null); // Feature #2: Whiteboard background image
            const [dispatchLink, setDispatchLink] = useState(''); // Feature #10: Link dispatch
            const [showQRModal, setShowQRModal] = useState(false);
            const [showStudentListModal, setShowStudentListModal] = useState(false); // Feature #1
            const [showPickerModal, setShowPickerModal] = useState(false); // Feature #11: Random picker
            const [drilldownChoice, setDrilldownChoice] = useState(null); // Feature #8: Bar chart click list
            const [zoomedSubmission, setZoomedSubmission] = useState(null); // Feature #3: Zoom submission

            // Picker state
            const [pickerStart, setPickerStart] = useState(1);
            const [pickerEnd, setPickerEnd] = useState(30);
            const [uniquePick, setUniquePick] = useState(true);
            const [pickedHistory, setPickedHistory] = useState([]);
            const [currentPicked, setCurrentPicked] = useState(null);
            const [isPicking, setIsPicking] = useState(false);

            const studentsList = Object.values(roomData?.students || {});
            const responsesList = Object.values(roomData?.responses || {});
            const activeQ = roomData?.activeQuestion;

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

            // Feature #2: Handle Whiteboard BG Image Upload
            const handleBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 2 * 1024 * 1024) {
                        showToast('圖片大小不能超過 2MB！', 'error');
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setWhiteboardBg(evt.target.result);
                        showToast('已上傳白板背景圖！', 'success');
                    };
                    reader.readAsDataURL(file);
                }
            };

            // Publish Question / Task
            const handlePublishTask = async () => {
                if (!window.FirebaseService) return;
                const roomRef = window.FirebaseService.getRoomRef(roomCode);

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: questionText.trim() || getDefaultPrompt(selectedMode),
                    startTime: Date.now(),
                    allowRevision: allowRevision,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : [],
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    dispatchLink: selectedMode === 'LINK' ? dispatchLink.trim() : null
                };

                await window.FirebaseService.updateDoc(roomRef, {
                    activeQuestion: newQ,
                    responses: {}, // reset responses for new question
                    peerReview: null // reset peer review
                });

                showToast('已成功將任務派送到所有學生端！', 'success');
            };

            const getDefaultPrompt = (mode) => {
                switch(mode) {
                    case 'CHOICE': return '請選擇正確答案：';
                    case 'TF': return '請判斷以下敘述是否正確 (O/X)：';
                    case 'SHORT': return '請輸入您的回答：';
                    case 'DRAW': return '請在白板上繪圖或解答：';
                    case 'BUZZ': return '搶答開始！準備好按下搶答按鈕！';
                    case 'LINK': return '請參閱教師派送的連結內容：';
                    default: return '';
                }
            };

            // Clear Active Task
            const handleClearTask = async () => {
                const roomRef = window.FirebaseService.getRoomRef(roomCode);
                await window.FirebaseService.updateDoc(roomRef, {
                    activeQuestion: null,
                    peerReview: null
                });
                showToast('已結束當前任務', 'info');
            };

            // Feature #3: Broadcast Student Submission for Peer Review
            const handlePeerReviewBroadcast = async (sub) => {
                const roomRef = window.FirebaseService.getRoomRef(roomCode);
                await window.FirebaseService.updateDoc(roomRef, {
                    peerReview: sub
                });
                showToast(`已發送 ${sub.name} 的作品給全體學生進行互評！`, 'success');
            };

            const handleClearPeerReview = async () => {
                const roomRef = window.FirebaseService.getRoomRef(roomCode);
                await window.FirebaseService.updateDoc(roomRef, {
                    peerReview: null
                });
                showToast('已收回同儕互評展示', 'info');
            };

            // Feature #6: Exit Classroom & Clean up Firebase room data
            const handleExitClassroom = async () => {
                if (window.confirm('確定要退出課室嗎？退出後將清空 Firebase 所有暫存資料釋放空間。')) {
                    try {
                        const roomRef = window.FirebaseService.getRoomRef(roomCode);
                        await window.FirebaseService.deleteDoc(roomRef);
                    } catch(e) {
                        console.error("Cleanup error:", e);
                    }
                    onExit();
                }
            };

            // Feature #11: Random Pick Student Logic
            const handlePickStudent = () => {
                const start = parseInt(pickerStart);
                const end = parseInt(pickerEnd);
                if (isNaN(start) || isNaN(end) || start > end) {
                    showToast('請輸入有效的座號範圍！', 'error');
                    return;
                }

                const available = [];
                for (let i = start; i <= end; i++) {
                    if (!uniquePick || !pickedHistory.includes(i)) {
                        available.push(i);
                    }
                }

                if (available.length === 0) {
                    showToast('範圍內所有號碼均已抽選完畢！', 'error');
                    return;
                }

                setIsPicking(true);
                let count = 0;
                const interval = setInterval(() => {
                    const temp = available[Math.floor(Math.random() * available.length)];
                    setCurrentPicked(temp);
                    count++;
                    if (count > 15) {
                        clearInterval(interval);
                        const finalChoice = available[Math.floor(Math.random() * available.length)];
                        setCurrentPicked(finalChoice);
                        if (uniquePick) {
                            setPickedHistory(prev => [...prev, finalChoice]);
                        }
                        setIsPicking(false);
                        playSound('success');
                    }
                }, 80);
            };

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col">
                    {/* Top Bar */}
                    <header class="bg-slate-900 text-white px-6 py-4 shadow-lg flex flex-wrap items-center justify-between gap-4 sticky top-0 z-30">
                        <div class="flex items-center space-x-4">
                            <div class="bg-indigo-600 text-white font-black px-3 py-1 rounded-xl text-lg">OMIT</div>
                            <div>
                                <div class="flex items-center space-x-2">
                                    <span class="text-xs text-slate-400 font-bold uppercase">房號 ROOM</span>
                                    <span class="font-mono text-xl font-extrabold text-amber-400">{roomCode}</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center space-x-3">
                            {/* Feature #1: Joined Students Count Tag */}
                            <button 
                                onClick={() => setShowStudentListModal(true)}
                                class="bg-slate-800 hover:bg-slate-700 text-emerald-400 px-4 py-2 rounded-xl text-sm font-bold border border-slate-700 flex items-center space-x-2 transition"
                            >
                                <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                                <span>👥 已加入學生: {studentsList.length} 人</span>
                            </button>

                            {/* Feature #11: Picker Button */}
                            <button 
                                onClick={() => setShowPickerModal(true)}
                                class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition flex items-center space-x-1"
                            >
                                <span>🎯 抽選學生</span>
                            </button>

                            <button 
                                onClick={() => setShowQRModal(true)}
                                class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-sm font-bold border border-slate-700 transition"
                            >
                                📱 QR Code
                            </button>

                            <button 
                                onClick={handleExitClassroom}
                                class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition shadow"
                            >
                                🚪 退出並清空課室
                            </button>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
                        {/* Left Control Panel (5 cols) */}
                        <div class="lg:col-span-5 space-y-6">
                            {/* Feature #7: Large 6 Main Feature Buttons */}
                            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
                                <h2 class="text-base font-bold text-slate-800 flex items-center space-x-2">
                                    <span>⚡ 選擇互動模式</span>
                                </h2>

                                <div class="grid grid-cols-2 gap-3">
                                    {[
                                        { id: 'CHOICE', label: '選擇題', icon: '📊', color: 'indigo' },
                                        { id: 'TF', label: '是非題', icon: '⭕', color: 'emerald' },
                                        { id: 'SHORT', label: '短答題', icon: '✍️', color: 'sky' },
                                        { id: 'DRAW', label: '白板題', icon: '🎨', color: 'purple' },
                                        { id: 'BUZZ', label: '搶答題', icon: '🚨', color: 'rose' },
                                        { id: 'LINK', label: '派送連結', icon: '🔗', color: 'amber' }
                                    ].map(item => {
                                        const isSelected = selectedMode === item.id;

        function StudentInterface({ roomCode, studentName, studentId, roomData, showToast, onExit }) {
            const [studentAnswer, setStudentAnswer] = useState('');
            const [hasSubmitted, setHasSubmitted] = useState(false);
            const [isDrawing, setIsDrawing] = useState(false);
            const [penColor, setPenColor] = useState('#4f46e5');
            const [penSize, setPenSize] = useState(4);
            const [isEraser, setIsEraser] = useState(false);

            const canvasRef = useRef(null);
            const activeQ = roomData?.activeQuestion;
            const peerReviewItem = roomData?.peerReview;

            // Reset submission state when a new question arrives
            useEffect(() => {
                if (activeQ) {
                    const existingSub = roomData?.responses?.[studentId];
                    if (existingSub) {
                        setHasSubmitted(true);
                        setStudentAnswer(existingSub.answer);
                    } else {
                        setHasSubmitted(false);
                        setStudentAnswer('');
                    }
                }
            }, [activeQ?.id]);

            // Draw Background Image on Canvas when Whiteboard Question active
            useEffect(() => {
                if (activeQ && activeQ.mode === 'DRAW' && canvasRef.current) {
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    if (activeQ.whiteboardBg) {
                        const img = new Image();
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        };
                        img.src = activeQ.whiteboardBg;
                    }
                }
            }, [activeQ?.id, activeQ?.whiteboardBg]);

            // Submit Answer Logic
            const handleSubmitAnswer = async (answerVal) => {
                const finalAns = answerVal !== undefined ? answerVal : studentAnswer;
                if (activeQ.mode !== 'BUZZ' && !finalAns.trim()) {
                    showToast('請先完成答題或繪圖！', 'error');
                    return;
                }

                const duration = ((Date.now() - activeQ.startTime) / 1000).toFixed(1);
                const roomRef = window.FirebaseService.getRoomRef(roomCode);

                const subObj = {
                    studentId,
                    name: studentName,
                    answer: finalAns,
                    timestamp: Date.now(),
                    duration: duration
                };

                await window.FirebaseService.updateDoc(roomRef, {
                    [`responses.${studentId}`]: subObj
                });

                setHasSubmitted(true);
                if (activeQ.mode === 'BUZZ') {
                    playSound('buzz');
                } else {
                    playSound('success');
                }
                showToast('答案已成功送出！', 'success');
            };

            // Whiteboard Drawing Helpers
            const startDrawing = (e) => {
                if (hasSubmitted && !activeQ.allowRevision) return;
                setIsDrawing(true);
                draw(e);
            };

            const stopDrawing = () => {
                setIsDrawing(false);
                if (canvasRef.current) {
                    const ctx = canvasRef.current.getContext('2d');
                    ctx.beginPath();
                }
            };

            const draw = (e) => {
                if (!isDrawing || !canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const x = (clientX - rect.left) * (canvas.width / rect.width);
                const y = (clientY - rect.top) * (canvas.height / rect.height);

                ctx.lineWidth = penSize;
                ctx.lineCap = 'round';
                ctx.strokeStyle = isEraser ? '#ffffff' : penColor;

                ctx.lineTo(x, y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            const clearCanvas = () => {
                if (!canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (activeQ?.whiteboardBg) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    img.src = activeQ.whiteboardBg;
                }
            };

            const saveCanvasAndSubmit = () => {
                if (!canvasRef.current) return;
                const dataUrl = canvasRef.current.toDataURL('image/png');
                handleSubmitAnswer(dataUrl);
            };

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col">
                    {/* Header */}
                    <header class="bg-indigo-900 text-white px-6 py-4 shadow-lg flex items-center justify-between sticky top-0 z-30">
                        <div class="flex items-center space-x-3">
                            <span class="bg-indigo-600 text-white font-black px-3 py-1 rounded-xl text-base">OMIT</span>
                            <span class="font-bold text-sm text-indigo-100">{studentName} 學生端</span>
                        </div>
                        <button onClick={onExit} class="text-xs text-indigo-200 hover:text-white bg-indigo-800 px-3 py-1.5 rounded-lg">離開課室</button>
                    </header>

                    {/* Main Interaction Area */}
                    <main class="flex-1 max-w-2xl w-full mx-auto p-4 md:p-6 space-y-6">
                        {/* Feature #3 Broadcasted Peer Review Display */}
                        {peerReviewItem && (
                            <div class="bg-amber-400/10 border-2 border-amber-400 p-5 rounded-3xl shadow-md space-y-3">
                                <div class="flex items-center justify-between">
                                    <span class="bg-amber-500 text-white text-xs font-extrabold px-3 py-1 rounded-full">
                                        🌟 同儕互評 / 優秀作品展示
                                    </span>
                                    <span class="text-xs font-bold text-slate-600">創作者: {peerReviewItem.name}</span>
                                </div>
                                <div class="bg-white p-4 rounded-2xl border border-amber-200 min-h-[160px] flex items-center justify-center">
                                    {peerReviewItem.answer?.startsWith('data:image') ? (
                                        <img src={peerReviewItem.answer} class="max-h-60 object-contain rounded-lg" />
                                    ) : (
                                        <p class="text-xl font-bold text-slate-800">{peerReviewItem.answer}</p>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Active Question Panel */}
                        {activeQ ? (
                            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-6">
                                <div class="space-y-2">
                                    <span class="bg-indigo-100 text-indigo-700 text-xs font-extrabold px-3 py-1 rounded-lg">
                                        {activeQ.mode}
                                    </span>
                                    <h2 class="text-xl font-bold text-slate-800">{activeQ.text}</h2>
                                </div>

                                {/* Mode 1: Multiple Choice */}
                                {activeQ.mode === 'CHOICE' && (
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        {activeQ.choiceOptions.map(opt => {
                                            const isSelected = studentAnswer === opt;
                                            return (
                                                <button 
                                                    key={opt}
                                                    disabled={hasSubmitted && !activeQ.allowRevision}
                                                    onClick={() => {
                                                        setStudentAnswer(opt);
                                                        handleSubmitAnswer(opt);
                                                    }}
                                                    class={`p-4 rounded-2xl font-black text-lg border-2 transition active:scale-95 flex items-center space-x-3 ${
                                                        isSelected 
                                                        ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' 
                                                        : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200'
                                                    }`}
                                                >
                                                    <span class={`w-8 h-8 rounded-xl flex items-center justify-center ${isSelected ? 'bg-white text-indigo-600' : 'bg-slate-200 text-slate-600'}`}>
                                                        {opt}
                                                    </span>
                                                    <span>選項 {opt}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                )}

                                {/* Mode 2: True / False */}
                                {activeQ.mode === 'TF' && (
                                    <div class="grid grid-cols-2 gap-4">
                                        {['O', 'X'].map(opt => (
                                            <button 
                                                key={opt}
                                                disabled={hasSubmitted && !activeQ.allowRevision}
                                                onClick={() => {
                                                    setStudentAnswer(opt);
                                                    handleSubmitAnswer(opt);
                                                }}
                                                class={`py-8 rounded-3xl font-black text-4xl border-2 transition active:scale-95 ${
                                                    studentAnswer === opt 
                                                    ? 'bg-emerald-600 text-white border-emerald-600 shadow-lg' 
                                                    : 'bg-slate-50 text-slate-700 border-slate-200'
                                                }`}
                                            >
                                                {opt === 'O' ? '⭕ 正確 (O)' : '❌ 錯誤 (X)'}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {/* Mode 3: Short Answer */}
                                {activeQ.mode === 'SHORT' && (
                                    <div class="space-y-4">
                                        <textarea 
                                            rows={4}
                                            disabled={hasSubmitted && !activeQ.allowRevision}
                                            placeholder="請輸入您的答案..."
                                            value={studentAnswer}
                                            onChange={(e) => setStudentAnswer(e.target.value)}
                                            class="w-full p-4 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 font-medium text-slate-800"
                                        />
                                        <button 
                                            disabled={hasSubmitted && !activeQ.allowRevision}
                                            onClick={() => handleSubmitAnswer()}
                                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-3.5 rounded-2xl transition shadow-md active:scale-95"
                                        >
                                            提交短答
                                        </button>
                                    </div>
                                )}

                                {/* Mode 4: Feature #2 Whiteboard Drawing */}
                                {activeQ.mode === 'DRAW' && (
                                    <div class="space-y-4">
                                        {/* Drawing Tools */}
                                        <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                                            <div class="flex items-center space-x-2">
                                                {['#4f46e5', '#ef4444', '#10b981', '#f59e0b', '#000000'].map(color => (
                                                    <button 
                                                        key={color}
                                                        onClick={() => { setPenColor(color); setIsEraser(false); }}
                                                        class={`w-7 h-7 rounded-full border-2 transition ${!isEraser && penColor === color ? 'ring-2 ring-indigo-500 scale-110' : ''}`}
                                                        style={{ backgroundColor: color }}
                                                    />
                                                ))}
                                            </div>

                                            <div class="flex items-center space-x-2">
                                                <button 
                                                    onClick={() => setIsEraser(!isEraser)}
                                                    class={`px-3 py-1 rounded-xl text-xs font-bold border ${isEraser ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-slate-700 border-slate-200'}`}
                                                >
                                                    🧹 橡皮擦
                                                </button>
                                                <button onClick={clearCanvas} class="bg-white text-slate-700 border border-slate-200 px-3 py-1 rounded-xl text-xs font-bold">
                                                    🗑️ 清空
                                                </button>
                                            </div>
                                        </div>

                                        {/* Canvas Element */}
                                        <div class="canvas-container bg-white border-2 border-slate-200 rounded-2xl overflow-hidden shadow-inner flex items-center justify-center relative touch-none">
                                            <canvas 
                                                ref={canvasRef}
                                                width={500}
                                                height={350}
                                                onMouseDown={startDrawing}
                                                onMouseUp={stopDrawing}
                                                onMouseMove={draw}
                                                onTouchStart={startDrawing}
                                                onTouchEnd={stopDrawing}
                                                onTouchMove={draw}
                                                class="w-full h-auto max-h-[350px] bg-white cursor-crosshair"
                                            />
                                        </div>

                                        <button 
                                            disabled={hasSubmitted && !activeQ.allowRevision}
                                            onClick={saveCanvasAndSubmit}
                                            class="w-full bg-purple-600 hover:bg-purple-700 text-white font-extrabold py-3.5 rounded-2xl shadow-md transition active:scale-95"
                                        >
                                            🎨 提交白板繪圖
                                        </button>
                                    </div>
                                )}

                                {/* Mode 5: Feature #9 Buzz-in */}
                                {activeQ.mode === 'BUZZ' && (
                                    <div class="py-6 text-center space-y-6">
                                        <button 
                                            disabled={hasSubmitted}
                                            onClick={() => handleSubmitAnswer('BUZZ_PRESSED')}
                                            class={`w-48 h-48 rounded-full font-black text-3xl shadow-2xl transition transform active:scale-90 border-8 ${
                                                hasSubmitted 
                                                ? 'bg-slate-400 text-slate-200 border-slate-300' 
                                                : 'bg-rose-600 hover:bg-rose-700 text-white border-rose-300 animate-buzz'
                                            }`}
                                        >
                                            {hasSubmitted ? '已搶答！' : '🚨 搶答！'}
                                        </button>
                                        <p class="text-xs text-slate-400 font-bold">按下按鈕爭奪第一名搶答權</p>
                                    </div>
                                )}

                                {/* Mode 6: Feature #10 Link Dispatch & YouTube Auto Embed */}
                                {activeQ.mode === 'LINK' && (
                                    <div class="space-y-4">
                                        {getYouTubeEmbedUrl(activeQ.dispatchLink) ? (
                                            <div class="aspect-video w-full rounded-2xl overflow-hidden shadow-lg border border-slate-200">
                                                <iframe 
                                                    src={getYouTubeEmbedUrl(activeQ.dispatchLink)} 
                                                    class="w-full h-full"
                                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                                    allowFullScreen
                                                />
                                            </div>
                                        ) : (
                                            <div class="bg-amber-50 p-6 rounded-2xl border border-amber-200 text-center space-y-3">
                                                <p class="text-sm font-bold text-amber-900">教師派送了連結：</p>
                                                <a 
                                                    href={activeQ.dispatchLink} 
                                                    target="_blank" 
                                                    rel="noreferrer"
                                                    class="inline-block bg-amber-600 hover:bg-amber-700 text-white font-bold px-6 py-3 rounded-xl shadow transition"
                                                >
                                                    🔗 點擊前往開啟連結
                                                </a>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Feature #4 Response status & revision restriction tag */}
                                {hasSubmitted && (
                                    <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-2xl text-center text-xs font-bold text-emerald-700 flex items-center justify-between">
                                        <span>✅ 您已完成提交！</span>
                                        {!activeQ.allowRevision && (
                                            <span class="text-slate-400 text-[10px]">🔒 教師已設定不可修改</span>
                                        )}
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div class="bg-white p-12 rounded-3xl border-2 border-dashed border-slate-200 text-center text-slate-400 space-y-3">
                                <div class="text-5xl animate-bounce">⏳</div>
                                <h3 class="font-extrabold text-slate-700 text-lg">等待教師發佈任務中...</h3>
                                <p class="text-xs text-slate-400">當教師發佈選擇題、白板題或搶答時，畫面會即時更新。</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
