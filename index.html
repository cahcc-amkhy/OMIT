        // Web Audio API Synthesizer (Sounds & Looping Background Music)
        class AudioSystem {
            constructor() {
                this.ctx = null;
                this.musicInterval = null;
                this.isPlayingMusic = false;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playSound(type) {
                try {
                    this.init();
                    const ctx = this.ctx;

                    if (type === 'buzzer') {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(880, ctx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                        gain.gain.setValueAtTime(0.3, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.3);
                    } else if (type === 'spin') {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(600, ctx.currentTime);
                        gain.gain.setValueAtTime(0.15, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.08);
                    } else if (type === 'win') {
                        const notes = [523.25, 659.25, 783.99, 1046.50];
                        notes.forEach((freq, idx) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                            gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.1);
                            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.35);
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.start(ctx.currentTime + idx * 0.1);
                            osc.stop(ctx.currentTime + idx * 0.1 + 0.35);
                        });
                        if (window.confetti) {
                            window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                        }
                    } else if (type === 'alarm') {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(900, ctx.currentTime);
                        osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                        gain.gain.setValueAtTime(0.3, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.4);
                    }
                } catch (e) {
                    console.error("Audio error:", e);
                }
            }

            // Synthesized Looping Music (Requirement 22.2.4 & 22.3.2)
            startBackgroundMusic(style = 'relax') {
                this.stopMusic();
                this.init();
                this.isPlayingMusic = true;

                const notes = style === 'race' 
                    ? [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 440.00, 587.33] 
                    : [329.63, 392.00, 440.00, 392.00, 329.63, 293.66, 261.63, 293.66];
                
                let idx = 0;
                this.musicInterval = setInterval(() => {
                    if (!this.isPlayingMusic) return;
                    const ctx = this.ctx;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = style === 'race' ? 'triangle' : 'sine';
                    osc.frequency.setValueAtTime(notes[idx % notes.length], ctx.currentTime);
                    
                    gain.gain.setValueAtTime(style === 'race' ? 0.08 : 0.04, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (style === 'race' ? 0.2 : 0.4));
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    osc.start();
                    osc.stop(ctx.currentTime + (style === 'race' ? 0.2 : 0.4));
                    
                    idx++;
                }, style === 'race' ? 220 : 450);
            }

            stopMusic() {
                this.isPlayingMusic = false;
                if (this.musicInterval) {
                    clearInterval(this.musicInterval);
                    this.musicInterval = null;
                }
            }
        }

        const audioSys = new AudioSystem();

        // Create Word .docx binary template file using JSZip
        const createWordDocxBlob = async () => {
            if (!window.JSZip) {
                throw new Error("JSZip library is not loaded.");
            }
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/>`);

            const sampleLines = [
                "標題：地球生病了 - 課堂評估",
                "總分：100分",
                "1. 以下哪一項不是地球的天然資源？",

                "D. 機械資源 *",
                "2. 芝士的原料屬於哪一項地球的天然資源？",
                "A. 水資源",
                "B. 植物資源",
                "C. 動物資源 *",
                "D. 礦產資源",
                "3. 下列哪一種行為最有利於保護環境？",
                "A. 隨手關閉電源與節約用水 *",
                "B. 經常使用一次性塑膠餐具",
                "C. 長時間開著冷氣",
                "D. 隨意丟棄垃圾",
                "4. 地球溫室效應主要由哪種氣體增加引起？",
                "A. 氧氣",
                "B. 二氧化碳 *",
                "C. 氮氣",
                "D. 稀有氣體",
                "5. 植樹造林的主要好處不包括以下哪項？",
                "A. 保持水土",
                "B. 淨化空氣",
                "C. 增加大氣污染 *",
                "D. 提供生物棲息地"
            ];

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = sampleLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>
    ${paragraphsXml}
  </w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];

            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) {
                        questions.push(currentQ);
                    }
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }

                    currentQ.options.push({
                        letter: letter,
                        text: optText
                    });

                    if (isCorrect) {
                        currentQ.answer = letter;
                    }
                }
            });

            if (currentQ && currentQ.options.length > 0) {
                questions.push(currentQ);
            }

            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1,
                            text: "以下哪一項不是地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "機械資源" }
                            ],
                            answer: "D"
                        },
                        {
                            num: 2,
                            text: "芝士的原料屬於哪一項地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "礦產資源" }
                            ],
                            answer: "C"
                        }
                    ]
                };
            }

            return {
                title,
                totalScore,
                questions
            };
        };

        // Requirement 1 & 21: High precision WhiteboardCanvas Component (1280x720 canvas, ratio scale formula)
        const WhiteboardCanvas = ({ bgImage, initialData, onConfirmSubmit, isTeacherMode, onClose, onBroadcast }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [strokeColor, setStrokeColor] = useState('#1e293b');
            const [lineWidth, setLineWidth] = useState(6);
            const [isEraser, setIsEraser] = useState(false);
            const [bgImg, setBgImg] = useState(bgImage || null);

            const CANVAS_WIDTH = 1280;
            const CANVAS_HEIGHT = 720;

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                if (bgImg) {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                    };
                    img.src = bgImg;
                } else if (initialData) {
                    const img = new Image();
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                    };
                    img.src = initialData;
                }
            }, [bgImg]);

            // Precise Ratio Mapping Formula: scaleX = 1280 / boundingClientRect.width, scaleY = 720 / boundingClientRect.height
            const getCanvasCoords = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                const scaleX = CANVAS_WIDTH / rect.width;
                const scaleY = CANVAS_HEIGHT / rect.height;

                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                setIsDrawing(true);
                const coords = getCanvasCoords(e);
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(coords.x, coords.y);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const coords = getCanvasCoords(e);
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');

                ctx.lineTo(coords.x, coords.y);
                ctx.strokeStyle = isEraser ? '#ffffff' : strokeColor;
                ctx.lineWidth = isEraser ? lineWidth * 3 : lineWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            };

            const stopDrawing = (e) => {
                if (isDrawing) {
                    setIsDrawing(false);
                }
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                if (bgImg) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                    img.src = bgImg;
                }
            };

            const handleCustomBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setBgImg(evt.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleConfirm = () => {
                const canvas = canvasRef.current;
                const dataUrl = canvas.toDataURL('image/png');
                if (onConfirmSubmit) {
                    onConfirmSubmit(dataUrl);
                }
            };

            return (
                <div className="flex flex-col items-center space-y-3 w-full max-w-4xl mx-auto bg-slate-900 p-4 rounded-3xl shadow-2xl">
                    {/* Control Bar */}
                    <div className="flex flex-wrap items-center justify-between gap-2 w-full bg-slate-800 p-3 rounded-2xl text-white">
                        <div className="flex items-center space-x-2">
                            {!isEraser && (
                                <div className="flex space-x-1.5">
                                    {['#1e293b', '#dc2626', '#2563eb', '#16a34a', '#d97706', '#9333ea'].map((c) => (
                                        <button 
                                            key={c}
                                            onClick={() => setStrokeColor(c)}

        function TeacherDashboard({ roomCode, activeQuestion, setActiveQuestion, responses, setResponses, studentsList, historyQuestions, setHistoryQuestions, showToast, onExit }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE'); // 'CHOICE', 'TF', 'SHORT', 'DRAW', 'BUZZER', 'AUDIO', 'CHALLENGE', 'LINK', 'GROUP_COOP'
            const [questionText, setQuestionText] = useState('');
            const [choiceCount, setChoiceCount] = useState(4);
            const [lockAfterSubmit, setLockAfterSubmit] = useState(true);
            const [whiteboardBg, setWhiteboardBg] = useState(null);
            const [pushedUrl, setPushedUrl] = useState('');

            // Modals & Tools
            const [showQRModal, setShowQRModal] = useState(false);
            const [showStudentListModal, setShowStudentListModal] = useState(false);
            const [showInspectModal, setShowInspectModal] = useState(null);
            const [barChoiceFilter, setBarChoiceFilter] = useState(null);
            const [showTeacherDemoWhiteboard, setShowTeacherDemoWhiteboard] = useState(false);

            // Requirement 9: Random Selector State
            const [showRandomModal, setShowRandomModal] = useState(false);
            const [rangeStart, setRangeStart] = useState(1);
            const [rangeEnd, setRangeEnd] = useState(36);
            const [drawnNumbers, setDrawnNumbers] = useState([]);
            const [currentDrawn, setCurrentDrawn] = useState(null);
            const [isSpinning, setIsSpinning] = useState(false);

            // Requirement 10: Timer Modal State
            const [showTimerModal, setShowTimerModal] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerActive, setTimerActive] = useState(false);
            const [timerZoomed, setTimerZoomed] = useState(false);
            const [timerMinInput, setTimerMinInput] = useState('01');
            const [timerSecInput, setTimerSecInput] = useState('00');

            // Requirement 12, 13, 14, 20: Challenge Assessment States
            const [challengeData, setChallengeData] = useState(null);
            const [challengeEnableTimer, setChallengeEnableTimer] = useState(true);
            const [challengeTimeLimit, setChallengeTimeLimit] = useState(120);
            const [challengeReleaseInstant, setChallengeReleaseInstant] = useState(true);
            const [showChallengeScoresOnLeaderboard, setShowChallengeScoresOnLeaderboard] = useState(true);

            // Requirement 22: Cooperative Group Quiz States (預備 > 分組 > 比賽)
            const [coopStage, setCoopStage] = useState('PREP'); // 'PREP', 'GROUPING', 'RACE'
            const [coopQuestions, setCoopQuestions] = useState(null);
            const [coopGroups, setCoopGroups] = useState([]);
            const [coopGroupProgress, setCoopGroupProgress] = useState({});
            const [coopWinner, setCoopWinner] = useState(null);

            // Timer interval
            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds((prev) => prev - 1);
                    }, 1000);
                } else if (timerSeconds === 0 && timerActive) {
                    setTimerActive(false);
                    audioSys.playSound('alarm');
                    showToast('⏰ 計時結束！', 'info');
                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            // Sync active question to Firestore
            const publishQuestion = (questionObj) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                // Reset responses collection locally and in DB
                setResponses({});
                
                window.fbUtils.updateDoc(roomDocRef, {
                    activeQuestion: questionObj
                }).catch(() => {
                    window.fbUtils.setDoc(roomDocRef, { activeQuestion: questionObj }, { merge: true });
                });

                showToast(`已派發「${getModeLabel(questionObj.mode)}」`, 'success');
            };

            const handleStopQuestion = () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                window.fbUtils.updateDoc(roomDocRef, {
                    activeQuestion: null
                });

                audioSys.stopMusic();
                setActiveQuestion(null);
                showToast('已結束當前題目', 'info');
            };

            const handleSendNormalQuestion = () => {
                const qObj = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    prompt: questionText.trim() || getDefaultQuestionPrompt(selectedMode),
                    choiceCount: selectedMode === 'CHOICE' ? choiceCount : (selectedMode === 'TF' ? 2 : 0),
                    lockAfterSubmit,
                    bgImage: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    startTime: Date.now()
                };
                publishQuestion(qObj);
            };

            // Requirement 12 & 22: Download Word (.docx) template file
            const handleDownloadWordTemplate = async () => {
                try {
                    const blob = await createWordDocxBlob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = "OMIT_評估範本Word檔.docx";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast('已開始下載 Word 範本檔 (.docx)', 'success');
                } catch (err) {
                    console.error("Docx creation failed:", err);
                    showToast('範本產生失敗，請稍後重試', 'error');
                }
            };

            // Word Docx / Text Upload Parser
            const handleUploadWordAssessment = (e, targetMode = 'CHALLENGE') => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        let textContent = '';
                        if (file.name.endsWith('.docx') && window.mammoth) {
                            const result = await window.mammoth.extractRawText({ arrayBuffer: evt.target.result });
                            textContent = result.value;
                        } else {
                            const textDecoder = new TextDecoder('utf-8');
                            textContent = textDecoder.decode(evt.target.result);
                        }

                        const parsed = parseWordChallengeText(textContent);
                        if (targetMode === 'CHALLENGE') {
                            setChallengeData(parsed);
                            showToast('AI生成評估內容成功！請確認或修改內容', 'success');
                        } else if (targetMode === 'GROUP_COOP') {
                            setCoopQuestions(parsed);
                            showToast('AI生成合作題內容成功！請確認或修改內容', 'success');
                        }
                    } catch (err) {
                        console.error(err);
                        showToast('解析文件失敗，請確認檔案格式', 'error');
                    }
                };

                if (file.name.endsWith('.docx')) {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsArrayBuffer(file);
                }
            };

            // Start Challenge Assessment
            const handleSendChallengeAssessment = () => {
                if (!challengeData || challengeData.questions.length === 0) {
                    showToast('請先上載評估 Word 檔', 'error');
                    return;
                }

                const qObj = {
                    id: 'q_challenge_' + Date.now(),
                    mode: 'CHALLENGE',
                    title: challengeData.title,
                    totalScore: challengeData.totalScore,
                    questions: challengeData.questions,
                    enableTimer: challengeEnableTimer,
                    timeLimitSeconds: challengeTimeLimit,
                    releaseInstant: challengeReleaseInstant,
                    scoresReleased: challengeReleaseInstant, // If true, auto released
                    startTime: Date.now()
                };

                publishQuestion(qObj);
            };

            // Release scores all together button (Requirement 14)
            const handleReleaseChallengeScoresAll = () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                if (activeQuestion) {
                    const updatedQ = { ...activeQuestion, scoresReleased: true };
                    window.fbUtils.updateDoc(roomDocRef, {
                        activeQuestion: updatedQ
                    });
                    setActiveQuestion(updatedQ);
                    showToast('🎉 已一併發放全班挑戰題成績！', 'success');
                }
            };

            // Requirement 22.2: Divide students into groups of 3-4
            const handleCoopDivideGroups = () => {
                if (studentsList.length === 0) {
                    showToast('目前尚無學生加入課堂，無法分組', 'error');
                    return;
                }

                // Shuffle students
                const shuffledStudents = [...studentsList].sort(() => Math.random() - 0.5);
                const groupCount = Math.max(1, Math.ceil(shuffledStudents.length / 3.5));
                const pool = [...ANIMAL_GROUPS_POOL].sort(() => Math.random() - 0.5);

                const newGroups = [];
                for (let i = 0; i < groupCount; i++) {
                    const theme = pool[i % pool.length];
                    newGroups.push({
                        ...theme,
                        members: []
                    });
                }

                shuffledStudents.forEach((std, idx) => {
                    const targetGrpIdx = idx % groupCount;
                    newGroups[targetGrpIdx].members.push(std);
                });

                setCoopGroups(newGroups);
                setCoopStage('GROUPING');
                audioSys.startBackgroundMusic('relax');

                // Broadcast grouping info to students
                const qObj = {
                    id: 'q_coop_grouping_' + Date.now(),
                    mode: 'GROUP_COOP',
                    coopStage: 'GROUPING',
                    groups: newGroups,
                    startTime: Date.now()
                };
                publishQuestion(qObj);

                showToast('已完成分組並向學生發送資訊！', 'success');
            };

            // Start Group Race Competition (Requirement 22.3)
            const handleStartCoopRace = () => {
                if (!coopQuestions || coopQuestions.questions.length === 0) {
                    showToast('缺少合作題評估題目', 'error');
                    return;
                }

                setCoopStage('RACE');
                setCoopWinner(null);

                // Initial progress for each group = 0
                const initialProgress = {};
                coopGroups.forEach(g => {
                    initialProgress[g.id] = 0;
                });
                setCoopGroupProgress(initialProgress);

                audioSys.startBackgroundMusic('race');

                const qObj = {
                    id: 'q_coop_race_' + Date.now(),
                    mode: 'GROUP_COOP',
                    coopStage: 'RACE',
                    groups: coopGroups,
                    questions: coopQuestions.questions,
                    progress: initialProgress,
                    startTime: Date.now()
                };

                publishQuestion(qObj);
                showToast('🏁 合作題比賽正式開始！', 'success');
            };

            // Broadcast teacher's demo whiteboard to students (Requirement 21)
            const handleBroadcastTeacherWhiteboard = (dataUrl) => {
                const qObj = {
                    id: 'q_teacher_draw_' + Date.now(),
                    mode: 'DRAW',
                    prompt: '教師白板廣播示範：',
                    broadcastData: dataUrl,
                    startTime: Date.now()
                };
                publishQuestion(qObj);
                setShowTeacherDemoWhiteboard(false);
                showToast('已成功廣播白板至全班螢幕！', 'success');
            };

            // Requirement 9: Upgraded Random Picker
            const handleDrawRandomStudent = () => {
                if (isSpinning) return;
                setIsSpinning(true);

                let spinCount = 0;
                const interval = setInterval(() => {
                    const temp = Math.floor(Math.random() * (rangeEnd - rangeStart + 1)) + rangeStart;
                    setCurrentDrawn(temp);
                    audioSys.playSound('spin');
                    spinCount++;

                    if (spinCount > 15) {
                        clearInterval(interval);
                        // Pick un-drawn if possible
                        const available = [];
                        for (let i = rangeStart; i <= rangeEnd; i++) {
                            if (!drawnNumbers.includes(i)) available.push(i);
                        }
                        const finalNum = available.length > 0 
                            ? available[Math.floor(Math.random() * available.length)]
                            : Math.floor(Math.random() * (rangeEnd - rangeStart + 1)) + rangeStart;

                        setCurrentDrawn(finalNum);
                        setDrawnNumbers(prev => [...prev, finalNum]);
                        setIsSpinning(false);
                        audioSys.playSound('win');
                    }
                }, 100);
            };

            // Timer set helpers
            const setTimerBySeconds = (sec) => {
                setTimerSeconds(sec);
                setTimerActive(true);
            };

            const setTimerFromInputs = () => {
                const m = parseInt(timerMinInput) || 0;
                const s = parseInt(timerSecInput) || 0;
                setTimerSeconds(m * 60 + s);
                setTimerActive(true);
            };

            // Responses List Array
            const responseList = useMemo(() => {
                return Object.values(responses).sort((a, b) => (a.submitTimestamp || 0) - (b.submitTimestamp || 0));
            }, [responses]);

            // Requirement 20: Export CSV spreadsheet of Challenge
            const handleExportChallengeCSV = () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;

                let csv = "學號,姓名,總分,正確率,作答用時(秒),詳細答案\n";
                studentsList.forEach(std => {
                    const res = responses[std.id];
                    if (res) {
                        const timeSec = res.timeTakenSeconds || 0;
                        const score = res.score || 0;
                        const accuracy = res.accuracy || '0%';
                        const detailStr = res.answers ? JSON.stringify(res.answers).replace(/"/g, '""') : '';
                        csv += `"${std.seatNumber}","${std.name}",${score},"${accuracy}",${timeSec},"${detailStr}"\n`;
                    } else {
                        csv += `"${std.seatNumber}","${std.name}",未提交,0%,0,""\n`;
                    }
                });

                const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `挑戰題成績紀錄_${roomCode}.csv`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('已匯出 CSV 成績試算表', 'success');
            };

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col font-sans">
                    {/* Header bar (Requirement 9: Title Renaming) */}
                    <header className="bg-slate-900 text-white px-6 py-4 flex flex-wrap items-center justify-between gap-4 shadow-lg sticky top-0 z-40">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center font-black text-white text-lg shadow-md">
                                OMIT
                            </div>
                            <div>
                                <h1 className="text-lg md:text-xl font-black text-white tracking-tight">
                                    宣道會陳元喜小學OMIT互動課堂
                                </h1>
                                <span className="text-xs text-indigo-400 font-mono font-bold">課堂房號: {roomCode}</span>
                            </div>
                        </div>

                        {/* Top Utility Tools */}
                        <div className="flex flex-wrap items-center gap-2">
                            {/* Requirement 11: QR Code & Live Student Monitor */}
                            <button 
                                onClick={() => setShowQRModal(true)}
                                className="px-3.5 py-2 rounded-xl bg-indigo-600/80 hover:bg-indigo-600 text-xs font-bold flex items-center space-x-1.5 transition border border-indigo-400/30"
                            >
                                <span>📱 課堂QR碼</span>
                                <span className="bg-emerald-500 text-white font-black px-2 py-0.5 rounded-full text-[10px]">
                                    在線: {studentsList.length}人
                                </span>
                            </button>

                            {/* Requirement 21: Teacher Whiteboard (placed next to random picker) */}
                            <button 
                                onClick={() => setShowTeacherDemoWhiteboard(true)}
                                className="px-3.5 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-xs font-bold flex items-center space-x-1 transition shadow-sm"
                            >
                                <span>🎨 教師白板</span>
                            </button>

                            {/* Requirement 9: Upgraded Random Student Picker */}
                            <button 
                                onClick={() => setShowRandomModal(true)}
                                className="px-3.5 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-xs font-bold flex items-center space-x-1 transition shadow-sm"
                            >
                                <span>🎲 抽選學生</span>
                            </button>

                            {/* Requirement 10: Timer Tool */}
                            <button 
                                onClick={() => setShowTimerModal(true)}
                                className="px-3.5 py-2 rounded-xl bg-teal-600 hover:bg-teal-500 text-xs font-bold flex items-center space-x-1 transition shadow-sm"
                            >
                                <span>⏱️ 計時器 {timerActive ? `(${Math.floor(timerSeconds/60)}:${('0'+timerSeconds%60).slice(-2)})` : ''}</span>
                            </button>

                            <button 
                                onClick={onExit}
                                className="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 transition"
                            >
                                退出
                            </button>
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <div className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
                        
                        {/* Left Control Panel (Question Creation / Dispatcher) */}
                        <div className="lg:col-span-5 space-y-6">
                            <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200/80 space-y-5">
                                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                                    <h2 className="font-black text-slate-800 text-base flex items-center gap-2">
                                        <span>📢 派送互動功能</span>
                                    </h2>
                                    {activeQuestion && (
                                        <button 
                                            onClick={handleStopQuestion}
                                            className="px-3 py-1 bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs rounded-xl shadow-sm transition"
                                        >
                                            ⛔ 結束目前題目
                                        </button>
                                    )}
                                </div>

                                {/* Mode Select Grid */}
                                <div className="grid grid-cols-3 gap-2">
                                    {[
                                        { id: 'CHOICE', label: '選擇題', emoji: '🔘' },
                                        { id: 'TF', label: '是非題', emoji: '⭕' },
                                        { id: 'SHORT', label: '短答題', emoji: '✍️' },

                                        { id: 'CHALLENGE', label: '挑戰題', emoji: '🏆' },

                                            >
                                                🚀 廣播派送連結/影片
                                            </button>
                                        </div>

                                    {/* Requirement 12, 13, 14: Challenge Setup */}

                                            <div className="flex justify-between items-center bg-indigo-50 p-3 rounded-xl border border-indigo-100">
                                                <span className="text-xs font-bold text-indigo-900">下載評估範本檔</span>
                                                <button 
                                                    onClick={handleDownloadWordTemplate}
                                                    className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-sm transition"
                                                >
                                                    📄 下載評估範本Word檔
                                                </button>
                                            </div>

                                            {/* Word upload */}
                                            <div>
                                                <label className="text-xs font-bold text-slate-600 mb-1 block">上載評估 Word / 文字檔</label>
                                                <input 
                                                    type="file"
                                                    accept=".docx,.txt"
                                                    onChange={(e) => handleUploadWordAssessment(e, 'CHALLENGE')}
                                                    className="w-full text-xs text-slate-500 border border-slate-200 rounded-xl bg-white p-2"
                                                />
                                            </div>

                                            {/* Challenge Edit Confirmation (教師編輯/確認評估內容) */}
                                            {challengeData && (
                                                <div className="bg-white p-3 rounded-xl border border-slate-200 space-y-3 max-h-52 overflow-y-auto">
                                                    <div className="flex justify-between items-center border-b pb-2">
                                                        <input 
                                                            type="text" 
                                                            value={challengeData.title}
                                                            onChange={(e) => setChallengeData({ ...challengeData, title: e.target.value })}
                                                            className="font-bold text-xs text-slate-800 border-b border-indigo-300 focus:outline-none"
                                                        />
                                                        <span className="text-[10px] bg-slate-100 text-slate-600 font-bold px-2 py-0.5 rounded-full">
                                                            {challengeData.questions.length} 題
                                                        </span>
                                                    </div>

                                                    {challengeData.questions.map((q, idx) => (
                                                        <div key={idx} className="bg-slate-50 p-2 rounded-lg border border-slate-200 text-xs space-y-1">
                                                            <div className="flex justify-between items-center">
                                                                <span className="font-bold text-indigo-600">第 {idx + 1} 題</span>
                                                                <button 
                                                                    onClick={() => {
                                                                        const updated = challengeData.questions.filter((_, i) => i !== idx);
                                                                        setChallengeData({ ...challengeData, questions: updated });
                                                                    }}
                                                                    className="text-rose-500 hover:text-rose-700 font-bold text-[10px]"
                                                                >
                                                                    ❌ 刪除
                                                                </button>
                                                            </div>
                                                            <input 
                                                                type="text" 
                                                                value={q.text}
                                                                onChange={(e) => {
                                                                    const updated = [...challengeData.questions];
                                                                    updated[idx].text = e.target.value;
                                                                    setChallengeData({ ...challengeData, questions: updated });
                                                                }}
                                                                className="w-full bg-white p-1 rounded border border-slate-200 font-medium"
                                                            />
                                                            <div className="flex items-center space-x-2 pt-1">
                                                                <span className="text-[10px] font-bold text-slate-500">正確答案:</span>
                                                                {['A', 'B', 'C', 'D'].map((letter) => (
                                                                    <button 
                                                                        key={letter}
                                                                        onClick={() => {
                                                                            const updated = [...challengeData.questions];
                                                                            updated[idx].answer = letter;
                                                                            setChallengeData({ ...challengeData, questions: updated });
                                                                        }}
                                                                        className={`px-2 py-0.5 rounded font-bold text-[10px] ${q.answer === letter ? 'bg-emerald-600 text-white' : 'bg-white border border-slate-200'}`}
                                                                    >
                                                                        {letter}
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}

                                            {/* Requirement 13: Challenge Time Limit Mode */}
                                            <div className="space-y-2 border-t pt-3">
                                                <div className="flex items-center justify-between">

                                                    <input 
                                                        type="checkbox" 
                                                        checked={challengeEnableTimer}
                                                        onChange={(e) => setChallengeEnableTimer(e.target.checked)}
                                                        className="w-4 h-4 accent-indigo-600 rounded"
                                                    />
                                                </div>

                                                {challengeEnableTimer && (
                                                    <div className="space-y-2 bg-white p-2.5 rounded-xl border border-slate-200">
                                                        <div className="flex flex-wrap gap-1">
                                                            {[1, 2, 3, 4, 5].map(m => (
                                                                <button 
                                                                    key={m}
                                                                    onClick={() => setChallengeTimeLimit(m * 60)}
                                                                    className={`px-2.5 py-1 rounded-lg text-[10px] font-bold ${challengeTimeLimit === m * 60 ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}`}
                                                                >
                                                                    {m}分鐘
                                                                </button>
                                                            ))}
                                                        </div>
                                                        <div className="flex items-center space-x-2 text-xs font-bold text-slate-600">
                                                            <span>設定倒數 (秒):</span>
                                                            <input 
                                                                type="number"
                                                                value={challengeTimeLimit}
                                                                onChange={(e) => setChallengeTimeLimit(parseInt(e.target.value) || 60)}
                                                                className="w-20 p-1 border rounded text-center font-mono"
                                                            />
                                                            <span>秒</span>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>

                                            {/* Requirement 14: Score Release Mode */}
                                            <div className="space-y-2 border-t pt-3">
                                                <span className="text-xs font-bold text-slate-700 block">成績發放方式:</span>
                                                <div className="space-y-1.5">
                                                    <label className="flex items-center space-x-2 text-xs font-medium cursor-pointer">
                                                        <input 
                                                            type="radio" 
                                                            name="release" 
                                                            checked={challengeReleaseInstant}
                                                            onChange={() => setChallengeReleaseInstant(true)}
                                                            className="accent-indigo-600"

                                                        <span>提交後即時顯示分數與解析</span>

                                                        <input 
                                                            type="radio" 
                                                            name="release" 
                                                            checked={!challengeReleaseInstant}
                                                            onChange={() => setChallengeReleaseInstant(false)}
                                                            className="accent-indigo-600"
                                                        />
                                                        <span>待所有學生完成後，由教師一併發放</span>
                                                    </label>
                                                </div>

                                            <button

                                            </button>

                                    {/* Requirement 22: Cooperative Group Quiz Panel (預備 > 分組 > 比賽) */}
                                    {selectedMode === 'GROUP_COOP' && (
