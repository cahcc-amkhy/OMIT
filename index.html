                                <button onClick={() => setShowRandomModal(false)} class="w-full py-2 text-slate-400 font-bold text-sm">關閉</button>
                            </div>
                        </div>
                    )}

                    {/* Item 10: Enhanced Timer Tool Modal */}
                    {showTimerModal && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-md w-full space-y-5 shadow-2xl">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="text-xl font-black text-slate-800">⏱️ 計時器工具</h3>
                                    <button onClick={() => setShowTimerModal(false)} class="text-slate-400 text-2xl font-bold">✕</button>
                                </div>

                                <div class="text-center bg-slate-900 text-amber-400 p-6 rounded-3xl font-mono text-5xl font-black tracking-widest shadow-inner">
                                    {Math.floor(timerSeconds / 60).toString().padStart(2, '0')}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                </div>

                                <div class="grid grid-cols-3 gap-2">
                                    {[30, 60, 120, 180, 240, 300].map(s => (
                                        <button 
                                            key={s}
                                            onClick={() => { setTimerSeconds(s); setTimerActive(false); }}
                                            class="py-2 bg-slate-100 hover:bg-slate-200 font-bold text-slate-700 rounded-xl text-xs"
                                        >
                                            {s < 60 ? `${s}秒` : `${s / 60}分鐘`}
                                        </button>
                                    ))}
                                </div>

                                <div class="flex items-center justify-center space-x-2 bg-slate-50 p-3 rounded-2xl border">
                                    <span class="text-xs font-bold text-slate-600">手動輸入 (00:00 分:秒)：</span>
                                    <input 
                                        type="number" 
                                        min="0" 
                                        max="99" 
                                        value={timerMinInput} 
                                        onChange={(e) => setTimerMinInput(e.target.value)} 
                                        class="w-10 text-center font-mono font-bold border rounded p-1 text-xs" 
                                    />
                                    <span>:</span>
                                    <input 
                                        type="number" 
                                        min="0" 
                                        max="59" 
                                        value={timerSecInput} 
                                        onChange={(e) => setTimerSecInput(e.target.value)} 
                                        class="w-10 text-center font-mono font-bold border rounded p-1 text-xs" 
                                    />
                                    <button 
                                        onClick={() => {
                                            const total = (parseInt(timerMinInput) || 0) * 60 + (parseInt(timerSecInput) || 0);
                                            setTimerSeconds(total);
                                        }}
                                        class="px-3 py-1 bg-indigo-600 text-white font-bold text-xs rounded-lg"
                                    >
                                        設定
                                    </button>
                                </div>

                                <div class="flex space-x-2">
                                    <button 
                                        onClick={() => setTimerActive(!timerActive)}
                                        class={`flex-1 py-3 text-white font-extrabold rounded-xl shadow transition ${timerActive ? 'bg-amber-600' : 'bg-emerald-600'}`}
                                    >
                                        {timerActive ? '⏸️ 暫停' : '▶️ 開始倒數'}
                                    </button>
                                    <button 
                                        onClick={() => { setTimerSeconds(0); setTimerActive(false); }}
                                        class="px-4 py-3 bg-slate-200 text-slate-700 font-bold rounded-xl"
                                    >
                                        清空
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Student Interface Component
        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, coopState, showToast, onExit }) {
            const [myAnswer, setMyAnswer] = useState('');
            const [submitted, setSubmitted] = useState(false);
            const [myRecordAudio, setMyRecordAudio] = useState(null);
            const [isRecording, setIsRecording] = useState(false);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            const [timeLeft, setTimeLeft] = useState(null);
            const startTimeRef = useRef(Date.now());

            // Listen for room broadcasts
            const broadcastedWhiteboard = activeQuestion?.broadcastedSubmission || null;

            // My submitted record key
            const myResKey = activeQuestion ? `${activeQuestion.id}_${studentId}` : null;
            const myPrevResponse = myResKey ? responses[myResKey] : null;

            useEffect(() => {
                if (myPrevResponse) {
                    setSubmitted(true);
                } else {
                    setSubmitted(false);
                    setMyAnswer('');
                    setMyRecordAudio(null);
                    startTimeRef.current = Date.now();
                }
            }, [activeQuestion?.id]);

            // Challenge timer countdown logic (Item 15)
            useEffect(() => {
                if (activeQuestion?.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer && activeQuestion.challenge?.timeLimit) {
                    const limit = activeQuestion.challenge.timeLimit;
                    const elapsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                    const remaining = Math.max(0, limit - elapsed);
                    setTimeLeft(remaining);

                    const timer = setInterval(() => {
                        setTimeLeft(t => {
                            if (t <= 1) {
                                clearInterval(timer);
                                // Auto submit challenge
                                handleStudentSubmit('TIMEOUT');
                                return 0;
                            }
                            return t - 1;
                        });
                    }, 1000);

                    return () => clearInterval(timer);
                }
            }, [activeQuestion]);

            // Submit response
            const handleStudentSubmit = (val) => {
                const answerToSubmit = val !== undefined ? val : myAnswer;
                if (answerToSubmit === undefined || answerToSubmit === '') {
                    showToast("請選擇或填寫答案！", "error");
                    return;
                }

                const durationSec = ((Date.now() - startTimeRef.current) / 1000).toFixed(1);

                let scoreDetailsObj = null;
                if (activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge) {
                    let totalPoints = 0;
                    const questions = activeQuestion.challenge.questions;
                    const userAnswers = typeof answerToSubmit === 'object' ? answerToSubmit : {};

                    questions.forEach(q => {
                        if (userAnswers[q.num] === q.answer) {
                            totalPoints += (activeQuestion.challenge.totalScore / questions.length);
                        }
                    });

                    scoreDetailsObj = {
                        totalScore: Math.round(totalPoints),
                        percentage: Math.round((totalPoints / activeQuestion.challenge.totalScore) * 100)
                    };
                }

                const responseObj = {
                    questionId: activeQuestion.id,
                    studentId,
                    seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: answerToSubmit,
                    duration: durationSec,
                    scoreDetails: scoreDetailsObj,
                    timestamp: Date.now()
                };

                const appId = "omit-8c173";
                const db = window.fbDb;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', `${activeQuestion.id}_${studentId}`);
                window.fbUtils.setDoc(resDocRef, responseObj);

                setSubmitted(true);
                // Item 6: Feedback message
                showToast("已提交答案! 讚賞你的努力! 安靜等候老師指示...", "success");
            };

            // Audio recording handler (Item 5)
            const startAudioRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => setMyRecordAudio(reader.result);
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);

                    // Auto stop after 10s
                    setTimeout(() => {
                        if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
                            stopAudioRecording();
                        }
                    }, 10000);
                } catch (err) {
                    showToast("無法存取麥克風！", "error");
                }
            };

            const stopAudioRecording = () => {
                if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            // Item 22.3: Cooperative Quiz student screen option handler
            const handleCoopOptionClick = async (chosenOption) => {
                if (!coopState || coopState.stage !== 'RACE') return;
                const myTeam = coopState.teams.find(t => t.members.some(m => m.id === studentId));
                if (!myTeam) return;

                const currentQIndex = myTeam.progress;
                const currentQ = coopState.questions[currentQIndex];

                if (!currentQ) return;

                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                if (chosenOption === currentQ.answer) {
                    // Correct answer
                    const newProg = currentQIndex + 1;
                    const isWinner = newProg >= coopState.questions.length;
                    
                    const updatedTeams = coopState.teams.map(t => {
                        if (t.id === myTeam.id) {
                            return { ...t, progress: newProg, isWinner };
                        }
                        return t;
                    });

                    const updatedCoop = {
                        ...coopState,
                        teams: updatedTeams,
                        winnerTeam: isWinner ? { ...myTeam, members: myTeam.members } : coopState.winnerTeam
                    };

                    if (isWinner) playSound('win');
                    await window.fbUtils.setDoc(roomDocRef, { coopState: updatedCoop }, { merge: true });
                    showToast("🎉 答對了！團隊進度往前一步！", "success");
                } else {
                    // Wrong answer -> penalty reset to 0
                    playSound('wrong');
                    const updatedTeams = coopState.teams.map(t => {
                        if (t.id === myTeam.id) {
                            return { ...t, progress: 0 };
                        }
                        return t;
                    });

                    const updatedCoop = { ...coopState, teams: updatedTeams };
                    await window.fbUtils.setDoc(roomDocRef, { coopState: updatedCoop }, { merge: true });
                    showToast("⚠️ 答錯了！扣減所有著色重頭開始！", "error");
                }
            };

            // My team in Coop Mode
            const myCoopTeam = useMemo(() => {
                if (!coopState || !coopState.teams) return null;
                return coopState.teams.find(t => t.members.some(m => m.id === studentId));
            }, [coopState, studentId]);

            return (
                <div class="min-h-screen bg-slate-100 pb-12">
                    {/* Header */}
                    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-30">
                        <div class="max-w-xl mx-auto flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <span class="font-black text-xl">OMIT</span>
                                <span class="bg-indigo-500 text-xs px-2 py-0.5 rounded-full font-mono font-bold">
                                    房號：{roomCode}
                                </span>
                            </div>
                            <div class="flex items-center space-x-3 text-sm font-bold">
                                <span>{seatNumber}號 {studentName}</span>
                                <button onClick={onExit} class="text-xs bg-indigo-700 px-2.5 py-1 rounded-lg">退出</button>
                            </div>
                        </div>
                    </header>

                    <main class="max-w-xl mx-auto p-4 space-y-5">
                        {/* Peer Review Whiteboard Broadcast (Item 2) */}
                        {broadcastedWhiteboard && (
                            <div class="bg-purple-900 text-white rounded-3xl p-5 shadow-2xl space-y-3 animate-fade-in border-4 border-purple-400">
                                <div class="flex justify-between items-center border-b border-purple-700 pb-2">
                                    <span class="text-xs font-black bg-purple-500 px-2.5 py-1 rounded-full">📢 教師白板廣播 / 學生互評</span>
                                    <span class="text-sm font-bold">{broadcastedWhiteboard.name} ({broadcastedWhiteboard.seatNumber}號)</span>
                                </div>
                                <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden border">
                                    <img src={broadcastedWhiteboard.answer} class="w-full h-full object-contain" alt="廣播作品" />
                                </div>
                            </div>
                        )}

                        {/* Item 22: Cooperative Quiz Mode Student View */}
                        {coopState && myCoopTeam && (
                            <div class="bg-white rounded-3xl p-6 shadow-md border-2 border-emerald-400 space-y-5">
                                <div class="text-center space-y-2">
                                    <span class={`inline-block px-4 py-1.5 rounded-2xl text-base font-black ${myCoopTeam.color} shadow`}>
                                        {myCoopTeam.emoji} 你被分配在：{myCoopTeam.name}
                                    </span>
                                    {coopState.stage === 'GROUPING' && (
                                        <p class="text-sm font-extrabold text-indigo-600 animate-pulse">
                                            盡快與你的組員會合! 比賽即將開始!
                                        </p>
                                    )}
                                </div>

                                {/* Item 22.3: Race Phase option splitting */}
                                {coopState.stage === 'RACE' && (
                                    <div class="space-y-4">
                                        {coopState.winnerTeam ? (
                                            <div class="text-center p-6 bg-amber-100 rounded-2xl space-y-2 border-2 border-amber-400">
                                                <div class="text-4xl">🏆</div>
                                                <h3 class="text-2xl font-black text-amber-900">
                                                    勝出組別：{coopState.winnerTeam.emoji} {coopState.winnerTeam.name}
                                                </h3>
                                                <p class="text-xs text-amber-800 font-bold">全班已完成比賽！</p>
                                            </div>
                                        ) : (
                                            (() => {
                                                const qIdx = myCoopTeam.progress;
                                                const currentQ = coopState.questions[qIdx];
                                                if (!currentQ) return <div class="text-center font-bold">全數答對！已順利抵達終點！</div>;

                                                // Split logic among team members
                                                const memberIdx = myCoopTeam.members.findIndex(m => m.id === studentId);
                                                const teamSize = myCoopTeam.members.length;

                                                let showQuestionText = false;
                                                let visibleOptions = [];

                                                if (teamSize === 1) {
                                                    showQuestionText = true;
                                                    visibleOptions = currentQ.options;
                                                } else if (teamSize === 2) {
                                                    if (memberIdx === 0) {
                                                        showQuestionText = true;
                                                        visibleOptions = currentQ.options.slice(0, 2);
                                                    } else {
                                                        visibleOptions = currentQ.options.slice(2);
                                                    }
                                                } else {
                                                    if (memberIdx === 0) {
                                                        showQuestionText = true;
                                                    } else if (memberIdx === 1) {
                                                        visibleOptions = currentQ.options.slice(0, 2);
                                                    } else {
                                                        visibleOptions = currentQ.options.slice(2);
                                                    }
                                                }

                                                return (
                                                    <div class="space-y-4">
                                                        <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-200">
                                                            <div class="text-xs font-bold text-emerald-800">
                                                                第 {qIdx + 1} / {coopState.questions.length} 題 (團隊合作分工中)：
                                                            </div>
                                                            {showQuestionText ? (
                                                                <div class="text-lg font-black text-slate-800 mt-1">
                                                                    {currentQ.text}
                                                                </div>
                                                            ) : (
                                                                <div class="text-xs text-slate-500 italic mt-1">
                                                                    💡 題目內容顯示於第一位組員螢幕上，請與組員溝通合作！
                                                                </div>
                                                            )}
                                                        </div>

                                                        {visibleOptions.length > 0 && (
                                                            <div class="grid grid-cols-1 gap-2.5">
                                                                <div class="text-xs font-bold text-slate-500">分配給你的選項：</div>
                                                                {visibleOptions.map((opt) => (
                                                                    <button 
                                                                        key={opt.letter}
                                                                        onClick={() => handleCoopOptionClick(opt.letter)}
                                                                        class="p-4 bg-white border-2 border-slate-200 hover:border-emerald-500 rounded-2xl font-bold text-left text-slate-800 shadow-sm active:scale-95 transition"
                                                                    >
                                                                        <span class="text-emerald-600 mr-2">{opt.letter}.</span>
                                                                        <span>{opt.text}</span>
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })()
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Regular Active Question Flow */}
                        {activeQuestion && activeQuestion.mode !== 'COOP' && (
                            <div class="bg-white rounded-3xl p-6 shadow-lg border border-slate-200 space-y-5">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <span class="bg-indigo-100 text-indigo-700 text-xs px-3 py-1 rounded-full font-black">
                                        {getModeLabel(activeQuestion.mode)}
                                    </span>
                                    {timeLeft !== null && (
                                        <span class="bg-rose-100 text-rose-700 font-mono text-xs font-bold px-3 py-1 rounded-full animate-pulse">
                                            ⏳ 剩餘時間：{Math.floor(timeLeft / 60)}:{(timeLeft % 60).toString().padStart(2, '0')}
                                        </span>
                                    )}
                                </div>

                                <h2 class="text-lg font-black text-slate-800">{activeQuestion.text}</h2>

                                {/* Item 4: YouTube Player & Link Opening */}
                                {activeQuestion.mode === 'LINK' && activeQuestion.pushedUrl && (
                                    <div class="space-y-4">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div class="aspect-16-9 w-full rounded-2xl overflow-hidden border">
                                                <iframe 
                                                    src={activeQuestion.youtubeEmbed} 
                                                    class="w-full h-full" 
                                                    allow="autoplay; encrypted-media" 
                                                    allowFullScreen 
                                                />
                                            </div>
                                        ) : null}

                                        <a 
                                            href={activeQuestion.pushedUrl} 
                                            target="_blank" 
                                            rel="noopener noreferrer"
                                            class="block w-full py-3.5 bg-indigo-600 text-white font-extrabold text-center rounded-2xl shadow-lg hover:bg-indigo-700 transition"
                                        >
                                            開啟連結網站 ↗
                                        </a>
                                    </div>
                                )}

                                {/* Choice / TF Mode with Separate Submit Button (Item 3) */}
                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div class="space-y-4">
                                        <div class="grid grid-cols-1 gap-2.5">
                                            {activeQuestion.choiceOptions.map((opt) => (
                                                <button 
                                                    key={opt}
                                                    disabled={submitted && activeQuestion.lockAfterSubmit}
                                                    onClick={() => setMyAnswer(opt)}
                                                    class={`p-4 rounded-2xl font-black text-left border-2 transition ${
                                                        myAnswer === opt ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-800 border-slate-200'
                                                    }`}
                                                >
                                                    {opt}
                                                </button>
                                            ))}
                                        </div>

                                        {/* Item 3: Separate Confirm Submit Button */}
                                        <button 
                                            disabled={submitted && activeQuestion.lockAfterSubmit}
                                            onClick={() => handleStudentSubmit(myAnswer)}
                                            class="w-full py-3.5 bg-emerald-600 text-white font-extrabold rounded-2xl shadow-lg transition active:scale-98 disabled:opacity-50"
                                        >
                                            {submitted ? '✅ 已提交 (點擊可再次修訂)' : '確認提交答案 🚀'}
                                        </button>
                                    </div>
                                )}

                                {/* Short Answer Mode (Item 3) */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-3">
                                        <textarea 
                                            rows={3}
                                            value={myAnswer}
                                            onChange={(e) => setMyAnswer(e.target.value)}
                                            placeholder="請輸入您的回答..."
                                            disabled={submitted && activeQuestion.lockAfterSubmit}
                                            class="w-full p-4 border rounded-2xl focus:ring-2 focus:ring-indigo-500 font-medium"
                                        />
                                        <button 
                                            disabled={submitted && activeQuestion.lockAfterSubmit}
                                            onClick={() => handleStudentSubmit(myAnswer)}
                                            class="w-full py-3.5 bg-emerald-600 text-white font-extrabold rounded-2xl shadow-lg active:scale-98 disabled:opacity-50"
                                        >
                                            {submitted ? '✅ 已提交' : '確認提交 🚀'}
                                        </button>
                                    </div>
                                )}

                                {/* Item 1: Whiteboard Canvas Mode */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <WhiteboardCanvas 
                                        bgImage={activeQuestion.whiteboardBg}
                                        onSubmit={(dataUrl) => handleStudentSubmit(dataUrl)}
                                    />
                                )}

                                {/* Item 18: Buzzer Mode */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="text-center py-6 space-y-4">
                                        <button 
                                            disabled={submitted}
                                            onClick={() => {
                                                playSound('buzzer');
                                                handleStudentSubmit('BUZZ');
                                            }}
                                            class="w-48 h-48 rounded-full bg-rose-600 hover:bg-rose-700 text-white font-black text-3xl shadow-2xl border-8 border-rose-300 active:scale-90 transition inline-flex items-center justify-center"
                                        >
                                            {submitted ? '已搶答！' : '按我搶答！'}
                                        </button>
                                    </div>
                                )}

                                {/* Item 5: Audio Recording Flow */}
                                {activeQuestion.mode === 'AUDIO' && (
                                    <div class="space-y-4 text-center">
                                        {!myRecordAudio ? (
                                            <button 
                                                onClick={isRecording ? stopAudioRecording : startAudioRecording}
                                                class={`px-8 py-4 rounded-2xl font-black text-white shadow-lg transition ${isRecording ? 'bg-rose-600 animate-pulse' : 'bg-cyan-600 hover:bg-cyan-700'}`}
                                            >
                                                {isRecording ? '⏹️ 結束錄音 (最長10秒)' : '🎙️ 開始錄音'}
                                            </button>
                                        ) : (
                                            <div class="space-y-3 bg-cyan-50 p-4 rounded-2xl border border-cyan-200">
                                                <div class="text-xs font-bold text-cyan-900">錄音試聽預覽：</div>
                                                <audio src={myRecordAudio} controls class="w-full h-8" />
                                                <div class="flex space-x-2 pt-2">
                                                    <button 
                                                        onClick={() => setMyRecordAudio(null)}
                                                        class="w-1/2 py-2.5 bg-rose-50 text-rose-600 font-bold text-xs rounded-xl border border-rose-200"
                                                    >
                                                        🗑️ 刪除重錄
                                                    </button>
                                                    <button 
                                                        onClick={() => handleStudentSubmit(myRecordAudio)}
                                                        class="w-1/2 py-2.5 bg-emerald-600 text-white font-extrabold text-xs rounded-xl shadow"
                                                    >
                                                        ✅ 確認提交錄音
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Item 15 & 19: Challenge Mode Student Quiz View */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                    <div class="space-y-6">
                                        {(() => {
                                            const questions = activeQuestion.challenge.questions;
                                            const scoresReleased = activeQuestion.challenge.releaseInstant || activeQuestion.challenge.scoresReleased;

                                            return (
                                                <div class="space-y-5">
                                                    {questions.map((q) => {
                                                        const userChosen = typeof myAnswer === 'object' ? myAnswer[q.num] : null;

                                                        return (
                                                            <div key={q.num} class="bg-slate-50 p-4 rounded-2xl border space-y-2">
                                                                <div class="font-bold text-slate-800 text-sm">
                                                                    {q.num}. {q.text}
                                                                </div>

                                                                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                                    {q.options.map((opt) => {
                                                                        const isSelected = userChosen === opt.letter;
                                                                        const isCorrect = opt.letter === q.answer;

                                                                        let btnStyle = "bg-white border-slate-200 text-slate-700";
                                                                        if (scoresReleased && submitted) {
                                                                            if (isCorrect) btnStyle = "bg-emerald-100 border-emerald-500 text-emerald-900 font-extrabold";
                                                                            else if (isSelected && !isCorrect) btnStyle = "bg-rose-100 border-rose-500 text-rose-900 font-extrabold";
                                                                        } else if (isSelected) {
                                                                            btnStyle = "bg-amber-500 text-white border-amber-600 font-bold";
                                                                        }

                                                                        return (
                                                                            <button 
                                                                                key={opt.letter}
                                                                                disabled={submitted}
                                                                                onClick={() => {
                                                                                    const prevObj = typeof myAnswer === 'object' ? myAnswer : {};
                                                                                    setMyAnswer({ ...prevObj, [q.num]: opt.letter });
                                                                                }}
                                                                                class={`p-3 rounded-xl border text-xs text-left transition ${btnStyle}`}
                                                                            >
                                                                                <span class="font-bold mr-1">{opt.letter}.</span>
                                                                                <span>{opt.text}</span>
                                                                                {scoresReleased && submitted && isCorrect && <span class="ml-2 text-emerald-700"> (正確答案)</span>}
                                                                                {scoresReleased && submitted && isSelected && !isCorrect && <span class="ml-2 text-rose-700"> (你的選擇 - 答錯)</span>}
                                                                            </button>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}

                                                    {!submitted && (
                                                        <button 
                                                            onClick={() => handleStudentSubmit(myAnswer)}
                                                            class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-2xl shadow-lg transition active:scale-98"
                                                        >
                                                            確認提交挑戰題評估 🚀
                                                        </button>
                                                    )}

                                                    {submitted && scoresReleased && myPrevResponse?.scoreDetails && (
                                                        <div class="bg-amber-100 border-2 border-amber-300 p-4 rounded-2xl text-center space-y-1">
                                                            <div class="text-xs text-amber-800 font-bold">你的得分：</div>
                                                            <div class="text-3xl font-black text-amber-900">
                                                                {myPrevResponse.scoreDetails.totalScore} / {activeQuestion.challenge.totalScore} 分
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })()}
                                    </div>
                                )}
                            </div>
                        )}

                        {!activeQuestion && !coopState && (
                            <div class="text-center py-16 bg-white rounded-3xl border text-slate-400 space-y-2">
                                <div class="text-4xl">⏳</div>
                                <div class="font-bold text-sm">等候老師派送題目或活動...</div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
