    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Custom Sound Alarm Generator using Web Audio API
        const playAlarmSound = () => {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioCtx.currentTime;
                
                // Play 3 rapid chime beeps
                [0, 0.25, 0.5, 0.75].forEach((delay) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, now + delay); // A5 tone
                    gain.gain.setValueAtTime(0.3, now + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + delay);
                    osc.stop(now + delay + 0.2);
                });
            } catch (e) {
                console.error('Audio playback failed', e);
            }
        };

        // Custom Toast Notification Component
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-rose-600' : type === 'success' ? 'bg-emerald-600' : 'bg-indigo-600';

            return (
                <div class={`fixed top-4 right-4 z-[9999] ${bgColor} text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-2 text-sm font-semibold animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        // Main Application Component
        function OMITApp() {
            const [fbReady, setFbReady] = useState(false);
            const [role, setRole] = useState('LANDING'); // 'LANDING', 'TEACHER', 'STUDENT'
            const [roomCode, setRoomCode] = useState('');
            const [seatNumber, setSeatNumber] = useState('');
            const [studentName, setStudentName] = useState('');
            const [toast, setToast] = useState(null);
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [userAuth, setUserAuth] = useState(null);

            const studentIdRef = useRef('std_' + Math.random().toString(36).substring(2, 9));

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            // Firebase Readiness
            useEffect(() => {
                const handleFbReady = () => setFbReady(true);
                if (window.fb) handleFbReady();
                else window.addEventListener('firebase-ready', handleFbReady);
                return () => window.removeEventListener('firebase-ready', handleFbReady);
            }, []);

            // Firebase Anonymous Auth
            useEffect(() => {
                if (!fbReady) return;
                window.fb.signInAnonymously(window.fb.auth)
                    .then(cred => setUserAuth(cred.user))
                    .catch(err => console.error("Auth error:", err));
            }, [fbReady]);

            // Parse URL parameters for direct room joining
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const roomParam = params.get('room');
                if (roomParam) {
                    setRoomCode(roomParam.toUpperCase());
                }
            }, []);

            // Teacher Password Verification (8030)
            const handleTeacherLoginSubmit = (e) => {
                e.preventDefault();
                if (passwordInput === '8030') {
                    const generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
                    setRoomCode(generatedCode);
                    setShowPasswordModal(false);
                    setPasswordInput('');
                    setRole('TEACHER');
                    showToast(`已建立互動課堂 房號：${generatedCode}`, 'success');
                } else {
                    showToast('密碼錯誤！', 'error');
                    setPasswordInput('');
                }
            };

            // Student Room Join
            const handleJoinRoom = (e) => {
                e?.preventDefault();
                if (!roomCode.trim()) {
                    showToast('請輸入6位數字房號', 'error');
                    return;
                }
                if (!seatNumber) {
                    showToast('請選擇您的學號 (1-36)', 'error');
                    return;
                }
                setRole('STUDENT');
                showToast(`已進入房號 ${roomCode} 的課堂`, 'success');
            };

            if (!fbReady || !userAuth) {
                return (
                    <div class="min-h-screen flex items-center justify-center bg-slate-900 text-white font-medium">
                        <div class="flex items-center space-x-3">
                            <div class="w-6 h-6 border-4 border-indigo-400 border-t-transparent rounded-full animate-spin"></div>

            if (role === 'LANDING') {
                return (
                    <div class="min-h-screen bg-gradient-to-br from-indigo-950 via-slate-900 to-purple-950 flex items-center justify-center p-4">
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                        
                        <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 space-y-7 relative overflow-hidden">
                            <div class="text-center space-y-2">
                                <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 text-white rounded-2xl mb-1 font-black text-2xl shadow-xl shadow-indigo-200 tracking-wider">
                                    OMIT
                                </div>
                                <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">OMIT 互動課堂</h1>
                                <p class="text-slate-500 text-xs">免登入！隨查隨答、高效即時的反饋互動平台</p>

                            <div class="space-y-5">
                                {/* Student Form */}
                                <form onSubmit={handleJoinRoom} class="bg-indigo-50/70 p-5 rounded-2xl border border-indigo-100 space-y-3.5">
                                    <div class="flex items-center justify-between">
                                        <h2 class="text-xs font-bold text-indigo-700 uppercase tracking-wider">我是學生 (加入課堂)</h2>
                                        <span class="text-[10px] bg-indigo-200 text-indigo-800 px-2 py-0.5 rounded-full font-bold">免密碼</span>
                                    </div>
                                    <div>
                                        <input 
                                            type="text" 
                                            placeholder="請輸入 6 位數房號" 
                                            value={roomCode} 
                                            onChange={(e) => setRoomCode(e.target.value)}
                                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-mono text-center tracking-widest text-lg font-bold text-slate-800 placeholder-slate-400"
                                            maxLength={6}
                                        />
                                    </div>
                                    
                                    <div class="grid grid-cols-3 gap-2">
                                        <div class="col-span-1">
                                            <select 
                                                value={seatNumber}
                                                onChange={(e) => setSeatNumber(e.target.value)}
                                                class="w-full px-3 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-bold text-slate-800 text-sm"
                                            >
                                                <option value="">學號 *</option>
                                                {Array.from({ length: 36 }, (_, i) => i + 1).map(num => (
                                                    <option key={num} value={num}>{num} 號</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div class="col-span-2">
                                            <input 
                                                type="text" 
                                                placeholder="姓名 / 暱稱 (可留空)" 
                                                value={studentName} 
                                                onChange={(e) => setStudentName(e.target.value)}
                                                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white text-sm font-medium text-slate-800 placeholder-slate-400"
                                            />
                                        </div>
                                    </div>

                                    <button 
                                        type="submit" 
                                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-300 active:scale-98 flex items-center justify-center space-x-2"
                                    >
                                        <span>進入課堂 🚀</span>
                                    </button>
                                </form>

                                <div class="relative flex py-1 items-center">
                                    <div class="flex-grow border-t border-slate-200"></div>
                                    <span class="flex-shrink mx-4 text-slate-400 text-xs font-medium">教師入口</span>
                                    <div class="flex-grow border-t border-slate-200"></div>
                                </div>

                                {/* Teacher Password Gate */}
                                <div>
                                    <button 
                                        onClick={() => setShowPasswordModal(true)}
                                        class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl transition shadow-md flex items-center justify-center space-x-2 active:scale-98"
                                    >
                                        <span>👨‍🏫 開啟新課堂 (教師控制台)</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Teacher Password Modal */}
                        {showPasswordModal && (
                            <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl space-y-5 animate-scaleUp">
                                    <div class="text-center">
                                        <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-2 text-xl font-bold">🔒</div>
                                        <h3 class="text-xl font-bold text-slate-800">教師權限驗證</h3>
                                        <p class="text-xs text-slate-500 mt-1">請輸入教師專用存取密碼</p>
                                    </div>
                                    <form onSubmit={handleTeacherLoginSubmit} class="space-y-4">
                                        <input 
                                            type="password"
                                            value={passwordInput}
                                            onChange={(e) => setPasswordInput(e.target.value)}
                                            class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-800 focus:outline-none font-mono text-center text-2xl tracking-widest text-slate-800"
                                            autoFocus
                                        />
                                        <div class="grid grid-cols-2 gap-2">
                                            <button 
                                                type="button" 
                                                onClick={() => { setShowPasswordModal(false); setPasswordInput(''); }}
                                                class="py-3 px-4 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 text-sm"
                                            >
                                                取消
                                            </button>
                                            <button 
                                                type="submit" 
                                                class="py-3 px-4 bg-slate-900 text-white rounded-xl font-bold hover:bg-slate-800 text-sm shadow-md"
                                            >
                                                確認進入
                                            </button>
                                        </div>
                                    </form>

            if (role === 'TEACHER') {

                        roomCode={roomCode}
                        showToast={showToast}

            if (role === 'STUDENT') {
                return (
                    <StudentInterface 
                        roomCode={roomCode}
                        seatNumber={seatNumber}
                        studentName={studentName || `學號 ${seatNumber}`}
                        studentId={studentIdRef.current}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}

            return null;
        }

        function TeacherDashboard({ roomCode, showToast, onExit }) {
            const { appId, db, doc, setDoc, deleteDoc, collection, onSnapshot, getDocs, writeBatch } = window.fb;

            // Room State
            const [activeQuestion, setActiveQuestion] = useState(null);
            const [responses, setResponses] = useState({});
            const [students, setStudents] = useState({});
            const [spotlightResponse, setSpotlightResponse] = useState(null);
            
            // Question Builder States
            const [selectedMode, setSelectedMode] = useState('CHOICE'); // 'CHOICE', 'TF', 'SHORT', 'WHITEBOARD', 'BUZZER', 'LINK'
            const [questionPrompt, setQuestionPrompt] = useState('');
            const [choiceCount, setChoiceCount] = useState(4); // 4 or 5
            const [bgImage, setBgImage] = useState(null); // Custom Whiteboard Background
            const [pushUrl, setPushUrl] = useState('');
            const [allowModify, setAllowModify] = useState(false); // Can students re-edit? Default FALSE

            // UI Modals & Tools
            const [showQRModal, setShowQRModal] = useState(false);
            const [showRosterModal, setShowRosterModal] = useState(false);
            const [showLeaderboard, setShowLeaderboard] = useState(false);
            const [selectedMcqFilter, setSelectedMcqFilter] = useState(null); // Option filter for MCQ inspection
            const [zoomedStudentId, setZoomedStudentId] = useState(null); // Individual student zoom inspection
            
            // Random Student Picker Tool
            const [showPickerModal, setShowPickerModal] = useState(false);
            const [pickerFrom, setPickerFrom] = useState(1);
            const [pickerTo, setPickerTo] = useState(36);
            const [pickerNoRepeat, setPickerNoRepeat] = useState(true);
            const [drawnNumbers, setDrawnNumbers] = useState([]);
            const [pickedResult, setPickedResult] = useState(null);
            const [isPicking, setIsPicking] = useState(false);

            // Timer State
            const [showTimerModal, setShowTimerModal] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerActive, setTimerActive] = useState(false);
            const [timerInputMin, setTimerInputMin] = useState('');
            const [timerInputSec, setTimerInputSec] = useState('');

            // Session Question History for Export
            const [questionHistory, setQuestionHistory] = useState([]);

            // QR Code URL
            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${encodeURIComponent(joinUrl)}`;

            // Paths according to strict rules
            const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', roomCode);

            // Synchronize Room Document & Listen to Responses & Presence
            useEffect(() => {
                // Listen to main room state
                const unsubRoom = onSnapshot(roomDocRef, (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        setActiveQuestion(data.activeQuestion || null);
                        setSpotlightResponse(data.spotlightResponse || null);
                        if (data.activeQuestion?.allowModify !== undefined) {
                            setAllowModify(data.activeQuestion.allowModify);
                        }
                    } else {
                        // Initialize room doc
                        setDoc(roomDocRef, { roomCode, activeQuestion: null, createdAt: Date.now() }, { merge: true });
                    }
                });

                // Listen to responses
                const respColRef = collection(db, 'artifacts', appId, 'public', 'data', `omit_resp_${roomCode}`);
                const unsubResp = onSnapshot(respColRef, (snap) => {
                    const respMap = {};
                    snap.forEach(d => {
                        respMap[d.id] = d.data();
                    });
                    setResponses(respMap);
                });

                // Listen to online students roster
                const studentsColRef = collection(db, 'artifacts', appId, 'public', 'data', `omit_std_${roomCode}`);
                const unsubStudents = onSnapshot(studentsColRef, (snap) => {
                    const stdMap = {};
                    snap.forEach(d => {
                        stdMap[d.id] = d.data();
                    });
                    setStudents(stdMap);
                });

                return () => {
                    unsubRoom();
                    unsubResp();
                    unsubStudents();
                };
            }, [roomCode]);

            // Timer Interval Loop
            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(s => s - 1);
                    }, 1000);
                } else if (timerActive && timerSeconds === 0) {
                    setTimerActive(false);
                    playAlarmSound();
                    showToast('⏰ 時間到！', 'success');
                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            // Publish New Question
            const handlePublishQuestion = () => {
                const qId = 'q_' + Date.now();
                const newQ = {
                    id: qId,
                    mode: selectedMode,
                    prompt: questionPrompt.trim() || getDefaultPrompt(selectedMode),
                    startTime: Date.now(),
                    allowModify: allowModify,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : [],
                    bgImage: selectedMode === 'WHITEBOARD' ? bgImage : null,
                    pushUrl: selectedMode === 'LINK' ? pushUrl : null,
                };

                // Add to teacher history
                setQuestionHistory(prev => [...prev, newQ]);

                // Reset responses in Firestore
                const respColRef = collection(db, 'artifacts', appId, 'public', 'data', `omit_resp_${roomCode}`);
                getDocs(respColRef).then(snap => {
                    const batch = writeBatch(db);
                    snap.forEach(docSnap => batch.delete(docSnap.ref));
                    return batch.commit();
                }).then(() => {
                    // Update room state
                    setDoc(roomDocRef, { activeQuestion: newQ, spotlightResponse: null }, { merge: true });
                    showToast('已成功發佈題目給全體學生！', 'success');
                });
            };

            // Clear Current Question
            const handleClearQuestion = () => {
                setDoc(roomDocRef, { activeQuestion: null, spotlightResponse: null }, { merge: true });
                showToast('已結束當前題目', 'info');
            };

            // Toggle Allow Student Modify Response
            const handleToggleAllowModify = () => {
                const newStatus = !allowModify;
                setAllowModify(newStatus);
                if (activeQuestion) {
                    setDoc(roomDocRef, { 
                        activeQuestion: { ...activeQuestion, allowModify: newStatus } 
                    }, { merge: true });
                    showToast(newStatus ? '已開放學生修改回應' : '已鎖定，禁止學生修改回應', 'info');
                }
            };

            // Whiteboard Background Image Upload Handler
            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 2 * 1024 * 1024) {
                    showToast('圖片大小不能超過 2MB', 'error');
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    setBgImage(event.target.result);
                    showToast('白板背景圖片上傳成功！', 'success');
                };
                reader.readAsDataURL(file);
            };

            // Peer Evaluation Spotlight Trigger
            const handleSpotlight = (studentResp) => {
                const dataToSpotlight = {
                    studentId: studentResp.studentId,
                    seatNumber: studentResp.seatNumber,
                    studentName: studentResp.studentName,
                    answer: studentResp.answer,
                    mode: activeQuestion?.mode,
                    bgImage: activeQuestion?.bgImage
                };
                setDoc(roomDocRef, { spotlightResponse: dataToSpotlight }, { merge: true });
                showToast(`已將 【${studentResp.seatNumber}號 ${studentResp.studentName}】 的作品廣播給全班！`, 'success');
            };

            const handleClearSpotlight = () => {
                setDoc(roomDocRef, { spotlightResponse: null }, { merge: true });
                showToast('已解除廣播', 'info');
            };

            // Cleanup Room Data on Exit (Requirement 6)
            const handleExitRoom = async () => {
                if (confirm('確定要退出課室嗎？退出將自動清空所有暫存數據。')) {
                    try {
                        // Purge room responses
                        const respColRef = collection(db, 'artifacts', appId, 'public', 'data', `omit_resp_${roomCode}`);
                        const respSnap = await getDocs(respColRef);
                        const batch1 = writeBatch(db);
                        respSnap.forEach(d => batch1.delete(d.ref));
                        await batch1.commit();

                        // Purge student presence
                        const stdColRef = collection(db, 'artifacts', appId, 'public', 'data', `omit_std_${roomCode}`);
                        const stdSnap = await getDocs(stdColRef);
                        const batch2 = writeBatch(db);
                        stdSnap.forEach(d => batch2.delete(d.ref));
                        await batch2.commit();

                        // Delete room doc
                        await deleteDoc(roomDocRef);

                        showToast('已清空暫存數據並安全退出課室', 'success');
                    } catch (e) {
                        console.error("Cleanup error:", e);
                    }
                    onExit();
                }
            };

            // Random Student Picker Logic
            const handlePickStudent = () => {
                const min = parseInt(pickerFrom) || 1;
                const max = parseInt(pickerTo) || 36;
                let available = [];
                for (let i = min; i <= max; i++) {
                    if (!pickerNoRepeat || !drawnNumbers.includes(i)) {
                        available.push(i);
                    }
                }
                if (available.length === 0) {
                    showToast('該範圍內的所有學號已被抽取過！', 'error');
                    return;
                }

                setIsPicking(true);
                let count = 0;
                const interval = setInterval(() => {
                    const temp = available[Math.floor(Math.random() * available.length)];
                    setPickedResult({ seat: temp });
                    count++;
                    if (count > 20) {
                        clearInterval(interval);
                        const finalPicked = available[Math.floor(Math.random() * available.length)];
                        setPickedResult({ seat: finalPicked });
                        if (pickerNoRepeat) {
                            setDrawnNumbers(prev => [...prev, finalPicked]);
                        }
                        setIsPicking(false);
                    }
                }, 80);
            };

            // Export Learning Report to Spreadsheet (CSV)
            const handleExportReport = () => {
                if (questionHistory.length === 0) {
                    showToast('目前尚無發佈過任何題目記錄', 'error');
                    return;
                }

                let csvContent = "\uFEFF"; // UTF-8 BOM
                // Header row
                let headers = ["學號", "學生姓名"];
                questionHistory.forEach((q, idx) => {
                    headers.push(`第${idx+1}題 (${q.mode}: ${q.prompt.substring(0, 15)})`);
                });
                csvContent += headers.join(",") + "\n";

                // Generate 1-36 seats
                for (let seat = 1; seat <= 36; seat++) {
                    // Find if student was present
                    const stdObj = Object.values(students).find(s => parseInt(s.seatNumber) === seat);
                    const name = stdObj ? stdObj.studentName : '';
                    let row = [`"${seat}"`, `"${name}"`];

                    questionHistory.forEach(q => {
                        // Find response for this question and seat
                        const resp = Object.values(responses).find(r => parseInt(r.seatNumber) === seat);
                        if (resp) {
                            let ansText = typeof resp.answer === 'object' ? '[繪圖白板]' : String(resp.answer).replace(/"/g, '""');
                            row.push(`"${ansText}"`);
                        } else {
                            row.push(`"未回答"`);
                        }
                    });
                    csvContent += row.join(",") + "\n";
                }

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `OMIT_課堂學習報告_房號${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('已匯出試算表學習報告！', 'success');
            };

            // Computed Student Responses Array sorted by timestamp
            const responseList = useMemo(() => {
                return Object.values(responses).sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            }, [responses]);

            const onlineStudentList = useMemo(() => {
                return Object.values(students);
            }, [students]);

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col pb-12">
                    {/* Top Control Header */}
                    <header class="bg-slate-900 text-white shadow-xl sticky top-0 z-30">
                        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <span class="bg-indigo-600 text-white font-black text-xs px-2.5 py-1 rounded-lg">OMIT 教師台</span>
                                <h1 class="text-xl font-bold tracking-tight">房號：<span class="font-mono text-amber-400 text-2xl ml-1">{roomCode}</span></h1>
                            </div>

                            <div class="flex items-center space-x-2">
                                {/* Timer Tool Button */}
                                <button 
                                    onClick={() => setShowTimerModal(true)}
                                    class="bg-slate-800 hover:bg-slate-700 text-amber-300 px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-1.5 border border-slate-700 transition"
                                >
                                    <span>⏱️</span>
                                    <span>{timerActive ? formatTime(timerSeconds) : '計時器'}</span>
                                </button>

                                {/* Random Selector Button */}
                                <button 
                                    onClick={() => setShowPickerModal(true)}
                                    class="bg-slate-800 hover:bg-slate-700 text-emerald-300 px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-1.5 border border-slate-700 transition"
                                >
                                    <span>🎲</span>
                                    <span>抽選學生</span>
                                </button>

                                {/* QR Code & Online Counter (Requirement 1) */}
                                <button 
                                    onClick={() => setShowQRModal(true)}
                                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center space-x-2 shadow-md transition"
                                >
                                    <span>📱 QR Code</span>
                                    <span class="bg-indigo-900/80 text-emerald-300 px-2 py-0.5 rounded-full font-extrabold text-[11px] animate-pulse">
                                        🟢 在線 {onlineStudentList.length} 人
                                    </span>
                                </button>

                                {/* Export Report Button */}
                                <button 
                                    onClick={handleExportReport}
                                    class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-xl text-xs font-bold shadow-md transition"
                                >
                                    📊 匯出報告
                                </button>

                                {/* Exit Room */}
                                <button 
                                    onClick={handleExitRoom}
                                    class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-2 rounded-xl text-xs font-bold shadow-md transition"
                                >
                                    🚪 退出課室
                                </button>
                            </div>
                        </div>
                    </header>

                    <main class="max-w-7xl mx-auto px-4 mt-6 w-full flex-grow grid grid-cols-1 lg:grid-cols-12 gap-6">
                        {/* Left Column: 6 Major Function Selection & Question Publisher (5 cols) */}
                        <div class="lg:col-span-5 space-y-5">
                            {/* 6 Major Mode Buttons Grid (Requirement 7) */}
                            <div class="bg-white rounded-3xl p-5 shadow-lg border border-slate-200/80 space-y-4">
                                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">選擇互動模式 (六大功能)</h2>
                                <div class="grid grid-cols-2 gap-3">
                                    <ModeButton 
                                        icon="📊" title="選擇題" subtitle="A / B / C / D"
                                        active={selectedMode === 'CHOICE'}
                                        onClick={() => setSelectedMode('CHOICE')}
                                        color="indigo"
                                    />
                                    <ModeButton 
                                        icon="⭕" title="是非題" subtitle="✔️ 同意 / ❌ 反對"
                                        active={selectedMode === 'TF'}
                                        onClick={() => setSelectedMode('TF')}
                                        color="blue"
                                    />
                                    <ModeButton 
                                        icon="✍️" title="短答題" subtitle="文字速記回答"
                                        active={selectedMode === 'SHORT'}
                                        onClick={() => setSelectedMode('SHORT')}
                                        color="emerald"
                                    />
                                    <ModeButton 
                                        icon="🎨" title="白板題" subtitle="自訂底圖繪圖"
                                        active={selectedMode === 'WHITEBOARD'}
                                        onClick={() => setSelectedMode('WHITEBOARD')}
                                        color="purple"
                                    />
                                    <ModeButton 
                                        icon="⚡" title="搶答題" subtitle="即時反應競速"
                                        active={selectedMode === 'BUZZER'}
                                        onClick={() => setSelectedMode('BUZZER')}
                                        color="amber"
                                    />
                                    <ModeButton 
                                        icon="🔗" title="派送連結" subtitle="網址與 YouTube"
                                        active={selectedMode === 'LINK'}
                                        onClick={() => setSelectedMode('LINK')}
                                        color="rose"
                                    />
                                </div>

                                {/* Active Mode Parameters */}
                                <div class="pt-3 border-t border-slate-100 space-y-3">
                                    <div>
                                        <label class="block text-xs font-bold text-slate-600 mb-1">題目 / 提示文字</label>
                                        <textarea 
                                            rows={2}
                                            placeholder={getPlaceholder(selectedMode)}
                                            value={questionPrompt}
                                            onChange={(e) => setQuestionPrompt(e.target.value)}
                                            class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                        />
                                    </div>

                                    {/* Choice Count selector for MCQ */}
                                    {selectedMode === 'CHOICE' && (
                                        <div class="flex items-center justify-between text-xs font-bold text-slate-600 bg-slate-50 p-2.5 rounded-xl">
                                            <span>選項數量：</span>
                                            <div class="flex space-x-2">
                                                <button 
                                                    onClick={() => setChoiceCount(4)}
                                                    class={`px-3 py-1 rounded-lg ${choiceCount === 4 ? 'bg-indigo-600 text-white' : 'bg-white text-slate-700'}`}
                                                >
                                                    4項 (A-D)
                                                </button>
                                                <button 
                                                    onClick={() => setChoiceCount(5)}
                                                    class={`px-3 py-1 rounded-lg ${choiceCount === 5 ? 'bg-indigo-600 text-white' : 'bg-white text-slate-700'}`}
                                                >
                                                    5項 (A-E)
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {/* Custom Background Image Upload for Whiteboard (Requirement 2) */}
                                    {selectedMode === 'WHITEBOARD' && (
                                        <div class="bg-purple-50/80 p-3 rounded-2xl border border-purple-100 space-y-2">
                                            <label class="block text-xs font-bold text-purple-800">上傳白板背景圖 (選擇性)：</label>
                                            <input 
                                                type="file" 
                                                accept="image/*"
                                                onChange={handleImageUpload}
                                                class="text-xs text-slate-600 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-purple-600 file:text-white hover:file:bg-purple-700"
                                            />
                                            {bgImage && (
                                                <div class="relative w-full h-24 bg-slate-200 rounded-xl overflow-hidden mt-1 border border-purple-200">
                                                    <img src={bgImage} class="w-full h-full object-contain" />
                                                    <button 
                                                        onClick={() => setBgImage(null)}
                                                        class="absolute top-1 right-1 bg-rose-600 text-white rounded-full p-1 text-xs"
                                                    >
                                                        ✕
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* Push Link Input (Requirement 10) */}
                                    {selectedMode === 'LINK' && (
                                        <div>
                                            <label class="block text-xs font-bold text-slate-600 mb-1">網頁 / YouTube 連結：</label>
                                            <input 
                                                type="url"
                                                placeholder="https://www.youtube.com/watch?v=..."
                                                value={pushUrl}
                                                onChange={(e) => setPushUrl(e.target.value)}
                                                class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none font-mono"
                                            />
                                        </div>
                                    )}

                                    <button 
                                        onClick={handlePublishQuestion}
                                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-3 rounded-xl shadow-lg shadow-indigo-200 transition active:scale-98 flex items-center justify-center space-x-2 text-base"
                                    >
                                        <span>🚀 發佈題目給學生</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Right Column: Active Question Live Results & Student Submissions (7 cols) */}
                        <div class="lg:col-span-7 space-y-5">
                            {/* Live Status Toolbar */}
                            <div class="bg-white rounded-3xl p-5 shadow-lg border border-slate-200/80 space-y-4">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center space-x-2">
                                        <span class="w-3 h-3 rounded-full bg-emerald-500 animate-ping"></span>
                                        <h2 class="font-bold text-slate-800 text-lg">即時課堂動態</h2>
                                    </div>
                                    
                                    {activeQuestion && (
                                        <div class="flex items-center space-x-2">
                                            {/* Allow Modify Toggle (Requirement 4) */}
                                            <button 
                                                onClick={handleToggleAllowModify}
                                                class={`px-3 py-1.5 rounded-xl text-xs font-bold border transition ${
                                                    allowModify 
                                                        ? 'bg-emerald-100 text-emerald-800 border-emerald-300' 
                                                        : 'bg-amber-100 text-amber-800 border-amber-300'
                                                }`}
                                            >
                                                {allowModify ? '🔓 已開放修改' : '🔒 鎖定回應 (禁止修改)'}
                                            </button>

                                            {/* Speed Leaderboard Toggle (Requirement 5) */}
                                            <button 
                                                onClick={() => setShowLeaderboard(!showLeaderboard)}
                                                class="px-3 py-1.5 rounded-xl text-xs font-bold bg-amber-500 hover:bg-amber-600 text-white shadow-sm"
                                            >
                                                🏆 龍虎榜 ({responseList.length})
                                            </button>

                                            {/* Clear Question */}
                                            <button 
                                                onClick={handleClearQuestion}
                                                class="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-200 hover:bg-slate-300 text-slate-700"
                                            >
                                                結束當前題
                                            </button>
                                        </div>
                                    )}
                                </div>

                                {activeQuestion ? (
                                    <div class="bg-indigo-50/60 rounded-2xl p-4 border border-indigo-100 space-y-3">
                                        <div class="flex items-center justify-between text-xs font-bold text-indigo-700">
                                            <span>模式：{getModeLabel(activeQuestion.mode)}</span>
                                            <span>已收作答：{responseList.length} 份</span>
                                        </div>
                                        <p class="text-base font-bold text-slate-800">{activeQuestion.prompt}</p>

                                        {/* Bar Chart View for MCQ with Option Details (Requirement 8) */}
                                        {activeQuestion.mode === 'CHOICE' && (
                                            <McqBarChart 
                                                options={activeQuestion.choiceOptions} 
                                                responses={responseList} 
                                                onSelectOption={(opt) => setSelectedMcqFilter(opt)}
                                            />
                                        )}

                                        {/* Buzzer Leaderboard Direct Display (Requirement 9) */}
                                        {activeQuestion.mode === 'BUZZER' && (
                                            <BuzzerLeaderboard responses={responseList} />
                                        )}
                                    </div>
                                ) : (
                                    <div class="text-center py-10 bg-slate-50 rounded-2xl border border-dashed border-slate-300">
                                        <p class="text-slate-400 font-bold text-sm">尚未發佈題目，請在左側選擇模式並點擊發佈</p>
                                    </div>
                                )}
                            </div>

                            {/* Student Submissions Grid (Whiteboard thumbnails, short answers, T/F) */}
                            {activeQuestion && activeQuestion.mode !== 'BUZZER' && (
                                <div class="bg-white rounded-3xl p-5 shadow-lg border border-slate-200/80 space-y-4">
                                    <div class="flex items-center justify-between">
                                        <h3 class="font-bold text-slate-800 text-sm">學生回答一覽 (點擊可放大及互評)</h3>
                                        <span class="text-xs text-slate-400">總在線：{onlineStudentList.length} 人</span>
                                    </div>

                                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                        {responseList.map((resp) => (
                                            <div 
                                                key={resp.studentId}
                                                onClick={() => setZoomedStudentId(resp.studentId)}
                                                class="bg-slate-50 rounded-2xl p-3 border border-slate-200 hover:border-indigo-500 cursor-pointer transition shadow-sm hover:shadow-md relative group"
                                            >
                                                <div class="flex items-center justify-between text-xs mb-1.5">
                                                    <span class="font-black bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded-lg">
                                                        {resp.seatNumber}號
                                                    </span>
                                                    <span class="font-bold text-slate-600 truncate max-w-[80px]">
                                                        {resp.studentName}
                                                    </span>
                                                </div>

                                                {/* Card Content based on Mode */}
                                                {activeQuestion.mode === 'WHITEBOARD' ? (
                                                    <div class="relative w-full h-28 bg-white rounded-xl overflow-hidden border border-slate-200">
                                                        {activeQuestion.bgImage && (
                                                            <img src={activeQuestion.bgImage} class="absolute inset-0 w-full h-full object-contain opacity-40 pointer-events-none" />
                                                        )}
                                                        <img src={resp.answer} class="relative w-full h-full object-contain z-10" />
                                                    </div>
                                                ) : activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF' ? (
                                                    <div class="text-center py-4 text-2xl font-black text-indigo-600 bg-white rounded-xl border border-slate-200">
                                                        {resp.answer}
                                                    </div>
                                                ) : (
                                                    <div class="p-2 bg-white rounded-xl border border-slate-200 text-xs text-slate-800 line-clamp-3 min-h-[60px] font-medium">
                                                        {resp.answer}
                                                    </div>
                                                )}

                                                <div class="mt-1 flex justify-end">
                                                    <span class="text-[10px] text-slate-400">⏱️ {resp.duration}s</span>
                                                </div>
                                            </div>
                                        ))}

                                        {responseList.length === 0 && (
                                            <div class="col-span-full text-center py-8 text-xs text-slate-400 font-medium">
                                                等待學生提交回答中...
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* QR Code & Roster Modal (Requirement 1) */}
                    {showQRModal && (
                        <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-lg w-full shadow-2xl space-y-5 animate-scaleUp">
                                <div class="flex items-center justify-between border-b pb-3">
                                    <div>
                                        <h3 class="text-xl font-bold text-slate-800">課堂加入 QR Code</h3>
                                        <p class="text-xs text-slate-500">學生掃描即可直接免密碼進入課室</p>
                                    </div>
                                    <button onClick={() => setShowQRModal(false)} class="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
                                </div>

                                <div class="flex flex-col sm:flex-row items-center justify-center gap-6">
                                    <div class="p-3 bg-white border border-slate-200 rounded-2xl shadow-inner">
                                        <img src={qrImageUrl} class="w-48 h-48 rounded-lg" />
                                    </div>
                                    <div class="space-y-3 text-center sm:text-left">
                                        <div class="bg-indigo-50 p-3 rounded-2xl border border-indigo-100">
                                            <span class="text-xs font-bold text-indigo-600 block">課堂房號</span>
                                            <span class="text-3xl font-black text-indigo-900 font-mono tracking-widest">{roomCode}</span>
                                        </div>

                                        {/* Online Counter Button triggering Roster Modal */}
                                        <button 
                                            onClick={() => { setShowQRModal(false); setShowRosterModal(true); }}
                                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl font-bold text-xs shadow-md transition flex items-center justify-center space-x-2"
                                        >
                                            <span>🟢 在線學生人數：{onlineStudentList.length} 人</span>
                                            <span class="underline">查看名單</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Online Student Roster Modal (Requirement 1) */}
                    {showRosterModal && (
                        <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4 max-h-[80vh] flex flex-col">
                                <div class="flex items-center justify-between border-b pb-3">
                                    <h3 class="text-lg font-bold text-slate-800">已加入學生名單 (共 {onlineStudentList.length} 人)</h3>
                                    <button onClick={() => setShowRosterModal(false)} class="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
                                </div>

                                <div class="overflow-y-auto flex-1 space-y-2 pr-1">
                                    {onlineStudentList.map((std) => (
                                        <div key={std.studentId} class="p-3 bg-slate-50 rounded-2xl border border-slate-200 flex items-center justify-between text-sm">
                                            <div class="flex items-center space-x-3">
                                                <span class="w-8 h-8 rounded-xl bg-indigo-600 text-white font-black flex items-center justify-center text-xs">
                                                    {std.seatNumber}號
                                                </span>
                                                <span class="font-bold text-slate-800">{std.studentName}</span>
                                            </div>
                                            <span class="text-xs text-slate-400 font-mono">
                                                {std.joinTime ? new Date(std.joinTime).toLocaleTimeString() : '在線'}
                                            </span>
                                        </div>
                                    ))}
                                    {onlineStudentList.length === 0 && (
                                        <p class="text-center py-6 text-xs text-slate-400 font-medium">尚無學生加入</p>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Option Details Inspection Modal for MCQ (Requirement 8) */}
                    {selectedMcqFilter && (
                        <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4">
                                <div class="flex items-center justify-between border-b pb-3">
                                    <h3 class="text-lg font-bold text-slate-800">選擇選項 【{selectedMcqFilter}】 的學生名單</h3>
                                    <button onClick={() => setSelectedMcqFilter(null)} class="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
                                </div>

                                <div class="max-h-60 overflow-y-auto space-y-2">
                                    {responseList.filter(r => r.answer === selectedMcqFilter).map(r => (
                                        <div key={r.studentId} class="p-3 bg-indigo-50/70 rounded-xl border border-indigo-100 flex items-center justify-between text-sm">
                                            <span class="font-black text-indigo-800">{r.seatNumber}號 {r.studentName}</span>
                                            <span class="text-xs text-slate-400">用時：{r.duration}s</span>
                                        </div>
                                    ))}
                                    {responseList.filter(r => r.answer === selectedMcqFilter).length === 0 && (
                                        <p class="text-center py-4 text-xs text-slate-400">無學生選擇此選項</p>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Enlarged Zoom Student Answer Modal with Next/Prev & Peer Evaluation Spotlight (Requirement 3) */}
                    {zoomedStudentId && (
                        <StudentZoomModal 
                            studentId={zoomedStudentId}
                            responses={responseList}
                            activeQuestion={activeQuestion}
                            onClose={() => setZoomedStudentId(null)}
                            onChangeStudent={(newId) => setZoomedStudentId(newId)}
                            onSpotlight={handleSpotlight}
                            onClearSpotlight={handleClearSpotlight}
                            isSpotlighted={spotlightResponse?.studentId === zoomedStudentId}
                        />
                    )}

                    {/* Answer Speed Leaderboard Modal (Requirement 5) */}
                    {showLeaderboard && (
                        <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4">
                                <div class="flex items-center justify-between border-b pb-3">
                                    <h3 class="text-lg font-bold text-slate-800">🏆 答題競速龍虎榜</h3>
                                    <button onClick={() => setShowLeaderboard(false)} class="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
                                </div>

                                <div class="max-h-72 overflow-y-auto space-y-2">
                                    {responseList.map((r, idx) => (
                                        <div key={r.studentId} class={`p-3 rounded-2xl border flex items-center justify-between text-sm ${
                                            idx === 0 ? 'bg-amber-50 border-amber-300 font-extrabold' :
                                            idx === 1 ? 'bg-slate-100 border-slate-300 font-bold' :
                                            idx === 2 ? 'bg-amber-900/10 border-amber-200 font-bold' : 'bg-white border-slate-200'
                                        }`}>
                                            <div class="flex items-center space-x-3">
                                                <span class={`w-7 h-7 rounded-full flex items-center justify-center text-xs ${
                                                    idx === 0 ? 'bg-amber-500 text-white' : 'bg-slate-300 text-slate-700'
                                                }`}>

        function WhiteboardCanvas({ bgImage, onSubmit }) {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [color, setColor] = useState('#ffffff'); // Default white
            const [strokeWidth, setStrokeWidth] = useState(4);
            const [isEraser, setIsEraser] = useState(false);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            }, []);

            const startDrawing = (e) => {
                setIsDrawing(true);
                draw(e);
            };

            const stopDrawing = () => {
                setIsDrawing(false);
                const canvas = canvasRef.current;
                if (canvas) {
                    const ctx = canvas.getContext('2d');
                    ctx.beginPath();
                }
            };

            const draw = (e) => {
                if (!isDrawing) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const x = (clientX - rect.left) * (canvas.width / rect.width);
                const y = (clientY - rect.top) * (canvas.height / rect.height);

                ctx.lineWidth = strokeWidth;
                if (isEraser) {
                    ctx.globalCompositeOperation = 'destination-out';
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = color;
                }

                ctx.lineTo(x, y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            const handleClear = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            const handleFormSubmit = () => {
                const canvas = canvasRef.current;
                const dataUrl = canvas.toDataURL('image/png');
                onSubmit(dataUrl);
            };

            return (
                <div class="space-y-3">
                    {/* Drawing Toolbar (Requirement 2) */}
                    <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-900 p-2.5 rounded-2xl border border-slate-700 text-xs">
                        {/* Colors */}
                        <div class="flex items-center space-x-1.5">
                            {['#ffffff', '#f87171', '#60a5fa', '#4ade80', '#facc15', '#000000'].map(c => (
                                <button 
                                    key={c}
                                    onClick={() => { setColor(c); setIsEraser(false); }}
                                    style={{ backgroundColor: c }}
                                    class={`w-6 h-6 rounded-full border-2 ${color === c && !isEraser ? 'border-indigo-400 scale-110' : 'border-transparent'}`}
                                />
                            ))}
                        </div>

                        {/* Stroke Width */}
                        <div class="flex items-center space-x-2">
                            <span class="text-slate-400 text-[10px]">粗細:</span>
                            <input 
                                type="range" 
                                min="2" 
                                max="20" 
                                value={strokeWidth}
                                onChange={(e) => setStrokeWidth(e.target.value)}
                                class="w-16 accent-indigo-500"
                            />
                        </div>

                        {/* Eraser & Clear */}
                        <div class="flex items-center space-x-2">
                            <button 
                                onClick={() => setIsEraser(!isEraser)}
                                class={`px-2.5 py-1 rounded-xl font-bold ${isEraser ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'}`}
                            >
                                🧹 擦膠
                            </button>
                            <button 
                                onClick={handleClear}
                                class="px-2.5 py-1 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-bold"
                            >
                                清除
                            </button>
                        </div>
                    </div>

                    {/* Canvas Container */}
                    <div class="relative w-full h-80 bg-slate-950 rounded-2xl overflow-hidden border border-slate-700 canvas-container">
                        {bgImage && (
                            <img src={bgImage} class="absolute inset-0 w-full h-full object-contain opacity-50 pointer-events-none" />
                        )}
                        <canvas 
                            ref={canvasRef}
                            width={600}
                            height={400}
                            onMouseDown={startDrawing}
                            onMouseUp={stopDrawing}
                            onMouseMove={draw}
                            onTouchStart={startDrawing}
                            onTouchEnd={stopDrawing}
                            onTouchMove={draw}
                            class="relative z-10 w-full h-full cursor-crosshair"
                        />
                    </div>

                    <button 
                        onClick={handleFormSubmit}
                        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold py-3.5 rounded-2xl shadow-lg transition"
                    >
                        確認提交白板作品 🎨
                    </button>
                </div>
            );
        }

        
        // Enlarged Student Answer Modal with Next / Prev buttons (Requirement 3)
        function StudentZoomModal({ studentId, responses, activeQuestion, onClose, onChangeStudent, onSpotlight, onClearSpotlight, isSpotlighted }) {

            const handlePrev = () => {

                if (currentIndex < responses.length - 1) onChangeStudent(responses[currentIndex + 1].studentId);
            };

            return (
                <div class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl p-6 max-w-2xl w-full shadow-2xl space-y-4 relative">
                        {/* Header */}

                                <span class="bg-indigo-600 text-white font-black px-3 py-1 rounded-xl text-sm">
                                    {currentResp.seatNumber}號
                                </span>
                                <h3 class="text-xl font-bold text-slate-800">{currentResp.studentName}</h3>
                                <span class="text-xs text-slate-400">用時: {currentResp.duration}s</span>
                            </div>
                            <button onClick={onClose} class="text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
                        </div>

                        {/* Content Area */}
                        <div class="py-2">
                            {activeQuestion?.mode === 'WHITEBOARD' ? (
                                <div class="relative w-full h-96 bg-slate-100 rounded-2xl overflow-hidden border">
                                    {activeQuestion.bgImage && (
                                        <img src={activeQuestion.bgImage} class="absolute inset-0 w-full h-full object-contain opacity-40 pointer-events-none" />
                                    )}
                                    <img src={currentResp.answer} class="relative w-full h-full object-contain z-10" />
                                </div>
                            ) : (
                                <div class="p-8 bg-slate-50 rounded-2xl text-center text-3xl font-black text-indigo-900 border">
                                    {currentResp.answer}
                                </div>
                            )}
                        </div>

                        {/* Footer Controls */}
                        <div class="flex items-center justify-between pt-2 border-t">
                            <button 
                                onClick={handlePrev}
                                disabled={currentIndex === 0}
                                class="px-4 py-2 bg-slate-100 hover:bg-slate-200 disabled:opacity-30 rounded-xl font-bold text-xs"
                            >
                                ◄ 上一位學生
                            </button>

                            {/* Peer Evaluation Broadcast Trigger (Requirement 3) */}
                            {isSpotlighted ? (
                                <button 
                                    onClick={onClearSpotlight}
                                    class="px-5 py-2.5 bg-rose-600 text-white rounded-xl font-extrabold text-xs shadow-md"
                                >
                                    解除全班廣播
                                </button>
                            ) : (
                                <button 
                                    onClick={() => onSpotlight(currentResp)}
                                    class="px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-extrabold text-xs shadow-md flex items-center space-x-1"
                                >
                                    <span>📢 傳送此回應至全體頁面 (學生互評)</span>
                                </button>
                            )}

                            <button 
                                onClick={handleNext}
                                disabled={currentIndex === responses.length - 1}
                                class="px-4 py-2 bg-slate-100 hover:bg-slate-200 disabled:opacity-30 rounded-xl font-bold text-xs"
                            >
                                下一位學生 ►
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // MCQ Bar Chart Component (Requirement 8)
        function McqBarChart({ options, responses, onSelectOption }) {
            const total = responses.length;
            const counts = {};
            options.forEach(opt => counts[opt] = 0);
            responses.forEach(r => {
                if (counts[r.answer] !== undefined) counts[r.answer]++;
            });

            return (
                <div class="space-y-2 pt-2">
                    <span class="text-xs text-slate-400 font-bold block">點選長條圖可查閱選擇該答案的學生名單：</span>
                    <div class="space-y-1.5">
                        {options.map(opt => {
                            const count = counts[opt] || 0;
                            const pct = total > 0 ? Math.round((count / total) * 100) : 0;
                            return (
                                <div 
                                    key={opt}
                                    onClick={() => onSelectOption(opt)}
                                    class="flex items-center space-x-3 cursor-pointer group"
                                >
                                    <span class="font-black text-slate-700 w-5">{opt}</span>
                                    <div class="flex-1 bg-slate-200 h-7 rounded-xl overflow-hidden relative">
                                        <div 
                                            style={{ width: `${pct}%` }} 
                                            class="bg-indigo-600 h-full group-hover:bg-indigo-500 transition-all duration-500 rounded-xl"
                                        />
                                        <span class="absolute inset-y-0 left-3 flex items-center text-xs font-bold text-slate-800">
                                            {count} 人 ({pct}%)
                                        </span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // Buzzer Leaderboard Component (Requirement 9)
        function BuzzerLeaderboard({ responses }) {
            return (
                <div class="space-y-2 pt-2">
                    <h4 class="text-xs font-bold text-slate-600">⚡ 搶答排名順序：</h4>
                    <div class="space-y-1.5 max-h-48 overflow-y-auto">
                        {responses.map((r, idx) => (
                            <div 
                                key={r.studentId}
                                class={`p-2.5 rounded-xl border flex items-center justify-between text-xs ${
                                    idx === 0 ? 'bg-amber-100 border-amber-300 font-black text-amber-900' : 'bg-white border-slate-200'
                                }`}
                            >
                                <div class="flex items-center space-x-2">
                                    <span class="w-5 h-5 rounded-full bg-amber-500 text-white flex items-center justify-center font-bold text-[10px]">
                                        {idx + 1}
                                    </span>
                                    <span>{r.seatNumber}號 {r.studentName}</span>
                                </div>
                                <span class="font-mono text-indigo-600 font-bold">+{r.duration}s</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // Mode Selector Card Helper
        function ModeButton({ icon, title, subtitle, active, onClick, color }) {
            return (
                <button 
                    onClick={onClick}
                    class={`p-3.5 rounded-2xl text-left border-2 transition active:scale-95 flex flex-col justify-between ${
                        active 
                            ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' 
                            : 'bg-slate-50 hover:bg-slate-100 text-slate-800 border-slate-200'
                    }`}
                >
                    <div class="text-xl mb-1">{icon}</div>
                    <div>
                        <div class="font-extrabold text-sm">{title}</div>
                        <div class={`text-[10px] ${active ? 'text-indigo-200' : 'text-slate-400'}`}>{subtitle}</div>
                    </div>
                </button>
            );
        }

        // Helper functions
        function getDefaultPrompt(mode) {
            switch(mode) {
                case 'CHOICE': return '請選擇正確的答案選項：';
                case 'TF': return '請問你是否同意以下觀點？';
                case 'SHORT': return '請簡短回答以下問題：';
                case 'WHITEBOARD': return '請在白板上進行標註、解題或繪圖：';
                case 'BUZZER': return '準備... 搶答開始！';
                case 'LINK': return '請觀看以下派送內容：';
                default: return '請回答問題：';
            }
        }

        function getPlaceholder(mode) {
            switch(mode) {
                case 'LINK': return '例如：請觀看 YouTube 影片並回答問題';
                default: return '請輸入題目問題描述（選擇性）...';
            }
        }

        function getModeLabel(mode) {
            switch(mode) {
                case 'CHOICE': return '選擇題';
                case 'TF': return '是非題';
                case 'SHORT': return '短答題';
                case 'WHITEBOARD': return '白板題';
                case 'BUZZER': return '搶答題';
                case 'LINK': return '派送連結';
                default: return '互動題';
            }
        }

        function formatTime(totalSec) {
            const m = Math.floor(totalSec / 60);
            const s = totalSec % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function isYouTubeUrl(url) {
            return url.includes('youtube.com') || url.includes('youtu.be');
        }

        function getYouTubeEmbedUrl(url) {
            try {
                let videoId = '';
                if (url.includes('youtu.be/')) {
                    videoId = url.split('youtu.be/')[1].split('?')[0];
                } else if (url.includes('youtube.com/watch')) {
                    const u = new URL(url);
                    videoId = u.searchParams.get('v');
                } else if (url.includes('youtube.com/embed/')) {
                    videoId = url.split('youtube.com/embed/')[1].split('?')[0];
                }
                return `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            } catch (e) {
                return url;
            }
        }

        // Mount App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
