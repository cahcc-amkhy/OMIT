                                </button>

                                <h3 class="text-2xl font-black text-amber-900 flex items-center justify-center gap-2">
                                    <span>⏱️ 計時器工具</span>
                                </h3>

                                <div class="py-6 bg-slate-900 text-amber-400 font-mono font-black text-5xl md:text-6xl rounded-3xl shadow-inner tracking-widest border-4 border-amber-500">
                                    {Math.floor(timerSeconds / 60).toString().padStart(2, '0')}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                </div>

                                <div class="grid grid-cols-3 gap-2">
                                    {[
                                        { label: '30 秒', sec: 30 },
                                        { label: '1 分鐘', sec: 60 },
                                        { label: '2 分鐘', sec: 120 },
                                        { label: '3 分鐘', sec: 180 },
                                        { label: '4 分鐘', sec: 240 },
                                        { label: '5 分鐘', sec: 300 }
                                    ].map((btn) => (
                                        <button 
                                            key={btn.sec}
                                            onClick={() => {
                                                setTimerSeconds(btn.sec);
                                                setTimerActive(true);
                                            }}
                                            class="py-2.5 bg-amber-50 hover:bg-amber-100 text-amber-900 font-bold rounded-xl border border-amber-200 text-xs transition"
                                        >
                                            {btn.label}
                                        </button>
                                    ))}
                                </div>

                                <div class="flex items-center justify-center space-x-2 bg-slate-50 p-3 rounded-xl border">
                                    <span class="text-xs font-bold text-slate-600">手動輸入「00:00」:</span>
                                    <input 
                                        type="number" 
                                        value={customMinInput}
                                        onChange={(e) => setCustomMinInput(e.target.value)}
                                        class="w-12 px-2 py-1 border rounded font-mono font-bold text-center"
                                        placeholder="分"
                                    />
                                    <span class="font-bold font-mono">:</span>
                                    <input 
                                        type="number" 
                                        value={customSecInput}
                                        onChange={(e) => setCustomSecInput(e.target.value)}
                                        class="w-12 px-2 py-1 border rounded font-mono font-bold text-center"
                                        placeholder="秒"
                                    />
                                    <button 
                                        onClick={handleApplyCustomTimer}
                                        class="px-3 py-1 bg-amber-600 text-white font-bold rounded-lg text-xs"
                                    >
                                        開始
                                    </button>
                                </div>

                                <div class="flex space-x-2">
                                    <button 
                                        onClick={() => setTimerActive(!timerActive)}
                                        class={`flex-1 font-black py-3 rounded-xl text-white shadow transition ${timerActive ? 'bg-rose-500 hover:bg-rose-600' : 'bg-emerald-600 hover:bg-emerald-700'}`}
                                    >
                                        {timerActive ? '⏸️ 暫停' : '▶️ 繼續/開始'}
                                    </button>
                                    <button 
                                        onClick={() => {
                                            setTimerSeconds(0);
                                            setTimerActive(false);
                                        }}
                                        class="px-4 py-3 bg-slate-100 hover:bg-slate-200 font-bold text-slate-700 rounded-xl text-xs"
                                    >
                                        重置
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal 4: Item 21 & 32 Teacher Demo Whiteboard Fullscreen Modal */}
                    {showDemoWhiteboardModal && (
                        <div class="fixed inset-0 bg-slate-900/90 z-50 flex flex-col p-4 md:p-6 space-y-4">
                            <div class="flex items-center justify-between text-white border-b border-slate-700 pb-3">
                                <h3 class="text-xl font-black flex items-center gap-2">
                                    <span>🎨 教師即時示範白板</span>
                                </h3>
                                <span class="text-xs bg-purple-600 px-3 py-1 rounded-full font-bold">1280x720 標準分辨率 (零偏移)</span>
                            </div>

                            <div class="flex-1 bg-white rounded-3xl overflow-hidden shadow-2xl">
                                <WhiteboardCanvas 
                                    onSave={(data) => setDemoCanvasData(data)}
                                    strokeWidth={demoStrokeWidth}
                                    setStrokeWidth={setDemoStrokeWidth}
                                    isEraser={demoIsEraser}
                                    setIsEraser={setDemoIsEraser}
                                    onClear={() => setDemoCanvasData(null)}
                                />
                            </div>

                            {/* Item 21 & 32: Whiteboard control buttons at the bottom */}
                            <div class="flex items-center justify-between gap-4 pt-2 border-t border-slate-800">
                                <button 
                                    onClick={() => setShowDemoWhiteboardModal(false)}
                                    class="px-6 py-3.5 bg-slate-700 hover:bg-slate-800 text-white font-bold rounded-2xl transition text-sm"
                                >
                                    關閉白板
                                </button>

                                <button 
                                    onClick={toggleDemoBroadcast}
                                    class={`flex-1 max-w-md py-3.5 rounded-2xl font-black text-white text-base shadow-lg transition flex items-center justify-center space-x-2 ${
                                        isDemoBroadcasting 
                                        ? 'bg-emerald-500 hover:bg-emerald-600 ring-4 ring-emerald-300 animate-pulse' 
                                        : 'bg-indigo-600 hover:bg-indigo-700'
                                    }`}
                                >
                                    <span>{isDemoBroadcasting ? '📡 廣播中 (按此收回廣播)' : '📡 廣播分享至全班學生螢幕'}</span>
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Modal 5: Item 7, 2, 26, 29 Inspect Individual Student Answer */}
                    {showInspectModal && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-2xl w-full space-y-4 shadow-2xl relative">
                                <button 
                                    onClick={() => setShowInspectModal(null)}
                                    class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl"
                                >
                                    ✕
                                </button>

                                <div class="border-b pb-3 flex justify-between items-center">
                                    <div>
                                        <h3 class="text-xl font-black text-slate-800">
                                            {showInspectModal.seatNumber}號 {showInspectModal.name} 的詳細作答
                                        </h3>
                                        <p class="text-xs text-slate-500 font-bold">答題用時: {showInspectModal.duration} 秒</p>
                                    </div>

                                    {(activeQuestion?.mode === 'DRAW' || activeQuestion?.mode === 'SHORT') && (
                                        <button 
                                            onClick={() => handleBroadcastStudentWork(showInspectModal)}
                                            class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow"
                                        >
                                            📡 廣播至全班互評
                                        </button>
                                    )}
                                </div>

                                <div class="max-h-96 overflow-y-auto space-y-3">
                                    {activeQuestion?.mode === 'DRAW' ? (
                                        <img src={showInspectModal.answer} class="w-full rounded-2xl border" alt="白板作答" />
                                    ) : activeQuestion?.mode === 'AUDIO' ? (
                                        <audio src={showInspectModal.answer} controls class="w-full" />
                                    ) : activeQuestion?.mode === 'CHALLENGE' && showInspectModal.scoreDetails ? (
                                        <div class="space-y-3">
                                            <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-200 flex justify-between items-center">
                                                <span class="font-black text-emerald-900">總分數:</span>
                                                <span class="text-2xl font-black text-emerald-600">
                                                    {showInspectModal.scoreDetails.totalScore} / {activeQuestion.challenge.totalScore}分 ({showInspectModal.scoreDetails.percentage}%)
                                                </span>
                                            </div>

                                            {showInspectModal.scoreDetails.questionBreakdown?.map((item, idx) => (
                                                <div key={idx} class={`p-3.5 rounded-xl border text-xs font-bold space-y-1 ${item.isCorrect ? 'bg-emerald-50 border-emerald-300' : 'bg-rose-50 border-rose-300'}`}>
                                                    <div class="flex justify-between">
                                                        <span>第 {idx + 1} 題：{item.qText}</span>
                                                        <span class={item.isCorrect ? 'text-emerald-700' : 'text-rose-700'}>
                                                            {item.isCorrect ? '✅ 答對' : '❌ 答錯'}
                                                        </span>
                                                    </div>
                                                    <div>學生選擇: <span class={item.isCorrect ? 'text-emerald-700' : 'text-rose-700 font-black'}>{item.userAns}</span></div>
                                                    {!item.isCorrect && (
                                                        <div class="text-emerald-700">正確答案: <span class="font-black">{item.correctAns}</span></div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div class="p-4 bg-slate-50 rounded-2xl border text-slate-800 font-medium whitespace-pre-wrap">
                                            {showInspectModal.answer}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
            const [myAnswer, setMyAnswer] = useState('');
            const [audioBlobUrl, setAudioBlobUrl] = useState(null);
            const [isRecording, setIsRecording] = useState(false);
            const [mediaRecorder, setMediaRecorder] = useState(null);
            const [submitted, setSubmitted] = useState(false);
            const [drawStrokeWidth, setDrawStrokeWidth] = useState(4);
            const [drawIsEraser, setDrawIsEraser] = useState(false);
            const [whiteboardCanvasData, setWhiteboardCanvasData] = useState(null);

            // Item 13 & 15: Challenge timer & Auto submit
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [challengeTimeLeft, setChallengeTimeLeft] = useState(null);

            // Item 22.3.4: Team Competition Student Local State
            const [teamCurrentQIdx, setTeamCurrentQIdx] = useState(0);

            const startTimeRef = useRef(Date.now());

            useEffect(() => {
                startTimeRef.current = Date.now();
                setSubmitted(false);
                setMyAnswer('');
                setAudioBlobUrl(null);
                setChallengeAnswers({});

                if (activeQuestion?.challenge?.enableTimer && activeQuestion.challenge.timeLimit) {
                    setChallengeTimeLeft(activeQuestion.challenge.timeLimit);
                }
            }, [activeQuestion?.id]);

            // Item 13: Challenge Auto-submit when time reaches 00:00
            useEffect(() => {
                let interval = null;
                if (activeQuestion?.mode === 'CHALLENGE' && challengeTimeLeft !== null && challengeTimeLeft > 0 && !submitted) {
                    interval = setInterval(() => {
                        setChallengeTimeLeft(t => {
                            if (t <= 1) {
                                handleSubmitChallengeAnswers(true);
                                return 0;
                            }
                            return t - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [challengeTimeLeft, submitted, activeQuestion]);

            const submitResponseToFirestore = async (ansVal, scoreObj = null) => {
                if (!activeQuestion) return;
                const duration = Math.max(1, Math.round((Date.now() - startTimeRef.current) / 1000));
                
                const appId = "omit-8c173";
                const db = window.fbDb;
                const resKey = `${activeQuestion.id}_${studentId}`;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', resKey);

                const payload = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: ansVal,
                    duration: duration,
                    submittedAt: Date.now(),
                    scoreDetails: scoreObj
                };

                await window.fbUtils.setDoc(resDocRef, payload);
                setSubmitted(true);
                playSound('win');
            };

            // Item 19 & 15: Challenge submission calculation
            const handleSubmitChallengeAnswers = (isAuto = false) => {
                if (submitted) return;
                const questions = activeQuestion?.challenge?.questions || [];
                let correctCount = 0;
                const totalQs = questions.length;

                const breakdown = questions.map((q) => {
                    const uAns = challengeAnswers[q.num] || '未作答';
                    const isCorr = uAns === q.answer;
                    if (isCorr) correctCount++;
                    return {
                        qText: q.text,
                        userAns: uAns,
                        correctAns: q.answer,
                        isCorrect: isCorr
                    };
                });

                const totalScore = Math.round((correctCount / totalQs) * (activeQuestion.challenge.totalScore || 100));
                const percentage = Math.round((correctCount / totalQs) * 100);

                const scoreDetails = {
                    totalScore,
                    percentage,
                    correctCount,
                    totalQuestions: totalQs,
                    questionBreakdown: breakdown
                };

                submitResponseToFirestore('已提交挑戰題答卷', scoreDetails);
                if (isAuto) showToast("限時結束！系統已為您自動提交答卷。", "info");
            };

            // Item 5: Recording Start & Stop
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const recorder = new MediaRecorder(stream);
                    const chunks = [];

                    recorder.ondataavailable = e => chunks.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => setAudioBlobUrl(reader.result);
                        reader.readAsDataURL(blob);
                    };

                    recorder.start();
                    setMediaRecorder(recorder);
                    setIsRecording(true);
                } catch (e) {
                    showToast("無法存取麥克風設備！", "error");
                }
            };

            const stopRecording = () => {
                if (mediaRecorder && isRecording) {
                    mediaRecorder.stop();
                    setIsRecording(false);
                }
            };

            // Item 22.3.4: Team question answer handler
            const handleTeamAnswerChoice = async (selectedOpt) => {
                if (!activeQuestion || activeQuestion.mode !== 'TEAM') return;
                
                const myTeam = activeQuestion.teamsList?.find(t => t.members.some(m => m.id === studentId));
                if (!myTeam) return;

                const currentQ = activeQuestion.teamData?.questions[teamCurrentQIdx];
                const isCorrect = selectedOpt === currentQ?.answer;

                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                let updatedTeams = [...activeQuestion.teamsList];
                const teamIdx = updatedTeams.findIndex(t => t.id === myTeam.id);

                if (isCorrect) {
                    updatedTeams[teamIdx].progress += 1;
                    playSound('win');

                    if (updatedTeams[teamIdx].progress >= activeQuestion.teamData.questions.length) {
                        // Winner!
                        await window.fbUtils.setDoc(roomDocRef, {
                            activeQuestion: {
                                ...activeQuestion,
                                winningTeam: updatedTeams[teamIdx],
                                teamsList: updatedTeams
                            }
                        }, { merge: true });
                        showToast("恭喜貴組全對勝出比賽！🎉", "success");
                        return;
                    } else {
                        setTeamCurrentQIdx(prev => prev + 1);
                        showToast("答對了！推進下一題 🚀", "success");
                    }
                } else {
                    // Penalty: reset progress to 0!
                    updatedTeams[teamIdx].progress = 0;
                    setTeamCurrentQIdx(0);
                    playSound('buzzer');
                    showToast("答錯了！倒扣回到第一題重來 💥", "error");
                }

                await window.fbUtils.setDoc(roomDocRef, {
                    activeQuestion: {
                        ...activeQuestion,
                        teamsList: updatedTeams
                    }
                }, { merge: true });
            };

            const myTeamObj = useMemo(() => {
                if (activeQuestion?.mode === 'TEAM') {
                    return activeQuestion.teamsList?.find(t => t.members.some(m => m.id === studentId));
                }
                return null;
            }, [activeQuestion, studentId]);

            // Item 32 & 2: Broadcast overlay from teacher or classmate
            const activeBroadcastContent = activeQuestion?.teacherDemoBroadcast || activeQuestion?.broadcastedStudentRes;

            return (
                <div class="min-h-screen bg-slate-100 pb-12">
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 py-3">
                        <div class="max-w-4xl mx-auto flex justify-between items-center">
                            <div class="flex items-center space-x-2">
                                <span class="bg-indigo-600 text-white font-black px-2.5 py-1 rounded-xl text-sm">OMIT</span>
                                <span class="font-bold text-slate-800 text-sm">宣道會陳元喜小學</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="bg-indigo-50 text-indigo-700 font-bold px-3 py-1 rounded-full text-xs border border-indigo-200">
                                    {seatNumber}號 {studentName}
                                </span>
                                <button onClick={onExit} class="text-xs text-rose-600 font-bold px-2 py-1 bg-rose-50 rounded-lg">
                                    退出
                                </button>
                            </div>
                        </div>
                    </header>

                    <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">

                        {/* Item 21 & 32 & 2: Teacher Live Demo Whiteboard Broadcast or Classmate Peer Review Broadcast */}
                        {activeBroadcastContent && (
                            <div class="bg-purple-900 text-white p-5 rounded-3xl shadow-2xl space-y-3 animate-pulse border-4 border-purple-400">
                                <div class="flex justify-between items-center">
                                    <span class="font-black text-amber-300 text-sm flex items-center gap-2">
                                        <span>📡 即時廣播分享中</span>
                                    </span>
                                    <span class="text-xs bg-white/20 px-2 py-1 rounded">全班同步瀏覽</span>
                                </div>
                                <div class="bg-white rounded-2xl overflow-hidden aspect-16-9">
                                    {typeof activeBroadcastContent === 'string' ? (
                                        <img src={activeBroadcastContent} class="w-full h-full object-contain" alt="廣播內容" />
                                    ) : (
                                        <div class="p-4 text-slate-800 space-y-2">
                                            <div class="font-black border-b pb-2 text-indigo-600">
                                                {activeBroadcastContent.seatNumber}號 ({activeBroadcastContent.name}) 的作品：
                                            </div>
                                            {activeBroadcastContent.answer?.startsWith('data:image') ? (
                                                <img src={activeBroadcastContent.answer} class="w-full h-48 object-contain rounded" alt="作品" />
                                            ) : (
                                                <div class="p-3 bg-slate-100 rounded-xl font-bold">{activeBroadcastContent.answer}</div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* No Question Active State */}
                        {!activeQuestion && (
                            <div class="bg-white rounded-3xl p-12 text-center space-y-4 shadow-sm border border-slate-200">
                                <div class="text-6xl animate-bounce">⏳</div>
                                <h2 class="text-xl font-black text-slate-800">課堂進行中</h2>
                                <p class="text-slate-500 text-sm font-bold">已進入待機狀態，請安靜等候老師發佈題目...</p>
                            </div>
                        )}

                        {/* Active Question Student Workspace */}
                        {activeQuestion && (
                            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-6">
                                <div class="border-b pb-4 space-y-1">
                                    <div class="flex justify-between items-center">
                                        <span class="text-xs font-black text-indigo-600 uppercase tracking-wider">
                                            [{getModeLabel(activeQuestion.mode)}]
                                        </span>

                                        {/* Item 13: Challenge Timer Display */}
                                        {activeQuestion.mode === 'CHALLENGE' && challengeTimeLeft !== null && (
                                            <span class="font-mono font-black text-rose-600 bg-rose-50 px-3 py-1 rounded-full text-xs border border-rose-200 animate-pulse">
                                                ⏱️ 倒數限時: {Math.floor(challengeTimeLeft / 60)}:{(challengeTimeLeft % 60).toString().padStart(2, '0')}
                                            </span>
                                        )}
                                    </div>
                                    <h2 class="text-xl font-black text-slate-800">{activeQuestion.text}</h2>
                                </div>

                                {/* Item 22.2.3 & 22.3.4: Team Question Mode Student View */}
                                {activeQuestion.mode === 'TEAM' && (
                                    <div class="space-y-6">
                                        {/* Stage 22.2.3: GROUP Stage */}
                                        {activeQuestion.teamStage === 'GROUP' && (
                                            <div class="text-center py-8 space-y-4 bg-emerald-50 rounded-3xl border-2 border-emerald-300">
                                                <div class="text-6xl">{myTeamObj?.emoji || '🤝'}</div>
                                                <div class="space-y-1">
                                                    <span class="text-xs font-bold text-emerald-600">你已被分配到：</span>
                                                    <h3 class="text-3xl font-black text-emerald-900">{myTeamObj?.name || '分組中...'}</h3>
                                                </div>
                                                <p class="text-base font-black text-emerald-700 animate-pulse">
                                                    盡快與你的組員會合!比賽即將開始!
                                                </p>
                                            </div>
                                        )}

                                        {/* Stage 22.3.4: COMPETITION Stage - Split roles among members */}
                                        {activeQuestion.teamStage === 'COMPETITION' && (
                                            <div class="space-y-5">
                                                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-2xl border text-xs font-bold">
                                                    <span>組別：<strong class="text-indigo-600">{myTeamObj?.emoji} {myTeamObj?.name}</strong></span>
                                                    <span>進度：<strong class="text-emerald-600 font-mono text-sm">{myTeamObj?.progress || 0} / {activeQuestion.teamData?.questions?.length || 1} 題</strong></span>
                                                </div>

                                                {/* Split question view logic based on member index */}
                                                {(() => {
                                                    const currentQ = activeQuestion.teamData?.questions[teamCurrentQIdx];
                                                    if (!currentQ) return <div class="text-center font-bold">已完成所有合作題目！</div>;

                                                    const myMemberIdx = myTeamObj?.members.findIndex(m => m.id === studentId) ?? 0;
                                                    const teamSize = myTeamObj?.members.length || 3;

                                                    // Member 0 gets the Question Text
                                                    // Member 1 gets Options A & B
                                                    // Member 2 gets Options C & D
                                                    return (
                                                        <div class="space-y-4 bg-emerald-50/50 p-5 rounded-2xl border border-emerald-200">
                                                            <div class="text-xs font-black text-emerald-800 bg-emerald-100 px-3 py-1 rounded-full w-fit">
                                                                第 {teamCurrentQIdx + 1} 題 (組員分工合作模式)
                                                            </div>

                                                            {myMemberIdx === 0 && (
                                                                <div class="bg-white p-5 rounded-2xl border-2 border-emerald-400 space-y-2 shadow-sm text-center">
                                                                    <span class="text-xs font-bold text-slate-400">【題目保管員】你的螢幕負責顯示題目：</span>
                                                                    <div class="text-lg font-black text-slate-800">{currentQ.text}</div>
                                                                    <p class="text-xs text-emerald-700 font-bold pt-2">請向你的組員朗讀題目內容！</p>
                                                                </div>
                                                            )}

                                                            {myMemberIdx === 1 && (
                                                                <div class="space-y-3">
                                                                    <div class="text-xs font-bold text-slate-500 text-center">【選項組員 1】你的螢幕負責答案選項 A 與 B：</div>
                                                                    <div class="grid grid-cols-1 gap-3">
                                                                        {currentQ.options.slice(0, 2).map(opt => (
                                                                            <button 
                                                                                key={opt.letter}
                                                                                onClick={() => handleTeamAnswerChoice(opt.letter)}
                                                                                class="p-4 bg-white hover:bg-emerald-500 hover:text-white font-black rounded-2xl border-2 border-emerald-300 text-left transition text-base shadow-sm active:scale-98"
                                                                            >
                                                                                {opt.letter}. {opt.text}
                                                                            </button>
                                                                        ))}
                                                                    </div>
                                                                </div>
                                                            )}

                                                            {myMemberIdx >= 2 && (
                                                                <div class="space-y-3">
                                                                    <div class="text-xs font-bold text-slate-500 text-center">【選項組員 2】你的螢幕負責答案選項 C 與 D：</div>
                                                                    <div class="grid grid-cols-1 gap-3">
                                                                        {currentQ.options.slice(2, 4).map(opt => (
                                                                            <button 
                                                                                key={opt.letter}
                                                                                onClick={() => handleTeamAnswerChoice(opt.letter)}
                                                                                class="p-4 bg-white hover:bg-emerald-500 hover:text-white font-black rounded-2xl border-2 border-emerald-300 text-left transition text-base shadow-sm active:scale-98"
                                                                            >
                                                                                {opt.letter}. {opt.text}
                                                                            </button>
                                                                        ))}
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })()}
                                            </div>
                                        )}

                                        {/* Winner display */}
                                        {activeQuestion.winningTeam && (
                                            <div class="bg-amber-100 border-4 border-amber-400 p-6 rounded-3xl text-center space-y-4 animate-bounce">
                                                <div class="text-5xl">🏆</div>
                                                <h3 class="text-2xl font-black text-amber-900">
                                                    勝出組別：{activeQuestion.winningTeam.emoji} {activeQuestion.winningTeam.name}！
                                                </h3>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Choice / TF Student Input */}
                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div class="space-y-4">
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            {activeQuestion.choiceOptions.map((opt) => (
                                                <button 
                                                    key={opt}
                                                    disabled={submitted}
                                                    onClick={() => setMyAnswer(opt)}
                                                    class={`p-4 rounded-2xl font-black text-left text-lg border-2 transition active:scale-98 ${
                                                        myAnswer === opt 
                                                        ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' 
                                                        : 'bg-slate-50 text-slate-800 border-slate-200 hover:border-indigo-300'
                                                    }`}
                                                >
                                                    {opt}
                                                </button>
                                            ))}
                                        </div>

                                        {/* Item 3: Choice / TF Submit Button */}
                                        {!submitted && (
                                            <button 
                                                onClick={() => submitResponseToFirestore(myAnswer)}
                                                disabled={!myAnswer}
                                                class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-black py-4 rounded-2xl shadow-lg transition active:scale-98 text-base"
                                            >
                                                確認提交 🚀
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Short Answer Input */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-4">
                                        <textarea 
                                            rows={4}
                                            disabled={submitted}
                                            placeholder="請在此輸入您的文字回答..."
                                            value={myAnswer}
                                            onChange={(e) => setMyAnswer(e.target.value)}
                                            class="w-full p-4 rounded-2xl border-2 border-slate-200 focus:ring-2 focus:ring-indigo-500 font-medium text-base text-slate-800"
                                        />

                                        {/* Item 3: Short Answer Submit Button */}
                                        {!submitted && (
                                            <button 
                                                onClick={() => submitResponseToFirestore(myAnswer)}
                                                disabled={!myAnswer.trim()}
                                                class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-black py-4 rounded-2xl shadow-lg transition active:scale-98 text-base"
                                            >
                                                確認提交 🚀
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Item 1 & 27: Whiteboard Student Canvas (Locked after submit) */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <div class="space-y-4">
                                        <WhiteboardCanvas 
                                            initialBg={activeQuestion.whiteboardBg}
                                            onSave={(data) => setWhiteboardCanvasData(data)}
                                            disabled={submitted}
                                            strokeWidth={drawStrokeWidth}
                                            setStrokeWidth={setDrawStrokeWidth}
                                            isEraser={drawIsEraser}
                                            setIsEraser={setDrawIsEraser}
                                            onClear={() => setWhiteboardCanvasData(null)}
                                        />

                                        {/* Item 3: Whiteboard Submit Button */}
                                        {!submitted && (
                                            <button 
                                                onClick={() => submitResponseToFirestore(whiteboardCanvasData)}
                                                disabled={!whiteboardCanvasData}
                                                class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-black py-4 rounded-2xl shadow-lg transition active:scale-98 text-base"
                                            >
                                                確認提交作品 🚀
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Item 18: Buzzer Button */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="text-center py-8 space-y-4">
                                        {!submitted ? (
                                            <button 
                                                onClick={() => submitResponseToFirestore('已按鍵搶答！')}
                                                class="w-48 h-48 md:w-64 md:h-64 rounded-full bg-gradient-to-tr from-rose-600 to-red-500 hover:from-rose-500 hover:to-red-400 text-white font-black text-3xl md:text-4xl shadow-2xl border-8 border-rose-200 active:scale-90 transition transform flex items-center justify-center mx-auto"
                                            >
                                                🚨 搶答！
                                            </button>
                                        ) : (
                                            <div class="text-emerald-600 font-black text-2xl animate-pulse">
                                                ✅ 已成功按鍵搶答！
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Item 5: Audio Question Flow */}
                                {activeQuestion.mode === 'AUDIO' && (
                                    <div class="space-y-4 text-center">
                                        {!submitted ? (
                                            <div class="space-y-4">
                                                {!audioBlobUrl ? (
                                                    <button 
                                                        onClick={isRecording ? stopRecording : startRecording}
                                                        class={`px-8 py-5 rounded-2xl font-black text-white text-lg shadow-lg transition flex items-center justify-center space-x-2 mx-auto ${
                                                            isRecording ? 'bg-rose-600 animate-pulse' : 'bg-cyan-600 hover:bg-cyan-700'
                                                        }`}
                                                    >
                                                        <span>{isRecording ? '⏹️ 停止錄音' : '🎤 開始錄音'}</span>
                                                    </button>
                                                ) : (
                                                    <div class="space-y-4 bg-cyan-50 p-5 rounded-2xl border border-cyan-200">
                                                        <h4 class="font-bold text-cyan-900 text-sm">試聽您的錄音檔：</h4>
                                                        <audio src={audioBlobUrl} controls class="w-full max-w-md mx-auto" />
                                                        <div class="flex justify-center space-x-3">
                                                            <button 
                                                                onClick={() => setAudioBlobUrl(null)}
                                                                class="px-4 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold rounded-xl text-xs border border-rose-200"
                                                            >
                                                                🗑️ 刪除重錄
                                                            </button>
                                                            <button 
                                                                onClick={() => submitResponseToFirestore(audioBlobUrl)}
                                                                class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl text-sm shadow"
                                                            >
                                                                ✅ 確認提交錄音
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        ) : null}
                                    </div>
                                )}

                                {/* Item 4: Link Pushing View */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div class="space-y-4">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div class="aspect-16-9 w-full rounded-2xl overflow-hidden border-2 border-amber-300 shadow-md">
                                                <iframe 
                                                    src={activeQuestion.youtubeEmbed} 
                                                    class="w-full h-full" 
                                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                                    allowFullScreen
                                                ></iframe>
                                            </div>
                                        ) : (
                                            <div class="p-6 bg-amber-50 rounded-2xl border border-amber-200 text-center space-y-3">
                                                <p class="font-bold text-amber-900 text-sm">{activeQuestion.pushedUrl}</p>
                                            </div>
                                        )}

                                        <a 
                                            href={activeQuestion.pushedUrl} 
                                            target="_blank" 
                                            rel="noreferrer"
                                            class="block w-full bg-amber-500 hover:bg-amber-600 text-white text-center font-black py-4 rounded-2xl shadow-md text-base transition"
                                        >
                                            開啟連結網站 ↗
                                        </a>
                                    </div>
                                )}

                                {/* Item 15, 19, 28, 29: Challenge Student Questions */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                    <div class="space-y-6">
                                        <div class="space-y-4">
                                            {activeQuestion.challenge.questions.map((q, idx) => (
                                                <div key={q.num} class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-3">
                                                    <div class="font-black text-slate-800 text-base">
                                                        第 {idx + 1} 題: {q.text}
                                                    </div>

                                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                        {q.options.map((opt) => (
                                                            <button 
                                                                key={opt.letter}
                                                                disabled={submitted}
                                                                onClick={() => setChallengeAnswers(prev => ({ ...prev, [q.num]: opt.letter }))}
                                                                class={`p-3 rounded-xl font-bold text-left border text-sm transition ${
                                                                    challengeAnswers[q.num] === opt.letter 
                                                                    ? 'bg-amber-600 text-white border-amber-600' 
                                                                    : 'bg-white text-slate-700 border-slate-200'
                                                                }`}
                                                            >
                                                                {opt.letter}. {opt.text}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        {!submitted && (
                                            <button 
                                                onClick={() => handleSubmitChallengeAnswers(false)}
                                                class="w-full bg-amber-600 hover:bg-amber-700 text-white font-black py-4 rounded-2xl shadow-lg text-base transition active:scale-98"
                                            >
                                                確認提交答卷 🚀
                                            </button>
                                        )}

                                        {/* Item 19 & 28: Score release display after teacher releases scores */}
                                        {submitted && (activeQuestion.challenge.scoresReleased || activeQuestion.challenge.releaseInstant) && (
                                            <div class="p-5 bg-emerald-50 rounded-2xl border-2 border-emerald-300 space-y-3 text-center">
                                                <h3 class="text-xl font-black text-emerald-900">🏆 您的成績結果已發佈</h3>
                                                <div class="text-3xl font-black text-emerald-600">
                                                    {responses[`${activeQuestion.id}_${studentId}`]?.scoreDetails?.totalScore} / {activeQuestion.challenge.totalScore} 分
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Item 6: Unified Submission Feedback Message */}
                                {submitted && (
                                    <div class="p-6 bg-emerald-500 text-white rounded-3xl text-center space-y-2 shadow-xl animate-pulse">
                                        <div class="text-4xl">🎉</div>
                                        <h3 class="text-xl md:text-2xl font-black">
                                            已提交答案! 讚賞你的努力! 安靜等候老師指示...
                                        </h3>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
