    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Helper label switcher
        function getModeLabel(mode) {
            switch(mode) {
                case 'CHOICE': return '選擇題';
                case 'TF': return '是非題';
                case 'SHORT': return '短答題';
                case 'DRAW': return '白板題';

                case 'CHALLENGE': return '挑戰題';
                case 'LINK': return '派送連結';
                default: return '題目';
            }
        }

        // Helper default prompts
        function getDefaultQuestionPrompt(mode) {
            switch(mode) {
                case 'CHOICE': return '請選擇正確答案：';
                case 'TF': return '請判斷下列描述是否正確：';

                case 'DRAW': return '請在白板上作答或繪圖：';
                case 'BUZZER': return '請準備點擊搶答按鈕！';
                case 'AUDIO': return '請錄製不多於10秒的語音回答：';
                case 'CHALLENGE': return '請在限時內完成以下挑戰題評估：';
                case 'LINK': return '請點擊或觀看下方派送內容：';
                default: return '請回答問題：';
            }
        }

        // Web Audio API Sound Generator
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                    });
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (
                <div class={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-xl shadow-lg flex items-center space-x-2 text-sm font-medium animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        // Create Word .docx binary blob using JSZip
        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) {
                throw new Error("JSZip library is not loaded.");
            }
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>
    ${paragraphsXml}
  </w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        // Parse Word doc / text format
        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];
            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) {
                        questions.push(currentQ);
                    }
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }

                    currentQ.options.push({ letter: letter, text: optText });
                    if (isCorrect) currentQ.answer = letter;
                }
            });

            if (currentQ && currentQ.options.length > 0) {
                questions.push(currentQ);
            }

            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1,
                            text: "以下哪一項不是地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "機械資源" }
                            ],
                            answer: "D"
                        },
                        {
                            num: 2,
                            text: "芝士的原料屬於哪一項地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "礦產資源" }
                            ],
                            answer: "C"
                        }
                    ]
                };
            }

            return { title, totalScore, questions };
        };

        // Item 1 & 20: Whiteboard Canvas with 1280x720 fixed aspect ratio and scale mapping formula (scaleX/scaleY)
        const WhiteboardCanvas = ({ bgImage, onSave, readonly = false, initialData = null }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [strokeColor, setStrokeColor] = useState('#1e293b');
            const [strokeWidth, setStrokeWidth] = useState(4);
            const [isEraser, setIsEraser] = useState(false);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                // Render background or initial image
                const renderBackground = () => {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    if (bgImage) {
                        const img = new Image();
                        img.crossOrigin = "anonymous";
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            if (initialData) {
                                const initImg = new Image();
                                initImg.onload = () => ctx.drawImage(initImg, 0, 0);
                                initImg.src = initialData;
                            }
                        };
                        img.src = bgImage;
                    } else if (initialData) {
                        const initImg = new Image();
                        initImg.onload = () => ctx.drawImage(initImg, 0, 0);
                        initImg.src = initialData;
                    }
                };

                renderBackground();
            }, [bgImage, initialData]);

            // Ratio mapping formula for touch/mouse accuracy
            const getCoordinates = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                if (readonly) return;
                e.preventDefault();
                setIsDrawing(true);
                const { x, y } = getCoordinates(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            const draw = (e) => {
                if (!isDrawing || readonly) return;
                e.preventDefault();
                const { x, y } = getCoordinates(e);
                const ctx = canvasRef.current.getContext('2d');

                ctx.lineWidth = strokeWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (isEraser) {
                    ctx.strokeStyle = '#ffffff';
                } else {
                    ctx.strokeStyle = strokeColor;
                }

                ctx.lineTo(x, y);
                ctx.stroke();
            };

            const stopDrawing = (e) => {
                if (!isDrawing || readonly) return;
                setIsDrawing(false);
                if (onSave) {
                    onSave(canvasRef.current.toDataURL('image/png'));
                }
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                if (bgImage) {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    img.src = bgImage;
                }
                if (onSave) onSave(canvas.toDataURL('image/png'));
            };

            const handleCustomBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = canvasRef.current;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            if (onSave) onSave(canvas.toDataURL('image/png'));
                        };
                        img.src = evt.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            return (
                <div class="space-y-3">
                    {!readonly && (
                        <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-100 p-2.5 rounded-2xl border border-slate-200">
                            {/* Colors */}
                            <div class="flex items-center space-x-1.5">
                                {['#1e293b', '#ef4444', '#2563eb', '#10b981', '#f59e0b', '#8b5cf6'].map(c => (
                                    <button 
                                        key={c}
                                        type="button"
                                        onClick={() => { setStrokeColor(c); setIsEraser(false); }}
                                        class={`w-7 h-7 rounded-full border-2 transition transform active:scale-90 ${strokeColor === c && !isEraser ? 'ring-2 ring-indigo-500 scale-110' : ''}`}
                                        style={{ backgroundColor: c }}
                                    />
                                ))}
                            </div>

                            {/* Stroke Widths 2px - 18px */}
                            <div class="flex items-center space-x-1 bg-white p-1 rounded-xl border">
                                <span class="text-xs font-bold text-slate-400 px-1">粗幼:</span>
                                {[2, 4, 8, 12, 18].map(w => (
                                    <button 
                                        key={w}
                                        type="button"
                                        onClick={() => setStrokeWidth(w)}
                                        class={`px-2 py-0.5 text-xs font-bold rounded-lg transition ${strokeWidth === w ? 'bg-indigo-600 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
                                    >
                                        {w}px
                                    </button>
                                ))}
                            </div>

                            {/* Eraser, Clear & Upload Bg */}
                            <div class="flex items-center space-x-1.5">
                                <button 
                                    type="button"
                                    onClick={() => setIsEraser(!isEraser)}
                                    class={`px-3 py-1.5 rounded-xl text-xs font-bold border transition ${isEraser ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-slate-700 border-slate-200'}`}
                                >
                                    🧽 擦膠
                                </button>
                                <button 
                                    type="button"
                                    onClick={clearCanvas}
                                    class="px-3 py-1.5 rounded-xl text-xs font-bold bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100 transition"
                                >
                                    🗑️ 一鍵清空
                                </button>
                                <label class="px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100 cursor-pointer transition">
                                    🖼️ 平板上載背景
                                    <input type="file" accept="image/*" onChange={handleCustomBgUpload} class="hidden" />
                                </label>
                            </div>
                        </div>
                    )}

                    <div class="relative w-full aspect-16-9 bg-white rounded-2xl border-2 border-slate-200 overflow-hidden shadow-inner canvas-container">
                        <canvas 
                            ref={canvasRef}
                            width={1280}
                            height={720}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            class="w-full h-full object-contain cursor-crosshair touch-none"
                        />
                    </div>
                </div>
            );
        };

        function OMITApp() {
            const [role, setRole] = useState('LANDING'); // 'LANDING', 'TEACHER', 'STUDENT'
            const [roomCode, setRoomCode] = useState('');
            const [seatNumber, setSeatNumber] = useState('1');
            const [studentName, setStudentName] = useState('');
            const [teacherPassword, setTeacherPassword] = useState('');
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [toast, setToast] = useState(null);

            const [activeQuestion, setActiveQuestion] = useState(null);
            const [studentsList, setStudentsList] = useState([]);
            const [responses, setResponses] = useState({});
            const [historyQuestions, setHistoryQuestions] = useState([]);
            const [isAuthReady, setIsAuthReady] = useState(false);

            const myStudentId = useRef('std_' + Math.random().toString(36).substring(2, 9));

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (window.fbUtils && window.fbAuth) {
                            await window.fbUtils.signInAnonymously(window.fbAuth);
                            setIsAuthReady(true);
                        }
                    } catch (err) {
                        console.error("Firebase auth failed:", err);
                    }
                };
                initAuth();
            }, []);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const roomParam = params.get('room');
                if (roomParam) {
                    setRoomCode(roomParam.toUpperCase());
                }
            }, []);

            useEffect(() => {
                if (!roomCode || !isAuthReady) return;

                const appId = "omit-8c173";
                const db = window.fbDb;
                const { doc, onSnapshot, collection } = window.fbUtils;

                const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                const studentsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                const responsesColRef = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');

                const unsubRoom = onSnapshot(roomDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setActiveQuestion(data.activeQuestion || null);
                        if (data.history) setHistoryQuestions(data.history);
                    }
                }, (err) => console.error("Room sub error:", err));

                const unsubStudents = onSnapshot(studentsColRef, (snapshot) => {
                    const list = [];
                    snapshot.forEach((d) => list.push(d.data()));
                    setStudentsList(list);
                }, (err) => console.error("Students sub error:", err));

                const unsubResponses = onSnapshot(responsesColRef, (snapshot) => {
                    const resMap = {};
                    snapshot.forEach((d) => {
                        resMap[d.id] = d.data();
                    });
                    setResponses(resMap);
                }, (err) => console.error("Responses sub error:", err));

                return () => {
                    unsubRoom();
                    unsubStudents();
                    unsubResponses();
                };
            }, [roomCode, isAuthReady]);

            const handleTeacherAccessRequest = () => {
                setShowPasswordModal(true);
                setTeacherPassword('');
            };

            const verifyTeacherPassword = (e) => {
                e?.preventDefault();
                if (teacherPassword === '8030') {
                    const generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
                    setRoomCode(generatedCode);
                    setRole('TEACHER');
                    setShowPasswordModal(false);
                    showToast(`密碼正確！已建立課堂 房號：${generatedCode}`, 'success');
                } else {
                    showToast('密碼錯誤，請重新輸入！', 'error');
                }
            };

            const handleJoinRoom = (e) => {
                e?.preventDefault();
                if (!roomCode.trim()) {
                    showToast('請輸入6位數字房號', 'error');
                    return;

                        {showPasswordModal && (

            if (role === 'TEACHER') {
                return (
                    <TeacherDashboard 
                        roomCode={roomCode} 
                        activeQuestion={activeQuestion} 
                        setActiveQuestion={setActiveQuestion}

                        setResponses={setResponses}
                        studentsList={studentsList}
                        historyQuestions={historyQuestions}
                        setHistoryQuestions={setHistoryQuestions}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />

            if (role === 'STUDENT') {
                return (
                    <StudentInterface 
                        roomCode={roomCode}
                        studentName={studentName}
                        seatNumber={seatNumber}
                        studentId={myStudentId.current}
                        activeQuestion={activeQuestion}
                        responses={responses}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}

        function TeacherDashboard({ roomCode, activeQuestion, setActiveQuestion, responses, setResponses, studentsList, historyQuestions, setHistoryQuestions, showToast, onExit }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE');
            const [questionText, setQuestionText] = useState('');
            const [choiceCount, setChoiceCount] = useState(4);
            const [lockAfterSubmit, setLockAfterSubmit] = useState(true);
            const [whiteboardBg, setWhiteboardBg] = useState(null);
            const [pushedUrl, setPushedUrl] = useState('');

            // Modals & Tools
            const [showQRModal, setShowQRModal] = useState(false);
            const [showStudentListModal, setShowStudentListModal] = useState(false);
            const [showInspectModal, setShowInspectModal] = useState(null);
            const [barChoiceFilter, setBarChoiceFilter] = useState(null);
            const [showTeacherDemoBoard, setShowTeacherDemoBoard] = useState(false); // Revision Item 20

            // Revision Item 7: Random Selector State with custom range
            const [showRandomModal, setShowRandomModal] = useState(false);
            const [rangeStart, setRangeStart] = useState(1);
            const [rangeEnd, setRangeEnd] = useState(36);
            const [drawnNumbers, setDrawnNumbers] = useState([]);
            const [currentDrawn, setCurrentDrawn] = useState(null);
            const [isSpinning, setIsSpinning] = useState(false);

            // Revision Item 8: Timer Modal State with MM:SS manual input
            const [showTimerModal, setShowTimerModal] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerActive, setTimerActive] = useState(false);
            const [timerZoomed, setTimerZoomed] = useState(false);
            const [customTimerMins, setCustomTimerMins] = useState(1);
            const [customTimerSecs, setCustomTimerSecs] = useState(0);

            // Challenge Question Setup States
            const [challengeData, setChallengeData] = useState(null);
            const [challengeEnableTimer, setChallengeEnableTimer] = useState(true);
            const [challengeTimeLimit, setChallengeTimeLimit] = useState(120); // 120s default (2 mins)
            const [challengeReleaseInstant, setChallengeReleaseInstant] = useState(false); // Revision Item 12: Default wait for teacher release
            const [showChallengeScoresOnLeaderboard, setShowChallengeScoresOnLeaderboard] = useState(true);

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

            const currentQuestionResponses = useMemo(() => {
                if (!activeQuestion) return {};
                const filtered = {};
                Object.values(responses).forEach(r => {
                    if (r.questionId === activeQuestion.id) {
                        filtered[r.studentId] = r;
                    }
                });
                return filtered;
            }, [responses, activeQuestion]);

            // Timer Interval Logic
            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(s => {
                            if (s <= 1) {
                                setTimerActive(false);
                                playSound('alarm');
                                return 0;
                            }
                            return s - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            const publishQuestionToFirestore = async (qObj, newHistoryList) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatePayload = {
                    activeQuestion: qObj,
                    updatedAt: Date.now()
                };
                if (newHistoryList) {
                    updatePayload.history = newHistoryList;
                }

                await window.fbUtils.setDoc(roomDocRef, updatePayload, { merge: true });
            };

            const handleExitRoom = async () => {
                if (window.confirm("確定退出課室？將會同步清空此課室於 Firebase 的所有暫存紀錄！")) {
                    try {
                        const appId = "omit-8c173";
                        const db = window.fbDb;
                        
                        const responsesColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');
                        const resSnaps = await window.fbUtils.getDocs(responsesColRef);
                        resSnaps.forEach(async (d) => {
                            await window.fbUtils.deleteDoc(d.ref);
                        });

                        const studentsColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                        const stuSnaps = await window.fbUtils.getDocs(studentsColRef);
                        stuSnaps.forEach(async (d) => {
                            await window.fbUtils.deleteDoc(d.ref);
                        });

                        const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                        await window.fbUtils.deleteDoc(roomDocRef);

                        showToast("課室暫存資料已完全清空！", "info");
                    } catch (e) {
                        console.error("Cleanup error:", e);
                    }
                    onExit();
                }
            };

            // Revision Item 10: Download Assessment Word File (.docx)
            const handleDownloadChallengeTemplate = async () => {
                const sampleLines = [
                    "標題：地球生病了",
                    "總分: 100分",
                    "1.以下哪一項不是地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源",
                    "D. 機械資源*",
                    "",
                    "2.芝士的原料屬於哪一項地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源*",
                    "D. 礦產資源",
                    "",
                    "3.人們不當使用水資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應*",
                    "",
                    "4.人們不當使用煤和石油資源會造成甚麼後果?",
                    "A. 引發極端天氣*",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應",
                    "",
                    "5.人們不當使用土地資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災*",
                    "C. 產生大量二氧化碳",
                    "D. 影響食水供應"
                ];

                try {
                    const blob = await createWordDocxBlob(sampleLines);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = '下載評估範本Word檔.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast("已下載評估範本 Word 檔 (.docx)！", "success");
                } catch (err) {
                    console.error("Docx generation error:", err);
                    showToast("無法生成 Word 範本檔，請重新整理試試。", "error");
                }
            };

            // Revision Item 10: Word / Text file upload & parse
            const handleWordFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const arrayBuffer = evt.target.result;
                            const result = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                            parsedData = parseWordChallengeText(result.value);
                        } else {
                            const text = evt.target.result;
                            parsedData = parseWordChallengeText(text);
                        }

                        setChallengeData(parsedData);
                        showToast(`已成功解析範本！進入【教師編輯/確認評估內容】，共 ${parsedData.questions.length} 題`, 'success');
                    } catch (err) {
                        console.error("Word file parse error:", err);
                        showToast("文件解析失敗，請確認格式！", "error");
                    }
                };

                if (file.name.endsWith('.docx')) {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file, "UTF-8");
                }
            };

            const handleUpdateChallengeTitle = (newTitle) => {
                setChallengeData(prev => prev ? { ...prev, title: newTitle } : null);
            };

            const handleUpdateChallengeScore = (newScore) => {
                setChallengeData(prev => prev ? { ...prev, totalScore: parseInt(newScore) || 100 } : null);
            };

            const handleUpdateQuestionText = (qIndex, text) => {
                setChallengeData(prev => {
                    if (!prev) return null;
                    const newQs = [...prev.questions];
                    newQs[qIndex] = { ...newQs[qIndex], text };
                    return { ...prev, questions: newQs };
                });
            };

            const handleUpdateOptionText = (qIndex, optIndex, text) => {
                setChallengeData(prev => {
                    if (!prev) return null;
                    const newQs = [...prev.questions];
                    const newOpts = [...newQs[qIndex].options];
                    newOpts[optIndex] = { ...newOpts[optIndex], text };
                    newQs[qIndex] = { ...newQs[qIndex], options: newOpts };
                    return { ...prev, questions: newQs };
                });
            };

            const handleUpdateCorrectAnswer = (qIndex, answerLetter) => {
                setChallengeData(prev => {
                    if (!prev) return null;
                    const newQs = [...prev.questions];
                    newQs[qIndex] = { ...newQs[qIndex], answer: answerLetter };
                    return { ...prev, questions: newQs };
                });
            };

            // Revision Item 10: Delete specific question
            const handleDeleteQuestion = (qIndex) => {
                setChallengeData(prev => {
                    if (!prev) return null;
                    const newQs = prev.questions.filter((_, idx) => idx !== qIndex).map((q, idx) => ({
                        ...q,
                        num: idx + 1
                    }));
                    return { ...prev, questions: newQs };
                });
                showToast("已刪除該題目！", "info");
            };

            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                
                let challengeContent = null;
                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請先上載並解析評估範本Word檔！", "error");
                        return;
                    }
                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);

                publishQuestionToFirestore(newQ, updatedHistory);
                showToast(`已發佈【${getModeLabel(selectedMode)}】給全班！`, 'success');
            };

            // Revision Item 12: Release challenge scores to all
            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已成功一併發放挑戰題成績至全班學生端！", "success");
            };

            const handleDownloadAllAudio = async () => {
                const audioSubmissions = Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:audio'));
                
                if (audioSubmissions.length === 0) {
                    showToast("目前尚無學生提交錄音！", "error");
                    return;
                }

                try {
                    const zip = new JSZip();
                    const folder = zip.folder(`課堂錄音_房號${roomCode}`);

                    audioSubmissions.forEach((res) => {
                        const base64Data = res.answer.split(',')[1];
                        const fileName = `${res.seatNumber.toString().padStart(2, '0')}_${res.name || '學生'}.webm`;
                        folder.file(fileName, base64Data, { base64: true });
                    });

                    const content = await zip.generateAsync({ type: "blob" });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(content);
                    link.download = `OMIT_學生錄音_房號${roomCode}.zip`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    showToast(`已打包並下載 ${audioSubmissions.length} 位學生的語音檔案！`, "success");
                } catch (err) {
                    console.error("ZIP creation error:", err);
                    showToast("打包錄音檔案失敗！", "error");
                }
            };

            const handleClearQuestion = async () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: null }, { merge: true });
                showToast('已結束當前題目', 'info');
            };

            const toggleLockMode = async () => {
                const newLock = !lockAfterSubmit;
                setLockAfterSubmit(newLock);
                if (activeQuestion) {
                    const updatedQ = { ...activeQuestion, lockAfterSubmit: newLock };
                    publishQuestionToFirestore(updatedQ);
                    showToast(newLock ? "已鎖定答案" : "已開放學生修改答案", "info");
                }
            };

            const handleBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setWhiteboardBg(evt.target.result);
                        showToast("已成功載入白板背景圖片！", "success");
                    };
                    reader.readAsDataURL(file);
                }
            };

            // Revision Item 2: Broadcast student whiteboard work
            const handleBroadcastSubmission = async (studentRes) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatedQ = { 
                    ...activeQuestion, 
                    broadcastedSubmission: studentRes 
                };
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                showToast(`已廣播 ${studentRes.name} 的作品至全班螢幕互評！`, "success");
            };

            // Revision Item 7: Non-repeat Random Selector with Rolling & Sounds
            const handleSpinRandom = () => {
                if (isSpinning) return;
                
                const start = parseInt(rangeStart) || 1;
                const end = parseInt(rangeEnd) || 36;
                const available = [];
                for (let i = start; i <= end; i++) {
                    if (!drawnNumbers.includes(i)) available.push(i);
                }

                if (available.length === 0) {
                    showToast("此範圍內所有學號皆已被抽出！請點擊重置。", "error");
                    return;
                }

                setIsSpinning(true);
                let counter = 0;
                const maxIntervals = 20;

                const timer = setInterval(() => {
                    const temp = available[Math.floor(Math.random() * available.length)];
                    setCurrentDrawn(temp);
                    playSound('spin');
                    counter++;

                    if (counter >= maxIntervals) {
                        clearInterval(timer);
                        const finalPicked = available[Math.floor(Math.random() * available.length)];
                        setCurrentDrawn(finalPicked);
                        setDrawnNumbers(prev => [...prev, finalPicked]);
                        setIsSpinning(false);
                        playSound('win');
                    }
                }, 100);
            };

            // Revision Item 15 & 19: Export CSV including detailed challenge report
            const handleExportCSVReport = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生紀錄可供匯出！", "error");
                    return;
                }

                let csvContent = "\uFEFF"; // UTF-8 BOM
                csvContent += "學號,學生姓名,加入時間";

                historyQuestions.forEach((q, idx) => {
                    const cleanText = (q.text || getModeLabel(q.mode)).replace(/"/g, '""');
                    if (q.mode === 'CHALLENGE' && q.challenge) {
                        csvContent += `,第${idx + 1}題[挑戰題:${q.challenge.title}得分],第${idx + 1}題[正確率],第${idx + 1}題[作答用時(秒)]`;
                        q.challenge.questions.forEach((subQ, sIdx) => {
                            csvContent += `,第${idx + 1}題_Q${sIdx + 1}答案`;
                        });
                    } else {
                        csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]: "${cleanText}"`;
                    }
                });
                csvContent += "\n";

                const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

                sortedStudents.forEach((stu) => {
                    const cleanName = (stu.name || '').replace(/"/g, '""');
                    csvContent += `"${stu.seatNumber}號","${cleanName}","${stu.joinTime || ''}"`;
                    
                    historyQuestions.forEach((q) => {
                        const resKey = `${q.id}_${stu.id}`;
                        const res = responses[resKey];
                        
                        if (res && res.answer !== undefined && res.answer !== null) {
                            if (q.mode === 'CHALLENGE' && res.scoreDetails) {
                                csvContent += `,"${res.scoreDetails.totalScore} / ${q.challenge.totalScore}分","${res.scoreDetails.percentage}%","${res.duration || 0}秒"`;
                                q.challenge.questions.forEach((subQ) => {
                                    const studentChoice = res.challengeAnswers ? res.challengeAnswers[subQ.num] || '未答' : '未答';
                                    csvContent += `,"${studentChoice}"`;
                                });
                            } else {
                                let ansVal = res.answer;
                                if (typeof ansVal === 'string' && ansVal.startsWith('data:image')) {
                                    ansVal = '[白板繪圖]';
                                } else if (typeof ansVal === 'string' && ansVal.startsWith('data:audio')) {
                                    ansVal = '[語音錄音]';
                                }
                                const cleanAns = String(ansVal).replace(/"/g, '""');
                                csvContent += `,"${cleanAns} (${res.duration || 0}s)"`;
                            }
                        } else {
                            if (q.mode === 'CHALLENGE' && q.challenge) {
                                csvContent += `,"未作答","0%","0秒"`;
                                q.challenge.questions.forEach(() => {
                                    csvContent += `,"未作答"`;
                                });
                            } else {
                                csvContent += `,"未作答"`;
                            }
                        }
                    });
                    csvContent += "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `📥 匯出本次挑戰題成績試算表_房號${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("已成功匯出成績試算表 (.csv)！", "success");
            };

            // Revision Item 14, 16, 17: Leaderboard with Gold/Silver/Bronze & Buzzer Locking ONLY 1st student
            const leaderboard = useMemo(() => {
                let list = Object.values(currentQuestionResponses).filter(r => r.duration !== undefined);
                if (activeQuestion?.mode === 'BUZZER') {
                    // Lock to only the 1st fastest student
                    list = list.sort((a, b) => parseFloat(a.duration) - parseFloat(b.duration)).slice(0, 1);
                } else if (activeQuestion?.mode === 'CHALLENGE') {
                    list = list.sort((a, b) => {
                        const scoreA = a.scoreDetails?.totalScore || 0;
                        const scoreB = b.scoreDetails?.totalScore || 0;
                        if (scoreB !== scoreA) return scoreB - scoreA;
                        return parseFloat(a.duration) - parseFloat(b.duration);
                    });
                } else {
                    list = list.sort((a, b) => parseFloat(a.duration) - parseFloat(b.duration));
                }
                return list;
            }, [currentQuestionResponses, activeQuestion]);

            const whiteboardSubmissions = useMemo(() => {
                return Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:image'));
            }, [currentQuestionResponses]);

            const challengeScoresAreReleased = useMemo(() => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return true;
                return !!(activeQuestion.challenge?.releaseInstant || activeQuestion.challenge?.scoresReleased);
            }, [activeQuestion]);

            return (
                <div class="min-h-screen pb-12">
                    {/* Revision Item 7: Teacher Dashboard Header Renamed */}
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 py-3">
                        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                            <div class="flex items-center space-x-3">
                                <span class="bg-slate-900 text-white font-black px-3 py-1.5 rounded-xl text-lg">OMIT</span>
                                <div>
                                    <h1 class="font-extrabold text-slate-800 text-base md:text-lg flex items-center gap-2">
                                        宣道會陳元喜小學OMIT互動課堂
                                        <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-0.5 rounded-full font-mono font-bold">
                                            房號：{roomCode}
                                        </span>
                                    </h1>
                                </div>
                            </div>

                            <div class="flex flex-wrap items-center gap-2">
                                {/* Revision Item 9: Realtime count label next to QR Code button */}
                                <button 
                                    onClick={() => setShowQRModal(true)}
                                    class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-2 rounded-xl border border-indigo-200 text-sm flex items-center space-x-2 transition"
                                >
                                    <span>📱 QR Code</span>
                                    <span class="bg-indigo-600 text-white px-2 py-0.5 rounded-full text-xs font-mono">
                                        在線: {studentsList.length}人
                                    </span>
                                </button>

                                {/* Revision Item 20: Teacher Demo Whiteboard Button placed next to 抽選學生 */}
                                <button 
                                    onClick={() => setShowTeacherDemoBoard(true)}
                                    class="bg-purple-600 hover:bg-purple-700 text-white font-black px-3.5 py-2 rounded-xl text-sm shadow-md transition flex items-center space-x-1"
                                >
                                    <span>🎨 示範白板</span>
                                </button>

                                <button 
                                    onClick={() => setShowRandomModal(true)}
                                    class="bg-amber-50 hover:bg-amber-100 text-amber-800 font-bold px-3 py-2 rounded-xl border border-amber-200 text-sm transition"
                                >
                                    🎲 抽選學生
                                </button>

                                <button 
                                    onClick={() => setShowTimerModal(true)}
                                    class={`px-3 py-2 rounded-xl border text-sm font-bold flex items-center space-x-1.5 transition ${
                                        timerActive 
                                        ? 'bg-amber-500 text-white border-amber-600 animate-pulse' 
                                        : 'bg-amber-50 hover:bg-amber-100 text-amber-800 border-amber-200'
                                    }`}
                                >
                                    <span>⏱️ 計時器</span>
                                    {timerSeconds > 0 && (
                                        <span class="bg-white/20 font-mono text-xs px-1.5 py-0.5 rounded">
                                            {Math.floor(timerSeconds / 60)}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                        </span>
                                    )}
                                </button>

                                <button 
                                    onClick={handleExportCSVReport}
                                    class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold px-3 py-2 rounded-xl border border-emerald-200 text-sm transition"
                                >
                                    📥 匯出成績試算表 (.csv)
                                </button>

                                <button 
                                    onClick={handleExitRoom}
                                    class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2 rounded-xl border border-rose-200 text-sm transition"
                                >
                                    🚪 退出課室
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Container */}
                    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

                        {/* Mode Selectors */}
                        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3">
                            {[
                                { id: 'CHOICE', label: '選擇題', icon: '🔘' },
                                { id: 'TF', label: '是非題', icon: '⭕' },
                                { id: 'SHORT', label: '短答題', icon: '✍️' },
                                { id: 'DRAW', label: '白板題', icon: '🎨' },
                                { id: 'BUZZER', label: '搶答題', icon: '🚨' },
                                { id: 'AUDIO', label: '錄音題', icon: '🎤' },
                                { id: 'CHALLENGE', label: '挑戰題', icon: '🏆' },
                                { id: 'LINK', label: '派送連結', icon: '🔗' }

                                <button

                                        selectedMode === mode.id

                                    <span class="text-2xl">{mode.icon}</span>

                        {/* Question Creation Panel */}

                                        >
                                            {cnt} 個選項 ({cnt === 4 ? 'A-D' : 'A-E'})
                                        </button>

                                </div>
                            )}

                            {selectedMode === 'AUDIO' && (
                                <div class="bg-cyan-50 border border-cyan-200 p-4 rounded-2xl text-cyan-900 space-y-2">

                                        <span>🎤 錄音題模式說明：</span>

                                    </p>
                                </div>

                            {/* Revision Item 10 & 11: Challenge Mode with renamed button and docx support */}

                                        </h3>
                                        <div class="flex items-center space-x-2">
                                            {/* Revision Item 10 Name change */}
                                            <button 
                                                type="button"
                                                onClick={handleDownloadChallengeTemplate}
                                                class="bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow transition flex items-center gap-1.5"
                                            >
                                                <span>📄 下載評估範本Word檔</span>
                                            </button>
                                        </div>
                                    </div>

                                    <div class="bg-white p-4 rounded-xl border border-amber-200 space-y-3">
                                        <label class="block text-xs font-bold text-slate-700">
                                            1. 上載評估範本 Word 文件 (.docx) 或文字檔 (.txt)：
                                        </label>
                                        <input 
                                            type="file" 
                                            accept=".docx,.txt"
                                            onChange={handleWordFileUpload}
                                            class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-600 file:text-white hover:file:bg-amber-700 cursor-pointer"
                                        />

                                        {/* Revision Item 10: Teacher Edit / Confirm Assessment Content */}
                                        {challengeData && (
                                            <div class="bg-amber-50/90 p-4 rounded-xl border-2 border-amber-300 space-y-4">
                                                <div class="flex flex-wrap items-center justify-between gap-2 border-b border-amber-200 pb-2">
                                                    <span class="font-black text-amber-900 text-sm">✏️ 教師編輯/確認評估內容：</span>
                                                    <span class="text-xs text-amber-700 font-bold">可修改內容、正確答案及刪除每題題目</span>
                                                </div>

                                                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                                                    <div class="md:col-span-2">
                                                        <label class="block text-xs font-bold text-slate-600 mb-1">評估標題：</label>
                                                        <input 
                                                            type="text" 
                                                            value={challengeData.title}
                                                            onChange={(e) => handleUpdateChallengeTitle(e.target.value)}
                                                            class="w-full px-3 py-2 rounded-lg border focus:ring-2 focus:ring-amber-500 font-bold text-slate-800 text-sm bg-white"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label class="block text-xs font-bold text-slate-600 mb-1">總分：</label>
                                                        <input 
                                                            type="number" 
                                                            value={challengeData.totalScore}
                                                            onChange={(e) => handleUpdateChallengeScore(e.target.value)}
                                                            class="w-full px-3 py-2 rounded-lg border focus:ring-2 focus:ring-amber-500 font-bold text-slate-800 text-sm bg-white"
                                                        />
                                                    </div>
                                                </div>

                                                <div class="space-y-3 max-h-80 overflow-y-auto pr-1">
                                                    {challengeData.questions.map((q, qIdx) => (
                                                        <div key={qIdx} class="bg-white p-3.5 rounded-xl border border-amber-200 space-y-2.5 text-xs shadow-sm">
                                                            <div class="flex items-center justify-between gap-2">
                                                                <div class="flex items-center gap-2 flex-1">
                                                                    <span class="font-black text-amber-900 whitespace-nowrap">第 {q.num || qIdx + 1} 題:</span>
                                                                    <input 
                                                                        type="text"
                                                                        value={q.text}
                                                                        onChange={(e) => handleUpdateQuestionText(qIdx, e.target.value)}
                                                                        class="w-full px-2 py-1.5 border rounded font-medium text-slate-800 focus:ring-1 focus:ring-amber-500"
                                                                    />
                                                                </div>
                                                                <button 
                                                                    type="button"
                                                                    onClick={() => handleDeleteQuestion(qIdx)}
                                                                    class="px-2.5 py-1 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-lg text-xs flex items-center gap-1 border border-red-200 transition active:scale-95"
                                                                >
                                                                    🗑️ 刪除
                                                                </button>
                                                            </div>

                                                            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 pl-4">
                                                                {q.options.map((opt, optIdx) => (

                                                                            value={opt.text}
                                                                            onChange={(e) => handleUpdateOptionText(qIdx, optIdx, e.target.value)}
                                                                            class="flex-1 px-2 py-1 border rounded text-slate-700 focus:ring-1 focus:ring-amber-500"
                                                                        />
                                                                    </div>
                                                                ))}
                                                            </div>

                                                            <div class="flex items-center space-x-2 pt-1 border-t border-slate-100 pl-4">
                                                                <span class="font-bold text-emerald-700">正確答案：</span>
                                                                {['A', 'B', 'C', 'D'].map((letter) => (
                                                                    <label key={letter} class="flex items-center space-x-1 cursor-pointer font-bold">
                                                                        <input 
                                                                            type="radio" 
                                                                            name={`ans_q_${qIdx}`} 
                                                                            checked={q.answer === letter}
                                                                            onChange={() => handleUpdateCorrectAnswer(qIdx, letter)}
                                                                            class="accent-emerald-600"
                                                                        />
                                                                        <span class={q.answer === letter ? 'text-emerald-700 font-black' : 'text-slate-500'}>{letter}</span>
                                                                    </label>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Revision Item 11: Challenge Timer Settings (Presets 1-5m + 00:00 manual input) */}
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-white p-4 rounded-xl border border-amber-200">
                                        <div class="space-y-2">
                                            <div class="flex items-center justify-between">
                                                <label class="text-xs font-bold text-slate-700">2. 開啟答題限時模式 (預設2分鐘)：</label>
                                                <input 
                                                    type="checkbox" 
                                                    checked={challengeEnableTimer}
                                                    onChange={(e) => setChallengeEnableTimer(e.target.checked)}
                                                    class="w-4 h-4 accent-amber-600 rounded cursor-pointer"
                                                />
                                            </div>
                                            {challengeEnableTimer && (
                                                <div class="space-y-2 pt-1">
                                                    <div class="flex flex-wrap items-center gap-1.5">
                                                        <span class="text-xs text-slate-500 font-bold">快速快捷鍵：</span>
                                                        {[60, 120, 180, 240, 300].map(s => (
                                                            <button 
                                                                key={s} 
                                                                type="button"
                                                                onClick={() => setChallengeTimeLimit(s)}
                                                                class={`px-2 py-1 text-xs rounded-lg font-bold border transition ${challengeTimeLimit === s ? 'bg-amber-600 text-white border-amber-600' : 'bg-slate-50 text-slate-700 hover:bg-slate-100'}`}
                                                            >
                                                                {s / 60}分鐘
                                                            </button>
                                                        ))}
                                                    </div>
                                                    {/* Manual 00:00 Input */}
                                                    <div class="flex items-center space-x-2 pt-1">
                                                        <span class="text-xs font-bold text-amber-900">手動輸入時間 (00:00)：</span>
                                                        <div class="flex items-center space-x-1 border rounded-lg px-2 py-1 bg-white focus-within:ring-2 focus-within:ring-amber-500 shadow-sm">
                                                            <input 
                                                                type="number"
                                                                min="0"
                                                                max="99"
                                                                value={String(Math.floor(challengeTimeLimit / 60)).padStart(2, '0')}
                                                                onChange={(e) => {
                                                                    const mins = Math.max(0, parseInt(e.target.value) || 0);
                                                                    const secs = challengeTimeLimit % 60;
                                                                    setChallengeTimeLimit(mins * 60 + secs);
                                                                }}
                                                                class="w-8 text-xs font-mono font-bold text-center outline-none bg-transparent"
                                                                placeholder="00"
                                                            />
                                                            <span class="font-mono font-bold text-amber-900 text-xs">:</span>
                                                            <input 
                                                                type="number"
                                                                min="0"
                                                                max="59"
                                                                value={String(challengeTimeLimit % 60).padStart(2, '0')}
                                                                onChange={(e) => {
                                                                    const mins = Math.floor(challengeTimeLimit / 60);
                                                                    const secs = Math.min(59, Math.max(0, parseInt(e.target.value) || 0));
                                                                    setChallengeTimeLimit(mins * 60 + secs);
                                                                }}
                                                                class="w-8 text-xs font-mono font-bold text-center outline-none bg-transparent"
                                                                placeholder="00"
                                                            />
                                                        </div>
                                                    </div>
                                                </div>

                                        </div>

                                        {/* Revision Item 12: Score Release Control */}
