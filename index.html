        // Web Audio Synthesizer
        let coopMusicOsc = null;
        let coopMusicInterval = null;

        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                    });
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.setValueAtTime(160, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (

                </div>
            );
        };

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) throw new Error("JSZip library is not loaded.");
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>${paragraphsXml}</w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];
            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) {
                        questions.push(currentQ);
                    }
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }

                    currentQ.options.push({ letter: letter, text: optText });
                    if (isCorrect) currentQ.answer = letter;
                }
            });

            if (currentQ && currentQ.options.length > 0) {
                questions.push(currentQ);
            }

            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1,
                            text: "以下哪一項不是地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "機械資源" }
                            ],
                            answer: "D"
                        },
                        {
                            num: 2,
                            text: "芝士的原料屬於哪一項地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "礦產資源" }
                            ],
                            answer: "C"
                        }
                    ]
                };
            }

            return { title, totalScore, questions };
        };

        const WhiteboardCanvas = ({ bgImage, initialData, onSave, isReadOnly = false, strokeColor = "#2563eb", strokeWidth = 4, isEraser = false }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                // Draw background or initial data
                const renderCanvas = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    if (bgImage) {
                        const img = new Image();
                        img.crossOrigin = "Anonymous";
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            if (initialData) {
                                const prevImg = new Image();
                                prevImg.onload = () => ctx.drawImage(prevImg, 0, 0);
                                prevImg.src = initialData;
                            }
                        };
                        img.src = bgImage;
                    } else {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        if (initialData) {
                            const prevImg = new Image();
                            prevImg.onload = () => ctx.drawImage(prevImg, 0, 0);
                            prevImg.src = initialData;
                        }
                    }
                };
                renderCanvas();
            }, [bgImage, initialData]);

            // Precise Ratio Mapping Formulas (scaleX / scaleY)
            const getCanvasCoords = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                if (isReadOnly) return;
                e.preventDefault();
                setIsDrawing(true);
                const coords = getCanvasCoords(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(coords.x, coords.y);
            };

            const draw = (e) => {
                if (!isDrawing || isReadOnly) return;
                e.preventDefault();
                const coords = getCanvasCoords(e);
                const ctx = canvasRef.current.getContext('2d');

                ctx.lineWidth = strokeWidth * 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (isEraser) {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.arc(coords.x, coords.y, strokeWidth * 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = strokeColor;
                    ctx.lineTo(coords.x, coords.y);
                    ctx.stroke();
                }
            };

            const stopDrawing = () => {
                if (!isDrawing || isReadOnly) return;
                setIsDrawing(false);
                if (onSave) {
                    const canvas = canvasRef.current;
                    onSave(canvas.toDataURL('image/png'));
                }
            };

            return (
                <div class="canvas-container relative w-full aspect-16-9 bg-slate-200 rounded-2xl overflow-hidden shadow-inner border border-slate-300">
                    <canvas
                        ref={canvasRef}
                        width={1280}
                        height={720}
                        class="w-full h-full block touch-none cursor-crosshair bg-white"
                        onMouseDown={startDrawing}
                        onMouseMove={draw}
                        onMouseUp={stopDrawing}
                        onMouseLeave={stopDrawing}
                        onTouchStart={startDrawing}
                        onTouchMove={draw}
                        onTouchEnd={stopDrawing}
                    />
                </div>
            );
        };

        function OMITApp() {
            const [role, setRole] = useState('LANDING'); // 'LANDING', 'TEACHER', 'STUDENT'
            const [roomCode, setRoomCode] = useState('');
            const [seatNumber, setSeatNumber] = useState('1');

            const [toast, setToast] = useState(null);

            const [activeQuestion, setActiveQuestion] = useState(null);
            const [studentsList, setStudentsList] = useState([]);
            const [responses, setResponses] = useState({});
            const [historyQuestions, setHistoryQuestions] = useState([]);
            const [isAuthReady, setIsAuthReady] = useState(false);

            const myStudentId = useRef('std_' + Math.random().toString(36).substring(2, 9));

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (window.fbUtils && window.fbAuth) {
                            await window.fbUtils.signInAnonymously(window.fbAuth);
                            setIsAuthReady(true);
                        }
                    } catch (err) {
                        console.error("Firebase auth failed:", err);
                    }
                };
                initAuth();
            }, []);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const roomParam = params.get('room');
                if (roomParam) setRoomCode(roomParam.toUpperCase());
            }, []);

            useEffect(() => {
                if (!roomCode || !isAuthReady) return;

                const appId = "omit-8c173";
                const db = window.fbDb;
                const { doc, onSnapshot, collection } = window.fbUtils;

                const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                const studentsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                const responsesColRef = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');

                const unsubRoom = onSnapshot(roomDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setActiveQuestion(data.activeQuestion || null);
                        if (data.history) setHistoryQuestions(data.history);
                    }
                }, (err) => console.error("Room sub error:", err));

                const unsubStudents = onSnapshot(studentsColRef, (snapshot) => {
                    const list = [];
                    snapshot.forEach((d) => list.push(d.data()));
                    setStudentsList(list);
                }, (err) => console.error("Students sub error:", err));

                const unsubResponses = onSnapshot(responsesColRef, (snapshot) => {
                    const resMap = {};
                    snapshot.forEach((d) => {
                        resMap[d.id] = d.data();
                    });
                    setResponses(resMap);
                }, (err) => console.error("Responses sub error:", err));

                return () => {
                    unsubRoom();
                    unsubStudents();
                    unsubResponses();
                };
            }, [roomCode, isAuthReady]);

            const handleTeacherAccessRequest = () => {
                setShowPasswordModal(true);
                setTeacherPassword('');
            };

            const verifyTeacherPassword = (e) => {
                e?.preventDefault();
                if (teacherPassword === '8030') {
                    const generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
                    setRoomCode(generatedCode);
                    setRole('TEACHER');
                    setShowPasswordModal(false);
                    showToast(`密碼正確！已建立課堂 房號：${generatedCode}`, 'success');

                    showToast('密碼錯誤，請重新輸入！', 'error');

            const handleJoinRoom = (e) => {
                e?.preventDefault();
                if (!roomCode.trim()) {
                    showToast('請輸入6位數字房號', 'error');
                    return;
                }

                const studentObj = {
                    id: myStudentId.current,
                    seatNumber: seatNumber,
                    name: studentName.trim() || `學號 ${seatNumber}`,
                    joinTime: new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                };

                const appId = "omit-8c173";
                const db = window.fbDb;
                const studentDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students', myStudentId.current);

                setRole('STUDENT');
                showToast(`已進入房號 ${roomCode} 的課堂`, 'success');
            };

            if (role === 'LANDING') {
                return (
                    <div class="min-h-screen bg-gradient-to-br from-indigo-900 via-indigo-800 to-purple-900 flex items-center justify-center p-4">
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

                                            <select 
                                                value={seatNumber}
                                                onChange={(e) => setSeatNumber(e.target.value)}
                                                class="w-full px-3 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-bold text-center"
                                            >
                                                {Array.from({ length: 36 }, (_, i) => i + 1).map((num) => (
                                                    <option key={num} value={num}>{num} 號</option>

                                        <div class="col-span-2">

                                            <input

                                                placeholder="輸入姓名 / 暱稱" 
                                                value={studentName} 
                                                onChange={(e) => setStudentName(e.target.value)}
                                                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-medium"
                                            />
                                        </div>
                                    </div>

                                    <button 
                                        type="submit" 
                                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-200 active:scale-98"

                                <div class="relative flex py-1 items-center">
                                    <div class="flex-grow border-t border-slate-200"></div>

                                <div class="text-center">
                                    <button 
                                        onClick={handleTeacherAccessRequest}
                                        class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl transition shadow-md flex items-center justify-center space-x-2 active:scale-98"

                        {showPasswordModal && (
                            <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                                <div class="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
                                    <h3 class="text-lg font-bold text-slate-800 text-center">請輸入教師密碼</h3>
                                    <form onSubmit={verifyTeacherPassword} class="space-y-4">
                                        <input 
                                            type="password" 
                                            value={teacherPassword}
                                            onChange={(e) => setTeacherPassword(e.target.value)}
                                            class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 text-center font-mono text-xl tracking-widest"
                                            autoFocus
                                        />
                                        <div class="flex space-x-2">
                                            <button 
                                                type="button" 
                                                onClick={() => setShowPasswordModal(false)}
                                                class="w-1/2 py-2.5 rounded-xl bg-slate-100 font-medium text-slate-600 hover:bg-slate-200"
                                            >
                                                取消
                                            </button>
                                            <button 
                                                type="submit" 
                                                class="w-1/2 py-2.5 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-700 shadow-md"
                                            >
                                                確認進入
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            if (role === 'TEACHER') {
                return (
                    <TeacherDashboard 
                        roomCode={roomCode} 
                        activeQuestion={activeQuestion} 
                        setActiveQuestion={setActiveQuestion}
                        responses={responses}
                        setResponses={setResponses}
                        studentsList={studentsList}
                        historyQuestions={historyQuestions}
                        setHistoryQuestions={setHistoryQuestions}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            if (role === 'STUDENT') {
                return (
                    <StudentInterface 
                        roomCode={roomCode}
                        studentName={studentName}
                        seatNumber={seatNumber}
                        studentId={myStudentId.current}
                        activeQuestion={activeQuestion}
                        responses={responses}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            return null;
        }

        function TeacherDashboard({ roomCode, activeQuestion, setActiveQuestion, responses, setResponses, studentsList, historyQuestions, setHistoryQuestions, showToast, onExit }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE');
            const [questionText, setQuestionText] = useState('');
            const [choiceCount, setChoiceCount] = useState(4);
            const [lockAfterSubmit, setLockAfterSubmit] = useState(true);
            const [whiteboardBg, setWhiteboardBg] = useState(null);
            const [pushedUrl, setPushedUrl] = useState('');

            // Modals & Tools
            const [showQRModal, setShowQRModal] = useState(false);
            const [showStudentListModal, setShowStudentListModal] = useState(false);
            const [showInspectModal, setShowInspectModal] = useState(null);
            const [showDemoWhiteboard, setShowDemoWhiteboard] = useState(false);
            const [demoStrokeWidth, setDemoStrokeWidth] = useState(4);
            const [demoIsEraser, setDemoIsEraser] = useState(false);
            const [demoStrokeColor, setDemoStrokeColor] = useState('#2563eb');
            const [demoCanvasData, setDemoCanvasData] = useState(null);

            // Random Selector State
            const [showRandomModal, setShowRandomModal] = useState(false);
            const [rangeStart, setRangeStart] = useState(1);
            const [rangeEnd, setRangeEnd] = useState(36);
            const [drawnNumbers, setDrawnNumbers] = useState([]);
            const [currentDrawn, setCurrentDrawn] = useState(null);
            const [isSpinning, setIsSpinning] = useState(false);

            // Timer Modal State
            const [showTimerModal, setShowTimerModal] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerActive, setTimerActive] = useState(false);
            const [timerZoomed, setTimerZoomed] = useState(false);
            const [customTimerMin, setCustomTimerMin] = useState('01');
            const [customTimerSec, setCustomTimerSec] = useState('00');

            // Challenge Question Setup States
            const [challengeData, setChallengeData] = useState(null);
            const [challengeEnableTimer, setChallengeEnableTimer] = useState(true);
            const [challengeTimeMin, setChallengeTimeMin] = useState('02');
            const [challengeTimeSec, setChallengeTimeSec] = useState('00');
            const [challengeReleaseInstant, setChallengeReleaseInstant] = useState(false);
            const [showChallengeScoresOnLeaderboard, setShowChallengeScoresOnLeaderboard] = useState(true);
            const [docxFileName, setDocxFileName] = useState('');

            // Coop Mode Setup States
            const [coopData, setCoopData] = useState(null);

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

            // Filter current responses for active question
            const currentQuestionResponses = useMemo(() => {
                if (!activeQuestion) return {};
                const filtered = {};
                Object.values(responses).forEach(r => {
                    if (r.questionId === activeQuestion.id) {
                        filtered[r.studentId] = r;
                    }
                });
                return filtered;
            }, [responses, activeQuestion]);

            // Sorted responses for Leaderboard
            const sortedResponsesList = useMemo(() => {
                const list = Object.values(currentQuestionResponses);
                return list.sort((a, b) => (a.submitTimestamp || 0) - (b.submitTimestamp || 0));
            }, [currentQuestionResponses]);

            // Timer Interval Logic
            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(s => {
                            if (s <= 1) {
                                setTimerActive(false);
                                playSound('alarm');
                                return 0;
                            }
                            return s - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            // Sync Question & History to Firestore
            const publishQuestionToFirestore = async (qObj, newHistoryList) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatePayload = {
                    activeQuestion: qObj,
                    updatedAt: Date.now()
                };
                if (newHistoryList) updatePayload.history = newHistoryList;

                await window.fbUtils.setDoc(roomDocRef, updatePayload, { merge: true });
            };

            const handleExitRoom = async () => {
                if (window.confirm("確定退出課室？將會同步清空此課室於 Firebase 的所有暫存紀錄！")) {
                    try {
                        const appId = "omit-8c173";
                        const db = window.fbDb;
                        
                        const responsesColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');
                        const resSnaps = await window.fbUtils.getDocs(responsesColRef);
                        resSnaps.forEach(async (d) => { await window.fbUtils.deleteDoc(d.ref); });

                        const studentsColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                        const stuSnaps = await window.fbUtils.getDocs(studentsColRef);
                        stuSnaps.forEach(async (d) => { await window.fbUtils.deleteDoc(d.ref); });

                        const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                        await window.fbUtils.deleteDoc(roomDocRef);

                        showToast("課室暫存資料已完全清空！", "info");
                    } catch (e) {
                        console.error("Cleanup error:", e);
                    }
                    onExit();
                }
            };

            const handleDownloadChallengeTemplate = async () => {
                const sampleLines = [
                    "標題：地球生病了",
                    "總分: 100分",
                    "1.以下哪一項不是地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源",
                    "D. 機械資源*",
                    "",
                    "2.芝士的原料屬於哪一項地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源*",
                    "D. 礦產資源",
                    "",
                    "3.人們不當使用水資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應*",
                    "",
                    "4.人們不當使用煤和石油資源會造成甚麼後果?",
                    "A. 引發極端天氣*",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應",
                    "",
                    "5.人們不當使用土地資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災*",
                    "C. 產生大量二氧化碳",
                    "D. 影響食水供應"
                ];

                try {
                    const blob = await createWordDocxBlob(sampleLines);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = '下載評估範本Word檔.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast("已下載 Assessment Word 範本檔 (.docx)！", "success");
                } catch (err) {
                    console.error("Docx generation error:", err);
                    showToast("無法生成 Word 範本檔", "error");
                }
            };

            const handleWordFileUpload = (e, isCoop = false) => {
                const file = e.target.files[0];
                if (!file) return;

                setDocxFileName(file.name);
                const reader = new FileReader();

                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const arrayBuffer = evt.target.result;
                            const result = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                            parsedData = parseWordChallengeText(result.value);
                        } else {
                            const text = evt.target.result;
                            parsedData = parseWordChallengeText(text);
                        }

                        if (isCoop) {
                            setCoopData({ ...parsedData, stage: 'PREPARE' });
                        } else {
                            setChallengeData(parsedData);
                        }
                        showToast(`已成功解析範本檔案！共 ${parsedData.questions.length} 題`, 'success');
                    } catch (err) {
                        console.error("Word file parse error:", err);
                        showToast("文件解析失敗，請確認格式！", "error");
                    }
                };

                if (file.name.endsWith('.docx')) {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file, "UTF-8");
                }
            };

            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                
                let challengeContent = null;
                let coopContent = null;

                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請先上載並解析 Word 評估範本檔案！", "error");
                        return;
                    }
                    const totalSecs = (parseInt(challengeTimeMin) || 0) * 60 + (parseInt(challengeTimeSec) || 0);
                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? totalSecs : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                if (selectedMode === 'COOP') {
                    if (!coopData || !coopData.questions || coopData.questions.length === 0) {
                        showToast("請先上載並解析合作題 Word 評估範本檔！", "error");
                        return;
                    }
                    coopContent = {
                        title: coopData.title,
                        questions: coopData.questions,
                        stage: 'PREPARE',
                        groups: [],
                        groupScores: {},
                        winnerGroup: null
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : 
                          selectedMode === 'COOP' ? `🤝 合作題：${coopData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent,
                    coop: coopContent
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);
                publishQuestionToFirestore(newQ, updatedHistory);
                showToast(`已發佈【${getModeLabel(selectedMode)}】！`, 'success');
            };

            const handleStartCoopGrouping = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'COOP') return;
                
                // Randomly partition active students into groups
                const shuffledStudents = [...studentsList].sort(() => Math.random() - 0.5);
                const teamCount = Math.min(Math.max(2, Math.ceil(shuffledStudents.length / 3)), ANIMAL_TEAMS.length);
                const assignedTeams = ANIMAL_TEAMS.slice(0, teamCount);

                const groupsMap = assignedTeams.map((team, idx) => ({
                    ...team,
                    id: `group_${idx}`,
                    members: []
                }));

                shuffledStudents.forEach((student, idx) => {
                    const groupIdx = idx % teamCount;
                    groupsMap[groupIdx].members.push(student);
                });

                const groupScores = {};
                groupsMap.forEach(g => { groupScores[g.id] = 0; });

                const updatedQ = {
                    ...activeQuestion,
                    coop: {
                        ...activeQuestion.coop,
                        stage: 'GROUPING',
                        groups: groupsMap,
                        groupScores: groupScores,
                        winnerGroup: null
                    }
                };

                await publishQuestionToFirestore(updatedQ);
                showToast("已完成分組！已向所有學生發送分組資訊", "success");
            };

            const handleStartCoopRace = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'COOP') return;
                const updatedQ = {
                    ...activeQuestion,
                    coop: {
                        ...activeQuestion.coop,
                        stage: 'RACE'
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("合作題比賽正式開始！🔥", "success");
            };

            const handleBroadcastTeacherDemoWhiteboard = async () => {
                if (!demoCanvasData) return;
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatedQ = {
                    ...activeQuestion,
                    teacherWhiteboardBroadcast: demoCanvasData,
                    broadcastedSubmission: null
                };
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                showToast("已成功將教師白板廣播至所有學生螢幕！", "success");
            };

            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已一併發放全班挑戰題成績！", "success");
            };

            const handleExportCSVReport = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生紀錄可供匯出！", "error");
                    return;
                }

                let csvContent = "\uFEFF學號,學生姓名,總分,正確率,作答用時,細項答案\n";

                studentsList.forEach(student => {
                    const res = currentQuestionResponses[student.id];
                    let scoreStr = "N/A";
                    let accuracyStr = "N/A";
                    let durationStr = "N/A";
                    let detailAns = "N/A";

                    if (res) {
                        if (res.score !== undefined) scoreStr = `${res.score}分`;
                        if (res.accuracy !== undefined) accuracyStr = `${res.accuracy}%`;
                        if (res.duration) durationStr = `${res.duration}秒`;
                        if (res.answer) detailAns = typeof res.answer === 'object' ? JSON.stringify(res.answer).replace(/"/g, '""') : String(res.answer).replace(/"/g, '""');
                    }

                    csvContent += `"${student.seatNumber}","${student.name || ''}","${scoreStr}","${accuracyStr}","${durationStr}","${detailAns}"\n`;
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `挑戰題成績匯出_房號${roomCode}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                showToast("已下載挑戰題成績試算表 (.csv)！", "success");
            };

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col">
                    {/* Teacher Top Navigation */}
                    <header class="bg-slate-900 text-white shadow-xl sticky top-0 z-40">
                        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
                            <div class="flex items-center space-x-3">
                                <span class="bg-indigo-600 text-white px-3 py-1 rounded-lg font-black text-sm tracking-wider">OMIT</span>
                                <h1 class="text-lg md:text-xl font-bold tracking-tight">宣道會陳元喜小學OMIT互動課堂</h1>
                                <span class="bg-slate-800 text-indigo-300 px-3 py-1 rounded-full text-xs font-mono font-bold border border-slate-700">
                                    房號: {roomCode}
                                </span>
                            </div>

                            <div class="flex items-center flex-wrap gap-2">
                                {/* Demo Whiteboard Button */}
                                <button 
                                    onClick={() => setShowDemoWhiteboard(true)}
                                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-xl font-bold text-xs flex items-center space-x-1 shadow transition"
                                >
                                    <span>🎨 演示白板</span>
                                </button>

                                {/* Random Selector Button */}
                                <button 
                                    onClick={() => setShowRandomModal(true)}
                                    class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-xl font-bold text-xs flex items-center space-x-1 shadow transition"
                                >
                                    <span>🎰 抽選學生</span>
                                </button>

                                {/* Timer Button */}
                                <button 
                                    onClick={() => setShowTimerModal(true)}
                                    class="bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 rounded-xl font-bold text-xs flex items-center space-x-1 font-mono shadow transition"
                                >
                                    <span>⏱️ 計時器 {timerSeconds > 0 && `(${Math.floor(timerSeconds/60).toString().padStart(2,'0')}:${(timerSeconds%60).toString().padStart(2,'0')})`}</span>
                                </button>

                                {/* QR Code & Online Badge */}
                                <button 
                                    onClick={() => setShowQRModal(true)}
                                    class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl font-bold text-xs flex items-center space-x-2 border border-slate-700 shadow transition"
                                >
                                    <span>📱 課堂QR</span>
                                    <span class="bg-emerald-500 text-slate-900 px-2 py-0.5 rounded-full text-[10px] font-black">
                                        🟢 {studentsList.length} 人在線
                                    </span>
                                </button>

                                {/* Student List Monitor Modal Trigger */}

        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
            const [myAnswer, setMyAnswer] = useState('');
            const [myWhiteboardData, setMyWhiteboardData] = useState(null);
            const [wbStrokeWidth, setWbStrokeWidth] = useState(4);
            const [wbIsEraser, setWbIsEraser] = useState(false);
            const [wbColor, setWbColor] = useState('#2563eb');
            const [isSubmitted, setIsSubmitted] = useState(false);

            // Audio recording state
            const [isRecording, setIsRecording] = useState(false);
            const [recordedAudioUrl, setRecordedAudioUrl] = useState(null);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            // Challenge answers state
            const [challengeStudentAnswers, setChallengeStudentAnswers] = useState({});
            const [challengeRemainingSec, setChallengeRemainingSec] = useState(null);

            // Check if current question response exists
            const existingResponse = useMemo(() => {
                if (!activeQuestion) return null;
                return responses[`res_${activeQuestion.id}_${studentId}`];
            }, [responses, activeQuestion, studentId]);

            useEffect(() => {
                if (existingResponse) {
                    setIsSubmitted(true);
                } else {
                    setIsSubmitted(false);
                    setMyAnswer('');
                    setMyWhiteboardData(null);
                    setRecordedAudioUrl(null);
                    setChallengeStudentAnswers({});
                }
            }, [activeQuestion, existingResponse]);

            // Challenge timer countdown logic
            useEffect(() => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE' || !activeQuestion.challenge?.enableTimer) {
                    setChallengeRemainingSec(null);
                    return;
                }

                const timeLimit = activeQuestion.challenge.timeLimit || 120;
                const elapsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                const remain = Math.max(0, timeLimit - elapsed);
                setChallengeRemainingSec(remain);

                const timer = setInterval(() => {
                    setChallengeRemainingSec(r => {
                        if (r <= 1) {
                            clearInterval(timer);
                            // Auto submit challenge on timeout
                            if (!isSubmitted) handleConfirmSubmitChallenge();
                            return 0;
                        }
                        return r - 1;
                    });
                }, 1000);

                return () => clearInterval(timer);
            }, [activeQuestion, isSubmitted]);

            // Submit Answer Handler
            const handleSubmitAnswer = async (ans) => {
                if (!activeQuestion) return;

                const appId = "omit-8c173";
                const db = window.fbDb;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', `res_${activeQuestion.id}_${studentId}`);

                const duration = Math.max(1, Math.floor((Date.now() - activeQuestion.startTime) / 1000));
                const submitTimeStr = new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                const payload = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: ans,
                    duration: duration,
                    submitTimestamp: Date.now(),
                    submitTime: submitTimeStr
                };

                await window.fbUtils.setDoc(resDocRef, payload);
                setIsSubmitted(true);
                playSound('win');
            };

            const handleConfirmSubmitChallenge = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;

                const questions = activeQuestion.challenge.questions;
                let correctCount = 0;
                questions.forEach(q => {
                    if (challengeStudentAnswers[q.num] === q.answer) correctCount++;
                });

                const totalScore = activeQuestion.challenge.totalScore || 100;
                const scorePerQ = totalScore / questions.length;
                const finalScore = Math.round(correctCount * scorePerQ);
                const accuracy = Math.round((correctCount / questions.length) * 100);

                const appId = "omit-8c173";
                const db = window.fbDb;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', `res_${activeQuestion.id}_${studentId}`);

                const duration = Math.max(1, Math.floor((Date.now() - activeQuestion.startTime) / 1000));

                const payload = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: challengeStudentAnswers,
                    score: finalScore,
                    accuracy: accuracy,
                    correctCount: correctCount,
                    totalQuestions: questions.length,
                    duration: duration,
                    submitTimestamp: Date.now(),
                    submitTime: new Date().toLocaleTimeString('zh-HK')
                };

                await window.fbUtils.setDoc(resDocRef, payload);
                setIsSubmitted(true);
                playSound('win');
            };

            const handleCoopOptionTap = async (optLetter) => {
                if (!activeQuestion || activeQuestion.mode !== 'COOP' || activeQuestion.coop.stage !== 'RACE') return;

                const coop = activeQuestion.coop;
                const myGroup = coop.groups.find(g => g.members.some(m => m.id === studentId));
                if (!myGroup) return;

                const currScore = coop.groupScores[myGroup.id] || 0;
                const currentQuestionObj = coop.questions[currScore];

                if (!currentQuestionObj) return;

                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                if (optLetter === currentQuestionObj.answer) {
                    // Correct! Advance group score by 1
                    playSound('win');
                    const newScore = currScore + 1;
                    const updatedScores = { ...coop.groupScores, [myGroup.id]: newScore };

                    let winner = coop.winnerGroup;
                    if (newScore >= coop.questions.length && !winner) {
                        winner = myGroup;
                    }

                    const updatedQ = {
                        ...activeQuestion,
                        coop: {
                            ...coop,
                            groupScores: updatedScores,
                            winnerGroup: winner
                        }
                    };
                    await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                } else {
                    // Wrong! Reset group progress back to 0!
                    playSound('wrong');
                    const updatedScores = { ...coop.groupScores, [myGroup.id]: 0 };
                    const updatedQ = {
                        ...activeQuestion,
                        coop: {
                            ...coop,
                            groupScores: updatedScores
                        }
                    };
                    await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                    showToast("答錯了！該組進度回歸起點重新開始！", "error");
                }
            };

            // Audio recording handlers
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            setRecordedAudioUrl(reader.result);
                        };
                        reader.readAsDataURL(blob);
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                } catch (err) {
                    console.error("Mic error:", err);
                    showToast("無法存取麥克風權限", "error");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col">
                    {/* Student Top Header */}
                    <header class="bg-indigo-900 text-white shadow-lg p-4 sticky top-0 z-40">
                        <div class="max-w-3xl mx-auto flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <span class="bg-indigo-600 text-white text-xs px-2.5 py-1 rounded-lg font-black">OMIT</span>
                                <span class="font-bold text-sm">宣道會陳元喜小學</span>
                            </div>

                            <div class="flex items-center space-x-3">
                                <span class="bg-indigo-800 text-indigo-200 text-xs px-3 py-1 rounded-full font-bold border border-indigo-700">
                                    {seatNumber}號 {studentName}
                                </span>
                                <button onClick={onExit} class="text-xs text-indigo-300 hover:text-white font-bold">退出</button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content View */}
                    <main class="max-w-3xl w-full mx-auto p-4 flex-grow space-y-6">
                        
                        {/* Broadcast Teacher Whiteboard Overlay */}
                        {activeQuestion?.teacherWhiteboardBroadcast && (
                            <div class="bg-slate-900 text-white p-4 rounded-3xl shadow-xl space-y-3 animate-fade-in border border-indigo-500">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs font-black text-indigo-400 uppercase tracking-wider">📡 正在接收教師演示白板</span>
                                </div>
                                <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden">
                                    <img src={activeQuestion.teacherWhiteboardBroadcast} class="w-full h-full object-contain" />
                                </div>
                            </div>
                        )}

                        {/* Peer Broadcast Student Work Overlay */}
                        {activeQuestion?.broadcastedSubmission && (
                            <div class="bg-indigo-950 text-white p-4 rounded-3xl shadow-xl space-y-3 animate-fade-in border border-cyan-400">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs font-black text-cyan-400 uppercase tracking-wider">
                                        🌟 互評廣播：{activeQuestion.broadcastedSubmission.seatNumber}號 {activeQuestion.broadcastedSubmission.name} 的白板作品
                                    </span>
                                </div>
                                <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden">
                                    <img src={activeQuestion.broadcastedSubmission.answer} class="w-full h-full object-contain" />
                                </div>
                            </div>

                        {!activeQuestion ? (
                            /* Waiting State */
                            <div class="bg-white rounded-3xl p-12 text-center shadow-xl space-y-4 border border-slate-200">

                                </div>

                                    <span class="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full text-xs font-black">
                                        {getModeLabel(activeQuestion.mode)}
                                    </span>
                                    {challengeRemainingSec !== null && (
                                        <span class="text-xs font-mono font-bold bg-amber-100 text-amber-900 px-3 py-1 rounded-full border border-amber-300">
                                            ⏱️ 剩餘時間: {Math.floor(challengeRemainingSec / 60).toString().padStart(2, '0')}:{(challengeRemainingSec % 60).toString().padStart(2, '0')}
                                        </span>
                                    )}
                                </div>

                                <h2 class="text-lg md:text-xl font-black text-slate-800 leading-snug">
                                    {activeQuestion.text}
                                </h2>

                                {/* Dynamic Sub-Interface by Mode */}
                                {isSubmitted && activeQuestion.mode !== 'COOP' ? (
                                    /* Submitted Feedback Screen */
                                    <div class="bg-emerald-50 p-8 rounded-3xl border border-emerald-200 text-center space-y-4 animate-fade-in">

                                        <h3 class="text-xl font-black text-emerald-900">已提交答案! 讚賞你的努力!</h3>
                                        <p class="text-xs font-bold text-emerald-700">安靜等候老師指示...</p>

                                        {/* Challenge mode breakdown if released */}
                                        {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge?.scoresReleased && existingResponse && (
                                            <div class="mt-6 text-left bg-white p-4 rounded-2xl border border-emerald-200 space-y-3">

                                                    <span class="text-xl font-black text-indigo-600">{existingResponse.score} 分</span>
                                                </div>

                                                <div class="space-y-3 pt-2">
                                                    {activeQuestion.challenge.questions.map(q => {
                                                        const myAns = existingResponse.answer?.[q.num];
                                                        const isCorrect = myAns === q.answer;

                                                        return (
                                                            <div key={q.num} class={`p-3 rounded-xl border text-xs space-y-1 ${isCorrect ? 'bg-emerald-50/60 border-emerald-300' : 'bg-rose-50/60 border-rose-300'}`}>

                                                                <div class="grid grid-cols-2 gap-1 text-[11px] pt-1">
                                                                    {q.options.map(opt => {

                                                                        return (
                                                                            <span 
                                                                                key={opt.letter} 
                                                                                class={`px-2 py-1 rounded font-medium ${
                                                                                    isRightOpt ? 'bg-emerald-500 text-white font-bold' :
                                                                                    isSelected ? 'bg-rose-500 text-white font-bold' : 'bg-slate-100 text-slate-600'
                                                                                }`}
                                                                            >
                                                                                {opt.letter}. {opt.text} {isRightOpt ? '(正確答案)' : isSelected ? '(你的選擇)' : ''}
                                                                            </span>
