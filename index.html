                                    <div class="max-h-40 overflow-y-auto space-y-1">
                                        {studentsList.map((s) => (
                                            <div key={s.id} class="text-xs p-2 bg-slate-50 rounded-lg flex items-center justify-between font-medium">
                                                <span>{s.seatNumber} 號 - {s.name}</span>
                                                <span class="text-[10px] text-slate-400">{s.joinTime}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <button onClick={() => setShowQRModal(false)} class="w-full py-2.5 bg-slate-800 text-white font-bold rounded-xl text-xs">
                                    關閉窗口
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, teacherWhiteboardData, coopState, showToast, onExit }) {
            const [selectedChoice, setSelectedChoice] = useState('');
            const [shortAnswerText, setShortAnswerText] = useState('');
            const [whiteboardData, setWhiteboardData] = useState(null);
            
            // Audio recording states
            const [isRecording, setIsRecording] = useState(false);
            const [audioBlob, setAudioBlob] = useState(null);
            const [audioUrl, setAudioUrl] = useState(null);
            const [recordingTime, setRecordingTime] = useState(0);

            // Challenge mode answers
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [challengeTimeLeft, setChallengeTimeLeft] = useState(null);

            const [submitted, setSubmitted] = useState(false);

            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);
            const timerRef = useRef(null);

            // Check if already submitted for current question
            const myCurrentResponse = useMemo(() => {
                if (!activeQuestion) return null;
                return responses[studentId] && responses[studentId].questionId === activeQuestion.id ? responses[studentId] : null;
            }, [responses, studentId, activeQuestion]);

            useEffect(() => {
                if (myCurrentResponse) {
                    setSubmitted(true);
                } else {
                    setSubmitted(false);
                    setSelectedChoice('');
                    setShortAnswerText('');
                    setWhiteboardData(null);
                    setAudioBlob(null);
                    setAudioUrl(null);
                    setChallengeAnswers({});
                }
            }, [activeQuestion, myCurrentResponse]);

            // Challenge timer countdown for student
            useEffect(() => {
                if (activeQuestion?.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer && !submitted) {
                    const limit = activeQuestion.challenge.timeLimit || 120;
                    const elapsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                    const remaining = Math.max(0, limit - elapsed);
                    setChallengeTimeLeft(remaining);

                    const interval = setInterval(() => {
                        setChallengeTimeLeft(t => {
                            if (t <= 1) {
                                clearInterval(interval);
                                handleSubmitResponse(true); // Auto submit at 00:00
                                return 0;
                            }
                            return t - 1;
                        });
                    }, 1000);

                    return () => clearInterval(interval);
                }
            }, [activeQuestion, submitted]);

            // Audio Recording Controls
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        setAudioBlob(blob);
                        setAudioUrl(URL.createObjectURL(blob));
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                    setRecordingTime(0);

                    timerRef.current = setInterval(() => {
                        setRecordingTime(t => t + 1);
                    }, 1000);
                } catch (err) {
                    console.error("Mic access error:", err);
                    showToast("無法存取麥克風，請檢查存取權限！", "error");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                    clearInterval(timerRef.current);
                }
            };

            const handleDeleteRecording = () => {
                setAudioBlob(null);
                setAudioUrl(null);
                setRecordingTime(0);
            };

            const handleSubmitResponse = async (isAutoSubmit = false) => {
                if (!activeQuestion) return;

                let finalAnswer = null;
                let calculatedScore = null;

                if (activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') {
                    if (!selectedChoice) {
                        showToast("請先選擇選項！", "error");
                        return;
                    }
                    finalAnswer = selectedChoice;
                } else if (activeQuestion.mode === 'SHORT') {
                    if (!shortAnswerText.trim()) {
                        showToast("請輸入內容！", "error");
                        return;
                    }
                    finalAnswer = shortAnswerText.trim();
                } else if (activeQuestion.mode === 'DRAW') {
                    if (!whiteboardData) {
                        showToast("請在白板上作答或繪圖！", "error");
                        return;
                    }
                    finalAnswer = whiteboardData;
                } else if (activeQuestion.mode === 'BUZZER') {
                    finalAnswer = 'CLICKED';
                } else if (activeQuestion.mode === 'AUDIO') {
                    if (!audioBlob) {
                        showToast("請先完成錄音！", "error");
                        return;
                    }
                    // Convert audio blob to base64
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = async () => {
                        await saveResponseToFirestore(reader.result);
                    };
                    return;
                } else if (activeQuestion.mode === 'CHALLENGE') {
                    finalAnswer = challengeAnswers;
                    let score = 0;
                    const questions = activeQuestion.challenge?.questions || [];
                    questions.forEach((q) => {
                        if (challengeAnswers[q.num] === q.answer) {
                            score += Math.round((activeQuestion.challenge.totalScore || 100) / questions.length);
                        }
                    });
                    calculatedScore = score;
                }

                await saveResponseToFirestore(finalAnswer, calculatedScore);
            };

            const saveResponseToFirestore = async (ans, calculatedScore = null) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const now = Date.now();
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', `${activeQuestion.id}_${studentId}`);

                const timeUsedSecs = ((now - activeQuestion.startTime) / 1000).toFixed(2);

                const responsePayload = {
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    questionId: activeQuestion.id,
                    answer: ans,
                    score: calculatedScore,
                    answers: activeQuestion.mode === 'CHALLENGE' ? challengeAnswers : null,
                    submitTimestamp: now,
                    submitTime: new Date().toLocaleTimeString('zh-HK'),
                    timeUsedSeconds: timeUsedSecs
                };

                await window.fbUtils.setDoc(resDocRef, responsePayload);
                setSubmitted(true);
                playSound('win');
            };

            const handleCoopSubmitAnswer = async (chosenLetter) => {
                if (!coopState || !coopState.groups) return;

                // Find my group
                const myGroup = coopState.groups.find(g => g.members.some(m => m.id === studentId));
                if (!myGroup) return;

                const currentQIndex = myGroup.currentQuestionIndex || 0;
                const targetQ = coopState.questions[currentQIndex];

                if (!targetQ) return;

                const isCorrect = chosenLetter === targetQ.answer;

                let updatedGroups = coopState.groups.map(g => {
                    if (g.id === myGroup.id) {
                        if (isCorrect) {
                            const newIdx = currentQIndex + 1;
                            const isFinished = newIdx >= coopState.questions.length;
                            return { ...g, currentQuestionIndex: newIdx, finished: isFinished };
                        } else {
                            // Wrong answer resets team back to 0!
                            return { ...g, currentQuestionIndex: 0 };
                        }
                    }
                    return g;
                });

                let winningGroup = coopState.winnerGroup;
                if (!winningGroup && isCorrect) {
                    const checkWin = updatedGroups.find(g => g.id === myGroup.id && g.finished);
                    if (checkWin) winningGroup = checkWin;
                }

                const updatedCoopState = {
                    ...coopState,
                    groups: updatedGroups,
                    winnerGroup: winningGroup
                };

                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { coopState: updatedCoopState }, { merge: true });

                if (isCorrect) {
                    showToast("答對了！團隊進度向前推進 🚀", "success");
                } else {
                    showToast("答錯了！團隊進度重置回第一題，繼續加油！", "error");
                }
            };

            return (
                <div class="min-h-screen bg-indigo-900 text-white flex flex-col">
                    {/* Student Top Bar */}
                    <header class="bg-indigo-950 px-4 py-3 shadow-lg flex items-center justify-between border-b border-indigo-800">
                        <div class="flex items-center space-x-2">
                            <span class="bg-indigo-600 font-extrabold px-3 py-1 rounded-xl text-xs">
                                🎒 {seatNumber}號 {studentName}
                            </span>
                            <span class="text-xs text-indigo-300">房號: {roomCode}</span>
                        </div>
                        <button onClick={onExit} class="text-xs bg-indigo-800 px-3 py-1.5 rounded-xl border border-indigo-700">
                            離開
                        </button>
                    </header>

                    {/* Teacher Broadcast Demo Whiteboard Banner */}
                    {teacherWhiteboardData && (
                        <div class="bg-amber-400 text-slate-900 p-4 border-b-4 border-amber-500 shadow-xl space-y-2 animate-fade-in">
                            <div class="flex items-center justify-between font-black text-sm">
                                <span>📢 教師白板示範同步中...</span>
                            </div>
                            <img src={teacherWhiteboardData} class="w-full max-h-60 object-contain bg-white rounded-xl border border-amber-600" />
                        </div>
                    )}

                    {/* Teacher Broadcasted Peer Review Work Banner */}
                    {activeQuestion?.broadcastedWork && (
                        <div class="bg-indigo-600 text-white p-4 border-b-4 border-indigo-700 shadow-xl space-y-2">
                            <div class="font-extrabold text-sm flex items-center space-x-2">
                                <span>📢 全班作品互評廣播：{activeQuestion.broadcastedWork.seatNumber}號 ({activeQuestion.broadcastedWork.name})</span>
                            </div>
                            {activeQuestion.mode === 'DRAW' ? (
                                <img src={activeQuestion.broadcastedWork.answer} class="w-full max-h-64 object-contain bg-white rounded-xl" />
                            ) : (
                                <div class="p-3 bg-indigo-800 rounded-xl text-sm font-medium">
                                    {activeQuestion.broadcastedWork.answer}
                                </div>
                            )}
                        </div>
                    )}

                    {/* Main Student Workspace */}
                    <main class="flex-grow p-4 max-w-2xl w-full mx-auto flex flex-col justify-center space-y-6">
                        
                        {}
                        {coopState && coopState.stage === 'RACE' ? (
                            <div class="bg-white text-slate-800 rounded-3xl p-6 shadow-2xl space-y-5">
                                {(() => {
                                    const myGroup = coopState.groups?.find(g => g.members.some(m => m.id === studentId));
                                    if (!myGroup) return <div class="text-center text-sm">正在載入團隊組別資訊...</div>;

                                    const memberIndex = myGroup.members.findIndex(m => m.id === studentId);
                                    const currentQIndex = myGroup.currentQuestionIndex || 0;
                                    const targetQ = coopState.questions?.[currentQIndex];

                                    if (!targetQ) return <div class="text-center text-sm font-bold">團隊已完成所有問題！🎉</div>;

                                    return (
                                        <div class="space-y-4">
                                            <div class={`p-3 rounded-xl border ${myGroup.color} flex items-center justify-between font-extrabold text-sm`}>
                                                <span>{myGroup.emoji} {myGroup.name}</span>
                                                <span>第 {currentQIndex + 1} / {coopState.questions.length} 題</span>
                                            </div>

                                            {/* Split UI logic: Member 0 sees Question, Member 1 sees Options A&B, Member 2 sees Options C&D */}
                                            {memberIndex === 0 && (
                                                <div class="bg-amber-50 p-4 rounded-2xl border border-amber-200 text-center space-y-2">
                                                    <span class="text-xs font-bold text-amber-700">你是【組員一】：題目持有者</span>
                                                    <div class="text-lg font-black text-slate-900">{targetQ.text}</div>
                                                    <div class="text-xs text-slate-500">請將題目讀給組員聽，與組員討論正確答案！</div>
                                                </div>
                                            )}

                                            {memberIndex === 1 && (
                                                <div class="bg-blue-50 p-4 rounded-2xl border border-blue-200 space-y-3">
                                                    <span class="text-xs font-bold text-blue-700 block text-center">你是【組員二】：負責選項 A 及 B</span>
                                                    <div class="grid grid-cols-1 gap-2">
                                                        {targetQ.options?.filter(o => o.letter === 'A' || o.letter === 'B').map(opt => (
                                                            <button
                                                                key={opt.letter}
                                                                onClick={() => handleCoopSubmitAnswer(opt.letter)}
                                                                class="p-4 bg-white border-2 border-indigo-200 hover:border-indigo-600 rounded-2xl font-bold text-base text-left shadow-md active:scale-98"
                                                            >
                                                                {opt.letter}. {opt.text}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}

                                            {memberIndex >= 2 && (
                                                <div class="bg-pink-50 p-4 rounded-2xl border border-pink-200 space-y-3">
                                                    <span class="text-xs font-bold text-pink-700 block text-center">你是【組員三】：負責選項 C 及 D</span>
                                                    <div class="grid grid-cols-1 gap-2">
                                                        {targetQ.options?.filter(o => o.letter === 'C' || o.letter === 'D').map(opt => (
                                                            <button
                                                                key={opt.letter}
                                                                onClick={() => handleCoopSubmitAnswer(opt.letter)}
                                                                class="p-4 bg-white border-2 border-indigo-200 hover:border-indigo-600 rounded-2xl font-bold text-base text-left shadow-md active:scale-98"
                                                            >
                                                                {opt.letter}. {opt.text}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })()}
                            </div>
                        ) : !activeQuestion ? (
                            /* Standby State */
                            <div class="bg-indigo-950/80 rounded-3xl p-8 border border-indigo-800 text-center space-y-4 shadow-2xl">
                                <div class="w-16 h-16 bg-indigo-800 text-indigo-300 rounded-2xl mx-auto flex items-center justify-center text-3xl font-bold animate-pulse">
                                    💬
                                </div>
                                <h2 class="text-xl font-black">安靜等候老師指示...</h2>
                                <p class="text-xs text-indigo-300">老師派送題目後將自動顯示於您的螢幕</p>
                            </div>
                        ) : submitted ? (
                            <div class="bg-white text-slate-800 rounded-3xl p-8 shadow-2xl text-center space-y-5 animate-fade-in">
                                <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full mx-auto flex items-center justify-center text-4xl shadow-inner">
                                    🎉
                                </div>
                                <h2 class="text-2xl font-black text-emerald-600">已提交答案! 讚賞你的努力!</h2>
                                <p class="text-sm font-bold text-slate-500">安靜等候老師指示...</p>

                                {/* Unlocked Challenge Score Review when scores released */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge?.scoresReleased && (
                                    <div class="bg-slate-50 p-4 rounded-2xl border text-left space-y-3 pt-4 border-emerald-200">
                                        <div class="text-center font-black text-lg text-emerald-700">
                                            你的總得分：{myCurrentResponse?.score || 0} 分
                                        </div>
                                        {activeQuestion.challenge.questions?.map((q, qIdx) => {
                                            const myAns = (myCurrentResponse?.answers || {})[q.num];
                                            const isCorrect = myAns === q.answer;

                                            return (
                                                <div key={qIdx} class={`p-3 rounded-xl border text-xs space-y-1.5 ${isCorrect ? 'bg-emerald-50 border-emerald-300' : 'bg-red-50 border-red-300'}`}>
                                                    <div class="font-bold">{q.num}. {q.text}</div>
                                                    <div class="grid grid-cols-2 gap-1">
                                                        {q.options?.map(opt => {
                                                            const isChosen = myAns === opt.letter;
                                                            const isTargetAns = q.answer === opt.letter;

                                                            return (
                                                                <div key={opt.letter} class={`px-2 py-1 rounded font-bold ${
                                                                    isTargetAns ? 'bg-emerald-600 text-white' : isChosen ? 'bg-red-600 text-white' : 'bg-white border text-slate-600'
                                                                }`}>
                                                                    {opt.letter}. {opt.text}
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div class="bg-white text-slate-800 rounded-3xl p-6 shadow-2xl space-y-5 border border-slate-100">
                                <div class="flex items-center justify-between border-b pb-3">
                                    <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full">
                                        {getModeLabel(activeQuestion.mode)}
                                    </span>
                                    {activeQuestion.mode === 'CHALLENGE' && challengeTimeLeft !== null && (
                                        <span class="text-xs font-mono font-bold text-red-600 bg-red-50 px-3 py-1 rounded-full border border-red-200">
                                            ⏱️ 限時倒數: {Math.floor(challengeTimeLeft/60)}:{(challengeTimeLeft%60).toString().padStart(2,'0')}
                                        </span>
                                    )}
                                </div>

                                <h2 class="text-lg font-black tracking-tight text-slate-900">
                                    {activeQuestion.text}
                                </h2>

                                {/* LINK Mode */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div class="space-y-3">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div class="aspect-16-9 w-full rounded-2xl overflow-hidden shadow-md">
                                                <iframe src={activeQuestion.youtubeEmbed} class="w-full h-full" allowFullScreen />
                                            </div>
                                        ) : null}

                                        {activeQuestion.pushedUrl && (
                                            <a
                                                href={activeQuestion.pushedUrl}
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold rounded-xl shadow-lg flex items-center justify-center space-x-2 text-sm"
                                            >
                                                <span>開啟連結網站 ↗</span>
                                            </a>
                                        )}
                                    </div>
                                )}

                                {/* CHOICE / TF Mode */}
                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        {activeQuestion.choiceOptions?.map((opt) => (
                                            <button
                                                key={opt}
                                                onClick={() => setSelectedChoice(opt)}
                                                class={`p-4 rounded-2xl font-black text-base transition text-left border-2 flex items-center justify-between ${
                                                    selectedChoice === opt 
                                                        ? 'bg-indigo-600 text-white border-indigo-700 shadow-lg scale-102' 
                                                        : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'
                                                }`}
                                            >
                                                <span>{opt}</span>
                                                {selectedChoice === opt && <span>✓</span>}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {/* SHORT Answer Mode */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div>
                                        <textarea
                                            rows={4}
                                            placeholder="請在此輸入您的詳細回答..."
                                            value={shortAnswerText}
                                            onChange={(e) => setShortAnswerText(e.target.value)}
                                            class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 font-medium text-sm"
                                        />
                                    </div>
                                )}

                                {/* DRAW Whiteboard Mode */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <div class="space-y-3">
                                        <WhiteboardCanvas
                                            initialData={whiteboardData}
                                            bgImage={activeQuestion.whiteboardBg}
                                            onSave={(data) => setWhiteboardData(data)}
                                            heightClass="h-[380px]"
                                        />
                                    </div>
                                )}

                                {/* BUZZER Mode */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <button
                                        onClick={() => handleSubmitResponse()}
                                        class="w-full h-48 bg-gradient-to-br from-red-500 to-rose-600 hover:from-red-600 hover:to-rose-700 text-white rounded-3xl shadow-2xl font-black text-3xl tracking-widest border-4 border-red-300 active:scale-95 transition flex flex-col items-center justify-center space-y-2 animate-bounce"
                                    >
                                        <span>⚡ 按我搶答！</span>
                                    </button>
                                )}

                                {/* AUDIO Mode */}
                                {activeQuestion.mode === 'AUDIO' && (
                                    <div class="space-y-4 text-center">
                                        {!audioUrl ? (
                                            <div class="space-y-3">
                                                <button
                                                    onClick={isRecording ? stopRecording : startRecording}
                                                    class={`w-full py-4 rounded-2xl font-black text-base shadow-lg transition ${
                                                        isRecording ? 'bg-red-600 text-white animate-pulse' : 'bg-indigo-600 text-white hover:bg-indigo-700'
                                                    }`}
                                                >
                                                    {isRecording ? `🛑 停止錄音 (${recordingTime}秒)` : '🎙️ 開始錄音 (最多10秒)'}
                                                </button>
                                            </div>
                                        ) : (
                                            <div class="space-y-3 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                                                <audio src={audioUrl} controls class="w-full" />
                                                <div class="flex space-x-2">
                                                    <button
                                                        onClick={handleDeleteRecording}
                                                        class="w-1/2 py-2 bg-red-600 text-white text-xs font-bold rounded-xl"
                                                    >
                                                        🗑️ 刪除重錄
                                                    </button>
                                                    <button
                                                        onClick={() => handleSubmitResponse()}
                                                        class="w-1/2 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl"
                                                    >
                                                        ✅ 確認提交錄音
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* CHALLENGE Mode Question Sheet */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                    <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-1">
                                        {activeQuestion.challenge.questions?.map((q) => (
                                            <div key={q.num} class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
                                                <div class="font-bold text-sm text-slate-900">
                                                    {q.num}. {q.text}
                                                </div>
                                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                    {q.options?.map((opt) => (
                                                        <button
                                                            key={opt.letter}
                                                            onClick={() => setChallengeAnswers({...challengeAnswers, [q.num]: opt.letter})}
                                                            class={`p-2.5 rounded-xl text-xs font-bold text-left border transition ${
                                                                challengeAnswers[q.num] === opt.letter ? 'bg-indigo-600 text-white border-indigo-700' : 'bg-white border-slate-200 text-slate-700'
                                                            }`}
                                                        >
                                                            {opt.letter}. {opt.text}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {}
                                {activeQuestion.mode !== 'BUZZER' && activeQuestion.mode !== 'AUDIO' && activeQuestion.mode !== 'LINK' && (
                                    <button
                                        onClick={() => handleSubmitResponse()}
                                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3.5 rounded-2xl shadow-lg transition active:scale-98 text-base"
                                    >
                                        確認提交 🚀
                                    </button>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<OMITApp />);
    </script>
</body>
</html>
