        const { useState, useEffect, useRef, useMemo } = React;

        // Web Audio API Synthesizer (Sounds + Music)
        class AudioSystem {
            constructor() {
                this.ctx = null;
                this.musicInterval = null;
                this.isPlayingMusic = false;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playSound(type) {
                try {
                    this.init();
                    const ctx = this.ctx;

                    if (type === 'buzzer') {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(880, ctx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                        gain.gain.setValueAtTime(0.3, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.3);
                    } else if (type === 'spin') {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(600, ctx.currentTime);
                        gain.gain.setValueAtTime(0.15, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.08);
                    } else if (type === 'win') {
                        const notes = [523.25, 659.25, 783.99, 1046.50];
                        notes.forEach((freq, idx) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                            gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.start(ctx.currentTime + idx * 0.1);
                            osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                        });
                        if (window.confetti) {
                            window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                        }
                    } else if (type === 'alarm') {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(900, ctx.currentTime);
                        osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                        gain.gain.setValueAtTime(0.3, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.4);
                    }
                } catch (e) {
                    console.error("Audio error:", e);
                }
            }

            // Synthesizer background music loops for Group Prep and Race Music
            startBackgroundMusic(style = 'relax') {
                this.stopMusic();
                this.init();
                this.isPlayingMusic = true;

                const notes = style === 'race' 
                    ? [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 440.00, 587.33] 
                    : [329.63, 392.00, 440.00, 392.00, 329.63, 293.66, 261.63, 293.66];
                
                let idx = 0;
                this.musicInterval = setInterval(() => {
                    if (!this.isPlayingMusic) return;
                    const ctx = this.ctx;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = style === 'race' ? 'triangle' : 'sine';
                    osc.frequency.setValueAtTime(notes[idx % notes.length], ctx.currentTime);
                    
                    gain.gain.setValueAtTime(style === 'race' ? 0.08 : 0.04, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (style === 'race' ? 0.2 : 0.4));
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    osc.start();
                    osc.stop(ctx.currentTime + (style === 'race' ? 0.2 : 0.4));
                    
                    idx++;
                }, style === 'race' ? 220 : 450);
            }

            stopMusic() {
                this.isPlayingMusic = false;
                if (this.musicInterval) {
                    clearInterval(this.musicInterval);
                    this.musicInterval = null;
                }
            }
        }

        const audioSys = new AudioSystem();

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (
                <div className={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-2 text-sm font-bold animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        // Create Word .docx binary template file using JSZip
        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) {
                throw new Error("JSZip library is not loaded.");
            }
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => {
                return `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`;
            }).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>
    ${paragraphsXml}
  </w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        // Parse Word/Text template file
        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];

            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) {
                        questions.push(currentQ);
                    }
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }

                    currentQ.options.push({
                        letter: letter,
                        text: optText
                    });

                    if (isCorrect) {
                        currentQ.answer = letter;
                    }
                }
            });

            if (currentQ && currentQ.options.length > 0) {
                questions.push(currentQ);
            }

            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1,
                            text: "以下哪一項不是地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "機械資源" }
                            ],
                            answer: "D"
                        },
                        {
                            num: 2,
                            text: "芝士的原料屬於哪一項地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "礦產資源" }
                            ],
                            answer: "C"
                        }
                    ]
                };
            }

            return {
                title,
                totalScore,
                questions
            };
        };

        // Requirement 1 & 21: High precision WhiteboardCanvas Component (1280x720 canvas, ratio scale formula)
        const WhiteboardCanvas = ({ bgImage, initialData, onConfirmSubmit, isTeacherMode, onClose, onBroadcast }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [strokeColor, setStrokeColor] = useState('#1e293b');
            const [lineWidth, setLineWidth] = useState(6);
            const [isEraser, setIsEraser] = useState(false);
            const [bgImg, setBgImg] = useState(bgImage || null);

            const CANVAS_WIDTH = 1280;
            const CANVAS_HEIGHT = 720;

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                // Clear and render white background
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                if (bgImg) {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                    };
                    img.src = bgImg;
                } else if (initialData) {
                    const img = new Image();
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                    };
                    img.src = initialData;
                }
            }, [bgImg]);

            const getCanvasCoords = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                const scaleX = CANVAS_WIDTH / rect.width;
                const scaleY = CANVAS_HEIGHT / rect.height;

                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                setIsDrawing(true);
                const coords = getCanvasCoords(e);
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(coords.x, coords.y);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const coords = getCanvasCoords(e);
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');

                ctx.lineTo(coords.x, coords.y);
                ctx.strokeStyle = isEraser ? '#ffffff' : strokeColor;
                ctx.lineWidth = isEraser ? lineWidth * 3 : lineWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            };

            const stopDrawing = (e) => {
                if (isDrawing) {
                    setIsDrawing(false);
                }
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                if (bgImg) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                    img.src = bgImg;
                }
            };

            const handleCustomBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setBgImg(evt.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleConfirm = () => {
                const canvas = canvasRef.current;
                const dataUrl = canvas.toDataURL('image/png');
                if (onConfirmSubmit) {
                    onConfirmSubmit(dataUrl);
                }
            };

            return (
                <div className="flex flex-col items-center space-y-3 w-full max-w-4xl mx-auto bg-slate-900 p-4 rounded-3xl shadow-2xl">
                    {/* Control Bar */}
                    <div className="flex flex-wrap items-center justify-between gap-2 w-full bg-slate-800 p-3 rounded-2xl text-white">
                        <div className="flex items-center space-x-2">
                            {/* Color options */}
                            {!isEraser && (
                                <div className="flex space-x-1.5">
                                    {['#1e293b', '#dc2626', '#2563eb', '#16a34a', '#d97706', '#9333ea'].map((c) => (
                                        <button 
                                            key={c}
                                            onClick={() => setStrokeColor(c)}
                                            className={`w-7 h-7 rounded-full border-2 transition ${strokeColor === c ? 'border-white scale-110 shadow-lg' : 'border-transparent opacity-80'}`}
                                            style={{ backgroundColor: c }}
                                        />
                                    ))}
                                </div>
                            )}

                            {/* Eraser button */}
                            <button 
                                onClick={() => setIsEraser(!isEraser)}
                                className={`px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1 border transition ${isEraser ? 'bg-amber-500 border-amber-400 text-white' : 'bg-slate-700 border-slate-600 hover:bg-slate-600'}`}
                            >
                                <span>🧽 擦膠</span>
                            </button>

                            {/* Clear canvas */}
                            <button 
                                onClick={clearCanvas}
                                className="px-3 py-1.5 rounded-xl bg-rose-600/80 hover:bg-rose-600 font-bold text-xs text-white border border-rose-500 transition"
                            >
                                🗑️ 清空
                            </button>
                        </div>

                        {/* Stroke size 2px - 18px */}
                        <div className="flex items-center space-x-2">
                            <span className="text-xs font-bold text-slate-300">粗幼:</span>
                            <input 
                                type="range" 
                                min="2" 
                                max="18" 
                                value={lineWidth} 
                                onChange={(e) => setLineWidth(parseInt(e.target.value))}
                                className="w-24 accent-indigo-500"
                            />
                            <span className="text-xs font-mono font-bold">{lineWidth}px</span>
                        </div>

                        {/* Background Upload */}
                        {!isTeacherMode && (
                            <label className="cursor-pointer px-3 py-1.5 bg-indigo-600/80 hover:bg-indigo-600 text-white text-xs font-bold rounded-xl border border-indigo-400 flex items-center gap-1 transition">

                    "D. 影響食水供應"
                ];

                try {
                    const blob = await createWordDocxBlob(sampleLines);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = '下載評估範本Word檔.docx';

            const handleWordFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const arrayBuffer = evt.target.result;
                            const result = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                            parsedData = parseWordChallengeText(result.value);

                            const text = evt.target.result;
                            parsedData = parseWordChallengeText(text);
                        }

                        setChallengeData(parsedData);

                        console.error("Word file parse error:", err);
                        showToast("文件解析失敗，請確認格式！", "error");
                    }
                };

                if (file.name.endsWith('.docx')) {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file, "UTF-8");
                }
            };

            const handleUpdateChallengeTitle = (newTitle) => {
                setChallengeData(prev => prev ? { ...prev, title: newTitle } : null);
            };

            const handleUpdateChallengeScore = (newScore) => {
                setChallengeData(prev => prev ? { ...prev, totalScore: parseInt(newScore) || 100 } : null);
            };

            const handleUpdateQuestionText = (qIndex, text) => {
                setChallengeData(prev => {
                    if (!prev) return null;
                    const newQs = [...prev.questions];
                    newQs[qIndex] = { ...newQs[qIndex], text };
                    return { ...prev, questions: newQs };
                });
            };

            const handleUpdateOptionText = (qIndex, optIndex, text) => {
                setChallengeData(prev => {
                    if (!prev) return null;
                    const newQs = [...prev.questions];
                    const newOpts = [...newQs[qIndex].options];
                    newOpts[optIndex] = { ...newOpts[optIndex], text };
                    newQs[qIndex] = { ...newQs[qIndex], options: newOpts };
                    return { ...prev, questions: newQs };
                });

                setChallengeData(prev => {
                    if (!prev) return null;
                    const newQs = [...prev.questions];
                    newQs[qIndex] = { ...newQs[qIndex], answer: answerLetter };
                    return { ...prev, questions: newQs };
                });

                setChallengeData(prev => {
                    if (!prev) return null;
                    const newQs = prev.questions.filter((_, idx) => idx !== qIndex).map((q, idx) => ({
                        ...q,

            const handleGenerateGroups = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生加入課堂，請待學生連線後再進行分組！", "error");
                    return;
                }

                const sortedStudents = [...studentsList].sort(() => Math.random() - 0.5);
                const numGroups = Math.min(Math.ceil(sortedStudents.length / 3) || 1, ANIMAL_GROUPS_POOL.length);
                
                const groupPoolShuffled = [...ANIMAL_GROUPS_POOL].sort(() => Math.random() - 0.5);
                const groups = [];

                for (let i = 0; i < numGroups; i++) {
                    groups.push({
                        id: 'grp_' + i,
                        theme: groupPoolShuffled[i],
                        members: [],
                        scoreProgress: 0,
                        currentQIndex: 0
                    });
                }

                sortedStudents.forEach((stu, idx) => {
                    const targetGroup = groups[idx % numGroups];
                    targetGroup.members.push(stu);
                });

                setCoopGroups(groups);
                setCoopStage('GROUPING');

                // Requirement 22.2.4: Relaxing background music for grouping phase
                audioSys.startBackgroundMusic('relax');
                setCoopMusicPlaying(true);

                // Requirement 22.2.3: Publish Group Info to students
                const promptText = `🏆 合作題：${challengeData?.title || '小組合作競技'}`;
                const coopQ = {
                    id: 'q_' + Date.now(),
                    mode: 'GROUP_COOP',
                    text: promptText,
                    startTime: Date.now(),
                    coopStage: 'GROUPING',
                    groups: groups,
                    questions: challengeData?.questions || []
                };

                publishQuestionToFirestore(coopQ);
                showToast("已完成隨機分組並發送分組資訊至學生頁面！", "success");
            };

            const handleStartCoopRace = () => {
                if (coopGroups.length === 0) return;
                setCoopStage('RACE');

                // Requirement 22.3.2: Race music
                audioSys.startBackgroundMusic('race');
                setCoopMusicPlaying(true);

                const updatedQ = {
                    ...activeQuestion,
                    coopStage: 'RACE',
                    groups: coopGroups.map(g => ({ ...g, scoreProgress: 0, currentQIndex: 0 })),
                    winnerGroup: null
                };

                publishQuestionToFirestore(updatedQ);
                showToast("🏁 合作比賽正式開始！學生將分配不同作答介面進行協作", "success");
            };

            const handleToggleCoopMusic = () => {
                if (coopMusicPlaying) {
                    audioSys.stopMusic();
                    setCoopMusicPlaying(false);
                } else {
                    audioSys.startBackgroundMusic(coopStage === 'RACE' ? 'race' : 'relax');
                    setCoopMusicPlaying(true);
                }
            };

            // Publish Active Question
            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                
                let challengeContent = null;
                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請先上載並解析 Word 評估範本檔案！", "error");
                        return;
                    }
                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);

                publishQuestionToFirestore(newQ, updatedHistory);
                showToast(`已發佈【${getModeLabel(selectedMode)}】給全班學生！`, 'success');
            };

            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已成功發放全班挑戰題成績！", "success");
            };

            const handleClearQuestion = async () => {
                audioSys.stopMusic();
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: null }, { merge: true });
                showToast('已結束當前題目', 'info');
            };

            const toggleLockMode = async () => {
                const newLock = !lockAfterSubmit;
                setLockAfterSubmit(newLock);
                if (activeQuestion) {
                    const updatedQ = { ...activeQuestion, lockAfterSubmit: newLock };
                    publishQuestionToFirestore(updatedQ);
                    showToast(newLock ? "已鎖定答案（禁止修改）" : "已開放學生修改答案", "info");
                }
            };

            const handleBroadcastSubmission = async (studentRes) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatedQ = { 
                    ...activeQuestion, 
                    broadcastedSubmission: studentRes 
                };
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                showToast(`已成功廣播 ${studentRes.name} 的作品至全班學生螢幕！`, "success");
            };

            const handleCancelBroadcast = async () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatedQ = { 
                    ...activeQuestion, 
                    broadcastedSubmission: null 
                };
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                showToast(`已取消廣播分享`, "info");
            };

            // Requirement 9: Random Student Selector Logic
            const handleSpinRandom = () => {
                if (isSpinning) return;
                
                const start = parseInt(rangeStart) || 1;
                const end = parseInt(rangeEnd) || 36;
                const available = [];
                for (let i = start; i <= end; i++) {
                    if (!drawnNumbers.includes(i)) available.push(i);
                }

                if (available.length === 0) {
                    showToast("此範圍內所有學號皆已被抽出！請點擊重置。", "error");
                    return;
                }

                setIsSpinning(true);
                let counter = 0;
                const maxIntervals = 20;

                const timer = setInterval(() => {
                    const temp = available[Math.floor(Math.random() * available.length)];
                    setCurrentDrawn(temp);
                    audioSys.playSound('spin');
                    counter++;

                    if (counter >= maxIntervals) {
                        clearInterval(timer);
                        const finalPicked = available[Math.floor(Math.random() * available.length)];
                        setCurrentDrawn(finalPicked);
                        setDrawnNumbers(prev => [...prev, finalPicked]);
                        setIsSpinning(false);
                        audioSys.playSound('win');
                    }
                }, 100);
            };

            // Requirement 20: CSV Export for Challenge Mode
            const handleExportCSVReport = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生紀錄可供匯出！", "error");
                    return;
                }

                let csvContent = "\uFEFF"; // UTF-8 BOM
                csvContent += "學號,學生姓名,加入時間";

                historyQuestions.forEach((q, idx) => {
                    const cleanText = (q.text || getModeLabel(q.mode)).replace(/"/g, '""');
                    if (q.mode === 'CHALLENGE' && q.challenge) {
                        csvContent += `,第${idx + 1}題[挑戰題:${q.challenge.title}總分],第${idx + 1}題[正確率],第${idx + 1}題[用時(秒)]`;
                    } else {
                        csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]: "${cleanText}"`;
                    }
                });
                csvContent += "\n";

                const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

                sortedStudents.forEach((stu) => {
                    const cleanName = (stu.name || '').replace(/"/g, '""');
                    csvContent += `"${stu.seatNumber}號","${cleanName}","${stu.joinTime || ''}"`;
                    
                    historyQuestions.forEach((q) => {
                        const resKey = `${q.id}_${stu.id}`;
                        const res = responses[resKey];
                        
                        if (res && res.answer !== undefined && res.answer !== null) {
                            if (q.mode === 'CHALLENGE' && res.scoreDetails) {
                                csvContent += `,"${res.scoreDetails.totalScore} / ${q.challenge.totalScore}分","${res.scoreDetails.percentage}%","${res.duration || 0}"`;
                            } else {
                                let ansVal = res.answer;
                                if (typeof ansVal === 'string' && ansVal.startsWith('data:image')) {
                                    ansVal = '[圖像白板答案]';
                                } else if (typeof ansVal === 'string' && ansVal.startsWith('data:audio')) {
                                    ansVal = '[語音錄音檔案]';
                                }
                                const cleanAns = String(ansVal).replace(/"/g, '""');
                                csvContent += `,"${cleanAns} (用時:${res.duration || 0}s)"`;
                            }
                        } else {
                            if (q.mode === 'CHALLENGE') {
                                csvContent += `,"未作答","0%","0"`;
                            } else {
                                csvContent += `,"未作答"`;
                            }
                        }
                    });
                    csvContent += "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `OMIT_課堂學習與挑戰題報告_房號${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("已成功匯出全班成績與答題詳情 CSV 試算表！", "success");
            };

            // Requirement 7: Leaderboard with Gold (#1), Silver (#2), Bronze (#3) badges
            const leaderboard = useMemo(() => {
                return Object.values(currentQuestionResponses)
                    .filter(r => r.duration !== undefined)
                    .sort((a, b) => {
                        if (activeQuestion?.mode === 'CHALLENGE') {
                            const scoreA = a.scoreDetails?.totalScore || 0;
                            const scoreB = b.scoreDetails?.totalScore || 0;
                            if (scoreB !== scoreA) return scoreB - scoreA;
                        }
                        return parseFloat(a.duration) - parseFloat(b.duration);
                    });
            }, [currentQuestionResponses, activeQuestion]);

            const whiteboardSubmissions = useMemo(() => {
                return Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:image'));
            }, [currentQuestionResponses]);

            const challengeScoresAreReleased = useMemo(() => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return true;
                return !!(activeQuestion.challenge?.releaseInstant || activeQuestion.challenge?.scoresReleased);
            }, [activeQuestion]);

            return (
                <div className="min-h-screen pb-12">
                    {/* Requirement 9: Top Title Header "宣道會陳元喜小學OMIT互動課堂" */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 py-3">
                        <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center space-x-3">
                                <span className="bg-indigo-600 text-white font-black px-3 py-1.5 rounded-xl text-lg shadow-sm">OMIT</span>
                                <div>
                                    <h1 className="font-extrabold text-slate-800 text-base md:text-lg flex items-center gap-2">
                                        宣道會陳元喜小學OMIT互動課堂
                                        <span className="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1 rounded-full font-mono font-bold">
                                            房號：{roomCode}
                                        </span>
                                    </h1>
                                </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-2">
                                {/* Requirement 11: Real-time online headcount badge on QR Code button */}
                                <button 
                                    onClick={() => setShowQRModal(true)}
                                    className="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-2 rounded-xl border border-indigo-200 text-xs md:text-sm flex items-center space-x-1.5 transition"
                                >
                                    <span>📱 QR Code</span>
                                    <span className="bg-indigo-600 text-white text-xs px-1.5 py-0.5 rounded-full font-mono">
                                        {studentsList.length}人
                                    </span>
                                </button>

                                {/* Requirement 21: Teacher Whiteboard button next to Random Selector */}
                                <button 
                                    onClick={() => setShowTeacherDemoWhiteboard(true)}
                                    className="bg-purple-600 hover:bg-purple-700 text-white font-black px-3.5 py-2 rounded-xl text-xs md:text-sm shadow transition flex items-center gap-1.5"
                                >
                                    <span>🎨 課堂白板</span>
                                </button>

                                {/* Requirement 9: Upgraded Random Selector Button */}
                                <button 
                                    onClick={() => setShowRandomModal(true)}
                                    className="bg-amber-50 hover:bg-amber-100 text-amber-800 font-bold px-3 py-2 rounded-xl border border-amber-200 text-xs md:text-sm transition"
                                >
                                    🎲 抽選學生
                                </button>

                                {/* Requirement 10: Upgraded Timer Button */}
                                <button 
                                    onClick={() => setShowTimerModal(true)}
                                    className={`px-3 py-2 rounded-xl border text-xs md:text-sm font-bold flex items-center space-x-1.5 transition ${
                                        timerActive 
                                        ? 'bg-amber-500 text-white border-amber-600 animate-pulse' 
                                        : 'bg-slate-100 hover:bg-slate-200 text-slate-700 border-slate-300'
                                    }`}
                                >
                                    <span>⏱️ 計時器</span>
                                    {timerSeconds > 0 && (
                                        <span className="bg-black/20 font-mono text-xs px-1.5 py-0.5 rounded">
                                            {Math.floor(timerSeconds / 60)}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                        </span>
                                    )}
                                </button>

                                <button 
                                    onClick={handleExportCSVReport}
                                    className="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold px-3 py-2 rounded-xl border border-blue-200 text-xs md:text-sm transition"
                                >
                                    📊 匯出報告
                                </button>

                                <button 
                                    onClick={handleExitRoom}
                                    className="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2 rounded-xl border border-rose-200 text-xs md:text-sm transition"
                                >
                                    🚪 退出課室
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Container */}
                    <main className="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

                        {/* Mode Selectors */}
                        <div className="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-9 gap-2.5">
                            {[
                                { id: 'CHOICE', label: '選擇題', icon: '🔘' },
                                { id: 'TF', label: '是非題', icon: '⭕' },
                                { id: 'SHORT', label: '短答題', icon: '✍️' },
                                { id: 'DRAW', label: '白板題', icon: '🎨' },
                                { id: 'BUZZER', label: '搶答題', icon: '🚨' },
                                { id: 'AUDIO', label: '錄音題', icon: '🎤' },
                                { id: 'CHALLENGE', label: '挑戰題', icon: '🏆' },
                                { id: 'GROUP_COOP', label: '合作題', icon: '🤝' },
                                { id: 'LINK', label: '派送連結', icon: '🔗' }
                            ].map((mode) => (
                                <button 
                                    key={mode.id}
                                    onClick={() => setSelectedMode(mode.id)}
                                    className={`p-3 rounded-2xl font-bold border-2 transition-all text-center flex flex-col items-center justify-center space-y-1 shadow-sm active:scale-95 ${
                                        selectedMode === mode.id 
                                        ? 'bg-slate-900 text-white border-slate-900 ring-4 ring-slate-200' 
                                        : 'bg-white text-slate-700 border-slate-200 hover:border-slate-300 hover:bg-slate-50'
                                    }`}
                                >
                                    <span className="text-xl md:text-2xl">{mode.icon}</span>
                                    <span className="text-xs font-black">{mode.label}</span>
                                </button>
                            ))}
                        </div>

                        {/* Question Creation Panel */}
                        <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                            <div className="flex flex-wrap items-center justify-between border-b pb-3 gap-2">
                                <h2 className="font-extrabold text-slate-800 text-lg flex items-center gap-2">
                                    <span>模式設定：{getModeLabel(selectedMode)}</span>
                                </h2>

                                {selectedMode !== 'CHALLENGE' && selectedMode !== 'GROUP_COOP' && (
                                    <div className="flex items-center space-x-2 bg-slate-100 p-1.5 rounded-xl">
                                        <span className="text-xs font-bold text-slate-600 pl-2">提交後允許修改：</span>
                                        <button 
                                            onClick={toggleLockMode}
                                            className={`px-3 py-1 rounded-lg text-xs font-bold transition ${!lockAfterSubmit ? 'bg-emerald-500 text-white' : 'bg-slate-300 text-slate-600'}`}
                                        >
                                            {!lockAfterSubmit ? '已開放修改' : '已鎖定 (預設)'}
                                        </button>
                                    </div>
                                )}
                            </div>

                            {/* CHOICE options switcher */}
                            {selectedMode === 'CHOICE' && (
                                <div className="flex items-center space-x-4">
                                    <label className="text-sm font-bold text-slate-700">選項數量：</label>
                                    {[4, 5].map((cnt) => (
                                        <button 
                                            key={cnt} 
                                            onClick={() => setChoiceCount(cnt)}
                                            className={`px-3 py-1.5 rounded-xl font-bold text-sm border ${choiceCount === cnt ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-700'}`}
                                        >
                                            {cnt} 個選項 ({cnt === 4 ? 'A-D' : 'A-E'})
                                        </button>
                                    ))}
                                </div>
                            )}

                            {/* Requirement 22: Group Cooperative Mode Setup Panel */}
                            {selectedMode === 'GROUP_COOP' && (
                                <div className="bg-gradient-to-r from-teal-50 via-emerald-50 to-cyan-50 border border-teal-200 p-5 rounded-2xl space-y-4">
                                    <div className="flex flex-wrap items-center justify-between gap-2 border-b border-teal-200 pb-3">
                                        <h3 className="font-black text-teal-900 text-base flex items-center gap-2">
                                            <span>🤝 「合作題」競賽設定 (預備 ➔ 分組 ➔ 比賽)</span>
                                        </h3>
                                        <div className="flex items-center space-x-2">
                                            <button 
                                                type="button"
                                                onClick={handleDownloadChallengeTemplate}
                                                className="bg-teal-700 hover:bg-teal-800 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow transition"
                                            >
                                                📄 下載評估範本Word檔
                                            </button>
                                        </div>
                                    </div>

                                    {/* Stage indicator */}
                                    <div className="flex items-center justify-around bg-white p-3 rounded-xl border border-teal-200 text-xs font-bold">
                                        <span className={`px-3 py-1 rounded-lg ${coopStage === 'PREP' ? 'bg-teal-600 text-white font-black' : 'text-slate-400'}`}>
                                            1. 預備階段
                                        </span>
                                        <span>➔</span>
                                        <span className={`px-3 py-1 rounded-lg ${coopStage === 'GROUPING' ? 'bg-teal-600 text-white font-black' : 'text-slate-400'}`}>
                                            2. 分組階段
                                        </span>
                                        <span>➔</span>
                                        <span className={`px-3 py-1 rounded-lg ${coopStage === 'RACE' ? 'bg-teal-600 text-white font-black' : 'text-slate-400'}`}>
                                            3. 比賽階段
                                        </span>
                                    </div>

                                    {/* Upload Word file for Coop */}
                                    <div className="bg-white p-4 rounded-xl border border-teal-200 space-y-3">
                                        <label className="block text-xs font-bold text-slate-700">
                                            上載合作題 Word 文件 (.docx)：
                                        </label>
                                        <input 
                                            type="file" 
                                            accept=".docx,.txt"
                                            onChange={handleWordFileUpload}
                                            className="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-teal-600 file:text-white hover:file:bg-teal-700 cursor-pointer"
                                        />

                                        {challengeData && (
                                            <div className="bg-teal-50 p-4 rounded-xl border border-teal-300 space-y-3">
                                                <div className="flex justify-between items-center">
                                                    <span className="font-black text-teal-900 text-sm">✏️ 教師編輯/確認評估內容：</span>
                                                    <span className="text-xs text-teal-700 font-bold">已載入 {challengeData.questions.length} 題</span>
                                                </div>
                                                <div className="space-y-2 max-h-60 overflow-y-auto">
                                                    {challengeData.questions.map((q, qIdx) => (
                                                        <div key={qIdx} className="bg-white p-3 rounded-lg border text-xs space-y-1.5">
                                                            <div className="flex justify-between items-center gap-2">
                                                                <span className="font-bold">第{qIdx + 1}題:</span>
                                                                <input 
                                                                    type="text" 
                                                                    value={q.text} 
                                                                    onChange={(e) => handleUpdateQuestionText(qIdx, e.target.value)}
                                                                    className="flex-1 px-2 py-1 border rounded text-xs"
                                                                />
                                                                <button 
                                                                    onClick={() => handleDeleteQuestion(qIdx)}
                                                                    className="text-red-600 font-bold hover:underline"
                                                                >
                                                                    刪除
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Coop Controls */}
                                    <div className="flex flex-wrap items-center gap-3 pt-2">
                                        {coopStage === 'PREP' && (
                                            <button 
                                                onClick={handleGenerateGroups}
                                                className="flex-1 bg-teal-600 hover:bg-teal-700 text-white font-black py-3 rounded-xl shadow-md transition"
                                            >
                                                🎲 隨機平均分組並發送發組資訊 ➔ 進入分組階段
                                            </button>
                                        )}

                                        {coopStage === 'GROUPING' && (
                                            <div className="flex items-center space-x-3 w-full">
                                                <button 
                                                    onClick={handleGenerateGroups}
                                                    className="bg-amber-500 hover:bg-amber-600 text-white font-bold px-4 py-3 rounded-xl text-xs transition"
                                                >
                                                    🔄 重新分配分組
                                                </button>
                                                <button 
                                                    onClick={handleStartCoopRace}
                                                    className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl text-base shadow-lg transition animate-bounce"
                                                >
                                                    🏁 開始比賽 ➔ 進入比賽階段
                                                </button>
                                            </div>
