                                {selectedMode !== 'COLLAB' && (
                                    <div class="flex items-center justify-between pt-2">
                                        <button 
                                            onClick={handlePublishQuestion}
                                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-3 rounded-xl shadow-lg transition active:scale-98 text-sm flex items-center justify-center space-x-2"
                                        >
                                            <span>發佈題目至全班 🚀</span>
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>

                        {}
                        {activeQuestion && (
                            <TeacherLeaderboard 
                                activeQuestion={activeQuestion}
                                responses={currentQuestionResponses}
                                studentsList={studentsList}
                                onInspectWork={(type, list, index) => setShowInspectModal({ type, list, index })}
                                onReleaseChallengeScores={handleReleaseChallengeScores}
                                onExportCSV={handleExportChallengeCSV}
                                showScoresOnLeaderboard={showScoresOnLeaderboard}
                                setShowScoresOnLeaderboard={setShowScoresOnLeaderboard}
                            />
                        )}

                        {collabStage === 'RACE' && collabState && (
                            <TeacherCollabRacePanel 
                                collabState={collabState}
                                roomCode={roomCode}
                                showToast={showToast}
                                onResetCollab={() => setCollabStage('PREP')}
                                onReRace={handleStartCollabRace}
                                onReGroup={handleStartCollabGrouping}
                            />
                        )}
                    </main>

                    {}
                    {showQRModal && (
                        <div class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div class="bg-slate-800 text-white rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl border border-slate-700">
                                <div class="flex items-center justify-between">
                                    <h3 class="text-lg font-black">課堂 QR Code 及學生監控</h3>
                                    <button onClick={() => setShowQRModal(false)} class="text-slate-400 hover:text-white text-xl">✕</button>
                                </div>
                                <div class="flex flex-col items-center space-y-3 bg-white p-4 rounded-2xl">
                                    <img src={qrImageUrl} alt="QR Code" class="w-56 h-56 rounded-xl" />
                                    <p class="text-slate-800 font-mono font-bold text-lg">房號: {roomCode}</p>
                                </div>
                                <div class="bg-slate-900/80 p-3 rounded-xl max-h-40 overflow-y-auto space-y-1">
                                    <div class="text-xs font-bold text-indigo-400 mb-1">已加入學生 ({studentsList.length} 人):</div>
                                    <div class="flex flex-wrap gap-1.5">
                                        {studentsList.map(s => (
                                            <span key={s.id} class="bg-slate-700 text-slate-200 text-xs px-2.5 py-1 rounded-lg font-bold">
                                                {s.seatNumber}號 {s.name}
                                            </span>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showTimerModal && (
                        <div class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div class="bg-slate-800 text-white rounded-3xl p-6 max-w-sm w-full space-y-5 shadow-2xl border border-slate-700 text-center">
                                <div class="flex items-center justify-between">
                                    <h3 class="text-lg font-black">倒數計時器</h3>
                                    <button onClick={() => setShowTimerModal(false)} class="text-slate-400 hover:text-white text-xl">✕</button>
                                </div>

                                <div class="text-5xl font-mono font-black tracking-widest text-indigo-400 py-4 bg-slate-900 rounded-2xl border border-slate-700">
                                    {Math.floor(timerSeconds/60).toString().padStart(2,'0')}:{(timerSeconds%60).toString().padStart(2,'0')}
                                </div>

                                <div class="grid grid-cols-3 gap-2">
                                    {[
                                        { label: '30秒', sec: 30 },
                                        { label: '1分鐘', sec: 60 },
                                        { label: '2分鐘', sec: 120 },
                                        { label: '3分鐘', sec: 180 },
                                        { label: '4分鐘', sec: 240 },
                                        { label: '5分鐘', sec: 300 }
                                    ].map(t => (
                                        <button 
                                            key={t.label} 
                                            onClick={() => { setTimerSeconds(t.sec); setTimerActive(false); }}
                                            class="py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-xs font-bold"
                                        >
                                            {t.label}
                                        </button>
                                    ))}
                                </div>

                                <div class="flex items-center justify-center space-x-2">
                                    <span class="text-xs text-slate-400 font-bold">自訂 (分:秒):</span>
                                    <input 
                                        type="text" 
                                        value={timerMinInput} 
                                        onChange={(e) => setTimerMinInput(e.target.value)} 
                                        class="w-12 py-1 text-center bg-slate-900 border border-slate-600 rounded text-xs font-mono font-bold"
                                    />
                                    <span>:</span>
                                    <input 
                                        type="text" 
                                        value={timerSecInput} 
                                        onChange={(e) => setTimerSecInput(e.target.value)} 
                                        class="w-12 py-1 text-center bg-slate-900 border border-slate-600 rounded text-xs font-mono font-bold"
                                    />
                                    <button 
                                        onClick={() => {
                                            const total = (parseInt(timerMinInput)||0)*60 + (parseInt(timerSecInput)||0);
                                            setTimerSeconds(total);
                                            setTimerActive(false);
                                        }}
                                        class="px-3 py-1 bg-indigo-600 hover:bg-indigo-700 text-xs font-bold rounded-lg"
                                    >
                                        設定
                                    </button>
                                </div>

                                <div class="flex space-x-2 pt-2">
                                    <button 
                                        onClick={() => setTimerActive(!timerActive)}
                                        class={`w-1/2 py-3 rounded-xl font-bold transition ${timerActive ? 'bg-amber-500 hover:bg-amber-600' : 'bg-emerald-600 hover:bg-emerald-700'}`}
                                    >
                                        {timerActive ? '⏸️ 暫停' : '▶️ 開始倒數'}
                                    </button>
                                    <button 
                                        onClick={() => { setTimerActive(false); setTimerSeconds(0); }}
                                        class="w-1/2 py-3 rounded-xl bg-slate-700 hover:bg-slate-600 font-bold"
                                    >
                                        🔄 重置
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showRandomModal && (
                        <div class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div class="bg-slate-800 text-white rounded-3xl p-6 max-w-sm w-full space-y-5 shadow-2xl border border-slate-700 text-center">
                                <div class="flex items-center justify-between">
                                    <h3 class="text-lg font-black">🎯 抽選學生</h3>
                                    <button onClick={() => setShowRandomModal(false)} class="text-slate-400 hover:text-white text-xl">✕</button>
                                </div>

                                <div class="flex items-center justify-center space-x-2 text-xs font-bold text-slate-300">
                                    <span>學號範圍:</span>
                                    <input type="number" value={rangeStart} onChange={(e) => setRangeStart(e.target.value)} class="w-14 py-1 text-center bg-slate-900 border border-slate-600 rounded font-bold" />
                                    <span>至</span>
                                    <input type="number" value={rangeEnd} onChange={(e) => setRangeEnd(e.target.value)} class="w-14 py-1 text-center bg-slate-900 border border-slate-600 rounded font-bold" />
                                </div>

                                <div class="py-8 bg-indigo-900/50 rounded-2xl border-2 border-indigo-500/50 flex flex-col items-center justify-center space-y-2">
                                    <span class="text-xs text-indigo-300 font-bold">中獎學號</span>
                                    <span class="text-6xl font-black text-amber-400 font-mono tracking-wider">
                                        {currentDrawn ? `${currentDrawn}號` : '--'}
                                    </span>
                                </div>

                                <button 
                                    onClick={handleRandomDraw}
                                    disabled={isSpinning}
                                    class="w-full bg-purple-600 hover:bg-purple-700 text-white font-extrabold py-3.5 rounded-xl shadow-lg transition active:scale-98 text-base"
                                >
                                    {isSpinning ? '🎲 抽籤中...' : '🎲 立即抽籤'}
                                </button>
                            </div>
                        </div>
                    )}

                    {showDemoWhiteboard && (
                        <DemoWhiteboardModal 
                            onClose={() => setShowDemoWhiteboard(false)}
                            onBroadcast={handleDemoBroadcast}
                            isBroadcasting={isDemoBroadcasting}
                        />
                    )}

                    {showInspectModal && (
                        <StudentWorkInspectModal 
                            inspectData={showInspectModal}
                            onClose={() => setShowInspectModal(null)}
                            onBroadcast={handleBroadcastStudentWork}
                        />
                    )}
                </div>
            );
        }

        function TeacherLeaderboard({ activeQuestion, responses, studentsList, onInspectWork, onReleaseChallengeScores, onExportCSV, showScoresOnLeaderboard, setShowScoresOnLeaderboard }) {
            const resList = useMemo(() => {
                return Object.values(responses).sort((a, b) => (a.submitTime || 0) - (b.submitTime || 0));
            }, [responses]);

            const top3List = useMemo(() => resList.slice(0, 3), [resList]);

            // Calculate option stats for Choice/TF
            const optionStats = useMemo(() => {
                if (!activeQuestion || (activeQuestion.mode !== 'CHOICE' && activeQuestion.mode !== 'TF')) return {};
                const stats = {};
                activeQuestion.choiceOptions.forEach(opt => { stats[opt] = []; });
                resList.forEach(r => {
                    if (r.answer && stats[r.answer]) {
                        stats[r.answer].push(r);
                    }
                });
                return stats;
            }, [activeQuestion, resList]);

            return (
                <div class="bg-slate-800 rounded-3xl p-5 border border-slate-700 shadow-xl space-y-6">
                    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-700 pb-3">
                        <div class="flex items-center space-x-2">
                            <span class="text-xl">🏆</span>
                            <h2 class="text-base font-black text-white">答題龍虎榜 ({resList.length}/{studentsList.length}人已交)</h2>
                        </div>

                        {activeQuestion.mode === 'CHALLENGE' && (
                            <div class="flex items-center space-x-2">
                                <button 
                                    onClick={onReleaseChallengeScores}
                                    class="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-xs transition shadow"
                                >
                                    一併發放全班挑戰題成績
                                </button>
                                <button 
                                    onClick={onExportCSV}
                                    class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs transition shadow flex items-center space-x-1"
                                >
                                    <span>📥 匯出本次挑戰題成績試算表 (.csv)</span>
                                </button>
                            </div>
                        )}
                    </div>

                    {/* Top 3 Fastest Responders Highlight */}
                    {top3List.length > 0 && (
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            {top3List.map((std, idx) => {
                                const medals = ['🥇 第一名 (金)', '🥈 第二名 (銀)', '🥉 第三名 (銅)'];
                                const borders = ['border-amber-400 bg-amber-500/10 gold-highlight', 'border-slate-300 bg-slate-400/10', 'border-amber-700 bg-amber-800/10'];
                                return (
                                    <div key={std.studentId} class={`p-4 rounded-2xl border-2 ${borders[idx]} flex flex-col items-center justify-center space-y-1 shadow-lg`}>
                                        <span class="text-xs font-black text-amber-300">{medals[idx]}</span>
                                        <span class="text-lg font-black text-white">{std.seatNumber}號 {std.name}</span>
                                        <span class="text-xs text-slate-400 font-mono">用時: {std.timeUsed || 0} 秒</span>
                                        {activeQuestion.mode === 'CHALLENGE' && (
                                            <span class="text-xs font-bold text-emerald-400">
                                                得分: {activeQuestion.challenge?.scoresReleased ? `${std.score}分` : '待發放'}
                                            </span>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {/* Choice / TF Bar Charts */}
                    {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                        <div class="space-y-3 bg-slate-900/60 p-4 rounded-2xl border border-slate-700/50">
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">答題統計 (點選棒形圖可檢視學生名單)</h3>
                            <div class="space-y-2">
                                {Object.keys(optionStats).map(opt => {
                                    const count = optionStats[opt].length;
                                    const percentage = resList.length > 0 ? Math.round((count / resList.length) * 100) : 0;
                                    return (
                                        <div key={opt} class="space-y-1">
                                            <div class="flex justify-between text-xs font-bold text-slate-300">
                                                <span>選項 {opt}</span>
                                                <span>{count} 人 ({percentage}%)</span>
                                            </div>
                                            <div 
                                                onClick={() => onInspectWork('OPTION', optionStats[opt], 0)}
                                                class="w-full h-8 bg-slate-800 rounded-xl overflow-hidden cursor-pointer border border-slate-700 relative hover:border-indigo-500 transition"
                                            >
                                                <div 
                                                    style={{ width: `${percentage}%` }} 
                                                    class="h-full bg-indigo-600 rounded-xl transition-all duration-500 flex items-center px-3"
                                                >
                                                    <span class="text-xs font-bold text-white whitespace-nowrap">
                                                        {optionStats[opt].map(s => `${s.seatNumber}號`).join(', ')}
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {/* Response Roster Grid */}
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
                        {resList.map((r, idx) => (
                            <div 
                                key={r.studentId}
                                onClick={() => onInspectWork(r.mode, resList, idx)}
                                class="p-3 bg-slate-900/80 hover:bg-slate-700/80 rounded-2xl border border-slate-700 cursor-pointer transition space-y-1"
                            >
                                <div class="flex items-center justify-between">
                                    <span class="text-xs font-black text-indigo-400">#{idx + 1} {r.seatNumber}號</span>
                                    <span class="text-[10px] text-slate-400 font-mono">{r.timeUsed || 0}s</span>
                                </div>
                                <div class="text-xs font-bold text-white truncate">{r.name}</div>
                                
                                {r.mode === 'SHORT' && (
                                    <div class="text-xs text-slate-300 truncate bg-slate-800 px-2 py-1 rounded-lg">
                                        {r.answer}
                                    </div>
                                )}

                                {r.mode === 'DRAW' && (
                                    <div class="w-full aspect-16-9 bg-white rounded-lg overflow-hidden border border-slate-600">
                                        <img src={r.answer} class="w-full h-full object-contain" />
                                    </div>
                                )}

                                {r.mode === 'AUDIO' && (
                                    <div class="text-xs text-emerald-400 font-bold">🎙️ 語音答題</div>
                                )}

                                {r.mode === 'CHALLENGE' && (
                                    <div class="text-xs text-amber-400 font-bold">
                                        得分: {activeQuestion.challenge?.scoresReleased ? `${r.score}分` : '保密中'}
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function TeacherCollabRacePanel({ collabState, roomCode, showToast, onResetCollab, onReRace, onReGroup }) {
            const { groups, progress, data } = collabState;
            const totalQuestions = data?.questions?.length || 5;

            // Check if any group won
            const winnerIdx = useMemo(() => {
                return Object.keys(progress).find(idx => progress[idx] >= totalQuestions);
            }, [progress, totalQuestions]);

            useEffect(() => {
                if (winnerIdx !== undefined) playSound('win');
            }, [winnerIdx]);

            return (
                <div class="bg-slate-800 rounded-3xl p-5 border border-slate-700 shadow-xl space-y-6">
                    <div class="flex items-center justify-between border-b border-slate-700 pb-3">
                        <div class="flex items-center space-x-2">
                            <span class="text-2xl">🏁</span>
                            <h2 class="text-lg font-black text-white">合作題比賽進行中: {data?.title}</h2>
                        </div>
                        {winnerIdx !== undefined && (
                            <span class="bg-amber-500 text-white text-xs px-3 py-1 rounded-full font-black animate-bounce">
                                🏆 比賽已產生勝出者！
                            </span>
                        )}
                    </div>

                    {/* Progress Bar Chart */}
                    <div class="space-y-4">
                        {groups.map((g, idx) => {
                            const curProg = progress[idx] || 0;
                            const percentage = Math.min(100, Math.round((curProg / totalQuestions) * 100));
                            return (
                                <div key={idx} class="space-y-1">
                                    <div class="flex items-center justify-between text-xs font-extrabold text-slate-200">
                                        <div class="flex items-center space-x-2">
                                            <span>{g.emoji}</span>
                                            <span>{g.name}</span>
                                            <span class="text-slate-400 font-normal">({g.members.map(m=>m.name).join(', ')})</span>
                                        </div>
                                        <span>進度: {curProg} / {totalQuestions} 題</span>
                                    </div>
                                    <div class="w-full h-8 bg-slate-900 rounded-xl overflow-hidden border border-slate-700 p-1">
                                        <div 
                                            style={{ width: `${percentage}%`, backgroundColor: g.hex }}
                                            class="h-full rounded-lg transition-all duration-500 collab-progress-bar flex items-center justify-end px-2"
                                        >
                                            <span class="text-xs font-black text-white">{percentage}%</span>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Winner Celebration Modal Overlay for Teacher */}
                    {winnerIdx !== undefined && (
                        <div class="p-6 bg-gradient-to-r from-amber-500/20 via-purple-500/20 to-indigo-500/20 rounded-2xl border-2 border-amber-400 text-center space-y-4">
                            <h3 class="text-2xl font-black text-amber-400">🎉 恭喜勝出組別：{groups[winnerIdx].emoji} {groups[winnerIdx].name}！</h3>
                            <p class="text-sm font-bold text-slate-200">
                                組員: {groups[winnerIdx].members.map(m => `${m.seatNumber}號 ${m.name}`).join('、 ')}
                            </p>
                            <div class="flex items-center justify-center space-x-3 pt-2">
                                <button onClick={onResetCollab} class="px-5 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs">結束比賽</button>
                                <button onClick={onReRace} class="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs">再次比賽</button>
                                <button onClick={onReGroup} class="px-5 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs">重新分組</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StudentWorkInspectModal({ inspectData, onClose, onBroadcast }) {
            const { type, list, index } = inspectData;
            const [currentIndex, setCurrentIndex] = useState(index);
            const currentObj = list[currentIndex] || {};

            return (
                <div class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-fade-in">
                    <div class="bg-slate-800 text-white rounded-3xl p-6 max-w-2xl w-full space-y-5 shadow-2xl border border-slate-700">
                        <div class="flex items-center justify-between border-b border-slate-700 pb-3">
                            <div class="flex items-center space-x-2">
                                <span class="text-xl">🔍</span>
                                <h3 class="text-lg font-black">
                                    檢視作品 ({currentIndex + 1} / {list.length}) - {currentObj.seatNumber}號 {currentObj.name}
                                </h3>
                            </div>
                            <button onClick={onClose} class="text-slate-400 hover:text-white text-2xl">✕</button>
                        </div>

                        {/* Content View */}
                        <div class="py-4 flex justify-center">
                            {type === 'DRAW' && currentObj.answer && (
                                <div class="w-full aspect-16-9 bg-white rounded-2xl overflow-hidden border border-slate-600">
                                    <img src={currentObj.answer} class="w-full h-full object-contain" />
                                </div>
                            )}

                            {type === 'SHORT' && (
                                <div class="w-full p-6 bg-slate-900 rounded-2xl border border-slate-700 text-lg font-bold text-indigo-300">
                                    {currentObj.answer}
                                </div>
                            )}

                            {type === 'AUDIO' && currentObj.answer && (
                                <audio controls src={currentObj.answer} class="w-full" />
                            )}
                        </div>

                        {/* Pagination & Broadcast Controls */}
                        <div class="flex items-center justify-between pt-3 border-t border-slate-700">
                            <button 
                                onClick={() => setCurrentIndex(Math.max(0, currentIndex - 1))}
                                disabled={currentIndex === 0}
                                class="px-4 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 disabled:opacity-40 text-xs font-bold"
                            >
                                ⬅️ 上一位
                            </button>

                            <button 
                                onClick={() => onBroadcast(currentObj)}
                                class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xs transition shadow"
                            >
                                📡 廣播至全班螢幕
                            </button>

                            <button 
                                onClick={() => setCurrentIndex(Math.min(list.length - 1, currentIndex + 1))}
                                disabled={currentIndex === list.length - 1}
                                class="px-4 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 disabled:opacity-40 text-xs font-bold"
                            >
                                下一位 ➡️
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, collabState, showToast, onExit }) {
            const [myAnswer, setMyAnswer] = useState('');
            const [submitted, setSubmitted] = useState(false);
            const [isRecording, setIsRecording] = useState(false);
            const [audioBlob, setAudioBlob] = useState(null);
            const [audioUrl, setAudioUrl] = useState(null);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            // Challenge Mode Student Answers State: { questionNum: answerLetter }
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [challengeRemainingSecs, setChallengeRemainingSecs] = useState(null);

            // Check if already submitted for current question
            const myResponse = useMemo(() => {
                if (!activeQuestion) return null;
                return responses[studentId + '_' + activeQuestion.id] || null;
            }, [responses, studentId, activeQuestion]);

            useEffect(() => {
                if (myResponse) setSubmitted(true);
                else setSubmitted(false);
            }, [myResponse]);

            // Challenge Timer Countdown Logic
            useEffect(() => {
                if (activeQuestion?.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer && !submitted) {
                    const limitSecs = activeQuestion.challenge.timeLimit || 120;
                    const elapsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                    const remain = Math.max(0, limitSecs - elapsed);
                    setChallengeRemainingSecs(remain);

                    const interval = setInterval(() => {
                        setChallengeRemainingSecs(r => {
                            if (r <= 1) {
                                clearInterval(interval);
                                autoSubmitChallenge();
                                return 0;
                            }
                            return r - 1;
                        });
                    }, 1000);

                    return () => clearInterval(interval);
                }
            }, [activeQuestion, submitted]);

            // Audio Recording Handlers
            const startRecording = async () => {
                audioChunksRef.current = [];
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mediaRecorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = mediaRecorder;

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const url = URL.createObjectURL(blob);
                        setAudioBlob(blob);
                        setAudioUrl(url);
                    };

                    mediaRecorder.start();
                    setIsRecording(true);
                } catch (err) {
                    console.error("Mic access error:", err);
                    showToast("無法存取麥克風！", "error");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            // Independent Submit Handler
            const handleSubmitAnswer = async (ansToSubmit) => {
                const finalAns = ansToSubmit !== undefined ? ansToSubmit : myAnswer;
                if (!finalAns && activeQuestion?.mode !== 'BUZZER') {
                    showToast("請先輸入或選擇答案！", "error");
                    return;
                }

                const appId = "omit-8c173";
                const db = window.fbDb;
                const docId = studentId + '_' + activeQuestion.id;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', docId);

                const timeUsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);

                const resPayload = {
                    questionId: activeQuestion.id,
                    mode: activeQuestion.mode,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: finalAns,
                    submitTime: Date.now(),
                    timeUsed: timeUsed
                };

                await window.fbUtils.setDoc(resDocRef, resPayload);
                setSubmitted(true);
                showToast("已成功提交答案！", "success");
            };

            // Submit Challenge Answers Auto/Manual
            const handleSubmitChallenge = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const challenge = activeQuestion.challenge;
                let totalCorrect = 0;

                challenge.questions.forEach(q => {
                    if (challengeAnswers[q.num] === q.answer) totalCorrect++;
                });

                const score = Math.round((totalCorrect / challenge.questions.length) * challenge.totalScore);
                const timeUsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);

                const appId = "omit-8c173";
                const db = window.fbDb;
                const docId = studentId + '_' + activeQuestion.id;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', docId);

                await window.fbUtils.setDoc(resDocRef, {
                    questionId: activeQuestion.id,
                    mode: 'CHALLENGE',
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answersMap: challengeAnswers,
                    score: score,
                    submitTime: Date.now(),
                    timeUsed: timeUsed
                });

                setSubmitted(true);
                showToast("已完成挑戰題評估提交！", "success");
            };

            const autoSubmitChallenge = () => {
                handleSubmitChallenge();
            };

            // Submit Audio Answer
            const handleConfirmAudioSubmit = () => {
                if (!audioBlob) return;
                const reader = new FileReader();
                reader.onloadend = () => {
                    handleSubmitAnswer(reader.result);
                };
                reader.readAsDataURL(audioBlob);
            };

            return (
                <div class="min-h-screen bg-slate-900 text-slate-100 flex flex-col">
                    {/* Student Top Header */}
                    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center justify-between sticky top-0 z-40">
                        <div class="flex items-center space-x-2">
                            <span class="bg-indigo-600 text-white font-black px-2.5 py-1 rounded-lg text-sm">OMIT</span>
                            <span class="text-xs font-bold text-slate-200">{seatNumber}號 {studentName}</span>
                        </div>
                        <span class="text-xs text-indigo-400 font-mono font-bold">房號: {roomCode}</span>
                    </header>

                    {/* Main Student Screen Body */}
                    <main class="flex-grow p-4 max-w-2xl w-full mx-auto flex flex-col justify-center space-y-6">
                        {/* Standby State */}
                        {!activeQuestion && !collabState && (
                            <div class="text-center py-16 space-y-4 bg-slate-800/60 rounded-3xl p-8 border border-slate-700">
                                <div class="text-5xl animate-bounce">⏳</div>
                                <h2 class="text-xl font-black text-white">安靜等候老師指示...</h2>
                                <p class="text-xs text-slate-400">當老師發佈新題目時，畫面將會即時自動更新！</p>
                            </div>
                        )}

                        {/* Active Question Render */}
                        {activeQuestion && (
                            <div class="bg-slate-800 rounded-3xl p-6 border border-slate-700 shadow-2xl space-y-6">
                                <div class="border-b border-slate-700 pb-3 flex items-center justify-between">
                                    <span class="text-xs font-black text-indigo-400 uppercase tracking-wider">
                                        【{getModeLabel(activeQuestion.mode)}】
                                    </span>
                                    {submitted && (
                                        <span class="text-xs bg-emerald-500/20 text-emerald-400 font-bold px-3 py-1 rounded-full border border-emerald-500/30">
                                            已提交 ✓
                                        </span>
                                    )}
                                </div>

                                <h2 class="text-lg font-black text-white">{activeQuestion.text}</h2>

                                {/* Choice / TF Student Screen */}
                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div class="space-y-4">
                                        <div class="grid grid-cols-1 gap-3">
                                            {activeQuestion.choiceOptions.map(opt => (
                                                <button 
                                                    key={opt}
                                                    disabled={submitted}
                                                    onClick={() => setMyAnswer(opt)}
                                                    class={`p-4 rounded-2xl font-black text-base transition flex items-center justify-between ${myAnswer === opt ? 'bg-indigo-600 text-white ring-4 ring-indigo-300' : 'bg-slate-700 hover:bg-slate-600 text-slate-200'}`}
                                                >
                                                    <span>選項 {opt}</span>
                                                    {myAnswer === opt && <span>✓</span>}
                                                </button>
                                            ))}
                                        </div>

                                        {!submitted && (
                                            <button 
                                                onClick={() => handleSubmitAnswer()}
                                                class="w-full py-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-base shadow-lg transition active:scale-98"
                                            >
                                                確認提交答案 🚀
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Short Answer Student Screen */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-4">
                                        <textarea 
                                            disabled={submitted}
                                            rows={4}
                                            placeholder="請在此輸入您的回答..."
                                            value={myAnswer}
                                            onChange={(e) => setMyAnswer(e.target.value)}
                                            class="w-full p-4 rounded-2xl bg-slate-900 border border-slate-700 text-white text-base focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                        {!submitted && (
                                            <button 
                                                onClick={() => handleSubmitAnswer()}
                                                class="w-full py-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-base shadow-lg transition active:scale-98"
                                            >
                                                確認提交答案 🚀
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Whiteboard Student Screen */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <div class="space-y-4">
                                        <WhiteboardCanvas 
                                            initialImage={activeQuestion.whiteboardBg}
                                            onConfirmSubmit={handleSubmitAnswer}
                                            isReadOnly={submitted}
                                            allowUploadBg={true}
                                        />
                                    </div>
                                )}

                                {/* Buzzer Student Screen */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="text-center py-6 space-y-4">
                                        <button 
                                            disabled={submitted}
                                            onClick={() => { playSound('buzzer'); handleSubmitAnswer('BUZZ'); }}
                                            class={`w-48 h-48 rounded-full font-black text-2xl shadow-2xl transition transform active:scale-90 mx-auto flex items-center justify-center ${submitted ? 'bg-slate-700 text-slate-500' : 'bg-gradient-to-br from-red-500 to-rose-700 text-white animate-pulse'}`}
                                        >
                                            {submitted ? '已搶答！' : '⚡ 按此搶答！'}
                                        </button>
                                    </div>
                                )}

                                {/* Audio Recording Student Screen */}
                                {activeQuestion.mode === 'AUDIO' && (
                                    <div class="space-y-4 text-center">
                                        {!submitted && (
                                            <div class="space-y-4">
                                                {!isRecording && !audioUrl && (
                                                    <button onClick={startRecording} class="px-8 py-4 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-base shadow-lg">
                                                        🎙️ 開始錄音
                                                    </button>
                                                )}

                                                {isRecording && (
                                                    <button onClick={stopRecording} class="px-8 py-4 rounded-2xl bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-base animate-pulse">
                                                        ⏹️ 停止錄音
                                                    </button>
                                                )}

                                                {audioUrl && (
                                                    <div class="space-y-3 bg-slate-900 p-4 rounded-2xl border border-slate-700">
                                                        <audio controls src={audioUrl} class="w-full" />
                                                        <div class="flex space-x-2">
                                                            <button 
                                                                onClick={() => { setAudioBlob(null); setAudioUrl(null); }}
                                                                class="w-1/2 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-xs font-bold"
                                                            >
                                                                🗑️ 刪除重錄
                                                            </button>
                                                            <button 
                                                                onClick={handleConfirmAudioSubmit}
                                                                class="w-1/2 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs"
                                                            >
                                                                ✅ 確認提交錄音
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Link Dispatch Student Screen */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div class="space-y-4 text-center">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div class="aspect-16-9 w-full rounded-2xl overflow-hidden shadow-lg border border-slate-700">
                                                <iframe src={activeQuestion.youtubeEmbed} class="w-full h-full" allowFullScreen />
                                            </div>
                                        ) : (
                                            <div class="p-6 bg-slate-900 rounded-2xl border border-slate-700 text-slate-300 font-mono text-sm">
                                                {activeQuestion.pushedUrl}
                                            </div>
                                        )}

                                        <a 
                                            href={activeQuestion.pushedUrl} 
                                            target="_blank" 
                                            rel="noopener noreferrer" 
                                            class="inline-block px-6 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-sm shadow-lg transition"
                                        >
                                            開啟連結網站 ↗
                                        </a>
                                    </div>
                                )}

                                {/* Challenge Student Screen */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                    <div class="space-y-6">
                                        {challengeRemainingSecs !== null && (
                                            <div class="text-center font-mono font-black text-xl text-amber-400 bg-slate-900 py-2 rounded-xl border border-slate-700">
                                                ⏱️ 剩餘時間: {Math.floor(challengeRemainingSecs/60).toString().padStart(2,'0')}:{(challengeRemainingSecs%60).toString().padStart(2,'0')}
                                            </div>
                                        )}

                                        <div class="space-y-6 max-h-96 overflow-y-auto pr-1">
                                            {activeQuestion.challenge.questions.map((q) => {
                                                const myAns = challengeAnswers[q.num];
                                                const isReleased = activeQuestion.challenge.scoresReleased;

                                                return (
                                                    <div key={q.num} class="p-4 bg-slate-900/80 rounded-2xl border border-slate-700 space-y-3">
                                                        <div class="font-bold text-sm text-indigo-300">
                                                            第 {q.num} 題: {q.text}
                                                        </div>
                                                        <div class="grid grid-cols-1 gap-2">
                                                            {q.options.map((opt) => {
                                                                let optBg = myAns === opt.letter ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-200';
                                                                
                                                                if (submitted && isReleased) {
                                                                    if (opt.letter === q.answer) {
                                                                        optBg = 'bg-emerald-600 text-white ring-2 ring-emerald-300';
                                                                    } else if (myAns === opt.letter && myAns !== q.answer) {
                                                                        optBg = 'bg-red-600 text-white line-through';
                                                                    }
                                                                }

                                                                return (
                                                                    <button 
                                                                        key={opt.letter}
                                                                        disabled={submitted}
                                                                        onClick={() => {
                                                                            setChallengeAnswers({ ...challengeAnswers, [q.num]: opt.letter });
                                                                        }}
                                                                        class={`p-3 rounded-xl text-xs font-bold text-left transition flex items-center justify-between ${optBg}`}
                                                                    >
                                                                        <span>{opt.letter}. {opt.text}</span>
                                                                        {submitted && isReleased && opt.letter === q.answer && <span>(正確答案)</span>}
                                                                    </button>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        {!submitted && (
                                            <button 
                                                onClick={handleSubmitChallenge}
                                                class="w-full py-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-base shadow-lg transition active:scale-98"
                                            >
                                                確認提交評估考卷 🚀
                                            </button>
                                        )}

                                        {submitted && activeQuestion.challenge.scoresReleased && myResponse && (
                                            <div class="p-4 bg-emerald-500/20 rounded-2xl border border-emerald-500/30 text-center space-y-1">
                                                <span class="text-xs text-slate-300 font-bold block">評估發放成績</span>
                                                <span class="text-3xl font-black text-emerald-400">
                                                    {myResponse.score} / {activeQuestion.challenge.totalScore} 分
                                                </span>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Unified Submission Feedback Message */}
                                {submitted && (
                                    <div class="p-5 bg-gradient-to-r from-emerald-600/20 via-indigo-600/20 to-purple-600/20 rounded-2xl border border-emerald-500/30 text-center space-y-1 animate-fade-in">
                                        <div class="text-2xl">🎉</div>
                                        <div class="text-base font-black text-emerald-400">已提交答案! 讚賞你的努力!</div>
                                        <div class="text-xs text-slate-300 font-bold">安靜等候老師指示...</div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Collaborative Mode Student View */}
                        {collabState && (
                            <StudentCollabRaceView 
                                collabState={collabState}
                                studentId={studentId}
                                seatNumber={seatNumber}
                                studentName={studentName}
                                roomCode={roomCode}
                                showToast={showToast}
                            />
                        )}
                    </main>
                </div>
            );
        }

        function StudentCollabRaceView({ collabState, studentId, seatNumber, studentName, roomCode, showToast }) {
            const { stage, data, groups, progress } = collabState;
            
            // Find my group
            const myGroupIdx = useMemo(() => {
                return groups.findIndex(g => g.members.some(m => m.id === studentId || m.seatNumber === seatNumber));
            }, [groups, studentId, seatNumber]);

            const myGroup = myGroupIdx !== -1 ? groups[myGroupIdx] : null;
            const myMemberIndex = myGroup ? myGroup.members.findIndex(m => m.id === studentId || m.seatNumber === seatNumber) : 0;
            const myGroupProg = myGroupIdx !== -1 ? (progress[myGroupIdx] || 0) : 0;

            const currentQ = data?.questions?.[myGroupProg] || null;

            if (stage === 'GROUPING') {
                return (
                    <div class="bg-slate-800 rounded-3xl p-6 border border-slate-700 shadow-2xl text-center space-y-4">
                        <h2 class="text-lg font-black text-purple-400">👥 合作題分組完成</h2>
                        {myGroup ? (
                            <div class={`p-6 rounded-2xl border-2 ${myGroup.color} space-y-2`}>
                                <div class="text-4xl">{myGroup.emoji}</div>
                                <div class="text-2xl font-black">{myGroup.name}</div>
                                <p class="text-sm font-bold text-white">
                                    同組成員: {myGroup.members.map(m => `${m.seatNumber}號 ${m.name}`).join('、 ')}
                                </p>
                            </div>
                        ) : (
                            <p class="text-slate-400 text-sm">正在分組中，請稍候...</p>
                        )}
                        <p class="text-xs font-bold text-amber-400 animate-pulse">盡快與你的組員會合!比賽即將開始!</p>
                    </div>
                );
            }

            if (stage === 'RACE' && currentQ && myGroup) {
                // Distribute question text vs options across group members!
                const isQuestionViewer = myMemberIndex === 0;
                
                return (
                    <div class="bg-slate-800 rounded-3xl p-6 border border-slate-700 shadow-2xl space-y-5">
                        <div class="flex items-center justify-between border-b border-slate-700 pb-2">
                            <span class="text-xs font-black text-amber-400">
                                {myGroup.emoji} {myGroup.name} (第 {myGroupProg + 1} / {data.questions.length} 題)
                            </span>
                            <span class="text-xs font-mono text-slate-400">團隊合作分工中</span>
                        </div>

                        {/* Distributed Content Display */}
                        {isQuestionViewer ? (
                            <div class="p-6 bg-slate-900 rounded-2xl border border-indigo-500/50 space-y-3 text-center">
                                <span class="text-xs font-extrabold text-indigo-400 block uppercase">【您的螢幕任務：題目閱讀】</span>
                                <p class="text-lg font-black text-white">{currentQ.text}</p>
                                <p class="text-xs text-amber-300 font-bold">請大聲讀出題目，讓組員選擇正確答案！</p>
                            </div>
                        ) : (
                            <div class="space-y-3">
                                <span class="text-xs font-extrabold text-indigo-400 block text-center uppercase">【您的螢幕任務：選擇答案】</span>
                                <div class="grid grid-cols-1 gap-2">
                                    {currentQ.options.map(opt => (
                                        <button 
                                            key={opt.letter}
                                            onClick={async () => {
                                                const isCorrect = opt.letter === currentQ.answer;
                                                const appId = "omit-8c173";
                                                const db = window.fbDb;
                                                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                                                let nextProg = isCorrect ? myGroupProg + 1 : 0; // Wrong answer resets progress to 0!
                                                const newProgress = { ...progress, [myGroupIdx]: nextProg };

                                                await window.fbUtils.setDoc(roomDocRef, {
                                                    collabState: {
                                                        ...collabState,
                                                        progress: newProgress
                                                    }
                                                }, { merge: true });

                                                if (isCorrect) {
                                                    playSound('win');
                                                    showToast("答對了！推進下一題！", "success");
                                                } else {
                                                    playSound('alarm');
                                                    showToast("答錯了！倒扣回到第一題重新開始！", "error");
                                                }
                                            }}
                                            class="p-4 rounded-2xl bg-slate-700 hover:bg-slate-600 text-white font-black text-base transition shadow active:scale-98"
                                        >
                                            {opt.letter}. {opt.text}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
