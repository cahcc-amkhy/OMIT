<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMIT 互動課堂 - 免登入即時課堂互動平台</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            touch-action: manipulation;
        }
        .canvas-container {
            touch-action: none;
        }

        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;

            transition: transform 0.1s ease;

        .active-scale:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration from User Request
        const firebaseConfig = {
            apiKey: "AIzaSyAcphRXxqs_MTeWwffVVOFsnb8Liro5Lto",
            authDomain: "omit-8c173.firebaseapp.com",
            projectId: "omit-8c173",
            storageBucket: "omit-8c173.firebasestorage.app",
            messagingSenderId: "1078509757779",
            appId: "1:1078509757779:web:64fe9465920eca4f38ada6"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'omit-class-prod';

        // Expose Firebase globally to React script
        window.OMIT_FB = {
            app, auth, db, appId,
            signInAnonymously, signInWithCustomToken, onAuthStateChanged,
            doc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot, collection
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Custom Toast Notification
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (
                <div class={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-xl shadow-lg flex items-center space-x-2 text-sm font-medium animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        const CanvasBoard = ({ onSave, initialData }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [color, setColor] = useState('#4f46e5');
            const [lineWidth, setLineWidth] = useState(4);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                // Handle canvas sizing
                const resize = () => {
                    const parent = canvas.parentElement;
                    if (parent) {
                        const tempImg = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        canvas.width = parent.clientWidth;
                        canvas.height = 300;
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.putImageData(tempImg, 0, 0);
                    }
                };
                resize();

                if (initialData) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0);
                    img.src = initialData;
                }
            }, []);

            const startDrawing = (e) => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                ctx.beginPath();
                ctx.moveTo(clientX - rect.left, clientY - rect.top);
                ctx.strokeStyle = color;
                ctx.lineWidth = lineWidth;
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                ctx.lineTo(clientX - rect.left, clientY - rect.top);
                ctx.stroke();
            };

            const stopDrawing = () => {
                if (isDrawing) {
                    setIsDrawing(false);
                    const canvas = canvasRef.current;
                    onSave(canvas.toDataURL());
                }
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                onSave(canvas.toDataURL());
            };

            return (
                <div class="space-y-3">
                    <div class="flex items-center justify-between gap-2 flex-wrap bg-slate-50 p-2 rounded-xl border border-slate-200">
                        <div class="flex items-center space-x-1.5">
                            {['#4f46e5', '#ef4444', '#10b981', '#f59e0b', '#000000'].map(c => (
                                <button
                                    key={c}
                                    type="button"
                                    onClick={() => setColor(c)}
                                    class={`w-7 h-7 rounded-full border-2 transition ${color === c ? 'scale-110 border-slate-800' : 'border-white'}`}
                                    style={{ backgroundColor: c }}
                                />
                            ))}
                        </div>
                        <div class="flex items-center space-x-2">
                            <input
                                type="range"
                                min="2"
                                max="16"
                                value={lineWidth}
                                onChange={(e) => setLineWidth(e.target.value)}
                                class="w-20 accent-indigo-600"
                            />
                            <button
                                type="button"
                                onClick={clearCanvas}
                                class="px-3 py-1 bg-rose-100 text-rose-700 hover:bg-rose-200 rounded-lg text-xs font-bold transition"
                            >
                                🗑️ 清空
                            </button>
                        </div>
                    </div>
                    <div class="canvas-container border-2 border-dashed border-indigo-200 rounded-2xl overflow-hidden bg-white shadow-inner">
                        <canvas
                            ref={canvasRef}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            class="cursor-crosshair w-full block"
                        />
                    </div>
                </div>
            );
        };

        function OMITApp() {
            const [role, setRole] = useState('LANDING'); // 'LANDING', 'TEACHER', 'STUDENT'
            const [roomCode, setRoomCode] = useState('');
            const [studentName, setStudentName] = useState('');
            const [toast, setToast] = useState(null);

            // Cloud Auth User
            const [fbUser, setFbUser] = useState(null);

            // Shared Question & Room State
            const [activeQuestion, setActiveQuestion] = useState(null);
            const [studentsList, setStudentsList] = useState([]);
            const [responses, setResponses] = useState({});

            const bcRef = useRef(null);
            const myStudentId = useRef('std_' + Math.random().toString(36).substring(2, 9));

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            useEffect(() => {
                const initFirebase = async () => {
                    if (!window.OMIT_FB) return;
                    const { auth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = window.OMIT_FB;

                    onAuthStateChanged(auth, (user) => {
                        if (user) {
                            setFbUser(user);
                        } else {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                signInWithCustomToken(auth, __initial_auth_token).catch(() => signInAnonymously(auth));
                            } else {
                                signInAnonymously(auth).catch((err) => console.error("Firebase auth error:", err));
                            }
                        }
                    });
                };
                initFirebase();
            }, []);

            // Parse URL parameters for direct room joining via QR Code
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const roomParam = params.get('room');
                if (roomParam) {
                    setRoomCode(roomParam.toUpperCase());
                }
            }, []);

            useEffect(() => {
                if (!roomCode || !fbUser || !window.OMIT_FB) return;
                const { db, appId, doc, collection, onSnapshot, setDoc } = window.OMIT_FB;
                const cleanCode = roomCode.toUpperCase().trim();

                // Firestore Path (Rule 1 Compliant)
                const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', cleanCode);
                const responsesColRef = collection(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', cleanCode, 'responses');
                const studentsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', cleanCode, 'students');

                // Listen to Active Question Room Updates
                const unsubRoom = onSnapshot(roomDocRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        setActiveQuestion(data.activeQuestion || null);
                    }
                }, (err) => console.error("Room sync error:", err));

                // Listen to Student Responses
                const unsubResponses = onSnapshot(responsesColRef, (snapshot) => {
                    const respMap = {};
                    snapshot.forEach((docSnap) => {
                        respMap[docSnap.id] = docSnap.data();
                    });
                    setResponses(respMap);
                }, (err) => console.error("Responses sync error:", err));

                // Listen to Joined Students
                const unsubStudents = onSnapshot(studentsColRef, (snapshot) => {
                    const sList = [];
                    snapshot.forEach((docSnap) => {
                        sList.push(docSnap.data());
                    });
                    setStudentsList(sList);
                }, (err) => console.error("Students sync error:", err));

                // Local BroadcastChannel Fallback
                const channelName = `omit_room_${cleanCode}`;
                const bc = new BroadcastChannel(channelName);
                bcRef.current = bc;

                bc.onmessage = (event) => {
                    const { type, data } = event.data;
                    if (type === 'NEW_QUESTION') setActiveQuestion(data);
                    if (type === 'CLEAR_QUESTION') setActiveQuestion(null);
                };

                return () => {
                    unsubRoom();
                    unsubResponses();
                    unsubStudents();
                    bc.close();
                };
            }, [roomCode, fbUser]);

            // Create Room (Teacher)
            const handleCreateRoom = async () => {
                const generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
                setRoomCode(generatedCode);
                setRole('TEACHER');

                if (window.OMIT_FB && fbUser) {
                    const { db, appId, doc, setDoc } = window.OMIT_FB;
                    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', generatedCode);
                    await setDoc(roomDocRef, {
                        roomCode: generatedCode,
                        activeQuestion: null,
                        createdAt: Date.now()
                    }, { merge: true });
                }

                showToast(`已建立雲端互動課堂 房號：${generatedCode}`, 'success');
            };

            // Join Room (Student)
            const handleJoinRoom = async (e) => {
                e?.preventDefault();
                if (!roomCode.trim()) {
                    showToast('請輸入6位數字房號', 'error');
                    return;
                }
                if (!studentName.trim()) {
                    showToast('請輸入您的姓名或暱稱', 'error');
                    return;
                }

                const cleanCode = roomCode.trim().toUpperCase();

                if (window.OMIT_FB && fbUser) {
                    const { db, appId, doc, setDoc } = window.OMIT_FB;
                    const studentDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', cleanCode, 'students', myStudentId.current);
                    await setDoc(studentDocRef, {
                        studentId: myStudentId.current,
                        studentName: studentName.trim(),
                        joinedAt: Date.now()
                    }, { merge: true });
                }

                setRole('STUDENT');
                showToast(`已進入房號 ${cleanCode} 的課堂`, 'success');
            };

            if (role === 'LANDING') {
                return (
                    <div class="min-h-screen bg-gradient-to-br from-indigo-900 via-indigo-800 to-purple-900 flex items-center justify-center p-4">
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                        
                        <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 space-y-8 relative overflow-hidden">
                            <div class="text-center space-y-2">
                                <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl mb-2 font-black text-2xl shadow-inner">
                                    OMIT
                                </div>
                                <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">OMIT 互動課堂</h1>
                                <p class="text-slate-500 text-sm">免登入！雲端跨裝置即時反饋互動平台</p>
                            </div>

                            <div class="space-y-6">
                                {/* Student Join Section */}
                                <form onSubmit={handleJoinRoom} class="bg-indigo-50/70 p-5 rounded-2xl border border-indigo-100 space-y-4">
                                    <h2 class="text-xs font-bold text-indigo-600 uppercase tracking-wider">我是學生 (加入課堂)</h2>
                                    <div>
                                        <input 
                                            type="text" 
                                            placeholder="請輸入房號 (例如 123456)" 
                                            value={roomCode} 
                                            onChange={(e) => setRoomCode(e.target.value)}
                                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-mono text-center tracking-widest text-lg font-bold"
                                            maxLength={6}
                                        />
                                    </div>
                                    <div>
                                        <input 
                                            type="text" 
                                            placeholder="請輸入你的姓名 / 暱稱" 
                                            value={studentName} 
                                            onChange={(e) => setStudentName(e.target.value)}
                                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-medium"
                                        />
                                    </div>
                                    <button 
                                        type="submit" 
                                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-200 active-scale"
                                    >
                                        進入課堂 🚀
                                    </button>
                                </form>

                                <div class="relative flex py-1 items-center">
                                    <div class="flex-grow border-t border-slate-200"></div>
                                    <span class="flex-shrink mx-4 text-slate-400 text-xs font-medium">或</span>
                                    <div class="flex-grow border-t border-slate-200"></div>
                                </div>

                                {/* Teacher Create Section */}
                                <div class="text-center">
                                    <button 
                                        onClick={handleCreateRoom}
                                        class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl transition shadow-md flex items-center justify-center space-x-2 active-scale"
                                    >
                                        <span>👨‍🏫 開啟新課堂 (教師控制台)</span>
                                    </button>
                                    <p class="text-xs text-slate-400 mt-2">不需註冊，建立即可自動生成 QR Code 與跨裝置雲端連線</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (role === 'TEACHER') {
                return (
                    <TeacherDashboard 
                        roomCode={roomCode} 
                        activeQuestion={activeQuestion} 
                        setActiveQuestion={setActiveQuestion}
                        responses={responses}
                        setResponses={setResponses}
                        studentsList={studentsList}
                        bcRef={bcRef}
                        showToast={showToast}
                        fbUser={fbUser}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            if (role === 'STUDENT') {
                return (
                    <StudentInterface 
                        roomCode={roomCode}
                        studentName={studentName}
                        studentId={myStudentId.current}
                        activeQuestion={activeQuestion}
                        responses={responses}
                        bcRef={bcRef}
                        showToast={showToast}
                        fbUser={fbUser}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            return null;
        }

        function TeacherDashboard({ roomCode, activeQuestion, setActiveQuestion, responses, setResponses, studentsList, bcRef, showToast, fbUser, onExit }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE'); // 'CHOICE', 'TF', 'SHORT', 'DRAW'
            const [questionText, setQuestionText] = useState('');
            const [lockAfterSubmit, setLockAfterSubmit] = useState(false);
            const [showQRModal, setShowQRModal] = useState(false);
            const [choiceCount, setChoiceCount] = useState(4);
            const [viewImageModal, setViewImageModal] = useState(null);

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

            // Publish Question to Cloud
            const handlePublishQuestion = async () => {
                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: questionText.trim() || getDefaultQuestionPrompt(selectedMode),
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : []
                };

                setActiveQuestion(newQ);
                setResponses({});

                if (window.OMIT_FB && fbUser) {
                    const { db, appId, doc, setDoc } = window.OMIT_FB;
                    const cleanCode = roomCode.toUpperCase().trim();
                    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', cleanCode);
                    await setDoc(roomDocRef, { activeQuestion: newQ, updatedAt: Date.now() }, { merge: true });
                }

                if (bcRef.current) {
                    bcRef.current.postMessage({ type: 'NEW_QUESTION', data: newQ });
                }

                showToast('已雲端同步發佈題目給所有學生！', 'success');
            };

            // Clear Question
            const handleClearQuestion = async () => {
                setActiveQuestion(null);

                if (window.OMIT_FB && fbUser) {
                    const { db, appId, doc, setDoc } = window.OMIT_FB;
                    const cleanCode = roomCode.toUpperCase().trim();
                    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', cleanCode);
                    await setDoc(roomDocRef, { activeQuestion: null, updatedAt: Date.now() }, { merge: true });
                }

                if (bcRef.current) {
                    bcRef.current.postMessage({ type: 'CLEAR_QUESTION' });
                }
                showToast('已結束當前題目', 'info');
            };

            // Simulate responses for demo
            const handleSimulateResponses = async () => {
                if (!activeQuestion) return;
                const dummyNames = ['陳小明', '張華', '李美麗', '王大同', '趙強', '林心怡', '黃子軒', '周雅婷'];
                
                for (let idx = 0; idx < dummyNames.length; idx++) {
                    const name = dummyNames[idx];
                    const studentId = `sim_std_${idx}`;
                    const duration = (Math.random() * 8 + 1.5).toFixed(1);
                    let answer = '';

                    if (activeQuestion.mode === 'CHOICE') {
                        const opts = activeQuestion.choiceOptions;
                        answer = opts[Math.floor(Math.random() * opts.length)];
                    } else if (activeQuestion.mode === 'TF') {
                        answer = Math.random() > 0.5 ? '⭕' : '❌';
                    } else if (activeQuestion.mode === 'SHORT') {
                        const samples = ['我覺得光合作用需要陽光與水', '利用心智圖分類最清晰', '答案公式為 a² + b² = c²', '這道題目很有啟發性！'];
                        answer = samples[Math.floor(Math.random() * samples.length)];
                    } else if (activeQuestion.mode === 'DRAW') {
                        answer = 'SIMULATED_DRAWING';
                    }

                    const respData = {
                        studentId,
                        studentName: name,
                        answer,
                        timestamp: Date.now(),
                        duration: parseFloat(duration)
                    };

                    if (window.OMIT_FB && fbUser) {
                        const { db, appId, doc, setDoc } = window.OMIT_FB;
                        const cleanCode = roomCode.toUpperCase().trim();
                        const respRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', cleanCode, 'responses', studentId);
                        await setDoc(respRef, respData, { merge: true });
                    }
                }
                showToast('已生成 8 位模擬學生的回答數據', 'info');
            };

            const sortedResponses = useMemo(() => {
                return Object.values(responses).sort((a, b) => a.duration - b.duration);
            }, [responses]);

            function getDefaultQuestionPrompt(mode) {
                switch(mode) {
                    case 'CHOICE': return '請選擇正確答案：';
                    case 'TF': return '請判斷以下敘述是否正確 (⭕ / ❌)：';
                    case 'SHORT': return '請寫下你的想法或答案：';
                    case 'DRAW': return '請在畫布上繪製答案或繪圖表達：';
                    default: return '請回答題目：';
                }
            }

            return (
                <div class="min-h-screen bg-slate-100 pb-12">
                    {/* Header */}
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center font-black text-lg shadow-sm">
                                    OMIT
                                </div>
                                <div>
                                    <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                                        OMIT 互動課堂 <span class="text-xs px-2 py-0.5 bg-indigo-100 text-indigo-700 rounded-full font-medium">教師主控台</span>
                                    </h1>
                                    <p class="text-xs text-slate-500">房號：<span class="font-mono font-bold text-indigo-600 text-sm tracking-wider">{roomCode}</span></p>
                                </div>
                            </div>

                            <div class="flex items-center space-x-3">
                                <button 
                                    onClick={() => setShowQRModal(true)}
                                    class="px-3.5 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1.5 transition active-scale"
                                >
                                    <span>📱 課堂 QR Code</span>
                                </button>

                                <button 
                                    onClick={onExit}
                                    class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs sm:text-sm font-medium transition"
                                >
                                    離開課堂
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Teacher Content Grid */}
                    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
                        {/* Left Column: Question Setup Panel */}
                        <div class="lg:col-span-5 space-y-6">
                            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-5">
                                <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                                    <span>⚡ 發佈隨堂互動題目</span>
                                </h2>

                                {/* Mode Selectors */}
                                <div class="grid grid-cols-2 gap-2.5">
                                    {[
                                        { id: 'CHOICE', label: '選擇題', icon: '🔘', desc: 'A/B/C/D 複數選項' },
                                        { id: 'TF', label: '是非題', icon: '⭕', desc: '⭕ / ❌ 快問快答' },
                                        { id: 'SHORT', label: '短答題', icon: '✍️', desc: '文字看法與討論' },
                                        { id: 'DRAW', label: '白板題', icon: '🎨', desc: '幾何畫圖/心智圖' },
                                    ].map(item => (
                                        <button
                                            key={item.id}
                                            onClick={() => setSelectedMode(item.id)}
                                            class={`p-3 rounded-xl border text-left transition flex flex-col justify-between ${
                                                selectedMode === item.id 
                                                    ? 'border-indigo-600 bg-indigo-50/60 ring-2 ring-indigo-500/20' 
                                                    : 'border-slate-200 hover:border-slate-300 bg-white'
                                            }`}
                                        >
                                            <div class="flex items-center space-x-2 mb-1">
                                                <span class="text-lg">{item.icon}</span>
                                                <span class="font-bold text-sm text-slate-800">{item.label}</span>
                                            </div>
                                            <span class="text-xs text-slate-500">{item.desc}</span>
                                        </button>
                                    ))}
                                </div>

                                {selectedMode === 'CHOICE' && (
                                    <div class="flex items-center justify-between text-xs font-medium text-slate-600 bg-slate-50 p-3 rounded-xl">
                                        <span>選項個數：</span>
                                        <div class="flex space-x-2">
                                            <button 
                                                onClick={() => setChoiceCount(4)}
                                                class={`px-3 py-1 rounded-lg ${choiceCount === 4 ? 'bg-indigo-600 text-white font-bold' : 'bg-white border text-slate-700'}`}
                                            >
                                                4個 (A-D)
                                            </button>
                                            <button 
                                                onClick={() => setChoiceCount(5)}
                                                class={`px-3 py-1 rounded-lg ${choiceCount === 5 ? 'bg-indigo-600 text-white font-bold' : 'bg-white border text-slate-700'}`}
                                            >
                                                5個 (A-E)
                                            </button>
                                        </div>
                                    </div>
                                )}

                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1">題目說明 / 提示內容 (可留空)</label>
                                    <textarea 
                                        rows={2}
                                        placeholder="例如：請算出這題三角形的角度，或直接出題..."
                                        value={questionText}
                                        onChange={(e) => setQuestionText(e.target.value)}
                                        class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                    />
                                </div>

                                <div class="bg-amber-50/80 border border-amber-200 p-3.5 rounded-xl flex items-center justify-between">
                                    <div class="space-y-0.5">
                                        <div class="text-xs font-bold text-amber-900">🔒 限制提交後不能修改</div>
                                        <div class="text-[11px] text-amber-700">勾選後，學生一經提交即鎖定答案</div>
                                    </div>
                                    <input 
                                        type="checkbox" 
                                        checked={lockAfterSubmit}
                                        onChange={(e) => setLockAfterSubmit(e.target.checked)}
                                        class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer"
                                    />
                                </div>

                                <div class="space-y-2 pt-2">
                                    <button 
                                        onClick={handlePublishQuestion}
                                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-indigo-200 flex items-center justify-center space-x-2 active-scale"
                                    >
                                        <span>🚀 發佈題目至學生端</span>
                                    </button>

                                    {activeQuestion && (
                                        <button 
                                            onClick={handleClearQuestion}
                                            class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl transition text-sm"
                                        >
                                            收回 / 結束此題
                                        </button>
                                    )}
                                </div>
                            </div>

                            {/* Demo Student Data Simulation Button */}
                            <div class="bg-white p-4 rounded-2xl border border-slate-200 text-center space-y-2">
                                <p class="text-xs text-slate-500">測試與簡報展示輔助：</p>
                                <button 
                                    onClick={handleSimulateResponses}
                                    disabled={!activeQuestion}
                                    class="w-full py-2 bg-purple-50 hover:bg-purple-100 text-purple-700 font-bold rounded-xl text-xs transition border border-purple-200 disabled:opacity-50"
                                >
                                    🧪 快速生成 8 位學生模擬作答
                                </button>
                            </div>
                        </div>

                        {/* Right Column: Live Analytics & Student Submissions */}
                        <div class="lg:col-span-7 space-y-6">
                            {/* Active Question Bar */}
                            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                                <div class="flex items-center justify-between border-b pb-3">
                                    <div class="flex items-center space-x-2">
                                        <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                                        <h3 class="font-bold text-slate-800">即時課堂作答監控</h3>
                                    </div>
                                    <div class="text-xs font-semibold px-3 py-1 bg-slate-100 text-slate-600 rounded-full">
                                        已收到作答：<span class="text-indigo-600 font-bold text-sm">{Object.keys(responses).length}</span> 份
                                    </div>
                                </div>

                                {!activeQuestion ? (
                                    <div class="py-12 text-center text-slate-400 space-y-2">
                                        <div class="text-4xl">⏳</div>
                                        <p class="text-sm font-medium">目前尚未發佈題目，請於左側選擇題型並發佈</p>
                                    </div>
                                ) : (
                                    <div class="space-y-5">
                                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                            <div class="text-xs text-indigo-600 font-bold mb-1">【{activeQuestion.mode}】當前題目：</div>
                                            <div class="text-slate-800 font-medium text-base">{activeQuestion.text}</div>
                                        </div>

                                        {/* Visualization by Type */}
                                        {activeQuestion.mode === 'CHOICE' && (
                                            <ChoiceChart activeQuestion={activeQuestion} responses={responses} />
                                        )}

                                        {activeQuestion.mode === 'TF' && (
                                            <TFChart responses={responses} />
                                        )}

                                        {activeQuestion.mode === 'SHORT' && (
                                            <ShortAnswersGrid responses={responses} />
                                        )}

                                        {activeQuestion.mode === 'DRAW' && (
                                            <DrawAnswersGrid responses={responses} onViewImage={setViewImageModal} />
                                        )}

                                        {/* Speed Leaderboard */}
                                        <div class="pt-4 border-t border-slate-100">
                                            <h4 class="text-xs font-bold text-slate-500 mb-3 flex items-center gap-1">
                                                <span>⚡ 速度快問快答榜 (前 5 名)</span>
                                            </h4>
                                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                {sortedResponses.slice(0, 5).map((resp, i) => (
                                                    <div key={resp.studentId} class="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl text-xs">
                                                        <span class="font-bold text-slate-700">#{i+1} {resp.studentName}</span>
                                                        <span class="font-mono text-indigo-600 font-semibold">{resp.duration}s</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    {/* QR Code Modal */}
                    {showQRModal && (
                        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center space-y-5 shadow-2xl animate-fade-in">
                                <h3 class="text-xl font-bold text-slate-800">學生掃描加入課堂</h3>
                                <div class="bg-slate-50 p-4 rounded-2xl inline-block border border-slate-200">
                                    <img src={qrImageUrl} alt="QR Code" class="w-56 h-56 mx-auto rounded-lg" />
                                </div>
                                <div class="space-y-1">
                                    <div class="text-xs text-slate-500">房號 (Room Code)</div>
                                    <div class="font-mono text-3xl font-black text-indigo-600 tracking-widest">{roomCode}</div>
                                </div>
                                <button 
                                    onClick={() => setShowQRModal(false)}
                                    class="w-full bg-slate-800 text-white font-bold py-3 rounded-xl hover:bg-slate-900 transition"
                                >
                                    關閉
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Image Lightbox Modal for Student Canvas Drawings */}
                    {viewImageModal && (
                        <div class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4" onClick={() => setViewImageModal(null)}>
                            <div class="bg-white rounded-3xl p-4 max-w-lg w-full space-y-3" onClick={e => e.stopPropagation()}>
                                <div class="flex justify-between items-center border-b pb-2">
                                    <span class="font-bold text-slate-800">{viewImageModal.studentName} 的畫布提交</span>
                                    <button onClick={() => setViewImageModal(null)} class="text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
                                </div>
                                <img src={viewImageModal.answer} alt="Student Drawing" class="w-full rounded-2xl border" />
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const ChoiceChart = ({ activeQuestion, responses }) => {
            const options = activeQuestion.choiceOptions || ['A', 'B', 'C', 'D'];
            const total = Object.keys(responses).length || 1;

            const counts = options.reduce((acc, opt) => {
                acc[opt] = Object.values(responses).filter(r => r.answer === opt).length;
                return acc;
            }, {});

            return (
                <div class="space-y-3">
                    {options.map(opt => {
                        const count = counts[opt] || 0;
                        const pct = Math.round((count / total) * 100);
                        return (
                            <div key={opt} class="space-y-1">
                                <div class="flex justify-between text-xs font-bold text-slate-700">
                                    <span>選項 {opt}</span>
                                    <span>{count} 人 ({pct}%)</span>
                                </div>
                                <div class="w-full bg-slate-100 h-4 rounded-full overflow-hidden flex">
                                    <div 
                                        class="bg-indigo-600 h-full transition-all duration-500 rounded-full"
                                        style={{ width: `${pct}%` }}
                                    ></div>
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        };

        const TFChart = ({ responses }) => {
            const total = Object.keys(responses).length || 1;
            const trueCount = Object.values(responses).filter(r => r.answer === '⭕' || r.answer === 'O').length;
            const falseCount = Object.values(responses).filter(r => r.answer === '❌' || r.answer === 'X').length;

            const truePct = Math.round((trueCount / total) * 100);
            const falsePct = Math.round((falseCount / total) * 100);

            return (
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-center space-y-1">
                        <div class="text-3xl font-black text-emerald-600">⭕ 正確 (O)</div>
                        <div class="text-2xl font-bold text-slate-800">{trueCount} 人</div>
                        <div class="text-xs text-emerald-700 font-semibold">{truePct}%</div>
                    </div>
                    <div class="bg-rose-50 border border-rose-200 rounded-2xl p-4 text-center space-y-1">
                        <div class="text-3xl font-black text-rose-600">❌ 錯誤 (X)</div>
                        <div class="text-2xl font-bold text-slate-800">{falseCount} 人</div>
                        <div class="text-xs text-rose-700 font-semibold">{falsePct}%</div>
                    </div>
                </div>
            );
        };

        const ShortAnswersGrid = ({ responses }) => {
            const list = Object.values(responses);
            if (list.length === 0) return <div class="text-xs text-slate-400">尚無文字回答...</div>;

            return (
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-60 overflow-y-auto p-1">
                    {list.map(r => (
                        <div key={r.studentId} class="bg-slate-50 border border-slate-200 p-3 rounded-xl space-y-1">
                            <div class="flex justify-between text-[11px] text-slate-500">
                                <span class="font-bold text-slate-700">{r.studentName}</span>
                                <span>{r.duration}s</span>
                            </div>
                            <div class="text-xs text-slate-800 font-medium break-words">{r.answer}</div>
                        </div>
                    ))}
                </div>
            );
        };

        const DrawAnswersGrid = ({ responses, onViewImage }) => {
            const list = Object.values(responses);
            if (list.length === 0) return <div class="text-xs text-slate-400">尚無畫布作答...</div>;

            return (
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 max-h-64 overflow-y-auto p-1">
                    {list.map(r => (
                        <div 
                            key={r.studentId} 
                            onClick={() => onViewImage(r)}
                            class="bg-white border border-slate-200 p-2 rounded-xl space-y-1.5 cursor-pointer hover:border-indigo-500 hover:shadow-md transition"
                        >
                            <div class="flex justify-between text-[11px] text-slate-600 font-bold">
                                <span class="truncate">{r.studentName}</span>
                                <span class="text-indigo-600">{r.duration}s</span>
                            </div>
                            {r.answer === 'SIMULATED_DRAWING' ? (
                                <div class="w-full h-24 bg-indigo-50 rounded-lg flex items-center justify-center text-xs text-indigo-500 font-bold">
                                    [模擬畫布繪圖]
                                </div>
                            ) : (
                                <img src={r.answer} alt="Drawing" class="w-full h-24 object-contain rounded-lg bg-slate-50 border" />
                            )}
                        </div>
                    ))}
                </div>
            );
        };

        function StudentInterface({ roomCode, studentName, studentId, activeQuestion, responses, bcRef, showToast, fbUser, onExit }) {
            const [selectedAnswer, setSelectedAnswer] = useState('');
            const [shortText, setShortText] = useState('');
            const [canvasData, setCanvasData] = useState('');
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [startTime, setStartTime] = useState(Date.now());

            useEffect(() => {
                if (activeQuestion) {
                    setStartTime(Date.now());
                    setSelectedAnswer('');
                    setShortText('');
                    setCanvasData('');
                    setIsSubmitted(false);
                }
            }, [activeQuestion?.id]);

            const handleSubmit = async (finalAns) => {
                const answerToSubmit = finalAns !== undefined ? finalAns : (activeQuestion.mode === 'SHORT' ? shortText : canvasData);
                if (!answerToSubmit) {
                    showToast('請先進行作答再提交！', 'error');
                    return;
                }

                const duration = parseFloat(((Date.now() - startTime) / 1000).toFixed(1));
                const respData = {
                    studentId,
                    studentName,
                    answer: answerToSubmit,
                    timestamp: Date.now(),
                    duration
                };

                // Sync to Cloud Firestore
                if (window.OMIT_FB && fbUser) {
                    const { db, appId, doc, setDoc } = window.OMIT_FB;
                    const cleanCode = roomCode.toUpperCase().trim();
                    const respRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', cleanCode, 'responses', studentId);
                    await setDoc(respRef, respData, { merge: true });
                }

                if (bcRef.current) {
                    bcRef.current.postMessage({ type: 'STUDENT_SUBMIT', data: respData });
                }

                setIsSubmitted(true);
                showToast('作答已成功送出！', 'success');
            };

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col">
                    {/* Student Top Bar */}
                    <header class="bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-30 flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                            <div>
                                <h1 class="text-sm font-bold text-slate-800">課堂房號：{roomCode}</h1>
                                <p class="text-xs text-slate-500">學生：<span class="font-bold text-indigo-600">{studentName}</span></p>
                            </div>
                        </div>
                        <button onClick={onExit} class="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-slate-600 font-medium">
                            離開
                        </button>
                    </header>

                    {/* Main Student Workspace */}
                    <main class="flex-1 max-w-lg w-full mx-auto p-4 flex flex-col justify-center space-y-4">
                        {!activeQuestion ? (
                            <div class="bg-white rounded-3xl p-8 text-center space-y-4 shadow-sm border border-slate-200 my-auto">
                                <div class="text-5xl animate-bounce">📡</div>
                                <h2 class="text-xl font-bold text-slate-800">等待老師發佈題目...</h2>
                                <p class="text-xs text-slate-500">請保持畫面開啟，題目出現時將自動同步顯示</p>
                            </div>
                        ) : (
                            <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-200 space-y-6">
                                {/* Question Title */}
                                <div class="space-y-1 border-b pb-4">
                                    <div class="text-xs font-bold text-indigo-600">【隨堂測驗】</div>
                                    <h2 class="text-lg font-bold text-slate-800">{activeQuestion.text}</h2>
                                </div>

                                {/* Answer Input Mode Rendering */}
                                {activeQuestion.mode === 'CHOICE' && (
                                    <div class="grid grid-cols-1 gap-3">
                                        {(activeQuestion.choiceOptions || ['A', 'B', 'C', 'D']).map(opt => (
                                            <button
                                                key={opt}
                                                disabled={isSubmitted && activeQuestion.lockAfterSubmit}
                                                onClick={() => {
                                                    setSelectedAnswer(opt);
                                                    handleSubmit(opt);
                                                }}
                                                class={`w-full py-4 rounded-2xl font-bold text-lg border-2 transition active-scale flex items-center justify-between px-6 ${
                                                    selectedAnswer === opt 
                                                        ? 'bg-indigo-600 text-white border-indigo-600 shadow-md shadow-indigo-200' 
                                                        : 'bg-slate-50 hover:bg-slate-100 border-slate-200 text-slate-700'
                                                }`}
                                            >
                                                <span>選項 {opt}</span>
                                                {selectedAnswer === opt && <span>✓</span>}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {activeQuestion.mode === 'TF' && (
                                    <div class="grid grid-cols-2 gap-4">
                                        {['⭕', '❌'].map(tfOpt => (
                                            <button
                                                key={tfOpt}
                                                disabled={isSubmitted && activeQuestion.lockAfterSubmit}
                                                onClick={() => {
                                                    setSelectedAnswer(tfOpt);
                                                    handleSubmit(tfOpt);
                                                }}
                                                class={`py-8 rounded-2xl font-black text-4xl border-2 transition active-scale ${
                                                    selectedAnswer === tfOpt 
                                                        ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg' 
                                                        : 'bg-slate-50 border-slate-200 hover:bg-slate-100'
                                                }`}
                                            >
                                                {tfOpt}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-4">
                                        <textarea
                                            rows={4}
                                            disabled={isSubmitted && activeQuestion.lockAfterSubmit}
                                            placeholder="請在這裡輸入你的回答..."
                                            value={shortText}
                                            onChange={(e) => setShortText(e.target.value)}
                                            class="w-full p-4 border-2 border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-800 font-medium"
                                        />
                                        <button
                                            disabled={isSubmitted && activeQuestion.lockAfterSubmit}
                                            onClick={() => handleSubmit()}
                                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl transition shadow-lg shadow-indigo-200 active-scale"
                                        >
                                            {isSubmitted ? '修改並重新提交' : '提交答案 🚀'}
                                        </button>
                                    </div>
                                )}

                                {activeQuestion.mode === 'DRAW' && (
                                    <div class="space-y-4">
                                        <CanvasBoard onSave={setCanvasData} />
                                        <button
                                            disabled={isSubmitted && activeQuestion.lockAfterSubmit}
                                            onClick={() => handleSubmit()}
                                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl transition shadow-lg shadow-indigo-200 active-scale"
                                        >
                                            {isSubmitted ? '修改並重新提交畫布' : '提交繪圖 🎨'}
                                        </button>
                                    </div>
                                )}

                                {/* Lock / Submitted Status Notice */}
                                {isSubmitted && (
                                    <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-2xl text-center text-xs font-bold text-emerald-700">
                                        {activeQuestion.lockAfterSubmit ? '🔒 已成功提交，答案已鎖定' : '✅ 作答已送出 (老師解鎖修改權限中)'}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
