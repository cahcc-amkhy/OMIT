    // Web Audio API Sound Generator
    const playSound = (type) => {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (ctx.state === 'suspended') {
                ctx.resume();
            }

            if (type === 'buzzer') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } else if (type === 'spin') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } else if (type === 'win') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + idx * 0.1);
                    osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                });
            } else if (type === 'alarm') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(900, ctx.currentTime);
                osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            }
        } catch (e) {
            console.error("Audio error:", e);
        }
    };

    const extractYouTubeEmbed = (url) => {
        if (!url) return null;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
    };

    // Helper to generate a valid Word (.docx) binary Blob using JSZip
    const createWordDocxBlob = async (textLines) => {
        if (!window.JSZip) {
            throw new Error("JSZip library is not loaded.");
        }
        const zip = new JSZip();

        zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>


        zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>


        zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>


`);

        const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
            switch (c) {
                case '<': return '&lt;';
                case '>': return '&gt;';
                case '&': return '&amp;';
                case '\'': return '&apos;';
                case '"': return '&quot;';
                default: return c;
            }
        });

        const paragraphsXml = textLines.map(line => {
            return `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`;
        }).join('\n');

        zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>


<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:body>
${paragraphsXml}
</w:body>
</w:document>`);

        return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
    };

    const parseWordChallengeText = (rawText) => {
        const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
        let title = '地球生病了';
        let totalScore = 100;
        const questions = [];

        let currentQ = null;

        lines.forEach((line) => {
            if (/^(標題|Title)[：:]/i.test(line)) {
                title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                return;
            }
            if (/^(總分|Total)[：:]/i.test(line)) {
                const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                totalScore = parseInt(scoreStr) || 100;
                return;
            }

            const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
            if (qMatch) {
                if (currentQ && currentQ.options.length > 0) {
                    questions.push(currentQ);
                }
                currentQ = {
                    num: parseInt(qMatch[1]),
                    text: qMatch[2].trim(),
                    options: [],
                    answer: 'A'
                };
                return;
            }

            const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
            if (optMatch && currentQ) {
                const letter = optMatch[1].toUpperCase();
                let optText = optMatch[2].trim();
                
                let isCorrect = false;
                if (line.includes('*') || optText.endsWith('*')) {
                    isCorrect = true;
                    optText = optText.replace(/\*/g, '').trim();
                }

                currentQ.options.push({
                    letter: letter,
                    text: optText
                });

                if (isCorrect) {
                    currentQ.answer = letter;
                }
            }
        });

        if (currentQ && currentQ.options.length > 0) {
            questions.push(currentQ);
        }

        if (questions.length === 0) {
            return {
                title: title || "地球生病了",
                totalScore: 100,
                questions: [
                    {
                        num: 1,
                        text: "以下哪一項不是地球的天然資源?",
                        options: [
                            { letter: "A", text: "水資源" },
                            { letter: "B", text: "植物資源" },
                            { letter: "C", text: "動物資源" },
                            { letter: "D", text: "機械資源" }
                        ],
                        answer: "D"
                    },
                    {
                        num: 2,
                        text: "芝士的原料屬於哪一項地球的天然資源?",
                        options: [
                            { letter: "A", text: "水資源" },
                            { letter: "B", text: "植物資源" },
                            { letter: "C", text: "動物資源" },
                            { letter: "D", text: "礦產資源" }
                        ],
                        answer: "C"
                    }
                ]
            };
        }

        return {
            title,
            totalScore,
            questions
        };
    };

        const [docxFileName, setDocxFileName] = useState('');

        const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

        const currentQuestionResponses = useMemo(() => {
            if (!activeQuestion) return {};
            const filtered = {};

                    filtered[r.studentId] = r;
                }
            });
            return filtered;
        }, [responses, activeQuestion]);

        useEffect(() => {
            let interval = null;
            if (timerActive && timerSeconds > 0) {
                interval = setInterval(() => {
                    setTimerSeconds(s => {
                        if (s <= 1) {
                            setTimerActive(false);
                            playSound('alarm');
                            return 0;
                        }
                        return s - 1;
                    });
                }, 1000);
            }
            return () => clearInterval(interval);
        }, [timerActive, timerSeconds]);

        const publishQuestionToFirestore = async (qObj, newHistoryList) => {
            const appId = "omit-8c173";
            const db = window.fbDb;
            const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
            
            const updatePayload = {
                activeQuestion: qObj,
                updatedAt: Date.now()
            };
            if (newHistoryList) {
                updatePayload.history = newHistoryList;
            }

            await window.fbUtils.setDoc(roomDocRef, updatePayload, { merge: true });
        };

        const handleExitRoom = async () => {
            if (window.confirm("確定退出課室？將會同步清空此課室於 Firebase 的所有暫存紀錄！")) {
                try {
                    const appId = "omit-8c173";
                    const db = window.fbDb;
                    
                    const responsesColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');
                    const resSnaps = await window.fbUtils.getDocs(responsesColRef);
                    resSnaps.forEach(async (d) => {
                        await window.fbUtils.deleteDoc(d.ref);
                    });

                    const studentsColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                    const stuSnaps = await window.fbUtils.getDocs(studentsColRef);
                    stuSnaps.forEach(async (d) => {
                        await window.fbUtils.deleteDoc(d.ref);
                    });

                    const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                    await window.fbUtils.deleteDoc(roomDocRef);

                    showToast("課室暫存資料已完全清空！", "info");
                } catch (e) {
                    console.error("Cleanup error:", e);
                }
                onExit();
            }
        };

        const handleDownloadChallengeTemplate = async () => {
            const sampleLines = [
                "標題：地球生病了",
                "總分: 100分",
                "1.以下哪一項不是地球的天然資源?",
                "A. 水資源",
                "B. 植物資源",
                "C. 動物資源",
                "D. 機械資源*",
                "",
                "2.芝士的原料屬於哪一項地球的天然資源?",
                "A. 水資源",
                "B. 植物資源",
                "C. 動物資源*",
                "D. 礦產資源",
                "",
                "3.人們不當使用水資源會造成甚麼後果?",
                "A. 引發極端天氣",
                "B. 引發水災",
                "C. 水土流失",
                "D. 影響食水供應*",
                "",
                "4.人們不當使用煤和石油資源會造成甚麼後果?",
                "A. 引發極端天氣*",
                "B. 引發水災",
                "C. 水土流失",
                "D. 影響食水供應",
                "",
                "5.人們不當使用土地資源會造成甚麼後果?",
                "A. 引發極端天氣",
                "B. 引發水災*",
                "C. 產生大量二氧化碳",
                "D. 影響食水供應"
            ];

            try {
                const blob = await createWordDocxBlob(sampleLines);
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = '挑戰題評估範本_地球生病了.docx';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("已下載 Word 評估範本檔 (.docx)！", "success");
            } catch (err) {
                console.error("Docx generation error:", err);
                showToast("無法生成 Word 範本檔，請重新整理試試。", "error");
            }
        };

        const handleWordFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            setDocxFileName(file.name);
            const reader = new FileReader();

            reader.onload = async (evt) => {
                try {
                    let parsedData = null;
                    if (file.name.endsWith('.docx')) {
                        const arrayBuffer = evt.target.result;
                        const result = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                        parsedData = parseWordChallengeText(result.value);
                    } else {
                        const text = evt.target.result;
                        parsedData = parseWordChallengeText(text);
                    }

                    setChallengeData(parsedData);
                    showToast(`已成功解析範本檔案！共 ${parsedData.questions.length} 題`, 'success');
                } catch (err) {
                    console.error("Word file parse error:", err);
                    showToast("文件解析失敗，請確認格式！", "error");
                }
            };

            if (file.name.endsWith('.docx')) {
                reader.readAsArrayBuffer(file);
            } else {
                reader.readAsText(file, "UTF-8");
            }
        };

        const handleUpdateChallengeTitle = (newTitle) => {
            setChallengeData(prev => prev ? { ...prev, title: newTitle } : null);
        };

        const handleUpdateChallengeScore = (newScore) => {
            setChallengeData(prev => prev ? { ...prev, totalScore: parseInt(newScore) || 100 } : null);
        };

        const handleUpdateQuestionText = (qIndex, text) => {
            setChallengeData(prev => {
                if (!prev) return null;
                const newQs = [...prev.questions];
                newQs[qIndex] = { ...newQs[qIndex], text };
                return { ...prev, questions: newQs };
            });
        };

        const handleUpdateOptionText = (qIndex, optIndex, text) => {
            setChallengeData(prev => {
                if (!prev) return null;
                const newQs = [...prev.questions];
                const newOpts = [...newQs[qIndex].options];
                newOpts[optIndex] = { ...newOpts[optIndex], text };
                newQs[qIndex] = { ...newQs[qIndex], options: newOpts };
                return { ...prev, questions: newQs };
            });
        };

        const handleUpdateCorrectAnswer = (qIndex, answerLetter) => {
            setChallengeData(prev => {
                if (!prev) return null;
                const newQs = [...prev.questions];
                newQs[qIndex] = { ...newQs[qIndex], answer: answerLetter };
                return { ...prev, questions: newQs };
            });
        };

        const handleDeleteQuestion = (qIndex) => {
            setChallengeData(prev => {
                if (!prev) return null;
                const newQs = prev.questions.filter((_, idx) => idx !== qIndex).map((q, idx) => ({
                    ...q,
                    num: idx + 1
                }));
                return { ...prev, questions: newQs };
            });
            showToast("已成功刪除該題目！", "info");
        };

        const handlePublishQuestion = () => {
            const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
            
            let challengeContent = null;
            if (selectedMode === 'CHALLENGE') {
                if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                    showToast("請先上載並解析 Word 評估範本檔案！", "error");
                    return;
                }
                challengeContent = {
                    title: challengeData.title,
                    totalScore: challengeData.totalScore,
                    questions: challengeData.questions,
                    enableTimer: challengeEnableTimer,
                    timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                    releaseInstant: challengeReleaseInstant,
                    scoresReleased: challengeReleaseInstant
                };
            }

            const newQ = {
                id: 'q_' + Date.now(),
                mode: selectedMode,
                text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                startTime: Date.now(),
                lockAfterSubmit: lockAfterSubmit,
                whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                               selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                challenge: challengeContent
            };

            const updatedHistory = [...historyQuestions, newQ];
            setHistoryQuestions(updatedHistory);

            publishQuestionToFirestore(newQ, updatedHistory);
            showToast(`已成功發佈【${getModeLabel(selectedMode)}】給所有學生！`, 'success');
        };

        const handleReleaseChallengeScores = async () => {
            if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
            const updatedQ = {
                ...activeQuestion,
                challenge: {
                    ...activeQuestion.challenge,
                    scoresReleased: true
                }
            };
            await publishQuestionToFirestore(updatedQ);
            showToast("已成功向所有學生一併發放挑戰題成績！", "success");
        };

        const handleDownloadAllAudio = async () => {
            const audioSubmissions = Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:audio'));
            
            if (audioSubmissions.length === 0) {
                showToast("目前尚無學生提交錄音！", "error");
                return;
            }

            try {
                const zip = new JSZip();
                const folder = zip.folder(`課堂錄音_房號${roomCode}`);

                audioSubmissions.forEach((res) => {
                    const base64Data = res.answer.split(',')[1];
                    const fileName = `${res.seatNumber.toString().padStart(2, '0')}_${res.name || '學生'}.webm`;
                    folder.file(fileName, base64Data, { base64: true });
                });

                const content = await zip.generateAsync({ type: "blob" });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = `OMIT_學生錄音_房號${roomCode}.zip`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                showToast(`已打包並下載 ${audioSubmissions.length} 位學生的語音檔案！`, "success");
            } catch (err) {
                console.error("ZIP creation error:", err);
                showToast("打包錄音檔案失敗！", "error");
            }
        };

        const handleClearQuestion = async () => {
            const appId = "omit-8c173";
            const db = window.fbDb;
            const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
            await window.fbUtils.setDoc(roomDocRef, { activeQuestion: null }, { merge: true });
            showToast('已結束當前題目', 'info');
        };

        const toggleLockMode = async () => {
            const newLock = !lockAfterSubmit;
            setLockAfterSubmit(newLock);
            if (activeQuestion) {
                const updatedQ = { ...activeQuestion, lockAfterSubmit: newLock };
                publishQuestionToFirestore(updatedQ);
                showToast(newLock ? "已鎖定答案（禁止修改）" : "已開放學生修改答案", "info");
            }
        };

        const handleBgUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    setWhiteboardBg(evt.target.result);
                    showToast("已成功載入 16:9 白板背景圖片！", "success");
                };
                reader.readAsDataURL(file);
            }
        };

        const handleBroadcastSubmission = async (studentRes) => {
            const appId = "omit-8c173";
            const db = window.fbDb;
            const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
            
            const updatedQ = { 
                ...activeQuestion, 
                broadcastedSubmission: studentRes 
            };
            await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
            showToast(`已成功廣播 ${studentRes.name} 的作品至全班螢幕！`, "success");
        };

        const handleSpinRandom = () => {
            if (isSpinning) return;
            
            const start = parseInt(rangeStart) || 1;
            const end = parseInt(rangeEnd) || 36;
            const available = [];
            for (let i = start; i <= end; i++) {
                if (!drawnNumbers.includes(i)) available.push(i);
            }

            if (available.length === 0) {
                showToast("此範圍內所有學號皆已被抽出！請點擊重置。", "error");
                return;
            }

            setIsSpinning(true);
            let counter = 0;
            const maxIntervals = 20;

            const timer = setInterval(() => {
                const temp = available[Math.floor(Math.random() * available.length)];
                setCurrentDrawn(temp);
                playSound('spin');
                counter++;

                if (counter >= maxIntervals) {
                    clearInterval(timer);
                    const finalPicked = available[Math.floor(Math.random() * available.length)];
                    setCurrentDrawn(finalPicked);
                    setDrawnNumbers(prev => [...prev, finalPicked]);
                    setIsSpinning(false);
                    playSound('win');
                }
            }, 100);
        };

        const handleExportCSVReport = () => {
            if (studentsList.length === 0) {
                showToast("目前尚無學生紀錄可供匯出！", "error");
                return;
            }

            let csvContent = "\uFEFF";
            csvContent += "學號,學生姓名,加入時間";

            historyQuestions.forEach((q, idx) => {
                const cleanText = (q.text || getModeLabel(q.mode)).replace(/"/g, '""');
                if (q.mode === 'CHALLENGE' && q.challenge) {
                    csvContent += `,第${idx + 1}題[挑戰題:${q.challenge.title}得分],第${idx + 1}題[挑戰題正確率]`;
                } else {
                    csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]: "${cleanText}"`;
                }
            });
            csvContent += "\n";

            const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

            sortedStudents.forEach((stu) => {
                const cleanName = (stu.name || '').replace(/"/g, '""');
                csvContent += `"${stu.seatNumber}號","${cleanName}","${stu.joinTime || ''}"`;
                
                historyQuestions.forEach((q) => {
                    const resKey = `${q.id}_${stu.id}`;
                    const res = responses[resKey];
                    
                    if (res && res.answer !== undefined && res.answer !== null) {
                        if (q.mode === 'CHALLENGE' && res.scoreDetails) {
                            csvContent += `,"${res.scoreDetails.totalScore} / ${q.challenge.totalScore}分","${res.scoreDetails.percentage}% (用時:${res.duration || 0}s)"`;
                        } else {
                            let ansVal = res.answer;
                            if (typeof ansVal === 'string' && ansVal.startsWith('data:image')) {
                                ansVal = '[圖像白板答案]';
                            } else if (typeof ansVal === 'string' && ansVal.startsWith('data:audio')) {
                                ansVal = '[語音錄音檔案]';
                            }
                            const cleanAns = String(ansVal).replace(/"/g, '""');
                            csvContent += `,"${cleanAns} (用時:${res.duration || 0}s)"`;
                        }
                    } else {
                        if (q.mode === 'CHALLENGE') {
                            csvContent += `,"未作答","0%"`;
                        } else {
                            csvContent += `,"未作答"`;
                        }
                    }
                });
                csvContent += "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `OMIT_課堂學習與挑戰題報告_房號${roomCode}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("完整學習報告與挑戰題成績已匯出試算表！", "success");
        };

        const leaderboard = useMemo(() => {
            return Object.values(currentQuestionResponses)
                .filter(r => r.duration !== undefined)
                .sort((a, b) => {
                    if (activeQuestion?.mode === 'CHALLENGE') {
                        const scoreA = a.scoreDetails?.totalScore || 0;
                        const scoreB = b.scoreDetails?.totalScore || 0;
                        if (scoreB !== scoreA) return scoreB - scoreA;
                    }
                    return parseFloat(a.duration) - parseFloat(b.duration);
                });
        }, [currentQuestionResponses, activeQuestion]);

        const whiteboardSubmissions = useMemo(() => {
            return Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:image'));
        }, [currentQuestionResponses]);

        const challengeScoresAreReleased = useMemo(() => {
            if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return true;
            return !!(activeQuestion.challenge?.releaseInstant || activeQuestion.challenge?.scoresReleased);
        }, [activeQuestion]);

        return (
            <div class="min-h-screen pb-12">
                <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 py-3">
                    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                        <div class="flex items-center space-x-3">
                            <span class="bg-slate-900 text-white font-black px-3 py-1.5 rounded-xl text-lg">OMIT</span>
                            <div>
                                <h1 class="font-bold text-slate-800 text-base flex items-center gap-2">
                                    宣道會陳元喜小學OMIT互動課堂
                                    <span class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded-full font-mono font-bold">
                                        房號：{roomCode}
                                    </span>
                                </h1>
                            </div>
                        </div>

                        <div class="flex flex-wrap items-center gap-2">
                            <button 
                                onClick={() => setShowQRModal(true)}
                                class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-2 rounded-xl border border-indigo-200 text-sm flex items-center space-x-1.5 transition"
                            >
                                <span>📱 QR Code</span>
                            </button>

                            <button 
                                onClick={() => setShowStudentListModal(true)}
                                class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold px-3 py-2 rounded-xl border border-emerald-200 text-sm flex items-center space-x-1.5 transition"
                            >
                                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                                <span>已加入：{studentsList.length} 人</span>
                            </button>

                            <button 
                                onClick={() => setShowRandomModal(true)}
                                class="bg-purple-50 hover:bg-purple-100 text-purple-700 font-bold px-3 py-2 rounded-xl border border-purple-200 text-sm transition"
                            >
                                🎲 抽選學生
                            </button>

                            <button 
                                onClick={() => setShowTimerModal(true)}
                                class={`px-3 py-2 rounded-xl border text-sm font-bold flex items-center space-x-1.5 transition ${
                                    timerActive 
                                    ? 'bg-amber-500 text-white border-amber-600 animate-pulse' 
                                    : 'bg-amber-50 hover:bg-amber-100 text-amber-800 border-amber-200'
                                }`}
                            >
                                <span>⏱️ 計時器</span>
                                {timerSeconds > 0 && (
                                    <span class="bg-white/20 font-mono text-xs px-1.5 py-0.5 rounded">
                                        {Math.floor(timerSeconds / 60)}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                    </span>
                                )}
                            </button>

                            <button 
                                onClick={handleExportCSVReport}
                                class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold px-3 py-2 rounded-xl border border-blue-200 text-sm transition"
                            >
                                📊 匯出報告
                            </button>

                            <button 
                                onClick={handleExitRoom}
                                class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2 rounded-xl border border-rose-200 text-sm transition"
                            >
                                🚪 退出課室
                            </button>
                        </div>
                    </div>
                </header>

                <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

                    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3">
                        {[
                            { id: 'CHOICE', label: '選擇題', icon: '🔘' },
                            { id: 'TF', label: '是非題', icon: '⭕' },
                            { id: 'SHORT', label: '短答題', icon: '✍️' },
                            { id: 'DRAW', label: '白板題', icon: '🎨' },
                            { id: 'BUZZER', label: '搶答題', icon: '🚨' },
                            { id: 'AUDIO', label: '錄音題', icon: '🎤' },
                            { id: 'CHALLENGE', label: '挑戰題', icon: '🏆' },
                            { id: 'LINK', label: '派送連結', icon: '🔗' }
                        ].map((mode) => (
                            <button 
                                key={mode.id}
                                onClick={() => setSelectedMode(mode.id)}
                                class={`p-3.5 rounded-2xl font-bold border-2 transition-all text-center flex flex-col items-center justify-center space-y-1 shadow-sm active:scale-95 ${
                                    selectedMode === mode.id 
                                    ? 'bg-slate-900 text-white border-slate-900 ring-4 ring-slate-200'

                                <span class="text-2xl">{mode.icon}</span>
                                <span class="text-xs md:text-sm font-extrabold">{mode.label}</span>

                                <span>模式設定：{getModeLabel(selectedMode)}</span>
                            </h2>

                            {selectedMode !== 'CHALLENGE' && (
                                <div class="flex items-center space-x-2 bg-slate-100 p-1.5 rounded-xl">
                                    <span class="text-xs font-bold text-slate-600 pl-2">提交後允許修改：</span>
                                    <button 
                                        onClick={toggleLockMode}
                                        class={`px-3 py-1 rounded-lg text-xs font-bold transition ${!lockAfterSubmit ? 'bg-emerald-500 text-white' : 'bg-slate-300 text-slate-600'}`}

                                        {!lockAfterSubmit ? '已開放修改' : '已鎖定 (預設)'}

                        {selectedMode === 'CHOICE' && (

    function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
        const [selectedAnswer, setSelectedAnswer] = useState('');
        const [shortAnswerInput, setShortAnswerInput] = useState('');
        const [submitted, setSubmitted] = useState(false);

        // Audio Question Recording States
        const [isRecording, setIsRecording] = useState(false);
        const [recordingTime, setRecordingTime] = useState(0);
        const [audioBlobUrl, setAudioBlobUrl] = useState(null);
        const [audioBase64, setAudioBase64] = useState(null);
        const mediaRecorderRef = useRef(null);
        const audioChunksRef = useRef([]);
        const recordingTimerRef = useRef(null);

        // Challenge Question Student Answers State
        const [challengeAnswers, setChallengeAnswers] = useState({});
        const [challengeRemainingTime, setChallengeRemainingTime] = useState(null);

        // Whiteboard Canvas States
        const canvasRef = useRef(null);
        const [isDrawing, setIsDrawing] = useState(false);
        const [penColor, setPenColor] = useState('#000000');
        const [penWidth, setPenWidth] = useState(4);
        const [isEraser, setIsEraser] = useState(false);
        const [studentCustomBg, setStudentCustomBg] = useState(null);

        const mySubmission = activeQuestion ? responses[`${activeQuestion.id}_${studentId}`] : null;

        useEffect(() => {
            setSelectedAnswer('');
            setShortAnswerInput('');
            setSubmitted(!!mySubmission);
            setChallengeAnswers({});
            setAudioBlobUrl(null);
            setAudioBase64(null);
            setIsRecording(false);
            setStudentCustomBg(null);
        }, [activeQuestion?.id]);

        useEffect(() => {
            if (activeQuestion && activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer && !mySubmission) {
                const limitSec = activeQuestion.challenge.timeLimit || 120;
                const elapsedSec = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                const remaining = Math.max(0, limitSec - elapsedSec);

                setChallengeRemainingTime(remaining);

                const timer = setInterval(() => {
                    setChallengeRemainingTime(r => {
                        if (r <= 1) {
                            clearInterval(timer);
                            handleAutoSubmitChallenge();
                            return 0;
                        }
                        return r - 1;
                    });
                }, 1000);

                return () => clearInterval(timer);
            }
        }, [activeQuestion, mySubmission]);

        const initCanvas = (bgSrc) => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const sourceBg = bgSrc || studentCustomBg || activeQuestion?.whiteboardBg;

            if (sourceBg) {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.src = sourceBg;
                img.onload = () => {
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                };
            } else {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        };

        useEffect(() => {
            if (activeQuestion && activeQuestion.mode === 'DRAW' && canvasRef.current) {
                initCanvas();
            }
        }, [activeQuestion, studentCustomBg]);

        const getPreciseCoords = (e) => {
            const canvas = canvasRef.current;
            if (!canvas) return { x: 0, y: 0 };
            const rect = canvas.getBoundingClientRect();
            
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            let clientX = e.clientX;
            let clientY = e.clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        };

        const startDrawing = (e) => {
            if (mySubmission && activeQuestion?.lockAfterSubmit) return;
            e.preventDefault();
            setIsDrawing(true);
            const canvas = canvasRef.current;
            const ctx = canvas.getContext('2d');
            const coords = getPreciseCoords(e);
            ctx.beginPath();
            ctx.moveTo(coords.x, coords.y);
        };

        const draw = (e) => {
            if (!isDrawing) return;
            e.preventDefault();
            const canvas = canvasRef.current;
            const ctx = canvas.getContext('2d');
            const coords = getPreciseCoords(e);

            if (isEraser) {
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = penWidth * 4;
            } else {
                ctx.strokeStyle = penColor;
                ctx.lineWidth = penWidth;
            }

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();
        };

        const stopDrawing = (e) => {
            if (isDrawing) {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.closePath();
                setIsDrawing(false);
            }
        };

        const handleStudentBgUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const bgUrl = evt.target.result;
                    setStudentCustomBg(bgUrl);
                    initCanvas(bgUrl);
                    showToast("已成功更換白板背景圖片！", "success");
                };
                reader.readAsDataURL(file);
            }
        };

        const clearCanvas = () => {
            initCanvas();
            showToast("已清空白板！", "info");
        };

        const calculateChallengeScore = () => {
            if (!activeQuestion?.challenge?.questions) return { totalScore: 0, percentage: 0 };
            const qs = activeQuestion.challenge.questions;
            let correctCount = 0;
            qs.forEach((q, idx) => {
                if (challengeAnswers[idx] === q.answer) {
                    correctCount++;
                }
            });
            const scorePerQ = activeQuestion.challenge.totalScore / qs.length;
            const totalScore = Math.round(correctCount * scorePerQ);
            const percentage = Math.round((correctCount / qs.length) * 100);
            return { totalScore, percentage, correctCount, totalQs: qs.length };
        };

        const handleAutoSubmitChallenge = () => {
            const scoreObj = calculateChallengeScore();
            submitStudentResponse("CHALLENGE_COMPLETED", { scoreDetails: scoreObj });
            showToast("答題限時已到，系統已為您自動提交！", "info");
        };

        const startAudioRecording = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorderRef.current = new MediaRecorder(stream);
                audioChunksRef.current = [];

                mediaRecorderRef.current.ondataavailable = (e) => {
                    if (e.data.size > 0) {
                        audioChunksRef.current.push(e.data);
                    }
                };

                mediaRecorderRef.current.onstop = () => {
                    const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                    const url = URL.createObjectURL(audioBlob);
                    setAudioBlobUrl(url);

                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setAudioBase64(reader.result);
                    };
                    reader.readAsDataURL(audioBlob);
                };

                mediaRecorderRef.current.start();
                setIsRecording(true);
                setRecordingTime(0);

                recordingTimerRef.current = setInterval(() => {
                    setRecordingTime(t => {
                        if (t >= 9) {
                            stopAudioRecording();
                            return 10;
                        }
                        return t + 1;
                    });
                }, 1000);
            } catch (err) {
                console.error("Microphone access error:", err);
                showToast("無法存取麥克風，請檢查權限！", "error");
            }
        };

        const stopAudioRecording = () => {
            if (mediaRecorderRef.current && isRecording) {
                mediaRecorderRef.current.stop();
                mediaRecorderRef.current.stream.getTracks().forEach(track => track.stop());
                setIsRecording(false);
                if (recordingTimerRef.current) clearInterval(recordingTimerRef.current);
            }
        };

        const resetAudioRecording = () => {
            setAudioBlobUrl(null);
            setAudioBase64(null);
            setRecordingTime(0);
        };

        const submitStudentResponse = async (ansValue, extraData = {}) => {
            if (!activeQuestion) return;
            const duration = ((Date.now() - activeQuestion.startTime) / 1000).toFixed(1);
            const appId = "omit-8c173";
            const db = window.fbDb;
            
            const resKey = `${activeQuestion.id}_${studentId}`;
            const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', resKey);
            
            const responseData = {
                questionId: activeQuestion.id,
                studentId: studentId,
                seatNumber: seatNumber,
                name: studentName.trim() || `學號 ${seatNumber}`,
                answer: ansValue,
                duration: duration,
                submittedAt: Date.now(),
                ...extraData
            };

            await window.fbUtils.setDoc(resDocRef, responseData);
            setSubmitted(true);
            showToast("已成功提交答案！", "success");
        };

        const handleDrawSubmit = () => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            const dataUrl = canvas.toDataURL('image/png');
            submitStudentResponse(dataUrl);
        };

        const handleChallengeSubmit = () => {
            const scoreObj = calculateChallengeScore();
            submitStudentResponse("CHALLENGE_COMPLETED", { scoreDetails: scoreObj });
        };

        const isLocked = mySubmission && activeQuestion?.lockAfterSubmit;

        return (
            <div class="min-h-screen bg-slate-100 flex flex-col">
                <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-30">
                    <div class="max-w-3xl mx-auto flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <span class="bg-white/20 font-black px-2.5 py-1 rounded-lg text-sm">OMIT</span>
                            <div>
                                <div class="font-bold text-sm leading-tight">{studentName || `學號 ${seatNumber}`} ({seatNumber}號)</div>
                                <div class="text-xs text-indigo-200">房號：{roomCode}</div>
                            </div>
                        </div>
                        <button 
                            onClick={onExit}
                            class="bg-white/10 hover:bg-white/20 text-white font-bold px-3 py-1.5 rounded-xl text-xs transition"
                        >
                            退出課室
                        </button>
                    </div>
                </header>

                <main class="flex-1 max-w-3xl w-full mx-auto p-4 space-y-6">
                    {activeQuestion?.broadcastedSubmission && (
                        <div class="bg-purple-900 text-white rounded-3xl p-6 shadow-2xl space-y-4 border-4 border-purple-400 animate-fade-in">
                            <div class="flex justify-between items-center border-b border-purple-700 pb-3">
                                <span class="bg-purple-500 text-white text-xs px-3 py-1 rounded-full font-bold">
                                    📢 教師全班廣播作品
                                </span>
                                <span class="text-xs text-purple-200 font-bold">
                                    作者：{activeQuestion.broadcastedSubmission.name} ({activeQuestion.broadcastedSubmission.seatNumber}號)
                                </span>
                            </div>
                            <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden shadow-inner flex items-center justify-center">
                                <img 
                                    src={activeQuestion.broadcastedSubmission.answer} 
                                    class="max-h-full object-contain" 
                                    alt="廣播作品" 
                                />
                            </div>
                        </div>
                    )}

                    {!activeQuestion ? (
                        <div class="bg-white rounded-3xl p-10 text-center space-y-4 shadow-sm border mt-8">
                            <div class="text-6xl animate-pulse">⏳</div>
                            <h2 class="text-2xl font-black text-slate-800">等待老師發佈題目...</h2>
                            <p class="text-slate-500 text-sm">請維持畫面連線，題目將會自動即時呈現。</p>
                        </div>
                    ) : (
                        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-6">
                            <div class="border-b pb-4 space-y-1">
                                <div class="flex justify-between items-center">
                                    <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1 rounded-full font-bold">
                                        {getModeLabel(activeQuestion.mode)}
                                    </span>
                                    {mySubmission && (
                                        <span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-bold flex items-center gap-1">
                                            <span>✓</span> 已提交作答
                                        </span>
                                    )}
                                </div>
                                <h2 class="text-xl md:text-2xl font-black text-slate-800 pt-1">
                                    {activeQuestion.text}
                                </h2>
                            </div>

                            {/* Choice / TF Mode */}
                            {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                <div class="space-y-4">
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        {activeQuestion.choiceOptions.map((opt) => {
                                            const isSelected = (mySubmission?.answer || selectedAnswer) === opt;
                                            return (
                                                <button 
                                                    key={opt}
                                                    disabled={isLocked}
                                                    onClick={() => {
                                                        setSelectedAnswer(opt);
                                                        submitStudentResponse(opt);
                                                    }}
                                                    class={`p-5 rounded-2xl font-black text-lg text-left transition border-2 flex items-center justify-between shadow-sm active:scale-98 ${
                                                        isSelected 
                                                        ? 'bg-indigo-600 text-white border-indigo-600 ring-4 ring-indigo-100' 
                                                        : 'bg-slate-50 text-slate-800 border-slate-200 hover:border-indigo-300'
                                                    } ${isLocked ? 'opacity-80 cursor-not-allowed' : ''}`}
                                                >
                                                    <span>{opt}</span>
                                                    {isSelected && <span class="text-xl">✓</span>}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {/* Buzzer Mode */}
                            {activeQuestion.mode === 'BUZZER' && (
                                <div class="py-8 text-center space-y-6">
                                    <button 
                                        disabled={mySubmission}
                                        onClick={() => {
                                            playSound('buzzer');
                                            submitStudentResponse('搶答！');
                                        }}
                                        class={`w-48 h-48 rounded-full font-black text-3xl shadow-2xl transition transform active:scale-90 mx-auto flex items-center justify-center border-8 ${
                                            mySubmission 
                                            ? 'bg-slate-300 border-slate-400 text-slate-500 cursor-not-allowed' 
                                            : 'bg-rose-500 hover:bg-rose-600 border-rose-300 text-white animate-pulse'
                                        }`}
                                    >
                                        {mySubmission ? '已搶答！' : '🚨 搶答！'}
                                    </button>
                                </div>
                            )}

                            {/* Short Answer Mode */}
                            {activeQuestion.mode === 'SHORT' && (
                                <div class="space-y-4">
                                    <textarea 
                                        disabled={isLocked}
                                        value={mySubmission ? mySubmission.answer : shortAnswerInput}
                                        onChange={(e) => setShortAnswerInput(e.target.value)}
                                        placeholder="請在此輸入您的回答..."
                                        rows={4}
                                        class="w-full p-4 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 font-medium text-slate-800 disabled:bg-slate-50 disabled:text-slate-600"
                                    />
                                    {(!mySubmission || !activeQuestion.lockAfterSubmit) && (
                                        <button 
                                            onClick={() => {
                                                if (!shortAnswerInput.trim()) {
                                                    showToast("請輸入回答內容！", "error");
                                                    return;
                                                }
                                                submitStudentResponse(shortAnswerInput.trim());
                                            }}
                                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md transition"
                                        >
                                            {mySubmission ? '更新回答' : '提交回答'}
                                        </button>
                                    )}
                                </div>
                            )}

                            {/* Draw Mode */}
                            {activeQuestion.mode === 'DRAW' && (
                                <div class="space-y-4">
                                    <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-50 p-3 rounded-2xl border">
                                        <div class="flex items-center space-x-2">
                                            <span class="text-xs font-bold text-slate-500">畫筆顏色：</span>
                                            {['#000000', '#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'].map(color => (
                                                <button 
                                                    key={color}
                                                    onClick={() => { setPenColor(color); setIsEraser(false); }}
                                                    style={{ backgroundColor: color }}
                                                    class={`w-7 h-7 rounded-full border-2 transition ${!isEraser && penColor === color ? 'scale-125 border-slate-900 shadow-md' : 'border-white'}`}
                                                />
                                            ))}
                                        </div>

                                        <div class="flex items-center space-x-2">
                                            <button 
                                                onClick={() => setIsEraser(!isEraser)}
                                                class={`px-3 py-1.5 rounded-xl text-xs font-bold transition border ${isEraser ? 'bg-amber-500 text-white border-amber-600' : 'bg-white text-slate-700 border-slate-200'}`}
                                            >
                                                🧹 橡皮擦
                                            </button>
                                            <button 
                                                onClick={clearCanvas}
                                                class="px-3 py-1.5 rounded-xl text-xs font-bold bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100"
                                            >
                                                🗑️ 清空
                                            </button>
                                        </div>
                                    </div>

                                    <div class="flex items-center space-x-3 bg-slate-50 p-2 rounded-xl border">
                                        <span class="text-xs font-bold text-slate-500">上傳個人背景圖片:</span>
                                        <input 
                                            type="file" 
                                            accept="image/*" 
                                            onChange={handleStudentBgUpload}
                                            class="text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-700"
                                        />
                                    </div>

                                    <div class="canvas-container relative border-2 border-slate-300 rounded-2xl overflow-hidden bg-white shadow-inner aspect-16-9">
                                        <canvas 
                                            ref={canvasRef}
                                            width={1280}
                                            height={720}
                                            onMouseDown={startDrawing}
                                            onMouseMove={draw}
                                            onMouseUp={stopDrawing}
                                            onMouseLeave={stopDrawing}
                                            onTouchStart={startDrawing}
                                            onTouchMove={draw}
                                            onTouchEnd={stopDrawing}
                                            class="w-full h-full touch-none block bg-white cursor-crosshair"
                                        />
                                    </div>

                                    {(!mySubmission || !activeQuestion.lockAfterSubmit) && (
                                        <button 
                                            onClick={handleDrawSubmit}
                                            class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3.5 rounded-xl shadow-md transition"
                                        >
                                            {mySubmission ? '重新提交白板' : '提交白板作品'}
                                        </button>
                                    )}
                                </div>
                            )}

                            {/* Audio Mode */}
                            {activeQuestion.mode === 'AUDIO' && (
                                <div class="space-y-6 text-center py-4">
                                    {!audioBlobUrl ? (
                                        <div class="space-y-4">
                                            <div class="text-4xl font-mono font-black text-cyan-600">
                                                00:{recordingTime.toString().padStart(2, '0')} / 00:10
                                            </div>
                                            <p class="text-xs text-slate-500">限時最多 10 秒錄音</p>
                                            {!isRecording ? (
                                                <button 
                                                    onClick={startAudioRecording}
                                                    class="px-8 py-4 bg-cyan-600 hover:bg-cyan-700 text-white font-black rounded-2xl shadow-lg transition active:scale-95 flex items-center gap-2 mx-auto"
                                                >
                                                    <span>🎙️ 開始錄音</span>
                                                </button>
                                            ) : (
                                                <button 
                                                    onClick={stopAudioRecording}
                                                    class="px-8 py-4 bg-rose-600 hover:bg-rose-700 text-white font-black rounded-2xl shadow-lg transition animate-pulse flex items-center gap-2 mx-auto"
                                                >
                                                    <span>⏹️ 停止錄音</span>
                                                </button>
                                            )}
                                        </div>
                                    ) : (
                                        <div class="space-y-4 bg-cyan-50 p-6 rounded-2xl border border-cyan-200">
                                            <h4 class="font-bold text-cyan-900 text-sm">錄音預覽與試聽：</h4>
                                            <audio src={audioBlobUrl} controls class="mx-auto" />
                                            <div class="flex space-x-3 pt-2">
                                                <button 
                                                    onClick={resetAudioRecording}
                                                    class="flex-1 py-3 bg-slate-200 text-slate-700 font-bold rounded-xl text-sm"
                                                >
                                                    🔄 重新錄製
                                                </button>
                                                <button 
                                                    onClick={() => {
                                                        if (!audioBase64) return;
                                                        submitStudentResponse(audioBase64);
                                                    }}
                                                    class="flex-1 py-3 bg-cyan-600 hover:bg-cyan-700 text-white font-bold rounded-xl text-sm shadow-md"
                                                >
                                                    提交錄音
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* Challenge Mode */}
                            {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                <div class="space-y-6">
                                    <div class="flex flex-wrap justify-between items-center bg-amber-50 p-4 rounded-2xl border border-amber-200 gap-2">
                                        <div>
                                            <h3 class="font-black text-amber-900 text-lg">
                                                {activeQuestion.challenge.title}
                                            </h3>
                                            <span class="text-xs text-amber-700 font-bold">
                                                總分：{activeQuestion.challenge.totalScore} 分 (共 {activeQuestion.challenge.questions.length} 題)
                                            </span>
                                        </div>
                                        {challengeRemainingTime !== null && !mySubmission && (
                                            <div class="bg-amber-600 text-white px-3 py-1.5 rounded-xl font-mono font-bold text-sm">
                                                ⏱️ 賸餘時間: {Math.floor(challengeRemainingTime / 60)}:{(challengeRemainingTime % 60).toString().padStart(2, '0')}
                                            </div>
                                        )}
                                    </div>

                                    {!mySubmission ? (
                                        <div class="space-y-6">
                                            {activeQuestion.challenge.questions.map((q, qIdx) => (
                                                <div key={qIdx} class="bg-slate-50 p-4 rounded-2xl border space-y-3">
                                                    <div class="font-bold text-slate-800 text-sm">
                                                        {q.num || qIdx + 1}. {q.text}
                                                    </div>
                                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                        {q.options.map((opt) => {
                                                            const isChecked = challengeAnswers[qIdx] === opt.letter;
                                                            return (
                                                                <button 
                                                                    key={opt.letter}
                                                                    type="button"
                                                                    onClick={() => {
                                                                        setChallengeAnswers(prev => ({ ...prev, [qIdx]: opt.letter }));
                                                                    }}
                                                                    class={`p-3 rounded-xl border text-left text-xs font-bold transition flex items-center space-x-2 ${
                                                                        isChecked 
                                                                        ? 'bg-amber-500 text-white border-amber-600' 
                                                                        : 'bg-white text-slate-700 border-slate-200 hover:border-amber-300'
                                                                    }`}
                                                                >
                                                                    <span class="w-5 text-center">{opt.letter}.</span>
                                                                    <span>{opt.text}</span>
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            ))}

                                            <button 
                                                onClick={handleChallengeSubmit}
                                                class="w-full bg-amber-600 hover:bg-amber-700 text-white font-black py-4 rounded-2xl shadow-lg text-base transition"
                                            >
                                                提交挑戰題評估 🚀
                                            </button>
                                        </div>
                                    ) : (
                                        <div class="bg-emerald-50 border border-emerald-200 p-6 rounded-2xl text-center space-y-4">
                                            <div class="text-4xl">🎉</div>
                                            <h4 class="font-black text-emerald-900 text-xl">您已完成挑戰題評估！</h4>
                                            
                                            {(activeQuestion.challenge.scoresReleased || activeQuestion.challenge.releaseInstant) && mySubmission.scoreDetails ? (
                                                <div class="bg-white p-4 rounded-xl border border-emerald-200 max-w-sm mx-auto space-y-2">
                                                    <div class="text-xs text-slate-400 font-bold uppercase">您的得分</div>
                                                    <div class="text-4xl font-black text-emerald-600">
                                                        {mySubmission.scoreDetails.totalScore} / {activeQuestion.challenge.totalScore} 分
                                                    </div>
                                                    <div class="text-xs font-bold text-slate-600">
                                                        答對 {mySubmission.scoreDetails.correctCount} / {mySubmission.scoreDetails.totalQs} 題 (正確率 {mySubmission.scoreDetails.percentage}%)
                                                    </div>
                                                </div>
                                            ) : (
                                                <p class="text-sm text-emerald-700 font-bold">
                                                    答案已傳送給老師，請等待老師統一宣佈成績！
                                                </p>
                                            )}
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* Link Mode */}
                            {activeQuestion.mode === 'LINK' && (
                                <div class="space-y-4 text-center py-4">
                                    {activeQuestion.youtubeEmbed ? (
                                        <div class="aspect-16-9 w-full rounded-2xl overflow-hidden border shadow-lg">
                                            <iframe 
                                                src={activeQuestion.youtubeEmbed} 
                                                class="w-full h-full" 
                                                allow="autoplay; encrypted-media" 
                                                allowFullScreen 
                                            />
                                        </div>
                                    ) : (
                                        <div class="bg-amber-50 border border-amber-200 p-6 rounded-2xl space-y-4">
                                            <p class="text-slate-700 font-bold text-sm">老師派送了以下外部連結：</p>
                                            <a 
                                                href={activeQuestion.pushedUrl} 
                                                target="_blank" 
                                                rel="noreferrer"
                                                class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-xl shadow-md text-sm transition"
                                            >
                                                🔗 點擊開啟派送內容
                                            </a>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    )}
                </main>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<OMITApp />);
</script>
