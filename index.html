        // STUDENT INTERFACE COMPONENT
        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, studentsList, showToast, onExit }) {
            const [selectedAnswer, setSelectedAnswer] = useState('');
            const [shortAnswer, setShortAnswer] = useState('');
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [myDuration, setMyDuration] = useState(0);

            // Audio recording state
            const [isRecording, setIsRecording] = useState(false);
            const [audioBlobUrl, setAudioBlobUrl] = useState(null);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            // Challenge State
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [challengeRemainingTime, setChallengeRemainingTime] = useState(null);

            const myResponseKey = activeQuestion ? `${activeQuestion.id}_${studentId}` : null;
            const existingRes = myResponseKey ? responses[myResponseKey] : null;

            // Timer for active challenge
            useEffect(() => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE' || !activeQuestion.challenge?.enableTimer) return;
                
                const timeLimit = activeQuestion.challenge.timeLimit || 120;
                const elapsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                const remain = Math.max(0, timeLimit - elapsed);
                setChallengeRemainingTime(remain);

                const interval = setInterval(() => {
                    setChallengeRemainingTime(r => {
                        if (r <= 1) {
                            clearInterval(interval);
                            // Requirement 15 & 19: Auto submit when time reaches 00:00
                            if (!isSubmitted) {
                                autoSubmitChallenge();
                            }
                            return 0;
                        }
                        return r - 1;
                    });
                }, 1000);

                return () => clearInterval(interval);
            }, [activeQuestion, isSubmitted]);

            useEffect(() => {
                if (existingRes) {
                    setIsSubmitted(true);
                } else {
                    setIsSubmitted(false);
                    setSelectedAnswer('');
                    setShortAnswer('');
                    setAudioBlobUrl(null);
                    setChallengeAnswers({});
                }
            }, [activeQuestion, existingRes]);

            const autoSubmitChallenge = () => {
                if (!activeQuestion || !activeQuestion.challenge) return;
                const durationSec = Math.round((Date.now() - activeQuestion.startTime) / 1000);
                
                let score = 0;
                let correctCount = 0;
                const totalQs = activeQuestion.challenge.questions.length;

                activeQuestion.challenge.questions.forEach((q, idx) => {
                    const studentAns = challengeAnswers[idx];
                    if (studentAns === q.answer) {
                        correctCount++;
                    }
                });

                score = Math.round((correctCount / totalQs) * activeQuestion.challenge.totalScore);
                const percentage = Math.round((correctCount / totalQs) * 100);

                const resObj = {
                    studentId,
                    questionId: activeQuestion.id,
                    seatNumber,
                    name: studentName,
                    answer: challengeAnswers,
                    scoreDetails: {
                        totalScore: score,
                        percentage,
                        correctCount,
                        totalQs
                    },
                    duration: durationSec,
                    submittedAt: Date.now()
                };

                const appId = "omit-8c173";
                const db = window.fbDb;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', myResponseKey);
                window.fbUtils.setDoc(resDocRef, resObj);

                setIsSubmitted(true);
                audioSys.playSound('win');
            };

            const handleSubmitResponse = (answerPayload) => {
                if (!activeQuestion) return;
                const durationSec = ((Date.now() - activeQuestion.startTime) / 1000).toFixed(1);
                setMyDuration(durationSec);

                const resObj = {
                    studentId,
                    questionId: activeQuestion.id,
                    seatNumber,
                    name: studentName,
                    answer: answerPayload,
                    duration: durationSec,
                    submittedAt: Date.now()
                };

                const appId = "omit-8c173";
                const db = window.fbDb;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', myResponseKey);
                window.fbUtils.setDoc(resDocRef, resObj);

                setIsSubmitted(true);
                audioSys.playSound('win');
            };

            // Requirement 18: Buzzer button
            const handlePressBuzzer = () => {
                if (isSubmitted || (activeQuestion && Object.keys(responses).some(k => k.startsWith(activeQuestion.id)))) return;
                handleSubmitResponse('PRESSED');
            };

            // Requirement 5: Recording audio flow
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            setAudioBlobUrl(reader.result);
                        };
                        reader.readAsDataURL(blob);
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);

                    // Auto stop at 10 seconds
                    setTimeout(() => {
                        if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
                            stopRecording();
                        }
                    }, 10000);
                } catch (err) {
                    showToast("無法存取麥克風權限！", "error");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            // Requirement 22.3.4: Group Coop Student Answer Handler
            const handleCoopSubmitAnswer = async (selectedOptLetter) => {
                if (!activeQuestion || activeQuestion.mode !== 'GROUP_COOP') return;

                const myGroup = activeQuestion.groups?.find(g => g.members.some(m => m.id === studentId));
                if (!myGroup) return;

                const currentQIdx = myGroup.currentQIndex || 0;
                const currentQ = activeQuestion.questions[currentQIdx];
                const isCorrect = selectedOptLetter === currentQ.answer;

                let updatedProgress = isCorrect ? (myGroup.scoreProgress || 0) + 1 : 0;
                let updatedQIdx = isCorrect ? currentQIdx + 1 : 0;
                let winner = null;

                if (updatedProgress >= activeQuestion.questions.length) {
                    winner = myGroup;
                }

                const updatedGroups = activeQuestion.groups.map(g => {
                    if (g.id === myGroup.id) {
                        return {
                            ...g,
                            scoreProgress: updatedProgress,
                            currentQIndex: updatedQIdx
                        };
                    }
                    return g;
                });

                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                const updatedQ = {
                    ...activeQuestion,
                    groups: updatedGroups,
                    winnerGroup: winner
                };

                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });

                if (isCorrect) {
                    showToast("答對了！為隊伍贏得 1 分進度 🚀", "success");
                    audioSys.playSound('win');
                } else {
                    showToast("答錯了！進度歸零重新開始，加油！", "error");
                }
            };

            // Requirement 2: Check Broadcasted Whiteboard Submission
            const broadcastedSubmission = activeQuestion?.broadcastedSubmission;

            // Requirement 22.2.3: Find student's assigned group
            const myAssignedGroup = useMemo(() => {
                if (!activeQuestion || activeQuestion.mode !== 'GROUP_COOP') return null;
                return activeQuestion.groups?.find(g => g.members.some(m => m.id === studentId));
            }, [activeQuestion, studentId]);

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col justify-between">
                    {/* Top Header */}
                    <header className="bg-white border-b px-4 py-3 shadow-sm flex justify-between items-center">
                        <div className="flex items-center space-x-2">
                            <span className="bg-indigo-600 text-white font-black px-2.5 py-1 rounded-lg text-sm">OMIT</span>
                            <span className="font-extrabold text-slate-800 text-sm">宣道會陳元喜小學</span>
                        </div>
                        <div className="flex items-center space-x-2 text-xs font-bold">
                            <span className="bg-slate-100 px-3 py-1 rounded-lg text-slate-700">學號: {seatNumber}號 ({studentName})</span>
                            <button onClick={onExit} className="text-slate-400 hover:text-slate-600">退出</button>
                        </div>
                    </header>

                    {/* Main Student Body */}
                    <main className="flex-1 max-w-3xl w-full mx-auto p-4 flex flex-col justify-center">

                        {/* Whiteboard Broadcast Modal Overlay */}
                        {broadcastedSubmission && (
                            <div className="mb-6 bg-purple-900 text-white p-6 rounded-3xl shadow-2xl space-y-4 animate-fade-in border-4 border-purple-400">
                                <div className="flex justify-between items-center border-b border-purple-700 pb-2">
                                    <h3 className="font-black text-lg flex items-center gap-2">
                                        <span>📢 老師全班廣播互評作品</span>
                                    </h3>
                                    <span className="text-xs font-bold bg-purple-700 px-3 py-1 rounded-full">
                                        {broadcastedSubmission.name} ({broadcastedSubmission.seatNumber}號)
                                    </span>
                                </div>
                                <div className="aspect-16-9 bg-white rounded-2xl overflow-hidden border">
                                    <img src={broadcastedSubmission.answer} className="w-full h-full object-contain" alt="廣播作品" />
                                </div>
                            </div>
                        )}

                        {/* No Active Question */}
                        {!activeQuestion && (
                            <div className="bg-white rounded-3xl p-8 text-center space-y-4 shadow-sm border border-slate-200">
                                <div className="text-6xl animate-pulse">⏳</div>
                                <h2 className="text-2xl font-black text-slate-800">課堂進行中</h2>
                                <p className="text-slate-500 text-sm font-bold">已進入房號 {roomCode}。安靜等候老師指示發佈題目...</p>
                            </div>
                        )}

                        {/* Requirement 22.2.3 & 22.3.4: Group Coop Mode Display */}
                        {activeQuestion && activeQuestion.mode === 'GROUP_COOP' && (
                            <div className="space-y-4">
                                {myAssignedGroup ? (
                                    <div className={`p-6 rounded-3xl border-4 ${myAssignedGroup.theme.bgLight} ${myAssignedGroup.theme.border} space-y-5 text-center shadow-lg`}>
                                        <div className="space-y-1">
                                            <div className="text-5xl">{myAssignedGroup.theme.emoji}</div>
                                            <h2 className={`text-2xl font-black ${myAssignedGroup.theme.text}`}>
                                                你被分配在：{myAssignedGroup.theme.name}
                                            </h2>
                                        </div>

                                        {/* Requirement 22.2.3: Prompt sentence */}
                                        {activeQuestion.coopStage === 'GROUPING' && (
                                            <div className="bg-white/80 p-4 rounded-2xl border font-black text-indigo-600 text-lg animate-pulse-subtle">
                                                盡快與你的組員會合! 比賽即將開始!
                                            </div>
                                        )}

                                        {/* Requirement 22.3.4: Distributed UI mode in Race Stage */}
                                        {activeQuestion.coopStage === 'RACE' && !activeQuestion.winnerGroup && (
                                            <div className="bg-white p-5 rounded-2xl space-y-4 border text-left shadow-sm">
                                                {(() => {
                                                    const currentQIdx = myAssignedGroup.currentQIndex || 0;
                                                    const currentQ = activeQuestion.questions[currentQIdx];
                                                    const members = myAssignedGroup.members;
                                                    const myIndexInGroup = members.findIndex(m => m.id === studentId);

                                                    if (!currentQ) return <div>比賽完成！</div>;

                                                    // Distribute information based on member position
                                                    const isMember1 = myIndexInGroup % 3 === 0;
                                                    const isMember2 = myIndexInGroup % 3 === 1;
                                                    const isMember3 = myIndexInGroup % 3 === 2;

                                                    return (
                                                        <div className="space-y-4">
                                                            <div className="flex justify-between items-center border-b pb-2">
                                                                <span className="font-black text-xs text-teal-700">
                                                                    第 {currentQIdx + 1} / {activeQuestion.questions.length} 題
                                                                </span>
                                                                <span className="text-xs bg-teal-100 text-teal-800 font-bold px-2.5 py-1 rounded-lg">
                                                                    組員分工：{isMember1 ? '看題目文字' : isMember2 ? '作答選項 A / B' : '作答選項 C / D'}
                                                                </span>
                                                            </div>

                                                            {/* Member 1 sees question text */}
                                                            {isMember1 && (
                                                                <div className="bg-teal-50 p-4 rounded-xl border border-teal-200 text-slate-800 font-black text-lg">
                                                                    ❓ {currentQ.text}
                                                                </div>
                                                            )}

                                                            {/* Member 2 sees options A & B */}
                                                            {isMember2 && (
                                                                <div className="space-y-2">
                                                                    <div className="text-xs font-bold text-slate-500">請與組員討論後選擇 (選項 A / B)：</div>
                                                                    {currentQ.options.slice(0, 2).map((opt) => (
                                                                        <button 
                                                                            key={opt.letter}
                                                                            onClick={() => handleCoopSubmitAnswer(opt.letter)}
                                                                            className="w-full text-left p-3.5 bg-slate-50 hover:bg-teal-100 rounded-xl font-bold border transition text-sm flex items-center space-x-2"
                                                                        >
                                                                            <span className="bg-teal-600 text-white w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs">{opt.letter}</span>
                                                                            <span>{opt.text}</span>
                                                                        </button>
                                                                    ))}
                                                                </div>
                                                            )}

                                                            {/* Member 3 sees options C & D */}
                                                            {isMember3 && (
                                                                <div className="space-y-2">
                                                                    <div className="text-xs font-bold text-slate-500">請與組員討論後選擇 (選項 C / D)：</div>
                                                                    {currentQ.options.slice(2, 4).map((opt) => (
                                                                        <button 
                                                                            key={opt.letter}
                                                                            onClick={() => handleCoopSubmitAnswer(opt.letter)}
                                                                            className="w-full text-left p-3.5 bg-slate-50 hover:bg-teal-100 rounded-xl font-bold border transition text-sm flex items-center space-x-2"
                                                                        >
                                                                            <span className="bg-teal-600 text-white w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs">{opt.letter}</span>
                                                                            <span>{opt.text}</span>
                                                                        </button>
                                                                    ))}
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })()}
                                            </div>
                                        )}

                                        {/* Requirement 22.3.5: Winning celebration overlay */}
                                        {activeQuestion.winnerGroup && (
                                            <div className="bg-amber-400 text-slate-900 p-6 rounded-3xl space-y-4 border-4 border-amber-300 shadow-2xl animate-bounce">
                                                <div className="text-6xl">🏆</div>
                                                <h3 className="text-2xl font-black">
                                                    恭喜勝出組別：{activeQuestion.winnerGroup.theme.name}!
                                                </h3>
                                                <div className="flex flex-wrap justify-center gap-2">
                                                    {activeQuestion.winnerGroup.members.map(m => (
                                                        <span key={m.id} className="bg-white px-3 py-1 rounded-xl text-xs font-black shadow-sm">
                                                            {m.seatNumber}號 {m.name}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    <div className="bg-white p-6 rounded-3xl text-center text-slate-500 font-bold">
                                        正在為您編排小組...
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Standard Question Display */}
                        {activeQuestion && activeQuestion.mode !== 'GROUP_COOP' && (
                            <div className="bg-white rounded-3xl p-6 md:p-8 space-y-6 shadow-sm border border-slate-200">
                                <div className="border-b pb-4">
                                    <span className="text-xs font-black text-indigo-600 uppercase tracking-widest">
                                        {getModeLabel(activeQuestion.mode)}
                                    </span>
                                    <h2 className="text-xl md:text-2xl font-black text-slate-800 mt-1">
                                        {activeQuestion.text}
                                    </h2>
                                </div>

                                {/* Requirement 6: Unified Submission Feedback Message */}
                                {isSubmitted && activeQuestion.mode !== 'CHALLENGE' && (
                                    <div className="bg-emerald-50 border-2 border-emerald-300 p-6 rounded-3xl text-center space-y-2 animate-fade-in shadow-inner">
                                        <div className="text-4xl">🌟</div>
                                        <h3 className="text-lg font-black text-emerald-800">
                                            已提交答案! 讚賞你的努力! 安靜等候老師指示...
                                        </h3>
                                        <p className="text-xs font-mono text-emerald-600">答題用時：{existingRes?.duration || myDuration} 秒</p>
                                    </div>
                                )}

                                {/* CHOICE or TF Mode */}
                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && !isSubmitted && (
                                    <div className="space-y-4">
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            {activeQuestion.choiceOptions.map((opt) => (
                                                <button 
                                                    key={opt}
                                                    onClick={() => setSelectedAnswer(opt)}
                                                    className={`p-4 rounded-2xl border-2 font-black text-lg transition flex items-center justify-between ${
                                                        selectedAnswer === opt 
                                                        ? 'bg-indigo-600 text-white border-indigo-600 ring-4 ring-indigo-200' 
                                                        : 'bg-slate-50 text-slate-800 border-slate-200 hover:bg-slate-100'
                                                    }`}
                                                >
                                                    <span>{opt}</span>
                                                    {selectedAnswer === opt && <span>✓</span>}
                                                </button>
                                            ))}
                                        </div>

                                        {/* Requirement 3: Separate "Confirm Submit" button */}
                                        <button 
                                            disabled={!selectedAnswer}
                                            onClick={() => handleSubmitResponse(selectedAnswer)}
                                            className="w-full py-4 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-black rounded-2xl text-base shadow-lg transition active:scale-98"
                                        >
                                            ✅ 確認提交答案
                                        </button>
                                    </div>
                                )}

                                {/* Requirement 18: BUZZER Mode */}
                                {activeQuestion.mode === 'BUZZER' && !isSubmitted && (
                                    <div className="text-center py-6 space-y-4">
                                        <button 
                                            onClick={handlePressBuzzer}
                                            className="w-48 h-48 bg-rose-600 hover:bg-rose-700 active:scale-95 text-white font-black rounded-full text-3xl shadow-2xl border-8 border-rose-300 transition mx-auto flex items-center justify-center"
                                        >
                                            🚨 搶答！
                                        </button>
                                    </div>
                                )}

                                {/* SHORT Mode */}
                                {activeQuestion.mode === 'SHORT' && !isSubmitted && (
                                    <div className="space-y-4">
                                        <textarea 
                                            rows={4}
                                            placeholder="請在此輸入您的回答..."
                                            value={shortAnswer}
                                            onChange={(e) => setShortAnswer(e.target.value)}
                                            className="w-full p-4 rounded-2xl border-2 border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium text-base"
                                        />
                                        <button 
                                            disabled={!shortAnswer.trim()}
                                            onClick={() => handleSubmitResponse(shortAnswer.trim())}
                                            className="w-full py-4 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-black rounded-2xl text-base shadow-lg transition active:scale-98"
                                        >
                                            ✅ 確認提交
                                        </button>
                                    </div>
                                )}

                                {/* Requirement 1: DRAW Mode WhiteboardCanvas */}
                                {activeQuestion.mode === 'DRAW' && !isSubmitted && (
                                    <WhiteboardCanvas 
                                        bgImage={activeQuestion.whiteboardBg}
                                        onConfirmSubmit={(dataUrl) => handleSubmitResponse(dataUrl)}
                                    />
                                )}

                                {/* Requirement 5: AUDIO Mode */}
                                {activeQuestion.mode === 'AUDIO' && !isSubmitted && (
                                    <div className="space-y-4 text-center">
                                        <div className="p-6 bg-cyan-50 border border-cyan-200 rounded-3xl space-y-4">
                                            {!audioBlobUrl ? (
                                                <div className="space-y-3">
                                                    <button 
                                                        onClick={isRecording ? stopRecording : startRecording}
                                                        className={`px-8 py-4 rounded-full font-black text-lg text-white transition shadow-lg ${
                                                            isRecording ? 'bg-rose-600 animate-pulse' : 'bg-cyan-600 hover:bg-cyan-700'
                                                        }`}
                                                    >
                                                        {isRecording ? '⏹️ 停止錄音 (最多10秒)' : '🎤 開始錄音'}
                                                    </button>
                                                    <p className="text-xs font-bold text-cyan-800">按一次開始錄音，再次按或10秒後自動結束</p>
                                                </div>
                                            ) : (
                                                <div className="space-y-4">
                                                    <div className="font-bold text-sm text-cyan-900">試聽錄音：</div>
                                                    <audio src={audioBlobUrl} controls className="w-full h-10 rounded-xl" />
                                                    <div className="flex space-x-3">
                                                        <button 
                                                            onClick={() => setAudioBlobUrl(null)}
                                                            className="w-1/2 py-3 bg-rose-100 text-rose-700 font-bold rounded-xl text-sm"
                                                        >
                                                            🗑️ 刪除重錄
                                                        </button>
                                                        <button 
                                                            onClick={() => handleSubmitResponse(audioBlobUrl)}
                                                            className="w-1/2 py-3 bg-emerald-600 text-white font-black rounded-xl text-sm shadow-md"
                                                        >
                                                            ✅ 確認提交錄音
                                                        </button>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {/* Requirement 4: LINK Mode */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div className="space-y-4">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div className="aspect-16-9 w-full rounded-2xl overflow-hidden border">
                                                <iframe 
                                                    src={activeQuestion.youtubeEmbed} 
                                                    className="w-full h-full" 
                                                    allow="autoplay; encrypted-media" 
                                                    allowFullScreen
                                                />
                                            </div>
                                        ) : null}

                                        {activeQuestion.pushedUrl && (
                                            <a 
                                                href={activeQuestion.pushedUrl} 
                                                target="_blank" 
                                                rel="noopener noreferrer"
                                                className="block w-full text-center py-4 bg-amber-500 hover:bg-amber-600 text-white font-black rounded-2xl text-lg shadow-lg transition"
                                            >
                                                開啟連結網站 ↗
                                            </a>
                                        )}
                                    </div>
                                )}

                                {/* Requirement 15, 19: CHALLENGE Mode Student Paper */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                    <div className="space-y-6">
                                        <div className="flex justify-between items-center bg-amber-50 p-4 rounded-2xl border border-amber-200">
                                            <span className="font-black text-amber-900 text-base">
                                                🏆 {activeQuestion.challenge.title}
                                            </span>
                                            {challengeRemainingTime !== null && (
                                                <span className="font-mono font-black text-rose-600 text-sm bg-white px-3 py-1 rounded-lg border">
                                                    剩餘時間：{Math.floor(challengeRemainingTime / 60)}:{(challengeRemainingTime % 60).toString().padStart(2, '0')}
                                                </span>
                                            )}
                                        </div>

                                        {/* Questions list */}
                                        <div className="space-y-6">
                                            {activeQuestion.challenge.questions.map((q, qIdx) => {
                                                const studentAns = challengeAnswers[qIdx];
                                                const isReleased = activeQuestion.challenge.scoresReleased || activeQuestion.challenge.releaseInstant;
                                                const isCorrect = studentAns === q.answer;

                                                return (
                                                    <div key={qIdx} className="bg-slate-50 p-4 rounded-2xl border space-y-3">
                                                        <div className="font-bold text-slate-800 text-base">
                                                            {qIdx + 1}. {q.text}
                                                        </div>

                                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                            {q.options.map((opt) => {
                                                                let optStyle = 'bg-white text-slate-700 border-slate-200';

                                                                if (!isSubmitted) {
                                                                    if (studentAns === opt.letter) {
                                                                        optStyle = 'bg-indigo-600 text-white border-indigo-600';
                                                                    }
                                                                } else if (isReleased) {
                                                                    // Requirement 19: Full test paper answer review breakdown
                                                                    if (opt.letter === q.answer) {
                                                                        optStyle = 'bg-emerald-500 text-white border-emerald-500 font-bold';
                                                                    } else if (studentAns === opt.letter && !isCorrect) {
                                                                        optStyle = 'bg-rose-500 text-white border-rose-500 font-bold';
                                                                    }
                                                                } else if (studentAns === opt.letter) {
                                                                    optStyle = 'bg-slate-300 text-slate-700 font-bold';
                                                                }

                                                                return (
                                                                    <button 
                                                                        key={opt.letter}
                                                                        disabled={isSubmitted}
                                                                        onClick={() => setChallengeAnswers(prev => ({ ...prev, [qIdx]: opt.letter }))}
                                                                        className={`p-3 rounded-xl border text-left text-sm font-bold transition flex items-center justify-between ${optStyle}`}
                                                                    >
                                                                        <span>{opt.letter}. {opt.text}</span>
                                                                        {isSubmitted && isReleased && opt.letter === q.answer && <span>✓ (正確)</span>}
                                                                        {isSubmitted && isReleased && studentAns === opt.letter && !isCorrect && <span>✗ (你的選擇)</span>}
                                                                    </button>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        {!isSubmitted ? (
                                            <button 
                                                onClick={autoSubmitChallenge}
                                                className="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-2xl text-base shadow-lg transition active:scale-98"
                                            >
                                                ✅ 確認提交整份挑戰題
                                            </button>
                                        ) : (
                                            <div className="p-4 bg-emerald-50 border border-emerald-200 rounded-2xl text-center font-black text-emerald-800">
                                                {activeQuestion.challenge.scoresReleased || activeQuestion.challenge.releaseInstant ? (
                                                    <div>
                                                        你的得分：{existingRes?.scoreDetails?.totalScore} / {activeQuestion.challenge.totalScore}分
                                                    </div>
                                                ) : (
                                                    <div>已完成提交！待老師一併發放全班挑戰題成績...</div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-white border-t py-2 text-center text-xs text-slate-400 font-bold">
                        宣道會陳元喜小學 OMIT互動課堂
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
