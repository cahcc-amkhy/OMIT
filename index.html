    // Web Audio API Sound Generator
    const playSound = (type) => {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (ctx.state === 'suspended') {
                ctx.resume();
            }

            if (type === 'buzzer') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } else if (type === 'spin') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } else if (type === 'win') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + idx * 0.1);
                    osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                });
            } else if (type === 'alarm') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(900, ctx.currentTime);
                osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            }
        } catch (e) {
            console.error("Audio error:", e);
        }
    };

    const extractYouTubeEmbed = (url) => {
        if (!url) return null;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
    };

    const createWordDocxBlob = async (textLines) => {
        if (!window.JSZip) {
            throw new Error("JSZip library is not loaded.");
        }
        const zip = new JSZip();

        zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>


        zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>


        zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>


`);

        const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
            switch (c) {
                case '<': return '&lt;';
                case '>': return '&gt;';
                case '&': return '&amp;';
                case '\'': return '&apos;';
                case '"': return '&quot;';
                default: return c;
            }
        });

        const paragraphsXml = textLines.map(line => {
            return `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`;
        }).join('\n');

        zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>


<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:body>
${paragraphsXml}
</w:body>
</w:document>`);

        return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
    };

    const parseWordChallengeText = (rawText) => {
        const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
        let title = '地球生病了';
        let totalScore = 100;
        const questions = [];

        let currentQ = null;

        lines.forEach((line) => {
            if (/^(標題|Title)[：:]/i.test(line)) {
                title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                return;
            }
            if (/^(總分|Total)[：:]/i.test(line)) {
                const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                totalScore = parseInt(scoreStr) || 100;
                return;
            }

            const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
            if (qMatch) {
                if (currentQ && currentQ.options.length > 0) {
                    questions.push(currentQ);
                }
                currentQ = {
                    num: parseInt(qMatch[1]),
                    text: qMatch[2].trim(),
                    options: [],
                    answer: 'A'
                };
                return;
            }

            const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
            if (optMatch && currentQ) {
                const letter = optMatch[1].toUpperCase();
                let optText = optMatch[2].trim();
                
                let isCorrect = false;
                if (line.includes('*') || optText.endsWith('*')) {
                    isCorrect = true;
                    optText = optText.replace(/\*/g, '').trim();
                }

                currentQ.options.push({
                    letter: letter,
                    text: optText
                });

                if (isCorrect) {
                    currentQ.answer = letter;
                }
            }
        });

        if (currentQ && currentQ.options.length > 0) {
            questions.push(currentQ);
        }

        if (questions.length === 0) {
            return {
                title: title || "地球生病了",
                totalScore: 100,
                questions: [
                    {
                        num: 1,
                        text: "以下哪一項不是地球的天然資源?",
                        options: [
                            { letter: "A", text: "水資源" },
                            { letter: "B", text: "植物資源" },
                            { letter: "C", text: "動物資源" },
                            { letter: "D", text: "機械資源" }
                        ],
                        answer: "D"
                    },
                    {
                        num: 2,
                        text: "芝士的原料屬於哪一項地球的天然資源?",
                        options: [
                            { letter: "A", text: "水資源" },
                            { letter: "B", text: "植物資源" },
                            { letter: "C", text: "動物資源" },
                            { letter: "D", text: "礦產資源" }
                        ],
                        answer: "C"
                    }
                ]
            };
        }

        return {
            title,
            totalScore,
            questions
        };
    };

        const [challengeTimeLimit, setChallengeTimeLimit] = useState(120); // 120s default (2 mins)
        const [challengeReleaseInstant, setChallengeReleaseInstant] = useState(true);
        const [showChallengeScoresOnLeaderboard, setShowChallengeScoresOnLeaderboard] = useState(true);
        const [docxFileName, setDocxFileName] = useState('');

        const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
        const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

        // Filter current responses for active question
        const currentQuestionResponses = useMemo(() => {
            if (!activeQuestion) return {};
            const filtered = {};
            Object.values(responses).forEach(r => {
                if (r.questionId === activeQuestion.id) {
                    filtered[r.studentId] = r;
                }
            });
            return filtered;
        }, [responses, activeQuestion]);

        // Timer Interval Logic
        useEffect(() => {
            let interval = null;
            if (timerActive && timerSeconds > 0) {
                interval = setInterval(() => {
                    setTimerSeconds(s => {
                        if (s <= 1) {
                            setTimerActive(false);
                            playSound('alarm');
                            return 0;
                        }
                        return s - 1;
                    });
                }, 1000);
            }
            return () => clearInterval(interval);
        }, [timerActive, timerSeconds]);

        // Sync Question & History to Firestore
        const publishQuestionToFirestore = async (qObj, newHistoryList) => {
            const appId = "omit-8c173";
            const db = window.fbDb;
            const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
            
            const updatePayload = {
                activeQuestion: qObj,
                updatedAt: Date.now()
            };
            if (newHistoryList) {
                updatePayload.history = newHistoryList;
            }

            await window.fbUtils.setDoc(roomDocRef, updatePayload, { merge: true });
        };

        // Exit Room Cleanup
        const handleConfirmExitRoom = async () => {
            try {
                const appId = "omit-8c173";
                const db = window.fbDb;
                
                const responsesColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');
                const resSnaps = await window.fbUtils.getDocs(responsesColRef);
                resSnaps.forEach(async (d) => {
                    await window.fbUtils.deleteDoc(d.ref);
                });

                const studentsColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                const stuSnaps = await window.fbUtils.getDocs(studentsColRef);
                stuSnaps.forEach(async (d) => {
                    await window.fbUtils.deleteDoc(d.ref);
                });

                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.deleteDoc(roomDocRef);

                showToast("課室暫存資料已完全清空！", "info");
            } catch (e) {
                console.error("Cleanup error:", e);
            }
            setShowExitConfirmModal(false);
            onExit();
        };

        const handleDownloadChallengeTemplate = async () => {
            const sampleLines = [
                "標題：地球生病了",
                "總分: 100分",
                "1.以下哪一項不是地球的天然資源?",
                "A. 水資源",
                "B. 植物資源",
                "C. 動物資源",
                "D. 機械資源*",
                "",
                "2.芝士的原料屬於哪一項地球的天然資源?",
                "A. 水資源",
                "B. 植物資源",
                "C. 動物資源*",
                "D. 礦產資源",
                "",
                "3.人們不當使用水資源會造成甚麼後果?",
                "A. 引發極端天氣",
                "B. 引發水災",
                "C. 水土流失",
                "D. 影響食水供應*",
                "",
                "4.人們不當使用煤和石油資源會造成甚麼後果?",
                "A. 引發極端天氣*",
                "B. 引發水災",
                "C. 水土流失",
                "D. 影響食水供應",
                "",
                "5.人們不當使用土地資源會造成甚麼後果?",
                "A. 引發極端天氣",
                "B. 引發水災*",
                "C. 產生大量二氧化碳",
                "D. 影響食水供應"
            ];

            try {
                const blob = await createWordDocxBlob(sampleLines);
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = '挑戰題評估範本_地球生病了.docx';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("已下載 Word 評估範本檔 (.docx)！", "success");
            } catch (err) {
                console.error("Docx generation error:", err);
                showToast("無法生成 Word 範本檔，請重新整理試試。", "error");
            }
        };

        const handleWordFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            setDocxFileName(file.name);
            const reader = new FileReader();

            reader.onload = async (evt) => {
                try {
                    let parsedData = null;
                    if (file.name.endsWith('.docx')) {
                        const arrayBuffer = evt.target.result;
                        const result = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                        parsedData = parseWordChallengeText(result.value);
                    } else {
                        const text = evt.target.result;
                        parsedData = parseWordChallengeText(text);
                    }

                    setChallengeData(parsedData);
                    showToast(`已成功解析範本檔案！共 ${parsedData.questions.length} 題`, 'success');
                } catch (err) {
                    console.error("Word file parse error:", err);
                    showToast("文件解析失敗，請確認格式！", "error");
                }
            };

            if (file.name.endsWith('.docx')) {
                reader.readAsBuffer ? reader.readAsBuffer(file) : reader.readAsArrayBuffer(file);
            } else {
                reader.readAsText(file, "UTF-8");
            }
        };

        const handleUpdateChallengeTitle = (newTitle) => {
            setChallengeData(prev => prev ? { ...prev, title: newTitle } : null);
        };

        const handleUpdateChallengeScore = (newScore) => {
            setChallengeData(prev => prev ? { ...prev, totalScore: parseInt(newScore) || 100 } : null);
        };

        const handleUpdateQuestionText = (qIndex, text) => {
            setChallengeData(prev => {
                if (!prev) return null;
                const newQs = [...prev.questions];
                newQs[qIndex] = { ...newQs[qIndex], text };
                return { ...prev, questions: newQs };
            });
        };

        const handleUpdateOptionText = (qIndex, optIndex, text) => {
            setChallengeData(prev => {
                if (!prev) return null;
                const newQs = [...prev.questions];
                const newOpts = [...newQs[qIndex].options];
                newOpts[optIndex] = { ...newOpts[optIndex], text };
                newQs[qIndex] = { ...newQs[qIndex], options: newOpts };
                return { ...prev, questions: newQs };
            });
        };

        const handleUpdateCorrectAnswer = (qIndex, answerLetter) => {
            setChallengeData(prev => {
                if (!prev) return null;
                const newQs = [...prev.questions];
                newQs[qIndex] = { ...newQs[qIndex], answer: answerLetter };
                return { ...prev, questions: newQs };
            });
        };

        const handleDeleteQuestion = (qIndex) => {
            setChallengeData(prev => {
                if (!prev) return null;
                const newQs = prev.questions.filter((_, idx) => idx !== qIndex).map((q, idx) => ({
                    ...q,
                    num: idx + 1
                }));
                return { ...prev, questions: newQs };
            });
            showToast("已成功刪除該題目！", "info");
        };

        const handlePublishQuestion = () => {
            const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
            
            let challengeContent = null;
            if (selectedMode === 'CHALLENGE') {
                if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                    showToast("請先上載並解析 Word 評估範本檔案！", "error");
                    return;
                }
                challengeContent = {
                    title: challengeData.title,
                    totalScore: challengeData.totalScore,
                    questions: challengeData.questions,
                    enableTimer: challengeEnableTimer,
                    timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                    releaseInstant: challengeReleaseInstant,
                    scoresReleased: challengeReleaseInstant
                };
            }

            const newQ = {
                id: 'q_' + Date.now(),
                mode: selectedMode,
                text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                startTime: Date.now(),
                lockAfterSubmit: lockAfterSubmit,
                whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                               selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                challenge: challengeContent
            };

            const updatedHistory = [...historyQuestions, newQ];
            setHistoryQuestions(updatedHistory);

            publishQuestionToFirestore(newQ, updatedHistory);
            showToast(`已成功發佈【${getModeLabel(selectedMode)}】給所有學生！`, 'success');
        };

        const handleReleaseChallengeScores = async () => {
            if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
            const updatedQ = {
                ...activeQuestion,
                challenge: {
                    ...activeQuestion.challenge,
                    scoresReleased: true
                }
            };
            await publishQuestionToFirestore(updatedQ);
            showToast("已成功向所有學生一併發放挑戰題成績！", "success");
        };

        const handleDownloadAllAudio = async () => {
            const audioSubmissions = Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:audio'));
            
            if (audioSubmissions.length === 0) {
                showToast("目前尚無學生提交錄音！", "error");
                return;
            }

            try {
                const zip = new JSZip();
                const folder = zip.folder(`課堂錄音_房號${roomCode}`);

                audioSubmissions.forEach((res) => {
                    const base64Data = res.answer.split(',')[1];
                    const fileName = `${res.seatNumber.toString().padStart(2, '0')}_${res.name || '學生'}.webm`;
                    folder.file(fileName, base64Data, { base64: true });
                });

                const content = await zip.generateAsync({ type: "blob" });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = `OMIT_學生錄音_房號${roomCode}.zip`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                showToast(`已打包並下載 ${audioSubmissions.length} 位學生的語音檔案！`, "success");
            } catch (err) {
                console.error("ZIP creation error:", err);
                showToast("打包錄音檔案失敗！", "error");
            }
        };

        const handleClearQuestion = async () => {
            const appId = "omit-8c173";
            const db = window.fbDb;
            const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
            await window.fbUtils.setDoc(roomDocRef, { activeQuestion: null }, { merge: true });
            showToast('已結束當前題目', 'info');
        };

        const toggleLockMode = async () => {
            const newLock = !lockAfterSubmit;
            setLockAfterSubmit(newLock);
            if (activeQuestion) {
                const updatedQ = { ...activeQuestion, lockAfterSubmit: newLock };
                publishQuestionToFirestore(updatedQ);
                showToast(newLock ? "已鎖定答案（禁止修改）" : "已開放學生修改答案", "info");
            }
        };

        const handleBgUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    setWhiteboardBg(evt.target.result);
                    showToast("已成功載入 16:9 白板背景圖片！", "success");
                };
                reader.readAsDataURL(file);
            }
        };

        const handleBroadcastSubmission = async (studentRes) => {
            if (!studentRes) return;
            const appId = "omit-8c173";
            const db = window.fbDb;
            const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
            
            const updatedQ = { 
                ...activeQuestion, 
                broadcastedSubmission: studentRes 
            };
            await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
            showToast(`已成功廣播 ${studentRes.name} 的作品至全班學生螢幕！`, "success");
        };

        const handleExportCSVReport = () => {
            if (studentsList.length === 0) {
                showToast("目前尚無學生紀錄可供匯出！", "error");
                return;
            }

            let csvContent = "\uFEFF"; // UTF-8 BOM
            csvContent += "學號,學生姓名,加入時間";

            historyQuestions.forEach((q, idx) => {
                const cleanText = (q.text || getModeLabel(q.mode)).replace(/"/g, '""');
                if (q.mode === 'CHALLENGE' && q.challenge) {
                    csvContent += `,第${idx + 1}題[挑戰題:${q.challenge.title}得分],第${idx + 1}題[挑戰題正確率]`;
                } else {
                    csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]: "${cleanText}"`;
                }
            });
            csvContent += "\n";

            const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

            sortedStudents.forEach((stu) => {
                const cleanName = (stu.name || '').replace(/"/g, '""');
                csvContent += `"${stu.seatNumber}號","${cleanName}","${stu.joinTime || ''}"`;
                
                historyQuestions.forEach((q) => {
                    const resKey = `${q.id}_${stu.id}`;
                    const res = responses[resKey];
                    
                    if (res && res.answer !== undefined && res.answer !== null) {
                        if (q.mode === 'CHALLENGE' && res.scoreDetails) {
                            csvContent += `,"${res.scoreDetails.totalScore} / ${q.challenge.totalScore}分","${res.scoreDetails.percentage}% (用時:${res.duration || 0}s)"`;
                        } else {
                            let ansVal = res.answer;
                            if (typeof ansVal === 'string' && ansVal.startsWith('data:image')) {
                                ansVal = '[圖像白板答案]';
                            } else if (typeof ansVal === 'string' && ansVal.startsWith('data:audio')) {
                                ansVal = '[語音錄音檔案]';
                            }
                            const cleanAns = String(ansVal).replace(/"/g, '""');
                            csvContent += `,"${cleanAns} (用時:${res.duration || 0}s)"`;
                        }
                    } else {
                        if (q.mode === 'CHALLENGE') {
                            csvContent += `,"未作答","0%"`;
                        } else {
                            csvContent += `,"未作答"`;
                        }
                    }
                });
                csvContent += "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `OMIT_課堂學習與挑戰題報告_房號${roomCode}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("完整學習報告與挑戰題成績已匯出試算表！", "success");
        };

        const leaderboard = useMemo(() => {
            return Object.values(currentQuestionResponses)
                .filter(r => r.duration !== undefined)
                .sort((a, b) => {
                    if (activeQuestion?.mode === 'CHALLENGE') {
                        const scoreA = a.scoreDetails?.totalScore || 0;
                        const scoreB = b.scoreDetails?.totalScore || 0;
                        if (scoreB !== scoreA) return scoreB - scoreA;
                    }
                    return parseFloat(a.duration) - parseFloat(b.duration);
                });
        }, [currentQuestionResponses, activeQuestion]);

        const whiteboardSubmissions = useMemo(() => {
            return Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:image'));
        }, [currentQuestionResponses]);

        const currentInspectIndex = useMemo(() => {
            if (!inspectStudentId) return -1;
            return whiteboardSubmissions.findIndex(r => r.studentId === inspectStudentId);
        }, [inspectStudentId, whiteboardSubmissions]);

        const currentInspectRes = useMemo(() => {
            if (currentInspectIndex >= 0 && whiteboardSubmissions[currentInspectIndex]) {
                return whiteboardSubmissions[currentInspectIndex];
            }
            return null;
        }, [currentInspectIndex, whiteboardSubmissions]);

        const handlePrevInspect = () => {
            if (whiteboardSubmissions.length === 0) return;
            const prevIdx = (currentInspectIndex - 1 + whiteboardSubmissions.length) % whiteboardSubmissions.length;
            setInspectStudentId(whiteboardSubmissions[prevIdx].studentId);
        };

        const handleNextInspect = () => {
            if (whiteboardSubmissions.length === 0) return;
            const nextIdx = (currentInspectIndex + 1) % whiteboardSubmissions.length;
            setInspectStudentId(whiteboardSubmissions[nextIdx].studentId);
        };

        const challengeScoresAreReleased = useMemo(() => {
            if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return true;
            return !!(activeQuestion.challenge?.releaseInstant || activeQuestion.challenge?.scoresReleased);
        }, [activeQuestion]);

        return (
            <div class="min-h-screen pb-12">
                {/* Header Controls */}
                <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 py-3">
                    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                        <div class="flex items-center space-x-3">
                            <span class="bg-slate-900 text-white font-black px-3 py-1.5 rounded-xl text-lg">OMIT</span>
                            <div>
                                <h1 class="font-bold text-slate-800 text-base flex items-center gap-2">
                                    宣道會陳元喜小學OMIT互動課堂
                                    <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-0.5 rounded-full font-mono font-bold">
                                        房號：{roomCode}
                                    </span>
                                </h1>
                            </div>
                        </div>

                        <div class="flex flex-wrap items-center gap-2">
                            <button 
                                onClick={() => setShowQRModal(true)}
                                class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-2 rounded-xl border border-indigo-200 text-sm flex items-center space-x-1.5 transition"
                            >
                                <span>📱 QR Code</span>
                            </button>

                            <button 
                                onClick={() => setShowStudentListModal(true)}
                                class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold px-3 py-2 rounded-xl border border-emerald-200 text-sm flex items-center space-x-1.5 transition"
                            >
                                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                                <span>已加入：{studentsList.length} 人</span>
                            </button>

                            <button 
                                onClick={() => setShowTimerModal(true)}
                                class={`px-3 py-2 rounded-xl border text-sm font-bold flex items-center space-x-1.5 transition ${
                                    timerActive 
                                    ? 'bg-amber-500 text-white border-amber-600 animate-pulse' 
                                    : 'bg-amber-50 hover:bg-amber-100 text-amber-800 border-amber-200'
                                }`}
                            >
                                <span>⏱️ 計時器</span>
                                {timerSeconds > 0 && (
                                    <span class="bg-white/20 font-mono text-xs px-1.5 py-0.5 rounded">
                                        {Math.floor(timerSeconds / 60)}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                    </span>
                                )}
                            </button>

                            <button 
                                onClick={handleExportCSVReport}
                                class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold px-3 py-2 rounded-xl border border-blue-200 text-sm transition"
                            >
                                📊 匯出報告
                            </button>

                            <button 
                                onClick={() => setShowExitConfirmModal(true)}
                                class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2 rounded-xl border border-rose-200 text-sm transition"
                            >
                                🚪 退出課室
                            </button>
                        </div>
                    </div>
                </header>

                {/* Main Container */}
                <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

                    {/* Mode Selectors */}
                    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3">
                        {[
                            { id: 'CHOICE', label: '選擇題', icon: '🔘' },
                            { id: 'TF', label: '是非題', icon: '⭕' },
                            { id: 'SHORT', label: '短答題', icon: '✍️' },
                            { id: 'DRAW', label: '白板題', icon: '🎨' },
                            { id: 'BUZZER', label: '搶答題', icon: '🚨' },
                            { id: 'AUDIO', label: '錄音題', icon: '🎤' },
                            { id: 'CHALLENGE', label: '挑戰題', icon: '🏆' },
                            { id: 'LINK', label: '派送連結', icon: '🔗' }
                        ].map((mode) => (
                            <button 
                                key={mode.id}
                                onClick={() => setSelectedMode(mode.id)}
                                class={`p-3.5 rounded-2xl font-bold border-2 transition-all text-center flex flex-col items-center justify-center space-y-1 shadow-sm active:scale-95 ${
                                    selectedMode === mode.id 
                                    ? 'bg-slate-900 text-white border-slate-900 ring-4 ring-slate-200' 
                                    : 'bg-white text-slate-700 border-slate-200 hover:border-slate-300 hover:bg-slate-50'
                                }`}
                            >
                                <span class="text-2xl">{mode.icon}</span>
                                <span class="text-xs md:text-sm font-extrabold">{mode.label}</span>
                            </button>
                        ))}
                    </div>

                    {/* Question Creation Panel */}
                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                        <div class="flex flex-wrap items-center justify-between border-b pb-3 gap-2">
                            <h2 class="font-extrabold text-slate-800 text-lg flex items-center gap-2">
                                <span>模式設定：{getModeLabel(selectedMode)}</span>
                            </h2>

                            {selectedMode !== 'CHALLENGE' && (
                                <div class="flex items-center space-x-2 bg-slate-100 p-1.5 rounded-xl">
                                    <span class="text-xs font-bold text-slate-600 pl-2">提交後允許修改：</span>
                                    <button 
                                        onClick={toggleLockMode}
                                        class={`px-3 py-1 rounded-lg text-xs font-bold transition ${!lockAfterSubmit ? 'bg-emerald-500 text-white' : 'bg-slate-300 text-slate-600'}`}
                                    >
                                        {!lockAfterSubmit ? '已開放修改' : '已鎖定 (預設)'}
                                    </button>
                                </div>
                            )}
                        </div>

                        {selectedMode === 'CHOICE' && (
                            <div class="flex items-center space-x-4">
                                <label class="text-sm font-bold text-slate-700">選項數量：</label>
                                {[4, 5].map((cnt) => (
                                    <button 
                                        key={cnt} 
                                        onClick={() => setChoiceCount(cnt)}

                                <div class={`font-mono font-black text-6xl tracking-widest ${timerSeconds <= 10 && timerSeconds > 0 ? 'text-red-400 animate-pulse' : 'text-amber-400'}`}>
                                    {Math.floor(timerSeconds / 60).toString().padStart(2, '0')}:{(timerSeconds % 60).toString().padStart(2, '0')}

                            <div class="grid grid-cols-3 gap-2">

                                <button

                                >

                                <button

                                    {timerActive ? '暫停計時' : '繼續 / 開始計時'}

                                <button 
                                    onClick={() => { setTimerActive(false); setTimerSeconds(0); }}

    }

    function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
        const [selectedAnswer, setSelectedAnswer] = useState('');
        const [textAnswer, setTextAnswer] = useState('');
        const [challengeAnswers, setChallengeAnswers] = useState({});
        const [challengeSubmitted, setChallengeSubmitted] = useState(false);
        const [challengeTimeLeft, setChallengeTimeLeft] = useState(null);

        // Revision 1: Precise Touch Whiteboard Canvas State & Controls
        const canvasRef = useRef(null);
        const [penColor, setPenColor] = useState('#2563eb');
        const [penSize, setPenSize] = useState(4);
        const [isEraser, setIsEraser] = useState(false);
        const [studentBgImage, setStudentBgImage] = useState(null);
        const [isDrawing, setIsDrawing] = useState(false);

        // Audio recorder
        const [isRecording, setIsRecording] = useState(false);
        const [audioBlobUrl, setAudioBlobUrl] = useState(null);
        const [audioBase64, setAudioBase64] = useState(null);
        const [recordingTimer, setRecordingTimer] = useState(0);
        const mediaRecorderRef = useRef(null);
        const audioChunksRef = useRef([]);

        const myResponseKey = activeQuestion ? `${activeQuestion.id}_${studentId}` : null;
        const myResponse = myResponseKey ? responses[myResponseKey] : null;

        // Timer for Challenge question
        useEffect(() => {
            let interval = null;
            if (activeQuestion?.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer && challengeTimeLeft !== null && challengeTimeLeft > 0 && !challengeSubmitted) {
                interval = setInterval(() => {
                    setChallengeTimeLeft(t => {
                        if (t <= 1) {
                            handleSubmitChallenge(true); // Auto submit on timer end
                            return 0;
                        }
                        return t - 1;
                    });
                }, 1000);
            }
            return () => clearInterval(interval);
        }, [activeQuestion, challengeTimeLeft, challengeSubmitted]);

        // Reset local states on question change
        useEffect(() => {
            if (activeQuestion) {
                setSelectedAnswer('');
                setTextAnswer('');
                setChallengeAnswers({});
                setChallengeSubmitted(false);
                setAudioBlobUrl(null);
                setAudioBase64(null);
                setStudentBgImage(null);

                if (activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer) {
                    setChallengeTimeLeft(activeQuestion.challenge.timeLimit || 120);
                } else {
                    setChallengeTimeLeft(null);
                }
            }
        }, [activeQuestion?.id]);

        // Audio recording countdown timer
        useEffect(() => {
            let interval = null;
            if (isRecording) {
                interval = setInterval(() => {
                    setRecordingTimer(t => {
                        if (t >= 10) {
                            stopRecording();
                            return 10;
                        }
                        return t + 1;
                    });
                }, 1000);
            } else {
                setRecordingTimer(0);
            }
            return () => clearInterval(interval);
        }, [isRecording]);

        const submitStudentAnswer = async (ansValue, scoreDetails = null) => {
            if (!activeQuestion) return;

            const durationSec = Math.max(1, Math.round((Date.now() - activeQuestion.startTime) / 1000));
            
            const responseObj = {
                questionId: activeQuestion.id,
                studentId: studentId,
                seatNumber: seatNumber,
                name: studentName || `學號 ${seatNumber}`,
                answer: ansValue,
                duration: durationSec,
                submittedAt: Date.now(),
                scoreDetails: scoreDetails
            };

            const appId = "omit-8c173";
            const db = window.fbDb;
            const docKey = `${activeQuestion.id}_${studentId}`;
            const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', docKey);
            
            await window.fbUtils.setDoc(resDocRef, responseObj);
            showToast("作答已成功提交！", "success");
        };

        const startRecording = async () => {
            audioChunksRef.current = [];
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const recorder = new MediaRecorder(stream);
                mediaRecorderRef.current = recorder;

                recorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunksRef.current.push(e.data);
                };

                recorder.onstop = () => {
                    const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                    const url = URL.createObjectURL(blob);
                    setAudioBlobUrl(url);

                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setAudioBase64(reader.result);
                    };
                    reader.readAsDataURL(blob);

                    // Stop tracks
                    stream.getTracks().forEach(track => track.stop());
                };

                recorder.start();
                setIsRecording(true);
            } catch (e) {
                console.error("Mic access error:", e);
                showToast("無法存取麥克風，請檢查權限！", "error");
            }
        };

        const stopRecording = () => {
            if (mediaRecorderRef.current && isRecording) {
                mediaRecorderRef.current.stop();
                setIsRecording(false);
            }
        };

        // Revision 3: Delete Audio Recording
        const handleDeleteRecording = () => {
            setAudioBlobUrl(null);
            setAudioBase64(null);
            audioChunksRef.current = [];
            showToast("錄音已刪除，可以重新錄製！", "info");
        };

        // Revision 1: Accurate Touch & Mouse Drawing Coordinates Calculation
        const getCanvasCoords = (e) => {
            const canvas = canvasRef.current;
            if (!canvas) return { x: 0, y: 0 };
            const rect = canvas.getBoundingClientRect();
            
            let clientX = e.clientX;
            let clientY = e.clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            // Account for resolution ratio (scale factors) between CSS pixels and Canvas pixel size
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        };

        const startDrawing = (e) => {
            if (e.type === 'touchstart') {
                // prevent page scrolling while drawing
            }
            const canvas = canvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const { x, y } = getCanvasCoords(e);
            ctx.beginPath();
            ctx.moveTo(x, y);
            setIsDrawing(true);
        };

        const draw = (e) => {
            if (!isDrawing) return;
            const canvas = canvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const { x, y } = getCanvasCoords(e);

            if (isEraser) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = penSize * 3;
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = penColor;
                ctx.lineWidth = penSize;
            }

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineTo(x, y);
            ctx.stroke();
        };

        const stopDrawing = () => {
            setIsDrawing(false);
        };

        const clearCanvas = () => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        };

        const handleStudentBgUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    setStudentBgImage(evt.target.result);
                    showToast("已載入個人白板背景圖片！", "success");
                };
                reader.readAsDataURL(file);
            }
        };

        const handleSubmitWhiteboard = () => {
            const canvas = canvasRef.current;
            if (!canvas) return;

            // Merge background image + drawing canvas
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');

            tempCtx.fillStyle = '#ffffff';
            tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

            const activeBg = studentBgImage || activeQuestion?.whiteboardBg;

            if (activeBg) {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => {
                    tempCtx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);
                    tempCtx.drawImage(canvas, 0, 0);
                    const dataUrl = tempCanvas.toDataURL('image/png');
                    submitStudentAnswer(dataUrl);
                };
                img.onerror = () => {
                    tempCtx.drawImage(canvas, 0, 0);
                    const dataUrl = tempCanvas.toDataURL('image/png');
                    submitStudentAnswer(dataUrl);
                };
                img.src = activeBg;
            } else {
                tempCtx.drawImage(canvas, 0, 0);
                const dataUrl = tempCanvas.toDataURL('image/png');
                submitStudentAnswer(dataUrl);
            }
        };

        const handleSubmitChallenge = (isAuto = false) => {
            if (!activeQuestion || !activeQuestion.challenge) return;
            const questions = activeQuestion.challenge.questions || [];
            
            let correctCount = 0;
            questions.forEach(q => {
                if (challengeAnswers[q.num] === q.answer) {
                    correctCount++;
                }
            });

            const totalScore = activeQuestion.challenge.totalScore || 100;
            const perQScore = totalScore / (questions.length || 1);
            const earnedScore = Math.round(correctCount * perQScore);
            const percentage = Math.round((correctCount / questions.length) * 100);

            const scoreDetails = {
                totalScore: earnedScore,
                percentage: percentage,
                correctCount: correctCount,
                questionCount: questions.length
            };

            setChallengeSubmitted(true);
            submitStudentAnswer(JSON.stringify(challengeAnswers), scoreDetails);
            if (isAuto) {
                showToast("時間到達，系統已自動為您提交挑戰題！", "info");
            }
        };

        const isScoresReleased = useMemo(() => {
            if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return false;
            return !!(activeQuestion.challenge?.releaseInstant || activeQuestion.challenge?.scoresReleased);
        }, [activeQuestion]);

        return (
            <div class="min-h-screen bg-slate-100 flex flex-col">
                {/* Header */}
                <header class="bg-indigo-900 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-30">
                    <div class="flex items-center space-x-2">
                        <span class="bg-indigo-600 px-2.5 py-1 rounded-lg text-xs font-black">OMIT</span>
                        <span class="font-bold text-sm">{seatNumber} 號 - {studentName || '學生'}</span>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="bg-indigo-800 text-indigo-200 text-xs px-2.5 py-1 rounded-full font-mono font-bold">
                            房號：{roomCode}
                        </span>
                        <button onClick={onExit} class="text-xs bg-indigo-800 hover:bg-indigo-700 px-3 py-1 rounded-lg font-bold">
                            退出
                        </button>
                    </div>
                </header>

                {/* Broadcast Banner if Teacher pushes student canvas */}
                {activeQuestion?.broadcastedSubmission && (
                    <div class="bg-purple-900 text-white p-4 shadow-inner border-b border-purple-700 animate-fade-in">
                        <div class="max-w-xl mx-auto space-y-2 text-center">
                            <span class="bg-purple-600 text-xs px-2.5 py-1 rounded-full font-bold">📢 全班作品展示與互評</span>
                            <h4 class="font-extrabold text-base">
                                正在展示：{activeQuestion.broadcastedSubmission.seatNumber} 號 - {activeQuestion.broadcastedSubmission.name} 的白板作品
                            </h4>
                            <div class="aspect-16-9 max-w-lg mx-auto bg-white rounded-2xl overflow-hidden border-2 border-purple-300 shadow-xl">
                                <img src={activeQuestion.broadcastedSubmission.answer} class="w-full h-full object-contain" alt="全班展示" />
                            </div>
                        </div>
                    </div>
                )}

                {/* Main Workspace */}
                <main class="flex-1 max-w-xl w-full mx-auto p-4 space-y-6 flex flex-col justify-center">

                    {!activeQuestion ? (
                        <div class="bg-white rounded-3xl p-8 text-center space-y-4 shadow-sm border border-slate-200">
                            <div class="text-5xl animate-bounce">⏳</div>
                            <h2 class="text-2xl font-black text-slate-800">課堂進行中</h2>
                            <p class="text-slate-500 text-sm">安靜等候老師發佈互動題目...</p>
                        </div>
                    ) : (
                        <div class="space-y-4">
                            {/* Question Prompt Header */}
                            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="bg-indigo-100 text-indigo-700 text-xs px-3 py-1 rounded-full font-bold">
                                        {getModeLabel(activeQuestion.mode)}
                                    </span>
                                    {activeQuestion.mode === 'CHALLENGE' && challengeTimeLeft !== null && (
                                        <span class={`font-mono font-bold text-sm px-3 py-1 rounded-full ${challengeTimeLeft <= 10 ? 'bg-red-100 text-red-600 animate-pulse' : 'bg-amber-100 text-amber-800'}`}>
                                            ⏱️ 賸餘時間：{Math.floor(challengeTimeLeft / 60).toString().padStart(2, '0')}:{(challengeTimeLeft % 60).toString().padStart(2, '0')}
                                        </span>
                                    )}
                                </div>
                                <h2 class="text-xl font-black text-slate-800 leading-snug">
                                    {activeQuestion.text}
                                </h2>
                            </div>

                            {/* Revision 4: Submission Confirmation Banner for ALL Modes */}
                            {myResponse && (
                                <div class="bg-emerald-500 text-white p-6 rounded-3xl shadow-lg text-center space-y-3 animate-fade-in border-2 border-emerald-400">
                                    <div class="text-4xl">🎉</div>
                                    <div class="text-xl md:text-2xl font-black tracking-wide">
                                        已提交答案! 讚賞你的努力! 安靜等候老師指示...
                                    </div>
                                    <div class="text-xs text-emerald-100 font-mono">
                                        提交時間：{new Date(myResponse.submittedAt).toLocaleTimeString('zh-HK')}
                                    </div>
                                </div>
                            )}

                            {/* Choice / TrueFalse Input */}
                            {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                <div class="bg-white rounded-3xl p-6 shadow-sm border space-y-4">
                                    <div class="grid grid-cols-1 gap-3">
                                        {activeQuestion.choiceOptions.map((opt) => (
                                            <button 
                                                key={opt}
                                                onClick={() => setSelectedAnswer(opt)}
                                                disabled={myResponse && activeQuestion.lockAfterSubmit}
                                                class={`p-4 rounded-2xl font-black text-lg border-2 text-left transition flex items-center justify-between active:scale-98 ${
                                                    selectedAnswer === opt 
                                                    ? 'bg-indigo-600 text-white border-indigo-600 ring-4 ring-indigo-200' 
                                                    : 'bg-slate-50 text-slate-700 border-slate-200 hover:border-indigo-300'
                                                }`}
                                            >
                                                <span>{opt}</span>
                                                {selectedAnswer === opt && <span>✓</span>}
                                            </button>
                                        ))}
                                    </div>

                                    {(!myResponse || !activeQuestion.lockAfterSubmit) && (
                                        <button 
                                            onClick={() => {
                                                if (!selectedAnswer) return showToast("請先點選答案選項！", "error");
                                                submitStudentAnswer(selectedAnswer);
                                            }}
                                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-lg transition active:scale-98 text-base"
                                        >
                                            {myResponse ? "重新提交答案 🚀" : "提交答案 🚀"}
                                        </button>
                                    )}
                                </div>
                            )}

                            {/* Short Answer Input */}
                            {activeQuestion.mode === 'SHORT' && (
                                <div class="bg-white rounded-3xl p-6 shadow-sm border space-y-4">
                                    <textarea 
                                        rows={4}
                                        value={textAnswer}
                                        onChange={(e) => setTextAnswer(e.target.value)}
                                        disabled={myResponse && activeQuestion.lockAfterSubmit}
                                        placeholder="請在這裡輸入您的文字回答..."
                                        class="w-full p-4 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-base font-medium"
                                    />
                                    {(!myResponse || !activeQuestion.lockAfterSubmit) && (
                                        <button 
                                            onClick={() => {
                                                if (!textAnswer.trim()) return showToast("請輸入回答內容！", "error");
                                                submitStudentAnswer(textAnswer.trim());
                                            }}
                                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-lg transition active:scale-98 text-base"
                                        >
                                            {myResponse ? "重新提交答案 🚀" : "提交答案 🚀"}
                                        </button>
                                    )}
                                </div>
                            )}

                            {/* Revision 1: Whiteboard Draw Input with Precise Touch Coordinates */}
                            {activeQuestion.mode === 'DRAW' && (
                                <div class="bg-white rounded-3xl p-4 shadow-sm border space-y-4">
                                    {/* Color & Tool Bar */}
                                    <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-50 p-2.5 rounded-2xl border">
                                        <div class="flex items-center space-x-1.5">
                                            {['#2563eb', '#dc2626', '#16a34a', '#d97706', '#000000'].map(c => (
                                                <button 
                                                    key={c}
                                                    onClick={() => { setPenColor(c); setIsEraser(false); }}
                                                    class={`w-7 h-7 rounded-full border-2 transition ${penColor === c && !isEraser ? 'scale-110 ring-2 ring-indigo-400' : ''}`}
                                                    style={{ backgroundColor: c }}
                                                />
                                            ))}
                                            <button 
                                                onClick={() => setIsEraser(!isEraser)}
                                                class={`px-2.5 py-1 rounded-xl font-bold text-xs border ${isEraser ? 'bg-rose-500 text-white' : 'bg-white text-slate-700'}`}
                                            >
                                                🧹 橡皮擦
                                            </button>
                                        </div>

                                        <div class="flex items-center space-x-2">
                                            <button 
                                                onClick={clearCanvas} 
                                                class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-2.5 py-1 rounded-xl font-bold"
                                            >
                                                清空
                                            </button>
                                            <label class="text-xs bg-purple-100 hover:bg-purple-200 text-purple-800 px-2.5 py-1 rounded-xl font-bold cursor-pointer">
                                                📷 上載背景
                                                <input type="file" accept="image/*" onChange={handleStudentBgUpload} class="hidden" />
                                            </label>
                                        </div>
                                    </div>

                                    {/* Canvas Area */}
                                    <div class="relative w-full aspect-16-9 bg-white border-2 border-indigo-200 rounded-2xl overflow-hidden shadow-inner canvas-container">
                                        {(studentBgImage || activeQuestion.whiteboardBg) && (
                                            <img 
                                                src={studentBgImage || activeQuestion.whiteboardBg} 
                                                class="absolute inset-0 w-full h-full object-contain pointer-events-none" 
                                                alt="背景"
                                            />
                                        )}
                                        <canvas 
                                            ref={canvasRef}
                                            width={800}
                                            height={450}
                                            onMouseDown={startDrawing}
                                            onMouseMove={draw}
                                            onMouseUp={stopDrawing}
                                            onMouseLeave={stopDrawing}
                                            onTouchStart={startDrawing}
                                            onTouchMove={draw}
                                            onTouchEnd={stopDrawing}
                                            class="absolute inset-0 w-full h-full cursor-crosshair touch-none"
                                        />
                                    </div>

                                    {(!myResponse || !activeQuestion.lockAfterSubmit) && (
                                        <button 
                                            onClick={handleSubmitWhiteboard}
                                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-lg transition active:scale-98 text-base"
                                        >
                                            {myResponse ? "重新提交白板答案 🚀" : "提交白板作品 🚀"}
                                        </button>
                                    )}
                                </div>
                            )}

                            {/* Buzzer Input */}
                            {activeQuestion.mode === 'BUZZER' && (
                                <div class="bg-white rounded-3xl p-8 shadow-sm border text-center space-y-6">
                                    {!myResponse ? (
                                        <button 
                                            onClick={() => {
                                                playSound('buzzer');
                                                submitStudentAnswer('搶答成功！');
                                            }}
                                            class="w-48 h-48 mx-auto rounded-full bg-gradient-to-tr from-rose-600 to-red-500 hover:from-rose-500 hover:to-red-400 text-white font-black text-3xl shadow-2xl border-8 border-rose-200 active:scale-90 transition transform flex items-center justify-center tracking-widest"
                                        >
                                            🚨 搶答！
                                        </button>
                                    ) : (
                                        <div class="bg-rose-50 border border-rose-200 p-6 rounded-2xl space-y-2">
                                            <div class="text-3xl">🎉</div>
                                            <div class="font-black text-rose-800 text-xl">您已點擊搶答按鈕！</div>
                                            <div class="text-xs text-rose-600 font-mono">用時：{myResponse.duration} 秒</div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* Revision 3: Audio Input with Instant Playback, Delete & Re-record */}
                            {activeQuestion.mode === 'AUDIO' && (
                                <div class="bg-white rounded-3xl p-6 shadow-sm border text-center space-y-6">
                                    <div class="space-y-4">
                                        {!audioBlobUrl ? (
                                            <div class="space-y-4">
                                                <div class="w-28 h-28 mx-auto rounded-full bg-cyan-100 flex items-center justify-center text-4xl shadow-inner">
                                                    🎤
                                                </div>
                                                {isRecording ? (
                                                    <div class="space-y-3">
                                                        <div class="text-rose-600 font-black text-lg animate-pulse flex items-center justify-center space-x-2">
                                                            <span class="w-3 h-3 rounded-full bg-rose-600"></span>
                                                            <span>錄音中 ({recordingTimer} / 10 秒)</span>
                                                        </div>
                                                        <button 
                                                            onClick={stopRecording}
                                                            class="bg-rose-600 hover:bg-rose-700 text-white font-bold px-6 py-3 rounded-2xl shadow-md transition"
                                                        >
                                                            ⏹️ 停止錄音
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <button 
                                                        onClick={startRecording}
                                                        class="bg-cyan-600 hover:bg-cyan-700 text-white font-black px-8 py-4 rounded-2xl shadow-lg transition active:scale-95 text-base"
                                                    >
                                                        🎙️ 開始錄音 (最多10秒)
                                                    </button>
                                                )}
                                            </div>
                                        ) : (
                                            <div class="bg-cyan-50 border border-cyan-200 p-5 rounded-2xl space-y-4 text-left">
                                                <div class="flex items-center justify-between">
                                                    <span class="text-xs font-bold text-cyan-900">🎧 錄音完成！可點擊下方播放收聽試聽：</span>
                                                    <button 
                                                        onClick={handleDeleteRecording}
                                                        class="text-xs bg-red-100 hover:bg-red-200 text-red-700 font-bold px-3 py-1.5 rounded-xl transition flex items-center space-x-1"
                                                    >
                                                        <span>🗑️ 刪除再錄</span>
                                                    </button>
                                                </div>

                                                {/* Instant Playback Audio Player */}
                                                <audio src={audioBlobUrl} controls class="w-full rounded-xl" />

                                                {(!myResponse || !activeQuestion.lockAfterSubmit) && (
                                                    <button 
                                                        onClick={() => {
                                                            if (!audioBase64) return showToast("尚未完成錄音！", "error");
                                                            submitStudentAnswer(audioBase64);
                                                        }}
                                                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3.5 rounded-xl shadow-lg transition active:scale-98 text-base"
                                                    >
                                                        {myResponse ? "重新提交錄音答案 🚀" : "提交語音回答 🚀"}
                                                    </button>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* Challenge Question Input */}
                            {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                <div class="bg-white rounded-3xl p-6 shadow-sm border space-y-6">
                                    <div class="space-y-4">
                                        {activeQuestion.challenge.questions.map((q) => (
                                            <div key={q.num} class="bg-slate-50 p-4 rounded-2xl border space-y-3">
                                                <div class="font-black text-slate-800 text-sm">
                                                    {q.num}. {q.text}
                                                </div>
                                                <div class="grid grid-cols-1 gap-2">
                                                    {q.options.map((opt) => (
                                                        <button 
                                                            key={opt.letter}
                                                            disabled={challengeSubmitted || (myResponse && activeQuestion.lockAfterSubmit)}
                                                            onClick={() => {
                                                                setChallengeAnswers(prev => ({ ...prev, [q.num]: opt.letter }));
                                                            }}
                                                            class={`p-3 rounded-xl text-xs font-bold border text-left transition flex items-center justify-between ${
                                                                challengeAnswers[q.num] === opt.letter 
                                                                ? 'bg-amber-500 text-white border-amber-500' 
                                                                : 'bg-white text-slate-700 border-slate-200'
                                                            }`}
                                                        >
                                                            <span>{opt.letter}. {opt.text}</span>
                                                            {challengeAnswers[q.num] === opt.letter && <span>✓</span>}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    {!challengeSubmitted && (!myResponse || !activeQuestion.lockAfterSubmit) && (
                                        <button 
                                            onClick={() => handleSubmitChallenge(false)}
                                            class="w-full bg-amber-600 hover:bg-amber-700 text-white font-black py-4 rounded-2xl shadow-lg transition active:scale-98 text-base"
                                        >
                                            完成評估並提交挑戰題 🚀
                                        </button>
                                    )}

                                    {/* Score Display Panel */}
                                    {myResponse && isScoresReleased && myResponse.scoreDetails && (
                                        <div class="bg-emerald-50 border-2 border-emerald-300 p-5 rounded-2xl text-center space-y-2">
                                            <div class="text-xs font-extrabold text-emerald-800 uppercase">挑戰題評估得分</div>
                                            <div class="text-4xl font-black text-emerald-600">
                                                {myResponse.scoreDetails.totalScore} / {activeQuestion.challenge.totalScore} 分
                                            </div>
                                            <div class="text-xs font-bold text-emerald-700">
                                                答對：{myResponse.scoreDetails.correctCount} / {myResponse.scoreDetails.questionCount} 題 (正確率：{myResponse.scoreDetails.percentage}%)
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* Revision 2: Link Mode with Direct YouTube Embed & Clickable Button */}
                            {activeQuestion.mode === 'LINK' && (
                                <div class="bg-white rounded-3xl p-6 shadow-sm border text-center space-y-5">
                                    <div class="inline-flex items-center justify-center w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl text-3xl">
                                        🔗
                                    </div>

                                    {/* YouTube Video Player Embed */}
                                    {activeQuestion.youtubeEmbed ? (
                                        <div class="space-y-3">
                                            <div class="aspect-16-9 w-full rounded-2xl overflow-hidden shadow-lg border border-slate-200 bg-black">
                                                <iframe 
                                                    src={activeQuestion.youtubeEmbed} 
                                                    title="YouTube Video" 
                                                    class="w-full h-full" 
                                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                                    allowFullScreen
                                                ></iframe>
                                            </div>
                                            <p class="text-xs text-slate-500 font-bold">請播放並觀看上方派送的影片內容</p>
                                        </div>
                                    ) : null}

                                    {/* Clickable External Link Button */}
                                    {activeQuestion.pushedUrl && (
                                        <a 
                                            href={activeQuestion.pushedUrl} 
                                            target="_blank" 
                                            rel="noopener noreferrer"
                                            class="inline-flex items-center justify-center space-x-2 w-full bg-amber-500 hover:bg-amber-600 text-white font-extrabold py-4 px-6 rounded-2xl shadow-lg text-base transition active:scale-98"
                                        >
                                            <span>開啟連結網站 🔗</span>
                                        </a>
                                    )}

                                    {!myResponse && (
                                        <button 
                                            onClick={() => submitStudentAnswer('已開啟/觀看派送內容')}
                                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition text-sm"
                                        >
                                            確認已開啟/閱讀完成 🚀
                                        </button>
                                    )}
                                </div>
                            )}
                        </div>
                    )}
                </main>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<OMITApp />);
</script>
