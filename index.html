            );
        }

        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, studentsList, showToast, onExit }) {
            const [selectedChoice, setSelectedChoice] = useState('');
            const [shortAnswer, setShortAnswer] = useState('');
            const [audioBlob, setAudioBlob] = useState(null);
            const [audioUrl, setAudioUrl] = useState(null);
            const [isRecording, setIsRecording] = useState(false);
            const [recordingTime, setRecordingTime] = useState(0);

            // Challenge Mode Student State
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [challengeRemainingSeconds, setChallengeRemainingSeconds] = useState(null);

            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);
            const recordingTimerRef = useRef(null);

            const myResponseKey = activeQuestion ? `${activeQuestion.id}_${studentId}` : null;
            const myResponse = myResponseKey ? responses[myResponseKey] : null;

            // Group assignment for Cooperative mode
            const myCoopGroup = useMemo(() => {
                if (!activeQuestion || activeQuestion.mode !== 'COOP' || !activeQuestion.coopGroups) return null;
                return activeQuestion.coopGroups.find(g => g.members.some(m => m.id === studentId));
            }, [activeQuestion, studentId]);

            const myIndexInGroup = useMemo(() => {
                if (!myCoopGroup) return 0;
                return myCoopGroup.members.findIndex(m => m.id === studentId);
            }, [myCoopGroup, studentId]);

            // Audio recording 10s timer limit
            useEffect(() => {
                if (isRecording) {
                    recordingTimerRef.current = setInterval(() => {
                        setRecordingTime(t => {
                            if (t >= 9) {
                                stopRecording();
                                return 10;
                            }
                            return t + 1;
                        });
                    }, 1000);
                } else {
                    clearInterval(recordingTimerRef.current);
                }
                return () => clearInterval(recordingTimerRef.current);
            }, [isRecording]);

            // Challenge timer auto-submit logic
            useEffect(() => {
                let interval = null;
                if (activeQuestion?.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer && !myResponse) {
                    const elapsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                    const remaining = Math.max(0, activeQuestion.challenge.timeLimit - elapsed);
                    setChallengeRemainingSeconds(remaining);

                    interval = setInterval(() => {
                        setChallengeRemainingSeconds(prev => {
                            if (prev <= 1) {
                                clearInterval(interval);
                                handleChallengeAutoSubmit();
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [activeQuestion, myResponse]);

            // Audio recording handlers
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const url = URL.createObjectURL(blob);
                        setAudioBlob(blob);
                        setAudioUrl(url);
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                    setRecordingTime(0);
                } catch (err) {
                    console.error("Mic access error:", err);
                    showToast("無法存取麥克風權限！", "error");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const handleClearRecording = () => {
                setAudioBlob(null);
                setAudioUrl(null);
                setRecordingTime(0);
            };

            // Generic Response Submit
            const submitResponse = async (answerVal, extraDetails = null) => {
                if (!activeQuestion) return;

                const durationSec = Math.round((Date.now() - activeQuestion.startTime) / 1000);
                const appId = "omit-8c173";
                const db = window.fbDb;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', `${activeQuestion.id}_${studentId}`);

                const payload = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: answerVal,
                    duration: durationSec,
                    submittedAt: Date.now(),
                    ...extraDetails
                };

                await window.fbUtils.setDoc(resDocRef, payload);
                playSound('win');
            };

            // Challenge submission calculation
            const handleChallengeSubmit = async () => {
                if (!activeQuestion?.challenge) return;
                const questions = activeQuestion.challenge.questions;
                let correctCount = 0;

                questions.forEach((q) => {
                    const studentAns = challengeAnswers[q.num];
                    if (studentAns === q.answer) correctCount++;
                });

                const totalQs = questions.length;
                const scorePerQ = activeQuestion.challenge.totalScore / totalQs;
                const calculatedTotalScore = Math.round(correctCount * scorePerQ);
                const percentage = Math.round((correctCount / totalQs) * 100);

                const scoreDetails = {
                    totalScore: calculatedTotalScore,
                    percentage: percentage,
                    correctCount: correctCount,
                    totalQuestions: totalQs,
                    answersMap: challengeAnswers
                };

                await submitResponse(challengeAnswers, { scoreDetails });
                showToast("已成功提交挑戰題！", "success");
            };

            const handleChallengeAutoSubmit = () => {
                if (!myResponse) {
                    handleChallengeSubmit();
                    showToast("限時時間已到，系統已自動收卷提交！", "info");
                }
            };

            // Cooperative Mode Student Submit Choice Handler
            const handleCoopSubmitChoice = async (optLetter) => {
                if (!myCoopGroup || !activeQuestion?.coopData) return;

                const currentQIndex = myCoopGroup.progress;
                const currentQuestion = activeQuestion.coopData.questions[currentQIndex];

                const isCorrect = optLetter === currentQuestion.answer;

                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                const updatedGroups = activeQuestion.coopGroups.map(g => {
                    if (g.id === myCoopGroup.id) {
                        if (isCorrect) {
                            const newProg = g.progress + 1;
                            return { ...g, progress: newProg };
                        } else {
                            // Reset back to 0 on wrong answer!
                            return { ...g, progress: 0, failedReset: true };
                        }
                    }
                    return g;
                });

                // Check if this group won
                let winningGroupObj = null;
                const targetGroup = updatedGroups.find(g => g.id === myCoopGroup.id);
                if (targetGroup && targetGroup.progress >= activeQuestion.coopData.questions.length) {
                    winningGroupObj = targetGroup;
                }

                await window.fbUtils.setDoc(roomDocRef, {
                    activeQuestion: {
                        ...activeQuestion,
                        coopGroups: updatedGroups,
                        winningGroup: winningGroupObj
                    }
                }, { merge: true });

                if (isCorrect) {
                    playSound('win');
                    showToast("答對了！全組進度向前推進一格！", "success");
                } else {
                    playSound('error');
                    showToast("答錯了！全組著色進度歸零重新開始！", "error");
                }
            };

            return (
                <div class="min-h-screen bg-slate-100 pb-12">
                    {/* Header */}
                    <header class="bg-slate-900 text-white px-4 py-3 shadow-md sticky top-0 z-30 flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <span class="bg-indigo-600 font-black px-2.5 py-1 rounded-lg text-sm">OMIT</span>
                            <span class="font-bold text-sm">房號：{roomCode}</span>
                        </div>
                        <div class="flex items-center space-x-3 text-xs font-bold">
                            <span class="bg-slate-800 px-3 py-1 rounded-full">{seatNumber}號 {studentName}</span>
                            <button onClick={onExit} class="text-slate-400 hover:text-white">退出</button>
                        </div>
                    </header>

                    <main class="max-w-2xl mx-auto p-4 space-y-6">

                        {/* Display Teacher Live Demo Whiteboard if Broadcasted */}
                        {activeQuestion?.teacherDemoWhiteboard && (
                            <div class="bg-purple-900 text-white rounded-3xl p-4 shadow-xl space-y-3 animate-fade-in border-4 border-purple-400">
                                <div class="flex justify-between items-center">
                                    <span class="font-black text-sm flex items-center gap-1.5">
                                        <span>📡</span> 教師即時示範白板廣播
                                    </span>
                                </div>
                                <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden">
                                    <img src={activeQuestion.teacherDemoWhiteboard} class="w-full h-full object-contain" alt="教師白板" />
                                </div>
                            </div>
                        )}

                        {/* Display Peer Student Work if Broadcasted */}
                        {activeQuestion?.broadcastedSubmission && (
                            <div class="bg-gradient-to-br from-indigo-900 to-purple-900 text-white rounded-3xl p-5 shadow-xl space-y-3 animate-fade-in border-4 border-indigo-400">
                                <div class="flex justify-between items-center">
                                    <span class="font-black text-sm flex items-center gap-1.5 text-amber-300">
                                        <span>🌟</span> 全班廣播互評：{activeQuestion.broadcastedSubmission.seatNumber}號 {activeQuestion.broadcastedSubmission.name} 的作品
                                    </span>
                                </div>
                                <div class="bg-white text-slate-800 rounded-2xl p-4 min-h-32 flex items-center justify-center shadow-inner">
                                    {typeof activeQuestion.broadcastedSubmission.answer === 'string' && activeQuestion.broadcastedSubmission.answer.startsWith('data:image') ? (
                                        <img src={activeQuestion.broadcastedSubmission.answer} class="max-h-72 object-contain" alt="廣播作品" />
                                    ) : (
                                        <div class="font-bold text-lg text-center">{activeQuestion.broadcastedSubmission.answer}</div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Waiting Screen when no active question */}
                        {!activeQuestion && (
                            <div class="bg-white rounded-3xl p-8 text-center space-y-4 shadow-sm border border-slate-200 my-12">
                                <div class="text-6xl animate-pulse">⏳</div>
                                <h3 class="text-xl font-black text-slate-800">安靜等候老師指示...</h3>
                                <p class="text-slate-400 text-xs">當老師發佈題目或指示時，畫面將會即時自動轉換</p>
                            </div>
                        )}

                        {/* Active Question Display */}
                        {activeQuestion && (
                            <div class="space-y-6">

                                {/* Cooperative Mode Student Screen */}
                                {activeQuestion.mode === 'COOP' && (
                                    <div class="bg-white rounded-3xl p-6 shadow-md border-2 border-purple-200 space-y-5">
                                        {/* Coop Phase 2: Grouping display */}
                                        {activeQuestion.coopPhase === 'GROUP' && (
                                            <div class="text-center space-y-4 py-6">
                                                <div class="text-5xl">{myCoopGroup ? myCoopGroup.emoji : '👥'}</div>
                                                <h3 class="text-2xl font-black" style={{ color: myCoopGroup?.hex }}>
                                                    你已被分配至：{myCoopGroup ? myCoopGroup.name : '分組中...'}
                                                </h3>
                                                <div class="bg-purple-50 p-4 rounded-2xl border border-purple-200 text-purple-900 font-bold text-sm">
                                                    盡快與你的組員會合！比賽即將開始！
                                                </div>
                                                {myCoopGroup && (
                                                    <div class="text-xs font-medium text-slate-500">
                                                        同組成員：{myCoopGroup.members.map(m => `${m.seatNumber}號 ${m.name}`).join('、 ')}
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {/* Coop Phase 3: Split Question Interface */}
                                        {activeQuestion.coopPhase === 'PLAY' && !activeQuestion.winningGroup && myCoopGroup && (
                                            <div class="space-y-5">
                                                <div class="flex justify-between items-center border-b pb-3">
                                                    <span class="font-black text-base" style={{ color: myCoopGroup.hex }}>
                                                        {myCoopGroup.emoji} {myCoopGroup.name} (第 {myCoopGroup.progress + 1} 題)
                                                    </span>
                                                    <span class="text-xs font-mono font-bold text-slate-400">
                                                        已答對 {myCoopGroup.progress} / {activeQuestion.coopData?.questions?.length || 5} 題
                                                    </span>
                                                </div>

                                                {/* Split Role display based on student index */}
                                                <div class="bg-gradient-to-r from-purple-50 to-indigo-50 p-4 rounded-2xl border border-purple-200 space-y-3">
                                                    <div class="text-xs font-bold text-purple-700 uppercase tracking-wider">
                                                        你的合作分工 (與組員面討論共同作答)：
                                                    </div>

                                                    {/* Member 1 sees Question Text */}
                                                    {myIndexInGroup === 0 && (
                                                        <div class="space-y-2">
                                                            <div class="text-xs bg-purple-200 text-purple-800 px-2.5 py-1 rounded-md font-bold inline-block">
                                                                組員一：負責讀題
                                                            </div>
                                                            <div class="text-lg font-black text-slate-800">
                                                                {activeQuestion.coopData.questions[myCoopGroup.progress]?.text}
                                                            </div>
                                                        </div>
                                                    )}

                                                    {/* Member 2 sees Options A & B */}
                                                    {myIndexInGroup === 1 && (
                                                        <div class="space-y-3">
                                                            <div class="text-xs bg-indigo-200 text-indigo-800 px-2.5 py-1 rounded-md font-bold inline-block">
                                                                組員二：負責選項 A 與 B
                                                            </div>
                                                            <div class="grid grid-cols-1 gap-2">
                                                                {activeQuestion.coopData.questions[myCoopGroup.progress]?.options.slice(0, 2).map((opt) => (
                                                                    <button 
                                                                        key={opt.letter}
                                                                        onClick={() => handleCoopSubmitChoice(opt.letter)}
                                                                        class="p-3.5 bg-white hover:bg-purple-50 border-2 border-purple-200 rounded-xl font-bold text-left text-slate-800 transition active:scale-95 shadow-sm"
                                                                    >
                                                                        <span class="font-black text-purple-600 mr-2">{opt.letter}.</span> {opt.text}
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}

                                                    {/* Member 3 sees Options C & D */}
                                                    {myIndexInGroup >= 2 && (
                                                        <div class="space-y-3">
                                                            <div class="text-xs bg-pink-200 text-pink-800 px-2.5 py-1 rounded-md font-bold inline-block">
                                                                組員三：負責選項 C 與 D
                                                            </div>
                                                            <div class="grid grid-cols-1 gap-2">
                                                                {activeQuestion.coopData.questions[myCoopGroup.progress]?.options.slice(2, 4).map((opt) => (
                                                                    <button 
                                                                        key={opt.letter}
                                                                        onClick={() => handleCoopSubmitChoice(opt.letter)}
                                                                        class="p-3.5 bg-white hover:bg-purple-50 border-2 border-purple-200 rounded-xl font-bold text-left text-slate-800 transition active:scale-95 shadow-sm"
                                                                    >
                                                                        <span class="font-black text-purple-600 mr-2">{opt.letter}.</span> {opt.text}
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        )}

                                        {/* Victory Screen */}
                                        {activeQuestion.winningGroup && (
                                            <div class="bg-amber-50 border-2 border-amber-300 p-6 rounded-3xl text-center space-y-4 animate-fade-in shadow-lg">
                                                <div class="text-5xl">🎉</div>
                                                <h3 class="text-2xl font-black text-amber-900">
                                                    勝出組別：{activeQuestion.winningGroup.emoji} {activeQuestion.winningGroup.name}
                                                </h3>
                                                <p class="text-xs font-bold text-amber-800">
                                                    勝出成員：{activeQuestion.winningGroup.members.map(m => `${m.seatNumber}號 ${m.name}`).join('、 ')}
                                                </p>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Regular Mode Question Display Card */}
                                {activeQuestion.mode !== 'COOP' && (
                                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-6">
                                        <div class="space-y-2 border-b pb-4">
                                            <span class="bg-indigo-100 text-indigo-700 text-xs font-extrabold px-3 py-1 rounded-full uppercase">
                                                {getModeLabel(activeQuestion.mode)}
                                            </span>
                                            <h2 class="text-xl font-black text-slate-800 leading-snug">{activeQuestion.text}</h2>
                                        </div>

                                        {/* Requirements 3 & 6: Choice & TF with Confirm Submit button */}
                                        {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                            <div class="space-y-4">
                                                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                    {activeQuestion.choiceOptions.map((opt) => (
                                                        <button 
                                                            key={opt}
                                                            disabled={!!myResponse}
                                                            onClick={() => setSelectedChoice(opt)}
                                                            class={`p-4 rounded-2xl font-bold text-left transition-all border-2 text-base flex items-center justify-between ${
                                                                selectedChoice === opt 
                                                                ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' 
                                                                : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                                                            }`}
                                                        >
                                                            <span>{opt}</span>
                                                            {selectedChoice === opt && <span>✓</span>}
                                                        </button>
                                                    ))}
                                                </div>

                                                {!myResponse && (
                                                    <button 
                                                        onClick={() => {
                                                            if (!selectedChoice) {
                                                                showToast("請先選擇一個選項！", "error");
                                                                return;
                                                            }
                                                            submitResponse(selectedChoice);
                                                        }}
                                                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl shadow-lg transition active:scale-98"
                                                    >
                                                        確認提交
                                                    </button>
                                                )}
                                            </div>
                                        )}

                                        {/* Requirements 3 & 6: Short Answer with Confirm Submit button */}
                                        {activeQuestion.mode === 'SHORT' && (
                                            <div class="space-y-4">
                                                <textarea 
                                                    rows={4}
                                                    disabled={!!myResponse}
                                                    placeholder="請在此輸入您的文字回答..."
                                                    value={shortAnswer}
                                                    onChange={(e) => setShortAnswer(e.target.value)}
                                                    class="w-full p-4 border-2 border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 font-medium text-slate-800"
                                                />
                                                {!myResponse && (
                                                    <button 
                                                        onClick={() => {
                                                            if (!shortAnswer.trim()) {
                                                                showToast("請輸入回答內容！", "error");
                                                                return;
                                                            }
                                                            submitResponse(shortAnswer.trim());
                                                        }}
                                                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl shadow-lg transition active:scale-98"
                                                    >
                                                        確認提交
                                                    </button>
                                                )}
                                            </div>
                                        )}

                                        {/* Requirements 1 & 27: Whiteboard Canvas with Confirm Submit button */}
                                        {activeQuestion.mode === 'DRAW' && (
                                            <div class="space-y-4">
                                                <WhiteboardCanvas 
                                                    bgImage={activeQuestion.whiteboardBg}
                                                    isLocked={!!myResponse}
                                                    initialData={myResponse?.answer}
                                                    onSave={(dataUrl) => submitResponse(dataUrl)}
                                                    showConfirmSubmit={!myResponse}
                                                />
                                            </div>
                                        )}

                                        {/* Requirement 18: Buzzer Mode */}
                                        {activeQuestion.mode === 'BUZZER' && (
                                            <div class="text-center py-6 space-y-4">
                                                {!myResponse ? (
                                                    <button 
                                                        onClick={() => submitResponse('搶答成功')}
                                                        class="w-48 h-48 bg-gradient-to-tr from-rose-600 to-red-500 text-white font-black text-3xl rounded-full shadow-2xl hover:scale-105 active:scale-95 transition flex items-center justify-center mx-auto border-4 border-white ring-4 ring-rose-200"
                                                    >
                                                        🚨 搶答！
                                                    </button>
                                                ) : (
                                                    <div class="text-emerald-600 font-black text-xl">
                                                        你已於 {myResponse.duration} 秒完成按鈕搶答！
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {/* Requirement 5: Audio Mode */}
                                        {activeQuestion.mode === 'AUDIO' && (
                                            <div class="space-y-4 text-center">
                                                {!myResponse ? (
                                                    <div class="space-y-4">
                                                        {!audioUrl ? (
                                                            <div class="space-y-3">
                                                                <button 
                                                                    onClick={isRecording ? stopRecording : startRecording}
                                                                    class={`w-32 h-32 rounded-full font-black text-white text-lg shadow-xl transition flex flex-col items-center justify-center mx-auto ${
                                                                        isRecording ? 'bg-rose-600 animate-pulse' : 'bg-cyan-600 hover:bg-cyan-700'
                                                                    }`}
                                                                >
                                                                    <span class="text-3xl">{isRecording ? '⏹️' : '🎤'}</span>
                                                                    <span>{isRecording ? `${10 - recordingTime}s 停止` : '開始錄音'}</span>
                                                                </button>
                                                                <p class="text-xs text-slate-400">最多錄製 10 秒</p>
                                                            </div>
                                                        ) : (
                                                            <div class="space-y-4 bg-cyan-50 p-5 rounded-2xl border border-cyan-200">
                                                                <audio src={audioUrl} controls class="w-full" />
                                                                <div class="flex space-x-3">
                                                                    <button 
                                                                        onClick={handleClearRecording}
                                                                        class="w-1/2 py-3 bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold rounded-xl text-sm"
                                                                    >
                                                                        🗑️ 刪除重錄
                                                                    </button>
                                                                    <button 
                                                                        onClick={() => {
                                                                            const reader = new FileReader();
                                                                            reader.onload = (evt) => submitResponse(evt.target.result);
                                                                            reader.readAsDataURL(audioBlob);
                                                                        }}
                                                                        class="w-1/2 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow"
                                                                    >
                                                                        ✅ 確認提交錄音
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                ) : (
                                                    <div class="space-y-2">
                                                        <audio src={myResponse.answer} controls class="w-full" />
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {/* Requirement 15 & 19 & 28: Challenge Mode */}
                                        {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                            <div class="space-y-6">
                                                {challengeRemainingSeconds !== null && !myResponse && (
                                                    <div class="bg-amber-100 border border-amber-300 p-3 rounded-2xl flex justify-between items-center text-amber-900 font-bold text-sm">
                                                        <span>⏱️ 答題剩餘時間：</span>
                                                        <span class="font-mono text-lg text-amber-700 font-black">
                                                            {Math.floor(challengeRemainingSeconds / 60)}:{(challengeRemainingSeconds % 60).toString().padStart(2, '0')}
                                                        </span>
                                                    </div>
                                                )}

                                                <div class="space-y-6">
                                                    {activeQuestion.challenge.questions.map((q, idx) => {
                                                        const studentSelected = challengeAnswers[q.num] || myResponse?.answer?.[q.num];
                                                        const isCorrect = studentSelected === q.answer;
                                                        const showReview = !!myResponse && challengeScoresAreReleased;

                                                        return (
                                                            <div key={q.num} class="bg-slate-50 p-4 rounded-2xl border space-y-3">
                                                                <div class="font-black text-slate-800 text-base">
                                                                    {q.num}. {q.text}
                                                                </div>

                                                                <div class="grid grid-cols-1 gap-2">
                                                                    {q.options.map((opt) => {
                                                                        let btnStyle = "bg-white text-slate-700 border-slate-200";

                                                                        if (!showReview) {
                                                                            if (studentSelected === opt.letter) {
                                                                                btnStyle = "bg-indigo-600 text-white border-indigo-600 font-bold";
                                                                            }
                                                                        } else {
                                                                            if (opt.letter === q.answer) {
                                                                                btnStyle = "bg-emerald-100 text-emerald-900 border-emerald-500 font-black ring-2 ring-emerald-400";
                                                                            } else if (studentSelected === opt.letter && !isCorrect) {
                                                                                btnStyle = "bg-rose-100 text-rose-900 border-rose-400 font-black line-through";
                                                                            }
                                                                        }

                                                                        return (
                                                                            <button 
                                                                                key={opt.letter}
                                                                                disabled={!!myResponse}
                                                                                onClick={() => setChallengeAnswers({ ...challengeAnswers, [q.num]: opt.letter })}
                                                                                class={`p-3 rounded-xl border-2 text-left text-sm transition flex items-center justify-between ${btnStyle}`}
                                                                            >
                                                                                <span><strong class="mr-2">{opt.letter}.</strong> {opt.text}</span>
                                                                                {showReview && opt.letter === q.answer && (
                                                                                    <span class="text-emerald-700 font-bold">正確答案</span>
                                                                                )}
                                                                            </button>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>

                                                {!myResponse && (
                                                    <button 
                                                        onClick={handleChallengeSubmit}
                                                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl shadow-lg transition active:scale-98"
                                                    >
                                                        ✅ 確認提交整份挑戰題考卷
                                                    </button>
                                                )}
                                            </div>
                                        )}

                                        {/* Requirement 4: Link Mode */}
                                        {activeQuestion.mode === 'LINK' && (
                                            <div class="space-y-4">
                                                {activeQuestion.youtubeEmbed ? (
                                                    <div class="aspect-16-9 w-full bg-black rounded-2xl overflow-hidden shadow-lg">
                                                        <iframe 
                                                            src={activeQuestion.youtubeEmbed} 
                                                            class="w-full h-full border-0" 
                                                            allow="autoplay; encrypted-media" 
                                                            allowFullScreen
                                                        />
                                                    </div>
                                                ) : (
                                                    <div class="p-4 bg-amber-50 border border-amber-200 rounded-2xl text-amber-900 font-mono text-sm break-all">
                                                        派送網頁：{activeQuestion.pushedUrl}
                                                    </div>
                                                )}

                                                {activeQuestion.pushedUrl && (
                                                    <a 
                                                        href={activeQuestion.pushedUrl} 
                                                        target="_blank" 
                                                        rel="noopener noreferrer"
                                                        class="block w-full text-center bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3.5 rounded-2xl shadow-md transition"
                                                    >
                                                        開啟連結網站 ↗
                                                    </a>
                                                )}
                                            </div>
                                        )}

                                        {/* Requirement 6: Standard Praise Feedback Banner upon Submission */}
                                        {myResponse && (
                                            <div class="bg-gradient-to-r from-emerald-50 to-teal-50 border-2 border-emerald-300 p-5 rounded-2xl text-center space-y-2 animate-fade-in">
                                                <div class="text-3xl">👏</div>
                                                <h4 class="font-black text-emerald-900 text-base">
                                                    已提交答案! 讚賞你的努力! 安靜等候老師指示...
                                                </h4>
                                                {myResponse.scoreDetails && challengeScoresAreReleased && (
                                                    <div class="text-sm font-black text-emerald-800 pt-2 border-t border-emerald-200">
                                                        你的得分：{myResponse.scoreDetails.totalScore} / {activeQuestion.challenge?.totalScore} 分 (正確率：{myResponse.scoreDetails.percentage}%)
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
