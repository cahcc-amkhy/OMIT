                                                                <div class="h-6 bg-slate-800 rounded-full overflow-hidden p-1 border border-slate-700">
                                                                    <div 
                                                                        class="h-full bg-gradient-to-r from-amber-400 to-yellow-500 rounded-full transition-all duration-500 relative overflow-hidden" 
                                                                        style={{ width: `${pct}%` }}
                                                                    >
                                                                        <div class="absolute inset-0 bg-white/30 animate-marquee"></div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Revision Item 18: Buzzer Mode locks 1st student */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="text-center py-8 space-y-4 bg-rose-50 rounded-3xl border border-rose-200">
                                        <h4 class="text-lg font-bold text-rose-900">搶答進行中...</h4>
                                        {buzzerWinner ? (
                                            <div class="space-y-3 animate-bounce">
                                                <div class="text-6xl">🏆</div>
                                                <div class="text-3xl font-black text-rose-600">
                                                    最快搶答：{buzzerWinner.seatNumber}號 {buzzerWinner.name}
                                                </div>
                                                <div class="text-sm font-mono text-slate-500">
                                                    精確搶答時間：{buzzerWinner.duration} 秒
                                                </div>
                                            </div>
                                        ) : (
                                            <div class="text-slate-400 font-bold">等待學生點擊搶答按鈕...</div>
                                        )}
                                    </div>
                                )}

                                {/* Revision Item 7, 31: Leaderboard with Gold, Silver, Bronze Enlarged */}
                                {activeQuestion.mode !== 'GROUP' && leaderboard.length > 0 && (
                                    <div class="border-t pt-6 space-y-4">
                                        <h4 class="font-black text-slate-800 text-base flex items-center gap-2">
                                            <span>🏆 答題龍虎榜 (最快答題者表揚)</span>
                                        </h4>
                                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            {leaderboard.slice(0, 3).map((res, idx) => (
                                                <div 
                                                    key={res.studentId}
                                                    class={`p-5 rounded-3xl border-2 flex items-center space-x-4 shadow-md ${
                                                        idx === 0 
                                                        ? 'bg-gradient-to-r from-amber-100 to-yellow-200 border-amber-400 scale-105' 
                                                        : idx === 1 
                                                        ? 'bg-gradient-to-r from-slate-100 to-slate-200 border-slate-400' 
                                                        : 'bg-gradient-to-r from-amber-50 to-orange-100 border-amber-300'
                                                    }`}
                                                >
                                                    <div class="text-4xl">{idx === 0 ? '🥇' : idx === 1 ? '🥈' : '🥉'}</div>
                                                    <div>
                                                        <div class="text-xs font-bold uppercase text-slate-500">第 {idx + 1} 名</div>
                                                        <div class="text-lg font-black text-slate-800">{res.seatNumber}號 - {res.name}</div>
                                                        <div class="text-xs font-mono font-bold text-slate-600">用時: {res.duration} 秒</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        {leaderboard.length > 3 && (
                                            <div class="flex flex-wrap gap-2 pt-2">
                                                {leaderboard.slice(3).map((res, idx) => (
                                                    <div key={res.studentId} class="px-3 py-1.5 bg-slate-100 border rounded-xl text-xs font-bold text-slate-700">
                                                        #{idx + 4} - {res.seatNumber}號 {res.name} ({res.duration}s)
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Teacher Demonstration Whiteboard Modal */}
                    {showTeacherDemoWhiteboard && (
                        <div class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-5xl w-full space-y-4 shadow-2xl">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="text-lg font-black text-slate-800">🖌️ 教師示範白板 (全螢幕模式)</h3>
                                    <button onClick={() => setShowTeacherDemoWhiteboard(false)} class="text-slate-400 text-2xl font-bold">✕</button>
                                </div>
                                <WhiteboardCanvas 
                                    isTeacherDemo={true}
                                    onCancel={() => setShowTeacherDemoWhiteboard(false)}
                                    onToggleBroadcast={handleToggleBroadcastDemoCanvas}
                                    isBroadcasting={isBroadcastingTeacherCanvas}
                                />
                            </div>
                        </div>
                    )}

                    {/* Revision Item 9: Student Picker Modal */}
                    {showRandomModal && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center space-y-6 shadow-2xl">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="text-lg font-black text-slate-800">🎲 抽選學生 (自訂學號範圍)</h3>
                                    <button onClick={() => setShowRandomModal(false)} class="text-slate-400 text-xl font-bold">✕</button>
                                </div>

                                <div class="flex items-center justify-center space-x-3 text-sm font-bold">
                                    <span>範圍：</span>
                                    <input 
                                        type="number" 
                                        value={rangeStart} 
                                        onChange={(e) => setRangeStart(e.target.value)}
                                        class="w-16 border rounded-xl text-center py-2"
                                    />
                                    <span>至</span>
                                    <input 
                                        type="number" 
                                        value={rangeEnd} 
                                        onChange={(e) => setRangeEnd(e.target.value)}
                                        class="w-16 border rounded-xl text-center py-2"
                                    />
                                    <span>號</span>
                                </div>

                                <div class="h-32 bg-indigo-50 border-2 border-indigo-200 rounded-3xl flex items-center justify-center">
                                    <div class="text-5xl font-black text-indigo-600 font-mono">
                                        {currentDrawn ? `${currentDrawn} 號` : '❓'}
                                    </div>
                                </div>

                                <button 
                                    onClick={() => {
                                        if (isSpinning) return;
                                        const start = parseInt(rangeStart) || 1;
                                        const end = parseInt(rangeEnd) || 36;
                                        const available = [];
                                        for (let i = start; i <= end; i++) {
                                            if (!drawnNumbers.includes(i)) available.push(i);
                                        }

                                        if (available.length === 0) {
                                            showToast("範圍內所有學號皆已被抽出！", "error");
                                            return;
                                        }

                                        setIsSpinning(true);
                                        let counter = 0;
                                        const timer = setInterval(() => {
                                            const temp = available[Math.floor(Math.random() * available.length)];
                                            setCurrentDrawn(temp);
                                            playSound('spin');
                                            counter++;

                                            if (counter >= 15) {
                                                clearInterval(timer);
                                                const finalPicked = available[Math.floor(Math.random() * available.length)];
                                                setCurrentDrawn(finalPicked);
                                                setDrawnNumbers(prev => [...prev, finalPicked]);
                                                setIsSpinning(false);
                                                playSound('win');
                                            }
                                        }, 100);
                                    }}
                                    disabled={isSpinning}
                                    class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-2xl shadow-lg active:scale-98"
                                >
                                    {isSpinning ? '抽籤中...' : '🎲 開始不重複抽籤'}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Revision Item 10: Enhanced Timer Modal */}
                    {showTimerModal && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center space-y-6 shadow-2xl">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="text-lg font-black text-slate-800">⏱️ 課堂計時器 (倒數響鬧)</h3>
                                    <button onClick={() => setShowTimerModal(false)} class="text-slate-400 text-xl font-bold">✕</button>
                                </div>

                                <div class="flex flex-wrap justify-center gap-2">
                                    {[30, 60, 120, 180, 240, 300].map(s => (
                                        <button 
                                            key={s} 
                                            onClick={() => { setTimerSeconds(s); setTimerActive(true); }}
                                            class="px-3 py-1.5 bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold rounded-xl text-xs"
                                        >
                                            {s < 60 ? `${s}秒` : `${s / 60}分鐘`}
                                        </button>
                                    ))}
                                </div>

                                <div class="flex items-center justify-center space-x-2 text-xs font-bold text-slate-700">
                                    <span>手動輸入 (00:00)：</span>
                                    <input 
                                        type="number" 
                                        value={customTimerMins} 
                                        onChange={(e) => setCustomTimerMins(parseInt(e.target.value) || 0)}
                                        class="w-12 border rounded text-center py-1" 
                                    />
                                    <span>分</span>
                                    <input 
                                        type="number" 
                                        value={customTimerSecs} 
                                        onChange={(e) => setCustomTimerSecs(parseInt(e.target.value) || 0)}
                                        class="w-12 border rounded text-center py-1" 
                                    />
                                    <span>秒</span>
                                    <button 
                                        onClick={() => { setTimerSeconds(customTimerMins * 60 + customTimerSecs); setTimerActive(true); }}
                                        class="px-3 py-1 bg-amber-600 text-white rounded-lg font-bold"
                                    >
                                        設定
                                    </button>
                                </div>

                                <div class="text-6xl font-black font-mono text-amber-600 bg-amber-50 p-6 rounded-3xl border border-amber-200">
                                    {Math.floor(timerSeconds / 60).toString().padStart(2, '0')}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                </div>

                                <div class="flex space-x-2">
                                    <button 
                                        onClick={() => setTimerActive(!timerActive)}
                                        class="w-1/2 py-3 bg-amber-500 text-white font-bold rounded-xl"
                                    >
                                        {timerActive ? '暫停' : '開始倒數'}
                                    </button>
                                    <button 
                                        onClick={() => { setTimerActive(false); setTimerSeconds(0); }}
                                        class="w-1/2 py-3 bg-slate-200 text-slate-700 font-bold rounded-xl"
                                    >
                                        重置
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* QR Code Modal */}
                    {showQRModal && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-md w-full text-center space-y-4 shadow-2xl">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="text-lg font-black text-slate-800">課堂加入 QR Code</h3>
                                    <button onClick={() => setShowQRModal(false)} class="text-slate-400 text-xl font-bold">✕</button>
                                </div>
                                <img src={qrImageUrl} class="mx-auto rounded-2xl border p-2 shadow-inner bg-white w-48 h-48" alt="QR" />
                                <div class="font-mono font-black text-2xl text-indigo-600">房號：{roomCode}</div>
                                <div class="text-xs font-bold text-slate-500 bg-slate-50 p-3 rounded-xl max-h-32 overflow-y-auto">
                                    <div>實時在線學生 ({studentsList.length}人)：</div>
                                    <div class="flex flex-wrap gap-1 mt-1 justify-center">
                                        {studentsList.map(s => <span key={s.id} class="bg-white px-2 py-0.5 rounded border">{s.seatNumber}號 {s.name}</span>)}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Student Interface Component
        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
            const [submitted, setSubmitted] = useState(false);
            const [shortAnswer, setShortAnswer] = useState('');
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [startTime, setStartTime] = useState(Date.now());
            const [timerLeft, setTimerLeft] = useState(null);

            const myResponseKey = activeQuestion ? `${activeQuestion.id}_${studentId}` : null;
            const myResponse = myResponseKey ? responses[myResponseKey] : null;

            useEffect(() => {
                setSubmitted(!!myResponse);
                setStartTime(Date.now());
            }, [activeQuestion?.id, myResponse]);

            // Timed challenge auto submit timer
            useEffect(() => {
                if (activeQuestion?.mode === 'CHALLENGE' && activeQuestion.challenge?.timeLimit && !submitted) {
                    setTimerLeft(activeQuestion.challenge.timeLimit);
                    const interval = setInterval(() => {
                        setTimerLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(interval);
                                handleAutoSubmitChallenge();
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                    return () => clearInterval(interval);
                }
            }, [activeQuestion?.id, submitted]);

            const submitAnswer = (ans) => {
                if (!activeQuestion) return;
                const duration = ((Date.now() - startTime) / 1000).toFixed(1);

                let scoreDetails = null;
                if (activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge) {
                    let correctCount = 0;
                    const qList = activeQuestion.challenge.questions;
                    qList.forEach(q => {
                        if (ans[q.num] === q.answer) correctCount++;
                    });
                    const pct = Math.round((correctCount / qList.length) * 100);
                    const totScore = Math.round((correctCount / qList.length) * activeQuestion.challenge.totalScore);
                    scoreDetails = { totalScore: totScore, percentage: pct, correctCount };
                }

                const resObj = {
                    studentId,
                    seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    questionId: activeQuestion.id,
                    answer: ans,
                    duration,
                    scoreDetails
                };

                const appId = "omit-8c173";
                const db = window.fbDb;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', myResponseKey);
                window.fbUtils.setDoc(resDocRef, resObj);

                setSubmitted(true);
                showToast("已成功提交答案！", "success");
            };

            const handleAutoSubmitChallenge = () => {
                if (!submitted) submitAnswer(challengeAnswers);
            };

            return (
                <div class="min-h-screen bg-slate-100 pb-12">
                    <header class="bg-indigo-600 text-white px-4 py-3 shadow-md flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <span class="font-black text-lg">OMIT 學生端</span>
                            <span class="text-xs bg-indigo-500 px-2 py-0.5 rounded font-mono font-bold">房號: {roomCode}</span>
                        </div>
                        <div class="text-xs font-bold bg-indigo-700 px-3 py-1 rounded-full">
                            {seatNumber} 號 - {studentName || '學生'}
                        </div>
                    </header>

                    <main class="max-w-2xl mx-auto p-4 space-y-6 mt-4">

                        {/* Broadcast teacher demo whiteboard */}
                        {activeQuestion?.teacherDemoCanvas && (
                            <div class="bg-white p-4 rounded-3xl shadow-lg border-2 border-purple-500 space-y-2">
                                <div class="font-bold text-purple-900 text-xs flex items-center gap-1.5">
                                    <span class="w-2.5 h-2.5 rounded-full bg-purple-600 animate-ping"></span>
                                    <span>📢 教師即時示範白板：</span>
                                </div>
                                <img src={activeQuestion.teacherDemoCanvas} class="w-full rounded-2xl border" alt="教師示範" />
                            </div>
                        )}

                        {!activeQuestion ? (
                            <div class="bg-white rounded-3xl p-8 text-center space-y-4 shadow-sm border border-slate-200">
                                <div class="text-5xl animate-bounce">⏳</div>
                                <h2 class="text-xl font-black text-slate-800">安靜等候老師指示...</h2>
                                <p class="text-xs text-slate-400">當老師發佈題目時，頁面將會自動更新。</p>
                            </div>
                        ) : submitted ? (
                            /* Revision Item 6: Uniform Praise Message */
                            <div class="bg-emerald-50 border border-emerald-200 rounded-3xl p-8 text-center space-y-4 shadow-sm">
                                <div class="text-6xl">🎉</div>
                                <h2 class="text-2xl font-black text-emerald-800">已提交答案! 讚賞你的努力!</h2>
                                <p class="text-sm font-bold text-emerald-600">安靜等候老師指示...</p>

                                {/* Revision Item 19: Challenge Review */}
                                {activeQuestion.mode === 'CHALLENGE' && (
                                    <div class="bg-white p-4 rounded-2xl border border-emerald-200 text-left space-y-3 pt-4">
                                        <div class="font-black text-slate-800 text-sm">整份考卷詳情對答案：</div>
                                        {activeQuestion.challenge?.scoresReleased ? (
                                            activeQuestion.challenge.questions.map((q) => {
                                                const myAns = myResponse?.answer?.[q.num];
                                                return (
                                                    <div key={q.num} class="p-3 rounded-xl border text-xs space-y-1 bg-slate-50">
                                                        <div class="font-bold text-slate-800">{q.num}. {q.text}</div>
                                                        <div class="grid grid-cols-2 gap-1 pl-2">
                                                            {q.options.map(opt => {
                                                                const isCorrect = opt.letter === q.answer;
                                                                const isSelected = opt.letter === myAns;

                                                                let bgClass = "bg-white text-slate-600 border";
                                                                if (isCorrect) bgClass = "bg-emerald-100 text-emerald-800 border-emerald-300 font-bold";
                                                                if (isSelected && !isCorrect) bgClass = "bg-red-100 text-red-800 border-red-300 font-bold";

                                                                return (
                                                                    <div key={opt.letter} class={`p-1.5 rounded-lg ${bgClass}`}>
                                                                        {opt.letter}. {opt.text} {isCorrect && " (正確答案)"} {isSelected && !isCorrect && " (你選此項)"}
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                );
                                            })
                                        ) : (
                                            <div class="text-xs text-slate-400 italic">成績與詳情解答待教師發放中...</div>
                                        )}
                                    </div>
                                )}
                            </div>
                        ) : (
                            /* Unsubmitted Active Question */
                            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-6">
                                <div class="border-b pb-3">
                                    <span class="text-xs font-black text-indigo-600 uppercase">【{getModeLabel(activeQuestion.mode)}】</span>
                                    <h2 class="text-xl font-black text-slate-800">{activeQuestion.text}</h2>
                                </div>

                                {/* Choice / TF */}
                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div class="space-y-4">
                                        <div class="grid grid-cols-1 gap-3">
                                            {activeQuestion.choiceOptions.map(opt => (
                                                <button 
                                                    key={opt}
                                                    onClick={() => submitAnswer(opt)}
                                                    class="p-4 rounded-2xl bg-slate-50 hover:bg-indigo-50 border-2 border-slate-200 hover:border-indigo-500 font-black text-left text-lg text-slate-800 transition active:scale-98 flex items-center justify-between"
                                                >
                                                    <span>{opt}</span>
                                                    <span class="text-xs font-bold text-indigo-600">確認提交 ➔</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Short Answer */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-4">
                                        <textarea 
                                            value={shortAnswer}
                                            onChange={(e) => setShortAnswer(e.target.value)}
                                            placeholder="請輸入文字回答..."
                                            class="w-full p-4 border rounded-2xl focus:ring-2 focus:ring-indigo-500 min-h-[120px] text-base"
                                        />
                                        <button 
                                            onClick={() => submitAnswer(shortAnswer)}
                                            class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-2xl shadow-lg active:scale-98"
                                        >
                                            ✅ 確認提交答案
                                        </button>
                                    </div>
                                )}

                                {/* Whiteboard */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <WhiteboardCanvas 
                                        bgImage={activeQuestion.whiteboardBg}
                                        onSave={(imgData) => submitAnswer(imgData)}
                                    />
                                )}

                                {/* Buzzer */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="text-center py-6">
                                        <button 
                                            onClick={() => submitAnswer('搶答成功！')}
                                            class="w-48 h-48 rounded-full bg-rose-500 hover:bg-rose-600 text-white font-black text-3xl shadow-2xl active:scale-90 animate-pulse border-8 border-rose-300"
                                        >
                                            🚨 搶答！
                                        </button>
                                    </div>
                                )}

                                {/* Audio */}
                                {activeQuestion.mode === 'AUDIO' && (
                                    <AudioRecorder onConfirmSubmit={(audioBase64) => submitAnswer(audioBase64)} />
                                )}

                                {/* Challenge */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                    <div class="space-y-6">
                                        {timerLeft !== null && (
                                            <div class="bg-amber-50 border border-amber-200 p-3 rounded-2xl text-center font-mono font-black text-amber-800 text-base">
                                                ⏱️ 倒數限時：{Math.floor(timerLeft / 60)}:{(timerLeft % 60).toString().padStart(2, '0')}
                                            </div>
                                        )}

                                        <div class="space-y-4">
                                            {activeQuestion.challenge.questions.map((q) => (
                                                <div key={q.num} class="p-4 bg-slate-50 rounded-2xl border space-y-2">
                                                    <div class="font-bold text-slate-800">{q.num}. {q.text}</div>
                                                    <div class="grid grid-cols-2 gap-2">
                                                        {q.options.map(opt => (
                                                            <button 
                                                                key={opt.letter}
                                                                onClick={() => setChallengeAnswers({ ...challengeAnswers, [q.num]: opt.letter })}
                                                                class={`p-2.5 rounded-xl border font-bold text-xs text-left transition ${
                                                                    challengeAnswers[q.num] === opt.letter ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-700'
                                                                }`}
                                                            >
                                                                {opt.letter}. {opt.text}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        <button 
                                            onClick={() => submitAnswer(challengeAnswers)}
                                            class="w-full py-4 bg-indigo-600 text-white font-black rounded-2xl shadow-lg active:scale-98"
                                        >
                                            ✅ 確認提交整份挑戰題
                                        </button>
                                    </div>
                                )}

                                {/* Link */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div class="space-y-4 text-center">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div class="aspect-16-9 w-full rounded-2xl overflow-hidden shadow">
                                                <iframe src={activeQuestion.youtubeEmbed} class="w-full h-full" allowFullScreen></iframe>
                                            </div>
                                        ) : null}
                                        <a 
                                            href={activeQuestion.pushedUrl} 
                                            target="_blank" 
                                            rel="noreferrer"
                                            class="inline-block px-8 py-4 bg-indigo-600 text-white font-black text-base rounded-2xl shadow-lg active:scale-95"
                                        >
                                            開啟連結網站 ↗
                                        </a>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
