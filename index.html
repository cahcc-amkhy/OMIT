            );
        }

        // --- Student Interface Component ---
        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, coopState, teacherWhiteboardBroadcast, showToast, onExit }) {
            const [myAnswer, setMyAnswer] = useState('');
            const [submitted, setSubmitted] = useState(false);
            const [submitTime, setSubmitTime] = useState(null);
            
            // Audio recorder state
            const [isRecording, setIsRecording] = useState(false);
            const [audioBlob, setAudioBlob] = useState(null);
            const [audioUrl, setAudioUrl] = useState(null);
            const [recordingTime, setRecordingTime] = useState(0);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            // Challenge answers map: { qIndex: choiceLetter }
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [challengeRemaining, setChallengeRemaining] = useState(0);

            const myResKey = activeQuestion ? `${activeQuestion.id}_${studentId}` : null;
            const existingRes = myResKey ? responses[myResKey] : null;

            // Find my group for Cooperative mode
            const myCoopGroup = useMemo(() => {
                if (!coopState || !coopState.groups) return null;
                return coopState.groups.find(g => g.members.some(m => m.id === studentId));
            }, [coopState, studentId]);

            // Sync submitted state with response records
            useEffect(() => {
                if (existingRes) {
                    setSubmitted(true);
                    setMyAnswer(existingRes.answer);
                } else {
                    setSubmitted(false);
                    setMyAnswer('');
                    setAudioBlob(null);
                    setAudioUrl(null);
                }
            }, [activeQuestion, existingRes]);

            // Audio recording timer limit 10s
            useEffect(() => {
                let timer = null;
                if (isRecording) {
                    timer = setInterval(() => {
                        setRecordingTime(t => {
                            if (t >= 9) {
                                stopAudioRecording();
                                return 10;
                            }
                            return t + 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [isRecording]);

            // Challenge Timer Auto-Submit Logic
            useEffect(() => {
                let interval = null;
                if (activeQuestion?.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer && !submitted) {
                    const elapsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                    const remaining = Math.max(0, activeQuestion.challenge.timeLimit - elapsed);
                    setChallengeRemaining(remaining);

                    if (remaining <= 0) {
                        handleChallengeAutoSubmit();
                    } else {
                        interval = setInterval(() => {
                            setChallengeRemaining(rem => {
                                if (rem <= 1) {
                                    clearInterval(interval);
                                    handleChallengeAutoSubmit();
                                    return 0;
                                }
                                return rem - 1;
                            });
                        }, 1000);
                    }
                }
                return () => clearInterval(interval);
            }, [activeQuestion, submitted]);

            // Submit response payload to Firestore
            const submitResponsePayload = async (ansValue, scoreObj = null) => {
                if (!activeQuestion) return;

                const durationSec = ((Date.now() - activeQuestion.startTime) / 1000).toFixed(1);
                const appId = "omit-8c173";
                const db = window.fbDb;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', `${activeQuestion.id}_${studentId}`);

                const payload = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: ansValue,
                    duration: durationSec,
                    timestamp: Date.now(),
                    scoreDetails: scoreObj
                };

                // Buzzer Mode: Lock globally on 1st responder only!
                if (activeQuestion.mode === 'BUZZER') {
                    const snap = await window.fbUtils.getDoc(resDocRef);
                    if (snap.exists()) return; // Already locked
                }

                await window.fbUtils.setDoc(resDocRef, payload);
                setSubmitted(true);
                setSubmitTime(durationSec);
                showToast("已成功提交答案！讚賞你的努力！", "success");
            };

            // Start Audio Recording
            const startAudioRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        setAudioBlob(blob);
                        setAudioUrl(URL.createObjectURL(blob));
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                    setRecordingTime(0);
                } catch (err) {
                    console.error("Audio record error:", err);
                    showToast("無法存取麥克風設備！", "error");
                }
            };

            const stopAudioRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const handleConfirmAudioSubmit = () => {
                if (!audioBlob) return;
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64Audio = reader.result;
                    submitResponsePayload(base64Audio);
                };
                reader.readAsDataURL(audioBlob);
            };

            // Challenge Manual & Auto Submit Logic
            const handleChallengeSubmit = () => {
                if (!activeQuestion || !activeQuestion.challenge) return;
                const qList = activeQuestion.challenge.questions;
                let correctCount = 0;

                qList.forEach((q, idx) => {
                    if (challengeAnswers[idx] === q.answer) correctCount++;
                });

                const totalQs = qList.length;
                const scorePerQ = activeQuestion.challenge.totalScore / totalQs;
                const totalScore = Math.round(correctCount * scorePerQ);
                const pct = Math.round((correctCount / totalQs) * 100);

                const scoreObj = {
                    correctCount,
                    totalQuestions: totalQs,
                    totalScore,
                    percentage: pct,
                    answersMap: challengeAnswers
                };

                submitResponsePayload(challengeAnswers, scoreObj);
            };

            const handleChallengeAutoSubmit = () => {
                if (submitted) return;
                handleChallengeSubmit();
                showToast("時間到了！系統已為您自動收卷提交。", "info");
            };

            // Cooperative Mode Option Selection
            const handleCoopAnswerSelect = async (optLetter) => {
                if (!coopState || !myCoopGroup || coopState.phase !== 'MATCH') return;

                const currentQ = coopState.questions[myCoopGroup.currentQIndex];
                const isCorrect = currentQ.answer === optLetter;

                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                const updatedGroups = coopState.groups.map(g => {
                    if (g.id === myCoopGroup.id) {
                        let nextIdx = isCorrect ? g.currentQIndex + 1 : 0; // Wrong resets to 0!
                        let finished = nextIdx >= coopState.questions.length;
                        return {
                            ...g,
                            currentQIndex: nextIdx,
                            isFinished: finished
                        };
                    }
                    return g;
                });

                let winner = coopState.winnerGroup;
                if (!winner) {
                    const winGrp = updatedGroups.find(g => g.isFinished);
                    if (winGrp) winner = winGrp;
                }

                const updatedCoopState = {
                    ...coopState,
                    groups: updatedGroups,
                    winnerGroup: winner
                };

                await window.fbUtils.setDoc(roomDocRef, { coopState: updatedCoopState }, { merge: true });

                if (isCorrect) playSound('win');
                else playSound('buzzer');
            };

            return (
                <div class="min-h-screen bg-slate-100 pb-12">
                    {/* Student Top Header */}
                    <header class="bg-indigo-700 text-white p-4 shadow-md sticky top-0 z-30">
                        <div class="max-w-3xl mx-auto flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <span class="bg-white text-indigo-800 font-black px-2.5 py-1 rounded-xl text-sm">OMIT</span>
                                <span class="font-extrabold text-sm md:text-base">宣道會陳元喜小學</span>
                            </div>
                            <div class="flex items-center space-x-2 text-xs font-bold bg-indigo-800/80 px-3 py-1.5 rounded-xl border border-indigo-500">
                                <span>學號：{seatNumber} 號</span>
                                {studentName && <span>({studentName})</span>}
                            </div>
                        </div>
                    </header>

                    {/* Teacher Demonstration Whiteboard Broadcast Overlay */}
                    {teacherWhiteboardBroadcast && (
                        <div class="max-w-3xl mx-auto p-4 animate-fade-in">
                            <div class="bg-purple-900 text-white p-4 rounded-3xl shadow-xl space-y-3 border-2 border-purple-400">
                                <div class="flex items-center justify-between">
                                    <span class="font-black text-sm flex items-center gap-1.5">
                                        <span class="w-2.5 h-2.5 rounded-full bg-purple-400 animate-ping"></span>
                                        📡 教師畫面即時示範白板
                                    </span>
                                </div>
                                <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden border">
                                    <img src={teacherWhiteboardBroadcast} class="w-full h-full object-contain" alt="示範白板" />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Main Student Answer Card */}
                    <main class="max-w-3xl mx-auto p-4 md:p-6 space-y-6">

                        {/* Cooperative Mode Student View ("合作題") */}
                        {coopState && (
                            <div class="bg-white rounded-3xl p-6 shadow-xl border-2 border-emerald-300 space-y-6">
                                <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl flex items-center justify-between">
                                    <div class="flex items-center space-x-2">
                                        <span class="text-2xl">{myCoopGroup ? myCoopGroup.emoji : '🤝'}</span>
                                        <div>
                                            <span class="text-xs font-bold text-emerald-600 block">我的合作組別</span>
                                            <span class="font-black text-emerald-950 text-lg">{myCoopGroup ? myCoopGroup.name : '等待分組...'}</span>
                                        </div>
                                    </div>
                                    <span class="text-xs font-bold bg-emerald-200 text-emerald-900 px-3 py-1 rounded-full">
                                        {coopState.phase === 'GROUPING' ? '準備會合' : '比賽進行中'}
                                    </span>
                                </div>

                                {coopState.phase === 'GROUPING' && (
                                    <div class="text-center py-8 space-y-3">
                                        <div class="text-5xl animate-bounce">📢</div>
                                        <h3 class="text-xl font-black text-slate-800">盡快與你的組員會合！比賽即將開始！</h3>
                                        <p class="text-xs text-slate-400">組員名單：{myCoopGroup?.members.map(m => m.name).join('、')}</p>
                                    </div>
                                )}

                                {coopState.phase === 'MATCH' && myCoopGroup && !coopState.winnerGroup && (
                                    <div class="space-y-6">
                                        {(() => {
                                            const qIndex = myCoopGroup.currentQIndex;
                                            const currentQ = coopState.questions[qIndex];
                                            const myMemberIdx = myCoopGroup.members.findIndex(m => m.id === studentId);
                                            const totalMembers = myCoopGroup.members.length || 1;

                                            // Element distribution logic!
                                            // Member 0 gets question text; Member 1 gets Options A & B; Member 2 gets Options C & D.
                                            const showText = (myMemberIdx % totalMembers) === 0;
                                            const showOptsAB = (myMemberIdx % totalMembers) === 1 || totalMembers === 1;
                                            const showOptsCD = (myMemberIdx % totalMembers) === 2 || totalMembers === 1;

                                            return (
                                                <div class="space-y-6">
                                                    <div class="flex justify-between items-center border-b pb-2">
                                                        <span class="font-mono text-xs font-bold text-slate-400">
                                                            第 {qIndex + 1} / {coopState.questions.length} 題
                                                        </span>
                                                        <span class="text-xs font-bold text-purple-600 bg-purple-50 px-2.5 py-1 rounded-lg">
                                                            🤝 分工合作中 (與組員互相查看螢幕)
                                                        </span>
                                                    </div>

                                                    {showText ? (
                                                        <div class="bg-indigo-50 border-2 border-indigo-200 p-6 rounded-2xl text-center space-y-2">
                                                            <span class="text-xs font-bold text-indigo-600 uppercase">你是【題目保管員】</span>
                                                            <h3 class="text-xl font-black text-indigo-950">{currentQ.text}</h3>
                                                            <p class="text-xs text-slate-500">大聲向組員讀出題目，讓組員選擇答案！</p>
                                                        </div>
                                                    ) : (
                                                        <div class="bg-slate-50 p-4 rounded-2xl text-center text-xs text-slate-400 font-bold border">
                                                            題目在組員【{myCoopGroup.members[0]?.name}】的螢幕上，請聆聽題目！
                                                        </div>
                                                    )}

                                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                        {showOptsAB && currentQ.options.slice(0, 2).map(opt => (
                                                            <button 
                                                                key={opt.letter}
                                                                onClick={() => handleCoopAnswerSelect(opt.letter)}
                                                                class="p-4 bg-white border-2 border-slate-200 hover:border-emerald-500 rounded-2xl font-bold text-slate-800 text-left transition shadow-sm active:scale-95"
                                                            >
                                                                <span class="font-black text-emerald-600 mr-2">{opt.letter}.</span>
                                                                <span>{opt.text}</span>
                                                            </button>
                                                        ))}

                                                        {showOptsCD && currentQ.options.slice(2, 4).map(opt => (
                                                            <button 
                                                                key={opt.letter}
                                                                onClick={() => handleCoopAnswerSelect(opt.letter)}
                                                                class="p-4 bg-white border-2 border-slate-200 hover:border-emerald-500 rounded-2xl font-bold text-slate-800 text-left transition shadow-sm active:scale-95"
                                                            >
                                                                <span class="font-black text-emerald-600 mr-2">{opt.letter}.</span>
                                                                <span>{opt.text}</span>
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                            );
                                        })()}
                                    </div>
                                )}

                                {coopState.winnerGroup && (
                                    <div class="text-center py-8 space-y-4 bg-amber-50 rounded-3xl border-2 border-amber-300">
                                        <div class="text-6xl animate-bounce">🏆</div>
                                        <h3 class="text-2xl font-black text-amber-900">
                                            【{coopState.winnerGroup.emoji} {coopState.winnerGroup.name}】成功奪冠！
                                        </h3>
                                        <p class="text-xs text-amber-800 font-bold">
                                            勝利組員：{coopState.winnerGroup.members.map(m => m.name).join('、')}
                                        </p>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Broadcasted Student Whiteboard */}
                        {!coopState && activeQuestion?.broadcastedSubmission && (
                            <div class="bg-purple-900 text-white p-5 rounded-3xl shadow-xl space-y-3 border-2 border-purple-400">
                                <div class="flex items-center justify-between">
                                    <span class="font-black text-sm flex items-center gap-1.5">
                                        <span class="w-2.5 h-2.5 rounded-full bg-purple-400 animate-ping"></span>
                                        📢 全班作品廣播互評：{activeQuestion.broadcastedSubmission.name} 的白板作品
                                    </span>
                                </div>
                                <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden border">
                                    <img src={activeQuestion.broadcastedSubmission.answer} class="w-full h-full object-contain" alt="廣播作品" />
                                </div>
                            </div>
                        )}

                        {/* Standard Question Card */}
                        {!coopState && activeQuestion && (
                            <div class="bg-white rounded-3xl p-6 shadow-xl border border-slate-200 space-y-6">
                                <div class="border-b pb-4">
                                    <span class="text-xs font-black text-indigo-600 uppercase tracking-wider block mb-1">
                                        【{getModeLabel(activeQuestion.mode)}】
                                    </span>
                                    <h2 class="text-xl md:text-2xl font-black text-slate-800 leading-snug">
                                        {activeQuestion.text}
                                    </h2>
                                </div>

                                {/* Choice / TF Mode */}
                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div class="space-y-4">
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            {activeQuestion.choiceOptions.map((opt) => (
                                                <button 
                                                    key={opt}
                                                    onClick={() => !submitted && setMyAnswer(opt)}
                                                    disabled={submitted}
                                                    class={`p-4 rounded-2xl font-black text-lg border-2 text-left transition flex items-center justify-between ${
                                                        myAnswer === opt 
                                                        ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg' 
                                                        : 'bg-slate-50 text-slate-800 border-slate-200 hover:border-slate-300'
                                                    }`}
                                                >
                                                    <span>{opt}</span>
                                                    {myAnswer === opt && <span>✓</span>}
                                                </button>
                                            ))}
                                        </div>

                                        {!submitted && (
                                            <button 
                                                onClick={() => myAnswer && submitResponsePayload(myAnswer)}
                                                disabled={!myAnswer}
                                                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-lg transition disabled:opacity-50 text-base"
                                            >
                                                確認提交 🚀
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Short Answer Mode */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-4">
                                        <textarea 
                                            rows={4}
                                            placeholder="請在此輸入您的回答..."
                                            value={myAnswer}
                                            onChange={(e) => setMyAnswer(e.target.value)}
                                            disabled={submitted}
                                            class="w-full p-4 border-2 rounded-2xl focus:ring-2 focus:ring-indigo-500 font-medium text-slate-800"
                                        />
                                        {!submitted && (
                                            <button 
                                                onClick={() => myAnswer.trim() && submitResponsePayload(myAnswer.trim())}
                                                disabled={!myAnswer.trim()}
                                                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-lg transition disabled:opacity-50 text-base"
                                            >
                                                確認提交 🚀
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Draw Whiteboard Mode */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <div>
                                        {!submitted ? (
                                            <WhiteboardCanvas 
                                                initialBg={activeQuestion.whiteboardBg} 
                                                onConfirm={(dataUrl) => submitResponsePayload(dataUrl)}
                                            />
                                        ) : (
                                            <div class="space-y-3 text-center">
                                                <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden border-2 border-slate-200">
                                                    <img src={myAnswer} class="w-full h-full object-contain" alt="已提交白板" />
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Buzzer Mode */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="text-center py-8 space-y-6">
                                        {!submitted ? (
                                            <button 
                                                onClick={() => submitResponsePayload('搶答成功！')}
                                                class="w-48 h-48 rounded-full bg-gradient-to-tr from-rose-600 to-red-500 hover:from-rose-500 hover:to-red-400 text-white font-black text-3xl shadow-2xl active:scale-95 transition-all border-8 border-rose-200 mx-auto block animate-pulse"
                                            >
                                                按我搶答！
                                            </button>
                                        ) : (
                                            <div class="text-2xl font-black text-rose-600 animate-bounce">
                                                ⚡ 已點擊按鈕！等候老師公佈最快者...
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Audio Recording Mode */}
                                {activeQuestion.mode === 'AUDIO' && (
                                    <div class="space-y-4 text-center">
                                        {!submitted ? (
                                            <div class="space-y-4 bg-cyan-50/60 p-6 rounded-3xl border border-cyan-200">
                                                {!audioUrl ? (
                                                    <div class="space-y-3">
                                                        <button 
                                                            onClick={isRecording ? stopAudioRecording : startAudioRecording}
                                                            class={`px-8 py-4 rounded-2xl font-black text-lg shadow-lg transition active:scale-98 ${
                                                                isRecording ? 'bg-rose-600 text-white animate-pulse' : 'bg-cyan-600 text-white'
                                                            }`}
                                                        >
                                                            {isRecording ? `🛑 停止錄音 (${recordingTime}s / 10s)` : '🎤 開始錄音 (最多10秒)'}
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <div class="space-y-4">
                                                        <audio src={audioUrl} controls class="w-full rounded-xl mx-auto" />
                                                        <div class="flex justify-center space-x-3">
                                                            <button 
                                                                onClick={() => { setAudioBlob(null); setAudioUrl(null); }}
                                                                class="px-5 py-3 rounded-xl bg-slate-200 text-slate-700 font-bold text-sm"
                                                            >
                                                                🗑️ 刪除重錄
                                                            </button>
                                                            <button 
                                                                onClick={handleConfirmAudioSubmit}
                                                                class="px-6 py-3 rounded-xl bg-cyan-600 hover:bg-cyan-700 text-white font-black text-sm shadow-md"
                                                            >
                                                                ✅ 確認提交錄音
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        ) : (
                                            <div class="space-y-2">
                                                <audio src={myAnswer} controls class="w-full rounded-xl mx-auto" />
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Challenge Question Mode */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                    <div class="space-y-6">
                                        {activeQuestion.challenge.enableTimer && !submitted && (
                                            <div class="bg-amber-100 border border-amber-300 p-3 rounded-2xl flex items-center justify-between text-amber-900 font-mono font-bold">
                                                <span>⏱️ 倒數計時：</span>
                                                <span class="text-xl text-rose-600">
                                                    {Math.floor(challengeRemaining / 60).toString().padStart(2, '0')}:{(challengeRemaining % 60).toString().padStart(2, '0')}
                                                </span>
                                            </div>
                                        )}

                                        {!submitted ? (
                                            <div class="space-y-6">
                                                {activeQuestion.challenge.questions.map((q, qIdx) => (
                                                    <div key={qIdx} class="p-4 bg-slate-50 rounded-2xl border space-y-3">
                                                        <div class="font-bold text-slate-800 text-base">
                                                            {q.num || qIdx + 1}. {q.text}
                                                        </div>
                                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                            {q.options.map(opt => (
                                                                <button 
                                                                    key={opt.letter}
                                                                    onClick={() => setChallengeAnswers({ ...challengeAnswers, [qIdx]: opt.letter })}
                                                                    class={`p-3 rounded-xl border text-left font-bold text-sm transition ${
                                                                        challengeAnswers[qIdx] === opt.letter 
                                                                        ? 'bg-amber-600 text-white border-amber-600 shadow-md' 
                                                                        : 'bg-white text-slate-700 border-slate-200'
                                                                    }`}
                                                                >
                                                                    <span class="mr-2">{opt.letter}.</span>
                                                                    <span>{opt.text}</span>
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}

                                                <button 
                                                    onClick={handleChallengeSubmit}
                                                    class="w-full bg-amber-600 hover:bg-amber-700 text-white font-black py-4 rounded-2xl shadow-xl text-lg transition"
                                                >
                                                    ✅ 確認提交整份評估
                                                </button>
                                            </div>
                                        ) : (
                                            <div class="space-y-6">
                                                {activeQuestion.challenge.scoresReleased ? (
                                                    <div class="space-y-6">
                                                        <div class="bg-emerald-50 border border-emerald-200 p-6 rounded-3xl text-center space-y-2">
                                                            <div class="text-xs font-bold text-emerald-600">你的評估得分</div>
                                                            <div class="text-4xl font-black text-emerald-700">
                                                                {existingRes?.scoreDetails?.totalScore} / {activeQuestion.challenge.totalScore} 分
                                                            </div>
                                                            <div class="text-xs text-slate-500 font-bold">正確率：{existingRes?.scoreDetails?.percentage}%</div>
                                                        </div>

                                                        {/* Full Test Review */}
                                                        <div class="space-y-4">
                                                            <h4 class="font-black text-slate-800">考卷細項解析：</h4>
                                                            {activeQuestion.challenge.questions.map((q, qIdx) => {
                                                                const userAns = existingRes?.scoreDetails?.answersMap?.[qIdx];
                                                                const isCorrect = userAns === q.answer;

                                                                return (
                                                                    <div key={qIdx} class={`p-4 rounded-2xl border-2 space-y-2 ${isCorrect ? 'bg-emerald-50/50 border-emerald-300' : 'bg-rose-50/50 border-rose-300'}`}>
                                                                        <div class="font-bold text-slate-800 text-sm flex justify-between">
                                                                            <span>{q.num || qIdx + 1}. {q.text}</span>
                                                                            <span class={isCorrect ? 'text-emerald-700 font-black' : 'text-rose-600 font-black'}>
                                                                                {isCorrect ? '✓ 答對' : '✗ 答錯'}
                                                                            </span>
                                                                        </div>

                                                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">
                                                                            {q.options.map(opt => {
                                                                                const isRightOpt = opt.letter === q.answer;
                                                                                const isUserSelected = opt.letter === userAns;

                                                                                let optStyle = "bg-white text-slate-600 border-slate-200";
                                                                                if (isRightOpt) optStyle = "bg-emerald-600 text-white font-black border-emerald-600";
                                                                                else if (isUserSelected && !isRightOpt) optStyle = "bg-rose-600 text-white font-black border-rose-600";

                                                                                return (
                                                                                    <div key={opt.letter} class={`p-2.5 rounded-xl border ${optStyle}`}>
                                                                                        <span>{opt.letter}. {opt.text}</span>
                                                                                        {isRightOpt && <span class="ml-2 font-black">(正確答案)</span>}
                                                                                        {isUserSelected && !isRightOpt && <span class="ml-2 font-black">(你的選擇)</span>}
                                                                                    </div>
                                                                                );
                                                                            })}
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div class="text-center py-8 space-y-2 bg-amber-50 rounded-3xl border">
                                                        <div class="text-3xl">⏳</div>
                                                        <div class="font-black text-amber-900 text-lg">考卷已成功提交！</div>
                                                        <div class="text-xs text-amber-700">等待老師發佈成績後，即可查看個人得分與詳細解析。</div>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Pushed URL / YouTube Link Mode */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div class="space-y-4">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div class="aspect-16-9 w-full rounded-2xl overflow-hidden shadow-lg border">
                                                <iframe 
                                                    src={activeQuestion.youtubeEmbed} 
                                                    class="w-full h-full" 
                                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                                    allowFullScreen
                                                ></iframe>
                                            </div>
                                        ) : (
                                            <div class="bg-slate-50 p-6 rounded-2xl border text-center space-y-3">
                                                <p class="text-sm font-bold text-slate-700">{activeQuestion.pushedUrl}</p>
                                            </div>
                                        )}

                                        {activeQuestion.pushedUrl && (
                                            <a 
                                                href={activeQuestion.pushedUrl} 
                                                target="_blank" 
                                                rel="noopener noreferrer"
                                                class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-2xl shadow-lg flex items-center justify-center space-x-2 text-base block text-center"
                                            >
                                                <span>開啟連結網站 ↗</span>
                                            </a>
                                        )}
                                    </div>
                                )}

                                {/* Standard Submission Praise Feedback */}
                                {submitted && activeQuestion.mode !== 'CHALLENGE' && (
                                    <div class="bg-emerald-50 border-2 border-emerald-300 p-5 rounded-2xl text-center space-y-1 animate-fade-in">
                                        <div class="text-lg font-black text-emerald-800">
                                            已提交答案! 讚賞你的努力! 安靜等候老師指示...
                                        </div>
                                        {submitTime && (
                                            <div class="text-xs font-mono text-emerald-600">
                                                作答用時：{submitTime} 秒
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Waiting Screen when no active question */}
                        {!coopState && !activeQuestion && (
                            <div class="bg-white rounded-3xl p-12 text-center space-y-4 shadow-sm border border-slate-200">
                                <div class="text-6xl animate-pulse">🎓</div>
                                <h3 class="text-2xl font-black text-slate-800">已進入【宣道會陳元喜小學 OMIT互動課堂】</h3>
                                <p class="text-slate-400 text-sm font-medium">安靜等候老師發佈互動題目...</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        // Render Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
