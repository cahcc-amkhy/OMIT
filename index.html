                                                                        <div class="font-black text-lg text-slate-800">{qObj.text}</div>
                                                                        <div class="text-xs text-slate-400">答案選項已派送至組員二及組員三螢幕上</div>
                                                                    </div>
                                                                );
                                                            } else if (myCoopMemberIndex === 1) {
                                                                return (
                                                                    <div class="space-y-3">
                                                                        <div class="text-xs font-bold text-center text-teal-700">你的任務：與組員討論，選擇選項 A 或 B</div>
                                                                        <div class="grid grid-cols-1 gap-2">
                                                                            {qObj.options.slice(0, 2).map((opt) => (
                                                                                <button 
                                                                                    key={opt.letter}
                                                                                    onClick={() => handleCoopOptionClick(opt.letter)}
                                                                                    class="p-4 bg-white hover:bg-teal-100 text-slate-800 font-extrabold rounded-2xl border-2 border-teal-300 shadow transition text-left"
                                                                                >
                                                                                    {opt.letter}. {opt.text}
                                                                                </button>
                                                                            ))}
                                                                        </div>
                                                                    </div>
                                                                );
                                                            } else {
                                                                return (
                                                                    <div class="space-y-3">
                                                                        <div class="text-xs font-bold text-center text-teal-700">你的任務：與組員討論，選擇選項 C 或 D</div>
                                                                        <div class="grid grid-cols-1 gap-2">
                                                                            {qObj.options.slice(2, 4).map((opt) => (
                                                                                <button 
                                                                                    key={opt.letter}
                                                                                    onClick={() => handleCoopOptionClick(opt.letter)}
                                                                                    class="p-4 bg-white hover:bg-teal-100 text-slate-800 font-extrabold rounded-2xl border-2 border-teal-300 shadow transition text-left"
                                                                                >
                                                                                    {opt.letter}. {opt.text}
                                                                                </button>
                                                                            ))}
                                                                        </div>
                                                                    </div>
                                                                );
                                                            }
                                                        })()}
                                                    </div>
                                                ) : (
                                                    <div class="text-center py-6 text-slate-400 font-bold">等候老師按下「開始比賽」...</div>
                                                )}
                                            </div>
                                        ) : (
                                            <div class="text-center py-8 text-slate-400 font-bold">請等候老師進行分組...</div>
                                        )}
                                    </div>
                                )}

                                {/* Choice / TF Student Inputs */}
                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div class="space-y-4">
                                        <div class="grid grid-cols-2 gap-3">
                                            {activeQuestion.choiceOptions.map((opt) => (
                                                <button 
                                                    key={opt}
                                                    disabled={hasSubmitted && activeQuestion.lockAfterSubmit}
                                                    onClick={() => setSelectedOption(opt)}
                                                    class={`p-5 rounded-2xl font-extrabold text-lg border-2 transition shadow-sm ${
                                                        selectedOption === opt 
                                                        ? 'bg-indigo-600 text-white border-indigo-600 ring-4 ring-indigo-200' 
                                                        : 'bg-slate-50 text-slate-800 border-slate-200 hover:bg-slate-100'
                                                    }`}
                                                >
                                                    {opt}
                                                </button>
                                            ))}
                                        </div>

                                        {/* Item 3: Independent Confirm Button */}
                                        {selectedOption && (!hasSubmitted || !activeQuestion.lockAfterSubmit) && (
                                            <button 
                                                onClick={() => submitAnswer(selectedOption)}
                                                class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold rounded-2xl shadow-lg transition active:scale-98 text-base"
                                            >
                                                ✅ 確認提交
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Short Answer Input */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-4">
                                        <textarea 
                                            rows={4}
                                            disabled={hasSubmitted && activeQuestion.lockAfterSubmit}
                                            placeholder="請在此輸入您的回答..."
                                            value={textAnswer}
                                            onChange={(e) => setTextAnswer(e.target.value)}
                                            class="w-full p-4 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 font-medium text-slate-800 bg-slate-50 text-base"
                                        />
                                        {textAnswer.trim() && (!hasSubmitted || !activeQuestion.lockAfterSubmit) && (
                                            <button 
                                                onClick={() => submitAnswer(textAnswer.trim())}
                                                class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold rounded-2xl shadow-lg transition active:scale-98 text-base"
                                            >
                                                ✅ 確認提交
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Item 1: Whiteboard Canvas Mode for Student */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <div class="space-y-4">
                                        {hasSubmitted ? (
                                            <div class="text-center py-4 bg-emerald-50 border border-emerald-200 rounded-2xl space-y-2">
                                                <div class="font-extrabold text-emerald-800 text-base">✅ 白板作品已提交！</div>
                                                <div class="text-xs text-emerald-600 font-bold">預設不能再修改作品</div>
                                            </div>
                                        ) : (
                                            <WhiteboardCanvas 
                                                bgImage={activeQuestion.whiteboardBg}
                                                onSubmit={(canvasData) => submitAnswer(canvasData)}
                                            />
                                        )}
                                    </div>
                                )}

                                {/* Item 18: Buzzer Mode Locking to First Click Only */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="text-center py-8 space-y-4">
                                        <button 
                                            disabled={hasSubmitted}
                                            onClick={() => submitAnswer('搶答！')}
                                            class={`w-48 h-48 rounded-full font-black text-2xl text-white shadow-2xl transition active:scale-90 border-8 border-white ${
                                                hasSubmitted ? 'bg-slate-400 cursor-not-allowed' : 'bg-rose-600 hover:bg-rose-700 animate-pulse'
                                            }`}
                                        >
                                            {hasSubmitted ? '已搶答！' : '🚨 按此搶答'}
                                        </button>
                                    </div>
                                )}

                                {/* Item 5: Audio Recording Mode */}
                                {activeQuestion.mode === 'AUDIO' && (
                                    <div class="space-y-4 text-center">
                                        {!audioBlobUrl ? (
                                            <div class="space-y-3">
                                                <button 
                                                    onClick={isRecording ? stopRecording : startRecording}
                                                    class={`w-32 h-32 rounded-full font-extrabold text-white text-lg shadow-xl transition border-4 border-white mx-auto flex items-center justify-center ${
                                                        isRecording ? 'bg-rose-600 animate-ping' : 'bg-cyan-600 hover:bg-cyan-700'
                                                    }`}
                                                >
                                                    {isRecording ? '⏹️ 停止' : '🎤 開始錄音'}
                                                </button>
                                                <p class="text-xs text-slate-400 font-bold">按下錄音 (不多於 10 秒)</p>
                                            </div>
                                        ) : (
                                            <div class="bg-cyan-50 p-5 rounded-2xl border border-cyan-200 space-y-4">
                                                <div class="font-bold text-cyan-900 text-sm">錄音試聽播放器：</div>
                                                <audio src={audioBlobUrl} controls class="w-full" />
                                                <div class="flex space-x-3">
                                                    <button 
                                                        onClick={handleClearAudio}
                                                        class="w-1/2 py-3 bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold rounded-xl text-sm"
                                                    >
                                                        🗑️ 刪除重錄
                                                    </button>
                                                    <button 
                                                        onClick={() => submitAnswer(audioBase64)}
                                                        class="w-1/2 py-3 bg-cyan-600 hover:bg-cyan-700 text-white font-extrabold rounded-xl shadow-lg text-sm"
                                                    >
                                                        ✅ 確認提交錄音
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Item 4: YouTube & Link Delivery */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div class="space-y-4">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div class="aspect-16-9 w-full rounded-2xl overflow-hidden border">
                                                <iframe 
                                                    src={activeQuestion.youtubeEmbed} 
                                                    class="w-full h-full"
                                                    allow="autoplay; encrypted-media" 
                                                    allowFullScreen
                                                />
                                            </div>
                                        ) : null}

                                        {activeQuestion.pushedUrl && (
                                            <a 
                                                href={activeQuestion.pushedUrl}
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                class="block w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-center rounded-2xl shadow-lg text-base"
                                            >
                                                開啟連結網站 ↗
                                            </a>
                                        )}
                                    </div>
                                )}

                                {/* Item 15, 19, 28: Challenge Mode Student Assessment Screen */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                    <div class="space-y-6">
                                        {!hasSubmitted ? (
                                            <div class="space-y-6">
                                                {activeQuestion.challenge.questions.map((q, idx) => (
                                                    <div key={idx} class="bg-slate-50 p-4 rounded-2xl border space-y-3">
                                                        <div class="font-extrabold text-slate-800 text-base">
                                                            {q.num || idx + 1}. {q.text}
                                                        </div>
                                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                            {q.options.map((opt) => (
                                                                <button 
                                                                    key={opt.letter}
                                                                    onClick={() => setChallengeAnswers(prev => ({ ...prev, [idx]: opt.letter }))}
                                                                    class={`p-3 rounded-xl font-bold text-sm text-left border transition ${
                                                                        challengeAnswers[idx] === opt.letter 
                                                                        ? 'bg-amber-600 text-white border-amber-600' 
                                                                        : 'bg-white text-slate-700 hover:bg-slate-100'

                                                                >
                                                                    {opt.letter}. {opt.text}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>

                                                <button 
                                                    onClick={handleManualSubmitChallenge}
                                                    class="w-full py-4 bg-amber-600 hover:bg-amber-700 text-white font-extrabold text-base rounded-2xl shadow-lg transition active:scale-98"

                                                    ✅ 確認提交挑戰題考卷
                                                </button>
                                            </div>

                                                            const isCorrect = studentAns === q.answer;

                                                            return (
                                                                <div key={idx} class="bg-slate-50 p-4 rounded-2xl border space-y-2">
                                                                    <div class="font-bold text-slate-800 text-sm flex justify-between">
                                                                        <span>{q.num || idx + 1}. {q.text}</span>
                                                                        <span class={`font-black ${isCorrect ? 'text-emerald-600' : 'text-rose-600'}`}>
                                                                            {isCorrect ? '✓ 答對' : '✕ 答錯'}
                                                                        </span>
                                                                    </div>
                                                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs font-bold">
                                                                        {q.options.map((opt) => {
                                                                            let optBg = "bg-white text-slate-600 border-slate-200";
                                                                            if (opt.letter === q.answer) {
                                                                                optBg = "bg-emerald-100 text-emerald-900 border-emerald-400";
                                                                            } else if (opt.letter === studentAns && !isCorrect) {
                                                                                optBg = "bg-rose-100 text-rose-900 border-rose-400";
                                                                            }

                                                                            return (
                                                                                <div key={opt.letter} class={`p-2.5 rounded-xl border ${optBg}`}>
                                                                                    {opt.letter}. {opt.text}
                                                                                    {opt.letter === q.answer && <span class="ml-1 text-emerald-700 font-extrabold">(正確答案)</span>}
                                                                                    {opt.letter === studentAns && <span class="ml-1 text-indigo-700 font-extrabold">(您的選擇)</span>}
                                                                                </div>
                                                                            );
                                                                        })}
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Item 6: Unified Submission Praise Banner */}
                                {hasSubmitted && (
                                    <div class="bg-emerald-50 border-2 border-emerald-300 p-4 rounded-2xl text-center space-y-1 animate-fade-in">
                                        <div class="font-black text-emerald-800 text-base">
                                            已提交答案! 讚賞你的努力! 安靜等候老師指示...
                                        </div>
                                        <div class="text-xs font-mono text-emerald-600">
                                            答題用時：{submitDuration} 秒
                                        </div>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div class="bg-white rounded-3xl p-12 text-center shadow-xl space-y-4">
                                <div class="text-6xl animate-pulse">⏳</div>
                                <h3 class="text-2xl font-black text-slate-800">等候老師發佈題目...</h3>
                                <p class="text-slate-400 text-sm font-medium">請保持螢幕開啟，題目將會自動呈現。</p>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer class="text-center text-xs text-slate-400 font-bold py-2">
                        宣道會陳元喜小學 OMIT互動課堂
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
