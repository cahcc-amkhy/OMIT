        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
            const [selectedAnswer, setSelectedAnswer] = useState('');
            const [shortAnswerInput, setShortAnswerInput] = useState('');
            const [submitted, setSubmitted] = useState(false);

            // Audio States
            const [isRecording, setIsRecording] = useState(false);
            const [recordingTime, setRecordingTime] = useState(0);
            const [audioBlobUrl, setAudioBlobUrl] = useState(null);
            const [audioBase64, setAudioBase64] = useState(null);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);
            const recordingTimerRef = useRef(null);

            // Challenge Question Answers
            const [challengeAnswers, setChallengeAnswers] = useState({});

            const mySubmission = activeQuestion ? responses[`${activeQuestion.id}_${studentId}`] : null;

            useEffect(() => {
                setSelectedAnswer('');
                setShortAnswerInput('');
                setSubmitted(!!mySubmission);
                setChallengeAnswers({});
                setAudioBlobUrl(null);
                setAudioBase64(null);
                setIsRecording(false);
            }, [activeQuestion?.id]);

            const submitResponse = async (answerVal, extraDetails = null) => {
                if (!activeQuestion) return;

                const durationSec = ((Date.now() - activeQuestion.startTime) / 1000).toFixed(1);
                const appId = "omit-8c173";
                const db = window.fbDb;
                
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', `${activeQuestion.id}_${studentId}`);

                const payload = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName,
                    answer: answerVal,
                    duration: durationSec,
                    submittedAt: Date.now()
                };

                if (extraDetails) payload.scoreDetails = extraDetails;

                await window.fbUtils.setDoc(resDocRef, payload);
                setSubmitted(true);
                showToast("已提交答案! 讚賞你的努力! 安靜等候老師指示...", "success");
            };

            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const url = URL.createObjectURL(blob);
                        setAudioBlobUrl(url);

                        const reader = new FileReader();
                        reader.onloadend = () => setAudioBase64(reader.result);
                        reader.readAsDataURL(blob);

                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                    setRecordingTime(0);

                    recordingTimerRef.current = setInterval(() => {
                        setRecordingTime(t => {
                            if (t >= 9) {
                                stopRecording();
                                return 10;
                            }
                            return t + 1;
                        });
                    }, 1000);
                } catch (err) {
                    showToast("無法存取麥克風權限！", "error");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                    clearInterval(recordingTimerRef.current);
                }
            };

            const deleteRecording = () => {
                setAudioBlobUrl(null);
                setAudioBase64(null);
                setRecordingTime(0);
                setIsRecording(false);
            };

            const submitAudio = () => {
                if (!audioBase64) {
                    showToast("請先進行錄音！", "error");
                    return;
                }
                submitResponse(audioBase64);
            };

            const handleChallengeSubmit = () => {
                const questions = activeQuestion.challenge.questions;
                let correctCount = 0;

                questions.forEach((q, idx) => {
                    if (challengeAnswers[idx] === q.answer) correctCount++;
                });

                const totalQ = questions.length || 1;
                const scorePerQ = (activeQuestion.challenge.totalScore || 100) / totalQ;
                const finalScore = Math.round(correctCount * scorePerQ);
                const percentage = Math.round((correctCount / totalQ) * 100);

                submitResponse('CHALLENGE_SUBMITTED', {
                    correctCount,
                    totalQuestions: totalQ,
                    totalScore: finalScore,
                    percentage
                });
            };

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col">
                    {/* Header */}
                    <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
                        <div>
                            <span class="text-xs bg-indigo-500 text-white px-2.5 py-1 rounded-full font-bold">
                                宣道會陳元喜小學
                            </span>
                            <h1 class="text-base font-black mt-0.5">學號 {seatNumber} 號 - {studentName}</h1>
                        </div>
                        <button onClick={onExit} class="text-xs font-bold bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700">
                            退出
                        </button>
                    </header>

                    {/* Main Interaction Area */}
                    <main class="flex-1 max-w-2xl w-full mx-auto p-4 space-y-4">

                        {/* Broadcasted Content Display */}
                        {activeQuestion?.broadcastedSubmission && (
                            <div class="bg-purple-900 text-white p-4 rounded-3xl shadow-xl space-y-3 animate-pulse">
                                <div class="flex justify-between items-center">
                                    <span class="font-black text-sm">📢 教師全班廣播互評：{activeQuestion.broadcastedSubmission.name} 的作品</span>
                                </div>
                                <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden">
                                    <img src={activeQuestion.broadcastedSubmission.answer} class="w-full h-full object-contain" alt="廣播作品" />
                                </div>
                            </div>
                        )}

                        {activeQuestion?.teacherDemoBoard && (
                            <div class="bg-indigo-900 text-white p-4 rounded-3xl shadow-xl space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="font-black text-sm">🎨 教師白板示範與解說中</span>
                                </div>
                                <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden">
                                    <img src={activeQuestion.teacherDemoBoard} class="w-full h-full object-contain" alt="教師解說" />
                                </div>
                            </div>
                        )}

                        {!activeQuestion && (
                            <div class="text-center py-20 space-y-3">
                                <div class="text-6xl animate-bounce">⏳</div>
                                <h2 class="text-xl font-black text-slate-700">安靜等候老師發佈題目...</h2>
                                <p class="text-xs text-slate-400">宣道會陳元喜小學 OMIT互動課堂</p>
                            </div>
                        )}

                        {activeQuestion && (
                            <div class="bg-white rounded-3xl p-6 shadow-sm border space-y-6">
                                <div class="border-b pb-3">
                                    <span class="text-xs font-bold text-indigo-600 uppercase">【{getModeLabel(activeQuestion.mode)}】</span>
                                    <h2 class="text-xl font-black text-slate-800">{activeQuestion.text}</h2>
                                </div>

                                {/* Link Pushing */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div class="space-y-4 text-center">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div class="aspect-16-9 w-full rounded-2xl overflow-hidden border">
                                                <iframe src={activeQuestion.youtubeEmbed} class="w-full h-full" allow="autoplay; encrypted-media" allowFullScreen />
                                            </div>
                                        ) : (
                                            <a 
                                                href={activeQuestion.pushedUrl} 
                                                target="_blank" 
                                                rel="noreferrer"
                                                class="inline-block px-6 py-3 bg-amber-500 hover:bg-amber-600 text-white font-black rounded-xl shadow-lg text-base"
                                            >
                                                開啟連結網站 ↗
                                            </a>
                                        )}
                                    </div>
                                )}

                                {/* Choice & TF Modes */}
                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div class="space-y-4">
                                        <div class="grid grid-cols-1 gap-3">
                                            {activeQuestion.choiceOptions.map((opt) => (
                                                <button 
                                                    key={opt}
                                                    disabled={submitted && activeQuestion.lockAfterSubmit}
                                                    onClick={() => setSelectedAnswer(opt)}
                                                    class={`p-4 rounded-2xl font-black text-lg text-left border-2 transition ${
                                                        selectedAnswer === opt 
                                                        ? 'bg-indigo-600 text-white border-indigo-600 shadow-md scale-98' 
                                                        : 'bg-slate-50 text-slate-800 border-slate-200 hover:bg-slate-100'
                                                    }`}
                                                >
                                                    {opt}
                                                </button>
                                            ))}
                                        </div>

                                        {(!submitted || !activeQuestion.lockAfterSubmit) && (
                                            <button 
                                                onClick={() => submitResponse(selectedAnswer)}
                                                disabled={!selectedAnswer}
                                                class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-black rounded-2xl text-lg shadow-lg"
                                            >
                                                確認提交
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Short Answer Mode */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-4">
                                        <textarea 
                                            rows={4}
                                            value={shortAnswerInput}
                                            onChange={(e) => setShortAnswerInput(e.target.value)}
                                            placeholder="請輸入您的回答..."
                                            disabled={submitted && activeQuestion.lockAfterSubmit}
                                            class="w-full p-4 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 font-medium text-base"
                                        />
                                        {(!submitted || !activeQuestion.lockAfterSubmit) && (
                                            <button 
                                                onClick={() => submitResponse(shortAnswerInput)}
                                                disabled={!shortAnswerInput.trim()}
                                                class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-black rounded-2xl text-lg shadow-lg"
                                            >
                                                確認提交
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Whiteboard Canvas Mode */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <div class="space-y-4">
                                        <WhiteboardCanvas 
                                            backgroundUrl={activeQuestion.whiteboardBg}
                                            onSave={(dataUrl) => submitResponse(dataUrl)}
                                        />
                                    </div>
                                )}

                                {/* Audio Recording Mode */}
                                {activeQuestion.mode === 'AUDIO' && (
                                    <div class="space-y-5 text-center">
                                        {!audioBlobUrl ? (
                                            <div class="space-y-3">
                                                <button 
                                                    onClick={isRecording ? stopRecording : startRecording}
                                                    class={`w-24 h-24 rounded-full font-black text-3xl shadow-xl transition transform active:scale-95 flex items-center justify-center mx-auto ${
                                                        isRecording ? 'bg-rose-600 text-white animate-pulse' : 'bg-cyan-600 text-white hover:bg-cyan-700'
                                                    }`}
                                                >
                                                    {isRecording ? '⏹️' : '🎤'}
                                                </button>
                                                <div class="font-bold text-sm text-slate-600">
                                                    {isRecording ? `錄音中... ${recordingTime}s / 10s` : '點擊圖示開始錄音 (上限10秒)'}
                                                </div>
                                            </div>
                                        ) : (
                                            <div class="space-y-4 bg-cyan-50 p-5 rounded-2xl border border-cyan-200">
                                                <div class="font-bold text-slate-700">試聽錄音檔：</div>
                                                <audio src={audioBlobUrl} controls class="w-full" />
                                                <div class="flex space-x-3">
                                                    <button 
                                                        onClick={deleteRecording}
                                                        class="flex-1 py-3 bg-rose-100 text-rose-700 hover:bg-rose-200 font-bold rounded-xl text-sm"
                                                    >
                                                        🗑️ 刪除重錄
                                                    </button>
                                                    <button 
                                                        onClick={submitAudio}
                                                        class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl text-sm shadow-md"
                                                    >
                                                        ✅ 確認提交錄音
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Buzzer Mode */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="text-center py-6">
                                        <button 
                                            disabled={submitted}
                                            onClick={() => submitResponse('BUZZER_PRESSED')}
                                            class={`w-40 h-40 rounded-full font-black text-2xl shadow-2xl transition transform active:scale-90 mx-auto border-4 ${
                                                submitted ? 'bg-slate-300 text-slate-500 border-slate-400' : 'bg-rose-600 hover:bg-rose-700 text-white border-rose-400 animate-pulse'
                                            }`}
                                        >
                                            {submitted ? '已按鈕！' : '🚨 搶答！'}
                                        </button>
                                    </div>
                                )}

                                {/* Challenge Question Assessment Mode */}
                                {activeQuestion.mode === 'CHALLENGE' && (
                                    <div class="space-y-6">
                                        {activeQuestion.challenge.questions.map((q, qIdx) => (
                                            <div key={qIdx} class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-3">
                                                <div class="font-black text-slate-800 text-base">
                                                    第 {q.num || qIdx + 1} 題: {q.text}
                                                </div>
                                                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                    {q.options.map((opt) => {
                                                        const isSelected = challengeAnswers[qIdx] === opt.letter;
                                                        return (
                                                            <button 
                                                                key={opt.letter}
                                                                disabled={submitted}
                                                                onClick={() => setChallengeAnswers(prev => ({ ...prev, [qIdx]: opt.letter }))}
                                                                class={`p-3 rounded-xl font-bold text-sm text-left border transition ${
                                                                    isSelected ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-slate-700 border-slate-200'
                                                                }`}
                                                            >
                                                                {opt.letter}. {opt.text}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ))}

                                        {!submitted && (
                                            <button 
                                                onClick={handleChallengeSubmit}
                                                class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-2xl text-lg shadow-lg"
                                            >
                                                確認提交整份挑戰題
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Submission Persistent Toast Banner */}
                                {submitted && (
                                    <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl text-center space-y-1">
                                        <div class="font-black text-emerald-800 text-base">
                                            ✅ 已提交答案! 讚賞你的努力! 安靜等候老師指示...
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<OMITApp />);
    </script>
</body>
</html>
