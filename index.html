<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        function getModeLabel(mode) {
            switch(mode) {
                case 'CHOICE': return '選擇題';
                case 'TF': return '是非題';
                case 'SHORT': return '短答題';
                case 'DRAW': return '白板題';
                case 'BUZZER': return '搶答題';
                case 'AUDIO': return '錄音題';
                case 'CHALLENGE': return '挑戰題';
                case 'COOP': return '合作題';
                case 'LINK': return '派送連結';
                default: return '題目';
            }
        }

        function getDefaultQuestionPrompt(mode) {
            switch(mode) {
                case 'CHOICE': return '請選擇正確答案：';
                case 'TF': return '請判斷下列描述是否正確：';
                case 'SHORT': return '請輸入您的回答：';
                case 'DRAW': return '請在白板上作答或繪圖：';
                case 'BUZZER': return '請準備點擊搶答按鈕！';
                case 'AUDIO': return '請錄製語音回答：';
                case 'CHALLENGE': return '請在限時內完成以下挑戰題評估：';
                case 'COOP': return '組員互相合作完成團隊評估挑戰！';
                case 'LINK': return '請觀看下方派送內容：';
                default: return '請回答問題：';
            }
        }

        // Web Audio Synthesizer
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
                        gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.12 + 0.35);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.12);
                        osc.stop(ctx.currentTime + idx * 0.12 + 0.35);
                    });
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3500);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-600' : 'bg-indigo-600';

            return (
                <div class={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-xl shadow-xl flex items-center space-x-2 text-sm font-bold animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        // Word .docx Generator
        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) throw new Error("JSZip library is missing.");
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>${paragraphsXml}</w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        // Parser for assessment Word/text files
        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];
            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) {
                        questions.push(currentQ);
                    }
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }

                    currentQ.options.push({ letter, text: optText });
                    if (isCorrect) currentQ.answer = letter;
                }
            });

            if (currentQ && currentQ.options.length > 0) {
                questions.push(currentQ);
            }

            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1, text: "以下哪一項不是地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" }, { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" }, { letter: "D", text: "機械資源" }
                            ], answer: "D"
                        },
                        {
                            num: 2, text: "芝士的原料屬於哪一項不地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" }, { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" }, { letter: "D", text: "礦產資源" }
                            ], answer: "C"
                        }
                    ]
                };
            }
            return { title, totalScore, questions };
        };

        const WhiteboardCanvas = ({ readOnly = false, initialImage = null, onSave, disabled = false }) => {
            const canvasRef = useRef(null);
            const [color, setColor] = useState('#2563eb');
            const [lineWidth, setLineWidth] = useState(6);
            const [isEraser, setIsEraser] = useState(false);
            const [isDrawing, setIsDrawing] = useState(false);
            const [bgImageSrc, setBgImageSrc] = useState(initialImage);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                if (bgImageSrc) {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    };
                    img.src = bgImageSrc;
                } else if (!readOnly) {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            }, [bgImageSrc, readOnly]);

            const getCanvasPos = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                if (readOnly || disabled) return;
                e.preventDefault();
                setIsDrawing(true);
                const pos = getCanvasPos(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            };

            const draw = (e) => {
                if (!isDrawing || readOnly || disabled) return;
                e.preventDefault();
                const pos = getCanvasPos(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.strokeStyle = isEraser ? '#ffffff' : color;
                ctx.lineWidth = lineWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            const stopDrawing = (e) => {
                if (!isDrawing) return;
                setIsDrawing(false);
            };

            const clearCanvas = () => {
                if (readOnly || disabled) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                if (bgImageSrc) {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    };
                    img.src = bgImageSrc;
                }
            };

            const handleUploadBg = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setBgImageSrc(evt.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const exportDataUrl = () => {
                if (!canvasRef.current) return '';
                return canvasRef.current.toDataURL('image/png');
            };

            return (
                <div class="flex flex-col space-y-3 w-full items-center">
                    {!readOnly && !disabled && (
                        <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-800 text-white p-2.5 rounded-2xl w-full text-xs md:text-sm">
                            <div class="flex items-center space-x-2">
                                <span class="font-bold">顏色:</span>
                                {['#000000', '#2563eb', '#dc2626', '#16a34a', '#d97706', '#9333ea'].map(c => (
                                    <button
                                        key={c}
                                        type="button"
                                        onClick={() => { setColor(c); setIsEraser(false); }}
                                        class={`w-6 h-6 rounded-full border-2 ${color === c && !isEraser ? 'border-yellow-400 scale-110' : 'border-white'}`}
                                        style={{ backgroundColor: c }}
                                    />
                                ))}
                            </div>

                            <div class="flex items-center space-x-2">
                                <span class="font-bold">筆觸:</span>
                                <input
                                    type="range"
                                    min="2"
                                    max="18"
                                    value={lineWidth}
                                    onChange={(e) => setLineWidth(parseInt(e.target.value))}
                                    class="w-20 md:w-28 accent-indigo-400"
                                />
                                <span>{lineWidth}px</span>
                            </div>

                            <div class="flex items-center space-x-2">
                                <button
                                    type="button"
                                    onClick={() => setIsEraser(!isEraser)}
                                    class={`px-3 py-1.5 rounded-xl font-bold transition flex items-center space-x-1 ${isEraser ? 'bg-amber-500 text-white' : 'bg-slate-700 text-slate-200'}`}
                                >
                                    <span>🧽</span> <span>{isEraser ? '擦膠中' : '擦膠'}</span>
                                </button>
                                <button
                                    type="button"
                                    onClick={clearCanvas}
                                    class="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold transition"
                                >
                                    🗑️ 清空
                                </button>
                                <label class="px-3 py-1.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold cursor-pointer transition">
                                    🖼️ 上載背景
                                    <input type="file" accept="image/*" class="hidden" onChange={handleUploadBg} />
                                </label>
                            </div>
                        </div>
                    )}

                    <div class="canvas-container relative w-full aspect-16-9 bg-white rounded-2xl shadow-inner overflow-hidden border-2 border-slate-300">
                        <canvas
                            ref={canvasRef}
                            width={1280}
                            height={720}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            class="w-full h-full object-contain cursor-crosshair touch-none"
                        />
                    </div>

                    {!readOnly && !disabled && onSave && (
                        <button
                            type="button"
                            onClick={() => onSave(exportDataUrl())}
                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-2xl shadow-lg transition text-base md:text-lg flex items-center justify-center space-x-2 active:scale-98"
                        >
                            <span>✅ 確認提交白板答案</span>
                        </button>
                    )}
                </div>
            );
        };

        function OMITApp() {
            const [role, setRole] = useState('LANDING'); // 'LANDING', 'TEACHER', 'STUDENT'
            const [roomCode, setRoomCode] = useState('');
            const [seatNumber, setSeatNumber] = useState('1');
            const [studentName, setStudentName] = useState('');
            const [teacherPassword, setTeacherPassword] = useState('');
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [toast, setToast] = useState(null);

            const [activeQuestion, setActiveQuestion] = useState(null);
            const [studentsList, setStudentsList] = useState([]);
            const [responses, setResponses] = useState({});
            const [historyQuestions, setHistoryQuestions] = useState([]);
            const [coopState, setCoopState] = useState(null);
            const [teacherBroadcastBoard, setTeacherBroadcastBoard] = useState(null);
            const [isAuthReady, setIsAuthReady] = useState(false);

            const myStudentId = useRef('std_' + Math.random().toString(36).substring(2, 9));

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (window.fbUtils && window.fbAuth) {
                            await window.fbUtils.signInAnonymously(window.fbAuth);
                            setIsAuthReady(true);
                        }
                    } catch (err) {
                        console.error("Firebase auth error:", err);
                    }
                };
                initAuth();
            }, []);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const roomParam = params.get('room');
                if (roomParam) {
                    setRoomCode(roomParam.toUpperCase());
                }
            }, []);

            // Firebase Firestore listener
            useEffect(() => {
                if (!roomCode || !isAuthReady) return;

                const appId = "omit-8c173";
                const db = window.fbDb;
                const { doc, onSnapshot, collection } = window.fbUtils;

                const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                const studentsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                const responsesColRef = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');

                const unsubRoom = onSnapshot(roomDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setActiveQuestion(data.activeQuestion || null);
                        if (data.history) setHistoryQuestions(data.history);
                        if (data.coopState) setCoopState(data.coopState);
                        setTeacherBroadcastBoard(data.teacherBroadcastBoard || null);
                    }
                }, (err) => console.error("Room sub error:", err));

                const unsubStudents = onSnapshot(studentsColRef, (snapshot) => {
                    const list = [];
                    snapshot.forEach((d) => list.push(d.data()));
                    setStudentsList(list);
                }, (err) => console.error("Students sub error:", err));

                const unsubResponses = onSnapshot(responsesColRef, (snapshot) => {
                    const resMap = {};
                    snapshot.forEach((d) => {
                        resMap[d.id] = d.data();
                    });
                    setResponses(resMap);
                }, (err) => console.error("Responses sub error:", err));

                return () => {
                    unsubRoom();
                    unsubStudents();
                    unsubResponses();
                };
            }, [roomCode, isAuthReady]);

            const verifyTeacherPassword = (e) => {
                e?.preventDefault();
                if (teacherPassword === '8030') {
                    const generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
                    setRoomCode(generatedCode);
                    setRole('TEACHER');
                    setShowPasswordModal(false);
                    showToast(`密碼正確！已建立課堂 房號：${generatedCode}`, 'success');
                } else {
                    showToast('密碼錯誤，請重新輸入！', 'error');
                }
            };

            const handleJoinRoom = (e) => {
                e?.preventDefault();
                if (!roomCode.trim()) {
                    showToast('請輸入6位數字房號', 'error');
                    return;
                }

                const studentObj = {
                    id: myStudentId.current,
                    seatNumber: seatNumber,
                    name: studentName.trim() || `學號 ${seatNumber}`,
                    joinTime: new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                };

                const appId = "omit-8c173";
                const db = window.fbDb;
                const studentDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students', myStudentId.current);
                window.fbUtils.setDoc(studentDocRef, studentObj);

            if (role === 'LANDING') {

                            <div class="space-y-6">
                                <form onSubmit={handleJoinRoom} class="bg-indigo-50/70 p-5 rounded-2xl border border-indigo-100 space-y-4">
                                    <h2 class="text-xs font-bold text-indigo-600 uppercase tracking-wider">我是學生 (加入課堂)</h2>
                                    <div>
                                        <label class="text-xs text-slate-500 font-medium mb-1 block">1. 課堂房號</label>
                                        <input 
                                            type="text" 
                                            placeholder="請輸入房號 (例如 123456)" 
                                            value={roomCode} 
                                            onChange={(e) => setRoomCode(e.target.value)}
                                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-mono text-center tracking-widest text-lg font-bold"
                                            maxLength={6}
                                        />
                                    </div>

                                    <div class="grid grid-cols-3 gap-2">
                                        <div class="col-span-1">
                                            <label class="text-xs text-slate-500 font-medium mb-1 block">2. 學號 *</label>
                                            <select 
                                                value={seatNumber}
                                                onChange={(e) => setSeatNumber(e.target.value)}
                                                class="w-full px-3 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-bold text-center"
                                            >
                                                {Array.from({ length: 36 }, (_, i) => i + 1).map((num) => (
                                                    <option key={num} value={num}>{num} 號</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div class="col-span-2">
                                            <label class="text-xs text-slate-500 font-medium mb-1 block">3. 姓名 (可留空)</label>
                                            <input 
                                                type="text" 
                                                placeholder="輸入姓名 / 暱稱" 
                                                value={studentName} 
                                                onChange={(e) => setStudentName(e.target.value)}
                                                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-medium"
                                            />
                                        </div>
                                    </div>

                                    <button 
                                        type="submit" 
                                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-200 active:scale-98"
                                    >
                                        進入課堂 🚀
                                    </button>
                                </form>

                                <div class="relative flex py-1 items-center">
                                    <div class="flex-grow border-t border-slate-200"></div>
                                    <span class="flex-shrink mx-4 text-slate-400 text-xs font-medium">或</span>
                                    <div class="flex-grow border-t border-slate-200"></div>
                                </div>

                                <div class="text-center">
                                    <button 
                                        onClick={() => { setShowPasswordModal(true); setTeacherPassword(''); }}
                                        class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl transition shadow-md flex items-center justify-center space-x-2 active:scale-98"
                                    >
                                        <span>👨‍🏫 開啟新課堂</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {showPasswordModal && (
                            <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                <div class="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
                                    <h3 class="text-lg font-bold text-slate-800 text-center">請輸入教師密碼</h3>
                                    <form onSubmit={verifyTeacherPassword} class="space-y-4">
                                        <input 
                                            type="password" 
                                            value={teacherPassword}
                                            onChange={(e) => setTeacherPassword(e.target.value)}
                                            class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 text-center font-mono text-xl tracking-widest"
                                            autoFocus
                                        />
                                        <div class="flex space-x-2">
                                            <button 
                                                type="button" 
                                                onClick={() => setShowPasswordModal(false)}
                                                class="w-1/2 py-2.5 rounded-xl bg-slate-100 font-medium text-slate-600 hover:bg-slate-200"
                                            >
                                                取消
                                            </button>
                                            <button 
                                                type="submit" 
                                                class="w-1/2 py-2.5 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-700 shadow-md"
                                            >
                                                確認進入
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            if (role === 'TEACHER') {
                return (
                    <TeacherDashboard 
                        roomCode={roomCode} 
                        activeQuestion={activeQuestion} 
                        setActiveQuestion={setActiveQuestion}
                        responses={responses}
                        setResponses={setResponses}
                        studentsList={studentsList}
                        historyQuestions={historyQuestions}
                        setHistoryQuestions={setHistoryQuestions}
                        coopState={coopState}
                        setCoopState={setCoopState}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            if (role === 'STUDENT') {
                return (
                    <StudentInterface 
                        roomCode={roomCode}
                        studentName={studentName}
                        seatNumber={seatNumber}
                        studentId={myStudentId.current}
                        activeQuestion={activeQuestion}
                        responses={responses}
                        coopState={coopState}
                        teacherBroadcastBoard={teacherBroadcastBoard}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            return null;
        }

        function TeacherDashboard({ roomCode, activeQuestion, setActiveQuestion, responses, setResponses, studentsList, historyQuestions, setHistoryQuestions, coopState, setCoopState, showToast, onExit }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE');
            const [questionText, setQuestionText] = useState('');
            const [choiceCount, setChoiceCount] = useState(4);
            const [lockAfterSubmit, setLockAfterSubmit] = useState(true);
            const [whiteboardBg, setWhiteboardBg] = useState(null);
            const [pushedUrl, setPushedUrl] = useState('');

            // Modals & Tools
            const [showQRModal, setShowQRModal] = useState(false);
            const [showInspectModal, setShowInspectModal] = useState(null);
            const [inspectStudentIndex, setInspectStudentIndex] = useState(0);
            const [barChoiceFilter, setBarChoiceFilter] = useState(null);
            const [showDemoWhiteboard, setShowDemoWhiteboard] = useState(false);
            const [isTeacherBroadcasting, setIsTeacherBroadcasting] = useState(false);
            const [teacherBoardDataUrl, setTeacherBoardDataUrl] = useState('');

            // Random Selector State
            const [showRandomModal, setShowRandomModal] = useState(false);
            const [rangeStart, setRangeStart] = useState(1);
            const [rangeEnd, setRangeEnd] = useState(36);
            const [drawnNumbers, setDrawnNumbers] = useState([]);
            const [currentDrawn, setCurrentDrawn] = useState(null);
            const [isSpinning, setIsSpinning] = useState(false);

            // Timer Modal State
            const [showTimerModal, setShowTimerModal] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerActive, setTimerActive] = useState(false);
            const [timerZoomed, setTimerZoomed] = useState(false);
            const [customTimerMM, setCustomTimerMM] = useState('02');
            const [customTimerSS, setCustomTimerSS] = useState('00');

            // Challenge Question Setup States
            const [challengeData, setChallengeData] = useState(null);
            const [challengeEnableTimer, setChallengeEnableTimer] = useState(true);
            const [challengeTimeLimit, setChallengeTimeLimit] = useState(120);
            const [challengeTimeMM, setChallengeTimeMM] = useState('02');
            const [challengeTimeSS, setChallengeTimeSS] = useState('00');
            const [challengeReleaseInstant, setChallengeReleaseInstant] = useState(true);
            const [showChallengeScoresOnLeaderboard, setShowChallengeScoresOnLeaderboard] = useState(true);

            // Coop Game Setup States
            const [coopData, setCoopData] = useState(null);

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

            // Filter current responses for active question
            const currentQuestionResponses = useMemo(() => {
                if (!activeQuestion) return {};
                const filtered = {};
                Object.values(responses).forEach(r => {
                    if (r.questionId === activeQuestion.id) {
                        filtered[r.studentId] = r;
                    }
                });
                return filtered;
            }, [responses, activeQuestion]);

            // Sorted responses for Leaderboard
            const sortedResponsesList = useMemo(() => {
                const list = Object.values(currentQuestionResponses);
                return list.sort((a, b) => (a.submitTimestamp || 0) - (b.submitTimestamp || 0));
            }, [currentQuestionResponses]);

            // Timer Interval Logic
            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(s => {
                            if (s <= 1) {
                                setTimerActive(false);
                                playSound('alarm');
                                return 0;
                            }
                            return s - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            const publishRoomState = async (payload) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { ...payload, updatedAt: Date.now() }, { merge: true });
            };

            const handleExitRoom = async () => {
                if (window.confirm("確定退出課室？將會同步清空此課室於 Firebase 的所有暫存紀錄！")) {
                    try {
                        const appId = "omit-8c173";
                        const db = window.fbDb;
                        
                        const responsesColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');
                        const resSnaps = await window.fbUtils.getDocs(responsesColRef);
                        resSnaps.forEach(async (d) => await window.fbUtils.deleteDoc(d.ref));

                        const studentsColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                        const stuSnaps = await window.fbUtils.getDocs(studentsColRef);
                        stuSnaps.forEach(async (d) => await window.fbUtils.deleteDoc(d.ref));

                        const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                        await window.fbUtils.deleteDoc(roomDocRef);

                        showToast("課室暫存資料已完全清空！", "info");
                    } catch (e) {
                        console.error("Cleanup error:", e);
                    }
                    onExit();
                }
            };

            // Download Challenge Assessment Word Template File (.docx)
            const handleDownloadChallengeTemplate = async () => {
                const sampleLines = [
                    "標題：地球生病了",
                    "總分: 100分",
                    "1.以下哪一項不是地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源",
                    "D. 機械資源*",
                    "",
                    "2.芝士的原料屬於哪一項不地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源*",
                    "D. 礦產資源",
                    "",
                    "3.人們不當使用水資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應*",
                    "",
                    "4.人們不當使用煤和石油資源會造成甚麼後果?",
                    "A. 引發極端天氣*",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應",
                    "",
                    "5.人們不當使用土地資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災*",
                    "C. 產生大量二氧化碳",
                    "D. 影響食水供應"
                ];

                try {
                    const blob = await createWordDocxBlob(sampleLines);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = '下載評估範本Word檔_地球生病了.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast("已下載 Word 評估範本檔 (.docx)！", "success");
                } catch (err) {
                    console.error("Docx generation error:", err);
                    showToast("無法生成 Word 範本檔", "error");
                }
            };

            const handleWordFileUpload = (e, isCoop = false) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const result = await window.mammoth.extractRawText({ arrayBuffer: evt.target.result });
                            parsedData = parseWordChallengeText(result.value);
                        } else {
                            parsedData = parseWordChallengeText(evt.target.result);
                        }

                        if (isCoop) {
                            setCoopData(parsedData);
                        } else {
                            setChallengeData(parsedData);
                        }
                        showToast(`已成功上載並解析範本！共 ${parsedData.questions.length} 題`, 'success');
                    } catch (err) {
                        console.error("Parse error:", err);
                        showToast("文件解析失敗，請檢查格式！", "error");
                    }
                };

                if (file.name.endsWith('.docx')) {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file, "UTF-8");
                }
            };

            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                
                let challengeContent = null;
                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請先上載評估範本Word檔！", "error");
                        return;
                    }
                    const totalSecs = (parseInt(challengeTimeMM) || 0) * 60 + (parseInt(challengeTimeSS) || 0);
                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? (totalSecs || 120) : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);

                publishRoomState({ activeQuestion: newQ, history: updatedHistory, coopState: null });
                showToast(`已成功派發【${getModeLabel(selectedMode)}】！`, 'success');
            };

            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await publishRoomState({ activeQuestion: updatedQ });
                showToast("已成功一併發放全班挑戰題成績！", "success");
            };

            // CSV Export for Challenge Results
            const handleExportChallengeCSV = () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE' || !activeQuestion.challenge) {
                    showToast("當前非挑戰題，無法匯出成績試算表！", "error");
                    return;
                }

                const questions = activeQuestion.challenge.questions || [];
                let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
                
                // Header
                let headers = ["學號", "姓名", "總分", "正確率", "作答用時(秒)"];
                questions.forEach((q, idx) => {
                    headers.push(`第${idx + 1}題答案`, `第${idx + 1}題結果`);
                });
                csvContent += headers.join(",") + "\n";

                // Rows
                studentsList.forEach(student => {
                    const res = currentQuestionResponses[student.id];
                    const seat = student.seatNumber;
                    const name = `"${(student.name || '').replace(/"/g, '""')}"`;
                    
                    if (res && res.challengeAnswers) {
                        const score = res.challengeScore || 0;
                        const correctCount = res.challengeCorrectCount || 0;
                        const accuracy = Math.round((correctCount / questions.length) * 100) + "%";
                        const timeTaken = res.timeTaken || 0;

                        let row = [seat, name, score, accuracy, timeTaken];
                        questions.forEach((q, idx) => {
                            const stdAns = res.challengeAnswers[idx] || "未答";
                            const isCorrect = stdAns === q.answer ? "正確" : "錯誤";
                            row.push(`"${stdAns}"`, isCorrect);
                        });
                        csvContent += row.join(",") + "\n";
                    } else {
                        let row = [seat, name, 0, "0%", 0];
                        questions.forEach(() => row.push("未提交", "未作答"));
                        csvContent += row.join(",") + "\n";
                    }
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `挑戰題成績_${activeQuestion.challenge.title}_房號${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("已匯出挑戰題成績試算表 (.csv)！", "success");
            };

            // Coop Mode Group Randomizer
            const handleStartCoopGrouping = () => {
                if (!coopData || !coopData.questions) {
                    showToast("請先上載並編輯合作題評估內容！", "error");
                    return;
                }

                if (studentsList.length < 3) {
                    showToast("在線學生不足3人，無法進行分組！", "error");
                    return;
                }

                const animalTemplates = [
                    { name: '老虎組', emoji: '🐯', color: 'bg-amber-500 border-amber-600 text-white' },
                    { name: '大象組', emoji: '🐘', color: 'bg-blue-600 border-blue-700 text-white' },
                    { name: '企鵝組', emoji: '🐧', color: 'bg-cyan-600 border-cyan-700 text-white' },
                    { name: '藍鯨組', emoji: '🐳', color: 'bg-indigo-600 border-indigo-700 text-white' },
                    { name: '白兔組', emoji: '🐰', color: 'bg-pink-500 border-pink-600 text-white' },
                    { name: '熊貓組', emoji: '🐼', color: 'bg-slate-700 border-slate-800 text-white' },
                    { name: '獅子組', emoji: '🦁', color: 'bg-orange-500 border-orange-600 text-white' },
                    { name: '白羊組', emoji: '🐑', color: 'bg-emerald-600 border-emerald-700 text-white' },
                    { name: '水牛組', emoji: '🐃', color: 'bg-stone-600 border-stone-700 text-white' },
                    { name: '斑馬組', emoji: '🦓', color: 'bg-purple-600 border-purple-700 text-white' },
                ];

                const shuffledStudents = [...studentsList].sort(() => 0.5 - Math.random());
                const numStudents = shuffledStudents.length;
                let groupCount = Math.max(1, Math.floor(numStudents / 3));

                const groups = Array.from({ length: groupCount }, (_, idx) => ({
                    id: 'group_' + idx,
                    ...animalTemplates[idx % animalTemplates.length],
                    members: [],
                    currentIndex: 0,
                    progressPct: 0
                }));

                shuffledStudents.forEach((std, idx) => {
                    const gIndex = idx % groupCount;
                    groups[gIndex].members.push(std);
                });

                const newCoopState = {
                    stage: 'GROUPING', // 'PREP', 'GROUPING', 'RACE'
                    title: coopData.title,
                    questions: coopData.questions,
                    groups: groups,
                    winnerGroup: null
                };

                setCoopState(newCoopState);
                publishRoomState({ coopState: newCoopState, activeQuestion: null });
                showToast("已成功隨機分配組別！並向學生發送分組資訊", "success");
            };

            const handleStartCoopRace = () => {
                if (!coopState || coopState.stage !== 'GROUPING') return;
                const nextState = { ...coopState, stage: 'RACE' };
                setCoopState(nextState);
                publishRoomState({ coopState: nextState });
                showToast("🚀 合作比賽開始！背景音樂已播放", "success");
            };

            // Random Student Selector
            const triggerRandomSpin = () => {
                if (isSpinning) return;
                const pool = [];
                for (let i = rangeStart; i <= rangeEnd; i++) {
                    pool.push(i);
                }
                if (pool.length === 0) return;

                setIsSpinning(true);
                let counter = 0;
                const maxSteps = 25;
                
                const timer = setInterval(() => {
                    const rand = pool[Math.floor(Math.random() * pool.length)];
                    setCurrentDrawn(rand);
                    playSound('spin');
                    counter++;
                    if (counter >= maxSteps) {
                        clearInterval(timer);
                        setIsSpinning(false);
                        playSound('win');
                        setDrawnNumbers(prev => [...prev, rand]);
                    }
                }, 80);
            };

            // Teacher Demo Whiteboard Broadcast Handler
            const handleToggleDemoBroadcast = async (dataUrl) => {
                const nextBroadcast = !isTeacherBroadcasting;
                setIsTeacherBroadcasting(nextBroadcast);
                setTeacherBoardDataUrl(dataUrl);

                await publishRoomState({
                    teacherBroadcastBoard: nextBroadcast ? dataUrl : null
                });

                if (nextBroadcast) {

                                                                    value={challengeTimeSS} 
                                                                    onChange={(e) => setChallengeTimeSS(e.target.value)}
                                                                    class="w-8 px-1 text-center border rounded"

                                                                />
                                                            </div>

                                                                    {min}分

                                                            <input 
                                                                type="radio" 
                                                                name="releaseMode" 
                                                                checked={!challengeReleaseInstant}

                                                            />

                                                        </label>
                                                    </div>
                                                </div>
                                            </div>

                                                    🔄 重新分配

                                                    onClick={handleStartCoopRace}

                                                    🏁 開始比賽

                                                    onClick={handleStartCoopRace}

                                                    onClick={handleStartCoopGrouping}
                                                    class="w-1/3 py-2 rounded-xl bg-purple-600 text-white font-bold text-xs"
                                                >
                                                    重新分組
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                            {sortedResponsesList[0].seatNumber}號 {sortedResponsesList[0].name}
                                        </div>
                                        <div class="text-xs font-mono">

                                                        <div 
                                                            key={opt}

                    {/* Magnify / Inspect Student Work Modal */}

        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, coopState, teacherBroadcastBoard, showToast, onExit }) {
            const [selectedOption, setSelectedOption] = useState(null);
            const [shortAnswerText, setShortAnswerText] = useState('');
            const [whiteboardDataUrl, setWhiteboardDataUrl] = useState(null);
            const [audioBlob, setAudioBlob] = useState(null);
            const [audioDataUrl, setAudioDataUrl] = useState(null);
            const [isRecording, setIsRecording] = useState(false);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            // Challenge answers state
            const [challengeStudentAnswers, setChallengeStudentAnswers] = useState({});

            // Submission status
            const [isSubmitted, setIsSubmitted] = useState(false);

            // My submission for active question
            const myResponse = useMemo(() => {
                if (!activeQuestion) return null;
                return responses[`${studentId}_${activeQuestion.id}`] || null;
            }, [responses, activeQuestion, studentId]);

            useEffect(() => {
                if (myResponse) {
                    setIsSubmitted(true);
                } else {
                    setIsSubmitted(false);
                    setSelectedOption(null);
                    setShortAnswerText('');
                    setWhiteboardDataUrl(null);
                    setAudioDataUrl(null);
                    setChallengeStudentAnswers({});
                }
            }, [myResponse, activeQuestion]);

            // Submit response to Firebase
            const submitAnswerToFirebase = async (answerValue, extraData = {}) => {
                if (!activeQuestion) return;

                const appId = "omit-8c173";
                const db = window.fbDb;
                const resDocId = `${studentId}_${activeQuestion.id}`;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', resDocId);

                const timeTakenSec = Math.floor((Date.now() - activeQuestion.startTime) / 1000);

                const payload = {
                    id: resDocId,
                    studentId: studentId,
                    questionId: activeQuestion.id,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: answerValue,
                    submitTimestamp: Date.now(),
                    submitTime: new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                    timeTaken: timeTakenSec,
                    ...extraData
                };

                await window.fbUtils.setDoc(resDocRef, payload);
                setIsSubmitted(true);
                showToast("已提交答案! 讚賞你的努力! 安靜等候老師指示...", "success");
            };

            // Audio recording logic
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        setAudioBlob(blob);
                        const reader = new FileReader();
                        reader.onloadend = () => setAudioDataUrl(reader.result);
                        reader.readAsDataURL(blob);
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                } catch (err) {
                    console.error("Mic error:", err);
                    showToast("無法存取麥克風權限！", "error");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            // Calculate Challenge Score
            const submitChallengeAssessment = () => {
                if (!activeQuestion || !activeQuestion.challenge) return;
                const questions = activeQuestion.challenge.questions || [];
                let correctCount = 0;

                questions.forEach((q, idx) => {
                    if (challengeStudentAnswers[idx] === q.answer) {
                        correctCount++;
                    }
                });

                const score = Math.round((correctCount / questions.length) * (activeQuestion.challenge.totalScore || 100));

                submitAnswerToFirebase('CHALLENGE_SUBMITTED', {
                    challengeAnswers: challengeStudentAnswers,
                    challengeScore: score,
                    challengeCorrectCount: correctCount
                });
            };

            // Find student's assigned Coop Group
            const myCoopGroup = useMemo(() => {
                if (!coopState || !coopState.groups) return null;
                return coopState.groups.find(g => g.members.some(m => m.id === studentId));
            }, [coopState, studentId]);

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col pb-12">
                    {/* Header */}
                    <header class="bg-indigo-900 text-white sticky top-0 z-30 shadow-md px-4 py-3 flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <span class="font-black text-lg">OMIT 學生端</span>
                            <span class="bg-indigo-700 text-indigo-100 text-xs px-2.5 py-0.5 rounded-full font-bold">
                                {seatNumber}號 {studentName}
                            </span>
                        </div>
                        <button onClick={onExit} class="text-xs bg-rose-600 hover:bg-rose-700 px-3 py-1.5 rounded-xl font-bold">
                            離開
                        </button>
                    </header>

                    {/* Broadcast Overlay from Teacher Demo Whiteboard */}
                    {teacherBroadcastBoard && (
                        <div class="bg-amber-50 border-b-2 border-amber-300 p-3 shadow-md animate-fade-in text-center space-y-2">
                            <span class="text-xs font-bold text-amber-900">📡 教師即時廣播示範白板：</span>
                            <img src={teacherBroadcastBoard} class="max-h-64 mx-auto rounded-xl border bg-white shadow-inner" />
                        </div>
                    )}

                    <main class="max-w-2xl mx-auto w-full p-4 flex-grow space-y-4">
                        {/* Coop Group Display Banner */}
                        {coopState && coopState.stage === 'GROUPING' && myCoopGroup && (
                            <div class={`p-6 rounded-3xl border-4 text-center space-y-3 ${myCoopGroup.color} shadow-xl animate-pulse-ring`}>
                                <span class="text-5xl">{myCoopGroup.emoji}</span>
                                <h2 class="text-2xl font-black">{myCoopGroup.name}</h2>
                                <p class="text-sm font-bold bg-black/20 py-2 px-4 rounded-xl inline-block">
                                    盡快與你的組員會合!比賽即將開始!
                                </p>
                            </div>
                        )}

                        {/* Answering Panels */}
                        {!activeQuestion ? (
                            <div class="bg-white rounded-3xl p-8 text-center shadow-sm border border-slate-200 space-y-3">
                                <div class="text-4xl">⏳</div>
                                <h2 class="text-lg font-bold text-slate-700">課堂連線中，安靜等候老師指示...</h2>
                            </div>
                        ) : isSubmitted ? (
                            <div class="bg-emerald-50 rounded-3xl p-8 text-center border-2 border-emerald-300 space-y-4 shadow-sm animate-fade-in">
                                <div class="text-5xl">🎉</div>
                                <h2 class="text-xl font-black text-emerald-900">
                                    已提交答案! 讚賞你的努力! 安靜等候老師指示...
                                </h2>

                                {/* If Challenge Scores are Released */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge?.scoresReleased && myResponse && (
                                    <div class="bg-white p-4 rounded-2xl border text-left space-y-3 mt-4">
                                        <div class="text-center border-b pb-2">
                                            <span class="text-xs font-bold text-slate-500">評估總得分</span>
                                            <div class="text-4xl font-black text-indigo-600">{myResponse.challengeScore || 0}分</div>
                                        </div>

                                        <div class="space-y-3 pt-2">
                                            {activeQuestion.challenge.questions.map((q, qIdx) => {
                                                const myAns = myResponse.challengeAnswers?.[qIdx];
                                                const isCorrect = myAns === q.answer;
                                                return (
                                                    <div key={qIdx} class={`p-3 rounded-xl border ${isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}`}>
                                                        <div class="font-bold text-xs mb-1">
                                                            {qIdx + 1}. {q.text}
                                                        </div>
                                                        <div class="text-xs font-bold space-y-0.5">
                                                            <div class={isCorrect ? 'text-emerald-700' : 'text-rose-600'}>
                                                                你的選擇: {myAns || '未選擇'} ({isCorrect ? '正確 ✅' : '錯誤 ❌'})
                                                            </div>
                                                            {!isCorrect && (
                                                                <div class="text-emerald-700">
                                                                    正確答案: {q.answer}
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-200 space-y-5">
                                <div class="border-b pb-3 flex items-center justify-between">
                                    <span class="px-3 py-1 rounded-full bg-indigo-100 text-indigo-700 font-black text-xs">
                                        【{getModeLabel(activeQuestion.mode)}】
                                    </span>
                                </div>

                                <h2 class="text-lg font-extrabold text-slate-800">
                                    {activeQuestion.text}
                                </h2>

                                {/* YouTube / Link Embed */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div class="space-y-3">
                                        {activeQuestion.youtubeEmbed ? (
                                            <iframe src={activeQuestion.youtubeEmbed} class="w-full aspect-16-9 rounded-2xl shadow-sm border" />
                                        ) : (
                                            <a 
                                                href={activeQuestion.pushedUrl} 
                                                target="_blank" 
                                                class="inline-block bg-indigo-600 text-white font-bold px-5 py-3 rounded-2xl shadow-md text-sm hover:bg-indigo-700"
                                            >
                                                開啟連結網站 ↗
                                            </a>
                                        )}
                                    </div>
                                )}

                                {/* Choice / TF Answering Panel */}
                                {['CHOICE', 'TF'].includes(activeQuestion.mode) && (
                                    <div class="space-y-4">
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            {activeQuestion.choiceOptions.map(opt => (
                                                <button
                                                    key={opt}
                                                    onClick={() => setSelectedOption(opt)}
                                                    class={`p-4 rounded-2xl font-black text-lg transition border-2 text-center ${selectedOption === opt ? 'bg-indigo-600 text-white border-indigo-700 shadow-md' : 'bg-slate-50 text-slate-800 border-slate-200 hover:bg-slate-100'}`}
                                                >
                                                    {opt}
                                                </button>
                                            ))}
                                        </div>

                                        <button
                                            onClick={() => selectedOption && submitAnswerToFirebase(selectedOption)}
                                            disabled={!selectedOption}
                                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3.5 rounded-2xl transition shadow-md disabled:opacity-50 text-base"
                                        >
                                            ✅ 確認提交
                                        </button>
                                    </div>
                                )}

                                {/* Short Answer Panel */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-4">
                                        <textarea
                                            value={shortAnswerText}
                                            onChange={(e) => setShortAnswerText(e.target.value)}
                                            placeholder="請在此輸入答案..."
                                            class="w-full p-4 rounded-2xl border border-slate-200 text-base h-28 focus:ring-2 focus:ring-indigo-500"
                                        />
                                        <button
                                            onClick={() => shortAnswerText.trim() && submitAnswerToFirebase(shortAnswerText.trim())}
                                            disabled={!shortAnswerText.trim()}
                                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3.5 rounded-2xl transition shadow-md disabled:opacity-50 text-base"
                                        >
                                            ✅ 確認提交
                                        </button>
                                    </div>
                                )}

                                {/* Whiteboard Answering Panel */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <WhiteboardCanvas 
                                        initialImage={activeQuestion.whiteboardBg}
                                        onSave={(dataUrl) => submitAnswerToFirebase(dataUrl)}
                                    />
                                )}

                                {/* Buzzer Panel */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="text-center py-6">
                                        <button
                                            onClick={() => submitAnswerToFirebase('BUZZER_CLICK')}
                                            class="w-48 h-48 rounded-full bg-rose-600 hover:bg-rose-700 text-white font-black text-3xl shadow-2xl transition transform active:scale-90 border-8 border-rose-300 mx-auto"
                                        >
                                            🔔 搶答！
                                        </button>
                                    </div>
                                )}

                                {/* Audio Recording Panel */}
                                {activeQuestion.mode === 'AUDIO' && (
                                    <div class="space-y-4 text-center">
                                        {!audioDataUrl ? (
                                            <button
                                                onClick={isRecording ? stopRecording : startRecording}
                                                class={`px-8 py-4 rounded-2xl font-black text-lg transition shadow-md ${isRecording ? 'bg-rose-600 text-white animate-pulse' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}
                                            >
                                                {isRecording ? '⏹️ 停止錄音' : '🎙️ 開始錄音'}
                                            </button>
                                        ) : (
                                            <div class="space-y-3 bg-slate-50 p-4 rounded-2xl border">
                                                <audio controls src={audioDataUrl} class="w-full" />
                                                <div class="flex space-x-2">
                                                    <button
                                                        onClick={() => { setAudioDataUrl(null); setAudioBlob(null); }}
                                                        class="w-1/2 py-2.5 bg-rose-600 text-white font-bold rounded-xl text-xs"
                                                    >
                                                        🗑️ 刪除重錄
                                                    </button>
                                                    <button
                                                        onClick={() => submitAnswerToFirebase(audioDataUrl)}
                                                        class="w-1/2 py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-xs shadow-md"
                                                    >
                                                        ✅ 確認提交錄音
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Challenge Question Answering */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                    <div class="space-y-6">
                                        <div class="space-y-4">
                                            {activeQuestion.challenge.questions.map((q, qIdx) => (
                                                <div key={qIdx} class="p-4 rounded-2xl border border-slate-200 bg-slate-50 space-y-2">
                                                    <div class="font-bold text-sm text-slate-800">
                                                        {qIdx + 1}. {q.text}
                                                    </div>
                                                    <div class="grid grid-cols-2 gap-2">
                                                        {q.options.map(opt => (
                                                            <button
                                                                key={opt.letter}
                                                                onClick={() => setChallengeStudentAnswers({ ...challengeStudentAnswers, [qIdx]: opt.letter })}
                                                                class={`p-2.5 rounded-xl font-bold text-xs border text-left transition ${challengeStudentAnswers[qIdx] === opt.letter ? 'bg-indigo-600 text-white border-indigo-700' : 'bg-white text-slate-700 border-slate-200'}`}
                                                            >
                                                                {opt.letter}. {opt.text}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        <button
                                            onClick={submitChallengeAssessment}
                                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3.5 rounded-2xl transition shadow-lg text-base"
                                        >
                                            ✅ 確認提交整份評估
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        // Mount React Root
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<OMITApp />);
    </script>
</body>
</html>
