    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Mode label definitions
        function getModeLabel(mode) {

        function getDefaultQuestionPrompt(mode) {

            }
        }

        // Web Audio API Sound Generator
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                    });
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.error("Audio synth error:", e);
            }
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);

            const bgColor = type === 'error' ? 'bg-rose-600' : type === 'success' ? 'bg-emerald-600' : 'bg-indigo-600';

        };

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        // Create Word (.docx) binary Blob using JSZip
        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) throw new Error("JSZip library is not loaded.");
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>${paragraphsXml}</w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        // Word / Text parsing for Challenge & Coop questions
        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];
            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) {
                        questions.push(currentQ);
                    }
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }

                    currentQ.options.push({ letter, text: optText });
                    if (isCorrect) currentQ.answer = letter;
                }
            });

            if (currentQ && currentQ.options.length > 0) {
                questions.push(currentQ);
            }

            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1,
                            text: "以下哪一項不是地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "機械資源" }
                            ],
                            answer: "D"
                        },
                        {
                            num: 2,
                            text: "芝士的原料屬於哪一項地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "礦產資源" }
                            ],
                            answer: "C"
                        },
                        {
                            num: 3,
                            text: "人們不當使用水資源會造成甚麼後果?",
                            options: [
                                { letter: "A", text: "引發極端天氣" },
                                { letter: "B", text: "引發水災" },
                                { letter: "C", text: "水土流失" },
                                { letter: "D", text: "影響食水供應" }
                            ],
                            answer: "D"
                        },
                        {
                            num: 4,
                            text: "人們不當使用煤和石油資源會造成甚麼後果?",
                            options: [
                                { letter: "A", text: "引發極端天氣" },
                                { letter: "B", text: "引發水災" },
                                { letter: "C", text: "水土流失" },
                                { letter: "D", text: "影響食水供應" }
                            ],
                            answer: "A"
                        },
                        {
                            num: 5,
                            text: "人們不當使用土地資源會造成甚麼後果?",
                            options: [
                                { letter: "A", text: "引發極端天氣" },
                                { letter: "B", text: "引發水災" },
                                { letter: "C", text: "產生大量二氧化碳" },
                                { letter: "D", text: "影響食水供應" }
                            ],
                            answer: "B"
                        }
                    ]
                };
            }

            return { title, totalScore, questions };
        };

        // --- High Precision Whiteboard Canvas Component (1280x720 aspect mapping) ---
        function WhiteboardCanvas({ initialBg, onConfirm, disabled, initialImage }) {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [tool, setTool] = useState('pen'); // 'pen' | 'eraser'
            const [lineWidth, setLineWidth] = useState(4); // 2px - 18px
            const [bgImage, setBgImage] = useState(initialBg || null);
            const lastPos = useRef({ x: 0, y: 0 });

            const redrawBg = (ctx) => {
                if (bgImage) {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, 1280, 720);
                    };
                    img.src = bgImage;
                }
            };

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 1280, 720);

                if (initialImage) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0, 1280, 720);
                    img.src = initialImage;
                } else if (bgImage) {
                    redrawBg(ctx);
                }
            }, [bgImage, initialImage]);

            const getCanvasCoords = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = 1280 / rect.width;
                const scaleY = 720 / rect.height;

                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                if (disabled) return;
                e.preventDefault();
                setIsDrawing(true);
                const pos = getCanvasCoords(e);
                lastPos.current = pos;
            };

            const draw = (e) => {
                if (!isDrawing || disabled) return;
                e.preventDefault();
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const pos = getCanvasCoords(e);

                ctx.beginPath();
                ctx.moveTo(lastPos.current.x, lastPos.current.y);
                ctx.lineTo(pos.x, pos.y);

                if (tool === 'eraser') {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.lineWidth = lineWidth * 3;
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = '#1e1b4b';
                    ctx.lineWidth = lineWidth;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                }

                ctx.stroke();
                lastPos.current = pos;
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const handleClear = () => {
                if (disabled) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 1280, 720);
                if (bgImage) redrawBg(ctx);
            };

            const handleBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setBgImage(evt.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleConfirm = () => {
                const canvas = canvasRef.current;
                const dataUrl = canvas.toDataURL('image/png');
                if (onConfirm) onConfirm(dataUrl);
            };

            return (
                <div class="space-y-3 bg-slate-900/5 p-4 rounded-3xl border border-slate-200">
                    <div class="flex flex-wrap items-center justify-between gap-3 bg-white p-3 rounded-2xl shadow-sm border">
                        <div class="flex items-center space-x-2">
                            <button 
                                type="button"
                                onClick={() => setTool('pen')}
                                disabled={disabled}
                                class={`px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1 transition ${tool === 'pen' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                            >
                                ✏️ 畫筆
                            </button>
                            <button 
                                type="button"
                                onClick={() => setTool('eraser')}
                                disabled={disabled}
                                class={`px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1 transition ${tool === 'eraser' ? 'bg-amber-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                            >
                                🧽 擦膠
                            </button>
                            <button 
                                type="button"
                                onClick={handleClear}
                                disabled={disabled}
                                class="px-3 py-1.5 rounded-xl font-bold text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 transition"
                            >
                                🗑️ 一鍵清空
                            </button>
                        </div>

                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold text-slate-500">筆觸粗幼:</span>
                            <input 
                                type="range" 
                                min="2" 
                                max="18" 
                                value={lineWidth} 
                                onChange={(e) => setLineWidth(parseInt(e.target.value))}
                                disabled={disabled}
                                class="w-24 accent-indigo-600 cursor-pointer"
                            />
                            <span class="text-xs font-mono font-bold text-indigo-600 w-6">{lineWidth}px</span>
                        </div>

                        <div class="flex items-center space-x-2">
                            <label class="px-3 py-1.5 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-700 font-bold text-xs border border-purple-200 cursor-pointer transition flex items-center gap-1">
                                🖼️ 平板上載圖片背景
                                <input type="file" accept="image/*" onChange={handleBgUpload} disabled={disabled} class="hidden" />
                            </label>
                        </div>
                    </div>

                    <div class="canvas-container relative w-full aspect-16-9 bg-white rounded-2xl overflow-hidden border-2 border-slate-300 shadow-inner">
                        <canvas 
                            ref={canvasRef}
                            width={1280}
                            height={720}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            class="w-full h-full object-contain cursor-crosshair"
                        />
                    </div>

                    {!disabled && onConfirm && (
                        <button 
                            type="button"
                            onClick={handleConfirm}
                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3.5 rounded-2xl shadow-lg transition active:scale-98 text-base flex items-center justify-center space-x-2"
                        >
                            <span>✅ 確認提交白板作品</span>
                        </button>
                    )}
                </div>
            );
        }

        // --- Teacher Demonstration Whiteboard Modal ---
        function TeacherDemoWhiteboardModal({ onClose, onBroadcast, isBroadcasting }) {
            const canvasRef = useRef(null);
            const [tool, setTool] = useState('pen');
            const [lineWidth, setLineWidth] = useState(4);
            const [isDrawing, setIsDrawing] = useState(false);
            const lastPos = useRef({ x: 0, y: 0 });

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 1280, 720);
            }, []);

            const getCanvasCoords = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = 1280 / rect.width;
                const scaleY = 720 / rect.height;
                let clientX = e.clientX;
                let clientY = e.clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }
                return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                setIsDrawing(true);
                lastPos.current = getCanvasCoords(e);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const pos = getCanvasCoords(e);

                ctx.beginPath();
                ctx.moveTo(lastPos.current.x, lastPos.current.y);
                ctx.lineTo(pos.x, pos.y);

                if (tool === 'eraser') {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.lineWidth = lineWidth * 3;
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = '#0f172a';
                    ctx.lineWidth = lineWidth;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                }

                ctx.stroke();
                lastPos.current = pos;
            };

            const [timerActive, setTimerActive] = useState(false);

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;

            // Filter active question responses

                });

            // Timer Interval Logic
            useEffect(() => {
                let interval = null;

            // Sync Room Doc
            const updateRoomDoc = async (payload) => {

                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

            // Download Template File (.docx)
            const handleDownloadChallengeTemplate = async () => {
                const sampleLines = [
                    "標題：地球生病了",
                    "總分: 100分",
                    "1.以下哪一項不是地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",

                    "B. 植物資源",
                    "C. 動物資源*",
                    "D. 礦產資源",
                    "",
                    "3.人們不當使用水資源會造成甚麼後果?",

                    "4.人們不當使用煤和石油資源會造成甚麼後果?",
                    "A. 引發極端天氣*",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應",
                    "",
                    "5.人們不當使用土地資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災*",
                    "C. 產生大量二氧化碳",
                    "D. 影響食水供應"
                ];

                try {
                    const blob = await createWordDocxBlob(sampleLines);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = '下載評估範本Word檔.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast("已成功下載 Word 評估範本檔 (.docx)！", "success");
                } catch (err) {
                    console.error("Docx creation error:", err);
                    showToast("無法下載 Word 範本檔", "error");
                }
            };

            // Word File Parser
            const handleWordFileUpload = (e, targetType = 'CHALLENGE') => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const arrayBuffer = evt.target.result;
                            const result = await window.mammoth.extractRawText({ arrayBuffer });
                            parsedData = parseWordChallengeText(result.value);
                        } else {
                            parsedData = parseWordChallengeText(evt.target.result);
                        }

                        if (targetType === 'CHALLENGE') setChallengeData(parsedData);
                        else setCoopData(parsedData);

                        showToast(`已成功解析 Word 範本！共 ${parsedData.questions.length} 題`, 'success');
                    } catch (err) {
                        console.error("Word file parse error:", err);
                        showToast("文件解析失敗，請檢查格式", "error");
                    }
                };

                if (file.name.endsWith('.docx')) reader.readAsArrayBuffer(file);
                else reader.readAsText(file, "UTF-8");
            };

            // Publish Active Question
            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                let challengeContent = null;

                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {

                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);

                updateRoomDoc({ activeQuestion: newQ, history: updatedHistory, coopState: null });
                showToast(`已成功發佈【${getModeLabel(selectedMode)}】給所有學生！`, 'success');
            };

            // Release Challenge Scores
            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await updateRoomDoc({ activeQuestion: updatedQ });
                showToast("已成功向全班發放挑戰題成績與解析！", "success");
            };

            // Broadcast Submission (Supports BOTH WhiteboardDRAW & Short Answer SHORT)
            const handleBroadcastSubmission = async (studentRes) => {
                const updatedQ = {
                    ...activeQuestion,
                    broadcastedSubmission: studentRes
                };
                await updateRoomDoc({ activeQuestion: updatedQ });
                showToast(studentRes ? `已廣播 ${studentRes.name} 的作品至全班螢幕進行互評！` : "已取消作品廣播", "info");
            };

            // Cooperative Mode Phase Handlers
            const handleCoopGoToGroupPhase = () => {
                if (!coopData || !coopData.questions || coopData.questions.length === 0) {
                    showToast("請先上載並確認合作題 Word 評估內容！", "error");
                    return;
                }

                if (studentsList.length < 3) {
                    showToast("合作題分組至少需要 3 位學生加入課堂！", "error");
                }

                const sortedStudents = [...studentsList].sort(() => Math.random() - 0.5);
                const totalStudents = sortedStudents.length;
                let groupCount = Math.max(1, Math.floor(totalStudents / 3));

                const animalTemplates = [
                    { name: '老虎組', emoji: '🐯', color: 'bg-amber-500' },
                    { name: '大象組', emoji: '🐘', color: 'bg-blue-500' },
                    { name: '企鵝組', emoji: '🐧', color: 'bg-cyan-500' },
                    { name: '藍鯨組', emoji: '🐋', color: 'bg-indigo-500' },
                    { name: '白兔組', emoji: '🐰', color: 'bg-rose-400' },
                    { name: '熊貓組', emoji: '🐼', color: 'bg-slate-700' },
                    { name: '獅子組', emoji: '🦁', color: 'bg-orange-500' },
                    { name: '白羊組', emoji: '🐑', color: 'bg-emerald-500' },
                    { name: '水牛組', emoji: '🐃', color: 'bg-teal-600' },
                    { name: '斑馬組', emoji: '🦓', color: 'bg-purple-600' }
                ].sort(() => Math.random() - 0.5);

                const groups = [];
                for (let i = 0; i < groupCount; i++) {
                    const template = animalTemplates[i % animalTemplates.length];
                    groups.push({
                        id: 'grp_' + i,
                        name: template.name,
                        emoji: template.emoji,
                        color: template.color,
                        members: [],
                        currentQIndex: 0,
                        isFinished: false
                    });
                }

                sortedStudents.forEach((stu, idx) => {
                    const gIdx = idx % groupCount;
                    groups[gIdx].members.push(stu);
                });

                const newCoopState = {
                    phase: 'GROUPING',
                    title: coopData.title,
                    questions: coopData.questions,
                    groups: groups,
                    winnerGroup: null
                };

                setCoopState(newCoopState);
                updateRoomDoc({ coopState: newCoopState, activeQuestion: null });
                showToast("已成功分組並向學生發送分組資訊！", "success");
            };

            const handleCoopStartMatch = () => {
                if (!coopState) return;
                const newCoopState = {
                    ...coopState,
                    phase: 'MATCH'
                };
                setCoopState(newCoopState);
                updateRoomDoc({ coopState: newCoopState });
                playSound('win');
                showToast("🏁 合作題比賽正式開始！", "success");
            };

            const handleCoopReset = (nextPhase) => {
                if (nextPhase === 'PREPARE') {
                    updateRoomDoc({ coopState: null });
                    setCoopState(null);
                } else if (nextPhase === 'GROUPING') {
                    handleCoopGoToGroupPhase();
                } else if (nextPhase === 'MATCH') {
                    const resetGroups = coopState.groups.map(g => ({
                        ...g, currentQIndex: 0, isFinished: false
                    }));
                    const newCoopState = {
                        ...coopState,
                        phase: 'MATCH',
                        groups: resetGroups,
                        winnerGroup: null
                    };
                    setCoopState(newCoopState);
                    updateRoomDoc({ coopState: newCoopState });
                }
            };

            // Teacher Demo Whiteboard Broadcast Handler
            const handleBroadcastTeacherWhiteboard = (imgData) => {
                setTeacherWhiteboardBroadcast(imgData);
                updateRoomDoc({ teacherWhiteboardBroadcast: imgData });
                if (imgData) showToast("已將示範白板廣播至全班螢幕！", "success");
                else showToast("已收回示範白板廣播", "info");
            };

            // Random Student Selector Spin
            const handleSpinRandom = () => {
                if (isSpinning) return;
                const start = parseInt(rangeStart) || 1;
                const end = parseInt(rangeEnd) || 36;
                const available = [];
                for (let i = start; i <= end; i++) {
                    if (!drawnNumbers.includes(i)) available.push(i);
                }

                if (available.length === 0) {
                    showToast("此範圍內所有學號皆已被抽出！請點擊重置。", "error");
                    return;
                }

                setIsSpinning(true);
                let counter = 0;
                const timer = setInterval(() => {
                    const temp = available[Math.floor(Math.random() * available.length)];
                    setCurrentDrawn(temp);
                    playSound('spin');
                    counter++;

                    if (counter >= 20) {
                        clearInterval(timer);
                        const finalPicked = available[Math.floor(Math.random() * available.length)];
                        setCurrentDrawn(finalPicked);
                        setDrawnNumbers(prev => [...prev, finalPicked]);
                        setIsSpinning(false);
                        playSound('win');
                    }
                }, 100);
            };

            // Export CSV Report
            const handleExportCSVReport = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生紀錄可供匯出！", "error");
                    return;
                }

                let csvContent = "\uFEFF";
                csvContent += "學號,學生姓名,加入時間";

                historyQuestions.forEach((q, idx) => {
                    if (q.mode === 'CHALLENGE' && q.challenge) {
                        csvContent += `,第${idx + 1}題[挑戰題:${q.challenge.title}得分],第${idx + 1}題[正確率]`;
                    } else {
                        csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]: "${(q.text || '').replace(/"/g, '""')}"`;
                    }
                });
                csvContent += "\n";

                const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

                sortedStudents.forEach((stu) => {
                    csvContent += `"${stu.seatNumber}號","${(stu.name || '').replace(/"/g, '""')}","${stu.joinTime || ''}"`;
                    
                    historyQuestions.forEach((q) => {
                        const resKey = `${q.id}_${stu.id}`;
                        const res = responses[resKey];
                        
                        if (res && res.answer !== undefined && res.answer !== null) {
                            if (q.mode === 'CHALLENGE' && res.scoreDetails) {
                                csvContent += `,"${res.scoreDetails.totalScore} / ${q.challenge.totalScore}分","${res.scoreDetails.percentage}% (用時:${res.duration || 0}s)"`;
                            } else {
                                let ansVal = res.answer;
                                if (typeof ansVal === 'string' && ansVal.startsWith('data:image')) ansVal = '[圖像白板作答]';
                                else if (typeof ansVal === 'string' && ansVal.startsWith('data:audio')) ansVal = '[語音錄音檔]';
                                csvContent += `,"${String(ansVal).replace(/"/g, '""')} (用時:${res.duration || 0}s)"`;
                            }
                        } else {
                            csvContent += q.mode === 'CHALLENGE' ? `,"未作答","0%"` : `,"未作答"`;
                        }
                    });
                    csvContent += "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `OMIT_課堂綜合評估報告_房號${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("已成功導出全班學習歷程 CSV 試算表！", "success");
            };

            // Leaderboard calculations with Gold, Silver, Bronze top 3 formatting
            const leaderboard = useMemo(() => {
                return Object.values(currentQuestionResponses)
                    .filter(r => r.duration !== undefined)
                    .sort((a, b) => {
                        if (activeQuestion?.mode === 'CHALLENGE') {
                            const scoreA = a.scoreDetails?.totalScore || 0;
                            const scoreB = b.scoreDetails?.totalScore || 0;
                            if (scoreB !== scoreA) return scoreB - scoreA;
                        }
                        return parseFloat(a.duration) - parseFloat(b.duration);
                    });
            }, [currentQuestionResponses, activeQuestion]);

            // Inspectable Submissions (Supports BOTH 'DRAW' Whiteboard AND 'SHORT' Short Answer)
            const inspectableSubmissions = useMemo(() => {
                if (!activeQuestion) return [];
                if (activeQuestion.mode === 'DRAW') {
                    return leaderboard.filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:image'));
                }
                if (activeQuestion.mode === 'SHORT') {
                    return leaderboard.filter(r => r.answer !== undefined && r.answer !== null && String(r.answer).trim() !== '');
                }
                return leaderboard;
            }, [leaderboard, activeQuestion]);

            return (
                <div class="min-h-screen pb-12">
                    {/* Header */}
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 py-3">
                        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                            <div class="flex items-center space-x-3">
                                <div class="bg-indigo-600 text-white font-black px-3 py-1.5 rounded-xl text-lg shadow-sm">OMIT</div>
                                <div>
                                    <h1 class="font-extrabold text-slate-800 text-base flex items-center gap-2">
                                        宣道會陳元喜小學OMIT互動課堂
                                        <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-0.5 rounded-full font-mono font-bold">
                                            房號：{roomCode}
                                        </span>
                                    </h1>
                                </div>
                            </div>

                            <div class="flex flex-wrap items-center gap-2">
                                <button 
                                    onClick={() => setShowQRModal(true)}
                                    class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-2 rounded-xl border border-indigo-200 text-xs md:text-sm flex items-center space-x-1.5 transition"
                                >
                                    <span>📱 QR Code</span>
                                </button>

                                <button 
                                    onClick={() => setShowStudentListModal(true)}
                                    class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold px-3 py-2 rounded-xl border border-emerald-200 text-xs md:text-sm flex items-center space-x-1.5 transition"
                                >
                                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                                    <span>在線學生：{studentsList.length} 人</span>
                                </button>

                                <button 
                                    onClick={() => setShowRandomModal(true)}
                                    class="bg-purple-50 hover:bg-purple-100 text-purple-700 font-bold px-3 py-2 rounded-xl border border-purple-200 text-xs md:text-sm transition"
                                >
                                    🎲 抽選學生
                                </button>

                                <button 
                                    onClick={() => setShowTeacherWhiteboardModal(true)}
                                    class={`px-3 py-2 rounded-xl border text-xs md:text-sm font-bold flex items-center space-x-1 transition ${
                                        teacherWhiteboardBroadcast 
                                        ? 'bg-purple-600 text-white border-purple-700 animate-pulse' 
                                        : 'bg-purple-50 hover:bg-purple-100 text-purple-800 border-purple-200'
                                    }`}
                                >
                                    <span>🎨 示範白板</span>
                                </button>

                                <button 
                                    onClick={() => setShowTimerModal(true)}
                                    class={`px-3 py-2 rounded-xl border text-xs md:text-sm font-bold flex items-center space-x-1.5 transition ${
                                        timerActive 
                                        ? 'bg-amber-500 text-white border-amber-600 animate-pulse' 
                                        : 'bg-amber-50 hover:bg-amber-100 text-amber-800 border-amber-200'
                                    }`}
                                >
                                    <span>⏱️ 計時器</span>
                                    {timerSeconds > 0 && (
                                        <span class="bg-white/20 font-mono text-xs px-1.5 py-0.5 rounded">
                                            {Math.floor(timerSeconds / 60)}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                        </span>
                                    )}
                                </button>

                                <button 
                                    onClick={handleExportCSVReport}
                                    class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold px-3 py-2 rounded-xl border border-blue-200 text-xs md:text-sm transition"
                                >
                                    📊 匯出報告
                                </button>

                                <button 
                                    onClick={handleExitRoom}
                                    class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2 rounded-xl border border-rose-200 text-xs md:text-sm transition"
                                >
                                    🚪 退出課室
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

                        {/* Mode Selectors */}
                        <div class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-9 gap-2.5">
                            {[
                                { id: 'CHOICE', label: '選擇題', icon: '🔘' },
                                { id: 'TF', label: '是非題', icon: '⭕' },
                                { id: 'SHORT', label: '短答題', icon: '✍️' },
                                { id: 'DRAW', label: '白板題', icon: '🎨' },
                                { id: 'BUZZER', label: '搶答題', icon: '🚨' },
                                { id: 'AUDIO', label: '錄音題', icon: '🎤' },
                                { id: 'CHALLENGE', label: '挑戰題', icon: '🏆' },
                                { id: 'COOP', label: '合作題', icon: '🤝' },
                                { id: 'LINK', label: '派送連結', icon: '🔗' }
                            ].map((mode) => (
                                <button 
                                    key={mode.id}
                                    onClick={() => setSelectedMode(mode.id)}
                                    class={`p-3 rounded-2xl font-bold border-2 transition-all text-center flex flex-col items-center justify-center space-y-1 shadow-sm active:scale-95 ${
                                        selectedMode === mode.id 
                                        ? 'bg-slate-900 text-white border-slate-900 ring-4 ring-slate-200' 
                                        : 'bg-white text-slate-700 border-slate-200 hover:border-slate-300 hover:bg-slate-50'
                                    }`}
                                >
                                    <span class="text-xl">{mode.icon}</span>
                                    <span class="text-xs font-black">{mode.label}</span>
                                </button>
                            ))}
                        </div>

                        {/* Cooperative Mode ("合作題") Panel */}
                        {selectedMode === 'COOP' && (
                            <div class="bg-gradient-to-r from-emerald-50 via-teal-50 to-cyan-50 border-2 border-emerald-200 p-6 rounded-3xl space-y-6">
                                <div class="flex items-center justify-between border-b border-emerald-200 pb-3">
                                    <h3 class="font-black text-emerald-950 text-xl flex items-center gap-2">
                                        <span>🤝 合作題互動模式</span>
                                        <span class="text-xs bg-emerald-200 text-emerald-800 px-3 py-1 rounded-full">
                                            當前階段：{coopState ? (coopState.phase === 'GROUPING' ? '2. 分組階段' : '3. 比賽階段') : '1. 預備階段'}
                                        </span>
                                    </h3>

                                    {coopState && (
                                        <div class="flex items-center space-x-2">
                                            <button 
                                                onClick={() => handleCoopReset('PREPARE')}
                                                class="px-3 py-1.5 bg-white hover:bg-slate-100 text-slate-700 font-bold text-xs rounded-xl border border-slate-200"
                                            >
                                                返回預備階段
                                            </button>
                                        </div>
                                    )}
                                </div>

                                {/* Phase 1: PREPARE */}
                                {(!coopState || coopState.phase === 'PREPARE') && (
                                    <div class="space-y-4">
                                        <div class="flex flex-wrap items-center justify-between gap-3">
                                            <p class="text-sm font-bold text-emerald-900">
                                                請上載 Word 評估範本檔，系統將會將題目的「問題」與「答案選項」隨機分散派發至組員各自的螢幕，需要小組溝通合作作答！
                                            </p>
                                            <button 
                                                onClick={handleDownloadChallengeTemplate}
                                                class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow transition"
                                            >
                                                📄 下載評估範本Word檔
                                            </button>
                                        </div>

                                        <input 
                                            type="file" 
                                            accept=".docx,.txt"
                                            onChange={(e) => handleWordFileUpload(e, 'COOP')}
                                            class="block w-full text-xs text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 cursor-pointer bg-white p-2 rounded-2xl border"
                                        />

                                        {coopData && (
                                            <div class="bg-white p-4 rounded-2xl border border-emerald-200 space-y-3">
                                                <div class="font-black text-emerald-900 text-sm">✏️ 教師編輯/確認評估內容 ({coopData.questions.length} 題)：</div>
                                                <div class="space-y-2 max-h-60 overflow-y-auto pr-1">
                                                    {coopData.questions.map((q, qIdx) => (
                                                        <div key={qIdx} class="p-3 bg-slate-50 rounded-xl border text-xs space-y-1">
                                                            <div class="font-bold text-slate-800">第 {q.num} 題: {q.text} (正確答案: {q.answer})</div>
                                                        </div>
                                                    ))}
                                                </div>
                                                <button 
                                                    onClick={handleCoopGoToGroupPhase}
                                                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3.5 rounded-2xl shadow-lg transition text-base"
                                                >
                                                    進入下一步：隨機分組 (進入「分組」階段) ➡️
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Phase 2: GROUPING */}
                                {coopState && coopState.phase === 'GROUPING' && (
                                    <div class="space-y-5">
                                        <div class="flex items-center justify-between">
                                            <span class="font-black text-slate-800 text-base">自動隨機分組結果 (每組3-4人)：</span>
                                            <button 
                                                onClick={handleCoopGoToGroupPhase}
                                                class="px-4 py-2 bg-white hover:bg-slate-50 text-emerald-700 font-bold text-xs rounded-xl border border-emerald-200 shadow-sm"
                                            >
                                                🔄 重新分配組別
                                            </button>
                                        </div>

                                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            {coopState.groups.map((grp) => (
                                                <div key={grp.id} class="bg-white p-4 rounded-2xl border-2 border-emerald-100 shadow-sm space-y-2">
                                                    <div class="flex items-center justify-between">
                                                        <span class={`px-3 py-1 text-white font-black text-xs rounded-lg ${grp.color}`}>
                                                            {grp.emoji} {grp.name}
                                                        </span>
                                                        <span class="text-xs font-bold text-slate-400">{grp.members.length} 人</span>
                                                    </div>
                                                    <div class="flex flex-wrap gap-1 pt-1">
                                                        {grp.members.map(m => (
                                                            <span key={m.id} class="px-2 py-1 bg-slate-100 rounded-md text-xs font-bold text-slate-700">
                                                                {m.seatNumber}號 {m.name}
                                                            </span>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        <button 
                                            onClick={handleCoopStartMatch}
                                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-xl transition text-lg animate-bounce"
                                        >
                                            🏁 開始比賽 (進入「比賽」階段)
                                        </button>
                                    </div>
                                )}

                                {/* Phase 3: MATCH */}
                                {coopState && coopState.phase === 'MATCH' && (
                                    <div class="space-y-6">
                                        <div class="bg-white p-4 rounded-2xl border border-emerald-200 space-y-4">
                                            <h4 class="font-black text-slate-800 text-sm">📊 各組答題進度棒形圖 (走馬燈著色推進)：</h4>
                                            
                                            <div class="space-y-3">
                                                {coopState.groups.map((grp) => {
                                                    const totalQs = coopState.questions.length;
                                                    const pct = Math.round((grp.currentQIndex / totalQs) * 100);

                                                    return (
                                                        <div key={grp.id} class="space-y-1">
                                                            <div class="flex justify-between text-xs font-bold">
                                                                <span>{grp.emoji} {grp.name} ({grp.members.map(m => m.name).join(', ')})</span>
                                                                <span class="font-mono">{grp.currentQIndex} / {totalQs} 題 ({pct}%)</span>
                                                            </div>
                                                            <div class="h-6 bg-slate-100 rounded-xl overflow-hidden border p-0.5 relative">
                                                                <div 
                                                                    class={`h-full rounded-lg transition-all duration-500 ${grp.color}`} 
                                                                    style={{ width: `${pct}%` }}
                                                                ></div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>

                                        {coopState.winnerGroup && (
                                            <div class="bg-amber-100 border-4 border-amber-400 p-6 rounded-3xl text-center space-y-4 shadow-xl animate-bounce">
                                                <div class="text-5xl">🏆</div>
                                                <h3 class="text-3xl font-black text-amber-900">
                                                    恭喜【{coopState.winnerGroup.emoji} {coopState.winnerGroup.name}】榮獲冠軍勝出！
                                                </h3>
                                                <div class="text-sm font-bold text-amber-800">
                                                    獲勝組員：{coopState.winnerGroup.members.map(m => `${m.seatNumber}號 ${m.name}`).join('、')}
                                                </div>

                                                <div class="flex justify-center space-x-3 pt-2">

                                <div class="grid grid-cols-3 gap-2">
                                    {[30, 60, 120, 180, 240, 300].map((sec) => (
                                        <button 
                                            key={sec}
                                            onClick={() => { setTimerSeconds(sec); setTimerActive(true); }}
                                            class="py-2 bg-amber-50 hover:bg-amber-100 text-amber-800 font-bold text-xs rounded-xl border border-amber-200"
                                        >
                                            {sec < 60 ? `${sec}秒` : `${sec / 60}分鐘`}
                                        </button>
                                    ))}

                                {/* Custom time input */}
                                <div class="flex items-center justify-center space-x-2 bg-slate-50 p-2 rounded-xl border">
                                    <span class="text-xs font-bold text-slate-600">自訂時間 (分:秒)：</span>
                                    <input 
                                        type="text" maxLength={2} value={customTimerMin}

                                    <span>:</span>

                                        type="text" maxLength={2} value={customTimerSec}

                                    />
                                    <button 
                                        onClick={() => {
                                            const total = (parseInt(customTimerMin) || 0) * 60 + (parseInt(customTimerSec) || 0);
                                            setTimerSeconds(total);
                                            setTimerActive(true);
                                        }}
                                        class="px-3 py-1 bg-amber-600 text-white rounded-lg text-xs font-bold"
                                    >

                                <div class="flex space-x-2">

                    {/* Teacher Demonstration Whiteboard Modal */}
