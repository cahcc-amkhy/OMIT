    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Web Audio Synthesizer for Buzzer and Timer Alarm (No external audio file dependency)
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (type === 'buzz') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1); // A5
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'alarm') {
                    for (let i = 0; i < 3; i++) {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(880, ctx.currentTime + i * 0.2);
                        gain.gain.setValueAtTime(0.4, ctx.currentTime + i * 0.2);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.2 + 0.15);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + i * 0.2);
                        osc.stop(ctx.currentTime + i * 0.2 + 0.15);
                    }
                }
            } catch (e) {
                console.log("Audio play error:", e);
            }
        };

        // Custom Toast Notification Component
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (
                <div class={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-xl shadow-lg flex items-center space-x-2 text-sm font-medium animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        function OMITApp() {
            const [role, setRole] = useState('LANDING'); // 'LANDING', 'TEACHER', 'STUDENT'
            const [roomCode, setRoomCode] = useState('');
            const [seatNumber, setSeatNumber] = useState('1'); // Revision 12: Seat number 1-36
            const [studentName, setStudentName] = useState('');
            const [toast, setToast] = useState(null);
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [fbReady, setFbReady] = useState(false);
            const [userAuth, setUserAuth] = useState(null);

            const myStudentId = useRef('std_' + Math.random().toString(36).substring(2, 9));

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            // Authenticate with Firebase Anonymously on startup
            useEffect(() => {
                const initFb = async () => {
                    if (window.FirebaseSDK) {
                        try {
                            const res = await window.FirebaseSDK.signInAnonymously(window.FirebaseAuth);
                            setUserAuth(res.user);
                            setFbReady(true);
                        } catch (err) {
                            console.error("Firebase auth error:", err);
                            setFbReady(true);
                        }
                    } else {
                        setTimeout(initFb, 300);
                    }
                };
                initFb();
            }, []);

            // Check URL parameters for direct room joining
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const roomParam = params.get('room');
                if (roomParam) {
                    setRoomCode(roomParam.toUpperCase());
                }
            }, []);

            // Handle Teacher login attempt with password check (Revision 14: Password "8030")
            const handleTeacherClick = () => {
                setPasswordInput('');
                setShowPasswordModal(true);
            };

            const handlePasswordSubmit = (e) => {
                e.preventDefault();
                if (passwordInput === '8030') {
                    setShowPasswordModal(false);
                    const generatedCode = roomCode || Math.floor(100000 + Math.random() * 900000).toString();
                    setRoomCode(generatedCode);
                    setRole('TEACHER');
                    showToast(`已成功進入教師控制台 (房號：${generatedCode})`, 'success');
                } else {
                    showToast('密碼錯誤！請重新輸入', 'error');
                    setPasswordInput('');
                }
            };

            // Handle Student Join (Revision 12: mandatory seat selection 1-36, name optional)
            const handleJoinRoom = (e) => {
                e?.preventDefault();
                if (!roomCode.trim()) {
                    showToast('請輸入6位數字房號', 'error');
                    return;
                }
                setRole('STUDENT');
                showToast(`學號 ${seatNumber} 已成功進入課堂 ${roomCode}`, 'success');
            };

            if (role === 'LANDING') {
                return (
                    <div class="min-h-screen bg-gradient-to-br from-indigo-900 via-indigo-800 to-purple-900 flex items-center justify-center p-4">
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                        
                        <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 space-y-6 relative overflow-hidden">
                            <div class="text-center space-y-2">
                                <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl mb-2 font-black text-2xl shadow-inner">
                                    OMIT
                                </div>
                                <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">OMIT 互動課堂</h1>

                            </div>

                            {/* Student Join Form */}
                            <form onSubmit={handleJoinRoom} class="bg-indigo-50/80 p-5 rounded-2xl border border-indigo-100 space-y-4">
                                <h2 class="text-xs font-bold text-indigo-600 uppercase tracking-wider">學生加入課堂</h2>
                                
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">課堂房號</label>
                                    <input 
                                        type="text" 
                                        placeholder="請輸入房號 (例: 123456)" 
                                        value={roomCode} 
                                        onChange={(e) => setRoomCode(e.target.value)}
                                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-mono text-center tracking-widest text-lg font-bold"
                                        maxLength={6}
                                        required
                                    />
                                </div>

                                {/* Revision 12: Dropdown seat number 1 to 36 */}
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">選擇學生學號 (1 - 36)*</label>
                                    <select 
                                        value={seatNumber} 
                                        onChange={(e) => setSeatNumber(e.target.value)}
                                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-bold text-slate-700"
                                        required
                                    >
                                        {Array.from({ length: 36 }, (_, i) => i + 1).map(num => (
                                            <option key={num} value={num.toString()}>
                                                {num} 號學生
                                            </option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">學生姓名 (可留空)</label>
                                    <input 
                                        type="text" 
                                        placeholder="請輸入您的姓名 (選填)" 
                                        value={studentName} 
                                        onChange={(e) => setStudentName(e.target.value)}
                                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-medium"
                                    />
                                </div>

                                <button 
                                    type="submit" 
                                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-200 active:scale-98"
                                >
                                    進入課堂 🚀
                                </button>
                            </form>

                            <div class="relative flex py-1 items-center">
                                <div class="flex-grow border-t border-slate-200"></div>
                                <span class="flex-shrink mx-4 text-slate-400 text-xs font-medium">或</span>
                                <div class="flex-grow border-t border-slate-200"></div>
                            </div>

                            {/* Teacher Entry Button */}
                            <div class="text-center">
                                <button 
                                    onClick={handleTeacherClick}
                                    class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl transition shadow-md flex items-center justify-center space-x-2 active:scale-98"
                                >
                                    <span>👨‍🏫 教師管理員控制台</span>
                                </button>
                                <p class="text-xs text-slate-400 mt-2">進入教師頁面需進行身分密碼驗證</p>
                            </div>
                        </div>

                        {/* Revision 14: Password Modal with NO placeholder/text hint */}
                        {showPasswordModal && (
                            <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4">
                                    <h3 class="text-lg font-bold text-slate-800 text-center">請輸入教師權限密碼</h3>
                                    <form onSubmit={handlePasswordSubmit} class="space-y-4">
                                        <input 
                                            type="password" 
                                            value={passwordInput} 
                                            onChange={(e) => setPasswordInput(e.target.value)}
                                            class="w-full px-4 py-3 border border-slate-300 rounded-xl text-center text-2xl font-mono focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                            autoFocus
                                            required
                                        />
                                        <div class="flex space-x-2">
                                            <button 
                                                type="button" 
                                                onClick={() => setShowPasswordModal(false)}
                                                class="flex-1 py-3 border border-slate-200 rounded-xl text-slate-600 font-semibold hover:bg-slate-50"
                                            >
                                                取消
                                            </button>
                                            <button 
                                                type="submit" 
                                                class="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 shadow"
                                            >
                                                確認登入
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            if (role === 'TEACHER') {
                return (
                    <TeacherDashboard 
                        roomCode={roomCode} 
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            if (role === 'STUDENT') {
                return (
                    <StudentInterface 
                        roomCode={roomCode}
                        seatNumber={seatNumber}
                        studentName={studentName || `${seatNumber}號學生`}
                        studentId={myStudentId.current}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            return null;
        }

        function TeacherDashboard({ roomCode, showToast, onExit }) {
            const [roomState, setRoomState] = useState({ activeQuestion: null, allowEdit: false, peerReview: null, pushLink: null });
            const [responses, setResponses] = useState({});
            const [students, setStudents] = useState([]);
            
            // UI Modals
            const [showQRModal, setShowQRModal] = useState(false);
            const [showStudentListModal, setShowStudentListModal] = useState(false);
            const [showTimerModal, setShowTimerModal] = useState(false);
            const [showRandomPicker, setShowRandomPicker] = useState(false);
            const [showWhiteboardConfig, setShowWhiteboardConfig] = useState(false);
            const [showPushLinkModal, setShowPushLinkModal] = useState(false);
            const [selectedBarOption, setSelectedBarOption] = useState(null); // Revision 8
            const [zoomStudentResponse, setZoomStudentResponse] = useState(null); // Revision 3
            
            // Question creation inputs
            const [questionText, setQuestionText] = useState('');
            const [whiteboardBg, setWhiteboardBg] = useState(null); // Revision 2
            const [pushUrlInput, setPushUrlInput] = useState('');
            
            // Revision 15: Timer State
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerRunning, setTimerRunning] = useState(false);
            const [timerMax, setTimerMax] = useState(0);
            const [customTimerInput, setCustomTimerInput] = useState('');
            const [isTimerEnlarged, setIsTimerEnlarged] = useState(false);

            // Revision 11: Random Student Picker State
            const [pickerRangeStart, setPickerRangeStart] = useState(1);
            const [pickerRangeEnd, setPickerRangeEnd] = useState(36);
            const [pickedHistory, setPickedHistory] = useState([]);
            const [currentPicked, setCurrentPicked] = useState(null);
            const [isPicking, setIsPicking] = useState(false);

            // Firestore Room Document & Subcollection Listeners
            useEffect(() => {
                if (!window.FirebaseSDK || !roomCode) return;
                const { doc, onSnapshot, collection } = window.FirebaseSDK;
                const db = window.FirebaseDB;

                // Path: /artifacts/omit-8c173/public/data/rooms/{roomCode}
                const roomRef = doc(db, 'artifacts', 'omit-8c173', 'public', 'data', 'rooms', roomCode);
                const unsubRoom = onSnapshot(roomRef, (snapshot) => {
                    if (snapshot.exists()) {
                        setRoomState(snapshot.data());
                    } else {
                        // Initialize room if not exists
                        setDoc(roomRef, { activeQuestion: null, allowEdit: false, peerReview: null, pushLink: null, createdAt: Date.now() });
                    }
                });

                // Listen to Responses Subcollection
                const respRef = collection(db, 'artifacts', 'omit-8c173', 'public', 'data', 'rooms', roomCode, 'responses');
                const unsubResponses = onSnapshot(respRef, (snapshot) => {
                    const respData = {};
                    snapshot.forEach(docSnap => {
                        respData[docSnap.id] = docSnap.data();
                    });
                    setResponses(respData);
                });

                // Listen to Online Students Subcollection (Revision 1)
                const stdRef = collection(db, 'artifacts', 'omit-8c173', 'public', 'data', 'rooms', roomCode, 'students');
                const unsubStudents = onSnapshot(stdRef, (snapshot) => {
                    const stdList = [];
                    const now = Date.now();
                    snapshot.forEach(docSnap => {
                        const data = docSnap.data();
                        // Filter out inactive students (heartbeat > 30s)
                        if (now - (data.lastSeen || 0) < 30000) {
                            stdList.push(data);
                        }
                    });
                    setStudents(stdList);
                });

                return () => {
                    unsubRoom();
                    unsubResponses();
                    unsubStudents();
                };
            }, [roomCode]);

            // Revision 15: Timer Interval logic
            useEffect(() => {
                let interval = null;
                if (timerRunning && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(prev => {
                            if (prev <= 1) {
                                setTimerRunning(false);
                                playSound('alarm');
                                showToast('⏱️ 計時時間到！', 'info');
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [timerRunning, timerSeconds]);

            const startTimer = (seconds) => {
                setTimerSeconds(seconds);
                setTimerMax(seconds);
                setTimerRunning(true);
            };

            // Revision 6: Purge all Firebase cache / temporary records upon exit
            const handleExitPurge = async () => {
                if (!window.FirebaseSDK) {
                    onExit();
                    return;
                }
                try {
                    const { doc, deleteDoc, collection, getDocs } = window.FirebaseSDK;
                    const db = window.FirebaseDB;

                    // Delete responses subcollection
                    const respSnap = await getDocs(collection(db, 'artifacts', 'omit-8c173', 'public', 'data', 'rooms', roomCode, 'responses'));
                    respSnap.forEach(async (d) => await deleteDoc(d.ref));

                    // Delete students subcollection
                    const stdSnap = await getDocs(collection(db, 'artifacts', 'omit-8c173', 'public', 'data', 'rooms', roomCode, 'students'));
                    stdSnap.forEach(async (d) => await deleteDoc(d.ref));

                    // Delete history subcollection
                    const histSnap = await getDocs(collection(db, 'artifacts', 'omit-8c173', 'public', 'data', 'rooms', roomCode, 'history'));
                    histSnap.forEach(async (d) => await deleteDoc(d.ref));

                    // Delete room document
                    await deleteDoc(doc(db, 'artifacts', 'omit-8c173', 'public', 'data', 'rooms', roomCode));

                    showToast('已清空課室暫存數據並退出', 'info');
                } catch (e) {
                    console.error("Purge error:", e);
                }
                onExit();
            };

            const publishQuestion = async (mode, customData = {}) => {
                if (!window.FirebaseSDK) return;
                const { doc, setDoc, deleteDoc, collection, getDocs } = window.FirebaseSDK;
                const db = window.FirebaseDB;

                // Clear existing responses for the room
                const respSnap = await getDocs(collection(db, 'artifacts', 'omit-8c173', 'public', 'data', 'rooms', roomCode, 'responses'));
                respSnap.forEach(async (d) => await deleteDoc(d.ref));

                const qId = 'q_' + Date.now();
                const newQuestion = {
                    id: qId,
                    mode: mode, // 'CHOICE', 'TF', 'SHORT', 'DRAW', 'BUZZ', 'LINK'
                    text: questionText.trim() || getDefaultModeTitle(mode),
                    startTime: Date.now(),
                    ...customData
                };

                const roomRef = doc(db, 'artifacts', 'omit-8c173', 'public', 'data', 'rooms', roomCode);
                await setDoc(roomRef, {
                    activeQuestion: newQuestion,
                    allowEdit: false, // Revision 4: Default lock student editing
                    peerReview: null,
                    pushLink: null
                }, { merge: true });

                // Save to history collection for report export (Revision 13)
                const histDocRef = doc(db, 'artifacts', 'omit-8c173', 'public', 'data', 'rooms', roomCode, 'history', qId);
                await setDoc(histDocRef, { ...newQuestion });

                setQuestionText('');
                showToast(`已成功發佈【${getDefaultModeTitle(mode)}】給全班！`, 'success');
            };

            const getDefaultModeTitle = (mode) => {
                switch(mode) {
                    case 'CHOICE': return '請選擇正確答案';
                    case 'TF': return '請判斷對錯 (是非題)';
                    case 'SHORT': return '請回答短答題';
                    case 'DRAW': return '請在白板繪圖解題';
                    case 'BUZZ': return '搶答開始！請盡快按鈕搶答';
                    case 'LINK': return '教師派送網頁/影片連結';
                    default: return '課堂互動題目';
                }
            };

            // Revision 4: Toggle student edit allowance
            const toggleAllowEdit = async () => {
                const { doc, updateDoc } = window.FirebaseSDK;
                const db = window.FirebaseDB;
                const newAllow = !roomState.allowEdit;
                await updateDoc(doc(db, 'artifacts', 'omit-8c173', 'public', 'data', 'rooms', roomCode), {
                    allowEdit: newAllow
                });
                showToast(newAllow ? '已開放學生修改答案' : '已鎖定學生答案，不允許修改', 'info');
            };

            // Revision 3: Broadcast a student answer for peer review
            const broadcastPeerReview = async (studentResponse) => {
                const { doc, updateDoc } = window.FirebaseSDK;
                const db = window.FirebaseDB;
                await updateDoc(doc(db, 'artifacts', 'omit-8c173', 'public', 'data', 'rooms', roomCode), {
                    peerReview: studentResponse
                });
                showToast(`已將 ${studentResponse.seatNumber} 號學生的作品推送到全班頁面`, 'success');
            };

            const clearPeerReview = async () => {
                const { doc, updateDoc } = window.FirebaseSDK;
                const db = window.FirebaseDB;
                await updateDoc(doc(db, 'artifacts', 'omit-8c173', 'public', 'data', 'rooms', roomCode), {
                    peerReview: null
                });
                showToast('已結束廣播互評', 'info');
            };

            // Revision 10: Push URL link
            const handlePushLinkSubmit = async (e) => {
                e.preventDefault();
                if (!pushUrlInput.trim()) return;
                await publishQuestion('LINK', { url: pushUrlInput.trim() });
                setShowPushLinkModal(false);
                setPushUrlInput('');
            };

            // Revision 11: Random Student Picker Logic
            const pickRandomStudent = () => {
                setIsPicking(true);
                const start = parseInt(pickerRangeStart) || 1;
                const end = parseInt(pickerRangeEnd) || 36;
                
                const available = [];
                for (let i = start; i <= end; i++) {
                    if (!pickedHistory.includes(i)) {
                        available.push(i);
                    }
                }

                if (available.length === 0) {
                    showToast('該範圍內的學號已被全部抽選完畢！', 'error');
                    setIsPicking(false);
                    return;
                }

                let counter = 0;
                const interval = setInterval(() => {
                    const temp = available[Math.floor(Math.random() * available.length)];
                    setCurrentPicked(temp);
                    counter++;
                    if (counter > 15) {

                                            class="absolute top-2 right-2 bg-red-500 text-white rounded-full text-xs px-2 py-1"
                                        >
                                            清除背景
                                        </button>
                                    </div>
                                )}

                                <div class="flex space-x-2 pt-2">
                                    <button 
                                        onClick={() => setShowWhiteboardConfig(false)}
                                        class="flex-1 py-3 border border-slate-200 rounded-xl text-slate-600 font-bold"
                                    >
                                        取消
                                    </button>
                                    <button 
                                        onClick={() => {
                                            publishQuestion('DRAW', { bgImage: whiteboardBg });
                                            setShowWhiteboardConfig(false);
                                        }}
                                        class="flex-1 py-3 bg-purple-600 text-white rounded-xl font-bold hover:bg-purple-700 shadow"
                                    >
                                        立即發佈白板
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Revision 3: Zoom Whiteboard Response Modal & Peer Review Broadcast */}
                    {zoomStudentResponse && (
                        <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 w-full max-w-2xl shadow-2xl space-y-4 relative flex flex-col max-h-[90vh]">
                                <div class="flex items-center justify-between border-b pb-3">
                                    <h3 class="text-lg font-bold text-slate-800">
                                        放大作品：{zoomStudentResponse.seatNumber} 號學生 ({zoomStudentResponse.studentName})
                                    </h3>
                                    <button onClick={() => setZoomStudentResponse(null)} class="text-slate-400 font-bold text-xl">✕</button>
                                </div>

                                <div class="flex-1 relative bg-slate-100 rounded-2xl overflow-hidden flex items-center justify-center border min-h-[300px]">
                                    {roomState.activeQuestion?.bgImage && (
                                        <img src={roomState.activeQuestion.bgImage} class="absolute inset-0 w-full h-full object-contain opacity-50" />
                                    )}
                                    <img src={zoomStudentResponse.answer} class="relative z-10 max-h-full object-contain" />
                                </div>

                                <div class="flex items-center justify-between gap-2 pt-2">
                                    {/* Prev / Next buttons */}
                                    <div class="flex space-x-2">
                                        <button 
                                            onClick={() => {
                                                const idx = sortedResponses.findIndex(r => r.studentId === zoomStudentResponse.studentId);
                                                if (idx > 0) setZoomStudentResponse(sortedResponses[idx - 1]);
                                            }}
                                            class="px-4 py-2 bg-slate-200 rounded-xl font-bold text-xs hover:bg-slate-300"
                                        >
                                            ◀ 上一位學生
                                        </button>
                                        <button 
                                            onClick={() => {
                                                const idx = sortedResponses.findIndex(r => r.studentId === zoomStudentResponse.studentId);
                                                if (idx >= 0 && idx < sortedResponses.length - 1) setZoomStudentResponse(sortedResponses[idx + 1]);
                                            }}
                                            class="px-4 py-2 bg-slate-200 rounded-xl font-bold text-xs hover:bg-slate-300"
                                        >
                                            下一位學生 ▶
                                        </button>
                                    </div>

                                    {/* Peer review broadcast button */}
                                    <button 
                                        onClick={() => broadcastPeerReview(zoomStudentResponse)}
                                        class="px-5 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold text-xs rounded-xl shadow hover:opacity-90 transition"
                                    >
                                        📢 傳送此作品至全班 (學生互評)
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Revision 10: Push Link Modal */}
                    {showPushLinkModal && (
                        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl space-y-4">
                                <h3 class="text-lg font-bold text-slate-800">派送網頁 / YouTube 影片連結</h3>
                                <form onSubmit={handlePushLinkSubmit} class="space-y-4">
                                    <input 
                                        type="url" 
                                        placeholder="請貼上網頁或 YouTube 影片 URL" 
                                        value={pushUrlInput} 
                                        onChange={(e) => setPushUrlInput(e.target.value)}
                                        class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm"
                                        required
                                    />
                                    <div class="flex space-x-2">
                                        <button type="button" onClick={() => setShowPushLinkModal(false)} class="flex-1 py-3 border rounded-xl text-slate-600 font-bold">
                                            取消
                                        </button>
                                        <button type="submit" class="flex-1 py-3 bg-sky-600 text-white font-bold rounded-xl hover:bg-sky-700">
                                            發佈派送
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Revision 11: Random Student Picker Modal */}
                    {showRandomPicker && (
                        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl space-y-5 text-center">
                                <h3 class="text-xl font-bold text-slate-800">🎲 課堂抽選學生學號</h3>
                                
                                <div class="flex items-center justify-center space-x-2 text-sm font-bold text-slate-600">
                                    <span>範圍:</span>
                                    <input type="number" min="1" max="36" value={pickerRangeStart} onChange={(e) => setPickerRangeStart(e.target.value)} class="w-16 border rounded-lg py-1 px-2 text-center" />
                                    <span>至</span>
                                    <input type="number" min="1" max="36" value={pickerRangeEnd} onChange={(e) => setPickerRangeEnd(e.target.value)} class="w-16 border rounded-lg py-1 px-2 text-center" />
                                </div>

                                <div class="bg-slate-100 rounded-2xl p-8 border border-slate-200">
                                    <div class="text-6xl font-black text-purple-600 font-mono">
                                        {currentPicked !== null ? `${currentPicked} 號` : '---'}
                                    </div>
                                </div>

                                <div class="flex space-x-2">
                                    <button 
                                        onClick={pickRandomStudent} 
                                        disabled={isPicking}
                                        class="flex-1 py-3.5 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl shadow transition"
                                    >
                                        {isPicking ? '抽選中...' : '🎯 開始抽選'}
                                    </button>
                                    <button 
                                        onClick={() => { setPickedHistory([]); setCurrentPicked(null); showToast('已重設已被抽選紀錄', 'info'); }}
                                        class="py-3.5 px-4 bg-slate-200 text-slate-700 font-bold rounded-xl"
                                    >
                                        重設歷史
                                    </button>
                                </div>

                                <button onClick={() => setShowRandomPicker(false)} class="w-full py-2.5 border rounded-xl text-slate-500 font-bold text-sm">
                                    關閉
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Revision 15: Teacher Timer Modal & Presets */}
                    {showTimerModal && (
                        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class={`bg-white rounded-3xl p-6 shadow-2xl transition-all space-y-6 text-center ${isTimerEnlarged ? 'w-full max-w-2xl' : 'w-full max-w-md'}`}>
                                <div class="flex items-center justify-between border-b pb-3">
                                    <h3 class="text-lg font-bold text-slate-800">⏱️ 課堂倒數計時器</h3>
                                    <button onClick={() => setIsTimerEnlarged(!isTimerEnlarged)} class="text-xs bg-slate-100 text-slate-700 font-bold px-3 py-1 rounded-lg">
                                        {isTimerEnlarged ? '縮小' : '🔍 放大顯示'}
                                    </button>
                                </div>

                                {/* Timer Large Clock Display */}
                                <div class="bg-slate-900 text-emerald-400 font-mono rounded-3xl p-8 shadow-inner border-4 border-slate-800">
                                    <div class={`${isTimerEnlarged ? 'text-8xl' : 'text-6xl'} font-black tracking-widest`}>
                                        {Math.floor(timerSeconds / 60).toString().padStart(2, '0')}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                    </div>
                                </div>

                                {/* Preset Time Buttons */}
                                <div class="grid grid-cols-3 gap-2">
                                    {[
                                        { label: '30秒', sec: 30 },
                                        { label: '1分鐘', sec: 60 },
                                        { label: '2分鐘', sec: 120 },
                                        { label: '3分鐘', sec: 180 },
                                        { label: '4分鐘', sec: 240 },
                                        { label: '5分鐘', sec: 300 },
                                    ].map(item => (
                                        <button 
                                            key={item.label}
                                            onClick={() => startTimer(item.sec)}
                                            class="py-2.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold rounded-xl border border-indigo-200 text-sm"
                                        >
                                            {item.label}
                                        </button>
                                    ))}
                                </div>

                                {/* Custom Timer setting */}
                                <div class="flex items-center space-x-2 pt-2">
                                    <input 
                                        type="number" 
                                        placeholder="自訂秒數" 
                                        value={customTimerInput}
                                        onChange={(e) => setCustomTimerInput(e.target.value)}
                                        class="flex-1 px-4 py-2 border rounded-xl text-center text-sm font-bold"
                                    />
                                    <button 
                                        onClick={() => {
                                            const sec = parseInt(customTimerInput);
                                            if (sec > 0) startTimer(sec);
                                        }}
                                        class="px-4 py-2 bg-slate-800 text-white font-bold rounded-xl text-sm"
                                    >
                                        開始自訂
                                    </button>
                                </div>

                                <div class="flex space-x-2 pt-2">
                                    <button 
                                        onClick={() => setTimerRunning(!timerRunning)}
                                        class="flex-1 py-3 bg-amber-500 text-white font-bold rounded-xl"
                                    >
                                        {timerRunning ? '暫停' : '繼續'}
                                    </button>
                                    <button 
                                        onClick={() => { setTimerSeconds(0); setTimerRunning(false); }}
                                        class="flex-1 py-3 bg-red-100 text-red-600 font-bold rounded-xl"
                                    >
                                        重置
                                    </button>
                                </div>

                                <button onClick={() => setShowTimerModal(false)} class="w-full py-2.5 border rounded-xl text-slate-500 font-bold text-sm">
                                    關閉窗口
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StudentInterface({ roomCode, seatNumber, studentName, studentId, showToast, onExit }) {
            const [roomState, setRoomState] = useState({ activeQuestion: null, allowEdit: false, peerReview: null });
            const [myAnswer, setMyAnswer] = useState('');
            const [hasSubmitted, setHasSubmitted] = useState(false);
            const [shortAnswerInput, setShortAnswerInput] = useState('');
            
            // Whiteboard canvas tools (Revision 2)
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [penColor, setPenColor] = useState('#000000');
            const [penLineWidth, setPenLineWidth] = useState(3);
            const [isEraser, setIsEraser] = useState(false);

            // Heartbeat & Room Listener
            useEffect(() => {
                if (!window.FirebaseSDK || !roomCode) return;
                const { doc, onSnapshot, setDoc } = window.FirebaseSDK;
                const db = window.FirebaseDB;

                // Send heartbeat online status (Revision 1)
                const stdDocRef = doc(db, 'artifacts', 'omit-8c173', 'public', 'data', 'rooms', roomCode, 'students', studentId);
                const sendHeartbeat = () => {
                    setDoc(stdDocRef, {
                        studentId,
                        seatNumber,
                        studentName,
                        joinedAt: Date.now(),
                        lastSeen: Date.now()
                    }, { merge: true });
                };
                sendHeartbeat();
                const interval = setInterval(sendHeartbeat, 10000);

                // Listen to room document
                const roomRef = doc(db, 'artifacts', 'omit-8c173', 'public', 'data', 'rooms', roomCode);
                const unsub = onSnapshot(roomRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        setRoomState(data);
                    }
                });

                return () => {
                    clearInterval(interval);
                    unsub();
                };
            }, [roomCode, studentId, seatNumber, studentName]);

            // Reset student answer state when a new question arrives
            useEffect(() => {
                setMyAnswer('');
                setHasSubmitted(false);
                setShortAnswerInput('');
            }, [roomState.activeQuestion?.id]);

            // Submit Student Response
            const submitAnswer = async (answerVal) => {
                if (!window.FirebaseSDK || !roomCode) return;
                const { doc, setDoc } = window.FirebaseSDK;
                const db = window.FirebaseDB;

                const duration = ((Date.now() - (roomState.activeQuestion?.startTime || Date.now())) / 1000).toFixed(1);

                const responseData = {
                    studentId,
                    seatNumber,
                    studentName,
                    answer: answerVal,
                    submittedAt: Date.now(),
                    duration: parseFloat(duration)
                };

                const respDocRef = doc(db, 'artifacts', 'omit-8c173', 'public', 'data', 'rooms', roomCode, 'responses', studentId);
                await setDoc(respDocRef, responseData);

                setMyAnswer(answerVal);
                setHasSubmitted(true);
                showToast('答案已成功提交！', 'success');
            };

            // Whiteboard Drawing Canvas Logic
            const startDrawing = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                ctx.beginPath();
                ctx.moveTo(clientX - rect.left, clientY - rect.top);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                ctx.strokeStyle = isEraser ? '#ffffff' : penColor;
                ctx.lineWidth = isEraser ? penLineWidth * 4 : penLineWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.lineTo(clientX - rect.left, clientY - rect.top);
                ctx.stroke();
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            const submitWhiteboard = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const dataUrl = canvas.toDataURL('image/png');
                submitAnswer(dataUrl);
            };

            // Convert YouTube URL to embed link (Revision 10)
            const getYouTubeEmbedUrl = (url) => {
                if (!url) return null;
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = url.match(regExp);
                return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
            };

            const ytEmbedUrl = roomState.activeQuestion?.mode === 'LINK' ? getYouTubeEmbedUrl(roomState.activeQuestion.url) : null;

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col pb-10">
                    {/* Student Top Bar */}
                    <header class="bg-indigo-600 text-white px-4 py-3 shadow-md flex items-center justify-between sticky top-0 z-30">
                        <div class="flex items-center space-x-2">
                            <span class="font-black text-lg">OMIT</span>
                            <span class="bg-indigo-500 text-xs px-2.5 py-1 rounded-full font-bold">
                                {seatNumber} 號學生 ({studentName})
                            </span>
                        </div>
                        <button onClick={onExit} class="text-xs bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-lg font-bold">
                            離開課堂
                        </button>
                    </header>

                    <main class="max-w-2xl mx-auto w-full px-4 pt-6 flex-1 space-y-6">
                        {/* Peer Review Broadcast Overlay (Revision 3) */}
                        {roomState.peerReview && (
                            <div class="bg-purple-900 text-white rounded-3xl p-6 shadow-2xl space-y-4 animate-bounce-short">
                                <div class="flex items-center justify-between">
                                    <span class="bg-purple-700 text-purple-200 text-xs font-bold px-3 py-1 rounded-full">
                                        📢 教師互評廣播中
                                    </span>
                                    <span class="text-xs font-bold text-purple-200">
                                        {roomState.peerReview.seatNumber} 號學生的作品
                                    </span>
                                </div>
                                <div class="relative bg-white rounded-2xl overflow-hidden min-h-[220px] flex items-center justify-center border-2 border-purple-400">
                                    {roomState.activeQuestion?.bgImage && (
                                        <img src={roomState.activeQuestion.bgImage} class="absolute inset-0 w-full h-full object-contain opacity-50" />
                                    )}
                                    <img src={roomState.peerReview.answer} class="relative z-10 max-h-full object-contain" />
                                </div>
                            </div>
                        )}

                        {!roomState.activeQuestion ? (
                            <div class="bg-white rounded-3xl p-10 text-center shadow-sm border border-slate-200 space-y-4 my-10">
                                <div class="text-5xl animate-bounce">⌛</div>
                                <h2 class="text-xl font-bold text-slate-800">等待老師發佈互動題目...</h2>
                                <p class="text-sm text-slate-400">請保持網頁開啟，題目發佈時將自動更新</p>
                            </div>
                        ) : (
                            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-6">
                                <div>
                                    <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full uppercase">
                                        當前題目
                                    </span>
                                    <h2 class="text-2xl font-extrabold text-slate-800 mt-2">
                                        {roomState.activeQuestion.text}
                                    </h2>
                                </div>

                                {/* Choice Mode */}
                                {roomState.activeQuestion.mode === 'CHOICE' && (
                                    <div class="grid grid-cols-2 gap-4">
                                        {['A', 'B', 'C', 'D'].map(opt => (
                                            <button 
                                                key={opt}
                                                disabled={hasSubmitted && !roomState.allowEdit}
                                                onClick={() => submitAnswer(opt)}
                                                class={`p-6 rounded-2xl font-black text-2xl border-2 transition active:scale-95 shadow-sm ${myAnswer === opt ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-700 border-slate-200 hover:border-indigo-400'}`}
                                            >
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {/* True / False Mode */}
                                {roomState.activeQuestion.mode === 'TF' && (
                                    <div class="grid grid-cols-2 gap-4">
                                        {[
                                            { label: '⭕ 對', val: '對' },
                                            { label: '❌ 錯', val: '錯' },
                                        ].map(item => (
                                            <button 
                                                key={item.val}
                                                disabled={hasSubmitted && !roomState.allowEdit}
                                                onClick={() => submitAnswer(item.val)}
                                                class={`p-8 rounded-2xl font-black text-3xl border-2 transition active:scale-95 shadow-sm ${myAnswer === item.val ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-700 border-slate-200 hover:border-indigo-400'}`}
                                            >
                                                {item.label}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {/* Short Answer Mode */}
                                {roomState.activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-4">
                                        <textarea 
                                            rows={4}
                                            placeholder="請在此輸入您的回答..."
                                            value={shortAnswerInput}
                                            onChange={(e) => setShortAnswerInput(e.target.value)}
                                            disabled={hasSubmitted && !roomState.allowEdit}
                                            class="w-full p-4 rounded-2xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none font-medium"
                                        ></textarea>
                                        <button 
                                            onClick={() => submitAnswer(shortAnswerInput)}
                                            disabled={(hasSubmitted && !roomState.allowEdit) || !shortAnswerInput.trim()}
                                            class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-bold rounded-2xl shadow transition"
                                        >
                                            {hasSubmitted ? '修改答案並重新提交' : '提交短答題答案'}
                                        </button>
                                    </div>
                                )}

                                {/* Revision 2: Whiteboard Mode with Tools and Eraser */}
                                {roomState.activeQuestion.mode === 'DRAW' && (
                                    <div class="space-y-4">
                                        {/* Drawing Tools Palette */}
                                        <div class="flex flex-wrap items-center justify-between gap-2 p-3 bg-slate-100 rounded-2xl border">
                                            {/* Color options */}
                                            <div class="flex space-x-1.5">
                                                {['#000000', '#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'].map(color => (
                                                    <button 
                                                        key={color}
                                                        onClick={() => { setPenColor(color); setIsEraser(false); }}
                                                        style={{ backgroundColor: color }}
                                                        class={`w-7 h-7 rounded-full border-2 transition ${penColor === color && !isEraser ? 'scale-110 border-white ring-2 ring-indigo-500' : 'border-transparent'}`}
                                                    />
                                                ))}
                                            </div>

                                            {/* Line width picker */}
                                            <div class="flex items-center space-x-1">
                                                {[2, 5, 10].map(width => (
                                                    <button 
                                                        key={width}
                                                        onClick={() => setPenLineWidth(width)}
                                                        class={`px-2 py-1 text-xs rounded-lg font-bold border ${penLineWidth === width ? 'bg-indigo-600 text-white' : 'bg-white text-slate-700'}`}
                                                    >
                                                        {width === 2 ? '細' : width === 5 ? '中' : '粗'}
                                                    </button>
                                                ))}
                                            </div>

                                            {/* Eraser and Clear All */}
                                            <div class="flex space-x-1">
                                                <button 
                                                    onClick={() => setIsEraser(!isEraser)}
                                                    class={`px-2.5 py-1 text-xs font-bold rounded-lg border ${isEraser ? 'bg-amber-500 text-white' : 'bg-white text-slate-700'}`}
                                                >
                                                    擦膠
                                                </button>
                                                <button 
                                                    onClick={clearCanvas}
                                                    class="px-2.5 py-1 text-xs font-bold rounded-lg bg-red-100 text-red-600"
                                                >
                                                    一鍵清除
                                                </button>
                                            </div>
                                        </div>

                                        {/* Canvas Container with custom background overlay */}
                                        <div class="relative w-full aspect-video rounded-2xl border-2 border-slate-300 overflow-hidden bg-white canvas-container">
                                            {roomState.activeQuestion.bgImage && (
                                                <img 
                                                    src={roomState.activeQuestion.bgImage} 
                                                    class="absolute inset-0 w-full h-full object-contain pointer-events-none select-none opacity-80" 
                                                />
                                            )}
                                            <canvas 
                                                ref={canvasRef}
                                                width={600}
                                                height={337}
                                                onMouseDown={startDrawing}
                                                onMouseMove={draw}
                                                onMouseUp={stopDrawing}
                                                onTouchStart={startDrawing}
                                                onTouchMove={draw}
                                                onTouchEnd={stopDrawing}
                                                class="w-full h-full relative z-10 cursor-crosshair"
                                            />
                                        </div>

                                        <button 
                                            onClick={submitWhiteboard}
                                            disabled={hasSubmitted && !roomState.allowEdit}
                                            class="w-full py-4 bg-purple-600 hover:bg-purple-700 disabled:bg-slate-300 text-white font-bold rounded-2xl shadow transition"
                                        >
                                            {hasSubmitted ? '重新提交白板答案' : '提交白板繪圖作品'}
                                        </button>
                                    </div>
                                )}

                                {/* Revision 9: Buzz In (搶答題) Mode */}
                                {roomState.activeQuestion.mode === 'BUZZ' && (
                                    <div class="text-center py-6 space-y-4">
                                        <button 
                                            disabled={hasSubmitted}
                                            onClick={() => {
                                                playSound('buzz');
                                                submitAnswer('搶答成功！');
                                            }}
                                            class={`w-48 h-48 rounded-full border-8 font-black text-3xl shadow-2xl transition transform active:scale-90 ${hasSubmitted ? 'bg-slate-300 text-slate-500 border-slate-400' : 'bg-rose-600 text-white border-rose-400 hover:bg-rose-700 animate-pulse'}`}
                                        >
                                            {hasSubmitted ? '已搶答！' : '搶答！'}
                                        </button>
                                    </div>
                                )}

                                {/* Revision 10: Push Link / Embedded YouTube Video */}
                                {roomState.activeQuestion.mode === 'LINK' && (
                                    <div class="space-y-4">
                                        {ytEmbedUrl ? (
                                            <div class="aspect-video w-full rounded-2xl overflow-hidden border shadow">
                                                <iframe 
                                                    src={ytEmbedUrl} 
                                                    class="w-full h-full" 
                                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                                    allowFullScreen 
                                                />
                                            </div>
                                        ) : (
                                            <div class="text-center py-6 space-y-4">
                                                <a 
                                                    href={roomState.activeQuestion.url} 
                                                    target="_blank" 
                                                    rel="noopener noreferrer"
                                                    class="inline-block px-8 py-4 bg-sky-600 text-white font-bold text-lg rounded-2xl shadow-lg hover:bg-sky-700 transition"
                                                >
                                                    🔗 點擊開啟教師派送連結
                                                </a>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Submission status alert */}
                                {hasSubmitted && (
                                    <div class="p-4 bg-emerald-50 rounded-2xl border border-emerald-200 text-emerald-800 text-center font-bold text-sm">
                                        🎉 答案已於系統登記 {roomState.allowEdit ? '(教師已開放修改權限)' : '(教師鎖定答案中)'}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        // Render main React application into DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
