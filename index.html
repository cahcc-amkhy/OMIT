                                                setTimerSeconds(total);
                                                setTimerActive(true);
                                            }}
                                            class="px-3 py-1 bg-amber-600 text-white rounded-lg font-bold text-xs"
                                        >
                                            設定
                                        </button>
                                    </div>
                                </div>

                                <div class="text-3xl font-mono font-black text-amber-600 py-2">
                                    {Math.floor(timerSeconds / 60).toString().padStart(2, '0')}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                </div>

                                <div class="flex space-x-2">
                                    <button 
                                        onClick={() => setTimerActive(!timerActive)}
                                        class={`flex-1 font-black py-3 rounded-xl text-white transition ${timerActive ? 'bg-rose-500' : 'bg-emerald-600'}`}
                                    >
                                        {timerActive ? '⏸️ 暫停' : '▶️ 開始倒數'}
                                    </button>
                                    <button 
                                        onClick={() => setShowTimerModal(false)}
                                        class="px-4 py-3 bg-slate-100 font-bold rounded-xl text-slate-600 text-xs"
                                    >
                                        關閉
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Item 11: Real-time QR Code & Student List Modal */}
                    {showQRModal && (
                        <div class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-md w-full space-y-5 shadow-2xl text-center">
                                <div class="flex justify-between items-center border-b pb-2">
                                    <span class="font-black text-slate-800 text-base">📱 課堂加入 QR Code</span>
                                    <button onClick={() => setShowQRModal(false)} class="text-slate-400 font-bold text-lg">✕</button>
                                </div>

                                <div class="bg-slate-50 p-4 rounded-2xl inline-block border shadow-inner">
                                    <img src={qrImageUrl} class="w-48 h-48 mx-auto rounded-xl" alt="QR Code" />
                                </div>

                                <div class="space-y-2 text-left">
                                    <div class="flex justify-between items-center text-xs font-bold text-slate-600">
                                        <span>實時在線學生名單：</span>
                                        <span class="bg-indigo-600 text-white px-2 py-0.5 rounded-full font-bold">
                                            共 {studentsList.length} 人
                                        </span>
                                    </div>
                                    <div class="max-h-40 overflow-y-auto border rounded-xl p-2 bg-slate-50 grid grid-cols-2 gap-1 text-xs">
                                        {studentsList.map(s => (
                                            <div key={s.id} class="bg-white p-1.5 rounded-lg border font-bold text-slate-700">
                                                {s.seatNumber}號 {s.name}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
            const [selectedChoice, setSelectedChoice] = useState('');
            const [shortAnswerText, setShortAnswerText] = useState('');
            const [whiteboardData, setWhiteboardData] = useState(null);
            const [audioData, setAudioData] = useState(null);

            // Item 1: Student whiteboard canvas stroke state
            const [strokeWidth, setStrokeWidth] = useState(4);
            const [strokeColor, setStrokeColor] = useState('#2563eb');
            const [isEraser, setIsEraser] = useState(false);
            const [whiteboardBgImage, setWhiteboardBgImage] = useState(null);

            // Challenge answers map { [qIdx]: 'A' }
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [challengeTimeRemaining, setChallengeTimeRemaining] = useState(null);

            const myResponseKey = activeQuestion ? `${activeQuestion.id}_${studentId}` : '';
            const mySubmittedResponse = responses[myResponseKey];

            const isLocked = useMemo(() => {
                if (!activeQuestion) return false;
                if (activeQuestion.mode === 'DRAW') return !!mySubmittedResponse; // Item 27: Whiteboard locked after submit
                if (activeQuestion.mode === 'CHALLENGE') return !!mySubmittedResponse; // Item 15 & 19
                if (activeQuestion.lockAfterSubmit && mySubmittedResponse) return true;
                return false;
            }, [activeQuestion, mySubmittedResponse]);

            // Item 13, 15, 19: Challenge Timer Auto-submit Engine
            useEffect(() => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE' || !activeQuestion.challenge?.enableTimer) return;
                if (mySubmittedResponse) return;

                const limit = activeQuestion.challenge.timeLimit || 120;
                const elapsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                const remaining = Math.max(0, limit - elapsed);

                setChallengeTimeRemaining(remaining);

                const timer = setInterval(() => {
                    setChallengeTimeRemaining(r => {
                        if (r <= 1) {
                            clearInterval(timer);
                            handleAutoSubmitChallenge();
                            return 0;
                        }
                        return r - 1;
                    });
                }, 1000);

                return () => clearInterval(timer);
            }, [activeQuestion, mySubmittedResponse]);

            const handleAutoSubmitChallenge = () => {
                if (!activeQuestion || mySubmittedResponse) return;
                handleSubmitAnswer(challengeAnswers);
                showToast("時間結束，系統已自動提交考卷！", "info");
            };

            const handleSubmitAnswer = async (finalAnsValue) => {
                if (!activeQuestion) return;

                const durationSec = Math.max(1, Math.round((Date.now() - activeQuestion.startTime) / 1000));
                let scoreDetails = null;

                if (activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge) {
                    const qs = activeQuestion.challenge.questions || [];
                    let earnedScore = 0;
                    const perQScore = activeQuestion.challenge.totalScore / (qs.length || 1);
                    const itemized = [];

                    qs.forEach((q, idx) => {
                        const stuChoice = finalAnsValue[idx] || '未作答';
                        const isCorrect = stuChoice === q.answer;
                        if (isCorrect) earnedScore += perQScore;

                        itemized.push({
                            questionNum: q.num || idx + 1,
                            questionText: q.text,
                            studentChoice: stuChoice,
                            correctAnswer: q.answer,
                            isCorrect: isCorrect
                        });
                    });

                    scoreDetails = {
                        totalScore: Math.round(earnedScore),
                        percentage: Math.round((earnedScore / activeQuestion.challenge.totalScore) * 100),
                        itemized: itemized
                    };
                }

                const resObj = {
                    id: myResponseKey,
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    studentName: studentName || `學號 ${seatNumber}`,
                    answer: finalAnsValue,
                    duration: durationSec,
                    scoreDetails: scoreDetails,
                    timestamp: Date.now()
                };

                const appId = "omit-8c173";
                const db = window.fbDb;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', myResponseKey);

                await window.fbUtils.setDoc(resDocRef, resObj);
                playSound('win');
            };

            // Item 22.3.4: Team question answer handler
            const handleTeamAnswerSubmit = async (teamObj, currentQ, stuChoice) => {
                if (!activeQuestion || !activeQuestion.teamData) return;
                const isCorrect = stuChoice === currentQ.answer;

                let nextProgress = teamObj.progress;
                if (isCorrect) {
                    nextProgress += 1;
                } else {
                    nextProgress = 0; // Reset penalty on wrong answer!
                }

                const totalQs = activeQuestion.teamData.questions.length;
                let winTeam = null;
                if (nextProgress >= totalQs) {
                    winTeam = { ...teamObj, progress: totalQs };
                }

                const updatedTeams = activeQuestion.teamsList.map(t => t.id === teamObj.id ? { ...t, progress: nextProgress } : t);

                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                await window.fbUtils.setDoc(roomDocRef, {
                    activeQuestion: {
                        ...activeQuestion,
                        teamsList: updatedTeams,
                        winningTeam: winTeam || activeQuestion.winningTeam
                    }
                }, { merge: true });

                if (isCorrect) playSound('win');
                else playSound('alarm');
            };

            return (
                <div class="min-h-screen bg-slate-100 pb-12">
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 py-3">
                        <div class="max-w-3xl mx-auto flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <span class="bg-indigo-600 text-white font-black px-3 py-1 rounded-xl text-sm">OMIT</span>
                                <span class="font-bold text-slate-800 text-sm">
                                    {seatNumber}號 {studentName}
                                </span>
                            </div>
                            <button onClick={onExit} class="text-xs font-bold text-rose-600 bg-rose-50 px-3 py-1.5 rounded-lg border border-rose-200">
                                🚪 離開
                            </button>
                        </div>
                    </header>

                    <main class="max-w-3xl mx-auto p-4 space-y-5">
                        {/* Item 21 & 32: Broadcast Teacher Demo Whiteboard */}
                        {activeQuestion?.teacherDemoBroadcast && (
                            <div class="bg-purple-900 text-white p-4 rounded-3xl space-y-3 shadow-2xl animate-pulse">
                                <div class="flex justify-between items-center text-xs font-bold">
                                    <span>📡 教師正在即時廣播示範白板：</span>
                                </div>
                                <div class="bg-white rounded-2xl overflow-hidden aspect-16-9">
                                    <img src={activeQuestion.teacherDemoBroadcast} class="w-full h-full object-contain" alt="示範白板" />
                                </div>
                            </div>
                        )}

                        {/* Item 2, 26, 33: Teacher Peer Review Broadcast Display */}
                        {activeQuestion?.broadcastAnswer && (
                            <div class="bg-indigo-900 text-white p-5 rounded-3xl space-y-3 shadow-2xl">
                                <div class="flex justify-between items-center text-xs font-bold">
                                    <span>📢 教師廣播作品互評中 ({activeQuestion.broadcastStudent?.seatNumber}號 {activeQuestion.broadcastStudent?.studentName})：</span>
                                </div>
                                {typeof activeQuestion.broadcastAnswer === 'string' && activeQuestion.broadcastAnswer.startsWith('data:image') ? (
                                    <div class="bg-white rounded-2xl overflow-hidden aspect-16-9">
                                        <img src={activeQuestion.broadcastAnswer} class="w-full h-full object-contain" alt="廣播作品" />
                                    </div>
                                ) : (
                                    <div class="bg-white/10 p-4 rounded-2xl font-bold text-base text-center">
                                        {activeQuestion.broadcastAnswer}
                                    </div>
                                )}
                            </div>
                        )}

                        {!activeQuestion ? (
                            <div class="bg-white rounded-3xl p-12 text-center space-y-4 shadow-sm border border-slate-200 my-8">
                                <div class="text-5xl animate-bounce">⏳</div>
                                <h3 class="text-xl font-black text-slate-800">安靜等候老師指示...</h3>
                                <p class="text-xs text-slate-400 font-bold">當老師發佈題目時，畫面將會即時更新！</p>
                            </div>
                        ) : (
                            <div class="space-y-5">
                                {/* Question Title Card */}
                                <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-3">
                                    <div class="flex justify-between items-center">
                                        <span class="bg-indigo-100 text-indigo-700 font-extrabold text-xs px-3 py-1 rounded-full">
                                            {getModeLabel(activeQuestion.mode)}
                                        </span>
                                        {activeQuestion.mode === 'CHALLENGE' && challengeTimeRemaining !== null && (
                                            <span class="bg-rose-500 text-white font-mono font-bold text-xs px-3 py-1 rounded-full animate-pulse">
                                                ⏱️ 剩餘時間：{Math.floor(challengeTimeRemaining / 60)}:{(challengeTimeRemaining % 60).toString().padStart(2, '0')}
                                            </span>
                                        )}
                                    </div>
                                    <h2 class="text-xl font-black text-slate-800">{activeQuestion.text}</h2>
                                </div>

                                {/* Item 22.3.4 & 24: Team Competition Student Mode */}
                                {activeQuestion.mode === 'TEAM' && (
                                    <div class="space-y-4">
                                        {/* Find student's team */}
                                        {(() => {
                                            const myTeam = activeQuestion.teamsList?.find(t => t.members.some(m => m.seatNumber === seatNumber));
                                            if (!myTeam) return <div class="p-4 bg-white rounded-2xl text-center font-bold">尚末分配組別</div>;

                                            if (activeQuestion.teamStage === 'GROUP') {
                                                return (
                                                    <div class={`${myTeam.bgLight} border-2 ${myTeam.border} p-8 rounded-3xl text-center space-y-4 shadow-lg`}>
                                                        <div class="text-6xl">{myTeam.emoji}</div>
                                                        <h3 class="text-2xl font-black">{myTeam.name}</h3>
                                                        <p class="text-sm font-bold text-indigo-900 animate-pulse">
                                                            盡快與你的組員會合!比賽即將開始!
                                                        </p>
                                                    </div>
                                                );
                                            }

                                            // Competition phase
                                            const currentQIdx = myTeam.progress || 0;
                                            const currentQ = activeQuestion.teamData?.questions[currentQIdx];

                                            if (activeQuestion.winningTeam) {
                                                return (
                                                    <div class="bg-amber-50 border-2 border-amber-400 p-6 rounded-3xl space-y-4 shadow-xl">
                                                        <div class="text-center space-y-2">
                                                            <div class="text-4xl">🎉 🏆 🎉</div>
                                                            <h3 class="text-2xl font-black text-amber-900">
                                                                勝出組別：{activeQuestion.winningTeam.name} {activeQuestion.winningTeam.emoji}
                                                            </h3>
                                                            <p class="text-xs font-bold text-amber-800">
                                                                組員：{activeQuestion.winningTeam.members.map(m => `${m.seatNumber}號 ${m.name}`).join('、')}
                                                            </p>
                                                        </div>

                                                        {/* Item 24: Breakdown of test paper */}
                                                        <div class="border-t border-amber-200 pt-4 space-y-3">
                                                            <h4 class="font-black text-slate-800 text-xs">整份考卷詳情：</h4>
                                                            {activeQuestion.teamData?.questions?.map((q, idx) => (
                                                                <div key={idx} class="bg-white p-3 rounded-xl border space-y-1 text-xs">
                                                                    <div class="font-bold text-slate-800">第 {idx + 1} 題：{q.text}</div>
                                                                    <div class="text-emerald-700 font-bold">正確選項：{q.answer}</div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                );
                                            }

                                            if (!currentQ) return <div class="bg-white p-6 rounded-2xl text-center font-bold">已完成所有題目！</div>;

                                            // Item 22.3.4: Collaborative Split Display Logic!
                                            const memberIdx = myTeam.members.findIndex(m => m.seatNumber === seatNumber);
                                            const showQuestionText = memberIdx === 0; // Member 1 sees question text
                                            const showOptsAB = memberIdx === 1 || myTeam.members.length < 2; // Member 2 sees A&B
                                            const showOptsCD = memberIdx === 2 || myTeam.members.length < 3; // Member 3 sees C&D

                                            return (
                                                <div class="bg-white rounded-3xl p-6 shadow-sm border-2 border-emerald-300 space-y-5">
                                                    <div class="flex justify-between items-center border-b pb-2">
                                                        <span class={`font-black px-3 py-1 rounded-xl ${myTeam.color} text-xs`}>
                                                            {myTeam.emoji} {myTeam.name} (第 {currentQIdx + 1} / {activeQuestion.teamData.questions.length} 題)
                                                        </span>
                                                        <span class="text-xs font-bold text-emerald-700">🤝 團隊分工合作中</span>
                                                    </div>

                                                    {showQuestionText ? (
                                                        <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-200 space-y-2">
                                                            <span class="text-xs font-black text-emerald-800 uppercase">【組員一：題目負責人】</span>
                                                            <p class="text-lg font-black text-slate-800">{currentQ.text}</p>
                                                            <p class="text-xs text-emerald-600 font-bold">請朗讀題目給組員聽，並一起討論答案！</p>
                                                        </div>
                                                    ) : (
                                                        <div class="bg-slate-50 p-3 rounded-2xl border text-center text-xs font-bold text-slate-500">
                                                            💡 題目顯示於【{myTeam.members[0]?.seatNumber}號 {myTeam.members[0]?.name}】的螢幕上！
                                                        </div>
                                                    )}

                                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                        {currentQ.options.map((opt) => {
                                                            const isAB = opt.letter === 'A' || opt.letter === 'B';
                                                            const canDisplay = isAB ? showOptsAB : showOptsCD;

                                                            if (!canDisplay) return null;

                                                            return (
                                                                <button 
                                                                    key={opt.letter}
                                                                    onClick={() => handleTeamAnswerSubmit(myTeam, currentQ, opt.letter)}
                                                                    class="p-4 rounded-2xl border-2 border-emerald-200 hover:border-emerald-500 bg-white hover:bg-emerald-50 text-left font-bold text-slate-800 shadow-sm transition active:scale-95"
                                                                >
                                                                    <span class="font-black text-emerald-600 mr-2">{opt.letter}.</span>
                                                                    <span>{opt.text}</span>
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            );
                                        })()}
                                    </div>
                                )}

                                {/* Choice / TF Student View */}
                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            {activeQuestion.choiceOptions?.map((opt) => (
                                                <button 
                                                    key={opt}
                                                    disabled={isLocked}
                                                    onClick={() => setSelectedChoice(opt)}
                                                    class={`p-4 rounded-2xl font-black text-lg border-2 transition text-left flex items-center justify-between ${
                                                        selectedChoice === opt 
                                                        ? 'bg-indigo-600 text-white border-indigo-600 ring-4 ring-indigo-100' 
                                                        : 'bg-slate-50 text-slate-800 border-slate-200 hover:bg-slate-100'
                                                    }`}
                                                >
                                                    <span>{opt}</span>
                                                    {selectedChoice === opt && <span>✓</span>}
                                                </button>
                                            ))}
                                        </div>

                                        {/* Item 3: Confirm submit button */}
                                        {!isLocked && (
                                            <button 
                                                onClick={() => handleSubmitAnswer(selectedChoice)}
                                                disabled={!selectedChoice}
                                                class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-black py-4 rounded-2xl shadow-lg shadow-indigo-200 transition text-base"
                                            >
                                                確認提交答案 🚀
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Short Answer View */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                                        <textarea 
                                            disabled={isLocked}
                                            rows={4}
                                            value={shortAnswerText}
                                            onChange={(e) => setShortAnswerText(e.target.value)}
                                            placeholder="請在此輸入您的詳細回答..."
                                            class="w-full p-4 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium text-slate-800"
                                        />
                                        {/* Item 3: Confirm submit button */}
                                        {!isLocked && (
                                            <button 
                                                onClick={() => handleSubmitAnswer(shortAnswerText.trim())}
                                                disabled={!shortAnswerText.trim()}
                                                class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-black py-4 rounded-2xl shadow-lg transition text-base"
                                            >
                                                確認提交答案 🚀
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Whiteboard Question View */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                                        <WhiteboardCanvas 
                                            initialBg={activeQuestion.whiteboardBg || whiteboardBgImage}
                                            disabled={isLocked}
                                            strokeWidth={strokeWidth}
                                            setStrokeWidth={setStrokeWidth}
                                            strokeColor={strokeColor}
                                            setStrokeColor={setStrokeColor}
                                            isEraser={isEraser}
                                            setIsEraser={setIsEraser}
                                            onSave={(data) => setWhiteboardData(data)}
                                            onBgUpload={(data) => setWhiteboardBgImage(data)}
                                        />
                                        {/* Item 1 & 3: Confirm submit button */}
                                        {!isLocked && (
                                            <button 
                                                onClick={() => handleSubmitAnswer(whiteboardData)}
                                                disabled={!whiteboardData}
                                                class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-black py-4 rounded-2xl shadow-lg transition text-base"
                                            >
                                                確認提交白板作品 🚀
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Buzzer Quick Answer View */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="bg-white rounded-3xl p-8 text-center space-y-6 shadow-sm border border-slate-200">
                                        <button 
                                            disabled={isLocked}
                                            onClick={() => {
                                                handleSubmitAnswer('已按下搶答按鈕！');
                                                playSound('buzzer');
                                            }}
                                            class={`w-48 h-48 rounded-full font-black text-2xl shadow-2xl transition transform active:scale-90 mx-auto flex items-center justify-center border-8 ${
                                                mySubmittedResponse 
                                                ? 'bg-slate-400 border-slate-500 text-white cursor-not-allowed' 
                                                : 'bg-rose-600 hover:bg-rose-700 border-rose-300 text-white animate-pulse'
                                            }`}
                                        >
                                            {mySubmittedResponse ? '已搶答！' : '🚨 點擊搶答！'}
                                        </button>
                                    </div>
                                )}

                                {/* Audio Recording Question View */}
                                {activeQuestion.mode === 'AUDIO' && (
                                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                                        <AudioRecorder 
                                            disabled={isLocked}
                                            onSaveAudio={(data) => setAudioData(data)}
                                        />
                                        {/* Item 5: Confirm audio submit */}
                                        {!isLocked && (
                                            <button 
                                                onClick={() => handleSubmitAnswer(audioData)}
                                                disabled={!audioData}
                                                class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-black py-4 rounded-2xl shadow-lg transition text-base"
                                            >
                                                ✅ 確認提交錄音
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Challenge Student Paper View */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                    <div class="space-y-4">
                                        {!isLocked ? (
                                            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-6">
                                                {activeQuestion.challenge.questions?.map((q, idx) => (
                                                    <div key={idx} class="p-4 rounded-2xl border border-slate-200 space-y-3 bg-slate-50/50">
                                                        <div class="font-black text-slate-800 text-base">
                                                            第 {q.num || idx + 1} 題：{q.text}
                                                        </div>
                                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                            {q.options?.map((opt) => (
                                                                <button 
                                                                    key={opt.letter}
                                                                    onClick={() => setChallengeAnswers({ ...challengeAnswers, [idx]: opt.letter })}
                                                                    class={`p-3 rounded-xl font-bold text-xs border text-left flex items-center justify-between transition ${
                                                                        challengeAnswers[idx] === opt.letter 
                                                                        ? 'bg-amber-600 text-white border-amber-600 shadow' 
                                                                        : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100'
                                                                    }`}
                                                                >
                                                                    <span>{opt.letter}. {opt.text}</span>
                                                                    {challengeAnswers[idx] === opt.letter && <span>✓</span>}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}

                                                <button 
                                                    onClick={() => handleSubmitAnswer(challengeAnswers)}
                                                    class="w-full bg-amber-600 hover:bg-amber-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-amber-200 transition text-base"
                                                >
                                                    確認提交挑戰題考卷 🚀
                                                </button>
                                            </div>
                                        ) : (
                                            /* Item 15, 19, 28: Challenge Paper Post-Release Review */
                                            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-5">
                                                {activeQuestion.challenge.scoresReleased && mySubmittedResponse?.scoreDetails ? (
                                                    <div class="space-y-4">
                                                        <div class="bg-amber-50 p-6 rounded-2xl text-center border-2 border-amber-300">
                                                            <div class="text-3xl font-black text-amber-900">
                                                                得分：{mySubmittedResponse.scoreDetails.totalScore} / {activeQuestion.challenge.totalScore} 分
                                                            </div>
                                                            <div class="text-xs font-bold text-amber-700 mt-1">
                                                                正確率：{mySubmittedResponse.scoreDetails.percentage}% (用時: {mySubmittedResponse.duration}s)
                                                            </div>
                                                        </div>

                                                        {/* Item 19: Unlocked details with Green for correct and Red for wrong */}
                                                        <div class="space-y-3">
                                                            {mySubmittedResponse.scoreDetails.itemized?.map((item, idx) => (
                                                                <div key={idx} class={`p-4 rounded-2xl border space-y-2 text-xs ${item.isCorrect ? 'bg-emerald-50 border-emerald-300' : 'bg-rose-50 border-rose-300'}`}>
                                                                    <div class="font-black text-slate-800 text-sm">
                                                                        第 {idx + 1} 題：{item.questionText}
                                                                    </div>
                                                                    <div class="flex items-center space-x-3 font-bold">
                                                                        <span class={item.isCorrect ? 'text-emerald-700' : 'text-rose-600'}>
                                                                            您的選擇：{item.studentChoice} {item.isCorrect ? '✅ (正確)' : '❌ (錯誤)'}
                                                                        </span>
                                                                        {!item.isCorrect && (
                                                                            <span class="text-emerald-700">正確答案：{item.correctAnswer}</span>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div class="text-center py-6 space-y-2">
                                                        <div class="text-3xl">🔒</div>
                                                        <p class="font-black text-slate-700">考卷已完成提交並自動批改！</p>
                                                        <p class="text-xs text-slate-400 font-bold">等候老師發佈成績後，將自動解除鎖定並顯示詳細得分與對錯解析。</p>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Link Dispatching View */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4 text-center">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div class="aspect-16-9 w-full rounded-2xl overflow-hidden shadow-inner">
                                                <iframe 
                                                    src={activeQuestion.youtubeEmbed} 
                                                    class="w-full h-full" 
                                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                                    allowFullScreen 
                                                />
                                            </div>
                                        ) : (
                                            <div class="p-8 bg-slate-50 rounded-2xl border">
                                                <p class="font-bold text-slate-700 mb-2">老師推送了下方網頁連結：</p>
                                                <p class="font-mono text-xs text-indigo-600 font-bold break-all">{activeQuestion.pushedUrl}</p>
                                            </div>
                                        )}

                                        {/* Item 4: Open Link Button */}
                                        {activeQuestion.pushedUrl && (
                                            <a 
                                                href={activeQuestion.pushedUrl} 
                                                target="_blank" 
                                                rel="noopener noreferrer"
                                                class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-black px-6 py-3.5 rounded-2xl shadow-md text-sm transition"
                                            >
                                                開啟連結網站 ↗
                                            </a>
                                        )}
                                    </div>
                                )}

                                {/* Item 6: Unified Feedback Message Banner upon submission */}
                                {mySubmittedResponse && activeQuestion.mode !== 'TEAM' && (
                                    <div class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white p-5 rounded-3xl shadow-lg text-center space-y-1 animate-bounce">
                                        <div class="text-xl font-black">🎉 已提交答案! 讚賞你的努力!</div>
                                        <div class="text-xs opacity-90 font-bold">安靜等候老師指示...</div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<OMITApp />);
    </script>
</body>
</html>
