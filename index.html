<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Label helper for mode names
        function getModeLabel(mode) {
            switch(mode) {
                case 'CHOICE': return '選擇題';
                case 'TF': return '是非題';
                case 'SHORT': return '短答題';
                case 'DRAW': return '白板題';

                case 'COOP': return '請與你的組員互相合作，共同解答題目！';
                case 'LINK': return '請點擊或觀看下方派送內容：';
                default: return '請回答問題：';
            }
        }

        // Animal preset list for Cooperative Mode grouping
        const ANIMAL_PRESETS = [
            { name: '老虎組', emoji: '🐯', color: 'bg-amber-500 text-white border-amber-600', hex: '#f59e0b' },
            { name: '大象組', emoji: '🐘', color: 'bg-cyan-600 text-white border-cyan-700', hex: '#0891b2' },
            { name: '企鵝組', emoji: '🐧', color: 'bg-sky-500 text-white border-sky-600', hex: '#0284c7' },
            { name: '藍鯨組', emoji: '🐋', color: 'bg-blue-600 text-white border-blue-700', hex: '#2563eb' },
            { name: '白兔組', emoji: '🐰', color: 'bg-pink-500 text-white border-pink-600', hex: '#ec4899' },
            { name: '熊貓組', emoji: '🐼', color: 'bg-slate-800 text-white border-slate-900', hex: '#1e293b' },
            { name: '獅子組', emoji: '🦁', color: 'bg-orange-500 text-white border-orange-600', hex: '#f97316' },
            { name: '白羊組', emoji: '🐏', color: 'bg-emerald-600 text-white border-emerald-700', hex: '#059669' },
            { name: '水牛組', emoji: '🐃', color: 'bg-stone-600 text-white border-stone-700', hex: '#57534e' },
            { name: '斑馬組', emoji: '🦓', color: 'bg-purple-600 text-white border-purple-700', hex: '#9333ea' }
        ];

        // Web Audio Synthesizer
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    if (window.confetti) {
                        window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                    }
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                    });
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'error') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (
                <div class={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-xl shadow-lg flex items-center space-x-2 text-sm font-medium animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        // Create Word .docx Blob using JSZip
        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) throw new Error("JSZip library not loaded.");
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>${paragraphsXml}</w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        // Word / Text document parser
        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];
            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) questions.push(currentQ);
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }

                    currentQ.options.push({ letter, text: optText });
                    if (isCorrect) currentQ.answer = letter;
                }
            });

            if (currentQ && currentQ.options.length > 0) questions.push(currentQ);

            if (questions.length === 0) {
                return {
                    title: "地球生病了",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1,
                            text: "以下哪一項不是地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "機械資源" }
                            ],
                            answer: "D"
                        },
                        {
                            num: 2,
                            text: "芝士的原料屬於哪一項地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "礦產資源" }
                            ],
                            answer: "C"
                        },
                        {
                            num: 3,
                            text: "人們不當使用水資源會造成甚麼後果?",
                            options: [
                                { letter: "A", text: "引發極端天氣" },
                                { letter: "B", text: "引發水災" },
                                { letter: "C", text: "水土流失" },
                                { letter: "D", text: "影響食水供應" }
                            ],
                            answer: "D"
                        },
                        {
                            num: 4,
                            text: "人們不當使用煤和石油資源會造成甚麼後果?",
                            options: [
                                { letter: "A", text: "引發極端天氣" },
                                { letter: "B", text: "引發水災" },
                                { letter: "C", text: "水土流失" },
                                { letter: "D", text: "影響食水供應" }
                            ],
                            answer: "A"
                        },
                        {
                            num: 5,
                            text: "人們不當使用土地資源會造成甚麼後果?",
                            options: [
                                { letter: "A", text: "引發極端天氣" },
                                { letter: "B", text: "引發水災" },
                                { letter: "C", text: "產生大量二氧化碳" },
                                { letter: "D", text: "影響食水供應" }
                            ],
                            answer: "B"
                        }
                    ]
                };
            }

            return { title, totalScore, questions };
        };

        // Requirement 1 & 21: Precision Whiteboard Canvas with 1280x720 internal resolution & coordinate mapping formula
        function WhiteboardCanvas({ bgImage, onSave, isLocked, readOnly = false, initialData = null, showConfirmSubmit = true }) {
            const canvasRef = useRef(null);
            const [color, setColor] = useState('#1e293b');
            const [lineWidth, setLineWidth] = useState(6);
            const [isEraser, setIsEraser] = useState(false);
            const [customBg, setCustomBg] = useState(bgImage || null);
            const isDrawing = useRef(false);

            const CANVAS_WIDTH = 1280;
            const CANVAS_HEIGHT = 720;

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (initialData) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                    img.src = initialData;
                } else {
                    resetCanvas(ctx);
                }
            }, [bgImage, initialData]);

            const resetCanvas = (ctx) => {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                const bgToDraw = customBg || bgImage;
                if (bgToDraw) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                    img.src = bgToDraw;
                }
            };

            const getPos = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                // Ratio mapping formula (scaleX / scaleY) to resolve touch offset on iPad & tablets
                const scaleX = CANVAS_WIDTH / rect.width;
                const scaleY = CANVAS_HEIGHT / rect.height;

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                if (isLocked || readOnly) return;
                e.preventDefault();
                isDrawing.current = true;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            };

            const draw = (e) => {
                if (!isDrawing.current || isLocked || readOnly) return;
                e.preventDefault();
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const pos = getPos(e);

                if (isEraser) {
                    ctx.save();
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, lineWidth * 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = color;
                    ctx.lineWidth = lineWidth;
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                }
            };

            const stopDrawing = () => {
                if (isDrawing.current) {
                    isDrawing.current = false;
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');
                    ctx.closePath();
                }
            };

            const handleClear = () => {
                if (isLocked || readOnly) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                resetCanvas(ctx);
            };

            const handleBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setCustomBg(evt.target.result);
                        const canvas = canvasRef.current;
                        const ctx = canvas.getContext('2d');
                        const img = new Image();
                        img.onload = () => ctx.drawImage(img, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                        img.src = evt.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleSubmit = () => {
                const canvas = canvasRef.current;
                const dataUrl = canvas.toDataURL('image/png');
                if (onSave) onSave(dataUrl);
            };

            return (
                <div class="space-y-3 w-full">
                    {!readOnly && !isLocked && (
                        <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                            {/* Colors */}
                            <div class="flex items-center space-x-1.5">
                                {['#1e293b', '#dc2626', '#2563eb', '#16a34a', '#d97706', '#9333ea'].map((c) => (
                                    <button
                                        key={c}
                                        type="button"
                                        onClick={() => { setColor(c); setIsEraser(false); }}
                                        class={`w-7 h-7 rounded-full border-2 transition ${color === c && !isEraser ? 'scale-110 ring-2 ring-indigo-500' : ''}`}
                                        style={{ backgroundColor: c }}
                                    />
                                ))}
                            </div>

                            {/* Stroke Thickness Slider 2px-18px */}
                            <div class="flex items-center space-x-2">
                                <span class="text-xs font-bold text-slate-500">粗幼:</span>
                                <input 
                                    type="range" 
                                    min="2" 
                                    max="18" 
                                    value={lineWidth} 
                                    onChange={(e) => setLineWidth(parseInt(e.target.value))}
                                    class="w-20 accent-indigo-600"
                                />
                                <span class="text-xs font-mono font-bold w-6">{lineWidth}px</span>
                            </div>

                            {/* Tools */}
                            <div class="flex items-center space-x-2">
                                <button 
                                    type="button"
                                    onClick={() => setIsEraser(!isEraser)}
                                    class={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 ${isEraser ? 'bg-amber-500 text-white shadow-md' : 'bg-slate-200 text-slate-700'}`}
                                >
                                    <span>🧽</span> 擦膠
                                </button>
                                <button 
                                    type="button"
                                    onClick={handleClear}
                                    class="px-3 py-1.5 rounded-xl text-xs font-bold bg-rose-100 hover:bg-rose-200 text-rose-700 transition flex items-center gap-1"
                                >
                                    <span>🗑️</span> 清空
                                </button>
                                <label class="px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 cursor-pointer transition flex items-center gap-1">
                                    <span>🖼️</span> 上載背景
                                    <input type="file" accept="image/*" onChange={handleBgUpload} class="hidden" />
                                </label>
                            </div>
                        </div>
                    )}

            const inspectableList = useMemo(() => {

            }, [currentQuestionResponses]);

            // Timer Interval

            // Sync Question & History to Firestore

                const appId = "omit-8c173";

            // Exit Room Cleanup

                        console.error("Cleanup error:", e);
                    }

                }
            };

            // Download Word Assessment Template (.docx)
            const handleDownloadChallengeTemplate = async () => {
                const sampleLines = [
                    "標題：宣道會陳元喜小學 課堂評估",
                    "總分: 100分",
                    "1.以下哪一項不是地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源",
                    "D. 機械資源*",
                    "",
                    "2.芝士的原料屬於哪一項地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源*",
                    "D. 礦產資源",
                    "",
                    "3.人們不當使用水資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應*",
                    "",
                    "4.人們不當使用煤和石油資源會造成甚麼後果?",
                    "A. 引發極端天氣*",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應",
                    "",
                    "5.人們不當使用土地資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災*",
                    "C. 產生大量二氧化碳",
                    "D. 影響食水供應"
                ];

                try {
                    const blob = await createWordDocxBlob(sampleLines);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = '下載評估範本Word檔.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast("已下載評估範本Word檔 (.docx)！", "success");
                } catch (err) {
                    console.error("Docx generation error:", err);
                    showToast("無法生成 Word 範本檔，請重試。", "error");
                }
            };

            // Word Template Parser for Challenge & Cooperative Modes
            const handleWordFileUpload = (e, isCoop = false) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const arrayBuffer = evt.target.result;
                            const result = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                            parsedData = parseWordChallengeText(result.value);
                        } else {
                            parsedData = parseWordChallengeText(evt.target.result);
                        }

                        if (isCoop) {
                            setCoopData(parsedData);
                        } else {
                            setChallengeData(parsedData);
                        }
                        showToast(`已成功解析範本檔案！共 ${parsedData.questions.length} 題`, 'success');
                    } catch (err) {
                        console.error("Word file parse error:", err);
                        showToast("文件解析失敗，請確認格式！", "error");
                    }
                };

                if (file.name.endsWith('.docx')) {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file, "UTF-8");
                }
            };

            // Cooperative Mode: Automatic Random Grouping (3-4 students per group, min 3 per group)
            const generateCoopGroups = () => {
                const sortedStudents = [...studentsList].sort(() => Math.random() - 0.5);
                const totalStudents = sortedStudents.length;

                if (totalStudents < 3) {
                    showToast("最少需要3位學生才能進行合作題分組！", "error");
                    return [];
                }

                // Determine group sizes (either 3 or 4 per group)
                let numGroups = Math.floor(totalStudents / 3);
                if (numGroups === 0) numGroups = 1;

                const groups = [];
                const shuffledAnimals = [...ANIMAL_PRESETS].sort(() => Math.random() - 0.5);

                for (let i = 0; i < numGroups; i++) {
                    const preset = shuffledAnimals[i % shuffledAnimals.length];
                    groups.push({
                        id: 'grp_' + i,
                        name: preset.name,
                        emoji: preset.emoji,
                        color: preset.color,
                        hex: preset.hex,
                        members: [],
                        progress: 0, // current question index
                        failedReset: false
                    });
                }

                // Distribute students evenly into groups
                sortedStudents.forEach((stu, idx) => {
                    const targetGroupIndex = idx % numGroups;
                    groups[targetGroupIndex].members.push(stu);
                });

                return groups;
            };

            // Start Cooperative Grouping Phase
            const handleStartCoopGrouping = () => {
                if (!coopData || !coopData.questions || coopData.questions.length === 0) {
                    showToast("請先上載並確認合作題評估內容！", "error");

                const groups = generateCoopGroups();
                if (groups.length === 0) return;

                setCoopGroups(groups);
                setCoopPhase('GROUP');

                // Publish Cooperative Grouping Question to Firestore
                const newQ = {
                    id: 'coop_' + Date.now(),
                    mode: 'COOP',
                    text: `🤝 合作題：${coopData.title}`,
                    startTime: Date.now(),
                    coopPhase: 'GROUP',
                    coopData: coopData,
                    coopGroups: groups
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);
                publishQuestionToFirestore(newQ, updatedHistory);
                showToast("已進入合作題「分組」階段！資訊已發送至每位學生螢幕。", "success");
            };

            // Re-assign Cooperative Groups
            const handleReassignCoopGroups = async () => {
                const newGroups = generateCoopGroups();
                if (newGroups.length === 0) return;

                setCoopGroups(newGroups);
                const updatedQ = {
                    ...activeQuestion,
                    coopGroups: newGroups,
                    coopPhase: 'GROUP'
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已重新分配所有組員！", "info");
            };

            // Start Cooperative Competition Phase
            const handleStartCoopCompetition = async () => {
                setCoopPhase('PLAY');
                const updatedQ = {
                    ...activeQuestion,
                    coopPhase: 'PLAY',
                    winningGroup: null
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("🏎️ 合作題「比賽」階段開始！火速作答！", "success");
            };

            // Cooperative Mode Controls upon Win:
            const handleCoopFinishGame = async () => {
                setCoopPhase('PREP');
                await handleClearQuestion();
            };

            const handleCoopPlayAgain = async () => {
                // Reset all group progress
                const resetGroups = coopGroups.map(g => ({ ...g, progress: 0, failedReset: false }));
                setCoopGroups(resetGroups);
                setCoopPhase('PLAY');
                const updatedQ = {
                    ...activeQuestion,
                    coopGroups: resetGroups,
                    coopPhase: 'PLAY',
                    winningGroup: null
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已重置合作題進度，再次開始比賽！", "info");
            };

            // Publish Regular Question
            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                
                let challengeContent = null;
                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請先上載並解析 Word 評估範本檔案！", "error");
                        return;
                    }
                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);
                publishQuestionToFirestore(newQ, updatedHistory);
                showToast(`已成功發佈【${getModeLabel(selectedMode)}】給所有學生！`, 'success');
            };

            // Release Challenge Scores
            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: { ...activeQuestion.challenge, scoresReleased: true }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已成功向全班發放挑戰題成績與對答詳情！", "success");
            };

            // Download All Student Audio as ZIP
            const handleDownloadAllAudio = async () => {
                const audioSubmissions = Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:audio'));
                if (audioSubmissions.length === 0) {
                    showToast("目前尚無學生提交錄音！", "error");
                    return;
                }

                try {
                    const zip = new JSZip();
                    const folder = zip.folder(`課堂錄音_房號${roomCode}`);
                    audioSubmissions.forEach((res) => {
                        const base64Data = res.answer.split(',')[1];
                        const fileName = `${res.seatNumber.toString().padStart(2, '0')}_${res.name || '學生'}.webm`;
                        folder.file(fileName, base64Data, { base64: true });
                    });

                    const content = await zip.generateAsync({ type: "blob" });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(content);
                    link.download = `OMIT_學生錄音_房號${roomCode}.zip`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast(`已打包並下載 ${audioSubmissions.length} 位學生的語音檔案！`, "success");
                } catch (err) {
                    console.error("ZIP creation error:", err);
                    showToast("打包錄音檔案失敗！", "error");
                }
            };

            // Requirement 2 & 26 & 32: Whiteboard / Short Answer Broadcast to Class
            const handleBroadcastSubmission = async (studentRes) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatedQ = { ...activeQuestion, broadcastedSubmission: studentRes };
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                showToast(`已廣播 ${studentRes.name} 的作品至全班學生螢幕進行互評！`, "success");
            };

            const handleCancelBroadcast = async () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatedQ = { ...activeQuestion, broadcastedSubmission: null };
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                showToast("已取消廣播分享", "info");
            };

            // Requirement 21 & 32: Teacher Demo Whiteboard Broadcast
            const handleToggleDemoBroadcast = async () => {
                const newState = !demoBroadcastActive;
                setDemoBroadcastActive(newState);

                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                if (newState) {
                    const canvas = demoCanvasRef.current;
                    const dataUrl = canvas ? canvas.toDataURL('image/png') : null;
                    const updatedQ = {
                        ...(activeQuestion || { id: 'demo_room', mode: 'DEMO', text: '教師示範白板' }),
                        teacherDemoWhiteboard: dataUrl
                    };
                    await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                    showToast("已將教師「示範白板」作品即時廣播至所有學生螢幕！", "success");
                } else {
                    const updatedQ = { ...activeQuestion, teacherDemoWhiteboard: null };
                    await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                    showToast("已收回教師示範白板廣播", "info");
                }
            };

            // Requirement 9: Random Selector Logic
            const handleSpinRandom = () => {
                if (isSpinning) return;
                
                const start = parseInt(rangeStart) || 1;
                const end = parseInt(rangeEnd) || 36;
                const available = [];
                for (let i = start; i <= end; i++) {
                    if (!drawnNumbers.includes(i)) available.push(i);
                }

                if (available.length === 0) {
                    showToast("此範圍內所有學號皆已被抽出！請點擊重置。", "error");
                    return;
                }

                setIsSpinning(true);
                let counter = 0;
                const maxIntervals = 20;

                const timer = setInterval(() => {
                    const temp = available[Math.floor(Math.random() * available.length)];
                    setCurrentDrawn(temp);
                    playSound('spin');
                    counter++;

                    if (counter >= maxIntervals) {
                        clearInterval(timer);
                        const finalPicked = available[Math.floor(Math.random() * available.length)];
                        setCurrentDrawn(finalPicked);
                        setDrawnNumbers(prev => [...prev, finalPicked]);
                        setIsSpinning(false);
                        playSound('win');
                    }
                }, 100);
            };

            // Requirement 17 & 20 & 30: CSV Export
            const handleExportCSVReport = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生紀錄可供匯出！", "error");
                    return;
                }

                let csvContent = "\uFEFF"; // UTF-8 BOM
                csvContent += "學號,學生姓名,加入時間";

                historyQuestions.forEach((q, idx) => {
                    const cleanText = (q.text || getModeLabel(q.mode)).replace(/"/g, '""');
                    if (q.mode === 'CHALLENGE' && q.challenge) {
                        csvContent += `,第${idx + 1}題[挑戰題:${q.challenge.title}得分],第${idx + 1}題[挑戰題正確率]`;
                    } else {
                        csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]: "${cleanText}"`;
                    }
                });
                csvContent += "\n";

                const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

                sortedStudents.forEach((stu) => {
                    const cleanName = (stu.name || '').replace(/"/g, '""');
                    csvContent += `"${stu.seatNumber}號","${cleanName}","${stu.joinTime || ''}"`;
                    
                    historyQuestions.forEach((q) => {
                        const resKey = `${q.id}_${stu.id}`;
                        const res = responses[resKey];
                        
                        if (res && res.answer !== undefined && res.answer !== null) {
                            if (q.mode === 'CHALLENGE' && res.scoreDetails) {
                                csvContent += `,"${res.scoreDetails.totalScore} / ${q.challenge.totalScore}分","${res.scoreDetails.percentage}% (用時:${res.duration || 0}s)"`;
                            } else {
                                let ansVal = res.answer;
                                if (typeof ansVal === 'string' && ansVal.startsWith('data:image')) {
                                    ansVal = '[圖像白板答案]';
                                } else if (typeof ansVal === 'string' && ansVal.startsWith('data:audio')) {
                                    ansVal = '[語音錄音檔案]';
                                }
                                const cleanAns = String(ansVal).replace(/"/g, '""');
                                csvContent += `,"${cleanAns} (用時:${res.duration || 0}s)"`;
                            }
                        } else {
                            csvContent += q.mode === 'CHALLENGE' ? `,"未作答","0%"` : `,"未作答"`;
                        }
                    });
                    csvContent += "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `OMIT_全班挑戰題與學習成績單_房號${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("已成功匯出全班挑戰題成績與學習試算表 (.csv)！", "success");
            };

            // Leaderboard sequence calculation
            const leaderboard = useMemo(() => {
                return Object.values(currentQuestionResponses)
                    .filter(r => r.duration !== undefined)
                    .sort((a, b) => {
                        if (activeQuestion?.mode === 'CHALLENGE') {
                            const scoreA = a.scoreDetails?.totalScore || 0;
                            const scoreB = b.scoreDetails?.totalScore || 0;
                            if (scoreB !== scoreA) return scoreB - scoreA;
                        }
                        return parseFloat(a.duration) - parseFloat(b.duration);
                    });
            }, [currentQuestionResponses, activeQuestion]);

            // Requirement 18: Buzzer Mode Locks & Displays ONLY 1st Student
            const buzzerWinner = useMemo(() => {
                if (activeQuestion?.mode !== 'BUZZER') return null;
                const list = Object.values(currentQuestionResponses).sort((a, b) => parseFloat(a.duration) - parseFloat(b.duration));
                return list.length > 0 ? list[0] : null;
            }, [currentQuestionResponses, activeQuestion]);

            // Challenge Mode score release status
            const challengeScoresAreReleased = useMemo(() => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return true;
                return !!(activeQuestion.challenge?.releaseInstant || activeQuestion.challenge?.scoresReleased);
            }, [activeQuestion]);

            return (
                <div class="min-h-screen pb-12">
                    {/* Header Controls */}
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 py-3">
                        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                            <div class="flex items-center space-x-3">
                                <span class="bg-slate-900 text-white font-black px-3 py-1.5 rounded-xl text-lg">OMIT</span>
                                <div>
                                    {/* Requirement 9: Teacher header title renamed */}
                                    <h1 class="font-bold text-slate-800 text-base flex items-center gap-2">
                                        宣道會陳元喜小學OMIT互動課堂
                                        <span class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded-full font-mono font-bold">
                                            房號：{roomCode}
                                        </span>
                                    </h1>
                                </div>
                            </div>

                            <div class="flex flex-wrap items-center gap-2">
                                {/* Requirement 11: Real-time student count badge */}
                                <button 
                                    onClick={() => setShowQRModal(true)}
                                    class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-2 rounded-xl border border-indigo-200 text-xs md:text-sm flex items-center space-x-1.5 transition"
                                >
                                    <span>📱 QR Code</span>
                                </button>

                                <button 
                                    onClick={() => setShowStudentListModal(true)}
                                    class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold px-3 py-2 rounded-xl border border-emerald-200 text-xs md:text-sm flex items-center space-x-1.5 transition"
                                >
                                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                                    <span>在線學生：{studentsList.length} 人</span>
                                </button>

                                {/* Requirement 21 & 32: Teacher Demo Whiteboard button */}
                                <button 
                                    onClick={() => setShowDemoWhiteboard(true)}
                                    class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-3 py-2 rounded-xl text-xs md:text-sm shadow transition flex items-center gap-1"
                                >
                                    <span>🎨 示範白板</span>
                                </button>

                                {/* Requirement 9: Random Student Drawer button */}
                                <button 
                                    onClick={() => setShowRandomModal(true)}
                                    class="bg-purple-50 hover:bg-purple-100 text-purple-700 font-bold px-3 py-2 rounded-xl border border-purple-200 text-xs md:text-sm transition"
                                >
                                    🎲 抽選學生
                                </button>

                                {/* Requirement 10: Enhanced Timer Tool */}
                                <button 
                                    onClick={() => setShowTimerModal(true)}
                                    class={`px-3 py-2 rounded-xl border text-xs md:text-sm font-bold flex items-center space-x-1.5 transition ${
                                        timerActive 
                                        ? 'bg-amber-500 text-white border-amber-600 animate-pulse' 
                                        : 'bg-amber-50 hover:bg-amber-100 text-amber-800 border-amber-200'
                                    }`}
                                >
                                    <span>⏱️ 計時器</span>
                                    {timerSeconds > 0 && (
                                        <span class="bg-white/20 font-mono text-xs px-1.5 py-0.5 rounded">
                                            {Math.floor(timerSeconds / 60)}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                        </span>
                                    )}
                                </button>

                                <button 
                                    onClick={handleExportCSVReport}
                                    class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold px-3 py-2 rounded-xl border border-blue-200 text-xs md:text-sm transition"
                                >
                                    📊 匯出報告
                                </button>

                                <button 
                                    onClick={handleExitRoom}
                                    class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2 rounded-xl border border-rose-200 text-xs md:text-sm transition"
                                >
                                    🚪 退出課室
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Container */}
                    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

                        {/* Mode Selectors */}
                        <div class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-9 gap-2.5">
                            {[
                                { id: 'CHOICE', label: '選擇題', icon: '🔘' },
                                { id: 'TF', label: '是非題', icon: '⭕' },
                                { id: 'SHORT', label: '短答題', icon: '✍️' },
                                { id: 'DRAW', label: '白板題', icon: '🎨' },
                                { id: 'BUZZER', label: '搶答題', icon: '🚨' },
                                { id: 'AUDIO', label: '錄音題', icon: '🎤' },
                                { id: 'CHALLENGE', label: '挑戰題', icon: '🏆' },
                                { id: 'COOP', label: '合作題', icon: '🤝' },
                                { id: 'LINK', label: '派送連結', icon: '🔗' }
                            ].map((mode) => (
                                <button 
                                    key={mode.id}
                                    onClick={() => setSelectedMode(mode.id)}
                                    class={`p-3 rounded-2xl font-bold border-2 transition-all text-center flex flex-col items-center justify-center space-y-1 shadow-sm active:scale-95 ${
                                        selectedMode === mode.id 
                                        ? 'bg-slate-900 text-white border-slate-900 ring-4 ring-slate-200' 
                                        : 'bg-white text-slate-700 border-slate-200 hover:border-slate-300 hover:bg-slate-50'
                                    }`}
                                >
                                    <span class="text-xl">{mode.icon}</span>
                                    <span class="text-xs font-extrabold">{mode.label}</span>
                                </button>
                            ))}
                        </div>

                        {/* Question Creation Panel */}
                        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                            <div class="flex flex-wrap items-center justify-between border-b pb-3 gap-2">
                                <h2 class="font-extrabold text-slate-800 text-lg flex items-center gap-2">
                                    <span>模式設定：{getModeLabel(selectedMode)}</span>
                                </h2>

                                {selectedMode !== 'CHALLENGE' && selectedMode !== 'COOP' && (
                                    <div class="flex items-center space-x-2 bg-slate-100 p-1.5 rounded-xl">
                                        <span class="text-xs font-bold text-slate-600 pl-2">提交後允許修改：</span>
                                        <button 
                                            onClick={() => setLockAfterSubmit(!lockAfterSubmit)}
                                            class={`px-3 py-1 rounded-lg text-xs font-bold transition ${!lockAfterSubmit ? 'bg-emerald-500 text-white' : 'bg-slate-300 text-slate-600'}`}
                                        >
                                            {!lockAfterSubmit ? '已開放修改' : '已鎖定 (預設)'}
                                        </button>
                                    </div>
                                )}
                            </div>

                            {selectedMode === 'CHOICE' && (
                                <div class="flex items-center space-x-4">
                                    <label class="text-sm font-bold text-slate-700">選項數量：</label>
                                    {[4, 5].map((cnt) => (
                                        <button 
                                            key={cnt} 
                                            onClick={() => setChoiceCount(cnt)}
                                            class={`px-3 py-1.5 rounded-xl font-bold text-sm border ${choiceCount === cnt ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-700'}`}
                                        >
                                            {cnt} 個選項 ({cnt === 4 ? 'A-D' : 'A-E'})
                                        </button>
                                    ))}
                                </div>
                            )}

                            {selectedMode === 'AUDIO' && (
                                <div class="bg-cyan-50 border border-cyan-200 p-4 rounded-2xl text-cyan-900 space-y-2">
                                    <div class="font-bold text-sm flex items-center gap-2">
                                        <span>🎤 錄音題模式說明：</span>
                                    </div>
                                    <p class="text-xs text-cyan-800 leading-relaxed">
                                        學生可在手機或平板直接錄製不多於 10 秒的語音回答。提交後具備獨立試聽與刪除重錄，教師頁面可即時播放所有錄音並可一鍵打包下載 ZIP。
                                    </p>
                                </div>
                            )}

                            {/* Requirement 12 & 13: Challenge Question Setup */}
                            {selectedMode === 'CHALLENGE' && (
                                <div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 p-5 rounded-2xl space-y-5 text-slate-800">
                                    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-amber-200 pb-3">
                                        <h3 class="font-black text-amber-900 text-base flex items-center gap-2">
                                            <span>🏆 Word 評估挑戰題設定</span>
                                        </h3>
                                        <div class="flex items-center space-x-2">
                                            {/* Requirement 12: Renamed button to "下載評估範本Word檔" */}
                                            <button 
                                                type="button"
                                                onClick={handleDownloadChallengeTemplate}
                                                class="bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow transition flex items-center gap-1.5"
                                            >
                                                <span>📄 下載評估範本Word檔</span>
                                            </button>
                                        </div>
                                    </div>

                                    <div class="bg-white p-4 rounded-xl border border-amber-200 space-y-3">
                                        <label class="block text-xs font-bold text-slate-700">
                                            1. 上載評估範本 Word檔 (.docx) 或文字檔：
                                        </label>
                                        <input 
                                            type="file" 
                                            accept=".docx,.txt"
                                            onChange={(e) => handleWordFileUpload(e, false)}
                                            class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-600 file:text-white hover:file:bg-amber-700 cursor-pointer"
                                        />

                                        {/* Requirement 12: AI/Parsed Interactive Teacher Editor */}
                                        {challengeData && (
                                            <div class="bg-amber-50/90 p-4 rounded-xl border-2 border-amber-300 space-y-4">
                                                <div class="flex flex-wrap items-center justify-between gap-2 border-b border-amber-200 pb-2">
                                                    <span class="font-black text-amber-900 text-sm">✏️ 教師編輯/確認評估內容：</span>
                                                    <span class="text-xs text-amber-700 font-bold">可修訂題目、選項、正確答案或刪除題目</span>
                                                </div>

                                                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                                                    <div class="md:col-span-2">
                                                        <label class="block text-xs font-bold text-slate-600 mb-1">評估標題：</label>
                                                        <input 
                                                            type="text" 
                                                            value={challengeData.title}
                                                            onChange={(e) => setChallengeData({ ...challengeData, title: e.target.value })}
                                                            class="w-full px-3 py-2 rounded-lg border focus:ring-2 focus:ring-amber-500 font-bold text-slate-800 text-sm bg-white"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label class="block text-xs font-bold text-slate-600 mb-1">總分 (分)：</label>
                                                        <input 
                                                            type="number" 
                                                            value={challengeData.totalScore}
                                                            onChange={(e) => setChallengeData({ ...challengeData, totalScore: parseInt(e.target.value) || 100 })}
                                                            class="w-full px-3 py-2 rounded-lg border focus:ring-2 focus:ring-amber-500 font-bold text-slate-800 text-sm bg-white"
                                                        />
                                                    </div>
                                                </div>
