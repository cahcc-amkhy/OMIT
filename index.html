                    {/* Requirement 9: QR Code Modal with Real-time Joined List */}
                    {showQRModal && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 md:p-8 max-w-lg w-full text-center space-y-5 shadow-2xl">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="text-xl font-black text-slate-800">課堂加入 QR Code</h3>
                                    <button onClick={() => setShowQRModal(false)} class="text-slate-400 text-2xl font-bold">✕</button>
                                </div>

                                <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100 inline-block">
                                    <img src={qrImageUrl} class="mx-auto rounded-2xl border p-2 bg-white w-48 h-48 shadow-sm" alt="QR Code" />
                                    <div class="font-mono font-black text-3xl text-indigo-600 tracking-widest mt-2">
                                        房號：{roomCode}
                                    </div>
                                </div>

                                <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-2xl flex items-center justify-center space-x-2">
                                    <span class="relative flex h-3 w-3">
                                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                      <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                                    </span>
                                    <span class="font-extrabold text-emerald-800 text-base">
                                        實時在線人數：{studentsList.length} 人
                                    </span>
                                </div>

                                <div class="bg-slate-50 rounded-2xl p-3 border max-h-36 overflow-y-auto">
                                    <div class="text-xs font-bold text-slate-400 text-left mb-2">已連線學生列表：</div>
                                    <div class="flex flex-wrap gap-1.5">
                                        {[...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber)).map(s => (
                                            <span key={s.id} class="px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-xs font-bold text-slate-700 shadow-sm">
                                                {s.seatNumber}號 - {s.name}
                                            </span>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Whiteboard Inspect Modal */}
                    {showInspectModal && (
                        <div class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-3xl w-full space-y-4 shadow-2xl">
                                <div class="flex justify-between items-center">
                                    <h3 class="text-lg font-black text-slate-800">
                                        作品預覽：{showInspectModal.name} ({showInspectModal.seatNumber}號)
                                    </h3>
                                    <button onClick={() => setShowInspectModal(null)} class="text-slate-400 text-2xl font-bold">✕</button>
                                </div>

                                <div class="aspect-16-9 bg-slate-100 rounded-2xl overflow-hidden border-2 flex items-center justify-center">
                                    <img src={showInspectModal.answer} class="max-h-full object-contain" alt="大圖" />
                                </div>

                                <div class="flex justify-between items-center pt-2">
                                    <div class="flex space-x-2">
                                        <button 
                                            onClick={() => {
                                                const idx = whiteboardSubmissions.findIndex(s => s.studentId === showInspectModal.studentId);
                                                if (idx > 0) setShowInspectModal(whiteboardSubmissions[idx - 1]);
                                            }}
                                            class="px-4 py-2 rounded-xl bg-slate-100 font-bold text-sm text-slate-700 hover:bg-slate-200"
                                        >
                                            ⬅️ 上一位
                                        </button>
                                        <button 
                                            onClick={() => {
                                                const idx = whiteboardSubmissions.findIndex(s => s.studentId === showInspectModal.studentId);
                                                if (idx < whiteboardSubmissions.length - 1) setShowInspectModal(whiteboardSubmissions[idx + 1]);
                                            }}
                                            class="px-4 py-2 rounded-xl bg-slate-100 font-bold text-sm text-slate-700 hover:bg-slate-200"
                                        >
                                            下一位 ➡️
                                        </button>
                                    </div>

                                    <button 
                                        onClick={() => handleBroadcastSubmission(showInspectModal)}
                                        class="px-5 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-black text-sm shadow-md"
                                    >
                                        📢 廣播至全班螢幕 (學生互評)
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
            const [textAnswer, setTextAnswer] = useState('');
            const [isRecording, setIsRecording] = useState(false);
            const [audioBlobUrl, setAudioBlobUrl] = useState(null);
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [submitted, setSubmitted] = useState(false);
            const [challengeTimerLeft, setChallengeTimerLeft] = useState(null);

            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            // Check if already submitted for current question
            const currentResponse = useMemo(() => {
                if (!activeQuestion) return null;
                return responses[`${activeQuestion.id}_${studentId}`] || null;
            }, [responses, activeQuestion, studentId]);

            useEffect(() => {
                if (currentResponse) {
                    setSubmitted(true);
                } else {
                    setSubmitted(false);
                    setTextAnswer('');
                    setAudioBlobUrl(null);
                    setChallengeAnswers({});
                }
            }, [currentResponse, activeQuestion]);

            // Requirement 10 & 17: Challenge Auto Countdown & Submit
            useEffect(() => {
                let interval = null;
                if (activeQuestion?.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer && !submitted) {
                    const elapsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                    const remaining = Math.max(0, activeQuestion.challenge.timeLimit - elapsed);
                    setChallengeTimerLeft(remaining);

                    interval = setInterval(() => {
                        setChallengeTimerLeft(r => {
                            if (r <= 1) {
                                clearInterval(interval);
                                // Auto submit challenge on 00:00 timeout
                                autoSubmitChallenge();
                                return 0;
                            }
                            return r - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [activeQuestion, submitted]);

            const autoSubmitChallenge = () => {
                if (submitted) return;
                handleStudentSubmit(challengeAnswers, true);
            };

            // Requirement 4: Audio recording process with deletion & preview
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            setAudioBlobUrl(reader.result);
                        };
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);

                    // Auto stop at 10 seconds
                    setTimeout(() => {
                        if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
                            mediaRecorderRef.current.stop();
                            setIsRecording(false);
                        }
                    }, 10000);
                } catch (err) {
                    console.error("Mic access error:", err);
                    showToast("無法存取麥克風，請檢查權限設定！", "error");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const handleStudentSubmit = async (ansVal, isAuto = false) => {
                if (!activeQuestion) return;

                const durationSec = ((Date.now() - activeQuestion.startTime) / 1000).toFixed(1);
                
                let scoreDetails = null;
                if (activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge) {
                    let correctCount = 0;
                    const questions = activeQuestion.challenge.questions;
                    questions.forEach(q => {
                        if (ansVal[q.num] === q.answer) correctCount++;
                    });
                    const score = Math.round((correctCount / questions.length) * activeQuestion.challenge.totalScore);
                    const percentage = Math.round((correctCount / questions.length) * 100);
                    scoreDetails = {
                        correctCount,
                        totalQuestions: questions.length,
                        totalScore: score,
                        percentage
                    };
                }

                const resObj = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName.trim() || `學號 ${seatNumber}`,
                    answer: ansVal,
                    duration: durationSec,
                    scoreDetails: scoreDetails,
                    submittedAt: Date.now()
                };

                const appId = "omit-8c173";
                const db = window.fbDb;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', `${activeQuestion.id}_${studentId}`);
                await window.fbUtils.setDoc(resDocRef, resObj);

                setSubmitted(true);
                playSound('win');
                showToast(isAuto ? "時間到！系統已自動幫您提交作答。" : "答案已成功提交！", "success");
            };

            return (
                <div class="min-h-screen bg-slate-100 pb-12">
                    <header class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-30">
                        <div class="max-w-2xl mx-auto flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <span class="bg-indigo-600 font-black text-xs px-2.5 py-1 rounded-lg">OMIT</span>
                                <span class="font-extrabold text-sm">{seatNumber} 號 {studentName}</span>
                            </div>
                            <button onClick={onExit} class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700">
                                退出
                            </button>
                        </div>
                    </header>

                    <main class="max-w-2xl mx-auto p-4 space-y-6">

                        {/* Broadcasted Peer Evaluation Box */}
                        {activeQuestion?.broadcastedSubmission && (
                            <div class="bg-purple-900 text-white p-5 rounded-3xl shadow-xl space-y-3 border-2 border-purple-400 animate-fade-in">
                                <div class="flex items-center justify-between">
                                    <span class="bg-purple-500 text-xs font-black px-2.5 py-1 rounded-lg">全班廣播互評</span>
                                    <span class="font-bold text-xs text-purple-200">
                                        來自：{activeQuestion.broadcastedSubmission.name} ({activeQuestion.broadcastedSubmission.seatNumber}號)
                                    </span>
                                </div>
                                <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden border">
                                    <img src={activeQuestion.broadcastedSubmission.answer} class="w-full h-full object-contain" alt="廣播作品" />
                                </div>
                            </div>
                        )}

                        {!activeQuestion ? (
                            <div class="bg-white rounded-3xl p-8 text-center space-y-4 shadow-sm border border-slate-200 my-12">
                                <div class="text-5xl animate-bounce">⏳</div>
                                <h3 class="text-xl font-black text-slate-800">安靜等候老師指示...</h3>
                                <p class="text-xs text-slate-400">當老師發佈題目時，頁面將會自動更新</p>
                            </div>
                        ) : (
                            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-6">
                                <div class="border-b pb-4 space-y-1">
                                    <span class="text-xs font-black text-indigo-600 uppercase tracking-widest">
                                        進行中 [{getModeLabel(activeQuestion.mode)}]
                                    </span>
                                    <h2 class="text-xl font-black text-slate-800">{activeQuestion.text}</h2>
                                    
                                    {/* Requirement 10: Timer display */}
                                    {activeQuestion.mode === 'CHALLENGE' && challengeTimerLeft !== null && (
                                        <div class="bg-amber-50 border border-amber-200 p-3 rounded-2xl flex justify-between items-center text-amber-900 mt-2">
                                            <span class="text-xs font-bold">⏱️ 答題剩餘時間：</span>
                                            <span class="font-mono text-xl font-black text-amber-600">
                                                {Math.floor(challengeTimerLeft / 60).toString().padStart(2, '0')}:{(challengeTimerLeft % 60).toString().padStart(2, '0')}
                                            </span>
                                        </div>
                                    )}
                                </div>

                                {/* Requirement 5: Unified submission feedback */}
                                {submitted ? (
                                    <div class="space-y-6">
                                        <div class="bg-emerald-50 border-2 border-emerald-300 p-5 rounded-2xl text-center space-y-2">
                                            <div class="text-3xl">🎉</div>
                                            <h3 class="text-lg font-black text-emerald-800">
                                                已提交答案! 讚賞你的努力! 安靜等候老師指示...
                                            </h3>
                                        </div>

                                        {/* Requirement 12, 17: Unlocked Challenge review with Green/Red styling */}
                                        {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                            activeQuestion.challenge.scoresReleased || activeQuestion.challenge.releaseInstant ? (
                                                <div class="space-y-4 pt-2">
                                                    <div class="bg-indigo-50 border border-indigo-200 p-4 rounded-2xl flex justify-between items-center text-indigo-900 font-bold">
                                                        <span>得分結果：</span>
                                                        <span class="text-2xl font-black text-indigo-600">
                                                            {currentResponse?.scoreDetails?.totalScore} / {activeQuestion.challenge.totalScore} 分
                                                        </span>
                                                    </div>

                                                    <div class="space-y-3">
                                                        {activeQuestion.challenge.questions.map((q) => {
                                                            const studentSelected = currentResponse?.answer?.[q.num];
                                                            const isCorrect = studentSelected === q.answer;

                                                            return (
                                                                <div key={q.num} class="bg-slate-50 p-4 rounded-2xl border space-y-2 text-xs">
                                                                    <div class="font-bold text-slate-800 text-sm flex items-center justify-between">
                                                                        <span>第 {q.num} 題: {q.text}</span>
                                                                        <span class={isCorrect ? 'text-emerald-600 font-black' : 'text-rose-600 font-black'}>
                                                                            {isCorrect ? '✓ 答對' : '✕ 答錯'}
                                                                        </span>
                                                                    </div>
                                                                    <div class="grid grid-cols-2 gap-2">
                                                                        {q.options.map((opt) => {
                                                                            let optStyle = "bg-white border-slate-200 text-slate-700";
                                                                            if (opt.letter === q.answer) {
                                                                                optStyle = "bg-emerald-100 border-emerald-400 text-emerald-900 font-bold ring-2 ring-emerald-300";
                                                                            } else if (opt.letter === studentSelected && !isCorrect) {
                                                                                optStyle = "bg-rose-100 border-rose-400 text-rose-900 font-bold ring-2 ring-rose-300";
                                                                            }

                                                                            return (
                                                                                <div key={opt.letter} class={`p-2 rounded-xl border ${optStyle}`}>
                                                                                    {opt.letter}. {opt.text}
                                                                                </div>
                                                                            );
                                                                        })}
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            ) : (
                                                <div class="text-center text-xs text-slate-400 bg-slate-50 p-4 rounded-2xl border">
                                                    等待老師一併發放挑戰題成績...
                                                </div>
                                            )
                                        )}
                                    </div>
                                ) : (
                                    /* Active Question Input Modes */
                                    <div class="space-y-4">
                                        {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                {activeQuestion.choiceOptions.map((opt) => (
                                                    <button 
                                                        key={opt}
                                                        onClick={() => handleStudentSubmit(opt)}
                                                        class="p-4 rounded-2xl border-2 border-slate-200 hover:border-indigo-600 hover:bg-indigo-50 font-black text-xl text-slate-800 transition active:scale-95 shadow-sm"
                                                    >
                                                        {opt}
                                                    </button>
                                                ))}
                                            </div>
                                        )}

                                        {/* Requirement 16: Buzzer Mode */}
                                        {activeQuestion.mode === 'BUZZER' && (
                                            <div class="text-center py-6">
                                                <button 
                                                    onClick={() => handleStudentSubmit('⚡ 搶答按鈕')}
                                                    class="w-48 h-48 rounded-full bg-rose-600 hover:bg-rose-700 active:scale-90 text-white font-black text-3xl shadow-2xl border-4 border-rose-300 transition flex items-center justify-center mx-auto"
                                                >
                                                    搶答！
                                                </button>
                                            </div>
                                        )}

                                        {/* Requirement 1: High Precision Whiteboard Canvas */}
                                        {activeQuestion.mode === 'DRAW' && (
                                            <WhiteboardCanvas 
                                                bgImage={activeQuestion.whiteboardBg} 
                                                onSubmit={(imgData) => handleStudentSubmit(imgData)} 
                                            />
                                        )}

                                        {/* Requirement 4: Audio recording process */}
                                        {activeQuestion.mode === 'AUDIO' && (
                                            <div class="bg-cyan-50 border border-cyan-200 p-5 rounded-3xl text-center space-y-4">
                                                {!audioBlobUrl ? (
                                                    <div class="space-y-3">
                                                        <button 
                                                            onClick={isRecording ? stopRecording : startRecording}
                                                            class={`w-28 h-28 rounded-full font-black text-lg text-white shadow-lg transition mx-auto flex items-center justify-center ${isRecording ? 'bg-rose-600 animate-pulse' : 'bg-cyan-600 hover:bg-cyan-700'}`}
                                                        >
                                                            {isRecording ? '⏹️ 停止' : '🎤 開始錄音'}
                                                        </button>
                                                        <p class="text-xs text-cyan-800 font-bold">最長可錄製 10 秒</p>
                                                    </div>
                                                ) : (
                                                    <div class="space-y-4">
                                                        <audio src={audioBlobUrl} controls class="w-full rounded-xl" />
                                                        <div class="flex space-x-2">
                                                            <button 
                                                                onClick={() => setAudioBlobUrl(null)}
                                                                class="flex-1 py-3 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold text-xs"
                                                            >
                                                                🗑️ 刪除重錄
                                                            </button>
                                                            <button 
                                                                onClick={() => handleStudentSubmit(audioBlobUrl)}
                                                                class="flex-1 py-3 rounded-xl bg-cyan-600 hover:bg-cyan-700 text-white font-bold text-xs shadow"
                                                            >
                                                                ✅ 確認提交錄音
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {/* Requirement 3: Link Dispatching with YouTube iframe & button */}
                                        {activeQuestion.mode === 'LINK' && (
                                            <div class="space-y-4">
                                                {activeQuestion.youtubeEmbed ? (
                                                    <div class="aspect-16-9 w-full rounded-2xl overflow-hidden border">
                                                        <iframe 
                                                            src={activeQuestion.youtubeEmbed} 
                                                            class="w-full h-full" 
                                                            allow="autoplay; encrypted-media" 
                                                            allowFullScreen 
                                                        />
                                                    </div>
                                                ) : (
                                                    <div class="p-4 bg-amber-50 border border-amber-200 rounded-2xl text-amber-900 font-mono text-sm break-all">
                                                        {activeQuestion.pushedUrl}
                                                    </div>
                                                )}
                                                <a 
                                                    href={activeQuestion.pushedUrl} 
                                                    target="_blank" 
                                                    rel="noopener noreferrer"
                                                    class="block w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-center rounded-2xl shadow transition"
                                                >
                                                    開啟連結網站 ↗
                                                </a>
                                            </div>
                                        )}

                                        {/* Short Answer Mode */}
                                        {activeQuestion.mode === 'SHORT' && (
                                            <div class="space-y-3">
                                                <textarea 
                                                    rows={4}
                                                    value={textAnswer}
                                                    onChange={(e) => setTextAnswer(e.target.value)}
                                                    placeholder="請輸入您的答案..."
                                                    class="w-full p-4 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 font-medium"
                                                />
                                                <button 
                                                    onClick={() => handleStudentSubmit(textAnswer)}
                                                    class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow transition"
                                                >
                                                    確認提交短答
                                                </button>
                                            </div>
                                        )}

                                        {/* Requirement 12, 17: Challenge Question Student Form */}
                                        {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                            <div class="space-y-5">
                                                {activeQuestion.challenge.questions.map((q) => (
                                                    <div key={q.num} class="bg-slate-50 p-4 rounded-2xl border space-y-2 text-xs">
                                                        <div class="font-bold text-slate-800 text-sm">
                                                            {q.num}. {q.text}
                                                        </div>
                                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                            {q.options.map((opt) => (
                                                                <button 
                                                                    key={opt.letter}
                                                                    type="button"
                                                                    onClick={() => setChallengeAnswers({ ...challengeAnswers, [q.num]: opt.letter })}
                                                                    class={`p-2.5 rounded-xl border text-left font-bold transition ${
                                                                        challengeAnswers[q.num] === opt.letter 
                                                                        ? 'bg-amber-500 text-white border-amber-600 shadow' 
                                                                        : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100'
                                                                    }`}
                                                                >
                                                                    {opt.letter}. {opt.text}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}

                                                <button 
                                                    onClick={() => handleStudentSubmit(challengeAnswers)}
                                                    class="w-full py-4 bg-amber-600 hover:bg-amber-700 text-white font-black rounded-2xl shadow-lg transition active:scale-95 text-base"
                                                >
                                                    ✅ 確認提交整份挑戰題
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
