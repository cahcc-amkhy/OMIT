    <script type="text/babel">

        // Mode Labels

                case 'DRAW': return '請在白板上作答或繪圖：';
                case 'BUZZER': return '請準備點擊搶答按鈕！';
                case 'AUDIO': return '請錄製語音回答：';
                case 'CHALLENGE': return '請在限時內完成以下挑戰題評估：';
                case 'COOP': return '請與同組組員合作完成本題：';
                case 'LINK': return '請點擊或觀看下方派送內容：';
                default: return '請回答問題：';
            }
        }

        // Web Audio Synthesizer Sound Generator
        let audioCtx = null;
        let raceOscInterval = null;

        const playSound = (type) => {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                if (type === 'buzzer') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.08);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(audioCtx.currentTime + idx * 0.1);
                        osc.stop(audioCtx.currentTime + idx * 0.1 + 0.3);
                    });
                } else if (type === 'alarm') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                }
            } catch (e) {
                console.error("Audio synth error:", e);
            }
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3500);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-600' : 'bg-indigo-600';

            return (
                <div class={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-2 text-sm font-bold animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        // Create Word template (.docx) blob
        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) throw new Error("JSZip not loaded");
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>${paragraphsXml}</w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        // Parse Word Docx raw text into structured question list
        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '課堂綜合練習';
            let totalScore = 100;
            const questions = [];
            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) {
                        questions.push(currentQ);
                    }
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }

                    currentQ.options.push({ letter, text: optText });
                    if (isCorrect) currentQ.answer = letter;
                }
            });

            if (currentQ && currentQ.options.length > 0) {
                questions.push(currentQ);
            }

            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1,
                            text: "以下哪一項不是地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "機械資源" }
                            ],
                            answer: "D"
                        },
                        {
                            num: 2,
                            text: "芝士的原料屬於哪一項地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "礦產資源" }
                            ],
                            answer: "C"
                        }
                    ]
                };
            }

            return { title, totalScore, questions };
        };

        // Precision Whiteboard Canvas Component (1280x720 internal scaling)
        function WhiteboardCanvas({ bgImage, onSave, onBroadcast, showBroadcastBtn, showCloseBtn, onClose, isTeacher = false }) {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [strokeWidth, setStrokeWidth] = useState(4);
            const [color, setColor] = useState('#000000');
            const [isEraser, setIsEraser] = useState(false);
            const [bgImgObj, setBgImgObj] = useState(null);

            // Canvas initialization
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                canvas.width = 1280;
                canvas.height = 720;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 1280, 720);
            }, []);

            // Handle background image loading & redrawing
            useEffect(() => {
                if (!bgImage) return;
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => {
                    setBgImgObj(img);
                    const canvas = canvasRef.current;
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 1280, 720);
                };
                img.src = bgImage;
            }, [bgImage]);

            // Coordinate mapping formula: scaleX / scaleY to fix touch offset on iPad
            const getCanvasPos = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                setIsDrawing(true);
                const pos = getCanvasPos(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const pos = getCanvasPos(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.lineTo(pos.x, pos.y);
                ctx.strokeStyle = isEraser ? '#ffffff' : color;
                ctx.lineWidth = isEraser ? strokeWidth * 3 : strokeWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            };

            const stopDrawing = (e) => {
                if (!isDrawing) return;
                setIsDrawing(false);
            };

            const handleClear = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 1280, 720);
                if (bgImgObj) {
                    ctx.drawImage(bgImgObj, 0, 0, 1280, 720);
                }
            };

            const handleUploadBg = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const img = new Image();
                        img.onload = () => {
                            setBgImgObj(img);
                            const canvas = canvasRef.current;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, 1280, 720);
                        };
                        img.src = evt.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            const exportCanvasData = () => {
                return canvasRef.current.toDataURL('image/png');
            };

            return (
                <div class="space-y-3 w-full">
                    {/* Drawing Tools Bar */}
                    <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-800 text-white p-3 rounded-2xl shadow-lg">
                        <div class="flex items-center space-x-2">
                            <label class="text-xs font-bold text-slate-300">畫筆粗細:</label>
                            <input 
                                type="range" 
                                min="2" 
                                max="18" 
                                value={strokeWidth} 
                                onChange={(e) => setStrokeWidth(parseInt(e.target.value))}
                                class="w-24 accent-indigo-400 cursor-pointer"
                            />
                            <span class="text-xs font-mono font-bold w-6">{strokeWidth}px</span>

                            <div class="h-6 w-px bg-slate-600 mx-1"></div>

                            {/* Colors */}
                            {!isEraser && (
                                <div class="flex items-center space-x-1.5">
                                    {['#000000', '#dc2626', '#2563eb', '#16a34a', '#d97706', '#9333ea'].map((c) => (
                                        <button 
                                            key={c} 
                                            onClick={() => setColor(c)}
                                            class={`w-6 h-6 rounded-full border-2 transition ${color === c ? 'scale-125 border-white ring-2 ring-indigo-400' : 'border-transparent'}`}
                                            style={{ backgroundColor: c }}
                                        />
                                    ))}
                                </div>
                            )}
                        </div>

                        <div class="flex items-center space-x-2">
                            <button 
                                onClick={() => setIsEraser(!isEraser)}
                                class={`px-3 py-1.5 rounded-xl font-bold text-xs transition flex items-center space-x-1 ${isEraser ? 'bg-amber-500 text-white ring-2 ring-amber-300' : 'bg-slate-700 hover:bg-slate-600'}`}
                            >
                                <span>🧽 擦膠</span>
                            </button>

                            <button 
                                onClick={handleClear}
                                class="px-3 py-1.5 rounded-xl font-bold text-xs bg-rose-600 hover:bg-rose-700 text-white transition flex items-center space-x-1"
                            >
                                <span>🗑️ 清空</span>
                            </button>

                            {!isTeacher && (
                                <label class="px-3 py-1.5 rounded-xl font-bold text-xs bg-indigo-600 hover:bg-indigo-700 text-white cursor-pointer transition flex items-center space-x-1">
                                    <span>🖼️ 背景圖片</span>
                                    <input type="file" accept="image/*" onChange={handleUploadBg} class="hidden" />
                                </label>
                            )}
                        </div>
                    </div>

                    {/* Canvas Container */}
                    <div class="canvas-container relative w-full aspect-16-9 bg-white rounded-2xl overflow-hidden border-2 border-slate-300 shadow-inner">
                        <canvas 
                            ref={canvasRef}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            class="w-full h-full cursor-crosshair touch-none"
                        />
                    </div>

                    {/* Action Bottom Buttons */}
                    <div class="flex items-center justify-between gap-3 pt-1">
                        {onSave && (
                            <button 
                                onClick={() => onSave(exportCanvasData())}
                                class="flex-1 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-2xl shadow-lg shadow-emerald-200 text-base transition active:scale-98 flex items-center justify-center space-x-2"
                            >
                                <span>✅ 確認提交白板答案</span>
                            </button>
                        )}

                        {showBroadcastBtn && onBroadcast && (
                            <button 
                                onClick={() => onBroadcast(exportCanvasData())}
                                class="flex-1 py-3.5 bg-purple-600 hover:bg-purple-700 text-white font-black rounded-2xl shadow-lg text-base transition active:scale-98 flex items-center justify-center space-x-2"
                            >
                                <span>📢 廣播分享至學生螢幕</span>
                            </button>
                        )}

                        {showCloseBtn && onClose && (
                            <button 
                                onClick={onClose}
                                class="px-6 py-3.5 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold rounded-2xl text-sm transition"
                            >
                                關閉白板
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        // Main App Component
        function OMITApp() {
            const [role, setRole] = useState('LANDING'); // 'LANDING', 'TEACHER', 'STUDENT'
            const [roomCode, setRoomCode] = useState('');
            const [seatNumber, setSeatNumber] = useState('1');
            const [studentName, setStudentName] = useState('');
            const [teacherPassword, setTeacherPassword] = useState('');
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [toast, setToast] = useState(null);

            const [activeQuestion, setActiveQuestion] = useState(null);
            const [studentsList, setStudentsList] = useState([]);
            const [responses, setResponses] = useState({});
            const [historyQuestions, setHistoryQuestions] = useState([]);
            const [isAuthReady, setIsAuthReady] = useState(false);

            const myStudentId = useRef('std_' + Math.random().toString(36).substring(2, 9));

        // Teacher Dashboard Component
        function TeacherDashboard({ roomCode, activeQuestion, setActiveQuestion, responses, setResponses, studentsList, historyQuestions, setHistoryQuestions, showToast, onExit }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE'); 
            const [questionText, setQuestionText] = useState('');
            const [choiceCount, setChoiceCount] = useState(4);
            const [lockAfterSubmit, setLockAfterSubmit] = useState(true);
            const [whiteboardBg, setWhiteboardBg] = useState(null);

            // Teacher Whiteboard Modal

            // Modals & Tools
            const [showQRModal, setShowQRModal] = useState(false);
            const [showStudentListModal, setShowStudentListModal] = useState(false);
            const [showInspectModal, setShowInspectModal] = useState(null);
            const [barChoiceFilter, setBarChoiceFilter] = useState(null);

            const [showRandomModal, setShowRandomModal] = useState(false);
            const [rangeStart, setRangeStart] = useState(1);

            const [drawnNumbers, setDrawnNumbers] = useState([]);
            const [currentDrawn, setCurrentDrawn] = useState(null);
            const [isSpinning, setIsSpinning] = useState(false);

            // Revision Item 10: Enhanced Timer Tool
            const [showTimerModal, setShowTimerModal] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerActive, setTimerActive] = useState(false);
            const [timerZoomed, setTimerZoomed] = useState(false);
            const [timerMinsInput, setTimerMinsInput] = useState(1);
            const [timerSecsInput, setTimerSecsInput] = useState(0);

            // Challenge Question Setup
            const [challengeData, setChallengeData] = useState(null);
            const [challengeEnableTimer, setChallengeEnableTimer] = useState(true);
            const [challengeTimeLimit, setChallengeTimeLimit] = useState(120); 
            const [challengeReleaseInstant, setChallengeReleaseInstant] = useState(true);
            const [showChallengeScoresOnLeaderboard, setShowChallengeScoresOnLeaderboard] = useState(true);

            // Revision Item 22: Cooperative Mode Setup & Game State
            const [coopData, setCoopData] = useState(null);
            const [coopStage, setCoopStage] = useState('PREP'); // 'PREP', 'GROUPING', 'RACE'
            const [coopGroups, setCoopGroups] = useState([]); // Array of groups with members
            const [coopProgress, setCoopProgress] = useState({}); // { groupIndex: currentQuestionIndex }
            const [coopWinner, setCoopWinner] = useState(null);

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

            // Current question responses filter
            const currentQuestionResponses = useMemo(() => {
                if (!activeQuestion) return {};
                const filtered = {};
                Object.values(responses).forEach(r => {
                    if (r.questionId === activeQuestion.id) {
                        filtered[r.studentId] = r;
                    }
                });
                return filtered;
            }, [responses, activeQuestion]);

            // Timer Interval Logic
            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(s => {
                            if (s <= 1) {
                                setTimerActive(false);
                                playSound('alarm');
                                return 0;
                            }
                            return s - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            // Sync Active Question & History to Firestore
            const publishQuestionToFirestore = async (qObj, newHistoryList) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatePayload = {
                    activeQuestion: qObj,
                    updatedAt: Date.now()
                };
                if (newHistoryList) {
                    updatePayload.history = newHistoryList;
                }

                await window.fbUtils.setDoc(roomDocRef, updatePayload, { merge: true });
            };

            const handleExitRoom = async () => {
                if (window.confirm("確定退出課室？將會同步清空此課室於 Firebase 的所有暫存紀錄！")) {
                    try {
                        const appId = "omit-8c173";
                        const db = window.fbDb;
                        
                        const responsesColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');
                        const resSnaps = await window.fbUtils.getDocs(responsesColRef);
                        resSnaps.forEach(async (d) => {
                            await window.fbUtils.deleteDoc(d.ref);
                        });

                        const studentsColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                        const stuSnaps = await window.fbUtils.getDocs(studentsColRef);
                        stuSnaps.forEach(async (d) => {
                            await window.fbUtils.deleteDoc(d.ref);
                        });

                        const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                        await window.fbUtils.deleteDoc(roomDocRef);

                        showToast("課室暫存資料已完全清空！", "info");
                    } catch (e) {
                        console.error("Cleanup error:", e);
                    }
                    onExit();
                }
            };

            // Revision Item 12: Download Challenge Word template docx
            const handleDownloadWordTemplate = async () => {
                const sampleLines = [
                    "標題：地球生病了評估",
                    "總分: 100分",
                    "1.以下哪一項不是地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源",
                    "D. 機械資源*",
                    "",
                    "2.芝士的原料屬於哪一項地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源*",
                    "D. 礦產資源",
                    "",
                    "3.人們不當使用水資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應*",
                    "",
                    "4.人們不當使用煤和石油資源會造成甚麼後果?",
                    "A. 引發極端天氣*",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應"
                ];

                try {
                    const blob = await createWordDocxBlob(sampleLines);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = '下載評估範本Word檔.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast("已下載評估範本 Word檔 (.docx)！", "success");
                } catch (err) {
                    console.error("Docx error:", err);
                    showToast("無法生成 Word 範本檔", "error");
                }
            };

            // Parse docx file uploaded by teacher
            const handleWordFileUpload = (e, isCoop = false) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const arrayBuffer = evt.target.result;
                            const result = await window.mammoth.extractRawText({ arrayBuffer });
                            parsedData = parseWordChallengeText(result.value);
                        } else {
                            parsedData = parseWordChallengeText(evt.target.result);
                        }

                        if (isCoop) {
                            setCoopData(parsedData);
                        } else {
                            setChallengeData(parsedData);
                        }
                        showToast(`已成功由AI解析整份評估！共 ${parsedData.questions.length} 題`, 'success');
                    } catch (err) {
                        console.error("Parse file error:", err);
                        showToast("文件解析失敗，請檢查格式！", "error");
                    }
                };

                if (file.name.endsWith('.docx')) {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file, "UTF-8");
                }
            };

            // Revision Item 22.2: Perform Group Division
            const handlePerformGrouping = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生加入，請等候學生加入後再分組！", "error");
                    return;
                }

                const shuffledStudents = [...studentsList].sort(() => Math.random() - 0.5);
                const shuffledAnimals = [...ANIMAL_GROUPS].sort(() => Math.random() - 0.5);

                const groupCount = Math.min(Math.ceil(studentsList.length / 3), shuffledAnimals.length);
                const groups = [];

                for (let i = 0; i < groupCount; i++) {
                    groups.push({
                        ...shuffledAnimals[i],
                        members: []
                    });
                }

                shuffledStudents.forEach((stu, idx) => {
                    const gIdx = idx % groupCount;
                    groups[gIdx].members.push(stu);
                });

                setCoopGroups(groups);
                setCoopStage('GROUPING');

                const initialProgress = {};
                groups.forEach((g, idx) => { initialProgress[idx] = 0; });
                setCoopProgress(initialProgress);
                setCoopWinner(null);

                const coopQ = {
                    id: 'coop_' + Date.now(),
                    mode: 'COOP',
                    text: `🤝 合作題比賽：${coopData?.title || '團隊合作對抗'}`,
                    startTime: Date.now(),
                    coop: {
                        stage: 'GROUPING',
                        groups: groups,
                        questions: coopData?.questions || [],
                        progress: initialProgress,
                        winner: null
                    }
                };

                publishQuestionToFirestore(coopQ);
                showToast("已完成學生隨機分組，並發送分組資訊至學生頁面！", "success");
            };

            // Start Coop Race
            const handleStartCoopRace = () => {
                setCoopStage('RACE');
                const coopQ = {
                    ...activeQuestion,
                    coop: {
                        ...activeQuestion.coop,
                        stage: 'RACE'
                    }
                };
                publishQuestionToFirestore(coopQ);
                playSound('win');
                showToast("🏁 合作題比賽正式開始！請學生互相合作作答！", "success");
            };

            // Handle Coop Progress Update from Student submissions
            useEffect(() => {
                if (!activeQuestion || activeQuestion.mode !== 'COOP' || activeQuestion.coop?.stage !== 'RACE') return;

                const groups = activeQuestion.coop?.groups || [];
                const questions = activeQuestion.coop?.questions || [];
                const currentProgress = activeQuestion.coop?.progress || {};

                Object.values(currentQuestionResponses).forEach((res) => {
                    if (res.coopGroupIndex !== undefined && res.isCorrect !== undefined) {
                        const gIdx = res.coopGroupIndex;
                        const prevProg = currentProgress[gIdx] || 0;

                        if (res.isCorrect) {
                            const newProg = prevProg + 1;
                            if (newProg >= questions.length && !activeQuestion.coop?.winner) {
                                // Winning group!
                                const winnerGroup = groups[gIdx];
                                const updatedCoop = {
                                    ...activeQuestion.coop,
                                    progress: { ...currentProgress, [gIdx]: newProg },
                                    winner: winnerGroup
                                };
                                const updatedQ = { ...activeQuestion, coop: updatedCoop };
                                publishQuestionToFirestore(updatedQ);
                                setCoopWinner(winnerGroup);
                                playSound('win');
                                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                            } else if (newProg > prevProg) {
                                const updatedCoop = {
                                    ...activeQuestion.coop,
                                    progress: { ...currentProgress, [gIdx]: newProg }
                                };
                                publishQuestionToFirestore({ ...activeQuestion, coop: updatedCoop });
                            }
                        } else if (res.isCorrect === false) {
                            // Penalty reset to 0!
                            if (prevProg > 0) {
                                const updatedCoop = {
                                    ...activeQuestion.coop,
                                    progress: { ...currentProgress, [gIdx]: 0 }
                                };
                                publishQuestionToFirestore({ ...activeQuestion, coop: updatedCoop });
                                showToast(`${groups[gIdx]?.name} 答錯扣至起點！`, "error");
                            }
                        }
                    }
                });
            }, [currentQuestionResponses]);

            // Broadcast Teacher Whiteboard Work
            const handleTeacherBroadcastWhiteboard = async (imgData) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                const teacherWhiteboardQ = {
                    id: 'teacher_wb_' + Date.now(),
                    mode: 'DRAW',
                    text: '🎨 教師白板示範 (請全班觀看)',

                        name: '老師示範',

                showToast("已將教師白板作品即時廣播至所有學生螢幕！", "success");
            };

            // Publish Active Question
            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                
                let challengeContent = null;
                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請先上載並解析 Word 評估範本檔案！", "error");
                        return;
                    }
                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                if (selectedMode === 'COOP') {
                    if (!coopData || !coopData.questions || coopData.questions.length === 0) {
                        showToast("請先上載並解析合作題 Word 範本檔案！", "error");
                        return;
                    }
                    handlePerformGrouping();
                    return;
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);
                publishQuestionToFirestore(newQ, updatedHistory);
                showToast(`已成功發佈【${getModeLabel(selectedMode)}】給所有學生！`, 'success');
            };

            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已成功向所有學生一併發放挑戰題成績！", "success");
            };

            const handleClearQuestion = async () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: null }, { merge: true });
                showToast('已結束當前題目', 'info');
            };

            const toggleLockMode = async () => {
                const newLock = !lockAfterSubmit;
                setLockAfterSubmit(newLock);
                if (activeQuestion) {
                    const updatedQ = { ...activeQuestion, lockAfterSubmit: newLock };
                    publishQuestionToFirestore(updatedQ);
                    showToast(newLock ? "已鎖定答案（禁止修改）" : "已開放學生修改答案", "info");
                }
            };

            // Revision Item 20: Export Challenge CSV report
            const handleExportCSVReport = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生紀錄可供匯出！", "error");
                    return;
                }

                let csvContent = "\uFEFF";
                csvContent += "學號,學生姓名,加入時間";

                historyQuestions.forEach((q, idx) => {
                    const cleanText = (q.text || getModeLabel(q.mode)).replace(/"/g, '""');
                    if (q.mode === 'CHALLENGE' && q.challenge) {
                        csvContent += `,第${idx + 1}題[挑戰題:${q.challenge.title}得分],第${idx + 1}題[挑戰題正確率]`;
                    } else {
                        csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]: "${cleanText}"`;
                    }
                });
                csvContent += "\n";

                const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

                sortedStudents.forEach((stu) => {
                    const cleanName = (stu.name || '').replace(/"/g, '""');
                    csvContent += `"${stu.seatNumber}號","${cleanName}","${stu.joinTime || ''}"`;
                    
                    historyQuestions.forEach((q) => {
                        const resKey = `${q.id}_${stu.id}`;
                        const res = responses[resKey];
                        
                        if (res && res.answer !== undefined && res.answer !== null) {
                            if (q.mode === 'CHALLENGE' && res.scoreDetails) {
                                csvContent += `,"${res.scoreDetails.totalScore} / ${q.challenge.totalScore}分","${res.scoreDetails.percentage}% (用時:${res.duration || 0}s)"`;
                            } else {
                                let ansVal = res.answer;
                                if (typeof ansVal === 'string' && ansVal.startsWith('data:image')) {
                                    ansVal = '[白板作品]';
                                } else if (typeof ansVal === 'string' && ansVal.startsWith('data:audio')) {
                                    ansVal = '[語音錄音]';
                                }
                                const cleanAns = String(ansVal).replace(/"/g, '""');
                                csvContent += `,"${cleanAns} (用時:${res.duration || 0}s)"`;
                            }
                        } else {
                            if (q.mode === 'CHALLENGE') {
                                csvContent += `,"未作答","0%"`;
                            } else {
                                csvContent += `,"未作答"`;
                            }
                        }
                    });
                    csvContent += "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `OMIT_課堂成績報告_房號${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("已成功下載包含細項成績之 CSV 試算表！", "success");
            };

            // Revision Item 9: Random Picker Spinning Logic
            const handleSpinRandom = () => {
                if (isSpinning) return;
                
                const start = parseInt(rangeStart) || 1;
                const end = parseInt(rangeEnd) || 36;
                const available = [];
                for (let i = start; i <= end; i++) {
                    if (!drawnNumbers.includes(i)) available.push(i);
                }

                if (available.length === 0) {
                    showToast("此範圍內所有學號皆已被抽出！請點擊重置。", "error");
                    return;
                }

                setIsSpinning(true);
                let counter = 0;
                const maxIntervals = 20;

                const timer = setInterval(() => {
                    const temp = available[Math.floor(Math.random() * available.length)];
                    setCurrentDrawn(temp);
                    playSound('spin');
                    counter++;

                    if (counter >= maxIntervals) {
                        clearInterval(timer);
                        const finalPicked = available[Math.floor(Math.random() * available.length)];
                        setCurrentDrawn(finalPicked);
                        setDrawnNumbers(prev => [...prev, finalPicked]);
                        setIsSpinning(false);
                        playSound('win');
                    }
                }, 100);
            };

            // Leaderboard calculations
            const leaderboard = useMemo(() => {
                return Object.values(currentQuestionResponses)
                    .filter(r => r.duration !== undefined)
                    .sort((a, b) => {
                        if (activeQuestion?.mode === 'CHALLENGE') {
                            const scoreA = a.scoreDetails?.totalScore || 0;
                            const scoreB = b.scoreDetails?.totalScore || 0;
                            if (scoreB !== scoreA) return scoreB - scoreA;
                        }
                        return parseFloat(a.duration) - parseFloat(b.duration);
                    });
            }, [currentQuestionResponses, activeQuestion]);

            const whiteboardSubmissions = useMemo(() => {
                return Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:image'));
            }, [currentQuestionResponses]);

            const challengeScoresAreReleased = useMemo(() => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return true;
                return !!(activeQuestion.challenge?.releaseInstant || activeQuestion.challenge?.scoresReleased);
            }, [activeQuestion]);

            return (
                <div class="min-h-screen pb-12 bg-slate-100">
                    {/* Header Controls */}
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 py-3">
                        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                            {/* Revision Item 9: Header title rename */}
                            <div class="flex items-center space-x-3">
                                <span class="bg-slate-900 text-white font-black px-3 py-1.5 rounded-xl text-lg">OMIT</span>
                                <div>
                                    <h1 class="font-extrabold text-slate-800 text-base md:text-lg flex items-center gap-2">
                                        宣道會陳元喜小學OMIT互動課堂
                                        <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-0.5 rounded-full font-mono font-bold">
                                            房號：{roomCode}
                                        </span>
                                    </h1>
                                </div>
                            </div>

                            <div class="flex flex-wrap items-center gap-2">
                                <button 
                                    onClick={() => setShowTeacherWhiteboard(true)}
                                    class="bg-purple-600 hover:bg-purple-700 text-white font-extrabold px-3.5 py-2 rounded-xl text-sm transition shadow-md flex items-center space-x-1"
                                >
                                    <span>🎨 教師白板</span>
                                </button>

                                <button 
                                    onClick={() => setShowQRModal(true)}
                                    class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-2 rounded-xl border border-indigo-200 text-sm flex items-center space-x-1.5 transition"
                                >
                                    <span>📱 QR Code ({studentsList.length}人)</span>
                                </button>

                                <button 
                                    onClick={() => setShowRandomModal(true)}
                                    class="bg-amber-50 hover:bg-amber-100 text-amber-800 font-bold px-3 py-2 rounded-xl border border-amber-200 text-sm transition"
                                >
                                    🎲 抽選學生
                                </button>

                                <button 
                                    onClick={() => setShowTimerModal(true)}
                                    class={`px-3 py-2 rounded-xl border text-sm font-bold flex items-center space-x-1.5 transition ${
                                        timerActive 
                                        ? 'bg-amber-500 text-white border-amber-600 animate-pulse' 
                                        : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200'
                                    }`}
                                >
                                    <span>⏱️ 計時器</span>
                                    {timerSeconds > 0 && (
                                        <span class="bg-white/20 font-mono text-xs px-1.5 py-0.5 rounded">
                                            {Math.floor(timerSeconds / 60)}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                        </span>
                                    )}
                                </button>

                                <button 
                                    onClick={handleExportCSVReport}
                                    class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold px-3 py-2 rounded-xl border border-blue-200 text-sm transition"
                                >
                                    📥 匯出成績
                                </button>

                                <button 
                                    onClick={handleExitRoom}
                                    class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2 rounded-xl border border-rose-200 text-sm transition"
                                >
                                    🚪 退出課室
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Container */}
                    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

                        {/* Mode Selectors */}
                        <div class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-9 gap-2.5">
                            {[
                                { id: 'CHOICE', label: '選擇題', icon: '🔘' },
                                { id: 'TF', label: '是非題', icon: '⭕' },
                                { id: 'SHORT', label: '短答題', icon: '✍️' },
                                { id: 'DRAW', label: '白板題', icon: '🎨' },
                                { id: 'BUZZER', label: '搶答題', icon: '🚨' },
                                { id: 'AUDIO', label: '錄音題', icon: '🎤' },
                                { id: 'CHALLENGE', label: '挑戰題', icon: '🏆' },
                                { id: 'COOP', label: '合作題', icon: '🤝' },
                                { id: 'LINK', label: '派送連結', icon: '🔗' }
                            ].map((mode) => (
                                <button 
                                    key={mode.id}
                                    onClick={() => setSelectedMode(mode.id)}
                                    class={`p-3 rounded-2xl font-bold border-2 transition-all text-center flex flex-col items-center justify-center space-y-1 shadow-sm active:scale-95 ${
                                        selectedMode === mode.id 
                                        ? 'bg-slate-900 text-white border-slate-900 ring-4 ring-slate-200' 
                                        : 'bg-white text-slate-700 border-slate-200 hover:border-slate-300 hover:bg-slate-50'
                                    }`}
                                >
                                    <span class="text-xl">{mode.icon}</span>
                                    <span class="text-xs font-black">{mode.label}</span>
                                </button>
                            ))}
                        </div>

                        {/* Mode Specific Creation Panel */}
                        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                            <div class="flex flex-wrap items-center justify-between border-b pb-3 gap-2">
                                <h2 class="font-extrabold text-slate-800 text-lg flex items-center gap-2">
                                    <span>模式設定：{getModeLabel(selectedMode)}</span>
                                </h2>

                                {selectedMode !== 'CHALLENGE' && selectedMode !== 'COOP' && (
                                    <div class="flex items-center space-x-2 bg-slate-100 p-1.5 rounded-xl">
                                        <span class="text-xs font-bold text-slate-600 pl-2">提交後允許修改：</span>
                                        <button 
                                            onClick={toggleLockMode}
                                            class={`px-3 py-1 rounded-lg text-xs font-bold transition ${!lockAfterSubmit ? 'bg-emerald-500 text-white' : 'bg-slate-300 text-slate-600'}`}
                                        >
                                            {!lockAfterSubmit ? '已開放修改' : '已鎖定 (預設)'}
                                        </button>
                                    </div>
                                )}
                            </div>

                            {selectedMode === 'CHOICE' && (
                                <div class="flex items-center space-x-4">
                                    <label class="text-sm font-bold text-slate-700">選項數量：</label>
                                    {[4, 5].map((cnt) => (
                                        <button 
                                            key={cnt} 
                                            onClick={() => setChoiceCount(cnt)}
                                            class={`px-3.5 py-1.5 rounded-xl font-bold text-sm border ${choiceCount === cnt ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-700'}`}
                                        >
                                            {cnt} 個選項 ({cnt === 4 ? 'A-D' : 'A-E'})
                                        </button>
                                    ))}
                                </div>
                            )}

                            {/* Challenge Mode Setup Panel */}
                            {selectedMode === 'CHALLENGE' && (
                                <div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 p-5 rounded-2xl space-y-4 text-slate-800">
                                    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-amber-200 pb-3">
                                        <h3 class="font-black text-amber-900 text-base">
                                            🏆 挑戰題評估 Word 檔設定
                                        </h3>
                                        <button 
                                            type="button"
                                            onClick={handleDownloadWordTemplate}
                                            class="bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow transition"
                                        >
                                            📄 下載評估範本Word檔
                                        </button>
                                    </div>

                                    <div class="bg-white p-4 rounded-xl border border-amber-200 space-y-3">
                                        <label class="block text-xs font-bold text-slate-700">
                                            1. 上載 Word 檔 (.docx) 或文字檔 (.txt) 由 AI 生成評估：
                                        </label>
                                        <input 
                                            type="file" 
                                            accept=".docx,.txt"
                                            onChange={(e) => handleWordFileUpload(e, false)}
                                            class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-600 file:text-white cursor-pointer"
                                        />

                                        {challengeData && (
                                            <div class="bg-amber-50 p-4 rounded-xl border border-amber-300 space-y-3">
                                                <div class="font-black text-amber-900 text-sm">✏️ 教師編輯/確認評估內容：</div>
                                                <div class="space-y-2 max-h-60 overflow-y-auto pr-1">
                                                    {challengeData.questions.map((q, qIdx) => (
                                                        <div key={qIdx} class="bg-white p-3 rounded-lg border text-xs space-y-2">
                                                            <div class="flex justify-between items-center gap-2">
                                                                <span class="font-bold">第 {q.num || qIdx + 1} 題:</span>
                                                                <button onClick={() => setChallengeData(prev => ({ ...prev, questions: prev.questions.filter((_, idx) => idx !== qIdx) }))} class="text-rose-600 font-bold text-xs">🗑️ 刪除</button>
                                                            </div>
                                                            <input type="text" value={q.text} onChange={(e) => {
                                                                const newQs = [...challengeData.questions];
                                                                newQs[qIdx].text = e.target.value;
                                                                setChallengeData({ ...challengeData, questions: newQs });
                                                            }} class="w-full px-2 py-1 border rounded" />
                                                            <div class="flex space-x-2 pt-1 font-bold text-emerald-700">
                                                                <span>正確答案：</span>
                                                                {['A', 'B', 'C', 'D'].map(letter => (
                                                                    <label key={letter} class="space-x-1 cursor-pointer">
                                                                        <input type="radio" name={`c_ans_${qIdx}`} checked={q.answer === letter} onChange={() => {
                                                                            const newQs = [...challengeData.questions];
                                                                            newQs[qIdx].answer = letter;
                                                                            setChallengeData({ ...challengeData, questions: newQs });
                                                                        }} />
                                                                        <span>{letter}</span>
                                                                    </label>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Timed Mode Setup */}
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-white p-4 rounded-xl border border-amber-200">
                                        <div class="space-y-2">
                                            <div class="flex items-center justify-between">
                                                <label class="text-xs font-bold text-slate-700">2. 限時模式 (時間結束自動提交)：</label>
                                                <input 
                                                    type="checkbox" 
                                                    checked={challengeEnableTimer}
                                                    onChange={(e) => setChallengeEnableTimer(e.target.checked)}
                                                    class="w-4 h-4 accent-amber-600 rounded cursor-pointer"
                                                />
                                            </div>
                                            {challengeEnableTimer && (
                                                <div class="space-y-2 pt-1">
                                                    <div class="flex flex-wrap gap-1">
                                                        {[60, 120, 180, 240, 300].map(s => (
                                                            <button 
                                                                key={s} 
                                                                type="button"
                                                                onClick={() => setChallengeTimeLimit(s)}
                                                                class={`px-2.5 py-1 text-xs rounded-lg font-bold border ${challengeTimeLimit === s ? 'bg-amber-600 text-white' : 'bg-slate-50 text-slate-700'}`}
                                                            >
                                                                {s / 60}分鐘
                                                            </button>
                                                        ))}
                                                    </div>
                                                    <div class="flex items-center space-x-1 pt-1">
                                                        <span class="text-xs font-bold text-slate-600">手動時間 (00:00 格式)：</span>
                                                        <input 
                                                            type="number" min="0" max="59" value={Math.floor(challengeTimeLimit / 60)}
                                                            onChange={(e) => setChallengeTimeLimit(parseInt(e.target.value || 0) * 60 + (challengeTimeLimit % 60))}
                                                            class="w-10 border rounded text-center text-xs font-mono font-bold"
                                                        />
                                                        <span>分</span>
                                                        <input 
                                                            type="number" min="0" max="59" value={challengeTimeLimit % 60}
                                                            onChange={(e) => setChallengeTimeLimit(Math.floor(challengeTimeLimit / 60) * 60 + parseInt(e.target.value || 0))}
                                                            class="w-10 border rounded text-center text-xs font-mono font-bold"
                                                        />
                                                        <span>秒</span>
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        <div class="space-y-2">
                                            <label class="text-xs font-bold text-slate-700 block">3. 成績發放控制：</label>
                                            <label class="flex items-center space-x-2 text-xs font-bold cursor-pointer">
                                                <input type="radio" checked={challengeReleaseInstant} onChange={() => setChallengeReleaseInstant(true)} />
                                                <span>即時給予分數</span>
                                            </label>
                                            <label class="flex items-center space-x-2 text-xs font-bold cursor-pointer">
                                                <input type="radio" checked={!challengeReleaseInstant} onChange={() => setChallengeReleaseInstant(false)} />
                                                <span>待所有學生完成提交後，由教師按鍵一併發放</span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Revision Item 22: Cooperative Mode Setup Panel */}
                            {selectedMode === 'COOP' && (
                                <div class="bg-gradient-to-r from-emerald-50 to-teal-50 border border-emerald-200 p-5 rounded-2xl space-y-4 text-slate-800">
                                    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-emerald-200 pb-3">
                                        <h3 class="font-black text-emerald-900 text-base">
                                            🤝 合作題 (預備 ➔ 分組 ➔ 比賽)
                                        </h3>
                                        <button 
                                            type="button"
                                            onClick={handleDownloadWordTemplate}
                                            class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow transition"
                                        >
                                            📄 下載評估範本Word檔
                                        </button>
                                    </div>

                                    {coopStage === 'PREP' && (
                                        <div class="bg-white p-4 rounded-xl border border-emerald-200 space-y-3">
                                            <label class="block text-xs font-bold text-slate-700">
                                                1. 【預備階段】上載 Word 檔 (.docx) 生成合作題：
                                            </label>
                                            <input 
                                                type="file" 
                                                accept=".docx,.txt"
                                                onChange={(e) => handleWordFileUpload(e, true)}
                                                class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-emerald-600 file:text-white cursor-pointer"
                                            />

                                            {coopData && (
                                                <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-300 space-y-3">
                                                    <div class="font-black text-emerald-900 text-sm">✏️ 教師編輯/確認評估內容 (共 {coopData.questions.length} 題)：</div>
                                                    <div class="space-y-2 max-h-56 overflow-y-auto">
                                                        {coopData.questions.map((q, idx) => (
                                                            <div key={idx} class="bg-white p-2.5 rounded border text-xs">
                                                                <span class="font-bold">第{idx + 1}題:</span> {q.text} (正解: {q.answer})
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {coopStage === 'GROUPING' && (
                                        <div class="bg-white p-4 rounded-xl border border-emerald-200 space-y-3">
                                            <div class="flex justify-between items-center">
                                                <h4 class="font-black text-emerald-900 text-sm">2. 【分組階段】各小組成員名單：</h4>
                                                <button 
                                                    onClick={handlePerformGrouping}
                                                    class="px-3 py-1 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs rounded-lg shadow"
                                                >
                                                    🎲 重新分配分組
                                                </button>
                                            </div>

                                            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                                                {coopGroups.map((g, gIdx) => (
                                                    <div key={gIdx} class={`p-3 rounded-2xl border-2 space-y-1 ${g.color}`}>
                                                        <div class="font-black text-sm flex items-center gap-1">
                                                            <span>{g.emoji}</span>
                                                            <span>{g.name}</span>
