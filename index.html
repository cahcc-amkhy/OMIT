<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Helper label switcher
        function getModeLabel(mode) {
            switch(mode) {
                case 'CHOICE': return '選擇題';
                case 'TF': return '是非題';
                case 'SHORT': return '短答題';
                case 'DRAW': return '白板題';
                case 'BUZZER': return '搶答題';
                case 'LINK': return '派送連結';
                default: return '題目';
            }
        }

        // Helper default prompts for empty question text
        function getDefaultQuestionPrompt(mode) {
            switch(mode) {
                case 'CHOICE': return '請選擇正確答案：';
                case 'TF': return '請判斷下列描述是否正確：';
                case 'SHORT': return '請輸入您的回答：';
                case 'DRAW': return '請在白板上作答或繪圖：';
                case 'BUZZER': return '請準備點擊搶答按鈕！';
                case 'LINK': return '請點擊或觀看下方派送內容：';
                default: return '請回答問題：';
            }
        }

        // Web Audio API Sound Generator
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                    });
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (
                <div class={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-xl shadow-lg flex items-center space-x-2 text-sm font-medium animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        function OMITApp() {
            const [role, setRole] = useState('LANDING'); // 'LANDING', 'TEACHER', 'STUDENT'
            const [roomCode, setRoomCode] = useState('');
            const [seatNumber, setSeatNumber] = useState('1');
            const [studentName, setStudentName] = useState('');
            const [teacherPassword, setTeacherPassword] = useState('');
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [toast, setToast] = useState(null);

            const [activeQuestion, setActiveQuestion] = useState(null);
            const [studentsList, setStudentsList] = useState([]);
            const [responses, setResponses] = useState({});
            const [historyQuestions, setHistoryQuestions] = useState([]);
            const [isAuthReady, setIsAuthReady] = useState(false);

            const myStudentId = useRef('std_' + Math.random().toString(36).substring(2, 9));

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            // Initialize Anonymous Auth
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (window.fbUtils && window.fbAuth) {
                            await window.fbUtils.signInAnonymously(window.fbAuth);
                            setIsAuthReady(true);
                        }
                    } catch (err) {
                        console.error("Firebase auth failed:", err);
                    }
                };
                initAuth();
            }, []);

            // Check URL query for Room Code
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const roomParam = params.get('room');
                if (roomParam) {
                    setRoomCode(roomParam.toUpperCase());
                }
            }, []);

            // Firebase Firestore Sync for Room Data
            useEffect(() => {
                if (!roomCode || !isAuthReady) return;

                const appId = "omit-8c173";
                const db = window.fbDb;
                const { doc, onSnapshot, collection } = window.fbUtils;

                const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                const studentsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                const responsesColRef = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');

                const unsubRoom = onSnapshot(roomDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setActiveQuestion(data.activeQuestion || null);
                        if (data.history) setHistoryQuestions(data.history);
                    }
                }, (err) => console.error("Room sub error:", err));

                const unsubStudents = onSnapshot(studentsColRef, (snapshot) => {
                    const list = [];
                    snapshot.forEach((d) => list.push(d.data()));
                    setStudentsList(list);
                }, (err) => console.error("Students sub error:", err));

                const unsubResponses = onSnapshot(responsesColRef, (snapshot) => {
                    const resMap = {};
                    snapshot.forEach((d) => {
                        resMap[d.id] = d.data();
                    });
                    setResponses(resMap);
                }, (err) => console.error("Responses sub error:", err));

                return () => {
                    unsubRoom();
                    unsubStudents();
                    unsubResponses();
                };
            }, [roomCode, isAuthReady]);

            // Handle Teacher Access
            const handleTeacherAccessRequest = () => {
                setShowPasswordModal(true);
                setTeacherPassword('');
            };

            const verifyTeacherPassword = (e) => {
                e?.preventDefault();
                if (teacherPassword === '8030') {
                    const generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
                    setRoomCode(generatedCode);
                    setRole('TEACHER');
                    setShowPasswordModal(false);
                    showToast(`密碼正確！已建立課堂 房號：${generatedCode}`, 'success');
                } else {
                    showToast('密碼錯誤，請重新輸入！', 'error');
                }
            };

            // Student Join
            const handleJoinRoom = (e) => {
                e?.preventDefault();
                if (!roomCode.trim()) {
                    showToast('請輸入6位數字房號', 'error');
                    return;
                }

                const studentObj = {
                    id: myStudentId.current,
                    seatNumber: seatNumber,
                    name: studentName.trim() || `學號 ${seatNumber}`,
                    joinTime: new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                };

                // Register student to Firestore
                const appId = "omit-8c173";
                const db = window.fbDb;
                const studentDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students', myStudentId.current);
                window.fbUtils.setDoc(studentDocRef, studentObj);

                setRole('STUDENT');
                showToast(`已進入房號 ${roomCode} 的課堂`, 'success');
            };

            if (role === 'LANDING') {
                return (
                    <div class="min-h-screen bg-gradient-to-br from-indigo-900 via-indigo-800 to-purple-900 flex items-center justify-center p-4">
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                        
                        <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 space-y-8 relative overflow-hidden">
                            <div class="text-center space-y-2">
                                <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl mb-2 font-black text-2xl shadow-inner">
                                    OMIT
                                </div>
                                <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">OMIT 互動課堂</h1>
                                <p class="text-slate-500 text-sm">免登入！隨查隨答、高效即時的反饋互動平台</p>
                            </div>

                            <div class="space-y-6">
                                {/* Student Join Form */}
                                <form onSubmit={handleJoinRoom} class="bg-indigo-50/70 p-5 rounded-2xl border border-indigo-100 space-y-4">
                                    <h2 class="text-xs font-bold text-indigo-600 uppercase tracking-wider">我是學生 (加入課堂)</h2>
                                    <div>
                                        <label class="text-xs text-slate-500 font-medium mb-1 block">1. 課堂房號</label>
                                        <input 
                                            type="text" 
                                            placeholder="請輸入房號 (例如 123456)" 
                                            value={roomCode} 
                                            onChange={(e) => setRoomCode(e.target.value)}
                                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-mono text-center tracking-widest text-lg font-bold"
                                            maxLength={6}
                                        />
                                    </div>

                                    {/* Seat dropdown 1-36 + Optional Name */}
                                    <div class="grid grid-cols-3 gap-2">
                                        <div class="col-span-1">
                                            <label class="text-xs text-slate-500 font-medium mb-1 block">2. 學號 *</label>
                                            <select 
                                                value={seatNumber}
                                                onChange={(e) => setSeatNumber(e.target.value)}
                                                class="w-full px-3 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-bold text-center"
                                            >
                                                {Array.from({ length: 36 }, (_, i) => i + 1).map((num) => (
                                                    <option key={num} value={num}>{num} 號</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div class="col-span-2">
                                            <label class="text-xs text-slate-500 font-medium mb-1 block">3. 姓名 (可留空)</label>
                                            <input 
                                                type="text" 
                                                placeholder="輸入姓名 / 暱稱" 
                                                value={studentName} 
                                                onChange={(e) => setStudentName(e.target.value)}
                                                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-medium"
                                            />
                                        </div>
                                    </div>

                                    <button 
                                        type="submit" 
                                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-200 active:scale-98"
                                    >
                                        進入課堂 🚀
                                    </button>
                                </form>

                                <div class="relative flex py-1 items-center">
                                    <div class="flex-grow border-t border-slate-200"></div>
                                    <span class="flex-shrink mx-4 text-slate-400 text-xs font-medium">或</span>
                                    <div class="flex-grow border-t border-slate-200"></div>
                                </div>

                                {/* Teacher Password Access */}
                                <div class="text-center">
                                    <button 
                                        onClick={handleTeacherAccessRequest}
                                        class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl transition shadow-md flex items-center justify-center space-x-2 active:scale-98"
                                    >
                                        <span>👨‍🏫 開啟新課堂 (教師控制台)</span>
                                    </button>
                                    <p class="text-xs text-slate-400 mt-2">建立後即可獲取房號與專屬 QR Code</p>
                                </div>
                            </div>
                        </div>

                        {showPasswordModal && (
                            <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                                <div class="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
                                    <h3 class="text-lg font-bold text-slate-800 text-center">請輸入教師密碼</h3>
                                    <form onSubmit={verifyTeacherPassword} class="space-y-4">
                                        <input 
                                            type="password" 
                                            value={teacherPassword}
                                            onChange={(e) => setTeacherPassword(e.target.value)}
                                            class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 text-center font-mono text-xl tracking-widest"
                                            autoFocus
                                        />
                                        <div class="flex space-x-2">
                                            <button 
                                                type="button" 
                                                onClick={() => setShowPasswordModal(false)}
                                                class="w-1/2 py-2.5 rounded-xl bg-slate-100 font-medium text-slate-600 hover:bg-slate-200"
                                            >
                                                取消
                                            </button>
                                            <button 
                                                type="submit" 
                                                class="w-1/2 py-2.5 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-700 shadow-md"
                                            >
                                                確認進入
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            if (role === 'TEACHER') {
                return (
                    <TeacherDashboard 
                        roomCode={roomCode} 
                        activeQuestion={activeQuestion} 
                        setActiveQuestion={setActiveQuestion}
                        responses={responses}
                        setResponses={setResponses}
                        studentsList={studentsList}
                        historyQuestions={historyQuestions}
                        setHistoryQuestions={setHistoryQuestions}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            if (role === 'STUDENT') {
                return (
                    <StudentInterface 
                        roomCode={roomCode}
                        studentName={studentName}
                        seatNumber={seatNumber}
                        studentId={myStudentId.current}
                        activeQuestion={activeQuestion}
                        responses={responses}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            return null;
        }

        function TeacherDashboard({ roomCode, activeQuestion, setActiveQuestion, responses, setResponses, studentsList, historyQuestions, setHistoryQuestions, showToast, onExit }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE'); // 'CHOICE', 'TF', 'SHORT', 'DRAW', 'BUZZER', 'LINK'
            const [questionText, setQuestionText] = useState('');
            const [choiceCount, setChoiceCount] = useState(4);
            const [lockAfterSubmit, setLockAfterSubmit] = useState(true);
            const [whiteboardBg, setWhiteboardBg] = useState(null);
            const [pushedUrl, setPushedUrl] = useState('');

            // Modals & Tools
            const [showQRModal, setShowQRModal] = useState(false);
            const [showStudentListModal, setShowStudentListModal] = useState(false);
            const [showInspectModal, setShowInspectModal] = useState(null);
            const [barChoiceFilter, setBarChoiceFilter] = useState(null);

            // Random Selector State
            const [showRandomModal, setShowRandomModal] = useState(false);
            const [rangeStart, setRangeStart] = useState(1);
            const [rangeEnd, setRangeEnd] = useState(36);
            const [drawnNumbers, setDrawnNumbers] = useState([]);
            const [currentDrawn, setCurrentDrawn] = useState(null);
            const [isSpinning, setIsSpinning] = useState(false);

            // Timer State
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerActive, setTimerActive] = useState(false);
            const [timerZoomed, setTimerZoomed] = useState(false);
            const [customTimerInput, setCustomTimerInput] = useState('60');

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

            // Filter current responses for active question
            const currentQuestionResponses = useMemo(() => {
                if (!activeQuestion) return {};
                const filtered = {};
                Object.values(responses).forEach(r => {
                    if (r.questionId === activeQuestion.id) {
                        filtered[r.studentId] = r;
                    }
                });
                return filtered;
            }, [responses, activeQuestion]);

            // Timer Interval Logic
            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(s => {
                            if (s <= 1) {
                                setTimerActive(false);
                                playSound('alarm');
                                return 0;
                            }
                            return s - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            // Sync Question & History to Firestore
            const publishQuestionToFirestore = async (qObj, newHistoryList) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatePayload = {
                    activeQuestion: qObj,
                    updatedAt: Date.now()
                };
                if (newHistoryList) {
                    updatePayload.history = newHistoryList;
                }

                await window.fbUtils.setDoc(roomDocRef, updatePayload, { merge: true });
            };

            // Exit Room Cleanup
            const handleExitRoom = async () => {
                if (window.confirm("確定退出課室？將會同步清空此課室於 Firebase 的所有暫存紀錄！")) {
                    try {
                        const appId = "omit-8c173";
                        const db = window.fbDb;
                        
                        const responsesColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');
                        const resSnaps = await window.fbUtils.getDocs(responsesColRef);
                        resSnaps.forEach(async (d) => {
                            await window.fbUtils.deleteDoc(d.ref);
                        });

                        const studentsColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                        const stuSnaps = await window.fbUtils.getDocs(studentsColRef);
                        stuSnaps.forEach(async (d) => {
                            await window.fbUtils.deleteDoc(d.ref);
                        });

                        const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                        await window.fbUtils.deleteDoc(roomDocRef);

                        showToast("課室暫存資料已完全清空！", "info");
                    } catch (e) {
                        console.error("Cleanup error:", e);
                    }
                    onExit();
                }
            };

            // 修訂 1: 發佈題目時不需輸入問題即可直接發佈
            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                
                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : []
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);

                publishQuestionToFirestore(newQ, updatedHistory);
                showToast('已成功發佈題目給所有學生！', 'success');
            };

            // Clear Active Question
            const handleClearQuestion = async () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: null }, { merge: true });
                showToast('已結束當前題目', 'info');
            };

            // Toggle Lock Response
            const toggleLockMode = async () => {
                const newLock = !lockAfterSubmit;
                setLockAfterSubmit(newLock);
                if (activeQuestion) {
                    const updatedQ = { ...activeQuestion, lockAfterSubmit: newLock };
                    publishQuestionToFirestore(updatedQ);
                    showToast(newLock ? "已鎖定答案（禁止修改）" : "已開放學生修改答案", "info");
                }
            };

            // Teacher Background Image Upload
            const handleBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setWhiteboardBg(evt.target.result);
                        showToast("已成功載入 16:9 白板背景圖片！", "success");
                    };
                    reader.readAsDataURL(file);
                }
            };

            // Broadcast Whiteboard Work to All Students
            const handleBroadcastSubmission = async (studentRes) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatedQ = { 
                    ...activeQuestion, 
                    broadcastedSubmission: studentRes 
                };
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                showToast(`已成功廣播 ${studentRes.name} 的作品至全班學生螢幕！`, "success");
            };

            // Random Student Selector Logic
            const handleSpinRandom = () => {
                if (isSpinning) return;
                
                const start = parseInt(rangeStart) || 1;
                const end = parseInt(rangeEnd) || 36;
                const available = [];
                for (let i = start; i <= end; i++) {
                    if (!drawnNumbers.includes(i)) available.push(i);
                }

                if (available.length === 0) {
                    showToast("此範圍內所有學號皆已被抽出！請點擊重置。", "error");
                    return;
                }

                setIsSpinning(true);
                let counter = 0;
                const maxIntervals = 20;

                const timer = setInterval(() => {
                    const temp = available[Math.floor(Math.random() * available.length)];
                    setCurrentDrawn(temp);
                    playSound('spin');
                    counter++;

                    if (counter >= maxIntervals) {
                        clearInterval(timer);
                        const finalPicked = available[Math.floor(Math.random() * available.length)];
                        setCurrentDrawn(finalPicked);
                        setDrawnNumbers(prev => [...prev, finalPicked]);
                        setIsSpinning(false);
                        playSound('win');
                    }
                }, 100);
            };

            // 修訂 2: 匯出試算表需記錄每位學生每一題答案
            const handleExportCSVReport = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生紀錄可供匯出！", "error");
                    return;
                }

                let csvContent = "\uFEFF"; // UTF-8 BOM for Excel Traditional Chinese
                csvContent += "學號,學生姓名,加入時間";

                // Header columns for every published question in history
                historyQuestions.forEach((q, idx) => {
                    const cleanText = (q.text || getModeLabel(q.mode)).replace(/"/g, '""');
                    csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]: "${cleanText}"`;
                });
                csvContent += "\n";

                // Sort students by seat number
                const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

                sortedStudents.forEach((stu) => {
                    const cleanName = (stu.name || '').replace(/"/g, '""');
                    csvContent += `"${stu.seatNumber}號","${cleanName}","${stu.joinTime || ''}"`;
                    
                    historyQuestions.forEach((q) => {
                        const resKey = `${q.id}_${stu.id}`;
                        const res = responses[resKey];
                        
                        if (res && res.answer !== undefined && res.answer !== null) {
                            let ansVal = res.answer;
                            if (typeof ansVal === 'string' && ansVal.startsWith('data:image')) {
                                ansVal = '[圖像白板答案]';
                            }
                            const cleanAns = String(ansVal).replace(/"/g, '""');
                            csvContent += `,"${cleanAns} (用時:${res.duration || 0}s)"`;
                        } else {
                            csvContent += `,"未作答"`;
                        }
                    });
                    csvContent += "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `OMIT_課堂學習報告_房號${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("完整學習報告已成功匯出試算表！", "success");
            };

            // Leaderboard calculation for current question
            const leaderboard = useMemo(() => {
                return Object.values(currentQuestionResponses)
                    .filter(r => r.duration !== undefined)
                    .sort((a, b) => parseFloat(a.duration) - parseFloat(b.duration));
            }, [currentQuestionResponses]);

            // Whiteboard list for magnification navigation
            const whiteboardSubmissions = useMemo(() => {
                return Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:image'));
            }, [currentQuestionResponses]);

            return (
                <div class="min-h-screen pb-12">
                    {/* Header Controls */}
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 py-3">
                        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                            <div class="flex items-center space-x-3">
                                <span class="bg-slate-900 text-white font-black px-3 py-1.5 rounded-xl text-lg">OMIT</span>
                                <div>
                                    <h1 class="font-bold text-slate-800 text-base flex items-center gap-2">
                                        教師控制台
                                        <span class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded-full font-mono font-bold">
                                            房號：{roomCode}
                                        </span>
                                    </h1>
                                </div>
                            </div>

                            <div class="flex items-center space-x-2">
                                <button 
                                    onClick={() => setShowQRModal(true)}
                                    class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-2 rounded-xl border border-indigo-200 text-sm flex items-center space-x-1.5 transition"
                                >
                                    <span>📱 QR Code</span>
                                </button>

                                <button 
                                    onClick={() => setShowStudentListModal(true)}
                                    class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold px-3 py-2 rounded-xl border border-emerald-200 text-sm flex items-center space-x-1.5 transition"
                                >
                                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                                    <span>已加入：{studentsList.length} 人</span>
                                </button>

                                <button 
                                    onClick={() => setShowRandomModal(true)}
                                    class="bg-amber-50 hover:bg-amber-100 text-amber-700 font-bold px-3 py-2 rounded-xl border border-amber-200 text-sm transition"
                                >
                                    🎲 抽選學生
                                </button>

                                <button 
                                    onClick={handleExportCSVReport}
                                    class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold px-3 py-2 rounded-xl border border-blue-200 text-sm transition"
                                >
                                    📊 匯出報告
                                </button>

                                <button 
                                    onClick={handleExitRoom}
                                    class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2 rounded-xl border border-rose-200 text-sm transition"
                                >
                                    🚪 退出課室
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Container */}
                    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
                        
                        {/* Countdown Timer */}
                        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
                            <div class="flex items-center space-x-3">
                                <span class="text-2xl">⏱️</span>
                                <div>
                                    <div class="text-xs text-slate-400 font-bold uppercase">課堂倒數計時器</div>
                                    <div class={`font-mono font-black text-2xl ${timerSeconds <= 10 && timerSeconds > 0 ? 'text-red-600 animate-pulse' : 'text-slate-800'}`}>
                                        {Math.floor(timerSeconds / 60).toString().padStart(2, '0')}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                    </div>
                                </div>
                            </div>

                            <div class="flex flex-wrap items-center gap-2">
                                {[['30秒', 30], ['1分鐘', 60], ['2分鐘', 120], ['3分鐘', 180], ['4分鐘', 240], ['5分鐘', 300]].map(([lbl, sec]) => (
                                    <button 
                                        key={lbl} 
                                        onClick={() => { setTimerSeconds(sec); setTimerActive(true); }}
                                        class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 font-medium text-xs text-slate-700 border"
                                    >
                                        {lbl}
                                    </button>
                                ))}

                                <div class="flex items-center space-x-1 border rounded-lg p-1 bg-slate-50">
                                    <input 
                                        type="number" 
                                        value={customTimerInput}
                                        onChange={(e) => setCustomTimerInput(e.target.value)}
                                        class="w-14 px-1 py-0.5 text-xs text-center border rounded bg-white font-mono"
                                        placeholder="秒數"
                                    />
                                    <button 
                                        onClick={() => { setTimerSeconds(parseInt(customTimerInput) || 30); setTimerActive(true); }}
                                        class="text-xs bg-slate-800 text-white px-2 py-1 rounded font-bold"
                                    >
                                        自訂
                                    </button>
                                </div>

                                <button 
                                    onClick={() => setTimerActive(!timerActive)}
                                    class={`px-3 py-1.5 rounded-lg font-bold text-xs text-white transition ${timerActive ? 'bg-amber-500 hover:bg-amber-600' : 'bg-emerald-600 hover:bg-emerald-700'}`}
                                >
                                    {timerActive ? '暫停' : '開始倒數'}
                                </button>

                                <button 
                                    onClick={() => setTimerZoomed(true)}
                                    class="p-1.5 rounded-lg bg-slate-200 hover:bg-slate-300 text-xs font-bold text-slate-700"
                                    title="放大顯示"
                                >
                                    🔍 放大
                                </button>
                            </div>
                        </div>

                        {/* Mode Selectors */}
                        <div class="grid grid-cols-2 md:grid-cols-6 gap-3">
                            {[
                                { id: 'CHOICE', label: '選擇題', icon: '🔘', color: 'indigo' },
                                { id: 'TF', label: '是非題', icon: '⭕', color: 'blue' },
                                { id: 'SHORT', label: '短答題', icon: '✍️', color: 'emerald' },
                                { id: 'DRAW', label: '白板題', icon: '🎨', color: 'purple' },
                                { id: 'BUZZER', label: '搶答題', icon: '🚨', color: 'rose' },
                                { id: 'LINK', label: '派送連結', icon: '🔗', color: 'amber' }
                            ].map((mode) => (
                                <button 
                                    key={mode.id}
                                    onClick={() => setSelectedMode(mode.id)}
                                    class={`p-4 rounded-2xl font-bold border-2 transition-all text-center flex flex-col items-center justify-center space-y-1 shadow-sm active:scale-95 ${
                                        selectedMode === mode.id 
                                        ? 'bg-slate-900 text-white border-slate-900 ring-4 ring-slate-200' 
                                        : 'bg-white text-slate-700 border-slate-200 hover:border-slate-300 hover:bg-slate-50'
                                    }`}
                                >
                                    <span class="text-3xl">{mode.icon}</span>
                                    <span class="text-base">{mode.label}</span>
                                </button>
                            ))}
                        </div>

                        {/* Question Creation Panel */}
                        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                            <div class="flex items-center justify-between border-b pb-3">
                                <h2 class="font-extrabold text-slate-800 text-lg flex items-center gap-2">
                                    <span>模式設定：{getModeLabel(selectedMode)}</span>
                                </h2>

                                <div class="flex items-center space-x-2 bg-slate-100 p-1.5 rounded-xl">
                                    <span class="text-xs font-bold text-slate-600 pl-2">提交後允許修改：</span>
                                    <button 
                                        onClick={toggleLockMode}
                                        class={`px-3 py-1 rounded-lg text-xs font-bold transition ${!lockAfterSubmit ? 'bg-emerald-500 text-white' : 'bg-slate-300 text-slate-600'}`}
                                    >
                                        {!lockAfterSubmit ? '已開放修改' : '已鎖定 (預設)'}
                                    </button>
                                </div>
                            </div>

                            {selectedMode === 'CHOICE' && (
                                <div class="flex items-center space-x-4">
                                    <label class="text-sm font-bold text-slate-700">選項數量：</label>
                                    {[4, 5].map((cnt) => (
                                        <button 
                                            key={cnt} 
                                            onClick={() => setChoiceCount(cnt)}
                                            class={`px-3 py-1.5 rounded-xl font-bold text-sm border ${choiceCount === cnt ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-700'}`}
                                        >
                                            {cnt} 個選項 ({cnt === 4 ? 'A-D' : 'A-E'})
                                        </button>
                                    ))}
                                </div>
                            )}

                            {selectedMode === 'DRAW' && (
                                <div class="space-y-2 bg-purple-50 p-4 rounded-2xl border border-purple-100">
                                    <label class="block text-sm font-bold text-purple-900">
                                        上傳白板背景圖片 (預設為純白背景，建議 16:9 比例)：
                                    </label>
                                    <input 
                                        type="file" 
                                        accept="image/*" 
                                        onChange={handleBgUpload}
                                        class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-purple-600 file:text-white hover:file:bg-purple-700"
                                    />
                                    {whiteboardBg && (
                                        <div class="relative max-w-xs mt-2 border-2 border-purple-300 rounded-xl overflow-hidden aspect-16-9">
                                            <img src={whiteboardBg} class="w-full h-full object-contain bg-white" alt="預覽" />
                                            <button 
                                                onClick={() => setWhiteboardBg(null)}
                                                class="absolute top-1 right-1 bg-red-500 text-white text-xs px-2 py-0.5 rounded-md font-bold"
                                            >
                                                移除背景
                                            </button>
                                        </div>
                                    )}
                                </div>
                            )}

                            {selectedMode === 'LINK' && (
                                <div class="space-y-2 bg-amber-50 p-4 rounded-2xl border border-amber-100">
                                    <label class="block text-sm font-bold text-amber-900">
                                        輸入欲派送的網頁連結或 YouTube 影片網址：
                                    </label>
                                    <input 
                                        type="url" 
                                        placeholder="https://www.youtube.com/watch?v=..." 
                                        value={pushedUrl}
                                        onChange={(e) => setPushedUrl(e.target.value)}
                                        class="w-full px-4 py-3 rounded-xl border border-amber-200 focus:outline-none focus:ring-2 focus:ring-amber-500 font-mono text-sm"
                                    />
                                </div>
                            )}

                            {/* Question Title / Description Input */}
                            {selectedMode !== 'LINK' && selectedMode !== 'BUZZER' && (
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 mb-1">
                                        題目內容 / 指引 (可留空，直接點擊發佈即可，學生端會顯示預設提示)：
                                    </label>
                                    <input 
                                        type="text" 
                                        placeholder={`留空將顯示預設提示：「${getDefaultQuestionPrompt(selectedMode)}」`} 
                                        value={questionText}
                                        onChange={(e) => setQuestionText(e.target.value)}
                                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium text-slate-800"
                                    />
                                </div>
                            )}

                            {/* Publish Buttons */}
                            <div class="flex space-x-3 pt-2">
                                <button 
                                    onClick={handlePublishQuestion}
                                    class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-indigo-200 text-base transition active:scale-98"
                                >
                                    🚀 發佈【{getModeLabel(selectedMode)}】給全班
                                </button>
                                {activeQuestion && (
                                    <button 
                                        onClick={handleClearQuestion}
                                        class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-6 py-4 rounded-2xl transition"
                                    >
                                        收回題目
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Active Question Responses Display Panel */}
                        {activeQuestion && (
                            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-6">
                                <div class="flex items-center justify-between border-b pb-4">
                                    <div>
                                        <span class="text-xs font-extrabold text-indigo-600 uppercase tracking-widest">當前進行中</span>
                                        <h3 class="text-xl font-black text-slate-800">{activeQuestion.text}</h3>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-xs text-slate-400 block font-bold">已回應人數</span>
                                        <span class="text-2xl font-black text-indigo-600">
                                            {Object.keys(currentQuestionResponses).length} / {studentsList.length}
                                        </span>
                                    </div>
                                </div>

                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div class="space-y-4">
                                        <h4 class="font-bold text-slate-700 text-sm">統計棒形圖 (點擊條狀圖可查看該選項對應學生名單)：</h4>
                                        <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                                            {activeQuestion.choiceOptions.map((opt) => {
                                                const choosers = Object.values(currentQuestionResponses).filter(r => r.answer === opt);
                                                const count = choosers.length;
                                                const total = Object.keys(currentQuestionResponses).length || 1;
                                                const pct = Math.round((count / total) * 100);

                                                return (
                                                    <div 
                                                        key={opt}
                                                        onClick={() => setBarChoiceFilter(opt)}
                                                        class="bg-slate-50 border border-slate-200 hover:border-indigo-400 rounded-2xl p-4 text-center cursor-pointer transition hover:shadow-md space-y-2 group"
                                                    >
                                                        <div class="font-black text-xl text-slate-800 group-hover:text-indigo-600">{opt}</div>
                                                        <div class="h-24 bg-slate-200 rounded-xl overflow-hidden flex items-end">
                                                            <div 
                                                                class="w-full bg-indigo-500 group-hover:bg-indigo-600 transition-all rounded-t-xl" 
                                                                style={{ height: `${pct}%` }}
                                                            ></div>
                                                        </div>
                                                        <div class="font-bold text-slate-600 text-sm">{count} 人 ({pct}%)</div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}

                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="text-center py-8 space-y-4 bg-rose-50 rounded-3xl border border-rose-200">
                                        <h4 class="text-lg font-bold text-rose-900">搶答進行中...</h4>
                                        {Object.values(currentQuestionResponses).length > 0 ? (
                                            <div class="animate-bounce space-y-2">
                                                <div class="text-5xl">🎉</div>
                                                <div class="text-3xl font-black text-rose-600">
                                                    最快搶答者：{Object.values(currentQuestionResponses)[0].name} ({Object.values(currentQuestionResponses)[0].seatNumber}號)
                                                </div>
                                                <div class="text-sm font-mono text-slate-500">
                                                    搶答用時：{Object.values(currentQuestionResponses)[0].duration} 秒
                                                </div>
                                            </div>
                                        ) : (
                                            <div class="text-slate-400 font-bold">等待學生按鈕搶答...</div>
                                        )}
                                    </div>
                                )}

                                {activeQuestion.mode === 'DRAW' && (
                                    <div class="space-y-4">
                                        <h4 class="font-bold text-slate-700 text-sm">學生白板作品即時預覽 (點擊可放大及進行廣播)：</h4>
                                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                            {Object.values(currentQuestionResponses).map((res) => (
                                                <div 
                                                    key={res.studentId}
                                                    onClick={() => setShowInspectModal(res)}
                                                    class="bg-slate-50 border-2 border-slate-200 hover:border-purple-500 rounded-2xl p-2 cursor-pointer transition hover:shadow-lg space-y-1"
                                                >
                                                    <div class="aspect-16-9 bg-white rounded-xl overflow-hidden border">
                                                        <img src={res.answer} class="w-full h-full object-contain" alt="學生畫板" />
                                                    </div>
                                                    <div class="flex justify-between items-center text-xs font-bold text-slate-700 px-1">
                                                        <span>{res.name} ({res.seatNumber}號)</span>
                                                        <span class="text-purple-600">🔍 放大</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                                        {Object.values(currentQuestionResponses).map((res) => (
                                            <div key={res.studentId} class="bg-slate-50 p-4 rounded-2xl border space-y-1">
                                                <div class="text-xs font-bold text-slate-500">{res.name} ({res.seatNumber}號) - 用時: {res.duration}s</div>
                                                <div class="font-bold text-slate-800 text-base">{res.answer}</div>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {leaderboard.length > 0 && (
                                    <div class="border-t pt-4 space-y-3">
                                        <h4 class="font-black text-slate-800 text-sm flex items-center gap-2">
                                            <span>🏆 答題龍虎榜 (當前題目答題速度排名)</span>
                                        </h4>
                                        <div class="flex flex-wrap gap-2">
                                            {leaderboard.map((res, idx) => (
                                                <div 
                                                    key={res.studentId}
                                                    class={`px-3 py-1.5 rounded-xl text-xs font-bold flex items-center space-x-1.5 ${
                                                        idx === 0 
                                                        ? 'bg-amber-100 text-amber-900 border-2 border-amber-300 ring-2 ring-amber-200' 
                                                        : 'bg-slate-100 text-slate-700 border'
                                                    }`}
                                                >
                                                    <span>{idx === 0 ? '🥇 最快答題！' : `#${idx + 1}`}</span>
                                                    <span>{res.name} ({res.seatNumber}號)</span>
                                                    <span class="font-mono text-slate-500">[{res.duration}s]</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* 修訂 3: QR Code同時實時顯示已加入人數與即時學生名單 */}
                    {showQRModal && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 md:p-8 max-w-lg w-full text-center space-y-5 shadow-2xl">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="text-xl font-black text-slate-800">課堂加入 QR Code</h3>
                                    <button onClick={() => setShowQRModal(false)} class="text-slate-400 text-2xl font-bold hover:text-slate-600">✕</button>
                                </div>

                                <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100 inline-block">
                                    <img src={qrImageUrl} class="mx-auto rounded-2xl border p-2 shadow-inner bg-white w-48 h-48" alt="QR Code" />
                                    <div class="font-mono font-black text-3xl text-indigo-600 tracking-widest mt-2">
                                        房號：{roomCode}
                                    </div>
                                </div>

                                {/* Real-time count banner */}
                                <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-2xl flex items-center justify-center space-x-2">
                                    <span class="relative flex h-3 w-3">
                                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                      <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                                    </span>
                                    <span class="font-extrabold text-emerald-800 text-base">
                                        實時已加入學生：{studentsList.length} 人
                                    </span>
                                </div>

                                {/* Dynamic list preview of joined students */}
                                <div class="bg-slate-50 rounded-2xl p-3 border max-h-36 overflow-y-auto">
                                    <div class="text-xs font-bold text-slate-400 text-left mb-2">已連線名單：</div>
                                    {studentsList.length > 0 ? (
                                        <div class="flex flex-wrap gap-1.5">
                                            {[...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber)).map(s => (
                                                <span key={s.id} class="px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-xs font-bold text-slate-700 shadow-sm">
                                                    {s.seatNumber}號 - {s.name}
                                                </span>
                                            ))}
                                        </div>
                                    ) : (
                                        <div class="text-xs text-slate-400 py-2">目前尚無學生掃描加入</div>
                                    )}
                                </div>

                                <button 
                                    onClick={() => setShowQRModal(false)}
                                    class="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl shadow-md"
                                >
                                    關閉投影視窗
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Online Student List Modal */}
                    {showStudentListModal && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="text-lg font-black text-slate-800">已加入學生名單 ({studentsList.length}人)</h3>
                                    <button onClick={() => setShowStudentListModal(false)} class="text-slate-400 text-xl font-bold">✕</button>
                                </div>
                                <div class="max-h-80 overflow-y-auto divide-y">
                                    {[...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber)).map((s) => (
                                        <div key={s.id} class="py-2.5 flex justify-between items-center text-sm">
                                            <span class="font-bold text-slate-800">{s.seatNumber}號 - {s.name}</span>
                                            <span class="text-xs font-mono text-slate-400">加入時間: {s.joinTime}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Whiteboard Inspection Lightbox */}
                    {showInspectModal && (
                        <div class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-3xl w-full space-y-4 shadow-2xl">
                                <div class="flex justify-between items-center">
                                    <h3 class="text-lg font-black text-slate-800">
                                        作品預覽：{showInspectModal.name} ({showInspectModal.seatNumber}號)
                                    </h3>
                                    <button onClick={() => setShowInspectModal(null)} class="text-slate-400 text-2xl font-bold">✕</button>
                                </div>

                                <div class="aspect-16-9 bg-slate-100 rounded-2xl overflow-hidden border-2 flex items-center justify-center">
                                    <img src={showInspectModal.answer} class="max-h-full object-contain" alt="大圖" />
                                </div>

                                <div class="flex justify-between items-center pt-2">
                                    <div class="flex space-x-2">
                                        <button 
                                            onClick={() => {
                                                const idx = whiteboardSubmissions.findIndex(s => s.studentId === showInspectModal.studentId);
                                                if (idx > 0) setShowInspectModal(whiteboardSubmissions[idx - 1]);
                                            }}
                                            class="px-4 py-2 rounded-xl bg-slate-100 font-bold text-sm text-slate-700 hover:bg-slate-200"
                                        >
                                            ⬅️ 上一位學生
                                        </button>
                                        <button 
                                            onClick={() => {
                                                const idx = whiteboardSubmissions.findIndex(s => s.studentId === showInspectModal.studentId);
                                                if (idx < whiteboardSubmissions.length - 1) setShowInspectModal(whiteboardSubmissions[idx + 1]);
                                            }}
                                            class="px-4 py-2 rounded-xl bg-slate-100 font-bold text-sm text-slate-700 hover:bg-slate-200"
                                        >
                                            下一位學生 ➡️
                                        </button>
                                    </div>

                                    <button 
                                        onClick={() => handleBroadcastSubmission(showInspectModal)}
                                        class="px-5 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-black text-sm shadow-md"
                                    >
                                        📢 傳送至全班畫面 (學生互評)
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Bar Chart Click Inspection Popover */}
                    {barChoiceFilter && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="text-lg font-black text-slate-800">選擇【{barChoiceFilter}】的學生名單</h3>
                                    <button onClick={() => setBarChoiceFilter(null)} class="text-slate-400 text-xl font-bold">✕</button>
                                </div>
                                <div class="max-h-60 overflow-y-auto divide-y">
                                    {Object.values(currentQuestionResponses).filter(r => r.answer === barChoiceFilter).map((res) => (
                                        <div key={res.studentId} class="py-2.5 flex justify-between items-center text-sm font-bold text-slate-800">
                                            <span>{res.seatNumber}號 - {res.name}</span>
                                            <span class="text-xs font-mono text-slate-400">答題用時: {res.duration}s</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Random Selector Modal */}
                    {showRandomModal && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center space-y-6 shadow-2xl">
                                <h3 class="text-xl font-black text-slate-800">🎲 抽選學生</h3>

                                <div class="flex justify-center items-center space-x-3 bg-slate-50 p-3 rounded-2xl border">
                                    <span class="text-xs font-bold text-slate-500">學號範圍：</span>
                                    <input 
                                        type="number" 
                                        value={rangeStart} 
                                        onChange={(e) => setRangeStart(e.target.value)}
                                        class="w-16 px-2 py-1 border rounded-lg text-center font-bold"
                                    />
                                    <span>至</span>
                                    <input 
                                        type="number" 
                                        value={rangeEnd} 
                                        onChange={(e) => setRangeEnd(e.target.value)}
                                        class="w-16 px-2 py-1 border rounded-lg text-center font-bold"
                                    />
                                </div>

                                <div class="h-32 bg-amber-50 rounded-3xl border-2 border-amber-300 flex items-center justify-center">
                                    <span class="text-6xl font-black text-amber-600 font-mono">
                                        {currentDrawn !== null ? `${currentDrawn} 號` : 'READY'}
                                    </span>
                                </div>

                                <div class="flex space-x-3">
                                    <button 
                                        onClick={handleSpinRandom}
                                        disabled={isSpinning}
                                        class="flex-1 py-3.5 bg-amber-500 hover:bg-amber-600 text-white font-black rounded-xl text-lg shadow-md"
                                    >
                                        開始抽籤 🎰
                                    </button>
                                    <button 
                                        onClick={() => { setDrawnNumbers([]); setCurrentDrawn(null); showToast("已重置抽籤名單！", "info"); }}
                                        class="px-4 py-3 bg-slate-200 text-slate-700 font-bold rounded-xl text-sm"
                                    >
                                        重置
                                    </button>
                                </div>

                                <button 
                                    onClick={() => setShowRandomModal(false)}
                                    class="w-full py-2 text-slate-400 font-bold text-sm"
                                >
                                    關閉
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Zoomed Timer Modal */}
                    {timerZoomed && (
                        <div class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-8 text-white space-y-8">
                            <div class="text-2xl font-bold uppercase tracking-widest text-slate-400">倒數計時</div>
                            <div class="font-mono font-black text-9xl tracking-widest text-indigo-400">
                                {Math.floor(timerSeconds / 60).toString().padStart(2, '0')}:{(timerSeconds % 60).toString().padStart(2, '0')}
                            </div>
                            <button 
                                onClick={() => setTimerZoomed(false)}
                                class="px-8 py-3 bg-white text-slate-900 font-black rounded-2xl text-lg shadow-xl"
                            >
                                關閉放大顯示
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
            const [selectedAnswer, setSelectedAnswer] = useState('');
            const [shortAnswerInput, setShortAnswerInput] = useState('');
            const [submitted, setSubmitted] = useState(false);

            // Whiteboard States
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [penColor, setPenColor] = useState('#000000');
            const [penWidth, setPenWidth] = useState(3);
            const [isEraser, setIsEraser] = useState(false);

            const mySubmission = activeQuestion ? responses[`${activeQuestion.id}_${studentId}`] : null;

            // Canvas initialization
            useEffect(() => {
                if (activeQuestion && activeQuestion.mode === 'DRAW' && canvasRef.current) {
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');
                    
                    if (activeQuestion.whiteboardBg) {
                        const img = new Image();
                        img.src = activeQuestion.whiteboardBg;
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        };
                    } else {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                }
            }, [activeQuestion]);

            // Submit Answer to Firestore with unique questionId_studentId doc key
            const submitStudentResponse = async (answerVal) => {
                if (!activeQuestion) return;

                const appId = "omit-8c173";
                const db = window.fbDb;
                const responseDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', `${activeQuestion.id}_${studentId}`);

                const duration = ((Date.now() - activeQuestion.startTime) / 1000).toFixed(1);

                const resObj = {
                    studentId: studentId,
                    questionId: activeQuestion.id,
                    name: studentName || `學號 ${seatNumber}`,
                    seatNumber: seatNumber,
                    answer: answerVal,
                    duration: duration,
                    timestamp: Date.now()
                };

                await window.fbUtils.setDoc(responseDocRef, resObj);
                setSubmitted(true);
                showToast("已成功提交答案！", "success");
            };

            const handleBuzzerClick = () => {
                playSound('buzzer');
                submitStudentResponse("搶答成功！");
            };

            // Whiteboard Drawing Handlers
            const startDrawing = (e) => {
                setIsDrawing(true);
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                ctx.beginPath();
                ctx.moveTo((clientX - rect.left) * (canvas.width / rect.width), (clientY - rect.top) * (canvas.height / rect.height));
            };

            const draw = (e) => {
                if (!isDrawing) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                ctx.strokeStyle = isEraser ? '#ffffff' : penColor;
                ctx.lineWidth = penWidth;
                ctx.lineCap = 'round';
                ctx.lineTo((clientX - rect.left) * (canvas.width / rect.width), (clientY - rect.top) * (canvas.height / rect.height));
                ctx.stroke();
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const handleClearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                if (activeQuestion.whiteboardBg) {
                    const img = new Image();
                    img.src = activeQuestion.whiteboardBg;
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    };
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            };

            const handleStudentPhotoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const img = new Image();
                        img.src = evt.target.result;
                        img.onload = () => {
                            const canvas = canvasRef.current;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        };
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleSubmitCanvas = () => {
                const canvas = canvasRef.current;
                const dataUrl = canvas.toDataURL();
                submitStudentResponse(dataUrl);
            };

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col">
                    <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
