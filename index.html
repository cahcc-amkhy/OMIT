<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Animal themes for team matching
        const ANIMAL_TEAMS = [
            { name: '老虎組', emoji: '🐯', color: 'bg-amber-500 text-white', border: 'border-amber-600', bgLight: 'bg-amber-50' },
            { name: '大象組', emoji: '🐘', color: 'bg-blue-500 text-white', border: 'border-blue-600', bgLight: 'bg-blue-50' },
            { name: '企鵝組', emoji: '🐧', color: 'bg-cyan-500 text-white', border: 'border-cyan-600', bgLight: 'bg-cyan-50' },
            { name: '藍鯨組', emoji: '🐋', color: 'bg-indigo-500 text-white', border: 'border-indigo-600', bgLight: 'bg-indigo-50' },
            { name: '白兔組', emoji: '🐰', color: 'bg-rose-400 text-white', border: 'border-rose-500', bgLight: 'bg-rose-50' },
            { name: '熊貓組', emoji: '🐼', color: 'bg-slate-700 text-white', border: 'border-slate-800', bgLight: 'bg-slate-50' },
            { name: '獅子組', emoji: '🦁', color: 'bg-yellow-500 text-white', border: 'border-yellow-600', bgLight: 'bg-yellow-50' },
            { name: '白羊組', emoji: '🐑', color: 'bg-emerald-500 text-white', border: 'border-emerald-600', bgLight: 'bg-emerald-50' },
            { name: '水牛組', emoji: '🐃', color: 'bg-stone-600 text-white', border: 'border-stone-700', bgLight: 'bg-stone-50' },
            { name: '斑馬組', emoji: '🦓', color: 'bg-purple-600 text-white', border: 'border-purple-700', bgLight: 'bg-purple-50' }
        ];

        // Preset color palette for Whiteboard
        const PRESET_COLORS = [
            { name: '經典藍', hex: '#2563eb', bgClass: 'bg-blue-600' },
            { name: '黑色', hex: '#000000', bgClass: 'bg-black' },
            { name: '紅色', hex: '#dc2626', bgClass: 'bg-red-600' },
            { name: '綠色', hex: '#16a34a', bgClass: 'bg-green-600' },
            { name: '黃橙', hex: '#f97316', bgClass: 'bg-orange-500' },
            { name: '紫色', hex: '#9333ea', bgClass: 'bg-purple-600' }
        ];

        function getModeLabel(mode) {
            switch(mode) {
                case 'CHOICE': return '選擇題';
                case 'TF': return '是非題';
                case 'SHORT': return '短答題';
                case 'DRAW': return '白板題';
                case 'BUZZER': return '搶答題';
                case 'AUDIO': return '錄音題';
                case 'CHALLENGE': return '挑戰題';
                case 'TEAM': return '合作題';
                case 'LINK': return '派送連結';
                default: return '題目';
            }
        }

        function getDefaultQuestionPrompt(mode) {
            switch(mode) {
                case 'CHOICE': return '請選擇正確答案：';
                case 'TF': return '請判斷下列描述是否正確：';
                case 'SHORT': return '請輸入您的回答：';
                case 'DRAW': return '請在白板上作答或繪圖：';
                case 'BUZZER': return '請準備點擊搶答按鈕！';
                case 'AUDIO': return '請錄製不多於10秒的語音回答：';
                case 'CHALLENGE': return '請在限時內完成以下挑戰題評估：';
                case 'TEAM': return '團隊合作比賽中：請與同組組員合作完成！';
                case 'LINK': return '請點擊或觀看下方派送內容：';
                default: return '請回答問題：';
            }
        }

        // Web Audio Synthesizer
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    if (window.confetti) window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                    });
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (
                <div class={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-xl shadow-lg flex items-center space-x-2 text-sm font-bold animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) throw new Error("JSZip not loaded");
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>
    ${paragraphsXml}
  </w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];
            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) questions.push(currentQ);
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }
                    currentQ.options.push({ letter, text: optText });
                    if (isCorrect) currentQ.answer = letter;
                }
            });

            if (currentQ && currentQ.options.length > 0) questions.push(currentQ);

            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        { num: 1, text: "以下哪一項不是地球的天然資源?", options: [{ letter: "A", text: "水資源" }, { letter: "B", text: "植物資源" }, { letter: "C", text: "動物資源" }, { letter: "D", text: "機械資源" }], answer: "D" },
                        { num: 2, text: "芝士的原料屬於哪一項地球的天然資源?", options: [{ letter: "A", text: "水資源" }, { letter: "B", text: "植物資源" }, { letter: "C", text: "動物資源" }, { letter: "D", text: "礦產資源" }], answer: "C" },
                        { num: 3, text: "人們不當使用水資源會造成甚麼後果?", options: [{ letter: "A", text: "引發極端天氣" }, { letter: "B", text: "引發水災" }, { letter: "C", text: "水土流失" }, { letter: "D", text: "影響食水供應" }], answer: "D" },
                        { num: 4, text: "人們不當使用煤和石油資源會造成甚麼後果?", options: [{ letter: "A", text: "引發極端天氣" }, { letter: "B", text: "引發水災" }, { letter: "C", text: "水土流失" }, { letter: "D", text: "影響食水供應" }], answer: "A" },
                        { num: 5, text: "人們不當使用土地資源會造成甚麼後果?", options: [{ letter: "A", text: "引發極端天氣" }, { letter: "B", text: "引發水災" }, { letter: "C", text: "產生大量二氧化碳" }, { letter: "D", text: "影響食水供應" }], answer: "B" }
                    ]
                };
            }
            return { title, totalScore, questions };
        };

        // High-precision Interactive Canvas with Color Palette & Custom Background Support
        const WhiteboardCanvas = ({ 
            initialBg, 
            onSave, 
            disabled, 
            strokeWidth = 4, 
            setStrokeWidth, 
            strokeColor = '#2563eb',
            setStrokeColor,
            isEraser, 
            setIsEraser, 
            onClear,
            onUploadBg,
            onResetBg,
            hasCustomBg
        }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [bgImageObj, setBgImageObj] = useState(null);

            useEffect(() => {
                if (initialBg) {
                    const img = new Image();
                    img.onload = () => {
                        setBgImageObj(img);
                        redrawCanvas(img);
                    };
                    img.src = initialBg;
                } else {
                    setBgImageObj(null);
                    redrawCanvas(null);
                }
            }, [initialBg]);

            const redrawCanvas = (bgImg) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Draw background image if available, else white
                if (bgImg) {
                    ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            };

            const getCanvasPos = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                if (disabled) return;
                e.preventDefault();
                setIsDrawing(true);
                const pos = getCanvasPos(e);
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            };

            const draw = (e) => {
                if (!isDrawing || disabled) return;
                e.preventDefault();
                const pos = getCanvasPos(e);
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');

                ctx.lineWidth = strokeWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (isEraser) {
                    ctx.globalCompositeOperation = 'destination-out';
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = strokeColor || '#2563eb';
                }

                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            const stopDrawing = () => {
                if (!isDrawing) return;
                setIsDrawing(false);
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.globalCompositeOperation = 'source-over';
                if (onSave) {
                    onSave(canvas.toDataURL('image/png'));
                }
            };

            const handleLocalClear = () => {
                redrawCanvas(bgImageObj);
                if (onClear) onClear();
                if (onSave) {
                    const canvas = canvasRef.current;
                    onSave(canvas.toDataURL('image/png'));
                }
            };

            const handleColorSelect = (hex) => {
                if (setStrokeColor) setStrokeColor(hex);
                if (setIsEraser) setIsEraser(false);
            };

            return (
                <div class="space-y-3">
                    <div class="canvas-container relative w-full aspect-16-9 bg-white rounded-2xl overflow-hidden border-2 border-indigo-200 shadow-inner">
                        <canvas
                            ref={canvasRef}
                            width={1280}
                            height={720}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            class="w-full h-full cursor-crosshair touch-none"
                        />
                    </div>

                    {!disabled && (
                        <div class="space-y-3 bg-slate-100 p-3 rounded-2xl border border-slate-200">
                            {/* Color Palette & Custom RGB Color Picker */}
                            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 pb-2.5">
                                <div class="flex items-center space-x-1.5 flex-wrap gap-y-1.5">
                                    <span class="text-xs font-black text-slate-700 mr-1 flex items-center gap-1">
                                        🎨 畫筆顏色：
                                    </span>
                                    {PRESET_COLORS.map((col) => {
                                        const isSelected = !isEraser && strokeColor?.toLowerCase() === col.hex.toLowerCase();
                                        return (
                                            <button
                                                key={col.hex}
                                                type="button"
                                                onClick={() => handleColorSelect(col.hex)}
                                                class={`w-8 h-8 rounded-full border-2 transition-all flex items-center justify-center shadow-sm active:scale-95 ${col.bgClass} ${
                                                    isSelected ? 'border-slate-900 ring-2 ring-offset-2 ring-indigo-500 scale-110' : 'border-white hover:scale-105'
                                                }`}
                                                title={col.name}
                                            >
                                                {isSelected && <span class="text-white text-xs font-black drop-shadow">✓</span>}
                                            </button>
                                        );
                                    })}

                                    {/* Custom RGB Color Picker */}
                                    <div class="flex items-center space-x-1 bg-white px-2 py-1 rounded-xl border border-slate-200 shadow-sm ml-1">
                                        <label class="text-xs font-bold text-slate-600 cursor-pointer flex items-center gap-1">
                                            <span>RGB:</span>
                                            <input 
                                                type="color" 
                                                value={strokeColor || '#2563eb'} 
                                                onChange={(e) => handleColorSelect(e.target.value)}
                                                class="w-6 h-6 rounded border-0 cursor-pointer p-0 bg-transparent"
                                                title="自訂 RGB 顏色選擇器"
                                            />
                                        </label>
                                        <span class="text-[10px] font-mono font-bold text-indigo-600 uppercase">
                                            {strokeColor}
                                        </span>
                                    </div>
                                </div>

                                {/* Pen Thickness Control */}
                                <div class="flex items-center space-x-2">
                                    <span class="text-xs font-bold text-slate-600">粗細 ({strokeWidth}px):</span>
                                    <input 
                                        type="range" 
                                        min="2" 
                                        max="24" 
                                        value={strokeWidth} 
                                        onChange={(e) => setStrokeWidth && setStrokeWidth(parseInt(e.target.value))}
                                        class="w-20 md:w-24 accent-indigo-600"
                                    />
                                </div>
                            </div>

                            {/* Canvas Toolbar Controls: Eraser, Tablet Image Upload & Reset */}
                            <div class="flex flex-wrap items-center justify-between gap-2">
                                <div class="flex flex-wrap items-center gap-2">
                                    {/* Tablet Background Upload Button */}
                                    {onUploadBg && (
                                        <label class="px-3 py-1.5 text-xs font-black bg-purple-600 hover:bg-purple-700 text-white rounded-xl shadow cursor-pointer transition active:scale-95 flex items-center space-x-1">
                                            <span>🖼️ 平板上載背景</span>
                                            <input 
                                                type="file" 
                                                accept="image/*" 
                                                onChange={onUploadBg} 
                                                class="hidden" 
                                            />
                                        </label>
                                    )}

                    link.download = '下載評估範本Word檔.docx';

                const file = e.target.files[0];

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const arrayBuffer = evt.target.result;
                            const result = await window.mammoth.extractRawText({ arrayBuffer });
                            parsedData = parseWordChallengeText(result.value);

                            parsedData = parseWordChallengeText(evt.target.result);

                        if (targetType === 'TEAM') {
                            setTeamData(parsedData);
                        } else {
                            setChallengeData(parsedData);
                        }

                        showToast("文件解析失敗，請確認格式！", "error");
                    }

                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file, "UTF-8");

                const shuffled = [...students].sort(() => Math.random() - 0.5);
                const teamCount = Math.max(1, Math.floor(shuffled.length / 3));
                
                const shuffledThemes = [...ANIMAL_TEAMS].sort(() => Math.random() - 0.5);
                const generated = [];

                for (let i = 0; i < teamCount; i++) {
                    const theme = shuffledThemes[i % shuffledThemes.length];

                        id: 'team_' + i,
                        name: theme.name,
                        emoji: theme.emoji,
                        color: theme.color,
                        border: theme.border,
                        bgLight: theme.bgLight,
                        members: [],
                        progress: 0,
                        currentQIdx: 0
                    });

                shuffled.forEach((stu, idx) => {
                    const teamIdx = idx % teamCount;
                    generated[teamIdx].members.push(stu);

                };

                showToast(nextBroadcast ? "已廣播教師示範白板至全班螢幕！" : "已收回廣播！", nextBroadcast ? "success" : "info");
            };

            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                let challengeContent = null;

                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請先上載並解析 Word 評估範本檔案！", "error");
                        return;
                    }
                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);

                publishQuestionToFirestore(newQ, updatedHistory);
                showToast(`已成功發佈【${getModeLabel(selectedMode)}】給所有學生！`, 'success');
            };

            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已成功向所有學生一併發放挑戰題成績！", "success");
            };

            const handleClearQuestion = async () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: null }, { merge: true });
                setIsDemoBroadcasting(false);
                showToast('已收回題目，所有學生已返回待機狀態！', 'info');
            };

            const handleExportCSVReport = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生紀錄可供匯出！", "error");
                    return;
                }

                let csvContent = "\uFEFF學號,學生姓名,加入時間";

                historyQuestions.forEach((q, idx) => {
                    const cleanText = (q.text || getModeLabel(q.mode)).replace(/"/g, '""');
                    if (q.mode === 'CHALLENGE' && q.challenge) {
                        csvContent += `,第${idx + 1}題[挑戰題:${q.challenge.title}得分],第${idx + 1}題[挑戰題正確率]`;
                    } else {
                        csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]: "${cleanText}"`;
                    }
                });
                csvContent += "\n";

                const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

                sortedStudents.forEach((stu) => {
                    const cleanName = (stu.name || '').replace(/"/g, '""');
                    csvContent += `"${stu.seatNumber}號","${cleanName}","${stu.joinTime || ''}"`;
                    
                    historyQuestions.forEach((q) => {
                        const resKey = `${q.id}_${stu.id}`;
                        const res = responses[resKey];
                        
                        if (res && res.answer !== undefined && res.answer !== null) {
                            if (q.mode === 'CHALLENGE' && res.scoreDetails) {
                                csvContent += `,"${res.scoreDetails.totalScore} / ${q.challenge.totalScore}分","${res.scoreDetails.percentage}% (用時:${res.duration || 0}s)"`;
                            } else {
                                let ansVal = res.answer;
                                if (typeof ansVal === 'string' && ansVal.startsWith('data:image')) ansVal = '[圖像白板答案]';
                                else if (typeof ansVal === 'string' && ansVal.startsWith('data:audio')) ansVal = '[語音錄音檔案]';
                                const cleanAns = String(ansVal).replace(/"/g, '""');
                                csvContent += `,"${cleanAns} (用時:${res.duration || 0}s)"`;
                            }
                        } else {
                            csvContent += q.mode === 'CHALLENGE' ? `,"未作答","0%"` : `,"未作答"`;
                        }
                    });
                    csvContent += "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `OMIT_本次挑戰題與學習成績試算表_房號${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("已成功下載包含全班成績及細項答案的 CSV 試算表！", "success");
            };

            const leaderboard = useMemo(() => {
                const resList = Object.values(currentQuestionResponses).filter(r => r.duration !== undefined);
                
                if (activeQuestion?.mode === 'BUZZER') {
                    return resList.sort((a, b) => parseFloat(a.duration) - parseFloat(b.duration)).slice(0, 1);
                }

                return resList.sort((a, b) => {
                    if (activeQuestion?.mode === 'CHALLENGE') {
                        const scoreA = a.scoreDetails?.totalScore || 0;
                        const scoreB = b.scoreDetails?.totalScore || 0;
                        if (scoreB !== scoreA) return scoreB - scoreA;

                    return parseFloat(a.duration) - parseFloat(b.duration);
                });

            const spinRandomSelector = () => {

                    setDrawnNumbers([]);
                    return;
                }

                setIsSpinning(true);
                let counter = 0;
                const speed = 60;
                const spinTimer = setInterval(() => {
                    const temp = available[Math.floor(Math.random() * available.length)];
                    setCurrentDrawn(temp);
                    playSound('spin');
                    counter++;
                    if (counter > 20) {
                        clearInterval(spinTimer);
                        const finalChoice = available[Math.floor(Math.random() * available.length)];
                        setCurrentDrawn(finalChoice);
                        setDrawnNumbers(prev => [...prev, finalChoice]);
                        setIsSpinning(false);
                        playSound('win');

                }, speed);

                            {selectedMode === 'CHALLENGE' && (

                                    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-amber-200 pb-3">

            const myResponse = responses[myResponseKey];
            const isSubmitted = !!myResponse;

            const [startTime, setStartTime] = useState(Date.now());

                setStartTime(Date.now());
                setSelectedChoice('');
                setShortAnswer('');
                setCanvasData(null);
                setIsEraser(false);
                setCustomStudentBg(null);
            }, [activeQuestion?.id]);

            const handleSubmit = (answerValue) => {
                if (!activeQuestion) return;

                const duration = Math.max(1, Math.round((Date.now() - startTime) / 1000));
                const appId = "omit-8c173";
                const db = window.fbDb;

                const responseObj = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: answerValue,
                    duration: duration,
                    submittedAt: Date.now()
                };

                const docRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', myResponseKey);
                window.fbUtils.setDoc(docRef, responseObj);
                showToast("已成功提交回答！🎉", "success");
            };

            const handleStudentBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setCustomStudentBg(evt.target.result);
                        showToast("已成功上載圖片作為白板背景！", "success");
                    };
                    reader.readAsDataURL(file);
                }
            };

                setCustomStudentBg(null);
                showToast("已還原預設白板背景！", "info");

                                                    }}
                                                    disabled={isSubmitted && activeQuestion.lockAfterSubmit}
                                                    class={`p-5 rounded-2xl font-black text-lg border-2 transition text-left flex items-center justify-between ${
                                                        selectedChoice === opt || myResponse?.answer === opt
                                                        ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg' 
                                                        : 'bg-slate-50 text-slate-800 border-slate-200 hover:border-indigo-300'
                                                    }`}
                                                >
                                                    <span>{opt}</span>
                                                    {(selectedChoice === opt || myResponse?.answer === opt) && (
                                                        <span class="text-white text-xl">✓</span>
                                                    )}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Short Answer Question Mode */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-4">
                                        <textarea 
                                            rows={4}
                                            placeholder="請在此輸入您的回答..."
                                            value={shortAnswer}
                                            onChange={(e) => setShortAnswer(e.target.value)}
                                            disabled={isSubmitted && activeQuestion.lockAfterSubmit}
                                            class="w-full p-4 rounded-2xl border-2 border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 font-medium text-base text-slate-800"
                                        />
                                        {(!isSubmitted || !activeQuestion.lockAfterSubmit) && (
                                            <button 
                                                onClick={() => handleSubmit(shortAnswer)}
                                                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-lg transition active:scale-98 text-base"
                                            >
                                                {isSubmitted ? '🔄 更新回答' : '🚀 提交回答'}
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Buzzer Mode */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="text-center py-6">
                                        <button 
                                            onClick={() => {
                                                playSound('buzzer');
                                                handleSubmit('已按下搶答按鈕！');
                                            }}
                                            disabled={isSubmitted}
                                            class={`w-48 h-48 rounded-full font-black text-2xl shadow-2xl transition transform active:scale-90 ${
                                                isSubmitted 
                                                ? 'bg-slate-300 text-slate-500 cursor-not-allowed' 
                                                : 'bg-rose-500 hover:bg-rose-600 text-white ring-8 ring-rose-200 animate-pulse'
                                            }`}
                                        >
                                            {isSubmitted ? '已按鈕' : '🚨 搶答！'}
                                        </button>
                                    </div>
                                )}

                                {isSubmitted && (
                                    <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl text-center text-emerald-800 font-bold text-xs flex items-center justify-center space-x-1.5">
                                        <span>✅ 您已成功提交答覆！</span>
                                        {activeQuestion.lockAfterSubmit && <span>(題目已鎖定)</span>}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
