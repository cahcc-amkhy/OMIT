    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Animal preset list for Team Co-op Mode
        const ANIMAL_PRESETS = [
            { name: "老虎組", emoji: "🐯", color: "bg-amber-500 text-white", border: "border-amber-600" },
            { name: "大象組", emoji: "🐘", color: "bg-blue-600 text-white", border: "border-blue-700" },
            { name: "企鵝組", emoji: "🐧", color: "bg-cyan-600 text-white", border: "border-cyan-700" },
            { name: "藍鯨組", emoji: "🐳", color: "bg-indigo-600 text-white", border: "border-indigo-700" },
            { name: "白兔組", emoji: "🐰", color: "bg-pink-500 text-white", border: "border-pink-600" },
            { name: "熊貓組", emoji: "🐼", color: "bg-emerald-600 text-white", border: "border-emerald-700" },
            { name: "獅子組", emoji: "🦁", color: "bg-orange-500 text-white", border: "border-orange-600" },
            { name: "白羊組", emoji: "🐑", color: "bg-slate-600 text-white", border: "border-slate-700" },
            { name: "水牛組", emoji: "🐃", color: "bg-stone-700 text-white", border: "border-stone-800" },
            { name: "斑馬組", emoji: "🦓", color: "bg-purple-600 text-white", border: "border-purple-700" }
        ];

        // Mode labels
        function getModeLabel(mode) {
            switch(mode) {
                case 'CHOICE': return '選擇題';
                case 'TF': return '是非題';
                case 'SHORT': return '短答題';
                case 'DRAW': return '白板題';
                case 'BUZZER': return '搶答題';
                case 'AUDIO': return '錄音題';
                case 'CHALLENGE': return '挑戰題';
                case 'COOP': return '合作題';
                case 'LINK': return '派送連結';
                default: return '題目';
            }
        }

        function getDefaultQuestionPrompt(mode) {
            switch(mode) {
                case 'CHOICE': return '請選擇正確答案：';
                case 'TF': return '請判斷下列描述是否正確：';
                case 'SHORT': return '請輸入您的回答：';
                case 'DRAW': return '請在白板上作答或繪圖：';
                case 'BUZZER': return '請準備點擊搶答按鈕！';
                case 'AUDIO': return '請錄製不多於10秒的語音回答：';
                case 'CHALLENGE': return '請在限時內完成以下挑戰題評估：';
                case 'COOP': return '團結合作，共同完成每道題目！';
                case 'LINK': return '請點擊或觀看下方派送內容：';
                default: return '請回答問題：';
            }
        }

        // Web Audio Synthesizer
        let audioCtxInstance = null;
        let activeBgmOscillators = [];

        const getAudioContext = () => {
            if (!audioCtxInstance) {
                audioCtxInstance = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtxInstance.state === 'suspended') {
                audioCtxInstance.resume();
            }
            return audioCtxInstance;
        };

        const stopBGM = () => {
            activeBgmOscillators.forEach(o => {
                try { o.stop(); o.disconnect(); } catch(e){}
            });
            activeBgmOscillators = [];
        };

        const playBGM = (type) => {
            stopBGM();
            const ctx = getAudioContext();

            if (type === 'relax') {
                // Relaxing background music loop
                const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
                let idx = 0;
                const interval = setInterval(() => {
                    if (activeBgmOscillators.length === 0) {
                        clearInterval(interval);
                        return;
                    }
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(notes[idx % notes.length], ctx.currentTime);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                    idx++;
                }, 400);
                activeBgmOscillators.push({ stop: () => clearInterval(interval), disconnect: () => {} });
            } else if (type === 'tense') {
                // String-like tense competition background music loop
                const notes = [130.81, 138.59, 146.83, 138.59];
                let idx = 0;
                const interval = setInterval(() => {
                    if (activeBgmOscillators.length === 0) {
                        clearInterval(interval);
                        return;
                    }
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(notes[idx % notes.length], ctx.currentTime);
                    gain.gain.setValueAtTime(0.06, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.005, ctx.currentTime + 0.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.2);
                    idx++;
                }, 220);
                activeBgmOscillators.push({ stop: () => clearInterval(interval), disconnect: () => {} });
            }
        };

        const playSound = (type) => {
            try {
                const ctx = getAudioContext();
                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.12 + 0.35);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.12);
                        osc.stop(ctx.currentTime + idx * 0.12 + 0.35);
                    });
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(110, ctx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3500);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (
                <div class={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-2 text-sm font-extrabold animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        // Create Word .docx binary blob using JSZip
        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) throw new Error("JSZip not loaded");
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>${paragraphsXml}</w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        // Parse Word or plain text file into question object array
        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '常識與科學挑戰評估';
            let totalScore = 100;
            const questions = [];
            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) {
                        questions.push(currentQ);
                    }
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    let isCorrect = false;

                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }

                    currentQ.options.push({ letter, text: optText });
                    if (isCorrect) currentQ.answer = letter;
                }
            });

            if (currentQ && currentQ.options.length > 0) questions.push(currentQ);

            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1,
                            text: "以下哪一項不是地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "機械資源" }
                            ],
                            answer: "D"
                        },
                        {
                            num: 2,
                            text: "芝士的原料屬於哪一項地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "礦產資源" }
                            ],
                            answer: "C"
                        },
                        {
                            num: 3,
                            text: "人們不當使用水資源會造成甚麼後果?",
                            options: [
                                { letter: "A", text: "引發極端天氣" },
                                { letter: "B", text: "引發水災" },
                                { letter: "C", text: "水土流失" },
                                { letter: "D", text: "影響食水供應" }
                            ],
                            answer: "D"
                        },
                        {
                            num: 4,
                            text: "人們不當使用煤和石油資源會造成甚麼後果?",
                            options: [
                                { letter: "A", text: "引發極端天氣" },
                                { letter: "B", text: "引發水災" },
                                { letter: "C", text: "水土流失" },
                                { letter: "D", text: "影響食水供應" }
                            ],
                            answer: "A"
                        },
                        {
                            num: 5,
                            text: "人們不當使用土地資源會造成甚麼後果?",
                            options: [
                                { letter: "A", text: "引發極端天氣" },
                                { letter: "B", text: "引發水災" },
                                { letter: "C", text: "產生大量二氧化碳" },
                                { letter: "D", text: "影響食水供應" }
                            ],
                            answer: "B"
                        }
                    ]
                };
            }

            return { title, totalScore, questions };
        };

        // Item 1 & 21: High-Precision 1280x720 Whiteboard Canvas
        function WhiteboardCanvas({ bgImage, onSubmit, onClear, readonly = false, initialData = null }) {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [brushColor, setBrushColor] = useState('#2563eb');
            const [brushWidth, setBrushWidth] = useState(4);
            const [isEraser, setIsEraser] = useState(false);
            const [customBg, setCustomBg] = useState(bgImage || null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                // Internal standard resolution 1280x720
                canvas.width = 1280;
                canvas.height = 720;

                // Fill default white
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (initialData) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    img.src = initialData;
                } else if (customBg) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    img.src = customBg;
                }
            }, [customBg, initialData]);

            // Precise Ratio Mapping formula scaleX / scaleY
            const getCanvasCoordinates = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches[0]) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                if (readonly) return;
                e.preventDefault();
                setIsDrawing(true);
                const { x, y } = getCanvasCoordinates(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            const draw = (e) => {
                if (!isDrawing || readonly) return;
                e.preventDefault();
                const { x, y } = getCanvasCoordinates(e);
                const ctx = canvasRef.current.getContext('2d');

                ctx.lineWidth = brushWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (isEraser) {
                    ctx.strokeStyle = '#ffffff';
                } else {
                    ctx.strokeStyle = brushColor;
                }

                ctx.lineTo(x, y);
                ctx.stroke();
            };

            const stopDrawing = (e) => {
                if (readonly) return;
                setIsDrawing(false);
            };

            const handleClear = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                if (customBg) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    img.src = customBg;
                }
                if (onClear) onClear();
            };

            const handleImageBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => setCustomBg(evt.target.result);
                    reader.readAsDataURL(file);
                }
            };

            const handleSubmitCanvas = () => {
                if (canvasRef.current && onSubmit) {
                    const dataUrl = canvasRef.current.toDataURL('image/png');
                    onSubmit(dataUrl);
                }
            };

            return (
                <div class="space-y-3 w-full">
                    {!readonly && (
                        <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                            {/* Colors */}
                            <div class="flex items-center space-x-1.5">
                                {['#000000', '#2563eb', '#dc2626', '#16a34a', '#d97706', '#9333ea'].map((c) => (
                                    <button 
                                        key={c}
                                        type="button"
                                        onClick={() => { setBrushColor(c); setIsEraser(false); }}
                                        class={`w-7 h-7 rounded-full border-2 transition ${!isEraser && brushColor === c ? 'scale-110 border-slate-900 shadow' : 'border-white'}`}
                                        style={{ backgroundColor: c }}
                                    />
                                ))}
                                <button 
                                    type="button"
                                    onClick={() => setIsEraser(!isEraser)}
                                    class={`px-2.5 py-1 text-xs font-extrabold rounded-xl border transition ${isEraser ? 'bg-amber-500 text-white border-amber-600' : 'bg-white text-slate-700'}`}
                                >

            const [timerMinInput, setTimerMinInput] = useState('01');

            const [challengeReleaseInstant, setChallengeReleaseInstant] = useState(true);

            // Item 22: Cooperative Quiz ("合作題") state
            const [coopData, setCoopData] = useState(null); // Parsed questions for Coop

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

            // Current Question Responses
            const currentQuestionResponses = useMemo(() => {

                });

            }, [responses, activeQuestion]);

            // Timer Interval
            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {

                                setTimerActive(false);

                                return 0;
                            }

                        });

                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            // Sync Room
            const publishRoomState = async (updatePayload) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { ...updatePayload, updatedAt: Date.now() }, { merge: true });
            };

            const handleExitRoom = async () => {
                if (window.confirm("確定退出課室？將會同步清空此課室於 Firebase 的所有暫存紀錄！")) {
                    try {
                        stopBGM();
                        const appId = "omit-8c173";
                        const db = window.fbDb;
                        
                        const responsesColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');
                        const resSnaps = await window.fbUtils.getDocs(responsesColRef);
                        resSnaps.forEach(async (d) => await window.fbUtils.deleteDoc(d.ref));

                        const studentsColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');

                        stuSnaps.forEach(async (d) => await window.fbUtils.deleteDoc(d.ref));

                        const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                        await window.fbUtils.deleteDoc(roomDocRef);
                    } catch (e){}
                    onExit();
                }
            };

            // Download Challenge Word Template
            const handleDownloadChallengeTemplate = async () => {
                const sampleLines = [
                    "標題：常識與科學評估",
                    "總分: 100分",
                    "1.以下哪一項不是地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源",
                    "D. 機械資源*",
                    "",
                    "2.芝士的原料屬於哪一項地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源*",
                    "D. 礦產資源",
                    "",
                    "3.人們不當使用水資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應*",
                    "",
                    "4.人們不當使用煤和石油資源會造成甚麼後果?",
                    "A. 引發極端天氣*",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應",
                    "",
                    "5.人們不當使用土地資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災*",
                    "C. 產生大量二氧化碳",
                    "D. 影響食水供應"
                ];

                try {
                    const blob = await createWordDocxBlob(sampleLines);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = '下載評估範本Word檔.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast("已下載評估範本 Word檔 (.docx)！", "success");
                } catch (err) {
                    showToast("生成 Word 檔失敗！", "error");
                }
            };

            // Parse Word File for Challenge or Coop
            const handleWordFileUpload = (e, targetType) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        let parsed = null;
                        if (file.name.endsWith('.docx')) {
                            const arrayBuffer = evt.target.result;
                            const res = await window.mammoth.extractRawText({ arrayBuffer });
                            parsed = parseWordChallengeText(res.value);
                        } else {
                            parsed = parseWordChallengeText(evt.target.result);
                        }

                        if (targetType === 'CHALLENGE') setChallengeData(parsed);
                        else if (targetType === 'COOP') setCoopData(parsed);

                        showToast(`已解析 Word 檔！共 ${parsed.questions.length} 題`, 'success');
                    } catch (err) {
                        showToast("Word 文件解析失敗！", "error");
                    }
                };

                if (file.name.endsWith('.docx')) reader.readAsArrayBuffer(file);
                else reader.readAsText(file, "UTF-8");
            };

            // Publish active question
            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                let challengeContent = null;

                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請上載並確認評估範本檔！", "error");
                        return;
                    }
                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);
                publishRoomState({ activeQuestion: newQ, history: updatedHistory, broadcastedWhiteboard: null });
                showToast(`已成功發佈【${getModeLabel(selectedMode)}】！`, 'success');
            };

            // Item 22: Cooperative Quiz Flow Implementation
            // Phase 22.2: Grouping
            const handleStartCoopGrouping = () => {
                if (!coopData || !coopData.questions || coopData.questions.length === 0) {
                    showToast("請先上載合作題 Word 評估範本！", "error");
                    return;
                }

                if (studentsList.length === 0) {
                    showToast("目前無學生在線，無法進行分組！", "error");
                    return;
                }

                // Shuffle students
                const shuffledStudents = [...studentsList].sort(() => 0.5 - Math.random());
                // Shuffle animals
                const shuffledAnimals = [...ANIMAL_PRESETS].sort(() => 0.5 - Math.random());

                // Decide number of teams (approx 3-4 students per team)
                const teamCount = Math.max(2, Math.min(shuffledAnimals.length, Math.ceil(studentsList.length / 3)));
                const teams = [];

                for (let i = 0; i < teamCount; i++) {
                    const preset = shuffledAnimals[i];
                    teams.push({
                        id: 'team_' + i,
                        name: preset.name,
                        emoji: preset.emoji,
                        color: preset.color,
                        border: preset.border,
                        members: [],
                        progress: 0, // Number of questions solved
                        isWinner: false
                    });
                }

                shuffledStudents.forEach((stu, idx) => {
                    const teamIdx = idx % teamCount;
                    teams[teamIdx].members.push(stu);
                });

                const newCoopState = {
                    stage: 'GROUPING', // 'PREP', 'GROUPING', 'RACE'
                    title: coopData.title,
                    questions: coopData.questions,
                    teams: teams,
                    winnerTeam: null
                };

                publishRoomState({ coopState: newCoopState, activeQuestion: { id: 'coop_active', mode: 'COOP' } });
                playBGM('relax');
                showToast("已完成隨機平均分組！正在播放輕鬆配樂...", "success");
            };

            // Reshuffle teams
            const handleReshuffleTeams = () => {
                handleStartCoopGrouping();
            };

            // Phase 22.3: Start Race
            const handleStartCoopRace = () => {
                if (!coopState) return;
                playBGM('tense');
                const updatedCoop = {
                    ...coopState,
                    stage: 'RACE',
                    teams: coopState.teams.map(t => ({ ...t, progress: 0, isWinner: false })),
                    winnerTeam: null
                };
                publishRoomState({ coopState: updatedCoop });
                showToast("🏁 合作題比賽正式開始！", "success");
            };

            // End Race back to PREP
            const handleEndCoop = () => {
                stopBGM();
                publishRoomState({ coopState: null, activeQuestion: null });
                showToast("已結束合作題比賽，回到預備狀態", "info");
            };

            // Teacher Broadcast Whiteboard Submission (Item 2)
            const handleBroadcastSubmission = (studentRes) => {
                publishRoomState({ broadcastedWhiteboard: studentRes });
                showToast(`已將 ${studentRes.name} 的白板廣播至全班螢幕！`, "success");
            };

            const handleCancelBroadcast = () => {
                publishRoomState({ broadcastedWhiteboard: null });
                showToast("已取消白板廣播", "info");
            };

            // Teacher Broadcast Teacher Whiteboard (Item 21)
            const handleBroadcastTeacherWhiteboard = (dataUrl) => {
                const teacherResObj = {
                    studentId: 'teacher_board',
                    name: '老師白板示範',
                    seatNumber: '👨‍🏫',
                    answer: dataUrl
                };
                publishRoomState({ broadcastedWhiteboard: teacherResObj });
                showToast("已將教師白板示範廣播至全班學生螢幕！", "success");
            };

            // Item 20: CSV Export for Challenge Mode
            const handleExportCSVReport = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生紀錄可供匯出！", "error");
                    return;
                }

                let csvContent = "\uFEFF"; // UTF-8 BOM
                csvContent += "學號,學生姓名,加入時間";

                historyQuestions.forEach((q, idx) => {
                    const cleanText = (q.text || getModeLabel(q.mode)).replace(/"/g, '""');
                    if (q.mode === 'CHALLENGE' && q.challenge) {
                        csvContent += `,第${idx + 1}題[挑戰題:${q.challenge.title}得分],第${idx + 1}題[挑戰題正確率]`;
                    } else {
                        csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]: "${cleanText}"`;
                    }
                });
                csvContent += "\n";

                const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

                sortedStudents.forEach((stu) => {
                    const cleanName = (stu.name || '').replace(/"/g, '""');
                    csvContent += `"${stu.seatNumber}號","${cleanName}","${stu.joinTime || ''}"`;
                    
                    historyQuestions.forEach((q) => {
                        const resKey = `${q.id}_${stu.id}`;
                        const res = responses[resKey];
                        
                        if (res && res.answer !== undefined && res.answer !== null) {
                            if (q.mode === 'CHALLENGE' && res.scoreDetails) {
                                csvContent += `,"${res.scoreDetails.totalScore} / ${q.challenge.totalScore}分","${res.scoreDetails.percentage}% (用時:${res.duration || 0}s)"`;
                            } else {
                                let ansVal = res.answer;
                                if (typeof ansVal === 'string' && ansVal.startsWith('data:image')) ansVal = '[圖像白板作品]';
                                else if (typeof ansVal === 'string' && ansVal.startsWith('data:audio')) ansVal = '[語音錄音檔案]';
                                csvContent += `,"${String(ansVal).replace(/"/g, '""')} (用時:${res.duration || 0}s)"`;
                            }
                        } else {
                            csvContent += q.mode === 'CHALLENGE' ? `,"未作答","0%"` : `,"未作答"`;
                        }
                    });
                    csvContent += "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `OMIT_課堂學習與挑戰題成績試算表_房號${roomCode}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("📥 已成功匯出本次挑戰題與學習成績試算表 (.csv)！", "success");
            };

            // Random draw handler
            const handleSpinRandom = () => {
                if (isSpinning) return;
                const start = parseInt(rangeStart) || 1;
                const end = parseInt(rangeEnd) || 36;
                const available = [];
                for (let i = start; i <= end; i++) {
                    if (!drawnNumbers.includes(i)) available.push(i);
                }

                if (available.length === 0) {
                    showToast("此範圍內學號皆已被抽出！請點擊重置。", "error");
                    return;
                }

                setIsSpinning(true);
                let counter = 0;
                const timer = setInterval(() => {
                    const temp = available[Math.floor(Math.random() * available.length)];
                    setCurrentDrawn(temp);
                    playSound('spin');
                    counter++;

                    if (counter >= 18) {
                        clearInterval(timer);
                        const finalPicked = available[Math.floor(Math.random() * available.length)];
                        setCurrentDrawn(finalPicked);
                        setDrawnNumbers(prev => [...prev, finalPicked]);
                        setIsSpinning(false);
                        playSound('win');
                    }
                }, 100);
            };

            // Leaderboard calculation
            const leaderboard = useMemo(() => {
                return Object.values(currentQuestionResponses)
                    .filter(r => r.duration !== undefined)
                    .sort((a, b) => {
                        if (activeQuestion?.mode === 'CHALLENGE') {
                            const scoreA = a.scoreDetails?.totalScore || 0;
                            const scoreB = b.scoreDetails?.totalScore || 0;
                            if (scoreB !== scoreA) return scoreB - scoreA;
                        }
                        return parseFloat(a.duration) - parseFloat(b.duration);
                    });
            }, [currentQuestionResponses, activeQuestion]);

            const whiteboardSubmissions = useMemo(() => {
                return Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:image'));
            }, [currentQuestionResponses]);

            const challengeScoresAreReleased = useMemo(() => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return true;
                return !!(activeQuestion.challenge?.releaseInstant || activeQuestion.challenge?.scoresReleased);
            }, [activeQuestion]);

            return (
                <div class="min-h-screen pb-12">
                    {/* Item 9: Teacher Header */}
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 py-3">
                        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                            <div class="flex items-center space-x-3">
                                <span class="bg-slate-900 text-white font-black px-3 py-1.5 rounded-xl text-base tracking-wider">OMIT</span>
                                <h1 class="font-extrabold text-slate-800 text-base md:text-lg flex items-center gap-2">
                                    <span>宣道會陳元喜小學OMIT互動課堂</span>
                                    <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1 rounded-full font-mono font-bold">
                                        房號：{roomCode}
                                    </span>
                                </h1>
                            </div>

                            <div class="flex flex-wrap items-center gap-2">
                                {/* Item 21: Teacher Whiteboard Button */}
                                <button 
                                    onClick={() => setShowTeacherWhiteboardModal(true)}
                                    class="bg-purple-600 hover:bg-purple-700 text-white font-extrabold px-3 py-2 rounded-xl text-xs md:text-sm shadow-sm transition flex items-center gap-1.5 active:scale-95"
                                >
                                    <span>🎨 老師白板</span>
                                </button>

                                {/* Item 9: Random Student Button */}
                                <button 
                                    onClick={() => setShowRandomModal(true)}
                                    class="bg-purple-50 hover:bg-purple-100 text-purple-700 font-bold px-3 py-2 rounded-xl border border-purple-200 text-xs md:text-sm transition"
                                >
                                    🎲 抽選學生
                                </button>

                                {/* Item 11: QR Code & Realtime Student Count Badge */}
                                <button 
                                    onClick={() => setShowQRModal(true)}
                                    class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-2 rounded-xl border border-indigo-200 text-xs md:text-sm flex items-center space-x-1.5 transition"
                                >
                                    <span>📱 QR Code</span>
                                    <span class="bg-indigo-600 text-white text-xs px-1.5 py-0.5 rounded-full font-mono font-bold">
                                        {studentsList.length}
                                    </span>
                                </button>

                                {/* Item 10: Timer Tool */}
                                <button 
                                    onClick={() => setShowTimerModal(true)}
                                    class={`px-3 py-2 rounded-xl border text-xs md:text-sm font-bold flex items-center space-x-1.5 transition ${
                                        timerActive ? 'bg-amber-500 text-white border-amber-600 animate-pulse' : 'bg-amber-50 hover:bg-amber-100 text-amber-800 border-amber-200'
                                    }`}
                                >
                                    <span>⏱️ 計時器</span>
                                    {timerSeconds > 0 && (
                                        <span class="bg-white/20 font-mono text-xs px-1.5 py-0.5 rounded">
                                            {Math.floor(timerSeconds / 60)}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                        </span>
                                    )}
                                </button>

                                {/* Item 20: Export CSV */}
                                <button 
                                    onClick={handleExportCSVReport}
                                    class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold px-3 py-2 rounded-xl border border-blue-200 text-xs md:text-sm transition flex items-center gap-1"
                                >
                                    <span>📥 匯出試算表</span>
                                </button>

                                <button 
                                    onClick={handleExitRoom}
                                    class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2 rounded-xl border border-rose-200 text-xs md:text-sm transition"
                                >
                                    🚪 退出
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

                        {/* Mode Selectors (Item 22 added COOP mode) */}
                        <div class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-9 gap-2.5">
                            {[
                                { id: 'CHOICE', label: '選擇題', icon: '🔘' },
                                { id: 'TF', label: '是非題', icon: '⭕' },
                                { id: 'SHORT', label: '短答題', icon: '✍️' },
                                { id: 'DRAW', label: '白板題', icon: '🎨' },
                                { id: 'BUZZER', label: '搶答題', icon: '🚨' },
                                { id: 'AUDIO', label: '錄音題', icon: '🎤' },
                                { id: 'CHALLENGE', label: '挑戰題', icon: '🏆' },
                                { id: 'COOP', label: '合作題', icon: '🤝' },
                                { id: 'LINK', label: '派送連結', icon: '🔗' }
                            ].map((mode) => (
                                <button 
                                    key={mode.id}
                                    onClick={() => setSelectedMode(mode.id)}
                                    class={`p-3 rounded-2xl font-bold border-2 transition-all text-center flex flex-col items-center justify-center space-y-1 shadow-sm active:scale-95 ${
                                        selectedMode === mode.id 
                                        ? 'bg-slate-900 text-white border-slate-900 ring-4 ring-slate-200' 
                                        : 'bg-white text-slate-700 border-slate-200 hover:border-slate-300 hover:bg-slate-50'
                                    }`}
                                >
                                    <span class="text-xl md:text-2xl">{mode.icon}</span>
                                    <span class="text-xs font-extrabold">{mode.label}</span>
                                </button>
                            ))}
                        </div>

                        {/* Question Setup Card */}
                        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                            <div class="flex flex-wrap items-center justify-between border-b pb-3 gap-2">
                                <h2 class="font-extrabold text-slate-800 text-lg flex items-center gap-2">
                                    <span>模式設定：{getModeLabel(selectedMode)}</span>
                                </h2>

                                {selectedMode !== 'CHALLENGE' && selectedMode !== 'COOP' && (
                                    <div class="flex items-center space-x-2 bg-slate-100 p-1.5 rounded-xl">
                                        <span class="text-xs font-bold text-slate-600 pl-2">允許修改答案：</span>
                                        <button 
                                            onClick={() => setLockAfterSubmit(!lockAfterSubmit)}
                                            class={`px-3 py-1 rounded-lg text-xs font-bold transition ${!lockAfterSubmit ? 'bg-emerald-500 text-white' : 'bg-slate-300 text-slate-600'}`}
                                        >
                                            {!lockAfterSubmit ? '開放' : '鎖定 (預設)'}
                                        </button>
                                    </div>
                                )}
                            </div>

                            {/* Item 22: Cooperative Quiz Setup */}
                            {selectedMode === 'COOP' && (
                                <div class="bg-gradient-to-r from-emerald-50 to-teal-50 border border-emerald-200 p-5 rounded-2xl space-y-4">
                                    <div class="flex justify-between items-center border-b border-emerald-200 pb-2">
                                        <h3 class="font-black text-emerald-900 text-base">🤝 合作題 (預備 ➔ 分組 ➔ 比賽)</h3>
                                        <button 
                                            type="button"
                                            onClick={handleDownloadChallengeTemplate}
                                            class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow transition"
                                        >
                                            📄 下載評估範本Word檔
                                        </button>
                                    </div>

                                    {/* Stage 1: Prep */}
                                    <div class="space-y-3 bg-white p-4 rounded-xl border border-emerald-200">
                                        <label class="block text-xs font-bold text-slate-700">
                                            1. 上載合作題 Word 文件 (.docx) / 文字檔 (.txt)：
                                        </label>
                                        <input 
                                            type="file" 
                                            accept=".docx,.txt"
                                            onChange={(e) => handleWordFileUpload(e, 'COOP')}
                                            class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 cursor-pointer"
                                        />

                                        {coopData && (
                                            <div class="bg-emerald-50 p-3 rounded-xl border space-y-2">
                                                <div class="text-xs font-black text-emerald-900">
                                                    已準備評估：《{coopData.title}》 (共 {coopData.questions.length} 題)
                                                </div>
                                                <button 
                                                    onClick={handleStartCoopGrouping}
                                                    class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl shadow transition text-sm"
                                                >
                                                    進入「分組」階段 🔀
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* Item 12-14: Challenge Quiz Setup */}
                            {selectedMode === 'CHALLENGE' && (
                                <div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 p-5 rounded-2xl space-y-5 text-slate-800">
                                    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-amber-200 pb-3">
                                        <h3 class="font-black text-amber-900 text-base">🏆 挑戰題評估 (自動批改)</h3>
                                        <button 
                                            type="button"
                                            onClick={handleDownloadChallengeTemplate}
                                            class="bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow transition"
                                        >
                                            📄 下載評估範本Word檔
                                        </button>
                                    </div>

                                    <div class="bg-white p-4 rounded-xl border border-amber-200 space-y-3">
                                        <label class="block text-xs font-bold text-slate-700">1. 上載 Word 檔 (.docx) 或文字檔 (.txt)：</label>
                                        <input 
                                            type="file" 
                                            accept=".docx,.txt"
                                            onChange={(e) => handleWordFileUpload(e, 'CHALLENGE')}
                                            class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-600 file:text-white hover:file:bg-amber-700 cursor-pointer"
                                        />

                                        {challengeData && (
                                            <div class="bg-amber-50/90 p-4 rounded-xl border-2 border-amber-300 space-y-3">
                                                <div class="font-black text-amber-900 text-sm">✏️ 教師編輯/確認評估內容：</div>
                                                <div class="max-h-60 overflow-y-auto space-y-2 pr-1">
                                                    {challengeData.questions.map((q, qIdx) => (
                                                        <div key={qIdx} class="bg-white p-3 rounded-xl border text-xs space-y-1.5 shadow-sm">
                                                            <div class="flex justify-between items-center gap-2">
                                                                <span class="font-black text-amber-900">第 {q.num || qIdx + 1} 題:</span>
                                                                <input 
                                                                    type="text" 
                                                                    value={q.text} 
                                                                    onChange={(e) => {
                                                                        const newQs = [...challengeData.questions];
                                                                        newQs[qIdx].text = e.target.value;
                                                                        setChallengeData({ ...challengeData, questions: newQs });
                                                                    }}
                                                                    class="flex-1 px-2 py-1 border rounded font-medium text-slate-800"
                                                                />
                                                                <button 
                                                                    onClick={() => {
                                                                        const newQs = challengeData.questions.filter((_, idx) => idx !== qIdx);
                                                                        setChallengeData({ ...challengeData, questions: newQs });
                                                                    }}
                                                                    class="text-red-600 font-bold px-2 py-0.5 bg-red-50 rounded border border-red-200 hover:bg-red-100"
                                                                >
                                                                    🗑️ 刪除
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Item 13: Time Limit controls with min:sec format */}
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-white p-4 rounded-xl border border-amber-200">
                                        <div class="space-y-2">
                                            <div class="flex items-center justify-between">
                                                <label class="text-xs font-bold text-slate-700">2. 答題限時模式：</label>
                                                <input 
                                                    type="checkbox" 
                                                    checked={challengeEnableTimer} 
                                                    onChange={(e) => setChallengeEnableTimer(e.target.checked)}
                                                    class="w-4 h-4 accent-amber-600 rounded cursor-pointer"
                                                />
                                            </div>

                                            {challengeEnableTimer && (
                                                <div class="space-y-2 pt-1">
                                                    <div class="flex flex-wrap items-center gap-1.5">
                                                        <span class="text-xs text-slate-500 font-bold">快鍵：</span>
                                                        {[60, 120, 180, 240, 300].map(s => (
                                                            <button 
                                                                key={s} 
                                                                type="button"
                                                                onClick={() => setChallengeTimeLimit(s)}
                                                                class={`px-2.5 py-1 text-xs rounded-lg font-bold border transition ${challengeTimeLimit === s ? 'bg-amber-600 text-white' : 'bg-slate-50 text-slate-700'}`}
                                                            >
                                                                {s / 60}分鐘
                                                            </button>
                                                        ))}
                                                    </div>

                                                    <div class="flex items-center space-x-2 pt-1">
                                                        <span class="text-xs font-bold text-amber-900">手動輸入時間：</span>
                                                        <div class="flex items-center space-x-1 border rounded-lg px-2.5 py-1.5 bg-white">
                                                            <input 
                                                                type="number"
                                                                min="0"
                                                                max="99"
                                                                value={String(Math.floor(challengeTimeLimit / 60)).padStart(2, '0')}
                                                                onChange={(e) => {
                                                                    const m = Math.max(0, parseInt(e.target.value) || 0);
                                                                    setChallengeTimeLimit(m * 60 + (challengeTimeLimit % 60));
                                                                }}
                                                                class="w-8 text-xs font-mono font-bold text-center outline-none"
                                                            />
                                                            <span class="font-mono font-bold text-amber-900 text-xs">:</span>
                                                            <input 
                                                                type="number"
                                                                min="0"
                                                                max="59"
                                                                value={String(challengeTimeLimit % 60).padStart(2, '0')}
                                                                onChange={(e) => {
                                                                    const s = Math.min(59, Math.max(0, parseInt(e.target.value) || 0));
                                                                    setChallengeTimeLimit(Math.floor(challengeTimeLimit / 60) * 60 + s);
                                                                }}
                                                                class="w-8 text-xs font-mono font-bold text-center outline-none"
                                                            />
                                                        </div>
                                                        <span class="text-xs text-slate-500">(00:00 分:秒)</span>
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        {/* Item 14: Score Release Control */}
                                        <div class="space-y-2 border-t md:border-t-0 md:border-l md:pl-4 pt-3 md:pt-0 border-slate-200">
                                            <label class="text-xs font-bold text-slate-700 block">3. 成績發放控制：</label>
                                            <div class="space-y-1.5">
                                                <label class="flex items-center space-x-2 text-xs font-bold text-slate-700 cursor-pointer">
                                                    <input 
                                                        type="radio" 
                                                        name="scoreRelease" 
                                                        checked={challengeReleaseInstant}
                                                        onChange={() => setChallengeReleaseInstant(true)}
                                                        class="accent-amber-600"
                                                    />
                                                    <span>學生提交後即時給予分數</span>
                                                </label>
                                                <label class="flex items-center space-x-2 text-xs font-bold text-slate-700 cursor-pointer">
                                                    <input 
                                                        type="radio" 
                                                        name="scoreRelease" 
                                                        checked={!challengeReleaseInstant}
                                                        onChange={() => setChallengeReleaseInstant(false)}
                                                        class="accent-amber-600"
                                                    />
                                                    <span>待所有學生完成提交後，由教師按鍵一併發放</span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Item 4: URL Link Pushing */}
                            {selectedMode === 'LINK' && (
                                <div class="space-y-2 bg-amber-50 p-4 rounded-2xl border border-amber-100">
                                    <label class="block text-sm font-bold text-amber-900">
                                        輸入欲派送的網頁連結或 YouTube 影片網址：
                                    </label>
                                    <input 
                                        type="url" 
                                        placeholder="https://www.youtube.com/watch?v=..." 
                                        value={pushedUrl}
                                        onChange={(e) => setPushedUrl(e.target.value)}
                                        class="w-full px-4 py-3 rounded-xl border border-amber-200 focus:outline-none focus:ring-2 focus:ring-amber-500 font-mono text-sm"
                                    />
