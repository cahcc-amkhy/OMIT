                                                const idx = whiteboardSubmissions.findIndex(s => s.studentId === showInspectModal.studentId);
                                                if (idx < whiteboardSubmissions.length - 1) setShowInspectModal(whiteboardSubmissions[idx + 1]);
                                            }}
                                            class="px-4 py-2 rounded-xl bg-slate-100 font-bold text-sm text-slate-700 hover:bg-slate-200"
                                        >
                                            下一位學生 ➡️
                                        </button>
                                    </div>

                                    <button 
                                        onClick={() => handleBroadcastSubmission(showInspectModal)}
                                        class="px-5 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-black text-sm shadow-md"
                                    >
                                        📢 傳送至全班畫面 (學生互評)
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Bar Chart Click Inspection Popover */}
                    {barChoiceFilter && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="text-lg font-black text-slate-800">選擇【{barChoiceFilter}】的學生名單</h3>
                                    <button onClick={() => setBarChoiceFilter(null)} class="text-slate-400 text-xl font-bold">✕</button>
                                </div>
                                <div class="max-h-60 overflow-y-auto divide-y">
                                    {Object.values(currentQuestionResponses).filter(r => r.answer === barChoiceFilter).map((res) => (
                                        <div key={res.studentId} class="py-2.5 flex justify-between items-center text-sm font-bold text-slate-800">
                                            <span>{res.seatNumber}號 - {res.name}</span>
                                            <span class="text-xs font-mono text-slate-400">答題用時: {res.duration}s</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Random Selector Modal */}
                    {showRandomModal && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center space-y-6 shadow-2xl">
                                <h3 class="text-xl font-black text-slate-800">🎲 抽選學生</h3>

                                <div class="flex justify-center items-center space-x-3 bg-slate-50 p-3 rounded-2xl border">
                                    <span class="text-xs font-bold text-slate-500">學號範圍：</span>
                                    <input 
                                        type="number" 
                                        value={rangeStart} 
                                        onChange={(e) => setRangeStart(e.target.value)}
                                        class="w-16 px-2 py-1 border rounded-lg text-center font-bold"
                                    />
                                    <span>至</span>
                                    <input 
                                        type="number" 
                                        value={rangeEnd} 
                                        onChange={(e) => setRangeEnd(e.target.value)}
                                        class="w-16 px-2 py-1 border rounded-lg text-center font-bold"
                                    />
                                </div>

                                <div class="h-32 bg-amber-50 rounded-3xl border-2 border-amber-300 flex items-center justify-center">
                                    <span class="text-6xl font-black text-amber-600 font-mono">
                                        {currentDrawn !== null ? `${currentDrawn} 號` : 'READY'}
                                    </span>
                                </div>

                                <div class="flex space-x-3">
                                    <button 
                                        onClick={handleSpinRandom}
                                        disabled={isSpinning}
                                        class="flex-1 py-3.5 bg-amber-500 hover:bg-amber-600 text-white font-black rounded-xl text-lg shadow-md"
                                    >
                                        開始抽籤 🎰
                                    </button>
                                    <button 
                                        onClick={() => { setDrawnNumbers([]); setCurrentDrawn(null); showToast("已重置抽籤名單！", "info"); }}
                                        class="px-4 py-3 bg-slate-200 text-slate-700 font-bold rounded-xl text-sm"
                                    >
                                        重置
                                    </button>
                                </div>

                                <button 
                                    onClick={() => setShowRandomModal(false)}
                                    class="w-full py-2 text-slate-400 font-bold text-sm"
                                >
                                    關閉
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Requirement 1 Modal: Teacher Floating Countdown Timer */}
                    {showTimerModal && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-lg w-full space-y-5 shadow-2xl border border-slate-200">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="text-xl font-black text-slate-800 flex items-center gap-2">
                                        <span>⏱️ 課堂倒數計時器</span>
                                    </h3>
                                    <button onClick={() => setShowTimerModal(false)} class="text-slate-400 text-2xl font-bold">✕</button>
                                </div>

                                <div class="text-center bg-slate-900 text-white p-6 rounded-2xl shadow-inner space-y-2">
                                    <div class="text-xs uppercase tracking-widest text-slate-400 font-bold">倒數賸餘時間</div>
                                    <div class={`font-mono font-black text-6xl tracking-widest ${timerSeconds <= 10 && timerSeconds > 0 ? 'text-red-400 animate-pulse' : 'text-amber-400'}`}>
                                        {Math.floor(timerSeconds / 60).toString().padStart(2, '0')}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                    </div>
                                </div>

                                <div class="grid grid-cols-3 gap-2">
                                    {[
                                        ['30秒', 30], ['1分鐘', 60], ['2分鐘', 120],
                                        ['3分鐘', 180], ['5分鐘', 300], ['10分鐘', 600]
                                    ].map(([lbl, sec]) => (
                                        <button 
                                            key={lbl} 
                                            onClick={() => { setTimerSeconds(sec); setTimerActive(true); }}
                                            class="py-2.5 rounded-xl bg-slate-100 hover:bg-amber-100 hover:text-amber-900 font-extrabold text-sm text-slate-700 border transition"
                                        >
                                            {lbl}
                                        </button>
                                    ))}
                                </div>

                                <div class="flex items-center space-x-2 pt-1">
                                    <span class="text-xs font-bold text-slate-500">自訂秒數：</span>
                                    <input 
                                        type="number" 
                                        value={customTimerInput}
                                        onChange={(e) => setCustomTimerInput(e.target.value)}
                                        class="flex-1 px-3 py-2 text-center border rounded-xl font-mono font-bold"
                                        placeholder="秒數"
                                    />
                                    <button 
                                        onClick={() => { setTimerSeconds(parseInt(customTimerInput) || 30); setTimerActive(true); }}
                                        class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold"
                                    >
                                        設定並開始
                                    </button>
                                </div>

                                <div class="flex space-x-2 pt-2">
                                    <button 
                                        onClick={() => setTimerActive(!timerActive)}
                                        class={`flex-1 py-3 rounded-xl font-bold text-sm text-white shadow transition ${timerActive ? 'bg-amber-500 hover:bg-amber-600' : 'bg-emerald-600 hover:bg-emerald-700'}`}
                                    >
                                        {timerActive ? '暫停計時' : '繼續倒數'}
                                    </button>
                                    <button 
                                        onClick={() => { setTimerActive(false); setTimerSeconds(0); }}
                                        class="px-4 py-3 rounded-xl bg-slate-200 text-slate-700 font-bold text-sm hover:bg-slate-300"
                                    >
                                        歸零
                                    </button>
                                    <button 
                                        onClick={() => setTimerZoomed(true)}
                                        class="px-4 py-3 rounded-xl bg-indigo-50 text-indigo-700 border border-indigo-200 font-bold text-sm hover:bg-indigo-100"
                                    >
                                        🔍 全螢幕顯示
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Zoomed Timer Fullscreen Modal */}
                    {timerZoomed && (
                        <div class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-8 text-white space-y-8">
                            <div class="text-2xl font-bold uppercase tracking-widest text-slate-400">課堂倒數計時</div>
                            <div class="font-mono font-black text-9xl tracking-widest text-amber-400">
                                {Math.floor(timerSeconds / 60).toString().padStart(2, '0')}:{(timerSeconds % 60).toString().padStart(2, '0')}
                            </div>
                            <button 
                                onClick={() => setTimerZoomed(false)}
                                class="px-8 py-3 bg-white text-slate-900 font-black rounded-2xl text-lg shadow-xl"
                            >
                                關閉放大顯示
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
            const [selectedAnswer, setSelectedAnswer] = useState('');
            const [shortAnswerInput, setShortAnswerInput] = useState('');
            const [submitted, setSubmitted] = useState(false);

            // Audio Question Recording States (Requirement 2)
            const [isRecording, setIsRecording] = useState(false);
            const [recordingTime, setRecordingTime] = useState(0);
            const [audioBlobUrl, setAudioBlobUrl] = useState(null);
            const [audioBase64, setAudioBase64] = useState(null);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);
            const recordingTimerRef = useRef(null);

            // Challenge Question Student Answers State (Requirement 3.2)
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [challengeRemainingTime, setChallengeRemainingTime] = useState(null);

            // Whiteboard States
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [penColor, setPenColor] = useState('#000000');
            const [penWidth, setPenWidth] = useState(3);
            const [isEraser, setIsEraser] = useState(false);

            const mySubmission = activeQuestion ? responses[`${activeQuestion.id}_${studentId}`] : null;

            // Challenge Question Timer Countdown (Requirement 3.1.2 / 3.2)
            useEffect(() => {
                if (activeQuestion && activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer && !mySubmission) {
                    const limitSec = activeQuestion.challenge.timeLimit || 120;
                    const elapsedSec = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                    const remaining = Math.max(0, limitSec - elapsedSec);

                    setChallengeRemainingTime(remaining);

                    const timer = setInterval(() => {
                        setChallengeRemainingTime(r => {
                            if (r <= 1) {
                                clearInterval(timer);
                                // Auto Submit when challenge timer runs out
                                handleAutoSubmitChallenge();
                                return 0;
                            }
                            return r - 1;
                        });
                    }, 1000);

                    return () => clearInterval(timer);
                }
            }, [activeQuestion, mySubmission]);

            // Canvas initialization
            useEffect(() => {
                if (activeQuestion && activeQuestion.mode === 'DRAW' && canvasRef.current) {
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');
                    
                    if (activeQuestion.whiteboardBg) {
                        const img = new Image();
                        img.src = activeQuestion.whiteboardBg;
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        };
                    } else {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                }
            }, [activeQuestion]);

            // Audio recording handler (10s limit requirement)
            const startAudioRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) {
                            audioChunksRef.current.push(e.data);
                        }
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const url = URL.createObjectURL(audioBlob);
                        setAudioBlobUrl(url);

                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            setAudioBase64(reader.result);
                        };

                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                    setRecordingTime(0);

                    recordingTimerRef.current = setInterval(() => {
                        setRecordingTime(t => {
                            if (t >= 9) {
                                stopAudioRecording();
                                return 10;
                            }
                            return t + 1;
                        });
                    }, 1000);

                } catch (err) {
                    console.error("Audio recording permission error:", err);
                    showToast("無法存取麥克風權限！", "error");
                }
            };

            const stopAudioRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                    clearInterval(recordingTimerRef.current);
                }
            };

            // Submit Answer to Firestore
            const submitStudentResponse = async (answerVal, extraData = {}) => {
                if (!activeQuestion) return;

                const appId = "omit-8c173";
                const db = window.fbDb;
                const responseDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', `${activeQuestion.id}_${studentId}`);

                const duration = ((Date.now() - activeQuestion.startTime) / 1000).toFixed(1);

                const resObj = {
                    studentId: studentId,
                    questionId: activeQuestion.id,
                    name: studentName || `學號 ${seatNumber}`,
                    seatNumber: seatNumber,
                    answer: answerVal,
                    duration: duration,
                    timestamp: Date.now(),
                    ...extraData
                };

                await window.fbUtils.setDoc(responseDocRef, resObj);
                setSubmitted(true);
                showToast("已成功提交答案！", "success");
            };

            // Auto submit challenge questions when time is up
            const handleAutoSubmitChallenge = () => {
                if (mySubmission) return;
                showToast("限時時間已結束，系統自動提交作答紀錄！", "info");
                handleSubmitChallenge();
            };

            // Submit Challenge Questions & Auto Grade (Requirement 3.2)
            const handleSubmitChallenge = () => {
                if (!activeQuestion || !activeQuestion.challenge) return;

                const questions = activeQuestion.challenge.questions;
                let correctCount = 0;
                const userChoices = {};

                questions.forEach(q => {
                    const ans = challengeAnswers[q.num];
                    userChoices[q.num] = ans || '未填';
                    if (ans === q.answer) {
                        correctCount++;
                    }
                });

                const scorePerQ = activeQuestion.challenge.totalScore / questions.length;
                const totalScoreEarned = Math.round(correctCount * scorePerQ);
                const percentage = Math.round((correctCount / questions.length) * 100);

                submitStudentResponse("CHALLENGE_SUBMITTED", {
                    scoreDetails: {
                        correctCount,
                        totalQuestions: questions.length,
                        totalScore: totalScoreEarned,
                        percentage,
                        userChoices
                    }
                });
            };

            const handleBuzzerClick = () => {
                playSound('buzzer');
                submitStudentResponse("搶答成功！");
            };

            // Whiteboard Drawing Handlers
            const startDrawing = (e) => {
                setIsDrawing(true);
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                ctx.beginPath();
                ctx.moveTo((clientX - rect.left) * (canvas.width / rect.width), (clientY - rect.top) * (canvas.height / rect.height));
            };

            const draw = (e) => {
                if (!isDrawing) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                ctx.strokeStyle = isEraser ? '#ffffff' : penColor;
                ctx.lineWidth = penWidth;
                ctx.lineCap = 'round';
                ctx.lineTo((clientX - rect.left) * (canvas.width / rect.width), (clientY - rect.top) * (canvas.height / rect.height));
                ctx.stroke();
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const handleClearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                if (activeQuestion.whiteboardBg) {
                    const img = new Image();
                    img.src = activeQuestion.whiteboardBg;
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    };
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            };

            const handleStudentPhotoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const img = new Image();
                        img.src = evt.target.result;
                        img.onload = () => {
                            const canvas = canvasRef.current;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        };
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleSubmitCanvas = () => {
                const canvas = canvasRef.current;
                const dataUrl = canvas.toDataURL();
                submitStudentResponse(dataUrl);
            };

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col">
                    <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <span class="font-black text-lg">OMIT 學生端</span>
                            <span class="bg-indigo-700 text-xs px-2 py-1 rounded-lg font-mono">
                                {seatNumber}號 {studentName}
                            </span>
                        </div>
                        <button onClick={onExit} class="text-xs bg-indigo-700 px-3 py-1.5 rounded-lg">離開課室</button>
                    </header>

                    <main class="flex-1 max-w-lg w-full mx-auto p-4 space-y-4 flex flex-col justify-center">
                        
                        {activeQuestion?.broadcastedSubmission && (
                            <div class="bg-purple-900 text-white rounded-3xl p-5 shadow-2xl space-y-3 animate-fade-in border-4 border-purple-400">
                                <div class="text-xs font-bold uppercase tracking-widest text-purple-300">📢 老師廣播作品 (學生互評)</div>
                                <h3 class="font-extrabold text-base">{activeQuestion.broadcastedSubmission.name} ({activeQuestion.broadcastedSubmission.seatNumber}號) 的白板答案：</h3>
                                <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden">
                                    <img src={activeQuestion.broadcastedSubmission.answer} class="w-full h-full object-contain" alt="廣播作品" />
                                </div>
                            </div>
                        )}

                        {activeQuestion ? (
                            <div class="bg-white rounded-3xl p-6 shadow-lg border border-slate-200 space-y-6 text-center">
                                <div class="space-y-1">
                                    <span class="text-xs font-extrabold text-indigo-600 uppercase tracking-widest">當前問題 [{getModeLabel(activeQuestion.mode)}]</span>
                                    <h2 class="text-xl font-extrabold text-slate-800">{activeQuestion.text}</h2>
                                </div>

                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div class="grid grid-cols-1 gap-3">
                                        {activeQuestion.choiceOptions.map((opt) => (
                                            <button 
                                                key={opt}
                                                disabled={mySubmission && activeQuestion.lockAfterSubmit}
                                                onClick={() => {
                                                    setSelectedAnswer(opt);
                                                    submitStudentResponse(opt);
                                                }}
                                                class={`py-4 px-6 rounded-2xl font-black text-lg transition border-2 ${
                                                    mySubmission?.answer === opt 
                                                    ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' 
                                                    : 'bg-slate-50 text-slate-800 border-slate-200 hover:border-indigo-300'
                                                }`}
                                            >
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {/* Requirement 2: Student Audio Recording UI */}
                                {activeQuestion.mode === 'AUDIO' && (
                                    <div class="space-y-4 py-2">
                                        <div class="bg-cyan-50 p-4 rounded-2xl border border-cyan-200 space-y-3">
                                            <div class="font-bold text-cyan-900 text-sm">
                                                錄音限時：10 秒
                                            </div>

                                            <div class="relative w-24 h-24 mx-auto flex items-center justify-center">
                                                <div className={`w-20 h-20 rounded-full border-4 flex items-center justify-center font-mono font-black text-2xl ${isRecording ? 'border-red-500 bg-red-50 text-red-600 animate-ping' : 'border-cyan-500 text-cyan-700 bg-white'}`}>
                                                    {isRecording ? `${10 - recordingTime}s` : '10s'}
                                                </div>
                                            </div>

                                            <div class="flex justify-center space-x-3">
                                                {!isRecording ? (
                                                    <button 
                                                        onClick={startAudioRecording}
                                                        disabled={mySubmission && activeQuestion.lockAfterSubmit}
                                                        class="px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow-md text-sm flex items-center space-x-2"
                                                    >
                                                        <span>🎙️ 開始錄音</span>
                                                    </button>
                                                ) : (
                                                    <button 
                                                        onClick={stopAudioRecording}
                                                        class="px-6 py-3 bg-slate-800 text-white font-bold rounded-xl shadow-md text-sm"
                                                    >
                                                        ⏹️ 停止錄音
                                                    </button>
                                                )}
                                            </div>

                                            {audioBlobUrl && (
                                                <div class="pt-2 space-y-3">
                                                    <div class="text-xs font-bold text-slate-500">錄音試聽預覽：</div>
                                                    <audio src={audioBlobUrl} controls class="w-full h-8 rounded-lg mx-auto" />
                                                    <button 
                                                        onClick={() => submitStudentResponse(audioBase64)}
                                                        disabled={mySubmission && activeQuestion.lockAfterSubmit}
                                                        class="w-full py-3 bg-cyan-600 text-white font-black rounded-xl shadow-md"
                                                    >
                                                        提交語音錄音 🚀
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {/* Requirement 3.2: Student Challenge Assessment Interface */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                    <div class="text-left space-y-6">
                                        {/* Countdown Timer Header */}
                                        {activeQuestion.challenge.enableTimer && challengeRemainingTime !== null && (
                                            <div class="bg-amber-500 text-white p-3 rounded-2xl flex justify-between items-center font-bold text-sm shadow">
                                                <span>⏱️ 答題剩餘時間：</span>
                                                <span class="font-mono text-xl font-black bg-amber-700 px-3 py-1 rounded-xl">
                                                    {Math.floor(challengeRemainingTime / 60)}:{(challengeRemainingTime % 60).toString().padStart(2, '0')}
                                                </span>
                                            </div>
                                        )}

                                        {!mySubmission ? (
                                            <div class="space-y-6">
                                                {activeQuestion.challenge.questions.map((q) => (
                                                    <div key={q.num} class="bg-slate-50 border border-slate-200 p-4 rounded-2xl space-y-3">
                                                        <div class="font-black text-slate-800 text-base">
                                                            {q.num}. {q.text}
                                                        </div>
                                                        <div class="grid grid-cols-1 gap-2">
                                                            {q.options.map((opt) => (
                                                                <button 
                                                                    key={opt.letter}
                                                                    onClick={() => setChallengeAnswers(prev => ({ ...prev, [q.num]: opt.letter }))}
                                                                    class={`p-3 rounded-xl border text-left font-bold text-sm flex items-center space-x-2 transition ${
                                                                        challengeAnswers[q.num] === opt.letter
                                                                        ? 'bg-amber-600 text-white border-amber-600 shadow'
                                                                        : 'bg-white text-slate-700 border-slate-200 hover:bg-amber-50'
                                                                    }`}
                                                                >
                                                                    <span class="w-6 h-6 rounded-full border border-current flex items-center justify-center text-xs shrink-0">
                                                                        {opt.letter}
                                                                    </span>
                                                                    <span>{opt.text}</span>
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}

                                                <button 
                                                    onClick={handleSubmitChallenge}
                                                    class="w-full py-4 bg-amber-600 hover:bg-amber-700 text-white font-black rounded-2xl text-lg shadow-lg shadow-amber-200"
                                                >
                                                    提交挑戰題評估 🚀
                                                </button>
                                            </div>
                                        ) : (
                                            <div class="bg-amber-50 border-2 border-amber-300 p-6 rounded-3xl text-center space-y-4">
                                                <div class="text-4xl">🎉</div>
                                                <h3 class="font-black text-amber-900 text-lg">挑戰題評估已順利完成！</h3>
                                                <p class="text-xs text-slate-500">（完成提交後不可再次修改）</p>

                                                {/* Score Release logic: Instant vs Hold until teacher releases */}
                                                {(activeQuestion.challenge.scoresReleased || activeQuestion.challenge.releaseInstant) && mySubmission.scoreDetails ? (
                                                    <div class="bg-white p-4 rounded-2xl border border-amber-200 space-y-2">
                                                        <div class="text-xs text-slate-500 font-bold uppercase">獲得成績與正確率</div>
                                                        <div class="text-4xl font-black text-amber-600 font-mono">
                                                            {mySubmission.scoreDetails.totalScore} / {activeQuestion.challenge.totalScore} 分
                                                        </div>
                                                        <div class="text-sm font-bold text-emerald-600">
                                                            正確率：{mySubmission.scoreDetails.percentage}% (答對 {mySubmission.scoreDetails.correctCount} / {mySubmission.scoreDetails.totalQuestions} 題)
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div class="bg-amber-100/80 p-4 rounded-2xl text-amber-900 text-xs font-bold">
                                                        ⏳ 答案已順利上傳！等待教師統一發放成績...
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-3">
                                        <textarea 
                                            placeholder="請在此輸入您的回答..." 
                                            value={shortAnswerInput}
                                            onChange={(e) => setShortAnswerInput(e.target.value)}
                                            class="w-full p-4 border-2 rounded-2xl focus:ring-2 focus:ring-indigo-500 font-medium"
                                            rows={4}
                                        />
                                        <button 
                                            onClick={() => submitStudentResponse(shortAnswerInput)}
                                            class="w-full py-3.5 bg-indigo-600 text-white font-bold rounded-xl shadow-md"
                                        >
                                            提交答案 🚀
                                        </button>
                                    </div>
                                )}

                                {activeQuestion.mode === 'DRAW' && (
                                    <div class="space-y-3">
                                        <div class="relative border-2 border-slate-300 rounded-2xl overflow-hidden aspect-16-9 bg-white shadow-inner canvas-container">
                                            <canvas 
                                                ref={canvasRef}
                                                width={640}
                                                height={360}
                                                onMouseDown={startDrawing}
                                                onMouseMove={draw}
                                                onMouseUp={stopDrawing}
                                                onTouchStart={startDrawing}
                                                onTouchMove={draw}
                                                onTouchEnd={stopDrawing}
                                                class="w-full h-full touch-none cursor-crosshair"
                                            />
                                        </div>

                                        <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-50 p-2 rounded-xl border text-xs">
                                            <div class="flex items-center space-x-1">
                                                {['#000000', '#ef4444', '#3b82f6', '#10b981', '#f59e0b'].map((c) => (
                                                    <button 
                                                        key={c}
                                                        onClick={() => { setPenColor(c); setIsEraser(false); }}
                                                        class={`w-6 h-6 rounded-full border ${penColor === c && !isEraser ? 'ring-2 ring-indigo-500 scale-110' : ''}`}
                                                        style={{ backgroundColor: c }}
                                                    />
                                                ))}
                                            </div>

                                            <div class="flex items-center space-x-2">
                                                <input 
                                                    type="range" min="1" max="15" 
                                                    value={penWidth} 
                                                    onChange={(e) => setPenWidth(e.target.value)}
                                                    class="w-16"
                                                />
                                                <button 
                                                    onClick={() => setIsEraser(!isEraser)}
                                                    class={`px-2 py-1 rounded font-bold ${isEraser ? 'bg-amber-500 text-white' : 'bg-slate-200 text-slate-700'}`}
                                                >
                                                    擦膠
                                                </button>
                                                <button 
                                                    onClick={handleClearCanvas}
                                                    class="px-2 py-1 bg-red-100 text-red-600 rounded font-bold"
                                                >
                                                    清空
                                                </button>
                                            </div>
                                        </div>

                                        <div class="text-left">
                                            <label class="text-xs font-bold text-slate-500 block mb-1">上載相簿相片提交：</label>
                                            <input 
                                                type="file" 
                                                accept="image/*"
                                                onChange={handleStudentPhotoUpload}
                                                class="block w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-slate-200 file:font-bold"
                                            />
                                        </div>

                                        <button 
                                            onClick={handleSubmitCanvas}
                                            class="w-full py-3.5 bg-purple-600 text-white font-bold rounded-xl shadow-md"
                                        >
                                            提交白板作品 🎨
                                        </button>
                                    </div>
                                )}

                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="py-6 space-y-4">
                                        <button 
                                            onClick={handleBuzzerClick}
                                            class="w-48 h-48 rounded-full bg-red-600 hover:bg-red-700 active:scale-90 text-white font-black text-3xl shadow-2xl border-8 border-red-300 transition mx-auto flex items-center justify-center animate-pulse"
                                        >
                                            搶答！🚨
                                        </button>
                                    </div>
                                )}

                                {activeQuestion.mode === 'LINK' && (
                                    <div class="space-y-4">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div class="aspect-16-9 w-full rounded-2xl overflow-hidden border-2 shadow-lg">
                                                <iframe 
                                                    src={activeQuestion.youtubeEmbed} 
                                                    class="w-full h-full"
                                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                                    allowFullScreen
                                                ></iframe>
                                            </div>
                                        ) : (
                                            <a 
                                                href={activeQuestion.pushedUrl} 
                                                target="_blank" 
                                                rel="noreferrer"
                                                class="block py-4 px-6 bg-amber-500 text-white font-bold rounded-2xl text-lg shadow-md"
                                            >
                                                🔗 點擊開啟派送連結
                                            </a>
                                        )}
                                    </div>
                                )}

                                {mySubmission && activeQuestion.mode !== 'CHALLENGE' && (
                                    <div class="p-3 bg-emerald-50 text-emerald-800 rounded-2xl border border-emerald-200 text-xs font-bold">
                                        ✓ 您已於 {mySubmission.duration} 秒內成功提交答案！{!activeQuestion.lockAfterSubmit && ' (老師已開放可重新修改)'}
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div class="bg-white rounded-3xl p-12 text-center space-y-3 shadow-sm border border-slate-200">
                                <div class="text-5xl animate-bounce">⏳</div>
                                <h3 class="text-lg font-bold text-slate-700">課堂準備中...</h3>
                                <p class="text-xs text-slate-400">請等待老師發佈新題目或互動指令</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        // Render application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
