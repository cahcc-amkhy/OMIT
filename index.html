                                                                    })}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    /* Interactive Question Forms */
                                    <div class="space-y-6">
                                        {/* CHOICE & TF Mode */}
                                        {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                            <div class="space-y-4">
                                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                    {activeQuestion.choiceOptions.map(opt => (
                                                        <button
                                                            key={opt}
                                                            onClick={() => setMyAnswer(opt)}
                                                            class={`p-4 rounded-2xl font-bold text-base transition border flex items-center justify-between ${
                                                                myAnswer === opt 
                                                                    ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg scale-102' 
                                                                    : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-indigo-50'
                                                            }`}
                                                        >
                                                            <span>{opt}</span>
                                                            {myAnswer === opt && <span>✓</span>}
                                                        </button>
                                                    ))}
                                                </div>

                                                <button 
                                                    onClick={() => {
                                                        if (!myAnswer) return showToast("請先選擇一個答案！", "error");
                                                        handleSubmitAnswer(myAnswer);
                                                    }}
                                                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl shadow-lg text-base transition"
                                                >
                                                    確認提交答案 🚀
                                                </button>
                                            </div>
                                        )}

                                        {/* SHORT Answer Mode */}
                                        {activeQuestion.mode === 'SHORT' && (
                                            <div class="space-y-4">
                                                <textarea 
                                                    rows={4}
                                                    placeholder="請在此輸入您的回答..."
                                                    value={myAnswer}
                                                    onChange={(e) => setMyAnswer(e.target.value)}
                                                    class="w-full p-4 rounded-2xl border border-slate-200 text-base focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                                />
                                                <button 
                                                    onClick={() => {
                                                        if (!myAnswer.trim()) return showToast("請輸入回答內容！", "error");
                                                        handleSubmitAnswer(myAnswer.trim());
                                                    }}
                                                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl shadow-lg text-base transition"
                                                >
                                                    確認提交短答 🚀
                                                </button>
                                            </div>
                                        )}

                                        {/* DRAW Whiteboard Canvas Mode */}
                                        {activeQuestion.mode === 'DRAW' && (
                                            <div class="space-y-4">
                                                {/* Canvas Palette Toolbar */}
                                                <div class="flex items-center justify-between bg-slate-900 text-white p-3 rounded-2xl">
                                                    <div class="flex items-center space-x-2">
                                                        {['#2563eb', '#dc2626', '#16a34a', '#d97706', '#000000'].map(c => (
                                                            <button 
                                                                key={c}
                                                                onClick={() => { setWbColor(c); setWbIsEraser(false); }}
                                                                class={`w-6 h-6 rounded-full border-2 ${wbColor === c && !wbIsEraser ? 'border-white scale-110' : 'border-transparent'}`}
                                                                style={{ backgroundColor: c }}
                                                            />
                                                        ))}
                                                    </div>

                                                    <div class="flex items-center space-x-2">
                                                        <input 
                                                            type="range" min="2" max="18" value={wbStrokeWidth} 
                                                            onChange={(e) => setWbStrokeWidth(parseInt(e.target.value))}
                                                            class="w-16 accent-indigo-500"
                                                        />
                                                        <button 
                                                            onClick={() => setWbIsEraser(!wbIsEraser)}
                                                            class={`px-2.5 py-1 rounded-xl font-bold text-xs ${wbIsEraser ? 'bg-amber-500 text-white' : 'bg-slate-800 text-slate-300'}`}
                                                        >
                                                            🧽 擦膠
                                                        </button>
                                                    </div>
                                                </div>

                                                <WhiteboardCanvas 
                                                    bgImage={activeQuestion.whiteboardBg}
                                                    strokeColor={wbColor}
                                                    strokeWidth={wbStrokeWidth}
                                                    isEraser={wbIsEraser}
                                                    onSave={(data) => setMyWhiteboardData(data)}
                                                />

                                                <button 
                                                    onClick={() => {
                                                        if (!myWhiteboardData) return showToast("請在白板上繪圖或書寫！", "error");
                                                        handleSubmitAnswer(myWhiteboardData);
                                                    }}
                                                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl shadow-lg text-base transition"
                                                >
                                                    確認提交白板作品 🚀
                                                </button>
                                            </div>
                                        )}

                                        {/* BUZZER Mode */}
                                        {activeQuestion.mode === 'BUZZER' && (
                                            <div class="text-center py-8">
                                                <button 
                                                    onClick={() => handleSubmitAnswer("已搶答！")}
                                                    class="w-48 h-48 rounded-full bg-gradient-to-tr from-rose-600 to-red-500 text-white font-black text-3xl shadow-2xl border-4 border-white active:scale-90 transition transform hover:rotate-2 flex items-center justify-center mx-auto animate-pulse"
                                                >
                                                    🔔 搶答！
                                                </button>
                                            </div>
                                        )}

                                        {/* AUDIO Recording Mode */}
                                        {activeQuestion.mode === 'AUDIO' && (
                                            <div class="space-y-4 text-center">
                                                {recordedAudioUrl ? (
                                                    <div class="p-6 bg-slate-50 rounded-2xl border space-y-4">
                                                        <audio controls src={recordedAudioUrl} class="w-full" />
                                                        <div class="flex space-x-2">
                                                            <button 
                                                                onClick={() => setRecordedAudioUrl(null)}
                                                                class="w-1/2 py-3 rounded-xl bg-red-100 hover:bg-red-200 text-red-700 font-bold text-xs"
                                                            >
                                                                🗑️ 刪除重錄
                                                            </button>
                                                            <button 
                                                                onClick={() => handleSubmitAnswer(recordedAudioUrl)}
                                                                class="w-1/2 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs shadow"
                                                            >
                                                                ✅ 確認提交錄音
                                                            </button>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <button 
                                                        onClick={isRecording ? stopRecording : startRecording}
                                                        class={`px-8 py-5 rounded-full font-black text-lg shadow-xl transition flex items-center justify-center space-x-2 mx-auto ${
                                                            isRecording ? 'bg-rose-600 text-white animate-pulse' : 'bg-indigo-600 hover:bg-indigo-700 text-white'
                                                        }`}
                                                    >
                                                        <span>{isRecording ? '⏹️ 停止錄音' : '🎙️ 開始錄音'}</span>
                                                    </button>
                                                )}
                                            </div>
                                        )}

                                        {/* CHALLENGE Assessment Mode */}
                                        {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                            <div class="space-y-6">
                                                {activeQuestion.challenge.questions.map(q => (
                                                    <div key={q.num} class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-3">
                                                        <p class="font-bold text-slate-800 text-sm">{q.num}. {q.text}</p>
                                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                            {q.options.map(opt => (
                                                                <button
                                                                    key={opt.letter}
                                                                    onClick={() => setChallengeStudentAnswers({ ...challengeStudentAnswers, [q.num]: opt.letter })}
                                                                    class={`p-3 rounded-xl font-bold text-xs transition border flex items-center justify-between ${
                                                                        challengeStudentAnswers[q.num] === opt.letter 
                                                                            ? 'bg-amber-500 text-white border-amber-600 shadow' 
                                                                            : 'bg-white text-slate-700 border-slate-200 hover:bg-amber-50'
                                                                    }`}
                                                                >
                                                                    <span>{opt.letter}. {opt.text}</span>
                                                                    {challengeStudentAnswers[q.num] === opt.letter && <span>✓</span>}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}

                                                <button 
                                                    onClick={handleConfirmSubmitChallenge}
                                                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl shadow-lg text-base transition"

                                                </button>

                                        {activeQuestion.mode === 'COOP' && activeQuestion.coop && (
                                            <div class="space-y-6">

                                                        {(() => {
                                                            const myGroup = activeQuestion.coop.groups.find(g => g.members.some(m => m.id === studentId));

                                                        {(() => {

                                                                return (
                                                                    <div class="p-8 bg-amber-400 text-slate-900 rounded-3xl text-center space-y-4 shadow-2xl animate-bounce">

                                                                    {isQuestionHolder || memberCount === 1 ? (
                                                                        <div class="p-6 bg-slate-900 text-white rounded-3xl space-y-2 text-center shadow-lg">
                                                                            <span class="text-xs text-indigo-400 font-bold uppercase block">你負責為組員大聲朗讀題目！</span>
                                                                            <h3 class="text-xl font-black">{currentQ.num}. {currentQ.text}</h3>
                                                                        </div>
                                                                    ) : (
                                                                        <div class="p-4 bg-amber-50 rounded-2xl text-amber-900 text-xs font-bold text-center">
                                                                            🗣️ 請聆聽組員朗讀題目，並在下方點擊你螢幕上的答案！
                                                                        </div>
                                                                    )}

                                                                    {/* Render member's subset of options */}
                                                                    <div class="grid grid-cols-1 gap-3 pt-2">
                                                                        {(memberCount === 1 ? currentQ.options : myOptions).map(opt => (
                                                                            <button 
                                                                                key={opt.letter}
                                                                                onClick={() => handleCoopOptionTap(opt.letter)}
                                                                                class="p-5 bg-white hover:bg-indigo-50 border-2 border-indigo-200 rounded-2xl font-black text-lg text-slate-800 shadow-md active:scale-95 transition"
                                                                            >
                                                                                {opt.letter}. {opt.text}
                                                                            </button>
                                                                        ))}
                                                                    </div>
                                                                </div>
                                                            );
                                                        })()}
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {/* LINK Dispatch View */}
                                        {activeQuestion.mode === 'LINK' && (
                                            <div class="space-y-4">
                                                {activeQuestion.youtubeEmbed ? (
                                                    <div class="aspect-16-9 w-full rounded-2xl overflow-hidden shadow-lg border border-slate-200">
                                                        <iframe 
                                                            src={activeQuestion.youtubeEmbed} 
                                                            class="w-full h-full"
                                                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                                            allowFullScreen
                                                        ></iframe>
                                                    </div>
                                                ) : null}

                                                {activeQuestion.pushedUrl && (
                                                    <a 
                                                        href={activeQuestion.pushedUrl} 
                                                        target="_blank" 
                                                        rel="noopener noreferrer"
                                                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-lg flex items-center justify-center space-x-2 text-base transition block text-center"
                                                    >
                                                        <span>開啟連結網站 ↗</span>
                                                    </a>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
