<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Group Race Animals & Colors Mapping
        const TEAM_PRESETS = [
            { id: 'team_lion', name: '獅子隊', emoji: '🦁', color: 'bg-amber-500', textClr: 'text-amber-700', borderClr: 'border-amber-400', hex: '#f59e0b' },
            { id: 'team_dolphin', name: '海豚隊', emoji: '🐬', color: 'bg-sky-500', textClr: 'text-sky-700', borderClr: 'border-sky-400', hex: '#0284c7' },
            { id: 'team_eagle', name: '飛鷹隊', emoji: '🦅', color: 'bg-indigo-500', textClr: 'text-indigo-700', borderClr: 'border-indigo-400', hex: '#6366f1' },
            { id: 'team_tiger', name: '猛虎隊', emoji: '🐯', color: 'bg-orange-500', textClr: 'text-orange-700', borderClr: 'border-orange-400', hex: '#ea580c' },
            { id: 'team_elephant', name: '大象隊', emoji: '🐘', color: 'bg-slate-500', textClr: 'text-slate-700', borderClr: 'border-slate-400', hex: '#64748b' },
            { id: 'team_panda', name: '貓熊隊', emoji: '🐼', color: 'bg-emerald-500', textClr: 'text-emerald-700', borderClr: 'border-emerald-400', hex: '#10b981' }
        ];

        // Helper label switcher
        function getModeLabel(mode) {
            switch(mode) {
                case 'CHOICE': return '選擇題';
                case 'TF': return '是非題';
                case 'SHORT': return '短答題';
                case 'DRAW': return '白板題';
                case 'BUZZER': return '搶答題';
                case 'AUDIO': return '錄音題';
                case 'CHALLENGE': return '挑戰題';
                case 'GROUPRACE': return '合作題 (Group Race)';
                case 'LINK': return '派送連結';
                default: return '題目';
            }
        }

        // Helper default prompts for empty question text
        function getDefaultQuestionPrompt(mode) {
            switch(mode) {
                case 'CHOICE': return '請選擇正確答案：';
                case 'TF': return '請判斷下列描述是否正確：';
                case 'SHORT': return '請輸入您的回答：';
                case 'DRAW': return '請在白板上作答或繪圖：';
                case 'BUZZER': return '請準備點擊搶答按鈕！';
                case 'AUDIO': return '請錄製不多於10秒的語音回答：';
                case 'CHALLENGE': return '請在限時內完成以下挑戰題評估：';
                case 'GROUPRACE': return '小組合作競賽：請全組成員互相配合選擇答案！';
                case 'LINK': return '請點擊或觀看下方派送內容：';
                default: return '請回答問題：';
            }
        }

        // Web Audio API Sound Generator & Synthesized BGM
        let activeBgmOscillators = [];
        const stopBGM = () => {
            activeBgmOscillators.forEach(o => {
                try { o.stop(); o.disconnect(); } catch(e){}
            });
            activeBgmOscillators = [];
        };

        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                    });
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'bgm_relax') {
                    stopBGM();
                    const notes = [261.63, 329.63, 392.00, 523.25];
                    notes.forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, ctx.currentTime);
                        gain.gain.setValueAtTime(0.05, ctx.currentTime);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start();
                        activeBgmOscillators.push(osc);
                    });
                } else if (type === 'bgm_intense') {
                    stopBGM();
                    const notes = [130.81, 155.56, 174.61];
                    notes.forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, ctx.currentTime);
                        gain.gain.setValueAtTime(0.04, ctx.currentTime);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start();
                        activeBgmOscillators.push(osc);
                    });
                } else if (type === 'bgm_stop') {
                    stopBGM();
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3500);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (
                <div class={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-2 text-sm font-bold animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        // Helper to generate a valid Word (.docx) binary Blob using JSZip
        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) throw new Error("JSZip library is not loaded.");
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>
    ${paragraphsXml}
  </w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        // Parse Word doc or text file
        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '常識科互動小測驗';
            let totalScore = 100;
            const questions = [];
            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) {
                        questions.push(currentQ);
                    }
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }
                    currentQ.options.push({ letter: letter, text: optText });
                    if (isCorrect) currentQ.answer = letter;
                }
            });

            if (currentQ && currentQ.options.length > 0) {
                questions.push(currentQ);
            }

            if (questions.length === 0) {
                return {
                    title: title || "地球天然資源",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1,
                            text: "以下哪一項不是地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "機械資源" }
                            ],
                            answer: "D"
                        },
                        {
                            num: 2,
                            text: "芝士的原料主要來自哪一種天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "礦產資源" }
                            ],
                            answer: "C"
                        }
                    ]
                };
            }

            return { title, totalScore, questions };
        };

        // Reusable Whiteboard Component with 1280x720 Canvas and exact scale touch mapping
        const WhiteboardCanvas = ({ backgroundUrl, initialData, onSave, isTeacherDemo = false, onBroadcast = null }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [color, setColor] = useState('#000000');
            const [lineWidth, setLineWidth] = useState(4);
            const [isEraser, setIsEraser] = useState(false);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (backgroundUrl) {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    };
                    img.src = backgroundUrl;
                }

                if (initialData) {
                    const img = new Image();
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    };
                    img.src = initialData;
                }
            }, [backgroundUrl]);

            const getCanvasCoordinates = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                setIsDrawing(true);
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const { x, y } = getCanvasCoordinates(e);

                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const { x, y } = getCanvasCoordinates(e);

                ctx.lineWidth = lineWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (isEraser) {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.arc(x, y, lineWidth * 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = color;
                    ctx.lineTo(x, y);
                    ctx.stroke();
                }
            };

            const stopDrawing = (e) => {
                if (isDrawing) {
                    setIsDrawing(false);
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');
                    ctx.closePath();
                    ctx.globalCompositeOperation = 'source-over';
                }
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                if (backgroundUrl) {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    img.src = backgroundUrl;
                }
            };

            const handleCustomBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = canvasRef.current;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        };
                        img.src = evt.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleConfirmSubmit = () => {
                const canvas = canvasRef.current;
                const dataUrl = canvas.toDataURL('image/png');
                onSave(dataUrl);
            };

            return (
                <div class="space-y-3 bg-white p-4 rounded-3xl border border-slate-200 shadow-inner">
                    {/* Toolbar */}
                    <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-50 p-2.5 rounded-2xl border">
                        <div class="flex flex-wrap items-center gap-2">
                            {/* Color Palette */}
                            {!isEraser && (
                                <div class="flex items-center space-x-1.5">
                                    {['#000000', '#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'].map(c => (
                                        <button 
                                            key={c}
                                            type="button"
                                            onClick={() => { setColor(c); setIsEraser(false); }}
                                            class={`w-7 h-7 rounded-full border-2 transition ${color === c && !isEraser ? 'scale-110 border-slate-800 ring-2 ring-indigo-400' : 'border-white'}`}
                                            style={{ backgroundColor: c }}
                                        />
                                    ))}
                                </div>
                            )}

                            {/* Pen Width Slider 2px-18px */}
                            <div class="flex items-center space-x-2 pl-2 border-l border-slate-300">
                                <span class="text-xs font-bold text-slate-600">筆觸: {lineWidth}px</span>
                                <input 
                                    type="range" 
                                    min="2" 
                                    max="18" 
                                    value={lineWidth} 
                                    onChange={(e) => setLineWidth(parseInt(e.target.value))}
                                    class="w-24 accent-indigo-600"
                                />
                            </div>

                            {/* Eraser */}
                            <button 
                                type="button"
                                onClick={() => setIsEraser(!isEraser)}
                                class={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 ${isEraser ? 'bg-amber-500 text-white shadow' : 'bg-white text-slate-700 border hover:bg-slate-100'}`}
                            >
                                <span>🧹 擦膠</span>
                            </button>

                            {/* Clear All */}
                            <button 
                                type="button"
                                onClick={clearCanvas}
                                class="px-3 py-1.5 rounded-xl text-xs font-bold bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 transition"
                            >
                                🗑️ 一鍵清空
                            </button>
                        </div>

                        {/* Tablet BG Upload & Confirm Buttons */}
                        <div class="flex items-center space-x-2">
                            <label class="px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 cursor-pointer transition">
                                🖼️ 上載背景
                                <input type="file" accept="image/*" onChange={handleCustomBgUpload} class="hidden" />
                            </label>

                            {isTeacherDemo && onBroadcast && (
                                <button 
                                    type="button"
                                    onClick={() => {
                                        const canvas = canvasRef.current;
                                        onBroadcast(canvas.toDataURL('image/png'));
                                    }}
                                    class="px-4 py-1.5 rounded-xl text-xs font-black bg-purple-600 hover:bg-purple-700 text-white shadow transition flex items-center gap-1"
                                >
                                    <span>📢 廣播分享至全班</span>
                                </button>
                            )}

                            {!isTeacherDemo && (
                                <button 
                                    type="button"
                                    onClick={handleConfirmSubmit}
                                    class="px-5 py-1.5 rounded-xl text-xs font-black bg-emerald-600 hover:bg-emerald-700 text-white shadow transition active:scale-95"
                                >
                                    ✅ 確認提交
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Canvas Container with 1280x720 internal resolution */}

        function TeacherDashboard({ roomCode, activeQuestion, setActiveQuestion, responses, setResponses, studentsList, historyQuestions, setHistoryQuestions, showToast, onExit }) {

            const [timerActive, setTimerActive] = useState(false);
            const [timerZoomed, setTimerZoomed] = useState(false);
            const [timerMinutesInput, setTimerMinutesInput] = useState('01');
            const [timerSecondsInput, setTimerSecondsInput] = useState('00');

            // Challenge Question Setup States

            const [challengeEnableTimer, setChallengeEnableTimer] = useState(true);
            const [challengeTimeLimit, setChallengeTimeLimit] = useState(120);
            const [challengeReleaseInstant, setChallengeReleaseInstant] = useState(true);

            const [groupRaceStage, setGroupRaceStage] = useState('PREPARE'); // 'PREPARE', 'GROUPING', 'RACE'
            const [groupRaceQuestions, setGroupRaceQuestions] = useState([]);
            const [groupRaceTeams, setGroupRaceTeams] = useState([]);

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;

            const currentQuestionResponses = useMemo(() => {
                if (!activeQuestion) return {};
                const filtered = {};
                Object.values(responses).forEach(r => {
                    if (r.questionId === activeQuestion.id) {
                        filtered[r.studentId] = r;
                    }
                });
                return filtered;
            }, [responses, activeQuestion]);

            // Timer Interval Logic
            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(s => {
                            if (s <= 1) {
                                setTimerActive(false);
                                playSound('alarm');
                                return 0;
                            }
                            return s - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            // Sync Question to Firestore
            const publishQuestionToFirestore = async (qObj, newHistoryList) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatePayload = {
                    activeQuestion: qObj,

            const handleExitRoom = async () => {
                if (window.confirm("確定退出課室？將會同步清空此課室於 Firebase 的所有暫存紀錄！")) {
                    try {

                        const resSnaps = await window.fbUtils.getDocs(responsesColRef);
                        resSnaps.forEach(async (d) => await window.fbUtils.deleteDoc(d.ref));

                        const studentsColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                        const stuSnaps = await window.fbUtils.getDocs(studentsColRef);
                        stuSnaps.forEach(async (d) => await window.fbUtils.deleteDoc(d.ref));

                        const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                        await window.fbUtils.deleteDoc(roomDocRef);

                        showToast("課室暫存資料已完全清空！", "info");
                    } catch (e) {
                        console.error("Cleanup error:", e);
                    }
                    onExit();
                }
            };

            const handleDownloadChallengeTemplate = async () => {
                const sampleLines = [
                    "標題：地球生病了",
                    "總分: 100分",
                    "1.以下哪一項不是地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源",
                    "D. 機械資源*",
                    "",
                    "2.芝士的原料屬於哪一項天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源*",
                    "D. 礦產資源",
                    "",
                    "3.人們不當使用水資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應*"
                ];

                try {
                    const blob = await createWordDocxBlob(sampleLines);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = '評估範本Word檔.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast("已下載 Word 評估範本檔 (.docx)！", "success");
                } catch (err) {
                    showToast("無法生成 Word 範本檔", "error");
                }
            };

            const handleWordFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const result = await window.mammoth.extractRawText({ arrayBuffer: evt.target.result });
                            parsedData = parseWordChallengeText(result.value);
                        } else {
                            parsedData = parseWordChallengeText(evt.target.result);
                        }

                        if (selectedMode === 'GROUPRACE') {
                            setGroupRaceQuestions(parsedData.questions);
                        } else {
                            setChallengeData(parsedData);
                        }
                        showToast(`已成功解析範本！共 ${parsedData.questions.length} 題`, 'success');
                    } catch (err) {
                        showToast("文件解析失敗，請確認格式！", "error");
                    }
                };

                if (file.name.endsWith('.docx')) {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file, "UTF-8");
                }
            };

            // Group Race Stage Handlers
            const handleGenerateGroupRaceTeams = () => {
                if (studentsList.length === 0) {
                    showToast("目前無學生加入，無法分組！", "error");
                    return;
                }

                const shuffled = [...studentsList].sort(() => Math.random() - 0.5);
                const teamCount = Math.min(4, Math.max(2, Math.ceil(studentsList.length / 3)));
                const teams = [];

                for (let i = 0; i < teamCount; i++) {
                    teams.push({
                        ...TEAM_PRESETS[i],
                        members: [],
                        currentQuestionIdx: 0,
                        isFinished: false
                    });
                }

                shuffled.forEach((stu, idx) => {
                    const teamIdx = idx % teamCount;
                    const memberRole = (teams[teamIdx].members.length % 3) + 1; // Role 1, 2, or 3
                    teams[teamIdx].members.push({ ...stu, role: memberRole });
                });

                setGroupRaceTeams(teams);
                setGroupRaceStage('GROUPING');
                playSound('bgm_relax');
                showToast("已完成自動隨機分組！播放放鬆音樂中...", "success");
            };

            const handleStartGroupRace = () => {
                if (groupRaceQuestions.length === 0) {
                    showToast("請先載入或上傳合作題題目！", "error");
                    return;
                }

                playSound('bgm_intense');
                setGroupRaceStage('RACE');

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: 'GROUPRACE',
                    text: `🏎️ 合作題 Group Race：${groupRaceQuestions.length} 關極速挑戰！`,
                    startTime: Date.now(),
                    groupRace: {
                        stage: 'RACE',
                        questions: groupRaceQuestions,
                        teams: groupRaceTeams
                    }
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);
                publishQuestionToFirestore(newQ, updatedHistory);
                showToast("🏁 合作競賽正式開始！緊張弦樂登場！", "success");
            };

            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                
                let challengeContent = null;
                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請先上載並解析 Word 評估範本檔案！", "error");
                        return;
                    }
                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);
                publishQuestionToFirestore(newQ, updatedHistory);
                showToast(`已成功發佈【${getModeLabel(selectedMode)}】給全班！`, 'success');
            };

            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已成功向所有學生一併發放挑戰題成績！", "success");
            };

            const handleDownloadAllAudio = async () => {
                const audioSubmissions = Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:audio'));
                if (audioSubmissions.length === 0) {
                    showToast("目前尚無學生提交錄音！", "error");
                    return;
                }

                try {
                    const zip = new JSZip();
                    const folder = zip.folder(`課堂錄音_房號${roomCode}`);

                    audioSubmissions.forEach((res) => {
                        const base64Data = res.answer.split(',')[1];
                        const fileName = `${res.seatNumber.toString().padStart(2, '0')}_${res.name || '學生'}.webm`;
                        folder.file(fileName, base64Data, { base64: true });
                    });

                    const content = await zip.generateAsync({ type: "blob" });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(content);
                    link.download = `OMIT_學生錄音_房號${roomCode}.zip`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    showToast(`已打包下載 ${audioSubmissions.length} 個語音檔案！`, "success");
                } catch (err) {
                    showToast("打包錄音檔案失敗！", "error");
                }
            };

            const handleClearQuestion = async () => {
                playSound('bgm_stop');
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: null }, { merge: true });
                showToast('已結束當前題目', 'info');
            };

            const handleTeacherDemoBroadcast = async (dataUrl) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                const demoQ = {
                    id: 'q_demo_' + Date.now(),
                    mode: 'DRAW',
                    text: '🎨 教師白板示範與解說',
                    startTime: Date.now(),
                    teacherDemoBoard: dataUrl
                };

                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: demoQ }, { merge: true });
                setShowTeacherDemoModal(false);
                showToast("已成功將教師白板廣播至全班螢幕！", "success");
            };

            const handleBroadcastSubmission = async (studentRes) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatedQ = { 
                    ...activeQuestion, 
                    broadcastedSubmission: studentRes 
                };
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                showToast(`已成功廣播 ${studentRes.name} 的作品至全班螢幕！`, "success");
            };

            const handleCancelBroadcast = async () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                if (activeQuestion) {
                    const updatedQ = { ...activeQuestion, broadcastedSubmission: null, teacherDemoBoard: null };
                    await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                    showToast("已取消廣播分享", "info");
                }
            };

            const handleSpinRandom = () => {
                if (isSpinning) return;
                
                const start = parseInt(rangeStart) || 1;
                const end = parseInt(rangeEnd) || 36;
                const available = [];
                for (let i = start; i <= end; i++) {
                    if (!drawnNumbers.includes(i)) available.push(i);
                }

                if (available.length === 0) {
                    showToast("此範圍內所有學號皆已被抽出！請點擊重置。", "error");
                    return;
                }

                setIsSpinning(true);
                let counter = 0;
                const maxIntervals = 20;

                const timer = setInterval(() => {
                    const temp = available[Math.floor(Math.random() * available.length)];
                    setCurrentDrawn(temp);
                    playSound('spin');
                    counter++;

                    if (counter >= maxIntervals) {
                        clearInterval(timer);
                        const finalPicked = available[Math.floor(Math.random() * available.length)];
                        setCurrentDrawn(finalPicked);
                        setDrawnNumbers(prev => [...prev, finalPicked]);
                        setIsSpinning(false);
                        playSound('win');
                    }
                }, 100);
            };

            const handleExportCSVReport = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生紀錄可供匯出！", "error");
                    return;
                }

                let csvContent = "\uFEFF";
                csvContent += "學號,學生姓名,加入時間";

                historyQuestions.forEach((q, idx) => {
                    const cleanText = (q.text || getModeLabel(q.mode)).replace(/"/g, '""');
                    csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]: "${cleanText}"`;
                });
                csvContent += "\n";

                const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

                sortedStudents.forEach((stu) => {
                    const cleanName = (stu.name || '').replace(/"/g, '""');
                    csvContent += `"${stu.seatNumber}號","${cleanName}","${stu.joinTime || ''}"`;
                    
                    historyQuestions.forEach((q) => {
                        const resKey = `${q.id}_${stu.id}`;
                        const res = responses[resKey];
                        
                        if (res && res.answer !== undefined && res.answer !== null) {
                            let ansVal = res.answer;
                            if (typeof ansVal === 'string' && ansVal.startsWith('data:image')) ansVal = '[圖像白板答案]';
                            if (typeof ansVal === 'string' && ansVal.startsWith('data:audio')) ansVal = '[語音錄音檔案]';
                            csvContent += `,"${String(ansVal).replace(/"/g, '""')} (用時:${res.duration || 0}s)"`;
                        } else {
                            csvContent += `,"未作答"`;
                        }
                    });
                    csvContent += "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `宣道會陳元喜小學_OMIT課堂報告_房號${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("學習與評估報告已成功匯出試算表！", "success");
            };

            const leaderboard = useMemo(() => {
                return Object.values(currentQuestionResponses)
                    .filter(r => r.duration !== undefined)
                    .sort((a, b) => parseFloat(a.duration) - parseFloat(b.duration));
            }, [currentQuestionResponses]);

            const whiteboardSubmissions = useMemo(() => {
                return Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:image'));
            }, [currentQuestionResponses]);

            return (
                <div class="min-h-screen pb-12">
                    {/* Header Controls */}
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 py-3">
                        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                            <div class="flex items-center space-x-3">
                                <span class="bg-slate-900 text-white font-black px-3 py-1.5 rounded-xl text-sm md:text-base">
                                    宣道會陳元喜小學OMIT互動課堂
                                </span>
                                <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1 rounded-full font-mono font-black">
                                    房號：{roomCode}
                                </span>
                            </div>

                            <div class="flex flex-wrap items-center gap-2">
                                <button 
                                    onClick={() => setShowQRModal(true)}
                                    class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-2 rounded-xl border border-indigo-200 text-xs md:text-sm flex items-center space-x-1.5 transition"
                                >
                                    <span>📱 QR Code</span>
                                </button>

                                <button 
                                    onClick={() => setShowStudentListModal(true)}
                                    class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold px-3 py-2 rounded-xl border border-emerald-200 text-xs md:text-sm flex items-center space-x-1.5 transition"
                                >
                                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                                    <span>在線人數：{studentsList.length} 人</span>
                                </button>

                                <button 
                                    onClick={() => setShowTeacherDemoModal(true)}
                                    class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-3 py-2 rounded-xl text-xs md:text-sm shadow transition"
                                >
                                    🎨 教師白板示範
                                </button>

                                <button 
                                    onClick={() => setShowRandomModal(true)}
                                    class="bg-purple-50 hover:bg-purple-100 text-purple-700 font-bold px-3 py-2 rounded-xl border border-purple-200 text-xs md:text-sm transition"
                                >
                                    🎲 抽選學生
                                </button>

                                <button 
                                    onClick={() => setShowTimerModal(true)}
                                    class={`px-3 py-2 rounded-xl border text-xs md:text-sm font-bold flex items-center space-x-1.5 transition ${
                                        timerActive ? 'bg-amber-500 text-white border-amber-600 animate-pulse' : 'bg-amber-50 hover:bg-amber-100 text-amber-800 border-amber-200'
                                    }`}
                                >
                                    <span>⏱️ 計時器</span>
                                    {timerSeconds > 0 && (
                                        <span class="bg-white/20 font-mono text-xs px-1.5 py-0.5 rounded">
                                            {Math.floor(timerSeconds / 60)}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                        </span>
                                    )}
                                </button>

                                <button 
                                    onClick={handleExportCSVReport}
                                    class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold px-3 py-2 rounded-xl border border-blue-200 text-xs md:text-sm transition"
                                >
                                    📊 匯出報告
                                </button>

                                <button 
                                    onClick={handleExitRoom}
                                    class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2 rounded-xl border border-rose-200 text-xs md:text-sm transition"
                                >
                                    🚪 退出課室
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

                        {/* Mode Selectors */}
                        <div class="grid grid-cols-3 md:grid-cols-9 gap-2.5">
                            {[
                                { id: 'CHOICE', label: '選擇題', icon: '🔘' },
                                { id: 'TF', label: '是非題', icon: '⭕' },
                                { id: 'SHORT', label: '短答題', icon: '✍️' },
                                { id: 'DRAW', label: '白板題', icon: '🎨' },
                                { id: 'BUZZER', label: '搶答題', icon: '🚨' },
                                { id: 'AUDIO', label: '錄音題', icon: '🎤' },
                                { id: 'CHALLENGE', label: '挑戰題', icon: '🏆' },
                                { id: 'GROUPRACE', label: '合作題', icon: '🏎️' },
                                { id: 'LINK', label: '派送連結', icon: '🔗' }
                            ].map((mode) => (
                                <button 
                                    key={mode.id}
                                    onClick={() => setSelectedMode(mode.id)}
                                    class={`p-3 rounded-2xl font-bold border-2 transition-all text-center flex flex-col items-center justify-center space-y-1 shadow-sm active:scale-95 ${
                                        selectedMode === mode.id 
                                        ? 'bg-slate-900 text-white border-slate-900 ring-4 ring-slate-200' 
                                        : 'bg-white text-slate-700 border-slate-200 hover:border-slate-300 hover:bg-slate-50'
                                    }`}
                                >
                                    <span class="text-xl md:text-2xl">{mode.icon}</span>
                                    <span class="text-xs font-extrabold">{mode.label}</span>
                                </button>
                            ))}
                        </div>

                        {/* Question Creation Panel */}
                        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                            <div class="flex flex-wrap items-center justify-between border-b pb-3 gap-2">
                                <h2 class="font-extrabold text-slate-800 text-lg flex items-center gap-2">
                                    <span>模式設定：{getModeLabel(selectedMode)}</span>
                                </h2>

                                {selectedMode !== 'CHALLENGE' && selectedMode !== 'GROUPRACE' && (
                                    <div class="flex items-center space-x-2 bg-slate-100 p-1.5 rounded-xl">
                                        <span class="text-xs font-bold text-slate-600 pl-2">提交後允許修改：</span>
                                        <button 
                                            onClick={() => setLockAfterSubmit(!lockAfterSubmit)}
                                            class={`px-3 py-1 rounded-lg text-xs font-bold transition ${!lockAfterSubmit ? 'bg-emerald-500 text-white' : 'bg-slate-300 text-slate-600'}`}
                                        >
                                            {!lockAfterSubmit ? '已開放修改' : '已鎖定 (預設)'}
                                        </button>
                                    </div>
                                )}
                            </div>

                            {/* Group Race Mode Setup Panel */}
                            {selectedMode === 'GROUPRACE' && (
                                <div class="bg-gradient-to-br from-indigo-50 to-purple-50 border-2 border-indigo-200 p-5 rounded-3xl space-y-5">
                                    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-indigo-200 pb-3">
                                        <div>
                                            <h3 class="font-black text-indigo-900 text-lg flex items-center gap-2">
                                                <span>🏎️ 合作題 (Group Race) 競賽控制台</span>
                                            </h3>
                                            <p class="text-xs text-indigo-700 font-medium">題目拆分至不同組員螢幕，互相合作答題，答對前進，答錯回起點！</p>
                                        </div>
                                        <div class="flex items-center space-x-2">
                                            <button 
                                                type="button"
                                                onClick={handleDownloadChallengeTemplate}
                                                class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow transition"
                                            >
                                                📄 下載題目 Word範本
                                            </button>
                                        </div>
                                    </div>

                                    {/* 1. Prepare Stage */}
                                    <div class="bg-white p-4 rounded-2xl border space-y-3">
                                        <div class="flex items-center justify-between">
                                            <span class="font-black text-slate-800 text-sm">步驟 1: 上傳 Word 題目範本檔 (.docx) 或文字檔：</span>
                                            {groupRaceQuestions.length > 0 && (
                                                <span class="text-xs font-bold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-lg">
                                                    已就緒 {groupRaceQuestions.length} 道題
                                                </span>
                                            )}
                                        </div>
                                        <input 
                                            type="file" 
                                            accept=".docx,.txt"
                                            onChange={handleWordFileUpload}
                                            class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer"
                                        />
                                    </div>

                                    {/* 2. Grouping Stage */}
                                    <div class="bg-white p-4 rounded-2xl border space-y-3">
                                        <div class="flex flex-wrap items-center justify-between gap-2">
                                            <span class="font-black text-slate-800 text-sm">步驟 2: 隨機分組與資訊發送</span>
                                            <button 
                                                onClick={handleGenerateGroupRaceTeams}
                                                class="bg-purple-600 hover:bg-purple-700 text-white font-black text-xs px-4 py-2 rounded-xl shadow transition flex items-center gap-1.5"
                                            >
                                                <span>🎲 自動隨機分組 (播輕鬆音樂)</span>
                                            </button>
                                        </div>

                                        {groupRaceTeams.length > 0 && (
                                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 pt-2">
                                                {groupRaceTeams.map((team) => (
                                                    <div key={team.id} class={`p-3.5 rounded-2xl border-2 ${team.borderClr} bg-slate-50 space-y-2`}>
                                                        <div class="flex items-center justify-between">
                                                            <span class={`font-black text-sm flex items-center gap-1 ${team.textClr}`}>
                                                                <span class="text-lg">{team.emoji}</span> {team.name}
                                                            </span>
                                                            <span class="text-xs font-bold text-slate-400">{team.members.length} 人</span>
                                                        </div>
                                                        <div class="flex flex-wrap gap-1">
                                                            {team.members.map((m) => (
                                                                <span key={m.id} class="text-xs px-2 py-0.5 bg-white border rounded-md font-bold text-slate-700">
                                                                    {m.seatNumber}號 ({m.name}) [組員{m.role}]
                                                                </span>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    {/* 3. Race Stage Button */}
                                    {groupRaceQuestions.length > 0 && groupRaceTeams.length > 0 && (
                                        <button 
                                            onClick={handleStartGroupRace}
                                            class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-black rounded-2xl shadow-xl text-lg animate-bounce"
                                        >
                                            🏁 開始合作競賽 (播緊張弦樂音樂) 🚀
                                        </button>
                                    )}
                                </div>
                            )}

                            {/* Challenge Question Setup */}
                            {selectedMode === 'CHALLENGE' && (
                                <div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 p-5 rounded-3xl space-y-5 text-slate-800">
                                    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-amber-200 pb-3">
                                        <h3 class="font-black text-amber-900 text-base flex items-center gap-2">
                                            <span>🏆 Word 文件挑戰題評估設定</span>
                                        </h3>
                                        <button 
                                            type="button"
                                            onClick={handleDownloadChallengeTemplate}
                                            class="bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow transition"
                                        >
                                            📄 下載評估 Word範本檔
                                        </button>
                                    </div>

                                    <div class="bg-white p-4 rounded-2xl border border-amber-200 space-y-3">
                                        <label class="block text-xs font-bold text-slate-700">
                                            1. 上載修改後的 Word 文件 (.docx) 或文字檔 (.txt)：
                                        </label>
                                        <input 
                                            type="file" 
                                            accept=".docx,.txt"
                                            onChange={handleWordFileUpload}
                                            class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-600 file:text-white hover:file:bg-amber-700 cursor-pointer"
                                        />
                                    </div>

                                    {/* Time Limit with 00:00 format */}
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-white p-4 rounded-2xl border border-amber-200">
                                        <div class="space-y-2">
                                            <div class="flex items-center justify-between">
                                                <label class="text-xs font-bold text-slate-700">2. 開啟答題限時模式：</label>
                                                <input 
                                                    type="checkbox" 
                                                    checked={challengeEnableTimer}
                                                    onChange={(e) => setChallengeEnableTimer(e.target.checked)}
                                                    class="w-4 h-4 accent-amber-600 rounded cursor-pointer"
                                                />
                                            </div>
                                            {challengeEnableTimer && (
                                                <div class="flex items-center space-x-2 pt-1">
                                                    <span class="text-xs font-bold text-amber-900">限時 (00:00 格式)：</span>
                                                    <div class="flex items-center space-x-1 border rounded-xl px-3 py-1.5 bg-white shadow-sm">
                                                        <input 
                                                            type="number"
                                                            min="0"
                                                            max="99"
                                                            value={String(Math.floor(challengeTimeLimit / 60)).padStart(2, '0')}
                                                            onChange={(e) => {
                                                                const mins = Math.max(0, parseInt(e.target.value) || 0);
                                                                const secs = challengeTimeLimit % 60;
                                                                setChallengeTimeLimit(mins * 60 + secs);
                                                            }}
                                                            class="w-8 text-xs font-mono font-bold text-center outline-none bg-transparent"
                                                        />
                                                        <span class="font-mono font-bold text-amber-900 text-xs">:</span>
                                                        <input 
                                                            type="number"
                                                            min="0"
                                                            max="59"
                                                            value={String(challengeTimeLimit % 60).padStart(2, '0')}
                                                            onChange={(e) => {
                                                                const mins = Math.floor(challengeTimeLimit / 60);
                                                                const secs = Math.min(59, Math.max(0, parseInt(e.target.value) || 0));
                                                                setChallengeTimeLimit(mins * 60 + secs);
                                                            }}
                                                            class="w-8 text-xs font-mono font-bold text-center outline-none bg-transparent"
                                                        />
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        <div class="space-y-2">
                                            <label class="text-xs font-bold text-slate-700 block">3. 成績發放方式：</label>
                                            <div class="space-y-1">
                                                <label class="flex items-center space-x-2 text-xs font-bold text-slate-700 cursor-pointer">
                                                    <input 
                                                        type="radio" 
                                                        name="scoreRelease" 
                                                        checked={challengeReleaseInstant}
                                                        onChange={() => setChallengeReleaseInstant(true)}
                                                        class="accent-amber-600"
                                                    />
                                                    <span>學生提交後即時顯示分數與答案</span>
                                                </label>
                                                <label class="flex items-center space-x-2 text-xs font-bold text-slate-700 cursor-pointer">
                                                    <input 
                                                        type="radio" 
                                                        name="scoreRelease" 
                                                        checked={!challengeReleaseInstant}
                                                        onChange={() => setChallengeReleaseInstant(false)}
                                                        class="accent-amber-600"
                                                    />
                                                    <span>待所有學生完成提交後，由教師按鍵一併發放</span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Question Title or Link input */}
                            {selectedMode !== 'LINK' && selectedMode !== 'BUZZER' && selectedMode !== 'CHALLENGE' && selectedMode !== 'GROUPRACE' && (
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 mb-1">題目內容 / 指引：</label>
                                    <input 
                                        type="text" 
                                        placeholder={`預設提示：「${getDefaultQuestionPrompt(selectedMode)}」`} 
                                        value={questionText}
                                        onChange={(e) => setQuestionText(e.target.value)}
                                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium text-slate-800"
                                    />
                                </div>
                            )}

                            {selectedMode === 'LINK' && (
                                <div class="space-y-2 bg-amber-50 p-4 rounded-2xl border border-amber-100">
                                    <label class="block text-sm font-bold text-amber-900">網頁連結或 YouTube 影片網址：</label>
                                    <input 
                                        type="url" 
                                        placeholder="https://www.youtube.com/watch?v=..." 
                                        value={pushedUrl}
                                        onChange={(e) => setPushedUrl(e.target.value)}
                                        class="w-full px-4 py-3 rounded-xl border border-amber-200 focus:outline-none focus:ring-2 focus:ring-amber-500 font-mono text-sm"
                                    />
                                </div>
                            )}

                            {/* Publish Buttons */}
                            {selectedMode !== 'GROUPRACE' && (
                                <div class="flex space-x-3 pt-2">
                                    <button 
                                        onClick={handlePublishQuestion}
                                        class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-lg text-base transition active:scale-98"
                                    >
                                        🚀 發佈【{getModeLabel(selectedMode)}】給全班
                                    </button>
                                    {activeQuestion && (
                                        <button 
                                            onClick={handleClearQuestion}
                                            class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-6 py-4 rounded-2xl transition"
                                        >
                                            收回題目
                                        </button>
                                    )}
