<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMIT 互動課堂 - 免登入即時課堂互動平台</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            touch-action: manipulation;
        }
        .canvas-container {
            touch-action: none;
        }
        .font-outfit {
            font-family: 'Outfit', sans-serif;
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot, collection, query, where, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAcphRXxqs_MTeWwffVVOFsnb8Liro5Lto",
            authDomain: "omit-8c173.firebaseapp.com",
            projectId: "omit-8c173",
            storageBucket: "omit-8c173.firebasestorage.app",
            messagingSenderId: "1078509757779",
            appId: "1:1078509757779:web:64fe9465920eca4f38ada6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Expose Firebase utilities to global scope for React components
        window.FB = {
            db,
            auth,
            doc,
            setDoc,
            getDoc,
            updateDoc,
            deleteDoc,
            onSnapshot,
            collection,
            query,
            where,
            getDocs,
            writeBatch,
            signInAnonymously,
            onAuthStateChanged
        };
    </script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Custom Toast Notification
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (
                <div class={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-2 text-sm font-medium animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        // Helper to format timestamps
        const formatTime = (ts) => {
            if (!ts) return '--:--:--';
            const date = new Date(ts);
            return date.toLocaleTimeString('zh-HK', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
        };

        function OMITApp() {
            const [role, setRole] = useState('LANDING'); // 'LANDING', 'TEACHER', 'STUDENT'
            const [roomCode, setRoomCode] = useState('');
            const [studentName, setStudentName] = useState('');
            const [toast, setToast] = useState(null);
            const [fbUser, setFbUser] = useState(null);

            const myStudentId = useRef('std_' + Math.random().toString(36).substring(2, 9));

            // Show Toast helper
            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            // Authenticate with Firebase Anonymously on startup
            useEffect(() => {
                if (!window.FB) return;
                const { auth, signInAnonymously, onAuthStateChanged } = window.FB;
                
                const unsubscribe = onAuthStateChanged(auth, (user) => {
                    if (user) {
                        setFbUser(user);
                    } else {
                        signInAnonymously(auth).then(cred => setFbUser(cred.user)).catch(console.error);
                    }
                });

                return () => unsubscribe();
            }, []);

            // Parse URL parameters for direct room joining via QR Code
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const roomParam = params.get('room');
                if (roomParam) {
                    setRoomCode(roomParam.toUpperCase());
                }
            }, []);

            // Create Room (Teacher)
            const handleCreateRoom = () => {
                const generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
                setRoomCode(generatedCode);
                setRole('TEACHER');
                showToast(`已建立互動課堂 房號：${generatedCode}`, 'success');
            };

            // Join Room (Student)
            const handleJoinRoom = (e) => {
                e?.preventDefault();
                if (!roomCode.trim()) {
                    showToast('請輸入6位數字房號', 'error');
                    return;
                }
                if (!studentName.trim()) {
                    showToast('請輸入您的姓名或暱稱', 'error');
                    return;
                }
                setRole('STUDENT');
                showToast(`已進入房號 ${roomCode} 的課堂`, 'success');
            };

            if (role === 'LANDING') {
                return (
                    <div class="min-h-screen bg-gradient-to-br from-indigo-900 via-indigo-800 to-purple-900 flex items-center justify-center p-4">
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                        
                        <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 space-y-8 relative overflow-hidden">
                            <div class="text-center space-y-2">
                                <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl mb-2 font-black text-2xl shadow-inner font-outfit tracking-wider">
                                    OMIT
                                </div>
                                <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">OMIT 互動課堂</h1>
                                <p class="text-slate-500 text-sm">免登入！隨查隨答、高效即時的反饋互動平台</p>
                            </div>

                            <div class="space-y-6">
                                {/* Student Join Section */}
                                <form onSubmit={handleJoinRoom} class="bg-indigo-50/70 p-5 rounded-2xl border border-indigo-100 space-y-4">
                                    <h2 class="text-xs font-bold text-indigo-600 uppercase tracking-wider">我是學生 (加入課堂)</h2>
                                    <div>
                                        <input 
                                            type="text" 
                                            placeholder="請輸入房號 (例如 123456)" 
                                            value={roomCode} 
                                            onChange={(e) => setRoomCode(e.target.value)}
                                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-mono text-center tracking-widest text-lg font-bold"
                                            maxLength={6}
                                        />
                                    </div>
                                    <div>
                                        <input 
                                            type="text" 
                                            placeholder="請輸入你的姓名 / 暱稱" 
                                            value={studentName} 
                                            onChange={(e) => setStudentName(e.target.value)}
                                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-medium"
                                        />
                                    </div>
                                    <button 
                                        type="submit" 
                                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-200 active:scale-98 flex items-center justify-center space-x-2"
                                    >
                                        <span>進入課堂 🚀</span>
                                    </button>
                                </form>

                                <div class="relative flex py-1 items-center">
                                    <div class="flex-grow border-t border-slate-200"></div>
                                    <span class="flex-shrink mx-4 text-slate-400 text-xs font-medium">或</span>
                                    <div class="flex-grow border-t border-slate-200"></div>
                                </div>

                                {/* Teacher Create Section */}
                                <div class="text-center">
                                    <button 
                                        onClick={handleCreateRoom}
                                        class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl transition shadow-md flex items-center justify-center space-x-2 active:scale-98"
                                    >
                                        <span>👨‍🏫 開啟新課堂 (教師控制台)</span>
                                    </button>
                                    <p class="text-xs text-slate-400 mt-2">不需註冊或登入，建立即可發放房號與 QR Code</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (role === 'TEACHER') {
                return (
                    <TeacherDashboard 
                        roomCode={roomCode} 
                        fbUser={fbUser}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            if (role === 'STUDENT') {
                return (
                    <StudentInterface 
                        roomCode={roomCode}
                        studentName={studentName}
                        studentId={myStudentId.current}
                        fbUser={fbUser}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            return null;
        }

        function TeacherDashboard({ roomCode, fbUser, showToast, onExit }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE'); // 'CHOICE', 'TF', 'SHORT', 'DRAW'
            const [questionText, setQuestionText] = useState('');
            const [allowEdit, setAllowEdit] = useState(true); // Feature 4: Allow student edits toggle
            const [bgImage, setBgImage] = useState(null); // Feature 2: Teacher Whiteboard Background
            const [choiceCount, setChoiceCount] = useState(4); // 4 or 5 options

            const [activeQuestion, setActiveQuestion] = useState(null);
            const [responses, setResponses] = useState({});
            const [studentsList, setStudentsList] = useState([]);
            
            // Modals
            const [showQRModal, setShowQRModal] = useState(false);
            const [showStudentsModal, setShowStudentsModal] = useState(false); // Feature 1: Student List Modal
            const [showLeaderboardModal, setShowLeaderboardModal] = useState(false); // Feature 5: Leaderboard
            const [zoomedStudent, setZoomedStudent] = useState(null); // Feature 3: Zoomed response

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

            // QR Code URL
            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${encodeURIComponent(joinUrl)}`;

            // Listen to Room Document and Subcollections
            useEffect(() => {
                if (!window.FB || !fbUser || !roomCode) return;
                const { db, doc, onSnapshot, collection, query, where } = window.FB;

                // Listen to room state doc
                const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', roomCode);
                const unsubRoom = onSnapshot(roomDocRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        setActiveQuestion(data.activeQuestion || null);
                    }
                }, console.error);

                // Listen to student list
                const studentsColl = collection(db, 'artifacts', appId, 'public', 'data', 'omit_students');
                const studentsQuery = query(studentsColl, where('roomCode', '==', roomCode));
                const unsubStudents = onSnapshot(studentsQuery, (snapshot) => {
                    const list = [];
                    snapshot.forEach(d => list.push(d.data()));
                    // Sort by join time
                    list.sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
                    setStudentsList(list);
                }, console.error);

                // Listen to student responses
                const responsesColl = collection(db, 'artifacts', appId, 'public', 'data', 'omit_responses');
                const responsesQuery = query(responsesColl, where('roomCode', '==', roomCode));
                const unsubResponses = onSnapshot(responsesQuery, (snapshot) => {
                    const respMap = {};
                    snapshot.forEach(d => {
                        const r = d.data();
                        respMap[r.studentId] = r;
                    });
                    setResponses(respMap);
                }, console.error);

                return () => {
                    unsubRoom();
                    unsubStudents();
                    unsubResponses();
                };
            }, [roomCode, fbUser]);

            // Feature 2: Image background upload handler
            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 2 * 1024 * 1024) {
                    showToast('圖片大小不能超過 2MB', 'error');
                    return;
                }
                const reader = new FileReader();
                reader.onload = (evt) => {
                    setBgImage(evt.target.result);
                    showToast('已載入背景圖片', 'success');
                };
                reader.readAsDataURL(file);
            };

            // Publish Question
            const handlePublishQuestion = async () => {
                if (!window.FB || !roomCode) return;
                const { db, doc, setDoc, collection, query, where, getDocs, writeBatch } = window.FB;

                const defaultPrompt = selectedMode === 'CHOICE' ? '請選擇正確答案：' :
                                      selectedMode === 'TF' ? '請判斷對錯 (O / X)：' :
                                      selectedMode === 'SHORT' ? '請輸入您的作答內容：' : '請在下方白板進行標註繪圖或解題：';

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: questionText.trim() || defaultPrompt,
                    startTime: Date.now(),
                    allowEdit: allowEdit, // Feature 4
                    bgImage: bgImage || null, // Feature 2
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : []
                };

                try {
                    // Update room doc
                    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', roomCode);
                    await setDoc(roomDocRef, {
                        roomCode,
                        activeQuestion: newQ,
                        broadcastedResponse: null, // Reset broadcasted student work
                        updatedAt: Date.now()
                    }, { merge: true });

                    // Clear previous responses in Firestore for this room
                    const responsesColl = collection(db, 'artifacts', appId, 'public', 'data', 'omit_responses');
                    const qSnap = await getDocs(query(responsesColl, where('roomCode', '==', roomCode)));
                    const batch = writeBatch(db);
                    qSnap.forEach(d => batch.delete(d.ref));
                    await batch.commit();

                    showToast('已成功發佈題目給所有學生！', 'success');
                } catch (err) {
                    console.error(err);
                    showToast('發佈題目失敗', 'error');
                }
            };

            // Clear / End Current Question
            const handleClearQuestion = async () => {
                if (!window.FB || !roomCode) return;
                const { db, doc, updateDoc } = window.FB;
                try {
                    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', roomCode);
                    await updateDoc(roomDocRef, {
                        activeQuestion: null,
                        broadcastedResponse: null
                    });
                    showToast('已結束當前題目', 'info');
                } catch (err) {
                    console.error(err);
                }
            };

            // Toggle Allow Student Edit on Live Active Question (Feature 4)
            const handleToggleAllowEdit = async () => {
                if (!activeQuestion || !window.FB) return;
                const { db, doc, setDoc } = window.FB;
                const updatedQ = { ...activeQuestion, allowEdit: !activeQuestion.allowEdit };
                setActiveQuestion(updatedQ);
                try {
                    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', roomCode);
                    await setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                    showToast(updatedQ.allowEdit ? '已允許學生修改答案' : '已鎖定，學生無法再修改答案', 'info');
                } catch (err) {
                    console.error(err);
                }
            };

            // Feature 3: Broadcast Specific Student Response to All Students for Peer Review
            const handleBroadcastResponse = async (studentResponse) => {
                if (!window.FB || !roomCode) return;
                const { db, doc, updateDoc } = window.FB;
                try {
                    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', roomCode);
                    await updateDoc(roomDocRef, {
                        broadcastedResponse: studentResponse
                    });
                    showToast(`已傳送【${studentResponse.studentName}】的作品給全班互評！`, 'success');
                } catch (err) {
                    console.error(err);
                    showToast('傳送失敗', 'error');
                }
            };

            // Feature 3: Stop Peer Review Broadcast
            const handleStopBroadcast = async () => {
                if (!window.FB || !roomCode) return;
                const { db, doc, updateDoc } = window.FB;
                try {
                    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', roomCode);
                    await updateDoc(roomDocRef, { broadcastedResponse: null });
                    showToast('已結束廣播互評作品', 'info');
                } catch (err) {
                    console.error(err);
                }
            };

            // Feature 6: Clear all Firebase temporary files for room on Exit
            const handleTeacherExit = async () => {
                if (!confirm("確定要退出課室嗎？退出將會清空該房號的所有學生紀錄與答題暫存數據。")) return;
                if (window.FB && roomCode) {
                    const { db, doc, deleteDoc, collection, query, where, getDocs, writeBatch } = window.FB;
                    try {
                        showToast('清理 Firebase 暫存檔案中...', 'info');
                        const batch = writeBatch(db);

                        // Delete room doc
                        const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', roomCode);
                        batch.delete(roomDocRef);

                        // Delete all student docs
                        const studentsColl = collection(db, 'artifacts', appId, 'public', 'data', 'omit_students');
                        const sSnap = await getDocs(query(studentsColl, where('roomCode', '==', roomCode)));
                        sSnap.forEach(d => batch.delete(d.ref));

                        // Delete all response docs
                        const responsesColl = collection(db, 'artifacts', appId, 'public', 'data', 'omit_responses');
                        const rSnap = await getDocs(query(responsesColl, where('roomCode', '==', roomCode)));
                        rSnap.forEach(d => batch.delete(d.ref));

                        await batch.commit();
                        showToast('已成功清理暫存數據！', 'success');
                    } catch (err) {
                        console.error("Error clearing Firebase cache:", err);
                    }
                }
                onExit();
            };

            // Sort Responses for Leaderboard (Feature 5)
            const leaderboardList = useMemo(() => {
                const list = Object.values(responses);
                list.sort((a, b) => parseFloat(a.duration || 999) - parseFloat(b.duration || 999));
                return list;
            }, [responses]);

            return (
                <div class="min-h-screen bg-slate-100 pb-12">
                    {/* Top Header Bar */}
                    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-30">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
                            <div class="flex items-center space-x-3">
                                <span class="bg-indigo-600 font-outfit text-white px-3 py-1 rounded-xl text-lg font-black tracking-widest">OMIT</span>
                                <span class="text-xs sm:text-sm font-semibold bg-slate-800 text-slate-300 px-3 py-1 rounded-lg border border-slate-700">
                                    教師控制台
                                </span>
                                <div class="flex items-center bg-indigo-950/80 border border-indigo-700/50 text-indigo-200 px-3 py-1 rounded-xl font-mono font-extrabold text-lg">
                                    <span class="text-xs text-indigo-400 mr-1.5 uppercase font-sans font-normal">房號:</span>
                                    {roomCode}
                                </div>
                            </div>

                            <div class="flex items-center space-x-2 sm:space-x-3">
                                {/* Feature 1: Real-time Student Count Tag */}
                                <button 
                                    onClick={() => setShowStudentsModal(true)}
                                    class="bg-indigo-600/90 hover:bg-indigo-600 text-white px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold flex items-center space-x-1.5 transition shadow-sm border border-indigo-400/30"
                                >
                                    <span>👥 已加入學生：</span>
                                    <span class="bg-white text-indigo-900 px-2 py-0.5 rounded-full font-extrabold font-mono text-xs">{studentsList.length}</span>
                                </button>

                                {/* Feature 5: Leaderboard Button */}
                                <button 
                                    onClick={() => setShowLeaderboardModal(true)}
                                    class="bg-amber-500/90 hover:bg-amber-500 text-white px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold flex items-center space-x-1 transition shadow-sm"
                                >
                                    <span>🏆 龍虎榜</span>
                                </button>

                                <button 
                                    onClick={() => setShowQRModal(true)}
                                    class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium border border-slate-700 flex items-center space-x-1"
                                >
                                    <span>📱 進入QR碼</span>
                                </button>

                                <button 
                                    onClick={handleTeacherExit}
                                    class="bg-rose-600/80 hover:bg-rose-600 text-white px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium transition"
                                >
                                    <span>🚪 退出課室</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main class="max-w-7xl mx-auto px-4 sm:px-6 mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
                        {/* Question Creation Panel (Left) */}
                        <div class="lg:col-span-5 bg-white rounded-3xl shadow-sm border border-slate-200/80 p-6 space-y-6">
                            <div>
                                <h2 class="text-xl font-bold text-slate-800 flex items-center space-x-2">
                                    <span>✏️ 發佈互動題目</span>
                                </h2>
                                <p class="text-xs text-slate-400 mt-1">選擇題型、說明文字，隨時出題與學生互動</p>
                            </div>

                            {/* Mode Selection */}
                            <div class="grid grid-cols-2 gap-2.5">
                                {[
                                    { id: 'CHOICE', label: '🔘 選擇題', desc: '單選題 (A-D/E)' },
                                    { id: 'TF', label: '⭕ 是非題', desc: 'O / X 判斷' },
                                    { id: 'SHORT', label: '💬 簡答題', desc: '文字填答' },
                                    { id: 'DRAW', label: '🎨 白板題', desc: '手繪/標註作答' }
                                ].map((m) => (
                                    <button
                                        key={m.id}
                                        onClick={() => setSelectedMode(m.id)}
                                        class={`p-3.5 rounded-2xl border text-left transition ${
                                            selectedMode === m.id 
                                            ? 'bg-indigo-50/90 border-indigo-500 ring-2 ring-indigo-500/20' 
                                            : 'bg-slate-50/50 border-slate-200 hover:bg-slate-50'
                                        }`}
                                    >
                                        <div class="font-bold text-sm text-slate-800">{m.label}</div>
                                        <div class="text-[11px] text-slate-400 mt-0.5">{m.desc}</div>

        function StudentInterface({ roomCode, studentName, studentId, fbUser, showToast, onExit }) {
            const [activeQuestion, setActiveQuestion] = useState(null);
            const [myResponse, setMyResponse] = useState(null);
            const [broadcastedResponse, setBroadcastedResponse] = useState(null); // Feature 3: Peer review

            // Inputs
            const [shortAnswerText, setShortAnswerText] = useState('');
            const [selectedChoice, setSelectedChoice] = useState('');

            // Feature 5: Leaderboard
            const [showLeaderboard, setShowLeaderboard] = useState(false);
            const [allResponses, setAllResponses] = useState([]);

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

            // Register Student in Firestore & Listen to Room Changes
            useEffect(() => {
                if (!window.FB || !fbUser || !roomCode) return;
                const { db, doc, setDoc, onSnapshot, collection, query, where } = window.FB;

                // Register student presence
                const studentDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_students', `${roomCode}_${studentId}`);
                setDoc(studentDocRef, {
                    roomCode,
                    studentId,
                    name: studentName,
                    joinedAt: Date.now()
                }, { merge: true }).catch(console.error);

                // Listen to room document
                const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', roomCode);
                const unsubRoom = onSnapshot(roomDocRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        setActiveQuestion(data.activeQuestion || null);
                        setBroadcastedResponse(data.broadcastedResponse || null);
                    }
                });

                // Listen to student's own submission
                const respDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_responses', `${roomCode}_${studentId}`);
                const unsubResp = onSnapshot(respDocRef, (snapshot) => {
                    if (snapshot.exists()) {
                        setMyResponse(snapshot.data());
                    } else {
                        setMyResponse(null);
                    }
                });

                // Listen to all responses for leaderboard (Feature 5)
                const responsesColl = collection(db, 'artifacts', appId, 'public', 'data', 'omit_responses');
                const responsesQuery = query(responsesColl, where('roomCode', '==', roomCode));
                const unsubAllResp = onSnapshot(responsesQuery, (snapshot) => {
                    const list = [];
                    snapshot.forEach(d => list.push(d.data()));
                    setAllResponses(list);
                });

                return () => {
                    unsubRoom();
                    unsubResp();
                    unsubAllResp();
                };
            }, [roomCode, studentId, studentName, fbUser]);

            // Submit Answer to Firestore
            const handleSubmitAnswer = async (answerValue) => {
                if (!activeQuestion || !window.FB) return;
                const { db, doc, setDoc } = window.FB;

                // Calculate response speed in seconds
                const duration = ((Date.now() - activeQuestion.startTime) / 1000).toFixed(1);

                const respDoc = {
                    roomCode,
                    studentId,
                    studentName,
                    questionId: activeQuestion.id,
                    mode: activeQuestion.mode,
                    answer: answerValue,
                    timestamp: Date.now(),
                    duration: duration
                };

                try {
                    const respDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_responses', `${roomCode}_${studentId}`);
                    await setDoc(respDocRef, respDoc);
                    showToast('答案已成功提交！', 'success');
                } catch (err) {
                    console.error(err);
                    showToast('提交失敗，請重試', 'error');
                }
            };

            // Leaderboard sorted list
            const sortedLeaderboard = useMemo(() => {
                const list = [...allResponses];
                list.sort((a, b) => parseFloat(a.duration || 999) - parseFloat(b.duration || 999));
                return list;
            }, [allResponses]);

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col">
                    {/* Top Bar */}
                    <header class="bg-indigo-900 text-white px-4 py-3 shadow-md flex items-center justify-between sticky top-0 z-30">
                        <div class="flex items-center space-x-2">
                            <span class="font-outfit font-black text-xl tracking-wider text-indigo-300">OMIT</span>
                            <span class="bg-indigo-800 text-xs px-2.5 py-1 rounded-lg font-bold border border-indigo-700">
                                房號: {roomCode}
                            </span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button 
                                onClick={() => setShowLeaderboard(true)}
                                class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1"
                            >
                                <span>🏆 龍虎榜</span>
                            </button>
                            <span class="text-xs font-bold bg-indigo-950 px-3 py-1 rounded-xl text-indigo-200">
                                👤 {studentName}
                            </span>
                            <button onClick={onExit} class="text-xs text-indigo-300 hover:text-white ml-2">退出</button>
                        </div>
                    </header>

                    <main class="flex-1 max-w-3xl w-full mx-auto p-4 flex flex-col justify-center">
                        {/* Feature 3: Peer Review Broadcast Overlay/Notification */}
                        {broadcastedResponse && (
                            <div class="mb-6 bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-3xl p-5 shadow-xl animate-in slide-in-from-top duration-300 space-y-3">
                                <div class="flex items-center justify-between">
                                    <span class="bg-white/20 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
                                        📢 老師分享作品 · 全班互評觀看
                                    </span>
                                    <span class="text-xs opacity-80">來自同學：{broadcastedResponse.studentName}</span>
                                </div>

                                <div class="bg-slate-950/90 rounded-2xl p-4 flex items-center justify-center min-h-[200px]">
                                    {broadcastedResponse.mode === 'DRAW' ? (
                                        <img src={broadcastedResponse.answer} alt="Broadcasted Work" class="max-h-72 object-contain rounded-lg" />
                                    ) : (
                                        <div class="text-white text-lg font-medium p-4 text-center">
                                            {broadcastedResponse.answer}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Question Box */}
                        {activeQuestion ? (
                            <div class="bg-white rounded-3xl shadow-lg border border-slate-200/80 p-6 space-y-6">
                                <div class="space-y-2 border-b pb-4">
                                    <div class="flex items-center justify-between">
                                        <span class="bg-indigo-100 text-indigo-700 font-extrabold text-xs px-3 py-1 rounded-full uppercase tracking-wider">
                                            {activeQuestion.mode === 'CHOICE' ? '選擇題' : activeQuestion.mode === 'TF' ? '是非題' : activeQuestion.mode === 'SHORT' ? '簡答題' : '白板繪圖題'}
                                        </span>

                                        {/* Feature 4 status label */}
                                        <span class="text-xs font-medium text-slate-400">
                                            {activeQuestion.allowEdit ? '✏️ 可修改答案' : '🔒 提交後不可修改'}
                                        </span>
                                    </div>
                                    <h2 class="text-xl font-bold text-slate-800 leading-relaxed">
                                        {activeQuestion.text}
                                    </h2>
                                </div>

                                {/* Answer Submission Area */}
                                <div>
                                    {/* Choice Question Render */}
                                    {activeQuestion.mode === 'CHOICE' && (
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            {activeQuestion.choiceOptions.map((opt) => (
                                                <button
                                                    key={opt}
                                                    disabled={myResponse && !activeQuestion.allowEdit}
                                                    onClick={() => {
                                                        setSelectedChoice(opt);
                                                        handleSubmitAnswer(opt);
                                                    }}
                                                    class={`p-5 rounded-2xl font-extrabold text-2xl transition border flex items-center justify-between ${
                                                        myResponse?.answer === opt 
                                                        ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' 
                                                        : 'bg-slate-50 text-slate-800 border-slate-200 hover:bg-indigo-50 hover:border-indigo-300'
                                                    }`}
                                                >
                                                    <span>選項 {opt}</span>
                                                    {myResponse?.answer === opt && <span>✓</span>}
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    {/* True / False Render */}
                                    {activeQuestion.mode === 'TF' && (
                                        <div class="grid grid-cols-2 gap-4">
                                            {[
                                                { label: '⭕ 對 (O)', val: 'O', color: 'hover:bg-emerald-50 hover:border-emerald-300' },
                                                { label: '❌ 錯 (X)', val: 'X', color: 'hover:bg-rose-50 hover:border-rose-300' }
                                            ].map((item) => (
                                                <button
                                                    key={item.val}
                                                    disabled={myResponse && !activeQuestion.allowEdit}
                                                    onClick={() => handleSubmitAnswer(item.val)}
                                                    class={`p-8 rounded-3xl font-black text-3xl transition border text-center ${
                                                        myResponse?.answer === item.val
                                                        ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg'
                                                        : `bg-slate-50 text-slate-800 border-slate-200 ${item.color}`
                                                    }`}
                                                >
                                                    {item.label}
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    {/* Short Answer Render */}
                                    {activeQuestion.mode === 'SHORT' && (
                                        <div class="space-y-4">
                                            <textarea
                                                rows="4"
                                                disabled={myResponse && !activeQuestion.allowEdit}
                                                placeholder="請在此輸入您的作答內容..."
                                                value={shortAnswerText}
                                                onChange={(e) => setShortAnswerText(e.target.value)}
                                                class="w-full p-4 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 text-base"
                                            ></textarea>
                                            <button
                                                disabled={myResponse && !activeQuestion.allowEdit}
                                                onClick={() => {
                                                    if (!shortAnswerText.trim()) return showToast('請輸入作答內容', 'error');
                                                    handleSubmitAnswer(shortAnswerText.trim());
                                                }}
                                                class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-bold py-3.5 rounded-2xl shadow-md transition"
                                            >
                                                {myResponse ? '修改並重新提交 🚀' : '提交答案 🚀'}
                                            </button>
                                        </div>
                                    )}

                                    {/* Feature 2: Interactive Drawing Canvas Component */}
                                    {activeQuestion.mode === 'DRAW' && (
                                        <StudentWhiteboardCanvas 
                                            bgImage={activeQuestion.bgImage}
                                            isLocked={myResponse && !activeQuestion.allowEdit}
                                            onSubmit={handleSubmitAnswer}
                                            myResponse={myResponse}
                                        />
                                    )}
                                </div>

                                {/* Submission Status Indicator */}
                                {myResponse && (
                                    <div class="bg-emerald-50 border border-emerald-200 text-emerald-800 p-4 rounded-2xl text-center text-sm font-bold flex items-center justify-center space-x-2">
                                        <span>✅ 您已於 {formatTime(myResponse.timestamp)} 完成答題 (耗時 {myResponse.duration} 秒)</span>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div class="bg-white rounded-3xl p-12 shadow-sm border border-slate-200/80 text-center space-y-3">
                                <div class="text-5xl animate-pulse">📡</div>
                                <h2 class="text-lg font-bold text-slate-800">等待教師發佈題目中...</h2>
                                <p class="text-xs text-slate-400">當教師發佈題目時，此畫面將自動更新，請保持連線。</p>
                            </div>
                        )}
                    </main>

                    {/* Feature 5: Leaderboard Modal for Student */}
                    {showLeaderboard && (
                        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-5">
                                <div class="flex items-center justify-between border-b pb-3">
                                    <h3 class="text-lg font-bold text-slate-800 flex items-center space-x-2">
                                        <span>🏆 答題龍虎榜 (速度排名)</span>
                                    </h3>
                                    <button onClick={() => setShowLeaderboard(false)} class="text-slate-400 hover:text-slate-600">✕</button>
                                </div>

                                <div class="space-y-2 max-h-80 overflow-y-auto">
                                    {sortedLeaderboard.length === 0 ? (
                                        <p class="text-center text-slate-400 py-8 text-sm">尚無答題紀錄</p>
                                    ) : (
                                        sortedLeaderboard.map((item, index) => (
                                            <div 
                                                key={item.studentId}
                                                class={`p-3 rounded-2xl border flex items-center justify-between ${
                                                    item.studentId === studentId ? 'bg-indigo-50 border-indigo-300 ring-2 ring-indigo-200' : 'bg-slate-50 border-slate-100'
                                                }`}
                                            >
                                                <div class="flex items-center space-x-3">
                                                    <span class="text-base font-black w-6 text-center">
                                                        {index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `#${index + 1}`}
                                                    </span>
                                                    <span class="font-bold text-slate-800 text-sm">
                                                        {item.studentName} {item.studentId === studentId ? '(你)' : ''}
                                                    </span>
                                                </div>
                                                <span class="text-xs font-bold font-mono text-indigo-600">
                                                    ⚡ {item.duration} 秒
                                                </span>
                                            </div>
                                        ))
                                    )}
                                </div>

                                <button onClick={() => setShowLeaderboard(false)} class="w-full py-3 bg-slate-800 text-white rounded-xl font-bold text-sm">
                                    關閉
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StudentWhiteboardCanvas({ bgImage, isLocked, onSubmit, myResponse }) {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [color, setColor] = useState('#ef4444'); // Default red pen
            const [lineWidth, setLineWidth] = useState(4);

            // Setup canvas & background image
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                // Adjust resolution for crisp high-DPI displays
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = 360;

                // Clear & draw background image if provided (Feature 2)
                ctx.fillStyle = '#1e293b'; // Slate 800 background
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (bgImage) {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = () => {
                        // Draw background image fitted inside canvas
                        const hRatio = canvas.width / img.width;
                        const vRatio = canvas.height / img.height;
                        const ratio = Math.min(hRatio, vRatio);
                        const centerShiftX = (canvas.width - img.width * ratio) / 2;
                        const centerShiftY = (canvas.height - img.height * ratio) / 2;
                        ctx.drawImage(img, 0, 0, img.width, img.height, centerShiftX, centerShiftY, img.width * ratio, img.height * ratio);
                    };
                    img.src = bgImage;
                }
            }, [bgImage]);

            // Start Drawing
            const startDraw = (e) => {
                if (isLocked) return;
                setIsDrawing(true);
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const pos = getPos(e, canvas);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            };

            // Draw move
            const drawMove = (e) => {
                if (!isDrawing || isLocked) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const pos = getPos(e, canvas);
                ctx.strokeStyle = color;
                ctx.lineWidth = lineWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            // Stop drawing
            const stopDraw = () => {
                setIsDrawing(false);
            };

            const getPos = (e, canvas) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            };

            // Clear Whiteboard
            const handleClear = () => {
                if (isLocked) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (bgImage) {
                    const img = new Image();
                    img.onload = () => {
                        const hRatio = canvas.width / img.width;
                        const vRatio = canvas.height / img.height;
                        const ratio = Math.min(hRatio, vRatio);
                        const centerShiftX = (canvas.width - img.width * ratio) / 2;
                        const centerShiftY = (canvas.height - img.height * ratio) / 2;
                        ctx.drawImage(img, 0, 0, img.width, img.height, centerShiftX, centerShiftY, img.width * ratio, img.height * ratio);
                    };
                    img.src = bgImage;
                }
            };

            // Submit Canvas Data URL
            const handleCanvasSubmit = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                onSubmit(dataUrl);
            };

            return (
                <div class="space-y-4">
                    {/* Controls Bar */}
                    <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                        {/* Colors */}
                        <div class="flex items-center space-x-2">
                            {['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#ffffff', '#000000'].map((c) => (
                                <button
                                    key={c}
                                    type="button"
                                    onClick={() => setColor(c)}
                                    style={{ backgroundColor: c }}
                                    class={`w-7 h-7 rounded-full border-2 transition ${
                                        color === c ? 'ring-2 ring-indigo-500 scale-110' : 'border-slate-300'
                                    }`}
                                />
                            ))}
                        </div>

                        {/* Line Width */}
                        <div class="flex items-center space-x-2">
                            {[2, 4, 8].map((w) => (
                                <button
                                    key={w}
                                    type="button"
                                    onClick={() => setLineWidth(w)}
                                    class={`px-3 py-1 rounded-xl text-xs font-bold ${
                                        lineWidth === w ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border'
                                    }`}
                                >
                                    {w === 2 ? '細筆' : w === 4 ? '中筆' : '粗筆'}
                                </button>
                            ))}
                        </div>

                        <button
                            type="button"
                            onClick={handleClear}
                            disabled={isLocked}
                            class="px-3.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-xs font-bold border border-rose-200 transition"
                        >
                            🧹 清空白板
                        </button>
                    </div>

                    {/* Canvas Area */}
                    <div class="canvas-container relative rounded-2xl overflow-hidden shadow-inner border border-slate-300">
                        <canvas
                            ref={canvasRef}
                            onMouseDown={startDraw}
                            onMouseMove={drawMove}
                            onMouseUp={stopDraw}
                            onMouseLeave={stopDraw}
                            onTouchStart={startDraw}
                            onTouchMove={drawMove}
                            onTouchEnd={stopDraw}
                            class="w-full bg-slate-900 cursor-crosshair touch-none"
                        ></canvas>
                    </div>

                    <button
                        type="button"
                        disabled={isLocked}
                        onClick={handleCanvasSubmit}
                        class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-bold py-3.5 rounded-2xl shadow-lg transition active:scale-98"
                    >
                        {myResponse ? '修改白板作品並重新提交 🚀' : '提交白板作品 🚀'}
                    </button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
