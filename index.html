                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-lg w-full space-y-5 shadow-2xl">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="text-xl font-black text-slate-800">⏱️ 計時器工具</h3>
                                    <button onClick={() => setShowTimerModal(false)} class="text-slate-400 text-2xl font-bold">✕</button>
                                </div>

                                <div class="text-center bg-slate-900 text-white p-6 rounded-2xl space-y-2">
                                    <div class="text-xs text-slate-400 font-bold">倒數時間</div>
                                    <div class="font-mono font-black text-6xl text-amber-400 tracking-widest">
                                        {Math.floor(timerSeconds / 60).toString().padStart(2, '0')}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                    </div>
                                </div>

                                {/* Preset Buttons */}
                                <div class="flex flex-wrap gap-2 justify-center">
                                    {[
                                        { label: '30秒', sec: 30 },
                                        { label: '1分鐘', sec: 60 },
                                        { label: '2分鐘', sec: 120 },
                                        { label: '3分鐘', sec: 180 },
                                        { label: '4分鐘', sec: 240 },
                                        { label: '5分鐘', sec: 300 }
                                    ].map((item) => (
                                        <button 
                                            key={item.label}
                                            onClick={() => { setTimerSeconds(item.sec); setTimerActive(false); }}
                                            class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 font-bold text-xs text-slate-700"
                                        >
                                            {item.label}
                                        </button>
                                    ))}
                                </div>

                                {/* Manual 00:00 Input */}
                                <div class="flex items-center justify-center space-x-2 bg-slate-50 p-3 rounded-xl border">
                                    <span class="text-xs font-bold text-slate-600">手動輸入時間 (00:00)：</span>
                                    <input 
                                        type="number" min="0" max="59" value={timerMinsInput} 
                                        onChange={(e) => setTimerMinsInput(parseInt(e.target.value || 0))}
                                        class="w-12 border rounded text-center font-mono font-bold"
                                    />
                                    <span class="font-bold">:</span>
                                    <input 
                                        type="number" min="0" max="59" value={timerSecsInput} 
                                        onChange={(e) => setTimerSecsInput(parseInt(e.target.value || 0))}
                                        class="w-12 border rounded text-center font-mono font-bold"
                                    />
                                    <button 
                                        onClick={() => { setTimerSeconds(timerMinsInput * 60 + timerSecsInput); setTimerActive(false); }}
                                        class="px-3 py-1 bg-slate-800 text-white font-bold text-xs rounded-lg"
                                    >
                                        設定
                                    </button>
                                </div>

                                <div class="flex space-x-3">
                                    <button 
                                        onClick={() => setTimerActive(!timerActive)}
                                        class={`flex-1 py-3.5 rounded-xl font-black text-white text-base shadow-md ${timerActive ? 'bg-amber-600' : 'bg-emerald-600'}`}
                                    >
                                        {timerActive ? '⏸️ 暫停計時' : '▶️ 開始倒數'}
                                    </button>
                                    <button 
                                        onClick={() => { setTimerSeconds(0); setTimerActive(false); }}
                                        class="px-4 py-3 bg-slate-200 text-slate-700 font-bold rounded-xl text-sm"
                                    >
                                        歸零
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Student Interface Component
        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, studentsList, showToast, onExit }) {
            const [selectedAnswer, setSelectedAnswer] = useState('');
            const [shortAnswer, setShortAnswer] = useState('');
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [feedbackMsg, setFeedbackMsg] = useState('');
            const [startTime, setStartTime] = useState(Date.now());

            // Audio recording states
            const [isRecording, setIsRecording] = useState(false);
            const [audioBlob, setAudioBlob] = useState(null);
            const [audioUrl, setAudioUrl] = useState(null);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            // Challenge Mode Student Answers state
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [challengeRemainingSecs, setChallengeRemainingSecs] = useState(null);

            // Reset student state when active question changes
            useEffect(() => {
                setSelectedAnswer('');
                setShortAnswer('');
                setIsSubmitted(false);
                setFeedbackMsg('');
                setAudioBlob(null);
                setAudioUrl(null);
                setChallengeAnswers({});
                setStartTime(Date.now());

                if (activeQuestion?.mode === 'CHALLENGE' && activeQuestion.challenge?.timeLimit) {
                    setChallengeRemainingSecs(activeQuestion.challenge.timeLimit);
                }
            }, [activeQuestion?.id]);

            // Challenge timer auto-submit interval
            useEffect(() => {
                let interval = null;
                if (activeQuestion?.mode === 'CHALLENGE' && challengeRemainingSecs !== null && challengeRemainingSecs > 0 && !isSubmitted) {
                    interval = setInterval(() => {
                        setChallengeRemainingSecs(s => {
                            if (s <= 1) {
                                handleSubmitChallenge();
                                return 0;
                            }
                            return s - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [activeQuestion, challengeRemainingSecs, isSubmitted]);

            // Audio recording control
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const url = URL.createObjectURL(blob);
                        setAudioBlob(blob);
                        setAudioUrl(url);
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                } catch (e) {
                    console.error("Mic error:", e);
                    showToast("無法存取麥克風權限！", "error");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            // Generic Submit Handler
            const handleSubmitAnswer = async (ansVal) => {
                if (!ansVal && ansVal !== false) {
                    showToast("請先選擇或填寫答案！", "error");
                    return;
                }

                const duration = ((Date.now() - startTime) / 1000).toFixed(1);
                const appId = "omit-8c173";
                const db = window.fbDb;

                const resObj = {
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName,
                    questionId: activeQuestion.id,
                    answer: ansVal,
                    duration: duration,
                    submittedAt: Date.now()
                };

                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', `${activeQuestion.id}_${studentId}`);
                await window.fbUtils.setDoc(resDocRef, resObj);

                setIsSubmitted(true);
                setFeedbackMsg("已提交答案! 讚賞你的努力! 安靜等候老師指示...");
                playSound('win');
            };

            // Challenge Submission & Auto Grading
            const handleSubmitChallenge = async () => {
                if (isSubmitted) return;

                const duration = ((Date.now() - startTime) / 1000).toFixed(1);
                const questions = activeQuestion.challenge.questions || [];
                let correctCount = 0;

                questions.forEach((q, idx) => {
                    if (challengeAnswers[idx] === q.answer) {
                        correctCount++;
                    }
                });

                const totalQ = questions.length || 1;
                const totalScore = Math.round((correctCount / totalQ) * activeQuestion.challenge.totalScore);
                const percentage = Math.round((correctCount / totalQ) * 100);

                const appId = "omit-8c173";
                const db = window.fbDb;

                const resObj = {
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName,
                    questionId: activeQuestion.id,
                    answer: challengeAnswers,
                    scoreDetails: {
                        correctCount,
                        totalQuestions: totalQ,
                        totalScore,
                        percentage
                    },
                    duration: duration,
                    submittedAt: Date.now()
                };

                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', `${activeQuestion.id}_${studentId}`);
                await window.fbUtils.setDoc(resDocRef, resObj);

                setIsSubmitted(true);
                setFeedbackMsg("已提交答案! 讚賞你的努力! 安靜等候老師指示...");
                playSound('win');
            };

            // Cooperative Mode Answer Submission
            const handleCoopSubmitAnswer = async (chosenOpt) => {
                const coopStage = activeQuestion.coop?.stage;
                if (coopStage !== 'RACE') return;

                const groups = activeQuestion.coop?.groups || [];
                let myGroupIndex = -1;
                groups.forEach((g, idx) => {
                    if (g.members.some(m => m.id === studentId)) {
                        myGroupIndex = idx;
                    }
                });

                if (myGroupIndex === -1) return;

                const currentProg = activeQuestion.coop?.progress?.[myGroupIndex] || 0;
                const currentQ = activeQuestion.coop?.questions?.[currentProg];

                if (!currentQ) return;

                const isCorrect = chosenOpt === currentQ.answer;

                const appId = "omit-8c173";
                const db = window.fbDb;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', `${activeQuestion.id}_${studentId}_${Date.now()}`);

                await window.fbUtils.setDoc(resDocRef, {
                    studentId,
                    seatNumber,
                    name: studentName,
                    questionId: activeQuestion.id,
                    coopGroupIndex: myGroupIndex,
                    isCorrect,
                    chosenOpt,
                    submittedAt: Date.now()
                });

                if (isCorrect) {
                    showToast("🎉 答對了！團隊進度向前推進！", "success");
                    playSound('win');
                } else {
                    showToast("❌ 答錯扣至起點！請組員重新開始！", "error");
                    playSound('buzzer');
                }
            };

            // Determine Group Info for Coop Mode
            const myCoopGroup = useMemo(() => {
                if (!activeQuestion || activeQuestion.mode !== 'COOP') return null;
                const groups = activeQuestion.coop?.groups || [];
                for (let i = 0; i < groups.length; i++) {
                    if (groups[i].members.some(m => m.id === studentId)) {
                        return { ...groups[i], groupIndex: i };
                    }
                }
                return null;
            }, [activeQuestion, studentId]);

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col">
                    {/* Header */}
                    <header class="bg-indigo-700 text-white p-4 shadow-md flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <span class="font-black text-xl">OMIT</span>
                            <span class="text-xs bg-indigo-500/80 px-2 py-1 rounded-lg font-mono">房號: {roomCode}</span>
                        </div>
                        <div class="flex items-center space-x-3 text-sm font-bold">
                            <span>{seatNumber}號 {studentName}</span>
                            <button onClick={onExit} class="text-xs bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 rounded-lg">退出</button>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col justify-center space-y-4">

                        {/* Broadcast Submission Display */}
                        {activeQuestion?.broadcastedSubmission && (
                            <div class="bg-purple-900 text-white rounded-3xl p-5 shadow-2xl space-y-3 border-4 border-purple-400">
                                <div class="flex justify-between items-center border-b border-purple-700 pb-2">
                                    <span class="font-black text-sm text-purple-200">📢 老師廣播作品 (全班互評)</span>
                                    <span class="font-bold text-xs">{activeQuestion.broadcastedSubmission.name} ({activeQuestion.broadcastedSubmission.seatNumber}號)</span>
                                </div>
                                <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden">
                                    <img src={activeQuestion.broadcastedSubmission.answer} class="w-full h-full object-contain" alt="廣播作品" />
                                </div>
                            </div>
                        )}

                        {/* Active Question Display */}
                        {activeQuestion ? (
                            <div class="bg-white rounded-3xl p-6 shadow-lg border border-slate-200 space-y-6">

                                {/* Question Title */}
                                <div class="space-y-1 border-b pb-4">
                                    <div class="flex justify-between items-center">
                                        <span class="text-xs font-black text-indigo-600 uppercase tracking-wider">
                                            [{getModeLabel(activeQuestion.mode)}]
                                        </span>
                                        {activeQuestion.mode === 'CHALLENGE' && challengeRemainingSecs !== null && (
                                            <span class={`font-mono font-bold text-sm px-3 py-1 rounded-full ${challengeRemainingSecs <= 10 ? 'bg-red-500 text-white animate-pulse' : 'bg-amber-100 text-amber-800'}`}>
                                                ⏱️ 倒數：{Math.floor(challengeRemainingSecs / 60)}:{(challengeRemainingSecs % 60).toString().padStart(2, '0')}
                                            </span>
                                        )}
                                    </div>
                                    <h2 class="text-xl font-black text-slate-800">{activeQuestion.text}</h2>
                                </div>

                                {/* Student Answer Forms */}

                                {/* Choice / True False Question */}
                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div class="space-y-4">
                                        <div class="grid grid-cols-1 gap-3">
                                            {activeQuestion.choiceOptions.map((opt) => (
                                                <button 
                                                    key={opt}
                                                    disabled={isSubmitted}
                                                    onClick={() => setSelectedAnswer(opt)}
                                                    class={`p-4 rounded-2xl font-black text-lg border-2 text-left transition flex justify-between items-center ${
                                                        selectedAnswer === opt 
                                                        ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' 
                                                        : 'bg-slate-50 text-slate-800 border-slate-200 hover:border-indigo-300'
                                                    }`}
                                                >
                                                    <span>{opt}</span>
                                                    {selectedAnswer === opt && <span>✓</span>}
                                                </button>
                                            ))}
                                        </div>

                                        <button 
                                            disabled={isSubmitted || !selectedAnswer}
                                            onClick={() => handleSubmitAnswer(selectedAnswer)}
                                            class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-black rounded-2xl shadow-lg text-lg transition active:scale-98"
                                        >
                                            確認提交
                                        </button>
                                    </div>
                                )}

                                {/* Short Answer */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div class="space-y-4">
                                        <textarea 
                                            disabled={isSubmitted}
                                            placeholder="請輸入您的回答..."
                                            value={shortAnswer}
                                            onChange={(e) => setShortAnswer(e.target.value)}
                                            rows={4}
                                            class="w-full p-4 rounded-2xl border border-slate-300 font-medium text-slate-800 focus:ring-2 focus:ring-indigo-500"
                                        />
                                        <button 
                                            disabled={isSubmitted || !shortAnswer.trim()}
                                            onClick={() => handleSubmitAnswer(shortAnswer.trim())}
                                            class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-black rounded-2xl shadow-lg text-lg transition active:scale-98"
                                        >
                                            確認提交
                                        </button>
                                    </div>
                                )}

                                {/* Whiteboard Question */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <WhiteboardCanvas 
                                        bgImage={activeQuestion.whiteboardBg}
                                        onSave={(imgData) => handleSubmitAnswer(imgData)}
                                    />
                                )}

                                {/* Audio Recording Question */}
                                {activeQuestion.mode === 'AUDIO' && (
                                    <div class="space-y-4 text-center">
                                        {!audioUrl ? (
                                            <button 
                                                onClick={isRecording ? stopRecording : startRecording}
                                                class={`w-full py-6 rounded-3xl font-black text-xl shadow-lg transition flex items-center justify-center space-x-2 ${
                                                    isRecording ? 'bg-red-500 text-white animate-pulse' : 'bg-cyan-600 text-white hover:bg-cyan-700'
                                                }`}
                                            >
                                                <span>{isRecording ? '⏹️ 停止錄音' : '🎤 開始錄音'}</span>
                                            </button>
                                        ) : (
                                            <div class="space-y-4 bg-cyan-50 p-4 rounded-2xl border border-cyan-200">
                                                <div class="font-bold text-xs text-cyan-900">試聽錄音：</div>
                                                <audio src={audioUrl} controls class="w-full h-10 rounded-lg" />
                                                <div class="flex space-x-2">
                                                    <button 
                                                        onClick={() => { setAudioBlob(null); setAudioUrl(null); }}
                                                        class="w-1/2 py-3 bg-rose-100 text-rose-700 font-bold rounded-xl text-sm"
                                                    >
                                                        🗑️ 刪除重錄
                                                    </button>
                                                    <button 
                                                        onClick={() => {
                                                            const reader = new FileReader();
                                                            reader.onload = (evt) => handleSubmitAnswer(evt.target.result);
                                                            reader.readAsDataURL(audioBlob);
                                                        }}
                                                        class="w-1/2 py-3 bg-emerald-600 text-white font-bold rounded-xl text-sm shadow"
                                                    >
                                                        ✅ 確認提交錄音
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Buzzer Question */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div class="text-center py-6">
                                        <button 
                                            disabled={isSubmitted}
                                            onClick={() => handleSubmitAnswer('BUZZ_PRESSED')}
                                            class="w-48 h-48 rounded-full bg-gradient-to-br from-rose-500 to-red-600 text-white font-black text-3xl shadow-2xl active:scale-90 transition border-8 border-rose-200 animate-pulse mx-auto flex items-center justify-center"
                                        >
                                            🚨 搶答！
                                        </button>
                                    </div>
                                )}

                                {/* Pushed Link / YouTube Video */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div class="space-y-4 text-center">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div class="aspect-16-9 w-full rounded-2xl overflow-hidden border">
                                                <iframe src={activeQuestion.youtubeEmbed} class="w-full h-full" allowFullScreen></iframe>
                                            </div>
                                        ) : (
                                            <div class="p-6 bg-amber-50 rounded-2xl border border-amber-200 font-mono text-xs break-all text-amber-900">
                                                {activeQuestion.pushedUrl}
                                            </div>
                                        )}
                                        {activeQuestion.pushedUrl && (
                                            <a 
                                                href={activeQuestion.pushedUrl} target="_blank" rel="noreferrer"
                                                class="inline-block px-6 py-3 bg-indigo-600 text-white font-bold rounded-xl shadow hover:bg-indigo-700 text-sm"
                                            >
                                                開啟連結網站 ↗
                                            </a>
                                        )}
                                    </div>
                                )}

                                {/* Challenge Question Mode */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                    <div class="space-y-6">
                                        <div class="space-y-4">
                                            {activeQuestion.challenge.questions.map((q, qIdx) => (
                                                <div key={qIdx} class="bg-slate-50 p-4 rounded-2xl border space-y-2">
                                                    <div class="font-bold text-slate-800 text-sm">
                                                        第 {q.num || qIdx + 1} 題：{q.text}
                                                    </div>
                                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                        {q.options.map((opt) => {
                                                            const isSelected = challengeAnswers[qIdx] === opt.letter;
                                                            return (
                                                                <button 
                                                                    key={opt.letter}
                                                                    disabled={isSubmitted}
                                                                    onClick={() => setChallengeAnswers({ ...challengeAnswers, [qIdx]: opt.letter })}
                                                                    class={`p-2.5 rounded-xl text-left text-xs font-bold border transition ${
                                                                        isSelected ? 'bg-amber-500 text-white border-amber-600' : 'bg-white text-slate-700'
                                                                    }`}
                                                                >
                                                                    {opt.letter}. {opt.text}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        {!isSubmitted && (
                                            <button 
                                                onClick={handleSubmitChallenge}
                                                class="w-full py-4 bg-emerald-600 text-white font-black text-lg rounded-2xl shadow-lg"
                                            >
                                                確認提交挑戰題評估
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Cooperative Mode Student Screen */}
                                {activeQuestion.mode === 'COOP' && myCoopGroup && (
                                    <div class="space-y-4">
                                        <div class={`p-4 rounded-2xl border-2 ${myCoopGroup.color} space-y-1`}>
                                            <div class="font-black text-lg flex items-center gap-2">
                                                <span>{myCoopGroup.emoji}</span>
                                                <span>{myCoopGroup.name}</span>
                                            </div>
                                            <p class="text-xs font-bold opacity-90">
                                                盡快與你的組員會合!比賽即將開始!
                                            </p>
                                        </div>

                                        {activeQuestion.coop?.stage === 'RACE' && (
                                            <div class="space-y-4">
                                                {(() => {
                                                    const currentProg = activeQuestion.coop?.progress?.[myCoopGroup.groupIndex] || 0;
                                                    const qObj = activeQuestion.coop?.questions?.[currentProg];

                                                    if (!qObj) return <div class="text-center font-bold py-6">🎉 恭喜！已完成所有合作題目！</div>;

                                                    // Role split display
                                                    const members = myCoopGroup.members;
                                                    const myIndexInGroup = members.findIndex(m => m.id === studentId);

                                                    return (
                                                        <div class="space-y-4 bg-white p-4 rounded-2xl border border-slate-200">
                                                            <div class="text-xs font-bold text-slate-400">
                                                                第 {currentProg + 1} 題 / 共 {activeQuestion.coop?.questions?.length} 題
                                                            </div>

                                                            {/* Cooperative Information Split Mechanics */}
                                                            {myIndexInGroup === 0 ? (
                                                                <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-200 space-y-1">
                                                                    <div class="text-xs font-bold text-indigo-600">📜 你的螢幕任務 (題目內容)：</div>
                                                                    <div class="text-lg font-black text-slate-800">{qObj.text}</div>
                                                                    <p class="text-xs text-indigo-500 font-bold">請朗讀題目給組員聽，由組員核對答案！</p>
                                                                </div>
                                                            ) : (
                                                                <div class="bg-amber-50 p-4 rounded-2xl border border-amber-200 space-y-1">
                                                                    <div class="text-xs font-bold text-amber-800">🅰️ 你的螢幕任務 (選項作答區)：</div>
                                                                    <div class="grid grid-cols-2 gap-2 pt-2">
                                                                        {qObj.options.map(opt => (
                                                                            <button 
                                                                                key={opt.letter}
                                                                                onClick={() => handleCoopSubmitAnswer(opt.letter)}
                                                                                class="p-3 bg-white hover:bg-amber-100 border border-amber-300 rounded-xl font-bold text-sm text-amber-900 shadow-sm active:scale-95 transition"
                                                                            >
                                                                                {opt.letter}. {opt.text}
                                                                            </button>
                                                                        ))}
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })()}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Revision Item 6: Unified Submission Praise Message */}
                                {isSubmitted && feedbackMsg && (
                                    <div class="bg-emerald-500 text-white p-5 rounded-2xl text-center space-y-1 shadow-lg animate-bounce">
                                        <div class="text-2xl font-black">🎉 {feedbackMsg}</div>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div class="bg-white rounded-3xl p-12 text-center space-y-3 shadow-md border">
                                <div class="text-5xl animate-bounce">⏳</div>
                                <h3 class="text-lg font-black text-slate-700">課堂準備中...</h3>
                                <p class="text-xs text-slate-400">請安靜等候老師發佈題目</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
