    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // Mode label helper
        function getModeLabel(mode) {
            switch(mode) {

        }

        // Default prompt text
        function getDefaultQuestionPrompt(mode) {
            switch(mode) {
                case 'CHOICE': return '請選擇正確答案：';
                case 'TF': return '請判斷下列描述是否正確：';

                case 'DRAW': return '請在白板上作答或繪圖：';
                case 'BUZZER': return '請準備點擊搶答按鈕！';
                case 'AUDIO': return '請錄製不多於10秒的語音回答：';
                case 'CHALLENGE': return '請在限時內完成以下挑戰題評估：';
                case 'COOP': return '請與你的組員合作完成問題！';
                case 'LINK': return '請點擊或觀看下方派送內容：';
                default: return '請回答問題：';
            }
        }

        // Sound Synthesis (Web Audio API)
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                    });
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, ctx.currentTime);
                    osc.frequency.setValueAtTime(120, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.35);
                }
            } catch (e) {
                console.error("Audio synth error:", e);
            }
        };

        // Synthesize dynamic background race music for teacher
        const createRaceMusicSynthesizer = () => {
            let ctx = null;
            let timer = null;
            let isPlaying = false;

            const notes = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23, 392.00];
            let noteIdx = 0;

            return {
                start: () => {
                    if (isPlaying) return;
                    isPlaying = true;
                    ctx = new (window.AudioContext || window.webkitAudioContext)();
                    timer = setInterval(() => {
                        if (!ctx || ctx.state === 'closed') return;
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(notes[noteIdx % notes.length], ctx.currentTime);
                        gain.gain.setValueAtTime(0.08, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.2);
                        noteIdx++;
                    }, 220);
                },
                stop: () => {
                    isPlaying = false;
                    if (timer) clearInterval(timer);
                    if (ctx) ctx.close();
                },
                toggle: () => {
                    if (isPlaying) {
                        this.stop();
                    } else {
                        this.start();
                    }
                }
            };
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (
                <div class={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-2 text-sm font-bold animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        // Create docx blob using JSZip
        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) throw new Error("JSZip is missing.");
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>${paragraphsXml}</w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        // Parse challenge Word / text format
        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];
            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) questions.push(currentQ);
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }
                    currentQ.options.push({ letter, text: optText });
                    if (isCorrect) currentQ.answer = letter;
                }
            });

            if (currentQ && currentQ.options.length > 0) questions.push(currentQ);

            if (questions.length === 0) {
                return {
                    title: "地球生病了",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1,
                            text: "以下哪一項不是地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "機械資源" }
                            ],
                            answer: "D"
                        },
                        {
                            num: 2,
                            text: "芝士的原料屬於哪一項地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "礦產資源" }
                            ],
                            answer: "C"
                        }
                    ]
                };
            }

            return { title, totalScore, questions };
        };

        // Item 1 & 21: High-precision Canvas Component for iPad & Touch Devices
        const WhiteboardCanvas = ({ initialBg, onSave, isTeacher, onLiveBroadcast }) => {
            const canvasRef = useRef(null);
            const [strokeWidth, setStrokeWidth] = useState(4);
            const [strokeColor, setStrokeColor] = useState('#2563eb');
            const [isEraser, setIsEraser] = useState(false);
            const [isDrawing, setIsDrawing] = useState(false);
            const bgImageRef = useRef(null);

            // Fixed internal resolution 1280x720
            const CANVAS_WIDTH = 1280;
            const CANVAS_HEIGHT = 720;

            const redrawCanvas = useCallback(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                if (bgImageRef.current) {
                    ctx.drawImage(bgImageRef.current, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                }
            }, []);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                canvas.width = CANVAS_WIDTH;
                canvas.height = CANVAS_HEIGHT;

                if (initialBg) {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.src = initialBg;
                    img.onload = () => {
                        bgImageRef.current = img;
                        redrawCanvas();
                    };
                } else {
                    redrawCanvas();
                }
            }, [initialBg, redrawCanvas]);

            // Transform viewport coordinates to 1280x720 formula
            const getCanvasCoords = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const scaleX = CANVAS_WIDTH / rect.width;
                const scaleY = CANVAS_HEIGHT / rect.height;

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                setIsDrawing(true);
                const { x, y } = getCanvasCoords(e);
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const { x, y } = getCanvasCoords(e);
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');

                ctx.lineWidth = strokeWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (isEraser) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.globalCompositeOperation = 'destination-out';
                } else {
                    ctx.strokeStyle = strokeColor;
                    ctx.globalCompositeOperation = 'source-over';
                }

                ctx.lineTo(x, y);
                ctx.stroke();

                if (isTeacher && onLiveBroadcast) {
                    onLiveBroadcast(canvas.toDataURL('image/png'));
                }
            };

            const stopDrawing = () => {
                if (!isDrawing) return;
                setIsDrawing(false);
                const canvas = canvasRef.current;
                if (canvas && isTeacher && onLiveBroadcast) {
                    onLiveBroadcast(canvas.toDataURL('image/png'));
                }
            };

            const handleClear = () => {
                redrawCanvas();
                if (isTeacher && onLiveBroadcast) {
                    onLiveBroadcast(canvasRef.current.toDataURL('image/png'));
                }
            };

            const handleBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const img = new Image();
                        img.src = evt.target.result;
                        img.onload = () => {
                            bgImageRef.current = img;
                            redrawCanvas();
                        };
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleConfirmSubmit = () => {
                if (canvasRef.current && onSave) {
                    onSave(canvasRef.current.toDataURL('image/png'));
                }
            };

            return (
                <div class="space-y-3 w-full">
                    <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-800 text-white p-3 rounded-2xl">
                        <div class="flex flex-wrap items-center gap-3 text-xs md:text-sm">
                            <span class="font-bold">筆觸粗細 ({strokeWidth}px)：</span>
                            <input 
                                type="range" 
                                min="2" 
                                max="18" 
                                value={strokeWidth} 
                                onChange={(e) => setStrokeWidth(parseInt(e.target.value))}
                                class="w-24 accent-indigo-400 cursor-pointer"
                            />

                            <div class="flex items-center space-x-1.5 ml-2">
                                {['#2563eb', '#dc2626', '#16a34a', '#000000', '#9333ea'].map((c) => (
                                    <button 
                                        key={c} 
                                        onClick={() => { setStrokeColor(c); setIsEraser(false); }}
                                        class={`w-6 h-6 rounded-full border-2 transition ${!isEraser && strokeColor === c ? 'scale-125 border-white ring-2 ring-indigo-400' : 'border-transparent'}`}
                                        style={{ backgroundColor: c }}
                                    />
                                ))}
                            </div>

                            <button 
                                onClick={() => setIsEraser(!isEraser)}
                                class={`px-3 py-1.5 rounded-xl font-bold transition flex items-center gap-1 ${isEraser ? 'bg-amber-500 text-white' : 'bg-slate-700 text-slate-200 hover:bg-slate-600'}`}
                            >
                                🧽 擦膠
                            </button>

                            <button 
                                onClick={handleClear}
                                class="px-3 py-1.5 rounded-xl bg-red-600/80 hover:bg-red-600 text-white font-bold transition flex items-center gap-1"
                            >
                                🗑️ 一鍵清空
                            </button>
                        </div>

                        {!isTeacher && (
                            <label class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-1.5 rounded-xl font-bold text-xs cursor-pointer transition flex items-center gap-1">
                                🖼️ 上載圖片作答背景
                                <input type="file" accept="image/*" onChange={handleBgUpload} class="hidden" />
                            </label>
                        )}
                    </div>

                    <div class="relative w-full aspect-16-9 bg-white rounded-2xl overflow-hidden border-4 border-slate-200 shadow-inner canvas-container">
                        <canvas 
                            ref={canvasRef}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            class="w-full h-full cursor-crosshair touch-none block"
                        />
                    </div>

                    {!isTeacher && onSave && (
                        <button 
                            onClick={handleConfirmSubmit}
                            class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-base rounded-2xl shadow-lg transition active:scale-98 flex items-center justify-center space-x-2"
                        >
                            <span>✅ 確認提交白板答案</span>
                        </button>
                    )}
                </div>
            );
        };

        // Main Application
        function OMITApp() {
            const [role, setRole] = useState('LANDING'); // 'LANDING', 'TEACHER', 'STUDENT'
            const [roomCode, setRoomCode] = useState('');
            const [seatNumber, setSeatNumber] = useState('1');
            const [studentName, setStudentName] = useState('');
            const [teacherPassword, setTeacherPassword] = useState('');
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [toast, setToast] = useState(null);

            const [activeQuestion, setActiveQuestion] = useState(null);
            const [studentsList, setStudentsList] = useState([]);
            const [responses, setResponses] = useState({});
            const [historyQuestions, setHistoryQuestions] = useState([]);
            const [isAuthReady, setIsAuthReady] = useState(false);

            const myStudentId = useRef('std_' + Math.random().toString(36).substring(2, 9));

            const showToast = (message, type = 'info') => setToast({ message, type });

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (window.fbUtils && window.fbAuth) {
                            await window.fbUtils.signInAnonymously(window.fbAuth);
                            setIsAuthReady(true);
                        }
                    } catch (err) {
                        console.error("Firebase auth error:", err);
                    }
                };
                initAuth();
            }, []);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const roomParam = params.get('room');

        // Teacher Dashboard Component
        function TeacherDashboard({ roomCode, activeQuestion, setActiveQuestion, responses, studentsList, historyQuestions, showToast, onExit }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE');
            const [questionText, setQuestionText] = useState('');
            const [choiceCount, setChoiceCount] = useState(4);
            const [lockAfterSubmit, setLockAfterSubmit] = useState(true);
            const [whiteboardBg, setWhiteboardBg] = useState(null);
            const [pushedUrl, setPushedUrl] = useState('');

            // Modals
            const [showQRModal, setShowQRModal] = useState(false);
            const [showStudentListModal, setShowStudentListModal] = useState(false);
            const [showInspectModal, setShowInspectModal] = useState(null);
            const [barChoiceFilter, setBarChoiceFilter] = useState(null);

            // Revision Item 21: Fullscreen Teacher Whiteboard Demonstration Modal
            const [showTeacherDemoWhiteboard, setShowTeacherDemoWhiteboard] = useState(false);

            // Revision Item 9: Random Student Selector
            const [showRandomModal, setShowRandomModal] = useState(false);
            const [rangeStart, setRangeStart] = useState(1);
            const [rangeEnd, setRangeEnd] = useState(36);
            const [drawnNumbers, setDrawnNumbers] = useState([]);
            const [currentDrawn, setCurrentDrawn] = useState(null);
            const [isSpinning, setIsSpinning] = useState(false);

            // Revision Item 10: Timer Tool
            const [showTimerModal, setShowTimerModal] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerActive, setTimerActive] = useState(false);
            const [timerZoomed, setTimerZoomed] = useState(false);
            const [customTimerMinutes, setCustomTimerMinutes] = useState(0);
            const [customTimerSecs, setCustomTimerSecs] = useState(0);

            // Challenge setup
            const [challengeData, setChallengeData] = useState(null);
            const [challengeEnableTimer, setChallengeEnableTimer] = useState(true);
            const [challengeTimeLimit, setChallengeTimeLimit] = useState(120);
            const [challengeReleaseInstant, setChallengeReleaseInstant] = useState(true);
            const [showChallengeScoresOnLeaderboard, setShowChallengeScoresOnLeaderboard] = useState(true);

            // Revision Item 22: Team Collaboration Game Mode State
            const [coopStage, setCoopStage] = useState('PREP'); // 'PREP', 'GROUPING', 'RACING'
            const [coopTeams, setCoopTeams] = useState([]); // [{ id, name, emoji, color, members: [], progress: 0 }]
            const [coopMusicPlaying, setCoopMusicPlaying] = useState(false);
            const raceMusicSynthRef = useRef(null);

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

            // Current question responses
            const currentQuestionResponses = useMemo(() => {
                if (!activeQuestion) return {};
                const filtered = {};
                Object.values(responses).forEach(r => {
                    if (r.questionId === activeQuestion.id) filtered[r.studentId] = r;
                });
                return filtered;
            }, [responses, activeQuestion]);

            // Timer Interval
            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(s => {
                            if (s <= 1) {
                                setTimerActive(false);
                                playSound('alarm');
                                return 0;
                            }
                            return s - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            const publishQuestionToFirestore = async (qObj) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: qObj, updatedAt: Date.now() }, { merge: true });
            };

            const handleExitRoom = async () => {
                if (window.confirm("確定退出課室？將會清空此課室的所有資料。")) {
                    onExit();
                }
            };

            // Revision Item 12: Download docx Challenge Template
            const handleDownloadChallengeTemplate = async () => {
                const sampleLines = [
                    "標題：地球生病了",
                    "總分: 100分",
                    "1.以下哪一項不是地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源",
                    "D. 機械資源*",
                    "",
                    "2.芝士的原料屬於哪一項地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源*",
                    "D. 礦產資源",
                    "",
                    "3.人們不當使用水資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應*",
                    "",
                    "4.人們不當使用煤和石油資源會造成甚麼後果?",
                    "A. 引發極端天氣*",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應",
                    "",
                    "5.人們不當使用土地資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災*",
                    "C. 產生大量二氧化碳",
                    "D. 影響食水供應"
                ];

                try {
                    const blob = await createWordDocxBlob(sampleLines);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = '下載評估範本Word檔.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast("已下載評估範本 Word 檔 (.docx)！", "success");
                } catch (err) {
                    showToast("Word 範本生成失敗", "error");
                }
            };

            const handleWordFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const result = await window.mammoth.extractRawText({ arrayBuffer: evt.target.result });
                            parsedData = parseWordChallengeText(result.value);
                        } else {
                            parsedData = parseWordChallengeText(evt.target.result);
                        }
                        setChallengeData(parsedData);
                        showToast(`已成功解析評估 Word 檔！共 ${parsedData.questions.length} 題`, 'success');
                    } catch (err) {
                        showToast("文件解析失敗！", "error");
                    }
                };

                if (file.name.endsWith('.docx')) {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file, "UTF-8");
                }
            };

            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                
                let challengeContent = null;
                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請上載評估範本 Word 檔！", "error");
                        return;
                    }
                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent
                };

                publishQuestionToFirestore(newQ);
                showToast(`已成功發佈【${getModeLabel(selectedMode)}】！`, 'success');
            };

            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已向全班一併發放挑戰題成績！", "success");
            };

            // Revision Item 2: Broadcast / Cancel Broadcast Whiteboard Submission
            const handleBroadcastSubmission = async (studentRes) => {
                const updatedQ = { ...activeQuestion, broadcastedSubmission: studentRes };
                await publishQuestionToFirestore(updatedQ);
                showToast(`已廣播 ${studentRes.name} 的作品至全班！`, "success");
            };

            const handleCancelBroadcast = async () => {
                const updatedQ = { ...activeQuestion, broadcastedSubmission: null };
                await publishQuestionToFirestore(updatedQ);
                showToast("已取消廣播作品", "info");
            };

            // Revision Item 21: Live Broadcast Teacher Canvas Demonstration
            const handleLiveBroadcastTeacherCanvas = async (dataUrl) => {
                if (!activeQuestion) {
                    const teacherQ = {
                        id: 'teacher_board_' + Date.now(),
                        mode: 'DRAW',
                        text: '👨‍🏫 教師白板示範',
                        startTime: Date.now(),
                        broadcastedSubmission: {
                            studentId: 'teacher',
                            name: '老師白板示範',
                            seatNumber: '0',
                            answer: dataUrl
                        }
                    };
                    await publishQuestionToFirestore(teacherQ);
                } else {
                    const updatedQ = {
                        ...activeQuestion,
                        broadcastedSubmission: {
                            studentId: 'teacher',
                            name: '老師白板示範',
                            seatNumber: '0',
                            answer: dataUrl
                        }
                    };
                    await publishQuestionToFirestore(updatedQ);
                }
            };

            // Revision Item 22: Team Collaboration Game Logic
            const handleStartCoopGrouping = () => {
                if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                    showToast("請先在上載評估 Word 檔！", "error");
                    return;
                }

                if (studentsList.length < 2) {
                    showToast("請至少等待 2 位學生加入課堂再發起合作題！", "error");
                    return;
                }

                const animals = [
                    { name: '老虎組', emoji: '🐯', color: '#f97316' },
                    { name: '大象組', emoji: '🐘', color: '#64748b' },
                    { name: '企鵝組', emoji: '🐧', color: '#0284c7' },
                    { name: '藍鯨組', emoji: '🐋', color: '#2563eb' },
                    { name: '白兔組', emoji: '🐰', color: '#ec4899' },
                    { name: '熊貓組', emoji: '🐼', color: '#1e293b' },
                    { name: '獅子組', emoji: '🦁', color: '#eab308' },
                    { name: '白羊組', emoji: '🐑', color: '#a855f7' },
                    { name: '水牛組', emoji: '🐃', color: '#78350f' },
                    { name: '斑馬組', emoji: '🦓', color: '#475569' }
                ];

                const shuffledAnimals = [...animals].sort(() => 0.5 - Math.random());
                const shuffledStudents = [...studentsList].sort(() => 0.5 - Math.random());

                const groupCount = Math.max(2, Math.ceil(studentsList.length / 3));
                const teams = [];

                for (let i = 0; i < groupCount; i++) {
                    const animal = shuffledAnimals[i % shuffledAnimals.length];
                    teams.push({
                        id: 'team_' + i,
                        name: animal.name,
                        emoji: animal.emoji,
                        color: animal.color,
                        members: [],
                        progress: 0
                    });
                }

                shuffledStudents.forEach((stu, idx) => {
                    teams[idx % groupCount].members.push(stu);
                });

                setCoopTeams(teams);
                setCoopStage('GROUPING');

                // Send grouping notice to students
                const coopQ = {
                    id: 'coop_' + Date.now(),
                    mode: 'COOP',
                    text: `🤝 合作題：${challengeData.title}`,
                    startTime: Date.now(),
                    coopStage: 'GROUPING',
                    coopTeams: teams,
                    challenge: challengeData
                };

                publishQuestionToFirestore(coopQ);
                showToast("已成功分組並發送組別資訊給學生！", "success");
            };

            const handleStartCoopRace = () => {
                setCoopStage('RACING');
                const coopQ = {
                    id: activeQuestion.id,
                    mode: 'COOP',
                    text: `🏎️ 合作題比賽中：${challengeData.title}`,
                    startTime: Date.now(),
                    coopStage: 'RACING',
                    coopTeams: coopTeams,
                    challenge: challengeData
                };
                publishQuestionToFirestore(coopQ);

                if (!raceMusicSynthRef.current) {
                    raceMusicSynthRef.current = createRaceMusicSynthesizer();
                }
                raceMusicSynthRef.current.start();
                setCoopMusicPlaying(true);

                showToast("比賽開始！背景音樂已啟動！", "success");
            };

            const toggleCoopMusic = () => {
                if (!raceMusicSynthRef.current) {
                    raceMusicSynthRef.current = createRaceMusicSynthesizer();
                }
                if (coopMusicPlaying) {
                    raceMusicSynthRef.current.stop();
                    setCoopMusicPlaying(false);
                } else {
                    raceMusicSynthRef.current.start();
                    setCoopMusicPlaying(true);
                }
            };

            // Revision Item 9: Random Selector logic
            const handleSpinRandom = () => {
                if (isSpinning) return;
                const start = parseInt(rangeStart) || 1;
                const end = parseInt(rangeEnd) || 36;
                const available = [];
                for (let i = start; i <= end; i++) {
                    if (!drawnNumbers.includes(i)) available.push(i);
                }

                if (available.length === 0) {
                    showToast("該範圍學號已全部抽出！", "error");
                    return;
                }

                setIsSpinning(true);
                let counter = 0;
                const timer = setInterval(() => {
                    const temp = available[Math.floor(Math.random() * available.length)];
                    setCurrentDrawn(temp);
                    playSound('spin');
                    counter++;

                    if (counter >= 18) {
                        clearInterval(timer);
                        const finalPicked = available[Math.floor(Math.random() * available.length)];
                        setCurrentDrawn(finalPicked);
                        setDrawnNumbers(prev => [...prev, finalPicked]);
                        setIsSpinning(false);
                        playSound('win');
                    }
                }, 100);
            };

            // Revision Item 17 & 20: Export CSV
            const handleExportCSVReport = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生紀錄！", "error");
                    return;
                }

                let csvContent = "\uFEFF學號,學生姓名,加入時間";

                historyQuestions.forEach((q, idx) => {
                    if (q.mode === 'CHALLENGE' && q.challenge) {
                        csvContent += `,第${idx + 1}題[挑戰題:${q.challenge.title}得分],第${idx + 1}題[正確率]`;
                    } else {
                        csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]`;
                    }
                });
                csvContent += "\n";

                const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

                sortedStudents.forEach((stu) => {
                    csvContent += `"${stu.seatNumber}號","${stu.name || ''}","${stu.joinTime || ''}"`;
                    historyQuestions.forEach((q) => {
                        const resKey = `${q.id}_${stu.id}`;
                        const res = responses[resKey];
                        if (res && res.answer !== undefined) {
                            if (q.mode === 'CHALLENGE' && res.scoreDetails) {
                                csvContent += `,"${res.scoreDetails.totalScore}/${q.challenge.totalScore}分","${res.scoreDetails.percentage}% (用時:${res.duration || 0}s)"`;
                            } else {
                                let ansVal = String(res.answer).replace(/"/g, '""');
                                if (ansVal.startsWith('data:image')) ansVal = '[圖像白板]';
                                if (ansVal.startsWith('data:audio')) ansVal = '[語音錄音]';
                                csvContent += `,"${ansVal} (${res.duration || 0}s)"`;
                            }
                        } else {
                            csvContent += `,"未作答"`;
                        }
                    });
                    csvContent += "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `OMIT_課堂成績報告_房號${roomCode}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("成績報告 CSV 試算表已成功匯出！", "success");
            };

            // Revision Item 7 & 18: Leaderboard
            const leaderboard = useMemo(() => {
                const list = Object.values(currentQuestionResponses).filter(r => r.duration !== undefined);
                
                if (activeQuestion?.mode === 'BUZZER') {
                    // Item 18: Buzzer locks only the fastest 1st student
                    return list.sort((a, b) => parseFloat(a.duration) - parseFloat(b.duration)).slice(0, 1);
                }

                return list.sort((a, b) => {
                    if (activeQuestion?.mode === 'CHALLENGE') {
                        const scoreA = a.scoreDetails?.totalScore || 0;
                        const scoreB = b.scoreDetails?.totalScore || 0;
                        if (scoreB !== scoreA) return scoreB - scoreA;
                    }
                    return parseFloat(a.duration) - parseFloat(b.duration);
                });
            }, [currentQuestionResponses, activeQuestion]);

            return (
                <div class="min-h-screen pb-12">
                    {/* Revision Item 9: Header Title */}
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 py-3">
                        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                            <div class="flex items-center space-x-3">
                                <span class="bg-indigo-600 text-white font-black px-3 py-1.5 rounded-xl text-lg shadow-sm">OMIT</span>
                                <div>
                                    <h1 class="font-black text-slate-800 text-base md:text-lg flex items-center gap-2">
                                        宣道會陳元喜小學OMIT互動課堂
                                        <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1 rounded-full font-mono font-bold">
                                            房號：{roomCode}
                                        </span>
                                    </h1>
                                </div>
                            </div>

                            <div class="flex flex-wrap items-center gap-2">
                                {/* Revision Item 11: Real-time Online Badge & QR Code */}
                                <button 
                                    onClick={() => setShowQRModal(true)}
                                    class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-2 rounded-xl border border-indigo-200 text-sm transition flex items-center space-x-1.5"
                                >
                                    <span>📱 QR Code</span>
                                    <span class="bg-indigo-600 text-white text-xs px-2 py-0.5 rounded-full font-mono font-bold">
                                        在線:{studentsList.length}人
                                    </span>
                                </button>

                                {/* Revision Item 21: Fullscreen Demonstration Whiteboard Button */}
                                <button 
                                    onClick={() => setShowTeacherDemoWhiteboard(true)}
                                    class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-3 py-2 rounded-xl text-sm transition shadow flex items-center space-x-1"
                                >
                                    <span>🎨 示範白板</span>
                                </button>

                                {/* Revision Item 9: Random Selector Button */}
                                <button 
                                    onClick={() => setShowRandomModal(true)}
                                    class="bg-amber-50 hover:bg-amber-100 text-amber-800 font-bold px-3 py-2 rounded-xl border border-amber-200 text-sm transition"
                                >
                                    🎲 抽選學生
                                </button>

                                {/* Revision Item 10: Timer Tool Button */}
                                <button 
                                    onClick={() => setShowTimerModal(true)}
                                    class={`px-3 py-2 rounded-xl border text-sm font-bold transition flex items-center space-x-1.5 ${
                                        timerActive ? 'bg-rose-500 text-white border-rose-600 animate-pulse' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'
                                    }`}
                                >
                                    <span>⏱️ 計時器</span>
                                    {timerSeconds > 0 && (
                                        <span class="font-mono text-xs bg-black/20 px-1.5 py-0.5 rounded">
                                            {Math.floor(timerSeconds / 60)}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                        </span>
                                    )}
                                </button>

                                <button 
                                    onClick={handleExportCSVReport}
                                    class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold px-3 py-2 rounded-xl border border-blue-200 text-sm transition"
                                >
                                    📊 匯出報告
                                </button>

                                <button 
                                    onClick={handleExitRoom}
                                    class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2 rounded-xl border border-rose-200 text-sm transition"
                                >
                                    🚪 退出課室
                                </button>
                            </div>
                        </div>
                    </header>

                    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

                        {/* Question Mode Grid */}
                        <div class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-9 gap-2.5">
                            {[
                                { id: 'CHOICE', label: '選擇題', icon: '🔘' },
                                { id: 'TF', label: '是非題', icon: '⭕' },
                                { id: 'SHORT', label: '短答題', icon: '✍️' },
                                { id: 'DRAW', label: '白板題', icon: '🎨' },
                                { id: 'BUZZER', label: '搶答題', icon: '🚨' },
                                { id: 'AUDIO', label: '錄音題', icon: '🎤' },
                                { id: 'CHALLENGE', label: '挑戰題', icon: '🏆' },
                                { id: 'COOP', label: '合作題', icon: '🤝' },
                                { id: 'LINK', label: '派送連結', icon: '🔗' }
                            ].map((mode) => (
                                <button 
                                    key={mode.id}
                                    onClick={() => setSelectedMode(mode.id)}
                                    class={`p-3 rounded-2xl font-bold border-2 transition text-center flex flex-col items-center justify-center space-y-1 active:scale-95 ${
                                        selectedMode === mode.id 
                                        ? 'bg-indigo-600 text-white border-indigo-600 ring-4 ring-indigo-100 shadow-md' 
                                        : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'
                                    }`}
                                >
                                    <span class="text-xl">{mode.icon}</span>
                                    <span class="text-xs font-black">{mode.label}</span>
                                </button>
                            ))}
                        </div>

                        {/* Mode Setup Card */}
                        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                            <h2 class="font-extrabold text-slate-800 text-lg flex items-center justify-between border-b pb-3">
                                <span>當前模式：{getModeLabel(selectedMode)}</span>
                                {selectedMode !== 'CHALLENGE' && selectedMode !== 'COOP' && (
                                    <button 
                                        onClick={() => setLockAfterSubmit(!lockAfterSubmit)}
                                        class={`px-3 py-1 rounded-lg text-xs font-bold transition ${!lockAfterSubmit ? 'bg-emerald-500 text-white' : 'bg-slate-200 text-slate-600'}`}
                                    >
                                        {!lockAfterSubmit ? '已開放修改答案' : '已鎖定提交 (預設)'}
                                    </button>
                                )}
                            </h2>

                            {/* Revision Item 12 & 13: Challenge / Coop Word Docx Template Setup */}
                            {(selectedMode === 'CHALLENGE' || selectedMode === 'COOP') && (

                                        />

                                        {challengeData && (

                                                    </div>
                                                    <div>
                                                        <label class="text-xs font-bold text-slate-600">總分：</label>

                                                <div class="space-y-3 max-h-60 overflow-y-auto pr-1">

                                                                <span class="font-black text-amber-900">第 {q.num} 題:</span>
                                                                <input 
                                                                    type="text" 
                                                                    value={q.text}
                                                                    onChange={(e) => {
                                                                        const newQs = [...challengeData.questions];
                                                                        newQs[qIdx].text = e.target.value;
                                                                        setChallengeData({ ...challengeData, questions: newQs });
                                                                    }}
                                                                    class="flex-1 px-2 py-1 border rounded"
                                                                />
                                                                <button 
                                                                    onClick={() => {
                                                                        const newQs = challengeData.questions.filter((_, idx) => idx !== qIdx);
                                                                        setChallengeData({ ...challengeData, questions: newQs });
                                                                    }}
                                                                    class="px-2 py-1 bg-red-50 text-red-600 font-bold rounded hover:bg-red-100"
                                                                >
                                                                    🗑️ 刪除
                                                                </button>
                                                            </div>
                                                            <div class="grid grid-cols-2 gap-2 pl-4">
                                                                {q.options.map((opt, optIdx) => (
                                                                    <div key={optIdx} class="flex items-center space-x-1">
                                                                        <span class="font-bold text-slate-500">{opt.letter}.</span>
                                                                        <input 
                                                                            type="text" 
                                                                            value={opt.text}
                                                                            onChange={(e) => {
                                                                                const newQs = [...challengeData.questions];
                                                                                newQs[qIdx].options[optIdx].text = e.target.value;
                                                                                setChallengeData({ ...challengeData, questions: newQs });
                                                                            }}
                                                                            class="w-full px-2 py-0.5 border rounded text-xs"
                                                                        />
                                                                    </div>
                                                                ))}
                                                            </div>
                                                            <div class="flex items-center space-x-3 pt-1 pl-4 font-bold">
                                                                <span class="text-emerald-700">正確答案：</span>
                                                                {['A', 'B', 'C', 'D'].map(letter => (
                                                                    <label key={letter} class="flex items-center space-x-1 cursor-pointer">
                                                                        <input 
                                                                            type="radio" 
                                                                            name={`ans_q_${qIdx}`}
                                                                            checked={q.answer === letter}
                                                                            onChange={() => {
                                                                                const newQs = [...challengeData.questions];
                                                                                newQs[qIdx].answer = letter;
                                                                                setChallengeData({ ...challengeData, questions: newQs });
                                                                            }}
                                                                        />
                                                                        <span>{letter}</span>
                                                                    </label>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Revision Item 13: Time Limit 00:00 precision input */}
                                    {selectedMode === 'CHALLENGE' && (
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-white p-4 rounded-xl border border-amber-200">
                                            <div class="space-y-2">
                                                <div class="flex items-center justify-between">
                                                    <label class="text-xs font-bold text-slate-700">2. 開啟答題限時模式：</label>
                                                    <input 
                                                        type="checkbox" 
                                                        checked={challengeEnableTimer}
                                                        onChange={(e) => setChallengeEnableTimer(e.target.checked)}
                                                        class="w-4 h-4 accent-amber-600 rounded cursor-pointer"
                                                    />
                                                </div>
                                                {challengeEnableTimer && (
                                                    <div class="space-y-2">
                                                        <div class="flex flex-wrap gap-1.5">
                                                            {[60, 120, 180, 240, 300].map(s => (
                                                                <button 
                                                                    key={s} 
                                                                    type="button"
                                                                    onClick={() => setChallengeTimeLimit(s)}
                                                                    class={`px-2.5 py-1 text-xs rounded-lg font-bold border ${challengeTimeLimit === s ? 'bg-amber-600 text-white border-amber-600' : 'bg-slate-50 text-slate-700'}`}
                                                                >
                                                                    {s / 60}分鐘
                                                                </button>
                                                            ))}
                                                        </div>
                                                        <div class="flex items-center space-x-2 pt-1">
                                                            <span class="text-xs font-bold text-amber-900">手動輸入時間 (00:00)：</span>
                                                            <div class="flex items-center border rounded-lg px-2 py-1 bg-white font-mono text-xs font-bold">
                                                                <input 
                                                                    type="number"
                                                                    min="0"
                                                                    value={Math.floor(challengeTimeLimit / 60)}
                                                                    onChange={(e) => setChallengeTimeLimit((parseInt(e.target.value) || 0) * 60 + (challengeTimeLimit % 60))}
                                                                    class="w-8 text-center outline-none"
                                                                />
                                                                <span>:</span>
                                                                <input 
                                                                    type="number"
                                                                    min="0"
                                                                    max="59"
                                                                    value={challengeTimeLimit % 60}
                                                                    onChange={(e) => setChallengeTimeLimit(Math.floor(challengeTimeLimit / 60) * 60 + (parseInt(e.target.value) || 0))}
                                                                    class="w-8 text-center outline-none"
                                                                />
                                                            </div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>

                                            {/* Revision Item 14: Score release mode */}
                                            <div class="space-y-2">
                                                <label class="text-xs font-bold text-slate-700 block">3. 成績發放控制：</label>
                                                <div class="space-y-1.5">
                                                    <label class="flex items-center space-x-2 text-xs font-bold text-slate-700 cursor-pointer">
                                                        <input 
                                                            type="radio" 
                                                            name="scoreRelease" 
                                                            checked={challengeReleaseInstant}
                                                            onChange={() => setChallengeReleaseInstant(true)}
                                                            class="accent-amber-600"
                                                        />
                                                        <span>學生提交後即時給予分數</span>
                                                    </label>
                                                    <label class="flex items-center space-x-2 text-xs font-bold text-slate-700 cursor-pointer">
                                                        <input 
                                                            type="radio" 
                                                            name="scoreRelease" 
                                                            checked={!challengeReleaseInstant}
                                                            onChange={() => setChallengeReleaseInstant(false)}
                                                            class="accent-amber-600"
                                                        />
                                                        <span>待所有學生完成提交後，由教師按鍵一併發放</span>
                                                    </label>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {selectedMode === 'DRAW' && (
                                <div class="space-y-2 bg-purple-50 p-4 rounded-2xl border border-purple-100">
                                    <label class="block text-sm font-bold text-purple-900">
                                        白板題題目背景圖片 (選填)：
                                    </label>
                                    <input 
                                        type="file" 
                                        accept="image/*" 
                                        onChange={(e) => {
                                            const file = e.target.files[0];
                                            if (file) {
                                                const reader = new FileReader();
                                                reader.onload = (evt) => setWhiteboardBg(evt.target.result);
                                                reader.readAsDataURL(file);
                                            }
                                        }}
                                        class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-purple-600 file:text-white hover:file:bg-purple-700"
                                    />
                                </div>
                            )}

                            {/* Revision Item 4: Link Delivery */}
                            {selectedMode === 'LINK' && (
                                <div class="space-y-2 bg-amber-50 p-4 rounded-2xl border border-amber-100">
                                    <label class="block text-sm font-bold text-amber-900">
                                        輸入 YouTube 網址或網頁連結：
                                    </label>
                                    <input 
                                        type="url" 
                                        placeholder="https://www.youtube.com/watch?v=..." 
                                        value={pushedUrl}
                                        onChange={(e) => setPushedUrl(e.target.value)}
                                        class="w-full px-4 py-3 rounded-xl border border-amber-200 focus:outline-none focus:ring-2 focus:ring-amber-500 font-mono text-sm"
                                    />
                                </div>
                            )}

                            {selectedMode !== 'LINK' && selectedMode !== 'BUZZER' && selectedMode !== 'CHALLENGE' && selectedMode !== 'COOP' && (
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 mb-1">
                                        題目內容 (可留空)：
                                    </label>
                                    <input 
                                        type="text" 
                                        placeholder={`預設提示：「${getDefaultQuestionPrompt(selectedMode)}」`} 
                                        value={questionText}
                                        onChange={(e) => setQuestionText(e.target.value)}
                                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium text-slate-800"
                                    />
                                </div>
                            )}

                            {/* Revision Item 22: Team Collaboration Game Trigger */}

                                        <button 
                                            onClick={async () => {
                                                const db = window.fbDb;
                                                const roomDocRef = window.fbUtils.doc(db, 'artifacts', 'omit-8c173', 'public', 'data', 'rooms', roomCode);

                                        </button>
