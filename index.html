                                                        ${(!localAnswer || isLocked) ? 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none' : 'bg-indigo-600 hover:bg-indigo-700 text-white active:scale-98 shadow-indigo-200'}`}
                                                >
                                                    {isLocked ? '已鎖定提交' : '確認提交'}
                                                </button>
                                            </form>
                                        )}

                                        {/* SHORT Answer Mode */}
                                        {activeQuestion.mode === 'SHORT' && (
                                            <form onSubmit={handleSubmit} class="h-full flex flex-col space-y-6">
                                                <textarea
                                                    value={localAnswer}
                                                    onChange={e => setLocalAnswer(e.target.value)}
                                                    disabled={isLocked}
                                                    placeholder="請在此輸入你的答案..."
                                                    class={`w-full flex-1 min-h-[200px] p-5 rounded-2xl border-2 text-lg font-medium resize-none shadow-inner focus:outline-none focus:ring-0 transition
                                                        ${isLocked ? 'bg-slate-50 border-slate-200 text-slate-500' : 'bg-white border-slate-300 focus:border-indigo-500 text-slate-800'}`}
                                                ></textarea>
                                                <button 
                                                    type="submit" 
                                                    disabled={!localAnswer.trim() || isLocked || isSubmitting}
                                                    class={`w-full py-4 rounded-xl font-bold text-xl transition-all shadow-lg
                                                        ${(!localAnswer.trim() || isLocked) ? 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none' : 'bg-indigo-600 hover:bg-indigo-700 text-white active:scale-98 shadow-indigo-200'}`}
                                                >
                                                    {isLocked ? '已鎖定提交' : '確認提交'}
                                                </button>
                                            </form>
                                        )}

                                        {/* BUZZER Mode */}
                                        {activeQuestion.mode === 'BUZZER' && (
                                            <div class="h-full flex items-center justify-center">
                                                <button
                                                    onClick={() => {
                                                        if (!hasSubmitted) {
                                                            playSound('buzzer');
                                                            setLocalAnswer('搶答成功！');
                                                            handleSubmit(null, '搶答成功！');
                                                        }
                                                    }}
                                                    disabled={hasSubmitted || Object.keys(responses).length > 0} // Disable if anyone has submitted
                                                    class={`w-64 h-64 md:w-80 md:h-80 rounded-full text-4xl md:text-5xl font-black transition-all shadow-2xl border-8 flex items-center justify-center flex-col space-y-4
                                                        ${Object.keys(responses).length > 0 && !hasSubmitted ? 'bg-slate-200 border-slate-300 text-slate-400 cursor-not-allowed scale-95 opacity-80' // Someone else buzzed
                                                        : hasSubmitted ? 'bg-emerald-500 border-emerald-400 text-white scale-[1.02] cursor-not-allowed' // I buzzed first
                                                        : 'bg-gradient-to-br from-rose-500 to-red-600 border-rose-300 text-white hover:scale-105 active:scale-95 cursor-pointer hover:shadow-rose-500/50'}`} // Ready to buzz
                                                >
                                                    {Object.keys(responses).length > 0 && !hasSubmitted ? (
                                                        <><span>已結束</span><span class="text-lg font-bold opacity-70">其他人已搶答</span></>
                                                    ) : hasSubmitted ? (
                                                        <><span>⚡</span><span>第一名！</span></>
                                                    ) : (
                                                        <><span>👆</span><span>點擊搶答</span></>
                                                    )}
                                                </button>
                                            </div>
                                        )}

                                        {/* DRAW Mode */}
                                        {activeQuestion.mode === 'DRAW' && (
                                            <div class="h-full flex flex-col">
                                                <div class="flex-1 border-2 border-slate-300 rounded-2xl overflow-hidden bg-white shadow-inner relative" style={{aspectRatio: '16/9'}}>
                                                    <WhiteboardCanvas 
                                                        bgImage={activeQuestion.whiteboardBg} 
                                                        onSave={(dataUrl) => handleSubmit(null, dataUrl)} 
                                                        isReadOnly={isLocked}
                                                        initialData={hasSubmitted ? localAnswer : null}
                                                    />
                                                </div>
                                                {/* Submit button moved inside WhiteboardCanvas logic slightly above the canvas or handled by the canvas toolbar for DRAW mode */}
                                            </div>
                                        )}

                                        {/* LINK Mode */}
                                        {activeQuestion.mode === 'LINK' && (
                                            <div class="h-full flex flex-col space-y-6">
                                                {activeQuestion.youtubeEmbed ? (
                                                    <div class="flex-1 w-full rounded-2xl overflow-hidden bg-black shadow-lg border border-slate-800">
                                                        <iframe 
                                                            src={activeQuestion.youtubeEmbed} 
                                                            class="w-full h-full aspect-video" 
                                                            frameBorder="0" 
                                                            allow="autoplay; encrypted-media; picture-in-picture" 
                                                            allowFullScreen
                                                        ></iframe>
                                                    </div>
                                                ) : (
                                                    <div class="flex-1 flex flex-col items-center justify-center p-8 bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl text-center space-y-4">
                                                        <span class="text-6xl">🔗</span>
                                                        <div class="text-slate-500 font-medium break-all max-w-full px-4">{activeQuestion.pushedUrl}</div>
                                                    </div>
                                                )}
                                                
                                                <a 
                                                    href={activeQuestion.pushedUrl} 
                                                    target="_blank" 
                                                    rel="noopener noreferrer"
                                                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl text-center transition shadow flex items-center justify-center space-x-2 text-lg active:scale-98"
                                                >
                                                    <span>開啟連結網站</span><span>↗</span>
                                                </a>
                                            </div>
                                        )}

                                        {/* AUDIO Mode */}
                                        {activeQuestion.mode === 'AUDIO' && (
                                            <div class="h-full flex flex-col items-center justify-center space-y-8">
                                                {!audioBlobUrl ? (
                                                    <div class="flex flex-col items-center space-y-6 w-full max-w-md">
                                                        <div class="relative flex items-center justify-center">
                                                            {isRecording && <div class="absolute inset-0 bg-rose-500 rounded-full animate-ping opacity-20"></div>}
                                                            <button 
                                                                onMouseDown={startRecording}
                                                                onMouseUp={stopRecording}
                                                                onTouchStart={(e) => { e.preventDefault(); startRecording(); }}
                                                                onTouchEnd={(e) => { e.preventDefault(); stopRecording(); }}
                                                                disabled={isLocked}
                                                                class={`relative w-40 h-40 rounded-full flex flex-col items-center justify-center space-y-2 text-white font-bold transition-all shadow-2xl border-4 outline-none select-none
                                                                    ${isLocked ? 'bg-slate-300 border-slate-400 cursor-not-allowed shadow-none' 
                                                                    : isRecording ? 'bg-rose-500 border-rose-300 scale-95 cursor-pointer' 
                                                                    : 'bg-indigo-600 border-indigo-400 hover:bg-indigo-500 cursor-pointer hover:scale-105'}`}
                                                            >
                                                                <span class="text-5xl">{isRecording ? '🎙️' : '🎤'}</span>
                                                                <span class="text-sm tracking-widest">{isRecording ? '錄音中...' : '長按錄音'}</span>
                                                            </button>
                                                        </div>
                                                        <div class="text-center bg-slate-50 px-6 py-3 rounded-full border border-slate-200">
                                                            <div class="text-sm font-bold text-slate-500">剩餘時間</div>
                                                            <div class={`text-3xl font-mono font-black ${timeLeft <= 3 ? 'text-red-500 animate-pulse' : 'text-slate-800'}`}>00:{timeLeft.toString().padStart(2, '0')}</div>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div class="flex flex-col items-center space-y-6 w-full max-w-md bg-white p-8 rounded-3xl shadow-lg border border-slate-200">
                                                        <div class="text-center space-y-2">
                                                            <div class="text-4xl">🎧</div>
                                                            <h3 class="font-bold text-slate-700">錄音完成</h3>
                                                        </div>
                                                        <audio src={audioBlobUrl} controls class="w-full h-12 outline-none rounded-full bg-slate-50"></audio>
                                                        
                                                        {!isLocked && (
                                                            <div class="flex flex-col w-full space-y-3 pt-4">
                                                                <button onClick={submitAudio} disabled={isSubmitting} class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow transition active:scale-98 flex justify-center items-center space-x-2 text-lg">
                                                                    <span>✅</span><span>確認提交錄音</span>
                                                                </button>
                                                                <button onClick={retryRecording} disabled={isSubmitting} class="w-full bg-white hover:bg-slate-50 text-red-500 border border-red-200 font-bold py-3.5 rounded-xl transition flex justify-center items-center space-x-2">
                                                                    <span>🗑️</span><span>刪除重錄</span>
                                                                </button>
                                                            </div>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {/* CHALLENGE Mode */}
                                        {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                            <div class="flex flex-col space-y-6 h-full">
                                                <div class="flex-1 space-y-6 overflow-y-auto pr-2 custom-scrollbar">
                                                    {activeQuestion.challenge.questions.map((q, idx) => {
                                                        const isQCorrect = hasSubmitted && activeQuestion.challenge.scoresReleased && challengeAnswers[q.num] === q.answer;
                                                        const isQWrong = hasSubmitted && activeQuestion.challenge.scoresReleased && challengeAnswers[q.num] !== q.answer;
                                                        
                                                        return (
                                                            <div key={idx} class={`bg-white p-5 rounded-2xl border-2 transition-colors shadow-sm
                                                                ${isQCorrect ? 'border-emerald-300 bg-emerald-50/20' : isQWrong ? 'border-red-300 bg-red-50/20' : 'border-slate-200'}`}
                                                            >
                                                                <div class="font-bold text-slate-800 text-lg mb-4 flex space-x-2">
                                                                    <span class="flex-shrink-0 mt-1">{q.num}.</span>
                                                                    <span>{q.text}</span>
                                                                </div>
                                                                <div class="space-y-3 pl-2 md:pl-6">
                                                                    {q.options.map(opt => {
                                                                        const isSelected = challengeAnswers[q.num] === opt.letter;
                                                                        const isActualCorrect = hasSubmitted && activeQuestion.challenge.scoresReleased && q.answer === opt.letter;
                                                                        const isWrongSelected = hasSubmitted && activeQuestion.challenge.scoresReleased && isSelected && !isActualCorrect;

                                                                        let btnClass = "w-full text-left p-4 rounded-xl border-2 transition-all font-medium flex justify-between items-center ";
                                                                        
                                                                        if (isActualCorrect) {
                                                                            btnClass += "border-emerald-500 bg-emerald-50 text-emerald-800 shadow-sm"; // Revealed correct answer
                                                                        } else if (isWrongSelected) {
                                                                             btnClass += "border-red-400 bg-red-50 text-red-800 line-through opacity-70"; // Revealed wrong selection
                                                                        } else if (isSelected) {
                                                                            btnClass += "border-indigo-500 bg-indigo-50 text-indigo-700 shadow-sm"; // Currently selected (before reveal)
                                                                        } else {
                                                                            btnClass += "border-slate-200 hover:border-indigo-300 text-slate-600 hover:bg-slate-50"; // Unselected state
                                                                        }

                                                                        return (
                                                                            <button 
                                                                                key={opt.letter}
                                                                                type="button"
                                                                                disabled={hasSubmitted}
                                                                                onClick={() => handleChallengeOptionChange(q.num, opt.letter)}
                                                                                class={btnClass}
                                                                            >
                                                                                <span><span class="font-bold mr-2 w-6 inline-block">{opt.letter}.</span> {opt.text}</span>
                                                                                {isActualCorrect && <span class="text-xs font-bold text-emerald-600 bg-emerald-100 px-2 py-1 rounded shadow-sm">正確答案</span>}
                                                                                {isWrongSelected && <span class="text-xs font-bold text-red-600 bg-red-100 px-2 py-1 rounded shadow-sm">你的選擇</span>}
                                                                            </button>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                                
                                                <div class="pt-4 border-t border-slate-200 mt-auto bg-slate-50 sticky bottom-0">
                                                    <button 
                                                        onClick={handleChallengeSubmit}
                                                        disabled={hasSubmitted || isSubmitting}
                                                        class={`w-full py-4 rounded-xl font-bold text-xl transition-all shadow-lg
                                                            ${hasSubmitted ? 'bg-slate-300 text-slate-500 cursor-not-allowed shadow-none' : 'bg-indigo-600 hover:bg-indigo-700 text-white active:scale-98 shadow-indigo-200'}`}
                                                    >
                                                        {hasSubmitted ? '已鎖定作答' : '✅ 確認提交整份評估'}
                                                    </button>
                                                </div>
                                            </div>
                                        )}

                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        // Whiteboard Component with optimized touch precision and background support
        function WhiteboardCanvas({ bgImage, onSave, isReadOnly, initialData, canvasRef: externalRef }) {
            const internalRef = useRef(null);
            const ref = externalRef || internalRef;
            
            const [isDrawing, setIsDrawing] = useState(false);
            const [color, setColor] = useState('#4f46e5'); // Indigo-600 default
            const [lineWidth, setLineWidth] = useState(5);
            const [isEraser, setIsEraser] = useState(false);
            
            // Standard resolution for consistent coordinate mapping (720p 16:9)
            const CANVAS_WIDTH = 1280;
            const CANVAS_HEIGHT = 720;

            useEffect(() => {
                const canvas = ref.current;
                const ctx = canvas.getContext('2d');
                
                // Initialize internal resolution
                canvas.width = CANVAS_WIDTH;
                canvas.height = CANVAS_HEIGHT;
                
                // Set default styles
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                // Fill background
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (initialData) {
                    const img = new Image();
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    };
                    img.src = initialData;
                } else if (bgImage) {
                    const img = new Image();
                    img.onload = () => {
                        // Keep aspect ratio centered
                        const hRatio = canvas.width / img.width;
                        const vRatio = canvas.height / img.height;
                        const ratio  = Math.min( hRatio, vRatio );
                        const centerShift_x = ( canvas.width - img.width*ratio ) / 2;
                        const centerShift_y = ( canvas.height - img.height*ratio ) / 2;  
                        ctx.drawImage(img, 0,0, img.width, img.height, centerShift_x,centerShift_y,img.width*ratio, img.height*ratio);
                    };
                    img.src = bgImage;
                }
            }, [bgImage, initialData]);
            
            // Helper to get precise coordinates mapped to 1280x720 internal resolution
            const getCoordinates = (e) => {
                const canvas = ref.current;
                const rect = canvas.getBoundingClientRect();
                
                // Calculate scale ratio between CSS size and internal 1280x720 size
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                let clientX, clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else if (e.changedTouches && e.changedTouches.length > 0) {
                    clientX = e.changedTouches[0].clientX;
                    clientY = e.changedTouches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                // Apply mapped coordinates
                const x = (clientX - rect.left) * scaleX;
                const y = (clientY - rect.top) * scaleY;
                
                return { x, y };
            };

            const startDrawing = (e) => {
                if (isReadOnly) return;
                // Prevent scrolling when drawing on touch devices
                if(e.type.includes('touch')) e.preventDefault(); 
                
                const { x, y } = getCoordinates(e);
                const ctx = ref.current.getContext('2d');
                
                ctx.beginPath();
                ctx.moveTo(x, y);
                
                ctx.strokeStyle = isEraser ? '#ffffff' : color;
                // Scale line width visually based on standard resolution
                ctx.lineWidth = lineWidth * (CANVAS_WIDTH / 800); 
                
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing || isReadOnly) return;
                if(e.type.includes('touch')) e.preventDefault();

                const { x, y } = getCoordinates(e);
                const ctx = ref.current.getContext('2d');
                
                ctx.lineTo(x, y);
                ctx.stroke();
            };

            const stopDrawing = () => {
                if (isDrawing) {
                    const ctx = ref.current.getContext('2d');
                    ctx.closePath();
                    setIsDrawing(false);
                }
            };

            const clearCanvas = () => {
                if (isReadOnly) return;
                const canvas = ref.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                if (bgImage) {
                    const img = new Image();
                    img.onload = () => {
                        const hRatio = canvas.width / img.width;
                        const vRatio = canvas.height / img.height;
                        const ratio  = Math.min( hRatio, vRatio );
                        const centerShift_x = ( canvas.width - img.width*ratio ) / 2;
                        const centerShift_y = ( canvas.height - img.height*ratio ) / 2;  
                        ctx.drawImage(img, 0,0, img.width, img.height, centerShift_x,centerShift_y,img.width*ratio, img.height*ratio);
                    };
                    img.src = bgImage;
                }
            };
            
            const triggerSave = () => {
                if (onSave) {
                    const dataUrl = ref.current.toDataURL('image/png');
                    onSave(dataUrl);
                }
            };

            const colors = ['#0f172a', '#dc2626', '#16a34a', '#2563eb', '#ca8a04', '#9333ea'];

            return (
                <div class="flex flex-col h-full w-full absolute inset-0">
                    <canvas
                        ref={ref}
                        class={`w-full h-full object-contain ${isReadOnly ? 'cursor-not-allowed opacity-80' : 'cursor-crosshair touch-none'}`}
                        onMouseDown={startDrawing}
                        onMouseMove={draw}
                        onMouseUp={stopDrawing}
                        onMouseOut={stopDrawing}
                        onTouchStart={startDrawing}
                        onTouchMove={draw}
                        onTouchEnd={stopDrawing}
                        onTouchCancel={stopDrawing}
                        style={{ display: 'block' }} // Remove bottom padding
                    />
                    
                    {!isReadOnly && (
                        <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-white/90 backdrop-blur-sm p-3 rounded-2xl shadow-xl flex items-center space-x-4 border border-slate-200 z-10 w-[90%] md:w-auto overflow-x-auto custom-scrollbar">
                            
                            {/* Color Palette */}
                            <div class="flex space-x-2">
                                {colors.map(c => (
                                    <button 
                                        key={c}
                                        onClick={() => {setColor(c); setIsEraser(false);}}
                                        class={`w-8 h-8 rounded-full border-2 transition-transform ${color === c && !isEraser ? 'scale-125 border-slate-800 shadow-md' : 'border-transparent hover:scale-110'}`}
                                        style={{backgroundColor: c}}
                                        title="選擇顏色"
                                    ></button>
                                ))}
                            </div>
                            
                            <div class="w-px h-8 bg-slate-300 mx-2"></div>
                            
                            {/* Pen Size */}
                            <div class="flex items-center space-x-2 text-sm font-bold text-slate-600">
                                <span>筆觸</span>
                                <input 
                                    type="range" 
                                    min="2" max="18" 
                                    value={lineWidth} 
                                    onChange={(e) => setLineWidth(e.target.value)}
                                    class="w-24 accent-indigo-600"
                                />
                            </div>

                            <div class="w-px h-8 bg-slate-300 mx-2"></div>
                            
                            {/* Tools */}
                            <div class="flex space-x-2">
                                <button 
                                    onClick={() => setIsEraser(false)}
                                    class={`p-2 rounded-lg text-lg transition ${!isEraser ? 'bg-indigo-100 text-indigo-700 shadow-inner' : 'hover:bg-slate-100 text-slate-500'}`}
                                    title="畫筆"
                                >✏️</button>
                                <button 
                                    onClick={() => setIsEraser(true)}
                                    class={`p-2 rounded-lg text-lg transition ${isEraser ? 'bg-indigo-100 text-indigo-700 shadow-inner' : 'hover:bg-slate-100 text-slate-500'}`}
                                    title="擦膠"
                                >🧽</button>
                                <button onClick={clearCanvas} class="p-2 rounded-lg text-lg hover:bg-red-50 text-red-500 transition" title="一鍵清空">🗑️</button>
                            </div>

                            {onSave && (
                                <>
                                    <div class="w-px h-8 bg-slate-300 mx-2"></div>
                                    <button onClick={triggerSave} class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-xl shadow transition active:scale-95 whitespace-nowrap">
                                        確認提交
                                    </button>
                                </>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
