<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMIT 互動課堂 - 免登入即時課堂互動平台</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            touch-action: manipulation;
        }
        .canvas-container {
            touch-action: none;
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration provided by user
        const firebaseConfig = {
            apiKey: "AIzaSyAcphRXxqs_MTeWwffVVOFsnb8Liro5Lto",
            authDomain: "omit-8c173.firebaseapp.com",
            projectId: "omit-8c173",
            storageBucket: "omit-8c173.firebasestorage.app",
            messagingSenderId: "1078509757779",
            appId: "1:1078509757779:web:64fe9465920eca4f38ada6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Anonymous authentication initialization
        let authReadyPromise = signInAnonymously(auth)
            .then(cred => cred.user)
            .catch(err => {
                console.error("Firebase Anonymous Auth Failed:", err);
                return null;
            });

        // Global Firebase Helper Object
        window.FB = {
            app, db, auth, authReadyPromise,
            doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, getDocs, writeBatch,
            appId: firebaseConfig.projectId
        };

        window.dispatchEvent(new Event('firebase-initialized'));
    </script>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Custom SVG Icon Component
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                users: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />,
                trophy: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4a5 5 0 005 5h4a5 5 0 005-5V3M3 3h18M9 21h6m-3-4v4M4 7h16" />,
                image: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />,
                trash: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />,
                zoom: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" />,
                broadcast: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z" />,
                edit: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />,
                check: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />,
                x: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />,
                exit: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            };

            return (
                <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    {icons[name] || null}
                </svg>
            );
        };

        // Custom Toast Notification
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (
                <div className={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-xl shadow-lg flex items-center space-x-2 text-sm font-medium animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        function OMITApp() {
            const [role, setRole] = useState('LANDING'); // 'LANDING', 'TEACHER', 'STUDENT'
            const [roomCode, setRoomCode] = useState('');
            const [studentName, setStudentName] = useState('');
            const [toast, setToast] = useState(null);
            const [fbReady, setFbReady] = useState(!!window.FB);

            const [activeQuestion, setActiveQuestion] = useState(null);
            const [studentsList, setStudentsList] = useState([]);
            const [responses, setResponses] = useState({});
            const [showcasedResponse, setShowcasedResponse] = useState(null);

            const myStudentId = useRef('std_' + Math.random().toString(36).substring(2, 9));

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            useEffect(() => {
                const handleFBReady = () => setFbReady(true);
                window.addEventListener('firebase-initialized', handleFBReady);
                return () => window.removeEventListener('firebase-initialized', handleFBReady);
            }, []);

            // Check URL parameters for direct join link
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const roomParam = params.get('room');
                if (roomParam) {
                    setRoomCode(roomParam.toUpperCase());
                }
            }, []);

            // Realtime Firebase Listener for Room State, Students, and Responses
            useEffect(() => {
                if (!fbReady || !roomCode || role === 'LANDING') return;

                const { db, doc, onSnapshot, collection, authReadyPromise, appId } = window.FB;

                let unsubscribeRoom = () => {};
                let unsubscribeStudents = () => {};
                let unsubscribeResponses = () => {};

                authReadyPromise.then(() => {
                    // Strict Paths per Rule 1
                    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', roomCode.toUpperCase());
                    const studentsCollRef = collection(db, 'artifacts', appId, 'public', 'data', `omit_students_${roomCode.toUpperCase()}`);
                    const responsesCollRef = collection(db, 'artifacts', appId, 'public', 'data', `omit_responses_${roomCode.toUpperCase()}`);

                    // Subscribe to Room Level Document
                    unsubscribeRoom = onSnapshot(roomDocRef, (docSnap) => {
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            setActiveQuestion(data.activeQuestion || null);
                            setShowcasedResponse(data.showcasedResponse || null);
                        } else {
                            if (role === 'STUDENT') {
                                showToast('課室已關閉或不存在', 'error');
                                setRole('LANDING');
                            }
                        }
                    }, (err) => console.error("Room snapshot error:", err));

                    // Subscribe to Students Collection
                    unsubscribeStudents = onSnapshot(studentsCollRef, (querySnap) => {
                        const list = [];
                        querySnap.forEach(doc => {
                            list.push(doc.data());
                        });
                        // Sort in memory (Rule 2)
                        list.sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
                        setStudentsList(list);
                    }, (err) => console.error("Students snapshot error:", err));

                    // Subscribe to Responses Collection
                    unsubscribeResponses = onSnapshot(responsesCollRef, (querySnap) => {
                        const resObj = {};
                        querySnap.forEach(doc => {
                            resObj[doc.id] = doc.data();
                        });
                        setResponses(resObj);
                    }, (err) => console.error("Responses snapshot error:", err));
                });

                return () => {
                    unsubscribeRoom();
                    unsubscribeStudents();
                    unsubscribeResponses();
                };
            }, [fbReady, roomCode, role]);

            // Teacher Creates Room
            const handleCreateRoom = async () => {
                const generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
                setRoomCode(generatedCode);

                if (window.FB) {
                    const { db, doc, setDoc, authReadyPromise, appId } = window.FB;
                    await authReadyPromise;
                    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', generatedCode);
                    await setDoc(roomDocRef, {
                        createdAt: Date.now(),
                        activeQuestion: null,
                        showcasedResponse: null
                    });
                }

                setRole('TEACHER');
                showToast(`已成功建立互動課堂！房號：${generatedCode}`, 'success');
            };

            // Student Joins Room
            const handleJoinRoom = async (e) => {
                e?.preventDefault();
                const code = roomCode.trim().toUpperCase();
                if (!code || code.length !== 6) {
                    showToast('請輸入6位數字房號', 'error');
                    return;
                }
                if (!studentName.trim()) {
                    showToast('請輸入您的姓名或暱稱', 'error');
                    return;
                }

                if (window.FB) {
                    const { db, doc, getDoc, setDoc, authReadyPromise, appId } = window.FB;
                    await authReadyPromise;
                    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', code);
                    const roomSnap = await getDoc(roomDocRef);
                    if (!roomSnap.exists()) {
                        showToast('查無此課室，請核對房號！', 'error');
                        return;
                    }

                    // Register student in room
                    const sId = myStudentId.current;
                    const studentDocRef = doc(db, 'artifacts', appId, 'public', 'data', `omit_students_${code}`, sId);
                    await setDoc(studentDocRef, {
                        id: sId,
                        name: studentName.trim(),
                        joinedAt: Date.now()
                    });
                }

                setRoomCode(code);
                setRole('STUDENT');
                showToast(`已進入房號 ${code} 的課堂`, 'success');
            };

            if (role === 'LANDING') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-indigo-900 via-indigo-800 to-purple-900 flex items-center justify-center p-4">
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                        
                        <div className="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 space-y-8 relative overflow-hidden">
                            <div className="text-center space-y-2">
                                <div className="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl mb-2 font-black text-2xl shadow-inner">
                                    OMIT
                                </div>
                                <h1 className="text-3xl font-extrabold text-slate-800 tracking-tight">OMIT 互動課堂</h1>
                                <p className="text-slate-500 text-sm">免登入！隨查隨答、高效即時的反饋互動平台</p>
                            </div>

                            <div className="space-y-6">
                                {/* Student Join Section */}
                                <form onSubmit={handleJoinRoom} className="bg-indigo-50/70 p-5 rounded-2xl border border-indigo-100 space-y-4">
                                    <h2 className="text-xs font-bold text-indigo-600 uppercase tracking-wider">我是學生 (加入課堂)</h2>
                                    <div>
                                        <input 
                                            type="text" 
                                            placeholder="請輸入房號 (例如 123456)" 
                                            value={roomCode} 
                                            onChange={(e) => setRoomCode(e.target.value)}
                                            className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-mono text-center tracking-widest text-lg font-bold uppercase"
                                            maxLength={6}
                                        />
                                    </div>
                                    <div>
                                        <input 
                                            type="text" 
                                            placeholder="請輸入你的姓名 / 暱稱" 
                                            value={studentName} 
                                            onChange={(e) => setStudentName(e.target.value)}
                                            className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-medium"
                                        />
                                    </div>
                                    <button 
                                        type="submit" 
                                        className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-200 active:scale-98 flex items-center justify-center space-x-2"
                                    >
                                        <span>進入課堂 🚀</span>
                                    </button>
                                </form>

                                <div className="relative flex py-1 items-center">
                                    <div className="flex-grow border-t border-slate-200"></div>
                                    <span className="flex-shrink mx-4 text-slate-400 text-xs font-medium">或</span>
                                    <div className="flex-grow border-t border-slate-200"></div>
                                </div>

                                {/* Teacher Create Section */}
                                <div className="text-center">
                                    <button 
                                        onClick={handleCreateRoom}
                                        className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl transition shadow-md flex items-center justify-center space-x-2 active:scale-98"
                                    >
                                        <span>👨‍🏫 開啟新課堂 (教師控制台)</span>
                                    </button>
                                    <p className="text-xs text-slate-400 mt-2">不需註冊或登入，建立即可發放房號與 QR Code</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (role === 'TEACHER') {
                return (
                    <TeacherDashboard 
                        roomCode={roomCode} 
                        activeQuestion={activeQuestion} 
                        responses={responses}
                        studentsList={studentsList}
                        showcasedResponse={showcasedResponse}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            if (role === 'STUDENT') {
                return (
                    <StudentInterface 
                        roomCode={roomCode}
                        studentName={studentName}
                        studentId={myStudentId.current}
                        activeQuestion={activeQuestion}
                        showcasedResponse={showcasedResponse}
                        myResponse={responses[myStudentId.current]}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            return null;
        }

        function TeacherDashboard({ roomCode, activeQuestion, responses, studentsList, showcasedResponse, showToast, onExit }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE'); // 'CHOICE', 'TF', 'SHORT', 'DRAW'
            const [questionText, setQuestionText] = useState('');
            const [allowStudentEdit, setAllowStudentEdit] = useState(true); // Feature 4: Toggle student edit
            const [choiceCount, setChoiceCount] = useState(4);
            const [bgImage, setBgImage] = useState(null); // Feature 2: Custom Whiteboard Background
            
            // Modals & Active Tabs
            const [showStudentsModal, setShowStudentsModal] = useState(false); // Feature 1: Student List Modal
            const [showLeaderboardModal, setShowLeaderboardModal] = useState(false); // Feature 5: Leaderboard Modal
            const [showQRModal, setShowQRModal] = useState(false);
            const [showExitConfirm, setShowExitConfirm] = useState(false); // Feature 6: Clear & Exit
            const [zoomedStudentResponse, setZoomedStudentResponse] = useState(null); // Feature 3: Zoomed response

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

            // Handle Custom Whiteboard Background Image Upload
            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    showToast('請上傳圖片檔案 (PNG / JPG / WEBP)', 'error');
                    return;
                }
                const reader = new FileReader();
                reader.onload = (evt) => {
                    setBgImage(evt.target.result);
                    showToast('背景圖片已設定！發佈白板題後學生將在圖片上作答', 'success');
                };
                reader.readAsDataURL(file);
            };

            // Publish New Question
            const handlePublishQuestion = async () => {
                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: questionText.trim() || getDefaultQuestionPrompt(selectedMode),
                    startTime: Date.now(),
                    allowEdit: allowStudentEdit,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : [],
                    bgImage: selectedMode === 'DRAW' ? bgImage : null
                };

                const { db, doc, updateDoc, collection, getDocs, deleteDoc, authReadyPromise, appId } = window.FB;
                await authReadyPromise;

                // 1. Update Room Active Question
                const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', roomCode);
                await updateDoc(roomDocRef, {
                    activeQuestion: newQ,
                    showcasedResponse: null // reset showcased peer review on new question
                });

                // 2. Clear old responses for new question
                const responsesCollRef = collection(db, 'artifacts', appId, 'public', 'data', `omit_responses_${roomCode}`);
                const oldDocs = await getDocs(responsesCollRef);
                oldDocs.forEach(d => deleteDoc(d.ref));

                showToast('已成功發佈題目給所有學生！', 'success');
            };

            // End / Clear Question
            const handleClearQuestion = async () => {
                const { db, doc, updateDoc, authReadyPromise, appId } = window.FB;
                await authReadyPromise;
                const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', roomCode);
                await updateDoc(roomDocRef, { activeQuestion: null, showcasedResponse: null });
                showToast('已結束當前題目', 'info');
            };

            // Feature 3: Broadcast Specific Student Response for Peer Evaluation
            const handleBroadcastStudentResponse = async (studentRes) => {
                const { db, doc, updateDoc, authReadyPromise, appId } = window.FB;
                await authReadyPromise;
                const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', roomCode);
                await updateDoc(roomDocRef, {
                    showcasedResponse: {
                        studentId: studentRes.studentId,
                        studentName: studentRes.name,
                        answer: studentRes.answer,
                        mode: activeQuestion?.mode,
                        bgImage: activeQuestion?.bgImage,
                        timestamp: Date.now()
                    }
                });
                showToast(`已成功將【${studentRes.name}】的回應推送到所有學生頁面進行互評！`, 'success');
                setZoomedStudentResponse(null);
            };

            // Clear showcased peer evaluation
            const handleClearBroadcast = async () => {
                const { db, doc, updateDoc, authReadyPromise, appId } = window.FB;
                await authReadyPromise;
                const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', roomCode);
                await updateDoc(roomDocRef, { showcasedResponse: null });
                showToast('已取消廣播互評作品', 'info');
            };

            // Feature 6: Synchronously Clear Firebase Data & Exit Room
            const handleConfirmClearAndExit = async () => {
                try {
                    const { db, doc, deleteDoc, collection, getDocs, authReadyPromise, appId } = window.FB;
                    await authReadyPromise;

                    showToast('正在清空課室所有暫存檔案與紀錄...', 'info');

                    // 1. Delete all student records in this room
                    const studentsCollRef = collection(db, 'artifacts', appId, 'public', 'data', `omit_students_${roomCode}`);
                    const studDocs = await getDocs(studentsCollRef);
                    studDocs.forEach(d => deleteDoc(d.ref));

                    // 2. Delete all response records in this room
                    const responsesCollRef = collection(db, 'artifacts', appId, 'public', 'data', `omit_responses_${roomCode}`);
                    const respDocs = await getDocs(responsesCollRef);
                    respDocs.forEach(d => deleteDoc(d.ref));

                    // 3. Delete Room doc
                    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'omit_rooms', roomCode);
                    await deleteDoc(roomDocRef);

                    showToast('已完成清空紀錄並安全退出！', 'success');
                    onExit();
                } catch (err) {
                    console.error("Clear room error:", err);
                    showToast('清空暫存檔時發生錯誤', 'error');
                    onExit();
                }
            };

            const getDefaultQuestionPrompt = (mode) => {
                switch (mode) {
                    case 'CHOICE': return '請選擇正確答案：';
                    case 'TF': return '請判斷以下敘述是否正確：';
                    case 'SHORT': return '請簡短回答以下問題：';
                    case 'DRAW': return '請在白板上繪圖或標註解題過程：';
                    default: return '';
                }
            };

            // Calculate response times & Leaderboard list (Feature 5)
            const leaderboardList = useMemo(() => {
                const list = Object.values(responses);
                list.sort((a, b) => (a.duration || 999999) - (b.duration || 999999));
                return list;
            }, [responses]);

            const responseCount = Object.keys(responses).length;

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col pb-12">
                    {/* Top Navigation Bar */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
                        <div className="flex items-center space-x-3">
                            <div className="bg-indigo-600 text-white font-black px-3 py-1.5 rounded-xl text-lg tracking-wider">
                                OMIT
                            </div>
                            <div>
                                <h1 className="font-extrabold text-slate-800 text-base lg:text-lg flex items-center space-x-2">
                                    <span>課堂控制台</span>
                                    <span className="bg-indigo-50 text-indigo-700 text-xs px-2.5 py-0.5 rounded-full border border-indigo-200 font-mono">
                                        房號: {roomCode}
                                    </span>

                                    <h3 className="text-lg font-black text-slate-800">確定退出並關閉課室？</h3>
                                    <p className="text-xs text-slate-500 leading-relaxed">
                                        退出課室時將<strong>同步清空所有 Firebase 暫存檔案與紀錄</strong>以釋出空間。本動作無法撤銷。
                                    </p>
                                </div>

                                <div className="grid grid-cols-2 gap-3 pt-2">
                                    <button 
                                        onClick={() => setShowExitConfirm(false)}
                                        className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl text-xs transition"
                                    >
                                        取消
                                    </button>
                                    <button 
                                        onClick={handleConfirmClearAndExit}
                                        className="bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-md"
                                    >
                                        確定清空並退出
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StudentInterface({ roomCode, studentName, studentId, activeQuestion, showcasedResponse, myResponse, showToast, onExit }) {
            const [selectedChoice, setSelectedChoice] = useState('');
            const [shortAnswer, setShortAnswer] = useState('');
            const [isSubmitted, setIsSubmitted] = useState(false);
            
            // Canvas state for Whiteboard drawing
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [penColor, setPenColor] = useState('#2563eb');
            const [penSize, setPenSize] = useState(3);
            const [isEraser, setIsEraser] = useState(false);
            const [hasDrawn, setHasDrawn] = useState(false);

            // Synchronize student submission state when activeQuestion changes or myResponse exists
            useEffect(() => {
                if (myResponse) {
                    setIsSubmitted(true);
                    if (activeQuestion?.mode === 'CHOICE' || activeQuestion?.mode === 'TF') {
                        setSelectedChoice(myResponse.answer);
                    } else if (activeQuestion?.mode === 'SHORT') {
                        setShortAnswer(myResponse.answer);
                    }
                } else {
                    setIsSubmitted(false);
                    setSelectedChoice('');
                    setShortAnswer('');
                    setHasDrawn(false);
                }
            }, [activeQuestion?.id, myResponse]);

            // Draw Background Image on Canvas (Feature 2)
            useEffect(() => {
                if (activeQuestion?.mode === 'DRAW' && canvasRef.current) {
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    if (activeQuestion.bgImage) {
                        const img = new Image();
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        };
                        img.src = activeQuestion.bgImage;
                    }
                }
            }, [activeQuestion?.id, activeQuestion?.bgImage]);

            // Canvas Drawing Event Handlers (Mouse & Touch)
            const getCanvasCoords = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * (canvas.width / rect.width),
                    y: (clientY - rect.top) * (canvas.height / rect.height)
                };
            };

            const startDrawing = (e) => {
                if (isSubmitted && !activeQuestion?.allowEdit) return;
                setIsDrawing(true);
                setHasDrawn(true);
                const ctx = canvasRef.current.getContext('2d');
                const coords = getCanvasCoords(e);
                ctx.beginPath();
                ctx.moveTo(coords.x, coords.y);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                const ctx = canvasRef.current.getContext('2d');
                const coords = getCanvasCoords(e);
                ctx.strokeStyle = isEraser ? '#ffffff' : penColor;
                ctx.lineWidth = isEraser ? penSize * 5 : penSize;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineTo(coords.x, coords.y);
                ctx.stroke();
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                if (activeQuestion?.bgImage) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    img.src = activeQuestion.bgImage;
                }
                setHasDrawn(false);
            };

            // Submit Student Answer
            const handleSubmitAnswer = async (answerValue) => {
                if (!activeQuestion) return;

                let finalAns = answerValue;
                if (activeQuestion.mode === 'DRAW') {
                    if (!canvasRef.current || !hasDrawn) {
                        showToast('請在白板上作答後再提交', 'error');
                        return;
                    }
                    finalAns = canvasRef.current.toDataURL('image/png');
                } else if (!finalAns) {
                    showToast('請選擇或填寫答案', 'error');
                    return;
                }

                const duration = ((Date.now() - activeQuestion.startTime) / 1000).toFixed(1);

                const { db, doc, setDoc, authReadyPromise, appId } = window.FB;
                await authReadyPromise;

                const responseDocRef = doc(db, 'artifacts', appId, 'public', 'data', `omit_responses_${roomCode}`, studentId);
                await setDoc(responseDocRef, {
                    studentId,
                    name: studentName,
                    answer: finalAns,
                    duration: parseFloat(duration),
                    timestamp: Date.now()
                });

                setIsSubmitted(true);
                showToast(isSubmitted ? '答案已成功更新！' : '答案已成功提交！', 'success');
            };

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col pb-12">
                    {/* Student Top Bar */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 lg:px-8 py-3.5 flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                            <div className="bg-indigo-600 text-white font-black px-3 py-1.5 rounded-xl text-sm">
                                OMIT
                            </div>
                            <div>
                                <h1 className="font-extrabold text-slate-800 text-sm lg:text-base">
                                    {studentName} <span className="text-slate-400 text-xs font-normal">(學生)</span>
                                </h1>
                                <p className="text-[11px] text-slate-400 font-mono">房號: {roomCode}</p>
                            </div>
                        </div>

                        <button 
                            onClick={onExit}
                            className="bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-xl text-xs font-bold transition"
                        >
                            離開課堂
                        </button>
                    </header>

                    {/* Feature 3: Showcase Peer Review Modal for Students */}
                    {showcasedResponse && (
                        <div className="bg-gradient-to-r from-amber-500 to-orange-500 text-white p-4 shadow-lg sticky top-[57px] z-20">
                            <div className="max-w-3xl mx-auto space-y-3">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center space-x-2">
                                        <Icon name="broadcast" className="w-5 h-5 animate-bounce" />
                                        <h3 className="font-black text-sm lg:text-base">🌟 老師分享作品（學生互評討論）</h3>
                                    </div>
                                    <span className="bg-white/20 text-xs px-2.5 py-0.5 rounded-full font-bold">
                                        作者：{showcasedResponse.studentName}
                                    </span>
                                </div>

                                <div className="bg-white rounded-2xl p-4 text-slate-800 shadow-inner max-h-60 overflow-y-auto flex items-center justify-center">
                                    {showcasedResponse.mode === 'DRAW' ? (
                                        <div className="relative w-full h-48 flex items-center justify-center">
                                            {showcasedResponse.bgImage && (
                                                <img 
                                                    src={showcasedResponse.bgImage} 
                                                    alt="Bg" 
                                                    className="absolute inset-0 w-full h-full object-contain opacity-40" 
                                                />
                                            )}
                                            <img 
                                                src={showcasedResponse.answer} 
                                                alt="Peer work" 
                                                className="relative z-10 max-h-full max-w-full object-contain" 
                                            />
                                        </div>
                                    ) : (
                                        <p className="text-xl font-bold text-center text-indigo-700">
                                            {showcasedResponse.answer}
                                        </p>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Student Workspace */}
                    <div className="max-w-3xl w-full mx-auto px-4 py-6 space-y-6">
                        {!activeQuestion ? (
                            <div className="bg-white rounded-3xl p-12 text-center shadow-sm border border-slate-200 space-y-3">
                                <p className="text-4xl animate-bounce">☕</p>
                                <h2 className="text-lg font-black text-slate-800">等待老師發佈題目中...</h2>
                                <p className="text-xs text-slate-400">請保持頁面開啟，當老師發佈題目時會即時顯示。</p>
                            </div>
                        ) : (
                            <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 space-y-6">
                                {/* Question Title */}
                                <div className="space-y-2 border-b border-slate-100 pb-4">
                                    <div className="flex items-center justify-between">
                                        <span className="bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full border border-indigo-200">
                                            {activeQuestion.mode === 'CHOICE' ? '多項選擇題' : activeQuestion.mode === 'TF' ? '是非題' : activeQuestion.mode === 'SHORT' ? '簡答題' : '白板繪圖題'}
                                        </span>
                                        {/* Feature 4: Allow edit indicator */}
                                        <span className="text-[11px] text-slate-400 font-medium">
                                            {activeQuestion.allowEdit ? '🔄 允許修改答案' : '🔒 提交後鎖定答案'}
                                        </span>
                                    </div>
                                    <h2 className="text-lg font-black text-slate-800 leading-snug">
                                        {activeQuestion.text}
                                    </h2>
                                </div>

                                {/* Multiple Choice Answer Mode */}
                                {activeQuestion.mode === 'CHOICE' && (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        {activeQuestion.choiceOptions.map((opt) => (
                                            <button
                                                key={opt}
                                                disabled={isSubmitted && !activeQuestion.allowEdit}
                                                onClick={() => {
                                                    setSelectedChoice(opt);
                                                    handleSubmitAnswer(opt);
                                                }}
                                                className={`p-4 rounded-2xl text-lg font-black border-2 transition flex items-center justify-between ${
                                                    selectedChoice === opt 
                                                    ? 'bg-indigo-600 text-white border-indigo-600 shadow-md shadow-indigo-200 scale-102' 
                                                    : 'bg-slate-50 border-slate-200 text-slate-700 hover:border-indigo-300'
                                                }`}
                                            >
                                                <span>選項 {opt}</span>
                                                {selectedChoice === opt && <Icon name="check" className="w-6 h-6" />}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {/* True / False Answer Mode */}
                                {activeQuestion.mode === 'TF' && (
                                    <div className="grid grid-cols-2 gap-4">
                                        {[
                                            { key: 'O', label: '⭕ 正確 (O)', color: 'emerald' },
                                            { key: 'X', label: '❌ 錯誤 (X)', color: 'rose' }
                                        ].map((item) => (
                                            <button
                                                key={item.key}
                                                disabled={isSubmitted && !activeQuestion.allowEdit}
                                                onClick={() => {
                                                    setSelectedChoice(item.key);
                                                    handleSubmitAnswer(item.key);
                                                }}
                                                className={`p-6 rounded-2xl text-xl font-black border-2 transition flex flex-col items-center justify-center space-y-2 ${
                                                    selectedChoice === item.key 
                                                    ? `bg-${item.color}-600 text-white border-${item.color}-600 shadow-lg` 
                                                    : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'
                                                }`}
                                            >
                                                <span>{item.label}</span>
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {/* Short Answer Mode */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div className="space-y-4">
                                        <textarea
                                            rows={4}
                                            disabled={isSubmitted && !activeQuestion.allowEdit}
                                            value={shortAnswer}
                                            onChange={(e) => setShortAnswer(e.target.value)}
                                            placeholder="請在此輸入您的回答..."
                                            className="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                                        />
                                        <button
                                            disabled={isSubmitted && !activeQuestion.allowEdit}
                                            onClick={() => handleSubmitAnswer(shortAnswer)}
                                            className="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-bold py-3.5 rounded-xl shadow-lg transition"
                                        >
                                            {isSubmitted ? '修改並重新提交' : '提交答案 🚀'}
                                        </button>
                                    </div>
                                )}

                                {/* Whiteboard Drawing Answer Mode (Feature 2) */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <div className="space-y-4">
                                        {/* Canvas Controls */}
                                        <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex flex-wrap items-center justify-between gap-3">
                                            <div className="flex items-center space-x-2">
                                                {['#2563eb', '#dc2626', '#16a34a', '#000000', '#9333ea'].map((color) => (
                                                    <button
                                                        key={color}
                                                        onClick={() => { setPenColor(color); setIsEraser(false); }}
                                                        style={{ backgroundColor: color }}
                                                        className={`w-7 h-7 rounded-full transition transform ${
                                                            penColor === color && !isEraser ? 'scale-125 ring-2 ring-indigo-500' : ''
                                                        }`}
                                                    />
                                                ))}
                                                <button
                                                    onClick={() => setIsEraser(!isEraser)}
                                                    className={`px-3 py-1.5 rounded-xl text-xs font-bold border ${
                                                        isEraser ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-slate-700'
                                                    }`}
                                                >
                                                    🧹 橡皮擦
                                                </button>
                                            </div>

                                            <div className="flex items-center space-x-2">
                                                <button
                                                    onClick={clearCanvas}
                                                    className="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold transition"
                                                >
                                                    清空重畫
                                                </button>
                                            </div>
                                        </div>

                                        {/* Canvas Container */}
                                        <div className="canvas-container relative bg-white border-2 border-slate-200 rounded-2xl overflow-hidden shadow-inner touch-none">
                                            <canvas
                                                ref={canvasRef}
                                                width={600}
                                                height={400}
                                                onMouseDown={startDrawing}
                                                onMouseMove={draw}
                                                onMouseUp={stopDrawing}
                                                onMouseLeave={stopDrawing}
                                                onTouchStart={startDrawing}
                                                onTouchMove={draw}
                                                onTouchEnd={stopDrawing}
                                                className="w-full h-auto block cursor-crosshair"
                                            />
                                        </div>

                                        <button
                                            disabled={isSubmitted && !activeQuestion.allowEdit}
                                            onClick={() => handleSubmitAnswer()}
                                            className="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-bold py-3.5 rounded-xl shadow-lg transition"
                                        >
                                            {isSubmitted ? '修改作品並重新提交' : '提交白板作品 🎨'}
                                        </button>
                                    </div>
                                )}

                                {/* Submission Confirmation Toast/Badge */}
                                {isSubmitted && (
                                    <div className="bg-emerald-50 border border-emerald-200 text-emerald-700 p-3 rounded-xl text-xs font-bold text-center flex items-center justify-center space-x-1">
                                        <Icon name="check" className="w-4 h-4" />
                                        <span>已成功提交作答！{activeQuestion.allowEdit ? '您可以繼續修飾答案並更新。' : '答案已鎖定。'}</span>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<OMITApp />);
    </script>
</body>
</html>
