        // Mode label helper

        }

        // Sound synthesizer (Web Audio API)
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                    });
                    if (window.confetti) window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.error("Audio synth error:", e);
            }
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (
                <div class={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-xl shadow-lg flex items-center space-x-2 text-sm font-medium animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        // Word .docx template generator using JSZip
        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) throw new Error("JSZip library not loaded");
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>${paragraphsXml}</w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        // Parse Word (.docx) or Text content
        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '課堂評估';
            let totalScore = 100;
            const questions = [];
            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) questions.push(currentQ);
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }
                    currentQ.options.push({ letter, text: optText });
                    if (isCorrect) currentQ.answer = letter;
                }
            });

            if (currentQ && currentQ.options.length > 0) questions.push(currentQ);

            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1, text: "以下哪一項不是地球的天然資源?",
                            options: [{ letter: "A", text: "水資源" }, { letter: "B", text: "植物資源" }, { letter: "C", text: "動物資源" }, { letter: "D", text: "機械資源" }],
                            answer: "D"
                        },
                        {
                            num: 2, text: "芝士的原料屬於哪一項地球的天然資源?",
                            options: [{ letter: "A", text: "水資源" }, { letter: "B", text: "植物資源" }, { letter: "C", text: "動物資源" }, { letter: "D", text: "礦產資源" }],
                            answer: "C"
                        }
                    ]
                };
            }

            return { title, totalScore, questions };
        };

        // Precise Whiteboard Canvas Component (1280x720 internal resolution, scaleX/scaleY touch offset fix)
        function WhiteboardCanvas({ bgImage, onSave, onCancel, isTeacherDemo = false, onToggleBroadcast, isBroadcasting = false }) {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [penColor, setPenColor] = useState('#2563eb');
            const [penWidth, setPenWidth] = useState(4);
            const [isEraser, setIsEraser] = useState(false);
            const [customBg, setCustomBg] = useState(bgImage || null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                // Clear and render background if present
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (customBg) {
                    const img = new Image();
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    };
                    img.src = customBg;
                }
            }, [customBg]);

            const getCanvasPos = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                setIsDrawing(true);
                const pos = getCanvasPos(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const pos = getCanvasPos(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                if (isEraser) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = penWidth * 4;
                } else {
                    ctx.strokeStyle = penColor;
                    ctx.lineWidth = penWidth;
                }
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const handleClear = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                if (customBg) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    img.src = customBg;
                }
            };

            const handleUploadBg = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => setCustomBg(evt.target.result);
                    reader.readAsDataURL(file);
                }
            };

            const handleConfirmSubmit = () => {
                const dataUrl = canvasRef.current.toDataURL('image/png');
                onSave(dataUrl);
            };

            return (
                <div class="space-y-4 max-w-4xl mx-auto bg-white p-4 rounded-3xl shadow-lg border border-slate-200">
                    {/* Toolbar */}
                    <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-50 p-3 rounded-2xl border">
                        <div class="flex items-center space-x-2">
                            {['#2563eb', '#dc2626', '#16a34a', '#d97706', '#000000'].map(c => (
                                <button
                                    key={c}
                                    onClick={() => { setPenColor(c); setIsEraser(false); }}
                                    class={`w-8 h-8 rounded-full border-2 transition ${!isEraser && penColor === c ? 'scale-110 ring-2 ring-indigo-400' : ''}`}
                                    style={{ backgroundColor: c }}
                                />
                            ))}
                        </div>

                        <div class="flex items-center space-x-3">
                            <span class="text-xs font-bold text-slate-500">筆觸 (2px-18px)：</span>
                            <input 
                                type="range" 
                                min="2" 
                                max="18" 
                                value={penWidth} 
                                onChange={(e) => setPenWidth(parseInt(e.target.value))} 
                                class="w-24 accent-indigo-600"
                            />
                            <span class="text-xs font-mono font-bold w-6">{penWidth}px</span>
                        </div>

                        <div class="flex items-center space-x-2">
                            <button 
                                onClick={() => setIsEraser(!isEraser)} 
                                class={`px-3 py-1.5 rounded-xl font-bold text-xs border transition ${isEraser ? 'bg-amber-500 text-white border-amber-600' : 'bg-white text-slate-700'}`}
                            >
                                🧽 擦膠
                            </button>
                            <button 
                                onClick={handleClear} 
                                class="px-3 py-1.5 rounded-xl bg-red-50 hover:bg-red-100 text-red-600 font-bold text-xs border border-red-200 transition"
                            >
                                🗑️ 一鍵清空
                            </button>
                            <label class="px-3 py-1.5 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-700 font-bold text-xs border border-purple-200 cursor-pointer transition">
                                🖼️ 上載背景圖
                                <input type="file" accept="image/*" onChange={handleUploadBg} class="hidden" />
                            </label>
                        </div>
                    </div>

                    {/* Canvas Container */}
                    <div class="canvas-container relative w-full aspect-16-9 bg-white border-2 border-slate-300 rounded-2xl overflow-hidden shadow-inner">
                        <canvas
                            ref={canvasRef}
                            width={1280}
                            height={720}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            class="w-full h-full block bg-white touch-none cursor-crosshair"
                        />
                    </div>

                    {/* Bottom Action Bar */}
                    <div class="flex justify-between items-center pt-2">
                        {onCancel && (
                            <button onClick={onCancel} class="px-5 py-2.5 rounded-xl bg-slate-200 text-slate-700 font-bold text-sm">
                                關閉白板
                            </button>
                        )}
                        {isTeacherDemo && onToggleBroadcast && (
                            <button 
                                onClick={onToggleBroadcast}
                                class={`px-6 py-2.5 rounded-xl font-extrabold text-sm shadow transition ${
                                    isBroadcasting 
                                    ? 'bg-purple-600 text-white ring-4 ring-purple-300' 
                                    : 'bg-slate-800 text-white hover:bg-slate-900'
                                }`}
                            >
                                {isBroadcasting ? '📡 正全班廣播中 (按此收回)' : '📢 廣播分享至全班螢幕'}
                            </button>
                        )}
                        {onSave && (
                            <button 
                                onClick={handleConfirmSubmit} 
                                class="px-8 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-base shadow-lg shadow-indigo-200 active:scale-98"
                            >
                                ✅ 確認提交白板作品
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        // Audio Recording Component
        function AudioRecorder({ onConfirmSubmit }) {
            const [recording, setRecording] = useState(false);
            const [audioBlob, setAudioBlob] = useState(null);
            const [audioUrl, setAudioUrl] = useState(null);
            const [secondsLeft, setSecondsLeft] = useState(10);
            const mediaRecorderRef = useRef(null);
            const chunksRef = useRef([]);
            const timerRef = useRef(null);

            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    chunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => chunksRef.current.push(e.data);
                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(chunksRef.current, { type: 'audio/webm' });
                        setAudioBlob(blob);
                        setAudioUrl(URL.createObjectURL(blob));
                        stream.getTracks().forEach(t => t.stop());
                    };

                    mediaRecorderRef.current.start();
                    setRecording(true);
                    setSecondsLeft(10);

                    timerRef.current = setInterval(() => {
                        setSecondsLeft(prev => {
                            if (prev <= 1) {
                                stopRecording();
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                } catch (err) {
                    alert("無法讀取麥克風權限，請於瀏覽器允許錄音！");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
                    mediaRecorderRef.current.stop();
                }
                setRecording(false);
                if (timerRef.current) clearInterval(timerRef.current);
            };

            const handleReRecord = () => {
                setAudioBlob(null);
                setAudioUrl(null);
                setSecondsLeft(10);
            };

            const handleConfirm = () => {
                if (!audioBlob) return;
                const reader = new FileReader();
                reader.onloadend = () => {

                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = '評估範本Word檔.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast("已下載 5題選擇題 的評估範本Word檔 (.docx)！", "success");

                    showToast("下載失敗，請重試！", "error");
                }
            };

            const handleWordFileUpload = (e, isGroupMode = false) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const result = await window.mammoth.extractRawText({ arrayBuffer: evt.target.result });
                            parsedData = parseWordChallengeText(result.value);
                        } else {
                            parsedData = parseWordChallengeText(evt.target.result);
                        }

                        if (isGroupMode) setGroupDocxData(parsedData);
                        else setChallengeData(parsedData);

                        showToast(`已成功解析評估內容！共 ${parsedData.questions.length} 題`, 'success');
                    } catch (err) {
                        showToast("文件解析失敗，請確認格式！", "error");
                    }
                };

                if (file.name.endsWith('.docx')) reader.readAsArrayBuffer(file);
                else reader.readAsText(file, "UTF-8");
            };

            // Group Competition Logic
            const handleGenerateGroups = () => {
                if (studentsList.length < 3) {
                    showToast("目前學生人數少於 3 人，無法進行分組合作競賽！", "error");
                    return;
                }

                const shuffledStudents = [...studentsList].sort(() => Math.random() - 0.5);
                const groupCount = Math.max(1, Math.floor(shuffledStudents.length / 3));
                const newGroups = [];

                const shuffledPresets = [...ANIMAL_PRESETS].sort(() => Math.random() - 0.5);

                for (let i = 0; i < groupCount; i++) {
                    const preset = shuffledPresets[i % shuffledPresets.length];
                    newGroups.push({
                        ...preset,
                        members: []
                    });
                }

                shuffledStudents.forEach((student, idx) => {
                    const targetGroupIndex = idx % groupCount;
                    newGroups[targetGroupIndex].members.push(student);
                });

                setAssignedGroups(newGroups);
                setGroupStage('GROUPING');

                const initialProg = {};
                newGroups.forEach((_, idx) => initialProg[idx] = 0);

                const newQ = {

                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);
                publishQuestionToFirestore(newQ, updatedHistory);
                showToast(`已成功發佈【${getModeLabel(selectedMode)}】！`, 'success');
            };

            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已發放全班挑戰題成績！", "success");
            };

            const handleToggleBroadcastDemoCanvas = (canvasDataUrl) => {
                const updatedIsBroadcasting = !isBroadcastingTeacherCanvas;
                setIsBroadcastingTeacherCanvas(updatedIsBroadcasting);

                const updatedQ = {
                    ...activeQuestion,
                    teacherDemoCanvas: updatedIsBroadcasting ? canvasDataUrl : null
                };
                publishQuestionToFirestore(updatedQ);
                showToast(updatedIsBroadcasting ? "已廣播示範白板至全班學生螢幕！" : "已收回示範白板廣播", "info");
            };

            // Revision Item 20, 30: Detailed CSV export
            const handleExportCSVReport = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生紀錄可供匯出！", "error");
                    return;
                }

                let csvContent = "\uFEFF";
                csvContent += "學號,學生姓名,加入時間";

                historyQuestions.forEach((q, idx) => {
                    if (q.mode === 'CHALLENGE' && q.challenge) {
                        csvContent += `,第${idx + 1}題[挑戰題:${q.challenge.title}得分],正確率,用時(秒)`;
                        q.challenge.questions.forEach((cq) => {
                            csvContent += `,第${cq.num}題學生選擇`;
                        });
                    } else {
                        csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]: "${(q.text || '').replace(/"/g, '""')}"`;
                    }
                });
                csvContent += "\n";

                const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

                sortedStudents.forEach((stu) => {
                    csvContent += `"${stu.seatNumber}號","${(stu.name || '').replace(/"/g, '""')}","${stu.joinTime || ''}"`;
                    
                    historyQuestions.forEach((q) => {
                        const resKey = `${q.id}_${stu.id}`;
                        const res = responses[resKey];
                        
                        if (res && res.answer !== undefined && res.answer !== null) {
                            if (q.mode === 'CHALLENGE' && res.scoreDetails) {
                                csvContent += `,"${res.scoreDetails.totalScore}/${q.challenge.totalScore}分","${res.scoreDetails.percentage}%","${res.duration || 0}"`;
                                q.challenge.questions.forEach((cq) => {
                                    const ans = res.answer[cq.num] || '未答';
                                    csvContent += `,"${ans}"`;
                                });
                            } else {
                                let ansVal = res.answer;
                                if (typeof ansVal === 'string' && ansVal.startsWith('data:image')) ansVal = '[白板作品]';
                                if (typeof ansVal === 'string' && ansVal.startsWith('data:audio')) ansVal = '[語音錄音]';
                                csvContent += `,"${String(ansVal).replace(/"/g, '""')} (用時:${res.duration || 0}s)"`;
                            }
                        } else {
                            if (q.mode === 'CHALLENGE') {
                                csvContent += `,"未作答","0%","0"`;
                                q.challenge?.questions.forEach(() => csvContent += `,"-"`);
                            } else {
                                csvContent += `,"未作答"`;
                            }
                        }
                    });
                    csvContent += "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `OMIT_全班挑戰題與學習報告_房號${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("已成功匯出 CSV 成績試算表！", "success");
            };

            // Leaderboard list
            const leaderboard = useMemo(() => {
                return Object.values(currentQuestionResponses)
                    .filter(r => r.duration !== undefined)
                    .sort((a, b) => {
                        if (activeQuestion?.mode === 'CHALLENGE') {
                            const scoreA = a.scoreDetails?.totalScore || 0;
                            const scoreB = b.scoreDetails?.totalScore || 0;
                            if (scoreB !== scoreA) return scoreB - scoreA;
                        }
                        return parseFloat(a.duration) - parseFloat(b.duration);
                    });
            }, [currentQuestionResponses, activeQuestion]);

            // Revision Item 18: Buzzer only locks top 1 fastest student
            const buzzerWinner = useMemo(() => {
                if (activeQuestion?.mode !== 'BUZZER') return null;
                const sorted = Object.values(currentQuestionResponses).sort((a, b) => parseFloat(a.duration) - parseFloat(b.duration));
                return sorted[0] || null;
            }, [currentQuestionResponses, activeQuestion]);

            return (
                <div class="min-h-screen pb-12">
                    {/* Revision Item 9: Teacher Top Title */}
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 py-3">
                        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                            <div class="flex items-center space-x-3">
                                <span class="bg-slate-900 text-white font-black px-3 py-1.5 rounded-xl text-lg">OMIT</span>
                                <div>
                                    <h1 class="font-extrabold text-slate-800 text-base md:text-lg">
                                        宣道會陳元喜小學OMIT互動課堂
                                    </h1>
                                    <span class="text-xs bg-indigo-100 text-indigo-700 font-mono font-bold px-2 py-0.5 rounded-full">
                                        房號：{roomCode}
                                    </span>
                                </div>
                            </div>

                            <div class="flex flex-wrap items-center gap-2">
                                <button 
                                    onClick={() => setShowQRModal(true)}
                                    class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-2 rounded-xl border border-indigo-200 text-xs md:text-sm flex items-center space-x-1.5 transition"
                                >
                                    <span>📱 QR Code</span>
                                    <span class="bg-indigo-600 text-white px-2 py-0.5 rounded-full text-xs font-mono font-bold">
                                        {studentsList.length}
                                    </span>
                                </button>

                                <button 
                                    onClick={() => setShowRandomModal(true)}
                                    class="bg-purple-50 hover:bg-purple-100 text-purple-700 font-bold px-3 py-2 rounded-xl border border-purple-200 text-xs md:text-sm transition"
                                >
                                    🎲 抽選學生
                                </button>

                                <button 
                                    onClick={() => setShowTeacherDemoWhiteboard(true)}
                                    class="bg-purple-600 hover:bg-purple-700 text-white font-extrabold px-3.5 py-2 rounded-xl text-xs md:text-sm shadow transition"
                                >

                                </button>

                                <button 
                                    onClick={() => setShowTimerModal(true)}
                                    class={`px-3 py-2 rounded-xl border text-xs md:text-sm font-bold flex items-center space-x-1.5 transition ${
                                        timerActive ? 'bg-amber-500 text-white border-amber-600 animate-pulse' : 'bg-amber-50 hover:bg-amber-100 text-amber-800 border-amber-200'
                                    }`}
                                >
                                    <span>⏱️ 計時器</span>
                                    {timerSeconds > 0 && (
                                        <span class="bg-white/20 font-mono text-xs px-1.5 py-0.5 rounded">
                                            {Math.floor(timerSeconds / 60)}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                        </span>
                                    )}
                                </button>

                                <button 
                                    onClick={handleExportCSVReport}
                                    class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold px-3 py-2 rounded-xl border border-blue-200 text-xs md:text-sm transition"
                                >
                                    📥 匯出報告 (.csv)
                                </button>

                                <button 
                                    onClick={handleExitRoom}
                                    class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2 rounded-xl border border-rose-200 text-xs md:text-sm transition"
                                >
                                    🚪 退出課室
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

                        {/* Mode Selectors */}
                        <div class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-9 gap-2.5">
                            {[
                                { id: 'CHOICE', label: '選擇題', icon: '🔘' },
                                { id: 'TF', label: '是非題', icon: '⭕' },
                                { id: 'SHORT', label: '短答題', icon: '✍️' },
                                { id: 'DRAW', label: '白板題', icon: '🎨' },
                                { id: 'BUZZER', label: '搶答題', icon: '🚨' },
                                { id: 'AUDIO', label: '錄音題', icon: '🎤' },
                                { id: 'CHALLENGE', label: '挑戰題', icon: '🏆' },
                                { id: 'GROUP', label: '合作題', icon: '🧩' },
                                { id: 'LINK', label: '派送連結', icon: '🔗' }

                        {/* Mode Setup Panel */}
                        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                            <div class="flex items-center justify-between border-b pb-3">
                                <h2 class="font-extrabold text-slate-800 text-lg">
                                    模式設定：{getModeLabel(selectedMode)}

                            </div>

                            {/* Group Mode Setup (合作題) */}
                            {selectedMode === 'GROUP' && (
                                <div class="bg-gradient-to-r from-teal-50 to-emerald-50 border border-teal-200 p-5 rounded-2xl space-y-4">
                                    <div class="flex justify-between items-center border-b border-teal-200 pb-3">
                                        <h3 class="font-black text-teal-900 text-base">🧩 合作題競賽流程 (預備 ➔ 分組 ➔ 比賽)</h3>
                                        <button 
                                            type="button"

                                            class="bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow"

                                            📄 下載評估範本Word檔

                                    <div class="space-y-3">

                                        />

                                            </div>
                                        )}
                                    </div>

                                    <div class="flex space-x-3 pt-2">
                                        <button 
                                            type="button"
                                            onClick={handleGenerateGroups}
                                            class="flex-1 py-3.5 bg-teal-600 hover:bg-teal-700 text-white font-black rounded-2xl shadow text-base active:scale-98"
                                        >
                                            🎲 進入「分組」階段 (隨機分組3-4人)
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* Challenge Mode Setup */}
                            {selectedMode === 'CHALLENGE' && (
                                <div class="bg-amber-50/80 border border-amber-200 p-5 rounded-2xl space-y-4">
                                    <div class="flex justify-between items-center border-b border-amber-200 pb-3">
                                        <h3 class="font-black text-amber-900 text-base">🏆 挑戰題 Word 檔案上載與限時設定</h3>
                                        <button 
                                            type="button"
                                            onClick={handleDownloadChallengeTemplate}
                                            class="bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow"
                                        >
                                            📄 下載評估範本Word檔
                                        </button>
                                    </div>

                                    <div class="space-y-3">
                                        <label class="block text-xs font-bold text-slate-700">上載 Word 文件 (.docx) / 文字檔 (.txt)：</label>
                                        <input 
                                            type="file" 
                                            accept=".docx,.txt"
                                            onChange={(e) => handleWordFileUpload(e, false)}
                                            class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-600 file:text-white hover:file:bg-amber-700"
                                        />

                                        {challengeData && (
                                            <div class="bg-white p-4 rounded-xl border border-amber-200 space-y-3">
                                                <div class="font-bold text-amber-900 text-sm">✏️ 教師編輯/確認評估內容 ({challengeData.questions.length} 題)：</div>
                                                <div class="space-y-2 max-h-60 overflow-y-auto">
                                                    {challengeData.questions.map((q, idx) => (
                                                        <div key={idx} class="p-2.5 bg-slate-50 rounded-lg text-xs border flex justify-between items-center">
                                                            <span class="font-medium">{q.num}. {q.text} (正解: {q.answer})</span>
                                                            <button 
                                                                onClick={() => {
                                                                    const newQs = challengeData.questions.filter((_, i) => i !== idx);
                                                                    setChallengeData({ ...challengeData, questions: newQs });
                                                                }}
                                                                class="text-red-600 font-bold hover:underline"
                                                            >
                                                                刪除
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-white p-4 rounded-xl border border-amber-200">
                                        <div class="space-y-2">
                                            <div class="flex items-center justify-between">
                                                <label class="text-xs font-bold text-slate-700">開啟答題限時模式：</label>
                                                <input 
                                                    type="checkbox" 
                                                    checked={challengeEnableTimer}
                                                    onChange={(e) => setChallengeEnableTimer(e.target.checked)}
                                                    class="w-4 h-4 accent-amber-600"
                                                />
                                            </div>
                                            {challengeEnableTimer && (
                                                <div class="space-y-2">
                                                    <div class="flex items-center space-x-1.5">
                                                        {[60, 120, 180, 240, 300].map(s => (
                                                            <button 
                                                                key={s} 
                                                                type="button"
                                                                onClick={() => setChallengeTimeLimit(s)}
                                                                class={`px-2.5 py-1 text-xs rounded-lg font-bold border ${challengeTimeLimit === s ? 'bg-amber-600 text-white' : 'bg-slate-50 text-slate-700'}`}
                                                            >
                                                                {s / 60}分鐘
                                                            </button>
                                                        ))}
                                                    </div>
                                                    <div class="flex items-center space-x-2 text-xs font-bold text-amber-900 pt-1">
                                                        <span>手動輸入時間 (00:00)：</span>
                                                        <input 
                                                            type="number" 
                                                            min="0" 
                                                            max="99"
                                                            value={Math.floor(challengeTimeLimit / 60)}
                                                            onChange={(e) => setChallengeTimeLimit((parseInt(e.target.value) || 0) * 60 + (challengeTimeLimit % 60))}
                                                            class="w-10 border rounded text-center py-1"
                                                        />
                                                        <span>分</span>
                                                        <input 
                                                            type="number" 
                                                            min="0" 
                                                            max="59"
                                                            value={challengeTimeLimit % 60}
                                                            onChange={(e) => setChallengeTimeLimit(Math.floor(challengeTimeLimit / 60) * 60 + (parseInt(e.target.value) || 0))}
                                                            class="w-10 border rounded text-center py-1"
                                                        />
                                                        <span>秒</span>
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        <div class="space-y-2 border-t md:border-t-0 md:border-l md:pl-4 pt-3 md:pt-0">
                                            <label class="text-xs font-bold text-slate-700 block">成績發放控制：</label>
                                            <div class="space-y-1 text-xs font-bold">
                                                <label class="flex items-center space-x-2 cursor-pointer">
                                                    <input 
                                                        type="radio" 
                                                        name="scoreRel" 
                                                        checked={challengeReleaseInstant}
                                                        onChange={() => setChallengeReleaseInstant(true)}
                                                        class="accent-amber-600"
                                                    />
                                                    <span>提交後即時給予分數</span>
                                                </label>
                                                <label class="flex items-center space-x-2 cursor-pointer">
                                                    <input 
                                                        type="radio" 
                                                        name="scoreRel" 
                                                        checked={!challengeReleaseInstant}
                                                        onChange={() => setChallengeReleaseInstant(false)}
                                                        class="accent-amber-600"
                                                    />
                                                    <span>待所有學生完成提交後由教師按鍵一併發放</span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {selectedMode !== 'GROUP' && selectedMode !== 'CHALLENGE' && selectedMode !== 'BUZZER' && (
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 mb-1">題目內容 (可留空，顯示預設指引)：</label>
                                    <input 
                                        type="text" 
                                        placeholder={`預設：「${getDefaultQuestionPrompt(selectedMode)}」`} 
                                        value={questionText}
                                        onChange={(e) => setQuestionText(e.target.value)}
                                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
                                    />
                                </div>
                            )}

                            {selectedMode !== 'GROUP' && (
                                <button 
                                    onClick={handlePublishQuestion}
                                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-indigo-200 text-base transition active:scale-98"
                                >
                                    🚀 發佈【{getModeLabel(selectedMode)}】給全班學生
                                </button>
                            )}
                        </div>

                        {/* Active Question Responses / Group Race Monitor */}
                        {activeQuestion && (

                                        <h3 class="text-xl font-black text-slate-800">{activeQuestion.text}</h3>
                                    </div>
                                    <div class="text-right">
                                        {activeQuestion.mode === 'CHALLENGE' && !activeQuestion.challenge?.scoresReleased && (

                                                class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-4 py-2 rounded-xl shadow animate-pulse"
                                            >

                                            </button>
                                        )}
                                    </div>

                                {/* Group Competition Stage View */}
                                {activeQuestion.mode === 'GROUP' && (
                                    <div class="space-y-6">
                                        {groupStage === 'GROUPING' && (

                                                <div class="flex justify-between items-center border-b border-teal-200 pb-3">
                                                    <h4 class="font-black text-teal-900 text-lg">分組名單 (系統已隨機分組)</h4>
                                                    <div class="flex space-x-2">

                                                        return (
                                                            <div key={idx} class="space-y-1.5">
                                                                <div class="flex justify-between items-center text-sm font-bold">
