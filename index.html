                                <div class="flex items-center space-x-2 pt-2 border-t">
                                    <span class="text-xs font-bold text-slate-600">自訂手動時間「00:00」：</span>
                                    <div class="flex items-center border rounded-xl px-3 py-1.5 font-mono font-bold text-base">
                                        <input 
                                            type="number" 
                                            value={timerMinutesInput} 
                                            onChange={(e) => setTimerMinutesInput(e.target.value)}
                                            class="w-10 text-center outline-none"
                                            placeholder="00"
                                        />
                                        <span>:</span>
                                        <input 
                                            type="number" 
                                            value={timerSecondsInput} 
                                            onChange={(e) => setTimerSecondsInput(e.target.value)}
                                            class="w-10 text-center outline-none"
                                            placeholder="00"
                                        />
                                    </div>
                                    <button 
                                        onClick={() => {
                                            const total = (parseInt(timerMinutesInput) || 0) * 60 + (parseInt(timerSecondsInput) || 0);
                                            setTimerSeconds(total || 60);
                                            setTimerActive(true);
                                        }}
                                        class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold shadow"
                                    >
                                        設定並開始
                                    </button>
                                </div>

                                <div class="flex space-x-2 pt-2">
                                    <button 
                                        onClick={() => setTimerActive(!timerActive)}
                                        class={`flex-1 py-3 rounded-xl font-bold text-sm text-white shadow transition ${timerActive ? 'bg-amber-500' : 'bg-emerald-600'}`}
                                    >
                                        {timerActive ? '暫停計時' : '繼續計時'}
                                    </button>
                                    <button 
                                        onClick={() => { setTimerActive(false); setTimerSeconds(0); }}
                                        class="px-5 py-3 rounded-xl bg-slate-200 text-slate-700 font-bold text-sm"
                                    >
                                        重置
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Item 2: Inspection Modal for Whiteboard Zoom / Switch */}
                    {showInspectModal && (
                        <div class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-3xl w-full space-y-4 shadow-2xl">
                                <div class="flex justify-between items-center">
                                    <h3 class="text-lg font-black text-slate-800">
                                        作品瀏覽：{showInspectModal.name} ({showInspectModal.seatNumber}號)
                                    </h3>
                                    <button onClick={() => setShowInspectModal(null)} class="text-slate-400 text-2xl font-bold">✕</button>
                                </div>

                                <div class="aspect-16-9 bg-slate-100 rounded-2xl overflow-hidden border-2 flex items-center justify-center">
                                    <img src={showInspectModal.answer} class="max-h-full object-contain" alt="大圖" />
                                </div>

                                <div class="flex justify-between items-center pt-2">
                                    <div class="flex space-x-2">
                                        <button 
                                            onClick={() => {
                                                const idx = whiteboardSubmissions.findIndex(s => s.studentId === showInspectModal.studentId);
                                                if (idx > 0) setShowInspectModal(whiteboardSubmissions[idx - 1]);
                                            }}
                                            class="px-4 py-2 rounded-xl bg-slate-100 font-bold text-sm text-slate-700 hover:bg-slate-200"
                                        >
                                            ⬅️ 上一位學生
                                        </button>
                                        <button 
                                            onClick={() => {
                                                const idx = whiteboardSubmissions.findIndex(s => s.studentId === showInspectModal.studentId);
                                                if (idx < whiteboardSubmissions.length - 1) setShowInspectModal(whiteboardSubmissions[idx + 1]);
                                            }}
                                            class="px-4 py-2 rounded-xl bg-slate-100 font-bold text-sm text-slate-700 hover:bg-slate-200"
                                        >
                                            下一位學生 ➡️
                                        </button>
                                    </div>

                                    <button 
                                        onClick={() => handleBroadcastSubmission(showInspectModal)}
                                        class="px-5 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-black text-sm shadow-md"
                                    >
                                        📢 一鍵廣播至全班螢幕進行互評
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Bar Chart Click Inspection Popover */}
                    {barChoiceFilter && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="text-lg font-black text-slate-800">選擇【{barChoiceFilter}】的學生名單</h3>
                                    <button onClick={() => setBarChoiceFilter(null)} class="text-slate-400 text-xl font-bold">✕</button>
                                </div>
                                <div class="max-h-60 overflow-y-auto divide-y">
                                    {Object.values(currentQuestionResponses).filter(r => r.answer === barChoiceFilter).map((res) => (
                                        <div key={res.studentId} class="py-2.5 flex justify-between items-center text-sm font-bold text-slate-800">
                                            <span>{res.seatNumber}號 - {res.name}</span>
                                            <span class="text-xs font-mono text-slate-400">答題用時: {res.duration}s</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Student Interface Component
        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, studentsList, showToast, onExit }) {
            const [myAnswer, setMyAnswer] = useState('');
            const [hasSubmitted, setHasSubmitted] = useState(false);
            const [submissionTime, setSubmissionTime] = useState(null);

            // Item 4: Audio recording state
            const [audioBlob, setAudioBlob] = useState(null);
            const [audioUrl, setAudioUrl] = useState(null);
            const [isRecording, setIsRecording] = useState(false);
            const [recordingTime, setRecordingTime] = useState(0);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            // Item 11 & 18: Challenge Timer State for Student
            const [challengeTimeLeft, setChallengeTimeLeft] = useState(0);

            // Item 21: Group assignment for student
            const myGroup = useMemo(() => {
                if (!activeQuestion?.groupMode?.groups) return null;
                return activeQuestion.groupMode.groups.find(grp => 
                    grp.members.some(m => m.id === studentId || m.seatNumber === seatNumber)
                );
            }, [activeQuestion, studentId, seatNumber]);

            // Item 21: Group Member Index (0, 1, 2, etc.) for splitting question & options
            const myMemberIndexInGroup = useMemo(() => {
                if (!myGroup) return 0;
                return myGroup.members.findIndex(m => m.id === studentId || m.seatNumber === seatNumber);
            }, [myGroup, studentId, seatNumber]);

            // Challenge answers array for multiple choice questions in a challenge
            const [challengeStudentAnswers, setChallengeStudentAnswers] = useState({});

            const myResponseKey = activeQuestion ? `${activeQuestion.id}_${studentId}` : null;
            const existingRes = myResponseKey ? responses[myResponseKey] : null;

            useEffect(() => {
                if (existingRes) {
                    setHasSubmitted(true);
                } else {
                    setHasSubmitted(false);
                    setMyAnswer('');
                    setAudioBlob(null);
                    setAudioUrl(null);
                    setChallengeStudentAnswers({});
                }
            }, [activeQuestion?.id, existingRes]);

            // Item 11 & 18: Challenge Timer CountDown & Auto Submit on 00:00
            useEffect(() => {
                if (activeQuestion?.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer && activeQuestion.challenge?.timeLimit) {
                    const elapsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                    const remaining = Math.max(0, activeQuestion.challenge.timeLimit - elapsed);
                    setChallengeTimeLeft(remaining);

                    const timer = setInterval(() => {
                        setChallengeTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timer);
                                // Auto submit at 00:00
                                if (!hasSubmitted) {
                                    handleChallengeSubmit(true);
                                }
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);

                    return () => clearInterval(timer);
                }
            }, [activeQuestion, hasSubmitted]);

            // Recording Handler
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const url = URL.createObjectURL(blob);
                        setAudioBlob(blob);
                        setAudioUrl(url);
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                    setRecordingTime(0);

                    const timer = setInterval(() => {
                        setRecordingTime(t => {
                            if (t >= 9) {
                                stopRecording();
                                clearInterval(timer);
                                return 10;
                            }
                            return t + 1;
                        });
                    }, 1000);

                } catch (err) {
                    console.error("Microphone access error:", err);
                    showToast("無法存取麥克風權限！", "error");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    mediaRecorderRef.current.stream.getTracks().forEach(track => track.stop());
                    setIsRecording(false);
                }
            };

            // Audio Delete/Re-record
            const handleDeleteRecording = () => {
                setAudioBlob(null);
                setAudioUrl(null);
                setRecordingTime(0);
                showToast("已刪除錄音，可重新錄製", "info");
            };

            // Unified Submit Logic
            const submitAnswerToFirestore = async (ansValue, additionalData = {}) => {
                if (!activeQuestion) return;
                const duration = ((Date.now() - activeQuestion.startTime) / 1000).toFixed(1);

                const resObj = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `${seatNumber}號`,
                    answer: ansValue,
                    duration: duration,
                    submittedAt: Date.now(),
                    ...additionalData
                };

                const appId = "omit-8c173";
                const db = window.fbDb;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', myResponseKey);
                
                await window.fbUtils.setDoc(resDocRef, resObj);
                setHasSubmitted(true);
                playSound('win');
            };

            // Audio Submit
            const handleAudioSubmit = () => {
                if (!audioBlob) {
                    showToast("請先錄製語音再提交！", "error");
                    return;
                }
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64Audio = reader.result;
                    submitAnswerToFirestore(base64Audio);
                };
                reader.readAsDataURL(audioBlob);
            };

            // Challenge Submit with Auto-grading
            const handleChallengeSubmit = (isAutoSubmit = false) => {
                if (!activeQuestion || !activeQuestion.challenge) return;

                const questions = activeQuestion.challenge.questions;
                let correctCount = 0;

                questions.forEach((q, idx) => {
                    const studentAns = challengeStudentAnswers[idx];
                    if (studentAns === q.answer) {
                        correctCount++;
                    }
                });

                const percentage = Math.round((correctCount / questions.length) * 100);
                const scoreObtained = Math.round((correctCount / questions.length) * activeQuestion.challenge.totalScore);

                const scoreDetails = {
                    totalScore: scoreObtained,
                    maxScore: activeQuestion.challenge.totalScore,
                    correctCount: correctCount,
                    totalQuestions: questions.length,
                    percentage: percentage
                };

                submitAnswerToFirestore(`挑戰題已完成 (${scoreObtained}分)`, {
                    scoreDetails: scoreDetails,
                    studentAnswers: challengeStudentAnswers,
                    isAutoSubmit: isAutoSubmit
                });

                if (isAutoSubmit) {
                    showToast("⏰ 限時已到！系統已自動收卷提交。", "info");
                }
            };

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col">
                    {/* Student Top Bar */}
                    <header class="bg-indigo-900 text-white px-4 py-3 sticky top-0 z-30 shadow-md">
                        <div class="max-w-md mx-auto flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <span class="bg-indigo-700 text-white font-mono text-xs font-bold px-2.5 py-1 rounded-lg">
                                    房號: {roomCode}
                                </span>
                                <span class="font-extrabold text-sm md:text-base">
                                    {seatNumber}號 - {studentName || '學生'}
                                </span>
                            </div>

                            <button onClick={onExit} class="text-xs font-bold bg-indigo-800 hover:bg-indigo-700 px-3 py-1.5 rounded-lg">
                                🚪 退出
                            </button>
                        </div>
                    </header>

                    {/* Student Content Area */}
                    <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4">

                        {/* Item 2: Broadcasted Submission View */}
                        {activeQuestion?.broadcastedSubmission && (
                            <div class="bg-purple-900 text-white p-4 rounded-3xl space-y-3 shadow-xl animate-fade-in">
                                <div class="flex items-center justify-between border-b border-purple-700 pb-2">
                                    <span class="font-black text-amber-300 text-sm">📢 全班廣播互評作品</span>
                                    <span class="text-xs bg-purple-700 px-2.5 py-0.5 rounded-full font-bold">
                                        {activeQuestion.broadcastedSubmission.name} ({activeQuestion.broadcastedSubmission.seatNumber}號)
                                    </span>
                                </div>
                                <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden border-2 border-purple-400">
                                    <img src={activeQuestion.broadcastedSubmission.answer} class="w-full h-full object-contain" alt="廣播作品" />
                                </div>
                            </div>
                        )}

                        {/* Item 21: Group Mode Banner */}
                        {activeQuestion?.groupMode && myGroup && (
                            <div class={`${myGroup.bgClass} text-white p-4 rounded-3xl shadow-lg space-y-2 border-2 border-white/30`}>
                                <div class="flex justify-between items-center">
                                    <span class="text-lg font-black">{myGroup.name} 🐾</span>
                                    <span class="text-xs bg-black/20 font-bold px-3 py-1 rounded-full">組員會合</span>
                                </div>
                                <p class="text-xs text-white/90 font-bold">
                                    組員：{myGroup.members.map(m => `${m.seatNumber}號${m.name}`).join('、')}
                                </p>
                                <div class="bg-white/20 p-2 rounded-xl text-center font-black text-xs animate-pulse">
                                    盡快與你的組員會合!比賽即將開始!
                                </div>
                            </div>
                        )}

                        {/* Active Question View */}
                        {activeQuestion ? (
                            <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-200 space-y-5">
                                <div class="space-y-1">
                                    <span class="text-xs font-black text-indigo-600 uppercase tracking-widest">
                                        [{getModeLabel(activeQuestion.mode)}]
                                    </span>
                                    <h2 class="text-lg font-black text-slate-800">
                                        {activeQuestion.text}
                                    </h2>
                                </div>

                                {/* Item 5: Unified Submission Feedback Badge */}
                                {hasSubmitted ? (
                                    <div class="space-y-4">
                                        <div class="bg-emerald-50 border-2 border-emerald-300 p-5 rounded-2xl text-center space-y-2">
                                            <div class="text-4xl">🌟</div>
                                            <div class="font-black text-emerald-800 text-lg">
                                                已提交答案! 讚賞你的努力! 安靜等候老師指示...
                                            </div>
                                        </div>

                                        {/* Item 13, 18, 21: Challenge Detailed Score Breakdown */}
                                        {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                            <div class="space-y-3 pt-2">
                                                {activeQuestion.challenge.scoresReleased ? (
                                                    <div class="bg-amber-50 border border-amber-200 p-4 rounded-2xl space-y-3">
                                                        <div class="flex justify-between items-center border-b border-amber-200 pb-2">
                                                            <span class="font-black text-amber-900">你的評估成績：</span>
                                                            <span class="text-xl font-black text-amber-700">
                                                                {existingRes?.scoreDetails?.totalScore} / {activeQuestion.challenge.totalScore} 分
                                                            </span>
                                                        </div>

                                                        {/* Question Details List */}
                                                        <div class="space-y-3 pt-1">
                                                            {activeQuestion.challenge.questions.map((q, qIdx) => {
                                                                const studentChoice = existingRes?.studentAnswers ? existingRes.studentAnswers[qIdx] : null;
                                                                const isCorrect = studentChoice === q.answer;

                                                                return (
                                                                    <div key={qIdx} class="bg-white p-3.5 rounded-xl border space-y-2 text-xs">
                                                                        <div class="font-bold text-slate-800 flex justify-between">
                                                                            <span>第 {qIdx + 1} 題：{q.text}</span>
                                                                            <span class={isCorrect ? 'text-emerald-600 font-black' : 'text-rose-600 font-black'}>
                                                                                {isCorrect ? '✅ 答對' : '❌ 答錯'}
                                                                            </span>
                                                                        </div>

                                                                        <div class="grid grid-cols-2 gap-1.5 pt-1">
                                                                            {q.options.map(opt => {
                                                                                const isStudentPicked = studentChoice === opt.letter;
                                                                                const isRightAns = opt.letter === q.answer;

                                                                                let optStyle = 'bg-slate-50 text-slate-600 border-slate-200';
                                                                                if (isRightAns) {
                                                                                    optStyle = 'bg-emerald-100 text-emerald-900 border-emerald-400 font-bold';
                                                                                } else if (isStudentPicked && !isCorrect) {
                                                                                    optStyle = 'bg-rose-100 text-rose-900 border-rose-400 font-bold';
                                                                                }

                                                                                return (
                                                                                    <div key={opt.letter} class={`p-2 rounded-lg border text-xs ${optStyle}`}>
                                                                                        <span>{opt.letter}. {opt.text}</span>
                                                                                        {isRightAns && <span class="ml-1 text-emerald-700 font-bold">(正確答案)</span>}
                                                                                        {isStudentPicked && !isRightAns && <span class="ml-1 text-rose-700 font-bold">(你的選擇)</span>}
                                                                                    </div>
                                                                                );
                                                                            })}
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div class="text-xs text-slate-500 bg-slate-100 p-3 rounded-xl text-center font-bold">
                                                        待所有同學完成提交後，老師將發佈成績與題解...
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    /* Interactive Question Forms */
                                    <div class="space-y-4">

                                        {/* CHOICE & TF */}
                                        {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                            <div class="grid grid-cols-1 gap-3">
                                                {activeQuestion.choiceOptions.map((opt) => (
                                                    <button 
                                                        key={opt}
                                                        onClick={() => submitAnswerToFirestore(opt)}
                                                        class="p-4 bg-indigo-50 hover:bg-indigo-600 text-indigo-900 hover:text-white border-2 border-indigo-200 rounded-2xl font-black text-lg transition active:scale-95 text-left flex justify-between items-center"
                                                    >
                                                        <span>{opt}</span>
                                                        <span>👉</span>
                                                    </button>
                                                ))}
                                            </div>
                                        )}

                                        {/* SHORT ANSWER */}
                                        {activeQuestion.mode === 'SHORT' && (
                                            <form onSubmit={(e) => { e.preventDefault(); if (myAnswer.trim()) submitAnswerToFirestore(myAnswer.trim()); }} class="space-y-3">
                                                <textarea 
                                                    rows={3} 
                                                    value={myAnswer}
                                                    onChange={(e) => setMyAnswer(e.target.value)}
                                                    placeholder="請輸入您的答案..." 
                                                    class="w-full p-4 border-2 border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 font-medium text-slate-800"
                                                />
                                                <button type="submit" class="w-full py-3.5 bg-indigo-600 text-white font-black text-base rounded-2xl shadow-lg">
                                                    提交答案
                                                </button>
                                            </form>
                                        )}

                                        {/* DRAW WHITEBOARD */}
                                        {activeQuestion.mode === 'DRAW' && (
                                            <WhiteboardCanvas 
                                                initialBg={activeQuestion.whiteboardBg} 
                                                onSubmit={(dataUrl) => submitAnswerToFirestore(dataUrl)} 
                                            />
                                        )}

                                        {/* Item 17: BUZZER */}
                                        {activeQuestion.mode === 'BUZZER' && (
                                            <div class="text-center py-6">
                                                <button 
                                                    onClick={() => submitAnswerToFirestore('已搶答！')}
                                                    class="w-48 h-48 rounded-full bg-rose-600 hover:bg-rose-700 text-white font-black text-3xl shadow-2xl transition active:scale-90 border-8 border-rose-300 animate-pulse mx-auto flex items-center justify-center"
                                                >
                                                    按此搶答！
                                                </button>
                                            </div>
                                        )}

                                        {/* Item 4: AUDIO RECORDING */}
                                        {activeQuestion.mode === 'AUDIO' && (
                                            <div class="space-y-4 text-center">
                                                {!audioUrl ? (
                                                    <div class="space-y-3">
                                                        <div class="text-sm font-bold text-slate-600">
                                                            {isRecording ? `錄音中... ${recordingTime}s / 10s` : '點擊下方按鈕開始錄音 (最多10秒)'}
                                                        </div>
                                                        <button 
                                                            type="button"
                                                            onClick={isRecording ? stopRecording : startRecording}
                                                            class={`w-28 h-28 rounded-full font-black text-white text-lg shadow-xl mx-auto flex items-center justify-center transition active:scale-95 ${isRecording ? 'bg-rose-600 animate-ping' : 'bg-cyan-600 hover:bg-cyan-700'}`}
                                                        >
                                                            {isRecording ? '⏹️ 停止' : '🎤 開始錄音'}
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <div class="space-y-4 bg-cyan-50 p-4 rounded-2xl border border-cyan-200">
                                                        <div class="text-xs font-bold text-cyan-900">試聽錄音：</div>
                                                        <audio src={audioUrl} controls class="w-full" />
                                                        <div class="flex space-x-2">
                                                            <button 
                                                                type="button"
                                                                onClick={handleDeleteRecording}
                                                                class="w-1/2 py-3 bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold rounded-xl text-sm"
                                                            >
                                                                🗑️ 刪除重錄
                                                            </button>
                                                            <button 
                                                                type="button"
                                                                onClick={handleAudioSubmit}
                                                                class="w-1/2 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow"
                                                            >
                                                                ✅ 確認提交錄音
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {/* Item 3: PUSHED LINK */}
                                        {activeQuestion.mode === 'LINK' && (
                                            <div class="space-y-4">
                                                {activeQuestion.youtubeEmbed ? (
                                                    <div class="aspect-16-9 w-full rounded-2xl overflow-hidden border">
                                                        <iframe 
                                                            src={activeQuestion.youtubeEmbed} 
                                                            class="w-full h-full" 
                                                            allow="autoplay; encrypted-media" 
                                                            allowFullScreen
                                                        />
                                                    </div>
                                                ) : (
                                                    <div class="bg-amber-50 p-4 rounded-2xl border border-amber-200 text-amber-900 text-xs break-all">
                                                        {activeQuestion.pushedUrl}
                                                    </div>
                                                )}

                                                <a 
                                                    href={activeQuestion.pushedUrl} 
                                                    target="_blank" 
                                                    rel="noopener noreferrer"
                                                    class="block w-full text-center py-3.5 bg-amber-500 hover:bg-amber-600 text-white font-black text-base rounded-2xl shadow-lg transition"
                                                >
                                                    開啟連結網站 ↗
                                                </a>
                                            </div>
                                        )}

                                        {/* Item 11, 13, 21: CHALLENGE MODE */}
                                        {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                            <div class="space-y-5">
                                                {/* Timer Header */}
                                                {activeQuestion.challenge.enableTimer && (
                                                    <div class="bg-slate-900 text-white p-3 rounded-2xl flex items-center justify-between">
                                                        <span class="text-xs font-bold text-slate-300">⏱️ 限時倒數：</span>
                                                        <span class="font-mono font-black text-xl text-amber-400">
                                                            {Math.floor(challengeTimeLeft / 60).toString().padStart(2, '0')}:{(challengeTimeLeft % 60).toString().padStart(2, '0')}
                                                        </span>
                                                    </div>
                                                )}

                                                {/* Question List */}
                                                <div class="space-y-4">
                                                    {activeQuestion.challenge.questions.map((q, qIdx) => {
                                                        // Item 21: Group mode question splitting
                                                        if (activeQuestion.groupMode) {
                                                            const totalMembers = myGroup?.members.length || 1;
                                                            // Split logic e.g., prompt for member 0, options A/B for member 1, C/D for member 2
                                                        }

                                                        return (
                                                            <div key={qIdx} class="bg-amber-50/60 p-4 rounded-2xl border border-amber-200 space-y-3">
                                                                <div class="font-black text-slate-800 text-sm">
                                                                    第 {qIdx + 1} 題: {q.text}
                                                                </div>

                                                                <div class="grid grid-cols-1 gap-2">
                                                                    {q.options.map((opt) => (
                                                                        <button 
                                                                            key={opt.letter}
                                                                            type="button"
                                                                            onClick={() => setChallengeStudentAnswers(prev => ({ ...prev, [qIdx]: opt.letter }))}
                                                                            class={`p-3 rounded-xl text-left font-bold text-xs border transition ${challengeStudentAnswers[qIdx] === opt.letter ? 'bg-amber-600 text-white border-amber-600' : 'bg-white text-slate-700 border-slate-200'}`}
                                                                        >
                                                                            {opt.letter}. {opt.text}
                                                                        </button>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>

                                                <button 
                                                    onClick={() => handleChallengeSubmit(false)}
                                                    class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-lg rounded-2xl shadow-lg transition active:scale-98"
                                                >
                                                    ✅ 完成全份挑戰題並提交
                                                </button>
                                            </div>
                                        )}

                                    </div>
                                )}
                            </div>
                        ) : (
                            <div class="bg-white rounded-3xl p-12 text-center space-y-3 shadow-md border border-slate-200">
                                <div class="text-5xl animate-pulse">⏳</div>
                                <h3 class="text-xl font-black text-slate-800">等待老師發佈題目...</h3>
                                <p class="text-xs text-slate-400">請保持螢幕開啟，題目發佈後將自動呈現</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
