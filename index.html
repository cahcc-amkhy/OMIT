        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                    });
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) throw new Error("JSZip library not loaded.");
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>${paragraphsXml}</w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];
            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) questions.push(currentQ);
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }

                    currentQ.options.push({ letter, text: optText });
                    if (isCorrect) currentQ.answer = letter;
                }
            });

            if (currentQ && currentQ.options.length > 0) questions.push(currentQ);

            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1,
                            text: "以下哪一項不是地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "機械資源" }
                            ],
                            answer: "D"
                        },
                        {
                            num: 2,
                            text: "芝士的原料屬於哪一項地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "礦產資源" }
                            ],
                            answer: "C"
                        }
                    ]
                };
            }

            return { title, totalScore, questions };
        };

        // Revision Item 1 & 21: Whiteboard Canvas with 1280x720 resolution and precise touch coordinate scaling formula
        function WhiteboardCanvas({ bgImage, onSave, isTeacher, onClose }) {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [brushColor, setBrushColor] = useState('#2563eb');
            const [brushSize, setBrushSize] = useState(4); // 2px - 18px stroke thickness
            const [isEraser, setIsEraser] = useState(false);
            const [localBg, setLocalBg] = useState(bgImage || null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                canvas.width = 1280;
                canvas.height = 720;
                const ctx = canvas.getContext('2d');
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                // Draw background
                drawBackground(ctx, localBg);
            }, []);

            useEffect(() => {
                if (bgImage !== undefined) {
                    setLocalBg(bgImage);
                    const canvas = canvasRef.current;
                    if (canvas) {
                        const ctx = canvas.getContext('2d');
                        drawBackground(ctx, bgImage);
                    }
                }
            }, [bgImage]);

            const drawBackground = (ctx, bgSrc) => {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 1280, 720);
                if (bgSrc) {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, 1280, 720);
                    };
                    img.src = bgSrc;
                }
            };

            // Precision Coordinate Calculation Mapping Formula
            const getCoords = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const scaleX = 1280 / rect.width;
                const scaleY = 720 / rect.height;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                setIsDrawing(true);
                const coords = getCoords(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(coords.x, coords.y);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const coords = getCoords(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.strokeStyle = isEraser ? '#ffffff' : brushColor;
                ctx.lineWidth = brushSize;
                ctx.lineTo(coords.x, coords.y);
                ctx.stroke();
            };

            const stopDrawing = (e) => {
                if (!isDrawing) return;
                setIsDrawing(false);
                if (onSave) {
                    const dataUrl = canvasRef.current.toDataURL('image/png');
                    onSave(dataUrl);
                }
            };

            const handleClear = () => {
                const ctx = canvasRef.current.getContext('2d');
                drawBackground(ctx, localBg);
                if (onSave) onSave(canvasRef.current.toDataURL('image/png'));
            };

            const handleLocalBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setLocalBg(evt.target.result);
                        const ctx = canvasRef.current.getContext('2d');
                        drawBackground(ctx, evt.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            return (
                <div class="flex flex-col items-center w-full space-y-3">
                    {/* Toolbar */}
                    <div class="bg-slate-800 text-white p-3 rounded-2xl flex flex-wrap items-center justify-between gap-3 w-full shadow-lg">
                        <div class="flex items-center space-x-2">
                            {['#2563eb', '#ef4444', '#10b981', '#f59e0b', '#000000'].map(c => (
                                <button
                                    key={c}
                                    onClick={() => { setBrushColor(c); setIsEraser(false); }}
                                    class={`w-7 h-7 rounded-full border-2 transition ${!isEraser && brushColor === c ? 'scale-125 border-white shadow-md' : 'border-transparent'}`}
                                    style={{ backgroundColor: c }}
                                />
                            ))}
                        </div>

                        {/* Stroke Size Slider 2px - 18px */}
                        <div class="flex items-center space-x-2 bg-slate-700/80 px-3 py-1 rounded-xl text-xs">
                            <span>粗幼:</span>
                            <input 
                                type="range" 
                                min="2" 
                                max="18" 
                                value={brushSize} 
                                onChange={(e) => setBrushSize(parseInt(e.target.value))}
                                class="w-20 accent-indigo-400"
                            />
                            <span class="font-mono">{brushSize}px</span>
                        </div>

                        {/* Controls */}
                        <div class="flex items-center space-x-2">
                            <button 
                                onClick={() => setIsEraser(!isEraser)}
                                class={`px-3 py-1.5 rounded-xl font-bold text-xs transition ${isEraser ? 'bg-amber-500 text-white' : 'bg-slate-700 text-slate-200'}`}
                            >
                                🧽 擦膠
                            </button>
                            <button 
                                onClick={handleClear}
                                class="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold text-xs transition"
                            >
                                🗑️ 清空
                            </button>

                            <label class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs cursor-pointer transition">
                                🖼️ 背景圖片
                                <input type="file" accept="image/*" onChange={handleLocalBgUpload} class="hidden" />
                            </label>
                        </div>
                    </div>

                    {/* Canvas Area */}
                    <div class="w-full aspect-16-9 bg-white rounded-2xl overflow-hidden shadow-md border-2 border-slate-300 relative canvas-container">
                        <canvas 
                            ref={canvasRef}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            class="w-full h-full cursor-crosshair touch-none"
                        />
                    </div>

                    {/* Teacher Fullscreen Whiteboard Close Button placed at bottom */}
                    {isTeacher && onClose && (
                        <button 
                            onClick={onClose}
                            class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-extrabold rounded-2xl shadow-lg text-center transition"
                        >
                            關閉白板 ✕
                        </button>
                    )}
                </div>
            );
        }

        function OMITApp() {

            const [seatNumber, setSeatNumber] = useState('1');

            const [responses, setResponses] = useState({});

            const [isAuthReady, setIsAuthReady] = useState(false);

            };

            useEffect(() => {

                            setIsAuthReady(true);
                        }
                    } catch (err) {
                        console.error("Firebase auth failed:", err);
                    }

                const params = new URLSearchParams(window.location.search);
                const roomParam = params.get('room');

            }, []);

            useEffect(() => {

                const appId = "omit-8c173";

                const { doc, onSnapshot, collection } = window.fbUtils;

                const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                const unsubRoom = onSnapshot(roomDocRef, (docSnap) => {

                        const data = docSnap.data();

                    }
                });

                const unsubStudents = onSnapshot(studentsColRef, (snapshot) => {
                    const list = [];
                    snapshot.forEach((d) => list.push(d.data()));
                    setStudentsList(list);
                });

                const unsubResponses = onSnapshot(responsesColRef, (snapshot) => {
                    const resMap = {};

                        resMap[d.id] = d.data();
                    });
                    setResponses(resMap);
                });

                return () => {
                    unsubRoom();
                    unsubStudents();
                    unsubResponses();

                                            onChange={(e) => setRoomCode(e.target.value)}
                                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-mono text-center tracking-widest text-lg font-bold"
                                            maxLength={6}

                                    <div class="grid grid-cols-3 gap-2">
                                        <div class="col-span-1">
                                            <label class="text-xs text-slate-500 font-medium mb-1 block">2. 學號 *</label>
                                            <select

                                            />

                                    <button

                                <div class="relative flex py-1 items-center">

                        </div>

                        {showPasswordModal && (

                                <div class="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
                                    <h3 class="text-lg font-bold text-slate-800 text-center">請輸入教師密碼</h3>
                                    <form onSubmit={verifyTeacherPassword} class="space-y-4">

                                            type="password"

                                            autoFocus

                                        <div class="flex space-x-2">
                                            <button 
                                                type="button" 
                                                onClick={() => setShowPasswordModal(false)}

                                                取消
                                            </button>
                                            <button 
                                                type="submit" 
                                                class="w-1/2 py-2.5 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-700 shadow-md"

            if (role === 'TEACHER') {
                return (
                    <TeacherDashboard 
                        roomCode={roomCode} 
                        activeQuestion={activeQuestion} 
                        setActiveQuestion={setActiveQuestion}
                        responses={responses}
                        studentsList={studentsList}
                        historyQuestions={historyQuestions}
                        setHistoryQuestions={setHistoryQuestions}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            if (role === 'STUDENT') {
                return (
                    <StudentInterface 
                        roomCode={roomCode}
                        studentName={studentName}
                        seatNumber={seatNumber}
                        studentId={myStudentId.current}
                        activeQuestion={activeQuestion}
                        responses={responses}
                        studentsList={studentsList}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            return null;
        }

        function TeacherDashboard({ roomCode, activeQuestion, setActiveQuestion, responses, studentsList, historyQuestions, setHistoryQuestions, showToast, onExit }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE');
            const [questionText, setQuestionText] = useState('');
            const [choiceCount, setChoiceCount] = useState(4);
            const [lockAfterSubmit, setLockAfterSubmit] = useState(true);
            const [whiteboardBg, setWhiteboardBg] = useState(null);
            const [pushedUrl, setPushedUrl] = useState('');

            // Teacher Fullscreen Whiteboard
            const [showTeacherWhiteboard, setShowTeacherWhiteboard] = useState(false);

            // Modals & Tools
            const [showQRModal, setShowQRModal] = useState(false);
            const [showStudentListModal, setShowStudentListModal] = useState(false);
            const [showInspectModal, setShowInspectModal] = useState(null);
            const [barChoiceFilter, setBarChoiceFilter] = useState(null);

            // Revision Item 8: Custom Random Selector State (1-25, 1-36, etc.)
            const [showRandomModal, setShowRandomModal] = useState(false);
            const [rangeStart, setRangeStart] = useState(1);
            const [rangeEnd, setRangeEnd] = useState(36);
            const [drawnNumbers, setDrawnNumbers] = useState([]);
            const [currentDrawn, setCurrentDrawn] = useState(null);
            const [isSpinning, setIsSpinning] = useState(false);

            // Revision Item 9: Timer Tool State
            const [showTimerModal, setShowTimerModal] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerActive, setTimerActive] = useState(false);
            const [timerZoomed, setTimerZoomed] = useState(false);
            const [customTimerMins, setCustomTimerMins] = useState('01');
            const [customTimerSecs, setCustomTimerSecs] = useState('00');

            // Challenge Question Setup
            const [challengeData, setChallengeData] = useState(null);
            const [challengeEnableTimer, setChallengeEnableTimer] = useState(true);
            const [challengeTimeLimit, setChallengeTimeLimit] = useState(120);
            const [challengeReleaseInstant, setChallengeReleaseInstant] = useState(true);
            const [showChallengeScoresOnLeaderboard, setShowChallengeScoresOnLeaderboard] = useState(true);
            const [docFileName, setDocFileName] = useState('');

            // Revision Item 22: Group Mode State
            const [enableGroupMode, setEnableGroupMode] = useState(false);
            const [groupStage, setGroupStage] = useState('PREP'); // 'PREP' or 'RACE'

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

            const currentQuestionResponses = useMemo(() => {
                if (!activeQuestion) return {};
                const filtered = {};
                Object.values(responses).forEach(r => {
                    if (r.questionId === activeQuestion.id) {
                        filtered[r.studentId] = r;
                    }
                });
                return filtered;
            }, [responses, activeQuestion]);

            // Timer Interval Logic
            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(s => {
                            if (s <= 1) {
                                setTimerActive(false);
                                playSound('alarm');
                                return 0;
                            }
                            return s - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            const publishQuestionToFirestore = async (qObj, newHistoryList) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatePayload = {
                    activeQuestion: qObj,
                    updatedAt: Date.now()
                };
                if (newHistoryList) updatePayload.history = newHistoryList;

                await window.fbUtils.setDoc(roomDocRef, updatePayload, { merge: true });
            };

            const handleExitRoom = async () => {
                if (window.confirm("確定退出課室？將會同步清空此課室於 Firebase 的所有暫存紀錄！")) {
                    try {
                        const appId = "omit-8c173";
                        const db = window.fbDb;
                        
                        const responsesColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');
                        const resSnaps = await window.fbUtils.getDocs(responsesColRef);
                        resSnaps.forEach(async (d) => await window.fbUtils.deleteDoc(d.ref));

                        const studentsColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                        const stuSnaps = await window.fbUtils.getDocs(studentsColRef);
                        stuSnaps.forEach(async (d) => await window.fbUtils.deleteDoc(d.ref));

                        const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                        await window.fbUtils.deleteDoc(roomDocRef);

                        showToast("課室暫存資料已完全清空！", "info");
                    } catch (e) {
                        console.error("Cleanup error:", e);
                    }
                    onExit();
                }
            };

            // Revision Item 11: Download Word Document .docx format template
            const handleDownloadChallengeTemplate = async () => {
                const sampleLines = [
                    "標題：地球生病了",
                    "總分: 100分",
                    "1.以下哪一項不是地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源",
                    "D. 機械資源*",
                    "",
                    "2.芝士的原料屬於哪一項地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源*",
                    "D. 礦產資源",
                    "",
                    "3.人們不當使用水資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應*",
                    "",
                    "4.人們不當使用煤和石油資源會造成甚麼後果?",
                    "A. 引發極端天氣*",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應",
                    "",
                    "5.人們不當使用土地資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災*",
                    "C. 產生大量二氧化碳",
                    "D. 影響食水供應"
                ];

                try {
                    const blob = await createWordDocxBlob(sampleLines);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = '評估範本Word檔_地球生病了.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast("已下載評估範本Word檔 (.docx)！", "success");
                } catch (err) {
                    console.error("Docx generation error:", err);
                    showToast("無法生成 Word 範本檔，請重新整理試試。", "error");
                }
            };

            const handleWordFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setDocFileName(file.name);
                const reader = new FileReader();

                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const arrayBuffer = evt.target.result;
                            const result = await window.mammoth.extractRawText({ arrayBuffer });
                            parsedData = parseWordChallengeText(result.value);
                        } else {
                            const text = evt.target.result;
                            parsedData = parseWordChallengeText(text);
                        }

                        setChallengeData(parsedData);
                        showToast(`已成功解析範本檔案！共 ${parsedData.questions.length} 題`, 'success');
                    } catch (err) {
                        console.error("Word file parse error:", err);
                        showToast("文件解析失敗，請確認格式！", "error");
                    }
                };

                if (file.name.endsWith('.docx')) {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file, "UTF-8");
                }
            };

            // Revision Item 22: Randomly partition students into 3-4 member groups
            const generateStudentGroups = () => {
                const sorted = [...studentsList].sort(() => 0.5 - Math.random());
                const groupCount = Math.max(1, Math.ceil(sorted.length / 4));
                const groups = {};

                for (let i = 0; i < groupCount; i++) {
                    const animal = GROUP_ANIMALS[i % GROUP_ANIMALS.length];
                    groups[animal.name] = {
                        name: animal.name,
                        color: animal.color,
                        icon: animal.icon,
                        members: [],
                        score: 0,
                        currentQIdx: 0
                    };
                }

                sorted.forEach((stu, idx) => {
                    const groupNames = Object.keys(groups);
                    const targetName = groupNames[idx % groupNames.length];
                    groups[targetName].members.push(stu);
                });

                return groups;
            };

            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                
                let challengeContent = null;
                let groupConfig = null;

                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請先上載並解析評估範本Word檔！", "error");
                        return;
                    }

                    if (enableGroupMode) {
                        const groups = generateStudentGroups();
                        groupConfig = {
                            isGroupMode: true,
                            stage: 'PREP', // 'PREP' or 'RACE'
                            groups: groups
                        };
                    }

                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent,
                    groupConfig: groupConfig
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);

                publishQuestionToFirestore(newQ, updatedHistory);
                showToast(`已成功發佈【${getModeLabel(selectedMode)}】給全班！`, 'success');
            };

            // Revision Item 22.1 & 22.2: Reassign groups & Start Group Race
            const handleReassignGroups = async () => {
                if (!activeQuestion || !activeQuestion.groupConfig) return;
                const newGroups = generateStudentGroups();
                const updatedQ = {
                    ...activeQuestion,
                    groupConfig: {
                        ...activeQuestion.groupConfig,
                        groups: newGroups
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已重新隨機分配學生組別！", "info");
            };

            const handleStartGroupRace = async () => {
                if (!activeQuestion || !activeQuestion.groupConfig) return;
                const updatedQ = {
                    ...activeQuestion,
                    groupConfig: {
                        ...activeQuestion.groupConfig,
                        stage: 'RACE'
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("🏁 分組比賽正式開始！各組全力作答！", "success");
            };

            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已成功向所有學生一併發放挑戰題成績！", "success");
            };

            const handleDownloadAllAudio = async () => {
                const audioSubmissions = Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:audio'));
                if (audioSubmissions.length === 0) {
                    showToast("目前尚無學生提交錄音！", "error");
                    return;
                }

                try {
                    const zip = new JSZip();
                    const folder = zip.folder(`課堂錄音_房號${roomCode}`);

                    audioSubmissions.forEach((res) => {
                        const base64Data = res.answer.split(',')[1];
                        const fileName = `${res.seatNumber.toString().padStart(2, '0')}_${res.name || '學生'}.webm`;
                        folder.file(fileName, base64Data, { base64: true });
                    });

                    const content = await zip.generateAsync({ type: "blob" });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(content);
                    link.download = `OMIT_學生錄音_房號${roomCode}.zip`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    showToast(`已打包並下載 ${audioSubmissions.length} 位學生的語音檔案！`, "success");
                } catch (err) {
                    console.error("ZIP creation error:", err);
                    showToast("打包錄音檔案失敗！", "error");
                }
            };

            const handleClearQuestion = async () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: null }, { merge: true });
                showToast('已結束當前題目', 'info');
            };

            const toggleLockMode = async () => {
                const newLock = !lockAfterSubmit;
                setLockAfterSubmit(newLock);
                if (activeQuestion) {
                    const updatedQ = { ...activeQuestion, lockAfterSubmit: newLock };
                    publishQuestionToFirestore(updatedQ);
                    showToast(newLock ? "已鎖定答案（禁止修改）" : "已開放學生修改答案", "info");
                }
            };

            const handleBgUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setWhiteboardBg(evt.target.result);
                        showToast("已載入 16:9 白板背景圖片！", "success");
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleBroadcastSubmission = async (studentRes) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatedQ = { ...activeQuestion, broadcastedSubmission: studentRes };
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                showToast(`已廣播 ${studentRes.name} 的作品至全班螢幕進行互評！`, "success");
            };

            const handleSpinRandom = () => {
                if (isSpinning) return;
                
                const start = parseInt(rangeStart) || 1;
                const end = parseInt(rangeEnd) || 36;
                const available = [];
                for (let i = start; i <= end; i++) {
                    if (!drawnNumbers.includes(i)) available.push(i);
                }

                if (available.length === 0) {
                    showToast("此範圍內所有學號皆已被抽出！請點擊重置。", "error");
                    return;
                }

                setIsSpinning(true);
                let counter = 0;
                const maxIntervals = 20;

                const timer = setInterval(() => {
                    const temp = available[Math.floor(Math.random() * available.length)];
                    setCurrentDrawn(temp);
                    playSound('spin');
                    counter++;

                    if (counter >= maxIntervals) {
                        clearInterval(timer);
                        const finalPicked = available[Math.floor(Math.random() * available.length)];
                        setCurrentDrawn(finalPicked);
                        setDrawnNumbers(prev => [...prev, finalPicked]);
                        setIsSpinning(false);
                        playSound('win');
                    }
                }, 100);
            };

            // Revision Item 20: Challenge CSV Spreadsheet Export
            const handleExportCSVReport = () => {
                if (studentsList.length === 0) {

                    return;
                }

                let csvContent = "\uFEFF學號,學生姓名,加入時間";

                historyQuestions.forEach((q, idx) => {
                    if (q.mode === 'CHALLENGE' && q.challenge) {
                        csvContent += `,第${idx + 1}題[挑戰題:${q.challenge.title}總分],第${idx + 1}題[正確率],第${idx + 1}題[作答用時]`;
                    } else {
                        const cleanText = (q.text || getModeLabel(q.mode)).replace(/"/g, '""');
                        csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]: "${cleanText}"`;
                    }
                });
                csvContent += "\n";

                const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

                sortedStudents.forEach((stu) => {
                    const cleanName = (stu.name || '').replace(/"/g, '""');
                    csvContent += `"${stu.seatNumber}號","${cleanName}","${stu.joinTime || ''}"`;
                    
                    historyQuestions.forEach((q) => {
                        const resKey = `${q.id}_${stu.id}`;
                        const res = responses[resKey];
                        
                        if (res && res.answer !== undefined && res.answer !== null) {
                            if (q.mode === 'CHALLENGE' && res.scoreDetails) {
                                csvContent += `,"${res.scoreDetails.totalScore} / ${q.challenge.totalScore}分","${res.scoreDetails.percentage}%","${res.duration || 0}s"`;
                            } else {
                                let ansVal = res.answer;
                                if (typeof ansVal === 'string' && ansVal.startsWith('data:image')) ansVal = '[圖像白板]';
                                else if (typeof ansVal === 'string' && ansVal.startsWith('data:audio')) ansVal = '[語音錄音]';
                                const cleanAns = String(ansVal).replace(/"/g, '""');
                                csvContent += `,"${cleanAns} (用時:${res.duration || 0}s)"`;
                            }
                        } else {
                            if (q.mode === 'CHALLENGE') csvContent += `,"未作答","0%","0s"`;
                            else csvContent += `,"未作答"`;
                        }
                    });
                    csvContent += "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `OMIT_本次挑戰題成績試算表_房號${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                        return parseFloat(a.duration) - parseFloat(b.duration);

                } else {
                    setSubmitted(false);
                }
            }, [existingResponse, activeQuestion?.id]);

            // Audio recording Timer limit (10s max)
            useEffect(() => {
                let interval = null;
                if (isRecording) {
                    interval = setInterval(() => {
                        setAudioSecs(s => {
                            if (s >= 9) {
                                stopRecording();
                                return 10;
                            }
                            return s + 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [isRecording]);

            // Challenge timer limit countdown
            useEffect(() => {
                let interval = null;
                if (activeQuestion?.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer && !submitted) {
                    if (challengeRemainingSecs === null) {
                        setChallengeRemainingSecs(activeQuestion.challenge.timeLimit || 120);
                    } else if (challengeRemainingSecs > 0) {
                        interval = setInterval(() => {
                            setChallengeRemainingSecs(s => {
                                if (s <= 1) {
                                    handleAutoSubmitChallenge();
                                    return 0;
                                }
                                return s - 1;
                            });
                        }, 1000);
                    }
                }
                return () => clearInterval(interval);
            }, [activeQuestion, submitted, challengeRemainingSecs]);

            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        setAudioBlob(blob);
                        setAudioUrl(URL.createObjectURL(blob));
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                    setAudioSecs(0);
                } catch (err) {
                    alert("無法存取麥克風，請檢查瀏覽器權限！");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const handleClearAudio = () => {
                setAudioBlob(null);
                setAudioUrl(null);
                setAudioSecs(0);
            };

            const submitResponse = async (ansPayload, extraPayload = {}) => {
                if (!activeQuestion) return;

                const duration = ((Date.now() - activeQuestion.startTime) / 1000).toFixed(1);
                const appId = "omit-8c173";
                const db = window.fbDb;
                const responseDocRef = window.fbUtils.doc(
                    db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', `${activeQuestion.id}_${studentId}`
                );

                const record = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: ansPayload,
                    duration: duration,
                    submittedAt: Date.now(),
                    ...extraPayload
                };

                await window.fbUtils.setDoc(responseDocRef, record);
                setSubmitted(true);
                setSubmissionTime(duration);
            };

            const handleAutoSubmitChallenge = () => {
                if (submitted || !activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                
                let totalEarned = 0;
                const questions = activeQuestion.challenge.questions;
                questions.forEach(q => {
                    if (challengeAnswers[q.num] === q.answer) {
                        totalEarned += (activeQuestion.challenge.totalScore / questions.length);
                    }
                });

                const percentage = Math.round((totalEarned / activeQuestion.challenge.totalScore) * 100);

                submitResponse(challengeAnswers, {
                    scoreDetails: {
                        totalScore: Math.round(totalEarned),
                        percentage: percentage
                    }
                });
                showToast("時間到達！已為您自動提交考卷！", "info");
            };

            const handleManualSubmitChallenge = () => {
                let totalEarned = 0;
                const questions = activeQuestion.challenge.questions;
                questions.forEach(q => {
                    if (challengeAnswers[q.num] === q.answer) {
                        totalEarned += (activeQuestion.challenge.totalScore / questions.length);
                    }
                });

                const percentage = Math.round((totalEarned / activeQuestion.challenge.totalScore) * 100);

                submitResponse(challengeAnswers, {
                    scoreDetails: {
                        totalScore: Math.round(totalEarned),
                        percentage: percentage
                    }
                });
            };

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col justify-between">
                    {/* Header */}
                    <header class="bg-indigo-900 text-white px-4 py-3 shadow-md sticky top-0 z-30">
                        <div class="max-w-3xl mx-auto flex justify-between items-center">
                            <div class="flex items-center space-x-2">
                                <span class="font-black text-xl tracking-wider">OMIT</span>
                                <span class="bg-indigo-800 text-indigo-200 text-xs px-2 py-0.5 rounded-full font-bold">
                                    房號: {roomCode}
                                </span>
                            </div>
                            <div class="flex items-center space-x-3">
                                <span class="font-bold text-sm bg-indigo-800/80 px-3 py-1 rounded-xl">
                                    {seatNumber}號 - {studentName || '學生'}
                                </span>
                                <button onClick={onExit} class="text-xs text-indigo-200 hover:text-white font-bold">退出</button>
                            </div>
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <main class="max-w-3xl w-full mx-auto p-4 flex-1 space-y-4">

                        {/* Broadcasted Student Work Overlay (Revision Item 2) */}
                        {activeQuestion?.broadcastedSubmission && (
                            <div class="bg-purple-900 text-white p-5 rounded-3xl shadow-xl space-y-3 animate-fade-in border-4 border-purple-400">
                                <div class="flex justify-between items-center border-b border-purple-700 pb-2">
                                    <span class="font-black text-base flex items-center gap-2">
                                        <span>📢 教師廣播作品（全班互評）：</span>
                                    </span>
                                    <span class="text-xs bg-purple-700 px-2 py-1 rounded-lg font-bold">
                                        {activeQuestion.broadcastedSubmission.seatNumber}號 - {activeQuestion.broadcastedSubmission.name}
                                    </span>
                                </div>
                                <div class="aspect-16-9 bg-white rounded-2xl overflow-hidden border">
                                    <img src={activeQuestion.broadcastedSubmission.answer} class="w-full h-full object-contain" alt="廣播作品" />
                                </div>
                            </div>
                        )}

                        {!activeQuestion ? (
                            <div class="bg-white rounded-3xl p-12 text-center space-y-4 shadow-sm border border-slate-200 my-auto">
                                <div class="text-6xl animate-bounce">⏳</div>
                                <h2 class="text-2xl font-black text-slate-800">請安靜等候老師發佈題目...</h2>
                                <p class="text-xs text-slate-400">當前已進入房號：{roomCode}</p>
                            </div>
                        ) : (
                            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-5">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <span class="text-xs font-black text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full uppercase">
                                        {getModeLabel(activeQuestion.mode)}
                                    </span>
                                    {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer && (
                                        <span class="text-xs font-mono font-bold bg-amber-100 text-amber-900 px-3 py-1 rounded-full">
                                            ⏱️ 倒數限時：{Math.floor((challengeRemainingSecs || 0) / 60)}:{(challengeRemainingSecs % 60 || 0).toString().padStart(2, '0')}
                                        </span>
                                    )}
                                </div>

                                <h2 class="text-xl font-black text-slate-800 leading-snug">{activeQuestion.text}</h2>

                                {/* Link Push Mode (Revision Item 3) */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div class="space-y-4">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div class="aspect-16-9 rounded-2xl overflow-hidden border-2 shadow-inner">
                                                <iframe src={activeQuestion.youtubeEmbed} class="w-full h-full" allow="autoplay; encrypted-media" allowFullScreen />
                                            </div>
                                        ) : (
                                            <div class="p-8 bg-amber-50 rounded-2xl text-center space-y-3 border">
                                                <div class="text-4xl">🔗</div>
                                                <div class="font-bold text-amber-900">老師發送了外部網頁連結</div>
                                            </div>
                                        )}

                                        <a 
                                            href={activeQuestion.pushedUrl} 
                                            target="_blank" 
                                            rel="noopener noreferrer"
                                            class="block w-full py-3.5 bg-amber-500 hover:bg-amber-600 text-white font-black text-center rounded-2xl shadow-lg transition text-base"
                                        >
                                            開啟連結網站 ↗
                                        </a>
                                    </div>
                                )}

                                {/* Revision Item 5: Post-submission appreciation prompt */}
                                {submitted && activeQuestion.mode !== 'CHALLENGE' ? (
                                    <div class="bg-emerald-50 border-2 border-emerald-200 p-8 rounded-3xl text-center space-y-3">
                                        <div class="text-5xl">🎉</div>
                                        <h3 class="text-2xl font-black text-emerald-800">已提交答案! 讚賞你的努力!</h3>
                                        <p class="text-sm font-bold text-emerald-600">安靜等候老師指示...</p>
                                    </div>
                                ) : (
                                    <>
                                        {/* Choice / TF Modes */}
                                        {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                {activeQuestion.choiceOptions.map(opt => (
                                                    <button 
                                                        key={opt}
                                                        onClick={() => submitResponse(opt)}
                                                        class="p-4 rounded-2xl border-2 font-bold text-lg transition bg-slate-50 hover:bg-indigo-50 border-slate-200 hover:border-indigo-500 text-slate-800 active:scale-98"
                                                    >
                                                        {opt}
                                                    </button>
                                                ))}
                                            </div>
                                        )}

                                        {/* Short Text Mode */}
                                        {activeQuestion.mode === 'SHORT' && (
                                            <div class="space-y-3">
                                                <textarea 
                                                    value={textAnswer}
                                                    onChange={(e) => setTextAnswer(e.target.value)}
                                                    placeholder="請輸入您的回答..."
                                                    class="w-full p-4 rounded-2xl border-2 border-slate-200 focus:border-indigo-500 focus:outline-none font-medium h-32"
                                                />
                                                <button 
                                                    onClick={() => submitResponse(textAnswer)}
                                                    class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg"
                                                >
                                                    確認提交回答 🚀
                                                </button>
                                            </div>
                                        )}

                                        {/* Whiteboard Mode */}
                                        {activeQuestion.mode === 'DRAW' && (
                                            <WhiteboardCanvas 
                                                bgImage={activeQuestion.whiteboardBg}
                                                onSave={(dataUrl) => submitResponse(dataUrl)}
                                            />
                                        )}

                                        {/* Buzzer Mode */}
                                        {activeQuestion.mode === 'BUZZER' && (
                                            <button 
                                                onClick={() => { playSound('buzzer'); submitResponse('搶答！'); }}
                                                class="w-full py-16 bg-rose-600 hover:bg-rose-700 text-white font-black text-4xl rounded-3xl shadow-2xl active:scale-95 transition"
                                            >
                                                🚨 搶答！
                                            </button>
                                        )}

                                        {/* Audio Recording Mode (Revision Item 4) */}
                                        {activeQuestion.mode === 'AUDIO' && (
                                            <div class="space-y-4 bg-cyan-50 p-6 rounded-3xl border border-cyan-200 text-center">
                                                {!audioUrl ? (
                                                    <div class="space-y-3">
                                                        <button 
                                                            onClick={isRecording ? stopRecording : startRecording}
                                                            class={`w-28 h-28 rounded-full font-black text-white text-lg shadow-xl mx-auto transition flex items-center justify-center ${isRecording ? 'bg-red-600 animate-pulse' : 'bg-cyan-600 hover:bg-cyan-700'}`}
                                                        >
                                                            {isRecording ? `🛑 停止 (${10 - audioSecs}s)` : '🎤 開始錄音'}
                                                        </button>
                                                        <p class="text-xs text-slate-500 font-bold">點擊按鈕開始錄製不多於 10 秒的語音</p>
                                                    </div>
                                                ) : (
                                                    <div class="space-y-4">
                                                        <audio src={audioUrl} controls class="w-full" />
                                                        <div class="flex space-x-2">
                                                            <button 
                                                                onClick={handleClearAudio}
                                                                class="w-1/2 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl"
                                                            >
                                                                🗑️ 刪除重錄
                                                            </button>
                                                            <button 
                                                                onClick={() => {
                                                                    const reader = new FileReader();
                                                                    reader.onload = (evt) => submitResponse(evt.target.result);
                                                                    reader.readAsDataURL(audioBlob);
                                                                }}
                                                                class="w-1/2 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md"
                                                            >
                                                                ✅ 確認提交錄音
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {/* Challenge Question Review Display (Revision Items 14, 19, 22.3, 22.4) */}
                                        {activeQuestion.mode === 'CHALLENGE' && (
                                            <div class="space-y-6">
                                                {!submitted ? (
                                                    <div class="space-y-4">
                                                        {activeQuestion.challenge.questions.map((q) => (
                                                            <div key={q.num} class="bg-slate-50 p-4 rounded-2xl border space-y-3">
                                                                <div class="font-bold text-slate-800 text-sm">
                                                                    第 {q.num} 題: {q.text}
                                                                </div>
                                                                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                                    {q.options.map(opt => (
                                                                        <button 
                                                                            key={opt.letter}
                                                                            onClick={() => setChallengeAnswers({ ...challengeAnswers, [q.num]: opt.letter })}
                                                                            class={`p-3 rounded-xl border text-left font-bold text-xs transition ${
                                                                                challengeAnswers[q.num] === opt.letter 
                                                                                ? 'bg-amber-600 text-white border-amber-600 shadow-md' 
                                                                                : 'bg-white text-slate-700 border-slate-200 hover:bg-amber-50'
                                                                            }`}
                                                                        >
                                                                            {opt.letter}. {opt.text}
                                                                        </button>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        ))}

                                                        <button 
                                                            onClick={handleManualSubmitChallenge}
                                                            class="w-full py-4 bg-amber-600 hover:bg-amber-700 text-white font-black text-base rounded-2xl shadow-xl transition"
                                                        >
                                                            確認提交整份挑戰題評估 🏆
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <div class="space-y-6">
                                                        <div class="bg-amber-50 border-2 border-amber-300 p-6 rounded-3xl text-center space-y-2">
                                                            <div class="text-4xl">✅</div>
                                                            <h3 class="text-xl font-black text-amber-900">挑戰題已成功提交！</h3>
                                                            {existingResponse?.scoreDetails && activeQuestion.challenge?.scoresReleased ? (
                                                                <div class="pt-2">
                                                                    <div class="text-3xl font-black text-amber-600">
                                                                        得分：{existingResponse.scoreDetails.totalScore} / {activeQuestion.challenge.totalScore} 分
                                                                    </div>
                                                                    <div class="text-xs font-bold text-slate-500">
                                                                        正確率：{existingResponse.scoreDetails.percentage}%
                                                                    </div>
                                                                </div>
                                                            ) : (
                                                                <p class="text-xs font-bold text-slate-500">待老師發佈成績後解鎖答案詳情...</p>
                                                            )}
                                                        </div>

                                                        {/* Revision Item 19: Answer Review View */}
                                                        {activeQuestion.challenge?.scoresReleased && (
                                                            <div class="space-y-4 pt-2">
                                                                <h3 class="font-black text-slate-800 text-base border-b pb-2">考卷正確答案與個人作答對比：</h3>
                                                                {activeQuestion.challenge.questions.map((q) => {
                                                                    const myAns = existingResponse?.answer?.[q.num];
                                                                    const isCorrect = myAns === q.answer;

                                                                    return (
                                                                        <div key={q.num} class="bg-slate-50 p-4 rounded-2xl border space-y-3">
                                                                            <div class="font-bold text-slate-800 text-sm flex items-center justify-between">
                                                                                <span>第 {q.num} 題: {q.text}</span>
                                                                                <span class={`text-xs px-2.5 py-1 rounded-md font-extrabold ${isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>
                                                                                    {isCorrect ? '✓ 答對' : '✕ 答錯'}
                                                                                </span>
                                                                            </div>

                                                                            <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                                                {q.options.map(opt => {
                                                                                    const isMyChoice = myAns === opt.letter;
                                                                                    const isRightOption = q.answer === opt.letter;

                                                                                    let style = 'bg-white border-slate-200 text-slate-700';
                                                                                    if (isRightOption) style = 'bg-emerald-100 border-emerald-500 text-emerald-900 font-black';
                                                                                    else if (isMyChoice && !isRightOption) style = 'bg-red-100 border-red-500 text-red-900 font-black';

                                                                                    return (
                                                                                        <div key={opt.letter} class={`p-3 rounded-xl border text-xs flex justify-between items-center ${style}`}>
                                                                                            <span>{opt.letter}. {opt.text}</span>
                                                                                            {isRightOption && <span class="text-xs text-emerald-700 font-bold">(正確答案)</span>}
                                                                                            {isMyChoice && !isRightOption && <span class="text-xs text-red-700 font-bold">(你的選擇)</span>}
                                                                                        </div>
                                                                                    );
                                                                                })}
                                                                            </div>
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        // Render main App component into DOM root
        ReactDOM.createRoot(document.getElementById('root')).render(<OMITApp />);
    </script>
</body>
</html>
