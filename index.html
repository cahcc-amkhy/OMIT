    <title>宣道會陳元喜小學 OMIT互動課堂</title>
    <!-- Tailwind CSS -->

<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // Helper label switcher
        function getModeLabel(mode) {
            switch(mode) {
                case 'CHOICE': return '選擇題';
                case 'TF': return '是非題';
                case 'SHORT': return '短答題';
                case 'DRAW': return '白板題';
                case 'BUZZER': return '搶答題';
                case 'AUDIO': return '錄音題';
                case 'CHALLENGE': return '挑戰題';
                case 'LINK': return '派送連結';
                default: return '題目';
            }
        }

        // Helper default prompts for empty question text
        function getDefaultQuestionPrompt(mode) {
            switch(mode) {
                case 'CHOICE': return '請選擇正確答案：';
                case 'TF': return '請判斷下列描述是否正確：';
                case 'SHORT': return '請輸入您的回答：';
                case 'DRAW': return '請在白板上作答或繪圖：';
                case 'BUZZER': return '請準備點擊搶答按鈕！';
                case 'AUDIO': return '請錄製不多於10秒的語音回答：';
                case 'CHALLENGE': return '請在限時內完成以下挑戰題評估：';
                case 'LINK': return '請點擊或觀看下方派送內容：';
                default: return '請回答問題：';
            }
        }

        // Web Audio API Sound Generator
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                    });
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (
                <div className={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-xl shadow-lg flex items-center space-x-2 text-sm font-medium animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        // Item 2: YouTube URL Extractor & Embed Convertor
        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) {
                throw new Error("JSZip library is not loaded.");
            }
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => {
                return `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`;
            }).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>
    ${paragraphsXml}
  </w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];

            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) {
                        questions.push(currentQ);
                    }
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }

                    currentQ.options.push({
                        letter: letter,
                        text: optText
                    });

                    if (isCorrect) {
                        currentQ.answer = letter;
                    }
                }
            });

            if (currentQ && currentQ.options.length > 0) {
                questions.push(currentQ);
            }

            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        {
                            num: 1,
                            text: "以下哪一項不是地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "機械資源" }
                            ],
                            answer: "D"
                        },
                        {
                            num: 2,
                            text: "芝士的原料屬於哪一項地球的天然資源?",
                            options: [
                                { letter: "A", text: "水資源" },
                                { letter: "B", text: "植物資源" },
                                { letter: "C", text: "動物資源" },
                                { letter: "D", text: "礦產資源" }
                            ],
                            answer: "C"
                        }
                    ]
                };
            }

            return { title, totalScore, questions };
        };

        // Item 1: Optimized WhiteboardCanvas Component (1280x720 standard canvas with scaleX / scaleY mapping)
        const WhiteboardCanvas = ({ initialBg, onSubmit, disabled, showPraiseNotice }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [penColor, setPenColor] = useState('#1e293b');
            const [strokeWidth, setStrokeWidth] = useState(6); // 2px - 18px range
            const [isEraser, setIsEraser] = useState(false);
            const [bgImageSrc, setBgImageSrc] = useState(initialBg || null);

            // Redraw background image if changed
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                // Initialize canvas background
                if (bgImageSrc) {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, 1280, 720);
                    };
                    img.src = bgImageSrc;
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, 1280, 720);
                }
            }, [bgImageSrc]);

            // Item 1: Precise scale mapping for iPad and mobile touchscreens
            const getCanvasCoordinates = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                
                const rect = canvas.getBoundingClientRect();
                const scaleX = 1280 / rect.width;
                const scaleY = 720 / rect.height;

                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                if (disabled) return;
                e.preventDefault();
                setIsDrawing(true);
                const ctx = canvasRef.current.getContext('2d');
                const { x, y } = getCanvasCoordinates(e);
                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            const draw = (e) => {
                if (!isDrawing || disabled) return;
                e.preventDefault();
                const ctx = canvasRef.current.getContext('2d');
                const { x, y } = getCanvasCoordinates(e);

                ctx.lineWidth = strokeWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (isEraser) {
                    ctx.strokeStyle = '#ffffff';
                } else {
                    ctx.strokeStyle = penColor;
                }

                ctx.lineTo(x, y);
                ctx.stroke();
            };

            const stopDrawing = (e) => {
                if (!isDrawing) return;
                setIsDrawing(false);
                const ctx = canvasRef.current.getContext('2d');
                ctx.closePath();
            };

            // Item 1: Clear canvas
            const handleClearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 1280, 720);
                if (bgImageSrc) {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, 1280, 720);
                    };
                    img.src = bgImageSrc;
                }
            };

            // Item 1: Upload image as canvas background
            const handleUploadBg = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setBgImageSrc(evt.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleSubmitDrawing = () => {
                const dataUrl = canvasRef.current.toDataURL('image/png');
                onSubmit(dataUrl);
            };

            return (
                <div className="space-y-4">
                    {/* Item 1 Controls Toolbar */}
                    <div className="bg-slate-50 border border-slate-200 p-3 rounded-2xl flex flex-wrap items-center justify-between gap-3">
                        <div className="flex flex-wrap items-center gap-3">
                            {/* Eraser / Pen toggle */}
                            <button 
                                type="button"
                                onClick={() => setIsEraser(!isEraser)}
                                className={`px-3 py-1.5 rounded-xl font-bold text-xs flex items-center space-x-1 border transition ${
                                    isEraser ? 'bg-amber-500 text-white border-amber-600 ring-2 ring-amber-300' : 'bg-white text-slate-700 hover:bg-slate-100'
                                }`}
                            >
                                <span>🧽 橡皮擦</span>
                                {isEraser && <span className="text-[10px] bg-white/20 px-1 rounded">(開啟中)</span>}
                            </button>

                            {/* Pen Stroke Width (2px - 18px) */}
                            <div className="flex items-center space-x-2 bg-white px-3 py-1 rounded-xl border border-slate-200">
                                <span className="text-xs font-bold text-slate-500">筆觸:</span>
                                <input 
                                    type="range" 
                                    min="2" 
                                    max="18" 
                                    value={strokeWidth} 
                                    onChange={(e) => setStrokeWidth(parseInt(e.target.value))}
                                    className="w-20 accent-indigo-600 cursor-pointer"
                                />
                                <span className="text-xs font-mono font-bold w-6 text-slate-700">{strokeWidth}px</span>
                            </div>

                            {/* Color options */}
                            {!isEraser && (
                                <div className="flex items-center space-x-1.5">
                                    {['#1e293b', '#dc2626', '#2563eb', '#16a34a', '#d97706', '#9333ea'].map((c) => (
                                        <button 
                                            key={c}
                                            type="button"
                                            onClick={() => setPenColor(c)}
                                            style={{ backgroundColor: c }}
                                            className={`w-7 h-7 rounded-full border-2 transition transform active:scale-90 ${
                                                penColor === c ? 'border-slate-800 scale-110 shadow-md' : 'border-white'
                                            }`}
                                        />
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="flex items-center space-x-2">
                            {/* Background Image Upload */}
                            <label className="cursor-pointer bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 font-bold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1 transition">
                                <span>🖼️ 載入背景圖</span>
                                <input type="file" accept="image/*" onChange={handleUploadBg} className="hidden" />
                            </label>

                            {/* Clear Canvas */}
                            <button 
                                type="button"
                                onClick={handleClearCanvas}
                                className="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 font-bold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1 transition"
                            >
                                🗑️ 清空畫板
                            </button>
                        </div>
                    </div>

                    {/* Canvas Area with 1280x720 fixed resolution */}
                    <div className="canvas-container relative rounded-2xl overflow-hidden border-2 border-slate-300 shadow-inner bg-white">
                        <canvas 
                            ref={canvasRef}
                            width={1280}
                            height={720}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            className="w-full h-auto aspect-video cursor-crosshair block"
                        />
                    </div>

                    {!disabled && (
                        <button 
                            type="button"
                            onClick={handleSubmitDrawing}
                            className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-2xl shadow-lg shadow-indigo-200 text-base transition active:scale-98"
                        >
                            確認提交畫板答案 🎨
                        </button>
                    )}
                </div>
            );
        };

        // Item 3: AudioRecorder Question Component with player preview, re-record, and confirm submit
        const AudioRecorderQuestion = ({ onSubmit, disabled }) => {
            const [isRecording, setIsRecording] = useState(false);
            const [recordingTime, setRecordingTime] = useState(0);
            const [audioBlob, setAudioBlob] = useState(null);
            const [audioUrl, setAudioUrl] = useState(null);

            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);
            const timerRef = useRef(null);

            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (event) => {
                        if (event.data.size > 0) {
                            audioChunksRef.current.push(event.data);
                        }
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        setAudioBlob(blob);
                        setAudioUrl(URL.createObjectURL(blob));
                        // Stop audio tracks
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                    setRecordingTime(0);

                    timerRef.current = setInterval(() => {
                        setRecordingTime((prev) => {
                            if (prev >= 9) { // Limit to 10 seconds
                                stopRecording();
                                return 10;
                            }
                            return prev + 1;
                        });
                    }, 1000);
                } catch (err) {
                    alert("無法讀取麥克風，請檢查權限！");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                    clearInterval(timerRef.current);
                }
            };

            // Item 3: Delete & Re-record
            const handleReRecord = () => {
                setAudioBlob(null);
                setAudioUrl(null);
                setRecordingTime(0);
                setIsRecording(false);
                clearInterval(timerRef.current);
            };

            // Item 3: Confirm Submit Audio
            const handleConfirmSubmit = () => {
                if (!audioBlob) return;
                const reader = new FileReader();
                reader.readAsDataURL(audioBlob);
                reader.onloadend = () => {
                    onSubmit(reader.result);
                };
            };

            return (
                <div className="bg-cyan-50/60 border border-cyan-200 p-6 rounded-3xl space-y-5 text-center">
                    <div className="text-sm font-bold text-cyan-900">
                        🎤 請錄製不多於 10 秒的語音回答
                    </div>

                    {!audioUrl && !isRecording && (
                        <button 
                            type="button"
                            onClick={startRecording}
                            disabled={disabled}
                            className="w-24 h-24 bg-red-500 hover:bg-red-600 text-white rounded-full font-black text-lg shadow-xl shadow-red-200 flex flex-col items-center justify-center mx-auto transition active:scale-95"
                        >
                            <span className="text-2xl">🎙️</span>
                            <span>開始錄音</span>
                        </button>
                    )}

                    {isRecording && (
                        <div className="space-y-3">

            // Filter current responses for active question

            // Item 7: Timer Countdown Logic with Alarm Sound

            // Sync Question to Firestore
            const publishQuestionToFirestore = async (qObj, newHistoryList) => {
                const appId = "omit-8c173";

            // Exit Room Cleanup

                        console.error("Cleanup error:", e);

            };

            // Download Word Template
            const handleDownloadChallengeTemplate = async () => {
                const sampleLines = [
                    "標題：地球生病了",
                    "總分: 100分",
                    "1.以下哪一項不是地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源",
                    "D. 機械資源*",
                    "",
                    "2.芝士的原料屬於哪一項地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源*",
                    "D. 礦產資源",
                    "",
                    "3.人們不當使用水資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應*",
                    "",
                    "4.人們不當使用煤和石油資源會造成甚麼後果?",
                    "A. 引發極端天氣*",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應"
                ];

                try {
                    const blob = await createWordDocxBlob(sampleLines);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = '挑戰題評估範本_地球生病了.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast("已下載 Word 評估範本檔 (.docx)！", "success");
                } catch (err) {
                    console.error("Docx generation error:", err);
                    showToast("無法生成 Word 範本檔，請重新整理試試。", "error");
                }
            };

            // File upload parse
            const handleWordFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const arrayBuffer = evt.target.result;
                            const result = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                            parsedData = parseWordChallengeText(result.value);
                        } else {
                            const text = evt.target.result;
                            parsedData = parseWordChallengeText(text);
                        }

                        setChallengeData(parsedData);
                        showToast(`已成功解析範本檔案！共 ${parsedData.questions.length} 題`, 'success');
                    } catch (err) {
                        console.error("Word file parse error:", err);
                        showToast("文件解析失敗，請確認格式！", "error");
                    }
                };

                if (file.name.endsWith('.docx')) {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file, "UTF-8");
                }
            };

            // Handlers for dynamic edits
            const handleUpdateChallengeTitle = (newTitle) => {
                setChallengeData(prev => prev ? { ...prev, title: newTitle } : null);
            };

            const handleUpdateChallengeScore = (newScore) => {
                setChallengeData(prev => prev ? { ...prev, totalScore: parseInt(newScore) || 100 } : null);
            };

            const handleUpdateQuestionText = (qIndex, text) => {
                setChallengeData(prev => {
                    if (!prev) return null;
                    const newQs = [...prev.questions];
                    newQs[qIndex] = { ...newQs[qIndex], text };
                    return { ...prev, questions: newQs };
                });
            };

            const handleUpdateOptionText = (qIndex, optIndex, text) => {
                setChallengeData(prev => {
                    if (!prev) return null;
                    const newQs = [...prev.questions];
                    const newOpts = [...newQs[qIndex].options];
                    newOpts[optIndex] = { ...newOpts[optIndex], text };
                    newQs[qIndex] = { ...newQs[qIndex], options: newOpts };
                    return { ...prev, questions: newQs };
                });
            };

            const handleUpdateCorrectAnswer = (qIndex, answerLetter) => {
                setChallengeData(prev => {
                    if (!prev) return null;
                    const newQs = [...prev.questions];
                    newQs[qIndex] = { ...newQs[qIndex], answer: answerLetter };
                    return { ...prev, questions: newQs };
                });
            };

            const handleDeleteQuestion = (qIndex) => {
                setChallengeData(prev => {
                    if (!prev) return null;
                    const newQs = prev.questions.filter((_, idx) => idx !== qIndex).map((q, idx) => ({
                        ...q,
                        num: idx + 1
                    }));
                    return { ...prev, questions: newQs };
                });
                showToast("已成功刪除該題目！", "info");
            };

            // Publish Active Question
            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                
                let challengeContent = null;
                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請先上載並解析 Word 評估範本檔案！", "error");
                        return;
                    }
                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);

                publishQuestionToFirestore(newQ, updatedHistory);
                showToast(`已成功發佈【${getModeLabel(selectedMode)}】給所有學生！`, 'success');
            };

            // Item 10: Teacher manual release of scores for Challenge mode
            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已成功向所有學生一併發放挑戰題成績！", "success");
            };

            // One-click download all student audio recordings as a ZIP file
            const handleDownloadAllAudio = async () => {
                const audioSubmissions = Object.values(currentQuestionResponses).filter(r => r.answer && typeof r.answer === 'string' && r.answer.startsWith('data:audio'));
                
                if (audioSubmissions.length === 0) {
                    showToast("目前尚無學生提交錄音！", "error");
                    return;
                }

                try {
                    const zip = new JSZip();
                    const folder = zip.folder(`課堂錄音_房號${roomCode}`);

                    audioSubmissions.forEach((res) => {
                        const base64Data = res.answer.split(',')[1];
                        const fileName = `${res.seatNumber.toString().padStart(2, '0')}_${res.name || '學生'}.webm`;
                        folder.file(fileName, base64Data, { base64: true });
                    });

                    const content = await zip.generateAsync({ type: "blob" });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(content);
                    link.download = `OMIT_學生錄音_房號${roomCode}.zip`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    showToast(`已打包並下載 ${audioSubmissions.length} 位學生的語音檔案！`, "success");
                } catch (err) {
                    console.error("ZIP creation error:", err);
                    showToast("打包錄音檔案失敗！", "error");
                }
            };

            // Clear Active Question
            const handleClearQuestion = async () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: null }, { merge: true });
                showToast('已結束當前題目', 'info');
            };

            // Item 6: Upgraded Random Student Selector with custom range (1-25, 1-36, etc.)
            const handleSpinRandom = () => {
                if (isSpinning) return;
                
                const start = parseInt(rangeStart) || 1;
                const end = parseInt(rangeEnd) || 36;
                const available = [];
                for (let i = start; i <= end; i++) {
                    if (!drawnNumbers.includes(i)) available.push(i);
                }

                if (available.length === 0) {
                    showToast("此範圍內所有學號皆已被抽出！請點擊重置。", "error");
                    return;
                }

                setIsSpinning(true);
                let counter = 0;
                const maxIntervals = 20;

                const timer = setInterval(() => {
                    const temp = available[Math.floor(Math.random() * available.length)];
                    setCurrentDrawn(temp);
                    playSound('spin');
                    counter++;

                    if (counter >= maxIntervals) {
                        clearInterval(timer);
                        const finalPicked = available[Math.floor(Math.random() * available.length)];
                        setCurrentDrawn(finalPicked);
                        setDrawnNumbers(prev => [...prev, finalPicked]);
                        setIsSpinning(false);
                        playSound('win');
                    }
                }, 100);
            };

            // Item 13: Export CSV Report with complete challenge and interactive records
            const handleExportCSVReport = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生紀錄可供匯出！", "error");
                    return;
                }

                let csvContent = "\uFEFF"; // UTF-8 BOM
                csvContent += "學號,學生姓名,加入時間";

                historyQuestions.forEach((q, idx) => {
                    const cleanText = (q.text || getModeLabel(q.mode)).replace(/"/g, '""');
                    if (q.mode === 'CHALLENGE' && q.challenge) {
                        csvContent += `,第${idx + 1}題[挑戰題:${q.challenge.title}得分],第${idx + 1}題[挑戰題正確率]`;
                    } else {
                        csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]: "${cleanText}"`;
                    }
                });
                csvContent += "\n";

                const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

                sortedStudents.forEach((stu) => {
                    const cleanName = (stu.name || '').replace(/"/g, '""');
                    csvContent += `"${stu.seatNumber}號","${cleanName}","${stu.joinTime || ''}"`;
                    
                    historyQuestions.forEach((q) => {
                        const resKey = `${q.id}_${stu.id}`;
                        const res = responses[resKey];
                        
                        if (res && res.answer !== undefined && res.answer !== null) {
                            if (q.mode === 'CHALLENGE' && res.scoreDetails) {
                                csvContent += `,"${res.scoreDetails.totalScore} / ${q.challenge.totalScore}分","${res.scoreDetails.percentage}% (用時:${res.duration || 0}s)"`;
                            } else {
                                let ansVal = res.answer;
                                if (typeof ansVal === 'string' && ansVal.startsWith('data:image')) {
                                    ansVal = '[圖像白板答案]';
                                } else if (typeof ansVal === 'string' && ansVal.startsWith('data:audio')) {
                                    ansVal = '[語音錄音檔案]';
                                }
                                const cleanAns = String(ansVal).replace(/"/g, '""');
                                csvContent += `,"${cleanAns} (用時:${res.duration || 0}s)"`;
                            }
                        } else {
                            if (q.mode === 'CHALLENGE') {
                                csvContent += `,"未作答","0%"`;
                            } else {
                                csvContent += `,"未作答"`;
                            }
                        }
                    });
                    csvContent += "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `OMIT_課堂學習與挑戰題成績表_房號${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("已成功下載試算表成績紀錄 (.csv)！", "success");
            };

            // Leaderboard calculation
            const leaderboard = useMemo(() => {
                return Object.values(currentQuestionResponses)
                    .filter(r => r.duration !== undefined)
                    .sort((a, b) => {
                        if (activeQuestion?.mode === 'CHALLENGE') {
                            const scoreA = a.scoreDetails?.totalScore || 0;
                            const scoreB = b.scoreDetails?.totalScore || 0;
                            if (scoreB !== scoreA) return scoreB - scoreA;
                        }
                        return parseFloat(a.duration) - parseFloat(b.duration);
                    });
            }, [currentQuestionResponses, activeQuestion]);

            // Item 10 Helper
            const challengeScoresAreReleased = useMemo(() => {

                return !!(activeQuestion.challenge?.releaseInstant || activeQuestion.challenge?.scoresReleased);

                                        <span>📱 QR Code</span>
                                    </button>

                                        title="點擊查看在線學生名單"

                                        <span>在線：{studentsList.length}人</span>
                                    </button>

                                <button

                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Container */}
                    <main className="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

                                { id: 'TF', label: '是非題', icon: '⭕' },
                                { id: 'SHORT', label: '短答題', icon: '✍️' },
                                { id: 'DRAW', label: '白板題', icon: '🎨' },

                                    <span>模式設定：{getModeLabel(selectedMode)}</span>
                                </h2>
                            </div>

                            {selectedMode === 'CHOICE' && (

                                    {[4, 5].map((cnt) => (
                                        <button

                                            className={`px-3 py-1.5 rounded-xl font-bold text-sm border ${choiceCount === cnt ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-700'}`}
                                        >

                                        </button>

                                        <span>🎤 錄音題模式說明：</span>

                                    </p>

                            {selectedMode === 'CHALLENGE' && (

                                            <span>🏆 Word 文件挑戰題評估設定</span>

                                                className="bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow transition flex items-center gap-1.5"

                                    <div className="bg-white p-4 rounded-xl border border-amber-200 space-y-3">

                                                <div className="space-y-3 max-h-80 overflow-y-auto pr-1">
                                                    {challengeData.questions.map((q, qIdx) => (

                                                                    <input 
                                                                        type="text"
                                                                        value={q.text}
                                                                        onChange={(e) => handleUpdateQuestionText(qIdx, e.target.value)}
                                                                        className="w-full px-2 py-1.5 border rounded font-medium text-slate-800 focus:ring-1 focus:ring-amber-500"

                                        />
                                        <span>秒</span>
                                        <button 
                                            onClick={() => {
                                                const totalSecs = (parseInt(customTimerMinutes) || 0) * 60 + (parseInt(customTimerSecs) || 0);
                                                setTimerSeconds(totalSecs);
                                                setTimerActive(false);
                                            }}
                                            className="px-3 py-1 bg-slate-700 text-white rounded font-bold"
                                        >
                                            設定
                                        </button>
                                    </div>

                                    <div className="flex space-x-3 pt-2">
                                        <button 
                                            onClick={() => setTimerActive(!timerActive)}
                                            className={`flex-1 py-3.5 rounded-xl font-black text-lg text-white shadow-md transition ${
                                                timerActive ? 'bg-rose-600 hover:bg-rose-700' : 'bg-emerald-600 hover:bg-emerald-700'
                                            }`}
                                        >
                                            {timerActive ? '⏸️ 暫停計時' : '▶️ 開始倒數'}
                                        </button>
                                        <button 
                                            onClick={() => { setTimerSeconds(0); setTimerActive(false); }}
                                            className="px-5 py-3.5 bg-slate-200 text-slate-700 font-bold rounded-xl text-sm"
                                        >
                                            歸零
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
            const [selectedChoice, setSelectedChoice] = useState('');
            const [shortAnswer, setShortAnswer] = useState('');
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [hasSubmittedCurrent, setHasSubmittedCurrent] = useState(false);
            const [timeRemaining, setTimeRemaining] = useState(null);

            const myResponseKey = activeQuestion ? `${activeQuestion.id}_${studentId}` : null;
            const myPrevResponse = myResponseKey ? responses[myResponseKey] : null;

            // Check if already submitted
            useEffect(() => {
                if (myPrevResponse) {
                    setHasSubmittedCurrent(true);
                } else {
                    setHasSubmittedCurrent(false);
                    setSelectedChoice('');
                    setShortAnswer('');
                    setChallengeAnswers({});
                }
            }, [myPrevResponse, activeQuestion?.id]);

            // Item 9 & Item 11: Challenge Mode Timer Countdown for Student & Auto Submit
            useEffect(() => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE' || !activeQuestion.challenge?.enableTimer) {
                    setTimeRemaining(null);
                    return;
                }

                const timeLimit = activeQuestion.challenge.timeLimit || 120;
                const elapsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                const remaining = Math.max(0, timeLimit - elapsed);

                setTimeRemaining(remaining);

                const timer = setInterval(() => {
                    const currentElapsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                    const rem = Math.max(0, timeLimit - currentElapsed);
                    setTimeRemaining(rem);

                    // Item 11: Auto submit when timer hits 0
                    if (rem <= 0 && !hasSubmittedCurrent) {
                        clearInterval(timer);
                        handleAutoSubmitChallenge();
                    }
                }, 1000);

                return () => clearInterval(timer);
            }, [activeQuestion, hasSubmittedCurrent]);

            // Helper to submit response to Firestore
            const submitStudentAnswer = async (ansVal, extraObj = {}) => {
                if (!activeQuestion) return;

                const duration = ((Date.now() - activeQuestion.startTime) / 1000).toFixed(1);
                const payload = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: ansVal,
                    duration: parseFloat(duration),
                    timestamp: Date.now(),
                    ...extraObj
                };

                const appId = "omit-8c173";
                const db = window.fbDb;
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', `${activeQuestion.id}_${studentId}`);

                await window.fbUtils.setDoc(resDocRef, payload);
                setHasSubmittedCurrent(true);
            };

            // Auto submit when challenge timer expires
            const handleAutoSubmitChallenge = () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                
                let score = 0;
                const questions = activeQuestion.challenge.questions || [];
                questions.forEach(q => {
                    const studentAns = challengeAnswers[q.num];
                    if (studentAns === q.answer) {
                        score += (activeQuestion.challenge.totalScore / questions.length);
                    }
                });
                score = Math.round(score);

                const percentage = Math.round((score / activeQuestion.challenge.totalScore) * 100);

                submitStudentAnswer(challengeAnswers, {
                    scoreDetails: {
                        totalScore: score,
                        percentage: percentage
                    }
                });
                showToast("時間結束，已為您自動提交挑戰題答案！", "info");
            };

            // Item 11: Challenge Submit
            const handleChallengeSubmit = (e) => {
                e?.preventDefault();
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;

                let score = 0;
                const questions = activeQuestion.challenge.questions || [];
                questions.forEach(q => {
                    const studentAns = challengeAnswers[q.num];
                    if (studentAns === q.answer) {
                        score += (activeQuestion.challenge.totalScore / questions.length);
                    }
                });
                score = Math.round(score);

                const percentage = Math.round((score / activeQuestion.challenge.totalScore) * 100);

                submitStudentAnswer(challengeAnswers, {
                    scoreDetails: {
                        totalScore: score,
                        percentage: percentage
                    }
                });
            };

            return (
                <div className="min-h-screen pb-12 bg-slate-100">
                    {/* Header */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 py-3">
                        <div className="max-w-3xl mx-auto flex items-center justify-between">
                            <div className="flex items-center space-x-2">
                                <span className="bg-indigo-600 text-white font-black px-2.5 py-1 rounded-lg text-sm">OMIT</span>
                                <span className="font-extrabold text-slate-800 text-sm">宣道會陳元喜小學</span>
                            </div>
                            <div className="flex items-center space-x-3">
                                <span className="text-xs bg-slate-100 text-slate-700 font-bold px-3 py-1.5 rounded-full border">
                                    {seatNumber}號 - {studentName || '學生'}
                                </span>
                                <button onClick={onExit} className="text-xs text-rose-600 font-bold hover:underline">
                                    退出
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-3xl mx-auto p-4 md:p-6 space-y-6">

                        {/* Broadcasted Student Work Display */}
                        {activeQuestion?.broadcastedSubmission && (
                            <div className="bg-gradient-to-r from-purple-600 to-indigo-600 rounded-3xl p-5 text-white shadow-xl space-y-3">
                                <div className="text-xs font-bold uppercase tracking-widest text-purple-200">📢 老師廣播優秀作品</div>
                                <div className="font-black text-lg">
                                    同學 {activeQuestion.broadcastedSubmission.name} ({activeQuestion.broadcastedSubmission.seatNumber}號) 的作答：
                                </div>
                                <div className="aspect-16-9 bg-white rounded-2xl overflow-hidden p-2 shadow-inner">
                                    <img src={activeQuestion.broadcastedSubmission.answer} className="w-full h-full object-contain" alt="廣播作品" />
                                </div>
                            </div>
                        )}

                        {!activeQuestion ? (
                            <div className="bg-white rounded-3xl p-10 text-center space-y-4 shadow-sm border border-slate-200 my-12">
                                <div className="text-6xl animate-bounce">⏳</div>
                                <h2 className="text-xl font-black text-slate-800">請安靜等候老師發佈互動題目...</h2>
                                <p className="text-xs text-slate-400 font-medium">當老師開始題目時，此頁面會自動呈現作答內容</p>
                            </div>
                        ) : (
                            <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-200 space-y-6">
                                <div className="flex justify-between items-start border-b pb-4">
                                    <div>
                                        <span className="bg-indigo-100 text-indigo-700 text-xs font-extrabold px-3 py-1 rounded-full uppercase tracking-wider">
                                            {getModeLabel(activeQuestion.mode)}
                                        </span>
                                        <h2 className="text-2xl font-black text-slate-800 mt-2">{activeQuestion.text}</h2>
                                    </div>

                                    {/* Item 9: Timed Mode Countdown Display */}
                                    {activeQuestion.mode === 'CHALLENGE' && timeRemaining !== null && (
                                        <div className="bg-amber-100 border border-amber-300 text-amber-900 font-mono font-black text-xl px-4 py-2 rounded-2xl animate-pulse">
                                            ⏱️ {Math.floor(timeRemaining / 60)}:{(timeRemaining % 60).toString().padStart(2, '0')}
                                        </div>
                                    )}
                                </div>

                                {/* Item 2: Link distribution upgrade */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div className="space-y-4 text-center py-4">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div className="aspect-16-9 w-full rounded-2xl overflow-hidden border shadow-lg bg-black">
                                                <iframe 
                                                    src={activeQuestion.youtubeEmbed} 
                                                    className="w-full h-full"
                                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                                    allowFullScreen
                                                ></iframe>
                                            </div>
                                        ) : null}

                                        <div className="pt-2">
                                            <a 
                                                href={activeQuestion.pushedUrl} 
                                                target="_blank" 
                                                rel="noopener noreferrer"
                                                className="inline-flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-700 text-white font-black px-6 py-4 rounded-2xl shadow-lg shadow-indigo-200 text-lg transition active:scale-95"
                                            >
                                                <span>開啟連結網站 ↗</span>
                                            </a>
                                        </div>
                                    </div>
                                )}

                                {/* Choice / TF */}
                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        {activeQuestion.choiceOptions.map((opt) => (
                                            <button 
                                                key={opt}
                                                disabled={hasSubmittedCurrent && activeQuestion.lockAfterSubmit}
                                                onClick={() => {
                                                    setSelectedChoice(opt);
                                                    submitStudentAnswer(opt);
                                                }}
                                                className={`p-5 rounded-2xl font-black text-lg border-2 text-left transition flex items-center justify-between active:scale-98 ${
                                                    selectedChoice === opt || myPrevResponse?.answer === opt
                                                    ? 'bg-indigo-600 text-white border-indigo-600 ring-4 ring-indigo-200 shadow-md'
                                                    : 'bg-slate-50 text-slate-700 border-slate-200 hover:border-slate-300'
                                                }`}
                                            >
                                                <span>{opt}</span>
                                                {(selectedChoice === opt || myPrevResponse?.answer === opt) && <span>✓</span>}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {/* Short Answer */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <form onSubmit={(e) => { e.preventDefault(); submitStudentAnswer(shortAnswer); }} className="space-y-4">
                                        <textarea 
                                            rows={4}
                                            value={shortAnswer}
                                            onChange={(e) => setShortAnswer(e.target.value)}
                                            disabled={hasSubmittedCurrent && activeQuestion.lockAfterSubmit}
                                            placeholder="請輸入您的答案..."
                                            className="w-full p-4 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 font-medium text-slate-800"
                                        />
                                        <button 
                                            type="submit"
                                            disabled={hasSubmittedCurrent && activeQuestion.lockAfterSubmit}
                                            className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-md"
                                        >
                                            提交答案
                                        </button>
                                    </form>
                                )}

                                {/* Item 1 Whiteboard Answer */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <WhiteboardCanvas 
                                        initialBg={activeQuestion.whiteboardBg}
                                        disabled={hasSubmittedCurrent && activeQuestion.lockAfterSubmit}
                                        onSubmit={(canvasDataUrl) => submitStudentAnswer(canvasDataUrl)}
                                    />
                                )}

                                {/* Buzzer */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div className="text-center py-6">
                                        <button 
                                            disabled={hasSubmittedCurrent}
                                            onClick={() => {
                                                playSound('buzzer');
                                                submitStudentAnswer('搶答成功！');
                                            }}
                                            className={`w-44 h-44 rounded-full font-black text-2xl text-white shadow-2xl transition transform active:scale-90 border-8 border-white ${
                                                hasSubmittedCurrent 
                                                ? 'bg-slate-400 cursor-not-allowed' 
                                                : 'bg-rose-500 hover:bg-rose-600 animate-pulse shadow-rose-300'
                                            }`}
                                        >
                                            {hasSubmittedCurrent ? '已搶答！' : '搶答！🚨'}
                                        </button>
                                    </div>
                                )}

                                {/* Item 3 Audio Answer */}
                                {activeQuestion.mode === 'AUDIO' && (
                                    <AudioRecorderQuestion 
                                        disabled={hasSubmittedCurrent && activeQuestion.lockAfterSubmit}
                                        onSubmit={(audioDataUrl) => submitStudentAnswer(audioDataUrl)}
                                    />
                                )}

                                {/* Item 11: Challenge Mode Student Interface */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                    <form onSubmit={handleChallengeSubmit} className="space-y-6">
                                        <div className="space-y-4">
                                            {activeQuestion.challenge.questions.map((q, idx) => (
                                                <div key={idx} className="bg-slate-50 p-4 md:p-5 rounded-2xl border border-slate-200 space-y-3">
                                                    <div className="font-extrabold text-slate-800 text-base">
                                                        {q.num}. {q.text}
                                                    </div>
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                        {q.options.map((opt) => (
                                                            <button 
                                                                key={opt.letter}
                                                                type="button"
                                                                disabled={hasSubmittedCurrent}
                                                                onClick={() => {
                                                                    setChallengeAnswers(prev => ({
                                                                        ...prev,
                                                                        [q.num]: opt.letter
                                                                    }));
                                                                }}
                                                                className={`p-3 rounded-xl border font-bold text-sm text-left transition flex items-center justify-between ${
                                                                    challengeAnswers[q.num] === opt.letter || myPrevResponse?.answer?.[q.num] === opt.letter
                                                                    ? 'bg-amber-600 text-white border-amber-600 shadow-md'
                                                                    : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100'
                                                                }`}
                                                            >
                                                                <span>{opt.letter}. {opt.text}</span>
                                                                {(challengeAnswers[q.num] === opt.letter || myPrevResponse?.answer?.[q.num] === opt.letter) && <span>✓</span>}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        {!hasSubmittedCurrent && (
                                            <button 
                                                type="submit"
                                                className="w-full py-4 bg-amber-600 hover:bg-amber-700 text-white font-black rounded-2xl shadow-lg shadow-amber-200 text-lg transition active:scale-98"
                                            >
                                                確認提交挑戰題評估 🏆
                                            </button>
                                        )}
                                    </form>
                                )}

                                {/* Item 4: Unified praise feedback message notice */}
                                {hasSubmittedCurrent && (
                                    <div className="bg-emerald-50 border-2 border-emerald-400 p-5 rounded-2xl text-center space-y-2 animate-fade-in shadow-md">
                                        <div className="text-3xl">🌟</div>
                                        <div className="font-black text-emerald-900 text-lg">
                                            已提交答案! 讚賞你的努力! 安靜等候老師指示...
                                        </div>

                                        {/* Item 10: Score display based on teacher release mode */}
                                        {activeQuestion.mode === 'CHALLENGE' && (
                                            <div className="pt-2 border-t border-emerald-200">
                                                {activeQuestion.challenge?.scoresReleased || activeQuestion.challenge?.releaseInstant ? (
                                                    myPrevResponse?.scoreDetails && (
                                                        <div className="text-emerald-800 font-bold text-sm">
                                                            您的得分：<strong className="text-xl text-emerald-700">{myPrevResponse.scoreDetails.totalScore} / {activeQuestion.challenge.totalScore} 分</strong> （正確率 {myPrevResponse.scoreDetails.percentage}%）
                                                        </div>
                                                    )
                                                ) : (
                                                    <div className="text-xs text-emerald-700 italic font-medium">
                                                         (教師設定為「待所有學生完成提交後一併發放分數」，請耐性等候成績公佈)
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
