<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMIT 互動課堂 - 即時課堂互動平台</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Firebase 10 SDKs (Compat version for browser-script environment) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            touch-action: manipulation;
            background-color: #f8fafc;
        }
        .canvas-container {
            touch-action: none;
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.4; }

        .animate-pulse-ring {
            animation: pulse-ring 2s infinite ease-in-out;

</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // Firebase Config from User Request
        const firebaseConfig = {
            apiKey: "AIzaSyAcphRXxqs_MTeWwffVVOFsnb8Liro5Lto",
            authDomain: "omit-8c173.firebaseapp.com",
            projectId: "omit-8c173",
            storageBucket: "omit-8c173.firebasestorage.app",
            messagingSenderId: "1078509757779",
            appId: "1:1078509757779:web:64fe9465920eca4f38ada6"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = firebaseConfig.projectId || 'omit-8c173';

        // Helper for audio synthesis & chimes
        const playSoundEffect = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'buzzer') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'alarm') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.2); // A5
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.6);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.15); // E5
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.3); // G5
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.6);
                }
            } catch (e) {
                console.log('Audio Context error', e);
            }
        };

        const { useState, useEffect, useRef, useMemo } = React;

        // Custom SVG Icon Helper
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                qrcode: <path d="M3 3h6v6H3zm12 0h6v6h-6zM3 15h6v6H3zm14 0h4v4h-4zm2 2v2M15 15h2v2h-2zM7 7H5V5h2zm12 0h-2V5h2zM7 19H5v-2h2zm10-10h-2V7h2zm-4 4h-2v-2h2zm2 2h-2v-2h2zm-4 4h-2v-2h2zm2-2h-2v-2h2z" />,
                users: <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm13 10v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />,
                timer: <path d="M10 2h4M12 14l3-3M12 22a8 8 0 1 0 0-16 8 8 0 0 0 0 16z" />,
                dice: <path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM8.5 8.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm7 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm-3.5 3.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm-3.5 3.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm7 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" />,
                export: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" />,
                exit: <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />,
                trophy: <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M2 2h20M12 15a6 6 0 0 0 6-6V3H6v6a6 6 0 0 0 6 6zm0 0v7" />,
                edit: <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />,
                send: <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />,
                play: <path d="M5 3l14 9-14 9V3z" />,
                close: <path d="M18 6L6 18M6 6l12 12" />,
                check: <path d="M20 6L9 17l-5-5" />,
                image: <path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-8 4a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm10 10L16 12l-4 4-2-2-5 5h14z" />
            };
            return (
                <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
                    {icons[name] || null}
                </svg>
            );
        };

        // Custom Toast Notification
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-rose-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (
                <div className={`fixed top-4 right-4 z-50 ${bgColor} text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-2 text-sm font-semibold animate-bounce`}>
                    <span>{message}</span>
                </div>
            );
        };

        function OMITApp() {
            // Role & Session State
            const [role, setRole] = useState('LANDING'); // 'LANDING', 'TEACHER', 'STUDENT'
            const [roomCode, setRoomCode] = useState('');
            const [studentNumber, setStudentNumber] = useState('1'); // Dropdown 1-36
            const [studentNameInput, setStudentNameInput] = useState('');
            const [toast, setToast] = useState(null);

            // Teacher Password Modal state
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');

            // Shared Firestore Data State
            const [activeQuestion, setActiveQuestion] = useState(null);
            const [studentsList, setStudentsList] = useState([]);
            const [responses, setResponses] = useState({});
            const [buzzerWinner, setBuzzerWinner] = useState(null);
            const [broadcastItem, setBroadcastItem] = useState(null);
            const [questionHistory, setQuestionHistory] = useState([]);

            const studentIdRef = useRef('std_' + Math.random().toString(36).substring(2, 9));

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            // Ensure anonymous auth for Firestore access
            useEffect(() => {
                auth.signInAnonymously().catch(err => console.error("Firebase auth error:", err));
            }, []);

            // Check URL query for direct room join
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const roomParam = params.get('room');
                if (roomParam) {
                    setRoomCode(roomParam.toUpperCase());
                }
            }, []);

            // Realtime Sync Listener via Firestore
            useEffect(() => {
                if (!roomCode) return;

                // Path following mandatory Firestore structure: /artifacts/{appId}/public/data/{collectionName}
                const roomDocRef = db.collection('artifacts').doc(appId)
                                     .collection('public').doc('data')
                                     .collection('omit_rooms').doc(roomCode.toUpperCase());

                const unsubscribe = roomDocRef.onSnapshot((snapshot) => {
                    if (snapshot && snapshot.exists) {
                        const data = snapshot.data();
                        setActiveQuestion(data.activeQuestion || null);
                        setStudentsList(data.studentsList || []);
                        setResponses(data.responses || {});
                        setBuzzerWinner(data.buzzerWinner || null);
                        setBroadcastItem(data.broadcastItem || null);
                        setQuestionHistory(data.questionHistory || []);
                    }
                }, (error) => {
                    console.error("Firestore sync error:", error);
                });

                return () => unsubscribe();
            }, [roomCode]);

            // Register Student Presence
            useEffect(() => {
                if (role === 'STUDENT' && roomCode) {
                    const roomDocRef = db.collection('artifacts').doc(appId)
                                         .collection('public').doc('data')
                                         .collection('omit_rooms').doc(roomCode.toUpperCase());

                    const fullStudentName = studentNameInput.trim() ? `#${studentNumber} ${studentNameInput.trim()}` : `#${studentNumber}`;
                    const myInfo = {
                        studentId: studentIdRef.current,
                        studentNumber: studentNumber,
                        name: fullStudentName,
                        joinedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                    };

                    roomDocRef.get().then((docSnap) => {
                        let existingList = docSnap.exists && docSnap.data().studentsList ? docSnap.data().studentsList : [];
                        // Filter out existing student record with same ID or Number
                        existingList = existingList.filter(s => s.studentId !== myStudentIdRef.current && s.studentNumber !== studentNumber);
                        existingList.push(myInfo);
                        roomDocRef.set({ studentsList: existingList }, { merge: true });
                    });

                    // Heartbeat/Cleanup on unload
                    const handleUnload = () => {
                        roomDocRef.get().then(docSnap => {
                            if (docSnap.exists) {
                                const list = docSnap.data().studentsList || [];
                                const updated = list.filter(s => s.studentId !== studentIdRef.current);
                                roomDocRef.update({ studentsList: updated });
                            }
                        });
                    };
                    window.addEventListener('beforeunload', handleUnload);
                    return () => window.removeEventListener('beforeunload', handleUnload);
                }
            }, [role, roomCode, studentNumber, studentNameInput]);

            // Handle Teacher Login Password Modal
            const handleTeacherClick = () => {
                setShowPasswordModal(true);
                setPasswordInput('');
            };

            const handleTeacherPasswordSubmit = (e) => {
                e.preventDefault();
                if (passwordInput === '8030') {
                    setShowPasswordModal(false);
                    const generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
                    setRoomCode(generatedCode);
                    setRole('TEACHER');

                    // Initialize room document
                    const roomDocRef = db.collection('artifacts').doc(appId)
                                         .collection('public').doc('data')
                                         .collection('omit_rooms').doc(generatedCode);
                    roomDocRef.set({
                        createdAt: Date.now(),
                        activeQuestion: null,
                        studentsList: [],
                        responses: {},
                        buzzerWinner: null,
                        broadcastItem: null,
                        questionHistory: []
                    });

                    showToast(`已成功開啟互動課堂 房號：${generatedCode}`, 'success');
                } else {
                    showToast('密碼錯誤，請重新輸入', 'error');
                }
            };

            // Handle Student Join Room
            const handleJoinRoom = (e) => {
                e?.preventDefault();
                if (!roomCode.trim()) {
                    showToast('請輸入6位數字房號', 'error');
                    return;
                }
                setRole('STUDENT');
                showToast(`已進入房號 ${roomCode} 的課堂`, 'success');
            };

            if (role === 'LANDING') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-purple-950 flex items-center justify-center p-4">
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

                        <div className="max-w-md w-full bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-8 space-y-8 relative overflow-hidden border border-white/20">
                            <div className="text-center space-y-2">
                                <div className="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-indigo-600 to-violet-500 text-white rounded-2xl mb-2 font-black text-2xl shadow-lg tracking-wider">
                                    OMIT
                                </div>
                                <h1 className="text-3xl font-black text-slate-800 tracking-tight">OMIT 互動課堂</h1>
                                <p className="text-slate-500 text-sm font-medium">免登入！隨查隨答、高效即時的反饋互動平台</p>
                            </div>

                            <div className="space-y-6">
                                {/* Student Join Section */}
                                <form onSubmit={handleJoinRoom} className="bg-indigo-50/70 p-5 rounded-2xl border border-indigo-100 space-y-4">
                                    <h2 className="text-xs font-bold text-indigo-600 uppercase tracking-wider flex items-center gap-1.5">
                                        <Icon name="users" className="w-4 h-4" /> 我是學生 (加入課堂)
                                    </h2>
                                    <div>
                                        <label className="text-xs text-slate-500 font-semibold mb-1 block">1. 選擇學號 (必需)</label>
                                        <select 
                                            value={studentNumber} 
                                            onChange={(e) => setStudentNumber(e.target.value)}
                                            className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-bold text-slate-700 text-base"
                                        >
                                            {Array.from({ length: 36 }, (_, i) => i + 1).map(num => (
                                                <option key={num} value={num.toString()}>學號 {num}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-500 font-semibold mb-1 block">2. 輸入姓名 (可留空不填)</label>
                                        <input 
                                            type="text" 
                                            placeholder="姓名 (可留空)" 
                                            value={studentNameInput} 
                                            onChange={(e) => setStudentNameInput(e.target.value)}
                                            className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-medium text-slate-800"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-500 font-semibold mb-1 block">3. 課堂房號</label>
                                        <input 
                                            type="text" 
                                            placeholder="請輸入6位數房號" 
                                            value={roomCode} 
                                            onChange={(e) => setRoomCode(e.target.value)}
                                            className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-mono text-center tracking-widest text-lg font-black text-indigo-900"
                                            maxLength={6}
                                        />
                                    </div>
                                    <button 
                                        type="submit" 
                                        className="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-200 active:scale-98 text-base"
                                    >
                                        進入課堂 🚀
                                    </button>
                                </form>

                                <div className="relative flex py-1 items-center">
                                    <div className="flex-grow border-t border-slate-200"></div>
                                    <span className="flex-shrink mx-4 text-slate-400 text-xs font-medium">或</span>
                                    <div className="flex-grow border-t border-slate-200"></div>
                                </div>

                                {/* Teacher Create Section */}
                                <div className="text-center">
                                    <button 
                                        onClick={handleTeacherClick}
                                        className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl transition shadow-md flex items-center justify-center space-x-2 active:scale-98 text-base"
                                    >
                                        <span>👨‍🏫 開啟新課堂 (教師控制台)</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Teacher Password Modal (Requirement 14) */}
                        {showPasswordModal && (
                            <div className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
                                <div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl space-y-5 animate-in fade-in zoom-in">
                                    <div className="text-center space-y-1">
                                        <h3 className="text-xl font-bold text-slate-800">教師權驗證</h3>
                                        <p className="text-xs text-slate-500">請輸入教師訪問密碼</p>
                                    </div>
                                    <form onSubmit={handleTeacherPasswordSubmit} className="space-y-4">
                                        <input 
                                            type="password" 
                                            value={passwordInput}
                                            onChange={(e) => setPasswordInput(e.target.value)}
                                            autoFocus
                                            className="w-full px-4 py-3.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-600 focus:outline-none text-center font-mono text-2xl tracking-widest"
                                        />
                                        <div className="flex gap-2">
                                            <button 
                                                type="button" 
                                                onClick={() => setShowPasswordModal(false)}
                                                className="flex-1 py-3 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200 transition"
                                            >
                                                取消
                                            </button>
                                            <button 
                                                type="submit" 
                                                className="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition shadow-md"
                                            >
                                                確認
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            if (role === 'TEACHER') {
                return (
                    <TeacherDashboard 
                        roomCode={roomCode} 
                        activeQuestion={activeQuestion} 
                        studentsList={studentsList}
                        responses={responses}
                        buzzerWinner={buzzerWinner}
                        questionHistory={questionHistory}
                        showToast={showToast}
                        onExit={() => {
                            // Requirement 6: Clean Firestore data on teacher exit
                            if (roomCode) {
                                db.collection('artifacts').doc(appId)
                                  .collection('public').doc('data')
                                  .collection('omit_rooms').doc(roomCode.toUpperCase()).delete();
                            }
                            setRole('LANDING');
                        }}
                    />
                );
            }

            if (role === 'STUDENT') {
                return (
                    <StudentInterface 
                        roomCode={roomCode}
                        studentNumber={studentNumber}
                        studentNameInput={studentNameInput}
                        studentId={studentIdRef.current}
                        activeQuestion={activeQuestion}
                        responses={responses}
                        buzzerWinner={buzzerWinner}
                        broadcastItem={broadcastItem}
                        showToast={showToast}
                        onExit={() => setRole('LANDING')}
                    />
                );
            }

            return null;
        }

        function TeacherDashboard({ roomCode, activeQuestion, studentsList, responses, buzzerWinner, questionHistory, showToast, onExit }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE'); // CHOICE, TF, SHORT, DRAW, BUZZER, LINK
            const [questionText, setQuestionText] = useState('');
            const [allowStudentModify, setAllowStudentModify] = useState(false); // Requirement 4: default false
            const [whiteboardBgImage, setWhiteboardBgImage] = useState(null); // Requirement 2
            const [pushUrlInput, setPushUrlInput] = useState(''); // Requirement 10
            const [choiceCount, setChoiceCount] = useState(4); // 4 or 5 options

            // Modals & Panels
            const [showQRModal, setShowQRModal] = useState(false); // Requirement 1
            const [showStudentListModal, setShowStudentListModal] = useState(false); // Requirement 1
            const [showTimerModal, setShowTimerModal] = useState(false); // Requirement 15
            const [showPickerModal, setShowPickerModal] = useState(false); // Requirement 11
            const [selectedBarFilter, setSelectedBarFilter] = useState(null); // Requirement 8
            const [inspectWhiteboardStudent, setInspectWhiteboardStudent] = useState(null); // Requirement 3

            // Timer state (Requirement 15)
            const [timerSecondsLeft, setTimerSecondsLeft] = useState(0);
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const [timerFullscreen, setTimerFullscreen] = useState(false);
            const [customMinInput, setCustomMinInput] = useState('1');
            const [customSecInput, setCustomSecInput] = useState('0');

            // Random picker state (Requirement 11)
            const [pickerRangeMin, setPickerRangeMin] = useState(1);
            const [pickerRangeMax, setPickerRangeMax] = useState(36);
            const [drawnHistory, setDrawnHistory] = useState([]);
            const [currentPicked, setCurrentPicked] = useState(null);
            const [isSpinning, setIsSpinning] = useState(false);

            const roomDocRef = useMemo(() => {
                return db.collection('artifacts').doc(appId)
                         .collection('public').doc('data')
                         .collection('omit_rooms').doc(roomCode.toUpperCase());
            }, [roomCode]);

            // Timer Countdown Effect
            useEffect(() => {
                let interval = null;
                if (isTimerRunning && timerSecondsLeft > 0) {
                    interval = setInterval(() => {
                        setTimerSecondsLeft(prev => prev - 1);
                    }, 1000);
                } else if (timerSecondsLeft === 0 && isTimerRunning) {
                    setIsTimerRunning(false);
                    playSoundEffect('alarm');
                    showToast('⏰ 計時時間到！', 'error');
                }
                return () => clearInterval(interval);
            }, [isTimerRunning, timerSecondsLeft]);

            // Handle Whiteboard Background Image Upload (Requirement 2)
            const handleBgImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setWhiteboardBgImage(evt.target.result);
                        showToast('已設定白板背景圖片！', 'success');
                    };
                    reader.readAsDataURL(file);
                }
            };

            // Publish Question
            const handlePublishQuestion = () => {
                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: questionText.trim() || getDefaultPrompt(selectedMode),
                    startTime: Date.now(),
                    allowStudentModify: allowStudentModify,
                    whiteboardBgImage: selectedMode === 'DRAW' ? whiteboardBgImage : null,
                    pushUrl: selectedMode === 'LINK' ? pushUrlInput.trim() : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : (selectedMode === 'TF' ? ['O', 'X'] : [])
                };

                const updatedHistory = [...questionHistory, newQ];

                roomDocRef.set({
                    activeQuestion: newQ,
                    responses: {},
                    buzzerWinner: null,
                    broadcastItem: null,
                    questionHistory: updatedHistory
                }, { merge: true });

                showToast('已發佈至所有學生頁面！', 'success');
            };

            const handleClearQuestion = () => {
                roomDocRef.set({
                    activeQuestion: null,
                    buzzerWinner: null,
                    broadcastItem: null
                }, { merge: true });
                showToast('已收回題目', 'info');
            };

            // Toggle student answer modification permission live
            const toggleAllowModify = () => {
                if (!activeQuestion) return;
                const updatedQ = { ...activeQuestion, allowStudentModify: !activeQuestion.allowStudentModify };
                roomDocRef.set({ activeQuestion: updatedQ }, { merge: true });
                showToast(updatedQ.allowStudentModify ? '已開放學生修改答案' : '已鎖定學生答案', 'info');
            };

            // Requirement 11: Random Student Drawer
            const handleDrawStudent = () => {
                const min = parseInt(pickerRangeMin, 10) || 1;
                const max = parseInt(pickerRangeMax, 10) || 36;
                const pool = [];
                for (let i = min; i <= max; i++) {
                    if (!drawnHistory.includes(i)) pool.push(i);
                }
                if (pool.length === 0) {
                    showToast('指定範圍內所有學號已全被抽選！可點擊重置', 'error');
                    return;
                }

                setIsSpinning(true);
                let count = 0;
                const spinInterval = setInterval(() => {
                    const randomVal = pool[Math.floor(Math.random() * pool.length)];
                    setCurrentPicked(randomVal);
                    count++;
                    if (count > 20) {
                        clearInterval(spinInterval);
                        const finalPick = pool[Math.floor(Math.random() * pool.length)];
                        setCurrentPicked(finalPick);
                        setDrawnHistory(prev => [...prev, finalPick]);
                        setIsSpinning(false);
                        playSoundEffect('win');
                    }
                }, 80);
            };

            // Requirement 13: Export Learning Report (CSV)
            const handleExportCSV = () => {
                if (questionHistory.length === 0) {
                    showToast('暫時未有發佈過題目，無法匯出報告', 'error');
                    return;
                }

                let csvContent = "\uFEFF學號,學生姓名";
                questionHistory.forEach((q, idx) => {
                    csvContent += `,Q${idx + 1} (${q.mode})`;
                });
                csvContent += "\n";

                // Unique list of students from current list or responses
                const allStudentsMap = {};
                studentsList.forEach(s => {
                    allStudentsMap[s.studentNumber] = s.name;
                });

                // Generate matrix row per student number (1 to 36)
                for (let num = 1; num <= 36; num++) {
                    const numStr = num.toString();
                    const name = allStudentsMap[numStr] || `學號 ${num}`;
                    let row = `${numStr},"${name}"`;

                    questionHistory.forEach((q) => {
                        let ans = "-";
                        // Find response for this question if available
                        if (responses && responses[q.id] && responses[q.id][numStr]) {
                            ans = responses[q.id][numStr].answer;
                        } else if (responses && responses[numStr]) {
                            ans = responses[numStr].answer;
                        }
                        if (typeof ans === 'string') {
                            ans = ans.replace(/"/g, '""');
                        }
                        row += `,"${ans}"`;
                    });
                    csvContent += row + "\n";
                }

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `OMIT_課堂學習報告_${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('已成功匯出 CSV 學習報告！', 'success');
            };

        function StudentInterface({ roomCode, studentNumber, studentNameInput, studentId, activeQuestion, responses, buzzerWinner, broadcastItem, showToast, onExit }) {
            const [myAnswer, setMyAnswer] = useState('');
            const [submitted, setSubmitted] = useState(false);
            const [submitting, setSubmitting] = useState(false);

            // Whiteboard canvas states (Requirement 2)
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [penColor, setPenColor] = useState('#1e293b');
            const [penWidth, setPenWidth] = useState(4);
            const [isEraser, setIsEraser] = useState(false);

            const studentName = studentNameInput.trim() ? `#${studentNumber} ${studentNameInput.trim()}` : `#${studentNumber}`;
            const roomDocRef = useMemo(() => {
                return db.collection('artifacts').doc(appId)
                         .collection('public').doc('data')
                         .collection('omit_rooms').doc(roomCode.toUpperCase());
            }, [roomCode]);

            // Reset answer state on new active question
            useEffect(() => {
                setMyAnswer('');
                setSubmitted(false);
            }, [activeQuestion?.id]);

            // Draw Background Image on Student Whiteboard Canvas when loaded (Requirement 2)
            useEffect(() => {
                if (activeQuestion?.mode === 'DRAW' && canvasRef.current) {
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    if (activeQuestion.whiteboardBgImage) {
                        const img = new Image();
                        img.crossOrigin = "anonymous";
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        };
                        img.src = activeQuestion.whiteboardBgImage;
                    }
                }
            }, [activeQuestion?.id, activeQuestion?.whiteboardBgImage]);

            // Whiteboard Mouse/Touch Handlers
            const startDrawing = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const ctx = canvas.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(clientX - rect.left, clientY - rect.top);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing || !canvasRef.current) return;
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const ctx = canvas.getContext('2d');
                ctx.lineWidth = penWidth;
                ctx.lineCap = 'round';
                ctx.strokeStyle = isEraser ? '#ffffff' : penColor;

                ctx.lineTo(clientX - rect.left, clientY - rect.top);
                ctx.stroke();
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const clearCanvas = () => {
                if (!canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (activeQuestion?.whiteboardBgImage) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    img.src = activeQuestion.whiteboardBgImage;
                }
            };

            // Photo Upload onto Whiteboard Canvas (Requirement 2)
            const handleCanvasPhotoUpload = (e) => {
                const file = e.target.files[0];
                if (file && canvasRef.current) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = canvasRef.current;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 10, 10, canvas.width - 20, canvas.height - 20);
                        };
                        img.src = evt.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            // Submit Student Answer
            const handleSubmitAnswer = (answerVal) => {
                if (!activeQuestion) return;
                setSubmitting(true);

                const durationSec = activeQuestion.startTime ? ((Date.now() - activeQuestion.startTime) / 1000).toFixed(1) : 0;
                const record = {
                    studentId: studentId,
                    studentNumber: studentNumber,
                    name: studentName,
                    answer: answerVal,
                    timestamp: Date.now(),
                    timestampStr: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                    duration: durationSec
                };

                roomDocRef.get().then((docSnap) => {
                    const currentResponses = docSnap.exists && docSnap.data().responses ? docSnap.data().responses : {};
                    currentResponses[studentNumber] = record;

                    roomDocRef.set({ responses: currentResponses }, { merge: true }).then(() => {
                        setSubmitting(false);
                        setSubmitted(true);
                        showToast('答案已成功提交！', 'success');
                    });
                });
            };

            // Requirement 9: Buzzer Tap Handler
            const handlePressBuzzer = () => {
                if (buzzerWinner) return;
                playSoundEffect('buzzer');
                const durationSec = activeQuestion.startTime ? ((Date.now() - activeQuestion.startTime) / 1000).toFixed(2) : 0;

                const winnerRecord = {
                    studentNumber,
                    name: studentName,
                    duration: durationSec
                };

                roomDocRef.set({ buzzerWinner: winnerRecord }, { merge: true });
            };

            // Helper to extract YouTube video ID from link (Requirement 10)
            const getYouTubeEmbedUrl = (url) => {
                if (!url) return null;
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = url.match(regExp);
                return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : null;
            };

            return (
                <div className="min-h-screen bg-slate-900 text-white flex flex-col">
                    {/* Student Top Bar */}
                    <header className="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center">
                        <div className="flex items-center space-x-2">
                            <span className="font-black text-indigo-400">OMIT</span>
                            <span className="text-slate-500">|</span>
                            <span className="text-sm font-bold text-slate-200">{studentName}</span>
                        </div>
                        <button onClick={onExit} className="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg font-bold">
                            離開課堂
                        </button>
                    </header>

                    {/* Requirement 3: Broadcasted Peer Evaluation Overlay */}
                    {broadcastItem && (
                        <div className="bg-gradient-to-r from-amber-500 to-orange-600 text-slate-950 p-4 font-bold text-center shadow-lg animate-pulse flex items-center justify-center space-x-2">
                            <span>📢 老師正在廣播作品：[{broadcastItem.name}] 的答案 / 作品</span>
                        </div>
                    )}

                    <main className="flex-1 max-w-xl w-full mx-auto p-4 flex flex-col justify-center space-y-6">
                        {!activeQuestion ? (
                            <div className="text-center py-16 space-y-4">
                                <div className="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto animate-pulse">
                                    <Icon name="timer" className="w-8 h-8" />
                                </div>
                                <h2 className="text-2xl font-black text-slate-200">等待老師發佈題目...</h2>
                                <p className="text-slate-400 text-sm">題目發佈後將即時顯示於畫面</p>
                            </div>
                        ) : (
                            <div className="bg-slate-800 rounded-3xl p-6 border border-slate-700 shadow-2xl space-y-6">
                                <div className="space-y-1">
                                    <span className="text-xs font-bold text-indigo-400 uppercase tracking-widest">{activeQuestion.mode}</span>
                                    <h2 className="text-xl font-black text-white">{activeQuestion.text}</h2>
                                </div>

                                {/* CHOICE or TF Input */}
                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div className="grid grid-cols-2 gap-3">
                                        {activeQuestion.choiceOptions.map(opt => (
                                            <button 
                                                key={opt}
                                                disabled={submitted && !activeQuestion.allowStudentModify}
                                                onClick={() => { setMyAnswer(opt); handleSubmitAnswer(opt); }}
                                                className={`p-6 rounded-2xl font-black text-2xl transition transform active:scale-95 flex items-center justify-center shadow-lg border-2 ${myAnswer === opt ? 'bg-indigo-600 border-indigo-400 text-white' : 'bg-slate-700 hover:bg-slate-600 border-slate-600 text-slate-200'}`}
                                            >
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {/* SHORT Input */}
                                {activeQuestion.mode === 'SHORT' && (
                                    <div className="space-y-4">
                                        <textarea 
                                            rows={4}
                                            disabled={submitted && !activeQuestion.allowStudentModify}
                                            placeholder="請在此輸入你的文字作答..."
                                            value={myAnswer}
                                            onChange={(e) => setMyAnswer(e.target.value)}
                                            className="w-full p-4 rounded-2xl bg-slate-900 border border-slate-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white font-medium"
                                        />
                                        <button 
                                            disabled={!myAnswer.trim() || (submitted && !activeQuestion.allowStudentModify)}
                                            onClick={() => handleSubmitAnswer(myAnswer)}
                                            className="w-full py-4 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-black rounded-xl transition shadow-lg"
                                        >
                                            {submitted ? '更新提交答案' : '提交短答答案'}
                                        </button>
                                    </div>
                                )}

                                {/* Requirement 2: Whiteboard Draw Input with Palette & Photo Upload */}
                                {activeQuestion.mode === 'DRAW' && (
                                    <div className="space-y-4">
                                        {/* Drawing Tools Palette */}
                                        <div className="flex flex-wrap items-center justify-between gap-2 bg-slate-900 p-3 rounded-2xl border border-slate-700">
                                            {/* Colors */}
                                            <div className="flex items-center space-x-1.5">
                                                {['#1e293b', '#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'].map(c => (
                                                    <button 
                                                        key={c}
                                                        onClick={() => { setPenColor(c); setIsEraser(false); }}
                                                        className={`w-7 h-7 rounded-full border-2 ${penColor === c && !isEraser ? 'border-white scale-110' : 'border-transparent'}`}
                                                        style={{ backgroundColor: c }}
                                                    />
                                                ))}
                                            </div>

                                            {/* Thickness Slider */}
                                            <div className="flex items-center space-x-2">
                                                <span className="text-xs text-slate-400 font-bold">粗細:</span>
                                                <input 
                                                    type="range" 
                                                    min="2" 
                                                    max="16" 
                                                    value={penWidth} 
                                                    onChange={(e) => setPenWidth(e.target.value)}
                                                    className="w-16 accent-indigo-500"
                                                />
                                            </div>

                                            {/* Eraser & Clear */}
                                            <div className="flex gap-2">
                                                <button 
                                                    onClick={() => setIsEraser(!isEraser)}
                                                    className={`px-3 py-1 rounded-lg text-xs font-bold ${isEraser ? 'bg-amber-500 text-slate-950' : 'bg-slate-700 text-slate-300'}`}
                                                >
                                                    擦膠
                                                </button>
                                                <button 
                                                    onClick={clearCanvas}
                                                    className="px-3 py-1 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-xs font-bold"
                                                >
                                                    清除
                                                </button>
                                            </div>
                                        </div>

                                        {/* Photo Upload Option for Whiteboard (Requirement 2) */}
                                        <div className="flex items-center justify-between text-xs text-slate-400">
                                            <span>可在白板上繪圖或插入圖片作答：</span>
                                            <label className="cursor-pointer bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-200 font-bold flex items-center gap-1">
                                                <Icon name="image" className="w-4 h-4" /> 上載相片
                                                <input type="file" accept="image/*" onChange={handleCanvasPhotoUpload} className="hidden" />
                                            </label>
                                        </div>

                                        {/* Canvas Element */}
                                        <div className="w-full aspect-video bg-white rounded-2xl overflow-hidden border-2 border-slate-700 canvas-container relative">
                                            <canvas 
                                                ref={canvasRef}
                                                width={600}
                                                height={337}
                                                onMouseDown={startDrawing}
                                                onMouseMove={draw}
                                                onMouseUp={stopDrawing}
                                                onMouseLeave={stopDrawing}
                                                onTouchStart={startDrawing}
                                                onTouchMove={draw}
                                                onTouchEnd={stopDrawing}
                                                className="w-full h-full cursor-crosshair touch-none"
                                            />
                                        </div>

                                        <button 
                                            disabled={submitted && !activeQuestion.allowStudentModify}
                                            onClick={() => {
                                                const dataUrl = canvasRef.current?.toDataURL('image/png');
                                                handleSubmitAnswer(dataUrl);
                                            }}
                                            className="w-full py-4 bg-purple-600 hover:bg-purple-500 disabled:opacity-50 text-white font-black rounded-xl transition shadow-lg"
                                        >
                                            {submitted ? '更新白板作品' : '提交白板答案'}
                                        </button>
                                    </div>
                                )}

                                {/* Requirement 9: Buzzer Mode */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div className="text-center py-6 space-y-6">
                                        {buzzerWinner ? (
                                            <div className="p-6 bg-slate-900 rounded-2xl border border-amber-500 space-y-2">
                                                <div className="text-sm font-bold text-amber-400">搶答結果</div>
                                                <div className="text-2xl font-black text-white">{buzzerWinner.name} 搶答成功！</div>
                                                <div className="text-xs text-slate-400 font-mono">反應用時 {buzzerWinner.duration} 秒</div>
                                            </div>
                                        ) : (
                                            <button 
                                                onClick={handlePressBuzzer}
                                                className="w-48 h-48 mx-auto rounded-full bg-gradient-to-tr from-rose-600 to-red-500 text-white font-black text-3xl shadow-2xl hover:scale-105 active:scale-95 transition flex items-center justify-center border-8 border-rose-400 animate-pulse-ring"
                                            >
                                                搶答！
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Requirement 10: Push Link / YouTube Video View */}
                                {activeQuestion.mode === 'LINK' && (
                                    <div className="space-y-4">
                                        {getYouTubeEmbedUrl(activeQuestion.pushUrl) ? (
                                            <div className="w-full aspect-video rounded-2xl overflow-hidden shadow-lg border border-slate-700">
                                                <iframe 
                                                    src={getYouTubeEmbedUrl(activeQuestion.pushUrl)} 
                                                    title="YouTube video player" 
                                                    className="w-full h-full"
                                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                                    allowFullScreen
                                                ></iframe>
                                            </div>
                                        ) : (
                                            <div className="p-6 bg-slate-900 rounded-2xl text-center space-y-4">
                                                <p className="text-sm text-slate-300 font-medium">老師傳送了外部網頁連結：</p>
                                                <a 
                                                    href={activeQuestion.pushUrl} 
                                                    target="_blank" 
                                                    rel="noopener noreferrer"
                                                    className="inline-block px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition shadow"
                                                >
                                                    點擊開啟網頁連結 🔗
                                                </a>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Submission Status Bar (Requirement 4) */}
                                {submitted && (
                                    <div className="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-center text-xs font-bold text-emerald-400 flex items-center justify-center space-x-1.5">
                                        <Icon name="check" className="w-4 h-4" />
                                        <span>
                                            {activeQuestion.allowStudentModify ? '已成功提交 (老師已開放可隨時修改)' : '已成功提交 (答案已鎖定不可修改)'}
                                        </span>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<OMITApp />);
    </script>
</body>
</html>
