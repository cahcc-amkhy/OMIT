                                    </button>
                                    <button 
                                        onClick={() => { setTimerActive(false); setTimerSeconds(0); }}
                                        class="px-5 py-3 bg-slate-200 text-slate-700 font-bold rounded-xl"
                                    >
                                        歸零
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Student Interface Component
        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
            const [myAnswer, setMyAnswer] = useState('');
            const [submitted, setSubmitted] = useState(false);
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(null);
            
            // Audio recording state
            const [isRecording, setIsRecording] = useState(false);
            const [audioBlob, setAudioBlob] = useState(null);
            const [audioUrl, setAudioUrl] = useState(null);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            const startTimeRef = useRef(Date.now());

            const myResponseKey = activeQuestion ? `${activeQuestion.id}_${studentId}` : '';
            const myPrevResponse = responses[myResponseKey];

            // Reset local response state on question change
            useEffect(() => {
                if (activeQuestion) {
                    startTimeRef.current = Date.now();
                    setSubmitted(!!myPrevResponse);
                    if (myPrevResponse) {
                        setMyAnswer(myPrevResponse.answer);
                        if (activeQuestion.mode === 'CHALLENGE') setChallengeAnswers(myPrevResponse.answer || {});
                    } else {
                        setMyAnswer('');
                        setChallengeAnswers({});
                        setAudioBlob(null);
                        setAudioUrl(null);
                    }

                    // Timer setup for Challenge mode
                    if (activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge?.enableTimer && activeQuestion.challenge?.timeLimit) {
                        const elapsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                        const remaining = Math.max(0, activeQuestion.challenge.timeLimit - elapsed);
                        setTimeLeft(remaining);
                    } else {
                        setTimeLeft(null);
                    }
                }
            }, [activeQuestion?.id]);

            // Timer countdown for Challenge mode
            useEffect(() => {
                let timer = null;
                if (timeLeft !== null && timeLeft > 0 && !submitted) {
                    timer = setInterval(() => {
                        setTimeLeft(t => {
                            if (t <= 1) {
                                // Auto submit when time reaches 00:00
                                handleChallengeSubmit(true);
                                return 0;
                            }
                            return t - 1;
                        });
                    }, 1000);
                }
                return () => clearTimeout(timer);
            }, [timeLeft, submitted]);

            // Send answer to Firestore
            const sendAnswerToFirestore = async (ansPayload, extraDetails = null) => {
                const duration = ((Date.now() - startTimeRef.current) / 1000).toFixed(1);
                const appId = "omit-8c173";
                const db = window.fbDb;
                
                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', myResponseKey);
                
                const payload = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: ansPayload,
                    duration: duration,
                    submittedAt: Date.now()
                };

                if (extraDetails) payload.scoreDetails = extraDetails;

                await window.fbUtils.setDoc(resDocRef, payload);
                setSubmitted(true);
            };

            // Audio recorder controls
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        setAudioBlob(blob);
                        setAudioUrl(URL.createObjectURL(blob));
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);

                    // Auto stop after 10 seconds
                    setTimeout(() => {
                        if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
                            stopRecording();
                        }
                    }, 10000);
                } catch (e) {
                    showToast("無法開啟麥克風權限！", "error");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                    mediaRecorderRef.current.stream.getTracks().forEach(track => track.stop());
                }
            };

            const handleConfirmAudioSubmit = () => {
                if (!audioBlob) return;
                const reader = new FileReader();
                reader.onloadend = () => {
                    sendAnswerToFirestore(reader.result);
                };
                reader.readAsDataURL(audioBlob);
            };

            // Challenge submission & auto-grade
            const handleChallengeSubmit = (auto = false) => {
                if (!activeQuestion || !activeQuestion.challenge) return;
                const questions = activeQuestion.challenge.questions;
                let correctCount = 0;

                questions.forEach((q, idx) => {
                    if (challengeAnswers[idx] === q.answer) correctCount++;
                });

                const totalQ = questions.length;
                const scorePerQ = activeQuestion.challenge.totalScore / totalQ;
                const totalScore = Math.round(correctCount * scorePerQ);
                const percentage = Math.round((correctCount / totalQ) * 100);

                const scoreDetails = { correctCount, totalQ, totalScore, percentage };
                sendAnswerToFirestore(challengeAnswers, scoreDetails);

                if (auto) showToast("限時結束，系統已自動收卷提交！", "info");
            };

            // Revision Item 22: Coop Race submission logic for team members
            const handleCoopOptionPick = async (optLetter) => {
                if (!activeQuestion || activeQuestion.mode !== 'COOP' || activeQuestion.coopStage !== 'RACING') return;

                const myTeam = activeQuestion.coopTeams.find(t => t.members.some(m => m.id === studentId));
                if (!myTeam) return;

                const currentQIdx = myTeam.progress;
                const targetQ = activeQuestion.challenge.questions[currentQIdx];

                if (!targetQ) return;

                const isCorrect = (optLetter === targetQ.answer);
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', 'omit-8c173', 'public', 'data', 'rooms', roomCode);

                const updatedTeams = activeQuestion.coopTeams.map(t => {
                    if (t.id === myTeam.id) {
                        return {
                            ...t,
                            progress: isCorrect ? t.progress + 1 : 0 // Advance or Reset to 0
                        };
                    }
                    return t;
                });

                if (isCorrect) {
                    playSound('win');
                    showToast("答對了！全組進度增加！", "success");
                } else {
                    playSound('wrong');
                    showToast("答錯了！全組倒扣歸零重來！", "error");
                }

                await window.fbUtils.setDoc(roomDocRef, { 
                    activeQuestion: {
                        ...activeQuestion,
                        coopTeams: updatedTeams
                    } 
                }, { merge: true });
            };

            // Revision Item 2: Broadcast Screen Display for Peer Review
            if (activeQuestion?.broadcastedSubmission) {
                const b = activeQuestion.broadcastedSubmission;
                return (
                    <div class="min-h-screen bg-slate-900 text-white p-4 flex flex-col items-center justify-center space-y-4">
                        <div class="bg-purple-600 text-white font-black px-4 py-1.5 rounded-full text-sm animate-pulse">
                            📢 全班互評廣播中
                        </div>
                        <h2 class="text-xl font-bold">{b.name} ({b.seatNumber}號) 的白板作品</h2>
                        <div class="w-full max-w-4xl aspect-16-9 bg-white rounded-3xl overflow-hidden border-4 border-purple-400 shadow-2xl flex items-center justify-center">
                            <img src={b.answer} class="max-h-full object-contain" alt="廣播作品" />
                        </div>
                    </div>
                );
            }

            if (!activeQuestion) {
                return (
                    <div class="min-h-screen bg-indigo-900 text-white flex flex-col items-center justify-center p-6 text-center space-y-4">
                        <div class="w-20 h-20 bg-white/10 rounded-3xl flex items-center justify-center text-4xl animate-bounce">
                            ⏳
                        </div>
                        <h2 class="text-2xl font-black">宣道會陳元喜小學 OMIT課堂</h2>
                        <p class="text-indigo-200 text-sm max-w-xs">安靜等候老師發佈題目...</p>
                        <div class="text-xs font-mono bg-white/10 px-3 py-1.5 rounded-xl">
                            學號：{seatNumber} | 姓名：{studentName || '學生'}
                        </div>
                    </div>
                );
            }

            return (
                <div class="min-h-screen bg-slate-100 p-4 md:p-6 pb-20">
                    <header class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex justify-between items-center mb-6">
                        <div>
                            <span class="text-xs font-bold text-indigo-600 uppercase">當前互動題目</span>
                            <h1 class="text-lg font-black text-slate-800">{activeQuestion.text}</h1>
                        </div>
                        <div class="text-right">
                            <span class="text-xs text-slate-400 block font-bold">個人學號</span>
                            <span class="text-base font-black text-slate-800">{seatNumber} 號 {studentName}</span>
                        </div>
                    </header>

                    {/* Revision Item 6: Unified Submission Feedback Banner */}
                    {submitted && activeQuestion.mode !== 'COOP' && (
                        <div class="mb-6 bg-emerald-500 text-white p-5 rounded-3xl shadow-lg text-center space-y-2 animate-fade-in">
                            <div class="text-3xl">🎉</div>
                            <div class="text-xl font-black">已提交答案! 讚賞你的努力!</div>
                            <div class="text-xs opacity-90">安靜等候老師指示...</div>
                        </div>
                    )}

                    {/* CHOICE & TF Mode */}
                    {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                        <div class="space-y-4 max-w-2xl mx-auto">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                {activeQuestion.choiceOptions.map((opt) => (
                                    <button 
                                        key={opt}
                                        disabled={submitted && activeQuestion.lockAfterSubmit}
                                        onClick={() => setMyAnswer(opt)}
                                        class={`p-5 rounded-2xl font-black text-xl border-2 transition text-left flex items-center justify-between ${
                                            myAnswer === opt ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg' : 'bg-white text-slate-800 border-slate-200'
                                        }`}
                                    >
                                        <span>{opt}</span>
                                        {myAnswer === opt && <span>✓</span>}
                                    </button>
                                ))}
                            </div>

                            {/* Revision Item 3: Independent Submit Button */}
                            {(!submitted || !activeQuestion.lockAfterSubmit) && (
                                <button 
                                    onClick={() => sendAnswerToFirestore(myAnswer)}
                                    disabled={!myAnswer}
                                    class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-lg rounded-2xl shadow-lg transition active:scale-98 disabled:opacity-50"
                                >
                                    ✅ 確認提交答案
                                </button>
                            )}
                        </div>
                    )}

                    {/* SHORT Answer Mode */}
                    {activeQuestion.mode === 'SHORT' && (
                        <div class="space-y-4 max-w-2xl mx-auto">
                            <textarea 
                                rows={4}
                                disabled={submitted && activeQuestion.lockAfterSubmit}
                                value={myAnswer}
                                onChange={(e) => setMyAnswer(e.target.value)}
                                placeholder="請輸入文字回答..."
                                class="w-full p-4 rounded-2xl border-2 border-slate-200 focus:outline-none focus:border-indigo-500 font-medium text-lg bg-white"
                            />
                            {/* Revision Item 3: Independent Submit Button */}
                            {(!submitted || !activeQuestion.lockAfterSubmit) && (
                                <button 
                                    onClick={() => sendAnswerToFirestore(myAnswer)}
                                    disabled={!myAnswer.trim()}
                                    class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-lg rounded-2xl shadow-lg transition active:scale-98 disabled:opacity-50"
                                >
                                    ✅ 確認提交答案
                                </button>
                            )}
                        </div>
                    )}

                    {/* WHITEBOARD Mode */}
                    {activeQuestion.mode === 'DRAW' && (
                        <div class="max-w-4xl mx-auto">
                            <WhiteboardCanvas 
                                initialBg={activeQuestion.whiteboardBg}
                                onSave={(dataUrl) => sendAnswerToFirestore(dataUrl)}
                            />
                        </div>
                    )}

                    {/* BUZZER Mode */}
                    {activeQuestion.mode === 'BUZZER' && (
                        <div class="text-center py-12 max-w-md mx-auto space-y-6">
                            <button 
                                disabled={submitted}
                                onClick={() => {
                                    playSound('buzzer');
                                    sendAnswerToFirestore('搶答點擊！');
                                }}
                                class={`w-56 h-56 rounded-full font-black text-3xl shadow-2xl transition active:scale-90 border-8 ${
                                    submitted 
                                    ? 'bg-slate-400 border-slate-300 text-slate-200 cursor-not-allowed' 
                                    : 'bg-rose-600 hover:bg-rose-700 border-rose-300 text-white animate-pulse'
                                }`}
                            >
                                {submitted ? '已搶答！' : '按我搶答！ 🚨'}
                            </button>
                        </div>
                    )}

                    {/* Revision Item 5: AUDIO Mode */}
                    {activeQuestion.mode === 'AUDIO' && (
                        <div class="max-w-md mx-auto space-y-5 bg-white p-6 rounded-3xl border border-slate-200 text-center">
                            <h3 class="font-bold text-slate-800">請錄製語音回答 (最多10秒)：</h3>

                            {!audioUrl ? (
                                <button 
                                    onClick={isRecording ? stopRecording : startRecording}
                                    class={`w-32 h-32 rounded-full font-bold text-lg text-white shadow-lg transition active:scale-95 flex flex-col items-center justify-center mx-auto ${
                                        isRecording ? 'bg-rose-600 animate-ping' : 'bg-cyan-600 hover:bg-cyan-700'
                                    }`}
                                >
                                    <span class="text-3xl">{isRecording ? '⏹️' : '🎙️'}</span>
                                    <span>{isRecording ? '停止錄音' : '開始錄音'}</span>
                                </button>
                            ) : (
                                <div class="space-y-4">
                                    <audio src={audioUrl} controls class="w-full" />
                                    <div class="flex space-x-2">
                                        <button 
                                            onClick={() => { setAudioBlob(null); setAudioUrl(null); }}
                                            class="w-1/2 py-3 bg-red-100 hover:bg-red-200 text-red-700 font-bold rounded-xl text-sm"
                                        >
                                            🗑️ 刪除重錄
                                        </button>
                                        <button 
                                            onClick={handleConfirmAudioSubmit}
                                            class="w-1/2 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow"
                                        >
                                            ✅ 確認提交錄音
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Revision Item 15 & 19: CHALLENGE Mode Student View */}
                    {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                        <div class="max-w-3xl mx-auto space-y-6">
                            {timeLeft !== null && (
                                <div class="bg-amber-500 text-white px-4 py-2 rounded-2xl font-mono font-black text-center text-lg shadow">
                                    ⏱️ 剩餘時間：{Math.floor(timeLeft / 60).toString().padStart(2, '0')}:{(timeLeft % 60).toString().padStart(2, '0')}
                                </div>
                            )}

                            {activeQuestion.challenge.questions.map((q, qIdx) => {
                                const mySelectedOpt = challengeAnswers[qIdx];
                                const isReleased = activeQuestion.challenge.scoresReleased || activeQuestion.challenge.releaseInstant;

                                return (
                                    <div key={qIdx} class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-3">
                                        <div class="font-black text-slate-800 text-base">
                                            {q.num}. {q.text}
                                        </div>

                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                            {q.options.map((opt) => {
                                                const isMyChoice = mySelectedOpt === opt.letter;
                                                const isCorrectOpt = q.answer === opt.letter;

                                                let style = "border-slate-200 bg-slate-50 text-slate-800";
                                                if (submitted && isReleased) {
                                                    // Item 19: Color coding when released
                                                    if (isCorrectOpt) {
                                                        style = "border-emerald-500 bg-emerald-50 text-emerald-900 font-bold ring-2 ring-emerald-300";
                                                    } else if (isMyChoice && !isCorrectOpt) {
                                                        style = "border-rose-500 bg-rose-50 text-rose-900 font-bold ring-2 ring-rose-300";
                                                    }
                                                } else if (isMyChoice) {
                                                    style = "border-amber-500 bg-amber-50 text-amber-900 font-bold";
                                                }

                                                return (
                                                    <button 
                                                        key={opt.letter}
                                                        disabled={submitted}
                                                        onClick={() => setChallengeAnswers({ ...challengeAnswers, [qIdx]: opt.letter })}
                                                        class={`p-3 rounded-2xl border-2 text-left text-sm transition flex items-center justify-between ${style}`}
                                                    >
                                                        <span>{opt.letter}. {opt.text}</span>
                                                        {submitted && isReleased && (
                                                            <span>
                                                                {isCorrectOpt && <span class="text-emerald-600 font-bold"> (正確答案) ✓</span>}
                                                                {isMyChoice && !isCorrectOpt && <span class="text-rose-600 font-bold"> (你的選擇) ✕</span>}
                                                            </span>
                                                        )}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })}

                            {!submitted && (
                                <button 
                                    onClick={() => handleChallengeSubmit(false)}
                                    class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-lg rounded-2xl shadow-lg transition active:scale-98"
                                >
                                    ✅ 確認提交整份挑戰題
                                </button>
                            )}
                        </div>
                    )}

                    {/* Revision Item 22: COOP Mode Student Screen */}
                    {activeQuestion.mode === 'COOP' && (
                        <div class="max-w-2xl mx-auto space-y-6">
                            {activeQuestion.coopStage === 'GROUPING' && (
                                <div class="bg-white rounded-3xl p-8 text-center space-y-4 shadow-lg border-2 border-orange-200">
                                    <div class="text-5xl">🤝</div>
                                    <h2 class="text-2xl font-black text-slate-800">你已被分配至：</h2>
                                    {(() => {
                                        const myTeam = activeQuestion.coopTeams?.find(t => t.members.some(m => m.id === studentId));
                                        if (!myTeam) return <div class="text-slate-400 font-bold">正在分配組別...</div>;
                                        return (
                                            <div class="p-6 rounded-3xl text-white font-black text-3xl shadow-md space-y-2" style={{ backgroundColor: myTeam.color }}>
                                                <div>{myTeam.emoji} {myTeam.name}</div>
                                                <div class="text-sm font-normal opacity-90">組員：{myTeam.members.map(m => m.name).join('、')}</div>
                                            </div>
                                        );
                                    })()}
                                    <p class="text-rose-600 font-black text-lg animate-bounce pt-2">
                                        盡快與你的組員會合!比賽即將開始!
                                    </p>
                                </div>
                            )}

                            {activeQuestion.coopStage === 'RACING' && (
                                <div class="space-y-4">
                                    {(() => {
                                        const myTeam = activeQuestion.coopTeams?.find(t => t.members.some(m => m.id === studentId));
                                        if (!myTeam) return null;

                                        const myTeamMemberIndex = myTeam.members.findIndex(m => m.id === studentId);
                                        const totalMembers = myTeam.members.length || 1;

                                        const currentQIdx = myTeam.progress;
                                        const currentQ = activeQuestion.challenge.questions[currentQIdx];

                                        if (!currentQ) {
                                            return (
                                                <div class="bg-emerald-500 text-white rounded-3xl p-8 text-center space-y-3 shadow-xl">
                                                    <div class="text-6xl">🏆</div>
                                                    <h2 class="text-3xl font-black">恭喜！你們組勝出了比賽！</h2>
                                                </div>
                                            );
                                        }

                                        // Split Question and Options among group members
                                        const showQuestionText = (myTeamMemberIndex % totalMembers === 0);
                                        const showOptionsAB = (myTeamMemberIndex % totalMembers === 1 || totalMembers === 1);
                                        const showOptionsCD = (myTeamMemberIndex % totalMembers === 2 || totalMembers === 1);

                                        return (
                                            <div class="bg-white rounded-3xl p-6 border-2 shadow-lg space-y-4" style={{ borderColor: myTeam.color }}>
                                                <div class="flex justify-between items-center border-b pb-3">
                                                    <span class="font-black text-base" style={{ color: myTeam.color }}>
                                                        {myTeam.emoji} {myTeam.name} - 第 {currentQIdx + 1} 題
                                                    </span>
                                                    <span class="text-xs bg-slate-100 font-bold px-2.5 py-1 rounded-lg">
                                                        組員任務分工中 🤝
                                                    </span>
                                                </div>

                                                {/* Question Text display */}
                                                {showQuestionText ? (
                                                    <div class="bg-amber-50 p-4 rounded-2xl border border-amber-200">
                                                        <span class="text-xs font-bold text-amber-800 block">你負責觀看題目（請大聲讀給組員聽！）：</span>
                                                        <h3 class="text-xl font-black text-slate-800 mt-1">{currentQ.text}</h3>
                                                    </div>
                                                ) : (
                                                    <div class="bg-slate-50 p-4 rounded-2xl border text-center text-slate-500 font-bold text-sm">
                                                        🔒 題目內容顯示於組員螢幕上，請與組員討論！
                                                    </div>
                                                )}

                                                {/* Options display */}
                                                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
                                                    {currentQ.options.map((opt) => {
                                                        const isAB = opt.letter === 'A' || opt.letter === 'B';
                                                        const isCD = opt.letter === 'C' || opt.letter === 'D';

                                                        if ((isAB && !showOptionsAB) || (isCD && !showOptionsCD)) {
                                                            return (
                                                                <div key={opt.letter} class="p-4 bg-slate-100 rounded-2xl text-slate-400 text-center font-bold text-sm border">
                                                                    選項 {opt.letter} 顯示於組員螢幕
                                                                </div>
                                                            );
                                                        }

                                                        return (
                                                            <button 
                                                                key={opt.letter}
                                                                onClick={() => handleCoopOptionPick(opt.letter)}
                                                                class="p-5 rounded-2xl bg-indigo-50 hover:bg-indigo-600 hover:text-white border-2 border-indigo-200 font-black text-lg transition text-left flex items-center justify-between"
                                                            >
                                                                <span>{opt.letter}. {opt.text}</span>
                                                                <span>點擊作答 🚀</span>
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })()}
                                </div>
                            )}
                        </div>
                    )}

                    {/* Revision Item 4: LINK Delivery View */}
                    {activeQuestion.mode === 'LINK' && (
                        <div class="max-w-3xl mx-auto space-y-4">
                            {activeQuestion.youtubeEmbed ? (
                                <div class="aspect-16-9 w-full bg-black rounded-3xl overflow-hidden shadow-xl border-4 border-slate-200">
                                    <iframe 
                                        src={activeQuestion.youtubeEmbed} 
                                        class="w-full h-full"
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                        allowFullScreen
                                    />
                                </div>
                            ) : null}

                            {activeQuestion.pushedUrl && (
                                <a 
                                    href={activeQuestion.pushedUrl} 
                                    target="_blank" 
                                    rel="noreferrer"
                                    class="block w-full text-center py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-lg rounded-2xl shadow-lg transition active:scale-98"
                                >
                                    開啟連結網站 ↗
                                </a>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
