                                <div className="grid grid-cols-3 gap-2">
                                    {[
                                        ['30秒', 30], ['1分鐘', 60], ['2分鐘', 120],
                                        ['3分鐘', 180], ['4分鐘', 240], ['5分鐘', 300]
                                    ].map(([lbl, sec]) => (
                                        <button 
                                            key={lbl} 
                                            onClick={() => { setTimerSeconds(sec); setTimerActive(true); }}
                                            className="py-2.5 rounded-xl bg-slate-100 hover:bg-amber-100 hover:text-amber-900 font-extrabold text-sm text-slate-700 border transition"
                                        >
                                            {lbl}
                                        </button>
                                    ))}
                                </div>

                                <div className="flex items-center space-x-2 pt-1">
                                    <span className="text-xs font-bold text-slate-500">自訂秒數：</span>
                                    <input 
                                        type="number" 
                                        value={customTimerInput}
                                        onChange={(e) => setCustomTimerInput(e.target.value)}
                                        className="flex-1 px-3 py-2 text-center border rounded-xl font-mono font-bold"
                                        placeholder="秒數"
                                    />
                                    <button 
                                        onClick={() => { setTimerSeconds(parseInt(customTimerInput) || 30); setTimerActive(true); }}
                                        className="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold"
                                    >
                                        設定並開始
                                    </button>
                                </div>

                                <div className="flex space-x-2 pt-2">
                                    <button 
                                        onClick={() => setTimerActive(!timerActive)}
                                        className={`flex-1 py-3 rounded-xl font-bold text-sm text-white shadow transition ${timerActive ? 'bg-amber-500 hover:bg-amber-600' : 'bg-emerald-600 hover:bg-emerald-700'}`}
                                    >
                                        {timerActive ? '⏸️ 暫停計時' : '▶️ 開始計時'}
                                    </button>
                                    <button 
                                        onClick={() => { setTimerActive(false); setTimerSeconds(0); }}
                                        className="px-5 py-3 rounded-xl bg-slate-200 text-slate-700 font-bold text-sm hover:bg-slate-300"
                                    >
                                        重置
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
            const [myAnswer, setMyAnswer] = useState('');
            const [submitted, setSubmitted] = useState(false);
            const [isRecording, setIsRecording] = useState(false);
            const [audioBlob, setAudioBlob] = useState(null);
            const [audioUrl, setAudioUrl] = useState(null);
            const [recordingSeconds, setRecordingSeconds] = useState(0);

            // Requirement 2: Challenge student answers state
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [challengeRemainingSeconds, setChallengeRemainingSeconds] = useState(null);

            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);
            const recordingTimerRef = useRef(null);

            const myResponseKey = activeQuestion ? `${activeQuestion.id}_${studentId}` : null;
            const existingRes = myResponseKey ? responses[myResponseKey] : null;

            // Requirement 1: Buzzer Winner Calculation for Student Page
            const buzzerWinner = useMemo(() => {
                if (!activeQuestion || activeQuestion.mode !== 'BUZZER') return null;
                const list = Object.values(responses).filter(r => r.questionId === activeQuestion.id && (r.timestamp || r.duration !== undefined));
                if (list.length === 0) return null;
                list.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                return list[0];
            }, [responses, activeQuestion]);

            // Sync answer state with active question
            useEffect(() => {
                if (existingRes) {
                    setSubmitted(true);
                    if (activeQuestion?.mode === 'CHALLENGE') {
                        setChallengeAnswers(existingRes.answer || {});
                    } else {
                        setMyAnswer(existingRes.answer || '');
                    }
                } else {
                    setSubmitted(false);
                    setMyAnswer('');
                    setAudioBlob(null);
                    setAudioUrl(null);
                    setChallengeAnswers({});
                }
            }, [activeQuestion?.id, existingRes]);

            // Requirement 2: Challenge Timed Auto-Submit Engine
            useEffect(() => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE' || !activeQuestion.challenge?.enableTimer) {
                    setChallengeRemainingSeconds(null);
                    return;
                }

                if (submitted) return; // Stop countdown if already submitted

                const limitSec = activeQuestion.challenge.timeLimit || 120;
                const elapsedSec = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                const remainSec = Math.max(0, limitSec - elapsedSec);

                setChallengeRemainingSeconds(remainSec);

                if (remainSec <= 0) {
                    // Automatically submit when time is up
                    handleChallengeAutoSubmit();
                    return;
                }

                const timer = setInterval(() => {
                    setChallengeRemainingSeconds(prev => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            handleChallengeAutoSubmit();
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);

                return () => clearInterval(timer);
            }, [activeQuestion, submitted]);

            const submitAnswerToFirestore = async (ansValue, scoreObj = null) => {
                if (!activeQuestion) return;
                const appId = "omit-8c173";
                const db = window.fbDb;
                const duration = ((Date.now() - activeQuestion.startTime) / 1000).toFixed(1);

                const resObj = {
                    id: myResponseKey,
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: ansValue,
                    duration: duration,
                    timestamp: Date.now()
                };

                if (scoreObj) {
                    resObj.scoreDetails = scoreObj;
                }

                const resDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', myResponseKey);
                await window.fbUtils.setDoc(resDocRef, resObj);
                setSubmitted(true);
            };

            const handleSubmitChoice = (val) => {
                setMyAnswer(val);
                submitAnswerToFirestore(val);
                showToast(`已提交答案：${val}`, 'success');
            };

            const handleSubmitText = () => {
                if (!myAnswer.trim()) {
                    showToast('請輸入文字回答！', 'error');
                    return;
                }
                submitAnswerToFirestore(myAnswer.trim());
                showToast('已成功提交回答！', 'success');
            };

            const handleSubmitWhiteboard = (dataUrl) => {
                submitAnswerToFirestore(dataUrl);
                showToast('已成功提交白板作品！', 'success');
            };

            const handlePressBuzzer = () => {
                playSound('buzzer');
                submitAnswerToFirestore('搶答成功！');
                showToast('🎉 您已按下搶答按鈕！', 'success');
            };

            // Requirement 2: Calculate Challenge Score & System Auto-Grading
            const calculateChallengeScore = (answersObj) => {
                if (!activeQuestion?.challenge) return { totalScore: 0, percentage: 0 };
                const cData = activeQuestion.challenge;
                const questions = cData.questions || [];
                let correctCount = 0;

                questions.forEach((q) => {
                    if (answersObj[q.num] === q.answer) {
                        correctCount++;
                    }
                });

                const perQScore = cData.totalScore / (questions.length || 1);
                const finalScore = Math.round(correctCount * perQScore);
                const pct = Math.round((correctCount / (questions.length || 1)) * 100);

                return {
                    totalScore: finalScore,
                    percentage: pct,
                    correctCount: correctCount,
                    totalQuestions: questions.length
                };
            };

            // Requirement 2: Manual Submit Challenge Answers
            const handleSubmitChallenge = () => {
                if (!activeQuestion?.challenge) return;
                const questions = activeQuestion.challenge.questions || [];
                const answeredCount = Object.keys(challengeAnswers).length;

                if (answeredCount < questions.length) {
                    if (!window.confirm(`您還有 ${questions.length - answeredCount} 條題目未作答，確定要現在提交嗎？`)) {
                        return;
                    }
                }

                const scoreObj = calculateChallengeScore(challengeAnswers);
                submitAnswerToFirestore(challengeAnswers, scoreObj);
                showToast(`挑戰題評估已成功提交！`, 'success');
            };

            // Requirement 2: Auto Submit Challenge Answers when time expires
            const handleChallengeAutoSubmit = () => {
                if (submitted) return;
                const scoreObj = calculateChallengeScore(challengeAnswers);
                submitAnswerToFirestore(challengeAnswers, scoreObj);
                showToast(`⏰ 限時結束！挑戰題已被系統自動提交。`, 'error');
            };

            // Recording Engine
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        setAudioBlob(blob);
                        setAudioUrl(URL.createObjectURL(blob));
                        stream.getTracks().forEach(t => t.stop());
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                    setRecordingSeconds(0);

                    recordingTimerRef.current = setInterval(() => {
                        setRecordingSeconds(s => {
                            if (s >= 9) { // Max 10s auto stop
                                stopRecording();
                                return 10;
                            }
                            return s + 1;
                        });
                    }, 1000);
                } catch (err) {
                    console.error("Audio record error:", err);
                    showToast('無法存取麥克風設備！', 'error');
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                    clearInterval(recordingTimerRef.current);
                }
            };

            const handleSubmitAudio = () => {
                if (!audioBlob) {
                    showToast('請先進行錄音！', 'error');
                    return;
                }
                const reader = new FileReader();
                reader.onloadend = () => {
                    submitAnswerToFirestore(reader.result);
                    showToast('已成功提交語音回答！', 'success');
                };
                reader.readAsDataURL(audioBlob);
            };

            const scoresAreReleased = useMemo(() => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return false;
                return !!(activeQuestion.challenge?.releaseInstant || activeQuestion.challenge?.scoresReleased);
            }, [activeQuestion]);

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col">
                    <header className="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-30">
                        <div className="max-w-md mx-auto flex items-center justify-between">
                            <div className="flex items-center space-x-2">
                                <span className="font-black text-lg">OMIT</span>
                                <span className="bg-indigo-500 text-xs px-2 py-0.5 rounded-full font-mono font-bold">
                                    房號：{roomCode}
                                </span>
                            </div>
                            <div className="flex items-center space-x-3">
                                <span className="text-sm font-bold bg-white/20 px-3 py-1 rounded-xl">
                                    {seatNumber}號 {studentName}
                                </span>
                                <button onClick={onExit} className="text-xs bg-indigo-700 hover:bg-indigo-800 px-2.5 py-1 rounded-lg">
                                    退出
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-md w-full mx-auto p-4 space-y-4">
                        {activeQuestion?.broadcastedSubmission && (
                            <div className="bg-purple-900 text-white rounded-3xl p-5 shadow-xl space-y-3 animate-pulse border-2 border-purple-400">
                                <div className="flex justify-between items-center text-xs font-bold text-purple-200">
                                    <span>📢 教師正在全班廣播互評作品</span>
                                    <span>{activeQuestion.broadcastedSubmission.seatNumber}號 {activeQuestion.broadcastedSubmission.name}</span>
                                </div>
                                <div className="aspect-16-9 bg-white rounded-2xl overflow-hidden">
                                    <img src={activeQuestion.broadcastedSubmission.answer} className="w-full h-full object-contain" alt="廣播作品" />
                                </div>
                            </div>
                        )}

                        {!activeQuestion ? (
                            <div className="bg-white rounded-3xl p-8 text-center space-y-4 shadow-sm border mt-8">
                                <div className="text-5xl animate-bounce">⏳</div>
                                <h2 className="text-xl font-black text-slate-800">等待老師發佈題目...</h2>
                                <p className="text-xs text-slate-400">請保持螢幕開啟，題目發佈後將即時顯示。</p>
                            </div>
                        ) : (
                            <div className="bg-white rounded-3xl p-6 shadow-md border space-y-5 relative">
                                <div className="flex items-center justify-between border-b pb-3">
                                    <span className="text-xs font-black bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-lg">
                                        {getModeLabel(activeQuestion.mode)}
                                    </span>
                                    {submitted && (
                                        <span className="text-xs font-black bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-lg flex items-center gap-1">
                                            <span>✅ 已提交</span>
                                        </span>
                                    )}
                                </div>

                                <h2 className="text-lg font-black text-slate-800 leading-snug">
                                    {activeQuestion.text}
                                </h2>

                                {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                    <div className="space-y-3 pt-2">
                                        {activeQuestion.choiceOptions.map((opt) => (
                                            <button
                                                key={opt}
                                                disabled={submitted && activeQuestion.lockAfterSubmit}
                                                onClick={() => handleSubmitChoice(opt)}
                                                className={`w-full py-4 rounded-2xl font-black text-lg border-2 transition active:scale-98 text-left px-5 flex justify-between items-center ${
                                                    myAnswer === opt 
                                                    ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' 
                                                    : 'bg-slate-50 hover:bg-slate-100 text-slate-800 border-slate-200'
                                                }`}
                                            >
                                                <span>{opt}</span>
                                                {myAnswer === opt && <span>✓</span>}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {activeQuestion.mode === 'SHORT' && (
                                    <div className="space-y-3 pt-2">
                                        <textarea
                                            disabled={submitted && activeQuestion.lockAfterSubmit}
                                            rows={4}
                                            placeholder="請輸入您的回答..."
                                            value={myAnswer}
                                            onChange={(e) => setMyAnswer(e.target.value)}
                                            className="w-full p-4 border-2 border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:outline-none font-medium"
                                        />
                                        <button
                                            disabled={submitted && activeQuestion.lockAfterSubmit}
                                            onClick={handleSubmitText}
                                            className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3.5 rounded-xl shadow-md transition active:scale-98"
                                        >
                                            {submitted ? '更新回答' : '確認提交'}
                                        </button>
                                    </div>
                                )}

                                {activeQuestion.mode === 'DRAW' && (
                                    <div className="pt-1">
                                        <WhiteboardCanvas 
                                            bgImage={activeQuestion.whiteboardBg}
                                            disabled={submitted && activeQuestion.lockAfterSubmit}
                                            onSave={(dataUrl) => handleSubmitWhiteboard(dataUrl)}
                                        />
                                    </div>
                                )}

                                {/* Requirement 1: Buzzer Mode Student View (Display strictly the fastest winner) */}
                                {activeQuestion.mode === 'BUZZER' && (
                                    <div className="text-center py-6 space-y-5">
                                        {!submitted ? (
                                            <button
                                                onClick={handlePressBuzzer}
                                                className="w-48 h-48 bg-rose-600 hover:bg-rose-700 text-white rounded-full font-black text-3xl shadow-2xl border-8 border-rose-300 active:scale-90 transition transform"
                                            >
                                                搶答！
                                            </button>
                                        ) : (
                                            <div className="space-y-4">
                                                <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl text-emerald-900 font-bold">
                                                    🎉 您已成功點擊搶答！
                                                </div>

                                                {buzzerWinner && (
                                                    <div className="bg-rose-50 border-2 border-rose-300 p-4 rounded-2xl space-y-2">
                                                        <div className="text-xs font-bold text-rose-500 uppercase tracking-widest">全班最快搶答者</div>
                                                        <div className="text-2xl font-black text-rose-700">
                                                            {buzzerWinner.name} ({buzzerWinner.seatNumber}號)
                                                        </div>
                                                        <div className="text-xs font-mono font-bold text-slate-500 bg-white py-1 px-3 rounded-lg inline-block border">
                                                            ⏱️ 搶答時間：{buzzerWinner.duration} 秒
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {activeQuestion.mode === 'AUDIO' && (
                                    <div className="text-center py-4 space-y-4">
                                        <div className="bg-cyan-50 p-4 rounded-2xl border border-cyan-200 space-y-3">
                                            <div className="text-sm font-bold text-cyan-900">
                                                語音錄製 (上限 10 秒)
                                            </div>
                                            <div className="font-mono text-3xl font-black text-cyan-700">
                                                00:0{10 - recordingSeconds}
                                            </div>

                                            {!isRecording ? (
                                                <button
                                                    onClick={startRecording}
                                                    className="px-6 py-3 bg-cyan-600 hover:bg-cyan-700 text-white font-black rounded-xl shadow-md transition"
                                                >
                                                    🎙️ 開始錄音
                                                </button>
                                            ) : (
                                                <button
                                                    onClick={stopRecording}
                                                    className="px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-black rounded-xl shadow-md animate-pulse"
                                                >
                                                    ⏹️ 停止錄音
                                                </button>
                                            )}
                                        </div>

                                        {audioUrl && (
                                            <div className="space-y-3 pt-2">
                                                <audio src={audioUrl} controls className="w-full" />
                                                <button
                                                    onClick={handleSubmitAudio}
                                                    className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl shadow-md transition"
                                                >
                                                    ✅ 確認提交錄音
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Requirement 2: Challenge Mode Student Interface with System Auto-Grading & Score Breakdown */}
                                {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                    <div className="space-y-5 pt-1">
                                        {/* Timer / Status Banner */}
                                        <div className="flex justify-between items-center bg-amber-50 border border-amber-200 p-3 rounded-2xl">
                                            <div className="text-xs font-black text-amber-900">
                                                評估標題：{activeQuestion.challenge.title}
                                            </div>
                                            {challengeRemainingSeconds !== null && !submitted && (
                                                <div className={`font-mono font-black text-sm px-3 py-1 rounded-lg ${
                                                    challengeRemainingSeconds <= 10 ? 'bg-red-600 text-white animate-pulse' : 'bg-amber-200 text-amber-900'
                                                }`}>
                                                    ⏱️ 倒數 {Math.floor(challengeRemainingSeconds / 60)}:{(challengeRemainingSeconds % 60).toString().padStart(2, '0')}
                                                </div>
                                            )}
                                        </div>

                                        {/* Requirement 2: Final Score & Breakdown Banner after Teacher Releases Scores */}
                                        {submitted && scoresAreReleased && existingRes?.scoreDetails && (
                                            <div className="bg-gradient-to-br from-emerald-500 to-teal-700 text-white p-5 rounded-2xl shadow-lg space-y-2 text-center animate-fade-in">
                                                <div className="text-xs uppercase tracking-widest text-emerald-100 font-bold">您的最終測試成績</div>
                                                <div className="text-4xl font-black font-mono">
                                                    {existingRes.scoreDetails.totalScore} / {activeQuestion.challenge.totalScore} 分
                                                </div>
                                                <div className="text-xs font-bold bg-white/20 inline-block px-3 py-1 rounded-full">
                                                    正確率：{existingRes.scoreDetails.percentage}% ({existingRes.scoreDetails.correctCount} / {existingRes.scoreDetails.totalQuestions} 題答對)
                                                </div>
                                            </div>
                                        )}

                                        {submitted && !scoresAreReleased && (
                                            <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl text-center space-y-1">
                                                <div className="font-black text-emerald-800 text-sm">✅ 挑戰題評估已成功提交！</div>
                                                <div className="text-xs text-emerald-600 font-bold">已鎖定答題內容，請等待老師統一發佈成績與正確解析。</div>
                                            </div>
                                        )}

                                        {/* Question List */}
                                        <div className="space-y-4">
                                            {activeQuestion.challenge.questions.map((q, qIdx) => {
                                                const mySelectedOpt = challengeAnswers[q.num];
                                                const isCorrectAns = q.answer;

                                                return (
                                                    <div key={qIdx} className="bg-slate-50 p-4 rounded-2xl border space-y-3">
                                                        <div className="font-bold text-slate-800 text-sm flex items-start gap-1.5">
                                                            <span className="font-black text-indigo-600">{q.num}.</span>
                                                            <span>{q.text}</span>
                                                        </div>

                                                        <div className="space-y-2 pl-2">
                                                            {q.options.map((opt) => {
                                                                const isChosen = mySelectedOpt === opt.letter;
                                                                const isTargetAns = opt.letter === isCorrectAns;

                                                                // Requirement 2: Visual Highlighting Rules after Score Release
                                                                let optBgClass = "bg-white text-slate-700 border-slate-200";

                                                                if (submitted && scoresAreReleased) {
                                                                    if (isTargetAns) {
                                                                        // Requirement 2: Correct option always GREEN
                                                                        optBgClass = "bg-emerald-100 text-emerald-900 border-emerald-500 font-black ring-2 ring-emerald-300";
                                                                    } else if (isChosen && !isTargetAns) {
                                                                        // Requirement 2: Wrong chosen option RED
                                                                        optBgClass = "bg-rose-100 text-rose-900 border-rose-500 font-black ring-2 ring-rose-300";
                                                                    }
                                                                } else if (isChosen) {
                                                                    optBgClass = "bg-amber-500 text-white border-amber-600 font-bold shadow-sm";
                                                                }

                                                                return (
                                                                    <button
                                                                        key={opt.letter}
                                                                        disabled={submitted} // Requirement 2: Locked after submit
                                                                        onClick={() => {
                                                                            setChallengeAnswers(prev => ({
                                                                                ...prev,
                                                                                [q.num]: opt.letter
                                                                            }));
                                                                        }}
                                                                        className={`w-full py-2.5 px-3.5 rounded-xl text-xs font-medium border text-left transition flex items-center justify-between ${optBgClass}`}
                                                                    >
                                                                        <span>{opt.letter}. {opt.text}</span>
                                                                        {submitted && scoresAreReleased && (
                                                                            <span>
                                                                                {isTargetAns && "✅ 正確答案"}
                                                                                {isChosen && !isTargetAns && "❌ 您的選擇"}
                                                                            </span>
                                                                        )}
                                                                    </button>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        {/* Requirement 2: Submit Button */}
                                        {!submitted && (
                                            <button
                                                onClick={handleSubmitChallenge}
                                                className="w-full py-4 bg-amber-500 hover:bg-amber-600 text-white font-black text-base rounded-2xl shadow-lg transition active:scale-98"
                                            >
                                                確認提交整份挑戰題試卷 🚀
                                            </button>
                                        )}
                                    </div>
                                )}

                                {activeQuestion.mode === 'LINK' && (
                                    <div className="space-y-4 pt-2">
                                        {activeQuestion.youtubeEmbed ? (
                                            <div className="aspect-16-9 w-full rounded-2xl overflow-hidden shadow-lg border">
                                                <iframe 
                                                    src={activeQuestion.youtubeEmbed}
                                                    className="w-full h-full"
                                                    allow="autoplay; encrypted-media"
                                                    allowFullScreen
                                                    title="YouTube"
                                                ></iframe>
                                            </div>
                                        ) : activeQuestion.pushedUrl ? (
                                            <div className="text-center p-6 bg-amber-50 rounded-2xl border border-amber-200 space-y-3">
                                                <p className="text-sm font-bold text-amber-900">老師向您派送了以下外部連結：</p>
                                                <a 
                                                    href={activeQuestion.pushedUrl} 
                                                    target="_blank" 
                                                    rel="noopener noreferrer"
                                                    className="inline-block bg-amber-600 text-white font-bold px-6 py-3 rounded-xl shadow hover:bg-amber-700 transition text-sm"
                                                >
                                                    🔗 點擊開啟派送連結
                                                </a>
                                            </div>
                                        ) : null}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
